# Example configuration file for go-content-pipeline
# Copy this to config.yaml and customize for your environment

llama_server:
  # Base URL for llama.cpp server (can override with LLAMA_SERVER_URL env var)
  base_url: "http://localhost:8080"
  
  # Embedding model name (can override with EMBEDDING_MODEL env var)
  embedding_model: "nomic-embed-text-v1.5"
  
  # LLM model name for scoring and hook generation (can override with LLM_MODEL env var)
  llm_model: "qwen3-14b"
  
  # Request timeout (use Go duration format: 120s, 2m, etc.)
  timeout: 120s
  
  # Minimum delay between API requests (rate limiting)
  min_request_delay: 100ms
  
  # Maximum number of retry attempts for failed requests
  max_retries: 3

processing:
  # Path to Hugo posts directory (can override with POSTS_DIRECTORY env var)
  posts_directory: "content/p"
  
  # Number of top candidates to consider for ranking
  top_candidates: 20
  
  # Batch size for batch scoring/hook generation
  batch_size: 5
  
  # Maximum content length to process (truncate if longer)
  max_content_length: 100000

storage:
  # Directory for backup files
  backup_directory: "backups"
  
  # Path to embedding cache file
  cache_file: ".embedding_cache.json"
  
  # Path to progress tracking file
  progress_file: ".progress.json"
  
  # Path to compression cache file
  compression_cache: ".compression_cache.json"

scoring:
  # Weights for composite scoring (will be normalized to sum to 1.0)
  weights:
    relevance: 0.7   # Weight for LLM relevance score
    recency: 0.15    # Weight for post recency
    length: 0.1      # Weight for content length
    category: 0.05   # Weight for category boost
  
  # Category boost multipliers (applied when categories match)
  category_boost:
    investigation: 1.2
    analysis: 1.1
    corruption: 1.15

filtering:
  # Categories to exclude from processing
  exclude_categories:
    - holiday
    - announcement
  
  # Title substrings to exclude (case-insensitive)
  exclude_titles:
    - "backstory podcast"
    - "wonderful wednesday"
    - "freaky friday"
  
  # Days after which election posts are excluded
  election_cutoff_days: 365

logging:
  # Log level: DEBUG, INFO, WARN, ERROR
  level: "INFO"
  
  # Path to log file (can override with LOG_FILE env var)
  file: "pipeline.log"
  
  # Whether to also output to console
  console: true

concurrency:
  # Maximum number of worker goroutines
  max_workers: 4
  
  # Maximum concurrent API requests
  max_api_requests: 2
  
  # Trigger garbage collection every N posts
  gc_interval_posts: 10
