      *   The current administration did not "bulldoze" the historic park but instead "gutted" the plan, reducing the $6.2 million project to a "Redneck Renovation" (short-sighted maintenance).
      *   Changes include removing viewing areas, eliminating amphitheaters, replacing switchback ADA access with a less-friendly ADA ramp, and removing the jetty.
      *   The political distortion was amplified by Howlimg Raines, a part-time resident recruited to spread false claims about the park.

      THE PIVOT:
