  trolls-for-tolls:
    brief: |-
      THE CONFLICT:
      - Fairhope lost a two-decade lawsuit regarding the triangle property
      - City paid $8.25 million settlement plus $3 million in legal fees for the triangle property
      - Fairhope spent $2.65 million on recreation land near the Airport and now leases it for $9,000 per year
      - K-1 building purchased for $4 million without a plan; approximately $100,000 spent on temporary roof repairs
      - City considering buying 2.6 million worth of property on Hwy. 13 while offering to give away 102-acre triangle property worth $20 million via conservation easement
      - Jack Burrell supported the triangle lawsuit that the city lost

      THE DISCOVERY:
      - Jack Burrell serves as spokesman for the I-10 Bayway Bridge toll project
      - Burrell stated: "We don't see money coming from the federal infrastructure bill to pay for the bridge. We don't see (additional) state money coming."
      - Bayway Bridge price tag is $2.2 billion with only about $500 million available ($250 million state + $125 million federal)
      - Burrell is involved in controversy at the Fairhope Airport Authority
      - David Peterson / Baldwin County Citizens for Government Accountability (CGA) questioning whether Alabama has federal authorization to add tolls to interstate
      - Pennsylvania's Act 44 (2007) to toll I-80 was rejected by U.S. Department of Transportation, leaving $472 million budget hole

      THE PIVOT:
      - Article 2 establishes Jack Burrell's track record of poor financial decision-making and failed projects (lost triangle lawsuit, Airport Authority controversy)
      - Article 1 warns "Jack has plans for the Airport" while Article 2 documents Burrell's current role as toll bridge spokesman pushing a $2.2 billion project with insufficient funding
      - Both articles connect Burrell to Fairhope infrastructure/airport projects where citizens are excluded from planning
      - Burrell's pattern of supporting losing legal battles and costly projects without viable financing makes him the common thread linking Fairhope's municipal failures to the regional toll bridge push

