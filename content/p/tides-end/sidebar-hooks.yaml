  alabama-ag:
    brief: 'THE CONFLICT:

      - Murray Lawrence Jr. ("Bubba") was convicted in Baldwin County, Alabama, circa
      2003 for the murder of Brandon Hastings (though the Ripp Report references it
      as 2005; transcript suggests the case predates his current incarceration by
      over 18 years).

      - The state''s prosecution relied on a "claimed" 2:30 AM shooting with no witnesses,
      no autopsy initially presented to defense, no gun, no DNA, no crime scene, and
      no physical proof.

      - Sheriff Hoss Mac (also referred to as Hoss Mack) was the lead investigator
      and senior coroner at the same time; his office investigated itself.

      - District Attorney David Whetstone (retired) prosecuted the case.

      - Judge Robert Wilters presided over the trial; he is currently (per widget
      context timeline) the Baldwin County District Attorney.

      - The only witness placing Lawrence alive was Deborah Fudge, who saw him and
      Jerry McNeil at 1:30 AM at Bebo''s Car Wash—hours before the claimed shooting
      time of 2:30 AM.

      - Prosecution falsely claimed Lawrence retrieved a gun at 8 PM and met Jerry
      McNeil, contradicting Fudge''s testimony.

      - No autopsy results showing a gunshot wound were initially disclosed to the
      defense; only a second autopsy (revealed later) showed strangulation, not blunt
      force trauma or gunshot injuries.

      - Hoss Mac Funeral Home handled the body four to five days after disappearance,
      creating conflict of interest since Senior was coroner and Junior the lead investigator.

      - The trial transcript totals 2,200 pages; prosecution failed to establish a
      credible timeline or alibi.


      THE DISCOVERY:

      - Francis Paul Ripp (The Ripp Report) filed a complaint to the Alabama Attorney
      General alleging that the Sheriff (Hoss Mac), Prosecutor (David Whetstone),
      and Judge (Robert Wilters) colluded to withhold "vital information"—specifically,
      the coroner''s report—from Lawrence''s defense.

      - Defense attorney Willy Huntley signed an affidavit dated September 18, 2023,
      confirming he never received the exculpatory coroner''s report; if he had, his
      line of questioning would have been different.

      - The withheld coroner''s report confirms that Brandon Hastings was not killed
      by a gunshot wound—consistent with the second autopsy finding strangulation,
      which contradicts all prosecution theories requiring visible bleeding and tissue
      damage from a gun wound.

      - On page 1747 of the transcript (and synopsis page 47, item 187), Sheriff Mack
      admitted under questioning that Jarius Ireland had already told him Lawrence
      "had shot this young man" before Mack even mentioned the gun—a statement inconsistent
      with any credible timeline or physical evidence.

      - The motion to disinterment remains was filed by the prosecution as a pretext
      for obtaining DNA, despite no evidence supporting the gunshot death; neither
      the judge, prosecution, nor sheriff acknowledged the disinterment during the
      two-week trial.

      - Lawrence has been innocently incarcerated for over 18 years (6,570 days) as
      of the Ripp Report''s complaint letter.


      THE PIVOT:

      - The Ripp Report’s complaint proves that the very evidence needed to exonerate
      Lawrence—the coroner''s report showing no gunshot wound—was deliberately withheld
      from his defense by the same parties (Sheriff Mac, Whetstone, Wilters) who built
      and maintained the false guilty narrative.

      - This withholding is a direct violation of discovery rules and due process,
      undermining the entire jurisdictional foundation of the murder conviction.

      - The "smoking gun" is that the prosecution’s core weapon—a gunshot wound—was
      never established by physical evidence; the coroner''s report confirms its absence,
      yet was concealed until after trial.

      - The same three officials (Sheriff, Prosecutor, Judge) have been "joined at
      the hip for over 30 years," forming a political-police-judicial triad that has
      enabled this and other wrongful convictions in Baldwin County.

      - The Ripp Report’s allegation that these three colluded to suppress evidence
      transforms a murky, poorly documented murder case into one where the state actively
      conspired to imprison an innocent man by hiding proof of innocence.


      KEY ENTITIES:

      - Murray Lawrence Jr. ("Bubba") – falsely convicted defendant

      - Brandon Hastings – victim; deceased person whose cause of death remains contested

      - Hoss Mac / Hoss Mack – Baldwin County Sheriff, lead investigator, former coroner

      - David Whetstone – former District Attorney (prosecutor in case)

      - Robert Wilters – judge in Lawrence’s trial; currently Baldwin County DA

      - Deborah Fudge – key witness for defense (saw Lawrence alive at 1:30 AM)

      - Jerry McNeil – alleged co-conspirator/witness referenced by state

      - Jarius Ireland – witness referenced in transcript page 1747

      - Willy Huntley – defense attorney; signed affidavit on Sept. 18, 2023

      - Maxwell & Tillman – Birmingham attorneys currently representing Lawrence

      - Francis Paul Ripp – The Ripp Report, author of complaint letter

      - Tom Albritton – Ethics Commission Executive Director (skimm $120,000 from
      Mabel Amos Trust)

      - Clark Morris – AG office contact person for complaints

      - Steve Marshall – citizen who filed the complaint

      - Mobile FBI – local federal authority contacted by Ripp Report'
