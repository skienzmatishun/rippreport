  the-murray-lawrence-jr-project:
    brief: 'THE CONFLICT:

      * **Murray Bubba Lawrence Jr.** disappeared in Baldwin County, Alabama, on April
      5, 2003 (discovered missing April 6, 2003).

      * The state prosecution of DA John David Whetstone claimed Lawrence was shot
      at 2:30 a.m. by **Jerryus McNeil**, who supposedly retrieved a gun and met him
      with another individual named Jerry McNeil (confusing the defendant’s first
      name with a third-party witness or co-conspirator).

      * The state asserted there were no witnesses or physical proof of a shooting,
      yet claimed a “magic bullet” theory despite providing no shell casings, fragments,
      or blood evidence.

      * Hoss Mac Funeral Home handled the body four to five days after disappearance;
      senior and junior Macs had overlapping roles (coroner/investigator), creating
      conflicts of interest.

      * The original trial was pre-determined by Judge Robert Wilters with only four
      guilty votes required out of twelve, including the dismissal of the sole African
      American juror on a technicality.

      * Whetstone promoted a fabricated “stranded motorist” story to place Lawrence
      alive at 1:30 a.m., directly contradicting witness **Deborah Fudge**, who saw
      McNeil in the front passenger seat of an Acura with only one other person present
      (no third party named Jerry).


      THE DISCOVERY:

      * The April 6, 2003 autopsy by Dr. Paul McGarry confirmed cause of death as
      **asphyxia/strangulation** from fractured hyoid bones, hemorrhages, and collapsed
      lungs—no gunshot wounds or bullet evidence.

      * No blood was found on the Acura’s trunk liner despite the body being placed
      face-down in the vehicle; no fingerprints, DNA, or ballistics linked McNeil
      to any murder scene other than a wooded area on County Road 49.

      * McNeil claimed to have disposed of the body in Mississippi and removed the
      car’s speakers, which were placed at the homes of Tanya Mixon and Stacey Giambrone
      but never recovered or admitted as evidence.

      **M'
