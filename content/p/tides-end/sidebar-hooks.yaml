  bcso-how-to-become-sheriff:
    brief: 'THE CONFLICT: In 2003/2004, Murray "Bubba" Lawrence Jr. disappeared in
      Baldwin County, Alabama. Sheriff Hoss Mack (then Captain) promoted from police
      chief to sheriff after assisting in his wrongful conviction. Prosecutors claimed
      Lawrence retrieved a gun at 8 p.m. and met Jerry McNeil, contradicting witness
      Deborah Fudge who saw both at 1:30 a.m. at Bebo''s Car Wash. The state produced
      no autopsy, gun, DNA, or crime scene, relying primarily on Jarius McNeal, who
      was pressured by Mack to name Lawrence as an accomplice to avoid the death penalty
      for his own murder of Brandon Hastings.


      THE DISCOVERY: Article 2 reveals a second autopsy (conducted in Mississippi)
      showing cause of death was "asphyxiation by strangulation," witnessed by Dean
      McGowan, John Stewart, and Tony Fuqua. This finding was never disclosed to the
      defense; it was found in 2023 and acknowledged by Sheriff Mack, District Attorney
      David Whetstone, and Judge Robert Wilters in a Lagniappe story titled "Digging
      Deep." The exhumation and second autopsy were ordered by those three to conceal
      this exculpatory evidence. The only credible witness who placed Lawrence alive
      is Brandon Hastings, whose disappearance the investigation failed to investigate
      (no fingerprints, stolen property, or phone records).


      THE PIVOT: Article 2 is the "smoking gun" because it provides the physical autopsy
      confirmation that the prosecution''s entire murder narrative was false and withheld
      from defense. The state built a 20-year incarceration case on a claimed gunshot
      death when forensic evidence showed strangulation; those who ordered the secret
      exhumation (Mack, Whetstone, Wilters) admitted in public media that they never
      disclosed this to the defense, constituting direct violation of discovery law
      and proof of deliberate fabrication.


      KEY ENTITIES:

      - Murray "Bubba" Lawrence Jr. (victim/convicted defendant, incarcerated at Holman
      Prison)

      - Brandon Hastings (murdered victim, last person to see Lawrence alive, never
      testified)

      - Sheriff Hoss Mack (promoted for wrongful conviction, ordered secret exhumation)

      - Anthony Lowery (hired by Mack, no field experience, involved in trial)

      - Dean McGowan (co-witness at autopsy, investigator in case)

      - David Whetstone (prosecutor, discredited defense witnesses as "drug users,"
      ordered exhumation)

      - Judge Robert Wilters (ordered exhumation, presided over trial)

      - Jerry McNeil (alleged last contact per prosecution)

      - Jarius McNeal (actual killer of Hastings, forced to incriminate Lawrence)

      - Tony Fuqua (deputy, only officer who refused to follow Mack''s "rabbit hole,"
      testified at page 1591 with no evidence of fingerprints/property/phone records
      connecting Lawrence)

      - John Stewart (co-witness at autopsy)

      - Dr. Paul McGarry (forensic pathologist, performed 12,000 autopsies, concluded
      strangulation)

      - Willy Huntley (defense attorney who conducted page 1591 questioning, previously
      testified against Sessions)

      - Hoss Mac Funeral Home (conflict of interest: Senior as coroner, Junior as
      lead investigator)'
