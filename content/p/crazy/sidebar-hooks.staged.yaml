  law-and-disorder-part-2:
    brief: |-
      THE CONFLICT: On Saturday, August 25, at 9:45 p.m., a party involving an estimated 100 juveniles was busted at a residence in the 16000 Block of County Road 13, Fairhope. Council President Jack Burrell never disclosed any arrest or police records prior to running for elected office.
      THE DISCOVERY: Fairhope Police detained 40 to 50 juveniles for alcohol consumption; the police report documents this but withholds the property owner's name due to policy preventing identification of juveniles.
      THE PIVOT: Article 2 provides a concrete, dated example of municipal government (Fairhope/Baldwin County) protecting reputations and withholding facts (property owner name/Burrell's records), mirroring Article 1's claim that corruption flourishes and officials prioritize social/political standing over truth.
