  down-home-fairhope-jester:
    brief: |-
      THE CONFLICT:
      - Article 2 is older than Article 1; frame Article 2 as background/historical context.
      - Baldwin County Family Court in Baldwin County, Alabama: author interviewed over three dozen women/men entangled in corrupt/inadequate system; attorneys defending clients would sooner or later say spouse was “CRAZY”; that was ultimately the main argument.
      - Alleged suicide of a 19-year-old by hanging himself with a seat belt inside a moving car; years later, evidence withheld, confirms young man was a confidential informant.
      - Baldwin County described as home of confidential agreements where crimes are buried in file folders; people held hostage by agreements hiding truth; corruption flourishes in judicial system and municipal governments.
      - Officials/attorney: sheriff should immediately open investigation, make statement, or explain allegations of suicide; instead whistle blower, an attorney, is called “CRAZY”; why would Sheriff retaliate against attorney instead of conducting investigation/answering allegations publicly.
      - “CRAZY” used as excuse to describe people disagreement, protest, or political disagreement; no substance, no evidence, no concrete argument, just must be “CRAZY.”
      - Fairhope City Council context from Article 2: last Fairhope City Council meeting; “Catalyst” Council not going to listen to constituents; benefiting with insurance package from part-time job other part-time employees exempt from.
      - Fairhope recreation: last recreation piece of property Burrell and Council had authority over was soccer fields; millions spent on soccer field complex that had no plan, did not meet specifications, and was across from gun range; Council wished to locate another recreation property in aircraft flight pattern; deal stinks; Councilman Conyers and Robinson jumped ship, first time; Burrell, Boone and Brown all in to purchase 2.6 million in property without public hearing; FOLLOW THE MONEY.
      - Fairhope budget: deal not in budget; had to cut other services/departments/rearrange whole budget; fourth year Council will not approve City Budget on time; Council held up infrastructure projects since elected.
      - Fairhope property selection: Council rejected land that had most public support, for piece Burrell Boone and Brown wanted that had no public support/public notice; did not pass muster with National Park recommendations; appraisal highly questionable, should be investigated.
      - Councilman Brown got soccer field clubhouse/bathroom contract over 750,000; warm up to ESAC contract; citizen should ask how allowed.
      - Council found guilty in Federal Court for violating right of free speech; case now used as precedent around country; Fairhope Council President Burrell and Council now have dubious reputation of this case around necks.
      - Councilman Brown now eyes new recreation property and potential contracts.
      - Brown quote: “I did not use my position as Fairhope city councilman to get it rewarded. We were awarded the project because of our reputation. The ESAC is a nonprofit. They don’t follow municipal bid law where projects are publicly bid.”
      - Brown’s reputation based on HIS actions; EASC nonprofit is moot; Councilman Brown holds board position with EASC; sole responsibility is to be Ethical, Transparent and Accountable to EASC and Citizens of Fairhope; he failed; EASC Board made horrible mistake by awarding sole bid to Mr. Brown.

      THE DISCOVERY:
      - What Article 2 proves today: background/historical context of elected official misconduct/personal gain.
      - Ethics Complaint against Mr. Brown involving Eastern Shore Art Center in limbo status since May 2, 2018.
      - Ethics letter shows contempt and condescending attitude to allegations; Ethics Commission could make three telephone calls and see enough red flags to investigate; inaction/dismissals encourage elected officials to use office for personal gain.
      - THE COMPLAINT AGAINST MR. BROWN INVOLVING THE EASTERN SHORE ART CENTER WILL BE SENT TO THE ATTORNEY GENERAL NEXT WEEK.
      - Councilman Brown also all in on giving away 102 acres of municipal property.
      - Council almost got away with give away; three BBB’s will sting ya and try this give away again, while you are sleeping.
      - Fairhope City Council is Catalyst Council, does not listen or respect community involvement.
      - Fairhope has had one City Council President in office for over 7 years, Jack Burrell; Burrell leads dog and pony show.
      - Burrell, Boone and Brown, who have all used their office for personal gain, should not be trusted to make a 2.6 million dollar purchase, using tax money, without community involvement.

      THE PIVOT:
      - Why Article 2 is the smoking gun/key context for Article 1: it documents elected officials using office for personal gain, ethics failures, Federal Court free speech conviction, Brown/Burrell/Boone personal gain in 2.6 million purchase/750,000 contract/102 acres giveaway, lack of transparency/budget/public hearing.
      - This frames Article 1’s “CRAZY” dismissal and Baldwin County corruption as part of broader pattern of political corruption/municipal judicial misconduct.

