  bend-over-fairhope:
    brief: |-
      THE CONFLICT:
      *   Past conflict involved the Fairhope Single Tax plan becoming a developer on the banks of the gully.
      *   A petition rejecting the Fairhope Single Tax development had over 925 signatures.
      *   Previous conflict included the "Fly Creek" incident where the Mayor favored citizens against the developer.
      *   Past actions involved the council obstructing the Mayor and settling the "triangle lawsuit."
      *   Council members Jack Burrell and others were involved in plans to "drive the Mayor out of office."

      THE DISCOVERY:
      *   Article 2 revealed a sustained pattern of conflict between the Fairhope City Council and the Mayor, centered on the Single Tax's role as a developer and the public's opposition to development on the gully banks.
      *   Article 2 documented existing concerns about sewer backup in the Fruit and Nut section due to grinder pumps.
      *   Article 2 established that council members Boone and Brown had direct ties to the Single Tax project prior to the 2018 events.

      THE PIVOT:
      *   Article 2 establishes that the conflicts of interest (Boone, Brown, Turner, etc.) and the push for Single Tax to become a developer are not new, but a long-standing pattern, providing historical context for the 2018 agenda.
      *   The 2018 sewer spill (100,000-200,000 gallons) near Big Head Gully/Tatumville Gully (Feb 12, 2018) is presented as a consequence of the ongoing development push that Article 2 warned against.
      *   Article 2 validates the public objection trend, noting the earlier 925-signature petition against the Single Tax plan, preceding the 2200+ signature objection cited in Article 1.

