      THE PIVOT: Article 2 establishes a documented history of significant corruption involving BP Pittman, providing context for the multiple conflicts of interest (e.g., Robert Brown/Cliff Pittman on the single tax board) surrounding the Fairhope land transfer and Tatumville Subdivision in Article 1.
