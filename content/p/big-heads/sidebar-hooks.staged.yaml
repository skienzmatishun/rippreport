  grinder-pumps:
    brief: |-
      THE CONFLICT: Past Fairhope administrations allowed developers to bypass required gravity sewer systems (e.g., Battles Trace dating back to ~2005) through "good ole boys" deals; Tim Kant held dual roles as mayor and utility superintendent.
      THE DISCOVERY: Since 2016, Mayor Karin Wilson has implemented strict enforcement of city standards via Operations Director Richard Peterson, rejecting developer waivers for low-pressure grinder pump systems (e.g., Van Antwerp Park, Battles Trace Phase 5) which cost $3,500 per unit.
      THE PIVOT: In February 2018, a 100,000 to 200,000 gallon sewage spill occurred into Big Head Gully and Tatumville Gully—the same location targeted for the Tatumville Subdivision land transfer—demonstrating a failure in infrastructure or regulatory oversight despite new strict standards and amidst numerous conflicts of interest.
      KEY ENTITIES: Fairhope, Karin Wilson, Tim Kant, Richard Peterson, Tatumville Subdivision, Big Head Gully, Kevin Boone, Robert Brown, Cliff Pittman, Jay Robinson, Michel Upchurch, Lee Turner, City of Fairhope.
    llm_text: Tim Kant once allowed Fairhope developers to bypass gravity sewers through "good ole boys" deals. Now, Mayor Karin Wilson and Director Richard Peterson enforce strict standards, but a 2018 sewage spill in Big Head Gully proves infrastructure risks remain near the Tatumville Subdivision.
