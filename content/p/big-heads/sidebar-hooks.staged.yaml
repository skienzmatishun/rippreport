  dead-last:
    brief: |-
      THE CONFLICT: Baldwin County invested $32 million in the South Alabama Mega Site starting mid-2011; this investment failed to secure a car manufacturing plant and was deemed "dead last" in state opportunities.
      THE DISCOVERY: The Baldwin County Mega Site project was a long-standing, unsuccessful economic development endeavor, despite promotional claims by the Baldwin County Economic Development Alliance.
      THE PIVOT: The historical failure and misleading promises of the Mega Site (Article 2) provide context for the 2018 land transfer issue (Tatumville Subdivision/Big Head Gully in Article 1), which is being pushed by the same group of conflicted local officials involved in both the Single Tax/Planning and the land development.
