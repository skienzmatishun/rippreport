      *   Award of contract to Pittman Tractor via Fairhope City Council on June 4th, 2010, after Pittman supplied a second proposal ("Oil Recovery").
      *   Payment of $372,165.90 from Fairhope six days later for "COMPLETED" boom work.
      *   Pittman maintained debris contracts with City of Fairhope for over 8 years, alongside Mayor Kant and Jack Burrell.

      THE DISCOVERY:
      *   The "Mega Site" issue, among other instances (e.g., Fairhope Airport bid rigging, Triangle property sale), demonstrates a sustained pattern of corruption over the last decade.
      *   The common denominator across multiple alleged corrupt actions is involvement with CATALYST politicians and their administration.

      THE PIVOT:
      *   Article 2 provides the foundational, time-stamped evidence (the BP Boom contract) that establishes the decade-long pattern of corrupt practices discussed broadly in Article 1.
      *   The specific, detailed corruption timeline revealed by the BP contract proves the systemic nature of the "good Ole Boy machine" described in Article 1.

