    generated_at: '2026-08-03T02:23:20.136369Z'
    text: The local power structure treats public speech like a threat and local politics like a private business. Leaked documents from the Fly Creek deal prove former Mayor Kant rigged development votes long before citizens ever stepped up to the microphone.
  one-woman-2:
    brief: |-
      THE CONFLICT:
