      THE DISCOVERY:
      *   The second article (dated March 25, 2016) documents the existence of this deeply ingrained corruption in Baldwin County's judicial and municipal governance at that time.
      *   It specifies the impending Fly Creek Apartments approval, suggesting it was fixed and predetermined before the vote.

      THE PIVOT:
