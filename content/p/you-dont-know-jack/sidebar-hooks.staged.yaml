hooks:
  people-power:
    brief: |-
      THE CONFLICT:
      *   For 16 years, Fairhope councils debated power (weak Mayor vs. strong council), resulting in stagnation and "good ole boy deals." (Historical Context from Widget Article)
      *   In 2015, a 30-year ground lease for a commercial hanger on plat 2 at Fairhope Airport Authority was processed.
      *   The RFP was sent September 21, 2015, with a submittal date of October 13, 2015.
      *   The bid approval occurred on November 17, 2015.
      *   Jack Burrell (President of Fairhope City Council and Airport Authority member) moved to award the bid.
      *   Vince Boothe seconded the motion.
      *   Ray Hix (Airport Authority Board member) recused himself before discussion but was awarded the bid via Hix/Snedecker Companies DBA Mid-Bay Air, LLC.
      *   Mr Snedecker (Fairhope Municipal Judge) was involved in the winning bid.
      *   The memorandum of lease was recorded on December 17, 2015.

      THE DISCOVERY:
      *   The historical context reveals 16 years of political stagnation and systemic "good ole boy deals" in Fairhope governance. (Widget Article)
      *   The 2015 airport lease details a conflict of interest where an Airport Authority Board member (Ray Hix) was awarded a contract with a partner (Mr Snedecker, Municipal Judge) despite his board position and failure to fully recuse himself. (Main Article)

      THE PIVOT:
      *   The historical pattern of 16 years of unaccountable "good ole boy deals" established in Article 2 provides the context for the lack of transparency and conflicts of interest cited in Article 1.
      *   The 2015 Airport Authority contract is presented as a concrete example of the systemic, non-transparent decision-making that Mayor Wilson and the new council were elected to eliminate.

      KEY ENTITIES:
      *   Mayor Wilson
      *   Fairhope City Council
      *   Fairhope Airport Authority
      *   Jack Burrell (President of Fairhope City Council)
      *   Vince Boothe
      *   Ray Hix (Airport Authority Board member)
      *   Mr Snedecker (Fairhope Municipal Judge)
      *   Shux restaurant (on Municipal Pier)
      *   Mid-Bay Air, LLC
      *   Fairhope
    llm_text: Fairhope's 16 years of "good ole boy deals" created a system ripe for conflict. In 2015, Airport Authority member Ray Hix awarded a lease to Mid-Bay Air, LLC, a bid involving Municipal Judge Mr Snedecker despite his recusal.
