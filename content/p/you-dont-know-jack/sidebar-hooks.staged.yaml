  dont-throw-rocks-if-you-live-in-a-glass-house:
    brief: |-
      THE CONFLICT:
      *   Previous administration was led by Mayor Kant and Council President Jack Burrell for four years.
      *   Mayor Kant refused to cooperate with the transition of power to Mayor Wilson.
      *   In 2015, the Fairhope Airport Authority issued an RFP on September 21, 2015, for a commercial hanger ground lease (Plat 2).
      *   The lease was awarded on November 17, 2015, to Hix/Snedecker Companies DBA Mid-Bay Air,llc.

      THE DISCOVERY:
      *   Article 2 revealed that despite the election of Mayor Wilson and three new council members (Conyers, Brown, Robinson), Jack Burrell continued to act as a surrogate for defeated Mayor Kant.
      *   Burrell undermined the new administration (e.g., voting 4-0 to support his self-nomination for AMEA, denying Mayor Wilson's request for consideration).

      THE PIVOT:
      *   Article 2 demonstrates that the political power structure (Kant/Burrell) remained entrenched and resistant to change immediately following the election.
      *   This established resistance explains why the new Mayor Wilson is inheriting serious, unresolved conflicts and "red flags," such as the 30-year Shux restaurant contract and the 2015 Airport Authority lease deal detailed in Article 1.

      KEY ENTITIES:
      *   Mayor Karin Wilson
      *   Mayor Kant
      *   Jack Burrell (Council President)
      *   Vince Boothe
      *   Ray Hix (Airport Authority Board member)
      *   Mr Snedecker (Fairhope Municipal Judge)
      *   Jimmy Conyers
      *   Robert Brown
      *   Jay Robinson
      *   Fairhope Airport Authority
      *   Shux restaurant
      *   September 21, 2015
      *   November 17, 2015
    llm_text: Jack Burrell continues undermining Mayor Karin Wilson, acting as a surrogate for defeated Mayor Kant. This entrenched resistance explains why Wilson inherits conflicts like the 2015 Fairhope Airport Authority lease awarded to Mid-Bay Air,llc.
