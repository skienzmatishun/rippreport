  happy-belated-new-year-clean-sweep:
    brief: |-
      THE CONFLICT:
      *   2012 election resulted in four new council members in Fairhope.
      *   City administrator, police chief, and head of public works were removed following the 2012 election.
      *   Mayor Tim Kant and Mike Ford were re-elected and remained in office.
      *   Mayor Kant held total control over the planning and zoning board and the board of adjustments, with Jonathan Smith as planning head.

      THE DISCOVERY:
      *   In 2012/2013, Mayor Tim Kant faced potential indictment for the BP Boom Scam with Trip Pittman.
      *   The Triangle Lawsuit, involving Mayor Kant/Planning Commission, had cost the city millions in legal fees and remained unresolved across three city councils.
