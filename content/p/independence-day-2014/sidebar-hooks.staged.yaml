      THE PIVOT:
      *   Article 2 established Mayor Kant's entrenched, controlling power over Planning and Zoning (2012).
      *   Article 1 shows Lee Turner, who is Chairman of Planning and Zoning, was recently elected to the Fairhope Single Tax Corporation (FSTC).
      *   This creates a direct and current conflict of interest: Turner controls both FSTC and Planning/Zoning, allowing him to leverage his position to cause turmoil at FSTC, linking past corruption (Kant's control) to present conflict (Turner's actions).

