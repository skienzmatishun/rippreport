      Single Tax Corporation (FSTC).

      *   Turner caused turmoil in FSTC, allegedly removing members and limiting public
      input.

      *   Kant was accused of micromanaging Planning and Zoning, maintaining guaranteed
      votes for his position.


      THE DISCOVERY:

      *   The Widget Article establishes a pattern of corruption linking Mayor Kant,
      body fixes (elections), and external donors/PACs influencing the outcomes.

      *   The article details specific high-level financial conflicts: Senator Pittman
      (and Kant) allegedly accepting $636,000 from BP/related funds while Pittman
      served as Trustee for Baldwin County.

      *   The Widget Article links the "good ole boy" network involving Kant, Jim
      Nix (former Mayor), and potential successors like Sherry Sullivan and Lee Turner.


      THE PIVOT:

      *   Article 1 discusses the *existence* of conflicts regarding Turner''s roles
      (P&Z/FSTC) and Kant''s control.

      *   Article 2 provides the *scale and specific financial evidence* of that corruption,
      linking Kant''s administrative control to large-scale misuse of funds ($636k
      BP/Trustee issue) and documented election rigging efforts, suggesting the conflicts
      in Article 1 are systemic corruption rather than isolated incidents.


      KEY ENTITIES:

      *   Mayor Kant

      *   Lee Turner

      *   Fairhope City Council

      *   Single Tax Corporation (FSTC)

      *   Senator Pittman

      *   Jim Nix

      *   Attorney Corte'
