  rsa-⁠-no-gas-for-point-clear-or-tourism:
    brief: |-
      THE CONFLICT: Point Clear Properties Association opposed a 12-unit condo project proposed by Retirement Systems of Alabama (RSA) on a 1.27-acre marina property next to the Grand Hotel. Local residents, the Baldwin County Planning Commission, and the Fairhope Planning Board opposed the zoning change, submitting a petition with over 400 signatures and 100 letters prior to the Sept 5 Baldwin County Planning and Zoning meeting. In retaliation, RSA removed the marina's fuel tanks and stopped pumping gas to the general public for the first time in 50 years, forcing the marina to close, costing jobs, and cutting off fuel access for boaters, fishermen, and tourists who must now travel 6 miles to Fly Creek Marina in Fairhope.

      THE DISCOVERY: Article 2 (the widget article, published several weeks prior as a Lagniappe story) exposed Retirement Systems of Alabama (RSA) using hardball, retaliatory tactics against local residents and tourism after facing pushback on a luxury development. It documented how state-level power ("Goat Hill") and corporate entities like RSA bypass local opposition, punishing the Eastern Shore community by destroying essential tourist and recreational infrastructure (the marina fuel station operating for 50 years) simply because homeowners successfully petitioned against a 12-unit condo project in a Tourism Resort District (TRD).

      THE PIVOT: Article 2 serves as the smoking gun for Article 1 because it establishes the exact pattern of unchecked corporate and political overreach driving Baldwin County's current destruction. While Article 1 outlines the broader systemic crisis—unbridled sprawl, developer greed, the Catalyst Council, non-existent sewer regulations, and infrastructure collapse—Article 2 provides the concrete proof of *who* benefits and *how* they operate: powerful outside entities like RSA ("fat cats from Montgomery") bullying local communities, ignoring planning boards, harming tourism, and putting private gain over public welfare with zero accountability.

      KEY ENTITIES:
      - Retirement Systems of Alabama (RSA)
      - Point Clear Properties Association
      - Grand Hotel
      - Baldwin County Planning Commission
      - Fairhope Planning Board
      - Fly Creek Marina
      - Catalyst Council
    llm_text: When locals blocked RSA’s luxury condo plan near the Grand Hotel, the Montgomery giant retaliated by cutting off Point Clear’s marina fuel for the first time in 50 years. Read how powerful state entities bulldoze Eastern Shore communities, and why this corporate bullying exposes the real threat driving Baldwin County's infrastructure collapse.
