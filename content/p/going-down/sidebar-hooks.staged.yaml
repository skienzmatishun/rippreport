    brief: "THE CONFLICT: On Monday, September 16, 2019, an ethics complaint was personally delivered to the Alabama Attorney General's White Collar Crime Division, Special Prosecutors, accompanied by a 42-page booklet of supporting documents regarding Councilman Robert Brown and business partner Cliff Pitman using their elected positions for personal gain.\n\nTHE DISCOVERY: Article 2 exposed Fairhope leadership hypocrisy, revealing that the trio of council members—referred to as the Jester (Robert Brown), Burrell, and Boone—demanded community engagement for the Greeno Road Overlay District while simultaneously voting themselves full-family insurance, ignoring community engagement for a $2.6 million recreation land purchase, and denying recreation land to the black community.\n\nTHE PIVOT: Article 2 serves as the smoking gun for Article 1 because it establishes a documented historical pattern of self-dealing, ethical failures, and fiscal hypocrisy by the exact same political actors (\"the three B's\" / the Council faction) who are currently pushing the overdevelopment, infrastructure failures, and questionable $2.65 million recreation land spending criticized in the main article.\n\nKEY ENTITIES: \n- Robert Brown (Councilman / \"The Jester\")\n- Burrell (Councilman)\n- Boone (Councilman)\n- Cliff Pitman (Business partner to Robert Brown)\n- Catalyst Council\n- Alabama Attorney General, White Collar Crime Division, Special Prosecutors"
