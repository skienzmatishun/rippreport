  corridor-of-chaos:
    refined_source: f9d99fec4ae29e709e49375fe913ca44bd193fdc3f047093dca523865872692c
    brief: |-
      THE CONFLICT:
      *   October 28th: City council hearing began considering final approval of the KLUMP PUD application on 76 acres of farmland at the northwest corner of Fairhope Avenue and Hwy 181.
      *   Developer Gayfer Village Partners, Llc, submitted the application for Unit 1 (16 commercial lots), Unit 2 (232 multi-family apartment units), and Unit 3 (77 lots single family residential).
      *   Municipal Judge Haymes Snedeker, a sole member of Gayfer Village Partners, Llc, is linked to the development via his partner, Ray Hix, who served on the city's Airport Authority.

      THE DISCOVERY:
      *   The KLUMP PUD and two other concurrent projects (Fly Creek Apartments: 240 units; Old Battles Place: 94 units) total 566 apartments, 77 single family houses, and 16 commercial units in the "Corridor of Chaos."
      *   Baldwin County lacks sewer regulations, leading to regular sewer spills into the Bay, despite being Alabama's fastest-growing county.

      THE PIVOT:
      *   Article 2 establishes that the 566 apartment figure (referenced in Article 1) is a result of a specific, approved, and controversial development (KLUMP PUD) tied to potential municipal conflict of interest (Snedeker/Hix).
      *   Article 1 then details the resulting infrastructure failure (lack of sewers, negative impact on schools requiring an Independent School System, traffic gridlock at 181/Fairhope/Wal-Mart) caused by the unbridled development identified in Article 2.

      KEY ENTITIES:
      *   Gayfer Village Partners, Llc
      *   Tom Mitchell (Developer)
      *   Municipal Judge Haymes Snedeker
      *   Ray Hix
      *   Baldwin County
      *   Fairhope Avenue / Hwy 181
      *   Catalyst Council
