    brief: |-
      THE CONFLICT:
      *   Eastern Shore Metropolitan Planning Organization faced opposition to the "Poison Ivy" toll bridge in Baldwin and Mobile Counties.
      *   Opposition gained traction when the "stop the toll petition hit 50,000."
      *   Former State Senator BP Pittman was mentioned in the context of BP contracts totaling $750,000.

      THE DISCOVERY:
      *   Baldwin County elected officials achieved unanimous opposition (nearly 100%) to the toll bridge after a 4.5-hour meeting.
      *   Politicians demonstrated a willingness to flip positions when facing significant public pressure (50,000 signatures).

      THE PIVOT:
      *   Article 2 provides historical evidence that unified citizen action (petitions) can force elected officials to oppose large, potentially corrupt, development/infrastructure projects.
      *   This context contrasts with Article 1, where the Fairhope City Council is accused of a *quid pro quo* (3-2 vote) involving a $2.6 million property purchase and pushing the gully subdivision despite a petition from 2400+ people.

      KEY ENTITIES:
      *   Mayor Karin Wilson
