      *   Lee Turner
      *   Fairhope City Council
      *   FSTC (Fairhope Single Tax)
      *   Eastern Shore Metropolitan Planning Organization
      *   BP (related to $750,000 contracts)
      *   Eastern Shore Art Center (ESAC)
      *   The gully (site of disputed development)
