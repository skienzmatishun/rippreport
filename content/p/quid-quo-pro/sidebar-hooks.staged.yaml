  baldwin-county-sewer-regulation-a-litmus-test:
    brief: |-
      THE CONFLICT:
      - Baldwin County sewer regulation issue: Baldwin County Sewer System (BCSS/BC$$) privately owned monopoly servicing 19,000 homes.
      - BCSS charges unregulated sewage fees; no limit on price; Richard Dayton quote: rates totally unregulated; if tomorrow BCSS charged $154.50/month, nothing could be done and sewage turned off if not paid; BCSS monopoly.
      - Baldwin County now has a “NEW” consumer issue: sewer regulation; Mr. Richard Dayton of GlenLakes subdivision in Foley leading charge.
      - Prior consumer issue: $6.00 toll in Baldwin County was biggest consumer issue; defeated by poll; poll numbers rose until terrified elected officials; petition reached 50,000 mark; elected officials hit their knees.
      - 9/11 context: remember those who lost lives 18 years ago, September 11, 2001, NEVER FORGET.
      - Elected officials in Shelby County began fight to overturn unregulated sewage fees with legislation aimed at protecting customers by regulating prices.
      - Former County Commissioner Tucker Dorsey, called straw man, was agent of BC$$ and held office at same time.
      - Present County Attorney is lobbyist for BC$$.

      THE DISCOVERY:
      - Article 2 revealed Baldwin County is the only county that has no regulations at all.
      - BC$$ has effectively influenced and lobbied elected officials to look the other way.
      - Ripp Report supports Mr. Dayton’s efforts to regulate BC$$, a monopoly holding 19,000 customers hostage to an unregulated sewer system.
      - This petition will be the driving force in convincing County Commission and elected officials that time has come for regulations.
      - This petition will be a litmus test for the next County Commission election.
      - Baldwin County is fastest growing County in Alabama; unregulated sewer system is consumer time bomb.
      - Together and through petition we can win this battle just like we defeated the $6.00 toll.

      THE PIVOT:
      - Article 2 is older than Article 1; frame it as background/historical context.
      - Article 2 is the key context/smoking gun for Article 1 because it documents prior consumer-protection battle and pattern: $6.00 toll defeated via petition/pressure; sewer regulation next.
      - Article 1: CATALYST and Quid quo pro are synonymous.
      - Fairhope City Council voted 3 to 2, Burrell Boone and Brown to purchase 2.6 million in recreation property.
      - Burrell Boone said appraisal was not a purchase and public comment will come up if they decide to purchase land; instead they voted for purchase based upon appraisal with questionable comps, or a plan as to how they were going to pay for it.
      - This was a bold face, documented, lie; community got bent over, again; red flags everywhere.
      - Council willing to ignore 2,400+ people who signed petition opposing development of gully.
      - Council voted to purchase 2.6 million; possible 102 acres around triangle, 20 million in city property.
      - When council sees resistance they back off, then resurrect issue over and over until they catch enough people asleep, that it passes.
      - Councilman Robert Brown pushing past Eastern Shore Art Center contract, ignoring requests for documentation, on ESAC contract, claims to have.
      - Councilman Brown said he had permission from Ethics Commission and multiple bids were submitted; he has not provided documentation to back up claims.
      - Brown going from art to the gully.
      - Cliff Pittman, Councilman Robert Brown’s business partner and inside contact for FSTC, involved; Fairhope Single Tax, Lee Turner involved.
      - Bet on Brown/Pittman that they will get contract to build subdivision in gully.
      - They will assure community they are “down home boys” and all contracts they get are due to outstanding reputation; under no circumstances have they used elected or appointed office as advantage in getting contracts that personally enrich themselves.
      - Mayor Karin Wilson: “A Favor for a Favor” Quid quo pro “Something for Something”.
      - Fairhope City Council voted 3 to 2, Burrell Boone and Brown to purchase 2.6 million in recreation property.
      - Council acting like wrecking ball, voting themselves a raise and full family insurance for their part time job, ignoring citizens and restricting public participation.
      - Council has already been sued for violating constitutional rights and free speech.

      THE PIVOT:
      - Article 2 provides historical/background context for unregulated BCSS and prior $6.00 toll/petition fight; Article 1 Fairhope Quid quo pro/council actions become key context for pattern.

