    brief: |-
      THE CONFLICT: Senator Pittman maintained debris removal contracts with the city of Fairhope since 2004. Pittman and the Mayor of Fairhope were subject to a BP fraud investigation, which was investigated by the FBI and later by special prosecutor Matt Hart.

      THE DISCOVERY: On July 7, 2016, a complaint revealed that while Pittman claimed Ethics Commission exoneration/permission for contracts, the Ethics letter was only an opinion, not permission, and the claim of exoneration from BP Fraud was untrue.

      THE PIVOT: Article 2 establishes the historical conflict of interest (Pittman/BP contracts/false exoneration). Article 1 reveals that Commissioner Tucker Dorsey retaliated by firing county employees (EMA director, county attorneys) who were trying to prevent Sen. Pittman from facing ethics charges related to the BP Grant ($750,000 combined contracts), demonstrating a cover-up of the historical issue.

      KEY ENTITIES: Tucker Dorsey, Sen. Pittman, Governor Riley, Matt Hart, Fairhope Mayor, Bob James, Baldwin County, Ethics Commission, BP Grant.
    llm_text: Senator Pittman maintained BP debris removal contracts in Fairhope since 2004, falsely claiming exoneration from a BP fraud investigation. Tucker Dorsey covered up this $750,000 BP Grant issue by firing county employees who tried to expose the historical conflict of interest.
