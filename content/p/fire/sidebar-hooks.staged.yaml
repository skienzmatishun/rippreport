      THE DISCOVERY: Mayor Kant attempted to establish a legacy by creating the “Timothy Kant Performing Arts Center” and used the final P&Z meetings to push through building projects for major campaign contributors.
      THE PIVOT: Article 2 provides documented historical evidence of localized cronyism and disregard for public interest within Baldwin County (Fairhope), establishing a pattern of behavior that supports the broader ethics accusations and conflicts raised against Commissioner Tucker Dorsey in Article 1.
