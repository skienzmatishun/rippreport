      THE DISCOVERY:
      1. The older article confirms Dorsey and Bob James fired whistle-blowers related to the Pittman Kant BP fraud shortly after Dorsey was elected.
      2. The older article identifies the Mega Site cost to the county as over $30 million for connected landowners, with a lost opportunity exceeding $40 million.
      3. The older article establishes Dorsey's involvement with the Mobile Boy Scout Board and his inaction regarding the organization's financial crisis.

      THE PIVOT:
