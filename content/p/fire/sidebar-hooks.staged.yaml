  round-and-round-we-go:
    brief: |-
      THE CONFLICT: Commissioner Tucker Dorsey fired county employees (EMA director, county attorneys) who attempted to prevent ethics charges against Sen. Pittman regarding the $750,000 BP Grant contracts. Sen. Pittman was designated by Governor Riley as the "trustee" of these funds. The Mega Site cost the county over $50 MILLION.

      THE DISCOVERY: Baldwin County introduced a roundabout (13/48) in Fairhope. Commissioner Chris Elliott clarified that the intersection is partially in the county and partially governed by extra territorial jurisdiction (ETJ). The remaining parcel of the corner was sold after right-of-way acquisition to a new owner operating gas stations in Baldwin County.

      THE PIVOT: Article 2 establishes historical context regarding land acquisition, zoning, and commercial development decisions (gas station at roundabout) within Baldwin County, providing a backdrop of localized regulatory/development issues relevant to the broader corruption investigation and ethics complaints concerning Tucker Dorsey and Sen. Pittman in Article 1.

      KEY ENTITIES: Tucker Dorsey, Sen. Pittman, Governor Riley, Chris Elliott, Baldwin County, Fairhope, Mobile Area Boy Scouts, Tim Kant, BP Grant, Highway 13 and Fairhope Avenue.
