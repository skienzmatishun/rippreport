  you-re-fired:
    brief: |-
      THE CONFLICT: In October 2010, the Alabama Ethics Commission issued a 4-0 unanimous advisory opinion stating Commissioner Tucker Dorsey should not vote or influence BCSS business dealings due to a conflict of interest, as he was associated with BCSS's employer. This advice was subsequently ignored.

      THE DISCOVERY: Article 2 (July 29, 2016 statement) provides official documentation from the Alabama Ethics Commission detailing the 2010 finding that Commissioner Dorsey had a conflict of interest related to BCSS.

      THE PIVOT: Article 2 establishes a historical pattern of Dorsey ignoring ethical mandates (the 2010 ruling) regarding financial conflicts, providing essential context for the current ethics complaint (Article 1) which details his firing of county employees who attempted to prevent Sen. Pittman from facing ethics charges related to the $750,000 BP Grant contracts.

      KEY ENTITIES: Tucker Dorsey, Sen. Pittman, Governor Riley, Alabama Ethics Commission, Baldwin County, Kant, Mobile Area Boy Scouts, BP Grant ($750,000), $50 MILLION (Mega Site cost)
