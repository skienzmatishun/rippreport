  court-public-opinion-now-session:
    brief: |-
      THE CONFLICT: Improper bidding for a ground lease at Fairhope Airport involving Council President Jack Burrell and the Fairhope Airport Authority. The lease was signed on Dec. 17th 2015, and the Ethics Advisory Opinion was rendered on Feb. 3 2016.

      THE DISCOVERY: The Ripp Report filed a 42-page complaint detailing that Burrell, as an elected official and Airport Authority Board member, aided and abetted a grossly flawed and gerrymandered RFP process. The complaint specifically alleged that Burrell and family members received free airplane transportation from the winning bidder, Hix/Snedeker aircraft (Mid Bay Air LLC).

      THE PIVOT: Article 2 establishes the original, documented allegations of bid rigging, Burrell's official role in the selection (April-July 2015), and the free transport claims, which are the specific contents of the formal complaint that Article 1 is currently challenging by offering a $5,000 cash reward to prove them false.

      KEY ENTITIES: Jack Burrell (City Council President, Airport Authority Board member), Fairhope Airport Authority, The Ripp Report, Mid-Bay Air LLC (Hix/Snedeker), Terry Chapman, Kel Jones, Karin Wilson, Jimmy Conyers, Robert Brown, Kevin Boone, Hugh Evans, Attorney Bailey.
    llm_text: Council President Jack Burrell helped approve a 2015 ground lease at Fairhope Airport. The Ripp Report alleges Burrell aided flawed bidding, and his family received free plane transport from Mid-Bay Air LLC.
