    brief: |-
      THE CONFLICT:
      *   Jack Burrell, while serving as an elected official (Council President and Airport Authority Board member), was involved in alleged "bid rigging" related to the Airport Authority selection process.
      *   The initial allegations were part of a larger political shift in Fairhope following the removal of Mayor Kant (16 years in office).
      *   The Ripp Report filed multiple complaints (up to four) with the Ethics Commission against Jack Burrell regarding his participation in the Airport Authority.

      THE DISCOVERY:
      *   Article 2 revealed that The Ripp Report filed a formal Ethics complaint against Jack Burrell concerning alleged "bid rigging" related to the Airport Authority.
      *   Article 2 noted Burrell used his authority to prevent the repeal of ordinance 1572 (involving Fly Creek Apartments) and restricted public questioning about the bid rigging allegations.
      *   Article 2 established Mayor Wilson’s support for the repeal of ordinance 1572 and airport land ownership.

      THE PIVOT:
      *   Article 2 established the historical foundation (Ethics Complaint, bid rigging, resistance to Mayor Wilson) of the conflict.
      *   Article 1 is the current escalation, offering a $5,000 cash reward to prove the *contents* of the formal complaint (stemming from the issues in Article 2) are false, fabricated, or based on willful malicious intent.
      *   Article 1 specifies a key allegation: Burrell and family received free airplane transportation from the winning bidder while serving as an elected official.

