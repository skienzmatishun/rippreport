      THE DISCOVERY: The Widget Article revealed Boone’s long-standing conflicts of interest and his failure to recuse himself from voting on related council and planning/zoning issues in Fairhope.
      THE PIVOT: The Widget Article establishes a historical pattern of elected officials (Boone) prioritizing private financial interests over public duty in Fairhope, providing context for the current $5000 cash reward issued in the Main Article regarding Councilman Jack Burrell's alleged misuse of his position (free airplane transportation by a winning bidder related to Fairhope Airport) as a conflict of interest.
