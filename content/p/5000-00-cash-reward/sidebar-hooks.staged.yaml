      THE CONFLICT: Past allegations concerning Fairhope Airport Authority airplane hanger leases and bid selection involving Jack Burrell (City Council President/Airport Authority Board Member) and others; Ethics Complaint filed by the Mayor of Fairhope in early December 2016.
      THE DISCOVERY: On December 21, 2016, The Ripp Report appealed to the Alabama Attorney General Special Prosecutor Matt Hart, US Attorney’s Office, 28th Judicial Circuit Honorable Jody W. Bishop, and FBI regarding alleged criminal activity and the Ethics Commission being misled by Advisory Opinion 2016-4.
      THE PIVOT: Article 2 (2016) establishes the historical basis for the current complaint (Article 1), showing the allegations against Burrell regarding bid involvement and free transportation are not new but stem from documented 2016 investigations and complaints.
      KEY ENTITIES: Jack Burrell (Council President/Board Member), Fairhope Airport Authority, The Ripp Report, Mayor of Fairhope, Alabama Ethics Commission, Matt Hart (AG Special Prosecutor), Jody W. Bishop (28th Judicial Circuit), FBI, Municipal Judge.
