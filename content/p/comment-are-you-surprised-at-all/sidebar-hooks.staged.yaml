  challengers-emerge-in-daphne-mayoral-race:
    brief: |-
      THE CONFLICT:
      *   Mobile Area Council Boy Scouts (Baldwin County) lost over $750,000 between 2014, 2015, and 2016, averaging over $250,000 loss each year.
      *   Baldwin County residents are concerned about state policy failures, specifically the PACT program and the actions of Governor Kay Ivey.
      *   Daphne municipal mayoral elections were scheduled for August 23, featuring challenges to incumbent mayor Dane Haygood by John Lake, Tim Swanson, and Ben Cruitt.

      THE DISCOVERY:
      *   Article 2 confirmed multiple candidates (John Lake, Tim Swanson, Ben Cruitt) were challenging Dane Haygood for the Daphne mayor position in August 2019.

      THE PIVOT:
      *   Article 2 establishes the local political environment and accountability needs within Daphne/Baldwin County, providing the geographical context for the larger state and non-profit governance concerns raised in Article 1 (e.g., the negligence of Bradley Byrne, Tripp Pittman, and Tucker Dorsey regarding the Boy Scouts in Baldwin County).

