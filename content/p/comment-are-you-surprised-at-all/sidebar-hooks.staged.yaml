  help-fairness-killing-us:
    brief: |-
      THE CONFLICT:
      *   Kevin Boone was a member of BA-101, LLC, formed on April 29, 2004, for property investment.
      *   BA-101, LLC was dissolved on January 31, 2017.
      *   The Fairhope City Council was criticized for prioritizing a definition of "Fairness" that led to a hiring freeze (punishing the mayor) and the reduction/elimination of the Director of Economic and Community Development, Sherry-Lea Bloodworth-Botop, by Councilman Burrell.
      *   Councilman Boone was asked to recuse himself regarding Angelo Corte, Preeble-Rish, or the Fly Creek Pud, but stated he was not a partner in any LLC, despite the LLC being made public on January 25 (dissolved January 31, 2017).

      THE DISCOVERY:
      *   Article 2 revealed a specific, documented conflict of interest involving Councilman Kevin Boone and the dissolved investment LLC, BA-101, within the Fairhope City Council.

      THE PIVOT:
      *   Article 2 establishes a historical pattern of local political mismanagement, self-interest, and questionable ethics within Fairhope/Baldwin County (e.g., Boone's LLC, Burrell's actions, council ignoring ethics commission), which provides context for Article 1's larger claims of systemic failure and political corruption involving state-level figures (Kay Ivey) and Boy Scouts mismanagement.

