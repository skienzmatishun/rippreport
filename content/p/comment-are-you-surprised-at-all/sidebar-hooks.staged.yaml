  good-ole-boys-alive-and-well:
    brief: |-
      THE CONFLICT:
      *   Prior to October 24th (2016), Fairhope City Council, under former leadership (Tim Kant), debated Resolution 2606-16 regarding a property deed for the city of Fairhope's sewer lift station.
      *   The "gift" from Angelo A. Corte was three plus acres of wetlands and storm water runoff area, not just a small city lift station lot.
      *   Council member Jack Burrell presided over the meeting and initially failed to recognize the property was recorded three days prior (October 21st).
      *   The council subsequently overrode the Mayor's veto regarding the Fly Creek PUD ordinance.

      THE DISCOVERY:
      *   Article 2 revealed instances of political obstruction against the Mayor, questionable land dealings involving the sewer lift station, and the influence of a "good ole boy shadow government" (Catalyst).
      *   It highlighted the appointment of Sherry-Lea Bloodworth-Botop to the Economic and Community Development position and the blocking of Mayor-appointed appointments to the Airport Authority board.

      THE PIVOT:
      *   Article 2 demonstrates a historical pattern of local Fairhope political incompetence, obstruction, and prioritizing developer interests over citizen welfare (e.g., the sewer gift, Airport Authority block), establishing the precedent for the broader, systemic mismanagement and corruption detailed in Article 1.
      *   This pattern connects local political inaction (e.g., regarding the Boy Scouts) to state-level political complicity (Kay Ivey, PACT program).

