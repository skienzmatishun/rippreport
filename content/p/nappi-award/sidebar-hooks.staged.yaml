      - Karin Wilson (Mayor, Fairhope)
      - Kevin Boone (Fairhope Councilman)
      - Scott Boone (Catalyst / Scott Boone Consulting)
      - Catalyst (formerly Scott Boone Consulting)
      - Tucker Dorsey (Past Baldwin County Commissioner)
      - Fairhope City Council
      - Baldwin County (Location)
