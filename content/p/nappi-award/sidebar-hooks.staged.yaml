  catalyst-aka-scott-boone-consulting:
    refined_source: bd117e2d2318b1f0a472bbe02b5f2972ac7a0166071116154031144a53b395a4
    brief: |-
      THE CONFLICT:
      - The "Catalyst" group, an organization accused of operating as a "good ole boys" network and a "criminal enterprise," was active in Baldwin County politics.
      - Allegations against Catalyst included using inside information to secure municipal contracts, participating in "Strawman" land fraud, and representing interests of developers and landowners.
      - Key figures linked to these activities include Scott Boone and Fairhope Councilman Kevin Boone.
      - The group has since rebranded as Scott Boone Consulting to obscure its identity.

      THE DISCOVERY:
      - Article 2 revealed that Catalyst/Scott Boone Consulting is ideologically opposed to regulations, impact fees, and infrastructure needs.
      - The group's political influence extends to municipal elections in Spanish Fort, Daphne, Fairhope, and Bay Minette.
      - The organization is tied to investigations into Baldwin County sewer issues and land fraud.

      THE PIVOT:
      - Article 1 documents a four-year "tooth and nail" conflict between Fairhope Mayor Karin Wilson and the Fairhope City Council.
      - Mayor Wilson’s administration has focused heavily on infrastructure, specifically investing $14M in utility upgrades and securing $18M in RESTORE funds for sewer system rehabilitation and overflow prevention.
      - Article 2 provides the context for the Council's opposition: Councilman Kevin Boone is identified as part of the Catalyst network, a group that is explicitly against the types of infrastructure spending, regulations, and impact fees that Mayor Wilson is currently implementing.

