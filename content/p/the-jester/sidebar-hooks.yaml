      *   Resolution 28 authorized a Conservation Easement Agreement between the City of Fairhope and Weeks Bay Foundation, Inc. for two conservation easements on the Dyas/Triangle property for a total cost of $39,025.00.
      *   Diana Brewer, a former councilwoman in favor of the Fly Creek Apartments, reached out to the council regarding the Conservation Easement.

      THE PIVOT:
      *   Article 2 proves that the conservation easement favored by "The Jester" was orchestrated via political maneuvering and influence (Diana Brewer's agenda), indicating that the land transfer serves private developers rather than public interest.
