  deliberate-distortion-or-twisting-of-meaning:
    brief: |-
      THE CONFLICT
      *   The Jester used an elected position for personal gain by securing the Fairhope Art Center Contract.
      *   The Jester favored the Fly Creek Apartments developer over his constituents.
      *   The Jester is currently attempting to give away 106 acres of municipal land to Weeks Bay, despite supporting a conservation easement.

      THE DISCOVERY
      *   The Fairhope City Council and Weeks Bay are deliberately misleading the public that a Conservation Easement means Weeks Bay owns the property or has title/lease.
      *   The City is "disposing" of the property by signing over management and control for perpetuity to Weeks Bay.
      *   An anonymous donor is contributing $39,000 to this deal, which is being kept secret.

      THE PIVOT
      *   Article 2 proves that the term "Conservation Easement" used in Article 1 is a deliberate distortion meant to obscure the fact that the City Council is transferring control and disposal of the land to Weeks Bay without true ownership or lease terms.

      KEY ENTITIES
      *   The Jester
      *   Fairhope City Council
      *   Weeks Bay
      *   Fly Creek Apartments developer
      *   Fairhope Art Center Contract
      *   106 acres of municipal land
      *   Anonymous donor ($39,000)
