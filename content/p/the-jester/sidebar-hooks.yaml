    text: The Jester claims a simple conservation easement protects city land. That terminology hides a dirty scheme where the Fairhope City Council transfers total control of 106 prime acres to Weeks Bay, backed by a secret $39,000 donor.
  disposal:
    brief: |-
      THE CONFLICT
      *   Jack Burrell served as Fairhope City Council President for over 7 years.
      *   Burrell used his elected position to secure the Fairhope Art Center Contract for personal gain.
      *   Burrell favored the developer of Fly Creek Apartments over constituents.
      *   Burrell led the City Council to override the Mayor’s veto over the Fly Creek extension zoning.
      *   Burrell settled the Triangle lawsuit and falsely claimed a park purchase.

      THE DISCOVERY
      *   The Fairhope City Council President (Burrell) is disposing of 106 acres of city property worth $20 million.
      *   Burrell allegedly lied about forgetting who proposed the disposal of the 106 acres.
      *   Burrell arranged for the Fly Creek developer to receive a parcel of land located at wetlands near the Fly Creek Hwy 98 culvert, shifting liability to Fairhope.

      THE PIVOT
      *   The sale/disposal of 106 acres by Burrell is proof of his long-term pattern of using his position for special interests and corruption established in past decisions regarding development and land use (e.g., Fly Creek Apartments).

