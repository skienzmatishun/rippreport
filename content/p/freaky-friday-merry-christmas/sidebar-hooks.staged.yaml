  fairhope-airport-un_authorized:
    brief: |-
      THE CONFLICT:
      *   December 23, 2015: Airport Authority signed a memorandum of lease with Mid-Bay Air LLC at Sonny Callahan Airport in Fairhope, Alabama.
      *   August 7, 2015: Three board members (Joe McEnerey, Pam Caudill, and Ray Hix) resigned/were appointed to the Fairhope Airport Board.
      *   Ray Hix, as a board member, was privy to confidential information regarding airport leases, bids, and financial data.
      *   Hix, a board member, proceeded to secure a lease as Mid-Bay Air LLC, creating an obvious conflict of interest.
      *   Jack Burrell, City Council President and Airport Authority Board Member, chaired an ad hoc committee and reviewed bids, determining Hix as the winner.

      THE DISCOVERY:
      *   The Airport Authority sought an advisory ethics opinion (No. 2016-04) to permit a lawyer/Board member to lease with the same authority.
      *   The ethics opinion stated the Board member could not use confidential information gained by position to benefit their company.
      *   November 8, 2016: A request was sent to the Alabama Ethics Commission regarding the Mid-Bay Air Lease awarded around December 2015.
      *   December 2, 2016: The Alabama Ethics Commission replied that no lease had ever been submitted to them regarding this issue.

      THE PIVOT:
      *   The Ethics Commission's response (Dec 2, 2016) confirms the lease was never officially filed or submitted for compliance review, contradicting the actions taken in late 2015 and the subsequent ethics inquiry.
      *   This non-compliance suggests the lease is null and void, demonstrating a failure by the Airport Board to oversee conflicts of interest or comply with ethics rules (requiring filing within ten days of entry).

      KEY ENTITIES:
      *   Ray Hix (Board Member, Mid-Bay Air LLC)
      *   Jack Burrell (City Council President, Airport Authority Board Member)
      *   Joe McEnerey (Chairman, Airport Authority)
      *   Pam Caudill (Vice Chair, Airport Authority)
      *   Mid-Bay Air LLC
      *   Fairhope Airport Authority (Sonny Callahan Airport)
      *   Alabama Ethics Commission
      *   Ethics Opinion No. 2016-04
      *   Fairhope, Alabama
    llm_text: Fairhope board member Ray Hix secured a Mid-Bay Air LLC lease despite conflicts, with Jack Burrell chairing the bid committee. The Alabama Ethics Commission confirms the December 2015 lease was never filed, potentially making the agreement null and void.
