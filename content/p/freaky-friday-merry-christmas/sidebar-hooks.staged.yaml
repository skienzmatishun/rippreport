  double-down-and-i-call:
    brief: |-
      THE CONFLICT: Allegations concerning past airplane hanger leases at Fairhope Airport Authority; conflict of interest involving Airport Authority board members and the Fairhope City Council President (Dec 2016).
      THE DISCOVERY: An Ethics Complaint was filed by the Mayor of Fairhope in early December 2016, highlighting that the City Council President sat on the two-man ad hoc committee selecting bids and shared common friendships with other involved parties (including the municipal judge for Fairhope).
      THE PIVOT: Article 2 established the initial allegations and the failure of the Alabama Ethics Commission to fully investigate the conflict of interest (Advisory Opinion 2016-4), providing the historical context for the current defense by Jack Burrell (Article 1).
      KEY ENTITIES: Jack Burrell, Fairhope Airport Authority, Ethics Commission, Mayor of Fairhope, Matt Hart (Alabama Attorney General Special Prosecutor), Honorable Jody W. Bishop, Fairhope City Council President, municipal judge for Fairhope.
    llm_text: Did Fairhope City Council President violate ethics rules during the 2016 Airport Authority hanger lease bids? Jack Burrell defends himself against past conflict of interest claims despite the Ethics Commission's incomplete investigation.
