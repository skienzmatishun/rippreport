  a-time-for-reflection-goobers-on-notice:
    brief: |-
      THE CONFLICT: Prior to 2016, the City of Fairhope had two mayors, and the system allowed the Mayor’s father-in-law to control the counting of casted votes.
      THE DISCOVERY: In August 2016, Karin Wilson achieved an upset victory against #1 Goober Tim Kant in Baldwin County, following oversight from the Alabama Secretary of State’s Office.
      THE PIVOT: The 2016 election upset proved the existence of the dubious system and signaled the end of the "Goober" political class, providing the context for Mayor Wilson's 2017 administration built on transparency and accountability.
      KEY ENTITIES: Karin Wilson, Tim Kant, Baldwin County, City of Fairhope, Alabama Secretary of State’s Office.
    llm_text: Karin Wilson upset Tim Kant in 2016, ending Fairhope's corrupt system where a mayor's father-in-law controlled vote counts. Discover how Wilson used that victory to build a transparent, accountable administration in Baldwin County.
