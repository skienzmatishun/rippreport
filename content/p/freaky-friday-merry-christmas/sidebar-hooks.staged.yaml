  bp-catastrophe-alabama-disgrace:
    brief: |-
      THE CONFLICT: BP oil spill claimed eleven lives and resulted in billions of dollars in damages paid to Alabama (among other states).
      THE DISCOVERY: State and local officials (Governor Bentley, Sen. Trip Pittman, Mayor Kant, former Congressmen Bonner) diverted BP funds away from environmental restoration and necessary infrastructure (e.g., sewer plant) toward personal or pet projects (beach mansion renovation, parks, development).
      THE PIVOT: The misuse and mismanagement of BP restoration funds (including the $11 million Marsh Island project failing due to Clean Water Act violations) established a pattern of corruption and "Alabama Disgrace" that impacts the state's environment and financial integrity.
      KEY ENTITIES: BP; Alabama; Governor Bentley; Sen. Trip Pittman; Mayor Kant; Former Congressman Bonner; Myrt Jones; Baldwin County; Fairhope; Daphne; Marsh Island; Fowl River; Cadillac; Oct. 26 (letter date)
    llm_text: Did Alabama officials like Governor Bentley and Sen. Trip Pittman divert billions in BP oil spill funds away from environmental cleanup? This misuse of money—including the failing $11 million Marsh Island project—reveals a pattern of "Alabama Disgrace" impacting your state's future.
