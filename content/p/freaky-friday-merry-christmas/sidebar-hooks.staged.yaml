  green-acres-on-acid:
    brief: |-
      THE CONFLICT:
      *   Mayor Steve Russo was convicted in Baldwin County in 2006.
      *   State Senator Tripp Pittman was designated trustee of BP funds from Fairhope and Perdido beach.
      *   Pittman received personal contracts totaling $750,000.00 from BP.

      THE DISCOVERY:
      *   Pittman's tractor company acted as a marine contractor without a general contractor’s license, a felony.
      *   Pittman supplied used/defective oil protective boom and failed to ensure hundreds of boom anchors were recovered.
      *   An FBI investigation, Grand jury, and subpoena resulted from a complaint filed with BP and the Alabama Ethics Commission.
      *   The case was transferred to the Alabama Attorney General's white collar crime division but remains unresolved ("collecting dust").

      THE PIVOT:
      *   The historical evidence of Pittman's corrupt use of BP funds and lack of accountability (detailed in the older Widget Article) provides context for his continued political influence (e.g., maintaining municipal contracts for hurricane debris removal in Fairhope).
      *   This history of corruption makes his potential appointment by Luv Gov. Bentley to replace Jeff Sessions highly suspect, linking past illegal activities to current political maneuvering.

      KEY ENTITIES:
      *   Tripp Pittman (State Senator)
      *   Steve Russo (Former Mayor of Baldwin County)
      *   Alabama Ethics Commission
      *   BP
      *   Fairhope
      *   Perdido beach
      *   Alabama Attorney General
      *   Luv Gov. Bentley
      *   Jeff Sessions
    llm_text: Tripp Pittman pocketed $750,000 from BP funds as a trustee for Fairhope and Perdido beach. This history of corruption makes his potential appointment by Gov. Bentley highly suspect—read how his past illegal acts connect to today's political power.
