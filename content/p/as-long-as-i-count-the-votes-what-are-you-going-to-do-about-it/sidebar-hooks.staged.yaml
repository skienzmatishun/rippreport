  pay-executives-first-boy-scouts-come-last:
    brief: |-
      THE CONFLICT:
      *   Fairhope Municipal Elections occurred on August 23, 2012.
      *   A certified Poll Watcher for Mayoral Candidate Lonnie Mixon reported alleged violations and fraudulent behavior in the polling place.
      *   Election Supervisor Mrs. Culver and election official Tom Odom were identified as responsible persons for various process lapses.

      THE DISCOVERY:
      *   The Mobile Area Boy Scout Council, established in 1919, lost over $200,000 annually for nine years (since 2008), with one year topping $311,000 (2015).
      *   Mismanagement and alleged illegal/unethical actions were linked to Executive Director Michael Hartigan (since January 2009) and Board President Phil Webb (2014, 2015, 2016).
      *   A six-month investigation (started November 2015) found about one out of four board members broke the law or lied.

      THE PIVOT:
      *   Both articles document alleged financial, legal, and electoral misconduct within local civic bodies in the Mobile/Baldwin County area.
      *   The 2016 report (Article 2) establishes a documented pattern of financial mismanagement and legal non-compliance by local leaders (Phil Webb, Michael Hartigan) prior to and overlapping with the 2012 election issues (Article 1), suggesting systemic local governance failure.

      KEY ENTITIES:
      *   Lonnie Mixon (Mayoral Candidate)
      *   Tom Odom (Election Official/City of Fairhope Fire Marshall)
      *   Mrs. Culver (Election Supervisor)
      *   Tim Kant (Mayoral Candidate, relative of Tom Odom)
      *   Tucker Dorsey (Baldwin County Commissioner)
      *   Phil Webb (Boy Scouts Board President)
      *   Phil-webb (Boy Scouts Board)
      *   Michael Hartigan (Mobile Area Council Executive Director, since Jan 2009)
      *   Mobile Area Boy Scout Council (established 1919)
