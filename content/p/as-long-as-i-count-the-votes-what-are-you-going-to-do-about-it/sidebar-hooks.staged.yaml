  elected-or-selected:
    brief: |-
      THE CONFLICT:
      1. Mayor Tim Kant was selected in 2000 by former Mayor Jim Nix, who had been forced out of office due to alleged criminal activity.
      2. Nix selected Kant because he needed a controllable figure.

      THE DISCOVERY:
      1. Kant was hired in 1983 as Fairhope's first horticulturist and served four mayoral terms.
      2. The system involved by Kant was characterized by corruption and influence from Nix and Arthor Corte.
      3. The 2012 municipal election observations (9/11/2012) detailed violations including lack of control by Election Supervisor Mrs. Culver, children inserting ballots, and Tom Odom (Fire Marshall/Kant's father-in-law) opening absentee voting machines.

      THE PIVOT:
      1. Article 2 (older) establishes that Mayor Kant's tenure and political power stem from a selection process (2000) rooted in a compromised regime (Nix/Corte).
      2. This historical context proves that the 2012 election irregularities (Article 1) were not isolated incidents but symptomatic of a long-term, systemic corruption structure established during Kant's decades-long tenure.

      KEY ENTITIES:
      1. Tim Kant
      2. Jim Nix
      3. Tom Odom
      4. Lonnie Mixon
      5. Mrs. Culver
      6. Sherry Sullivan
      7. Mike Ford
      8. Arthor Corte
