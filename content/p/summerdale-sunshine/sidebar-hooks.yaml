  guilty-audiobook:
    brief: 'THE CONFLICT:

      - Murray Lawrence Jr. was wrongfully convicted for murder in Baldwin County.

      - Prosecutors in the case included Robert Wilters (then Judge, later District
      Attorney) and David Whetstone (infamous prosecutor).

      - Hoss Mack served as Former Sheriff; his promotion of low-level deputies led
      to Anthony Lowery becoming lead investigator.

      - Anthony Lowery’s investigation found **no evidence** against Lawrence but
      proceeded with conviction anyway.

      - Assistant District Attorney Kristy Haygood filed inaccurate/false statements
      and protected her boss (DA Wilters) from exposure of malicious prosecution,
      helping convict an innocent man.

      - Post-trial facts emerged: advocates discovered that a full autopsy was never
      included in the murder trial.


      THE DISCOVERY (Widget Article):

      - The audio book "GUilty – HEAR THE AUDIOBOOK" exposes the chain of corruption
      behind Lawrence’s conviction.

      - It explicitly labels Lowery and Haygood as guilty of lying, fraud, unethical
      behavior, and self-serving conduct for convicting an innocent man.

      - Haygood is shown to have filed false statements about Lawrence specifically
      to shield Wilters.

      - Lowery’s role is described as having "no field experience, except for carrying
      Mack''s water," yet he was promoted by Hoss Mack to become lead investigator
      despite finding no evidence against Lawrence.

      - Maxwell-Tillman attorneys and Attorney Gabby Humber are named as the parties
      who ultimately pursued justice for Lawrence after the case had stalled; bar
      complaints were filed against both in two states.


      THE PIVOT (Why Article 2 is the "smoking gun" for Article 1):

      - The main Summerdale forum article accuses Kristy Haygood of legal mistakes
      in her Rule 32 filing that disqualify her from judge positions and labels Robert
      Wilters complicit in Lawrence''s case.

      - Article 2 provides the concrete legal and factual foundation for those accusations:
      it documents *exactly* how Haygood filed false statements and protected Wilters,
      and *exactly* how Lowery’s lack of evidence drove the conviction.

      - Because Lowery is a current candidate for sheriff (per both articles) and
      Haygood/Wilters are also current candidates seeking office, Article 2 turns
      their past misconduct into live disqualifying evidence for today''s voters in
      Summerdale.

      - The "discovery" that autopsies were excluded compounds the wrongful conviction
      claim, giving the anti-Baldwin County corruption narrative (central to Summerdale
      forum anger) concrete legal receipts rather than just political rhetoric.


      KEY ENTITIES:

      - Murray Lawrence Jr.

      - Anthony Lowery (Lead Investigator; Candidate for Sheriff)

      - Kristy Haygood (Assistant DA; Judge Candidate)

      - Robert Wilters (Judge in case; Current District Attorney; Retired "thank God")

      - David Whetstone (Infamous prosecutor)

      - Hoss Mack (Former Sheriff; promoted Lowery)

      - Maxwell-Tillman Attorneys

      - Gabby Humber (Attorney who pursued case in 11th hour)

      - Donna Black Givens

      - Jeremiah Giles

      - Jon Gray

      - Scott Boone / Catalyst'
