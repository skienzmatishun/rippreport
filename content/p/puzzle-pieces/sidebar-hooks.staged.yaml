  poison-ivy-bridge:
    brief: |-
      THE CONFLICT:
      - Alleged conflict: I-10 Mobile Bayway bridge/toll project vs. opposition; alleged deeper issue of secret port deal/conspiracy.
      - 2006: Alabama Gov. Bob Riley turned down UAE deal pertaining to Port of Mobile container terminal.
      - During Bob Riley term: Riley proposed largest tax increase in Alabama history; voters defeated it; late in governorship, Riley passed bill giving $80 million to Port of Mobile as part of $300 million investment into container terminal.
      - 2010: Kay Ivey ran for governor, withdrew, ran for lieutenant governor; Robert Bentley won.
      - After Bentley was pressured out by fellow Republicans, Kay Ivey became governor; Ivey passed 10-cent per gallon gas tax in legislature; largest tax increase in Alabama history; first use of tax revenue for Mobile Ship channel deepening/widening; changed wording to classify waterways as roads.
      - I-10 Bayway bridge project went from simple task of coming up with matching funds for federally funded construction project to $2.1 billion mega project; according to Bradly Byrne, ALDOT turned down federal funding; state decided to turn into toll bridge instead of original 80/20 split with federal government; padded cost with 50 years maintenance.
      - Alleged secret deal: Project Pelican between state of Florida, Washington politicians, and UAE; goal to lease Port Canaveral in Florida for 35 years; done behind closed doors; public no knowledge until signed; many politicians involved including Obama, Hillary, scores of Senators and Congressmen; signers from UAE.
      - Port of Wilmington Delaware leased by UAE for 50 years; UAE company Gulftainer signed; Gulftainer owned by royal family of Dubai; controls 40% of all container traffic in Middle East; controls 2 major ports on east coast of US.
      - Main alleges possible 20+ year conspiracy by state to secretly lease port out to foreign country; state funneling money into state docks; as of 16th of last month, Richard Clark new deputy director of Alabama Port Authority, director directly connected to Gulftainer.

      THE DISCOVERY:
      - Article 2, titled Poison Ivy Bridge, showed last night’s meeting opposing Mobile Bridge Toll; one of many springing up around Mobile and Baldwin County.
      - State Sen. Chris Elliott (R-Daphne) said meeting should be moved, not the people; easy to say, now let’s see if Elliott follows up; meeting should be held in Mobile or Baldwin County.
      - Fairhope Mayor Karin Wilson said 100% against toll; State should have invested billion+ dollar BP settlement into two counties that suffered most instead of taking money for own operating budget; why punish tourists and hardworking citizens? How would toll impact tourism revenue?
      - Wilson: critical need for new bridge discussed over decade; to react as though building it now is overnight emergency is absurd; perfect example of government getting away with zero accountability.
      - Wilson: household or business cannot operate with idea that if cannot balance budget force someone else to pay; must budget within means or fail; good incentive having to be accountable.
      - Wilson: As Mayor, tackled City budget same way as business/household; before took office, City relied on half of Utility’s profits (almost $6M annually) to balance budget; in few short years, after cutting wasteful spending and investing in ways to become more productive and efficient, both budgets significantly improved.
      - Wilson: City now self-sustaining and paid off all its debt; Utility Department can use all of its profitable finally to invest in long overdue infrastructure needs.
      - Wilson: Proposing a toll due to lack of strategic planning and budgeting is not the answer.
      - Wilson: State of Alabama stole and misused money from BP; used money to cover up all Goat Hill mistakes, built a Hotel and refurbished Governor’s Beach House.
      - Wilson: State Sen. Pittman, as appointed BP trustee, secured $750,000 in BP money, for his “tractor” company.
      - Wilson: Now Governor Poison Ivy wants to put burden of bridge on backs of those who had BP money squandered by state.
      - Wilson: Many proposals mentioned to reduce/eliminate tolls; A wait until after 2020 elections; B increase contract to 60 years; C Baldwin and Mobile residents will get pass stamp on tags, no toll; if C fails then go for 25% toll, for Baldwin and Mobile County residents, on retail price; $6.00 toll would be $1.50.
      - If all this fails then vote their sorry asses out of office and cover Goat Hill with calamine lotion.

      THE PIVOT:
      - Article 2 is older than Article 1 and should be framed as background/historical context.
      - Article 2 showed opposition to Mobile Bridge Toll; meeting opposition; Sen. Elliott and Mayor Wilson positions.
      - Article 2’s toll opposition frames toll as issue of state accountability, BP money misuse, planning/budgeting, not just financial burden.
      - This supports main article’s larger alleged secret deal/P3 conspiracy and toll distraction.
      - Article 2 is key context for main article because main article discusses toll, BP settlement, Goat Hill, state budget, and deeper conspiracy.

      THE KEY ENTITIES:
      - List specific names, organizations, locations to mention: Bob Riley, Kay Ivey, Karin Wilson, Chris Elliott, Richard Clark, Jo Bonner, Robert Bentley, Bradly Byrne, ALDOT, Gulftainer, Crescent Enterprises, UAE, Dubai royal family, Port Canaveral, Port Wilmington, Port of Mobile, Mobile, Baldwin County, Fairhope, Daphne, Mobile Bayway, I-10, BP, GOMESA, Goat Hill, Washington politicians, Obama, Hillary, Senators, Congressmen, P3 partners, Trump, Amtrak, Choctaw Point, Brookley.
