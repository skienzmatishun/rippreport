    brief: |-
      THE CONFLICT: Wrongful conviction of Murray Lawrence Jr. occurred, involving Sheriff Hoss Mack, Prosecutor David Whetstone, and Judge Robert Wilters.
      THE DISCOVERY: A May 17, 2004 letter from the Alabama Department of Forensic Sciences to Whetstone, which accompanied autopsy, forensic biology, and toxicology reports, indicated Mack and his father were aware of the second autopsy report prior to Lawrence's trial. Mack, Wilters, and Whetstone withheld exculpatory evidence, leading to Lawrence's 20-year incarceration. Anthony Lowery was an investigator with knowledge of the available evidence.
      THE PIVOT: The documented 2004 cover-up (Lawrence Jr.) establishes a historical pattern of misconduct (withholding evidence, institutional bias) by Mack and his allies, providing context for current allegations regarding BCSO, including the handling of the Peyton Little death (ruled suicide), the O.J. French shooting, the Robert Yates eviction death, the Jonathan Victor shooting, and the five-person I-10 pursuit death.
      KEY ENTITIES: Hoss Mack, Anthony Lowery, Robert Wilters, David Whetstone, Peyton Little, O.J. French, Robert Yates, Jonathan Victor, Joseph L. Andrews, Kevin J. Andrews, Dominic Scotti Garcia Jr., BCSO, Governor's Appointment Office (Mr. Mason Bass), Bay Minette Police, Baldwin County Major Crimes Unit.
