      - The previous involvement of Anthony Lowery as an investigator in a wrongful conviction case establishes a direct link between the department's history of misconduct and the current attempt to install him as Sheriff.
      - The past "hanky panky" cover-up validates current claims that the department prioritizes protecting its own over public transparency and justice.

