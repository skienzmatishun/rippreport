  chasing-your-tail:
    brief: |-
      THE CONFLICT:
      *   Dyas lawsuit resulted in a loss of $11.25 million, requiring the city to buy the property.
      *   Council President Burrell negotiated the Dyas legal settlement without public participation.
      *   The Triangle lawsuit cost the city $11.25 million (potential settlement under $1 million).
      *   City council members Boone and Burrell, along with 3 voted-out members, refused to discuss or settle the Triangle lawsuit.

      THE DISCOVERY:
      *   The Catalyst Council was successful in derailing any change of government in Fairhope.
      *   The City Attorney takes orders from the council and keeps the Mayor in the dark.
      *   The council failed to deliver a city budget on time.
      *   The council displayed a total lack of leadership in allowing the Breland case to progress without attempting to settle.

      THE PIVOT:
      *   Article 2 establishes a historical pattern of council obstruction, secretive decision-making (Dyas/settlement), and poor financial management ($11.25M loss) which directly informs the current refusal by Boone and Burrell to settle the Triangle lawsuit and the continued lack of leadership in the Breland case (Article 1).

      KEY ENTITIES:
      *   Mayor Wilson
