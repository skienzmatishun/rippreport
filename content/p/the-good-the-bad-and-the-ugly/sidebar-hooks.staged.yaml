  state-of-the-city-2019:
    brief: |-
      THE CONFLICT:
      *   Triangle Lawsuit cost the city $11.25 million; could have settled for under $1 million.
      *   City Council members Boone, Burrell, and Kant, along with three voted-out members, refused settlement/discussion.
      *   Previous Mayor and Council misused utility funds; previous Mayor drew a second city paycheck from the utility fund of $60,000 a year.

      THE DISCOVERY:
      *   In 2019, the City Debt of $6.83 million was scheduled to be paid in full by June 2019.
      *   Fairhope secured $18 million in BP Restore Act Funded Projects, including $10 million for sewer upgrades, which the previous administration overlooked.
      *   Mayor Wilson ceased the unethical practice of the previous administration drawing a second city paycheck from the utility fund.
      *   Fairhope secured $21 million in Grant funding.

      THE PIVOT:
      *   Article 2 (2019 State of the City) provides concrete financial evidence ($6.83M debt, $18M grant, $60k salary misuse) detailing the financial mismanagement and fractured bookkeeping system inherited from the previous administration, which Article 1 criticizes (e.g., Triangle lawsuit handling, need for sewer upgrades).

      KEY ENTITIES:
      *   Mayor Wilson
      *   Boone
      *   Burrell
      *   Kant
      *   Breland
      *   Catalyst Council
      *   Ronan McSharry
      *   Stephanie Hollinghead (Police Chief)
      *   Marcus McDowell (City Attorney)
      *   Fairhope
    llm_text: Council members Boone, Burrell, and Kant allowed a Triangle lawsuit to cost Fairhope $11.25 million instead of settling for under $1 million. Mayor Wilson stopped the previous administration’s $60k utility fund misuse while securing $21 million in vital grants.
