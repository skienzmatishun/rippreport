  captain-jack:
    brief: |-
      THE CONFLICT:
      - Fairhope, Alabama: Catalyst Council accused of obstruction; alleged goal to overthrow present government in 2020.
      - Mayor Wilson and staff; Mayor “Can’t”; City Council members Boone and Burrell; three council members voted out.
      - Fairhope infrastructure, sewer, planning/zoning issues received new administration attention; Catalyst Council had yet accomplished significant; council agenda obstruction.
      - Triangle lawsuit: cost city 11.25 million; could have been settled for under 1 million; Mayor Can’t, Boone, Burrell, and three voted out refused to settle or discuss settlement.
      - Fairhope prevailed in Breland court; followed unanimous Alabama Supreme Court decision favoring developer Buddy Breland; lower court verdict appealed back to Supreme Court.
      - If Mr. Breland wins lawsuit and all previous project permits expire, Fairhope could face millions in damages; city again held hostage by council more intent on obstruction and Catalyst wishes than community good.

      THE DISCOVERY:
      - Article 2 / Widget: Fairhope Airport Authority special meeting Jan. 8; discussed “notice of availability.”
      - Notice covered many issues; final draft, particularly leases, bidding procedures, fuel farms, revisited from “failed” process in late 2016.
      - Subject of series of Ripp Report articles; first article posted Nov. 2016.
      - Council President Burrell, City liaison on board, showed up late without pen, paper, or notes, borrowed; let Airport Authority Chairman Joe McEnerney know who was Captain.
      - Captain Jack blasted Joe at about minute 14:00.
      - Joe McEnerney, Chairman of Board, guaranteed certain “chosen ones” hanger locations prior to any bid process; Joe gave Ripp Report shout out at end of meeting.
      - Captain Jack made clear no one gets hanger location without Captain Jack’s approval; he should not hold title of city liaison; he has not represented citizens or best interests of community.
      - Captain Jack ran Airport Authority to satisfaction of 1% or less that use Airport; made sure City Attorney and Municipal Judge appointments went as he wished; hopefully all three leave posts in next election.
      - Captain Jack dominated Council President position for 7 years; Council learned what Joe has not: Captain Jack is flying the plane, they are only passengers.
      - Captain Jack needs to be demoted to private.

      THE PIVOT:
      - Article 2 is older / background / historical context: late 2016 failed lease process, Nov. 2016 first Ripp Report article, Jan. 8 special meeting.
      - Main Article 1: Catalyst Council, Triangle lawsuit, Burrell, Boone, Mayor Wilson, City Attorney Marcus McDowell, Ronan McSharry, Buddy Breland.
      - Article 2 is smoking gun / key context for Article 1 because it documents Council President Burrell / Captain Jack control of Airport Authority, failed lease/bidding/fuel farm process, appointments pattern, and City liaison conduct.
      - Connects to Main Article 1’s claims of council obstruction, Burrell / Catalyst influence, and failed governance.

      KEY ENTITIES:
      - Lowery
      - Wilters
      - Fairhope, Alabama
      - Mayor Wilson
      - Mayor Can’t
      - Catalyst Council
      - City Council members Boone and Burrell; three members voted out
