  knock-on-doors:
    brief: |-
      THE CONFLICT:
      - Triangle Lawsuit: Fairhope; cost to city: 11.25 million; potential settlement: under 1 million.
      - Mayor Wilson and city staff; Catalyst Council; City Council members Boone and Burrell; plus 3 council members voted out.
      - Boone and Burrell, with 3 voted out, refused to settle or discuss settlement.
      - Catalyst Council refused to discuss settlement; spent tens of thousands in attorney fees and court costs.
      - Mayor Wilson and staff; Catalyst Council agenda described as obstruction; goal to overthrow present government in 2020.
      - Buddy Breland: Alabama Supreme Court unanimously favored developer; lower court verdict now being appealed back to Supreme Court.
      - Ronan McSharry / McSharry Bar and Restaurant: charges never heard on scheduled date; delayed until March; McSharry green card holder, not U.S. citizen; bad behavior; drunken assaults and harassment.
      - Marcus McDowell: City Attorney; poor job protecting community; past offenses not enough; did good job protecting council, especially Burrell, with tax dollars; changed voting date at last minute; provided 1 voting booth per precinct; long waits to vote.

      THE DISCOVERY:
      - Article 2: “KNOCK ON DOORS”; source: Lagniappe Mobile.
      - Baldwin County experiencing explosion of growth, especially middle and coastal part.
      - 2018: no mega deals developed for Baldwin County; county enjoyed stellar year of growth in manufacturing and retail; Baldwin County number one in state in incoming business, workforce talent attraction, and job growth.
      - Baldwin County gain of 200 jobs; four new or relocated companies; 200 jobs gained; offset by 200 job loss; lack of manufacturing.
      - North Baldwin still has onion/mega site; nobody knocking on doors, full time, trying to sell mega site; nobody; waiting on phone to ring.
      - Baldwin County Commission, State Senator and Representatives, and Mayors should look for sales people who knock on doors.
      - Specific marketing approach should target large and small scale manufacturing in North Baldwin; possible incentives for independent sales people; more knocking on doors better.
      - Stop waiting for the phone to ring, knock on doors.

      THE PIVOT:
      - Article 2 is older than Article 1; frame as background/historical context.
      - Article 2 showed/revealed Baldwin County economic development context as of 2018.
      - Article 1 Fairhope conflict involves Catalyst Council, Triangle Lawsuit, council, development, obstruction, and local government.
      - Article 2 context of Baldwin County growth, mega site, lack of manufacturing is key background for Article 1.
      - Article 2 is the “smoking gun” or key context because its “knock on doors” theme and inaction contrast with Article 1’s accusations of obstruction, Catalyst Council, and council inaction.

      KEY ENTITIES:
      - Lowery, Wilters, etc.
      - Fairhope, Alabama
      - Mayor Wilson
      - Catalyst Council
      - City Council members Boone and Burrell
      - Buddy Breland
      - Triangle Lawsuit
      - Ronan McSharry / McSharrys / McSharry Bar and Restaurant
      - Marcus McDowell
      - Baldwin County Commission
      - Baldwin County, Alabama
      - Lagniappe Mobile
      - North Baldwin
      - Onion/Mega Site
      - State Senator and State Representatives
      - Baldwin County Mayors
      - Dean Mosher
      - Matt Bowers
      - Kant
      - McSharrys
      - Boone, Burrell, Breland, Catalyst, McSharry, Ronan, Triangle Lawsuit, Wilson
    llm_text: Fairhope’s Mayor Wilson and the Catalyst Council refused to settle the Triangle Lawsuit, even as Baldwin County booms with manufacturing growth. Buddy Breland’s Alabama Supreme Court win and the call to knock on doors show how local obstruction and missed economic opportunity collide.
