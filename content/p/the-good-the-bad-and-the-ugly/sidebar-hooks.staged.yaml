      *   Kant
      *   mcdowell
      *   Triangle Lawsuit ($11.25 million)
      *   Buddy Breland
      *   Dean Mosher
      *   Matt Bowers
      *   Breland court decision (favored developer, appealed to Alabama Supreme Court)
    llm_text: Marcus McDowell defied the Mayor since 2018, tying his insubordination to Captain Jack's 2020 Catalyst agenda. Learn how McDowell protected council members like Jack Burrell instead of serving the community.
