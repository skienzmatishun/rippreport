      - Joe McEnerney, Airport Authority Chairman
      - Burrell / Captain Jack
      - Joe / Captain Jack
      - Dean Mosher
      - Matt Bowers
      - Ripp Report
      - Fairhope Airport Authority
      - Alabama Supreme Court
      - City Attorney / Municipal Judge appointments
    llm_text: Captain Jack dominated Fairhope’s Airport Authority while Council President Burrell played along, and the failed 2016 lease fight shows how Catalyst Council’s obstruction reached the Triangle lawsuit. If Buddy Breland wins, Fairhope could pay millions instead of settling for under one million.
