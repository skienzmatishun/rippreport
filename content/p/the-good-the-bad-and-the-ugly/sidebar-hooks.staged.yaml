hooks:
  communication:
    brief: |-
      THE CONFLICT:
      *   Oct 2018: Lack of communication between Mayor’s office and City Attorney Marcus McDowell began regarding Golf Course equipment.
      *   Jan 28th: Fairhope City Council meeting demonstrated City Attorney McDowell and Council President Captain Jack making decisions without advising the Mayor.
      *   Past: McDowell was a holdover from the Mayor Can’t era; Captain Jack and the Council selected McDowell to support a Catalyst overthrow attempt in 2020.
      *   Past: McDowell and Captain Jack compounded a Federal lawsuit (school yard brawl) which was ultimately settled by the City’s insurance company.
      *   Past: Council and City Attorney ignored police report about Mr. Burrell.

      THE DISCOVERY:
      *   Article 2 (Widget) established that the relationship between Mayor and City Attorney McDowell was characterized by insubordination and lack of communication dating back to Oct 2018.
      *   Article 2 revealed the suspicious connection between City Attorney Jack Burrell and Ronan McSharry (McSharrys bar/restaurant features a J. Burrell sandwich).
      *   Article 2 noted McDowell's past representation of citizens against McSharry's assaults/harassment.

      THE PIVOT:
      *   Article 2 provides the historical context proving that City Attorney McDowell was aligned with the Catalyst political agenda (2020 overthrow) and was insubordinate to the Mayor, not just an administrative failure.
      *   This context shows that the City Attorney's poor performance (e.g., handling the Triangle lawsuit, delaying McSharry charges) is not isolated but tied to political obstruction and protecting council members (like Burrell) rather than the community interest.

      KEY ENTITIES:
      *   Marcus McDowell (City Attorney)
      *   Captain Jack (Council President)
      *   Mayor Can’t
      *   Ronan McSharry
      *   McSharry Bar and Restaurant (McSharrys)
      *   Jack Burrell (Council member)
      *   Catalyst Council
