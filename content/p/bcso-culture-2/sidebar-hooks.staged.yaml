      THE CONFLICT:
      *   Murray Lawrence Jr. was wrongfully convicted; Anthony Lowery was the lead investigator for the District Attorney.
      *   Stephen Nodine was subject to a political hit piece/murder trial involving Mack and Lowery.
      *   Johnathan Victor was killed in a 2017 shooting, cleared by a federal jury regarding Deputy Lt. Matthew Hunady.
      *   OJ French was shot to death in Bay Minette after being stopped for a broken taillight, ruled "justified" by the Baldwin County Major Crimes Unit.
      *   A deadly interstate crash involving sheriff Hoss Mack claimed five lives.
      *   Anthony Lowery is the current appointed sheriff, having adopted a culture developed by former sheriff Hoss Mack.

      THE DISCOVERY:
      *   Article 2 details specific historical instances (Lawrence Jr. conviction, Victor shooting, Nodine trial, French death) demonstrating the BCSO culture of blanket immunity, no transparency, and no accountability.
      *   Article 2 reveals that during the Lawrence Jr. case, Hoss Mack, Judge Robert Wilters, and David Whetstone hid exculpatory evidence.

      THE PIVOT:
      *   Article 2 provides the historical evidence of documented, past failures (e.g., Victor, Nodine, Lawrence Jr.) that establish the long-standing, systemic "Absolute Immunity" culture that Article 1 asserts exists in the BCSO, tracing it specifically back to Hoss Mack and Anthony Lowery.

