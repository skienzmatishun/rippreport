      THE CONFLICT:
      Murray Lawrence Jr. was wrongfully convicted of a capital murder in Baldwin County in 2005 for the murder of Brandon Hastings.
      The conviction was based on the coerced testimony of Jarius McNeil, who shifted blame onto Murray.
      Key exculpatory evidence (no DNA, no fingerprints, strangulation in Mississippi vs. claimed shooting in Alabama) was suppressed.

      THE DISCOVERY:
      The four figures who built the case (Wilters, Lowery, Mack, Whetstone) now hold high positions in Baldwin County government, demonstrating the systemic power structure.
      Robert Wilters is the Baldwin County DA (since approx. 2015).
      Anthony Lowery is the current appointed Baldwin County Sheriff (appointed by Governor Kay Ivey).
      Hoss Mack established the law enforcement culture within BCSO.

      THE PIVOT:
      Article 2 provides the concrete historical evidence (Murray Lawrence Jr.'s case) that proves the "absolute immunity" and "good ole boy system" described in Article 1, showing how BCSO and the local DA’s office collaborated to secure and maintain a wrongful conviction for over 20 years.

