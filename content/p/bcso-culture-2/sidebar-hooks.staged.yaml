      *   The conviction relied on coerced testimony from Jarius McNeil and ignored exculpatory evidence (no DNA, no fingerprints; autopsy showed strangulation in Mississippi, not shooting in Alabama).

      THE DISCOVERY:
      *   The four men who built the 2005 case (Wilters, Lowery, Mack, Whetstone) now hold high institutional power (DA, Sheriff, state positions), enabling continued influence and blocking postconviction relief (e.g., Wilters rejecting Rule 32 in 2023).
