  sheriff-huey-boss-mack-secret-police-2:
    brief: 'THE CONFLICT: What happened in the past? (Names/Dates)

      - Hoss "Boss" Mack served as Baldwin County Sheriff for roughly 18+ years; his
      "absolute immunity" culture was passed to his successor Anthony Lowery.

      - Jonathan Victor: May 2017, shot 4 times from 7 yards with a high-powered rifle
      by BCSO Deputy Mark Hunaday; found unarmed (single-car accident turned killing);
      qualified immunity case in the 11th Circuit.

      - Robert Yates: March 5, 2018, SWAT breached his home during an eviction dispute
      and fired 114+ rounds with tear gas/concussion grenades after he fired only
      one warning shot; "not exigent or emergency"; BCSO video/audio described as
      "selective." Deputy Justin Correa (son of Robert Correa) allegedly participated;
      Robert Correa warned his son about a conflict of interest.

      - Kevin J. Andrews & Joseph L. Andrews: Died when Dominic Garcia Jr.''s vehicle,
      chased by BCSO in a wrong-way pursuit on I-10 at 110 mph, smashed into them;
      3 burned to death, 2 died in the accident; BCSO released almost no info.

      - Peyton Little: Found strangled by seatbelt (had to be cut off) in a moving
      car, declared suicide without questions; was allegedly a confidential informant
      for Bay Minette who received threats; investigating deputy not informed of his
      status/threats; Lowery told the family "Peyton wanted to die."

      - William "Bill" Smith: Died June 6, 2021, while patrolling on a four-wheeler
      without a life vest; agencies continue to investigate.

      - Murry (Bubba) Lawrence Jr.: Convicted and sentenced to life without parole
      in part based on work by Anthony Lowery (then DA''s lead investigator); no physical
      evidence (gun, witness, fiber, fingerprints, blood, DNA) and multiple alibi
      witnesses; exculpatory autopsy not disclosed at trial; Sheriff Mack, Prosecutor
      David Whetstone, and Judge Robert Wilters withheld the evidence.

      - Hoss Mack Funeral Home: Private business of Sheriff Mack received a county
      contract to handle deceased persons in "special circumstances," creating an
      obvious conflict of interest.

      - BCSO investigated its own officers for these deaths and never requested FBI
      or ALEA help.


      THE DISCOVERY: What Article 2 revealed

      - In 2021 (decision issued Sep 30, 2021 / Sept 24–25, 2021), the Alabama Supreme
      Court upheld BCSO’s denial of Lagniappe’s public records request for files related
      to the 2017 Jonathan Victor shooting.

      - Records fell under a "investigative writings or recordings" exemption, effectively
      closing public access to law-enforcement records connected to investigations
      in Alabama.

      - Chief Justice Tom Parker: "…spells the end of public access to law-enforcement
      records that are connected in any way to an investigation … The statute might
      as well be titled the Closed Records Act."

      - Dennis Baily (Alabama Press Association chief legal counsel): decision shrinks
      access to body-cam video, 911 transcripts, and autopsy info typically available
      in other states.

      - Judge William Cassady (U.S. District Court): standard for excessive force
      clearly established against Deputy Hunaday; plaintiff made adequate showing
      of a recurring situation presenting an "obvious, highly predictable potential
      for violation" that can trigger failure-to-train liability even without a pattern
      of violations.

      - BCSO lacked crisis intervention teams and de-escalation training as of May
      2017 (Victor case); video/audio described as "selective"; the Victor case may
      hold BCSO liable "and cost millions."


      THE PIVOT: Why Article 2 is the "smoking gun" for Article 1

      - Article 1 claims BCSO culture = absolute immunity with no accountability/transparency,
      and that BCSO investigates itself (Major Crimes Division) while ignoring citizen
      complaints.

      - Article 2 proves this legally: courts (11th Circuit on Victor, Alabama Supreme
      Court in Lagniappe) shielded BCSO''s internal investigations from public records,
      so the "accountability" system is structurally blocked—the people who are supposed
      to check the sheriff cannot see the evidence.

      - This creates an environment where corrupt/erroneous decisions (Victor, Yates,
      Andrews, Little, Lawrence Jr.) remain unchecked by law, which is what Lowery
      inherited and continues under his tenure as appointed sheriff (won re-election
      May 2026 against Matt McKenzie).

      - Article 1’s demand for a "change" or an end to BCSO self-investigation is
      the direct consequence of Article 2’s legal findings.


      KEY ENTITIES: Names, organizations, locations

      - Anthony Lowery (current/appointed Baldwin County Sheriff; DA lead investigator
      on Lawrence case)

      - Hoss "Boss" Mack (former Baldwin County Sheriff, ~18+ years)

      - Matt McKenzie (BC Commission member; opposing candidate in sheriff race; campaign
      kickoff Jan. 15 at Oak Hollow Farm)

      - Mark Hunaday (BCSO Deputy, Victor shooting)

      - Justin Correa / Robert Correa (deputy/father in Yates case)

      - Jonathan Victor, Robert Yates, Kevin J. Andrews, Joseph L. Andrews, Dominic
      Garcia Jr., Crystal Lee Moradie, Payton Leigh Northcutt, Peyton Little, William
      "Bill" Smith (victims/parties)

      - Murray Lawrence Jr. / Murry "Bubba" Lawrence Jr. (wrongfully incarcerated
      man)

      - David Whetstone (Baldwin County DA/Prosecutor)

      - Judge Robert Wilters (trial judge in Lawrence case)

      - Judge Scully, William Cassady (11th Circuit), Tom Parker (Chief Justice of
      Alabama), Dennis Baily (APA legal counsel)

      - Baldwin County Sheriff’s Office (BCSO) / Major Crimes Division

      - Lagniappe (local media group that sought records; lawsuit filed June 2021)

      - ALEA, FBI (external agencies that BCSO never engaged)

      - Catalyst → Scott Boone Consulting ("good ole boy" political group)'
    widget_date: 2023-11-20
    generated_at: '2026-09-02T06:58:43.055557Z'
  JUDGE-VS-SHERIFF:
    brief: 'THE CONFLICT

