  a-reckoning-is-predicted:
    brief: "THE CONFLICT:\n- Murray Lawrence Jr. was convicted in 2005 of the murder\
      \ of Brandon Hastings (killed 2003, allegedly shot in Alabama but autopsy proved\
      \ strangled in Mississippi), sentenced to life without parole despite no physical\
      \ evidence (no DNA, no fingerprints, no weapon).\n- Four individuals responsible\
      \ for his conviction: Robert Wilters (presiding Circuit Court Judge at trial;\
      \ became Baldwin County DA ~2015); Anthony Lowery (Chief Investigator with DA's\
      \ office in 2005; testified at trial; appointed BCSO sheriff by Governor Kay\
      \ Ivey); Huey \"Hoss\" Mack (Lead Investigator and Captain of BCSO; allegedly\
      \ coerced the actual killer Jarius McNeil into shifting blame onto Murray; controlled\
      \ access to evidence including body handling at his own funeral home; retired\
      \ as BCSO sheriff); David Whitstone/Whetstone (DA who prosecuted Murray and\
      \ offered a plea deal to Jarius McNeil, admitted in court he \"made a deal with\
      \ the devil\").\n- The case is described as one where key exculpatory evidence\
      \ was suppressed during trial. Alibi witnesses were never called, forensic evidence\
      \ ignored.\n- Baldwin County DA rejected Murray's Rule 32 filing for postconviction\
      \ relief in 2023.\n- BCSO self-investigation: uses own Major Crimes Division;\
      \ culture described as \"absolute immunity.\"\n- The four named individuals\
      \ have all risen to higher office or remain powerful despite the conviction\
      \ (Lowery currently Sheriff, Wilters current DA).\n\nTHE DISCOVERY:\n- A book\
      \ (\"Life Without Jurisdiction\") documenting the wrongful conviction is at\
      \ publisher; a TV documentary is in production. Both will bring national attention\
      \ outside GOB control.\n- The book and documentary will expose the four individuals\
      \ involved in Lawrence's conviction as guilty of judicial/prosecutorial malfeasance.\n\
      - Kristi Hagood was recruited by consultants Jon Gray and Scott Boone (of Scott\
      \ Boone Consulting, former Catalyst) specifically for her role in the Lawrence\
      \ case; the consultants were paid to represent her despite knowing she \"was\
      \ not qualified\"—\"Hagood was qualified to become a judge but she was qualified\
      \ to represent the GOB's.\"\n- Jon Gray and Scott Boone were hired by the top\
      \ GOB tier (Wilters, Mack) to recruit Hagood into judgeship; they cared less\
      \ about her credibility than cashing checks (\"MONEY < MONEY < MONEY\").\n-\
      \ Hagood is now an elected judge with a \"legacy of disgrace\" before being\
      \ sworn in.\n- Hoss Mack is trying to become head of ALEA (Alabama Law Enforcement\
      \ Agency)—the very agency that should investigate BCSO—described as \"the downfall\
