      Justice Greg Shaw (Majority Judge in *Lagniappe v. Mack*)

      Chief Justice Tom Parker (Dissent Judge in *Lagniappe v. Mack*)

      Alabama Law Enforcement Agency (ALEA)

      Baldwin County Major Crimes Division'
