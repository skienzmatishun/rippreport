      2. THE DISCOVERY

      - Documents reveal Hoss Mack knew of Murray Lawrence Jr.''s second autopsy report
      before the trial.

      - May 17, 2004: Alabama Department of Forensic Sciences sent autopsy reports
      to Whetstone; Hoss Mack and his father were CC''d on this letter.

      - Wilters signed the order allowing the autopsy; Whetstone, Mack, and his father
