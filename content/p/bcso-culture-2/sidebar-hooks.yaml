  letter-to-ag-elections:
    brief: 'THE CONFLICT:

      - Former Sheriff Hoss Mack established a "culture of absolute immunity" at the
      Baldwin County Sheriff''s Office (BCSO), where deputies and officers face no
      accountability or transparency for their actions.

      - The current elected position is now vacant; Governor-appointed Anthony Lowery
      was selected to fill the role after the previous elected sheriff resigned to
      pursue another political position.

      - Over the past 18 years, the BCSO has been characterized by numerous unjustified
      killings of citizens, unsolved cases, and ignored citizen complaints, all justified
      under the Major Crimes Division''s internal investigations.

      - Lowery was specifically cited as the lead investigator for a District Attorney
      prosecution that resulted in the conviction of an innocent man, Murray Lawrence
      Jr.

      - A local political group originally known as "Catalyst" (now "Scott Boone Consulting")
      is described as an organized "good ole boy" network that exclusively supports
      candidates loyal to its members.


      THE DISCOVERY:

      - Francis Paul Ripp, writing on May 17, 2026, states he has contacted the Secretary
      of State and Director of Elections regarding "suspected and strongly alleged
      reports of elections being fixed involving numerous races in Baldwin County,
      in the past."

      - The letter highlights that the Sheriff is the official "custodian of the ballot
      boxes," raising immediate red flags for election integrity given the BCSO''s
      lack of transparency.

      - Ripp points out that Baldwin County has seen a surge in public participation
      and population growth, fueling a rejection of the entrenched political status
      quo.


      THE PIVOT:

      - Article 2 provides a specific administrative vulnerability (the Sheriff holding
      custody of ballot boxes) and documented history of potential election manipulation
      within the same system that protects Anthony Lowery''s office.

      - It confirms that the "absolute immunity" culture detailed in Article 1 is
      not just internal to policing but actively threatens electoral integrity, making
      the upcoming election a high-stakes fight for democratic control against entrenched
      corruption.


      KEY ENTITIES:

      - Anthony Lowery (Current Appointed Sheriff)

      - Hoss Mack (Former Sheriff, architect of the BCSO culture)

      - Murray Lawrence Jr. (Wrongfully convicted man investigated by Lowery)

      - Jeff Elrod (Director of Elections)

      - Wes Allen (Secretary of State)

      - Francis Paul Ripp (Author of the letter/The Ripp Report)

      - Matt McKenzie (Rip''s candidate for Sheriff)

      - Scott Boone Consulting (Former Catalyst, political lobbying group)

      - Oak Hollow Farm (Location of the January 15th campaign event)'
