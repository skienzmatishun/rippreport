      - Wrongful conviction of Murray Lawrence Jr.; Anthony Lowery was lead investigator
      for District Attorney in that case.

      - Organized "good ole boy" group supports only loyalists; formerly Catalyst,
      now Scott Boone Consulting.

      - Recommendation for change includes voting out Lowery and supporting Matt McKenzie
