      Trip Pittman sponsored Senate Bill 312 ten years ago to set qualifications eliminating
      Sheriff competition for Hoss Mack. Three years prior to 2013 Bill, Sen. Trip
      Pittman awarded himself $750,000 B/P money. Recent incident: Judge ruled improperly
      against BCSO seizing man''s Camaro; Sheriff and DA Robert Wilters asked judge
