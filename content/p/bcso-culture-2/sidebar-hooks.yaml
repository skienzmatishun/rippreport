      THE DISCOVERY

      2021 ruling in *Lagniappe v. Mack* confirmed lack of transparency; Associate
      Justice Greg Shaw wrote majority decision stating law enforcement investigative
      reports are not public records. Chief Justice Tom Parker was sole dissent against
      this majority decision. Robert Wilters and Hoss Mack have 30-plus year relationship
      described as joined at the hip; Sheriff pressures District Attorney to manipulate
      outcomes. Internal Baldwin County Major Crimes Division investigates officer-involved
