  po-po-hoss-mack-ccuo:
    brief: '1. THE CONFLICT

      - Baldwin County Sheriff Office (BCSO) established culture of "Absolute Immunity"
      where they investigate themselves using Major Crimes Division.

      - Former Sheriff Hoss Mack developed this culture; passed on to current appointed
      Sheriff Anthony Lowery.

      - Record of 18 years includes cases where officer deaths were "JUSTIFIED" by
