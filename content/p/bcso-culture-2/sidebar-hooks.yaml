      material from public/media access. Article 2 confirms the "good ole boy" political
      network (Pittman/Mack/Wilters) that allowed Hoss Mack to secure the Sheriff
      position, which Article 1 links to current corruption by Anthony Lowery.


      KEY ENTITIES

      Hoss Mack (Sheriff)

      Anthony Lowery (Current Appointed Sheriff)

      Robert Wilters (District Attorney)

      Murray Lawrence Jr. (Wrongfully Convicted Man)

      Matt Hunady (Deputy involved in motorist shooting case)

