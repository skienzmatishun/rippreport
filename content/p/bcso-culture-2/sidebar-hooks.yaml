      \ be NOT elected and demands BCSO not investigate itself (ALEA should do it).\
      \ It identifies Lowery as the lead investigator in Lawrence's conviction but\
      \ presents it generally.\n- Article 2 is the \"smoking gun\" because it:\n \
      \ (a) Documents HOW Lowery built the case (DA office chief investigator, testified\
      \ at trial, suppressed evidence) rather than just naming him.\n  (b) Shows the\
      \ system is self-reinforcing—the same corrupt individuals who convicted Lawrence\
      \ are now in higher positions controlling investigations and policy.\n  (c)\
      \ Explains WHY ALEA can't investigate BCSO if Mack tries to become head of it—the\
      \ very body that should police BCSO would be led by its former corrupt leader.\n\
      \  (d) Proves the \"GOB control\" conspiracy is real: consultants paid to recruit\
      \ judges with baggage, money flowing from GOB elites to protect their interests.\n\
      \nKEY ENTITIES:\n- Anthony Lowery (BCSO Sheriff, appointed by Gov. Kay Ivey,\
      \ lead DA investigator in Lawrence case)\n- Huey \"Hoss\" Mack (former BCSO\
      \ sheriff, former DA office chief investigator, allegedly coerced actual killer\
      \ McNeil; currently seeking ALEA head position)\n- Robert Wilters (Baldwin County\
      \ DA since ~2015, was presiding judge at Lawrence trial, rejected Rule 32 filing\
      \ in 20"
