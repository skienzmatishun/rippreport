  hi-jack-ed:
    brief: "THE CONFLICT: In 2016 (closing out the year), a major political and financial battle erupted in Fairhope, Alabama, over the Fairhope Airport Authority. The City of Fairhope was annually funneling half a million dollars—nearly $200,000 more than the city contributed to education—into the Airport Authority with zero public oversight or questions asked. The conflict intensified when Mayor Kant (the previous mayor) established an authority that operated entirely outside citizens' interests, and newly elected Mayor Karin Wilson attempted to exercise an option in the original loan allowing the city to take back 258 acres of land for $10.00 if the principal was not paid off by 2012. Fairhope City Council President and airport liaison Mr. Burrell mocked Mayor Wilson's focus on the citizens, defended the Airport Authority, and sat on an ad hoc committee overseeing airplane hangar bids despite massive conflicts of interest. \n\nTHE DISCOVERY: Article 2 (from late 2016/early 2017) revealed that the Fairhope Airport Authority was operating as a \"black hole for information\" that consumed 21% of the city's budget while serving 1% or less of the population. It exposed entrenched local corruption, detailing how board members possessed direct personal and financial conflicts of interest, and how City Council President Mr. Burrell actively colluded with the Airport Authority, dismissed transparency, and manipulated newly elected council members to block Mayor Wilson's attempts to reclaim city-owned land and debt service accountability. \n\nTHE PIVOT: Article 2 serves as the ultimate \"smoking gun\" and foundational historical context for Article 1 because it shows that the political corruption, \"good ole boys\" networks, and targeting of Mayor Karin Wilson by the city council are not new developments in 2020, but rather a continuation of a decade-long municipal war. The exact same systemic corruption, self-dealing, and defense of private interests over taxpayers—exemplified by the Airport Authority fight in 2016—are what forced the founder of The Ripp Report to classify Fairhope's local government as \"corrupt as a three dollar bill\" and set the stage for the 2020 \"COMBAT\" against the CATALYST faction.\n\nKEY ENTITIES:\n- Mayor Karin Wilson\n- Mr. Burrell (Fairhope City Council President and Airport Authority liaison)\n- John Sharp (Al.com journalist)\n- Jane Nicholes (Lagniappe journalist)\n- Ron Sivak (Lagniappe journalist)\n- The Ripp Report\n- Fairhope Airport Authority\n- Fairhope City Council\n- CATALYST"
    llm_text: Read how Mayor Karin Wilson battled a 2016 municipal black hole when the Fairhope Airport Authority devoured 21% of the city budget with zero public oversight. Read how Council President Mr. Burrell defended this corruption, proving today's local political wars are a decade in the making.
