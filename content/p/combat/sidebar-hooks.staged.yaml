  backstory-podcast-12:
    brief: |-
      THE CONFLICT:
      - March 1968, Tet Offensive: Marine combat engineer stationed in Dong Ha, Vietnam, not far from the DMZ.
      - Base was hit so often that “incoming” was something heard every day; author was the one to yell “incoming”; later learned a North Vietnamese rocket just barely overshot their location and hit an ammo dump; secondary explosion was far worse than the initial blast.
      - Author went for the ground but did not quite make it when the concussion from the blast reached his body; severe body concussion.
      - Combat buddies told him he was thrown about the length of a football field, landing against a bunker twisted like a pretzel; they thought he was dead; he did too; it turned out to be a severe body concussion.
      - Next thing he knew: underground Air Force field hospital in Dong Ha; woke to total confusion, ears ringing so loud he could hardly hear, yelling and crying took up the oxygen in the room; took a while to come around; realized he had all his body parts.
      - In the hospital next to him: a Marine lost his arm; the Marine on the other stretcher had multiple shrapnel wounds; all author wanted was to leave; outside he passed several body bags.
      - Author made one of the biggest mistakes of his life by refusing the Purple Heart; no way could he fill out those papers after what he had seen in that hospital; that mistake resulted in a Veterans Claim that has lasted 51 years and still pending.

      - December 1968: first visit to the Veterans Hospital in Birmingham, Alabama, 51 years ago; since that time he has had 14 shoulder operations and a kidney removed as a result of his tour of duty as a young Marine in Vietnam.
      - Today: reports to the same hospital for his 15th operation, a complete reverse left shoulder replacement.

      - In 2010: author was classified 100% disabled; that same year decided to form the Ripp Report as a non profit consumer organization focusing on political corruption, specifically Fairhope, where corruption was the oil for the machine.
      - For over 10 years The Ripp Report has been reporting on Fairhope politics; recently began covering Baldwin County.

      - Fairhope with all its pretty flowers has a very dark secret, political corruption; those smelling the flowers and drinking the wine in Fairhope are ignorant of corruption; that ignorance has cost taxpayers millions.

      - Current City Council who appoint the Municipal Judge and the Municipal Attorney are ALL as corrupt as a three dollar bill; they pretend to be your friends and public servants all the while fleecing the taxpayers for personal gain; everyone of these thieves has used their office for personal gain.

      - Elect a new City Council and they will appoint a new Judge and Municipal attorney.

      - Mayor Wilson, a public servant, has been the stumbling block that has prevented the overthrow of the Fairhope government.

      - In 2020, CATALYST, the good ole boys plan on using every means possible to gain control of Fairhope City Hall; if they are successful, say goodbye to Fairhope and your property values.

      - They better be ready for COMBAT.

      - The Ripp Report, Baldwin County Legal Eagle, and Backstory Podcast is going to do everything possible to expose these crooks for what they are; Fairhope needs public servant candidates for City Council; please consider running for office or support new candidates; Fairhope fate is on the line.

      THE DISCOVERY:
      - Article 2, BACKSTORY PODCAST #12, image context: aerial view of a residential area overlaid with a white layout, pink and white zones, red property lines, and text requesting PUD ordinance inclusion.
      - At the time, Article 2 revealed background/context through the Backstory Podcast framing and the PUD ordinance inclusion map.

      THE PIVOT:
      - Article 2 is the smoking gun or key context for Article 1 because Article 1 (COMBAT) is built on the author’s Vietnam injury, refusal of the Purple Heart, pending Veterans Claim, and passion for the Constitution of the United States and good government, then shifts to exposing political corruption, the silent tax, in Fairhope.
      - The Backstory Podcast #12 provides backstory/context (PUD ordinance inclusion) that serves as background for the Fairhope political corruption conflict covered in Article 1.

      THE KEY ENTITIES:
      - Author: Marine combat engineer; Lowery per briefing.
      - Vietnam; Dong Ha; DMZ; Tet Offensive; March 1968; Air Force field hospital.
      - Birmingham, Alabama; Veterans Hospital; Purple Heart; Veterans Claim; 100% disabled; 2010; 14 shoulder operations; kidney removed; 15th operation; complete reverse left shoulder replacement.
      - The Ripp Report; Fairhope; Baldwin County; City Council; Municipal Judge; Municipal Attorney; Mayor Wilson; CATALYST; Backstory Podcast; Baldwin County Legal Eagle; COMBAT; Constitution of the United States; good government; political corruption; silent tax; Fairhope City Hall; property values.
      - Wilters.
