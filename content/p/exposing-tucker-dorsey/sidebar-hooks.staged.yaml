      THE PIVOT: The widget article established the pattern of conflicts (e.g., Fidler/Scroggins marriage, Pittman/Hoss Mack billboard ads, grant misspending) and the involvement of Tim Kant in Fairhope, providing the foundational context for the later claim in the main article that Pittman and Kant were involved in the $639,000 theft.
