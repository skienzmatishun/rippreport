  how-stupid-are-we-baldwin-county:
    brief: |-
      THE CONFLICT:
      BP Boom Grant Scandal involving Senator Lee "Trip" Pittman, Bob James, and Tucker Dorsey; grant theft of $639,000 from the City of Fairhope; annual passing of the Fairhope Emergency Debris Removal contract between Pittman and James since 2007; firing of county employees Leigh Ann Ryals, Michael Thompson, and Scott Barnett after the scandal.

      THE DISCOVERY:
      Article 2 (August 2010) revealed Pittman and James shared lucrative debris removal contracts, listed each other as sub-contractors, and that Pittman utilized City of Fairhope resources (three-year lease on heavy equipment, $4,550 expense for R&R Billboards/Reagan Scroggins) for personal gain, supported by FOIA documents.

      THE PIVOT:
      Article 2 establishes the historical pattern of corruption (contract abuse, employee retaliation, and grant misuse) that forms the background context for Article 1's claims regarding current conflicts of interest, Dorsey's micromanager behavior, and the ongoing investigations/grand jury mentioned in both articles.

