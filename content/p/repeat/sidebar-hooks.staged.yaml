  fairhope-a-city-owned-by-outside-interests-and-good-ole-boys:
    brief: |-
      THE CONFLICT:
      *   In 2016, Mayor Kant and Arthur Corte were linked to corruption regarding the Fly Creek Apartments approval.
      *   The Triangle lawsuit was settled without public participation for $11.25 million.
      *   City borrowing included $5.25 million, $3 million for attorneys, and $3 million taken from the utility reserve fund.
      *   The Triangle Nature Trail Park development involves Thompson Engineering and a cost of approximately $1 million on a $11.25 million acquired property.
      *   The soccer complex was priced at $6 to $7 million.
      *   Councilwoman Diana Brewer sided with the Mayor on the Fly Creek Apartments issue.
      *   Councilmen Mueller and Boone pledged one term but later supported Kant.
      *   Mayor Kant's 2016 re-election contributions involved over 50% of non-Fairhope residents and anonymous PAC donations.

      THE DISCOVERY:
      *   Article 2 revealed a pattern of non-public deals (Fly Creek, Triangle) and financial mismanagement (Triangle settlement, soccer complex costs) under Mayor Kant and his associates.
      *   Article 2 established that key council members (Brewer, Mueller, Boone) were aligned with the Mayor, contrasting with Jack Burrell.

      THE PIVOT:
      *   Article 2 provides the historical evidence (2016 deals, lack of public participation) that establishes the "good ole boys" network and lack of transparency that Article 1 claims continues into 2018, leading to the Fairhope City Council obstructing the newly elected Mayor's efforts toward transparency and accountability.

