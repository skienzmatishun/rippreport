  job-with-benefits:
    brief: |-
      THE CONFLICT:
      *   Fairhope City Council spent a whole year obstructing the newly elected Mayor.
      *   Early on, "Kant ran Fairhope" before his departure.
      *   Baldwin County faces a Nov 2018 mid-term election where four commissioners are up for re-election.
      *   Baldwin County is saddled with a 32 million dollar debt related to a "white elephant, the mega site."

      THE DISCOVERY:
      *   Fairhope City Council President, Burrell, held the position for 5 years.
      *   Burrell received Airport Authority coverage for attorney fees related to an Ethics complaint.
      *   Burrell managed $13 million spent on a sewer plant but no money on sewer infrastructure.
      *   During Burrell's time, city utilities transferred 10 million to the general fund for non-utility expenses.
      *   The Airport Authority controls the land title and pays its bills using city funds, securing job benefits (e.g., free plane flights, paid legal defense) for Burrell and allies.

      THE PIVOT:
      *   Article 2 establishes a systemic, five-year pattern of cronyism, lack of accountability, and financial mismanagement (Burrell/Airport Authority) within the Fairhope City Council.
      *   This long-term pattern directly explains the council's documented failure and obstruction (Article 1) of the newly elected Mayor's efforts to push transparency and accountability.

      KEY ENTITIES:
      *   Fairhope City Council
      *   Burrell (Council President)
      *   Mayor (newly elected)
      *   Kant
      *   Baldwin County
      *   Fairhope Airport Authority
      *   Alabama Ethics Commission
    llm_text: Fairhope Council President Burrell mismanaged $13 million on a sewer plant and funneled $10 million from utilities to the general fund. This five-year cronyism at the Airport Authority explains why the council obstructed the newly elected Mayor's push for transparency.
