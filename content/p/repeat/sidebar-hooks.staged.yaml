  can-you-smell-it:
    brief: |-
      THE CONFLICT: Fairhope previously discharged human waste into Mobile Bay via unreported spills. During 2015 and 2016, Fairhope utilities paid the city $10 million for NON-UTILITY expenses while neglecting necessary infrastructure. The previous Mayor was Tim Kant.
      THE DISCOVERY: Under Mayor Kant and the City Council, the city spent $13 million on upgrading the sewer plant on the bay instead of moving it inland, and spent zero on necessary infrastructure, leading to future repair bills.
      THE PIVOT: The past mismanagement (sewer spills, poor infrastructure spending, lack of transparency) under Mayor Kant and the City Council provides the context for the current political push (2017-2018) demanding accountability and transparency from the new City Council and Mayor.
      KEY ENTITIES: Fairhope City Council, Tim Kant, Karen Wilson, Mobile Baykeeper, Publix project, Fly Creek, Baldwin County, Ripp Report, Fairhope Yacht club.
    llm_text: Fairhope dumped human waste into Mobile Bay in 2015/2016 while Tim Kant’s administration wasted $13 million on sewer upgrades instead of fixing infrastructure. Read how this mismanagement fuels the current push for council accountability and transparency.
