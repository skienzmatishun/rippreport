  alabama-off-the-rails:
    brief: |-
      THE CONFLICT:
      Alabama approved the medical cannabis bill (The Compassion Act) on May 17, 2021, allowing qualified patients to receive medical cannabis.
      In the recent legislative session, a bill to "restructure" the State Board of Veterans Affairs passed the Alabama State Senate (21-9) and the House (56-39).
      This restructuring is claimed by veterans groups as cutting support for Alabama Veterans.
      The restructuring is alleged to be retaliation for an ethics complaint filed by ADVA Commissioner Kent Davis against Department of Mental Health Director Kimberly Boswell.
      Boswell is accused of colluding with officials to divert $7 million from the American Rescue Plan Act intended for the ADVA.
      Ed Oliver (R-Dadeville), Military and Veterans Affairs Committee chairman, had a long-standing issue with ADVA management dating back to a 2020 showdown with Davis over COVID protocol at Bill Nichols State Veterans Home in Alexander City.

      THE DISCOVERY:
      The 2021 Compassion Act has remained in a legal morass four years later (February 2025 context), preventing full implementation despite 36 other states having programs.
      The Alabama Board of Medical Examiners has not issued the first patient license.
      The state is spending millions on litigation, and the legislature has been unable to fix the original legislation.

      THE PIVOT:
      Both issues illustrate systemic legislative failure and political vindictiveness in Alabama, where state priorities (such as supporting Governor Ivey's cabinet or legislative maneuvering) override critical needs (veteran care funding and patient access to necessary medical cannabis).

