      *   SB67, sponsored by Senator Andrew Jones, aimed to remove the Board’s power, allowing Governor Ivey to solely appoint the Veterans Commissioner and control the department.
      *   The current system allowed veterans' groups to recommend three names for the board/commissioner.

      THE PIVOT:
