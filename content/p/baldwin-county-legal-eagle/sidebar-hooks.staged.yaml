      Mayor Kant and Senator Pittman were investigated in 2011 for grant fraud related to BP funds.
      The city secretly purchased the triangle property for $12 million after 40 years of denial to property owners.

      THE DISCOVERY:
      In December 2014, Fly Creek erosion was severe (banks collapsed over 20 feet), caused by the Publix development.
      Mayor Kant enabled non-resident land owner Arthur Corte to sway the Publix development from the triangle property to his own property.
