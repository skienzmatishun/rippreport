  alabama-education-accountability-act:
    brief: |-
      THE CONFLICT:
      *   The Alabama Education "Accountability Act" was enacted under Republican-dominated legislature and Governor Reverend Dr. Robert Bentley.
      *   Bentley admitted deceiving the legislature; the bill changed from eight pages to twenty-eight pages without notifying the legislature, violating Alabama "Rule 21."
      *   The Act's fiscal impact was over $300 million, drawn from the Education Trust Fund, and eliminated promised teacher raises.
      *   Senator "TRIP" Pittman received $750,000 in BP grant funds through his position; Fairhope Mayor Tim Kant assisted in securing the illegal contract.
      *   Pittman and Kant were subpoenaed into federal court facing fraud, coverup, and witness intimidation charges.

      THE DISCOVERY:
      *   The Accountability Act was essentially a tax credit giveaway to Republican households, not a solution for failing schools.
      *   The Act's passage involved documented ethical and legal violations by Governor Bentley and Senator Pittman, demonstrating systemic political corruption in education funding.

      THE PIVOT:
      *   Article 2 establishes the historical precedent of political corruption (Pittman/Kant/Bentley) and lack of legal accountability (Rule 21 violation) regarding education funding.
      *   This history makes the 2015 proposal by Baldwin County Commissioners and Fairhope Council (March 30, 2015) for property tax increases (12 mills vs. 29.5 mills) untrustworthy, as the state system has historically mismanaged funds and lacked transparency.

