      2. The Alabama Supreme Court upheld a Baldwin County ruling that investigative records (dash and body camera footage) from the 2017 Jonathan Victor shooting are exempt from open records law.
      3. Sheriff Hoss Mack demanded $600,000 from taxpayers for cameras but BCSCU refused to share footage.
      4. Lagniappe Mobile published an article on June 30, 2021, detailing Albritton's failure to disclose being a trustee of a multi-million dollar trust and the misuse of scholarship funds.

      THE PIVOT:
      1. Article 2 establishes a systemic pattern of cover-up, lack of transparency, and local government obstruction (e.g., withholding camera footage, self-investigation) in Baldwin County.
      2. This pattern mirrors the state-level corruption alleged in Article 1, where state agencies (Alabama Bar, Ethics Commission) are accused of deliberately covering up self-dealing by officials like Tom Albritton.
      3. It demonstrates that the "black hole" corruption is not isolated to ethics violations but is embedded across state and local political and law enforcement structures in Alabama.

