    brief: |-
      THE CONFLICT:
      *   August 28th, 2017: A constituent challenged Fairhope City Council President Jack Burrell during a public participation meeting.
      *   Jack Burrell refused the speaker the right to speak and had the individual escorted by police from the podium.
      *   The City Council and City Attorney sat in silence; the Mayor commented on the incident.
      *   The Ripp Report pursued a legal case, which moved through mediation and depositions for over a year.
      *   The case settled with the Insurance Company, not resulting in a public apology from Burrell.

      THE DISCOVERY:
      *   Jack Burrell and the Fairhope City Council operate within the structure of "Catalyst and the good ole boys," lacking accountability to citizens.
      *   Burrell publicly boasted that the settlement was small and that the city "won" by avoiding an apology, reinforcing the power of the "at Large" Council.
      *   The Ripp Report incurred significant expenses, resulting in the organization being in the black for the first time in years due to the settlement.

      THE PIVOT:
      *   The 2017 incident demonstrates the established pattern of obstruction, lack of public accountability, and control by the "Catalyst" old guard in Baldwin County/Fairhope.
      *   This historical pattern of corruption and obstruction provides context for the current election cycle, where candidates like Joe Davis are labeled as "Catalyst" and represent the "old guard" resisting change (e.g., Mayor Karin Wilson's battle against the Catalyst Council).

