    brief: |-
      THE CONFLICT:
      *   Chuck Zunk, appointed by Councilman Jack Burrell, attempts to financially obstruct Mayor Karin Wilson's push for a Council-Manager form of government in Fairhope.
      *   This animosity stems from the Airport Scandal and dubious airplane hanger lease, involving Airport property.
      *   Zunk pushed an unapproved 65-vote survey result (39 votes/60%) to change the petition from districts to at-large, despite lacking Probate Judge/Secretary of State approval.

      THE DISCOVERY:
      *   Judge Tim Russell, Probate Judge for Baldwin County (handling $40M in 2017, $3.9M budget), is retiring.
      *   The Probate Judge role is vital for processing the petition required for the Council-Manager form of government.
      *   The 2018 Probate Judge race included Max Hansen, Alan Lipscomb, Matt McKenzie, Catalyst Candidate Lynn Perry, and Harry D’Olive.

      THE PIVOT:
      *   The petition for the Council-Manager form of government (due July 5th) requires filing and processing at the Probate Judge’s office.
      *   Judge Tim Russell's role was essential for the legal validation of the petition, making his retirement relevant to the Fairhope political conflict.

