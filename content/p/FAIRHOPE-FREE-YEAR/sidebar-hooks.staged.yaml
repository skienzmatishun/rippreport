  bull:
    brief: |-
      THE CONFLICT:
      - During her tenure (2016–2020), former Mayor Karen Wilson implemented fiscal reforms including separating City tax revenue from Utility rate fees and refusing to hold dual roles as Mayor and Utility Director to save $60,000 annually.
      - The current administration reversed these reforms, re-allowing the Mayor to collect two salaries (Mayor and Superintendent of Utilities) and re-mingling City operating expenses with the Utility budget.

      THE DISCOVERY:
      - The current administration utilized the "co-mingling" of money to hide City operating expenses within the Utility budget, creating the appearance of massive annual surpluses.
      - Despite a 32% population increase during the previous term, the current administration de-funded Assistant Superintendent positions in Electric (mid-2017), Gas (late 2017), and Water & Sewer (Feb 2018) utilities.
      - The "Working Waterfront" project is currently three years behind schedule.

      THE PIVOT:
      - Article 1 details the immediate consequences of un-elected governance: water shortages, a sewer plant discharging into the Bay, and the removal of public participation rights. Article 2 serves as the smoking gun by revealing that these infrastructure and fiscal failures were not accidental, but the direct result of the administration's deliberate reversal of previous financial safeguards and the re-establishment of "good ole boy" contract and salary practices.

      KEY ENTITIES:
      - Karen Wilson (Former Mayor)
      - Jack Burrell (Council President)
      - Francis Paul Ripp (Plaintiff)
      - Fairhope City Council
      - Fairhope Mayor
      - Fairhope Municipal Attorney
      - Fairhope Municipal Judge
      - United States District Court for the Southern District of Alabama
    llm_text: Karen Wilson fought to separate Fairhope's taxes from utility fees, but the current administration dismantled those safeguards to favor "good ole boy" practices and hide expenses. This deliberate shell game directly caused our water shortages and triggered the sewer plant's discharge into the Bay.
