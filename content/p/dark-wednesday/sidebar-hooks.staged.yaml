    brief: |-
      THE CONFLICT:
      - Jack Burrell, Fairhope City Council President under Mayor Cant, accused of systematic deception regarding municipal infrastructure.
      - Burrell claimed credit for sewer improvements he previously voted against.
      - Approval of sewer plant repairs while simultaneously blocking funding for necessary transmission lines.
      - Negotiation of a $2.65 million farmland purchase intended for recreation, which was immediately leased back for farming at $9,000 per year.
      - Financial impact of the land purchase caused the city to move from a $1.2 million surplus to a $1.7 million deficit.
      - Allegations of bid rigging at the Fairhope Airport and votes in favor of council "full family insurance."

      THE DISCOVERY:
      - Article 2 revealed Burrell’s undisclosed police record involving incidents with juveniles.
      - Article 2 exposed a pattern of "CATALYST" council members only supporting projects when cameras are present or projects are already inevitable.
      - Article 2 highlighted Burrell’s personal dismissal of face masks, stating he believes a "hard hat works better than a face mask."

      THE PIVOT:
      - Article 2 serves as the historical context for the public health crisis in Article 1 by establishing a pattern of character: it identifies a local leader (Burrell) who is habitually deceptive and who explicitly rejects the efficacy of face masks, providing the background for the life-and-death stakes of masking and truth-telling during the COVID-19 surge.

      KEY ENTITIES:
      - Jack Burrell
      - Mayor Cant
      - Fairhope City Council
