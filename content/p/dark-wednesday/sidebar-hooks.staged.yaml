  money-on-the-table:
    brief: |-
      THE CONFLICT: The Fairhope City Council (specifically the "CATALYST" faction including Councilmen Jack Burrell, Robert Brown, and Kevin Boone—the "3 B's") continuously opposed, delayed, or blocked Mayor Dane Haygood's initiatives. Key past events include:
      - Refusing to advance the $6.2 million Fairhope Waterfront Project during a May work session and council meeting.
      - Rejecting a $65,000 mayoral marketing plan to help local businesses during the COVID-19 pandemic (funded by raising the tourist lodging tax from 6% to 7% and adding a ½ cent gas tax).
      - Approving council salary and full family insurance increases totaling approximately $125,000.
      - Purchasing 2.65 million dollars in recreation land without public input and leasing it for $9,000 a year.
      - Incurring a $13 million legal settlement cost related to the Triangle property.
      - Spending $2.5 million for the K-1 Center, Fairhope Community Park, and Nix Center without budgeting for immediate repairs (installing only a temporary roof on the K-1 Center).
      - Spending over $500,000 to $600,000 for 1,000 square feet of the clock property, negotiated heavily by Burrell.
      - Allocating $35,000 annually to the Baldwin County Economic Development Alliance (BCEDA), run by Lee Lawson (brother-in-law to Mayor Haygood and close friend of Burrell).

      THE DISCOVERY: Article 2 (Money on the Table) documented the deep local political obstruction, financial mismanagement, and self-serving actions of the Fairhope City Council right as the COVID-19 pandemic struck local businesses. It exposed how the council blocked COVID-19 economic relief and marketing strategies while prioritizing pet projects, internal raises, and questionable real estate purchases.

      THE PIVOT: Article 2 serves as the smoking gun because it establishes a documented historical pattern of political obstruction and economic neglect by the Fairhope City Council ("CATALYST") precisely as the COVID-19 pandemic hit—the exact crisis tracking upwards in Article 1 (Dark Wednesday), where Alabama's cases surged by 50% and 100,000 Americans died. While the pandemic battered local commerce, the council's refusal to act on business marketing plans and waterfront projects left vital economic recovery funds "on the table."

      KEY ENTITIES:
      - Jack Burrell (Fairhope City Councilman)
      - Robert Brown (Fairhope City Councilman)
      - Kevin Boone (Fairhope City Councilman)
      - Dane Haygood (Mayor of Fairhope)
      - Lee Lawson (Head of BCEDA)
      - Fairhope City Council ("CATALYST" faction)
      - Baldwin County Economic Development Alliance (BCEDA)
      - Eastern Shore Chamber of Commerce
      - Downtown Business Association
      - Hatch program
    llm_text: While COVID-19 battered local businesses, Councilmen Jack Burrell, Robert Brown, and Kevin Boone blocked Mayor Dane Haygood’s relief funds and instead lined their own pockets. Dive into the shocking political obstruction that left Fairhope's economic recovery money sitting on the table.
