      - Past/local conflict in Article 2: The Ripp Report wrote about CATALYST for years; filed numerous complaints with Alabama Attorney General involving political corruption; received no reply.
      - It seems that political corruption is not as important as the sewer violations.
      - Alleged ignored complaints: Fly Creek and Publix; ADEM (Alabama Department of Environmental Management, aka Alabama Department of Environmental Maniacs) ignored years ago.

