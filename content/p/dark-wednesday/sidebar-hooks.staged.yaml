      THE DISCOVERY: Article 2 exposed "Baldwin County incompetence, political interference, lack of ethics, CATALYST, corruption and judicial failure" regarding the McSharry case, noting the City Attorney and Municipal Judge favored the criminal.

      THE PIVOT: Article 2 provides historical context (November 2018 assault/judicial failure) against which Article 1 (March 15 to May 24 Covid-19 data showing 100,000 deaths) exists, highlighting a pattern of systemic failure and political influence in local governance, despite the lack of a direct factual link between the two events.

