  hair-on-fire:
    brief: "THE CONFLICT: Governor Ivey used extreme executive power to fire Alabama Department of Veterans Affairs Director Kent Davis. Simultaneously, Alabama Ethics Commission Executive Director Tom Albritton remains in office drawing a $100,000+ salary despite allegations of unethical behavior involving millions of unaccountable dollars from the Mabel Amos Trust and undisclosed lists of donation/scholarship recipients used as blackmail. In a separate legislative battle detailed in past reporting, State Senator Chris Elliott (R-Josephine) pushed Senate Bill 306—backed by Baldwin County Sheriff Hoss Mack—to create a full-time, non-rotating chairman position for the Baldwin County Commission, overriding local opposition and ignoring the local delegation.\n\nTHE DISCOVERY: The older background context (Widget Article) exposes the legislative overreach and political machinations of Senator Chris Elliott and Sheriff Hoss Mack in Baldwin County. It captures internal political fractures, specifically noting that Sen. Greg Albritton (R-Range) opposed and voted against Elliott's Senate Bill 306 due to a lack of public and commission support (\"A government cannot operate without the support of its populace\").\n\nTHE PIVOT: The historical context of the Albritton name and legislative corruption links the broader systemic rot at Goat Hill to local power players. While Sen. Greg Albritton pushes back against rogue legislation like SB 306 in one arena, Tom Albritton acts as the poster boy of corruption at the Ethics Commission, protecting politicians, lawyers, and judges implicated in the Mabel Amos Trust scandal.\n\nKEY ENTITIES: \n- Tom Albritton (Executive Director, Alabama Ethics Commission)\n- Kent Davis (Former Director, Alabama Department of Veterans Affairs)\n- Governor \"Me Ma\" Ivey\n- Chris Elliott (State Senator, R-Josephine)\n- Greg Albritton (State Senator, R-Range)\n- Hoss Mack (Sheriff, Baldwin County)\n- Mabel Amos (Trust namesake)"
