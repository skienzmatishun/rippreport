hooks:
  lipstick-on-a-pig:
    brief: 'THE CONFLICT:

      * Dec 7, [2015]: Fairhope Planning and Zoning voted on Fly Creek PUD project.

      * Vote result: 5 no, 4 yes (approved).

      * Project concern: Development of 240 "upscale apartments."

      * Land owner/Developer: Arthur Corte.


      THE DISCOVERY:

      * The Mayor and Councilman Ford voted against the Fly Creek PUD proposal.

      * Corte exerted influence on the Mayor ("I may not live in Fairhope but I have
      influence").

      * The subsequent pursuit/reintroduction of the project signals loyalties to
      Corte over public concern.


      THE PIVOT:

      * Article 2 clarifies the conflict was not simply a public defeat, but that
      Corte pressured the Mayor into his initial vote.

      * Article 2 predicts the Mayor will attempt to "BLINDSIDE" the public again
      by using the City Council for future phases, repeating past failures (e.g.,
      Triangle lawsuit cost).


      KEY ENTITIES:

      * Arthur Corte

      * Mayor (unnamed in detail, but implied antagonist)

      * Councilman Ford

      * Jennifer Fiddler (voted with Mayor initially)

      * Angus Cooper (potential benefactor/financial link)'
    generated_at: '2026-08-03T02:13:18.569202Z'
    text: Back in 2015, city leaders claimed they stood tall against Arthur Corte's
      massive apartment scheme. But this follow-up report exposes how Corte's behind-the-scenes
      pressure controlled the vote all along, setting taxpayers up for another costly
      blindside.
    character_count: 254
  fairhope-railroad:
    brief: 'THE CONFLICT:

      *   Planning and Zoning vote on Fly Creek PUD (Mixed-use concept including Publix,
      intended high-end townhomes).

      *   Project involved land owned by Arthur Corte.

      *   Initial proposal promised no apartments, but later plans included 240 upscale
      apartments.

      *   Dec. 7 meeting passage (5 no, 4 yes vote); Mayor voted against the project
      initially during public hearing.

      *   Project fallout included Triangle lawsuit ($11.25M settlement) and creek/right-of-way
      lawsuits ($\$300k-\$7M+).


      THE DISCOVERY:

      *   Article 2 details the specific procedural compromises and damages incurred
      due to the PUD implementation.

      *   The project shifted from high-end village concept to strip center/apartments,
      violating original plans.

      *   City accepted costly changes benefiting the developer (e.g., installing
      sewer lift station, fire station location).

      *   Article 2 attributes the shift and acceptance of damages to alleged corruption/favoritism
      between Mayor and Arthur Corte.


      THE PIVOT:

      *   Article 1 raises the procedural concerns regarding the initial vote and
      potential undisclosed changes (e.g., apartments).

      *   Article 2 provides the concrete, quantifiable evidence of how those initial
      compromises led to massive, taxpayer-funded damages (costly upgrades like sewer
      lift, ignored violations) that benefited the developer while draining city coffers.


      KEY ENTITIES:

      *   Arthur Corte (Land Owner/Developer)

      *   Fairhope City Council

      *   Mayor

      *   Jennifer Fiddler (Council Member)

      *   Publix

      *   Fly Creek PUD'
    generated_at: '2026-08-03T02:13:18.569210Z'
    text: Public officials promised high-end townhomes, yet Fairhope residents ended
      up with sprawling apartments and crippling lawsuits. The raw financial records
      reveal how corrupt compromises directly handed developer Arthur Corte lavish
      city-funded utility upgrades while draining local coffers.
    character_count: 289
