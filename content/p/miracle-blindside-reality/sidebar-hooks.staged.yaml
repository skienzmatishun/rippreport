  football-sneak-play:
    brief: |-
      THE CONFLICT:
      *   Angus Cooper held a campaign fund raiser for Mayor Kant of Fauxhope.
      *   Council approved a $35,000 two-hour practice slot for senior bowl players on Fairhope football facility.
      *   Mayor Kant received over $40,000 in campaign funds, largely from out-of-town contributors.
      *   Councilwoman Diana Brewer voted for the football "sneak" play despite a conflict of interest.

      THE DISCOVERY:
      *   Diana Brewer is on the board of the Mobile Maritime Museum, where Angus Cooper is also on the board of directors.
      *   Brewer failed to disclose this conflict of interest before voting on the football budget.
      *   The city pays $17,500 per hour for the facility, plus utilities, maintenance, and cleanup.

      THE PIVOT:
      *   Article 2 establishes a pattern of financial conflicts of interest and 'BLINDSIDE' actions (e.g., the $35k football deal benefiting a major contributor) involving Mayor Kant and council members.
      *   This established pattern provides context for the controversial December 7th Fly Creek PUD vote, where the Mayor voted against a project initially favored by the council, amidst claims of undue pressure from the developer and land owner Arthur Corte.

      KEY ENTITIES:
