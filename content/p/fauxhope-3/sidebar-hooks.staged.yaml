  got-fleas:
    brief: "THE CONFLICT: \n- A $6.2 million Fairhope Waterfront Project (funded by RESTORE Act BP oil spill money to stabilize the bluff overlooking Mobile Bay) was altered. \n- For over 18 months, hundreds of citizens participated in public meetings and surveys under former Mayor Wilson to develop an original, resilient, and sustainable plan.\n- Following municipal elections, the new administration under Mayor Sherry Sullivan and Council President Jack Burrell scrapped the citizen-vetted plan within weeks, reducing it to a short-sighted maintenance/renovation project with only 14 days' notice and no adequate public comment.\n- Critic Howell Raines (\"Howling Raines\") previously attacked Mayor Wilson's original plan and supported the new administration, but later criticized the Sullivan administration for pushing proposals without full citizen vetting.\n\nTHE DISCOVERY: \n- Article 2 documented how political interference derailed a citizen-driven public infrastructure project. \n- It revealed that local elected officials used the waterfront project as a divisive political tool, distorting facts, lying to the public, and replacing a resilient community vision with a watered-down project catering to special interests rather than constituents.\n\nTHE PIVOT: \n- Article 2 serves as the historical smoking gun proving a continuous, multi-year pattern of mayoral and council manipulation regarding million-dollar waterfront projects. \n- While Article 2 showed the waterfront project budget starting at $6.2 million (RESTORE Act funds) and being derailed by politics under Mayor Sherry Sullivan, Article 1 shows the project has now ballooned to a $10 million waterfront project with numerous unvetted changes from the citizen-approved concept, awarded to political supporters—proving that early warnings about Sullivan's administration ignoring the public were entirely accurate.\n\nKEY ENTITIES:\n- Mayor Sherry Sullivan\n- Howell Raines (\"Howling Raines\")\n- Mayor Wilson (previous administration)\n- Jack Burrell (Council President)"
    llm_text: Mayor Sherry Sullivan and Council President Jack Burrell scrapped a citizen-vetted $6.2 million waterfront plan to reward political supporters. Read how this betrayal ballooned into a $10 million boondoggle and why early warnings about backdoor manipulation were entirely accurate.
