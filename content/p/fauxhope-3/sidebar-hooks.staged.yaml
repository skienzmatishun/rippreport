  chasing-your-tail:
    brief: "THE CONFLICT: \n- The City Council and Mayor of Fairhope (Fauxhope) are backed by developers, leading to overdevelopment, increased traffic, strained infrastructure, and ignored water and sewer issues in favor of parks, tunnels, and moving a hermit's house.\n- The Mayor draws a full salary as both Mayor and unqualified Utility Director, a position rewarded by developers.\n- Due to the Alabama legislature postponing municipal elections in 2024 because of the presidential election, the mayor, city council, municipal attorney, and municipal judge received a free extra year in office (their 5th year) with full pay and health insurance without a single vote being cast.\n- The upcoming $10 million waterfront project has undergone numerous changes from the citizen-approved concept and is slated to be awarded to a construction company that supports the Mayor and Council in the 2025 election.\n\nTHE DISCOVERY (Historical Context from Widget Article):\n- The older article (\"Chasing Your Tail\") documented early dysfunction, showing a City Council that failed to deliver a city budget on time, made excuses about not understanding it, and couldn't resolve a 10-year illegal Entertainment District issue.\n- Exposed backroom legal maneuvers, specifically noting that Council President Mr. Burrell negotiated the Dyas lawsuit settlement resulting in an $11.25 million loss (forcing the city to buy the property) while keeping the public entirely in the dark.\n- Highlighted the secretive handling of the Breland case and the push by Mr. Burrell to acquire the asbestos- and lead-tainted K-1 center property through questionable grant funding or city financing.\n- Revealed internal government friction where the city attorney took orders from the council while keeping the Mayor in the dark, and used taxpayer dollars to represent the council president on personal legal issues.\n\nTHE PIVOT:\n- Article 2 (\"Chasing Your Tail\") is the smoking gun because it shows that current governmental corruption, backroom settlements (like the $11.25M Dyas loss), and a total disregard for public transparency under Mr. Burrell and the City Council are not isolated incidents, but a long-standing pattern of behavior that directly birthed the infrastructure crises, unearned 5th-year terms, and developer-driven priorities detailed in Article 1.\n\nKEY ENTITIES:\n- Mayor Sullivan\n- Mr. Burrell (Council President)\n- The Catalyst (At-Large Council faction)\n- Dyas (Plaintiff in the $11.25 million lawsuit)\n- Breland (Plaintiff in the Breland case)"
