  fauxhope-crier:
    brief: "THE CONFLICT: \n- Local government officials (Mayor, City Council, municipal judge, municipal attorney) received 100% backing from special interests, developers, and \"good ole boys.\"\n- Water and infrastructure issues have been ignored for 20 to 30 years while money is misallocated to parks, tunnels, moving a hermit house, and a $10 million waterfront project.\n- The Alabama legislature postponed municipal elections in 2024 due to the presidential election, granting elected officials a free fifth year in office (full salary and full family insurance) without a single vote cast.\n- The Mayor draws a full salary as both Mayor and unqualified Utility Director as a reward from developers.\n- Discriminatory historical practices included restricting non-resident African Americans from Mobile via duck pond and beach fees, and actively avoiding an increase in African American residents.\n\nTHE DISCOVERY: \n- Councilman Cory Martin emerged as the new \"City Council Crier\" and spokesperson for the council, acting as a \"sacrificial lamb.\"\n- Martin pushed a water ordinance requiring annexation into city limits before tapping into Fairhope water.\n- Martin publicly supported the Municipal Judge's east side commercial project (including an ALDI store) and claimed infrastructure was prepared, despite systemic infrastructure neglect.\n- Financial exposure revealed: taxpayers pay over $500,000 a year for full family insurance for the council and mayor, totaling $2.5 million for their term—an amount equivalent to multiple new water wells.\n\nTHE PIVOT: \n- Article 2 serves as the smoking gun by exposing specific actors (Councilman Cory Martin) and mechanisms (annexation water ordinances, support for the Municipal Judge's commercial east side project) used to push developer-driven priorities over basic infrastructure. \n- It shows that the current administration—shielded by a gifted fifth year in office—continues to prioritize commercial expansion (like ALDI) and sweetheart projects while ignoring 20-30 years of water and sewer crises, directly contradicting Martin's public claims that infrastructure is adequately handled.\n\nKEY ENTITIES: \n- Cory Martin (Councilman / \"Cory the Crier\")\n- Mayor (Unnamed in text, serving as dual Mayor/Utility Director)\n- Fairhope City Council\n- Municipal Judge\n- Municipal Attorney\n- ALDI (Commercial project)\n- State of Alabama"
    llm_text: While Councilman Cory Martin claims Fairhope's infrastructure handles new developments like the ALDI project, taxpayers foot a $500,000 annual insurance bill for leaders ignoring a thirty-year water crisis. Read how this administration secures developer profits over your basic needs.
