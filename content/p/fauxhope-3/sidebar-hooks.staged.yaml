  fairhope-infrastructure:
    brief: |-
      THE CONFLICT:
      - Fairhope has suffered from a water shortage for three years, and sewer/infrastructure projects approved in 2020 remained uncompleted by year five.
      - The sewer plant exceeded capacity and continued discharging raw sewage into the Bay.
      - 68 Ventures engaged in a multi-year legal battle and "pissing contest" with the City of Fairhope after the planning commission denied their Skyline and Gables developments.
      - Following the Gables denial, 68 Ventures hired undercover operatives posing as an Atlanta couple ("the Cuttinghams") to secretly record and attempt to entrap planning commissioner Hollie MacKellar in March.
      - 68 Ventures purchased a massive undeveloped commercial property for the "Park City" (or Park Village) development from Hix Snedeker, who served as the Fairhope Municipal Judge and had previously gotten the property annexed with an approved Planned Unit Development (PUD).
      - U.S. Senator Katie Britt (R-AL) invested in the project, reporting the purchase of $33,000 in stock in "68V 181-Fairhope Avenue 2023, LLC" on December 15, 2023 (purchased December 14, 2023).

      THE DISCOVERY:
      - The historical context exposed deep conflicts of interest and collusion between local municipal officials, state politicians, and major developers like 68 Ventures.
      - It revealed that Fairhope's Municipal Judge (Hix Snedeker) profited directly by selling a disputed PUD property to a developer (68 Ventures) currently suing the city.
      - It uncovered aggressive developer tactics, including 68 Ventures hiring private impostors to secretly record and entrap local planning commissioners (Hollie MacKellar).
      - It highlighted political entanglements, such as U.S. Senator Katie Britt financially investing in the 68 Ventures project.
      - It exposed overlapping conflicts of interest involving public representatives, such as Jonathan Gray acting simultaneously as a public relations representative for 68 Ventures and a representative for Baldwin County Schools.

      THE PIVOT:
      - Article 2 serves as the smoking gun for Article 1 because it provides the concrete evidence of *how* local government corruption operates in Fairhope, moving Main Article claims of a "good ole boy town" from abstract accusations to documented facts.
      - It connects the mayor and council's developer-friendly policies to specific, corrupt transactions—such as a municipal judge selling land to a litigious developer and a U.S. Senator financial stake in local projects.
      - It shows that infrastructure neglect (water shortages, failing sewer plants) is a direct byproduct of prioritizing developer interests (like 68 Ventures' 700-unit Park City project) over citizen needs.

      KEY ENTITIES:
      - Mayor Sullivan
      - Hix Snedeker (Fairhope Municipal Judge)
      - Senator Katie Britt
      - Hollie MacKellar (Planning Commissioner)
      - Jonathan Gray (Consultant/PR for 68 Ventures and Baldwin County Schools representative)
      - 68 Ventures
      - 68V 181-Fairhope Avenue 2023, LLC
