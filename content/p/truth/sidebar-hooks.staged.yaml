  a-decade-of-corruption:
    refined_source: 898f1fc4b74870cc49abb22baf908e8cfedc9d60a4e7e030f8ac203f8f6b1cc5
    brief: |-
      THE CONFLICT:
      *   May 8th, 2010: County Commission told Mayor Tim Kant and Senator Tripp Pittman not to proceed with a $636,000.00 BP Boom work bid.
      *   June 4th, 2010: Fairhope City Council awarded the contract to Pittman Tractor.
      *   June 10th, 2010 (approx): Pittman received a $372,165.90 check from Fairhope for "COMPLETED" boom work without a general contractor's license, marine insurance, or county/ethics approval.
      *   Ongoing: Robert Brown has a pending Attorney General Complaint and an Ethics Complaint.

      THE DISCOVERY:
      *   Baldwin County experienced blatant political and judicial corruption over the last 10 years, with complaints to the Attorney General and Ethics Commission consistently dismissed.
      *   Corruption was not isolated but included issues like the Mega Site, the McSharry case, Spanish Fort Mayor conduct, Councilman Boone/Brown's inside dealing (Art Center/soccer fields), and the attempted sale of 11.2 million triangle property.

      THE PIVOT:
      *   Article 2 establishes that the misallocation of oil spill grant money via non-transparent or no-bid contracts was a systemic pattern under the previous administration (Kant/Pittman), making the current controversy over the $6 million oil spill grant (Article 1) part of a documented history of municipal corruption and unethical transactions, not just a single political dispute.

      KEY ENTITIES:
      *   Tripp Pittman (State Senator)
      *   Tim Kant (Former Fairhope Mayor)
      *   Karin Wilson (Current Mayor)
      *   Robert Brown (City Councilman)
      *   Leslie Callies Hollis (Councilwoman)
      *   Jack Burrell (Council President)
      *   Greg Mims
      *   Sherry Sullivan
      *   Jennifer Fidler
      *   Councilman Boone
