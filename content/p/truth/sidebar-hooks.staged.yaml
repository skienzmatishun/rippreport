  fairhope-no-hope-fauxhope:
    brief: |-
      THE CONFLICT:
      - Conflict: Councilman Robert Brown’s position on the Fairhope Waterfront vs. Leslie Callies Hollis’s public comment.
      - Event: Leslie Callies Hollis wrote/commented to Robert Brown weeks ago on the Waterfront subject.
      - Hollis: public bay front has evolved over the course of her lifetime; cites Mayor Nix allowing existing pier and rose garden, tearing down old casino.
      - Hollis: if citizens then had pulled out pitchforks and torches to contest change, they would still have a rail system running from a wooden pier to the center of town.
      - Hollis: asked whether citizens would have contested Mayor Nix’s decisions; said no.
      - Hollis: leaders of the City should expect council to behave professionally and kindly; challenge and address issues correctly; working together for good of City.
      - Hollis: no bulldozers at Waterfront; preliminary plans can be tweaked and improved; nothing wrong with using expertise to keep good and make recommendations.
      - Hollis: 6 million dollar grant is a gift; balance of money that would be required to evolve and improve City could be money well spent.
      - Hollis: asked whether Robert Brown asked for public input to purchase and expand soccer field; how much taxpayer money allocated for that land; what options.
      - Hollis: no one took pitchforks and torches out to protest soccer field plans; did Brown find grant money?
      - Hollis: don’t use position and platform to stomp on changes just because it was Mayor Wilson’s hard work and thinking out of the box that got the grant.
      - Hollis: drama and “just because you said it, its wrong” attitude in play entire term of Mayor Wilson’s being Mayor.
      - Hollis: council made themselves out to be disrespectful and cruel; uncalled for.
      - Hollis: be gracious and open minded enough to think Mayor Wilson might have good ideas to bring to City; do not sacrifice opportunity for positive change because fear of fruit of her hard work coming to fruition.
      - Hollis: Brown was seated at same table with Mayor Wilson but more tuned in to bringing her down and destroying her than working with her and City.
      - Hollis: Brown should be expected to be constructive in working with Mayor Wilson; council seat is check and balance, not mortal enemy.
      - Hollis: Brown’s post was not to do PR campaign of Robert Equals Good and Karin Equals Bad.
      - Hollis: opposition to project and post pointing out negatives on Mayor Wilson’s project and positives on Brown’s is out of growing concern that Mayor Wilson might be working to create positive changes for Fairhope.
      - Hollis: asked if Brown gave Mayor Wilson credit for changes she made to marina; if approved, might make her look as though she was busy working and finding resources to better City.
      - Hollis: grant from BP oil spill was supposed to be used to better City; money from grant awarded in no bid contract paid to private contractor who was friends with last Mayor.
      - Hollis: contractor did not put on robber mask/go rob City; thought they were entitled; large portion could have been used for needed infrastructure.
      - Hollis: that sort of thing is unethical and unfair to taxpayers; complacency in accepting stealing? Why would anything be acceptable? World of transparency now; such transactions come to light.
      - Hollis: nothing, and I mean nothing, about that was for good of citizens of Fairhope; well, maybe two.
      - Hollis: Brown is a good person; knew his Mama; Hollis from same cloth; honest and hardworking as well.
      - Hollis: all have vested interest in Fairhope; do not allow politics of past to continue to dictate future of Fairhope.
      - Hollis: Mr Brown has pending Attorney General Complaint and Ethics Complaint pending.
      - Hollis: no one yet signed up to run against Robert; someone step up please.
      - Hollis: Jack and Boone have real competition.
      - Hollis: The Three Bs need to go pollinate somewhere else.

      THE DISCOVERY:
      - Article 2: Title “FAIRHOPE — NO HOPE — FAUXHOPE.”
      - Article 2: after 6 weeks confinement and absolutely beautiful weather, author had to have a “beach fix” on Friday and it took all day.
      - Article 2: every voting citizen in Fairhope should read recent cover story in Lagniappe, “A TALE OF TWO CITIES.”
      - Article 2: Lagniappe article has a paywall; however is free at news stands; get Lagniappe today.
      - Article 2: author Lynn Oldshue, investigative reporter for Lagniappe, reporter for Alabama Public Radio, storyteller with Our Southern Souls, is also administrator for Facebook group Fairhope Now.
      - Article 2: article is very compelling story about makeup of Fairhope, affluent vs. working poor.
      - Article 2: Lynn Oldshue has written what has been a sad reality in Fairhope for many years.
      - Article 2: major reason such disparity exists is that municipal government of Fairhope has always represented the status quo.
      - Article 2: POLITICS is the cause, POWER is the means.
      - Article 2: after reading, ask yourself what you can do to help people in need.
      - Article 2: Mayor Wilson, and her twin Kelly Wilson, have been working in African American community years before Mayor was elected.
      - Article 2: Mayor Wilson is first Mayor of Fairhope to reach out to African American community.
      - Article 2: prior to this administration, black community was ignored except at election time and minorities were rarely hired by city, which is not the case now.
      - Article 2: Mayor’s efforts have been blocked by council who operates like a criminal enterprise.
      - Article 2: recent action of City Council to purchase land for recreation, $2.65 million, near Airport and not near poorer neighborhoods was political, racist and typical of this council — a Faux hope move.
      - Article 2: Mayor fought passionately for a location that favored the most kids; her mistake was the kids were minorities.

      THE PIVOT:
      - Article 2 is older than Article 1; frame it as background/historical context.
      - Article 2’s “FAUX HOPE” framing connects to Article 1’s “Faux hope move” and council opposition.
      - Article 2 says council operated like criminal enterprise and represented status quo; Article 1 shows Hollis criticizing council’s drama/attitude and opposition to Mayor Wilson’s positive change.
      - Article 2’s affluent vs. working poor / No Hope context may inform Article 1’s Waterfront, soccer field, marina, oil spill grant, taxpayer money concerns.
      - Article 2 is the smoking gun or key context for Article 1 because it provides broader political frame for council opposition and Mayor Wilson efforts; Article 1’s Hollis comments can be read against that backdrop.

