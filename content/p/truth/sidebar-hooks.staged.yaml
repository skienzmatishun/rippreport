    brief: |-
      THE CONFLICT:
      *   In 2003, Mr. Howell Raines was dismissed by the New York Times after a scandal.
      *   In July 2020, Mr. Raines published commentary/a flyer referencing the Fairhope waterfront grant, which was contested by City Council members, including Robert Brown.
      *   The waterfront project is described as the first infrastructure project on the waterfront in 50 years.

      THE DISCOVERY:
      *   The waterfront project is a "citizens' plan," not solely Mayor Wilson's.
      *   Mr. Raines was misinformed, was six weeks late reading about the project, and failed to attend meetings or consult official bodies (City Council, Alabama Gulf Coast Recovery Council, etc.).
      *   The proposed changes involve a 5 percent grade, ADA compliant walkway, and do not deny access to the entire area for many months.
      *   The historical "historic bluff" cited by Raines was actually an unusable cutback covered in kudzu, not a historically significant feature.

      THE PIVOT:
      *   The 2020 article shows that opposition to the waterfront project (led by figures like Raines) was often politically motivated, based on false statements and misinformed claims, rather than objective concern for the city.
      *   This historical context challenges the current political attacks against Mayor Wilson and the project, demonstrating that the project has broad citizen support (570 citizens participated in a survey) and serves a needed infrastructure goal, countering the "PR campaign of Robert Equals Good and Karin Equals Bad."

