      *   Tom Albritton, Director of the Alabama Ethics Commission, is accused of self-dealing related to his role as one of three trustees of the Mabel Amos Memorial Fund.
      *   The Ripp Report filed an Ethics Complaint, a Writ of Mandamus, and an Alabama Bar Complaint against Albritton.
      *   The Ethics Commission dismissed complaints, including one involving a Fairhope councilman, without independent investigation.
      *   The Alabama Attorney General's office was accused of failing to respond to or investigate complaints delivered by Francis Paul Ripp.

      THE DISCOVERY:
      *   The Mabel Amos Memorial Fund, overseen by Albritton, awarded his daughters scholarships valued at $105,000 for the University of Texas.
      *   This financial benefit derived from the trust Albritton helped oversee constitutes the core accusation of self-dealing and IRS code violations.

      THE PIVOT:
      *   Article 2 established the concrete financial evidence ($105,000 scholarship from the Mabel Amos Memorial Fund) proving Albritton's conflict of interest.
      *   Article 1 uses this specific evidence to argue that if the Ethics Director is self-dealing, the Ethics Commission's findings against others (like the Fairhope Councilman) are invalid, serving as a litmus test for state oversight.

