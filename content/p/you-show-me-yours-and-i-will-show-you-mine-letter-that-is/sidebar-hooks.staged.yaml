  bp-restore-act-application:
    brief: |-
      THE CONFLICT:
      1. In 2013 (April and October), Fairhope negotiated a lawsuit settlement regarding the Fly Creek Watershed Restoration Project using BP Restore Act funds.
      2. Mayor Tim Kant and Senator Trip Pittman were already subjects of multiple fraud investigations involving BP.
      3. The settlement process violated open meeting rules, omitting public input, and cost the city $3 million in attorney fees, $3 million in a down payment, and a $5.75 million debt.

      THE DISCOVERY:
      1. The "Study" used to justify the Restore Act funds was flawed because it omitted that Arthur Corte's development (Shoppes at Fairhope Village/Publix) caused the creek damage.
      2. Thompson Engineering, the firm that created the flawed study, was also responsible for a failed $4.6 million BP boom project (July 2010) in Perdido Pass.

      THE PIVOT:
      1. The 2013 BP fraud investigations and open meeting violations (Article 2) establish a historical pattern of questionable ethical and financial dealings by Mayor Kant and Senator Pittman related to BP funding, directly contextualizing the current conflict of interest (Pittman securing municipal contracts for debris removal) and undermining their claims of Ethics Commission exoneration regarding the BP Boom Grant (Article 1).

