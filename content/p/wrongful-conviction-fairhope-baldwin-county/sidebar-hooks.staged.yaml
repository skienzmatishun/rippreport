  sheriff-huey-boss-mack-secret-police-2:
    brief: |-
      THE CONFLICT:
      - Systematic misconduct and excessive force by the Baldwin County Sheriff’s Office (BCSO) under Sheriff Huey “Hoss” Mack.
      - May 2017: Death of Jonathan Victor, unarmed, shot by BCSO; highlighted lack of de-escalation/crisis training.
      - March 5, 2018: Death of Robert Yates; SWAT team fired over 114 rounds into a residence during an eviction involving a mentally ill individual.
      - Alleged political maneuvering by Sheriff Mack and former State Senator Trip Pittman to manipulate sheriff qualifications and secure election results.
      - Conflict of interest regarding Mack Funeral Home (the Sheriff's private business) receiving county contracts for unclaimed deceased persons.

      THE DISCOVERY:
      - Article 2 reveals a pattern of "secret police" behavior, including the selective release of body camera footage and the use of legal decisions (Lagniappe decision) to restrict public access to law enforcement records, 911 transcripts, and autopsy information.
      - Evidence of judicial bias, specifically involving Judge Scully, who is alleged to rule in favor of the BCSO in cases involving the Sheriff.
      - Documentation of taxpayer funds ($700,000 for cameras) being used under the guise of transparency, while actual transparency is allegedly undermined by the department.

      THE PIVOT:
