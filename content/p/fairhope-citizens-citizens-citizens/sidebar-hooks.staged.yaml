  hi-jack-ed:
    brief: |-
      THE CONFLICT:
      *   Fairhope Airport Authority (FAA) has a debt representing 21 percent of Fairhope's overall borrowing.
      *   The FAA purchased 258 acres in 2007 for $8.85 million.
      *   Mayor Karin Wilson sought to exercise an option in the original loan to take back the land for $10.00 if the principal was not paid by 2012.
      *   Jack Burrell, Council President and Airport Authority Board member, publicly mocked Mayor Wilson's efforts ("the citizens. the citizens. the citizens.").
      *   In the current dispute, Burrell persuaded three newly elected councilmen to oppose Wilson's request that the 258-acre property be placed under city ownership.

      THE DISCOVERY:
      *   The FAA has historically operated with minimal public scrutiny, receiving $0.5 million annually from the Fairhope budget.
      *   The FAA board consisted of members with personal or financial connections to the Airport, creating a conflict of interest.
      *   Burrell was a remnant of a previous, failed administration, elected by a write-in vote, and was linked to the former Mayor.

      THE PIVOT:
      *   Article 2 establishes Burrell's long-standing institutional loyalty to the FAA and its leadership (conflict of interest/financial connections) rather than to the Fairhope citizens.
      *   This historical context explains his refusal to recuse himself from bid selection allegations and his current opposition to Mayor Wilson's attempt to shift the 258-acre property and manage the 21% city debt.

      KEY ENTITIES:
      *   Karin Wilson (Mayor)
      *   Jack Burrell (Council President, Airport Authority Board member)
      *   Fairhope Airport Authority (FAA)
      *   Fairhope City Council (Kevin G. Boone, Jay Robinson, Robert Brown, Jimmy Conyers)
      *   258 acres
      *   $8.85 million (purchase price of land)
      *   21 percent (FAA debt relative to overall borrowing)
      *   January 9th (City Council meeting date mentioned in Article 1)
