  a-time-for-reflection-goobers-on-notice:
    brief: |-
      THE CONFLICT: In August 2016, Karin Wilson won a political upset in Fairhope, defeating #1 Goober Tim Kant, ending a system where two mayors were controlled by a dubious process involving the Mayor’s father-in-law controlling vote counting.
      THE DISCOVERY: The election change was facilitated by the Alabama Secretary of State’s Office sending a top attorney to oversee the vote, signaling a commitment to transparency.
