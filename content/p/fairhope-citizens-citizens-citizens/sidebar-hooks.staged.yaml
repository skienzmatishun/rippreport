  green-acres-on-acid:
    brief: |-
      THE CONFLICT: State Senator Tripp Pittman was awarded BP contracts from Fairhope and Perdido beach totaling $750,000.00; he acted as a trustee of BP funds for Baldwin County, used his tractor company (lacking a general contractor’s license) as a marine contractor, and supplied used/defective boom, subsequently cutting recovery ropes at water level.
      THE DISCOVERY: Baldwin County lacks accountability; convictions are rare (last in 2006 with Mayor Steve Russo); the Alabama Ethics Commission is ineffective in handling complaints regarding political corruption.
