hooks:
  ethic-less-in-alabama:
    brief: |-
      THE CONFLICT: Senator Lee "Trip" Pittman secured City of Fairhope contracts starting in 2004, including debris removal (2007, 2010) and the "Oil Spill 2010" contract ($625,575.00); Pittman lacked a required General Contractor's License until May 7, 2012. Kevin Boone ran for Fairhope councilman in 2012 (April 27, 2012) and later agreed to settle the Triangle Lawsuit for $12.2 million. In 2014, Chris Elliott and Dane Haygood formed Elliott, Haygood & Stacy, collecting funds from Kevin Boone ($7,000).

      THE DISCOVERY: The Alabama Ethics Commission (AEC), led by Hugh Evans, repeatedly assisted Senator Pittman in obtaining and extending lucrative City of Fairhope contracts (e.g., July 17, 2014), despite evidence of improper conduct and lack of licensing.

      THE PIVOT: The historical evidence of AEC corruption enabling Pittman's contracts (2004-2014) establishes a pattern of local political corruption in Fairhope, which provides context for the 2014 revelation that Kevin Boone's son, Scott Boone, formed Catalyst Associates, LLC (August 11, 2014), which was hired by Judge Michelle Thomason (August 14, 2014), linking Boone's network to municipal contracting practices under the same compromised local political environment.

      KEY ENTITIES: Kevin Boone; Chris Elliott; Tim Kant; Scott Boone; Lynn Stacey; Catalyst Associates, LLC; Judge Michelle Thomason; Senator Lee "Trip" Pittman; Hugh Evans; Alabama Ethics Commission (AEC); Francis Paul Ripp.
    llm_text: Senator Lee "Trip" Pittman secured $625k Fairhope contracts, including the 2010 Oil Spill job, before ever getting a proper license. The Alabama Ethics Commission, led by Hugh Evans, repeatedly aided Pittman, exposing deep local political corruption in Fairhope.
