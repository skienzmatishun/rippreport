  sheriff-huey-boss-mack-secret-police-2:
    brief: 'THE CONFLICT:

      * May 2017: BCSO deputies killed unarmed Jonathan Victor; BCSO lacked crisis
      intervention teams and de-escalation training at the time.

      * March 5, 2018: BCSO SWAT team breached Robert Yates’ home with over 114 rounds,
      tear gas, and concussion grenades after he fired one warning shot; situation
      was not exigent or emergency.

      * Deputy Justin Correa (son of Sheriff Huey "Boss" Mack’s father, Robert Correa)
      participated in the fatal shooting of Robert Yates; deputy stated he was “gonna
      go in and kill this f*cker if I have to.”

      * Robert Correa warned his son of a conflict of interest regarding his involvement
      in the Yates case.

      * BCSO video/audio of the Yates incident described as “selective” by victims’
      family.

      * BCSO investigated its own officers for multiple deaths (VICTOR, YATES) and
      never requested FBI assistance or used ALEA capabilities.

      * Other BCSO-related deaths/incidents: Kevin J Andrews (traffic pursuit death),
      Peyton Little (alleged CI for drug task force found strangled with seatbelt
      in moving car; declared suicide without questioning his CI status or prior threats;
      Sheriff Mack told FOX 10 the people “ran from us” and caused the situation),
      William ''Bill'' Smith (deputy died on four-wheeler without life vest), Murry
      Lawrence Jr. (sentenced to life without parole with no physical evidence: no
      gun, witness, fiber, fingerprints, blood, or DNA; multiple alibi witnesses present).


      THE DISCOVERY:

      * BCSO received over $65 million in funding during 2020 and 2021.

      * Baldwin County General Fund increased from $39.8M (2021) to $47.5M (2022);
      BCSO flat funding at $33.6M over the prior year; $700,000 spent on body and
      vehicle cameras.

      * Sheriff Huey "Boss" Mack’s private business, Hoss Mack Funeral Home, received
      a county contract to handle deceased persons under special circumstances, creating
      an obvious conflict of interest (e.g., potentially handling Victor or Yates
      cases).

      * Judge Scully was alleged to have made biased rulings favoring BCSO in cases
      involving the Sheriff''s Department.

      * The September 30, 2021 Lagniappe legal decision effectively closed public
      access to law-enforcement records connected to investigations in Alabama (body-cam
      video, 911 transcripts, autopsy info, etc.), described as a “Closed Records
      Act.”


      THE PIVOT:

      * Article 2 provides the context for Article 1 (Matt McKenzie’s campaign kickoff)
      by showing that the local sheriff and his department are under scrutiny for
      alleged excessive force, internal investigations of officers’ deaths, a funeral-home
      conflict of interest, and legal rulings restricting public records access. This
      makes Matt McKenzie’s election into Baldwin County (presumably sheriff or related
      office) a race with high stakes tied to the BCSO’s record.


