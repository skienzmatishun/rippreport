      *   The debate centers on Council At Large vs. Districts.
      *   65 people voted to support At Large over Districts.
      *   Mr. Chuck Zunk (supported by 39 people) declared the need to remain with an "at large" council.
      *   The proponents (Skunk, City Council, CATALYST) are alleged to prioritize power/control over accountability.

