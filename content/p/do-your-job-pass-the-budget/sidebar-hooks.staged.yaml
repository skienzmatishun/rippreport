  listening-not-reading:
    brief: |-
      THE CONFLICT:
      *   Council President Jack Burrell faced ethics complaints regarding the Fairhope Airport Authority (FAA) hanger lease (costing $750,000 for a $1 million airplane).
      *   On 1/12/11, Councilman Rick Kingrea sent a "plain vanilla request" to the Attorney General referencing possible ethical violations by public officials related to the BP oil spill.
      *   Karin Wilson became Mayor of Fairhope during the first fair election, succeeding a period where Burrell held significant council power.

      THE DISCOVERY:
      *   Article 2 proved that the FAA was compelled to bid the hanger lease because Mr. Hix was on the Airport Authority board.
      *   The Ethics Commission mandate requires public officials to conduct business through a bid process, regardless of whether specific bid laws apply.

      THE PIVOT:
      *   Article 1 accuses Burrell of protecting cronies at the airport while hiding behind the Alabama Non-Ethics Commission. Article 2 provides documented evidence (Hix's board membership and Ethics Commission rulings) that Burrell was deliberately misleading the public about the legal requirement for bidding.

