      *   Mr. Hix
      *   Karin Wilson (Mayor)
      *   Mayor Kant
      *   Fairhope City Council
      *   Fairhope Airport Authority
      *   Ethics Commission
      *   Rick Kingrea
      *   Alabama Non-Ethics Commission
