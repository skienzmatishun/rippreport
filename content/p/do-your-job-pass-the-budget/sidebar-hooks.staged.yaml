      THE DISCOVERY: The Council has a history of using executive session and agenda tricks to hide costly lawsuits from the public, resulting in millions paid to taxpayers for employee settlements.
      THE PIVOT: Article 2 establishes the recurring pattern of the Council overriding the Mayor and using taxpayer funds for litigation settlements related to fired employees; this context explains the current obstruction (Article 1) where the council again sides with fired employees in litigation while blocking the city budget.
      KEY ENTITIES: Fairhope City Council, Mayor, Burrell (Council President), Fairhope Airport, Fly Creek Apartments, Triangle lawsuit
    llm_text: Fairhope City Council repeatedly hides millions in fired employee settlements—like the Triangle lawsuit—using executive sessions, often overriding the Mayor. See how the Council's pattern of secrecy is blocking the city budget and impacting taxpayers today.
