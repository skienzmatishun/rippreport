  free-speech:
    brief: |-
      THE CONFLICT:
      *   Ground Lease and Operating Agreement for Mid-Bay Air, LLC involved H. Ray Hix and the Fairhope Airport Authority (FAA).
      *   The process spanned December 16th, 2015, through March 20th, 2017.
      *   The FAA Board, including Joe McEnerney (Board Chairman), and associated members were linked to potential conflicts of interest.

      THE DISCOVERY:
      *   The request for Advisory Opinion to the Alabama Ethics Commission on December 16th, 2015, contained false documents (the Dec 21st lease differed from the executed Dec 17th lease).
      *   The documents proved the FAA failed to comply with the February 3rd, 2016, Ethics Advisory Opinion requiring contract filing within 10 days of signing.
      *   The RFP process was tainted, suggesting Board members used inside information for personal gain.

      THE PIVOT:
      *   Article 2 provides documented proof of historical ethical breaches and cronyism within the Fairhope Airport Authority, validating Article 1's claim that Council President Burrell protects "his crony friends at the airport."
      *   The historical conflicts revealed in Article 2 provide context for the current budget obstruction (Dec 6th/18th) which centers on the "sacred cow" of the Fairhope Airport.

      KEY ENTITIES:
      *   Jack Burrell (Council President)
      *   Fairhope City Council
      *   Fairhope Airport Authority (FAA)
      *   Joe McEnerney (FAA Board Chairman)
      *   H. Ray Hix (Mid-Bay Air, LLC Operator)
      *   Pam Caudill (FAA Board member)
      *   Dennis R. Bailey ESQ (Rushton, Stakley, Johnston and Garrett)
      *   Alabama Ethics Commission
      *   Mike Turner
      *   Fairhope (City/Baldwin County)
      *   December 17th, 2015 (Executed Lease)
      *   December 21st, 2015 (Submitted Lease/Exhibit C)
      *   February 3rd, 2016 (Ethics Advisory Opinion)
    llm_text: Joe McEnerney and the Fairhope Airport Authority used false documents regarding the H. Ray Hix lease, violating key ethics rules. Discover documented cronyism at the FAA, proving Council President Jack Burrell protects his friends and impacts your local budget.
