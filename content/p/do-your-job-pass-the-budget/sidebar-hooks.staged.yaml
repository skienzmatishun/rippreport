    brief: |-
      THE CONFLICT: Environmental neglect and regular sewer spills/sewage dumping in Fairhope/Daphne/Spanish Fort Fly Creek Watershed (Oct 9, 2017). Councilman Kevin Boone had an exposed LLC related to the Firefly subdivision within this watershed.
      THE DISCOVERY: City officials (City of Fairhope, EPA, Dept of Health, etc.) failed to follow up or contact citizens regarding foul odors and discolored, contaminated water in the Fly Creek Watershed (Oct 2017).
      THE PIVOT: Article 2 demonstrates a historical pattern of City Council prioritizing private interests (Arthur Corte's land, Boone's LLC) over public environmental welfare, establishing the context for the later obstruction of the Fairhope City Budget (Dec 2017) where Council President Burrell protected crony interests (Fairhope Airport) and sided with disgruntled, litigating employees over the city's long-term fiscal health.
