  miracle-blindside-reality:
    brief: |-
      THE CONFLICT:
      *   December 7th: Planning and Zoning in Fairhope met to vote on the controversial Fly Creek PUD.
      *   Approximately 300 people attended the meeting, which was held in the auditorium due to turnout.
      *   Initial consensus leaned toward approval, but public agitation led to a hand-raised vote.
      *   Councilman Ford and Jennifer Fiddler voted no.
      *   The final vote was 5 no, 4 yes.
      *   Land owner Arthur Corte (non-resident) was the developer for 240 "upscale apartments."

      THE DISCOVERY:
      *   The initial PUD approval was prevented by significant public turnout and citizen demands.
      *   Arthur Corte acted like a "spoiled brat" and threatened the Mayor and certain council persons with retaliation after the initial vote.
      *   Previous instances of "BLINDSIDE" tactics include the Triangle lawsuit, which cost the city $11.25 million due to lack of public notification.

      THE PIVOT:
      *   Article 2 establishes the Mayor previously yielded to public concern (Dec 7th), contradicting Article 1's claim that the Mayor is simply loyal to Mr. Corte.
      *   Article 2 provides historical evidence of the Mayor/City Hall utilizing non-transparent, "BLINDSIDE" tactics (e.g., Triangle lawsuit, no public notification) that Article 1 suggests he plans to repeat to reintroduce the PUD through the City Council.

