  fairhope-railroad:
    brief: |-
      THE CONFLICT:
      The Fly Creek PUD, initially conceived as high-end townhomes and including the Publix site, was improperly developed, becoming a strip center.
      This development led to a $11.5 million triangle lawsuit settlement and a $300k-$400k creek/right-of-ways lawsuit.
      Severe creek and wetlands damage resulted, with cleanup estimated at approximately 10 million dollars.
      Taxpayers funded infrastructure benefitting the developer, including a sewer lift station (several hundred thousand) and a fire station (costing taxpayers half a million plus contents).
      The development cleared the entire property, violating original plans, including the removal of 1 million worth of trees, which the city ignored despite Tree Committee evaluation.

      THE DISCOVERY:
      Article 2 revealed the development was an "ultimate good ole boy deal" driven by Mayor's favoritism toward political contributor Arthur Corte, who did not live in the city, proving corruption and betrayal of public trust.
      The city ignored major violations (e.g., clearing the entire property, tree removal) while favoring contractors and developers who contributed to the Mayor's campaign.

      THE PIVOT:
      Article 2 establishes that the city (Mayor and P&Z) previously ignored significant environmental and planning violations related to Phase 1 of the project, providing Arthur Corte the leverage to push the apartment project (Phase 2) despite public opposition (300+ attendees in Article 1).
      The fact that the project started in 2006 (Phase 1) and has an indefinite timeline despite P&Z denying development on the triangle for 25 years, is a major flaw the Mayor uses to "BLINDSIDE" the community by avoiding public hearings via City Council.

