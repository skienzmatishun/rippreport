  fly-creek-drainage-ditch:
    brief: |-
      THE CONFLICT: Mayor Tim Kant attempted to slip a zoning change for the Fly Creek PUD (Publix property, 285 apartments and 15 townhomes) into planning and zoning to facilitate a deal with Arthur Corte. The preliminary and final plat approval was scheduled for January 5th.
      THE DISCOVERY: The Fly Creek PUD changes were ultimately rejected by the public and Planning and Zoning by a 5/4 vote, with Mayor Kant and Councilman Ford voting against the proposal following public pressure from 300 citizens.
      THE PIVOT: Article 2 establishes Mayor Kant's initial deceptive attempt to bypass public participation and City Council awareness in January. Article 1 shows the public successfully thwarted this attempt and documents the Mayor's subsequent political maneuvers (lobbying, attempting to use City Council "blindside" the public) to reintroduce the project despite the rejection.
