hooks:
  whose-agenda:
    brief: |-
      THE CONFLICT:
      - Baldwin County is the piggy bank for Goat Hill, supported by the same elected officials.
      - Chris Elliott, the Tax Man, as a Baldwin County commissioner, taxed citizens of Baldwin County without any vote of his constituents.
      - Chris Elliott raided the 1% school tax by $200,000 a year for the county.
      - Chris Elliott supported the gas tax as county commissioner, again without any vote by the public.
      - Over 80% of voters opposed the gas tax.
      - Elected officials did not listen, per the main article.
      - The political plan described: tax them right after being elected, because voters will forget in 4 years.
      - The gas tax was for infrastructure, but it was raided by Goat Hill for over a decade and would continue.
      - Former Governor Riley drained every account he could before leaving office.
      - Former Governor Bentley used BP funds to build a beach mansion.
      - Former State Senator BP Pittman skimmed $750,000 of BP money for his company.
      - Were any elected officials held accountable? No.

      THE DISCOVERY:
      - Article 2, WHOSE AGENDA?, is older than Article 1 and should be framed as background/historical context.
      - Fairhope City Council agenda, March 8.
      - Resolution 10: Mayor Karin Wilson or Council President Jack Burrell, on behalf of the City of Fairhope, authorized purchase of properties owned by the Baldwin County Board of Education: K-1 Center, Fairhopers Community Park, and James P. Nix Center; and authorized execution/negotiation of documents to complete closing and acquire title pursuant to the executed Land Purchase Contract.
      - Resolution 10: This was the second round of purchasing the K-1 Center; the first failed. Council promised public hearings.
      - Resolution 11: City Council approved/authorized Mayor Karin Wilson to execute one Memorandum of Understanding between M&N of Alabama, LLC and the City of Fairhope for dredging of Main Channel of Fly Creek; and authorized Mayor to execute contract for Bid No. 008-19.
      - Resolution 11: $500,000 contract split between City and Fairhope Yacht Club. Council did not say why dredging was needed or where material came from. Publix flooding caused unstable construction site to spill tons of red fill and topsoil into creek; future dredging expected; taxpayer to pick up check.
      - Resolution 12: Authorize filing with Baldwin County Board of Education of Baldwin County, Alabama, of a Request for a Special 3 Mill Ad Valorem School District Tax Election.
      - Resolution 12: Council President Jack Burrell “wanted out of the school business.” Shift responsibility from Council to self-imposed tax. Council did not explain/discuss Mayor Karin Wilson’s option of a more expedient and equitable solution not involving taxes. Council could have provided funds; chose referendum and tax. Council played political games with kids and withheld information.
      - Resolution 27: Mayor Karin Wilson authorized Change Order No. 2 to Bid No. 005-18, Library Envelope Repairs 2019, adding 12 calendar days to contract for miscellaneous repairs due to unforeseen conditions; awarded Change Order to MW Rogers Construction Co., LLC.
      - Resolution 27: Change Order extended contract time from 210 calendar days to 222 calendar days.
      - Resolution 27: Former Mayor Can’t, former Public Works Jennifer Fidler, Council President Burrell, and Councilman Boone on top of totem pole of responsibility. Library plagued with construction issues since day one; then Mayor and Council did not hold anyone responsible; repairs stacked until present administration. Library closed for weeks; Council said nothing. Should be special investigation. How build library for millions and have no warranty?
      - Resolution 30: Executive Session to discuss City’s willingness to offer/accept when considering purchase, sale, exchange, lease, or market value of real property; discussions could have detrimental effect on competitive position if discussed in public.
      - Article 2 history of Council, with aid of City Attorney, should make everyone nervous. Not discussing things in public is their agenda.

      THE PIVOT:
      - Article 2 is older than Article 1 and is background/historical context for Article 1.
      - Article 2 shows Fairhope City Council actions/resolutions and prior controversies.
      - Article 2 is the smoking gun or key context for Article 1 because it documents local government conduct, lack of public information, developer favoritism, school tax shift, library issues, and real estate executive session.
      - Article 2 frames the main article’s claims about Baldwin County, Goat Hill, elected officials taxing without representation, ignoring voters, corruption, and tax raids.

