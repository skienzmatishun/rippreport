  faux-tax-gas-tax:
    brief: |-
      THE CONFLICT:
      1. Baldwin County elected "THE TAX MAN" Senator Chris Elliott as County Commissioner.
      2. Elliott implemented the "back room penny school tax" which cost Baldwin County Schools $200,000 annually.
      3. Elliott allegedly skimmed this $200,000 annually for county infrastructure needs.

      THE DISCOVERY:
      1. In a special session announcement, Governor Kay Ivey proposed a gas tax.
      2. The gas tax legislation also included a bond issue to improve the Alabama State Docks and the Mobile Bay ship channel dredging, estimated at $400,000 to $600,000.

      THE PIVOT:
      1. Article 2 establishes the historical pattern of local elected officials (Chris Elliott) using local taxes (penny school tax) under the guise of "infrastructure" to skim funds.
      2. This pattern is repeated in Article 1, where Elliott supports the gas tax and raided the 1% school tax ($200,000/year) for county use, linking the gas tax to the same infrastructure/dredging interests (Mobile Bay).

      KEY ENTITIES:
      1. Chris Elliott (County Commissioner)
      2. Baldwin County
      3. Kay Ivey (Governor)
      4. Business Council of Alabama (BCA)
      5. Gulf Shores
      6. Orange Beach
      7. Baldwin County Schools
      8. Mobile Bay / State Docks
      9. Jim Page (Alliance for Alabama’s Infrastructure)
    llm_text: Baldwin County Commissioner Chris Elliott allegedly skimmed $200,000 from Baldwin County Schools using the "penny school tax." Now, he backs Governor Kay Ivey’s gas tax, linking local misuse to massive Mobile Bay dredging interests.
