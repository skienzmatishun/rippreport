  nothing-is-free:
    brief: |-
      THE CONFLICT:
      *   Prior to recent events, State Senator Tripp and BP Pittman operated without accountability, skimming $750,000 of BP money for his company.
      *   Former Governor Riley and Former Governor Bentley were involved in draining state accounts and using BP funds for a beach mansion, respectively.
      *   Baldwin County has historically supplied approximately 35% of the general state budget.

      THE DISCOVERY:
      *   Alabama is one of only three states that permits municipalities to impose police, planning, and other exterritorial jurisdictions in areas outside city limits, enabling "taxation without representation."

      THE PIVOT:
      *   Article 2 establishes the legal precedent (Alabama allowing taxation without representation) that permits the actions described in Article 1, where County Commissioner Chris Elliott taxes Baldwin County citizens without voter consent (e.g., raiding $200,000 annually from the 1% school tax and implementing the gas tax, despite over 80% voter opposition).

      KEY ENTITIES:
      *   Chris Elliott (State Senator/County Commissioner)
      *   BP Pittman (Former State Senator)
