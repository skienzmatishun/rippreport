hooks:
  people-power-wake-up-gulf-shores:
    brief: |-
      THE CONFLICT:
      *   Gulf Shores Planning Commission approved the Regency Place Apartments Site Plan Application on October 3, 2018, via a 6 to 3 vote.
      *   Citizens, led by Pete Sims, filed an appeal to the Gulf Shores City Council on October 22, 2018.
      *   The City Council hearing was scheduled for Monday, October 29, 2018, at 4:00 p.m.

      THE DISCOVERY:
      *   City Staff previously included the Land Use Plan (LUP) as a critical criterion when evaluating Site Plans (e.g., 2014 and 2016).
      *   The LUP designates the property as Medium Density Residential (6-10 units per acre).
      *   The LUP criterion was omitted from City Staff recommendations regarding the Regency Place Apartments, violating Zoning Ordinance Article 1 General Provision 1-3.

      THE PIVOT:
      *   The Planning Commission's approval was flawed because it failed to consider the LUP, which dictates a low-density standard, while approving a high-density (20.6 DUPA) 100% rental complex.
      *   The omission of the LUP criteria renders the Planning Commission's decision legally inconsistent with the Comprehensive Plan/LUP.

      KEY ENTITIES:
      *   Pete Sims
      *   Robert Craft (Mayor)
      *   Philip Harris (Councilman/Planning Commission)
      *   Mayor Dane Haygood (Daphne)
      *   Gulf Shores City Council
      *   Regency Place Apartments
      *   Gulf Shores
      *   October 3, 2018
      *   October 29, 2018
      *   13.8% property value decrease
      *   20.6 DUPA (Proposed) vs. 8.1 DUPA (Average)
    llm_text: Pete Sims challenges the Regency Place Apartments approval because the Planning Commission ignored the LUP, approving a high-density 20.6 DUPA complex. The Gulf Shores City Council must address this zoning violation now to protect local standards against unchecked development.
