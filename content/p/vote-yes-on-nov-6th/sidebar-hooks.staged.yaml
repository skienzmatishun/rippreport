  special-interest:
    brief: |-
      THE CONFLICT: Special interests, including Catalyst connections and members of the Tim Can’t Club, oppose change in Fairhope Government, fearing loss of access and control. The conflict centers on the Fairhope Council-Manager Referendum scheduled for November 6th, 2018.
      THE DISCOVERY: The current Fairhope City Council, described as an "at Large Catalyst council," has the most dismal record of any Fairhope Council in 20 years and has failed to deliver a budget on time.
      THE PIVOT: Article 2 establishes the existence of powerful special interests and the poor performance of the incumbent council, providing the critical historical context and justification for the "YES" vote campaign detailed in Article 1.
      KEY ENTITIES: Fairhope, Fairhope City Council, Catalyst, Fresh Start Fairhope, Tim Can’t Club
    llm_text: Don't let special interests like the Catalyst and Tim Can’t Club block change in Fairhope. The current Council has a dismal 20-year record and failed to deliver a budget on time, making the November 6th vote crucial.
