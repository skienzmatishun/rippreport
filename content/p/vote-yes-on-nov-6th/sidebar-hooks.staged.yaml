  elliott-stacy-haygood-catalyst-who-is-in-the-picture:
    brief: |-
      THE CONFLICT:
      *   Approximately 30 years ago, the "machine" was led by Chris Elliott, Dane Haygood, and Lynn Stacy.
      *   Chris Elliott was appointed to the County Commission; Dane Haygood was elected Mayor of Daphne; Lynn Stacy retired.
      *   The group morphed into CATALYST, aiming for "TOTAL CONTROL" of Baldwin County.
      *   CATALYST historically controlled three key positions: Mayor of Fairhope, control of the County Commission, and State Senate Seat 32.

      THE DISCOVERY:
      *   CATALYST ran Baldwin County "in a dark closet and much the same as a criminal enterprise."
      *   CATALYST's secondary goal was placing candidates across Baldwin County Government (Sheriff, probate Judge, County Clerk, etc.).
      *   The group's control weakened when Mayor Wilson defeated Mayor Tim Can’t and Senator Pittman took $750,000 from BP/County citizens.

      THE PIVOT:
      *   Article 2 establishes CATALYST’s decades-long pattern of entrenched, controlled governance.
      *   Article 1 calls for voters to reject CATALYST candidates (Michelle Thomasson, Chris Elliott, Tucker Dorsey) in upcoming elections (July 17th, Nov 6th) to prevent the deterioration of Baldwin County.
      *   Chris Elliott is seeking State Senate Seat 32, with a reported campaign collection over $500,000 (potentially $600k+).

