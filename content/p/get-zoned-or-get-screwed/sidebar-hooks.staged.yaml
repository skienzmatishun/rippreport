  fauxhope:
    brief: |-
      THE CONFLICT:
      - Fairhope, Alabama: Fairhope Mayor Sullivan and Fairhope City Council embraced development; supported in last election by developers and special interests; quality of life not their concern.
      - Proposed zoning District 8: African American community jammed between RSA development (bordering Thomason Hall Road) and Fairhope; choice to annex into Fairhope or establish zoning district; without either may face gas station/storage buildings with barb wire fencing next door; zoning is way to go; District 8 extends down Hwy 32 bordered by Hwy 13; many subdivisions included.
      - Proposed zoning District 37: Lawrence Road area; NOT in city limits but within 5-mile line from Fairhope's outer City Limits; county land but NOT zoned; "wild west" for developers; sold land only regulated by planning guidelines, not neighboring property owners' wishes; within 5 miles decisions up to Fairhope City Council; no representation; Elizabeth Gabel Wilso proposing county zoning.

      THE DISCOVERY:
      - Waterfront project: federal grant 6.2 million required ADA compliance; council delayed close to a year trying to get around ADA compliance; Mayor Wilson from day one explained grant required ADA compliance; council voted to approve resolution to add ADA access; Mayor Sherry Sullivan said federal grant requires ADA access; took Sullivan close to a year to understand provisions; conceded ADA compliance mandatory; swim area and rock jetties eliminated by Council President Burrell because he did not like the look; citizens sorely disappointed what they get for 6.2 million.
      - Municipal elections: political distortions; plan went from resilient and sustainable to short-sighted maintenance in new administration within as little as a few weeks.
      - Alabama legislature: passed legislation moving municipal elections a year forward; Fauxhope Council and Mayor serve extra year without a single vote; voter disenfranchisement, Alabama style.
      - Stewart "The Liar" Speed (Leaf River Group, developers from Mississippi): told Fairhope audience of 250-300 citizens apartments would be luxury apartments; signature apartments of Leaf River; never sold to other management; environmental sound; never contaminate Fly Creek; all lies, knew it, recorded live.
      - Burrell: acquisition at intersection of Alabama 181 and Baldwin County 48 gives city control over storm water retention and drainage; Burrell known for liability land gifts; real gift is city liability; like what he did for developer buddy Arthur Corti.
      - Mayor Wilson: expressed shock and concern City should not have taken ownership of property; she was right.
      - Comprehensive Plans: FAUXHOPE had two previous Comprehensive Plans, both failures; most flagrant violator of so-called Comprehensive plan is the city itself; plans always favor developers; current plan will waste paper and air because council and mayor will do what they want, development before infrastructure.
      - Retention pond: filling in behind ABC store costing about $1 million in dirt; by paying $250,000 for land, saved about three-quarters of a million; Burrell said thought they were being good stewards.

      THE PIVOT:
      - Article 2 (FAUXHOPE) is older than Article 1 (GET ZONED or GET SCREWED); Article 2 framed as background/historical context.
      - Article 2 showed/revealed: Fairhope municipal government waste, waterfront delay, ADA circumvention, developer lies, Comprehensive Plans favoring developers, Burrell liability land gifts, pro-development behavior.
      - Article 2 is the smoking gun for Article 1 because it documents the past behavior of Fairhope's mayor/council and developers that supports Article 1's present-day zoning argument: un-zoned properties are what developers look for and they do not give a damn how their development affects quality of life.

