    brief: |-
      Based on all the facts gathered, here is the Bridge Brief:

      **THE CONFLICT:**
      - Steve Marshall (Ripp Report) filed two complaints with the Alabama Attorney General's office.
      - Complaint 1: Against Tom Albritton, Executive Director of the Alabama Ethics Commission, for self-dealing with the Mabel Amos Memorial Trust (worth ~$8.2M), where Albritton's children received $135,000 in scholarships while he served as a board member.
      - Complaint 2: Against Baldwin County Sheriff Hoss Mack, District Attorney Robert Wilters, and prosecutor David Whetstone for conspiracy to withhold the exculpatory coroner's report from defense in Murray "Bubba" Lawrence Jr.'s wrongful conviction (2005).
      - Lawrence has been imprisoned for 6,570 days (over 18 years) despite lack of physical evidence (no gun, ballistics, fingerprints, DNA, blood, witnesses).

      **THE DISCOVERY:**
      - The "TOP SHELF CORRUPTION" article reveals that the same institutions shielding Albritton are also shielding other corrupt officials:
        - Phillip McCallum (former Alabama State Bar Executive Director) resigned Oct. 23, 2020. On Dec. 2, 2020, the Ethics Commission found him guilty of 17 violations of the Alabama Ethics Law. He was fined $100,000 but faced ZERO criminal prosecution by Attorney General Steve Marshall's office.
        - The Ethics Commission itself has a long pattern of "administrative resolutions" (i.e., fines only) without criminal referral for high-ranking officials.
        - Albritton himself: After the Ethics Commission found him guilty of self-dealing in July 2022 (Ripp Report complaint dismissed by his own commission), he remained as Executive Director and continues to serve on the board of the very trust he mismanaged. He resigned from the Mabel Amos board only after AG Marshall filed a civil lawsuit against the trust in April 2023, alleging $135,000 in improper scholarships to his children. The case was settled by Judge Greg Griffin without Albritton facing criminal charges.
        - Regions Bank (the trust's trustee) and Albritton settled the civil suit; terms were sealed but "more than recovered" what state alleged was misappropriated—no criminal liability.

      **THE PIVOT:**
      - Article 2 is the smoking gun for Article 1 because it proves the institutional pattern: The Ethics Commission, State Bar, and Attorney General's Office form a closed loop that protects corrupt officials from real accountability. When Marshall himself is accused of "punting" on criminal investigations (as with McCallum), he simultaneously acts as Marshall's own prosecutor in the ethics system against Albritton—making any subsequent criminal charges appear performative. Article 2 shows that even when corruption is proven and fined, the perpetrators retain their positions and escape punishment, which validates Ripp Report's claim that "the AG's lawsuit against Albritton may be a legal masquerade."

