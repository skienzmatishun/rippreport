  cover-up:
    brief: |-
      THE CONFLICT:
      *   **Murray Lawrence Jr (Wrongful Conviction):** In 2005, Murray "Bubba" Lawrence was convicted of the murder of Brandon Hastings in Baldwin County. He has been incarcerated for over 18 years (6,570 days). Prosecutors claimed he shot Hastings, but no physical evidence (gun, DNA, ballistics, fingerprints, blood) linked him to the crime. The Sheriff and prosecutor withheld a Coroner's Report from the defense that allegedly showed no gunshot wound.
      *   **Tom Albritton (Ethics Corruption):** Albritton served as Executive Director of the Alabama Ethics Commission. In Sept. 2022, Francis Ripp filed a complaint against him for skimming $120,000 from the Mabel Amos Trust. The Attorney General's office sued him, yet he remained employed and paid while facing three lawsuits.
      *   **Bob Wills (Bay Minette Mayor):** In Aug. 2021, O.J. French was killed by Bay Minette police. Mayor Bob Wills responded to the victim's sister with a letter denying "cover up" allegations but refusing to release information. Wills also leased his private building to the Baldwin County Legislative Delegation for $867,000 over 15 years despite pending ethics and Bar complaints against him.
      *   **Systemic Cover-Ups:** The Alabama Ethics Commission and Bar Association dismissed all complaints regarding Albritton and Wills. Sheriff Hoss Mack is chair of the Baldwin County Multi-Agency Law Enforcement Task Force (BCMCU), which investigates its own member agencies (including his own Sheriff's Office) with no credibility due to self-investigation.

      THE DISCOVERY:
      *   **The "Cover Up" Mechanism:** The widget article proves that the entities accused by Ripp in Article 1 (Ethics Commission, Bar Association, BCSO leadership) are actively suppressing accountability and using legal processes as a shield rather than a tool for justice.
