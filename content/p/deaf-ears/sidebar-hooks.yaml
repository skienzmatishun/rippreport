hooks:
  alabama-ag:
    brief: |-
      THE CONFLICT:
      - Murray "Bubba" Lawrence was wrongfully convicted in 2005 for the murder of Brandon Hastings.
      - The case involved no witness, fingerprint, DNA, blood, weapon, ballistics, or timeline connecting Lawrence to the crime.
      - Sheriff Hoss Mack (Baldwin County), Judge Robert Wilters, and Prosecutor David Whetstone colluded to withhold vital information—specifically the Coroner's Report—from Lawrence’s defense during trial.
      - The prosecution filed a Motion for Disinterment claiming need for DNA; Sheriff Mack claimed Jarius Ireland had already told him "Bubba" shot the young man before even mentioning the gun.
      - Willy Huntley signed an affidavit on September 18, 2023, stating he never received the exculpatory Coroner's Report and that his line of questioning would have been more thorough had he had it.
      - The written statement by Jarius Ireland is missing from the trial record, creating a factual gap in Mack’s testimony.
      - In past 10 years, 9 people lost their lives after contact with Baldwin County Sheriff's Office; the Sheriff's own Major Crimes Division (composed of county officers) investigated themselves and found no fault.
      - Two lawsuits are pending against the Sheriff's Office involving the deaths of 6 unarmed individuals without warrants.

      THE DISCOVERY:
      - In September 2022, Steve Marshall (Ripp Report) filed a complaint with the Attorney General’s office against Tom Albritton, Executive Director of the Alabama Ethics Commission, for admitted ethical misconduct.
      - Albritton admitted to skimming $120,000 from the Mabel Amos Trust.
      - Despite this admission and an ongoing lawsuit, Albritton remains in office receiving a "handsome paycheck" while no meaningful consequences occur.
      - The Alabama Bar Association found no reason to pursue the complaint against Albritton, siding with him.
      - A Mandamus filed by Ripp Report to force a hearing from the Ethics Commission failed.
      - The AG's lawsuit is alleged to be a legal masquerade allowing Albritton to avoid consequences while remaining in office.

      THE PIVOT:
      - Article 2 (the ethics complaint) exposes the systemic failure of Alabama’s oversight bodies—the Ethics Commission, the Bar, and the AG Office—to hold anyone accountable for documented misconduct.
      - This same system failed to address the wrongful conviction of Murray Lawrence (2005–present, 18+ years), where key evidence was deliberately withheld by Sheriff Mack, Judge Wilters, and Prosecutor Whetstone.
      - The $120,000 skim by Albritton serves as a parallel: documented financial corruption with zero consequence, just like the documented evidence suppression in Lawrence’s trial.
