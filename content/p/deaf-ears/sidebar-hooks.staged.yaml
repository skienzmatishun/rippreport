  innocent:
    brief: |-
      THE CONFLICT: Murray Lawrence convicted of capital murder on May 13, 2005, for the murder of Brandon Hastings in Baldwin County, Alabama.
      THE DISCOVERY: Article 2 establishes the conviction was based primarily on accomplice testimony (Jarius McNeil) and lacks corroborating evidence (no DNA, fingerprints, ballistics, or reliable timeline), and that five witnesses placed Lawrence at home during the crime time.
      THE PIVOT: Article 2 provides the foundational details of Lawrence's wrongful conviction (2005) which Article 1 references as the "wrongful conviction of Murray 'Bubba' Lawrence, 2005" and the subsequent 18 years of incarceration.
      KEY ENTITIES: Murray Lawrence Jr, Brandon Hastings, Hoss Mack, David Whetstone, Robert Wilters, Willy Huntley, Jarius McNeil, Steve Marshall, Tom Albrittion, Alabama Ethics Commission
    llm_text: Murray Lawrence spent 18 years for Brandon Hastings' murder, yet his 2005 conviction relied only on Jarius McNeil's testimony, not DNA. See how five witnesses prove Lawrence was home, exposing a wrongful conviction in Baldwin County.
