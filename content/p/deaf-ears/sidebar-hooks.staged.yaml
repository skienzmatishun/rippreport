  rule-32:
    brief: |-
      THE CONFLICT:
      - Sept. 2022: The Ripp Report, led by Francis Paul Ripp, filed complaint against Alabama Ethics Commission Executive Director Tom Albritton/Albrittion, addressed to Attention Clark Morris.
      - Alabama Attorney General’s office filed lawsuit against Albritton; Albritton remained Alabama Ethics Commission Executive Director; Ripp stated Albritton had a “handsome paycheck.”
      - Over last 15 years: Ripp Report filed about a dozen complaints with Alabama Ethics Commission; some had irrefutable evidence involving judges, lawyers, city council members, elected/public servants; Albritton made decisions not to pursue; Albritton skimmed $120,000.00 from Mabel Amos Trust, admitted to.
      - Alabama Bar found no reason to pursue complaint, siding with Albritton; Ripp described Alabama Bar Association as a group of lawyers covering misdeeds of lawyers.
      - Ripp Report failed in Mandamus effort or getting hearing; Ripp stated citizens cannot depend on Ethics Commission or Bar Association for accountability/transparency.
      - Ripp described Alabama Ethics Commission as a political tool to cover up misdeeds of Alabama politicians.
      - Alabama Attorney General’s lawsuit against Albritton may be a legal masquerade; intended outcome may allow Albritton to avoid consequences; Albritton still Executive Director.
      - Second Ripp Report complaint: over three years of research into wrongful conviction of Murray “Bubba” Lawrence, 2005.
      - Baldwin County context: Sheriff investigated deaths involving his department and municipal police/Major Crimes Division; investigating themselves; sheriff responsible for election of many Baldwin County judges; judges reportedly lacked spine; past 10 years, 9 known people lost lives after contact with Baldwin County Sheriffs Office; in every known case, Major Crimes Division or ALEA or both failed to find fault; Ripp reported concern to Mobile FBI; multiple high-profile cases complaints about Sheriffs Department and District Attorney; wrongful convictions from sloppy police work and motivation to hold power.
      - Sheriffs Department used gray areas, rumors, publicity to avoid responsibility; used Major Crimes Division investigations as escape goat; two lawsuits known pending against Sheriffs Office involving deaths of 6 unarmed people no warrant for arrest.
      - Ripp investigation into wrongful conviction of Murray Lawrence and murder of Brandon Hastings: Lawrence was nowhere near scene; Sheriff Hoss Mack and prosecutor David Whetstone had knowledge of Lawrence innocence; race played big part; murder investigation lacked witness, fingerprint, DNA, blood, weapon, ballistics, timeline; case described as bazaar with convoluted turns; Sheriff and Whetstone and Judge willing to go along with fictitious narrative.
      - Judge in case, Robert Wilters, is current Baldwin County District Attorney; Judge, Sheriff, Prosecutor joined at hip over 30 years; cozy unhealthy relationship backbone of political corruption in Baldwin County; Sheriff became most powerful “politician” in county; most judges support sheriff unconditionally.
      - Case against Murray Lawrence was a disgrace and will stand on merits of innocence.
      - Ripp specific complaint against Sheriff Hoss Mack, District Attorney Robert Wilters, retired prosecutor David Whetstone; they colluded to withhold vital information, “Coroners Report,” from defense of Murray Lawrence.
      - Defense attorney Willy Huntley signed affidavit Sept. 18, 2023 that he never received exculpatory evidence; if he had, line of questioning would have been more thorough; report is just one more piece proving Brandon Hastings was not victim of gunshot.
      - Despite evidence, Mr. Whetstone and Sheriff Mack pushed gun theory.
      - Page 1747 of transcript and synopsis, under testimony, page 47 item 187: Mack questioned about Jarius McNeil telling Bubba had shot before gun mentioned; answered yes; if true should be in Jarius Ireland statement; Ireland statement missing Jarius written statement.
      - Ripp included Coroners report and layman’s interpretation of potential law violations; bound copy trial transcript synopsis; “A Verbal Lynching in Alabama”; copy of Lagniappe article.
      - Ripp offered trial transcript in pdf, trial transcript in word document correlating with synopsis, notes/newspaper articles/interviews, audio/podcast of long version of “A Verbal Lynching in Alabama”; willing to cooperate with AG office in person if requested.
      - Mr. Lawrence currently represented by attorneys Maxwell & Tillman in Birmingham; they handle wrongful conviction and had nothing to do with complaint.
      - Complaint addressed Coroners report and fact Judge, Prosecution, lead investigator never provided vital info to defense; Judge signed Motion for Disinterment; Prosecution filed Motion to Disinter? with excuse needing DNA for murder investigation to proceed; no evidence supports death of Brandon Hastings was shot; Sheriff, lead investigator, never found evidence of gunshot, gun, ballistic evidence, blood, fiber, fingerprints, DNA, witnesses, stolen property, cell phone records implicating Lawrence in murder of Brandon Hastings, whom he never met nor had connection to.
      - Coroners report withheld from defense deliberately; Judge, Prosecutor, Sheriff never acknowledged disinterment of Brandon Hastings during two-week trial.
      - Mr. Lawrence innocently incarcerated over 18 years, 6570 days; during same time, those responsible for incarceration advanced careers at expense of Lawrence.
      - Ripp will use all resources to expose injustice.

      THE DISCOVERY:
      - Widget article states wrongful conviction of Murray Lawrence cost him over 7500 days in jail.
      - Rule 32 petition filed on behalf of Murray Lawrence; filed Nov. 27, 2023 under Alabama Rules of Criminal Procedure Rule 32; petition to challenge conviction after conviction and appeals final; used to attack conviction/get back into court.
      - Ripp Report announced step closer to Mr. Lawrence proving innocence.
      - During trial, Mack explained involvement: first part served as coordinator for sheriff’s department coordinating resources/assistance with Foley Police Department; later became more involved when asked to process certain items for fingerprints, document areas of interest evaluated, ultimately conducting interview with Jarius McNeil, testified.
      - Hoss the Boss was “LEAD INVESTIGATOR.”
      - Evidence was “suppressed willfully rather than inadvertently” and never divulged to defense of Murray Lawrence; Mr. Lawrence incarcerated for 20 years; suppressed evidence proves he was innocent.
      - Sheriff Hoss, Mack District Attorney Robert Wilters who was the Judge, and David Whetstone the prosecutor, knowingly and willfully withheld newly found evidence; their signatures appear in evidence; not only does this prove Mr. Lawrence was innocent but it supports allegations against authorities in previous cases alleging judicial misconduct.
      - Local Baldwin County press and Alabama independent internet journalists reluctant/scared to cover blatant corruption of Baldwin County Sheriff or any elected officials involved; only Lagniappe and The Ripp Report as well as social media sites, Facebook and blogs covering wrongful conviction of Murray Lawrence; Murray Lawrence represented by Attorneys Maxwell/Tillman, Birmingham, Al.

      THE PIVOT:
      - Article 2 serves as background/historical context for Article 1.
      - Article 2 details willful suppression of exculpatory evidence in Murray Lawrence case and Rule 32 petition filed Nov. 27, 2023.
      - This is the smoking gun for Ripp’s main complaint because it shows evidence was suppressed willfully rather than inadvertently and was never divulged to defense; supports claims against Sheriff Hoss Mack, Judge/DA Robert Wilters, prosecutor David Whetstone.
      - It connects past wrongful conviction to current Attorney General lawsuit/ethics complaint by showing pattern of withheld evidence/accountability failures.
      - For Article 1, suppression is key context for Ripp’s argument that AG lawsuit against Albritton may be legal masquerade and that citizens cannot depend on Ethics Commission or Bar Association for accountability; Lawrence case evidence supports allegations of judicial misconduct.

