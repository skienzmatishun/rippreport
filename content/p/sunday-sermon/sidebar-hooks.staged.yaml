  delight:
    brief: |-
      THE CONFLICT:
      - Baldwin County Legislative Delegation leased office space in Bay Minette from Mayor Bob Wills.
      - Lease agreement presented to Baldwin County Commission last week.
      - Lease terms: delegation pay $4,090/month for five years; first five years rent $245,000; Mayor Wills added two 5-year lease extensions; second 5 years ~$283; third ~$339; total ~$867,000 to Wills family bank account; building worth far less.
      - Mayor Bob Wills has Ethics complaint and Bar complaint pending.
      - Senator Chris Elliott defended lease to Bob Wills on radio.
      - Elliott history: 1% tax; DUI; argued he would suffer “irreparable harm and damage” by suspension of driving privileges; said elected position too important; special treatment.
      - Elliott sold business when became State Senator; fired for not showing up; settled lawsuit; settlement out of public eye.
      - 10 years prior: Chris Elliott part of Stacy, Elliott and Haygood; political consultant group used Baldwin County as piggy bank; later Catalyst, then Scott Boone Consulting; in 2012 played major role in electing Mayor Wills.
      - Mayor Wills and Sen Elliott share style of dirty politics.
      - Elliott refurbished office at Fauxhope satellite Courthouse, at taxpayers expense; staff approval required before viewing.

      - Baldwin County Commission approved lease after amending to make delegation pay full rent.
      - Commissioner Billie Jo Underwood questioned proposal; wanted use existing inventory; balked at commission paying half.
      - Commissioner James Ball said if willing pay full, no cost; accepts two checks from county as double dipper.
      - Jeb Ball helped push lease; Jeb Ball represents Bay Minette; Jeb Chris and Bob Wills cut from same cloth; actions support political corruption.

      - Fairhope history from Article 2: Fairhope taxpayers facing $10 million federal lawsuit.
      - Lawsuit filed in U.S. District Court for Southern District of Alabama on Oct. 27.
      - Lawsuit concerns Gables on Lawrence and Skyline Village.
      - Triangle case: taxpayers paid almost $3 million in legal fees; judgment included city buying Triangle for $8.25 million; total $11.25 million taxpayer money.
      - After failed attempts, property given to Single Tax Corporation.
      - Fairhope hired Hand Anderall Sale; Hand Anderall lied over triangle lawsuit costing $3 million; Attorney Cain O’Rear promised city would not have to pay legal fees; false.
      - Fairhope council and Mayor will do whatever regardless lawsuits; Mayor Can’t mentors; council will do whatever.
      - Fairhope killing geese, no medical marijuana, electric substation in neighborhood against wishes; good ole boy deal. Waterfront project 2 years overdue; K-1 center mismanaged under Councilman Jack Burrell; Mayor gets two payroll checks; Council enjoys 100% health care; Fairhope taxpayers clueless.

      THE DISCOVERY:
      - Article 2 revealed Fairhope pattern of changing rules after fact and resulting lawsuits/taxpayer costs.
      - Article 2 showed $10 million federal lawsuit and $11.25 million Triangle total taxpayer cost.
      - Article 2 provided background/context for Baldwin County political corruption in Article 1.

      THE PIVOT:
      - Article 2 is key context for Article 1 because it shows historical/local pattern of misconduct, changing rules after fact, lawsuits, good ole boy deals, taxpayer money issues.
      - Article 2 connects to Article 1’s alleged current corruption involving Chris Elliott, Bob Wills, Jeb Ball.
      - Article 2 frames Main Article 1 as part of broader pattern.

