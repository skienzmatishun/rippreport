    brief: |-
      THE CONFLICT:
      *   In 2012, Chris Elliott played a major role in electing Mayor Bob Wills.
      *   Elliott was part of the political consultant group Stacy, Elliott and Haygood, which later became Catalyst and Scott Boone Consulting.
      *   Current conflict involves the new Baldwin County Legislative Delegation renting offices in Bay Minette from Mayor Bob Wills.
      *   The lease agreement requires the delegation to pay $4,090 per month for five years, totaling $245,000.00 initially.
      *   Mayor Wills has pending Ethics and Bar complaints.

      THE DISCOVERY:
      *   In August 2022 (FY 2022), the Baldwin County Commission paid $14,528,106.21 in Sales/Use Tax to the Baldwin County Board of Education (BCBOE).
      *   For the first eleven months of FY 2022, the total amount paid to BCBOE was $130,888,985.70.
      *   This local revenue is sufficient for education funding, negating the need for additional Property Tax increases.

      THE PIVOT:
      *   Article 2 (2022) demonstrates that Baldwin County already has substantial local revenue for education, directly contradicting the tax-raising rhetoric often associated with Chris Elliott ("The Tax Man") referenced in Article 1.
      *   Article 1 shows Elliott advocating for tax issues while Article 2 proves current funding levels are high and stable.

