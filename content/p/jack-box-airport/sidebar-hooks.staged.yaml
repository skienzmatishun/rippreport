  court-public-opinion-now-session:
    brief: |-
      THE CONFLICT: Improper bidding and bid rigging by Fairhope Airport Authority; lease execution on Dec 17, 2015, occurred before the required Ethics Commission Advisory Opinion (Feb 3, 2016). Jack Burrell (City Council President/Authority Board Member) and Ray Hix (Sec. Treasurer) were central to the process.
      THE DISCOVERY: Ray Hix utilized privileged information obtained during his tenure (April-July 2015) as an Authority member to benefit his company, Hix/Snedeker/Mid-Bay Air LLC, during the RFP process.
      THE PIVOT: Article 2 establishes the historical corruption (improper bidding and insider information use) that Article 1 details the current, defensive response to—specifically the Authority using tax dollars to hire Ray Hix's attorney to quash the complaint.
      KEY ENTITIES: Jack Burrell, Ray Hix, Hugh Evens, Mr. Bailey, Mayor Wilson, Mid-Bay Air LLC, Fairhope Airport Authority, Karin Wilson
    llm_text: Ray Hix used privileged information as an Authority member to benefit his company during the Fairhope Airport bid process. Now, the Authority is using taxpayer dollars to hire Hix’s attorney to quash the corruption complaint involving Jack Burrell.
