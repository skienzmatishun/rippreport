  follow-bouncing-ball:
    brief: |-
      THE CONFLICT: Kevin Boone, Fairhope Councilman, voted on projects involving his business partner, John Avent, and engineering firm Dewberry/Preble-Rish, LLC, between June 6, 2016, and October 3, 2016, without recusing himself.
      THE DISCOVERY: Dewberry/Preble-Rish, LLC donated $2500.00 to Kevin Boone's re-election campaign, constituting a clear violation of Ethics rules due to Boone's involvement in their projects (e.g., Fly Creek Apartments, 240-unit project).
      THE PIVOT: Article 2 establishes a historical pattern of conflicts of interest and ethical breaches involving local Fairhope officials (Boone) and development firms (Preble-Rish). This context highlights the current ethical crisis in Article 1, where the Fairhope Airport Authority is using tax dollars to hire Ray Hix’s attorney to defend board members (Jack Burrell and Ray Hix) against an investigation by the Attorney General’s office and the Ethics Commission.
      KEY ENTITIES:
      Jack Burrell (Airport Authority board member, elected official)
      Ray Hix (Airport Authority Sec. Treasurer, attorney)
      Kevin Boone (Fairhope Councilman)
      John Avent (Business partner of Boone, Dewberry/Preble-Rish)
