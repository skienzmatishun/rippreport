  fairhope-citizens-citizens-citizens:
    brief: |-
      THE CONFLICT:
      *   Mayor Karin Wilson urged council to take ownership of 258 acres purchased by Fairhope Airport Authority in 2007 for $8.85 million to reduce debt (21% of Fairhope's overall borrowing).
      *   Jack Burrell, Airport Authority Board member, allegedly mocked Wilson and refused to recuse himself from bid selection he influenced.
      *   This conflict led to a complaint regarding the Airport Authority's finances and Burrell's involvement.

      THE DISCOVERY:
      *   Article 2 showed Burrell prioritizing airport users over the broader citizenry, undermining Mayor Wilson's efforts to place the land title in city ownership despite the land being paid for by city tax dollars.

      THE PIVOT:
      *   Article 2 establishes a pattern of alleged self-interest and financial mismanagement by Jack Burrell concerning Airport Authority assets (the land/tax dollars), providing the historical context for the subsequent legal and ethics inquiry (Article 1) regarding the lease and use of tax dollars for investigations.

      KEY ENTITIES:
      *   Jack Burrell (Council President, Airport Authority Board member)
      *   Karin Wilson (Mayor)
      *   Ray Hix (Sec. Treasurer, Airport Authority; attorney involved in lease request)
      *   Fairhope Airport Authority
      *   258 acres
      *   $8.85 million
      *   2007
      *   Hugh Evens (Ethics Commission Chief Council)
      *   Mr. Bailey (Hix's attorney)
    llm_text: Mayor Karin Wilson urged city ownership of 258 acres bought for $8.85 million in 2007. Board member Jack Burrell allegedly prioritized airport users, undermining city tax dollars and fueling an ethics inquiry.
