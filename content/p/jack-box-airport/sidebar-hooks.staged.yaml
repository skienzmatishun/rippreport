  hi-jack-ed:
    brief: |-
      THE CONFLICT:
      *   2016: Fairhope Airport Authority had been flying under public scrutiny; budget included half a million dollars annually, exceeding education contribution.
      *   Mayor Wilson exercised an option on the original loan, allowing the city to take back 258 acres for $10.00 if not paid off by 2012.
      *   Mayor Wilson noted Airport consumed 21% of City’s budget while serving 1% or less.
      *   Mr. Burrell (Fairhope City Council President) supported the Authority over citizen interests, despite his representative role.

      THE DISCOVERY:
      *   The Fairhope Airport Authority exhibited historical financial opacity and conflict of interest due to board members having personal/financial links to the Authority.
      *   Mr. Burrell was linked to the past "FAILED administration" and was at the helm of the Authority, serving on an ad hoc committee for hangar bids, conflicting with his council president role.

      THE PIVOT:
      *   Article 2 establishes Mr. Burrell's prior pattern of prioritizing the Authority over citizen interests.
      *   Article 1 details a current complaint against the Authority/board members, where the Authority is using tax dollars to hire Mr. Hix's attorney (who prepared the lease) to quash investigation by the Attorney General and Ethics Commission.

      KEY ENTITIES:
      *   Jack Burrell
      *   Ray Hix (Sec. Treasurer for Authority)
      *   Mayor Wilson
      *   Mr. Hugh Evens (Ethics Commission Chief Council)
      *   Mr. Bailey (Mr. Hix's attorney)
      *   Fairhope Airport Authority
      *   Fairhope City Council President
    llm_text: Mayor Wilson warned the Fairhope Airport Authority consumed 21% of the city budget while Jack Burrell supported the board. Authorities now spend taxpayer money hiring Mr. Bailey to block an Attorney General investigation.
