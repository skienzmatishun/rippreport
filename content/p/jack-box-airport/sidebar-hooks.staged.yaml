  boone-doggle:
    brief: |-
      THE CONFLICT: Councilman Boone engaged in conflicts of interest by voting on council resolutions involving hundreds of thousands of dollars for engineering companies connected to his LLCs.
      THE DISCOVERY: The older article established patterns of financial conflicts and lack of transparency among Fairhope City Council members (including Boone and past councilman Ford).
      THE PIVOT: This history of council conflicts establishes the broader context of ethical failure in Fairhope governance, which is evident in the later Airport Authority controversy where tax dollars are used to hire Mr. Hix's attorney to defend board members (Jack Burrell) against legitimate Ethics Commission complaints.
