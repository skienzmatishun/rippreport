      - Article 2 is older than Article 1; frame as background/historical context.
      - Article 2 (Widget: BATTLE OF WEEKS “FAMILY”) showed/revealed: local zoning/County Commission conflict; small business venture on family land; Grant Weeks; Weeks family; Weeks Bay; Bay Minette; Baldwin County; county-commissioner; zoning-commission key topics.
      - Zoning Commission agreed to recommend restaurant, then reversed after one complaint and recommended against.
      - Dec. 15, 2020 meeting before County Commission in Bay Minette.
      - Petition had 555 supporters so far; actions: sign petition, contact County Commissioners, come to meeting Dec. 15 @ 9:00 AM.
      - Ripp Report called story political corruption; said someone with power wants own way; stepping on feet of county commissioners and Zoning department; County Commissioners should take stand; situation should never have reached controversy.
      - Ripp Report does not personally know any Weeks family but would be proud to meet them; looks forward to eating at Creole Restaurant.

