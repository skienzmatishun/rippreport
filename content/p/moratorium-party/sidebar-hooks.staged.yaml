  battle-of-weeks-family:
    brief: |-
      THE CONFLICT:
      - Baldwin County / Bay Minette, Alabama: County Commission and Zoning Commission dispute involving Grant Weeks and The Weeks family of Weeks Bay.
      - Grant Weeks: young entrepreneur; family venture: “small business venture on family land”; venture by Grant Weeks from family The Weeks family of Weeks Bay.
      - Zoning Commission agreed to recommend restaurant, then after one complaint reversed course and recommended against zoning request to County Commission.
      - Applicants had to go before County Commission Dec. 15, 2020, in Bay Minette.
      - If County Commissioners voted against, applicants must wait one year to reapply.
      - County Commissioners were asked to request traffic light at County Road 49 and 26; intersection should have light already installed; dangerous as is.

      - Fairhope / Fauxhope, Baldwin County, Alabama: past political conflict.
      - Last municipal election fell prey to political cabal Catalyst, now branded Scott Boone Consulting.
      - Catalyst did bang up good job for special interests, developers, political candidates; selected and supported.
      - Mayor Sherry Sullivan darling since Tim Kant was Mayor; Sherry won position, rewarded with additional utility director and second paycheck from city.
      - Same model former Mayor Tim Kant followed; Kant used utility director to manipulate purse strings of utilities.
      - Mayor Wilson who unseated Can’t thought holding both positions not financially prudent and posed conflict of interest; received two checks from city; refused money and separated utilities finances from city.
      - Wilson cut off corruption circulation of good ole boys.
      - Mayor Sullivan and council reversed Wilson’s decision about utilities and opened door for Catalyst.
      - In 16 years of Can’t flowers bloomed and Fairhope was retirement community on Mobile Bay; Cant worked hard to win vanity awards, best flowers to best retirement community.
      - Fauxhope born. During Cant administration infrastructure totally ignored; sewage spilled into bay with every heavy/moderate rain.
      - Shift from retirement community to bedroom community; population doubled in about 10 years; Fauxhope ignored infrastructure and no understanding Quality of Life; schools overloaded; taxpayers expect more taxes.
      - In last 20 years Fauxhope had about 4 or 5 comprehensive plans; comprehensive plan lasting average 4 years is no plan, just diversion.
      - After 16 years of infrastructure neglect and Mayor Cant’s draining of utility fund while supporting Fly Creek Apartments, Cant defeated by Karin Wilson.
      - Council remained same and launched political vendetta against Wilson for 4 years; public bullying of Mayor at council meetings; anything Mayor proposed they opposed.
      - In spite of no council support, Mayor Wilson accomplished more in 4 years than Cant did in 16; infrastructure one goal; council, same as today, with exception Councilman Cory Martin, slowed positive efforts.
      - With council praying she would quit, Wilson secured millions of dollars in grants dedicated to infrastructure; infrastructure projects will take council entire elected term to complete.
      - Wilson secured grant for $6.2 million for waterfront project now in danger of losing funds due to current Mayor and Council’s procrastination and bickering.
      - In 2020 good ole boys led by Catalyst won, perfect coup and Fauxhope theirs; controlled Mayor, Council, municipal Judge, municipal attorney, police and planning.
      - Mayor Sullivan quickly pledged to “Embrace Development.”
      - “Embracing Development” as motto and complete control of city was all “selected” developers needed to set off even more fevered pitch to develop at all costs; storage buildings, thanks to Judge, to dollar stores popping up on unzoned property, surrounding community.
      - Within Fauxhope houses demolished replaced by new expensive homes, or First Baptist Church turned into parking lots.
      - Unzoned areas, like District 8 and 37 better get zoned because last thing you should consider is being annexed into Fauxhope. Vote for zoning Feb. 15, 2022.

