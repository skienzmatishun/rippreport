  elected-or-selected:
    brief: |-
      THE CONFLICT: Mayor Kant served four terms (starting 2000); he was selected, not elected, by former Mayor Jim Nix, who was forced out of office for alleged criminal activity.
      THE DISCOVERY: Mayor Kant's tenure was marked by corruption, including a non-public multimillion-dollar municipal lease ($5000/year), questionable land purchases (from Mike Ford's realty company), infrastructure decay, and a non-democratic selection process.
      THE PIVOT: Article 2 establishes that the previous regime (Kant's four terms) was corrupt and non-elected, providing the necessary historical context to validate Article 1's celebration of Karin Wilson's victory as a genuine, positive, grassroots democratic change, replacing the "status quo."
