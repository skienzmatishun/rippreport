  as-long-as-i-count-the-votes-what-are-you-going-to-do-about-it:
    brief: |-
      THE CONFLICT: Fairhope Municipal Elections took place, with specific observations of alleged fraudulent behavior and procedural violations documented around August 23, 2012.
      THE DISCOVERY: The 9/11/2012 widget article documented poll watcher observations of election irregularities, including lack of machine control by Election Supervisor Mrs. Culver, improper handling of absentee voting machines by Tom Odom, and failure to allow poll watchers to monitor final tape certification.
      THE PIVOT: The 2012 article establishes a history of suspicion regarding Fairhope election integrity, making the later mention in the Main Article of the Alabama Sec. of State Elections Division monitoring the subsequent election critical context, contrasting past concerns with current oversight efforts.
