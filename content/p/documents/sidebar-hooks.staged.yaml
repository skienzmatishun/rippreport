  fairhope-jester-and-fly-creek:
    brief: |-
      THE CONFLICT:
      - Fairhope City Councilman Robert Brown defended his contract with Eastern Shore Art Center (ESAC).
      - Robert Brown served as ESAC Board member and Liaison to the Fairhope City Council.
      - Public constituents alleged Robert Brown used his elected office for personal gain via the ESAC contract.
      - Public request made to Brown: "Hey Robert please post those 'other' bids, our information, is that no other bids exist. Please also include the Ethics Letter that gave you permission, as a ESAC Board member and Liaison to the City Council, to use your office for personal gain."
      - Fairhope City Council voted to approve full family insurance for Councilman Robert Brown; worth around $17,000/year; no other part-time employees had the same.
      - Councilman Brown's defense: rests entirely on calling others "CRAZY."
      - Public response: "Show us some DOCUMENTS, Down Home Brown."
      - Ethics Complaint against Fairhope City Councilman Robert Brown and Eastern Shore Art Center Board member; case number 2018-42; Alabama Ethics Commission.

      THE DISCOVERY:
      - Article 2 is older than Article 1; frame it as background/historical context.
      - Article 2 covered the November 27th Council meeting, where a citizen spoke regarding gravity fed sewer system vs low pressure sewer system, which is what is being installed in new developments despite the City having a standard.
      - Article 2 covered the December 2002 decision by Fairhope Utilities and the City Planning Commission setting the standard for wastewater collection methods in new developments; gravity fed sewer was the preferred/standard method.
      - Article 2 covered the Fairhope Jester spinning the Ethics Complaint against Robert Brown; Jester stuck to story that he had PERMISSION from the Ethics Commission to secure a contract with ESAC; Jester asked "Where is that written 'PERMISSION'? Did he provide that information to the Art Center Board? NO."
      - Article 2 reported the Jester dismissing that any Ethics Complaint exists.

      THE PIVOT:
      - Why Article 2 is the 'smoking gun' / key context for Article 1: Article 2 is the older article and must be framed as background/historical context for Article 1.
      - Article 2's reporting on the Ethics Commission permission and the 2018-42 case provides context for Article 1's conflict over Brown's ESAC contract and the public request for the Ethics Letter.
      - Article 2's coverage of the 2002 gravity fed sewer standard vs low pressure installation dispute provides historical background relevant to the standards/permission dispute in Article 1.

      THE PIVOT:
      - Article 1 centers on Councilman Brown's defense of the ESAC contract and the demand to "Show us some DOCUMENTS, Down Home Brown."
      - Article 2 established the Jester's claim of PERMISSION from the Ethics Commission and the lack of written/provided permission.
      - Article 2 therefore frames the missing documentation issue that Article 1 surfaces.

      KEY ENTITIES:
      - Robert Brown — Fairhope City Councilman, Eastern Shore Art Center Board member, Liaison to City Council; also referred to as "Down Home Brown" and "Fairhope Jester"; subject of Ethics Complaint 2018-42.
      - Eastern Shore Art Center (ESAC) — contract dispute; Board member Robert Brown.
      - Fairhope City Council — voted full family insurance, ~$17,000/year, for Councilman Brown.
      - Fairhope Jester — spinning Ethics Complaint against Robert Brown; claimed PERMISSION from Ethics Commission for ESAC contract; supports Kant-Corte Apartments on Fly Creek; building own home on Fly Creek.
      - Kant-Corte Apartments — supported by Jester; developer responsible for damage to creek from Publix project; building 230 apartments next to creek.
      - Fly Creek — location of Jester's home and Kant-Corte Apartments.
      - Fairhope Utilities — Director of Operations; maintained gravity fed sewer as best method.
      - City Planning Commission — set wastewater standard December 2002.
      - Alabama Ethics Commission — received Ethics Complaint case number 2018-42.
      - The Ripp Report — publisher of the articles.
      - Fairhope Standard — publication covering gravity fed vs low pressure sewer dispute.
      - Publix project — developer responsible for damage to creek; developer now building 230 apartments next to creek.
