  straw-man:
    brief: |-
      THE CONFLICT: In October 2005, an honest investor named Bass provided over $2.44 million for his half-share of a property purchased from the Nolte family. Clarence Burke used a "straw man" entity—Hopper Land Development South LLC—to secretly buy the entire property using Bass's money without informing him. Tucker Dorsey, serving as a County Commissioner at the time, denied business relationships with Baldwin County Sewer or Clarence Burke and was later voted out of office; Dorsey admitted to building the straw company, stating, "That was the only time we built a straw company like that." Judge Norton granted summary judgment for the defendants on September 11, 2017, accepting arguments that the mortgages were valid.

      THE DISCOVERY: Article 2 (older background/context) exposed deep-seated systemic corruption in Baldwin County, Alabama, detailing how businessmen, lawyers, county commissioners, mortgage companies, real estate agents, and developers colluded to manipulate financial and legal systems against citizens using illegal straw-buying tactics and favorable judicial outcomes.

      THE PIVOT: Article 2 serves as the smoking gun for Article 1 by establishing a documented, county-wide pattern of systemic corruption, straw companies, and self-dealing by public officials (specifically linking past figures like Tucker Dorsey to modern municipal corruption). This historical context proves that current Fairhope City Council members—such as Councilman Robert Brown, who is defending his contract with the Eastern Shore Art Center (ESAC) and a $17,000 full-family insurance package—are operating within an entrenched local culture of using elected office for personal gain with impunity.

      KEY ENTITIES:
      - Robert Brown (Fairhope City Councilman / ESAC Board Member / Liaison to the City Council)
