  transparency:
    brief: |-
      THE CONFLICT: Fairhope City Councilman Robert Brown faced accusations regarding a contract with the Eastern Shore Art Center (ESAC) and using his elected office for personal gain (specifically as an ESAC Board member and Council Liaison). Additionally, the Fairhope City Council voted themselves full family health insurance packages worth approximately $17,000 a year—a benefit not shared by other part-time city employees. The Council also failed to approve a city budget on time for three consecutive years, avoiding open-meeting budget processes contrary to state statutes.

      THE DISCOVERY: Article 2 (published September 2, 2019, by Mayor Karin Wilson) revealed that Mayor Wilson introduced the first-ever self-sustaining 2020 City Budget in Fairhope history requiring zero dollars of utility profits to balance. It exposed that the City Council had avoided the open budget process for three straight budget cycles, sitting on the budget for months beyond the deadline without accountability, and failing to approve a single budget on time.

      THE PIVOT: Article 2 serves as the background context and smoking gun because it establishes the established pattern of dysfunction, lack of transparency, and disregard for statutory deadlines by the "Catalyst" City Council under Mayor Karin Wilson's administration. This historical budgeting obstruction and lack of accountability directly connects to the current allegations of self-dealing, insurance package grabs, and unverified contracts (such as Councilman Brown's ESAC deal) highlighted in Article 1.

      KEY ENTITIES:
      - Robert Brown (Fairhope City Councilman, ESAC Board Member)
      - Karin Wilson (Mayor of Fairhope)
      - Eastern Shore Art Center (ESAC)
      - City of Fairhope / Fairhope City Council
