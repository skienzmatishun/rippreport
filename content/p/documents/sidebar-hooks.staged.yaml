      *   The Council also previously voted against community engagement regarding a 2.6 million dollar recreation land deal in 2020.
      *   The complaint was personally delivered by an unnamed individual on Monday, September 16, 2019, to the Alabama Attorney General, White Collar Crime Division, Special Prosecutors.

      THE DISCOVERY:
      *   The Widget Article (2019) documents that a formal complaint, accompanied by a 42-page booklet of supporting documents, was filed against Councilman Robert Brown with the Alabama Attorney General's office on September 16, 2019.

      THE PIVOT:
