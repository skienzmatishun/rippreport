      THE CONFLICT: 18 years ago, September 11 2001, residents in Baldwin County defeated a $6.00 toll via a poll when the petition reached 50,000 marks.
      THE DISCOVERY: Baldwin County Sewer System (BCSS) is a privately owned monopoly serving 19,000 homes with unregulated sewage fees, leading to threats of service cutoff for non-payment, and former County Commissioner Tucker Dorsey was allegedly an agent of BCSS.
      THE PIVOT: Article 2 establishes a pattern of local elected officials yielding to corporate/monopoly influence (BCSS) in Baldwin County, providing context for allegations of council members using elected office for personal gain in Fairhope (Article 1).
      KEY ENTITIES: Baldwin County, BCSS, Richard Dayton, Tucker Dorsey, Robert Brown, Fairhope City Council, $17,000 (annual insurance value).
