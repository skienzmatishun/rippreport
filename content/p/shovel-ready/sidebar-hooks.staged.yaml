  captain-jack:
    brief: |-
      THE CONFLICT:
      *   Late 2016/Jan 8th: Fairhope Airport Authority meeting revisited "failed" 2016 lease process.
      *   Council President Burrell (Captain Jack) dominated the position for 7 years.
      *   Joe McEnerney (Airport Authority Chairman) reportedly guaranteed certain "chosen ones" hanger locations prior to bidding.

      THE DISCOVERY:
      *   Captain Jack exerted significant political control, influencing City Attorney and Municipal Judge appointments.
      *   The Airport Authority was run to the satisfaction of the 1% of airport users, not the general citizenry.

      THE PIVOT:
      *   Article 2 demonstrates a history of centralized political power and institutional misuse within Fairhope local government.
      *   This context supports Article 1's critique of Lee Lawson and the BCEDA using political influence (requested by Fairhope City Council) to promote the Mega Site in 2019 for failing elected officials, suggesting a pattern of political maneuvering rather than objective development.

      KEY ENTITIES:
      *   Captain Jack (Burrell)
      *   Joe McEnerney
      *   Lee Lawson
      *   Baldwin County Economic Development Alliance (BCEDA)
      *   Fairhope City Council
      *   Chris Elliott (Tax man)
    llm_text: Captain Jack (Burrell) dominated Fairhope for seven years, reportedly guaranteeing hanger spots to "chosen ones" like Joe McEnerney. This pattern of centralized political power shows how local leaders influenced development, impacting you more than the 1% of airport users.
