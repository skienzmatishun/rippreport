      THE CONFLICT:
      - Baldwin County, Alabama: BCEDA CEO Lee Lawson said in 2019 he hoped 2019 would be the year of the “mega” deal for the Mega Site on Interstate 65 near Bay Minette.
      - Mega Site was a finalist for the Toyota-Mazda complex; Toyota-Mazda went to Limestone County near Huntsville; Mega Site was in conversation for several other large projects.
      - Mega Site purchase: 34 million plus lost interest and lost opportunity, probably closer to 50 million today.
      - Baldwin County late Commission and School Board passed a 1% tax without public vote; took money from schools for county infrastructure while ignoring school infrastructure; Chris Elliott referenced as “Thank the Tax man Chris Elliott.”

      THE DISCOVERY:
      - Article 2: Sen. Tripp Pittman finally leaving Baldwin County political life, covered in BP oil, and legacy described as dark as the oil.
      - Pittman was the BP trustee for Baldwin County; got the first BP contract in Alabama, compliments of Fairhope and now-departed Mayor Can’t.
      - Baldwin delegation, Pittman speaks of, secured 10% of the total BP State award, about 120 million.
      - Pittman was poster boy for elected officials who use elected office for personal gain; accomplished getting Alabama Ethics Commission to look the other way while stuffing his pockets.
      - Fairhope was Pittman’s honey hole; Fairhope City Council President Jack Burrell is Pittman’s bible buddy and mentor.
      - Randy Davis indicted.
      - Joe Faust not hit a lick at a snake in 10 years; needs to join Pittman and buddy Can’t.
      - Vote Randy out and Danielle in.
      - Downside of Pittman leaving: bought-and-paid-for Chris Elliott running to replace Pittman; Chris is a political animal, will serve one term and try to ease up political ladder; will be every bit as bad as Pittman; never learn.
      - A VOTE for Chris Elliott is a VOTE for Catalyst.
      - Alternative to Elliott is Jason Fisher; Fisher is not bought and paid for nor affiliated with Catalyst.

      THE PIVOT:
      - Article 2 is older than Article 1; frame it as background/historical context.
      - Article 2 showed/established Pittman as BP trustee, personal gain pattern, Fairhope political influence, Randy Davis indictment, and Chris Elliott/Catalyst replacement context.
      - Article 2 is the smoking gun for Article 1 because it connects Fairhope/BP/politician enrichment to Baldwin County political behavior, framing Article 1’s BCEDA/mega site/tax/school/Catalyst critique as part of the same conflict.
      - Article 1’s “shovel ready” and 2019 mega deal, Chris Elliott, 1% tax, schools infrastructure, and BCEDA issues read against Article 2’s Pittman/BP/Chris Elliott history.

      THE KEY ENTITIES:
      - Lee Lawson — CEO, Baldwin County Economic Development Alliance (BCEDA).
      - Tripp Pittman — Sen.; BP trustee for Baldwin County; Fairhope political figure.
      - Randy Davis — indicted.
      - Chris Elliott — running to replace Pittman; Catalyst; “Thank the Tax man Chris Elliott”; bought and paid for.
      - Jason Fisher — alternative to Chris Elliott; not bought and paid for; not affiliated with Catalyst.
      - Jack Burrell — Fairhope City Council President; Pittman’s bible buddy and mentor.
      - Joe Faust — not hit a lick at a snake in 10 years.
      - Danielle — candidate in “Vote Randy out and Danielle in.”
      - Mayor Can’t — Fairhope; now departed; Pittman’s buddy.
      - Baldwin County Commission — late commission; passed 1% tax without public vote.
      - Baldwin County School Board — passed 1% tax with late Commission? Actually late Commission and School Board passed 1% tax.
      - Fairhope City Council — asked Lee Lawson to render support for Fairhope Airport and K-1 School.
      - Alabama Ethics Commission — looked other way re Pittman.
      - BP — BP State award; BP funds; BP oil.
      - Catalyst — political entity linked to Chris Elliott.
