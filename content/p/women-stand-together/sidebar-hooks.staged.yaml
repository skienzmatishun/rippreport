    brief: |-
      THE CONFLICT:
      *   2016: Municipal election in Fairhope resulted in the defeat of incumbent Mayor Timothy Kant (16 years) by Karin Wilson (first woman Mayor).
      *   Council Structure: The City Council was populated by five individuals selected by the previous mayor/minions, controlled by the "CATALYST" group.
      *   Council Misconduct: Jack Burrell served 8 years as Council President; accused of bid rigging, lying about the Triangle lawsuit, and the $2.65 million farmland purchase/lease. Robert Brown used his four years on council to secure contracts (soccer fields/Art Center) totaling close to $1 million for personal gain.

      THE DISCOVERY:
      *   The City of Fairhope's municipal government, specifically the council, has a documented history of cronyism, prioritizing development/insider deals (CATALYST), and failing to manage public infrastructure/growth responsibly.

      THE PIVOT:
      *   Article 1 details the failure of City Prosecutor Marcus McDowell to hold an assailant accountable for a 2018 assault charge, leading to the charge being dismissed.
      *   Article 2 establishes that the City Council, which appointed McDowell, is institutionally controlled by a system (CATALYST) prioritizing self-enrichment over public duty, explaining the council's subsequent silence and refusal to hold the prosecutor accountable.

      KEY ENTITIES:
      *   Paula DiNardi (Victim/Advocate)
      *   Marcus McDowell (City Prosecutor)
      *   Karin Wilson (Mayor)
      *   Timothy Kant (Former Mayor)
      *   Jack Burrell (Council President)
      *   Robert Brown (Councilman)
      *   Kevin Boone
      *   Deb Hopkins
      *   Joshua Gammon
      *   Howell Gibbens
      *   CATALYST (Political/Development Group)
      *   Fairhope City Council
