      THE DISCOVERY:
      *   The land transfer project (Tatumville Subdivision) involved multiple council members and was pushed by vested interests, including Lee Turner (President of Fairhope Planning and Zoning and Single Tax).
      *   Robert Brown and his partner Cliff Pittman were linked to the Single Tax Board and the development project.
      *   Robert Brown leveraged his position as a City Councilman and liaison to the Eastern Shore Art Center to secure a contract, despite receiving clear advice from the Ethics Commission against using office for personal/business benefit.

      THE PIVOT:
      *   Article 2 establishes a pattern of conflicts of interest and lack of accountability (land transfer, sewage spill) among council members (Brown, Pittman, Turner) prior to the Ethics Complaint.
      *   This pre-existing environment of ignored ethics warnings and conflicts of interest (A2) provides the context that allowed Robert Brown to ignore the Ethics Commission's clear informal advice and secure the Eastern Shore Art Center contract (A1).
      *   Article 1 details the specific ethics violation while Article 2 reveals the underlying culture of unchecked self-interest among council leaders.

