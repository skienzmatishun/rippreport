  bend-over-fairhope:
    brief: |-
      THE CONFLICT: The Fairhope City Council—led by Council President Mr. Burrell and supported by members Boone and Brown—waged a prolonged war to obstruct Mayor Karin Wilson, cutting her discretionary funds from $15,000 to $2,500, interfering with city employees, spreading rumors, and favoring developers over citizens on major contentious local projects such as the Fly Creek Apartments.

      THE DISCOVERY: Article 2 revealed a systemic pattern of council corruption, conflicts of interest, and backroom dealing—specifically highlighting that council members Boone and Brown had direct ties to the Fairhope Single Tax Corporation, which was pushing a controversial 12-home development on the banks of Big Head Gully that threatened sewer backups, and noting how the council previously pushed through the settled "triangle lawsuit" and bypassed public input through secret agenda manipulations.

      THE PIVOT: Article 2 serves as the smoking gun for Article 1 by proving that the Fairhope City Council's current inaction and hostility toward Mayor Karin Wilson (regarding crises like COVID-19 prep, the flawed HB 203 annexation bill, and the disastrous 2016 traffic study for the 240-unit Fly Creek Apartments/Retreat at Fairhope Village) are not isolated incidents, but rather part of a long-standing, documented pattern of favoring developers at the expense of public safety and ignoring citizen outrage.

      KEY ENTITIES:
      - Mayor Karin Wilson
      - Mr. Burrell (Council President)
      - Boone (Council Member)
      - Brown (Council Member)
      - Dr. Scott Harris (State Health Officer / Alabama Department of Public Health)
      - Governor Kay Ivey
