  off-the-rails:
    brief: |-
      THE CONFLICT:
      - January 10, 2020: Backstory Podcast released "Off the Rails" (Widget Article) criticizing Fairhope City Council; council described as having no priorities or off the rails; cited sewer spill; council slowed infrastructure projects and misused city funds; described as rogue conducting as criminal enterprise.
      - Three councilmen – Boone Brown and Burrell – without community involvement or public participation paid $2.75 million for recreation land; council had no money for development, solution was to lease 2.75 million in land for farming.
      - Same three councilmen ignored sewer infrastructure for years; city staff and Mayor Karin Wilson obtained BP funds; first time in 20+ years sewer infrastructure seriously addressed without help of council.

      THE DISCOVERY:
      - Article 2 (Backstory Podcast, January 10, 2020) showed/revealed the council's sewer infrastructure neglect, sewer spill, slowed infrastructure projects, and misused funds prior to Article 1's COVID-19, HB 203, Fly Creek Apartments, and traffic issues.

      THE PIVOT:
      - Article 2 is older than Article 1 and serves as background/historical context (smoking gun) for Article 1 ("FAIRHOPE COUNCIL ASLEEP AT THE WHEEL"); it establishes prior council inaction and misconduct that Article 1 frames as ongoing "asleep at the wheel" conduct.

