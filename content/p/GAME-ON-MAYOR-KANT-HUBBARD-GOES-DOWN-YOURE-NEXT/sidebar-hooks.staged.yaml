  fairhope-a-city-owned-by-outside-interests-and-good-ole-boys:
    brief: |-
      THE CONFLICT:
      *   Mayor Kant and Arthur Corte were involved in approving the Fly Creek Apartments, a decision cited as corrupt.
      *   The Triangle lawsuit was settled without public participation for $11.25 million (City borrowed $5.25M, attorneys received ~$3M, $3M taken from utility reserve).
      *   The Triangle Nature Trail Park deal involved Thompson Engineering (a Kant associate) for approximately $1 million development cost on 34 acres, lacking public comment approval.
      *   The soccer complex purchase cost $6–7 million, contrasted with $300,000 spent on education studies.
      *   In the 2016 election cycle (qualifying July 5–19, election August 23), Kant received over 50% of contributions from non-Fairhope residents and anonymous PACs.
      *   Councilwoman Diana Brewer sided with the mayor on Fly Creek Apartments. Councilmen Mueller and Boone pledged single terms but appeared to support Kant. Jack Burrell opposed the Mayor.

      THE DISCOVERY:
      *   Article 2 revealed specific financial details and lack of public participation in major city decisions (Triangle lawsuit, Triangle park, Fly Creek).
      *   Article 2 identified that Kant’s 2016 campaign funding originated largely from outside Fairhope, suggesting an "outside interests" network.

      THE PIVOT:
      *   Article 2 provides concrete, dated historical evidence (e.g., $11.25M Triangle settlement, 2016 funding patterns) confirming the systemic corruption alleged by Article 1.
      *   Article 2 establishes the decade-long pattern of exclusion and questionable deals that Article 1 uses to argue that Mayor Kant must retire and that the Ripp Report's 10 years of reporting are justified.

      KEY ENTITIES:
      *   Mayor Kant
      *   Arthur Corte
      *   Francis Paul Ripp (Ripp Report)
      *   Diana Brewer (Councilwoman)
      *   Mueller (Councilman)
