      THE DISCOVERY: Article 2 revealed Senator Pittman's company was awarded $639,000 while he supervised grants for boom work, with Oil Recovery of Mobile listed as the contractor of record.
      THE PIVOT: Article 2 provides historical evidence of Pittman's alleged corruption, strengthening the political case for Kim Mccuiston's independent challenge to him in 2014 (Article 1).
