  bp-restore-act-application:
    brief: |-
      THE CONFLICT:
      *   Lawsuit against the City of Fairhope (Triangle Lawsuit) concerning BP Restore Act funds.
      *   The Mayor (Tim Kant) and Senator Trip Pittman are subjects of multiple BP fraud investigations.
      *   Conspiracy to exclude public participation occurred in April 2013 and October 2013.

      THE DISCOVERY:
      *   The "Fly Creek Watershed Restoration Project" study (developed by Thompson Engineering) was flawed, omitting that Arthur Corte's development of the Shoppes at Fairhope Village caused the red clay damage.
      *   The City of Fairhope incurred $3 million in attorney fees, $3 million down payment, and a $5.75 million debt, all without public input.

      THE PIVOT:
      *   Article 2 (2013) provides specific, documented evidence of financial conspiracy and fraud involving Senator Trip Pittman and Mayor Tim Kant, substantiating Article 1’s (2014) general claim of pervasive political corruption in Baldwin County.

