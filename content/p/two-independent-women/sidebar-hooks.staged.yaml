  alabama-political-corruption-exposed:
    brief: |-
      THE CONFLICT:
      *   November 10, 2010: Mobile Press-Register published an article by Connie Bagget regarding the BP Boom Scandal involving Mayor Tim Kant and Senator Lee "Trip" Pittman.
      *   Ongoing: Federal case involving Mayor Kant and Senator Pittman was pending, directed by special prosecutor Matt Hart.
      *   Past/Historical: Bob Riley steered $37.2 million of BP money to Brett-Robinson in Gulf Shores; Riley later registered as a lobbyist for Brett-Robinson.

      THE DISCOVERY:
      *   Article 2 revealed widespread, systemic political corruption across Alabama, controlled by the Republican machine (State House, Senate, AG, Governor's mansion).
      *   Article 2 detailed multiple federal grand jury investigations: Mike Hubbard (Speaker of the House) for a $13 million education software contract; Mayor Kant and Senator Pittman.
      *   Article 2 established that Senator Pittman was linked to corruption, despite his attempts to avoid an open congressional seat opportunity.

      THE PIVOT:
      *   Article 2 proves that the political corruption in Baldwin County (mentioned in Article 1) is not isolated but part of a deep, systemic state-level issue (e.g., investigations into Pittman, Hubbard, Kant).
      *   Article 2 provides historical context demonstrating that incumbents, like Senator Lee "Trip" Pittman, are tied to the "machine" and corruption, justifying the independent challenges by Ginger Poynter and Kim Mccuiston in Article 1.

      KEY ENTITIES:
      *   Senator Lee "Trip" Pittman
      *   Mike Hubbard (Alabama Speaker of the House)
      *   Matt Hart (Special Prosecutor, Alabama State Attorney General's Office)
      *   Mayor Tim Kant (Fairhope)
      *   Ginger Poynter
      *   Kim Mccuiston
      *   Bradley Byrne
      *   Luther Strange (Alabama Attorney General)
