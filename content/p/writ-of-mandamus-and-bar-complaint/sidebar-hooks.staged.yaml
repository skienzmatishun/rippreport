    refined_source: d97e54ea8370974a26a85e3cb30de1fd709c9a79cfc021cfb200ac69d688a224
    brief: |-
      THE CONFLICT: Systemic political corruption exists throughout Alabama, supported by "Alabama Corruption Insurance"—a free mechanism provided by the Governor, Attorney General, Judiciary, and Alabama Ethics Commission, which historically ensures a 98% chance that complaints are ignored. Historical context includes State Representative Mike Ball's proposal (AL HB179) to force the Alabama Ethics Commission to approve prosecutions for elected officials. A specific example of alleged corruption involved Columbia, Alabama, where complaints were filed against the Mayor, Chief of Police (Jim Mock), and local prosecutor Ben Freeman, who had a conflict of interest defending Lori Mock (Chief Mock's wife).

      THE DISCOVERY: The Alabama Ethics Commission, in its current form, facilitates political corruption by providing immunity via the Corruption Insurance, allowing elected officials to evade accountability.

      THE PIVOT: Tom Albritton, the Alabama Ethics Director, engaged in self-dealing by using the Mabel Amos Memorial Fund, which he oversees, to pay over $105,000 in scholarships for his children's tuition, demonstrating how the body meant to prevent such actions can be compromised.

      KEY ENTITIES: Tom Albritton, Mabel Amos Memorial Fund, Alabama Ethics Commission, Mike Ball, Ben Freeman, Lori Mock, Columbia, Alabama, Alabama Corruption Insurance, Regions Bank.
