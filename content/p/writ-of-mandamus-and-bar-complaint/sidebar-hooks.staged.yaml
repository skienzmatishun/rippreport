      THE DISCOVERY: The AEC, under Hugh Evans, historically functioned as a "corrupt political vehicle" supporting elected officials (e.g., Mayor of Daphne, Mayor of Fairhope, Senator Pittman, Mike Hubbard) in obtaining taxpayer-funded contracts, including a $625,575.00 "Oil Spill 2010" contract.
      THE PIVOT: The historical evidence of the AEC enabling political corruption (Pittman contracts, 2004-2014) establishes a pattern of institutional failure and self-interest, providing context for the 2021 ethics complaint against Ethics Director Tom Albritton for allowing his children to receive $105,000 in scholarships from the Mabel Amos Memorial Fund he oversees.
      KEY ENTITIES: Senator Lee "Trip" Pittman, Tom Albritton (Ethics Director), Mabel Amos Memorial Fund, Alabama Ethics Commission (AEC), Hugh Evans (AEC Presiding), Francis Paul Ripp, City of Fairhope, Baldwin County Commissioners, Mike Hubbard, July 2, 2021, July 14, 2010, $105,000.
