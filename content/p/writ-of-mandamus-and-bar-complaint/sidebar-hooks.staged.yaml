    brief: |-
      THE CONFLICT: The Alabama Ethics Commission was historically accused of granting immunity to politicians involved in alleged graft, including State Senator boom boom Pittman ($750,000 skim), Jack Burrell, and former councilman Robert Brown ($300,000+ contract) at the Fairhope Airport/Art Center.
      THE DISCOVERY: Investigations (notably by Richard Fording) revealed that Tom Albritton, Director of the Alabama Ethics Commission and a trustee of the Mabel Amos Memorial Fund, allowed his two children to receive $105,000 in scholarships through 2018. Regions Bank received over $1 million for managing the fund.
      THE PIVOT: The historical pattern of the Ethics Commission dismissing complaints and granting immunity (Article 2 context) provided the foundation for The Ripp Report to file formal complaints and a Writ of Mandamus against Tom Albritton (Article 1) for the specific self-dealing issue involving the Mabel Amos Trust, violating IRS Section 4941(d).
