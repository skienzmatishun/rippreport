  baldwin-county-family-court-a-cottage-industry:
    brief: 'THE CONFLICT:

      - Divorce cases in Baldwin County existed as a prolonged, fee-driven "cottage
      industry."

      - Brackin Johnson and McGriff''s law firm, coupled with Judge Thomason''s court,
      were cited in 2015 as examples of the worst practices.

      - Main Article frames family courts as systems designed to enrich insiders while
      harming litigants/children.


      THE DISCOVERY:

      - The Widget Article (dated later) details procedural changes involving presiding
      Judge Floyd.

      - These changes sought to move temporary custody/support hearings away from
      Judge Thomason, citing her bad judgment regarding immediate 50/50 custody assignments.

      - The Article also mentions complaints against Thomason and notes the potential
      for appellate review if two judges disagree.


      THE PIVOT:

      - The Widget Article describes the tangible institutional problems (Thomason''s
      influence, bad judgment in status quo orders) that align with the systemic corruption
      alleged in the 2015 Main Article regarding Brackin Johnson/McGriff and Judge
      Thomason''s court.

      - The Widget Article details procedural mechanisms put in place (rotation of
      judges, Floyd/Bishop overseeing Thomason''s cases) directly addressing the bottlenecks
      and potential for bias described generally in 2015.


      KEY ENTITIES:

      - Judge Michelle Thomason

      - Presiding Judge Floyd

      - Attorney Brackin Johnson (and McGriff)

      - Ripp Report'
    generated_at: '2026-08-03T02:01:30.808234Z'
    text: Baldwin County insider lawyers turned local divorce court into a cash cow
      for years. New procedural records reveal Presiding Judge Floyd stepped in to
      yank temporary custody cases away from Judge Thomason to curb her biased rulings.
    character_count: 232
  divorce-corp:
