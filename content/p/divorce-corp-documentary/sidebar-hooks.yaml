      THE DISCOVERY:

      - Detailed firsthand account from litigants'' perspective regarding serious
      judicial misconduct by Judge Thomason.

      - Specific allegations include failure to hold opposing counsel accountable
      for illegally obtained medical records; overruling professional psychological
