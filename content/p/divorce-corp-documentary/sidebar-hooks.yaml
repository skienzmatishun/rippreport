      *   The report details ongoing concerns regarding Judge Thomason''s court producing
      a "cottage industry" of divorce cases.

      *   Stephen Johnson is specifically named as the most frequently complained-about
      attorney in this system.


      THE PIVOT:

      *   Article 2 moves from generalized critique (Divorce Corp documentary) to
      specific, ongoing action and target identification.

      *   Article 2 provides contemporary context to the systemic failures highlighted
      in Article 1, tying them directly to current judicial performance and specific
