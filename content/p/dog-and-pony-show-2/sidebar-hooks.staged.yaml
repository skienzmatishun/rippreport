  dirty-hands:
    brief: |-
      THE CONFLICT:
      *   In 2017, the Fairhope Catalyst Council, under Mayor Karin Wilson, engaged in staff obstruction, targeting Economic and Community Development Director Sherry-Lea Bloodworth Botop, planning director Wayne Dyess, and Operations Director Richard Peterson.
      *   During this period, the Council was criticized for approving the Fly Creek Apartments and traffic congestion issues at Highway 98 and Parker Road.
      *   Jack Burrell served as Council President for 7 years.
      *   In May 2020, Council President Jack Burrell and Kevin Boone approved the Fly Creek Apartments and accepted a "gift" from the developer.
      *   The council utilized a utility fund, raiding it as a slush fund, resulting in a 3 million cost for the Triangle Lawsuit from utilities, which led to an 11.25 million dollar legal settlement falsely claimed as a park purchase.

      THE DISCOVERY:
      *   The 2017 article documented the Fairhope Catalyst Council’s pattern of "dirty hands" and obstruction against city staff, establishing a history of internal mismanagement and political targeting.

      THE PIVOT:
      *   Article 2 establishes the historical pattern of the Catalyst Council’s negative influence and questionable decision-making (e.g., Fly Creek approval, staff bullying) which Article 1 then uses to argue for systemic corruption, financial mismanagement ($11.25 million settlement), and the need for council replacement in the 2020 election.

      KEY ENTITIES:
      *   Jack Burrell (Council President, 7 years)
      *   Kevin Boone
      *   Karin Wilson (Mayor)
      *   Sherry-Lea Bloodworth Botop (Economic and Community Development Director)
      *   Fly Creek Apartments
      *   Catalyst (Council)
      *   Elliott (State Senator, "the TAX MAN")
      *   Chuckee Cheeze (former Courier editor, now Baldwin County Legislative Delegation Constituent Services Director)
      *   Wayne Dyess (planning director)
      *   Richard Peterson (Operations Director)
      *   Fairhope
      *   Triangle Lawsuit ($3 million utility cost / $11.25 million settlement)
