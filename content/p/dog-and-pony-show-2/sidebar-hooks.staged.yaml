  one-woman:
    brief: |-
      THE CONFLICT:
      - Article 1, “DOG AND PONY SHOW”: Jack Burrell used “special meetings” to eliminate public participation at Fairhope City Council; Monday night council meeting had no public input.
      - Article 1: Today’s “special” meeting, May 10 @ 3:30, was a “dog and pony show”; Capt. Jack commanded with “bulling style”; Jack wants to be Mayor; says he needs to have all finance people close to each other so he can find them.
      - Article 1: Jack Burrell should be the last one to trust with any type of accounting; claims to be working as an engineer but cannot prove it; never explained his police report.
      - Article 1: Jack Burrell and Kevin Boone approved the Fly Creek Apartments and accepted the “gift” from the developer.
      - Article 1: Utility fund was raided as a slush fund; cost $3 million for the Triangle lawsuit from utilities; Jack and Kevin wanted people to believe the $11.25 million dollar legal settlement was a purchase for a “park”; Article 1 calls outright lie.
      - Article 1: Council has not delivered one city budget on time; failed with K-1; no significant issue in 3 years except to follow Jack.
      - Article 1: Jack Burrell has been Council President for 7 years; no other council person has been President.
      - Article 1: Council followers need replaced; Fairhope needs public servants and fresh candidates for council in 2020.
      - Article 1: This is about micro managing city employees and 2020 election; CATALYST has plans to steal Fairhope; CATALYST City Council and dirty hands.

      THE DISCOVERY:
      - Article 2, “ONE WOMAN”, is older/background context.
      - Article 2: Fairhope City Council bullied the Mayor at Council meetings and other public venues; first council meetings of this council’s term were disgraceful.
      - Article 2: Bullying leadership headed by Council President Jack Burrell, who refuses to share Council President chair, supported by Councilmen Boone and Brown; Councilmen Conyers and Robinson were mute, but complicit.
      - Article 2: Bullying, intimidation, and victimization are one in the same; intimidation is a major weapon in Baldwin County political and judicial arena; some “men” find women an easy target.
      - Article 2: Women need to speak up more.
      - Article 2: The VICTIM, Paula DiNardi, had to endure several postponements of the case and over 8 hours in Fairhope Municipal Court, only to be victimized again; Paula was latest victim of McSharry; life turned upside down since incident.
      - Article 2: Paula stood alone in attempt for justice; City Attorney represented her poorly; defense attorney wants to politicize assault case into continued witch hunt against Mayor.
      - Article 2: Ronan McSharry was found guilty in Fairhope Municipal Court, this last week, of public intoxication and assault, sentenced to 180 days in jail, with time served during rehab stay; represented by Defense attorney John Beck, well known for victimizing victims; appeal expected; McSharry does not want to go to jail.
      - Article 2: McSharry, through another attorney, attempted to “settle the issue” with DiNardi, providing she remain silent for life and not show up for court, thus charges dropped; Ripp Report’s understanding both offers were rejected; DiNardi refused because she feels women should not be beat up by men, and then paid off to remain silent.
      - Article 2: John Beck not only defended McSharry but wandered into line of questioning that politicized, and was not relevant, to the assault and public intoxication case; Mr. Beck has a way of victimizing the victim and making the guilty party look innocent.
      - Article 2: Paula was represented in court by City Attorney Marcus McDowell, who job it is to vigorously represent the victim; however Mr. McDowell neither objected or interfered with Mr. Beck’s line of questioning which had no relevant value to the case.
      - Article 2: The Municipal Judge allowed Mr. Beck to go unchallenged. Beck asked DiNardi a series of questions related to Paul Ripp aka Ripp Report and Ripp Report involvement in the case; she explained that the Ripp Report, a non profit consumer organization, was acting as an advocate for her. Why the judge nor the city attorney did not ask, Mr. Beck, what relevance it had to do with the case, unknown.
      - Article 2: Then Mr. Beck asked a series of questions about the Mayor, and her alleged involvement, in the case or her connection to Paul Ripp, The Ripp Report. Beck just rambled on without any objection being heard.
      - Article 2: It appears that the politicization of the case will be Mr. Beck’s defense, supported by victimization of the victim.
      - Article 2: The City Attorney did not even mention the medical damages, over $6,000.00, that DiNardi has incurred, nor did he mention that Mr. McSharry has a green card and is not a citizen of the U.S. WHY?
      - Article 2: DiNardi not only finds her life turned upside down but now has come to the realization that her case is being used in an ongoing political witch hunt, focused on defeating Mayor Wilson in 2020.
      - Article 2: The Mayor and the Ripp Report are not relevant to the criminal charges against McSharry.
      - Article 2: Get ready folks for 2020 because this is all about politics and politicians, Judges and Attorney’s keeping their jobs. By the way McSharry’s has a J Burrell sandwich on the menu. J Burrell is also the Council President that secured the City Attorney his job as well as the Municipal Judge, it is all connected folks.

      THE PIVOT:
      - Article 2 is older than Article 1 and should be framed as background/historical context.
      - Article 2 shows/discloses Fairhope City Council bullying, intimidation, victimization, political weaponization, Paula DiNardi victimization, Ronan McSharry case, John Beck defense, Mayor Wilson 2020, Ripp Report involvement.
      - Article 2 is key context for Article 1 because it provides background for Article 1’s claims about Jack Burrell, council, mayor, bullying, 2020 election, political intimidation, municipal court, victimization.
      - Article 2 is the “smoking gun” or key context for Article 1 because it predates/supports framing of the conflict as political/council bullying and victimization rather than isolated incident.

      THE KEY ENTITIES:
      - Jack Burrell — Fairhope City Council President; wanted to be Mayor; used special meetings; approved Fly Creek Apartments with Kevin Boone; Council President for 7 years; J Burrell sandwich.
      - Kevin Boone — Fairhope City Councilman; approved Fly Creek Apartments; supported Jack Burrell.
      - Mayor Wilson — Fairhope Mayor; targeted in 2020 political witch hunt.
      - Paula DiNardi — The Victim; endured postponements and over 8 hours in Fairhope Municipal Court; stood alone; Ripp Report acting as advocate; refused settlement.
      - Ronan McSharry — defendant; found guilty of public intoxication and assault; sentenced to 180 days in jail; time served during rehab; green card not US citizen; attempted settlement.
      - John Beck — Defense attorney for McSharry; known for victimizing victims; asked politicized irrelevant questions; appeal expected.
      - Marcus McDowell — City Attorney; represented Paula; did not object/interfere with Beck; did not mention medical damages over $6,000 or McSharry green card.
      - Municipal Judge — allowed John Beck unchallenged.
      - Paul Ripp aka Ripp Report — non profit consumer organization; acting as advocate for Paula DiNardi; involved in case.
      - Fairhope City Council — bullied Mayor; special meetings; dog and pony show; micro managing.
      - Fairhope Municipal Court — venue; over 8 hours; postponements.
      - Baldwin County — political and judicial arena; intimidation weapon.
      - Fly Creek Apartments — approved by Jack Burrell and Kevin Boone; developer gift.
      - Triangle lawsuit — utilities; $3 million cost; $11.25 million legal settlement; park purchase lie.
      - Utility fund — raided as slush fund.
      - CATALYST — plans to steal Fairhope; CATALYST City Council and dirty hands.
      - Locations to mention: Fairhope, Baldwin County, Fairhope Municipal Court, Fly Creek Apartments, Triangle lawsuit, utility fund.
