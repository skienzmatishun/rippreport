    llm_text: Gulf Shores ignored its own zoning rules for the Regency Place Apartments, using a private August 17, 2018 Executive Session to address the "technical deficiency." This pattern of secrecy shows local government prioritizing development interests over public ordinances, mirroring issues currently facing Fairhope.
