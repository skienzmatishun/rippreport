      THE CONFLICT: City of Gulf Shores failed to adhere to Section 3-3E ("Findings and Conclusions") of its Zoning Ordinance regarding the Regency Place Apartments Site Plan. (Context from 9/20/2018).
      THE DISCOVERY: City Staff ceased utilizing the "Land Use Plan" criteria, despite using it for Site Plan recommendations in 2014, 2015, and 2016. The Planning Commission held an Executive Session on August 17, 2018, to address this "technical deficiency" outside public view.
      THE PIVOT: Article 2 establishes a historical pattern of local government (Gulf Shores) disregarding its own ordinances and using secrecy (Executive Sessions, private advice) to protect development interests; Article 1 demonstrates a contemporary failure of local government (Fairhope) using political intimidation (Catalyst Council) and censorship to prevent necessary democratic reform (change from "at large" council).
