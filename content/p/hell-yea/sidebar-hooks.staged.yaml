      THE CONFLICT:
      The Fairhope City Council, an "at Large" body hand-picked by former Mayor Tim Kant and aligned with the Catalyst machine, sought to block the October 2, 2018 referendum advocating for a Council-Manager/district form of government, despite public support from Fresh Start Fairhope.

      THE DISCOVERY:
      In September 2018, the Catalyst Council attempted to kill the October 2, 2018 election by calling a Special Meeting to hire a law firm and seek a Temporary Restraining Order (TRO) from a circuit court judge.

      THE PIVOT:
      Article 2 proves the Council's long-standing, deliberate, and systematic intent to suppress reform and maintain "at Large" control (the Catalyst machine); this establishes the historical context for the later conflict (Article 1) involving Mayor Wilson’s public efforts, the complaint filed by Kevin Boone (whose son is head of Catalyst), and Ripp’s subsequent lawsuit against Council President Burrell for alleged First and 14th Amendment violations.

      KEY ENTITIES:
      Fairhope City Council
      Tim Kant (former Mayor)
      Karin Wilson (Mayor)
      Chuck Zunk (Fresh Start Fairhope spokesman)
      Jack Burrell (Council President)
      Jay Robinson (Councilman/Attorney)
