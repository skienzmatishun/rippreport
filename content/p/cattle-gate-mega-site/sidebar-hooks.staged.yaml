  bend-over-fairhope:
    brief: |-
      THE CONFLICT: Fairhope City Council (led by Council President Mr. Burrell) waged conflict against the Mayor by obstructing duties, reducing the Mayor’s discretionary funds from $15,000 to $2,500; this conflict involved a developer favoring the council and led to the "triangle lawsuit." (Historical context: over a year prior to Article 1)
      THE DISCOVERY: The Fairhope Single Tax plan, involving proposed 12 homes on gully banks, faced public opposition via a petition with over 925 signatures; Council members Boone and Brown have direct ties to the Single Tax.
      THE PIVOT: Article 2 establishes a pattern of local governing bodies (Fairhope City Council) prioritizing developer interests (Single Tax) over public trust, a context relevant to the failed development/sales of the 700-acre Baldwin County Mega-site ($32 million), which was deemed unsuitable for cattle and failed to attract a tenant in January.
      KEY ENTITIES: Fairhope City Council, Mr. Burrell (Council President), Boone, Brown, Mayor, Baldwin County, Mega-site (700 acres), Bay Minette, Highway 59, I-65, Fairhope Single Tax, Big Head Gully.
    llm_text: Fairhope City Council, led by Mr. Burrell, slashed the Mayor's discretionary funds from $15,000 to $2,500. Council members Boone and Brown tied this power struggle to the controversial Single Tax plan affecting 12 homes on Big Head Gully.
