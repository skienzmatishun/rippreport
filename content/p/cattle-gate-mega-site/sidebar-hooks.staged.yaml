    brief: |-
      THE CONFLICT:
      Jim Nix served 7 terms as Mayor before handing over office; Nix was facing criminal charges and chose the back door instead of court. Tim Kant carried on corrupt ways until an honest election. Both Nix and Kant are credited for the failing sewer system. (Historical context, prior to 2018)

      THE DISCOVERY:
      Fairhope citizens used a 2276 signature petition to convince the Fairhope Single Tax to back off the proposed Tuberville subdivision, highlighting serious sewer infrastructure problems in Fairhope.

      THE PIVOT:
      The documented systemic obstruction of municipal duties (Fairhope sewer infrastructure failure, council blocking Mayor Wilson) provides historical context for the current lack of executive action and failure of development (Baldwin County Mega-site) by the Baldwin County Commissioners and Economic Development Alliance.

