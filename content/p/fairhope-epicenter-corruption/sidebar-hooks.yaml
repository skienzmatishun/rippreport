  independence-day-2014:
    brief: |-
      THE CONFLICT:
      *   Fairhope City Council operations compromised by conflicts of interest, including contracts awarded after Planning and Zoning approval.
      *   Mayor Tim Kant suspected of orchestrating corruption, influencing contracts via P&Z controls, and allegedly fixing local elections.
      *   Specific allegations include BP grant fraud investigations involving Kant and contractor Pittman regarding debris removal contracts.
      *   The issue of the Triangle lawsuit settlement (awarded as a park) costing taxpayers $12 million was pushed through without adequate public notice/participation.

      THE DISCOVERY:
      *   Lee Turner serving concurrently as Planning and Zoning head and President of the Fairhope Single Tax Corporation (FSTC) creates a direct conflict.
      *   Turner's tenure with FSTC is shown to involve limiting public participation, removing members critical of the administration, and using executive sessions to shield activities.
      *   The article frames Kant's micromanagement over Planning and Zoning/Public Works as absolute control, ensuring predetermined council outcomes.

      THE PIVOT:
      *   Article 2 details the structural corruption (Turner/FSTC overlap) that enabled the specific abuses described in Article 1, particularly concerning contracts and land use decisions flowing from P&Z.
      *   It provides the mechanism (the overlapping roles of Kant/P&Z vs. Turner/FSTC) that validates the claims in Article 1 regarding controlled contracting environments and lack of oversight.

      KEY ENTITIES:
      *   Tim Kant (Mayor)
      *   Lee Turner (P&Z/FSTC President)
      *   Trip Pittman (Contractor/Investigated in BP fraud)
      *   George Robards (Major contractor linked to Single Tax Colony/P&Z)
      *   Jack Burrell (City Council President)
      *   Kevin Boone (Councilman/Loyalist)
      *   Jennifer Fidler (Public Works head/P&Z member)
      *   Paul Ripp (Reporter/Source)
