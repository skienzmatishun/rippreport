  fairhope-a-city-owned-by-outside-interests-and-good-ole-boys:
    brief: |-
      THE CONFLICT:
      *   Fairhope governance involved long-standing conflicts of interest regarding city spending, contracts, and land use starting around 2016.
      *   Mayor Tim Kant oversaw projects like the Fly Creek Apartments and approved major expenditures (e.g., lawsuits costing $17M, parks/studies costing millions).
      *   Contracts and approvals involved City Council members (e.g., Mike Ford, Kevin Boone, Burrell) and Planning/Zoning oversight from individuals like Lee Turner and George Robards.
      *   BP grant fraud and questionable financing for city projects (e.g., soccer complex costing $6-7M) were central issues.

      THE DISCOVERY:
      *   The Widget Article provides specific examples of these conflicts, including the Triangle lawsuit settlement ($11.25M) and subsequent proposed "Triangle Nature Trail Park" development without proper public approval.
      *   It details the quid pro quo relationship: Thompson Engineering (Kant's connection) receives projects, while Kant/Corte receive financial benefits from poor city management.
      *   The article frames the systemic problem as a unified "Kant plan" dictated by Kant and his allies, excluding citizen input.

      THE PIVOT:
      *   The Main Article alleges corruption; the Widget Article provides concrete financial data and sequences of events (e.g., lawsuit funding, subsequent park proposal) demonstrating the pattern described in the Main Article is a calculated scheme benefiting a small inner circle ("good ole boys").
      *   The Widget Article links the procedural lapses (no public comment, behind-the-scenes deals) directly to the financial waste cited generally in the Main Article.

      KEY ENTITIES:
      *   Tim Kant (Mayor)
      *   Arthur Corte (Kant's associate/Developer)
      *   Mike Ford (City Council member/long-term supporter)
      *   Kevin Boone (City Council member)
      *   Burrell (Jack Burrell/Council President)
      *   Lee Turner (Planning and Zoning Head/Single Tax Colony involvement)
      *   George Robards (Planning & Zoning Member/Contractor to Single Tax)
      *   Diana Brewer (Councilwoman, criticized for loyalty to Kant)
      *   Triangle (Land/Property Dispute)
      *   Thompson Engineering (Kant associate/Contractor)
