  lawsuits-parks-or-education:
    brief: |-
      THE CONFLICT: Fairhope settled a lawsuit for $12 million, presented publicly as "Future Park," following a failed March 31 property tax referendum. This settlement was orchestrated by the Mayor, omitting citizen participation and constituting the most unethical action in the last 20 years.

      THE DISCOVERY: The city allocated $17 million toward lawsuits and parks, while only donating $350 thousand to education over the last two years. A subsequent $5 million soccer fields park was built on unsuitable land.

      THE PIVOT: The $12 million lawsuit settlement (detailed in Article 2) demonstrates the Mayor's pattern of unethical, non-transparent financial decisions (without public participation), which is the foundation of the systemic "good ole boy" corruption (detailed in Article 1) led by Mayor Tim Kant and his council members, such as Mike Ford, who approved the settlement without public notice.

      KEY ENTITIES:
      *   Mayor Tim Kant (under investigation for BP grant fraud)
      *   Senator Trip Pittman (under investigation for BP grant fraud)
      *   Jack Burrell (City Council President)
      *   Mike Ford (City Council member, approved Triangle Lawsuit settlement)
      *   Lee Turner (President of Planning and Zoning / Single Tax Colony)
      *   George Robards (P&Z member / major contractor for Single Tax Colony, over $100k)
      *   Jennifer Fidler (Head of Public Works / P&Z member)
      *   Kevin Boone (City Council member, worked for Summit Const.)
      *   Diana Brewer (Council person)
      *   Fairhope
      *   $17 Million (Lawsuits/Parks)
      *   $350 Thousand (Education)
      *   March 31 (Referendum date)
