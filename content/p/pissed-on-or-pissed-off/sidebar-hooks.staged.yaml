  danger-zone:
    brief: "THE CONFLICT: \n- The Fairhope City Council (specifically the \"Three B's\" and the CATALYST-backed faction) engaged in financial mismanagement, corruption, and self-dealing, costing the city millions.\n- Specific events include: \n  - The council ended up in Federal Court and lost after refusing to let a USMC combat veteran speak at a council meeting.\n  - Taxpayer money was used to pay Council President Burrell’s attorney fees and to hire lawyers to investigate a whistleblower regarding bid-rigging allegations on the Airport Board (with no report ever supplied).\n  - Council President Burrell concealed two sealed juvenile charges prior to the election.\n  - Councilman Brown acquired lucrative contracts by using his elected position for personal gain, resulting in a pending complaint with the Alabama Attorney General.\n  - The council spent $2.65 million on recreation land that \"only they\" wanted, then leased it out for just $9,000 a year as farmland, matching the exact amount of the city's first coronavirus budget cuts.\n  - The council voted themselves a pay raise and full family insurance that regular city employees do not receive.\n  - Politicians and developers (specifically involving former Mayor Kant, the CATALYST City Council, and property owner/CATALYST supporter Angelo Corte) created severe public safety hazards at the intersection of Highway 98 and Parker Road through backroom dealings.\n\nTHE DISCOVERY (Background/Context from Article 2 - \"DANGER ZONE\"):\n- Article 2 (older context) documented the dangerous conditions at Highway 98 and Parker Road affecting motorists.\n- It exposed the direct collusion between elected politicians and developers—specifically naming former Fairhope Mayor Kant, the CATALYST Fairhope City Council, and property owner/CATALYST supporter Angelo Corte—proving that development decisions were being prioritized over public safety and infrastructure integrity.\n\nTHE PIVOT:\n- Article 2 serves as the smoking gun because it provides empirical, localized proof of the exact developer-politician bedfellowship and backroom deals that Article 1 indicts on a broader scale. While Article 1 outlines massive financial waste (like the $2.65 million land deal) and general corruption by the CATALYST council, Article 2 catches them red-handed in a specific developer-driven conspiracy (involving Mayor Kant and Angelo Corte) that directly jeopardizes citizens' physical safety on Highway 98 and Parker Road.\n\nKEY ENTITIES:\n- Burrell (Council President / Airport Board member)\n- Brown (Councilman)\n- Boone (Councilman)\n- Scott Boone\n- Kevin Boone\n- CATALYST (Political organization/faction)\n- Can’t / Kant (Former Fairhope Mayor)\n- Angelo Corte (Property owner and CATALYST supporter)\n- Conyers (Councilman / Pro-active Mayor and Council supporter)"
