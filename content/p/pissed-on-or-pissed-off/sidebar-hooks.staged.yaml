  survey:
    brief: "THE CONFLICT: The \"CATALYST\" Fairhope City Council (featuring Council President Burrell, Councilman Brown, and Council Boone, son of CATALYST runner Kevin Boone) spent $2.65 million of taxpayer money to purchase recreation land that only they wanted, and within weeks—having no development money and calling it \"surplus\"—leased it out as farmland for just $9,000 a year, an amount that barely covers the interest. Additionally, the council cost the city millions through poor decisions, used taxpayer funds to hire lawyers to investigate a whistleblower regarding Burrell's alleged bid-rigging on the Airport Board without ever releasing a report, paid Burrell's attorney fees, and ended up in Federal Court (and lost) for refusing to let a USMC combat veteran speak at a meeting.\n\nTHE DISCOVERY: The older background report from the State of the City highlights a stark contrast: despite the council's obstruction of the Mayor, city employees and staff successfully paid Fairhope's city debt in full by June 2019, demonstrating that financial improvements and operational success were driven by the Mayor, superintendents, and staff rather than the council.\n\nTHE PIVOT: The older background context serves as the 'smoking gun' because it exposes the direct timeline and hypocrisy of the CATALYST council's fiscal irresponsibility—specifically, pushing through the disastrous, self-serving $2.65 million farmland purchase right in the middle of the city's budget process while the administration was successfully paying off city debt, directly undermining municipal progress for a \"good ole boy deal.\"\n\nKEY ENTITIES: \n- Burrell (Council President / Airport Board member)\n- Brown (Councilman)\n- Scott Boone (Councilman)\n- Kevin Boone (Runs CATALYST)\n- Mayor of Fairhope\n- Conyers (Councilman)"
    llm_text: While city staff wiped out Fairhope’s debt in 2019, Council President Burrell and Councilmen Brown and Boone forced a disastrous $2.65 million land buy, leased it as cheap farmland for pennies, and buried whistleblower investigations. Read why taxpayers are footing the bill for this good ole boy deal.
