  writ-of-mandamus-update:
    brief: |-
      THE CONFLICT:
      - Baldwin County Legislative Delegation / Baldwin County Commission / Baldwin Commission Attorney Brad Hicks.
      - Brad Hicks says he sees no ethics violation with Mayor Bob Wills renting his building, and possibly sharing office space, with the Baldwin County Legislative Delegation.
      - Brad Hicks says deciding what is ethical is not his job; his job is to be sure it is not unethical; he is to contact the Ethics, the Attorney General, or the legal counsel for the Speaker of the House and get an official opinion; instead Hicks said “go to hell” and “he knows best.”
      - Baldwin County Legislative Delegation decided to cut in half the monthly rent they would pay with taxpayer money to Bay Minette Mayor Bob Wills for offices in his longtime law building, according to a revised lease agreement the county commission approved on Tuesday.
      - Instead of paying $4,090 per month for the next five years and having the entire ground floor of 125 D’Olive Street, as Lagniappe originally reported in December, the delegation will have access to two offices, two conference rooms, the parking lot and other amenities for $1,750 per month until December 2027.
      - Francis Paul Ripp said he filed complaints with the Ethics Commission; said Baldwin County officials are setting an extremely dangerous precedent for other elected officials; said he thinks they should get an official opinion before going further.
      - The lease is reworded and rent lowered, further adding suspicion to an already crooked deal.
      - The Alabama Ethics Commission was created by the Alabama Legislature in 1973 by Act No. 1056.
      - The Ethics Law defines a “conflict of interest” as “A conflict on the part of a public official or public employee between his or her private interests and the official responsibilities inherent in an office of public trust”. Ala. Code § 36-25-1(8).

      THE DISCOVERY:
      - Article 2, “WRIT OF MANDAMUS: UPDATE,” is older than Article 1 and is background/historical context.
      - On Monday the 25th of November, Judge Johnny Hardwick, Circuit Judge, Montgomery County, will hear a STATUS REVIEW on all pending motions, relative to the Writ of Mandamus, I, Francis Paul Ripp, filed October 18th.
      - Judge Johnny Hardwick explained that he had been selected by Chief Justice Tom Parker to preside over some ethics cases on November 1st.
      - Judge Johnny Hardwick said he read the evidence to Ripp’s Writ of Mandamus and found it very interesting and wished he could delve into the case; however decided to recuse himself from hearing the case, due to a potential conflict of interest.
      - Attorney Harry Still and Francis Paul Ripp had no problem with the Judge hearing the case; they respect his decision and will wait until the case is rescheduled.
      - A civil case will be filed against Regions Bank, which will involve the trustees of the Mabel Amos Memorial Fund, in the near future.
      - The Mabel Amos Memorial Fund is private money; the allegations leveled against Mr. Albritton are based on his “self Dealing” of said trust, as a trustee.
      - Mr. Albritton is the Executive Director of the Ethics Commission; his actions as a trustee, which he has admitted to in Lagniappe articles, should require him to resign from the Ethics Commission immediately.

      THE PIVOT:
      - Article 2 is older than Article 1; frame it as background/historical context.
      - Article 2 concerns the Writ of Mandamus, Francis Paul Ripp, Judge Johnny Hardwick, Chief Justice Tom Parker, Attorney Harry Still, Regions Bank, the Mabel Amos Memorial Fund trustees, and Mr. Albritton, Executive Director of the Ethics Commission.
      - Article 2’s self-dealing allegations against Mr. Albritton as trustee of the Mabel Amos Memorial Fund connect to the Ethics Commission conflict of interest framework in Article 1 (Ala. Code § 36-25-1(8)).
      - Article 2 is the key/background context for Article 1 because it establishes the Ethics Commission and prior ethics-case actions — Writ of Mandamus, civil suit, self-dealing allegations — that frame the Brad Hicks / Mayor Bob Wills / Baldwin County Legislative Delegation ethics dispute in Article 1.

      THE KEY ENTITIES:
      - Francis Paul Ripp.
      - Brad Hicks.
      - Mayor Bob Wills.
