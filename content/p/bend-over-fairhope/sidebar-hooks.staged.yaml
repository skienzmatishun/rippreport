      THE DISCOVERY:
      *   Article 2 revealed that Single Tax President Mr. Lee Turner pushed the Tatumville project without single tax membership vote, exhibiting conflict of interest (as chair of Planning and Zoning).
      *   Article 2 detailed that Mr. Cliff Pittman, a Single Tax board member, was a business partner of Councilman Robert Brown.
      *   Article 2 established a pattern of procedural violations and self-serving board control within the Airport Authority (the "1%").

