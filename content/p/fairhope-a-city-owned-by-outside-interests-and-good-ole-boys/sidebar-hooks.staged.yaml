  driving-under-the-influence:
    brief: |-
      THE CONFLICT:
      *   In Baldwin County, the DUI judicial process utilizes Baldwin Substance Abuse Services, Inc. (BSAS), a non-profit formed on 10-4-2007, which serves as a steady income source for attorneys and municipalities.
      *   Mayor Kant and Arthur Corte oversaw the approval of the Fly Creek Apartments in Fairhope, rejecting citizen opinion (95% opposed).
      *   The Triangle lawsuit settlement cost the city $11.25 million ($5.25M borrowed, $3M attorneys, $3M utility reserve).
      *   A subsequent deal, the Triangle Nature Trail Park (34 acres, 3.2 miles of trails), is being pushed by Mayor Kant without public participation, utilizing Thompson Engineering.
      *   Fairhope also faced high costs for the soccer complex ($6-7 million) and paid $35,000 for Senior Bowl practice.
      *   The 2016 election cycle included qualifying period July 5th to 19th and election day August 23rd.

      THE DISCOVERY:
      *   The Widget Article (May 20, 2016) revealed that Judge Thomason is an incorporator of BSAS and that the non-profit, which collects millions from DUI offenders, has never provided public financial statements.
      *   The mandatory BSAS program involves a 24-hour course taught by James Ball, costing $400, plus drug tests ($300), all paid in cash.

      THE PIVOT:
      *   Article 2 establishes a systemic pattern of lack of financial transparency and private gain within the Baldwin County judicial system (Judge Thomason/BSAS).
      *   This systemic failure mirrors the political corruption in Fairhope (Mayor Kant/Corte), where major city decisions (Fly Creek, Triangle) are made without public participation and benefit private interests ("good ole boys").

