  put-your-big-boy-pants-on:
    brief: |-
      THE CONFLICT:
      *   Tucker Dorsey, Baldwin County Commissioner, was required by Frank Burt to support the 30 million dollar mega site and county pay freeze in 2012 to be accepted into the "good ole boy club."
      *   Dorsey served as elected interim director for the South Alabama Regional Planning Commission (SARPC).
      *   Dorsey supported Sen. Pittman's BP contracts and fired the County EMA director and County Manager.

      THE DISCOVERY:
      *   Baldwin County politics operates under a systemic "good ole boy" network where conflicts of interest are often managed through semantic letters from the Ethics Commission, not just monetary considerations.
      *   Dorsey's actions established a precedent of prioritizing political ambition and network loyalty over professional governance (e.g., Boy Scouts financial mismanagement).

      THE PIVOT:
      *   Article 2 provides historical evidence (2012) that the "good ole boy" network described in Article 1 (Mayor Kant, Arthur Corte) is a long-standing, established pattern of corruption within Baldwin County, not an isolated incident of current political incompetence.
