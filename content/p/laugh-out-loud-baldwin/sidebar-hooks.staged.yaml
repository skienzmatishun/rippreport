  goat-hill-piggy-bank:
    brief: |-
      THE CONFLICT:
      - Baldwin County, Alabama: school separation lawsuit between Gulf Shores and Baldwin County; Baldwin County Superintendent Eddie Tyler.
      - Tyler went back on published promise to abide by State Board of Education decision; Chris Elliott, preferred title State Senator, called “Tax Man,” claimed he solved lawsuit; Elliott covered for Tyler; Tyler was partner on penny tax no one got to vote on.
      - Tyler filed lawsuit; basis alleged Tyler broke promise to taxpayers and teachers; Baldwin County taxpayers affected; Gulf Shores told “open your wallet”; “you may regret what you wish for.”
      - Main article: Elliott diverting attention from gas tax he “rammed up our butts.”
      - Gas tax: Chris Elliott, as county commissioner, taxed Baldwin County citizens without constituent vote; raided 1% school tax ~$200,000/year for county; supported gas tax without public vote; over 80% voters opposed gas tax; elected officials did not listen.
      - Sherry Sullivan was CATALYST pick for Mayor of Fairhope in 2020.

      THE DISCOVERY:
      - Article 2, GOAT HILL PIGGY-BANK, older/background: Baldwin County is piggy bank for Goat Hill supported by elected officials.
      - Tax Man Chris Elliott, as county commissioner, taxed citizens without vote; raided 1% school tax $200,000/year for county; supported gas tax without public vote.
      - Over 80% voters opposed gas tax; elected officials ignored.
      - Gas tax for infrastructure raided by Goat Hill for over a decade; former Governor Riley drained accounts before leaving; former Governor Bentley used BP funds to build beach mansion; former State Senator BP Pittman skimmed $750,000 of BP money for his company; no accountability.
      - Politicians walk, while public punished for underage drinking; Orange Beach most corrupt municipal judge in Baldwin County; judge going to judge kids drinking; Gulf Shores and Orange Beach operate like dictatorships; listen only to good ole boys and developers.
      - Author not supporting underage drinking but says hypocrisy of elected officials arresting kids, chaining for public humiliation, ignoring political corruption and taxing without representation; asks which more egregious: kids drinking? Or elected officials taxing without representation.

      THE PIVOT:
      - Article 2 is older than Article 1; frame as background/historical context.
      - Article 2 revealed Baldwin County as piggy bank, elected officials taxing without votes, gas tax raids, BP funds mishandling, lack of accountability.
      - Article 1 alleges Chris Elliott again did similar: covering for Eddie Tyler, diverting from gas tax, school separation lawsuit, penny tax no vote.
      - Article 2 is smoking gun/key context for Article 1 because it documents prior pattern that Article 1 connects to current Elliott allegations and ongoing corruption.

      KEY ENTITIES:
      - Chris Elliott / “Tax Man” / State Senator / county commissioner.
      - Eddie Tyler / Baldwin County Superintendent.
      - Gulf Shores / Baldwin County school separation lawsuit.
      - State Board of Education.
      - Jack Burrell / Fairhope Council President for life / Captain Jack / police report.
      - Bradly Byrne / U.S. Congress seat.
      - Sherry Sullivan / former Mayor Cant’s staff / Community Affairs / recreation / Mayor of Fairhope 2020 pick.
      - Jennifer Fidler / Pandora Heathcoat / fired Fairhope positions / sued city.
      - Chucky Cheese / CATALYST tabloid editor.
      - CATALYST / CATALYST tabloid / CATALYST AM radio station.
      - Mayor Cant.
      - Fairhope / Gulf Shores / Orange Beach / Baldwin County / Alabama / Goat Hill / BP / Business Council of Alabama.
      - Governor Riley / Governor Bentley / State Senator BP Pittman.
      - Lowery, Wilters: specific names to mention; not identified in provided article text.
    llm_text: Baldwin County taxpayers got a piggy bank, not a vote. Chris Elliott's 'Tax Man' cover-up let Eddie Tyler break a school promise, and they rammed a gas tax through without a vote, ignoring over 80% of voters who opposed it.
