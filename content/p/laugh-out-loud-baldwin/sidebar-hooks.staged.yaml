      *   Fairhope Police Chief retired after being used by the shadow government agenda.
      *   In August 2018, an anonymous letter criticized Chris Elliott, stating he was corrupted by the Montgomery machine, and advocated for democratic candidates Walt Maddox and Jason Fisher.
      *   Tim was formerly Mayor but no longer holds the position; he and his council members undermined Mayor Wilson's authority.

      THE DISCOVERY:
      *   Article 2 proves that the "Shadow Government" (Catalyst) is an entrenched, institutionalized force in Fairhope, not merely a group of local rivals.
      *   Article 2 establishes the historical pattern of Catalyst using tactics like discrediting officials (Chief Pettis) and manipulating political appointments.

      THE PIVOT:
