      THE DISCOVERY: The older Widget Article revealed that Jack Burrell received free air miles and golf vacations from a board member while overseeing bid processes for the same member, and he refused to disclose a specific police report.
      THE PIVOT: The older documentation of Burrell's lack of accountability and questionable conduct at the Airport Authority provides the historical evidence cited in the Main Article to warn against his potential run for U.S. Congressman, confirming his "past political antics."
