  re-gift-gift:
    brief: |-
      THE CONFLICT:
      *   Fall 2016: Developer, complimented by Tim Kant and the last City Council, deeded 4 acres (including wetlands) to the City of Fairhope (Gift from Corte).
      *   Fall 2016: Developer submitted a site plan for a one-point drainage system violating PUD Amendment 1572 (requiring non-point discharge).
      *   2017: Jack Burrell attempted to undermine Mayor Wilson through employee insubordination (Fiddler and Sullivan fired), hiring freezes, and the immediate swearing-in of Judge Snedeker.
      *   2017: HR Director filed an incident report (Jan 25th) and a claim seeking $100,000 (May 19th).

      THE DISCOVERY:
      *   The 4-acre tract in Fall 2016 was critical land between the retention pond outfall pipe and Fly Creek, placing the City as both an upper and lower landowner regarding the PUD Amendment.
      *   The deed was given as a "gift" by Corte, tied to Tim Kant and the previous City Council.

      THE PIVOT:
      *   The 2016 land acquisition (tied to Kant) established the City's exposure to environmental liability (Fly Creek/PUD issues) just before the political conflict (2017) erupted.
      *   Tim Kant, a key political supporter whose loss fueled the 2017 coup attempt by Jack Burrell, was involved in the controversial 2016 land deal.
      *   The 2016 development issues (PUD/Fly Creek) predate and provide context to the political maneuvering around the airport bid, where Hix/Snedeker (linked to Judge Snedeker) were involved.

