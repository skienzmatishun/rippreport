      *   The coup attempt involved insubordination, firing of employees (Fiddler and Sullivan), and the council imposing a hiring freeze.
      *   Jack Burrell secured the immediate swearing-in of Judge Snedeker.

      THE DISCOVERY:
      *   Article 2 shows that Catalyst and the GOB ("good ole boys") were strategically placing candidates in elected positions prior to the 2017 events.
      *   Chris Elliott, an appointed Baldwin County Commissioner, ran for State Senate, linking him to Catalyst influence.
      *   Tripp Pittman, a State Senator, chose to run for U.S. Senate, citing term limits, but was linked to using his office for personal enrichment via BP cash.

      THE PIVOT:
      *   Article 2 establishes the historical pattern of Catalyst and the GOBs leveraging political connections and financial influence (e.g., BP cash, strategic candidate placement) across state and county levels.
      *   This established pattern of political control is directly applied in Article 1, where Catalyst and Jack Burrell used their influence to secure key appointments (Judge Snedeker) and push for municipal change that benefited their interests (Hix/Snedeker airport bid process).

