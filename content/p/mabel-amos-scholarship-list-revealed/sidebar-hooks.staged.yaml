hooks:
  rock-bottom:
    brief: |-
      THE CONFLICT:
      - Mabel Amos died in 1999 at age 99; left roughly $500,000 for the Mabel Amos Memorial Fund.
      - Tom Albriton and Rick Clifton of Albriton Law drew up the formation of the charitable trust in Mabel Amos’ last will and testament when she was in her 90s; Albriton and Clifton installed by will language giving the firm two of three board member positions overseeing the Mabel Amos Memorial Fund; John Bell of Regions Bank served as the third member/trustee.
      - Oil was discovered on Amos-owned land in Conecuh County; millions poured into the fund; from 2002 through 2013 scholarships were meager; IRS 990 forms from 2002 through 2013 listed recipients and amounts; by 2014 scholarship amounts grew larger and names were no longer listed in the 990s.
      - Alabama Attorney General Steve Marshall twice attempted to get the Alabama Supreme Court to derail Montgomery County Circuit Court Judge Greg Griffin’s efforts to have an independent accounting of the fund conducted, first by a special master, then by a special fiduciary; the second attempt was rejected.
      - After Lagniappe reported in 2021 scholarship payments to Albriton’s children, Leigh Manning and Megan Carmack filed a civil suit; Marshall sought to join; Tyra Lindsay filed a suit; Byron B. Mathews Jr. represented Lindsay; cases were consolidated; Mathews pushed for a full accounting and removal of Albriton, Clifton, and Regions Bank.
      - Special Fiduciary James C. White Sr., CPA, report: critical of self-dealing; disbursements violated Article V, part E and F; personal inurement and self-dealing; scholarships to children of board members/associates totaled $257,844.
      - Albriton’s children received a combined total of $135,000; distributions began in 2012 and continued until 2019; Albriton told Lagniappe in 2021 he abstained from voting; denied self-dealing.
      - Court removed Albriton’s involvement in selecting scholarships in 2023; Albriton formally resigned from the board in March of this year.
      - White identified six recipients with direct connections: Martha H. Albriton/University of Texas at Austin, $67,500; James Albriton/University of Texas at Austin, $67,500; Anna E. Bowden/Southern Methodist University, $60,000; Chandlar Dauphin/Auburn University/University of Alabama, $26,120; Megan Ballard/Lurleen B. Wallace/Troy University, $14,997; Whitney Ballard/Lurleen B. Wallace/Troy University, $21,727.
      - White said nearly $470,000 was distributed directly to colleges and universities as endowed scholarships; not in concert with articles; White tallied $725,000 in unallowed spending.

      THE DISCOVERY:
      - Article 2, the Widget article titled “ROCK BOTTOM,” is older/background context; frames Alabama government oversight as failed; says Alabama hit rock bottom; governor absent and sometimes incoherent; Attorney General out of sight most of the time and never responds to complaints, instead passes them to Bar and Ethics for disposal.
      - Article 2 says the Alabama Bar is a disgrace whose major function is to protect dirty lawyers; says they have weaponized the Bar as an instrument to exact judgment on attorneys who do not go along; says those in favor can do no wrong and have a pass to break the law.
      - Article 2 says Alabama Ethics Commission Executive Director Tom Albriton has been “stealing”/self-dealing/diverting children’s scholarship money from the Mabel Amos Memorial Trust for over 12 years; Albriton is Alabama’s poster boy for in-your-face political corruption; says he should not be evaluating ethics complaints; calls it laughable and an embarrassment to citizens of Alabama.
      - Article 2 says Transparency, Accountability, Bar Complaint, Ethics Complaint, Attorney General, plea to Governor are all total bullshit; says as a citizen you are wasting your time expecting any justice; says Alabama is a failed state and they are considering an out-of-state resident for Governor; says they will go further down the toilet.
      - Article 2 says if you wish to research the Mabel Amos Memorial Trust, go to The Ripp Report or Lagniappe and use the search bar; says issue existed since Lagniappe broke the story and Ripp Report filed Ethics and Bar complaints against Albriton as far back as 2021.
      - Article 2 quotes White’s report critical passages; says if the Ethics Director is allowed to keep his position, avoid prosecution or accountability, then it is proof positive that Alabama is the most politically corrupt state in the United States.
      - Article 2 says Albriton should resign because he is corrupt and his job is to protect the corrupt.
      - Article 2 notes that in 2021 Mr. Ripp made allegations including an Ethics Complaint against the Ethics Commission, a Bar Complaint against Albriton regarding the matter, and a Writ of Mandamus in the Circuit Court of Montgomery County to get a judge to order the Ethics Commission to review three complaints that Albriton disposed of without investigation; basis was Albriton’s involvement in self-dealing as Trustee; that was in 2021.
      - In 2022 Mr. Ripp ran for Attorney General of the State of Alabama (R-Baldwin) against Mr. Marshall (R-Incumbent) and made numerous stump speeches about the Ethics Commission, the Mabel Amos Trust, and Albriton’s activities.

      THE PIVOT:
      - Why Article 2 is the smoking gun/key context for Article 1: Article 2 provides older/background framing that connects Albriton’s conduct as trustee to his later/current role as Ethics Commission director; presents the issue as systemic/political corruption; quotes White’s report language and calls for accountability.
      - Article 2 frames Main Article’s White report findings as part of a longer pattern: self-dealing, hidden scholarship list, Ethics Commission inaction.
      - Article 2’s claim that Albriton should resign because he is corrupt and his job is to protect the corrupt sets up Main Article’s revelation that White found self-dealing and unallowed spending.
      - Article 2’s statement that if the Ethics Director is allowed to keep his position and avoid prosecution/accountability, then it is proof positive Alabama is the most politically corrupt state in the US, makes Main Article’s accounting details the evidentiary backbone.

      KEY ENTITIES:
      - Tom Albriton — Alabama Ethics Commission Executive Director.
      - Alabama Ethics Commission.
      - Alabama Attorney General Steve Marshall.
      - Montgomery County Circuit Court Judge Greg Griffin.
      - Special Fiduciary James C. White Sr., CPA.
      - Rick Clifton — Albriton law partner.
      - John Bell — Regions Bank trustee.
      - Drew McNeese — replaced Bell as Regions representative.
      - Mabel Amos — Alabama Secretary of State; donor.
      - Leigh Manning — Mabel Amos grandniece.
      - Megan Carmack — Mabel Amos great-grandniece.
      - Tyra Lindsay — Conecuh County student.
      - Byron B. Mathews Jr. — attorney.
      - Regions Bank.
      - Alabama Bar.
      - Governor — mentioned as absent/incoherent; no name given.
      - Lagniappe — Rob Holbert, Ashley Trice.
      - Ripp Report — filed Ethics and Bar complaints against Albriton.
      - Andalusia — Covington County; Conecuh County; PowerSouth Energy Cooperative; Alabama Electrical Cooperative.
      - Education entities: University of Texas at Austin; Southern Methodist University; Auburn University; University of Alabama; Troy University; Lurleen B. Wallace.
        - Ben Bowden — Alabama Court of Appeals; former partner; former probate judge; Anna Bowden daughter.
        - Paula Tillman — Rick Clifton’s secretary; Chandlar Dauphin grandmother.
        - Tina Ballard — Rick Clifton’s secretary; Ballard children.
        - Martha H. Albriton — Albriton daughter.
        - James Albriton — Albriton son.
