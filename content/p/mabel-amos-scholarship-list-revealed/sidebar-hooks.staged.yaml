      - Between 2014 and 2017, Covington County Probate/Circuit Court Judge Ben Bowden—a former law partner and childhood friend of Albritton—received $45,000 ($60,000 total) in trust funds for his daughter's education.
      - Regulatory bodies (the Ethics Commission, Attorney General Steve Marshall, Bar Association, Judiciary, and District Attorneys) failed to act on complaints filed by The Ripp Report, prompting the Writ of Mandamus as a test of the state's ethics system.
      - Oil well "Amos 36-3" on Mabel Amos Memorial Fund land produced $70 million to $80 million in oil and gas, with millions more in potential value, while trustees and Regions Bank heavily profited and hid disbursements.

      THE DISCOVERY:
