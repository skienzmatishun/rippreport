      - While Article 2 flagged the initial allegations of Tom Albritton funneling money to his children and Ben Bowden's family amid a brick-wall of state inaction, Main Article 1 utilizes CPA James C. White, Sr.'s court-ordered special fiduciary report to definitively confirm those exact cash flows, unveil the full 12-year hidden recipient list totaling $725,000 in unallowed spending, and detail the cover-up.

