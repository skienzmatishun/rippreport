      - Widget: The downside is that the council and mayor never made a clear decision on Fairhope Covid protocol and have, through their own lack of leadership, created the situation they now face. Jack’s quote is typical Jack B.S. And demonstrates that he still cannot make a definitive statement without talking in circles.
