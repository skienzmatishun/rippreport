    brief: |-
      THE CONFLICT:
      - Ronan McSharry, owner of McSharry’s bar in Fairhope, knocked Paula DiNardi off a bar stool at Little Whiskey Christmas Club.
      - McSharry claimed the establishment “made him get drunk” and caused him to knock DiNardi off a bar stool; he then would sue the same establishment.
      - McSharry has never apologized or acknowledged he did anything wrong after multiple incidents.
      - In McSharry’s third-party complaint, he alleges that because of LWCC’s conduct, he was directly caused to “suffer damages.” A complete reading of the complaint shows McSharry was not injured in person, property or means of support. In fact, the only injury that McSharry seems to have sustained is his financial cost of defending himself,” LWCC claims.
      - In addition to McSharry’s alleged defenses against LWCC, he claims a settlement agreement was reached with DiNardi just weeks before she filed her lawsuit “whereby all of DiNardi’s claims asserted against McSharry in this lawsuit would be dismissed without prejudice.” DiNardi has refused to abide by the terms of that settlement agreement.
      - McSharry has never apologized and has claimed that the “knocking her off the bar stool, stemmed from an argument, total bullshit.” McSharry also claims a settlement had been reached, wrong again a settlement was offered early on and DiNardi declined.
      - But when police were called to the Little Whiskey Christmas Club in response to DiNardi’s assault claim, they found McSharry had a “strong odor of alcohol,” “slurred his speech” and was so intoxicated “he couldn’t hardly walk,” according to officers’ testimony. Plus, the surveillance video that captured the attack was shown to the court.
      - Fairhope Municipal Judge Haymes Snedeker found McSharry guilty of both counts and imposed a sentence of 180 days.
      - Baldwin County Circuit Judge Clark Stankoski, who “requested” to hear the case, dismissed the most serious charge, which is on video, of assault, which McSherry already plead guilty to in municipal court.
      - McSharry’s attorney James Pittman wants to float conspiracy theories and challenge the state’s Shield Law. Pittman is blaming everyone else, except McSharry.
      - This week the Fauxhope city attorney, Marcus McDowell represented Paula DiNardi in a case that was supposed to be an assault and intoxication charge against Ronan McSharry, owner of McSharry’s bar in Fairhope.
      - McSharry, already on probation, had help from the city attorney who, conveniently and repeatedly, failed to file the assault charge leaving McSharry with only having to face an intoxication charge in circuit court. The judicial hand off to a Judge that “wanted” the case.
      - Judge Stankowski, after a one day trial where McSharry was found guilty, rendering a sentence of one year, unsupervised probation, without addressing the assault charge or the fact McSharry had already been sentenced to 6 months in jail and was on probation at the time of the assault on DiNardi.

      THE DISCOVERY:
      - Article 2: Fairhope City Council and the Mayor are giving away money like green stamps. They scream and yell about taking federal money for anything, but when it is available they cash the check. Hypocrites does not even come close to describing Fairhope’s present government.
      - Remember the 2020 Arts and Craft show, where the city council and then candidate Sherry Sullivan, made Covid a political issue? They wanted to “TAKE A CHANCE” with the communities health and proceed with the scheduled Arts and Craft Show. They pushed the mask debate, defending everyone’s right to do whatever they wanted. How about the Christmas parade, where Mayor Sullivan turned a bind eye to masks, health experts, and the Covid Pandemic.
      - Mayor Karen Wilson quote: “I raised a possible scenario that this event may need to be canceled or rescheduled to mitigate potential exposure. This scenario is the last thing I’d want for our City. However, as the City’s Chief Executive, I take the health, welfare and safety of every Citizen and Visitor to this City very seriously. If the status of the virus changes within our state and the State Health Officer issued recommendations that such large events are not held, that will become my position as well.”
      - Widget says: “That was leadership then. Now we have no leadership.”
      - Widget says: Now it is a different story, the feds have sent Fairhope some money so they will eat their hat and cash the check. NOW the mayor and council see the problem with Covid because Now Fairhope has employees that are sick or not vaccinated. Now we have a pandemic of the UN-vaccinated created by our own lack of leadership and ignorance.
      - Widget: Where is all that bravado about no masks from Jack Burrell and Mayor Sullivan? What happened to their fiscal conservatism. FREE MONEY that is what happened.
      - The American Rescue Plan, approved by Congress earlier this year, provided money for municipalities to compensate employees affected by the pandemic. In May, the city awarded its full-time employees $500 for working through the pandemic, but with proof of vaccination they are now eligible for $500 more. Part time employees who get vaccinated may receive $250 and seasonal employees will receive $125.
      - Widget: What about the employees constitutional rights not to mask or vaccinate? I guess everything is for sale.
      - Widget: Fairhope’s leadership has now got their ass in a crack, defending masks and paying for vaccinations. They created the problem with their insistence of making Covid a political issue and not recognizing a pandemic is a health issue. They have been, for over a year, chastised by doctors, hospitals and teachers for sending mixed messages to the public.
      - Widget: Earlier in the meeting, resident Stephanie Durnin said she was disappointed to see the item on the agenda and its approval indicates the council lacks fiscal conservatism. Incentivizing a vaccination with taxpayer funds is unconscionable and will cost a fortune, she said. It doesn’t matter that money came from the federal government, where do you think they got it from? It is not the place of the government to rain money on those who participated in a voluntary medical procedure.
      - Widget: Another resident, Stephanie Hannon, said the resolution was “wrong,” “bordering on coercion,” and “tantamount to bribery.” She came armed with facts and data gathered about the pandemic, suggesting the incentive may cause a rift between employees and advising caution regarding unapproved vaccines. The emergency use of COVID-19 vaccines come with known and unknown risks, she said. Should our city employees be injured due to taking your offer and submitting to the experimental vaccinations, what will your response be?
      - Widget: Council President Jack Burrell, who tested positive for corona virus last year, said it’s a personal choice. “Nobody’s going to chastise you if you don’t,” he said, adding that there is no animosity between employees who have been vaccinated and those who haven’t. “I don’t think there is a downside to this.”
