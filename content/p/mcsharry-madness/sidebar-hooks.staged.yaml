      - Widget: The Fairhope Mayor and City Council have not been taking into consideration, or listening, to our first responders, teachers, nurses, and doctors, that have to deal with Covid on a daily basis. In the past they have ignored them, while politicizing the pandemic.
      - Widget: Get vaccinated and wear a mask, Covid is no joke. This is now a PANDEMIC OF THE UN-VACCINATED.

