      State Senator Andrew Jones (R-Centre) to carry Senate Bill 67 (SB67), which
      seeks to eliminate the Veterans Board and transfer direct appointment power
      over the Department of Veterans Affairs to the Governor.


      THE DISCOVERY: The January 2026 press release confirms Alabama’s medical cannabis
      program has moved from legislative development to active operational deployment.
      The Alabama Medical Cannabis Commission (AMCC) has issued three dispensary licenses
      and the Alabama Board of Medical Examiners & Medical Licensure Commission has
      approved five physicians to certify patients under the Compassion Act.


      THE PIVOT: Both articles center on Governor Kay Ivey’s consolidation of executive
      power over independent state boards in Alabama. The Ainsworth statement in the
      second article proves a pattern where Ivey is systematically dismantling legislative
      and administrative checks (Veterans Board) to centralize appointment and policy
      authority solely within her office. This context makes the AMCC’s continued
      regulatory milestones under the Compassion Act a direct continuation of the
      same power-grabbing theme, with independent bodies being bypassed or controlled
