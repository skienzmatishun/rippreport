  go-to-hell-veterans:
    brief: 'THE CONFLICT: What happened in the past?

      - March 30, 2019 – Gov. Kay Ivey signed SB 46, Alabama’s Compassion Act, making
      AL the 36th state to legalize medical cannabis; law effective May 1, 2019 (non-smokable
      forms only).

      - October 2024 – Ivey dismissed retired U.S. Navy admiral and ADVA Commissioner
      Kent Davis from a nonpartisan veterans board she claimed mishandled federal
      funds.

      - September 2024 – Davis filed an ethics complaint accusing Mental Health Director
      Kim Boswell of “colluding” with officials to divert $7 million in American Rescue
      Plan (ARP) Act money from the Alabama Department of Veterans Affairs (ADVA).

      - January 2, 2025 – SB 67 (Sen. Andrew Jones, R-Centre) passed the Senate 21–9,
      transferring control of the veterans board to a governor-appointed commissioner
      and stripping ADVA of independence.

      - April 3, 2025 – House passed SB 67 by 56–39; veteran supporters allege it
      was “revenge” for Davis’s complaint and Ivey’s ouster of him.


      THE DISCOVERY: What Article 2 revealed

      - SB 67 (passed Jan. 2, 2025) replaced the 70-year-old nonpartisan State Board
      of Veterans Affairs with a single commissioner appointed by Gov. Ivey — effectively
      “cutting the throats” of veterans per Riehm’s quote in Article 2.

      - The $7 million ARP funds meant for ADVA were not released; Boswell allegedly
      “colluded” with other officials to keep them away (per Davis’s ethics complaint
      cited in Article 2).

      - Alabama is ranked 50th out of 51 states in mental-health access (Mental Health
      America, per Article 2).

      - House member Ed Oliver (R-Dadeville), chair of the Military & Veterans Affairs
      Committee, served as House sponsor for SB 67; other “traitor” votes included
      Napoleon Bracy, Chip Brown, Barbara Drummond, Brett Easterbrook, Jennifer Fidler,
      Donna Givens, Frances Holk-Jones, Chris Pringle, Mark Shirey, Matt Simpson,
      Shane Stringer, Margie Wilcox.


      THE PIVOT: Why Article 2 is the ‘smoking gun’ for Article 1

      - The medical cannabis program in Alabama was enacted under Gov. Kay Ivey (SB
      46, signed March 30, 2019). Article 2 shows the same governor’s administration
      using power to crush veteran governance in 2025 — i.e., Ivey is not the benevolent
      enabler of a compassion program she claims, but the politician who “cut our
      throats” (Riehm) and whose cabinet official Boswell allegedly embezzled $7M
      from veterans.

      - The pivot: Article 2 reveals that the political apparatus now overseeing Alabama’s
      Compassion Act — Ivey and her administration — is the same one veterans say
      betrayed them, making the “medical cannabis = compassion” narrative untenable
      if the same governor also gutted veteran institutions.


      KEY ENTITIES: specific names/organizations to mention

      - Kay Ivay (Governor)

      - Kent Davis (retired Admiral, former ADVA Commissioner, ethics complainant)

      - Kim Boswell (Director of Alabama Dept. of Mental Health; cabinet member named
      by Ivey in 2024)

      - Andrew Jones (State Sen., R-Centre, SB67 sponsor)

      - Ed Oliver (Rep., R-Dadeville; House Military & Veterans Affairs Committee
      chair; SB67 House sponsor)

      - Napoleon Bracy, Chip Brown, Barbara Drummond, Brett Easterbrook, Jennifer
      Fidler, Donna Givens, Frances Holk-Jones, Chris Pringle, Mark Shirey, Matt Simpson,
      Shane Stringer, Margie Wilcox (House “Red Lips” opponents of SB67)

      - Alan Baker (Rep., R-Brewton; sole local supporter of SB67 per Article 2)

      - Adam Riehm (Veterans leader quoted in Article 2: “We cut our throats… We will
      actually work to overturn this”)

      - Jeff Poor (quoted in Article 2: “Kay Ivey is petty and vindictive”)

      - Adeline Clarke, Vivian Davis Figures (Senators mentioned in Article 2 context)

      - Alabama Medical Cannabis Commission (AMCC) — regulators issuing January 2026
      licenses

      - State Board of Veterans Affairs (ADVA/SBVA) — the independent veterans body
      SB67 gutted

      - American Rescue Plan Act funds ($7 million)

      - The Lagniappe and Baldwin County Legislative Delegation (veterans who “backed
      the veterans” per Article 2)'
