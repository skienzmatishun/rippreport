  TOP-TO-BOTTOM-CORRUPTION:
    brief: 'THE CONFLICT:

      - **Mabel Amos Memorial Fund (MAMF):** Charitable trust established by Alabama’s
      first female Secretary of State in her will; managed by regions Bank and the
      Albritton Law Firm.

      - **Wildcatting Windfall (2011–2013):** A wildcatter hit a crude oil reservoir
      in Conecuh County land owned by MAMF; millions poured into the trust.

      - **Self-Dealing Accusations:** Tom Albritton and Rick Clifton of the Albritton
      Law Firm served as board members. Albritton’s two children received $120,000
      in tuition at the University of Texas during a period when the fund was distributing
      large sums; this constitutes forbidden self-dealing under trust law.

      - **Conflict of Interest/Institutional Capture:** Shortly after the scholarships
      began, Tom Albritton was appointed Executive Director of the Alabama Ethics
      Commission, the body tasked with policing public officials and attorneys for
      ethical violations.

      - **Civil Suit & Standing Dispute (2013–Present):** Amos relatives sued Regions
      Bank (which charged over $1 million in fees). Steve Marshall (Alabama Attorney
      General) sought to join the case claiming regulatory standing.

      - **Ethics Commission vs AG Battle:** Albritton and Marshall clashed over whether
      the Ethics Commission must share exculpatory evidence ("Brady material") with
      prosecutors; the legislature intervened with a statute requiring this information
      sharing, cementing the AG’s investigative authority over the commission.


      THE DISCOVERY:

      - **Political Protection:** Despite Attorney General Steve Marshall openly accusing
      Albritton of fraud and self-dealing in his court motion to join the lawsuit,
      he has not criminally investigated or charged Albritton for these offenses.

      - **Institutional Capture:** Regions Bank has stated that only the AG’s office
      has legal standing regarding the trust’s finances, creating a circular dependency:
      The AG must investigate the parties (Regions/Albritton) who hold massive financial
      interests in his political success and receive campaign cash from both parties.

      - **Judicial Stalling:** Judge Johnny Hardwick has failed to rule on approximately
      70 motions filed in the case since the lawsuits began, unlike similar civil
      cases assigned to him during the same period.


      THE PIVOT:

      - **The "Peach Again" Irony:** Article 1 ("Medical Cannabis Licenses Approved")
      celebrates a new economic industry and regulatory milestone under the state’s
      Compassion Act. However, Article 2 reveals that the same legal and political
      system governing the public is dominated by unchecked self-dealing (the $500,000
      MAMF trust siphoned to Albritton’s family) and a lack of accountability (AG
      Marshall protecting his close ties with Regions/Albritton).

      - **Institutional Incoherence:** The "smoking gun" is that while the state pushes
      forward with new economic expansions (medical cannabis), the foundational oversight
      body (Ethics Commission) is led by Albritton who faces unprobed self-dealing
      charges, and the enforcement body (AG) is effectively complicit due to financial/political
      capture.


      KEY ENTITIES:

      - **People:** Steve Marshall (Alabama AG), Tom Albritton (Executive Director
      of Ethics Commission, Albritton Law Firm), Rick Clifton (Albritton Law Firm),
      Jed Clampit (Unrelated oil accident witness, per narrative), John Bell (Regions
      Bank officer), Tyra Lindsey (Scholarship student petitioner), Byron Mathews
      Jr. (Lindsey’s attorney), Judge Johnny Hardwick, Rob Holbert (Author of Lagniappe
      Newsletter).

      - **Organizations:** Mabel Amos Memorial Fund, Alabama Ethics Commission, Regions
      Bank, Albritton Law Firm (Andalusia), Alabama Board of Medical Examiners & Medical
      Licensure Commission, Alabama Medical Cannabis Commission (AMCC), Alabama Cannabis
      Industry Association 501C6.

      - **Locations:** Montgomery, Ala., Andalusia, Ala., Conecuh County, Univ. of
      Texas.'
