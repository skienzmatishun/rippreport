    brief: |-
      THE CONFLICT:
      Past conflict involved developer Angelo Corte and former Mayor Tim Kant in Fairhope concerning a 230-apartment project along Fly Creek. Taxpayers paid for infrastructure (Fire Station on Parker Road, sewer lift station) and accepted a "gift" of wetlands from Corte to the City of Fairhope, which received drainage from the Publix property.

      THE DISCOVERY:
      Article 2 established that Catalyst supported the Corte/Kant development project 100%, viewing it as benefiting the developer, not the community.

