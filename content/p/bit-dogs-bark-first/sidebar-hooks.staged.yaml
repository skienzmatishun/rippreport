      2. John G. Avent is a Firm Partner at Preble-Rish, Inc.
      3. Kevin Boone is a member of BA-101, LLC (formed 4-29-2004), registered agent for which is BOONE, KEVIN G.
      4. Boone opposed the selection of Cassady Company, Inc. for a Professional Engineering Capacity Study, insisting on local firms (e.g., HMR, Dewberry/Preble-Rish LLC).
      5. Councilman Jay Robinson received a $1,000 contribution to his campaign from Ray Hix (Airport Authority Board member/Sec. Treasurer).

      THE PIVOT:
