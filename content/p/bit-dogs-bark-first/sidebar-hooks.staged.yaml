      2. Article 1 reveals a direct financial and business conflict of interest between Councilman Boone and Preble-Rish/John G. Avent, which Boone actively used to obstruct necessary municipal infrastructure transparency (sewer/water/gas study).
      3. Both articles detail council members (Burrell, Robinson, Boone) leveraging positions or relationships to prioritize special interest/individual interests over city transparency and public welfare.

