      *   Kant employed tactics of political intimidation, including City Council/Planning Board refusing to allow public participation three times and installing metal detectors at City Hall.
      *   The Fly Creek Apartments project was driven by a "development plan" not a village plan, intended to bring connectivity (roads, trails, bridges) into neighborhoods like Woodlands, Plantation Pines, Rock Creek, and Sandy Ford onto Highway 13.

      THE PIVOT:
