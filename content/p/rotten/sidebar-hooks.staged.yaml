      - Article 2 framed Fairhope as being run as a criminal enterprise.
      - Article 1 (Main, "ROTTEN," "WORST ELECTED OFFICIAL") adopted the criminal enterprise framing.
      - Article 1 directed readers to May 2016 Ripp Report articles about Councilmen Burrell and the airport scam.
      - Article 2 is the smoking gun for Article 1 because it raised the criminal enterprise allegation that Article 1 now ties to Jack Burrell.

