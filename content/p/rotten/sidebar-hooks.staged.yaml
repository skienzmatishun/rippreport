    brief: |-
      THE CONFLICT:
      - Baldwin County has a share of corrupt and/or inept elected officials.
      - Two worst elected officials identified: Sen. Elliott and Jack Burrell.
      - Sen. Elliott ranked second; Jack Burrell ranked first.
      - Jack Burrell served as Fairhope City Council President and headed the City Council, which operated as a criminal enterprise.
      - The "appointed" city Attorney and Fairhope Municipal Judge could always depend on Burrell.
      - Jack Burrell and the Fairhope Municipal Judge had a "special bond"; "Three years later and the Judge and Jack are at it again."
      - May 2016: The Ripp Report published articles about Councilmen Burrell and the airport scam.
      - Burrell served as council president for approximately seven years through 2020; deemed a disgrace; in 2020 recognized as threat to quality of life, property values, and children.
      - 2020: Main article headline directive: "VOTE OUT THE ENTIRE CITY COUNCIL IN 2020."

