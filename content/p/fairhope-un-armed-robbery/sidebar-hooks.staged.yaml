  liar-liar-pants-on-fire:
    brief: |-
      THE CONFLICT:
      - Fairhope, Alabama: alleged "robbery" of $20 million and 106 acres of land by The Weeks Bay Foundation and Fairhope City Council.
      - Weeks Bay Foundation director said they did not want to do anything against wishes of Fairhope citizens; same statement reportedly made re: Fly Creek Apartments.
      - Monday night: Weeks Bay planned another attempt with council help to gain control of Fairhope City Property for "PERPETUITY, aka ETERNITY."
      - Council had no public participation on the Conservation Easement.
      - Driving forces identified in article: Diana Brewer of Weeks Bay, Fairhope City Council President Burrell, Fairhope City Attorney Marcus McDowell.
      - Blogger placed open bet of $1,000.00 that secret donor is connected to Author Corte.
      - Fairhope Council members Burrell, Brown, and Boone accused of using office for personal gain; other two accused of burying heads, covering ears, closing eyes.
      - Allegation: facts back up personal-gain allegations.

      THE DISCOVERY (Article 2, older of the two):
      - Baldwin County legislators having "field day" under "puppet Governor, Poison Ivy."
      - "Goat Hill" (Alabama State Capitol) throwing bills after another into "pot of corruption."
      - Legislators want citizens to believe accountability is only through the Ethics Commission, which they control.
      - Ethics Commission described as "toothless tiger," controlled and operated by same legislators; provides "protection from prosecution" of elected officials accused of Ethics violations if in Republican party; likened to "toilet paper with holes in it."
      - One week prior: legislators wanted to legalize corruption.
      - Current week: Baldwin County officials want citizens to believe Economic Development lobbyists are not really lobbyists.
      - Bill grants cover for people offering "incentives" in exchange for access to power; eliminates paper trail; enables lawmakers to hide names and identities of benefactors.
      - "Economic developers" described as "ghosts" operating under blanket of obscurity, anonymity, and secrecy; can buy access to most influential lawmakers absent impunity.
      - Government considering ghosts do not exist; makes it nearly impossible to hold crooked lawmakers accountable when they sell vote to highest bidder.
      - Newly elected State Senator Elliott, aka "the TAX MAN," commented; supports Police for public relations; Sheriff Hoss Mack riding same wave.

      THE PIVOT:
      - Article 2's content — bill eliminating paper trail for "incentives" and hiding benefactor names — is the mechanism that explains the anonymous donor and lack of transparency in Article 1.
      - Anonymous donor "greasing the wheel" in Fairhope aligns with Article 2's "ghosts" economic developers operating in secrecy.
      - Ethics Commission described in Article 2 as controlled by legislators (with Republican-party protection caveat) parallels Article 1's claims of council inaction and lack of public participation.
      - State Senator Elliott's PR maneuver (supporting Police, using P.R. people, key words like crime/education/religion/veterans/police/abortion/immigration) mirrors pattern in Article 1 of elected official using office for public relations gain.

