  tax-tax-and-re-tax:
    brief: |-
      THE CONFLICT:
      *   Baldwin County struggled with funding for Schools/Streets due to developers paying little impact fees, costing taxpayers.
      *   In Fairhope, the City Council favored a special school tax over a Mayor’s proposal for equitable impact fees.
      *   The Council President stated the City Council wanted "out of any School business."

      THE DISCOVERY:
      *   The Fairhope City Council historically favored special school taxes over equitable municipal funding mechanisms (impact fees).
      *   This pattern of prioritizing specific funding methods over broader civic planning predates the current property dispute.

      THE PIVOT:
      *   The historical preference for special taxes and stated disinterest in school business (Article 2) provides context for the current land/property acquisition attempt (Article 1), where the City Council is involved with Weeks Bay Foundation in gaining control of Fairhope City Property for PERPETUITY.

