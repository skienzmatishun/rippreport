  disposal:
    brief: |-
      THE CONFLICT: Council President Jack Burrell maintained his title for over 7 years, using his control to favor special interests such as CATALYST and developers of Fly Creek apartments; Burrell led the Council to override the Mayor’s veto over the Fly Creek extension zoning and settled the Triangle lawsuit, despite lying to citizens about the land purchase.

      THE DISCOVERY: Article 2 reveals Burrell's historical pattern of avoiding public participation (leading to a Federal Lawsuit loss) and prioritizing developer interests over citizens when dealing with city property, including the initial discussions to "dispose" of 106 acres of city property worth $20 million.

      THE PIVOT: Article 2 establishes that the Council's history is marked by prioritizing special interests and undermining citizen engagement when handling large city assets, providing the context that the current attempt by The Weeks Bay Foundation (Article 1) to gain perpetual control of 106 acres is part of a long-standing pattern of alleged corruption, not an isolated incident.

