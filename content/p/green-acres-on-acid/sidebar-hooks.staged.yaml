      *   A lawyer paid a lawyer to obtain an advisory ethics opinion (no. 2016-04) allowing a Fairhope Airport Board member to lease with the same airport authority.
      *   Ray Hix, a Board member, utilized confidential airport information regarding leases and bids to secure the lease for Mid Bay Air LLC.
      *   Jack Burrell, Airport Authority Board Member and City Council President, reviewed bids and determined Hix's company was the winner despite obvious conflicts of interest.

      THE PIVOT:
