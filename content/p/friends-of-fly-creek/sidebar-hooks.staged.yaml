    brief: |-
      THE CONFLICT:
      - Fly Creek flooded with mud/sediment since the Publix project clear cut.
      - Developer Arthur Corti contributed heavily to the Mayor and Council.
      - Mayor Tim Kant orchestrated the transfer of developer liability to the city.
      - The 230-unit Retreat at Fairhope Village was contentious; Karin Wilson's opposition may led to her victory over Tim Kant.
      THE DISCOVERY:
      - Former Mayor Tim Kant first proposed re-establishing creek biological/hydraulic connectivity in 2014.
      - A 2023 culvert failure necessitated emergency repairs.
      - City voted to seek a $20 million federal BUILD grant (applications in 2024/2025 failed).
      - Dredging for the Fairhope Marina (M & N of Alabama LLC) is required every five years due to construction runoff.
      - DNA of creek sediment matches the Publix construction.
