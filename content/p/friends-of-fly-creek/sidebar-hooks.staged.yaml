      THE CONFLICT:
      *   In 2019, over 50,000 residents, including those led by Jim Zeigler, publicly protested a proposed toll tax system for commuting into Mobile.
      *   The toll tax was part of a $3.2 billion project coordinated by the Governor’s office and federal agencies, imposing a $7.70 per trip fee.

      THE DISCOVERY:
      *   The toll tax scheme was driven by external investors and federal alignment, not local necessity, representing a slow-motion takeover prioritizing infrastructure revenue.
      *   Politicians who previously supported local opposition to tolls later became loudest supporters of the project, demonstrating a shift in representation from citizens to investors.

      THE PIVOT:
      *   The 2019 toll conflict established a historical pattern where local opposition to large, external financial schemes (tolls) was overridden by powerful interests (investors/federal agencies).
      *   This pattern mirrors the current situation where local environmental concerns (Fly Creek pollution from Publix/Apartments) and community opposition are ignored by City Council and Mayor, favoring large developer interests (Author Corti).

