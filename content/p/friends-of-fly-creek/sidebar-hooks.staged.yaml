  fly-creek-erosion-and-hidden-development-threats:
    refined_source: 4ba9ac2eefdeea4fa894026512c7abbd49f97d827298a7be33c3e9f49895b2ea
    brief: |-
      THE CONFLICT:
      *   Construction of Publix shopping center led to severe erosion and sediment deposition in Fly Creek.
      *   In 2011, a complaint was filed against Mayor Kant and Senator Pittman for grant fraud related to BP funds.
      *   In 2013, Mayor Kant commissioned a $30,000 study by Thompson Engineering for the Fly Creek Watershed Restoration Project.
      *   In 2014, the city settled a property dispute (triangle property) for $12 million in secret, reversing a 40-year policy, favoring developer Arthur Corti.

      THE DISCOVERY:
      *   Fly Creek suffered severe erosion (banks collapsed over 20 feet) and log jams due to construction runoff from the Publix project.
      *   The $14,700,000 Mobile Bay Preservation and Restoration grant proposal explicitly addressed sediment removal from Fly Creek, which was identified as coming from the private developer Regency Center/Mr. Corti.
      *   The city was proposing the 230-unit Retreat at Fairhope Village (275 apartments + 15 townhomes) within the Fly Creek watershed, sharing a detention pond with the shopping center.

      THE PIVOT:
      *   The 2014 article documented the initial, long-term environmental damage (Publix runoff) and established a history of political/financial compromise (Kant/Corte deals, failed studies, grant fraud investigation).
      *   This history shows that the current issues (Retreat at Fairhope Village, new cluster F approvals) are not isolated incidents but a continuation of the same pattern of developer abuse and council/mayor complicity over 12+ years.

