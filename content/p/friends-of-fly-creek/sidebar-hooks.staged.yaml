  orange-beach-tyranny:
    brief: "THE CONFLICT: \n- For over 12 years, developer Arthur Corti engaged in clear-cutting and construction projects (including a Publix strip center and the 230-unit Retreat at Fairhope Village apartments) that caused severe mud, silt, and construction runoff to flood Fly Creek in Fairhope, Alabama. \n- The sediment destroyed marine life, damaged apartments, and required millions of dollars in recurring dredging. \n- Former Mayor Tim Kant, current Council President Jack Burrell, and subsequent local administrations ignored resident opposition, approved subsequent developments along Parker Road despite lawsuits, and shielded Corti (a major political contributor) from liability—even transferring liability to the city. \n- Mayor Karin Wilson previously ran and won her election partly on opposition to the Retreat at Fairhope Village project.\n\nTHE DISCOVERY: \n- The background context reveals a systemic pattern of municipal corruption, information compartmentalization, and accountability evasion by local officials in Baldwin County. \n- While the main article exposes local officials in Fairhope shielding developer Arthur Corti and ignoring environmental destruction for over a decade, historical reporting on neighboring Orange Beach administration (Mayor Tony Kennon) demonstrates a broader regional framework where city executives, police chiefs, and city attorneys actively conceal information from the public, media, and city councils while dodging state-level oversight (such as ALEA investigations).\n\nTHE PIVOT: \n- Article 2 serves as the contextual \"smoking gun\" by exposing the exact institutional rot, cover-up tactics, and cozy relationships among Baldwin County municipal leaders that allow local authorities (like those in Fairhope) to operate with total impunity, ignore citizen lawsuits, and protect politically connected actors (like developer Arthur Corti) from environmental and legal accountability.\n\nKEY ENTITIES: \n- Arthur Corti (Developer)\n- Tim Kant (Former Fairhope Mayor)\n- Jack Burrell (Fairhope Council President)\n- Karin Wilson (Former Fairhope Mayor)\n- Tony Kennon (Orange Beach Mayor)\n- Danny Williams (Deceased; 2016 Federal Drug Investigation co-target)\n- Adam Milam (Attorney)\n- Neeli Faulkner (Murder Creek Media)\n- Whitney Scapecchi (Murder Creek Media)\n- Brandon Moseley (The Alabama Gazette)\n- Harry Still\n- Mr. McCallum (Baldwin County Legislative Delegation staff)"
