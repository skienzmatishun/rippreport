    refined_source: f1c9263428f2cf1ad936fb82a75558f1f4e882372a27e87ccadb0d445c49f642
    brief: |-
      THE CONFLICT:
      *   Alabama is noted as the nation's number one state for political corruption.
      *   Alabama State Representative Mike Ball proposed AL HB179 to require Alabama Ethics Commission approval for prosecuting elected officials for corruption, as a tweak to the 2010 ethics reform.
      *   Alleged corruption in Columbia, Alabama involved the Mayor, Chief of Police, and City Council, with specific allegations against the Mayor (illegal work for cronies, illegal use of town equipment, illegal property transfer, misuse of taxpayer funds).
      *   Complaints regarding Columbia, including conflict of interest (Ben Freeman, municipal prosecutor, representing Lori Mock, wife of Officer Jim Mock) were filed with the Attorney General and the Ethics Commission over the last 12 years.

      THE DISCOVERY:
      *   The Alabama Ethics Commission provides "Alabama Corruption Insurance"—a mechanism that grants favorable advisory opinions to elected officials, offering "protection from prosecution."
      *   This insurance system, provided by the Ethics Commission, Governor, Attorney General, Judiciary, and Bar Association, is described as a way that the Ethics Commission aids and abets political corruption, maintaining Alabama's top corruption spot.

      THE PIVOT:
      *   The Ethics Commission, led by Mr. Tom Albritton, is accused in the Main Article of enabling self-dealing/self-stealing (e.g., Albritton children receiving more scholarship money than Mabel Amos' relatives).
      *   The Widget Article establishes that the Ethics Commission's function is not accountability but protection ("get out of jail card"), making it the central mechanism that allows both historical (Columbia) and recent (Albritton) corruption to persist.

      KEY ENTITIES:
      *   Tom Albritton (Director of Alabama Ethics Commission)
      *   Greg Albritton (Head of Regions Bank)
      *   Mabel Amos
      *   Mike Ball (Alabama State Representative)
      *   Columbia, Alabama
      *   Ben Freeman (Columbia municipal prosecutor)
      *   Lori Mock (wife of Columbia Officer Jim Mock)
      *   Alabama Ethics Commission
      *   Regions Bank
    llm_text: Alabama's Ethics Commission offers "corruption insurance," shielding officials from prosecution instead of ensuring accountability. Learn how Tom Albritton's body enabled the decades-long corruption in Columbia, AL, and why reform efforts like Mike Ball's AL HB179 still struggle.
