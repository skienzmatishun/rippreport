  dirty-hands:
    brief: |-
      THE CONFLICT:
      *   March 2017: Fairhope welcomed a new administration.
      *   Fairhope Catalyst Council opposed the Mayor’s choices and obstructed new hires, including Sherry-Lea Bloodworth Botop.
      *   Sherry-Lea Bloodworth Botop started in early 2017 as Economic and Community Development Director.
      *   The Catalyst Council de-funded Bloodworth Botop's position, leading to her departure and subsequent transition to Deputy Director of Mobile Bay National Estuary Program (MBNEP).
      *   Council President Burrell commented on the resignation of planning director Wayne Dyess.

      THE DISCOVERY:
      *   The Fairhope Catalyst Council demonstrated actions labeled "dirty hands," including attempts to de-fund/force out Bloodworth Botop, and involvement in approving Fly Creek Apartments and traffic congestion at highway 98 and Parker Road.
      *   Chuckee Cheeze, a former Courier editor, was appointed Baldwin County Legislative Delegation Constituent Services Director and is described as printing political hit pieces dictated by the Council.

      THE PIVOT:
      *   The local political obstruction and "dirty hands" demonstrated by the Fairhope Catalyst Council (Article 2, 2017 context) provides evidence of systemic, localized political corruption that mirrors the large-scale, state-level influence peddling described in Article 1 (e.g., PCI contributions, lobbying by Business Council of Alabama) where politicians like Senator Elliott favor special interests over public good (education).

