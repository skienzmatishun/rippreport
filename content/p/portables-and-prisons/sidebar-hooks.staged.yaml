  one-woman-2:
    brief: |-
      THE CONFLICT:
      - Article 1 frames Alabama as the most politically corrupt state in the United States.
      - Corruption in Article 1 tied to lobbyists and the Business Council of Alabama.
      - Lobbyists able to buy needed politicians to keep Alabama corrupt.
      - Alabama talked about an education lottery for 20 years; after political sellout, education not mentioned.
      - Alabama political lottery pays off general fund debt back to 2013; no education dollars; only prisons and past debt.
      - Alabama likely to lose billions with political lottery.
      - Alabama prisons deplorable; need to build more; education answer was portables.
      - PCI pumped $4.5 million of campaign contributions into Alabama political bloodstream since 2013; virtual tie for largest contributor with Business Council of Alabama’s Progress PAC.
      - Senator Elliott got 27,000 from the Indians to get elected; third time went against campaign promises and favored special interests; betrayed Baldwin County children; ignored promises to citizens.
      - Senators Marsh and Albritton continued PCI’s bidding even after calling state their deadliest enemies; mystery.
      - Poarch Creek Indians admit state was played; plan to expand empire; will not pay taxes; ignored Trump’s warning and PCI’s self-statement.
      - Alabama to lose billions with political lottery; at same time ensure Poarch Creek Indians gaming monopoly.

      - Article 2 local background: Fairhope City Council bullied Mayor at Council meetings and public venues.
      - First council meetings of term were disgraceful.
      - Bullying leadership headed by Council President Jack Burrell, who refused to share Council President chair, supported by Councilmen Boone and Brown.
      - Councilmen Conyers and Robinson were mute, but complicit.
      - Bullying, intimidation, victimization same; intimidation major weapon in Baldwin County political and judicial arena; some men find women easy target.

      THE DISCOVERY:
      - Article 2 revealed Paula DiNardi was the victim.
      - DiNardi endured several postponements of case and over 8 hours in Fairhope Municipal Court, only to be victimized again.
      - DiNardi was latest victim of McSharry; life turned upside down since incident.
      - DiNardi mostly stood alone in attempt for justice.
      - City Attorney Marcus McDowell represented DiNardi poorly.
      - Defense attorney John Beck wanted to politicize assault case into continued witch hunt against Mayor.
      - Ronan McSharry found guilty in Fairhope Municipal Court last week of public intoxication and assault, sentenced to 180 days in jail, with time served during rehab stay.
      - McSharry represented by Defense attorney John Beck, well known for victimizing victims.
      - Appeal expected to follow; McSharry does not want to go to jail.
      - McSharry through another attorney attempted to settle with DiNardi, providing she remain silent for life and not show up for court, thus charges dropped.
      - Ripp Report’s understanding: both offers were rejected.
      - DiNardi refused money and running because she feels women should not be beat up by men and then paid off to remain silent.
      - John Beck not only defended McSharry but wandered into line of questioning that politicized and was not relevant to assault and public intoxication case.
      - Beck has way of victimizing victim and making guilty party look innocent.
      - Paula DiNardi represented in court by City Attorney Marcus McDowell, who should vigorously represent victim.
      - McDowell did not object or interfere with Beck’s line of questioning, which had no relevant value to case.
      - Municipal Judge allowed Beck to go unchallenged.
      - Beck asked DiNardi questions related to Paul Ripp aka Ripp Report and his involvement in case.
      - DiNardi explained Ripp Report, a non profit consumer organization, was acting as advocate for her.
      - Why judge nor city attorney did not ask Beck what relevance it had to do with case, unknown.
      - Beck asked series of questions about Mayor and alleged involvement in case or connection to Paul Ripp, The Ripp Report.
      - Beck rambled on without any objection being heard.
      - Politicization of case will be Beck’s defense, supported by victimization of victim.
      - City Attorney did not mention medical damages, over 6,000.00 dollars, DiNardi incurred, nor did he mention McSharry has a green card and is not a citizen of U.S. WHY?
      - DiNardi realized her case is being used in ongoing political witch hunt, focused on defeating Mayor Wilson in 2020.
      - Mayor and Ripp Report are not relevant to criminal charges against McSharry.
      - Get ready for 2020; all about politics and politicians, judges and attorneys keeping their jobs.
      - McSharry has a J Burrell sandwich on the menu.
      - J Burrell is Council President that secured City Attorney his job as well as Municipal Judge; it is all connected.
      - Since Mr. Beck appears ignorant about what Ripp Report is all about, Ripp Report will be sure to sign him up for newsletter.
      - Here are two articles that Mr. Beck may find helpful.

      THE PIVOT:
      - Article 2 is older than Article 1; frame Article 2 as background/historical context.
      - Article 2 showed local political intimidation, victimization, and politicization of a criminal case.
      - Article 2 is key context for Article 1 because Article 1 discusses Alabama corruption, lobbyist influence, political lottery, prisons, and education.
      - Article 2 provides local case background on how legal/political process may be used against a victim and how council/mayor/judicial/attorney connections operate.
      - Article 2 is the smoking gun/context for Article 1’s broader claims about political corruption and special interests.

