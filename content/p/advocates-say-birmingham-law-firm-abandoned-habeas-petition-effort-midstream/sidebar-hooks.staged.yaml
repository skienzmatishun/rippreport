  lt-governor-ainsworth-breaks-with-governor:
    refined_source: 6e6ebab795f238899bbf212b6c024b14a5e5946ae2a9036a92039859dd585ae1
    brief: |-
      THE CONFLICT:
      1. February 11, 2025: Alabama Lieutenant Governor Will Ainsworth released a statement opposing Governor Kay Ivey's plan to pass Senate Bill 67 (SB67).
      2. SB67 was sponsored by State Senator Andrew Jones (R-Centre) at the request of Gov. Ivey (R).
      3. The conflict arose after Veterans Commissioner Kent Davis filed an ethics complaint with Alabama Ethics Commissioner Kim Boswell.
      4. Gov. Ivey fired Kent Davis, despite the Veterans Board refusing to back the action.
      5. The board previously required veterans' groups to provide the governor with a list of three names for board members, and the board selected the Commissioner, but Gov. Ivey sought sole appointment power.

      THE DISCOVERY:
      1. Inmate Murray "Bubba" Lawrence, Jr., has maintained innocence during his second decade of imprisonment.
      2. The Birmingham firm Maxwell-Tillman agreed to draft a federal writ of habeas corpus for Lawrence after all state and district avenues were exhausted.
      3. Nearly half of Maxwell-Tillman's stated fee was paid as a down-payment.
      4. Maxwell-Tillman issued a Non-Engagement Letter, denying an attorney-client relationship and suggesting shared materials were not confidential.
      5. Advocates Francis Paul Ripp and Nancy R. Koerner state Maxwell-Tillman performed no real discovery or merit-based work, failing to establish Brady violations.
      6. The firm's primary partner, Leroy Maxwell, visited Lawrence only once; assigned attorney Gabby Humber departed in June without visiting the client.
      7. Advocates uncovered a suppressed Alabama State Coroners' Report detailing the exhumation of the murder victim and the removal of seven cervical vertebrae.

      THE PIVOT:
      1. There is no factual or thematic connection between the political conflict over SB67/Veterans Affairs and the professional misconduct allegations regarding Murray Lawrence's habeas petition.
      2. Article 2 (Ainsworth/Ivey conflict) serves only as historical context regarding 2025 Alabama politics but does not influence or explain the legal failure detailed in Article 1 (Maxwell-Tillman abandonment).

      KEY ENTITIES:
      1. Murray "Bubba" Lawrence, Jr.
      2. Francis Paul Ripp
      3. Nancy R. Koerner
      4. Maxwell-Tillman
      5. Leroy Maxwell
      6. Gabby Humber
      7. Will Ainsworth (Lt. Governor)
      8. Kay Ivey (Governor)
      9. Kent Davis (Veterans Commissioner)
      10. Andrew Jones (State Senator)
      11. Kim Boswell (Alabama Ethics Commissioner)
      12. Senate Bill 67 (SB67)
      13. Alabama State Coroners' Report
