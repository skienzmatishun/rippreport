  top-ten-reasons-pittman-needs-go:
    brief: |-
      THE CONFLICT:
      *   BP Oil Boom contract awarded to Pittman Tractor in Fairhope in 2010.
      *   County commission members (Bob James, Frank Burt, Tucker Dorsey) fired emergency management director Leigh Ann Ryals, county administrator Michael Thompson, and head legal representative Scott Barnett for pointing out the unethical contract award.

      THE DISCOVERY:
      *   The Widget Article (older) detailed Pittman's involvement in the BP Boom Scandal with Mayor Kant in Fairhope.
      *   It also revealed legislative attempts to double commissioner pay benefiting Bob James.
      *   It documented legislative moves to limit Sheriff opposition qualifications for Boss Hoss Mack.

      THE PIVOT:
      *   Article 2 provides specific historical evidence (BP Boom, pay doubling, limiting Sheriff opposition) confirming the systemic corruption and machine control by Lee Pittman and Lynn Stacey that Article 1 warns voters about in the upcoming Sheriff and County Commission races (June 3rd).

