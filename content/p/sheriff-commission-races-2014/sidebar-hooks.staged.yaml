  two-independent-women:
    brief: |-
      THE CONFLICT:
      *   Kim McCuiston (Foley, State Senate District 32) challenged incumbent Senator Lee "Slippery Trip" Pittman who had no opposition.
      *   Ginger Poynter (Daphne) ran for Judge Place 1.
      *   Both needed approximately 2,000 voter signatures to qualify as independents.
      *   The petition deadline was before June 1, 2014.

      THE DISCOVERY:
      *   The widget article revealed that two independent women (Ginger Poynter and Kim McCuiston) were challenging entrenched political power, specifically Pittman.
      *   The media was ignoring this challenge.

      THE PIVOT:
      *   The initial struggle against Pittman's unchallenged power (Article 2) paved the way for the two women to qualify on June 3rd (Article 1).
      *   Article 1 shows this effort broadened to challenge the "corrupt, Baldwin County establishment" in the Sheriff and County Commission races, which is protected by Pittman and Lynn Stacey.

