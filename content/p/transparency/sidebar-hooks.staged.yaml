  fingerprint:
    brief: |-
      THE CONFLICT:
      Eastern Shore Metropolitan Planning Organization met to vote against Poison Ivy toll bridge proposal.
      33 people spoke, including former State Senator BP, Pittman.
      BP, Pittman had BP contracts of $750,000.
      BP did not mention state robbing Baldwin and Mobile counties of BP funds.
      The toll petition hit 50,000 signatures, causing elected officials to flip.

      THE DISCOVERY:
      2019: Mayor Karin Wilson reported the first self-sustaining 2020 City Budget proposal for Fairhope, requiring zero utility profits to balance.
      2019: Mayor Wilson stated City Council avoided open budget process for three budget cycles, violating State Statute.

      THE PIVOT:
      Article 2 establishes a history of Baldwin County politicians prioritizing self-preservation (avoiding votes due to BP contracts/scandal) over public interest (opposing the toll), providing context for the later claim in Article 1 that Fairhope City Council avoided open, accountable budgetary processes.

      KEY ENTITIES:
      Mayor Karin Wilson
      Fairhope City Council
      Poison Ivy
      Eastern Shore Metropolitan Planning Organization
      BP
      Pittman
      Baldwin County
      Mobile counties
    llm_text: Former Senator Pittman, linked to $750k BP contracts, opposed the Poison Ivy toll, showing Baldwin County priorities over public good. See how Mayor Karin Wilson fought budget secrecy in Fairhope, exposing similar local power plays.
