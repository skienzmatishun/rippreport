  rsa-⁠-no-gas-for-point-clear-or-tourism:
    brief: |-
      THE CONFLICT:
      - Fairhope City Council has not approved a single Fairhope City Budget, on time, in the last 3 years.
      - Mayor Karin Wilson, City of Fairhope, issued State of the City / Community message dated September 2, 2019.
      - 2020 City Budget proposal: first ever self-sustaining budget; requires zero dollars of utility profits to balance; City operates with tax dollars; Utility Department operates with rate fees; zero dollars of utility profits paying for government operating expenses.
      - Council avoided open budget process during last three budget cycles; contrary to State Statute; sat on budget for months beyond deadline without accountability; prevented Mayor and staff from doing job successfully.
      - Council urged to pass 2020 budget by 10/1 deadline; all amendments must take place in open meetings for benefit of citizens, employees, and Mayor.
      - Council comprised of representatives of the status quo, "good ole boy politicians"; not transparent, accountable or ethical (per Mayor Wilson).
      - Council's only accomplishment: passed ordinance for sleeping in cars (per main article).
      - Mayor Wilson called herself a public servant; Mayor and staff should be commended; "Clown Car Passengers need to go in 2020" (per main article).

      THE DISCOVERY:
      - Article 2: Dispute between Point Clear Properties Association and RSA, Retirement Systems of Alabama.
      - RSA owns the Grand Hotel; RSA makes the decisions; management of the hotel only follows orders; referenced "the toll bridge, Goat Hill telling us what to do."
      - Marina next to the Grand Hotel: 1.27 acres; homeowners association opposed the 12 unit condo project.
      - Petition of over 400 signatures; additional 100 letters submitted to the Baldwin County Planning Commission.
      - Homeowners Association, local residents, Baldwin County Planning Commission, and Fairhope planning Board all in opposition to the zoning change.
      - RSA intended on punishing Point Clear and the entire Eastern Shore.
      - If a condo is built on the site, the fuel station would not be allowed; however no condo project has been approved; RSA took out the fuel tanks anyway.
      - RSA decision to remove the gas tanks cost jobs; RSA forced the hotel to close the Marina; RSA took the gas tanks out and stopped pumping to the general public for the first time in 50 years.
      - General public needing fuel must go to Fly Creek Marina, Fairhope, 6 miles away.
      - Baldwin County Planning and Zoning meeting held Sept 5; Baldwin County Planning Commission should not hear the rezoning case until RSA puts the gas tanks back.
      - Area zoned TRD Tourism Resort District; RSA wanted to kill the tourist part and penalize the Eastern Shore for not bowing to RSA.

      THE PIVOT:
      - Article 2 is the "smoking gun" / key context for Article 1 because it documents RSA's unilateral, punitive decision-making and removal of public fuel access without local accountability, paralleling the Fairhope City Council's avoidance of open budget processes.
      - Article 2, being older, framed as background/historical context, shows a pattern of unaccountable authority overriding local opposition and public access.
      - RSA's actions (removing gas tanks, closing marina, costing jobs) mirror the City Council's pattern of sitting on budgets without accountability.

      KEY ENTITIES:
      - Mayor Karin Wilson; City of Fairhope; Fairhope City Council; Fairhope City Budget; 2020 City Budget; September 2, 2019; State Statute; 10/1 deadline; Utility Department; sleeping in cars ordinance; tax dollars; rate fees; utility profits.
      - Point Clear Properties Association; RSA (Retirement Systems of Alabama); Grand Hotel; marina; 1.27 acres; 12 unit condo project; Goat Hill; Lagniappe; Baldwin County Planning Commission; Fairhope planning Board; Point Clear; Eastern Shore; Fly Creek Marina; Fairhope; TRD Tourism Resort District; tourism; gas tanks; gas pump; fuel; watercraft; pontoon boat; jet ski; fisherman; tourist; Baldwin County Planning and Zoning; Sept 5 meeting.
    llm_text: Fairhope Mayor Karin Wilson begged the City Council to pass a transparent 2020 budget by October 1, but the 'good ole boy politicians' sat on it for months. Now the same kind of unaccountable power is hitting the Eastern Shore, where RSA yanked the Grand Hotel gas tanks and shut the marina.
