  dog-and-pony-show:
    brief: "THE CONFLICT: \n- The Fairhope City Council failed to approve a single city budget on time for three consecutive years leading up to 2019, violating State Statute and avoiding the open budget process.\n- On May 10, the Fairhope City Council (\"Catalyst Council\") called a sudden, inconveniently timed special meeting at 3:30 PM to block Mayor Karin Wilson's proposed structural changes for the open Treasurer position and Finance Department.\n- The Council pushed for a self-imposed 3-mil tax for education instead of the Mayor's immediate, no-tax education plan, and supported the Apartments at Fly Creek project against the Mayor's opposition.\n\nTHE DISCOVERY: \n- Article 2 (older background context) documented the operational hostility of the City Council against Mayor Karin Wilson's administration, including their history of calling surprise emergency/special meetings to torpedo her proposals and implement their own agenda for 2020.\n- It highlighted the financial turnaround achieved by the Mayor and her staff: moving Fairhope from a ~$6 million deficit requiring over half of utility profits to balance the budget, down to an almost self-sufficient state without borrowing a dime, with the city becoming debt-free in June 2019.\n- It exposed how the Council resisted combining the Treasurer and Finance Director roles (a standard municipal practice), preferring to maintain bureaucratic red tape and siloed operations.\n\nTHE PIVOT: \n- Article 2 serves as the smoking gun because it proves that the City Council’s chronic inability to pass a budget on time (highlighted in Article 1) is part of a longer, deliberate pattern of obstruction and bad-faith governance by the \"status quo, good ole boy\" faction against Mayor Karin Wilson's transparent, self-sustaining financial reforms.\n\nKEY ENTITIES: \n- Mayor Karin Wilson\n- Fairhope City Council (Catalyst Council)\n- City of Fairhope Finance Department\n- Apartments at Fly Creek"
    llm_text: Mayor Karin Wilson dragged Fairhope out of a $6 million deficit, yet the City Council still ambushed her with surprise 3:30 PM meetings to block financial reforms. Discover how this status-quo faction weaponized delayed budgets and obstruction tactics to sabotage her transparent administration.
