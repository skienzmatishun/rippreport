  backseat-quarterbacks:
    brief: |-
      THE CONFLICT: Elected City Council in Fairhope entered "obstruction mode" against Mayor Wilson after she took office without transition from the last administration; three councilmen were accused of using elected office for financial or personal gain.

      THE DISCOVERY: Mayor Karin Wilson secured $17.8 million in Restore Act funds for four Fairhope projects; Councilmen Boone and Burrell ignored sewer infrastructure issues for four years, causing a $10 million upgrade cost to grow to over $13 million upon completion.

      THE PIVOT: Article 2 establishes a history of systemic council obstruction, financial mismanagement (sewer delays), and opposition to the Mayor's initiatives prior to the 2019 budget crisis, proving the Council's lack of transparency and accountability cited in Article 1 is historical, not isolated to the 2020 budget deadline.

      KEY ENTITIES: Karin Wilson, City of Fairhope, Boone, Burrell, Restore Act ($17.8 million), 2020 City Budget (September 2, 2019)
    llm_text: Mayor Karin Wilson secured $17.8 million in Restore Act funds for Fairhope projects. Yet, Councilmen Boone and Burrell ignored sewer needs for four years, escalating a $10 million upgrade past $13 million.
