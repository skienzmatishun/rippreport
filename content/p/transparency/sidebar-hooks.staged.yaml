  in-the-same-boat:
    brief: |-
      THE CONFLICT: Infrastructure and sewer problems in Fairhope predated Mayor Wilson's run; private citizens sued the City over issues like Publix project and Fly Creek flooding.
      THE DISCOVERY: Baykeeper failed to act on environmental issues, and Council President Jack Burrell used agenda procedures for political gain, notably allowing Casi Callaway to speak over time and in a manipulated session.
      THE PIVOT: Article 2 establishes a history of council obstruction and political maneuvering (Burrell/Callaway) concerning city oversight and public participation, providing context for Article 1's claim that the Fairhope City Council has avoided open processes and failed to approve budgets for 3 years.
      KEY ENTITIES: Fairhope City Council, Mayor Karin Wilson, Baykeeper, Casi Callaway, Jack Burrell, Debbie Quinn, Sherry Sullivan, 2016, 2019, 2020
    llm_text: Fairhope's infrastructure issues predate Mayor Wilson, but Council President Jack Burrell manipulated sessions for political gain. See how Burrell and Casi Callaway obstructed oversight, revealing years of closed-door council maneuvering.
