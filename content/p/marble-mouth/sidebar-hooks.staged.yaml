hooks:
  off-the-rails:
    brief: |-
      THE CONFLICT:
      - Fairhope City Council started out day one as obstructionist; stayed course over 3 years; taxpayers paid dearly.
      - Three new councilmen aligned with Council President Burrell, aka negotiator, from day one.
      - Council votes as block vote, 95% of the time.
      - Council President Burrell has been Council President for over 7 years; council voted in opposition of Mayor and staff regardless the issue.
      - Council represents a unit, CATALYST, and vote as a unit.
      - Burrell has been a horrible negotiator for the city, often causing problems that end up costing the city tax dollars or lawsuits.
      - Part-time council approved themselves a raise, along with a FULL-FAMILY insurance package, valued at $17,000 a year; full-time employees are not offered the same insurance; citizens pay the tab.
      - Council screwed up the Boutique Hotel so bad they are paying $525,000 for less than 1,000 sq ft of property, $5,250/sq ft; single tax will pay half; like $15 million for an acre; owner accused them of blackmail.
      - Owner Mr. Bowers is fed up with the Council and their lies.
      - Quote: “I”, MARBLE MOUTH, “was told today from Mr. Bowers that he didn’t feel it was appropriate to hold up this purchase while he was forced to listen to the city discuss what was the best use of his property. And I don’t know any other way to say it than that.”
      - Jay Robinson / Marble Mouth talks with his mouth full of marbles, teetering between truth and fiction; quotes sound like a lawyer with his mouth full of marbles.
      - Council is spinning mistakes into fairy tales.
      - Mayor Wilson tried to get attention of citizens and explained: “What the city has been doing, we buy property and we do nothing with it,” she said.
      - Other recent purchases: 114 acres on corner of County Roads 32 and 13 for future park facilities for $2.65 million; Fairhope K-1 Center, adjacent park and Nix Center on Bayou Drive for $2.5 million; and the “Dyas Triangle” at north entrance to city as part of an $8.75 million legal settlement.
      - $2.65 million spent TWO weeks ago for property; Burrell declared property “surplus and not needed for public or municipal use.”
      - $2.65 million for land now going to be leased for farmland at $9,000 thousand dollars a year.
      - Ordinance – An Ordinance to declare that certain real property (105 Farmable Acres) of the City of Fairhope is temporarily designated surplus and not needed for public or municipal purposes in response to an offer to lease property yearly from January 1 through December 31 for one year with four one-year options.
      - New Year Prediction: The City Council, Catalyst, and the status quo are now going to obstruct the use of the Triangle.
      - They want to take municipal property, that taxpayers paid $8.75 million for, plus $3 million in attorney fees, and give control of the land to a third party.

      THE DISCOVERY:
      - Article 2 showed/revealed at the time: Fairhope’s City Council has no priorities, or if they do it is off the rails.
      - Fairhope just had another sewer spill.
      - This council has slowed down infrastructure projects and misused city funds.
      - They are rogue and conduct themselves as a criminal enterprise.
      - Think about this: three councilmen Boone Brown and Burrell, without any community involvement or public participation, paid $2.75 million for land for recreation.
      - They have no money for development so their solution is to lease the $2.75 million in land for farming.
      - This is the same three councilmen who have ignored the sewer infrastructure for years.
      - If it were not for city staff and the mayor, who obtained BP funds, nothing would have been done.
      - This is the first time in 20+ years where sewer infrastructure is being seriously addressed, WITHOUT THE HELP OF THE COUNCIL.
      - Recreation land for farming or repair the sewer infrastructure.

      THE PIVOT:
      - Article 2 is the smoking gun / key context for Article 1 because it frames earlier/backstory pattern: council no priorities, sewer spill, slowed infrastructure, misused funds, rogue/criminal enterprise, $2.75 million land deal, farming lease, sewer neglect, BP funds, city staff/mayor action.
      - Connects to Main Article 1 claims: council obstruction, block voting, spending, Boutique Hotel, sewer infrastructure, land purchases, no plan.
      - Article 2 is older/background context for Article 1, making Article 1’s later conflict part of a recurring cycle.

      KEY ENTITIES:
      - Names: Jay Robinson / “Marble Mouth”; Council President Burrell; Councilmen Brown / Boone Brown; Councilman Conyers; Mayor Wilson; Mr. Bowers; Lowery; Wilters; etc.
      - Organizations: Fairhope City Council; CATALYST; City of Fairhope; Fairhope City staff; Mayor and staff; Alabama Attorney General; BP Funds.
      - Locations: Fairhope, Alabama; Boutique Hotel; County Roads 32 and 13; Fairhope K-1 Center; Nix Center on Bayou Drive; Dyas Triangle; north entrance to Fairhope; Bayou Drive.
      - Dates: Main article printed 11/11/16; Burrell Council President over 7 years; council over 3 years; $2.65 million spent two weeks ago; $8.75 million legal settlement; $2.5 million; $525,000; $17,000; $2.65 million; $9,000 thousand; $3 million attorney fees; $15 million acre; Widget January 10, 2020 Backstory Podcast Today; sewer spill.
    llm_text: Fairhope’s Council President Burrell and his bloc voted as one, gave themselves a $17,000 insurance package, and spent $525,000 on a boutique hotel. Now they want to lease $2.65 million in park land for farming while sewer failures pile up and hurt taxpayers.
    text: Fairhope’s Council President Burrell and his bloc voted as one, gave themselves a $17,000 insurance package, and spent $525,000 on a boutique hotel. Now they want to lease $2.65 million in park land for farming while sewer failures pile up and hurt taxpayers.
