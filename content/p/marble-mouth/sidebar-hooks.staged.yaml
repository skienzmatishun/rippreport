  malfunction-junction:
    refined_source: d8a04573be92d495b588d500eda9b4e589eccc53c72c8491f2b0b59e4500aa03
    brief: |-
      THE CONFLICT:
      Fairhope City Council has operated as an obstructionist block, voting as a unit (CATALYST) for over 3 years (as of 11/11/16).
      Council President Burrell has been in office for over 7 years, frequently voting against the Mayor and staff, causing city tax costs and lawsuits.
      Councilman Brown has a pending complaint with the Alabama Attorney General regarding personal gain.
      The Council approved a raise and $17,000/year FULL-FAMILY insurance package for part-time council members.
      The Council mishandled the Boutique Hotel purchase, paying $5,250 per square foot for under 1000 sq feet, and the owner, Mr. Bowers, accused the Council of blackmail.
      The Council spent $8.75 million (plus $3 million in attorney fees) on the "Dyas Triangle" property.
      The Council declared 105 Farmable Acres (part of the Dyas Triangle) surplus to lease for $9,000 thousand annually.
      In 2020, the City Council supported a developer regarding the Highway 98 and Parker Road intersection, leading to dangerous traffic conditions.

      THE DISCOVERY:
      The Widget Article revealed that approved apartment units on Parker Road would increase the local population from ~50 to 500-700 people, resulting in an impact equivalent to over 1000 cars daily at the Malfunction Junction.
      The Widget Article specifically called for voters to replace the 5 Catalyst Council members in the 2020 Fairhope Municipal Elections on Aug 25th.

      THE PIVOT:
      The Widget Article establishes the Council's pattern of prioritizing developer support and poor infrastructure planning (Malfunction Junction) prior to the 2020 election, demonstrating a history of self-serving "good ole boy deals" and ignoring citizen safety and capital projects, which provides context to the corruption and mismanagement detailed in the later Marble Mouth article.

      KEY ENTITIES:
      Fairhope City Council
      Council President Burrell
      Councilmen Jay Robinson, Brown, Conyers
      Mayor Wilson
      Mr. Bowers
      Alabama Attorney General
      Highway 98 and Parker Road (Malfunction Junction)
      Boutique Hotel
      Dyas Triangle
      CATALYST
      2020 Fairhope Municipal Elections (Aug 25th)
      11/11/16
    llm_text: Fairhope City Council, led by President Burrell, has a history of self-serving deals—from the Boutique Hotel purchase to the $8.75M Dyas Triangle spending. New Parker Road apartments will flood the Malfunction Junction, turning 50 residents into 500-700; vote to replace the Catalyst members in August.
    text: Fairhope City Council President Burrell has a long history of self-serving real estate deals. New Parker Road apartments will overwhelm local roads and crowd out current residents.
