      *   Key figures who built the case (Wilters, Lowery, Mack, Whetstone) have since risen to positions of power in Baldwin County.
      *   Robert Wilters served as the 2005 Presiding Circuit Court Judge; Anthony Lowery was Chief Investigator (2005) and is currently Baldwin County Sheriff.
      *   Huey 'Hoss' Mack was the 2005 Lead Investigator/Captain and coerced Jarius McNeil.
      *   David Whetstone (2005 DA) admitted to making a plea deal with the unreliable Jarius McNeil.

