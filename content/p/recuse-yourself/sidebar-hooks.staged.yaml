      THE DISCOVERY:
      Mr. Boone established multiple LLCs, including BA-101, LLC (formed 4-29-2004) and North Ridge, LLC (formed 6-2-2008).
      North Ridge, LLC lists John G. Avent, who is a Firm Partner at Preble-Rish, Inc., as a member, indicating a clear conflict of interest for Mr. Boone.
      Mr. Boone has a long history of business interests with Preble-Rish and Angelo Corte dating back prior to his election, which he failed to disclose.

      THE PIVOT:
