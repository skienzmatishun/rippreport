hooks:
  bp-restore-act-fraud:
    brief: |-
      THE CONFLICT:
      *   April 2013: Fairhope City Council authorized settlement for a long-standing lawsuit against the city, leading to $3 million in attorney fees, $3 million down payment, and a $5.75 million debt, without public notice or participation (Open Meeting Rule violation).
      *   October 2013: City Council went into executive session, announced the settlement, and then held public participation afterward.
      *   July 2010: Thompson Engineering completed a $4.6 million (ballooned to $5.2 million) steel boom crossing Perdido Pass that failed and stopped no oil.
      *   Past: Tim Kant and Trip Pittman were subjects of multiple BP fraud investigations.

      THE DISCOVERY:
      *   Fairhope was applying for BP Restore Act funds for the Fly Creek Watershed Restoration Project, based on a flawed "Study" developed by Thompson Engineering.
      *   The study omitted that the majority of the watershed is privately owned by the Corte family and that Arthur Corte caused creek damage via his Publix supermarket development.
      *   Tim Kant and Trip Pittman were involved in the scheme to acquire millions from Restore Act Funds.

      THE PIVOT:
      *   The 2013 actions (Widget Article) established the fraudulent basis (flawed study, omission of damage, lack of public input) for the BP Restore Act application.
      *   The 2014 event (Main Article) reveals that Tim Kant and Trip Pittman actively conspired to cover up their involvement in the Boom Grant Fraud Case by manufacturing and signing documents (using Kant's signature on a letter written by Leigh Anne Ryals) to eliminate incriminating evidence.

      KEY ENTITIES:
      *   Tim Kant (Mayor of Fairhope)
      *   Trip Pittman (Senator)
      *   Leigh Anne Ryals (Baldwin County Emergency Management Director)
      *   Arthur Corte (Corte family/Publix supermarket owner)
      *   Thompson Engineering
      *   Fairhope City Council
      *   BP Restore Act
      *   Fly Creek Watershed Restoration Project
      *   April 2013, October 2013, February 10, 2014, February 12, 2014
    llm_text: Fairhope City Council approved a $5.75 million debt in April 2013 without public notice. Mayor Tim Kant and Senator Trip Pittman conspired using a flawed Thompson Engineering study to steal BP Restore Act funds from the Corte family.
