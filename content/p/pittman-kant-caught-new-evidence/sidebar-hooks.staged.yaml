  triangle-lawsuit-settlement-2013:
    brief: |-
      THE CONFLICT:
      Mayor Timothy Kant was involved in the BP boom scandal and grant fraud, leading to his subpoena by a federal grand jury in Mobile. This was tied to the Triangle Lawsuit, where the City of Fairhope purchased Triangle property for $8.7 million (cumulative effective cost at least $11 million).

      THE DISCOVERY:
      Article 2 detailed the City of Fairhope's application for $500 million from BP through projects including the Fly Creek Restoration Project Number Three and the TTI Swamp project, alleging corruption and misleading statements in the Restore Act application related to developer Arthur Corte.

      THE PIVOT:
      Article 2 establishes Mayor Kant's documented prior involvement in BP grant fraud and the Triangle Lawsuit, providing the foundational context for Article 1, where Mayor Kant and Senator Trip Pittman are accused of conspiring to cover up this pre-existing boom grant fraud case through document manufacturing and misrepresentation.

      KEY ENTITIES:
      Tim Kant (Mayor of Fairhope)
      Trip Pittman (Senator Lee)
      Leigh Anne Ryals (Baldwin County Emergency Management Director)
      F. Paul Ripp (Fairhope resident/author)
      Arthur Corte (Publix developer)
      BP (Corporation)
      Fairhope
      Baldwin County
      Triangle Lawsuit
      Mobile FBI (investigating body)
    llm_text: Mayor Timothy Kant faced a federal subpoena over BP grant fraud and the $500 million Fairhope application tied to the Triangle Lawsuit. Now, Kant and Senator Trip Pittman allegedly conspired to cover up this pre-existing corruption through document manufacturing.
