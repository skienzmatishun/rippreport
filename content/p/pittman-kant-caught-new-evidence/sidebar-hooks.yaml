      THE PIVOT:

      *   Article 1 alleges a conspiracy between Kant and Pittman regarding forged
      signatures/manufactured documents concerning the BP funds cover-up.

      *   Article 2 establishes a pattern of proven, decade-long fraud involving Kant''s
      administration (the Dyas/Triangle lawsuit) which parallels the allegations of
