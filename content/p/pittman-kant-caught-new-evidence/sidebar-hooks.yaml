      *   Leigh Anne Ryals initially claimed she wrote letters concerning the case,
      while Kant allegedly signed them.

      *   Ryals later denied involvement with Kant, stating she only dealt with Pittman
      while acting as Mayor.

      *   Kant insisted he signed the documents, leading to accusations that Pittman
      manufactured incriminating documents and used Kant''s signature to cover it
      up.


      THE DISCOVERY:

      *   The Widget article frames the actions of Mayor Tim F. Kant as fitting the
      legal definition of fraud ("Deceit; trickery... intentional deception").

      *   It specifically references the "Triangle lawsuit" (Dyas matter) as a case
      of sustained fraud orchestrated by the Mayor''s administration, wherein Fairhope
      paid $3 million in legal fees to settle a lawsuit.

      *   It reveals Kant''s deposition on October 30, 2015, where he denied written
      communication regarding a loan from Bobby Faust but acknowledged a promissory
