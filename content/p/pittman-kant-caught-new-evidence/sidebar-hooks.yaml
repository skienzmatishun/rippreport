  new-sweep-the-ripp-report-27-political-corruption-and-deceit-in-fairhope:
    brief: 'THE CONFLICT:

      *   Boom Grant Fraud Case involved questionable activities in Fairhope involving
      Mayor Tim Kant and Senator Lee "Trip" Pittman.

      *   On Feb 10, 2014, Ripp presented a document to the City Council regarding
      Kant''s alleged involvement.

      *   Leigh Anne Ryals (Emergency Management Director for Baldwin County) initially
      implied Kant signed a document she wrote, but denied involvement with Kant,
      stating Senator Pittman was the primary actor.

      *   Kant insisted he signed the letter; Pittman manufactured documents
      using Kant''s signature to cover up incriminating evidence.


      THE DISCOVERY:

      *   The second article frames the conspiracy around Mayor Tim Kant as the "architect
      of the fraud."

      *   It details current undisclosed development plans (275 apartments, 18 townhouses)
      requiring infrastructure changes without public notification.

      *   It cites environmental damage to Fly Creek caused by Publix shopping center
      construction, which is allegedly linked to the wider context of the corruption.


      THE PIVOT:

      *   Article 1 provides direct evidence (Feb 2014 meeting, Ryals denial) of the
      documented attempt to falsify records implicating Kant and Pittman in a cover-up.

      *   Article 2 reveals the ongoing, large-scale development issues (PUD hearing
      Jan. 5) and environmental damage that are allegedly sustained by the same corrupt
      structure established in Article 1.


      KEY ENTITIES:

      *   Tim Kant (Mayor)

      *   Lee "Trip" Pittman (Senator)

      *   Leigh Anne Ryals (Baldwin County Emergency Management Director)

      *   F. Paul Ripp (Citizen/Reporter)

