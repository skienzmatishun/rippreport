  whos-telling-truth-bp-boom:
    brief: |-
      THE CONFLICT:
      2010 BP Oil Spill led to a contract conspiracy in Fairhope.
      May 11, 2010: Senator Lee "Trip" Pittman demanded paperwork regarding the boom contract; Pittman Tractor lacked a required general contractor's license.
      Official contractor of record was listed as Oil Recovery of Mobile, Alabama, with approval from Leigh Ann Ryals (Baldwin County Emergency Management Director).
      June 17, 2010: Boom contract was signed to the low bidder, Pittman Tractor, for $625,575.00.
      June 12, 2010: Pittman Tractor received over $300,000 toward the unsigned contract.
      July 2014: Pittman Tractor retained the debris removal contract; City Council renewed the option at approximately $1 million, despite Pittman's highest bid being $1,999,537.50.

      THE DISCOVERY:
      Connie Baggett's article, November 20, 2010, exposed that Pittman's company was awarded $639,000 while Pittman supervised grants for boom work.
      The official contractor of record in Clanton, Alabama, was Oil Recovery of Mobile.

      THE PIVOT:
      The Widget Article (Nov 20, 2010) provided the first public proof that Oil Recovery of Mobile was the official contractor of record for the Fairhope Boom Grant, confirming the deceptive setup described in the Main Article where Pittman Tractor was bypassed initially but later secured the contract despite lack of qualifications.

      KEY ENTITIES:
      Trip Pittman (Senator)
      Tim Kant (Mayor of Fairhope)
      Oil Recovery of Mobile, Alabama
      Leigh Ann Ryals (Baldwin County Emergency Management Director)
      Fairhope City Council (Jack Burrel, Diana Brewer, Mike Ford, Kevin Boone, Rich Mueller)
      Baldwin County
      Alabama Ethics Commission
      $625,575.00 (2010 boom contract price)
      $1,999,537.50 (2014 high bid)
      $1,000,000.00 (2014 renewed debris contract price)
      $639,000 (Awarded to Pittman's company, Nov 2010)
    llm_text: Senator Trip Pittman pushed the $625,575 Fairhope boom contract despite lacking a license. Connie Baggett proved Oil Recovery of Mobile was the official contractor, not Pittman Tractor, exposing a deceptive setup.
