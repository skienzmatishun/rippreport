      June 17, 2010: Pittman Tractor was awarded the boom contract for $625,575.00.
      July 2014: Fairhope City Council renewed Pittman Tractor's debris removal contract for approximately $1 million, despite Senator Pittman being the highest bidder ($1,999,537.50).

