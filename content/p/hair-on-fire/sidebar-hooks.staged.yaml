  fauxhope-tunnel:
    brief: |-
      THE CONFLICT:
      - Baldwin County, Alabama: Sen. Chris Elliott, R-Josephine, lost more than hair; again carrying water for Sheriff Hoss Mack.
      - Elliott’s wife worked for Sheriff Hoss Mack since Chris Elliott was elected to office in Baldwin County.
      - Sheriff Hoss Mack is political director behind anything happening in Baldwin County.
      - Elliott spearheaded attempt; fifth commissioner may be a good idea but allowing Elliott to spearhead should set fire to your hair; Elliott did not have that problem.
      - Local opposition to Elliott’s legislation was overwhelming; voters should decide not Chris Elliott.
      - Baldwin County delegation remained silent; delegates voiced concerns about Elliott running rouge and not consulting delegation prior to legislation.
      - Baldwin County voters should pay attention to Elliott’s actions and beware of Sheriff’s political interference.

      - Sen. Greg Albritton, R-Range, spoke out against and voted against Chairman Chris Elliott’s, R-Josephine, Senate Bill 306.
      - Albritton said the committee should not advance the legislation because it did not have the support of the people it would affect.
      - Albritton pointed to letters from the Baldwin County Commission and the Association of County Commissioners of Alabama (ACCA) in opposition of the bill.
      - Albritton quote: “A government cannot operate without the support of its populace,” and “we don’t have this.”
      - If passed, Elliott’s bill would create a full-time, non-rotating commissioner to act as chairman of the Baldwin County Commission.
      - Elliott needs to be replaced in the next election, as well as the Sheriff.

      THE DISCOVERY:
      - Article 2 is older than Article 1; frame it as background/historical context.
      - FAUXHOPE TUNNEL article revealed Fairhope, Alabama local government context.
      - Fauxhope elected a council and mayor that represent the Fairhope good ole boys.
      - Council and mayor are back to Mayor Can’t days.
      - City attorney is put in place to protect “THEIR” agenda.
      - Municipal judge is a major developer in Fauxhope; his developments must meet approval of the council that “APPOINTED” him as municipal judge.
      - Less than 10 people in Fauxhope really know what their city government is doing.
      - Fauxhope is good at vanity awards and public relations but track record is costing Fauxhope taxpayers millions.

      - Infamous triangle: City lost two decade lawsuit and had to fork out 8.25 million.
      - City spent 3 million on legal fees; attorneys for city pledged to pay the money if they lost; they did not pay but got brand new offices.
      - City drained 3 million from utilities to pay off the lawsuit.
      - City rejected many proposals for the triangle.
      - Proposals included a performing arts center, a good ole boy deal got Publix to go across the street with their select developer, a conservation easement, an archery range, all without success.
      - At one time proposed to locate city hall and all departments, including a fire station, on the triangle piece; described as the best idea so far.

      - Why not develop the property across the street eliminate the tunnel and hold on to the triangle land.
      - Spending a million dollars on land exceeds 20 million in value; does not seem prudent.
      - No long range plan or financing.

      - This week City of Fairhope officials unveiled a new masterplan for the site, including an underground tunnel that will connect two properties and a new purpose for a home donated to the city late last year.

      - Scott Hutchinson of Goodwyn, Mills and Cawood told city council members on Monday, March 14 that plans are ready, but the council will need to make final decisions on some details.

      - Beach left out of plans; beach was number one thing citizens wanted. Project almost 3 years behind? How much have plans and alterations to the plans cost.

      - Pay attention Fairhope, Jack has plans for the Airport and the citizens are not part of the plan.

      - On May 29th council meeting the Mayor of Fairhope begged the council to reconsider two issues on the agenda.
      - One: conservation easement involving the triangle property, 102 acres worth 20 million, that the council was willing to give away while at the same time proposing to buy 2.6 million of property on Hwy. 13.
      - Fairhope paid 8.25 million in a lawsuit plus 3 million in attorney fees as a SETTLEMENT for the property.
      - Burrell and Boone supported the lawsuit that they LOST.

      - Pied Piper spent 2.65 million on recreation land that Fairhope now leases for 9,000 dollars a year.
      - Guess where the property is located? By the Airport. Who puts recreational facilities, with elevated lights, next to an Airport?

      - K-1 purchase for 4 million.
      - Just like any of the purchases the city has made lately, they bought it without a plan. Because they had no plan.
      - Council then had to do about 100,000 worth of “temporary” roof repairs to prevent further damage.
      - Since the purchase, the building has deteriorated to a point that only the front facade may be saved.

      - K-1: Robinson said: “You have to house Mardi Gras here. It's going to take some strategic thinking to do that, if, and when, that decision is made to do something like that, but it's a conversation at this point that's got to be had at some point.”

      - Building is over 50 years old and the council keeps putting one million dollar band aids on it.

      - He says with this project the utilities are already being worked on before the build even starts.
      - “We actually have a water line that is coming for the ALDI store and all of the infrastructure that is coming to the east side, so people have to know that we’re also prepared with the infrastructure. We’re not just developing. The infrastructure is there to develop,” said Martin.

      - Listen to Mr Martin carefully: You are paying for the infrastructure, the taxpayers. This project is being developed by Fauxhope’s municipal judge and partners.

      - No conflict of interest ????

      - Ask the city council where the land use plan is or the comprehensive plan?

      - It’s called FAUXHOPE for a reason.

      THE PIVOT:
      - Article 2 is older than Article 1; frame it as background/historical context.
      - Article 2 is the key context/smoking gun for Article 1 because it documents local government opacity, conflict of interest, legal/settlement spending, failed development plans, lack of long-range plan/financing, and oversight issues.
      - Article 2’s Fairhope tunnel/triangle/K-1/municipal judge details can serve as prior context for Article 1’s Baldwin County ethics/political interference concerns involving Elliott, Mack, Albritton, delegation, commission.
      - Article 2 connects to Article 1 through local government spending, legal settlements, developer conflicts, public process failures, and lack of transparency.
      - Article 2’s disclosures/allegations are background for Article 1’s criticism of Elliott running rouge and not consulting the delegation prior to legislation.

      THE KEY ENTITIES:
      - Chris Elliott, R-Josephine, state senator, Chairman, fifth commissioner? carrying water for Sheriff Hoss Mack.
      - Hoss Mack, sheriff, political director behind anything happening in Baldwin County; Elliott’s wife worked for him.
      - Greg Albritton, R-Range, senator, opposed/voted against Elliott’s Senate Bill 306.
      - Baldwin County Commission; Baldwin County delegation; Baldwin County voters; ACCA.
      - Senate Bill 306; full-time non-rotating commissioner to act as chairman of Baldwin County Commission.
      - Fairhope city council; Mayor of Fairhope; city attorney; municipal judge; Scott Hutchinson; Goodwyn, Mills and Cawood; Martin; Robinson; Burrell and Boone; Publix; ALDI; Mardi Gras.
      - Triangle; K-1; Highway 13; Airport; Fairhope; Baldwin County; Alabama.
      - Ethics Commission? (from metadata)
      - Albritton? Elliott? (from metadata)
      - Lowery, Wilters, etc.
