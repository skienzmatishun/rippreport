  preemptive-notice-fire-station:
    brief: |-
      THE CONFLICT:
      Arthur Corte used planning and zoning approval to sell the corner lot on Parker Road to Iberia Bank for $1 million after originally pledging it for a fire station.
      In July/August 2009, the fire station proposal failed due to public complaints.
      On May 8, 2013, the city council settled the triangle lawsuit for $12 million.

      THE DISCOVERY:
      Article 2 revealed that Arthur Corte leveraged planning and zoning processes for private development gain and political influence (Mayor Kant).

      THE PIVOT:
      Article 2 provides historical evidence of systemic conflicts of interest and corruption within Fairhope's Planning and Zoning structure, establishing the context for the 2015 ethics complaint (Article 1) regarding Lee Turner's dual roles (Planning & Zoning Chairman / Single Tax Corporation President) and the related contract conflicts involving George Robards.

