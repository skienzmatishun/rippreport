  ethic-less-in-alabama:
    brief: |-
      THE CONFLICT: State Senator Lee "Trip" Pittman conducted business with the City of Fairhope as a contractor since 2004, winning contracts (e.g., $625,575.00 for "Oil Spill 2010") despite lacking a required General Contractor's License until May 7, 2012. The Alabama Ethics Commission (AEC), under Hugh Evans, aided in contract extensions (e.g., July 2014) despite alleged conflicts of interest.

      THE DISCOVERY: Article 2 revealed a pattern of political corruption where the AEC was used to justify and facilitate lucrative, unethical contracts for elected officials (Pittman) in Fairhope.

      THE PIVOT: Article 2 establishes the AEC's institutional history of being a "corrupt political vehicle" used to cover up conflicts of interest in Fairhope, providing historical context for the 2015 ethics complaint against Lee Turner, demonstrating that the current conflict is part of a long-standing pattern, not an isolated incident.

