  stinking-ticking-time-bomb:
    brief: |-
      THE CONFLICT:
      1. Baldwin County Sewer Service (BCSS) is a privately operated, unregulated sewer service in Alabama.
      2. Mr. Clarence Burke, principle of BCSS, was involved in the "Straw-man case" with Delaney, a South Alabama lender, alleged to be a Ponzi scheme/defrauding Bass.
      3. The civil trial involving Burke and Corte showed obligations were "hidden" by secret documents.
      4. DR Horton assumed management of Bellaton Property Owners Association (BPOA) in 2012.
      5. Fairhope has been a major contributor to Bay pollution for over 20 years.

      THE DISCOVERY:
      1. BCSS operates without regard for permits or penalties because it uses county right-of-ways free.
      2. BCSS converts farmland into subdivisions, driving uncontrolled development sprawl.
      3. Mr. Clarence Burke, head of BCSS, resides in Costa Rica, funded by Baldwin County residents.
      4. BCSS is not a Baldwin County entity, despite misleading public perception.

      THE PIVOT:
      1. Article 2 establishes a long-term pattern of unregulated, private, profit-driven utility management (BCSS) and political connections among developers (Burke).
      2. This context explains the recent council decisions (Article 1) that prioritize development (e.g., out-of-control development, 2.65 million land purchase south of the airport) over necessary infrastructure repairs (failing sewer plant, 2013/2015 upgrades).
      3. Article 2 demonstrates that the underlying system (BCSS) is inherently designed to bypass regulation and prioritize profit, informing the current perceived failures in Fairhope's utility oversight (e.g., Mayor Sullivan's appointment).

      KEY ENTITIES:
      1. Clarence Burke (BCSS principal/developer)
      2. Baldwin County Sewer Service (BCSS)
      3. Fairhope
      4. Mayor Sullivan
      5. Councilman Jack Burrell
      6. Delaney (South Alabama lender)
      7. Bass
      8. DR Horton
      9. Bellaton Property Owners Association (BPOA)
      10. Judge Jody Bishop
      11. Little Lagoon Preservation Society (LLPS)
