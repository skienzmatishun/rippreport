hooks:
  i-see-you:
    brief: "THE CONFLICT: \n- In 2013, instead of building a new sewer plant for approximately $20 million, Councilman Jack Burrell led the charge to upgrade the failing wastewater treatment plant. \n- The council initially approved $10 million for upgrades, which ballooned to $13 million by completion, and a comprehensive upgrade was completed in 2015 for $12 million.\n- On Wednesday, September 21, 2022, a public comment noted that Mayor Sullivan was appointed as Utilities Superintendent to boost her salary to over $100K, resulting in a \"double-dipping\" mayor with access to the utility fund despite having no utility management experience.\n- The city council subsequently voted themselves a full family insurance package valued at $17,000 a year, alongside a non-budgeted $2.65 million land purchase near the airport, leading to delayed city budgets, potential police and employee cuts, and stalled infrastructure/sewer repairs.\n\nTHE DISCOVERY: \n- The historical context (Article 2) shows a pattern of the Fairhope City Council operating without public discussion or adequate transparency, rubber-stamping controversial agenda items (such as the May 22, 2023 City Council agenda).\n- It exposed questionable appointments, such as Haymes Snedeker—described as the largest developer in Fairhope—being appointed as Municipal Judge by the same City Council that must approve his development projects and infrastructure needs.\n- It revealed costly municipal spending projects, such as the Fairhope Clock Plaza project awarded to RH Deas Building Co., LLC for $282,211.00 (pushing past-failure costs over $600,000), and the unnotified procurement of Intelligence-Led Policing Sensor Kits (tag reader/video program) from ProTecVideo, LLC for $20,000.\n- It documented taxpayer-funded infrastructure being rushed to support commercial developments like ALDI and east-side projects managed by developers and city insiders.\n\nTHE PIVOT: \n- Article 2 serves as the \"smoking gun\" because it exposes the direct mechanics of the municipal corruption and developer favoritism that Article 1 critiques. \n- While Article 1 outlines Councilman Jack Burrell's current public posturing and shifting blame regarding the failing Fairhope sewer system, Article 2 provides the tangible evidence of the council's actual operations—such as insider appointments (developer-judge Haymes Snedeker), unvetted surveillance spending, and a developer-friendly agenda—proving that Burrell and the council are actively prioritizing unchecked, developer-driven growth while hiding behind misleading public statements and manufactured crises.\n\nKEY ENTITIES: \n- Jack Burrell (Councilman)\n- Mayor Sullivan (Mayor / Utilities Superintendent)\n- Mayor Wilson (Former Mayor)\n- Haymes Snedeker (Municipal Judge / Developer)\n- Jody W. Bishop (Circuit Judge, 28th Judicial Circuit)\n- RH Deas Building Co., LLC\n- ProTecVideo, LLC\n- ALDI\n- Fairhope City Council\n- Fairhope Police Department"
    llm_text: While Councilman Jack Burrell blames Fairhope’s failing sewers on everyone else, leaked records expose a shadow agenda of developer favoritism and insider cash grabs. Read the smoking-gun evidence proving how Burrell and the council prioritize private growth over public infrastructure.
    widget_date: "2023-05-23"
