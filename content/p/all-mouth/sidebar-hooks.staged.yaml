  trolls-for-tolls:
    brief: |-
      THE CONFLICT:
      * Bayway Bridge project financing and toll discussion occurred with politicians initially hesitant.
      * Jim Zigler's Facebook page gathered over 50,000 "no tolls" responses, leading to Mobile and Baldwin MPOs unifying behind tolls.
      * Jack Burrell stated a "toll-free route" was available due to lack of federal/state funds for the $2.2 billion bridge ($125M federal, $250M state commitment mentioned).
      * David Peterson (Baldwin County Citizens For Government Accountability) referenced Pennsylvania Act 44 and DOT rejection of I-80 toll authorization, questioning Alabama's authorization for the Bay Bridge.

      THE DISCOVERY:
      * Article 1 (2022/2023 context) shows Councilman Jack Burrell is associated with failing infrastructure (sewer) and budget issues (2.65 million land purchase at airport), while promoting development despite these failures.
      * Article 1 details the 2013 need for a $20 million sewer plant upgrade, approved at $10M, finishing at $13M.
      * Article 1 notes Mayor Sullivan's appointment to head utilities to increase salary/access funds, despite lack of experience.

      THE PIVOT:
      * Article 2 establishes Burrell's history of political maneuvering (toll stance changes) and financial promotion for large projects (Bay Bridge $2.2B) rooted in resource gaps.
      * This history of prioritizing large, complex, and possibly under-funded development/infrastructure (Bay Bridge tolls) provides context to Burrell's current actions in Article 1 (e.g., pushing sewer upgrades that ballooned costs, promoting development despite failing utilities/budget crises).

      KEY ENTITIES:
      * Jack Burrell
      * Fauxhope
      * Airport Authority
      * Mayor Sullivan
      * Mayor Wilson
      * Jim Zigler
      * Mobile and Baldwin MPO’s
      * Jon Gray
      * David Peterson
