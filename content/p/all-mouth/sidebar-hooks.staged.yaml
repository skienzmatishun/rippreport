  bad-faith:
    brief: |-
      THE CONFLICT:
      - Fauxhope/Fairhope sewer issue.
      - Councilman Jack Burrell, long-term Fauxhope council member and mouthpiece, expressed purported concern about Fauxhope sewer.
      - In 2013, instead of building new sewer plant for around $20 million, Burrell led charge to upgrade failing sewer plant.
      - Council approved $10 million for upgrades, ballooned to $13 million by completion.
      - Proposal to replace head works at city’s wastewater treatment plant at north end of Church Street met cool reception from some council members due to $5 million estimated price tag.
      - Councilman Burrell told Times cost seemed very high considering comprehensive upgrade to entire plant completed in 2015 cost only $12 million.
      - Sewer upgrade should meet needs of city for next 15 years; new sewer plant may need to be constructed on city-owned land south of airport.
      - Burrell at public B.S. podium again expressing “concocted” concern for citizens’ money.
      - Burrell responsible for problem; B.S. depends on ignorance of voters and lack of information council provides taxpayer.

      THE DISCOVERY:
      - Article 2, Backstory Podcast No. 156, “Bad Faith”: From The FBI to The Alabama Legislature and the United States Congress and even City of Dothan Alabama, this week detailed Bad Faith exhibited by governments at all levels.
      - Article 2 covered whistleblower harassments, Debt Ceiling debate, Space Command being stripped from Alabama, ALDOT Bridge onto Pleasure Island, “Hive of Scum and Villainy” Obi Wan warning, Hangout Fest kicked off at 3pm.
      - Article 2 is older than Article 1; frame as background/historical context.

      THE PIVOT:
      - Article 2 is the smoking gun or key context for Article 1.
      - Article 2’s bad faith coverage connects to Main Article’s local sewer, council, mayor, utilities, budget, and whistleblower issues.

