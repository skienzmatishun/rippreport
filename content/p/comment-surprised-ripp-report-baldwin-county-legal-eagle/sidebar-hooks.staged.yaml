  comment-are-you-surprised-at-all:
    brief: |-
      THE CONFLICT:
      *   Between 2014 and 2016, the Mobile Area Council Boy Scouts (Baldwin County) lost over $750,000.
      *   Council members Bradley Byrne, Tripp Pittman, and Tucker Dorsey were reportedly made aware of this mismanagement for over two years but failed to intervene.
      *   In October 2016, the Fairhope City Council, including the past council of Boone and Burrell, accepted a four-acre wetlands gift (next to Fly Creek) via Resolution 2606-16, shortly after the land deed was filed.

      THE DISCOVERY:
      *   Phil Webb of Fairhope, President of the Mobile Area Boy Scout Council, was responsible for the significant financial losses.
      *   Michael Hartigan, Executive Director (hired Jan 2009), received over $150,000 annually in salary/benefits, funded partly by the sale of one-third of the Maubila camp in early 2016 (netting $300,000).
      *   The auditing firm, Russell, Thompson, Butler and Houston, LLC, charged approximately $40,000 annually for audits, which was noted to be inflated compared to industry standards.

      THE PIVOT:
      *   Article 2 (older) establishes a historical pattern of political negligence and failure to address known financial and ethical misconduct within Baldwin County (Boy Scouts loss, 2014-2016).
      *   This context proves why the Fairhope City Council (Article 1) failed to address local conflicts of interest concerning Councilmen Boone (undisclosed LLC interests over five years) and Burrell (airport handling issues), indicating systemic institutional failure.

