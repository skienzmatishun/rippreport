  JUDGE-VS-SHERIFF:
    brief: 'THE CONFLICT:

      - Chris Elliott has served as a legislative puppet for Baldwin County Sheriffs
      since his election. He was initially backed by Sheriff Hoss Mack and now by
      Sheriff Anthony Lowery.

      - Elliott’s wife secures her job with the sheriff department through Chris Elliott;
      he denies this is a conflict of interest.

      - In 2016, then State Senator Trip Pittman sponsored Senate Bill 312 establishing
      qualifications for Baldwin County Sheriff that eliminated all competition to
      secure Hoss Mack into a two-term position (Baldwin County was the only county
      in the state with such qualifications).

      - Three years prior to SB 312 (approx. 2013), Pittman awarded himself $750,000
      of B/P money.

      - The 2021 Supreme Court of Alabama ruling in Lagniappe v. Mack (Sheriff Hoss
      Mack) shut down public access to law enforcement investigative materials/bodycam
      footage; Associate Justice Greg Shaw wrote the majority opinion while Chief
      Justice Tom Parker dissented.


      THE DISCOVERY:

      - Baldwin County District Attorney Robert Wilters and Sheriff Hoss Mack asked
      a judge to reverse a ruling compelling the Sheriff’s Office to return a car
      deputies seized earlier that month.

      - Wilters’ relationship with Sheriff Mack spans over 30 years; he will do whatever
      the "Boss" wants.

      - The BCSO operates its own Major Crimes Division, meaning internal investigations
      (e.g., killings of citizens) are handled by the sheriff''s office itself; transparency
      and accountability do not exist within the office.


      THE PIVOT:

      - Article 2 reveals the deep, decades-long alliance between Sheriff Hoss Mack
      and political figures in Baldwin County (Wilters, Pittman, Shaw), establishing
      the infrastructure of political corruption and "chicken shit intimidation tactics"
      described in Article 1.

      - The 2021 Lagniappe ruling authored by Judge Shaw, whose court is pressured
      to bend over for Sheriff Mack and DA Wilters, provides the legal mechanism that
      enabled the type of unaccountable power Elliott leveraged (his bill restricting
      municipal police/planning jurisdictions and passing "legislation while constitutions
