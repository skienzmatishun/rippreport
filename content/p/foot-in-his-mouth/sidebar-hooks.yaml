      unnoticed and lacked scrutiny.


      KEY ENTITIES:

      - Chris Elliott (Baldwin County Senator)

      - Hoss Mack (former Baldwin County Sheriff)

      - Anthony Lowery (current Baldwin County Sheriff)

      - Robert Wilters (Baldwin County District Attorney)

      - Trip "Boom Boom" Pittman (former State Senator)

      - Greg Shaw (Associate Justice, Alabama Supreme Court)

