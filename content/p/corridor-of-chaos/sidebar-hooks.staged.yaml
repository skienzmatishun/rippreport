      *   The Council was found guilty in Federal Court for violating the U.S. Constitution (right to free speech).

      THE DISCOVERY:
      *   The Fairhope Council (the three B's) consistently prioritizes private interests and self-gain over constitutional rights and public input when dealing with city property and land deals.

