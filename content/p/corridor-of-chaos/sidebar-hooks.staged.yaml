      THE DISCOVERY: Article 2 reveals RSA's history of using control over essential services (fuel access) to punish local opposition to development (12 unit condo) in the TRD Tourism Resort District.
      THE PIVOT: Article 2 establishes a pattern of powerful entities (RSA) using leverage to dictate zoning/development outcomes against local opposition, providing context for the powerful developer, Gayfer Village Partners/Tom Mitchell, pushing the large KLUMP PUD through the Fairhope City Council despite local concerns.
      KEY ENTITIES: RSA, Grand Hotel, Point Clear Properties Association, Baldwin County Planning Commission, Gayfer Village Partners, Tom Mitchell, Haymes Snedeker, Ray Hix, Klump family, Fairhope City Council, HWY 181
    llm_text: RSA used fuel access to block a 12-unit condo near Point Clear, showing how powerful entities control development. See how this pattern affects the big KLUMP PUD pushed by Gayfer Village Partners now.
