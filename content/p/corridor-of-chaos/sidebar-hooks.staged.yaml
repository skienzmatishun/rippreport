hooks:
  down-home-fairhope-jester:
    brief: |-
      THE CONFLICT:
      - Past/historical conflict: Fairhope City Council members Burrell, Boone, and Brown accused/alleged of using office for personal gain.
      - Date: Ethics complaint against Mr. Brown involving Eastern Shore Art Center in limbo status since May 2, 2018.
      - Date: Fairhope City Council President Jack Burrell in office over 7 years.
      - Date: Fourth year in a row Council will not approve City Budget on time.
      - Event: Council found guilty in Federal Court for violating right of free speech; case now being used in similar cases as precedent around country.
      - Event: Councilman Brown awarded soccer field clubhouse/bathroom contract over $750,000; described as warm-up to ESAC contract.
      - Event: ESAC nonprofit awarded sole bid to Mr. Brown; Mr. Brown holds board position with EASC; his sole responsibility described as Ethical, Transparent and Accountable; failed; EASC Board made horrible mistake by awarding sole bid to Mr. Brown.
      - Event: Council rejected land that had most public support, for a piece of land Burrell Boone and Brown wanted that had no public support/public notice; did not pass muster with National Park recommendations; appraisal highly questionable and should be investigated.
      - Event: Burrell Boone and Brown were all in to purchase 2.6 million in property without any public hearing.
      - Event: Council almost got away with giving away 102 acres of municipal property; three BBB’s will sting ya and try this give away again while sleeping.
      - Event: Burrell, Boone and Brown, who have all used office for personal gain, should not be trusted to make a 2.6 million dollar purchase, using tax money, without community involvement.

      - Main article conflict/context: Oct. 28 city council will hold public hearing and begin final approval of application by owner Gayfer Village Partners for three part planned unit development on 76 acres mostly farm land on northwest corner of Fairhope Avenue and Hwy 181.
      - Unit 1: 16 commercial lots (B-2). Unit 2: 232 multi-family apartment units (R-5). Unit 3: 77 lots single family residential (R-3).
      - Property currently outside city limits in un-zoned county; to be concurrently annexed into city on approval; city impact fees collected accordingly.
      - Exact site plans for phases one and two still need city council approval before construction could begin.
      - Developer: Tom Mitchell.
      - Municipal Judge Haymes Snedeker sole member of Gayfer Village Partners LLC; law/business partner Ray Hix organizer; Hix served on city Airport Authority until last year.
      - Hix Snedeker Companies nationwide commercial development business.
      - Property previously owned by Klump family, where unpaved airfield by that name operated for many years.

      THE DISCOVERY:
      - Article 2 claims last Fairhope City Council meeting should prove “Catalyst” Council is not going to listen to constituents; benefiting with insurance package from part time job; other part time employees exempt from.
      - Article 2: last recreation piece of property Burrell and Council had authority over was soccer fields; millions spent on soccer field complex that had no plan, did not meet specifications, and was across from a gun range; Council wishes to locate another recreation property, in an area that is in an aircraft flight pattern.
      - Article 2: deal stinks so much Councilman Conyers and Robinson jumped ship, for the first time.
      - Article 2: Burrell, Boone and Brown were all in to purchase 2.6 million in property without any public hearing; FOLLOW THE MONEY.
      - Article 2: It is also not in the budget, so now they have to cut other services and departments and rearrange the whole budget; fourth year in a row Council will not approve City Budget on time.
      - Article 2: Council has been holding up infrastructure projects since they were elected.
      - Article 2: Council rejected land that had the most public support, for a piece of land Burrell Boone and Brown wanted that had no public support or public notice; did not pass muster with National Park recommendations; appraisal highly questionable and should be investigated.
      - Article 2: Councilman Brown got soccer field clubhouse/bathroom contract over $750,000; warm up to ESAC contract; citizens should ask how hell this was allowed to happen.
      - Article 2: Council was found guilty in Federal Court for violating right of free speech; case now being used in similar cases as precedent around country; Fairhope Council President Burrell and Council now have dubious reputation of this case around their necks.
      - Article 2: Councilman Brown now has his eyes on new recreation property and potential contracts it may yield.
      - Quote: “I did not use my position as Fairhope city councilman to get it rewarded. We were awarded the project because of our reputation. The ESAC is a nonprofit. They don’t follow municipal bid law where projects are publicly bid.”
      - Article 2: Brown’s reputation is based on HIS actions. EASC being a nonprofit is moot. Councilman Mr. Brown holds a board position with EASC, His sole responsibility is to be Ethical, Transparent and Accountable to EASC and the Citizens of Fairhope. He has failed. The EASC Board made a horrible mistake by awarding the sole bid to Mr. Brown.
      - Article 2: Ethics Complaint has been in a limbo status since May 2, 2018. Ethics letter below will show contempt and condescending attitude that they had to the allegations in the complaint. Ethics Commission could make three telephone calls and see enough red flags to investigate the complaint. Ethics Commission’s inaction and dismissals of complaints actually encourage elected officials, to use their office for personal gain.
      - Quote: “What’s important is that you cannot use your office to create a benefit for our self or any business with which you’re associated or your family. You may bid on the work but you cannot have used or use in the future your position to get it awarded.”
      - Article 2: Ethical guide: Public Officials cannot use their office for personal gain. This is a policy of the Ethics Commission as well, they do not enforce their own policy. Ethics Commission is the investigator, it should not be incumbent upon the citizens of the community to be the investigator.
      - Article 2: THE COMPLAINT AGAINST MR. BROWN INVOLVING THE EASTERN SHORE ART CENTER WILL BE SENT TO THE ATTORNEY GENERAL NEXT WEEK.
      - Article 2: Councilman Brown also was all in on giving away 102 acres of municipal property.
      - Article 2: Council almost got away with the give away, but do not go to sleep because the three BBB’s will sting ya and try this give away again, while you are sleeping.
      - Article 2: Fairhope City Council is a Catalyst Council, it does not listen or respect community involvement.
      - Article 2: Fairhope has had one City Council President in office for over 7 years, Jack Burrell. Burrell leads the dog and pony show.
      - Article 2: Burrell, Boone and Brown, who have all used their office for personal gain, should not be trusted to make a 2.6 million dollar purchase, using tax money, without community involvement.

      THE PIVOT:
      - Article 2 is older than Article 1 and should be framed as background/historical context.
      - Article 2 provides prior facts/allegations around Fairhope City Council ethics, Mr. Brown, ESAC, personal gain, Federal Court free speech case, 2.6 million dollar purchase, 102 acres municipal property giveaway, budget issues, soccer fields.
      - Article 1 frames Fairhope City Council as “Catalyst Council” and proposed Klump PUD as “Corridor of Chaos”; mentions 2020 Fly Creek Apartments with 240 units and 77 more planned, same street impacting same intersection, another proposed 45 condos, Old Battles Place 94 units.
      - Article 1 totals: 566 apartments, 77 homes, 16 commercial units; just these three projects.
      - Article 2 is the smoking gun/key context for Article 1 because it documents Council conduct that supports claims of lack of transparency, ethics failures, personal gain, and potential conflict of interest relevant to proposed development and recreation property decisions.

      KEY ENTITIES:
      - Gayfer Village Partners; Tom Mitchell; Haymes Snedeker; Ray Hix; Hix Snedeker Companies; Klump family; Fairhope City Council; Jack Burrell; Boone; Brown; Conyers; Robinson; Burrell Boone and Brown; ESAC; Eastern Shore Art Center; Ethics Commission; Attorney General; Fairhope Junior Council; Fairhope Avenue; Hwy 181; Fly Creek Apartments; Old Battles Place; Lowery; Wilters.
    llm_text: Fairhope’s Jack Burrell, Boone and Brown face ethics allegations and a federal guilty verdict, yet the council plans a 2.6 million dollar property deal without public hearing. Now it weighs a Gayfer Village Partners PUD that could add 566 apartments and 77 homes.
    text: Fairhope’s Jack Burrell, Boone and Brown face ethics allegations and a federal guilty verdict, yet the council plans a 2.6 million dollar property deal without public hearing. Now it weighs a Gayfer Village Partners PUD that could add 566 apartments and 77 homes.
