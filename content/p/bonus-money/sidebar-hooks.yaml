  airport-diversion:
    brief: |-
      THE CONFLICT
      *   The Ripp Report filed complaints against Jack Burrell (Council President) and Ray Hix (Airport Board Member).
      *   These ethics complaints related to alleged wrongdoing at Fairhope Airport Authority and were associated with Sherry Sullivan's firing.
      *   Following these disputes, the City Council used taxpayer money in executive session to settle a claim made by Sherry Sullivan for bonus payments without a trial or explanation.

      THE DISCOVERY
      *   The Widget Article suggests Jack Burrell’s push for an investigation into invoices and computer work (contracted through Elias Technologies) is not motivated by fiscal prudence but as a tactical distraction ("to try and get the heat off his ass").
      *   Councilman Brown stated that ethics complaints against Council President Jack Burrell and Airport Board Member Ray Hix have been "ruled baseless," though the Widget Article claims investigations into both men remain ongoing.

      THE PIVOT
      *   Article 1 details the Ethics Commission's finding of "not probable cause" regarding the ethical violations; Article 2 reframes this outcome, arguing that Burrell is now manufacturing financial controversies (invoices/computer work) to deflect public attention from his and Hix’s unproven—and potentially ongoing—ethics investigations.

      KEY ENTITIES
      *   Fairhope City Council / Fairhope Airport Authority
      *   Jack Burrell (Council President / Mayor candidate)
      *   Ray Hix (Airport Board Member / Subject of Ethics Complaint)
      *   Sherry Sullivan (Former Mayor; Fired Employee Claimant)
      *   The Ripp Report (Non-profit Watchdog/Complaints Filer)
      *   Chucky Cheese (Editor, *The Courier*)
      *   Councilman Brown
      *   Elias Technologies (Contractor for City of Fairhope)
      *   Deborah Smith (Resigned official; source suspected in document transfer to Burrell)
