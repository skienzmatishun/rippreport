      THE CONFLICT: WHAT HAPPENED IN THE PAST?

      *   February 26, 2018: Ethics Commission received a complaint against Fairhope City Councilman Robert Brown regarding his contracting with the Eastern Shore Art Center.
      *   The Commission advised Mr. Brown not to use his office/position to create benefits for himself or associated businesses (Eastern Shore Art Center).
      *   Mr. Brown proceeded with the contract despite this clear warning, allegedly failing to request a formal opinion from the Ethics Commission as required.
      *   Robert Brown is connected to Cliff Pittman via Pittman Brown Development Co., which is also involved in the Single Tax Corp.

      THE DISCOVERY: WHAT DOES THE SECOND ARTICLE PROVE OR REVEAL TODAY?

      *   Jack Burrell demands accountability for city school funds (approx. $350,000/year).
      *   Burrell simultaneously fails to demand accountability regarding funding received by Fairhope Airport (>$500,000).
      *   Article 1 reveals that the Fairhope City Council approved using taxpayer money in executive session to settle claims (e.g., Sherry Sullivan), which Burrell reportedly "led the charge" on.

      THE PIVOT: WHY IS ARTICLE 2 THE 'SMOKING GUN' FOR ARTICLE 1?

      *   Article 1 accuses Jack Burrell of leading efforts to reward bad behavior using taxpayer money for settlements/bonuses, while Article 2 establishes a history of selective accountability by Burrell and his circle.
      *   The historical ethical failures (Brown/Pittman/Art Center) provide context to the present accusations of misuse of public funds at the Airport and City level.

