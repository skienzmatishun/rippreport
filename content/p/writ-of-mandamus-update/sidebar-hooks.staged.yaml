  letter-to-the-alabama-attorney-general:
    brief: |-
      THE CONFLICT:
      - Nov. 25: Judge Johnny Hardwick, Circuit Judge, Montgomery County, held STATUS REVIEW on all pending motions relative to Writ of Mandamus filed by Francis Paul Ripp on Oct. 18.
      - Nov. 1: Judge Johnny Hardwick, selected by Chief Justice Tom Parker to preside over some ethics cases, read evidence to Ripp’s Writ of Mandamus, found it very interesting, wished he could delve into case, then recused himself due to potential conflict of interest.
      - Francis Paul Ripp and Attorney Harry Still had no problem with Judge Hardick hearing the case; Ripp said they respect his decision and will wait until case is rescheduled.
      - Ripp announced a civil case will be filed against Regions Bank involving trustees of the Mabel Amos Memorial Fund.
      - Allegations against Mr. Albritton: based on his “self Dealing” of the Mabel Amos Memorial Fund as trustee; Albritton admitted in Lagniappe articles; should require Albritton to resign from Ethics Commission immediately.
      - Mr. Albritton is Executive Director of the Ethics Commission; actions as trustee should require immediate resignation.

      THE DISCOVERY:
      - Widget Article, Letter to the Alabama Attorney General, is older/background context.
      - Letter addressed to Alabama Attorney General Steve Marshall, 501 Washington Ave., Montgomery, Alabama 36104; attention Mr. Steve Marshall.
      - During last election cycle, Ripp had conversation with Steve Marshall in Fairhope, Alabama during one of Marshall’s campaign stops; Ripp explained level of corruption in Baldwin County and that Alabama Ethics Commission was not investigating ethics complaints.
      - Marshall assured Ripp, if elected, his office would take all complaints seriously; Marshall did not; office did not respond to or investigate complaint Ripp personally delivered to Marshall’s investigators in Montgomery.
      - Complaint involved a Fairhope councilman using board position to personally enrich himself; Ethics Commission believed Councilman without independent investigation.
      - Ripp Report founded in 2008; consumer organization; handles consumer issues and political corruption; Alabama number one in nation for political corruption; no one held accountable; Ethics Commission, Alabama Bar and Judiciary rarely, if ever, followed through.
      - Oversight bodies acted as insulator for corruption; lack of action only encouraged further corruption.
      - Letter enclosed copy of Lagniappe article “SELF-DEALING,” Ethics Complaint, Alabama Bar Complaint, and Writ of Mandamus; all related to actions of Director of Alabama Ethics, Tom Albritton; Ripp suggested Marshall read Lagniappe article first.
      - Lagniappe article and Ripp Report had as many as 80,000 readers; Ripp noted Court of Public Opinion far more effective than those tasked with upholding law; Ripp said will keep readers informed.
      - Specific complaint against Mr. Albritton: self dealing, IRS code violations, actions as Alabama attorney.
      - Albritton and Ethics Commission dismissed several complaints listed in Ethics Complaint and Writ of Mandamus, including Fairhope Councilman; all involved situations where board members or trust attorneys used positions the same as Albritton.
      - Ripp questioned how Ethics Commission could find anyone guilty of self dealing if Director of Ethics Commission was self dealing himself.
      - Albritton is one of three trustees, and an attorney, of the Mabel Amos Memorial Fund; same fund awarded Albritton’s daughters $105,000 in scholarships to University of Texas.
      - Mabel Amos Memorial Fund and three trustees should be subjects of extensive review by appropriate authorities; if fund benefiting Albritton, not surprise other two trustees benefited.

      THE PIVOT:
      - Article 2, the Widget Letter to the Alabama Attorney General, is older than Article 1, the Main Article “WRIT OF MANDAMUS: UPDATE”; frame Article 2 as background/historical context.
      - Article 2 letter predates Nov. 25 status review and contains prior complaint to Alabama AG and alleged Ethics Commission inaction.
      - Article 1 references Writ of Mandamus, Lagniappe article, Ethics Complaint, Alabama Bar Complaint, and civil case against Regions Bank; Article 2 states those documents are related to Tom Albritton.
      - Article 2 is key/smoking gun context because it provides prior factual basis: Ripp’s complaint to Marshall, Marshall’s failure to act, Albritton’s self dealing, Mabel Amos Memorial Fund, trustees, and $105,000 scholarship.
      - Article 1 pivot: Judge Hardwick recused; civil case against Regions Bank involving trustees of Mabel Amos Memorial Fund; Ripp says civil case will expose how many of Albritton’s law partners and friends were on the “self serving” money train.

      KEY ENTITIES:
      - Francis Paul Ripp / The Ripp Report / Lagniappe
      - Judge Johnny Hardwick / Montgomery County Circuit Court
      - Chief Justice Tom Parker
      - Attorney Harry Still
      - Thomas “Tom” Albritton / Alabama Ethics Commission / Executive Director
      - Alabama Attorney General Steve Marshall
      - Regions Bank
      - Mabel Amos Memorial Fund / three trustees
      - Fairhope Councilman / Baldwin County / Fairhope, Alabama / Montgomery, Alabama
      - Alabama Bar / Judiciary
      - University of Texas
      - $105,000
      - 80,000 readers
      - Dates: Oct. 18, Nov. 1, Nov. 25; Ripp Report founded in 2008.
