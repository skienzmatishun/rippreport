      by GOB elite: District Attorney Robert Wilters and former Sheriff Hoss Mack.

      - DA David Whitstone (predecessor) and Judge/DA Robert Wilters were central
      to the Murray Lawrence Jr. wrongful conviction.


      THE DISCOVERY:

      - New evidence was recently discovered in a case "riddled with failures by the
      state," proving that Mr. Lawrence was innocent.

      - The evidence was "suppressed willfully rather than inadvertently" and never
      shown to the defense.

      - Evidence suppression proved Murray Lawrence Jr.''s innocence; he has been
      incarcerated for 20 years.

      - Signatures from Sheriff Hoss Mack, DA Robert Wilters (who served as judge),
      and DA David Whitstone were found on the suppressed evidence.

      - This proves the officials knowingly and willfully withheld exculpatatory evidence
      for self-promotion.


      THE PIVOT:

      - Article 2 acts as the "smoking gun" because it exposes the specific legal
      mechanism (willful suppression of exculpatory evidence) that allowed the 20-year
      wrongful conviction to stand.

      - The names of Hoss Mack, Robert Wilters, and David Whitstone tied in Article
