  sheriff-huey-boss-mack-secret-police-2:
    brief: 'THE CONFLICT:

      - **Murry Lawrence Jr.** convicted of capital murder (2003 murder of Brandon
      Hastings; sentenced to life without parole in 2005) with **NO physical evidence**
      (no gun, witness, fiber, fingerprints, blood, DNA). Multiple alibi witnesses
      placed him in Baldwin County 1–3 AM that night.

      - **Huey "Hoss" Mack** was Baldwin County Sheriff (2007–2024, ~17 years). Lead
      investigator in Lawrence case (produced zero evidence); also ran private **Hoss
      Mack Funeral Home** that received a county contract to handle deceased persons
      under special circumstances (including victims like Jonathan Victor), creating
      an obvious conflict of interest.

      - **Robert Wilters** served as Baldwin County Circuit Court Judge 1999–2015
      and became District Attorney; was the **presiding judge** in the Lawrence trial
      (prejudicial per se).

      - **David Whetstone/Whitstone** was prosecutor at time of Lawrence trial; later
      DA; now retired.

      - **Kristi Hagood**, a career prosecutor, was recruited as a judge candidate
      and her campaign was financed/motivated by attorney consultants **Jon Gray**
      and **Scott Boone**, who ignored her qualifications (including her involvement
      in the Lawrence case) to collect fees ("MONEY < MONEY < MONEY").


      THE DISCOVERY:

      - Widget article documents BCSO''s secret-police pattern under Mack, including:
      Jonathan Victor killed May 2017 (no crisis intervention; no DE-escalation training),
      Robert Yates killed March 5, 2018 by SWAT with **114+ rounds** after one warning
      shot over an eviction, Kevin J. Andrews killed in BCSO traffic pursuit contrary
      to written policy, Peyton Little declared suicide while allegedly a confidential
      informant for BCSO drug task force (no investigation of CI status), Deputy Bill
      Smith died on four-wheeler without life vest.

      - **The Lagniappe legal decision (Sept 30, 2021)** — Chief Justice Tom Parker:
      "With one sweeping stroke, today''s decision spells the end of public access
      to law-enforcement records that are connected in any way to an investigation."
      ALEA Chief Legal Counsel Dennis Baily: it likely strips citizens of access to
      body cam, surveillance video, 911 transcripts, autopsy info during investigations.
      This "Closed Records Act" interpretation directly enabled the concealment of
      evidence and records central to the Lawrence case (e.g., the undisclosed second
      autopsy).


      THE PIVOT:

      - Article 2 is the "smoking gun" because it proves the **systemic self-protection
      and secrecy** that made the Lawrence wrongful conviction possible: BCSO investigated
      its own officers in deadly incidents without FBI/ALEA involvement; Lagniappe
      decision legally shut down public record access; Wilters was judge and prosecutor
      simultaneously; Mack''s funeral home handled bodies; Gray/Boone profited from
      hiring a tainted judge (Hagood) whose qualifications were known to be compromised.
      This infrastructure of secrecy and self-interest is the context for why Law'
