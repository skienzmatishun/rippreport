      THE CONFLICT:

      - Past Events & Claims:
        - In Baldwin County, Alabama, political machine "Catalyst" was active before the 2020 election cycle, when it renamed itself Scott Boone Consulting (SBC).
        - SBC, led by Scott Boone (son of Fairhope councilman Kevin Boone), allegedly controlled local politics.
        - SBC reportedly elected a Mayor and four councilmen in Fairhope.
        - After election, SBC allegedly appointed a municipal judge (who was also the town's biggest developer) and a city attorney ("SBC loyalist") to "cover their backs."
        - SBC retained Hand Anderall Sale as counsel despite that firm losing the Fairhope "triangle lawsuit," costing taxpayers $3 million in legal fees.
        - The Fairhope Utilities Director, a certified engineer, was fired and replaced by the Mayor (who lacked engineering experience), with a salary increase, to allegedly open doors for SBC-favored engineering firms.
        - A major waterfront project (referred to as the "infamous Publix project," originally planned over eight years prior to January 2021) was abruptly killed or radically altered by SBC-aligned officials.

      THE DISCOVERY:

      - The second article reveals that the "Catalyst" political machine was not a transient phenomenon but a multi-decade structure that began with local leader Lynn Stacy in partnership with Chris Elliot and Haygood.
      - Chris Elliot served as a county commissioner, while Haygood served as Mayor of Daphne.
      - Once their elected tenures began, the group formally adopted the name "Catalyst."
      - The article identifies former Baldwin County Sheriff Hoss Mack as the original driving force who installed judges and mayors into office.
      - Following his retirement, Anthony Lowery took over as Sheriff and is said to maintain these political connections.
      - The article highlights that several municipalities have long-standing incumbents (e.g., Summerdale has had the same mayor for 33 years), making them vulnerable to long-term corruption and currently facing challengers.

      THE PIVOT:

      - Article 2 acts as the "smoking gun" because it provides the historical and organizational pedigree that explains how the SBC cabal described in Article 1 operated with such entrenched influence over multiple years and municipalities.
      - It establishes that the alleged manipulation of the Fairhope waterfront project and annexation of Parker Road was part of a larger, multi-decade "good ole boy" network rather than isolated local corruption by a single firm.
      - It validates the narrative in Article 1 that the system is systemic (spanning multiple jurisdictions like Bay Minette, Gulf Shores, Orange Beach, and Summerdale) and identifies former Sheriff Hoss Mack and his successor Anthony Lowery as the key figures who cultivated these political connections.

