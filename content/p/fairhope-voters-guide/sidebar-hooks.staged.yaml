    brief: "THE CONFLICT: \n- In the 2016 municipal election, the Alabama Secretary of State's Office Elections Division intervened by sending a legal representative to oversee voting and counting in Fairhope due to numerous complaints of election tampering during the 2008 and 2012 voting cycles.\n- Incumbent Mayor Timothy Kant was defeated by a 400-plus vote margin by political novice and bookstore proprietor Karin Wilson, making her Fairhope's first female mayor.\n- Despite the mayoral upset, the 2016 election populated the city council with five candidates backed by the previous administration—specifically operating under the local political machine known as \"CATALYST\" (or Scott Boone Consulting), led by Scott Boone and Kevin Boone.\n- Over the next four years, the council (led by Council President Jack Burrell, Kevin Boone, and Robert Brown) routinely opposed Mayor Karin Wilson's efforts regarding infrastructure, growth management, and wastewater/stormwater treatment.\n\nTHE DISCOVERY: \n- Article 2 exposes John Manelos—a former BP executive, Deepwater Horizon oil spill cleanup overseer, and 2020 Fairhope mayoral candidate—for attempting to suppress public criticism and free speech by deleting critical Facebook comments and promoting a \"Good Vibes\" pledge.\n- The widget background documents how Manelos and mayoral rival Sherry Sullivan utilized the \"Good Vibes\" pledge to deflect scrutiny and mask past controversies—specifically connecting Manelos to BP's use of 2 million gallons of toxic Corexit dispersant during the Deepwater Horizon disaster.\n- It highlights how candidate Sherry Sullivan was part of the corrupt, developer-friendly administration that was voted out in 2016, and is now being sponsored by the CATALYST machine (Scott and Kevin Boone) to unseat incumbent Mayor Karin Wilson in the August 25, 2020 election.\n\nTHE PIVOT: \n- Article 2 serves as the smoking gun by exposing the direct ties between the current municipal challengers (like Sherry Sullivan and John Manelos) and corporate/political entities that attempt to subvert transparency and free speech.\n- While Article 1 outlines the structural corruption of the \"CATALYST\" machine and the \"3 B's\" (Burrell, Boone, Brown) on the city council, Article 2 shows that the mayoral challengers running against incumbent Mayor Karin Wilson employ the exact same tactics of censorship, image-scrubbing, and avoidance of past accountability (typified by Manelos's BP history and Sullivan's ties to the ousted 2016 administration).\n\nKEY ENTITIES: \n- Karin Wilson\n- Timothy Kant\n- Jack Burrell\n- Scott Boone\n- Kevin Boone\n- Robert Brown\n- John Manelos\n- Sherry Sullivan\n- Deb Hopkins\n- Joshua Gammon\n- Howell Gibbens\n- Annette Sanders\n- Lesley Pacey\n- Paul Ripp\n- John Avant\n- CATALYST / Scott Boone Consulting"
