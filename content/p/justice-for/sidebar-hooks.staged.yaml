  key-figures:
    brief: |-
      THE CONFLICT: Murray Lawrence Jr. was wrongly convicted in Baldwin County, Alabama, around 2005. The conviction was based on coerced testimony from the actual killer, Jarius McNeil, lacking jurisdiction, physical evidence (no murder weapon, DNA, fingerprints), and an independent Alabama autopsy. The trial was overseen by Robert Wilters (Circuit Court Judge). John David Whetstone was the Baldwin County District Attorney. Hoss Mack (Chief Deputy) oversaw the investigation, allowing the victim’s body to go to Mack Funeral Home.
      THE DISCOVERY: The officials responsible for the 2005 conviction—including Wilters, Mack, and Lowery—have maintained influence in Baldwin County and state law enforcement. Hoss Mack is the Executive Director of the Alabama Sheriffs Association. Anthony Lowery, who worked under Mack, was appointed Baldwin County Sheriff in 2024 and will run for a full term in 2026.
      THE PIVOT: Article 2 reveals that the systemic failure and corruption cited in Article 1 (the system closed ranks; those who created the conviction still control it) is not historical but ongoing, demonstrated by the continued power, influence, and lack of accountability among the original case builders.
      KEY ENTITIES: Murray Lawrence Jr., Jarius McNeil, Baldwin County, Alabama, Robert Wilters (Circuit Court Judge), John David Whetstone (District Attorney), Hoss Mack (Chief Deputy/Executive Director of Alabama Sheriffs Association), Anthony Lowery (Baldwin County Sheriff/Candidate 2026), Dr. Paul McGarry (pathologist).
    llm_text: Officials who wrongly convicted Murray Lawrence Jr. in 2005—including Hoss Mack and Anthony Lowery—still run Baldwin County law enforcement. They show that the system failed then and continues to lack accountability now.
