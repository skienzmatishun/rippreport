      THE CONFLICT:
      *   Murray Lawrence Jr. was wrongfully convicted in Baldwin County, Alabama, and has remained imprisoned for more than twenty years.
      *   The conviction was based solely on the testimony of Jarius McNeil, who is a convicted criminal and confessed killer.
      *   Jarius McNeil allegedly coerced Murray Lawrence Jr. to be framed as an accomplice to avoid capital punishment.

      THE DISCOVERY:
      *   Anthony Lowery, the Appointed Sheriff, served as the lead investigator for the District Attorney in the case that resulted in the conviction of Murray Lawrence Jr.
      *   The Baldwin County Sheriff’s Office (BCSO) operates with a culture of "absolute immunity" where it investigates itself through its Major Crimes Division.
      *   Former Sheriff Hoss Mack developed this culture, which Lowery has maintained for the past 18 years.
      *   BCSO records include cases of wrongful convictions and ignored citizen complaints.

      THE PIVOT:
      *   Anthony Lowery’s role as the lead investigator for the DA establishes a direct link between the Sheriff's Office leadership and the initial wrongful conviction of Murray Lawrence Jr.
      *   The BCSO’s documented pattern of self-investigation and immunity (The Discovery) provides the systemic context for the claims in the Main Article that the conviction was built without due process and involved suppressed evidence.

