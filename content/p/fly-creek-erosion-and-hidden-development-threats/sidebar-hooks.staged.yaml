  legal-eagle-update-feb-2015:
    brief: |-
      THE CONFLICT:
      1. 2011: Complaint filed against Mayor Kant and Senator Pittman for grant fraud related to BP funds.
      2. 40 years prior: Owners of the triangle property were denied all proposed projects until they settled with the city, resulting in a secret $12 million purchase.
      3. Ongoing: Complaints were filed with the Alabama Ethics Commission and judiciary regarding Judge Thomason, Part-Time Judge Bracken, and Attorney Stephen Johnson.

      THE DISCOVERY:
      1. The Alabama Ethics Commission dismissed complaints regarding Judge Thomason without conducting an investigation.
      2. Mayor Kant is reversing a 40-year policy to accommodate developer Mr. Corte (land owner of the proposed PUD development).
      3. A $30,000 study commissioned in March 2013 by Thompson Engineering for the Fly Creek Watershed Restoration Project failed to identify major problems like red clay erosion from the Publix project.

      THE PIVOT:
      1. The dysfunction and alleged corruption within the Baldwin County legal system (Thomason, Bracken, Johnson) provide a background environment for political and development corruption (Kant, Corte).
      2. The city's willingness to change zoning and pursue the $14,700,000 Mobile Bay Preservation and Restoration project (Lower Fly Creek Reach) to protect from development directly facilitates the 275 apartments and 15 townhomes proposed on 40 acres within the Fly Creek watershed, driven by Mr. Corte's interests.

