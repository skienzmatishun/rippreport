      *   Sheriff Hoss Mack secured his position unopposed for three terms following legislative qualifications written by State Senator Tripp Pittman, which eliminated competition.
      *   The Baldwin County Major Crimes Division (BCMCU) investigates major incidents involving loss of life, but no officers have ever been found guilty by these investigations.
      *   Tom Albritton, Executive Director of the Ethics Commission, was accused of self-dealing and skimming trust funds entrusted to him.

      THE DISCOVERY:
      *   The system designed for accountability (Ethics Commission, Alabama Bar) is compromised; the Ethics Commission does not investigate itself, and the Alabama Bar accepts side income by attorneys/commissioners.
      *   The Attorney General's office was accused of using PAC funds illegally to secure election.
      *   Political influence is demonstrated by State Senator Elliott and Sheriff Mack's connection (Elliott's wife works for Mack).

      THE PIVOT:
      *   Article 2 established that key oversight agencies (Ethics Commission, Alabama Bar) are internally corrupt and complicit, meaning the dismissal of complaints against Bob Wills (Article 1) is not an isolated incident but a function of a systemic failure.
      *   The institutional lack of credibility (BCMCU investigating itself, Mack's uninvestigated record) provides the necessary context for the 2021 cover-up allegations regarding the killing of O.J. French, as the mechanisms for unbiased review are already proven compromised.

