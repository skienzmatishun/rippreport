  good-ole-boys-alive-and-well:
    brief: |-
      THE CONFLICT:
      *   October 21st/24th: Fairhope City Council reviewed Resolution 2606-16, accepting a deed of property from Angelo A. Corte to the city for a sewer lift station.
      *   Council overrode Mayor Kant’s veto regarding an ordinance amending Ordinance No. 1572 (Fly Creek PUD).
      *   Tim Kant was Mayor; Jack Burrell presided over the meeting; Marion Wynne was City Attorney.

      THE DISCOVERY:
      *   The gifted property (three+ acres of wetlands) was misrepresented as a small plot for a lift station.
      *   The wetlands receive stormwater runoff from the Publix site and contain the retention pond outfall pipe.

      THE PIVOT:
      *   Article 2 establishes that the Fly Creek PUD was approved years ago via a council action that superseded the mayor’s veto, providing the historical justification the city uses in Article 1 ("project was approved years ago").
      *   Article 2 reveals the political dynamics (Burrell, Kant, council influence) that facilitated the development, which is now causing specific resident issues (traffic, zoning changes) detailed in Article 1 in the Daphmont neighborhood.

      KEY ENTITIES:
      *   Tim Kant (Mayor)
      *   Jack Burrell
      *   Marion Wynne (City Attorney)
      *   Angelo A. Corte
      *   Robert Brown
      *   Sherry-Lea Bloodworth-Botop
      *   Fly Creek Apartments / Fly Creek PUD (Ordinance No. 1572)
      *   Daphmont neighborhood (Johnson road/Highway 98)
      *   Fairhope City Council
      *   Rock Creek
    llm_text: Despite Mayor Tim Kant's veto, Fairhope City Council took three+ acres of misrepresented wetlands from Angelo A. Corte for a sewer lift station. Learn how Jack Burrell and Marion Wynne facilitated this development now affecting Daphmont traffic.
