  hi-jack-ed:
    brief: |-
      THE CONFLICT:
      *   Prior to 2016, the Fairhope Airport Authority (FAA) received an annual appropriation of half a million dollars from the Fairhope budget.
      *   In 2012, Mayor Wilson sought to exercise an option in the original loan, allowing the city to reclaim 258 acres of land for $10.00 if the principal was not paid by that date.
      *   Mr. Burrell, Fairhope City Council President and city liaison for the FAA, was on the ad hoc committee of two that oversaw and selected airplane hanger bids.

      THE DISCOVERY:
      *   The FAA appropriation represents 21% of the city's debt while serving 1% or less of the population.
      *   Article 2 revealed the FAA operated with a lack of public scrutiny and conflicts of interest, with board members having personal/financial connections to the Airport.

      THE PIVOT:
      *   Article 2 establishes Mr. Burrell's historical support for the FAA over citizen interests and his role in the bid process, providing context for his involvement in the current investigation.
      *   Article 1 shows the FAA and Mr. Hix are currently under scrutiny regarding a lease bid, with the FAA hiring attorneys who are also representing Mr. Hix to seek an advisory opinion from the Ethics Commission.

