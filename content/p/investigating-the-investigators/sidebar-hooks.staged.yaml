  you-show-me-yours-and-i-will-show-you-mine-letter-that-is:
    brief: |-
      THE CONFLICT:
      Senator Pittman secured municipal contracts (emergency debris removal) with Fairhope without holding a mandatory general contractor’s license (referenced around 2005, related to BP Boom Grant).

      THE DISCOVERY:
      Mayor Kant and Senator Pittman were given a letter from the Ethics Commission claiming exoneration; however, this was not a full investigation but a closed file, with the case forwarded to Special Prosecutor Matt Hart of the Alabama Attorney’s Office.

      THE PIVOT:
      The previous handling of the BP Boom Grant conflict by the Ethics Commission establishes a pattern of officials using the Commission's advisory process to dismiss conflicts of interest, which parallels Ray Hix's attorney utilizing the Ethics Commission for an advisory opinion regarding the Fairhope Airport Authority (FAA) lease, where Hix allegedly misused insider information.

