  fairhope-town-hall-meeting:
    brief: |-
      THE CONFLICT: Ray Hix, a board member for 6 months prior to a bid process, won a lease for his company from the Fairhope Airport Authority (FAA). The lease was executed on Dec. 17, 2015. Allegations include inaccurate bid information (aircraft count, fuel usage, construction timeline) and Mr. Burrell reducing the fuel estimate by 15,000 gallons.

      THE DISCOVERY: During the 2/16/2017 Fairhope Town Hall Meeting, it was revealed that Airport Authority land represents 21% of city debt but accommodates less than 1% of Fairhope citizens, and the city spends more on the Airport than on public schools.

      THE PIVOT: Article 2 establishes the financial disproportion and public concern regarding the FAA's control over city resources. Article 1 demonstrates specific instances of potential misuse of insider knowledge and board authority by Ray Hix (while serving on the board) to secure a highly advantageous lease, directly contradicting the public interest concerns raised in Article 2.

      KEY ENTITIES: Ray Hix, Jack Burrell, Mr. Bailey, Joe McEnerney, Fairhope Airport Authority (FAA), Ethics Commission, Mayor, City Council President, Fairhope (location), Fly Creek Apartments, Ordinance 1572.
    llm_text: Ray Hix secured a favorable FAA lease while serving on the board, allegedly reducing fuel estimates by 15,000 gallons. Why does this matter? The FAA controls 21% of city debt but spends more than Fairhope on public schools.
