  shut-up:
    brief: |-
      THE CONFLICT: City of Fairhope guaranteed an $8.845M loan for 265 acres of airport land in March 2007. The city has paid over $3.6M since 2007. The loan has a balloon payment scheduled for 2020. Mayor Karin Wilson began investigating the debt and refinancing process in September 2016. Jack Burrell opposed transparency and minimized concerns regarding the airport's financial health.
      THE DISCOVERY: The airport debt constitutes 21% of the city's total debt and exceeds the spending on all 5 public schools. The Airport Authority's refinance effort (Sept 2016–Feb 2017), led by Joe McEnerney, was characterized by delays, poor communication, and non-transparency, despite Mayor Wilson's requests for involvement.
      THE PIVOT: Article 2 establishes that the Fairhope Airport Authority was already facing severe, long-term financial mismanagement, debt issues, and lack of transparency under leadership including Jack Burrell and Joe McEnerney *before* the specific controversy involving Ray Hix's bid and the subsequent Ethics Commission complaint against Hix.
      KEY ENTITIES: Jack Burrell, Mayor Karin Wilson, Joe McEnerney, Ray Hix, Ethics Commission, Fairhope Airport Authority (FAA), Paul Ripp, Bryant Bank
    llm_text: Fairhope guaranteed an $8.845M airport loan, costing the city over $3.6M. Mayor Karin Wilson investigated the debt, but Jack Burrell opposed transparency, revealing the airport's severe, long-term financial mismanagement.
