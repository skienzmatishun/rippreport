      fraud, coverup, and witness intimidation charges.


      THE DISCOVERY:

      *   The passage of the Education Accountability Act is characterized as a "Hindenburg"
      legislation by Paul Ripp (writing in September 2013).

      *   Ripp critiques the Act, stating it allegedly robbed $40 million from education
      for only 52 students.

      *   The article frames the actions of Governor Bentley and the legislature as
      fiscally negligent or corrupt at the time of passing.


      THE PIVOT:

      *   Article 2 provides immediate, contemporaneous context (Sept 13, 2013) to
      the corruption allegations detailed in Article 1 (which discusses these issues
      years later), confirming the passage of the flawed Act and linking it to specific
      financial mechanisms ($750k grant, alleged Mayor Kant assistance) concurrently
      with the legislation''s passage.


      KEY ENTITIES:

      *   Robert Bentley (Governor)

      *   Trip Pittman (Senator)

      *   Tim Kant (Fairhope Mayor)

      *   Paul Ripp (Author/Consumer Advocate)

      *   Alabama Education Accountability Act'
