    brief: "THE CONFLICT: \n- On April 5, 2003, Brandon Hastings was murdered in Baldwin County, Alabama. \n- Murray \"Bubba\" Lawrence Jr. was convicted of the murder and sentenced to life without parole more than 18 years ago.\n- In April 2021, Jonathan Victor was shot four times and killed by Sheriff's Deputy Hunady.\n- On August 20, 2023, 32-year-old O.J. French was pulled over for a vehicle equipment violation and shot and killed by Bay Minette Police officer Brandon Thompson.\n\nTHE DISCOVERY: \n- Criminal rights advocates unearthed a second autopsy report for victim Brandon Hastings that proved the cause of death was suffocation, not a gunshot wound as claimed by the prosecution.\n- The coroner's report was ordered by the District Attorney and signed by the judge overseeing the case, but was never provided to the defense during the original trial.\n- Regarding historical police misconduct in Baldwin County, the Baldwin County Major Crimes Unit (BCMCU) investigated nine officer-involved deaths, clearing law enforcement in all previous eight instances and withholding camera footage from the public.\n- In the Jonathan Victor case, Judge William Cassady denied qualified immunity to Deputy Hunady and Sheriff Hoss Mack, ruling that the Sheriff provided untrue facts in court regarding the unarmed victim being shot from 7 yards away.\n- The Alabama Supreme Court upheld a Baldwin County ruling allowing the Baldwin County Sheriff's Office to withhold investigative records, dash cams, and body camera footage related to the 2017 Jonathan Victor shooting from media outlets like Lagniappe Mobile, despite closed investigations.\n\nTHE PIVOT: \n- The older historical context reveals a long-standing pattern and systemic practice within the Baldwin County Sheriff's Office (BCSO) and local justice system of suppressing exculpatory evidence, hiding investigative files, and generating false or misleading narratives to cover up police and prosecutorial misconduct (evident in both the 2003 Murray Lawrence murder trial suppression and the modern BCMCU/BCSO cover-ups of officer-involved shootings).\n\nKEY ENTITIES: \n- Murray \"Bubba\" Lawrence Jr.\n- Brandon Hastings\n- Robert Wilters (District Attorney, former Judge)\n- Hoss Mack (Sheriff, former lead investigator, former Lt. Hoss Mack)\n- David Whetstone (Prosecutor)\n- Kristi Deason Haygood (Assistant District Attorney)\n- Scott P. Taylor (Circuit Court Judge)\n- Jarius McNeil\n- O.J. French\n- Brandon Thompson\n- Jonathan Victor\n- Hunady (Sheriff Deputy)\n- Al Tolbert (Bay Minette Police Chief)\n- William Cassady (Judge)\n- Sam White (Rev.)"
