      - Haygood noted Alabama Court of Criminal Appeals found co-conspirators testimony against Lawrence corroborated, and additional circumstantial facts indicating Lawrence shot Hastings. No gun, no bullets, no ballistics, no DNA, no blood, no fingerprints, no witness, no evidence of gunshot, no telephone records, no timeline, no crime scene.

