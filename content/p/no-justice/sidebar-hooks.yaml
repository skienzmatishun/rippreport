  baldwin-county-judicial-corruption:
    brief: 'THE CONFLICT: On April 5, 2003, Brandon Hastings was killed in Baldwin
      County, Alabama. Murray "Bubba" Lawrence Jr. was convicted of the murder and
      sentenced to life without parole. In the case, District Attorney Robert Wilters
      served as the presiding Judge; Lieutenant Hoss Mack (current Sheriff) was the
      lead investigator for the Baldwin County Sheriff''s Office (BCSO); and David
      Whetstone was the prosecutor. All three signed a coroner''s report regarding
      the exhumation of Hastings'' body. That second autopsy found the cause of death
      to be suffocation, not the gunshot narrative promoted by the state in trial.
      The defense never saw the report during the 2003 trial; it was withheld willfully
      and deliberately. Lawrence has been incarcerated since then (roughly 20 years
      as of this writing).


      THE DISCOVERY: A new Rule 32 petition was filed against Lawrence''s conviction
      by Haygood Kristi Deason, an assistant Baldwin County DA who works directly
      for Wilters. The State''s answer—delivered through Haygood—is full of factual
      errors and deliberate omissions. Key disclosures:

      - Haygood admitted the non-disclosure of the second autopsy was "certainly a
      violation of the discovery order" but offered no explanation; her office calls
      it "harmless error."

      - The suppressed evidence contradicts the state''s entire prosecution: no gun,
      no bullets, no ballistics, no DNA, no fingerprints, no confirmed witness identifying
      Lawrence with a murder weapon.

      - Prosecutorial witnesses were systematically discredited at trial due to drug
      use and inconsistent timelines (Kathleen Gordon had an alleged romantic history
      with Lawrence and was linked to Jarius McNeil''s girlfriend; apartment-complex
      claims that Lawrence retrieved a gun on the night of the murder are contradicted
      by trial testimony placing the visit Sunday, after the fact).

      - A fairhope police stop at 5:01 AM involving John Wayne Mixon, Tonya, and Crystal
      Lindsey—witnessed by BCSO, the DA, the Judge, and the Sheriff—was never introduced
      or explained; Crystal Lindsey testified Lawrence was seen around 4:30–4:45 AM,
      making it physically impossible for him to have driven to Mississippi to dispose
      of a body and returned in time.

      - Debra Fudge, the last person to see Hastings alive, never testified; Wendall
      Thomas, the Fairhope officer involved in the 5:01 stop, never testified either.

      - The book "Life Without Jurisdiction" (referenced in the widget article) claims
      it documents deep Baldwin County judicial corruption and is available at Page
      and Pallet Bookstore or online.


      THE PIVOT: Article 2 frames the second autopsy not merely as a lost piece of
      evidence, but as direct proof of willful suppression by the same three officials
      now defending Lawrence''s conviction—Wilters (Judge), Mack (Sheriff/lead investigator),
      Whetstone (prosecutor). Their signatures on the suppressed report make them
      party to the misconduct rather than neutral parties. This turns what Article
      1 describes as an "inadvertent mistake" into a coordinated effort: suppression
      of exculpatory evidence to maintain a wrongful conviction while those same officials
      remain in office. Additionally, Article 2 links the case to broader systemic
      corruption—the BCSO''s internal Major Crimes Unit never finds deputies responsible
      for misconduct; Mack promised $600,000 in body/car cameras "for the public as
      well as the police" but either withholds or releases edited footage; and multiple
      other cases show a pattern of willful suppression to secure convictions. This
      pattern makes Article 2 the smoking gun: it shows the suppressed evidence wasn''t
      lost—it was hidden by convicted misfeasors, and that same misfeasance is the
      norm in Baldwin County courts.


      KEY ENTITIES:

      - Murray Lawrence Jr. ("Bubba"), convicted prisoner, wrongful conviction claimant

      - Brandon Hastings, victim, killed April 5, 2003

      - Robert Wilters, Baldwin County District Attorney, former presiding judge on
      Lawrence case, signed suppressed report

      - Hoss Mack, current Baldwin County Sheriff, lead investigator in Lawrence case,
      signed suppressed report; Lt. Hoss Mack (Sr.), prior coroner/owner of Hoss Mack
      Funeral Home who handled Hastings'' burial

      - David Whetstone, state prosecutor in Lawrence trial, signed suppressed report

      - Haygood Kristi Deason, assistant DA filing the State''s Rule 32 response

      - Scott Johnson, Lagniappe reporter covering Haygood''s filing

      - Jarius McNeil, alleged co-conspirator who named Lawrence to avoid his own
      death sentence; his parents worked at the Fairhope satellite courthouse during
      the murder

      - Debra Fudge, last known witness to Hastings alive; never testified

      - Wendall Thomas, Fairhope police officer involved in the 5:01 AM stop; never
      testified

      - Crystal Lindsey, eyewitness who saw Lawrence around 4:30–4:45 AM on the night
      of the murder

      - John Wayne Mixon and Tonya (Mixon), stopped at 5:01 AM by Fairhope police

      - Jeff Shaw, neighborhood kid allegedly given a gun to hide; later identified
      as a stolen gun from Fairhope, unrelated to the murder

      - Judge Scott P. Taylor, Circuit Court judge assigned to the Rule 32 petition

      - Kathleen Gordon, prosecution witness with credibility issues

      - Page and Pallet Bookstore, where "Life Without Jurisdiction" is sold

      - BCSO internal Major Crimes Division, mechanism by which Sheriff deputies avoid
      accountability'
