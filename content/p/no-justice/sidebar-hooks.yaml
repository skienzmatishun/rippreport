  deal-with-the-devil:
    brief: "The Bridge Brief below draws from the two articles you provided and the\
      \ corroborating Lagniappe Mobile / AL.com coverage about the second autopsy,\
      \ Rule 32 petition, and Whetstone’s “deal with the devil” comment.\n\nTHE CONFLICT:\n\
      \n- Murray “Bubba” Lawrence Jr. was arrested (approximately 2002–2003), convicted\
      \ of capital murder on May 13, 2005, and sentenced to life without parole for\
      \ the April 5, 2003 killing of Brandon Hastings, a Baldwin County resident in\
      \ Foley, Alabama.\n- The state’s case rested largely on the testimony of co-conspirator\
      \ Jarius McNeil, who claimed Lawrence shot Hastings and they dumped the body\
      \ in Mississippi (about a 3-hour 15-minute round trip), after being told by\
      \ BCSO that McNeil faced the death penalty if he did not provide a co-conspirator.\n\
      - Key state personnel at trial: Circuit Court Judge Robert Wilters (now Baldwin\
      \ County District Attorney), Lead Investigator Lt. Hoss Mack (later sheriff),\
      \ Prosecutor David Whetstone, and Coroner/BCSO officer at the time (per the\
      \ article, Hoss Mack Sr., with “Hoss Mack Funeral Home” handling Hastings’ funeral).\n\
      - The defense, represented by Willy Huntley, repeatedly objected; both appeals\
      \ were unsuccessful.\n\nTHE DISCOVERY:\n\n- In late 2018–2019 (after over 18\
      \ years on), advocates including Lagniappe reporters and Ripp Report filed a\
      \ Rule 32 petition against Lawrence’s conviction after discovering a second/exhumed\
      \ autopsy of Brandon Hastings that had been ordered by the DA, signed by the\
      \ presiding judge Wilters, and co-signed by Mack, yet never disclosed to the\
      \ defense during trial.\n- The hidden report reportedly supported “suffocation”\
      \ as cause of death rather than the state’s “gunshot” theory; prosecutors (via\
      \ Haygood Kristi Deason, an assistant DA) admitted non-disclosure violated discovery\
      \ orders but called it a “harmless error.”\n- Additional omitted facts from\
      \ the trial: no gun/bullets/ballistics/DNA/blood/fingerprints/witness of gunshot;\
      \ last-seen alive by Debra Fudge (a Foley co-worker); 5:01 a.m. Fairhope police\
      \ stop by Officer Wendall Thomas with Crystal Lindsey seeing Lawrence around\
      \ 4:30–4:45 a.m., making the Mississippi body-dump timeline impossible; Fudge,\
      \ Wendall Thomas, and the Fairhope stop were all known to authorities but did\
      \ not appear at trial.\n\nTHE PIVOT:\n\n- Article 2 (“DEAL WITH THE DEVIL”)\
      \ establishes context that this is not merely a procedural mishap in a wrongful\
      \ conviction, but part of a pattern of county officials acting contrary to their\
      \ own stated ethics while benefiting from it:\n  - Whetstone’s quoted courtroom\
      \ boast — “I have made a deal, a deal with the devil so that evidence could\
      \ be heard, so the dots could be connected. If you don’t like that deal, you\
      \ come after your D.A.” — frames the case as one where the prosecution knowingly\
      \ built the conviction around unreliable/omitted testimony (“deal with the devil”).\n\
      \  - Whetstone later boasted he “proved he was shot” by overruling the Mississippi\
      \ autopsy/coroner, and his Nodine-case comments (AL.com Dec 2010) show a pattern\
      \ of the DA’s own maneuvering damaging cases, mirroring how he maneuvered Lawrence’s\
      \ case.\n  - Article 2’s accusation that “justice comes in many forms… Judge\
      \ Wilters receives some justice” directly connects to Article 1’s core finding\
