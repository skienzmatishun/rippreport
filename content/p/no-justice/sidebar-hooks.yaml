hooks:
  rule-32:
    brief: "THE CONFLICT: \n- April 5, 2003: Brandon Hastings murdered in Foley, Baldwin\
      \ County. Prosecuted for gunshot wound.\n- Defendant: Murray \"Bubba\" Lawrence\
      \ Jr. Sentenced to life without parole (more than 18 years ago / over 7,500\
      \ days incarcerated as of August 2026). \n- Accused co-conspirator: Jarius McNeil.\
      \ \n- Prosecution: David Whetstone (prosecutor); Robert Wilters (BCDA) presiding\
      \ judge; Lt. Hoss Mack (Sheriff) lead investigator; Hoss Mack Funeral Home handled\
      \ Hastings funeral.\n- Trial evidence omitted from defense: A second autopsy\
      \ of Brandon Hastings, ordered by the DA, signed by the Judge and Sheriff, stating\
      \ cause of death was suffocation (NOT gunshot). No gun, bullets, ballistics,\
      \ DNA, blood, or fingerprints identified as murder weapon during trial. \n-\
      \ Other omitted facts: Fairhope police stopped John Wayne Mixon at 5:01 AM (prosecution's\
      \ body-dump-to-Mississippi timeline impossible); Debra Fudge (last to see Hastings\
      \ alive) never testified; no timeline established.\n\nTHE DISCOVERY:\n- November\
      \ 27, 2023: Rule 32 petition filed on behalf of Lawrence by Haygood Kristi Deason\
      \ (an Assistant BCDA who works for Robert Wilters). \n- The suppressed second\
      \ autopsy report was found and brought to light via this petition. \n- Key statement\
      \ in the State's response (per Haygood/Kristi Deason, cited via Lagniappe’s\
      \ Scott Johnson): “I have no explanation for why this report was not disclosed.\
      \ It was certainly a violation of the discovery order in this case for the state\
      \ not to disclose this second autopsy report.”\n- The State admits suppression\
      \ but calls it \"harmless error.\"\n\nTHE PIVOT:\n- Article 2 (RULE 32) is the\
      \ smoking gun because it contains an official court document (the Rule 32 petition\
      \ and its response) that provides legal proof of the very evidence suppression\
      \ alleged in Article 1.\n- The State's own filed response admits the report\
      \ was \"suppressed willfully rather than inadvertently\" and \"never divulved\
      \ to the defense.\"\n- This admission legally validates the core argument of\
      \ Article 1: The suppressed autopsy proving suffocation (not gunshot) is direct\
      \ evidence of innocence, and its suppression by the same officials (Wilters,\
      \ Mack, Whetstone) who sentenced Lawrence constitutes judicial misconduct.\n\
      \nKEY ENTITIES:\n- Robert Wilters (BCDA / Presiding Judge)\n- Lt. Hoss Mack\
      \ (Sheriff / Lead Investigator)\n- David Whetstone (Prosecutor)\n- Murray \"\
      Bubba\" Lawrence Jr. (Defendant/Incarcerated 20 years)\n- Brandon Hastings (Victim,\
      \ killed April 5, 2003)\n- Jarius McNeil (Co-conspirator accused of killing\
      \ Hastings)\n- Haygood Kristi Deason (Assistant BCDA / Rule 32 Filer)\n- Scott\
      \ Johnson (Lagniappe reporter who obtained/cited the response)"
