  bcso-how-to-become-sheriff:
    brief: 'THE CONFLICT:

      *   **Event:** Conviction of Murray “Bubba” Lawrence Jr. for the 2003 murder
      of Brandon Hastings in Baldwin County, Alabama.

      *   **Date of Incident:** April 5, 2003.

      *   **Outcome:** Lawrence sentenced to life without parole (currently ~20 years
      incarcerated as of 2026).

      *   **Key Accusers/Defenders:** Jarius McNeil (identified Lawrence as co-conspirator
      to save his own life from death penalty threat by Lt. Hoss Mack); David Whetstone
      (prosecutor) asserted cause of death was gunshot; actual killer received life
      *with* parole.

      *   **Missing Evidence:** No physical evidence produced (no gun, bullets, ballistics,
      DNA, fingerprints, blood, crime scene, or confirmed witnesses for Lawrence''s
      presence at the time).


      THE DISCOVERY:

      *   **Timeline of Discovery:** Exhumation and second autopsy occurred immediately
      after the original trial (2003/2004). Report formally found/released in 2023
      via Lagniappe''s "Digging Deep" investigation.

      *   **Cause of Death Contradiction:** Mississippi autopsy (performed by Dr.
      Paul McGarry) determined cause of death was **asphyxiation by strangulation**.

      *   **Suppressed Evidence:** Second Baldwin County autopsy/Coroner''s Report
      confirmed suffocation, contradicting Whetstone’s "gunshot" narrative used in
      trial.

      *   **Willful Concealment:** The report was signed and ordered by Judge Robert
      Wilters (presiding) and investigated/held by Sheriff Hoss Mack, but never disclosed
      to the defense during trial despite a discovery order violation.


      THE PIVOT:

      *   **Innocence Proof:** Article 2 proves Lawrence''s innocence by providing
      definitive exculpatory medical evidence (strangulation vs. gunshot) that directly
      disproves the prosecution''s theory.

      *   **Chain of Custody Confirmed:** The second autopsy was conducted by Dean
      McGowan, John Stewart, and Tony Fuqua, who witnessed the conclusion; however,
      Whetstone/Mack/Wilters ignored it.

      *   **Institutional Corruption Exposed:** Article 2 reveals that the Judge (Wilters),
      Sheriff (Mack), and Prosecutor (Whetstone) deliberately withheld this exculpatory
      evidence from the defense in a capital murder case, establishing "willful and
      deliberate" suppression rather than "harmless error."


      KEY ENTITIES:

      *   **Victim:** Brandon Hastings.

      *   **Defendant:** Murray Lawrence Jr. ("Bubba").

      *   **Accused Co-Conspirator:** Jarius McNeil.

      *   **Law Enforcement/Judicial:** Robert Wilters (District Attorney & Presiding
      Judge); Lt. Hoss Mack (Lead Investigator & Sheriff); David Whetstone (Prosecutor);
      Dean McGowan; John Stewart; Tony Fuqua; Dr. Paul McGarry (Pathologist); Scott
      Johnson (Lagniappe reporter); Haygood Kristi Deason (Assistant DA).

      *   **Locations/Facilities:** Baldwin County, Alabama; Foley; Mississippi; Holman
      Prison; Fairhope (Satellite Courthouse/Police Department).'
