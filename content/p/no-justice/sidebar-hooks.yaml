  railroaded-by-the-law:
    brief: 'THE CONFLICT:

      - In April 2003, Brandon Hastings died in Baldwin County, AL. The official cause
      of death was determined by local coroner Hoss Mack Sr. and prosecutor David
      Whetstone to be a gunshot wound.

      - Murray "Bubba" Lawrence Jr. was convicted of the murder in 2004 (or 2005)
      and sentenced to life without parole. His conviction was based primarily on
      the testimony of co-conspirator Jarius McNeil, who accused him after being offered
      a deal that avoided the death penalty if he named a partner.

      - Lawrence claimed innocence, stating he did not know Hastings had been killed
      and did not possess a gun in connection with the murder. He has served approximately
      20 years (7300 days) in prison since the conviction.


      THE DISCOVERY:

      - A Rule 32 petition filed by Haygood Kristi Deason (Assistant DA for Baldwin
      County) revealed that a second autopsy of Brandon Hastings was ordered by the
      District Attorney''s office, signed by Judge Robert Wilters, and conducted at
      the Alabama Department of Forensic Sciences on May 14, 2003.

      - The resulting autopsy report indicated the cause of death was suffocation,
      not gunshot. This contradicts the original forensic findings that supported
      the prosecution’s theory.

      - Despite this discovery in 2003, and despite a letter from the Alabama Department
      of Forensic Sciences delivering the results to Whetstone (CC’d with Hoss Mack
      Sr. and Lt. Hoss Mack) on May 17, 2004, the report was never disclosed to the
      defense during Lawrence’s trial.

      - The state’s response via Haygood Deason admitted the nondisclosure was "certainly
      a violation of the discovery order" but claimed it was a harmless error and
      asserted ignorance regarding why it was withheld.


      THE PIVOT:

      - The second autopsy report is the "smoking gun" because it irrefutably demonstrates
      that the state (DA Wilters, DA’s agent Whetstone, Judge Wilters, Sheriff Mack
      Sr., Lt. Hoss Mack) had knowledge of a forensic finding contradicting their
      prosecution narrative before trial.

      - The suppression of this evidence was deliberate ("willful and deliberate")
      by individuals who were simultaneously investigating, prosecuting, judging,
      and exhuming the body in the same case.

      - This reveals a systemic collusion among the Sheriff’s Department, District
      Attorney’s office, and Judicial Court to convict Lawrence based on a fabricated
      or unsupported theory (gunshot) while hiding evidence supporting innocence (suffocation).


      KEY ENTITIES:

      1. Murray "Bubba" Lawrence Jr. – Defendant, convicted of murder, serving life
      without parole for ~20 years.

      2. Brandon Hastings – Victim, cause of death disputed between gunshot (official/original)
      and suffocation (second autopsy).

      3. Robert Wilters – Baldwin County District Attorney and Presiding Judge in
      the case; signed the order for the second autopsy and suppressed its results.

      4. Hoss Mack Sr. – Original Baldwin County Coroner; ordered the exhumation/second
      autopsy; ran a funeral home that handled Hastings’ remains; currently retired
      but involved.

      5. Lt. Hoss Mack (son of Mack Sr.) – Lead investigator for BCSO in the case;
      current Baldwin County Sheriff; CC’d on correspondence regarding the second
      autopsy report; personally interviewed McNeil and accompanied him to identify
      the location.

      6. David Whetstone – Prosecutor in the trial; claimed no recollection of ordering
      or receiving the second autopsy despite documentation proving otherwise.

      7. Jarius McNeil – Co-conspirator whose testimony was central to Lawrence’s
      conviction; accused Lawrence after receiving a deal to avoid the death penalty.

      8. Haygood Kristi Deason – Assistant DA who filed the Rule 32 petition on behalf
      of the state, admitting the violation but minimizing its impact.

      9. Judge Scott P. Taylor – Circuit Court judge assigned to the Rule 32 petition;
      did not recuse himself despite conflicts of interest.

      10. Debra Fudge – Co-worker of Hastings, identified as the last person to see
      him alive; did not testify at trial.'
