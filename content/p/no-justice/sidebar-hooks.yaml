  justice-denied-a-wrongful-conviction-buried-by-power-and-politics:
    brief: 'THE CONFLICT:


      - Murray "Bubba" Lawrence Jr. was sentenced in 2005 to life without parole for
      the capital murder of Brandon Hastings (April 5, 2003) in Baldwin County.

      - Prosecution case relied on testimony from confessed co-conspirator Jarius
      McNeil, who allegedly coerced into shifting blame onto Lawrence after being
      threatened with the death penalty.

      - No physical evidence tied Lawrence to the crime: no DNA, fingerprints, murder
      weapon, or ballistic evidence.

      - Lawrence claimed he was at home with his girlfriend and did not know Hastings.

      - Court-appointed lawyer prevented Lawrence from testifying in his own defense.

      - Autopsy of body (exhumated) showed cause of death as suffocation/strangulation
      in Mississippi; prosecution asserted shooting in Alabama and proceeded anyway,
      changing narrative to fit their theory rather than facts.

      - Alibi witnesses (e.g., Debra Fudge, who saw Hastings alive; Fairhope police
      stop at ~4:30–5:01 AM that disproves a 3-hour round-trip body-dumping timeline)
      were never presented or supported.


      THE DISCOVERY:


      - A second autopsy/ coroner’s report on Brandon Hastings—ordered by the district
      attorney and signed by trial judge Robert Wilters, Lt. Hoss Mack (lead investigator),
      prosecutor David Whetstone, and others—was recently unearthed.

      - This report confirmed suffocation as cause of death; it was not disclosed
      to the defense during trial despite a discovery order (a deliberate suppression,
      not an inadvertent mistake).

      - Rule 32 petition filed by Haygood Kristi Deason (assistant DA under Wilters)
      in 2023–2026 resulted in the state acknowledging a violation: Haygood admitted
      “it was certainly a violation of the discovery order in this case for the state
      to not disclose this second autopsy report.”

      - Haygood’s objection response contained inaccuracies, wrong dates, and deliberate
      omissions (e.g., misstating events from Sunday night as April 5 murder night;
      omitting Lawrence’s gun permit; discrediting witnesses based on uncorroborated
      “drug use”; downplaying the 5:01 AM Fairhope police stop).

      - Current status: Wilters, Sheriff Lowery (seeking re-election 2026), and others
      who built the original case now hold high office, while Mack retired to a state-level
      position; Whetstone is retired.

      - Judge Scott P. Taylor presides over the Rule 32 proceeding despite conflicts
      of interest in the county legal system.


      THE PIVOT:


      - The undisclosed second autopsy report directly contradicts the trial narrative
      and establishes that the prosecution knowingly suppressed exculpatory evidence.

      - Its suppression was executed by the same men (Wilters, Mack, Whetstone) who
      built the case—making Article 2 the smoking gun because it converts alleged
      misconduct into documented, admitted evidence of judicial/prosecutorial sabotage.

      - Haygood’s admission that nondisclosure violated discovery rules ties the current
      legal system (led by Wilters and Lowery) directly to the wrongful conviction,
      enabling a credible public demand for accountability before Whetstone/Lowery
      elections or Mack’s state transition.


      KEY ENTITIES:


      - Murray Lawrence Jr.

      - Brandon Hastings

      - Robert Wilters (DA / trial judge)

      - David Whetstone (former DA)

      - Huey “Hoss” Mack (Sheriff Lt./captain, investigator)

      - Anthony Lowery (current Sheriff; former DA office Chief Investigator)

      - Jarius McNeil (co-conspirator/confessor)

      - Haygood Kristi Deason (assistant DA, Rule 32 filer)

      - Judge Scott P. Taylor (presiding on Rule 32)

      - Debra Fudge (alibi witness, never testified)

      - Officer Wendall Thomas, Fairhope PD (5:01 AM stop, no testimony)

      - John Wayne Mixon, Crystal Lindsey, Tonya Mixon (stopped by police that morning)

      - Kathleen Blair Gordon (unreliable alibi witness; tied to McNeil’s girlfriend
      Cynthia Weston and school connection with Hastings)

      - Jeff Shaw (held stolen gun; identified as Fairhope-stolen weapon)

      - Governor Kay Ivey (appointed Lowery as Sheriff)'
