  investigating-the-investigators:
    brief: |-
      THE CONFLICT: Complaint filed against elected official Jack Burrell regarding the Fairhope Airport Authority (FAA) lease of hanger property to board member Ray Hix; lease executed December 17, 2015.
      THE DISCOVERY: Article 2 revealed factual discrepancies in Ray Hix’s bid, including inaccurate claims of aircraft ownership and fuel usage estimates (100,000–110,000 gallons vs. 85,000–95,000 gallons), and noted the hanger was less than 50% complete 27 months after the lease signing.
      THE PIVOT: Article 2 provides concrete, verifiable evidence of potential bid inaccuracies and Hix's role on the FAA board (6 months prior to the bid), contradicting Mr. Burrell's later claims (in Article 1) that no RFP was necessary and that the hanger did not profit "anyone."
      KEY ENTITIES: Jack Burrell, Ray Hix, Fairhope Airport Authority, Ethics Commission, Rick Kingrea, Karin Wilson, Mayor Kant, Pittman, Joe McEnerney, Brown, Boone, Robinson, Conyers, Sullivan, Wilson.
    llm_text: Jack Burrell criticized Ray Hix’s 2015 FAA hanger lease, but new evidence reveals Hix made factual bid discrepancies, including inaccurate fuel usage claims. Find out how Hix, a board member, misrepresented the project when Burrell claimed it profited no one.
