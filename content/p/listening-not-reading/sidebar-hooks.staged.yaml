  all-smoke-and-mirrors:
    brief: |-
      THE CONFLICT:
      *   A complaint was filed against Council President Jack Burrell and Mr. Hix regarding the Fairhope Airport Authority.
      *   The Authority did not issue an RFP for a hangar property lease ($750,000) because Mr. Hix was on the board, violating Ethics Commission mandates requiring a bid process for public officials dealing with entities they serve.
      *   Councilman Rick Kingrea sent a "plain vanilla request" to the Attorney General on 1/12/11 regarding possible ethical and criminal violations, referencing the BP oil spill.
      *   Mayor Kant faced opposition from Council members (Boone, Brown, Burrell) who voted down his appointments to the Airport Authority, while Robinson and Conyers voted for them.
      *   Mayor Kant fired two employees, leading the council to implement a hiring/firing freeze that held up 43 personnel.

      THE DISCOVERY:
      *   The Fairhope Airport Authority debt is 21% of the city’s debt, which citizens pay through appropriation.
      *   The Authority employs "smoke and mirrors" tactics, exemplified by using tax dollars to hire attorneys to investigate and discredit private citizens who file legitimate complaints against the board.
      *   The Baldwin County Mega-Site cost $32 million but has seen no buyers after five years, highlighting potential mismanagement in local development.

      THE PIVOT:
      *   Article 2 establishes a historical pattern of the Airport Authority using tax dollars and opaque processes to intimidate whistleblowers and cover up wrongdoing.
      *   Article 1 demonstrates this pattern being applied in the current ethical complaint against Burrell and Hix concerning the non-bidding of a $750,000 lease, proving the alleged misconduct is not isolated but systemic within the Authority.

