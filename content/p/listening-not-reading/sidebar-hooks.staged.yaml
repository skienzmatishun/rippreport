  court-public-opinion-now-session:
    brief: |-
      THE CONFLICT: Lease for Fairhope Airport hanger was signed (Dec 17, 2015) while the Ethics Commission Advisory Opinion was pending (Feb 3, 2016), violating ethics guidelines requiring a bid process for public officials dealing with entity they serve. Mr. Jack Burrell (City Council President, Airport Authority Board member) was involved in negotiating and selection. Mr. Hix (Airport Authority Board member, Sec. Treasurer) was the winner bidder (Mid-Bay Air LLC).
      THE DISCOVERY: The RFP process was "grossly flawed and gerrymandered" and Mr. Burrell aided and abetted it. Mr. Hix gained privileged information from Executive Aviation between April and July 2015 before the RFP, and his bid lacked truthful information (e.g., aircraft ownership).
      THE PIVOT: Article 2 provides documented evidence (dates, specific ethics violations, Hix's access to information, flawed bidding details) which forms the factual basis for the ongoing ethics complaint and political disputes against Mr. Burrell detailed in Article 1.
      KEY ENTITIES: Jack Burrell, Mr. Hix, Fairhope Airport Authority, Ethics Commission, Karin Wilson, Rick Kingrea, Kevin Boone, Robert Brown, Jimmy Conyers, Jay Robinson, Mid-Bay Air LLC, Terry Chapman, Kel Jones, BP, Pittman.
    llm_text: Did Fairhope Council President Jack Burrell and Mr. Hix illegally bypass the bid process for the airport hangar lease? Documented evidence shows Hix gained privileged info before the RFP, fueling ethics complaints against Burrell.
