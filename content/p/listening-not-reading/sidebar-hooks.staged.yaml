  jack-box-airport:
    brief: |-
      THE CONFLICT:
      *   A complaint exists against Councilman Jack Burrell and Ray Hix regarding the Fairhope Airport Authority.
      *   The complaint centers on the lease of hanger property, valued at $750,000, which houses a $1 million airplane.
      *   The Ethics Commission maintains that public officials must use a bid process when doing business with the entity on which they serve.
      *   The Authority was compelled to bid because Hix was on the board.
      *   In the past (1/12/11), Rick Kingrea sent a "plain vanilla request" to the Attorney General regarding alleged ethical and criminal violations.
      *   Currently, Mayor Karin Wilson is in office following a fair election supervised by the Sec. Of State.
      *   The City Council (including Boone, Burrell, and Brown) voted against Mayor Wilson's appointments, leading to a hiring and firing freeze that holds up 43 personnel.
      *   Mayor Wilson saved the city $90,000 by refusing to take two salaries.

      THE DISCOVERY:
      *   The Fairhope Airport Authority initially intended to use tax dollars to hire the "top ethics attorney in Alabama" to investigate the complaint against Burrell and Hix.
      *   This ethics attorney was Ray Hix's attorney, who prepared the lease in question.
      *   Hix was paid to prepare a request for an Advisory Opinion from the Ethics Commission.
      *   Ethics Commission Chief Council Hugh Evens blind copied Mr. Bailey (Hix's attorney) after a Fairhope resident inquiry.

      THE PIVOT:
      *   Article 2 establishes that the initial investigation/defense of the complaint against Burrell and Hix was compromised and self-serving, using Hix's paid attorney and public tax dollars, rather than being an independent ethical review.
      *   This context proves that the current political disputes and the Council's focus on Burrell's alleged guilt (Article 1) stem from a pre-existing, compromised institutional process concerning the Airport Authority.

      KEY ENTITIES:
      *   Jack Burrell (City Councilman/Board Member)
      *   Ray Hix (Board Member/Sec. Treasurer for Authority)
      *   Karin Wilson (Mayor)
      *   Mayor Kant
      *   Rick Kingrea
      *   Hugh Evens (Ethics Commission Chief Council)
      *   Mr. Bailey (Hix's Attorney)
      *   Fairhope Airport Authority
      *   Ethics Commission
      *   Boone, Brown, Robinson, Conyers (City Council members)
    llm_text: Councilman Jack Burrell and Ray Hix face an ethics complaint over a $750,000 hangar lease at Fairhope Airport Authority. Worse, the initial investigation used Hix's paid attorney and public tax dollars, compromising the entire ethical review.
