  i-see-you:
    brief: |-
      THE CONFLICT:
      - Historic preservation in Fauxhope was discussed across the last 6 councils; each time the discussion "died a slow death"; this time described as "will be a heart attack."
      - Historic preservation, water, infrastructure, annexing, and continuously lying to constituents "goes hand in hand" with the Mayor and Council, voted in and supported by developers.
      - Fauxhope city government described as "100% pro development"; will provide all city services to developers first.
      - Draft ordinance came months after demolition of historic buildings around Fairhope, including the home of Nancy Lewis, a woman who lived in Fairhope after being freed from slavery.
      - Mayor Sherry Sullivan called the draft "a good start"; if the ordinance were up for a vote that night, Sullivan said she would advise the council not to pass it due to workload on city employees and the extra government body it could create.
      - Councilman Kevin Boone: "bottom line I have and always had is money"; Boone is a developer and works with developers when not a councilman; history of supporting back room good ole boy politics.
      - Fairhope voted for the good ole boys to take back "TOTAL control" of Fairhope city government; total control meaning Mayor/Utility Director, City Council, City Attorney and Municipal Judge.

      THE DISCOVERY:
      - Fauxhope City Council agenda, Monday, 22 May 2023.
      - Resolution 5: Appointment of Municipal Judge – Haymes Snedeker; The Honorable Jody W. Bishop, Circuit Judge, 28th Judicial Circuit, State of Alabama.
      - Snedeker is the largest developer in Fauxhope; his projects must be approved by the City Council; conflict of interest?; council will approve his infrastructure needs.
      - Resolution 11: Award Bid No. 23-025-2022-PWI-007 Fairhope Clock Plaza to RH Deas Building Co., LLC, total not-to-exceed $282,211.00, includes a 10% contingency and Alternate 01.
      - Clock Plaza described as a "postage stamp piece of property"; most expensive piece of property in Fauxhope; past failures of the council have cost taxpayers over $600,000.00 and still climbing.
      - Resolution 13: Approve procurement for Intelligence-Led Policing Sensor Kits for the Police Department from ProTecVideo, LLC as sole source provider of the tag.NET program; authorized based on the option allowed by the Code of Alabama 1975, Section 41-16-51(13); total will not-to-exceed $20,000.00.
      - Council approved the tag reader and video without any public notice or discussion; described as a city revenue producing program, paid and fined by taxpayers, rubber stamped by council.

      THE PIVOT:
      - Article 2 (Widget, "I SEE YOU") shows the council approving agenda items without public discussion, while Main Article 1 discusses historic preservation, infrastructure, and pro-development behavior.
      - Article 2's agenda items – Snedeker Municipal Judge appointment, Fairhope Clock Plaza award to RH Deas, policing sensor kit – align with Main Article 1's claims about the council providing city services to developers first and doing what THEY damn well want without public discussion.
      - Cory the Crier went on TV supporting the Fauxhope Municipal Judges east side project; priority is infrastructure for commercial projects; Cory "bitten the poison apple of developers"; council will have to approve the Judges project and the council appoints the Judge; will pass with flying colors – parallels the Snedeker judicial appointment in Article 2.

