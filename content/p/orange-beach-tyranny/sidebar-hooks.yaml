  sheriff-huey-boss-mack-secret-police-2:
    brief: 'THE CONFLICT:

      *   Tony Kennen was Orange Beach mayor in Baldwin County, Alabama.

      *   Labor Day 2024 (September 2): A police call to 911 was made about a disturbance
      on the balcony of the Coastal Resources building.

      *   Witnesses alleged Mayor Kennen grabbed a woman by her hair and struck her
      three times, leaving her limp.

      *   When officers arrived, Kennen claimed he was in his "second office" inside
      the building with his wife and denied anything illegal occurred.

      *   Councilman Robert Stewart and Councilwoman Ginger Harrelson and others petitioned
      the Alabama Ethics Commission to investigate allegations of interference with
      public records and legislative items regarding the incident.


      THE DISCOVERY:

      *   Article 2 reveals that Baldwin County Sheriff Huey "Boss" Mack was operating
      under a judicial shield ("secret police") that restricted all civil liberties.

      *   A September 30, 2021 legal decision (Lagniappe) issued by U.S. District
      Court Judge William Cassady effectively barred public access to law enforcement
      records connected in any way to an investigation in Alabama, including body
      cam/surveillance video, 911 transcripts, and autopsy information.

      *   Chief Justice of Alabama Tom Parker called this a "Closed Records Act,"
      noting it extinguished statutory rights to access evidence in law enforcement
      custody.

      *   The BCSO (Baldin County Sheriff''s Office) previously investigated its own
      officers for multiple deaths—including the fatal shootings of Jonathan Victor,
      Robert Yates, and Kevin J Andrews—without requesting FBI assistance or utilizing
      ALEA capabilities.


      THE PIVOT:

      *   Article 2 is the "smoking gun" for Article 1 because the Lagniappe legal
      shield (issued in 2021) legally prevents anyone from accessing, reviewing, or
      publicly releasing surveillance video, audio, or physical evidence related to
      the 2024 Labor Day incident involving Mayor Tony Kennen.

      *   Because Sheriff Mack''s office holds these records in a judicially protected
      status, the Ethics Commission and local council members investigating the alleged
      brutal attack cannot access the raw footage or transcripts needed to prove that
      Kennen assaulted the woman on the balcony.

      *   The "secret police" nature of the BCSO (as revealed in Article 2) explains
      why grassroots groups like Murder Creek Media must rely on witness statements
      instead of physical evidence, and why local government accountability is effectively
      closed off from public scrutiny.


      KEY ENTITIES:

      *   Tony Kennen (Orange Beach Mayor)

      *   Huey "Boss" Mack (Baldwin County Sheriff)

      *   Harry Still (Retired Attorney / Podcast Host)

      *   Brandon Moseley (Reporter / Podcast Host)

