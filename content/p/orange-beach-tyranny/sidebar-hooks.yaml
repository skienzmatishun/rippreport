  cover-up:
    brief: 'THE CONFLICT:

      - Orange Beach, Alabama Mayor Tony Kennon (serving since 2008) had his first
      public response in July 2025 regarding a September 2, 2024 incident at the Coastal
      Resources building.

      - On Labor Day weekend, 2024 (Sep. 2), a bartender from Pleasure Island Tiki
      Bar reported to police that she saw a naked man on the balcony of the city-owned
      Coastal Resources Building across the canal grab a woman by her hair, hit her
      three times, and drag her into a second-floor office suite while screaming,
      "Don''t you ever walk out on me!"

      - Police responded for a welfare check; officers did not contact the male subject
      inside. The supplemental report later identified an "alleged victim Ms. Kennon."

      - In 2005, while serving on city council less than a year into his term, Kennon
      resigned amid allegations of a sexual harassment lawsuit settlement (Jil Walker
      case settled by the city for $47,500 in 2010 with a gag order).

      - A separate anti-LGBTQ+ discrimination lawsuit settled in 2023–2024 cost just
      under $300,000, with Kennon listed as defendant in individual and official capacity.


      THE DISCOVERY:

      - The Ripp Report''s "COVER UP" article (dated March 21, 2023) detailed the
      killing of O.J. French Jr., a 32-year-old Black man, by Bay Minette police on
      August 20, 2021, after an officer pulled him over for a blinker light violation.

      - The article exposed that Alabama Ethics Commission Executive Director Tom
      Albritton (who dismissed ethics complaints against both Mayor Bob Wills and
      himself) was simultaneously accused of fraud and self-dealing in court documents
      by Attorney General Steve Marshall regarding the Mabel Amos Memorial Fund (MAMF).

      - It revealed that Mayor Bob Wills had rented his building to the Baldwin County
      Legislative Delegation for a total of $867,000 over 15 years despite pending
      ethics and Alabama Bar complaints.

      - The article alleged that BCMCU (Baldwin County Major Crimes Unit) had no credibility
      because Bay Minette Police Chief Al Tolbert was its chairman, effectively investigating
      his own agency.


      THE PIVOT:

      Article 2 is the "smoking gun" for Article 1 because it establishes the systemic
      pattern of cover-ups and ethical dismissal that directly contextualizes Kennon''s
      2024 incident. The Ripp Report documents how local political leaders in Baldwin
      County use state-level agencies (Ethics Commission, Alabama Bar) to silence
      investigations into police misconduct and corruption—precisely the mechanism
      by which a domestic violence incident involving the mayor could be concealed
      or dismissed under cover.


