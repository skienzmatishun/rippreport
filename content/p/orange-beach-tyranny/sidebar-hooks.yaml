      an incident inside the Coastal Resources Building (a city-owned facility in
      Orange Beach, AL). A witness (Tierra Morrill, employee at Tiki Bar) reported
      seeing a "butt naked" man grab a woman by her hair and strike her.

      - The man behind the door identified himself as "Tony Kennon, the mayor," saying
      it was "my office." He said his wife Paula Kenyon was with him and that nothing
      illegal had occurred.

      - Police response: Officers interviewed the alleged victim (Ms. Kennon) but
      did not interview the woman who witnessed the incident from across the waterway.

      - A supplemental report later indicated an officer contacted "alleged victim
      Ms. Kenon" four days after the incident as a welfare check. She confirmed no
      incident occurred.

      - The body camera footage was withheld from public access. C.C. Dixon-Moreno
      (local attorney and social media activist) filed an open records lawsuit in
      August/September 2025 seeking the footage, which was initially dismissed by
      federal Judge Jeffrey Beaverstock on September 2'
