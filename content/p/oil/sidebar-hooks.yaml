  sheriff-mack-out-oj-french-lawsuit-in:
    brief: 'THE CONFLICT:

      - 2017–2019 (period cited in article): Venezuela, under Hugo Chávez, seized
      oil projects owned by foreign companies, including ExxonMobil and ConocoPhillips.

      - Contracts were broken; assets taken; agreed compensation not paid (expropriation).

      - U.S. firms took the case to international arbitration (ICSID, ICC) and U.S.
      courts; Venezuela lost.

      - Judgments described as final, binding, enforceable; Venezuela ordered to pay
      tens of billions in damages.

      - Key award detail (per current reporting): ConocoPhillips won an ~$8.5–8.7
      billion ICSID/ICC award (decided January 2015; ICC award later confirmed/reinforced
      around Jan 2025). ExxonMobil received a ~$1.6 billion award from 2014 that was
      still contested in late 2025. Article 1 uses an aggregate of ~$35 billion unpaid
      judgment and a $62/barrel oil price to estimate roughly 300 VLCC-sized tankers
      ($115 million net each) would be needed to satisfy the debt.


      THE DISCOVERY (Widget Article — Sheriff Mack / OJ French Case, August 2024):

      - Family of OJ French Jr, Bay Minette Justice League, and May Jung LLC held
      a rally on July 31, 2024 revealing a federal lawsuit against the City of Bay
      Minette and Officer Brandon Thompson.

      - Claims in lawsuit: Officer had no probable cause for stop; escalated by demanding
      victim out of vehicle; struggle over taser; Thompson shot and killed French
      Jr (date not given; event pre-dates July 31, 2024 rally).

      - Video of the killing withheld from public record; Grand Jury cleared Thompson.

      - Sheriff Mack announced resignation mid-July, taking effect mid-August 2024;
      he asked that Chief Deputy Anthony Lowery be appointed to finish his term by
      Governor Kayy Ivey.

      - County Commissioner Matt McKenzie also wants the deputy-sheriff/assistant
      sheriff post.

      - Mayor Robert “Bob” Wills claimed family was “okay with the outcome” and that
      he spoke for them; Mr. French said this was a lie.

      - Article 1’s “old Indian wisdom” (silence better than bullshit) is framed as
      coming from a podcast/Backstory #179 and applied to the situation.


      THE PIVOT:

      The widget article shows the local enforcement chain in Baldwin County, AL —
      a sheriff who resigned over alleged police brutality with an officer acquitted
      by grand jury, a mayor who allegedly misrepresented victims, a state governor
      expected to fill the vacancy, and county commissioners competing for power.
      The same pattern of “enforcement” without accountability — seizing/using force
      while claiming legal authority, then hiding evidence — is exactly what Article
      1 argues Trump is doing at the international level: using court orders (or claiming
