      court rulings against Venezuela; Venezuela was ordered to pay tens of billions
      in damages (article estimates ~$35 billion) but refused to comply.

      - Article 2 context: The city of Fairhope faced the same pattern of refusing
      a favorable settlement: under former mayor “Can’t,” councilmen Boone and Burrell
      (and 3 members voted out), the city refused to settle the Triangle Lawsuit,
      letting it cost the city $11.25 million versus a possible < $1 million settlement.


      THE DISCOVERY:

      - Article 2 reveals a documented local precedent of a government (Fairhope under
      mayor Can’t/council Boone & Burrell) repeatedly refusing to pay settlements,
      refusing to negotiate, and letting legal costs balloon to tens of millions by
      pursuing litigation to its end rather than settling — mirroring Venezuela’s
      refusal to satisfy the ~$35 billion judgment.

      - Article 2 also shows how “Catalyst Council” obstruction (refusing settlement,
      spending thousands in attorney fees, using intermediates/structure like changing
      voting dates) parallels how Venezuela structured exports to avoid enforceable
      jurisdictions/seizures.


      THE PIVOT:

      - Article 2 is the smoking gun for Article 1 because it provides a concrete,
      real-world case where refusing a favorable court judgment/settlement led to
      massive financial losses and demonstrated that “enforcement” follows inevitably
      when a party wins in court and refuses to pay — exactly the mechanism Trump
      argues applies to Venezuela’s ~$35 billion debt (requiring seizure/sale of ~300
      oil tankers at ~$115M net each).

      - The Fairhope example shows that legal rulings “are inevitable,” not optional,
      once a party loses and refuses to comply — the same principle Trump is invoking
      for Venezuelan tanker seizures.


      KEY ENTITIES:

      - Hugo Chávez (Venezuela leader in 2000s)

      - ExxonMobil (U.S. company expropriated by Venezuela)

      - ConocoPhillips (U.S. company expropriated by Venezuela)

      - Donald Trump (president proposing tanker seizures for judgment enforcement)

      - Venezuela (debtor state with ~$35B unpaid court judgments)

      - Fairhope (city whose leadership refused to settle favorable cases)

      - Mayor Wilson (current Fairhope mayor praised in article)

