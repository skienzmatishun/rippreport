      - Boone (Fairhope councilman who refused Triangle settlement)

      - Burrell (Fairhope councilman who refused Triangle settlement)

      - Catalyst Council (Fairhope group accused of obstruction/overthrowing government)

      - Triangle Lawsuit (Fairhope case costing $11.25M due to refusal to settle)

      - Buddy Breland (developer whose lawsuit mirrors Triangle case; Alabama Supreme
      Court ruled in his favor)

      - Dean Mosher / Matt Bowers (developers involved in Fairhope clock preservation)

      - Ronan McSharry / McSharry Bar and Restaurant (bar owner, green card holder,
