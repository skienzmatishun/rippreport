  fly-creek-erosion-and-hidden-development-threats:
    brief: |-
      THE CONFLICT:
      *   40 years: Owners of the Triangle property were denied all proposed city projects.
      *   2011: Complaint filed against Mayor Kant and Senator Pittman for grant fraud related to BP funds.
      *   2013 (March): Mayor Kant commissioned a $30,000 study by Thompson Engineering for the Fly Creek Watershed Restoration Project.
      *   Settlement: The Triangle lawsuit settlement cost $12 million and was conducted without public participation.

      THE DISCOVERY:
      *   Fly Creek (behind Publix) has severe erosion, with banks collapsing over 20 feet.
      *   A $14,700,000 project (Mobile Bay Preservation and Restoration) was proposed to protect against development, which includes 275 apartments and 15 townhomes on 40 acres within the Fly Creek watershed.
      *   Arthur Corte, a non-resident landowner, influenced the shift of the Publix development from the Triangle to his property.
      *   The fire station location is confirmed to be for the developer’s benefit, including reduced insurance rates.

      THE PIVOT:
      *   Article 2 establishes a 40-year pattern of the city (under Mayor Kant/Council) denying public input and favoring developers (Corte) over community/environmental needs (Fly Creek erosion).
      *   Article 1 demonstrates the continuation of this pattern: The Mayor and Council are pushing a fire station (a clear comprehensive plan violation) and providing free infrastructure upgrades (sewer, lift station, water main) to the same developer, while simultaneously planning new taxes without public input.
      *   The $12 million secret settlement noted in both articles confirms the Council's historical refusal to include citizens in major decisions.

      KEY ENTITIES:
      *   Mayor Kant
      *   Arthur Corte
      *   Fairhope City Council
      *   Publix
      *   Triangle
      *   Parker Road
      *   Fly Creek
      *   Thompson Engineering
      *   $500,000 (fire station cost)
      *   $12 million (lawsuit settlement cost)
      *   $14,700,000 (watershed project cost)
      *   December 27, 2014
    llm_text: Mayor Kant and the Fairhope City Council denied public input for 40 years, settling the Triangle lawsuit for $12 million. Now, they push a $14.7M Fly Creek project favoring Arthur Corte's development over protecting the severely eroding Fly Creek.
