    brief: |-
      THE CONFLICT:
      *   Lynn Stacy partnered with Chris Elliott and Dane Haygood to form Stacy, Haygood and Elliott.
      *   Haygood became Mayor of Daphne; Elliott became a county commissioner.
      *   The concept of this partnership continued under the name CATALYST after the initial group dissolved.
      *   CATALYST candidates ran in the Baldwin County mid term elections in 2018 but were unsuccessful.
      *   On January 29, a hearing for Savannah ESTATES (54 E. and 64) occurred where County Commissioners Joe Davis and Jeb Ball voted to keep the project going, despite opposition from city and county engineers.

      THE DISCOVERY:
      *   Chris Elliott, as newly elected State Senator, co-sponsored a bill granting him $7,500 per year in travel expenses.
      *   This funding was intended for travel to international events, specifically the Paris Air Show, which he attended as a county commissioner.
      *   Elliott increased taxes and supported bridge tolls while prioritizing this travel expense over other state funds (e.g., $50,000 for a painting by Dean Mosher).

      THE PIVOT:
      *   Article 2 provides historical context showing Elliott prioritized personal financial gain (travel expenses) as a State Senator, aligning with the self-serving, "entitled good ole boys" mentality described by CATALYST in Article 1.
      *   Article 1 details CATALYST's role in obstructing Fairhope government and favoring developers, and Elliott's early self-interested political actions (Article 2) demonstrate the pattern of political behavior inherent to the CATALYST network.

      KEY ENTITIES:
      *   Chris Elliott (State Senator/County Commissioner)
      *   Lynn Stacy
      *   Dane Haygood
      *   CATALYST
