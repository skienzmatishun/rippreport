  congressional-catalyst:
    brief: |-
      THE CONFLICT:
      - Last Fairhope municipal election: Ripp Report supported most of the City Council, including Jack Burell; focus was electing a new mayor.
      - Prior three elections: mayor ran the city day by day; decisions were made by a select few, “good ole boys”; infrastructure was ignored; good ole boys were rewarded.
      - Lynn Stacy, who has left this earth, was the major power broker for political candidates; he bragged about a 100% success rate.
      - Stacy partnered with Chris Elliott and Dane Haygood to form Stacy, Haygood and Elliott.
      - Haygood became Mayor of Daphne; Chris Elliott became a county commissioner.
      - When Elliott became county commissioner, Stacy, Haygood and Elliott dissolved, but not the concept; just the name.
      - CATALYST, located in Fairhope, was to carry the flag of the entitled “good ole boys.”
      - CATALYST new manager became Scott Boone, the son of Fairhope Councilman Kevin Boone, who is the deep throat of the council.
      - CATALYST job was to obstruct Fairhope government, attack the Mayor, who is NOT CATALYST.
      - CATALYST first plan was to drive the Mayor out of office before 2020; they failed, now they face an election where they cannot tamper with the ballot box.
      - CATALYST candidates invaded the Baldwin County mid term elections of 2018.
      - CATALYST was not successful in electing their block of candidates of 2018; social media alerted the general public and voters responded.
      - Some CATALYST candidates were elected, but many lost; CATALYST became the identity of a party that was not in the best interest of Baldwin County citizens.

      THE DISCOVERY:
      - In 2018 CATALYST made a move to take over the County.
      - CATALYST should be feared; they threaten honest government and represent the very opposite, political corruption.
      - CATALYST candidates occupy the Fairhope City Council.
      - The Fairhope City Attorney is a hand me down, as is the Fairhope Municipal Judge, of the good ole boy CATALYST network of past Fairhope administrations.
      - CATALYST and the Fairhope City Council operate like a criminal enterprise.
      - FBI defines a criminal enterprise as “a group of individuals with an identified hierarchy, or comparable structure, engaged in significant criminal activity.”
      - CATALYST is an organization that in no way is looking out for citizens’ best interests; CATALYST has hijacked the soul of the Baldwin County Republicans and they bank on the party to cover their tracks, while they drag the party and good people through the mud.
      - CATALYST wants to regain control of Fairhope and Baldwin County and now the First Congressional District; Fairhope needs to remove the CATALYST cancer from its government and judiciary.
      - Bill Hightower IS the CATALYST candidate, supported by Fairhope Municipal Judge/developer Snedeker and former State Senator BP Boom Boom Pittman and of course the CATALYST Fairhope City Council.
      - You have four other choices for Congressmen, that are NOT CATALYST; please tell your friends and family, the last thing we need is for CATALYST to be our congressional representative.

      THE PIVOT:
      - Article 2 is older/background context for Article 1.
      - Article 2’s 2018 CATALYST move and Bill Hightower congressional context frames Article 1’s CATALYST/Fairhope/Baldwin County narrative.
      - Article 2 is the smoking gun because it establishes CATALYST’s alleged 2018 takeover move and CATALYST congressional candidate before Article 1’s 2020 Fairhope/Congress context.
      - Article 2 supports reading Article 1’s CATALYST claims as history/escalation: CATALYST first plan was to drive the Mayor out before 2020; failed; now they face a 2020 election; CATALYST now running a CATALYST candidate for the First Congressional District.

      KEY ENTITIES:
      - Names: Lynn Stacy, Chris Elliott, Dane Haygood, Scott Boone, Kevin Boone, Jack Burell, William Rando, Joe Davis, Jeb Ball, Bill Hightower, Bradley Byrne, Snedeker, BP Boom Boom Pittman, Tim Can’t.
      - Organizations: CATALYST, Stacy, Haygood and Elliott, Fairhope City Council, Baldwin County Citizens for Government Accountability (CGA), District Attorney’s office, Sheriff’s office, Baldwin County Judiciary, FBI, Baldwin County Republicans, developers.
      - Locations: Fairhope, Baldwin County, Daphne, Bay Minette, Baldwin County, Alabama, First Congressional District, Savannah Estates, Baldwin County sewer regulations.
      - Positions/titles: Fairhope Councilman, City Attorney, Municipal Judge/Developer, County Commissioner, Mayor, State Senator, U.S. Congressman/Congressional candidate, District Attorney, Sheriff, Judge.
      - Lowery, Wilters: not identified in the provided articles.
