  catalyst-open-letter-to-baldwin-county-district-attorney:
    brief: |-
      THE CONFLICT:
      - Fairhope City Councilman Kevin Boone submitted a public complaint to Baldwin County District Attorney Robert Wilters accusing Fairhope Mayor Wilson of violating the law.
      - Kevin Boone publicized the complaint via the *Courier* newspaper and WABF 1480 AM (WACO radio).
      - An open letter was sent to District Attorney Robert Wilters demanding that his office recuse itself from Kevin Boone's allegations due to the DA's historical ties to the shadow political group "Catalyst."
      - The political group Catalyst, its network of developers, and allied local officials (including County Commissioners Joe Davis and Jeb Ball) have worked to obstruct Fairhope city government, push developer-friendly policies (such as supporting the 392-house Savannah Estates project despite zero county sewer regulations), and attempt to unseat Mayor Wilson.
      - Past political operatives like Lynn Stacy formed firms (Stacy, Haygood and Elliott with Chris Elliott and Dane Haygood) that evolved into the modern Catalyst network, placing loyalists in positions across the Baldwin County Judiciary, Sheriff's Office, and District Attorney's Office.

      THE DISCOVERY:
      - Historical records and prior open letters demonstrate that key local officials—specifically District Attorney Robert Wilters, Fairhope Councilman Kevin Boone, and Councilman Jack Burrell—have deep, documented ties to the Catalyst political machine.
      - District Attorney Wilters previously supported Catalyst-backed candidate Lynn Perry for Probate Judge and discouraged opposing candidate Harry D’Olive from running.
      - Councilman Kevin Boone used his position and media allies (*Courier* and WACO radio) to weaponize the DA's office against Mayor Wilson, while simultaneously using his son, Scott Boone (manager of Catalyst), as a conduit for inside city information.
      - Councilman Kevin Boone shares numerous LLCs with John Avant, and Councilman Robert Brown secured a no-bid contract with the Fairhope Art Center where he serves as a board member, illustrating systemic self-dealing by the council majority.

      THE PIVOT:
      - The older open letter to DA Robert Wilters serves as the smoking gun because it establishes the pre-existing, corrupt playbook of the Catalyst network years before the current municipal clashes and county commissioner votes (such as the Savannah Estates approval). It shows that the attacks on Mayor Wilson by Councilman Kevin Boone and the institutional protection of Catalyst figures by DA Robert Wilters are not isolated incidents, but part of a long-running, coordinated conspiracy to control Baldwin County politics and shield developer interests from accountability.

      KEY ENTITIES:
      - Robert Wilters (Baldwin County District Attorney)
      - Kevin Boone (Fairhope City Councilman)
      - Scott Boone (Catalyst Manager / Kevin Boone's son)
      - Mayor Wilson (Fairhope Mayor)
      - Lynn Stacy (Political Power Broker / Stacy, Haygood and Elliott)
      - Chris Elliott (County Commissioner / former partner at Stacy, Haygood and Elliott)
      - Dane Haygood (Mayor of Daphne / former partner at Stacy, Haygood and Elliott)
      - Joe Davis (Baldwin County Commissioner)
      - Jeb Ball (Baldwin County Commissioner)
      - William Rando (Citizen / CGA member)
      - John Avant (Business associate of Kevin Boone)
      - Jack Burrell (Fairhope City Councilman)
      - Robert Brown (Fairhope City Councilman)
      - Lynn Perry (Probate Judge candidate)
      - Harry D’Olive (Probate Judge)
      - Hoss Mack (Baldwin County Sheriff)
