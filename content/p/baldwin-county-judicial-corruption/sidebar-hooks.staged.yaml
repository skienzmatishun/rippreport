  sheriff-huey-boss-mack-secret-police-2:
    brief: |-
      THE CONFLICT:
      - Baldwin County, Alabama: Baldwin County Sheriff’s Office (BCSO), Sheriff Hoss “Boss” Mack, and judicial/prosecutorial allegations.
      - BCSO allegedly had criminal cases and loss-of-life cases questioned by citizens for about 20 years.
      - BCSO allegedly used its “internal” Major Crimes Division to gloss over complaints.
      - Sheriff’s deputies never found responsible, EVER; no accountability and no transparency.
      - Hoss Mack promised County Commission that body and car cameras, $600,000.00 worth, were for public as well as police.
      - Same Sheriff either did not release any camera footage or released edited footage.

      - Several legal cases pending against Sheriff Hoss Mack.
      - Recently evidence discovered in a case described as “riddled with failures by the state”; totality of case calls into question motive to convict innocent man.
      - Most glaring motive: self promotion, at all costs.
      - Evidence was “suppressed willfully rather than inadvertently” and never divulged to defense of Murray Lawrence.
      - Murray Lawrence incarcerated 20 years.
      - Suppressed evidence proves he was innocent.
      - Sheriff Hoss Mack, District Attorney Robert Wilters who was the Judge, and prosecutor David Whetstone knowingly and willfully withheld newly found evidence; signatures appear in evidence.
      - Does not only prove Murray Lawrence innocent but supports allegations against authorities in previous cases alleging judicial misconduct.

      THE DISCOVERY:
      - Article 2, “SHERIFF HUEY ‘BOSS’ MACK - SECRET POLICE,” provided background/context at the time:
      - BCSO headed by Huey “Hoss” Mack had funding of over $65 million in 2020 and 2021.
      - Over $700,000.00 went for body and vehicle cameras.
      - Sheriff solicited “taxpayer” funds from County Commission with sales pitch cameras would protect police and citizens alike.
      - Sheriff further stated cameras would promote accountability and transparency within BCSO.
      - Not only were his words hollow, but actions generated several lawsuits resulting from deaths that could end up with multi million dollar verdicts against BCSO.

      - General fund, Baldwin County, swelled 19.2 percent from $39.8 million in 2021 to $47.5 million in 2022.
      - Public safety expenditures represent 19.1 percent of total budget.
      - Sheriff’s Office received flat funding over last year at $33.6 million.

      - Sheriff Mack’s second term in office was secured by Sheriff Mack himself, with help of then State Senator Trip Pittman.
      - They wrote and legislatively recorded qualifications for sheriff which eliminated 99.5% of competition.
      - Some would call this election rigging.

      - Skeletons in BCSO closet:
        - Jonathan Victor: May 2017—deceased—shot to death, unarmed, by BCSO.
        - Sheriff Mack told Tenenbaum that, at the time, BCSO had no crisis intervention team and deputies had not been specifically trained in DE-escalation techniques.
        - U.S. District Court Judge William Cassady: “Without question, ‘the standard for excessive force is clearly established,’” against Hunaday; plaintiff made adequate showing of recurring situation presenting obvious, highly predictable potential for violation that can trigger liability for failure to train, even in absence of pattern of violations.
        - Robert Yates: March 5, 2018—deceased—shot to death by BCSO.
        - Defendants were dead-set on killing Yates; at or about 6:30 p.m., decision made to breach Yates residence with all SWAT team’s firepower; situation was not exigent, nor emergency, nor had Yates threatened anyone’s life since firing warning shot inside home.
        - Based on bullet holes in Yates’ home and shell casings found outside, SWAT team members shot home up with military style weapons without probable cause; Yates had been silent for several hours.
        - More than 114 shells/bullet casings, along with tear gas canisters and concussion grenades left at scene.
        - Alleged SWAT team member was Deputy Justin Correa, son of Robert Correa.
        - Complaint claims Robert Correa warned son about potential conflict of interest; younger deputy said he was “gonna go in and kill this f\*cker if I have to.”

      - Dominic Garcia Jr., Crystal Lee Moradie, Payton Leigh Northcutt, Joseph L. Andrews, Kevin J. Andrews: Kevin J. Andrews deceased—killed in BCSO traffic pursuit.
        - At time, BCSO’s own policy advised restrict motor vehicle pursuits to situations where immediate apprehension of violator outweighs hazards generated to deputies, public, or occupants.
        - When it becomes apparent immediacy of apprehension is outweighed by clear and unreasonable danger to deputy and others, pursuit should be abandoned.

      - Peyton Little: deceased—suicide by hanging with seat belt while car moving; no comment from BCSO; details conveniently unavailable; alleged Peyton was confidential informant for Baldwin County drug task force, division of BCSO assigned to investigate his death; neglected to tell deputy assigned; found in front seat of car minor was driving, with seat belt wrapped so tight around neck that it had to be cut free; within a few hours death, declared suicide—case closed—no comment from BCSO.
      - It may be only case in world where someone strangled themselves with seat belt in moving car.
      - No mention that Peyton was confidential informant and had received threats from those who discovered he was working with BCSO.
      - No evidence of injuries that he was dragged by car.
      - Declared suicide—no questions asked.
      - At time of tragedy, Mack told media there would be investigation and results turned over to District Attorney’s (DA) office.
      - First he started covering his butt by telling FOX 10, “Keep in mind, these people ran from us. So, they’re the ones that caused all this and we were the ones that were trying to render the situation safe in that. As to why they were running and everything, and as to the continued pursuit, those are all things that we do look at in the investigation and we will review.”
      - Where is accountability and transparency?

      - William “Bill” Smith—Baldwin County Sheriff Dept.—deceased.
        - Tragedy should have been prevented.
        - Deputy Smith dispatched to cover Fort Morgan area on four wheeler after kilos of cocaine reported washing ashore.
        - Tough question: why was Deputy Smith not wearing life vest?
        - What prior training did he receive for beach patrol?
        - Had Deputy Smith been on vehicle patrol he would have bulletproof jacket.
        - If he had been issued life jacket and training in life saving, he would be alive today.
        - Comments not meant to shadow Deputy Smith’s heroic actions, which resulted in loss of life.

      - Murray Lawrence Jr: rail-roaded—falsely incarcerated.
        - Lead Investigator Hoss Mack sentenced to life without parole.
        - No gun, no witness, no fiber, no fingerprints, no blood, no DNA, nothing but baseless allegations and “dealing with the Devil”.
        - Mr. Lawrence had multiple witnesses as to whereabouts; fate sealed due to color of race.
        - Sheriff Mack’s funeral home handled body of victim.
        - In strangest circumstances, Sheriff Mack knew victims family and real killers family.
        - Distortion of justice.
        - Currently, case headed to Innocence Project — thanks to Attorney Rebbeca Chambliss.

      THE PIVOT:
      - Article 2 is older than Article 1; frame as background/historical context.
      - Article 2 is the “smoking gun” or key context for Article 1 because it documents prior allegations, funding, lawsuits, deaths, false incarceration, and judicial/prosecutorial conduct surrounding BCSO and Murray Lawrence.
      - Article 2 connects to Article 1’s central claim: evidence suppressed willfully in Murray Lawrence case and motive to convict innocent man.
      - Article 2 provides background for Baldwin County Judicial Corruption narrative: no accountability/transparency, internal Major Crimes Division, camera footage suppression/editing, pending cases, self-promotion motive.
      - Article 2’s details make Article 1’s recent evidence discovery part of a broader pattern rather than isolated incident.

