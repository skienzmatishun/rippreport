      - Widget article: podcast topics include controversial decommissioning of the USS Enterprise, allegations of corruption in Alabama’s legal and political systems, including the Dothan Summer Feeding Scandal, use of Bitcoin, and appearance of Iranian drones over New Jersey.
      - Widget article: podcast features ongoing legal cases including Mack vs. Hadley regarding the theft of a 1968 Camaro by the Baldwin County Sheriff’s Department.
      - Widget article: Alabama Court of Civil Appeals decision released today at 1pm.
      - Widget article: Rule 32 Petition for a new trial for Murray Lawrence Jr. upon discovery of two autopsies ordered by Sheriff Mack’s father, the Coroner of Baldwin County at the time in 2005, which were never disclosed to the Defense, described as a Brady Violation.
      - Widget article: podcast includes a brief biography of one of the most corrupt judges in American history, corrupt Alabama Federal Judge Mark Fuller from Mobile, Alabama.

