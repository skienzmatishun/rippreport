    brief: |-
      THE CONFLICT:
      - Alabama framed as most corrupt state in the U.S.; main article uses “perfect puzzle” narrative of inept/lazy/hypocritical elected officials and oversight agencies; agencies cost taxpayers millions; no accountability/transparency/ethics.
      - Alabama AG Steve Marshall (R) public statements:
