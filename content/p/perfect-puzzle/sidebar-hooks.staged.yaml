        - 2018-03-27: Marshall: highest priority to ensure those serving Alabama do so with utmost integrity; worked to bring transparency by building on ethics laws; “I’m here to make that happen.”
      - Ripp Report characterized Marshall’s statements as campaign talk; AG had not answered a letter; AG needed to investigate Alabama Ethics Commission; Ethics Commission acted as if it had immunity from prosecution, a “license to steal.”
      - Tom Albritton, Alabama Ethics Commission Executive Director: as director, state’s policeman for conflicts of interest and ethical breaches; private charitable trust he helps oversee paid >$100,000 for his children’s college tuition.
      - John Plunk, vice-chairman of Alabama Ethics Commission: helped Sheriff Mike Blakely, a Democrat accused of corruption, disguise political money flowing to a Republican campaign consultant now under investigation; Plunk could not remember because he was doing same secret campaign money for at least two other people; unknown who they are.
      - Sheriff Mike Blakely corruption trial: 2021-07-28; state lawmaker testified for defense; judge sent juror home due misconduct allegations; Alabama rested after 31 witnesses; prosecutors dropped 1 of 11 charges; recap by Ashley Remkus @aremkus1.
      - Columbia Mayor Rhonda Freeman: case pending before Alabama Ethics Commission; allegations; case numbers 2020-0337 & 0361; hearing 2021-08-04, 9:30 AM, at RSA Building, 9th floor Hearing Room, 100 North Union Street, Montgomery, Alabama.
      - Judge Johnny Hardwick, Montgomery Circuit Judge: selected by Chief Justice Tom Parker to preside over some ethics cases on 2021-11-01; read evidence to Writ of Mandamus, found it interesting, wished he could delve into case; decided to recuse himself due to potential conflict of interest.
      - Update: new hearing date set; Ripp Report notified.
      - U of A Board of Trustees: St. John’s office heaped perks on members, including $4.3 million spent on party house; millions in wasted payments to “retired” administrators discovered; attempt to use RSA payments to settle harassment suit.

      THE DISCOVERY:
