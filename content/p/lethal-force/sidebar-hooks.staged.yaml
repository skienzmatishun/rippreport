    brief: |-
      THE CONFLICT:
      *   2017: A fatal shooting occurred during a traffic stop in Lagniappe.
      *   Huey Hoss Mack (BCSO Sheriff) was involved in the context of the 2017 incident.
      *   Alabama Supreme Court rejected a request from Lagniappe for all details regarding the 2017 traffic stop and fatal shooting.
      *   Sheriff Mack helped draft standards in Senate Bill 312 with former State Senator Tripp Pittman ($750,000 BP money stolen).

      THE DISCOVERY:
      *   The Alabama Supreme Court insulated the Baldwin County Sheriff Department (BCSO) from public transparency and accountability.
      *   The court ruled that the statute can hide "any materials related to a particular investigation" and "items of substantive evidence that existed before the investigation began, such as video recordings."
      *   $662,597.00 in taxpayer money was approved by the County Commission for 129 BCSO body cameras, intended to increase transparency, but the Supreme Court ruling nullified this intent.

      THE PIVOT:
      *   The 2017 Supreme Court ruling establishes the legal precedent preventing the release of investigative evidence, directly undermining the call for transparency regarding recent incidents, including the death of O J French (number 8 in a string of 7+ deaths over 5+ years).
      *   The ruling makes the BCSO legally capable of refusing to produce taxpayer-funded camera footage or information, regardless of accountability demands.

