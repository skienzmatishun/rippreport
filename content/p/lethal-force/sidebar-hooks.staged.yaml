  sheriff-huey-boss-mack-secret-police:
    refined_source: 6ed5931f7c7a3d643b12af5b65e319c29e13bab341e171bd84abba1741dad521
    brief: |-
      THE CONFLICT:
      *   May 2017: Jonathan Victor (unarmed) was shot to death by BCSO. Sheriff Mack stated BCSO lacked a crisis intervention team or de-escalation training. (Judicial observation by U.S. District Court Judge William Cassady cited).
      *   March 5, 2018: Robert Yates was shot to death by BCSO SWAT team during a breach of residence without probable cause. Deputy Justin Correa was involved.
      *   Murray Lawrence Jr. was falsely incarcerated for over 16 years, later heading to the Innocence Project (supported by Attorney Rebecca Chambliss).
      *   Wednesday, September 30, 2021: The Lagniappe decision was issued, broadly exempting all law enforcement evidence from citizens' statutory right to public access (per Chief Justice Tom Parker).
      *   OJ French's death is the 8th death in a string of incidents over 5 years in Baldwin County. (Article 1)

      THE DISCOVERY:
      *   Sheriff Hoss Mack controls the BCSO, which received over $65 million in 2020/2021 and $700,000 in body/vehicle cameras, claiming these promote accountability.
      *   The BCSO's internal Major Crimes Unit (BCMCU) includes members from multiple local police chiefs (Al Tolbert, Brad Kendrick, Edward Delmore, David Carpenter, Thurston Bullock) and is tasked with reviewing member actions.
      *   Sheriff Mack's power was secured through legislative qualifications supported by then State Senator Trip Pittman, limiting competition.
      *   Sheriff Mack's private business, Mack Funeral Home, received a county contract for unclaimed/special circumstance deceased persons, indicating a conflict of interest with the County Commission.
      *   The BCSO uses its internal Major Crimes Unit, which is seen as insufficient by critics, instead of outside agencies (like the FBI) for investigating losses of life.

      THE PIVOT:
      *   Article 2 establishes that BCSO operates with systemic flaws (lack of training, history of excessive force/wrongful conviction) and legal mechanisms (Lagniappe decision) designed to restrict public access to evidence (body cam/video).
      *   This established system of unchecked power and limited transparency (Article 2) is the direct context explaining why the BCSO is refusing to provide video footage and maintain internal accountability regarding OJ French's death (Article 1), leading to claims that BCMCU is "smoke and mirrors."

