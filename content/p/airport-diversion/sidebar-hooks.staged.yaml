  you-dont-know-jack:
    brief: |-
      THE CONFLICT:
      *   September 21, 2015: Fairhope Airport Authority sent an RFP for a ground lease for a commercial hanger on plat 2.
      *   October 13, 2015: RFP submittal deadline.
      *   October 20, 2015: RFP opening.
      *   November 17, 2015: Jack Burrell (Council President/Airport Authority member) and Vince Boothe (Airport Authority member) reviewed bids.
      *   November 17, 2015: Ray Hix (Airport Authority Board member) recused himself before discussion, but later was awarded the bid along with Mr. Snedecker (Fairhope Municipal judge).
      *   November 17, 2015: Jack Burrell motioned to award the bid to Hix/Snedecker Companies DBA Mid-Bay Air, LLC, subject to approval by the State Ethics Commission.
      *   December 17, 2015: Memorandum of lease was recorded for a 30-year ground lease.

      THE DISCOVERY:
      *   The bid process involved clear conflicts of interest (Burrell on Council and Airport Authority; Hix and Burrell associates on the board/committee).
      *   Hix did not fully comply with ethical requirements by only recusing himself from the board, not resigning to pursue a business interest.
      *   The lease was recorded as a simple memorandum, not a full lease/operating agreement.

      THE PIVOT:
      *   Article 2 established the foundational conflict of interest and ethical violations (2015) involving Jack Burrell and Ray Hix.
      *   Article 1 confirms that an ethics complaint against Jack Burrell and Ray Hix was "ruled baseless" but notes the investigation is ongoing, suggesting the historical issues from Article 2 are fueling current scrutiny (e.g., the focus on invoices/computer work).

      KEY ENTITIES:
      *   Jack Burrell (Council President, Airport Authority Board)
      *   Ray Hix (Airport Authority Board member)
      *   Vince Boothe (Airport Authority member)
      *   Mr. Snedecker (Fairhope Municipal judge)
      *   Fairhope Airport Authority
      *   City of Fairhope
      *   Mayor Wilson
      *   Ethics Commission
      *   Deborah Smith (former City of Fairhope employee)
      *   Hix/Snedecker Companies DBA Mid-Bay Air, LLC
    llm_text: Jack Burrell and Ray Hix steered a 2015 Fairhope Airport Authority ground lease to Mid-Bay Air, LLC amid clear conflicts of interest. Discover how this ethically flawed 30-year deal continues to fuel current scrutiny despite a "baseless" ethics ruling.
