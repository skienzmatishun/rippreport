      *   Key actors included Jack "Come Fly With Me" Burrell, Mayor Kant, County Commissioner Elliott, and Trip Pittman.

      THE DISCOVERY:
      *   Article 2 revealed the prioritization of the "Jack Burrell Come Fly With Me Municipal Airport" (serving less than 1% of the community) over local schools, which receive less appropriation funding despite being overcrowded.
      *   Article 2 detailed a perceived "Good Ole Boy Network" facilitating development despite Burrell's denials.

      THE PIVOT:
