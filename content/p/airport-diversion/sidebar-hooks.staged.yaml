      THE DISCOVERY: Council acted to bury a $100,000 lawsuit brought by a former employee in executive session, violating due process.
      THE DISCOVERY: Ripp Report sued the City of Fairhope twice over planning/zoning issues, costing the city over $300,000.
      THE PIVOT: Article 2 established the Council’s pattern of obstruction and "whitewashing" against Mayor Wilson; Article 1 shows this pattern continues as Councilman Brown dismisses the ongoing ethics investigation against Burrell and Mr. Ray Hix, while Burrell attempts to divert public attention to unrelated invoices to deflect from the pending investigation.
      KEY ENTITIES: Jack Burrell, Karin Wilson, Robert Brown, Mr. Ray Hix, Chucky Cheese, Deborah Smith, Boone, Fairhope Airport, City of Fairhope, Satterwhite & Associates.
    llm_text: Mayor Karin Wilson challenges Council President Jack Burrell and Robert Brown over ethics complaints and denied $15,000 legal services. The Council continues to obstruct investigations and bury lawsuits, demonstrating a pattern of "whitewashing" the City of Fairhope.
