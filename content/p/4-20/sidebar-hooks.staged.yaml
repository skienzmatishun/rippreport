  restore-act-accountability:
    brief: |-
      THE CONFLICT:
      - On April 20, 2010, the Deepwater Horizon (BP) Oil Spill released 210,000,000 gallons of oil into the Gulf of Mexico, killing 13 and injuring 17.
      - On May 8, 2010, Alabama Governor Bob Riley appointed State Senator Lee "Trip" Pittman as the "trustee" and banker to oversee and disburse disaster relief funds to those in need.
      - On May 3, 2010 (prior to formal appointments), Pittman plotted with the then-Mayor of Fairhope to submit his own personal contract for the entrusted funds.
      - Senator Trip Pittman received $639,000 from the City of Fairhope and a $98,000 deal from the City of Perdido Key for BP boom contracts, violating grant terms.
      - Brett Robinson received between $36 million and $40 million in BP disaster money for an unfinished project, and subsequently employed former Governor Bob Riley as a consultant/lobbyist.
      - Mayor Stan Wright of Bayou La Batre was convicted of grant fraud and intimidating witnesses.
      - The Mayor of Fairhope was subpoenaed to Federal Court in Mobile to testify regarding BP boom grants involving Trip Pittman amidst allegations of grant fraud, witness intimidation, forgery, and collusion.

      THE DISCOVERY:
      - Promised audits of the BP grant monies distributed through the Alabama Emergency Management Association were never performed by any local or state agency.
      - Funds intended to make affected citizens whole were instead funneled to politicians and well-connected insiders (referred to as the "Resteal Act" regarding Restore Act funds).
      - Trip Pittman secured lucrative heavy equipment and boom contracts county-wide following the disaster payouts.

      THE PIVOT:
      - Article 2 serves as the smoking gun because it details the historical financial corruption, unfulfilled audit promises, and specific illicit payouts (such as Pittman's $639,000 Fairhope contract and $98,000 Perdido Key deal) tied directly to Trip Pittman. This proves the foundational pattern of self-enrichment referenced in Article 1, warning the public that Pittman—now attempting to rebrand as a hemp lobbyist and tractor/boom salesman backing Bill Hightower—is the same corrupt actor who exploited the 2010 BP oil spill funds.

      KEY ENTITIES:
      - Trip Pittman (Lee "Trip" Pittman / Senator Tripp Pittman)
      - Bob Riley (Governor Bob Riley)
      - Bill Hightower (Bill "Lowtower")
      - Stan Wright (Mayor Stan Wright)
      - Brett Robinson
      - Alabama Emergency Management Association
      - Alabama Cannabis Association
      - City of Fairhope
      - City of Perdido Key
      - City of Gulf Shores
      - Bayou La Batre
