      THE PIVOT: The Widget Article establishes a regional pattern of elected officials (Fairhope Council) non-transparently transferring municipal land to third parties; Article 1 mirrors this pattern by detailing the Baldwin County Economic Development Alliance (BCEDA) under Lee Lawson attempting to transfer title of the vacant South Alabama Mega Site ($50 million estimated cost) to a third party without full public vetting.
