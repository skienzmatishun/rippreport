    llm_text: Diana Brewer pushed Fairhope City Council to secretly transfer $20M municipal land to Weeks Bay Foundation. Now, Lee Lawson and BCEDA are repeating this pattern, attempting to move the $50M South Alabama Mega Site without full public vetting.
