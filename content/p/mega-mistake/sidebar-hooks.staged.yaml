  taxes-tolls-and-schools:
    brief: |-
      THE CONFLICT:
      *   Toll Bridge project (marine/auto) was a "done deal" in the past.
      *   Junior Senator Elliott ("The Tax Man") supported the Rebuild Alabama Act, which included a 10-cent indexed fuel tax hike.
      *   Baldwin County was subjected to a 1% tax without a vote.
      *   A proposed $3 million tax was planned for Fairhope and Spanish Fort.

      THE DISCOVERY:
      *   The Baldwin County Mega-Site has been vacant for seven years.
      *   The initial investment was $32 million, escalating to approximately $50 million.
      *   Baldwin County Economic Development Alliance (BCEDA), led by Lee Lawson, has failed to find a tenant.
      *   There is a proposed transfer of the $50 million mega-site title to BCEDA/third parties.
      *   Fairhope Council is considering giving 106 acres (valued at $20 million) of municipal land to Weeks Bay, facing opposition from 600+ signatories.

      THE PIVOT:
      *   The past history of unchecked tax hikes (1% tax, $3M tax proposal) and large, opaque infrastructure projects (Toll Bridge) demonstrates a pattern of poor planning and public disengagement in Baldwin County.
      *   This pattern of fiscal/planning failure provides critical context for the current Mega-Mistake—the 7-year failure and proposed non-public transfer of the $50 million Mega-Site—suggesting a continuation of the same lack of public participation and poor results seen previously.

      KEY ENTITIES:
      *   Baldwin County
      *   South Alabama Mega Site
      *   Baldwin County Economic Development Alliance (BCEDA)
      *   Lee Lawson
      *   Junior Senator Elliott ("The Tax Man")
      *   Governor Poison Ivy
      *   Fairhope City Council
      *   Weeks Bay
      *   Spanish Fort
      *   Elliott
      *   Toll Bridge
    llm_text: Junior Senator Elliott pushed tax hikes, like the unvoted 1% Baldwin County tax, on local residents. Now, Lee Lawson's BCEDA plans a non-public transfer of a $50 million Mega-Site that has sat vacant for seven years.
