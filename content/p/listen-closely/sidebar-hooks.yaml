  advocates-say-birmingham-law-firm-abandoned-habeas-petition-effort-midstream:
    brief: 'THE CONFLICT:

      *   Steven Davis was beaten to death by prison guards in Alabama.

      *   Filmmakers Andrew Jarecki and Charlotte Kaufman visited Easterling Correctional
      Facility in 2019 and began a six-year investigation using contraband cell phones.

      *   The documentary "The Alabama Solution" followed Sandy Ray (Davis''s mother)
      seeking answers and profiled Robert Earl Council, Melvin Ray, and Raoul Poole,
      who organized prisoner protests from inside.

      *   In January 2026, Council, Ray, and Poole were placed in extreme solitary
      confinement after their film appearance and a call for another strike.

      *   The three men filed a federal lawsuit against the Alabama Department of
      Corrections in February 2026 for First Amendment violations.


      THE DISCOVERY:

      *   In July 2015 (approximated based on "completed his second decade"), inmate
      Murray "Bubba" Lawrence, Jr., had completed 20 years of imprisonment for a murder
      conviction he maintains is wrongful.

      *   The original court transcript supports Lawrence''s claim of innocence.

      *   Long-time advocates Francis Paul Ripp and Nancy R. Koerner worked with the
      Birmingham firm Maxwell-Tillman for two years to draft a federal writ of habeas
      corpus after all other avenues were exhausted.

      *   The firm agreed verbally and in writing (formal invoice) and received nearly
      half the fee as a down-payment.

      *   In June 2025, attorney Gabby Humber departed the firm unexplainedly.

      *   Shortly after, the firm issued a Non-Engagement Letter denying an attorney-client
      relationship had formed and warning that shared materials were not confidential.

      *   Advocate Nancy R. Koerner stated that Maxwell-Tillman performed no real
      discovery, provided generic summations, and failed to build merit-based arguments,
      while Ripp and Koerner did the heavy lifting including uncovering a suppressed
      Alabama State Coroners’ Report showing evidence tampering (removal of all seven
      cervical vertebrae).

      *   The firm had only two phone calls and one prison visit by primary partner
      Leroy Maxwell with Lawrence; Gabby Humber never visited.

      *   Koerner was removed from portal access after pressing hard questions about
      medical conditions, wall-phone failures, and legal strategy.


      THE PIVOT:

      *   Article 2 reveals that a legal advocate for the Alabama prison system (or
      associated with it via their representation of other inmates at Holman) abandoned
      a long-standing, fee-paying client (Murray Lawrence) mid-case.

      *   The firm’s non-engagement letter threatened to disclose privileged information
      from an active federal case, demonstrating reckless disregard for client confidentiality
      and professional ethics.

      *   This pattern of abandonment by legal counsel mirrors the systemic failure
      of the Alabama Department of Corrections alleged in Article 1, where incarcerated
      men were punished (via solitary confinement) for seeking accountability through
      legal channels (the lawsuit filed by Council, Ray, and Poole).

      *   The "smoking gun" is the intersection: legal firms representing inmates
      in post-conviction cases are failing to hold the system accountable, mirroring
      how the state punishes those who do. It highlights that both the legal system
      and the prison system are failing the incarcerated, reinforcing the central
      thesis of "The Alabama Solution."


      KEY ENTITIES:

      *   Steven Davis

      *   Sandy Ray

      *   Andrew Jarecki

      *   Charlotte Kaufman

      *   Robert Earl Council

      *   Melvin Ray

      *   Raoul Poole

