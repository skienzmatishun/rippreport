  tax-tax-and-re-tax:
    brief: "THE CONFLICT: Baldwin County officials and politicians pushed for an education lottery and a Fairhope special school tax over a mayor's proposal for developer impact fees, while the State General Fund misappropriated monies dating as far back as 2013, and Governor Ivey attempted to take control of the education system by appointing state school board members rather than having them elected.\n\nTHE DISCOVERY: Article 2 showed that taxpayers were forced to shoulder the costs of schools, streets, and transportation because developers paid little to no impact fees, and that a proposed lottery marketed for education actually intended to pay back misappropriated State General Fund monies rather than fully funding schools (with a proposed amendment allocating only 25% to education).\n\nTHE PIVOT: Article 2 serves as the smoking gun for Article 1 by establishing a continuous local pattern of financial mismanagement, lack of long-term planning, and taxpayer-funded burdens (such as schools, infrastructure, and now a $7 million county commission infrastructure spend for a \"shovel ready\" mega-site without any contract or letter of intent). \n\nKEY ENTITIES: \n- Baldwin County Commission\n- Baldwin County Economic Development Alliance\n- Baldwin County School System\n- Governor Ivey\n- Mel Fisher\n- City of Mobile"
    llm_text: Baldwin County politicians dodge developer impact fees while forcing taxpayers to fund schools, while Governor Ivey schemes to control the education board. Discover how this local financial mismanagement hits your wallet directly.
