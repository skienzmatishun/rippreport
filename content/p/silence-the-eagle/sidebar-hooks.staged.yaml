  cover-up:
    brief: |-
      THE CONFLICT:
      - July 25, 2021: Nicole Barkley called Auburn Police Department asking for assistance; her husband, Walker Cole Barkley, was intoxicated and had a gun in his shirt pocket; Nicole feared he might hurt himself.
      - Police arrived; informed 4 children were inside.
      - Officer fired through the door and slight opening approximately 10 times, seriously wounding Cole Barkley.
      - Barkley returned fire with two wild high shots inside the house after the officer stopped firing and retreated.
      - Officer never announced he was a police officer; Barkley, totally intoxicated, did not know who had shot him.
      - Barkley, wounded and bleeding profusely, made a phone call for medical assistance.
      - Barkley recovering from wounds while incarcerated; charged with attempted murder.
      - Prosecution seeking life without parole; sentencing hearing August 23, 2021 at 3pm.
      - Case quickly labeled falsely as “domestic violence”; framed as step one in the spin story.
      - Claimed overcharging; described as another common practice in Alabama.

      THE DISCOVERY:
      - August 20, 2021: O.J. French killed by Bay Minette police.
      - Ripp Report received copy of letter from Mayor Bob Wills to Tamara French, O.J. French’s older sister.
      - Wills letter makes no mention that Alabama is the most politically corrupt and racist state in the United States.
      - Wills letter: allegations of a “cover up” and other allegations are without merit.
      - Letter itself part of a potential “cover up.”
      - Mayor Bob Wills more interested in his golf game than consoling citizens of Bay Minette.
      - Wills reputation of questionable self-serving deals; resulted in ethics complaints and Alabama Bar complaints; complaints fell on deaf ears.
      - Alabama Attorney General Steve Marshall accused Albritton of fraud and self-dealing in oversight of charitable trust called the Mabel Amos Memorial Fund (MAMF); part of motion in civil suit filed by Amos’s relatives.
      - Albritton is Executive Director of the Ethics Commission; now has three lawsuits against him; still being paid as Executive Director; Ethics Commission and Alabama Bar dismissed complaints against Albritton.
      - Mayor Bob Wills had ethics complaint and Alabama Bar complaint pending; complaints dismissed.
      - According to Wills, Bay Minette officers scheduled to attend training on mental health crisis intervention/de-escalation techniques from AltaPoine Health; department also attending training to sharpen “conflict resolution abilities using firearms training systems.”
      - Baldwin County Major Crimes Unit (BCMCU) reviewing actions of officers working for its member organizations.
      - BCMCU members include: Bay Minette Police Chief Al Tolbert (current chairman), Robertsdale Police Chief Brad Kendrick, Baldwin County Sheriff’s Office (BCSO) Sheriff Huey “Hoss” Mack, Gulf Shores Police Chief Edward Delmore, Daphne Police Chief David Carpenter, Foley Police Chief Thurston Bullock.
      - BCMCU has no credibility; investigating themselves; Bay Minette PD Chief Al Tolbert is Chairman.
      - Baldwin Commission Attorney Brad Hicks sees no ethics violation with Mayor Bob Wills renting his building to Baldwin County Legislative Delegation, and possibly sharing office space.
      - Brad Hicks says county attorney is deciding what is ethical and what is not; Hicks’ job is to be sure it is NOT unethical; Hicks’ job is to contact Ethics, Attorney General or legal counsel for Speaker of the House and get official opinion; instead Hicks said go to hell with obtaining any opinions.
      - Mayor Bob Wills pushing “self dealing”; using office for personal gain; ethics complaint pending; Alabama Bar complaint hanging over him.
      - Mayor Wills renting building to Baldwin County Legislative Delegation; rent for first 5 years $245,000.00; second 5 years ~$283,000.00; third 5 years ~$339,000.00; totals $867,000.00 in Mayor Wills family bank account, for a building worth far less.

      THE PIVOT:
      - Article 2 (“COVER UP”) centers on Mayor Bob Wills’ denial of a “cover up” re: O.J. French killing by Bay Minette police on August 20, 2021.
      - Article 2 shows/institutes pattern of oversight bodies dismissing complaints: Alabama Ethics Commission and Alabama Bar dismissed complaints against Albritton and Wills.
      - Article 2 includes allegations of self-dealing by Mayor Wills (building lease totaling $867,000.00 in family bank account; lease extensions).
      - Article 2 includes BCMCU self-investigation structure and Brad Hicks’ refusal to rule on ethics.
      - Why Article 2 is the smoking gun/key context for Article 1: Article 1 alleges first sign of corruption/cover up is suppressing media coverage; local media stonewalled; FOIA requests deliberately not provided; police, city, DA did not want information public until after sentencing.
      - Article 2 provides background/context on how cover ups operate in Alabama police killings: Mayor Wills dismissing “cover up” allegations; Ethics/Bar dismissing complaints; BCMCU investigating itself; Hicks refusing ethics opinion.
      - Article 2 frames the same institutional behavior relevant to Article 1’s Barkley/Opelika case: officials protecting police/DA narrative, suppressing information, controlling optics before sentencing.

      KEY ENTITIES:
      - Walker Cole Barkley
      - Nicole Barkley
      - Auburn Police Department / Opelika Police Department
      - Prosecution / District Attorney / Judge (sentencing August 23, 2021, 3pm; life without parole sought)
      - Bob Wills, Mayor of Bay Minette
      - Tamara French, O.J. French’s older sister
      - O.J. French, killed by Bay Minette police August 20, 2021
      - Steve Marshall, Alabama Attorney General
      - Joshua Albritton, Executive Director of Alabama Ethics Commission
      - Mabel Amos Memorial Fund (MAMF)
      - Brad Hicks, Baldwin County Commission Attorney
      - Baldwin County Major Crimes Unit (BCMCU): Al Tolbert, Brad Kendrick, Huey “Hoss” Mack, Edward Delmore, David Carpenter, Thurston Bullock
      - AltaPoine Health
      - Baldwin County Legislative Delegation
      - Holly Hills Golf Course
      - Baldwin County Commission / Baldwin County Sheriff’s Office (BCSO)
