  driving-under-the-influence:
    brief: |-
      THE CONFLICT:
      *   May 20, 2016: The Ripp Report/BCLE published an article detailing how DUI charges in Baldwin County lead to mandatory education/drug testing programs.
      *   10-4-2007: Baldwin Substance Abuse Services, Inc. (BSAS) was formed in Baldwin County, AL.
      *   Past Fraud: Sen. Pittman and Mayor Kant siphoned $636,000 of BP money, leading to an FBI investigation and referral to the Alabama Attorney General.
      *   Past Legal Issue: A settled triangle lawsuit in Fairhope cost taxpayers $11.25 million, orchestrated by Mayor Kant without public notification.

      THE DISCOVERY:
      *   BSAS is a domestic non-profit corporation (Entity ID 566-683) formed by judges and attorneys, including Judge Thomason.
      *   BSAS profits from court-referred DUI offenders via mandatory education ($400) and drug tests ($300), operating as a "cash cow."
      *   Judge Thomason is an incorporator of BSAS, which has collected millions of dollars from victims.

      THE PIVOT:
      *   The 2016 article established BSAS as a profit-driven, corrupt system controlled by judges (Judge Thomason), providing historical context for Article 1's current complaints against Judge Thomason's family court being a "travesty."
      *   Article 2 confirms a pattern of judicial and political collusion in Baldwin County (e.g., Mayor Kant rejecting 95% of citizens' opposition to the Publix apartment complex).

