  bp-restore-act-application:
    brief: |-
      THE CONFLICT:
      *   Mayor Tim Kant and Arthur Corte engaged in a conspiracy concerning Fly Creek in Fairhope, related to private development (Publix/Shoppes at Fairhope Village) and public lawsuits.
      *   The city settled a long-standing lawsuit, costing taxpayers $11.25 million (Article 1).
      *   The city conspired to omit public participation/notification during the settlement process.
      *   The settlement authorization was added to a Council agenda in April 2013 without public notice (Article 2).
      *   The second meeting regarding the settlement occurred in October 2013 without public input (Article 2).
      *   Mayor Kant and Senator Trip Pittman are subjects of multiple BP fraud investigations related to siphoning $636,000 of BP money (Article 1 & 2).

      THE DISCOVERY:
      *   The Fly Creek Watershed Restoration Project was based on a flawed "Study" developed by Thompson Engineering (Article 2).
      *   The study deliberately omitted the fact that the major creek damage (red clay) was caused by Arthur Corte's development and the Publix supermarket (Article 2).
      *   The city incurred $3 million in attorney fees, $3 million down payment, and a $5.75 million debt through the settlement without public input (Article 2).

      THE PIVOT:
      *   Article 2 established the procedural illegitimacy (lack of public notice in April/October 2013) and the factual omission (Corte's culpability) of the restoration project.
      *   Article 1 uses this historical context to argue that the current use of Restore Act Funds for private contractor damages is corrupt, defies public concern (95% opposition to apartments), and requires a criminal investigation focused on Tim Kant.

