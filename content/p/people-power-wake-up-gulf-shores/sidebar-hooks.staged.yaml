  special-interest:
    brief: |-
      THE CONFLICT: On October 12, 2018, Fairhope residents were preparing to vote on a Council-Manager Referendum on November 6, 2018, driven by opposition to local political control. Separately, in Gulf Shores, opposition was mounting against the Regency Place Apartments Site Plan Approval (October 3, 2018).
      THE DISCOVERY: Article 2 revealed that special interest groups (Catalyst connections, Tim Can’t Club) in Fairhope, representing about 30% of the population, opposed governmental change and sought to maintain control over Fairhope governance.
      THE PIVOT: Article 2 establishes a precedent of concentrated local political opposition against established governing bodies (Fairhope Council) and economic/special interests (Catalyst/Tim Can’t Club) in a neighboring jurisdiction, mirroring the citizen opposition in Gulf Shores against the Planning Commission and out-of-state developer interests.
      KEY ENTITIES: Gulf Shores, Regency Place Apartments, October 29, 2018, Pete Sims, Robert Craft, Philip Harris, Fairhope, Catalyst, Fresh Start Fairhope, November 6, 2018, Mayor Dane Haygood.
    llm_text: Fairhope residents pushed the November 6 referendum while groups like Catalyst sought to maintain local control. This mirrored Gulf Shores' fight against Regency Place Apartments, showing how concentrated local opposition shapes both governance and development.
