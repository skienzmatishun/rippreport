      THE DISCOVERY: Article 2 revealed specific allegations of improper benefit receipt by Burrell related to the selection of a bid for the Airport Authority. A $5000 cash reward was offered to prove the complaint was false.
      THE PIVOT: Article 2 details a specific, high-profile instance of controversy and citizen complaint (the Burrell case) which Article 1 references as "baggage from the last administration" that the new council must address by adopting a policy of public internal review for controversial subjects.
      KEY ENTITIES: Jack Burrell, Fairhope Mayor, City Council, The Ripp Report, Fairhope Airport Authority.
    llm_text: Councilman Jack Burrell received free airplane transport from an Airport Authority bidder, leading to a formal complaint from The Ripp Report. Burrell threatened the Fairhope Mayor with litigation; now the City Council must adopt internal review policies to clear this "baggage."
