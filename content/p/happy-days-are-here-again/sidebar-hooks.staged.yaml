      *   Mr. Boone's conflicts date back prior to his election, involving business interests with Preble-Rish and Mr. Angelo Corte.
      *   In January, the council was asked to investigate Mr. Boone's involvement with Mr. Angelo Corte.

      THE DISCOVERY:
      *   Article 2 revealed Mr. Boone possesses a trail of LLCs and is directly related to Catalyst, indicating significant, undisclosed conflicts of interest.
      *   Article 2 asserted the council had ignored conflicts of interest and failed to adhere to the Alabama Ethics Commission standards.

      THE PIVOT:
      *   The "baggage from the last administration" mentioned in Article 1 (the need for internal review) is rooted in the specific, documented conflicts of interest and lack of transparency detailed in Article 2.
      *   Article 2 establishes the historical failure of the council, necessitating the transparency and internal review policies recommended in Article 1.

