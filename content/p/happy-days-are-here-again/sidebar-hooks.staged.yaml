    brief: |-
      THE CONFLICT: Councilman Kevin Boone held undisclosed business connections through LLCs with John Avent of Dewberry Preble-Rish, LLC, dating prior to his service on the Fairhope City Council.
      THE CONFLICT: Boone voted on the _Retreat at Fairhope_ / _Fly Creek Apartments_ issue twice in Sept 2016 (SD 16.14) in a Planning and Zoning meeting while Avent represented Preble-Rish.
      THE DISCOVERY: Article 2 revealed Boone consistently failed to acknowledge or recuse himself from voting on issues involving his direct business partners with Preble-Rish over four and a half years.
      THE PIVOT: Article 2 provides specific, documented evidence of past conflicts of interest (e.g., Fly Creek/2016) which constitute the "baggage from the last administration" that Article 1 references, necessitating the current call for transparent internal reviews by the new council.
