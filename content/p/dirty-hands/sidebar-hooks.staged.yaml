  what-education-lottery:
    brief: |-
      THE CONFLICT:
      - Baldwin County / Alabama education funding conflict involving State Senator Chris Elliott, labeled “the TAX MAN.”
      - Main article: Elliott supports lottery and taxes that do nothing for education.
      - Main article: The “Education” Lottery has been dissolved into a lottery to pay past State debts, as far back as 2013.
      - Main article: The lottery and taxes Elliott supports did nothing for education.
      - Main article: Fairhope proud in March 2017 to welcome 3 highly qualified people to a new administration.
      - Main article: Fairhope Catalyst Council not happy with Mayor’s choices and set out to oppose, obstruct, and generally not support them.
      - Main article: Fairhope lost two of the three original staff hired.
      - Main article: Council did everything possible to discourage new hires.
      - Main article: Council set its sights on female of the three, Sherry-Lea Bloodworth Botop.
      - Main article: Council has well established reputation for bulling women.
      - Main article: Sherry-Lea relocated to Fairhope for the position and immediately the council moved to de-fund her position.
      - Main article: Fairhope is loser in her departure; Fairhope Catalyst Council had dirty hands in her resigning.
      - Main article: Mayor Karin Wilson of Fairhope, April 28 at 5:00 PM, said City of Fairhope is proud to support Sherry-Lea Bloodworth Botop, current Economic and Community Development Director, in her transition to Deputy Director of Mobile Bay National Estuary Program (MBNEP).
      - Main article: Since Sherry-Lea started in early 2017, her commitment to building resilient community using philanthropic leadership.
      - Main article: In MBNEP position, she will work on implementation of restoration and protection efforts in Comprehensive Conservation and Management Plan.
      - Main article: Bloodworth Botop quote on Fly Creek, Mobile Bay water quality, economic and environmental prosperity.
      - Main article: Council may not be rid of Sherry Lea yet; Council also had dirty hands with approval of Fly Creek Apartments and traffic congestion at Highway 98 and Parker Road.
      - Main article: Just last month Wayne Dyess, Fairhope’s planning director, resigned.
      - Main article: Council did not try to save either position? Did council try and talk Wayne and Sherry-lea into staying? Hell No.
      - Main article: Council’s hands are as dirty as they can be.
      - Main article: Council President Burrell: Wayne Dyess was a great employee and provided great input concerning numerous planning projects, and was instrumental in implementing several new ordinances which will help the city in the long run.
      - Main article: If Council President Burrell felt so passionately about Mr Dyess, why did he not try his damnedest to get him stay?
      - Main article: Fairhope loses and Council’s hands are dirty.
      - Main article: One man standing from the three, Operations Director Richard Peterson. Mr Peterson now has a target on his back.
      - Main article: Catalyst Council would love to dirty their hands one more time before 2020 elections, by forcing Peterson out.
      - Main article: Fairhope again will be loser and Catalyst winner.

      THE DISCOVERY:
      - Article 2 / Widget article: Alabama is going to give the lottery away to the highest bidder, the Poach Creek Indians.
      - Article 2 / Widget article: Supporters of this bill feel that they still have the moral high ground by preventing any additional gaming while stuffing their pockets full of Indian money.
      - Article 2 / Widget article: Two separate lotto bills were introduced.
      - Article 2 / Widget article: Education was dismissed as not being important enough to include in any revenue from the Albritton Indian lottery.
      - Article 2 / Widget article: According to the bill, money from the lottery will first go to pay for its expenses then go into the state’s trust fund to repay transfers made to the general fund from 2013 to 2015.
      - Article 2 / Widget article: Once everything is repaid, Albritton says half the money will go back into the trust fund and into the state’s general fund.
      - Article 2 / Widget article: This lotto is designed to pay “back debt” as far back as 2013 and allocates nothing for the “future” Education Fund.
      - Article 2 / Widget article: The Indians placed their bet on greedy politicians and gave them money to help them think clear on how to vote.
      - Article 2 / Widget article: The Senate Tourism and Marketing committee will vote Tuesday on a bill that, if approved, would give the Poarch Band of Creek Indians a complete monopoly over gaming operations in the state.
      - Article 2 / Widget article: If adopted, it will also eliminate legal pari-mutuel gaming at the state’s four race tracks, cost jobs in Macon, Greene and Jefferson Counties.
      - Article 2 / Widget article: Poarch Creeks made contributions to Republican tourism committee members this election cycle: Del Marsh Chair $30,000; Randy Price Vice Chair $12,500; Chris Elliot $27.5; Garlan Gudger $25,000; Andrew Jones $10,000.
      - Article 2 / Widget article: Our State Senator Chris Elliott aka the TAX MAN netted $27.5, to help him think straight.
      - Article 2 / Widget article: He supports the Albritton bill and no allocation for the Education Fund.
      - Article 2 / Widget article: The TAX MAN has taxed us twice without a vote, diverted education money from the 1% tax, about $200,000 a year, and now provides no money to go towards the Education Fund, from a lottery that started out being about education.
      - Article 2 / Widget article: Elliott, the TAX MAN, was vetted prior to the elections by Governor Poison Ivy and he pledged his support for the gas tax while campaigning against it. Christian Conservative.
      - Article 2 / Widget article: Elliott and Albritton are also on board to make major changes in Ethics and Lobbyist. The changes are designed protect legislators from ethics charges and allows lobbyist to contribute to the never ending cycle of political corruption.

      THE PIVOT:
      - Article 2 is older / background / historical context.
      - Article 2 shows the Education Lottery was not allocated to future Education Fund; it was designed to pay back debt as far back as 2013.
      - Article 2 shows the lottery was to be given to Poarch Band of Creek Indians / Poach Creek Indians.
      - Article 2 shows state senator Chris Elliott received $27.5 from Poarch Creeks and supported Albritton bill with no Education Fund allocation.
      - Article 2 connects to Main Article 1: Main article says Elliott supports lottery and taxes that do nothing for education, and Education Lottery dissolved into lottery to pay past debts.
      - Article 2 is smoking gun / key context for Main Article 1 because it provides earlier background on Elliott, lottery, education funding, Poarch Creeks, and no Education Fund allocation before the local Fairhope / Baldwin County conflict.

      THE KEY ENTITIES:
      - Chris Elliott / Chris Elliot / “the TAX MAN”
      - Karin Wilson
      - Sherry-Lea Bloodworth Botop
      - Wayne Dyess
      - Burrell
      - Richard Peterson
      - Chuckee Cheeze
      - Albritton
      - Del Marsh
      - Randy Price
      - Garlan Gudger
      - Andrew Jones
      - Poison Ivy
      - Lowery
      - Wilters
      - Baldwin County
      - City of Fairhope
      - Fairhope Catalyst Council
      - Mobile Bay National Estuary Program / MBNEP
      - Mobile Bay
      - Fly Creek
      - Highway 98
      - Parker Road
      - Poarch Band of Creek Indians / Poach Creek Indians
      - Senate Tourism and Marketing Committee
      - Alabama State Senate
      - Education Lottery
      - General Fund
      - State Trust Fund
      - Macon, Greene, Jefferson Counties
      - The Courier
    llm_text: State Sen. Chris Elliott, the TAX MAN, took $27,500 from the Poarch Band while pushing a lottery that pays back old debt instead of funding education. Now Fairhope's messy fight over Sherry-Lea Bloodworth Botop shows how Elliott's plan connects to real local fallout.
