      *   Wayne Dyess, Fairhope’s planning director, resigned recently (prior to April 28 update).
      *   Richard Peterson, Operations Director, is targeted by the Catalyst Council before the 2020 elections.
      *   Council President Burrell acknowledged Dyess's value but failed to intervene to retain him.

      THE DISCOVERY:
      *   April 3rd: 100 people attended a roundtable discussion on the K-1 Center in Fairhope.
      *   The Fairhope City Council requires only three votes to make a decision, potentially without listening to all constituents.

      THE PIVOT:
      *   Article 2 demonstrates the Council's structural preference for internal three-vote decisions over public input (100 voices at the K-1 Center), validating the claims in Article 1 that the Catalyst Council is ignoring constituent needs and acting with "dirty hands."

      KEY ENTITIES:
