  pittman-kant-caught-new-evidence:
    brief: |-
      THE CONFLICT:
      Triangle Lawsuit involved the Dyas Family property; conditional settlement agreement was reached in December 2013 following an April 8, 2013, council meeting.
      The city spent $12.5 million on the settlement, paid $3 million in attorney fees (from taxpayer funds), and took a $5.75 million debt loan from Compass Bank.
      The settlement agreement initially claimed the property could not be commercial/industrial, but the final agreement allowed any use, conditional upon PUD/Planning & Zoning.
      The city used Thompson Engineering’s $30,000 study, "The Fly Creek Watershed Restoration Plan," to justify $22 million in BP Restore Act funds.

      THE DISCOVERY:
      On February 10, 2014, F. Paul Ripp presented a document to the city council.
      Leigh Anne Ryals, then Baldwin County Emergency Management Director, denied dealing with Mayor Tim Kant, stating she only dealt with Senator Trip Pittman.
      This suggested Senator Pittman was acting as mayor, manufacturing documents and signing with Kant's signature to cover up incriminating material.

      THE PIVOT:
      Article 2 (February 2014) established that the cover-up of the BP Boom Scandal was orchestrated by Senator Pittman and Mayor Kant.
      This context links to the 2013 Triangle Lawsuit, revealing that the city's fraudulent BP restoration plan and associated legal deception were managed by the same officials (Kant/Pittman) who were later implicated in document forgery and conspiracy.

      KEY ENTITIES:
      Tim Kant (Mayor)
      Trip Pittman (Senator)
      F. Paul Ripp
      Leigh Anne Ryals
      Dyas Family
      Cain O'Rear (Hand-Arendall attorney)
      Thompson Engineering
      Arthur Corte (Publix developer)
