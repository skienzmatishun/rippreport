      THE DISCOVERY: The initial scope of the financial liability for the Triangle Lawsuit was projected to reach $500 million, including various project estimates ($19M and $4M), indicating a massive, high-risk financial exposure for Fairhope taxpayers under Mayor Kant’s administration.

      THE PIVOT: The older article establishes the initial high-cost, high-risk context (up to $500M) and Mayor Kant’s ties to the Publix developer Arthur Corte and the BP boom scandal; the newer article reveals the actual, documented, and much more specific financial and legal progression (e.g., $12.5M expenditure, $3M in taxpayer attorney fees, $5.75M new debt loan, AMIC lawsuit due November 2014) and clarifies key legal facts (e.g., the final settlement allows for any use, contradicting public reports).

