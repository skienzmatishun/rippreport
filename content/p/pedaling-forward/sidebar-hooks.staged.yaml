      Article 2 establishes the structural chaos and independent municipal decision-making within Baldwin County, which provides the context for past fund raiding (Elliott/Tyler) and complicates the adoption of unified solutions (like the 3-mill property tax) necessary to address the $1.88 million school funding deficit identified in Article 1.

