  gulf-shores-shoot-the-messenger:
    brief: |-
      THE CONFLICT:
      - Main article: Fairhope City Council has been pedaling backwards its whole term.
      - Fairhope City Council now has a chance to pedal forward, putting Fairhope on the map, when it comes to city supporting education.
      - Alabama’s Equity Funding formula is not equitable, when it comes to Baldwin County.
      - Fairhope solution, discussed for years, has been a 3 mill property tax in a designated school district.
      - Fairhope Education Advisory Committee [FEAC], after consideration of the 2015 Akribos Group Academic Audit and reviewing needs of all 5 schools in Fairhope, suggested to City Council a 3 mill property tax.
      - FEAC said this district, 6, would be inside boundaries of Fairhope schools feeder pattern.
      - Estimated income from 3 mills is 1.88 million.
      - In order to have a referendum on the issue, Council has to jump through several hoops even to make certain deadlines.
      - Baldwin County voters are not inclined to tax themselves.
      - Concern: What is going to stop the County from raiding the fund? County did with penny tax; County Commissioner Chris Elliott and School Superintendent Eddie Tyler skimmed 200,000 dollars a year from school tax for County infrastructure.
      - Concern: Why would not expect same to happen down road with 3 mills?
      - Fairhope City Council can begin pedaling forward by considering Mayor’s suggestions to reach same goal.
      - Council would be able to approve over 70% of 1.88 million goal by Council action, passing a Permanent Ordinance.
      - Council, FEAC, and Mayor are on same page, as far as ultimate goal of 1.88 million.
      - Mayor is committed to schools and has presented proposals that need careful consideration before committing to a referendum which has little chance of passing.
      - Council President Jack Burrell’s comment “I want out of the school business” was sad commentary to overall conversation.
      - Mr. Burrell is more interested in Airport and 2020 elections than Schools.
      - He would rather kick the can down the road to a tax referendum that he feels will fail.
      - School Principals and teachers should weigh in on options, take a chance on referendum or go with Permanent Council Ordinance.
      - Mayor is on board for 3 mill tax, feels more prudent to use Fairhope Equitable School Plan first as stepping stone to 3 mill tax.
      - Fairhope will be debt free in 2019.
      - Mayor’s proposal is to use 10% of income from sales tax, estimated at 800,000 to 1 million a year, for bulk of 1.88 million goal.
      - Council can do that NOW.
      - If Council goes ahead with referendum and it fails, then they get another F.

      - Widget article older/background: Gulf Shores Mayor and Council are acting the same way the previous Mayor of Fairhope, Tim Kant, acted involving controversy of Fairhope Fly Creek Apartments.
      - Mayor and buddy developer ignored sentiments of community.
      - It cost Mayor his job as well as a few councilman.
      - Collateral effect in Fairhope resulted in firings, retirements and resignations of over a dozen employees, who needed to go.

      THE DISCOVERY:
      - Widget article: Controversy is not about apartments as much as it is about location, location, location.
      - Development will increase population of City of Gulf Shores by almost 5 percent (based on 512 people or 2.5 residents per unit).
      - Development will add 400 to 500 more cars on already busy streets in residential area, not to mention Gulf Shores proper which is almost in a state of gridlock now.
      - If approved, four-way stop signs in the “Small Town” section of Gulf Shores will be replaced by traffic signals.
      - Told by Real Estate Company (Remax Paradise) that developer planned to build townhomes.
      - Shocked after fact site plan had been approved by city Planning Commission for high-density, four-story apartment complex with absolutely no prior notice to citizens living in neighborhood; as a result residents were given no input.
      - SAVE OUR NEIGHBORHOOD STOP REGENCY PLACE APARTMENTS is basis for petition that more than 750 people supported.
      - City of Gulf Shores current position is to ignore complaints and threats of lawsuits by citizens.
      - Gulf Shores Mayor and Planning insist all is in order and those complaining have no merit.
      - “Shoot the messenger or messengers” was mistake Fairhope’s Mayor and developer made.
      - If it were not for a few messengers, Mr. Pete Sims being the most vocal, who tried to alert the two complexes, The Enclave and The Regency Club, of long term negative effects the apartments, there would be no message, no information.
      - Why are boards not carrying banner of protest? They should be messengers, not shooting messengers.
      - Condo associations are notorious for lack of communication, residential geniuses, and boards more known for confusion they cause than solutions they solve.
      - Unfortunately The Enclave and The Regency Club are currently pointing fingers at each other, shooting the messenger and falling into an abyss of “NO ACTION”, which is exactly what Gulf Shores counted on.
      - Fairhope, just like Gulf Shores, has Planning and Zoning regulations, and just like Fairhope, under Tim Kant, Gulf Shores violates its own regulations more often than anyone else.

      THE PIVOT:
      - Article 2 is older than Article 1; frame it as background/historical context.
      - Article 2 shows Gulf Shores Mayor and Council acting the same way the previous Mayor of Fairhope, Tim Kant, acted involving controversy of Fairhope Fly Creek Apartments.
      - Widget frames Gulf Shores Mayor and buddy developer ignored sentiments of community; it cost Mayor his job as well as a few councilman; collateral effect in Fairhope resulted in firings, retirements and resignations of over a dozen employees, who needed to go.
      - Main article: Fairhope City Council education funding debate mirrors concerns about tax/levy, County interference, Mayor/Council dynamics, referendum risk.
      - Jack Burrell’s reluctance/kick-can-to-referendum parallels pattern of delaying action/ignoring concerns.
      - Mayor’s preference for Fairhope Equitable School Plan as stepping stone parallels historical caution/planning.
      - County Commissioner Chris Elliott and School Superintendent Eddie Tyler skimming 200,000/year from penny tax parallels concern County will raid 3 mills fund.
      - Article 2 is smoking gun/key context for Article 1 because it documents prior Fairhope/Gulf Shores pattern where Mayor/developer ignored community sentiment/Planning regulations and led to fallout.
      - Article 2’s “shoot the messenger” and Planning/Zoning mindset frames why messengers/opposition may face resistance in current education funding fight.

