      *   The Fairhope City Council attempted to derail the scheduled Oct. 2 election.
      *   Mayor Karin Wilson subsequently delayed the special election to the general election on 11/6/2018.

      THE DISCOVERY:
      *   Article 2 revealed the City Council’s initial stance was based on an outdated statute (pre-July 2018 revision) and ignored the Mayor’s opinion offered on June 26, 2018.
      *   The Alabama petition process successfully allowed citizens to bypass the governing body when deemed ineffective.

      THE PIVOT:
      *   Article 2 establishes a historical pattern of the City Council being resistant to citizen-driven change and effective governance, mirroring its current resistance in Article 1 regarding the 3-mill property tax referendum for school funding.

