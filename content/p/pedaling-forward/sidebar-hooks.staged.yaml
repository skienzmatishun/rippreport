      THE DISCOVERY:
      *   The Fairhope City Council operates under the influence of Catalyst loyalists.
      *   The Council consistently uses the city attorney to obstruct the Mayor and prioritize non-financial, ego-driven projects (e.g., bike trail feasibility study costing $10,000).

      THE PIVOT:
