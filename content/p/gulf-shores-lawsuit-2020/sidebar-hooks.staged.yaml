  tax-tax-and-re-tax:
    brief: |-
      THE CONFLICT:
      - Over a year of brewing tension before lawsuit was filed.
      - City of Gulf Shores approved an apartment complex over the objections of area residents.
      - City of Gulf Shores and the Mayor told residents: “Apartments are a done deal, get over it, there is nothing you can do.”
      - It is official — a lawsuit has been filed.
      - Pete Sims of Gulf Shores persevered in representing the citizens impacted negatively by the Apartments.
      - Fairhope set the stage: citizens fought back against City Government and elected officials who stop listening to the citizens.
      - Fairhope: to change planning and zoning rules, regulations, and official members of the P&Z Board, you vote out the Mayor — that happened in Fairhope.
      - That is what could happen in Gulf Shores in 2020.

      THE DISCOVERY (Article 2 — Widget: “Tax, Tax and Re-Tax”):
      - Tax, tax and re-tax is the bottom line for Baldwin County.
      - Developers pay no or little impact fee for their projects which ends up costing the taxpayer to make up the difference in the cost of Schools, Streets/Transportation and Education.
      - Baldwin County is the fastest growing County in the State.
      - Baldwin County School System has been negatively impacted the most due to lack of long-term planning from the board.
      - Governor Ivy wants even more control over a failing education system, by appointing State School Board Members, rather than electing them.
      - Bill to end election of state school board members.
      - Proposed lottery: for the last 20 years referred to as an education lottery.
      - Proposed lottery has NO money for education.
      - Politicians wish to use the lottery to pay back the State General Fund, as far back as 2013.
      - Proposed amendment to the bill would give education 25%, a far cry from 100%.
      - In Fairhope, a special school tax was favored by the City Council over a Mayor’s proposal pushing for impact fees and making the contribution more equitable.
      - Council President made it clear in his statement: “The City Council wants out of any School business.”
      - Same micromanaging Christian conservatives who pound their chest every time the word taxes comes up, yet favor taxing their constituency even when municipal funds, already collected taxes, are available.
      - Teachers need to demand that the Baldwin County School Board address the basic needs of schools.
      - Teachers are supposed to TEACH not fund-raise.

      THE PIVOT:
      - Article 2 is the smoking gun / key context for Article 1 because it identifies the underlying fiscal mechanism: developers pay no or little impact fee, forcing taxpayers to cover Schools, Streets/Transportation, and Education.
      - This connects to the Gulf Shores apartment conflict: City of Gulf Shores approved the Apartments over residents’ objections, and citizen pushback followed.
      - Article 2’s Fairhope example — City Council favored special school tax over Mayor’s impact fee proposal — mirrors the Gulf Shores dynamics where the Mayor and City said the “Apartments are a done deal.”
      - Article 2 provides background on the tax and impact-fee terrain that framed Fairhope’s citizen fight-back and the Gulf Shores lawsuit filed in 2020.

      KEY ENTITIES:
      - Pete Sims — Gulf Shores; represented citizens impacted negatively by the Apartments.
      - Mayor of Gulf Shores — told residents apartments are “a done deal, get over it, there is nothing you can do.”
      - City Council of Gulf Shores — approved the apartment complex over objections of area residents.
      - Gulf Shores citizens — filing the lawsuit.
      - Fairhope citizens — fought back against City Government and elected officials.
      - Mayor of Fairhope — voted out to change planning and zoning rules and P&Z Board members.
      - Fairhope City Council President — favored special school tax over Mayor’s impact fee proposal; statement: “The City Council wants out of any School business.”
      - Mayor of Fairhope — pushed impact fees and more equitable contribution.
      - Planning and Zoning Board (P&Z Board) — official members referenced.
      - Governor Ivy — wants to appoint State School Board Members rather than elect them.
      - Baldwin County School Board — lacked long-term planning; negatively impacted by growth.
      - State School Board — election being ended via bill.
      - Teachers — demand Baldwin County School Board address basic needs; supposed to TEACH not fund-raise.
      - Developers — pay no or little impact fee for projects.
      - Baldwin County — fastest growing County in the State; taxpayer-funded gap.
      - Alabama State General Fund — referenced re: funds misappropriated as far back as 2013.
      - Locations: Gulf Shores, Alabama; Fairhope, Alabama; Baldwin County, Alabama.
    llm_text: Gulf Shores approved apartments over residents’ objections, and the mayor told them, “The apartments are a done deal, get over it.” Pete Sims fought the lawsuit, while Baldwin County keeps letting developers pay no impact fees, so taxpayers cover schools, streets, and education.
