    generated_at: '2026-07-11T05:32:20.395138Z'
    text: Catalyst launched smear campaigns in Fairhope to pave the way for a much
      larger political heist. The sudden run of bought-and-paid-for architect Chris
      Elliott for Senate Seat 32 proves Scott Boone is pushing his local bully tactics
      straight into Montgomery.
