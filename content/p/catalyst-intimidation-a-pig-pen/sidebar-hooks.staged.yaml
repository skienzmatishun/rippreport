  catalyst-birds-of-the-same-feather:
    brief: |-
      THE CONFLICT:
      Catalyst originated with Stacy Elliott and Haygood, morphing when Chris Elliott became a county commissioner and Haygood became Mayor of Daphne.
      Catalyst’s founding plan was to control multiple races, including Probate Judge, State Senate, and all four Baldwin County commission races.

      THE DISCOVERY:
      Catalyst is an organized "old guard" political entity in Baldwin County that strategically selects candidates to place them in maximum number of positions to facilitate deals like the county Mega-Site.

      THE PIVOT:
      Article 2 establishes Catalyst's long-term, structural goal of total control over Baldwin County; Article 1 shows the current, active execution of this plan, including political intimidation (sign disappearance), targeting the Fairhope Mayor, and legal threats (Scott "baby" Boone's lawsuit against The Ripp Report).

