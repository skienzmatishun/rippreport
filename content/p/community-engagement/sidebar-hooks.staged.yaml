  captain-jack-at-the-controls:
    brief: |-
      THE CONFLICT:
      1. After the defeat of former Fairhope Mayor Can’t in 2016, documents revealed suspicious handling of hanger lease bids at the Fairhope Airport Authority.
      2. Captain Jack, under the control of Council President Jack Burrell, was reportedly receiving free air miles and golf vacations from a board member while overseeing the bid process.

      THE DISCOVERY:
      1. The Airport Authority lacked accountability and transparency regarding lease bids and financial records, specifically concerning 7 cents on the dollar fuel income from lease holders, with no shared records on gallons consumed.
      2. Jack Burrell maintained control over the Airport Authority, isolating the City of Fairhope from participation despite the Authority being subsidized by the City.

      THE PIVOT:
      1. Article 2 establishes a historical pattern (post-2016) of Jack Burrell using his position as Council President and liaison to maintain centralized, non-transparent control over city entities (Airport Authority).
      2. This pattern supports Article 1's context where Burrell and other Council members push for decisions (like the Triangle Conservation Easement) without maximizing Community Engagement or outsider input, demonstrating a systemic resistance to public participation.

