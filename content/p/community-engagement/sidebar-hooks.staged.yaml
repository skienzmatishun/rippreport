  gulf-shores-shoot-the-messenger:
    brief: |-
      THE CONFLICT:
      - Past/background: Fairhope Fly Creek Apartments controversy: Gulf Shores Mayor and Council acting same way the previous Mayor of Fairhope, Tim Kant, acted involving the controversy of the Fairhope Fly Creek Apartments.
      - Past/background: Gulf Shores Mayor and buddy developer ignored the sentiments of the community.
      - Past/background: Cost to the Mayor was his job as well as a few councilman; collateral effect in Fairhope resulted in firings, retirements and resignations of over a dozen employees, who needed to go.
      - Past/background: Controversy was not about apartments as much as location, location, location.
      - Past/background: Development would increase the population of the City of Gulf Shores by almost 5 percent, based on 512 people or 2.5 residents per unit.
      - Past/background: Development would add 400 to 500 more cars on an already busy street in a residential area; Gulf Shores proper was almost in a state of gridlock.
      - Past/background: If the development was approved, four-way stop signs in the “Small Town” section of Gulf Shores would be replaced by traffic signals.
      - Past/background: Told by the Real Estate Company (Remax Paradise) that the developer planned to build townhomes; shocked after the fact that a site plan had been approved by the City Planning Commission for a high-density, four-story apartment complex with absolutely no prior notice to citizens living in the neighborhood; residents were given no input.
      - Past/background: Basis for the petition SAVE OUR NEIGHBORHOOD STOP REGENCY PLACE APARTMENTS; petition had more than 750 people supported.
      - Past/background: City of Gulf Shores current position was to ignore complaints and threats of lawsuits by citizens; Gulf Shores Mayor and Planning insisted all is in order and those complaining have no merit; “Shoot the messenger” mistake was the Fairhope’s Mayor and developer mistake.
      - Past/background: If it were not for a few messengers, Mr. Pete Sims being the most vocal, who tried to alert The Enclave and The Regency Club of the long term negative effects of the apartments, there would be no message, no information.
      - Past/background: Boards were not carrying the banner of protest; they should be the messengers, not the ones shooting the messengers.
      - Past/background: Condo associations are notorious for lack of communication, residential geniuses, and boards that are more known for the confusion they cause than the solutions they solve.
      - Past/background: The Enclave and The Regency Club were currently pointing fingers at each other, shooting the messenger and falling into an abyss of “NO ACTION”, which is exactly what Gulf Shores counted on.
      - Past/background: Fairhope, just like Gulf Shores, has Planning and Zoning regulations; under Tim Kant, Gulf Shores violated its own regulations more often than anyone else.
      - Past/background: Fairhope elected a new Mayor who concentrated on changing the membership of Planning and Zoning, with new appointments; the Mayor also updated Planning regulations and plans further changes as a result of public participation; the Mayor settled, all but one, of the pending lawsuits inherited from the last administration and a Planning Board who favored developers over the citizens.
      - Past/background: Citizens of Gulf Shores need to understand that the problem is Planning and Zoning and its mindset; the Mayor makes those appointments; you have to change the Mayor to change Planning and Zoning; if you really want change then you also replace the council in the same election; it has taken 2 and half years in Fairhope with only one position left on P&Z, and he soon will be exiting the building.
      - Past/current: March 27 Fairhope Work Session: first 15 minutes involved the K-1 Center; next 15 minutes was discussing a Conservation Easement on the Triangle property 109 acres.
      - Past/current: Baldwin County School Board had been wanting to sell the K-1 Center for over 10 years; the only buyer considered was the City of Fairhope; the Council could not beat its chest that they put together anything new, it was overdue; the Council had its own plan that failed.
      - Past/current: The Mayor had a back up plan and now the sale was on track again.
      - Past/current: The first effort by the Council to determine the use of the K-1 had restricted public participation; the Jack Plan went heads first into failure.
      - Past/current: The Mayor was trying to maximize Community Engagement discussions for the K-1 Center, the Triangle property, and the Comprehensive Land Use Plan.
      - Past/current: Important: Tuesday April 2nd @ 9:00AM public meeting, Nix Center, will be held to select Training Facilitators, approximately 30, for 30 tables that will host the April 3 meeting; this is a training meeting that will prepare the Facilitators to guide the conversation on April 3.
      - Past/current: PLEASE participate in discussing the best use of the K-1 Center; this decision should be decided by the citizens of the community, not 3 councilman.
      - Past/current: The K-1 Center, Nix Center and Fairhope Community Park were included in the 4 million dollar purchase, no funds for development were currently budgeted for the K-1 Center.
      - Past/current: The Triangle LAWSUIT SETTLEMENT was 8.25 million with an additional 3 million in legal fees.
      - Past/current: Mr. Burrell has always insisted the Triangle property was purchased for a park, that is total BS; to pay for the property, Mayor Can’t and President of the Council Jack Burrell raided the utility fund for 3 million, and took a loan for the rest; the attorneys got their 3 million up front.
      - Past/current: Keep in mind the City of Fairhope has under commission a Comprehensive Land Use Plan; the Mayor is promoting this under the banner of Community Engagement; the Council President does not think the Council needs “outsider input”.
      - Past/current: Notice in the last 15 minutes of the video how Council President Burrell and Councilman Brown push for a Conservation Easement; Burrell and Brown know they can count on bee Boone, for that third Catalyst vote.
      - Past/current: Councilman Conyers and Robinson favor the Community Engagement route, along with the Mayor.
      - Past/current: Burrell, Boone and Brown all favor a Conservation Easement and they want to rush that decision before the Comprehensive Land Use Plan is finished.
      - Past/current: WHY because Catalyst does not want anything done on the property and a Conservation Easement will accomplish that; the Citizens of Fairhope better not let that happen.
      - Past/current: President of the Fairhope Council famously said he was tired of hearing from the citizens, citizens, citizens; the CITIZENS better be sure Burrell gets the message.

      THE DISCOVERY:
      - Article 2, as the older/background article, showed that Gulf Shores Mayor and Council were acting like the previous Mayor of Fairhope, Tim Kant, regarding the Fairhope Fly Creek Apartments controversy.
      - Article 2 showed that the Gulf Shores Mayor and buddy developer ignored the sentiments of the community.
      - Article 2 showed that the “Shoot the messenger” mistake was the Fairhope’s Mayor and developer mistake.
      - Article 2 showed that the City of Gulf Shores current position was to ignore complaints and threats of lawsuits by citizens; Gulf Shores Mayor and Planning insisted all is in order and those complaining have no merit.
      - Article 2 showed that the Planning and Zoning mindset favored developers over citizens.

      THE PIVOT:
      - Article 2 is the smoking gun for Article 1 because it is the older/background article and frames Fairhope’s current K-1/Triangle/Community Engagement/Conservation Easement conflict as similar to the Fairhope/Gulf Shores Fly Creek pattern.
      - Article 2 prior case: Mayor/developer ignored community; “shoot the messenger” mistake; Planning and Zoning favored developers; “NO ACTION.”
      - Article 1 current case: Council President Burrell and Councilman Brown push for a Conservation Easement; Burrell and Brown know they can count on bee Boone for that third Catalyst vote; Burrell, Boone and Brown favor a Conservation Easement and want to rush that decision before the Comprehensive Land Use Plan is finished; Catalyst does not want anything done on the property and a Conservation Easement will accomplish that.
      - Article 2 suggests Article 1’s public participation/Community Engagement issue may be a repeat of past behavior; citizens better not let that happen.

      KEY ENTITIES:
      - People: Mayor Wilson; Councilman Conyers; Council President Jack Burrell; Councilman Brown; Councilman Robinson; Mayor?; Mr. Burrell; Mayor Can’t; Mayor Tim Kant; Mr. Pete Sims; Mayor of Gulf Shores; Council of Gulf Shores; Planning Board; Catalyst; Utility Director; Lowery, Wilters (per instruction, not established in provided text).
      - Organizations: Baldwin County School Board; City of Fairhope; Fairhope City Council; Mayor and Council?; Council President?; Planning and Zoning; Catalyst; City of Gulf Shores; Gulf Shores Mayor and Planning; City Planning Commission; Condo Associations; SAVE OUR NEIGHBORHOOD STOP REGENCY PLACE APARTMENTS; The Enclave; The Regency Club; Remax Paradise; City of Fairhope; City of Gulf Shores; Comprehensive Land Use Plan.
      - Locations: Fairhope; Gulf Shores; Baldwin County; Fairhope Community Park; K-1 Center; Nix Center; Triangle property; Fly Creek Apartments; The Enclave; The Regency Club; Small Town section of Gulf Shores; Gulf Shores proper; residential area.
      - Dates/Money/Events: March 27 Fairhope Work Session; first 15 minutes K-1; next 15 Conservation Easement Triangle 109 acres; Tuesday April 2nd @ 9:00AM public meeting Nix Center; April 3 meeting; Training Facilitators approx 30 for 30 tables; 4 million dollar purchase; no funds budgeted; Triangle LAWSUIT SETTLEMENT 8.25 million; additional 3 million legal fees; utility fund 3 million; loan rest; attorneys 3 million up front; Baldwin County School Board wanted sell over 10 years; Mayor Wilson refused duel salaries; Mayor/Utility Director position in limbo since election; former Mayor enjoyed over 10 years; Comprehensive Land Use Plan; Conservation Easement; Catalyst; 30 tables; 3 councilman; 109 acres; 8.25m; 3m; 4m; 512 people; 2.5 residents per unit; 400-500 cars; 5 percent; 750 petition signatures.
