  baldwin-county-sewer-regulation-a-litmus-test:
    brief: |-
      THE CONFLICT:
      - September 16, 2019: Author delivered complaint against Councilman Robert Brown to Alabama Attorney General, White Collar Crime Division, Special Prosecutors; complaint letter accompanied by 42-page booklet of supporting documents.
      - Councilman Robert Brown and business partner Cliff Pitman accused of using elected position for personal gain; may not be criminal but lacks ethical standards; stains Fairhope.
      - Greeno Road Overlay District: Jester, Burrell, Boone called for community engagement; Mayor had already implemented public meetings; author called it DISTRACTION.
      - 2020: Burrell, Boone, Brown had NO community engagement for full family insurance; unanimously said NO to black community re: recreation land.

      THE DISCOVERY:
      - Baldwin County sewer regulation (Widget Article): Baldwin County Sewer System (BCSS) is a privately owned monopoly servicing 19,000 homes.
      - BCSS charges unregulated fees; no limit on what they can charge; hypothetical example: $154.50/month; non-payment results in sewage being turned off.
      - Consumer issue: $6.00 toll defeated by poll; petition reached 50,000 mark; elected officials "hit their knees."
      - Richard Dayton of GlenLakes subdivision, Foley, leading charge; petition to Baldwin County residents served by BCSS.
      - Shelby County elected officials began fighting unregulated fees with protective legislation; Baldwin County fastest growing county in Alabama.

      THE PIVOT:
      - Article 2 is older/background context: frames consumer protection via petition (50,000 signatures) and legislation; $6.00 toll defeat as precedent.
      - Article 1 (2019) applies same framework to local government: complaint against Brown, transparency, AG complaint.
      - Article 2 is the smoking gun because its petition/legislation model (defeat monopoly/toll) maps directly to Article 1's local ethics/transparency fight; litmus test petition concept parallels Fairhope complaint.

      KEY ENTITIES:
      - Robert Brown, Councilman, Fairhope; Cliff Pitman, Brown business partner; Burrell, Boone, council members; Fairhope Mayor; Alabama Attorney General; White Collar Crime Division; Special Prosecutors; Fairhope; Greeno Road Overlay District; Fairhope Transparency; Jester.
      - Baldwin County; Baldwin County Sewer System (BCSS); Richard Dayton; GlenLakes subdivision; Foley; Shelby County; Tucker Dorsey; County Attorney; Lagniappe; The Ripp Report.
      - Lowery, Wilters.
    llm_text: Councilman Robert Brown took on a sewer monopoly in Fairhope, but the same playbook that beat Baldwin County's $6.00 toll—50,000 signatures and elected officials hitting their knees—now fuels the fight against his own corruption. Fairhope's battle just found its smoking gun.
