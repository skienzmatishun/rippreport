  rsa-⁠-no-gas-for-point-clear-or-tourism:
    brief: |-
      THE CONFLICT: Dispute between Point Clear Properties Association and RSA (Retirement Systems of Alabama) regarding the 1.27-acre marina next to the Grand Hotel. RSA removed fuel tanks and stopped pumping to the public, impacting tourism, despite local opposition (over 400 petition signatures) to a 12-unit condo project. (Date context: Prior to Sept 16, 2019).
      THE DISCOVERY: RSA utilized its ownership power to restrict public access to fuel/marina services in the Eastern Shore, prioritizing a potential zoning change (TRD to allow condos) over supporting local tourism and community access.
      THE PIVOT: The historical incident (RSA prioritizing private development/gain over community tourism/access) establishes a pattern of self-serving actions and lack of ethical conduct by powerful entities, which the Main Article uses to contextualize and support accusations against Councilmen Brown, Burrell, and Boone regarding their use of elected positions for personal gain (e.g., family insurance, 2.6 million dollar land vote).
      KEY ENTITIES: Robert Brown, Boone, Burrell, Cliff Pitman, RSA (Retirement Systems of Alabama), Point Clear Properties Association, Baldwin County Planning Commission, Fairhope.
    llm_text: RSA shut down the Point Clear marina for private condo development, overriding 400+ local signatures. See how this pattern of self-serving decisions links to ethical accusations against Councilmen Brown, Burrell, and Boone.
