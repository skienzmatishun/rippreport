  fairhope-council-shows-its-colors:
    brief: |-
      THE CONFLICT: Proposed special election for Council-Manager form of government was scheduled for October 2, 2018, based on a petition signed by over 800 Fairhope citizens, triggering a 90-day election period under Alabama Constitution.
      THE DISCOVERY: The election was legally triggered by the Alabama petition process (800+ signatures accepted by probate judge) and a revised July 2018 statute, not solely by the Council's outdated opinion.
      THE PIVOT: The Council's subsequent instruction to the City Attorney to find loopholes to delay the October 2, 2018, vote (leading to the Nov 6, 2018, vote) was an attempt to circumvent a legally mandated, citizen-driven democratic process.
      KEY ENTITIES: Fairhope City Council, Mayor Karin Wilson, City Attorney, Catalyst, Probate Judge, November 6, 2018, October 2, 2018, July 2018.
    llm_text: Fairhope citizens signed over 800 petitions, legally triggering an October 2, 2018, Council-Manager election. Mayor Karin Wilson and the City Council attempted to delay this democratic process, pushing the vote to November 6, 2018.
