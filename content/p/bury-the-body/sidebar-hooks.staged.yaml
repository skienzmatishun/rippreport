      *   Fairhope City Council members (Jack Burrell, Kevin Boone, Robert Brown) obstructed government change for years under the "at large" system.
      *   Jack Burrell faced an Airport Scandal and was alleged to have threatened the owner of McSherry’s while drunk.
      *   Kevin Boone (grandpa Catalyst) maintained connections with John Avant of Prebble Rish and accumulated multiple LLCs.
      *   Robert Brown was accused of self-enrichment by awarding a sweetheart contract for the Art Center to himself and Cliff Pittman, leading to Ethics charges.
      *   The Council attempted to stop the Oct. 2, 2018, vote to change government, instructing the City Attorney to find a loophole, ultimately delaying the vote to Nov. 6, 2018.

      THE DISCOVERY:
      *   Article 2 revealed the composition of the "blast from the past" movement (former Council persons, fired/quit employees, Zunk the Skunk).
      *   It established that the existing "at large" structure allowed Council members to avoid accountability and enable Catalyst to slate candidates.
      *   It documented specific instances of financial and ethical misconduct by key Council leaders (Burrell, Boone, Brown) over a period of at least 18 months.

      THE PIVOT:
      *   Article 2 provides the historical context and established pattern of self-interest and obstruction by the "three bees" (Burrell, Boone, Brown).
      *   This pattern explains the Council’s calculated attempt (detailed in Article 1) to use legal loopholes to prevent the Council/Manager form of government, which would reduce their unchecked power.

