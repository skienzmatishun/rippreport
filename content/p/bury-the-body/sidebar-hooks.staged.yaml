  catalyst-panic-and-confusion:
    brief: |-
      THE CONFLICT:
      *   Attempted change of government in Fairhope, including an election scheduled for Oct. 2, 2018.
      *   Fairhope City Council later used legal means to delay the vote, resulting in the election moving to Nov. 6, 2018.

      THE DISCOVERY:
      *   Article 2 showed the Catalyst Fairhope Council was "asleep at the wheel" regarding legal ramifications of the government change.
      *   The Council only reacted after the Attorney General weighed in with a negative opinion.
      *   Article 2 highlighted the Council's obstructionism and lack of public forums regarding the change of government.

      THE PIVOT:
      *   Article 2 establishes that the Council was aware of the legal and civic necessity for the change *before* they instructed the City Attorney to find a loophole to obstruct the Oct. 2 election (Article 1).
      *   It proves their initial reluctance and fear, contradicting their later public stance of confusion or necessity for the delay.

      KEY ENTITIES:
      *   Fairhope City Council
      *   City Attorney (Council Attorney)
      *   Mayor
      *   Attorney General
      *   Catalyst
      *   Nov. 6, 2018
      *   Oct. 2, 2018
