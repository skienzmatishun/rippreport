  hell-yea:
    brief: |-
      THE CONFLICT:
      The Fairhope City Council, an "at large" body rooted in Catalyst, resisted a change of government (moving to 3 district council persons plus Mayor and one at large).
      Mayor Wilson posted support for Fresh Start Fairhope on June 21st.
      On July 10th, Chuckee Cheeze (Courier editor) reported on Kevin Boone filing a complaint against Mayor Wilson's efforts to clarify confusion.
      The initial election date for the change of government was Oct. 2, 2018, supported by Chuck Zunk.
      The Fairhope City Council ultimately instructed the City Attorney to find a loophole, resulting in the election delay to Nov. 6th, 2018.

      THE DISCOVERY:
      The Fairhope City Council demonstrated a pattern of intimidation and censorship, linking its power to Catalyst/The Good Ole Boys, and attempting to suppress dissent.
      Ripp filed a suit in the US District Court, Southern District, alleging Burrell denied First and 14th Amendment rights.
      The Council refused to accept blame for actions, despite accusations of being a "free speech censor."

      THE PIVOT:
      Article 2 establishes the Council's history of resistance, alleged censorship, and political intimidation (via Kevin Boone/Catalyst) leading up to July 2018. This history provides the context for Article 1, which details the Council's calculated decision to deliberately interfere with the Oct. 2, 2018 election to protect its existing "at large" power base.

      KEY ENTITIES:
      Fairhope City Council
      Catalyst / King Kant Kingdom
      Mayor Wilson
      Kevin Boone
      Chuckee Cheeze (Courier editor)
      Chuck Zunk
      The Ripp Report
      City Attorney / City Clerk
      Nov. 6th, 2018
      Oct. 2, 2018
    llm_text: The Fairhope City Council used legal loopholes and intimidation, involving Kevin Boone and Catalyst, to block the Oct 2, 2018 election. The Ripp Report found they censored dissent to protect their "at large" power base, demanding accountability from Mayor Wilson.
