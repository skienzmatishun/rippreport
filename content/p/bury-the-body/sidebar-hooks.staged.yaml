  catalyst-sold-to-the-highest-bidder:
    brief: |-
      THE CONFLICT:
      *   David Northcutt and Chris Elliott contested a July 17th run-off election for a State Senate Seat.
      *   The Fairhope City Council attempted to delay an October 2, 2018 vote to change government in Fairhope, moving the vote to November 6, 2018.

      THE DISCOVERY:
      *   Chris Elliott collected almost $500,000 in campaign funds, potentially reaching $750,000 for the State Senate Seat ($42,000 salary).
      *   Elliott secured the Education 1% tax without a public vote and skimmed money from it for county infrastructure, despite a $40 million "Black Hole" mega-site expenditure.
      *   Elliott utilized political alliances including Hoss Mack (Sheriff), Eddie Tyler (Superintendent of Education), and Stragtegy (managed by Jon Gray), who collected $140,951.80 for the campaign.

      THE PIVOT:
      *   Article 2 reveals that the Fairhope City Council is composed of individuals with "deep roots within Catalyst," the powerful political entity that supports Chris Elliott, Hoss Mack, and Eddie Tyler.
      *   This context explains the Council's self-serving actions (delaying the election) to protect the established power structure ("King Kant Kingdom" / "The Good Ole Boys") detailed in Article 1.

