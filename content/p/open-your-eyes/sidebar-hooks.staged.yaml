      *   Council members Jack Burrell, Kevin Boone, and Robert Brown are accused of self-serving political actions.
      *   The "At Large" election system in Fairhope allows Catalyst to slate candidates and prevents individual council members from being accountable to a specific district.
      *   Robert Brown (The Jester) awarded a contract for the Art Center to himself and Cliff Pittman, a director of Single Tax.
      *   Many LLCs linked to Boone have disappeared from the State of Alabama Secretary of State website after public exposure.

      THE PIVOT:
      *   Article 2 provides a local, granular example (Fairhope) of the systemic, entrenched political corruption and self-dealing (e.g., At Large system, contract rigging) that Article 1 broadly attributes to the decades of "corrupt, republican rule" in Alabama.
      *   Both articles argue that the current political structure (At Large/straight-ticket voting) is failing citizens and hindering progress.
      *   Both articles propose structural solutions: moving toward a Council/Manager form of government and electing principled, non-machine candidates.

