  alabama-ethics-a-political-tool:
    brief: |-
      THE CONFLICT: Senator Trip Pittman used his elected office to secure Fairhope municipal contracts totaling $750,000 while violating ethics rules, assisted by former Mayor Tim Kant. His related complaints were abandoned in Attorney General Luther Strange's office, despite FBI and grand jury involvement. This occurred while Jack Burrell and Fairhope Airport Authority board member Ray Hix were facing ethics complaints.

      THE DISCOVERY: The Alabama Ethics Commission has historically failed to hold elected officials accountable in Baldwin County, allowing politicians like Pittman to commit ethical violations with impunity and manipulating guidelines for personal gain.

      THE PIVOT: Article 2 establishes the historical pattern of the Ethics Commission (e.g., ignoring Pittman’s $750,000 contract violations and abandoning complaints) which proves Article 1’s current dismissal of Burrell and Hix as "not probable cause" is not an impartial ruling but standard operational procedure confirming the commission's institutional failure.

