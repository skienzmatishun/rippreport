    brief: |-
      THE CONFLICT:
      *   Tom Albritton, Alabama Executive Director of the Ethics Commission and Mabel Amos Trust trustee, awarded himself $135,000 for children's university attendance from the trust.
      *   Between 2013 and 2021, approximately 3.2 million of the Mabel Amos Trust funds were awarded to anonymous recipients.
      *   The Ripp Report filed complaints against Albritton exceeding 100 pages, which were dismissed by Albritton, the Ethics Director.
      *   In Baldwin County, GOB/Catalyst controls key positions (Circuit Clerk, Mayors like Fairhope, Sheriff Hoss Mack, school system Eddie and Gray), leading to a lack of transparency and accountability.

      THE DISCOVERY:
      *   The Mabel Amos Trust, originally $500,000, ballooned to $4.1 million by 2011 after oil was discovered in 2010.
      *   Albritton's conduct demonstrated high-level self-serving behavior and misuse of a trust, which discredited the Alabama Ethics Commission.
      *   Allen Dodd was appointed Deputy Alabama Attorney General following the lawsuit against Albritton.

      THE PIVOT:
      *   Article 2 provides historical evidence of systemic corruption and failure of state ethics oversight (Albritton dismissing complaints) which validates the claims in Article 1 that Baldwin County suffers from a lack of accountability and transparency due to GOB control.
      *   It proves that the mechanisms designed to enforce ethics are vulnerable to self-interest, reinforcing the need for independent candidates like Kim Earl and Carrie Hosier against Catalyst/GOB candidates like Andrea Lindsey.

