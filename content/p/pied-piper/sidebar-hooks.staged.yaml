      THE CONFLICT:
      A political cabal operating under the name CATALYST influenced Baldwin County politics for years, later rebranding to Scott Boone Consulting (SBC) during the 2020 election cycle, successfully electing a Mayor and 4 councilmen in Fairhope.

      THE DISCOVERY:
      SBC established control by appointing a Municipal Judge (Fairhope's biggest developer) and a City Attorney loyalist; Hand Anderall was involved in the Triangle Lawsuit, costing taxpayers $3 million; SBC moved to kill the waterfront project and push the Publix project/Fly Creek Apartments, leading to a City Council agenda item for annexation of Parker Road on January 25, 2021.

      THE PIVOT:
      The SBC cabal established the pattern of controlling Fairhope development and influencing projects (e.g., waterfront changes, Publix expansion). Jack Burrell, representing SBC (as Catalyst/Scott Boone Consulting), later exploited this established influence to push the $6.2 million Waterfront project changes, electric substation placement, and the Bayway Bridge toll plan, leveraging compliance issues triggered in 1992 that were only tackled in 2021.

