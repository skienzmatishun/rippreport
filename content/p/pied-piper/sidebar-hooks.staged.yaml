    brief: |-
      THE CONFLICT:
      *   The $6.2 million Fairhope Waterfront project initially received overwhelming citizen support over 18 months.
      *   Following municipal elections, the plan was politically distorted and significantly reduced, moving from resilient design to short-sighted maintenance ("Redneck Renovation").
      *   This shift was driven by political lies (e.g., "Plan to bulldoze the historic park at the municipal pier"), amplified by Howelling Raines and the new council under CATALYST/Scott Boone Consulting.

      THE DISCOVERY:
      *   The original waterfront plan included a protected swimming area and a jetty system, which provided recreational use (kayaks/canoes) and protected the Grand Hotel from minimal damage during the last two hurricanes.
      *   The final plan gutted these features; the jetty was thrown out, and the focus shifted to minimal ADA ramp changes instead of ADA-compliant winding paths, erasing all previous public comments.

      THE PIVOT:
      *   Article 2 establishes that the initial compromise of the waterfront project was a deliberate political act following the elections.
      *   Article 1 shows Jack Burrell (Pied Piper, Chairman of Eastern Shore MPO) continuing this pattern by personally disliking the protective jetties and proposing to scrap them, thus perpetuating the financial waste and poor decision-making documented in Article 2.

