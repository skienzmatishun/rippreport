    brief: |-
      THE CONFLICT:
      *   Jack Burrell served two terms as Fairhope City Council President before starting a third term.
      *   The City of Fairhope was sued in Federal court for denying public speech, losing the lawsuit and costing taxpayers thousands.
      *   Burrell was known for bid rigging at the Fairhope Airport Authority (FAA).
      *   The FAA issued an RFP on September 21, 2015, with a submittal date of October 13, 2015, and an opening on October 20, 2015 (22 days).
      *   Robert Brown purchased his "family" property on July 21, 2020.
      *   Burrell moved quickly to replace Robert Brown with Jay Robinson, granting Robinson an estimated $100,000 salary/insurance.

      THE DISCOVERY:
      *   Article 2 established Burrell's pattern of suppressing public information, including denying online FAA meeting recordings and scheduling them at 5:00 pm.
      *   Burrell controls the council, supported by City Attorney Marcus McDowell and connected figures like Kevin Boone (father of Scott Boone).
      *   The Airport Authority, though subsidized by the city, lacked public transparency and accountability under his direction.

      THE PIVOT:
      *   Article 2 provides historical evidence (2015-2020) of Burrell systematically abusing authority, suppressing information, and serving special interests (e.g., through SBC) which validates the current claims in Article 1 of "poor decisions, confusion, and corruption" (e.g., $6.2 million waterfront project, electric substation placement).
      *   The recurring issue of Robert Brown/Jay Robinson links the past political maneuvers to current council dynamics.

