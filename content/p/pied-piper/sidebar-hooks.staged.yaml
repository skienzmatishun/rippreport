    brief: |-
      THE CONFLICT:
      *   Tim Kant was a qualified utility engineer who managed Fairhope infrastructure prior to the current administration.
      *   In September 2018, the K-1 center was purchased and began disintegrating, requiring about $100,000 for a temporary roof.
      *   The city lost $3 million in the Triangle Lawsuit by raiding the utility fund.
      *   In the past, Council President Jack Burrell and Sherry Sullivan fired the qualified utility engineer, Wilson, replacing him with High School Sullivan as utility director.
      *   Council President Jack Burrell brokered a $600,000 clock deal for a 26x60 lot, with the city paying half ($262,500) and the Fairhope Single Tax Colony paying the remainder.
      *   Jack Burrell purchased 114 acres near the Airport for $2.65 million, later leasing it to a farmer for $9,000 annually.

      THE DISCOVERY:
      *   Article 2 reveals a historical pattern of political decisions (e.g., firing qualified staff, poor contract negotiations, high-cost land deals) prioritizing political control and low tax revenue over expert advice and sound fiscal management.
      *   Mayor Sullivan received a $25,000 utility salary alongside her Mayor salary.

      THE PIVOT:
      *   The historical pattern of ignoring qualified expertise (Kant/Wilson) and prioritizing political/development interests (Hawthorn-Glenn substation issue, $600k deal) established in Article 2 provides the context for the current costly, politically driven decisions in Article 1 (e.g., the $6.2 million Waterfront project waste, the 8300 Morphy Ave zoning change, and the controversial Bayway Bridge toll proposal).

      KEY ENTITIES:
      *   Jack Burrell (Fairhope City Council President, Eastern Shore MPO Chairman)
      *   Sherry Sullivan (Mayor)
      *   Tim Kant (Qualified utility engineer)
      *   Wilson (Qualified utility engineer, fired)
      *   Jay Robinson
      *   Robert Brown (disappeared after purchasing family property on July 21, 2020)
      *   Richard Shelby (Senator, suggested Federal Infrastructure Bill funding)
      *   Catalyst/Scott Boone Consulting
      *   Fairhope Waterfront
      *   Hawthorn Glenn Subdivision
      *   8300 Morphy Ave
      *   Fairhope Airport
      *   MPO (Metropolitan Planning Organization)
