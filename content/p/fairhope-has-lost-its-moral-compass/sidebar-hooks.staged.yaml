  chainsaw:
    brief: |-
      THE CONFLICT: Baldwin County Commissioner Chris Elliott and Tucker Dorsey (Catalyst candidates) attempted to deny public access to Zundel’s Road to Mobile Bay, leading to public pressure during the June 5 Primary election.
