      THE PIVOT: Article 2 provides historical context demonstrating a pattern where local elected officials prioritize private/donor interests over public access, framing the later accusations in Article 1 regarding Jack Burrell's misuse of elected power and conflicts of interest (e.g., free plane travel from bidders) as part of a systemic ethical failure in Fairhope.
