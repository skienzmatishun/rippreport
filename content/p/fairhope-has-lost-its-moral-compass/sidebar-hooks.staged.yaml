  paradise-lost:
    brief: |-
      THE CONFLICT:
      *   Jack Burrell (City Council President) allegedly accepted free plane transportation from bidders related to the Fairhope Airport bid for a Board member and Fairhope Municipal Judge.
      *   Mr. Burrell allegedly lied about a police record during his run for office.
      *   The Council, including the Police Chief, orchestrated a public meeting to embarrass Mayor Wilson.
      *   Mr. Burrell is involved in a Federal lawsuit for which the City of Fairhope is paying legal bills.

      THE DISCOVERY:
      *   Article 2 (older context) revealed that rapid residential growth in coastal areas, including Daphne/Fairhope, is outpacing adequate infrastructure development (traffic, congestion, crowded schools).
      *   Article 2 noted that these communities have a finite carrying capacity and require regional planning (Baldwin County) and public transit solutions (ferry to Mobile, trolley).

      THE PIVOT:
      *   Article 2 establishes the high-growth, infrastructure-strained environment of Fairhope, setting the stage for the political crisis detailed in Article 1.
      *   Article 1 demonstrates how political leadership (Burrell) is failing to provide the necessary "smart growth" and ethical guidance required to manage the complex, finite capacity of a rapidly developing coastal town.

      KEY ENTITIES:
      *   Jack Burrell (City Council President)
      *   Mayor Wilson
      *   Fairhope City Council
      *   Police Chief
      *   Daphne
      *   Gulf Shores/Orange Beach
      *   Fairhope Airport
      *   Baldwin County
