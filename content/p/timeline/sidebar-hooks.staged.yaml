  mega-mistake:
    brief: |-
      THE CONFLICT:
      - Ripp Report received a comment accurately describing Fairhope City Council and their obstruction in infrastructure repairs.
      - Sewer issue finally awakened Fairhope citizens.
      - City hall received numerous calls from irate citizens blaming the Mayor and City Staff for problems that squarely rest on the Council’s shoulders.
      - Where is the TIMELINE of the City Council?
      - Citizens should be raising hell, but raise hell at the responsible party.
      - Call the City Council and ask for a timeline.
      - If the sewer issue pisses you off, how about three of the same Council using their elected office for personal gain?
      - While the other two Council members turned a blind eye.

      - Baldwin County Mega-Mistake background: 32 million spent, 2 million a year in payments, and 7 years later Baldwin County Mega-Site still vacant.
      - Baldwin County Economic Development Alliance under leadership of Mr. Lee Lawson has not been able to find a tenant.
      - Lost opportunity of the 32 million and 7 years of interest has driven the expense of the Mega-Mistake to approximately 50 million.
      - Seven years and Mr. Lawson’s plan is now to transfer title of the 50 million mega-site to BCEDA.

      - Sounds a lot like Fairhope and the City Council wanting to give away 20 million worth of municipal property.

      THE DISCOVERY:
      - Article 2 revealed Baldwin County has a media drain.
      - Lagniappe and the Ripp Report appear to be the only sources willing to report news.
      - Other media published articles are “fluff” or so mundane and lacking any back story that the reader can make little sense out of the content.

      - Article 2 context: 32 million spent, 2 million a year in payments, 7 years later, Baldwin County Mega-Site still vacant.
      - BCEDA under Mr. Lee Lawson leadership has not been able to find a tenant.
      - Lost opportunity of 32 million and 7 years of interest drove expense of Mega-Mistake to approximately 50 million.
      - Seven years and Mr. Lawson’s plan is now to transfer title of the 50 million mega-site to BCEDA.

      - Mr. Lawson can give a good speech but he never delivers.
      - In Fairhope he failed when it came to the K-1 Center.
      - Again he failed to produce any results at the Fairhope Airport, aka Jack Burrell International.
      - Effort is always important however results is what counts and Lawson has produced very little when it comes to results.
      - Mr. Lawson is all smoke and mirrors, his track record and that of the Baldwin County Economic Development Alliance is dismal, at best.
      - Seven years of bull---- and now the solution to the mega-mistake is to transfer title to Lawson’s exclusive control.

      - Special meeting July 25th has been called by the Baldwin County Commission to discuss just how to package this gift of land to a very incompetent third party.
      - For those who have not been to “special called meetings” be advised these special meetings goal is to suppress public participation.
      - Any transfer of the mega-mistake property should be fully vetted by the public, not a few commissioners.

      THE PIVOT:
      - Article 2 is older than Article 1 and should be framed as background/historical context.
      - Article 2 is the smoking gun or key context for Article 1 because it contains the Mega-Mistake and parallels to Fairhope and the City Council.
      - Article 2: elected officials appear ready to transfer title of County and municipal lands to third parties, without full public participation.

      - In Fairhope the council is on thin ice about their slick proposal to give Weeks Bay full and total control of municipal land, 106 acres, valued at 20 million dollars.
      - Over 600 people have signed a petition in Fairhope in opposition to this secret deal that was kept from the public until the last minute.
      - If you have not signed the petition, please do so.
      - This issue as well as the Mega-Mistake may wind up in class action lawsuits if the County Commission and Fairhope Council do not make every effort to inform the public of their intentions.

      - Back to Mr. Lawson and the Mega-Mistake, here is a little back story for ya to consider, before the citizens of Baldwin County make the same mistake twice.

      THE KEY ENTITIES:
      - Fairhope City Council
      - Fairhope Mayor
      - Fairhope City Staff
      - Fairhope citizens
      - City Council members
      - Three Council members allegedly using elected office for personal gain
      - Two Council members who turned a blind eye
      - Peterson
      - Robert Brown
      - Burrell
      - Sewer
      - Baldwin County Commission
      - Baldwin County Economic Development Alliance (BCEDA)
      - Mr. Lee Lawson
      - Baldwin County Mega-Site
      - South Alabama Mega Site
      - Weeks Bay
      - Fairhope Airport, aka Jack Burrell International
      - K-1 Center
      - Baldwin County
      - Alabama
      - Lagniappe
      - Ripp Report
      - Lowery
      - Wilters
      - City Hall
    llm_text: Fairhope City Council got a sewer wake-up call, but citizens should still be furious. Now the Baldwin County Mega-Mistake shows the same elected officials may hand Lee Lawson's BCEDA a 50 million dollar site without public input.
