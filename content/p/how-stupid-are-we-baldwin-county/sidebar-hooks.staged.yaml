  restore-act-accountability:
    brief: |-
      THE CONFLICT:
      Gulf Oil Spill (BP Boom Grant) occurred in 2010, leading to grant distribution in Baldwin County overseen by Governor Bob Riley and the Alabama Emergency Management Association. Grant fraud and corruption were alleged, including the conviction of Mayor Stan Wright (Bayou La Batre).

      THE DISCOVERY:
      Senator Lee "Trip" Pittman received $639,000 from the City of Fairhope and $98,000 from the City of Perdido Key via BP disaster monies, despite promised audits never being conducted.

      THE PIVOT:
      The 2010 BP Boom Grant scandal established a historical pattern of financial corruption and misuse of public funds by Pittman, providing context for his subsequent arrangement with Bob James—annually passing back and forth the Fairhope Emergency Debris Removal contract since 2007 (extended to July 11, 2014).

