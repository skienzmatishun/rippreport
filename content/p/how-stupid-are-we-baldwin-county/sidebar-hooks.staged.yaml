  primary-election-endorsements-2014:
    brief: |-
      THE CONFLICT:
      *   BP Boom Grant Scandal involved Senator Pittman, Mayor Kant, Tucker Dorsey, and Frank Burt.
      *   This scandal led to the firing of county employees Leigh Ann Ryals, Michael Thompson, and Scott Barnett.
      *   Pittman maneuvered legislation to limit Sheriff candidates, backing "Hoss" Mack, which he later admitted was likely unconstitutional.
      *   Pittman and Bob James have annually passed back and forth the Fairhope Emergency Debris Removal contract since 2007.
      *   The contract was extended to July 11, 2014.
      *   The Fairhope Courier reported a "Million Dollar Contract" award on August 11, 2010.

      THE DISCOVERY:
      *   The "Sicko Six" (including Pittman, Dorsey, James, and Charles Gruber) used public service to gain personal financial contracts.
      *   Pittman maintained the emergency debris removal contract despite being involved in the BP Boom Scandal.
      *   Pittman doubled the county commission's pay.
      *   Pittman endorsed Bob James for county commissioner in the June 3, 2014 primary.

      THE PIVOT:
      *   The Widget Article (pre-June 3, 2014 primary) established the pattern of systemic corruption (BP Boom cover-up, contract misuse, unconstitutional legislation) that makes the ongoing debris removal contract endorsement in the Main Article (July 11, 2014 deadline) an ethical violation, not an isolated event.

