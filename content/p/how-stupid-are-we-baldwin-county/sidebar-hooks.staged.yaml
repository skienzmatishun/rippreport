    brief: |-
      THE CONFLICT: Senator Lee "Trip" Pittman and Mayor Tim Kant were involved in the BP Boom Scandal, leading to a federal case pending under special prosecutor Matt Hart, following a Nov 10, 2010, Mobile Press-Register article.
      THE DISCOVERY: The Widget Article revealed that Pittman and Kant were already under Matt Hart's federal investigation for "several months" prior to the local contract issues reported in the Main Article.
      THE PIVOT: The Widget Article provides the necessary historical context that Pittman's actions (e.g., debris removal contracts, equipment leases) detailed in the Main Article were not isolated local ethics violations but part of a larger, pre-existing federal corruption probe.
      KEY ENTITIES: Senator Lee "Trip" Pittman, Bob James, Mayor Tim Kant, Matt Hart, Mike Hubbard, Luther Strange, Jennifer Fidler Scroggins, Baldwin County, Fairhope.
