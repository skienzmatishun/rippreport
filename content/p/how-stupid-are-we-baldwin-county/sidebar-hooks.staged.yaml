  memorial-day-special-edition:
    brief: |-
      THE CONFLICT:
      Senator Pittman and Bob James have annually passed back and forth the Fairhope Emergency Debris Removal contract since 2007.
      The BP Boom Grant Scandal involved Senator Pittman, Bob James, Tucker Dorsey, and Frank Burt.
      Following the BP Boom Scandal, county employees Leigh Ann Ryals, Michael Thompson, and Scott Barnett were fired.
      On April 1, 2014, Senator Pittman recorded a $4,550 expenditure to R&R Billboards (Reagan Scroggins) for Advertising.
      Pittman sponsored the Alabama Accountability Act, which was found unconstitutional.

      THE DISCOVERY:
      R&R Billboards, located in Robertsdale, Alabama, displayed advertisements for Senator Slippery Trip Pittman and Sheriff Hoss Mack.
      Reagan Scroggins, owner of R&R Billboards, is married to Jennifer Fidler, Public Works Director for the City of Fairhope.
      Jennifer Fidler’s department was responsible for the BP Boom Grant Funds being misspent.
      Pittman did not have an Alabama contractor's license for Pittman Tractor at the time of contracting.

      THE PIVOT:
      Article 2 established the direct conflict of interest (Scroggins/Fidler marriage, R&R ads, Fidler's role in BP Boom misspending) which provides the context for Article 1's documentation of Pittman's ongoing financial gain, specifically the $4,550 billboard expense in 2014, and the continuation of the debris removal contract through July 11, 2014.

