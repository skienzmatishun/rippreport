  elephant-in-a-volkswagen:
    brief: |-
      THE CONFLICT:
      1. In 1994, the Tatumville gully watershed flooded the Magnolia Apartments, causing over one million dollars in damage.
      2. The Fairhope City Council engaged in a dispute regarding the Airport Authority appointments, with members obstructing Mayor's appointments despite prior pledges.
      3. Mr. Lee Turner, President of Single Tax, pushed the Tatumville Subdivision project without single tax membership approval, involving Mr. Cliff Pittman and Councilman Robert Brown.

      THE DISCOVERY:
      1. The Widget Article revealed patterns of conflict of interest (e.g., Mr. Turner, Mr. Pittman) and municipal mismanagement (e.g., Airport Authority control, questionable land transfers like the Tatumville project).
      2. The Widget Article characterized the local political agenda as "smoke and mirrors" and "self-serving."

      THE PIVOT:
      1. The past conflicts (Article 2) demonstrate a history of opaque decision-making and political maneuvering by local entities (Single Tax, City Council, Airport Authority) that led to taxpayer losses and public distrust.
      2. This historical distrust provides context for the current debate (Article 1), where Council President Jack Burrell and Kevin Boone advocate for retaining the Triangle property via conservation easement, opposing Mayor Karin Wilson’s "Public-Driven Vision" and Comprehensive Land Use Plan, which aims to utilize the asset responsibly.

