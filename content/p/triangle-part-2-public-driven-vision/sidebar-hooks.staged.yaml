  people-power-2:
    brief: |-
      THE CONFLICT:
      *   Fairhope's Triangle land asset was subject to litigation for over 25 years.
      *   Fairhope purchased the Triangle land for $11.25 Million (including $3 million in legal fees).
      *   Historically, Mayor Jim Nix served 7 terms before being forced out due to criminal charges.
      *   Tim Kant, following Nix, carried on "corrupt ways" until an honest election.
      *   Serious sewer infrastructure problems existed, exemplified by a recent failure where the 13 million dollar sewer plant did not process 500,000 gallons of raw sewage into Big Head gully and Fly Creek watershed.

      THE DISCOVERY:
      *   Article 2 proves that City Council has a history of obstructing mayoral duties and infrastructure projects.
      *   Citizen pressure (2276 signatures on a petition) successfully forced the Single Tax to back off the Tuberville subdivision.
      *   The Council has been documented as failing to act on studies proposed by Mayor Wilson regarding sewer and infrastructure needs.

      THE PIVOT:
      *   Article 2 establishes a historical pattern of Council obstruction and corruption (Nix/Kant era), providing context for the current political dynamic.
      *   This historical pattern underlies the current Council opposition (Burrell and Boone) to the Comprehensive Land Use Plan and the development of the Triangle, viewing it as a continuation of "policies of the past."
      *   Mayor Karin Wilson's current push for a "Public-Driven vision" and a Comprehensive Plan is a response to, and rejection of, this history of Council obstruction and poor governance.

