  fairhopes-triangle-mega-site:
    brief: |-
      THE CONFLICT:
      *   The Triangle property in Fairhope was subject to litigation for over 25 years.
      *   The property was purchased by the City of Fairhope as a legal settlement.
      *   The settlement cost the City $11.25 million, including approximately $3 million in legal fees.
      *   This settlement occurred under previous City Council leadership (Burrell and Boone) without public participation.

      THE DISCOVERY:
      *   The purchase was not a voluntary decision for a City Park but was mandated by a lawsuit settlement.
      *   Councilmen Burrell and Boone, along with Mayor Kant, allegedly kept the public uninformed about the settlement terms.
      *   The purchase included tax incentives favoring the sellers.
      *   The estimated current land value is between $16 and $20 million.

      THE PIVOT:
      *   The historical facts (Widget Article) show the property acquisition was a non-voluntary, expensive legal settlement, contradicting claims of a "voluntary purchase for a City Park."
      *   This past context challenges the current push by Burrell and Boone to place the Triangle into a conservation easement or "park," potentially eliminating Fairhope’s most valuable land asset from the $650,000 Public-Driven Vision Comprehensive Plan approved by Mayor Wilson.

      KEY ENTITIES:
