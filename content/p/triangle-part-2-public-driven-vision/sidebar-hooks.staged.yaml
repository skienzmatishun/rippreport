  cattle-gate-mega-site:
    brief: |-
      THE CONFLICT:
      *   Fairhope’s Triangle was subject to litigation for over 25 years.
      *   Baldwin County Commissioners and Economic Development Alliance failed to find a tenant for the Baldwin County Mega-site, documented in January, February, and May of last year.
      *   Fairhope purchased the Triangle for $11.25 Million, including $3 million in legal fees.

      THE DISCOVERY:
      *   The Baldwin County Mega-site is an undeveloped 32 million dollar property lacking a sign and only having a cattle gate.
      *   The Mega-site (700 hundred acres) is not suitable for cattle or development.

      THE PIVOT:
      *   The Mega-site situation demonstrates a regional pattern of political failure, inaction, and wasted resources concerning large, high-value, undeveloped land assets in the region.
      *   This context highlights the political resistance (advocated by Jack Burrell and Kevin Boone) to developing Fairhope’s Triangle, despite the city having paid millions in legal fees and subsequently funding a $650,000 Comprehensive Land Use Plan.

