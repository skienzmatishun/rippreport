  pied-piper:
    brief: |-
      THE CONFLICT:
      *   Compliance issue regarding the bluff/bluff stabilization was triggered in 1992.
      *   The $6.2 million Waterfront project was subject to design changes and cost overruns.
      *   Original plan for the lower parks included cleaning up the kudzu covered bluff and installing an ADA compliant switchback walkway.
      *   Jack Burrell, Fairhope City Council President and Eastern Shore MPO Chairman, was instrumental in these decisions, allegedly serving special interests of Catalyst/Scott Boone Consulting.
      *   The political spin used was that development would "destroy or bulldoze the bluff," which was false, as the bluffs were remnants of lower level parks dug out by founders.

      THE DISCOVERY:
      *   In 2021, due to federal grant funds, the council was finally addressing the 1992 compliance trigger.
      *   The grant criteria required ADA compliance and bluff stabilization, not loss of elevation.
      *   The original plan supported the required ADA compliance, while later actions (under Burrell) led to significant waste and delay.

      THE PIVOT:
      *   Article 2 establishes that ADA compliance was required from the start (1992) and was part of the original, successful plan for the waterfront project, contradicting the current council's attempt to avoid compliance.
      *   Article 2 proves that the "famous bluff" was not a singular historical feature to be destroyed, but rather remnants of lower parks, disproving the narrative used to block the original ADA walkway plan.
      *   Article 2 connects the current financial confusion ($6M/$6.2M waste) directly to Burrell's political maneuvering and delayed compliance, not just logistical errors.

