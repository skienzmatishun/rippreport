  alabama-black-hole:
    brief: 'THE CONFLICT:

      *   Complaint filed against Ethics Executive Director Tom Albritton regarding
      "Self Dealing" activity involving the Mabel Amos Trust.

      *   Albritton, as trustee, allegedly failed to disclose his role and acceptance
      of $\$120,000$ in spared family expenses (scholarships) for his children through
      the trust.

      *   The pool of funds was generated by oil/gas discovery on Mabel Amos land
      (potential $\$80$ million+).

      *   Trustees and Regions Bank are alleged to have altered handling practices
      (e.g., listing schools instead of students) since 2014, benefiting beneficiaries
      and trustees including those associated with Albritton.

      *   Cynthia Raulston (Albritton''s associate) defended the practices, citing
      statute of limitations and suggesting Albritton''s filings were acceptable.

      *   Allegations implicate Albritton’s law partners, including Circuit Judge
      Ben Bowden, who allegedly received $\$45,000$ for his children''s scholarships.

      *   The initial complaint was made following inaction/cover-up by the Ethics
      Commission and Alabama Bar regarding past cases.


      THE DISCOVERY:

      *   The second article (dated August 2022) serves as a direct follow-up complaint
      detailing the alleged corruption scheme surrounding the Mabel Amos Trust and
      Albritton''s position on the Ethics Commission.

      *   It details specific instances of potential illegality (e.g., Albritton''s
      failure to disclose his trustee role and accepted expenses) at the time of his
      appointment.

      *   It establishes that Albritton was concurrently serving as Ethics Executive
      Director while facing allegations regarding the Trust mismanagement.


      THE PIVOT:

      *   The second article connects Albritton''s official capacity as Ethics Executive
      Director (2023-03-21 mentioned in metadata) with the pattern of corruption he
      was allegedly investigating, suggesting hypocrisy or self-preservation concerning
      his own involvement in the Trust misconduct.

      *   It provides detailed evidence of financial malfeasance (\$120k, $\$45k$)
      during the tenure Albritton was involved with the bodies meant to police such
      behavior.


      KEY ENTITIES:

      *   Tom Albritton (Ethics Executive Director)

      *   Cynthia Raulston

      *   Mabel Amos

      *   Ben Bowden (Circuit Court Judge)

      *   Regions Bank

      *   Francis Paul Ripp (Compiler/Author of The Ripp Report)

      *   Clark Morris (Attorney General mentioned in pursuit)'
    generated_at: '2026-08-03T02:32:57.310707Z'
    text: State watchdogs routinely bury complaints to shield corrupt officials from
      criminal investigation. Ethics Director Tom Albritton ran this cover-up while
      taking $120,000 from the Mabel Amos Trust for his own kids alongside Circuit
