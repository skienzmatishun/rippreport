      KEY ENTITIES:

      - Tom Albritton

      - Rick Clifton

      - John Bell

      - Mabel Amos Memorial Fund (MAMF)

      - Alabama Ethics Commission

      - Steve Marshall (AG)

      - Mike Hubbard'
