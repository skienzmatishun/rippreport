      3. THE PIVOT: The pursuit of legislative changes allowing current illegal acts
      to become legal mirrors the inaction and institutional enablement detailed in
      the specific financial misconduct involving Albritton''s use of the Trust/Commission
      office.

      4. KEY ENTITIES: Tom Albritton, Kyle Whitmire, John Archibald, McCallum, Mike
      Hubbard, Alabama Ethics Commission, Regions Bank.'
