  fairhope-state-of-the-city:
    refined_source: f057c6c63976a22c856a5687da5ebaa7966abd1a23d41262fc08ccff6f5856c1
    brief: |-
      THE CONFLICT:
      Council President Jack Burrell, Councilman Boone, and Councilman Brown orchestrated the $2.65 million purchase of 105 farmable acres near the airport.
      The land was initially rejected by the State Park Board and the community.
      The appraisal was conducted on June 28, 2019.
      The purchase closed in December 2019.
      In January 2020, the Council declared the property surplus and not needed for public purposes.
      The land is currently leased for $9,000 per year.

      THE DISCOVERY:
      The 2.65 million purchase was made without public input and involved a highly questionable appraisal, and the funds were not budgeted for recreation land.

      THE PIVOT:
      Article 2 provides the specific timeline (June 2019 - Jan 2020) and documented procedural flaws (questionable appraisal, lack of budget allocation) that underpin Article 1's criticism of Council President Jack Burrell, Councilman Boone, and Councilman Brown regarding the $2.65 million land deal.

