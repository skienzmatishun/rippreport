  writ-of-mandamus-update:
    brief: |-
      THE CONFLICT:
      - Fairhope Rotary Youth Club, located on Young Street in the African American Community, financially neglected for years.
      - Fairhope Council hosting Fairhope Rotary Youth Club meeting with Fairhope Comprehensive Plan.
      - Tim Can’t reportedly visited every 4-year election cycle with fried chicken and watermelon; did not show for next 4 years; community left with empty promises.
      - Current Mayor backed by developers; campaign contributions; motto “Embrace Development”; City Council represents development/special interests.
      - Council President “sneaky” Jack Burrell, with councilman Boone and then councilman Brown, responsible for $2.65 million farmland purchase near airport.
      - Optional park site more strategically located to facilitate Black community and Youth Club; purchased property leased back for farmland at $9,000/year and remains so today.
      - Comprehensive Plan annual function; issues: electric sub stations with no screen fencing/landscaping; Fairhope Airport allotted over $350k/year for 1%, no return; possible name Burrell-Snedeker International Airport.
      - $11.25 million paid for Triangle property as legal settlement; property today no improvements.
      - Over $5 million purchase of K-1 center; no comprehensive plan evident.
      - Substandard soccer fields and parking area; millions to select contractors.
      - $6.2 million Waterfront Park project; grant awarded during Mayor Wilson’s administration; current administration made political issue and over one year wasted because no plan.
      - Former Mayor Tim Can’t ignored Fairhope infrastructure for 16 years; current Mayor was his sidekick; Mayor Wilson’s administration awarded over $10 million in grants for sewer/infrastructure; current administration struggling.
      - Young Street Youth Club / African American Community: not one damn thing done; un-zoned areas wedged between Fairhope municipal boundaries and RSA/Point Clear; now time to zone/protect; Fairhope done nothing to advance; Comprehensive Plan will encourage development/annexation within un-zoned areas.
      - City of Fairhope violates its own rules and any so-called comprehensive plan regularly.
      - Audience should ask planners what they will do for Young Street Rotary Youth Club, community, infrastructure, African American Community; part in Comprehensive Plan; keep fried chicken and watermelons.
      - Suggestion: keep back against wall and feet off floor during presentation.

      THE DISCOVERY:
      - The Ripp Report is a consumer organization first.
      - The Ripp Report also maintains a blog site, Facebook pages and a Podcast production.
      - The Ripp Report is a not for profit.
      - The Ripp Report exposes political corruption and files appropriate complaints.
      - On Monday the 25th of November, Judge Johnny Hardwick, Circuit Judge, Montgomery County, heard a STATUS REVIEW on all pending motions relative to the Writ of Mandamus, filed by Francis Paul Ripp on October 18.
      - UPDATE: Judge Johnny Hardwick, Montgomery Circuit Judge, explained that he had been selected by Chief Justice Tom Parker to preside over some ethics cases on November 1.
      - He explained that he read the evidence to Ripp’s Writ of Mandamus and found it very interesting and wished he could delve into the case.
      - The Judge however decided to recuse himself from hearing the case, due to a potential conflict of interest.
      - Attorney Harry Still and Francis Paul Ripp had no problem with the Judge hearing the case, however, they respect his decision and will wait until the case is rescheduled.
      - A civil case will be filed against Regions Bank, which will involve the trustees of the Mabel Amos Memorial Fund, in the near future.
      - The Mabel Amos Memorial Fund is private money and the allegations leveled against Mr. Albritton are based on his “self Dealing” of said trust, as a trustee.
      - Mr. Albritton is the Executive Director of the Ethics Commission.
      - His actions as a trustee, which he has admitted to in Lagniappe articles, should require him to resign from the Ethics Commission, immediately.
      - Stay tuned, this story is far from over. The civil case will expose just how many of Mr. Albritton’s law partners and friends were on the “self serving”, money train.

      THE PIVOT:
      - Article 2 is older and framed as background/historical context for Article 1.
      - Article 2 centers on the Writ of Mandamus, Judge Johnny Hardwick, Regions Bank, Mabel Amos Memorial Fund, Mr. Albritton, Ethics Commission, and allegations of self-dealing.
      - Article 2 is the “smoking gun” or key context for Article 1 because it places Mr. Albritton as Executive Director of the Ethics Commission and as trustee of the Mabel Amos Memorial Fund with admitted “self Dealing.”
      - Article 2 connects to Article 1’s Fairhope narrative involving political corruption, neglect, development, ethics, and accountability.
      - Article 2 provides the legal/ethics backdrop that makes Article 1’s Fairhope allegations and calls for oversight more pointed.

