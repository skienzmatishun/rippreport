  whos-on-first:
    brief: |-
      THE CONFLICT:
      *   In 2015-2016, the Fairhope Airport Authority entered into a Ground Lease and Operating Agreement (Dec 17, 2015).
      *   Attorney Dennis R. Bailey requested an Advisory Opinion from the Alabama Ethics Commission on Dec 16, 2015, regarding the lease.
      *   The lease was executed (Dec 17, 2015) before the Ethics Advisory Opinion was rendered (March 3, 2016).
      *   The Authority used multiple, inconsistent lease versions (Exhibit B, Exhibit C dated Dec 21, 2015, and the Dec 17, 2015 executed lease).
      *   The lease terms conflicted with the Fairhope Airport Authority's Request for Bids (RFP) regarding construction completion timelines.

      THE DISCOVERY:
      *   The correspondence (March 11, 2017) revealed multiple legal and procedural inconsistencies in the Fairhope Airport Authority Ground Lease, including differing lease articles (e.g., Limited Personal Guaranty vs. Personal Guaranty) across document versions.
      *   The Authority failed to adhere to the RFP and violated the Ethics Advisory Opinion timeline, potentially rendering the lease null and void.

      THE PIVOT:
      *   Article 2 provides documented evidence (2015-2016) of the "airport scandal," demonstrating unethical and legally inconsistent actions by the Airport Authority.
      *   This historical fact validates Mayor Wilson's claims in Article 1 that the City Council (Boone and Burrell) has been "turning a blind eye" to the "airport scandal" and using it to discredit the elected administration.

      KEY ENTITIES:
      *   Fairhope Airport Authority
      *   Mayor Wilson
      *   Councilmen Boone and Burrell
      *   Catalyst Associates
      *   Dennis R. Bailey
      *   Ray Hix
      *   Alabama Ethics Commission
      *   Joe McEnerney
      *   Michael Scott Boone / Coley M. Boone
