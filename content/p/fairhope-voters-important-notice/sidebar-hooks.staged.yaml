  going-down-with-the-ship:
    brief: |-
      THE CONFLICT:
      *   Former Mayor Kant and related parties (e.g., Angus Cooper) faced issues with municipal finances, including the Gulf Quest Maritime museum costing $42 million (5 years build) and accumulating over $400,000 in past-due utility bills.
      *   The city lost a Supreme Court case involving Planning and Zoning, resulting in hundreds of thousands of dollars lost to taxpayers, with attorneys Hand Arendall winning the suit.
      *   Councilwoman Diana Brewer was hired as the marketing and public relations director for the museum and was involved in the Fly Creek Apartments project pushed by Angelo Corte.

      THE DISCOVERY:
      *   Article 2 revealed conflicts of interest, such as Angus Cooper, a board member, supporting Kant and donating $2500 to Diana Brewer's re-election bid.
      *   It showed Councilwoman Diana Brewer shifting her stance on the Fly Creek Apartments despite initial support, while the project faced overwhelming public opposition (98% opposed in meetings).

      THE PIVOT:
      *   Article 2 demonstrates a historical pattern of self-serving politicians (e.g., Cooper, Corte, Kant supporters) and financial/regulatory mismanagement in Fairhope, establishing the context for the "airport scandal" mentioned in Article 1.
      *   Article 1 shows that newly elected Mayor Wilson is facing organized political obstruction from Councilmen Boone and Burrell, supported by Catalyst Associates (formed Aug. 11, 2014), attempting to undermine the city using falsehoods rooted in these historical issues.

