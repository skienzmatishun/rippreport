      *   This ruling restricted public access to law enforcement records (body cam/surveillance/911 transcripts), making it nearly impossible to review evidence in BCSO investigations.
      *   The Alabama Supreme Court rejected a public request for details regarding a 2017 fatal shooting involving Huey Hoss Mack.
      *   The Ethics Commission approved a $662,597 expenditure for 129 BCSO body cameras, which Mack promoted as promoting accountability.

      THE PIVOT:
