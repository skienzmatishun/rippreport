    brief: |-
      THE CONFLICT: Mayor Wilson won an election upsetting political groups led by Tim Kant and Jack Burrell; this led to an attempt by the old guard/cronies (GOBs) to oust her through insubordination and backbiting.
      THE DISCOVERY: In May 2017, the HR director filed an incident report on Dec. 29, 2017 (or Dec. 29, 17), and a claim on May 19, 2017; Jennifer Fidler and Sherry Sullivan were fired, and the council imposed a hiring freeze.
      THE PIVOT: The 2017 context establishes that the $100,000 lawsuit against the city and the firings of Sullivan and Fidler were not sudden but the result of a planned political maneuver ("coup mentality") orchestrated by Jack Burrell's supporters against Mayor Wilson.
      KEY ENTITIES: Mayor Wilson, Jack Burrell, Tim Kant, Sherry Sullivan, Jennifer Fidler, HR director, Judge Snedeker, Ray Hix, Hix/Snedeker companies, Catalyst, Scott Boone, Kevin Boone, Joe McEnermy (Airport Authority Chairman), Fairhope Airport, Boone’s LLC, Conyers, Robert Brown, Robertson, Gregg Mims, Diana Brewer, Weeks Bay Foundation.
