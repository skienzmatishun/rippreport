      *   The current HR director filed a $100,000 lawsuit against the city of Fairhope.
      *   The lawsuit revealed the wrongful termination of Sherry Sullivan and Jennifer Fidler.
      *   The lawsuit is uncovering broader corruption, including an airport scandal involving Jack Burrell and Joe McEnermy (Airport Authority Chairman).

