  balls:
    brief: |-
      THE CONFLICT:
      Fly Creek PUD Amendment representations were made by Defendants Leaf River and Corte between January 2016 and October 2016.
      The representations constituted a material non-disclosure and violation of Red Soil Ordinance #1423 by moving red soil into critical areas within 100' of Fly Creek wetlands.
      This project resulted in the failure of the detention pond, Fly Creek being filled with tons of red mud, and a tree ordinance violation assessed at nearly $1 million.

      THE DISCOVERY:
      Article 2 established that the Fly Creek project, led by Council President Burrell, was fundamentally based on misrepresentation and environmental violations, leading to ongoing damage and required annual dredging.

      THE PIVOT:
      Article 2 provides historical context of systemic administrative and environmental corruption within the City of Fairhope (2016), which underpins the current $100,000 lawsuit against the city (Article 1) involving wrongful termination of Sherry Sullivan and Jennifer Fidler, and conflicts of interest related to Jack Burrell and the airport authority.

      KEY ENTITIES:
      Jack Burrell (Council President), Mayor Wilson, Sherry Sullivan, Jennifer Fidler, Conyers, Robert Brown, Robertson, Corte, Leaf River, Joe McEnermy (Airport Authority Chairman), Diana Brewer, Weeks Bay Foundation, Gregg Mims.
    llm_text: 'Leaf River and Corte violated Red Soil Ordinance #1423 near Fly Creek, causing detention pond failure and nearly a $1 million tree ordinance violation. Council President Jack Burrell’s Fly Creek project reveals systemic environmental corruption in Fairhope, linking to current lawsuits.'
