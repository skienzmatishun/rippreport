  the-good-the-bad-and-the-ugly:
    brief: |-
      THE CONFLICT:
      - Fairhope City Council rushed into a deal to obtain grant money to purchase the K-1 Center.
      - Council President Burrell would not consider any other options or the best use for the K-1 Center; described as “his plan or no plan.”
      - Council ignored issues like lead or asbestos.
      - Council did not consider renovation cost versus new construction.
      - Council gave no consideration to a proposal of a boutique hotel, over 100 additional parking spaces for downtown, saving the facade of the school, and much more.
      - Half-baked application for a grant was delayed; purchase for the K-1 was still set for March 31 deadline.
      - City was posed to purchase the K-1 regardless of the grant failure, or Jack’s failure.
      - Current Fairhope City Council had no accomplishment in their term, not one; council should not be allowed to make final decision on the K-1 without public participation and input from Mayor and staff.
      - Council continued to find itself embroiled in one controversy after another; council had no leadership; four other councilmen gave Captain Jack full rein.
      - Catalyst will be their undoing.
      - P.S. Captain Jack, as council president, made the “legal Settlement” of the Triangle, costing taxpayers $11.25 million.

      - Triangle lawsuit cost the city $11.25 million.
      - Triangle lawsuit could have been settled for under $1 million.
      - Mayor Can’t, city council members Boone and Burrell, along with the 3 members that were voted out, refused to settle or even discuss settlement.

      THE DISCOVERY:
      - Article 2 framed as older/background context.
      - Fairhope has come a long way in the last 2.5 years; infrastructure, sewer problems, planning and zoning all got attention of the new administration.
      - Employees, supervisors, and city staff are the best qualified personal the city has ever employed; accomplishments did not come easy and did not come with any assistance of the Catalyst Council, who had yet to accomplish anything significant.
      - More and more citizens of Fairhope were beginning to understand that the council’s agenda had been obstruction and their goal was to overthrow the present government in 2020.
      - Mayor Wilson and staff deserve commendation on accomplishments and promise to put the city before politics.
      - Fairhope’s clock and an area around the clock will be saved, thanks to the developer and Mr. Dean Mosher who requested the developer, Matt Bowers, to reconsider changes to his original plans.
      - FAIRHOPE THE BAD: Triangle lawsuit cost the city $11.25 million; could have been settled for under $1 million.
      - FAIRHOPE THE BAD: Mayor Can’t, city council members Boone and Burrell, along with the 3 members that were voted out, refused to settle or even discuss settlement.
      - FAIRHOPE THE BAD: Recently the last of the bad lawsuits inherited from the last administration and the same two councilmen appeared to be a mirror image of the bad management in the Triangle lawsuit.
      - FAIRHOPE THE BAD: Fairhope prevailed recently in the latest, Breland, court preceding; this followed a unanimous decision by the Alabama Supreme Court that favored the developer, Buddy Breland; the lower court’s verdict is now being appealed back to the Supreme Court.
      - FAIRHOPE THE BAD: This is exactly how the Triangle case worked its way through court; Catalyst Council refused to discuss settlement, choosing to spend tens of thousands in attorney fees and court costs.
      - FAIRHOPE THE BAD: If Mr. Breland wins his lawsuit, and all his previous project permits expire, Fairhope could be looking at millions in damages; Fairhope again is held hostage by a council more intent on obstruction and wishes of Catalyst than what is best for the community.

      - FAIRHOPE THE UGLY: Charges against Ronan McSharry, McSharry Bar and Restaurant were never heard on the scheduled date; the case has been delayed until March.
      - FAIRHOPE THE UGLY: McSharry’s has been the watering hole for many Judges, Attorneys and Council Members; many have abandoned the location due to the continuous bad behavior of Mr. McSharry, who is a green card holder, not a citizen of the United States.
      - FAIRHOPE THE UGLY: City Attorney, Marcus McDowell, has done a poor job of protecting the community; he was satisfied to slap Mr. McSharry’s hand in past offenses, which did nothing to discourage McSharry’s drunken assaults and harassment of innocent citizens.
      - FAIRHOPE THE UGLY: City Attorney has done a good job protecting the council, especially Mr. Burrell, with tax dollars; don’t forget how the council and city attorney, when faced with a potential change of government, changed an established voting date at the last minute, and then topped it off by providing 1 voting booth per precinct, ensuring long waits to vote.

      THE PIVOT:
      - Article 2 is older than Article 1 and should be framed as background/historical context.
      - Article 1 states Captain Jack, as council president, made the “legal Settlement” of the Triangle that cost taxpayers $11.25 million.
      - Article 2 shows Catalyst Council refused to discuss settlement and chose to spend tens of thousands in attorney fees and court costs.
      - Article 2 shows the Triangle case worked its way through court in a particular way.
      - Article 2 shows the latest Breland case mirrored the Triangle case; Fairhope prevailed in the Breland court preceding; Alabama Supreme Court unanimously favored Buddy Breland; lower court verdict is being appealed back to the Supreme Court.
      - Article 2 is the smoking gun or key context for Article 1 because it connects the council’s refusal to settle, obstruction, and legal spending to the later K-1 conflict and Burrell/Jack failures.

