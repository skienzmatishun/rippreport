  tick-tock:
    brief: |-
      THE CONFLICT:
      *   Captain Jack (Council President) made a "legal Settlement" of the triangle, costing taxpayers $11.25 million.
      *   The City of Fairhope was embarrassed that the patio portion of the downtown clock was not purchased years ago.
      *   The City Council previously rejected a boutique hotel concept at the K-1 location, which offered over 100 additional parking spaces.

      THE DISCOVERY:
      *   The K-1 Center controversy was not new; previous issues included the Fly Creek Apartments, Turberville Gully, and proposed changes of government.
      *   The downtown area, featuring the Fairhope Pier and Fairhope Clock, is a critical tourist attraction and the "soul of downtown Fairhope."
      *   Developer Matt Bowers is an out-of-state resident (Louisiana) who is unfamiliar with local politics in Baldwin County, ALABAMA.

      THE PIVOT:
      *   Article 1 claims the Council rushed a deal to purchase the K-1 and ignored alternatives (boutique hotel, parking).
      *   Article 2 proves the Council had *already* rejected the boutique hotel concept and that the K-1 controversy was part of a long-standing public debate involving local residents (3500) and petitions, not a sudden failure.
      *   Article 2 shows that the proposed hotel concept (which provided amenities and parking) was previously considered and rejected by the council, contradicting the premise in Article 1 that they ignored all viable alternatives.

