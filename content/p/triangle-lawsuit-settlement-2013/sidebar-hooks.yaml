  fairhopes-triangle-mega-site:
    brief: 'THE CONFLICT:

      - The City of Fairhope settled a Triangle property lawsuit, allegedly stemming
      from Mayor Timothy Kant’s relationship with Publix developer Arthur Corte, who
      owned half the Fly Creek Watershed.

      - City paid $8.7M to buy the Triangle property; Article 2 says total settlement
      cost was $11.25M, including $3M in attorney fees.

      - Attorney fees exceeded $2M despite attorneys promising no legal costs and
      a city win; the city’s insurance company then sued the City over those fees.

      - Councilman Burrell and Councilman Boone settled the lawsuit without public
      participation, allegedly concealing the settlement for 6 years while claiming
      the purchase was a voluntary park acquisition rather than a lawsuit resolution.

      - Mayor Kant sought BP money to offset costs: Fly Creek Restoration Project
      Number Three requested $19M, TTI Swamp project requested $4M, and a separate
      demand for $500M from BP.

      - Fairhope’s mayor Timothy Kant had previously been summoned to a federal grand
      jury in Mobile over alleged grant fraud tied to the BP boom scandal.


      THE DISCOVERY:

      - Article 2 proves the Triangle property was bought specifically “to settle”
      a lawsuit, not as a voluntary park purchase.

      - The City paid tax incentives to sellers and purchased below appraised value;
      current estimated value is $16M–$20M.

      - Burrell and Boone pushed a conservation easement plan to prevent development
      on the property.

      - A “park” plan for the Triangle failed so badly that “the first arrow never
      was released.”

      - Mayor Wilson secured $17.2M from BP Restore funds in 18 months; $650K is allocated
      for a Comprehensive Plan that must include the Triangle property.


      THE PIVOT:

      - Article 2 exposes the hidden mechanics behind the “deal” described in Article
      1: not just an $8.7M purchase, but a concealed settlement with $3M in inflated
      attorney fees and no accountability.

      - It confirms Article 1’s core claim that Fairhope taxpayers are being made
