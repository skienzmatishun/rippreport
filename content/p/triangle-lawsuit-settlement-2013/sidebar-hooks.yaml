hooks:
  what-triangle-lawsuit-details:
    brief: 'THE CONFLICT:

      - Tim Kant, Mayor of Fairhope, AL, allegedly manipulated city council to settle
      the "Triangle Lawsuit" with property developer Arthur Corte (Publix Project)
      in December 2013 (conditional settlement April 8, 2013).

      - The City bought the Triangle Property for $8.7M; effective cost was at least
      $11M including >$2M attorney fees and a subsequent lawsuit by former insurer
      AMIC over excessive legal fees/misrepresentation.

      - Publicly reported settlement condition: property barred from commercial/industrial
      use. Final contract (per FOIA docs) allows ANY use, subject to PUD/Planning
      & Zoning approval.

      - Councilman Ford added agenda item at April 8, 2013 council meeting authorizing
      mayor’s conditional settlement with no citizen presence; minutes acknowledged
      need for public input but it was ignored.

      - No city budget highlights disclosed: $3M down payment from "utility reserves,"
      $5.75M new debt loan from Compass Bank, 2009 warranty debt of $1.7M paid from
      General Reserve Fund (total ~$10M+ unaccounted).

      - City sought BP Restore Act funds: Fly Creek Restoration Project #3 asking
      $19M; TTI Swamp project asking $4M; total requested $500M in related grant applications.


      THE DISCOVERY:

      - FOIA documents obtained by Francis Paul Ripp (USMC, Fairhope resident) revealed
      the final settlement agreement allowed any property use, contrary to public
      reporting—meaning taxpayers paid ~$3M in attorney fees for a condition they
      couldn''t enforce.

      - The City''s $22M BP Restore Act application was based on Thompson Engineering’s
      $30K "Fly Creek Watershed Restoration Plan," which: (a) did not identify any
      specific Fly Creek problem, and (b) conveniently omitted that the actual watershed
      damage was caused by Arthur Corte, who filled the creek with red clay and owns
      the majority of the Fly Creek Watershed.

      - AMIC lawsuit over excessive legal fees/misrepresentation was scheduled for
      court in November 2014.


      THE PIVOT:

      - Article 2 exposes that Article 1’s core criticism—Kant “guaranteeing” BP would
      pay for Publix/Corte environmental damage and using Restore Act money to avoid
      taxpayer cost—is the very scheme the final contract details, grant misrepresentations,
      and omitted watershed causation corroborate. The $500M BP ask rests on a flawed
      report concealing Corte’s actual liability, turning the "smoking gun" into the
      smoking gun for Kant’s lack of accountability and public deception.


      KEY ENTITIES:

      - Tim Kant (Mayor)

      - Francis Paul Ripp (USMC, Fairhope)

      - Arthur Corte (Publix developer, Fly Creek landowner)

      - Cain O''Rear (Hand-Arendatt attorney)

      - Thompson Engineering

      - Dyas Family

      - City of Fairhope / PUD / Planning & Zoning

      - Councilman Ford

      - Senator Trip Pittman

      - AMIC (former insurance carrier)

      - Compass Bank

      - BP

      - Hand-Arendall

      - Fly Creek Watershed

      - Triangle Property'
