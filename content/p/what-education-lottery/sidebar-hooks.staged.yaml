      - Alabama: Five Republicans who may approve pro-Indian lottery received over $100,000 from tribe: Del Marsh Chair $30,000; Randy Price Vice Chair $12,500; Chris Elliot $27,500; Garlan Gudger $25,000; Andrew Jones $10,000.
      - Alabama: Chris Elliott aka TAX MAN netted $27,500; supports Albritton bill and no allocation for Education Fund; taxed twice without vote; diverted education money from 1% tax about $200,000 a year; no money to Education Fund from lottery that started about education.
      - Alabama: Elliott and Albritton on board to make major changes in Ethics and Lobbyist.
      - Fairhope: Fresh Start filed petition with 800 names for change of government; Fairhope City Council; Catalyst; special election cancellation; Oct. special election; general election Nov. 6; no vote 3887; turnout 38% or 6649 total votes; 2016 election Mayor Kant received 3066 votes; 2020 Fairhope will have another general election.
      - Fairhope: State Rep House District 92 race between Joe Faust and Danielle Mashburn-Myrick; Joe Faust never challenged; Fairhope Council teamed up with Can't core group; Councilman Kevin Boone, son Scott controls Catalyst, teamed with Joe Faust and shook locals out the door.

      THE DISCOVERY:
      - Article 2 showed Catalyst council instructed city attorney to do whatever possible to cancel Oct. special election; council knew odds of referendum vote held during general election had history of failing.
      - Article 2 showed council and Catalyst spread fear and misinformation to voters; Fresh Start spent thousands on first proposed election date and tapped out by time general election Nov. 6 arrived.
      - Article 2 showed Fairhope missed opportunity; majority elected not to change government; continued unsuccessful operation.
      - Article 2 showed seven precincts crowded; Baptist Church on Fairhope Av. traffic hazard and one voting booth caused long waits; civic center lines waited up to two hours; many left without voting.
      - Article 2 showed Fairhope "at large" Catalyst council alive and well; most council support came from same core group that believes in Can't doctrine.
      - Article 2 showed Catalyst and good ole boys can be beat; core group dying off while thousands move there each year.
      - Article 2 showed in 2016 election Mayor Kant received 3066 votes; in special election NO vote was 3887.
      - Article 2 showed turnout 38% or 6649 total votes; total for 2016 was 6589.
      - Article 2 showed Catalyst/no vote/Can't vote core group approximately 3500; ceiling; not growing base with new residents; will be overwhelmed by new voters in a few years.
      - Article 2 showed good ole boys can rally troops; need to vote no matter how long stand in line.
      - Article 2 showed in 2020 Fairhope will have another general election and 3500 core group will not be as strong.
      - Article 2 showed one major event could topple whole Catalyst movement and finally prove to Fairhope citizens just how corrupt system is: INDICTMENT.
      - What Article 2 proves today: local political manipulation via misinformation, election cancellation, fear, and core group dynamics is documented background for Article 1.

      THE PIVOT:
