      *   The city incurred costs of $525,000 for a Boutique Hotel (<1000 sq ft, or $5,250 per sq ft).
      *   The Council spent $2.65 million on 114 acres near County Roads 32 and 13, later declaring the land surplus.
      *   The Council was involved in an $8.75 million legal settlement (Dyas Triangle), plus $3 million in attorney fees.

      THE DISCOVERY:
      *   Article 2 (dated 11/11/16) revealed systemic financial mismanagement and political obstruction within the Fairhope City Council.
      *   The Council approved a raise and a FULL-FAMILY insurance package ($17,000/year) for part-time council members, which full-time employees did not receive.

      THE PIVOT:
      *   Article 2 provides specific, dated evidence (2016) of the political corruption and financial mismanagement in Fairhope that Article 1 (Backstory Podcast) is currently investigating and using to educate the public on corruption within Baldwin County and upcoming elections.

