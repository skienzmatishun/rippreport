  baldwin-county-sewer-regulation-a-litmus-test:
    refined_source: ba3ed1f1bd738a337d34059784dbd02d68f5314a0df3fb97a3f5c22b9e01b6bf
    brief: |-
      THE CONFLICT:
      *   Baldwin County faced a $6.00 toll consumer issue, which was defeated by a poll (referenced with a September 11, 2001, 18 years ago context).
      *   Richard Dayton of GlenLakes subdivision, Foley, started a petition against unregulated Baldwin County Sewer System (BCSS) fees.
      *   The petition reached 50,000 marks, influencing elected officials.
      *   Former County Commissioner Tucker Dorsey was identified as an agent of BCSS.
      *   The current County Attorney is identified as a lobbyist for BCSS.

      THE DISCOVERY:
      *   BCSS is a privately owned monopoly servicing 19,000 homes in Baldwin County.
      *   BCSS operates without fee regulations, allowing potentially unlimited charges (e.g., $154.50 per month).
      *   Baldwin County is noted as the only county lacking sewer fee regulations.

      THE PIVOT:
      *   The BCSS unregulated fee issue is identified as the primary, long-standing corruption/consumer issue in Baldwin County.
      *   This issue provides the "Backstory" and context for the Backstory Podcast's focus on exposing corruption in the upcoming 2020 elections in Baldwin County.

