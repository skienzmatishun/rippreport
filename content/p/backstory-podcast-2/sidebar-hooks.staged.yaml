  saturday-apology:
    brief: |-
      THE CONFLICT:
      - Baldwin County, Alabama, under siege from unbridled development, especially in Fairhope and Daphne.
      - In Fairhope and Daphne, development and approved projects popping up faster than corn.
      - Judges and Attorneys are developers; the City Council that appointed them now approves their developments.
      - Thousands of houses and apartments will change the landscape radically in just a few years.
      - Traffic will be overwhelmed due to limited added roads and insufficient impact fees from development.
      - Schools will see class sizes balloon out of control and portables become permanent while politicians brag about recreation land.
      - Quality of life will become more stressful and threat of a housing crash will become real.
      - CATALYST, "The Good ole Boys," are going to try and regain control in Fairhope.
      - The present council is the biggest threat to that takeover.
      - If they are successful, Fairhope will go into a backward spiral it will not recover from.
      - In 2020, the media group planned to cover the upcoming elections, focusing on elected officials that have not represented constituents, ignored corruption, or were part of the corruption.

      THE DISCOVERY:
      - The Saturday Apology (older article) apologized that the Freaky Friday post, Backstory Podcast #9, had difficulties posting to their pages; the link is up now and they encouraged joining the Facebook page.
      - The Backstory Podcast is a new venture and they expected some difficulties.
      - The forum is the Court of Public Opinion; used to expose elected and appointed officials that use their positions for personal gain, regardless of political affiliation.

      THE PIVOT:
      - Article 2 is older than Article 1 and must be framed as background/historical context.
      - Article 2's content on unbridled development, judges and attorneys as developers, City Council approval, and the threat of CATALYST / Good ole Boys regaining control in Fairhope is the smoking gun / key context for Article 1.
      - Article 1 positions the Backstory Podcast / The Ripp Report as the court of public opinion; Article 2 established the exposure framework and the conflict backdrop that Article 1 operates within.

