    refined_source: e0e67e437ef7e37ab26ab65943d1c92555cc6ee2c30c74a7bcc7a3ddcfc0035c
    brief: |-
      THE CONFLICT: Fairhope City Council (Burrell, Boone, Brown) voted 3 to 2 to purchase 2.6 million in recreation property. This purchase was based on a questionable appraisal and without National Park Service approval.
      THE DISCOVERY: Mayor Karin Wilson documented the 3-2 vote to purchase the 2.6 million recreation property, labeling it a "Quid quo pro" and a "documented, lie."
