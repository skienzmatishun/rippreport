  documents:
    brief: |-
      THE CONFLICT:
      - Fairhope City Council, the 3 B’s (Burrell, Brown, Boone), approved and purchased 2.65 million in recreation land that did NOT have National Park Service approval; questionable appraisal; no public participation; closed sale with “lighting speed.”
      - Council closed on the property Friday, Nov. 1st, less than a week before Connectivity Master Plan Workshop, Nov. 7th.
      - Council funded the 2.65 million from multiple city accounts; Mayor warned this would cause delays in capital and infrastructure projects.
      - Two months prior, council tried to convert the Triangle into a conservation easement, taking the land out of city control; failed.
      - Due to the non-budgeted 2.65 million land purchase, council had difficulty approving a budget past due (third consecutive); discussed police and employee cuts, infrastructure and sewer repair delays; amending a budget they had yet to approve.
      - Council voted themselves a full family insurance package, valued at 17,000/year; no other part-time city employees had it; kept hidden from public until Mayor exposed.
      - Attorney General complaint against Councilman Brown involving Eastern Shore Art Center; use of office for personal gain.

      THE DISCOVERY:
      - Article 2 (Widget, “Documents”) - older/background: Fairhope City Councilman Robert Brown defending his contract with Eastern Shore Art Center since publication.
      - Brown asked for the “other” bids; asked for information; asked for the Ethics Letter that gave him permission, as ESAC Board Member and Liaison to City Council, to use his office for personal gain.
      - Last Fairhope City Council meeting should prove the “Catalyst” Council not listening to constituents; rest of council remained mute and allowed Brown personal gain via full family insurance worth ~17,000/year; whole council voted for it; no other part-time employees had it; “sounds like personal gain”; called worst City Council Fairhope ever elected.
      - Councilman Brown’s defense rests entirely on him calling others CRAZY?; requested: “Show us some DOCUMENTS, Down Home Brown.”

      THE PIVOT:
      - Article 2 is the older/background article and key context for Article 1 because it captured the pre-existing pattern of council conflict of interest/personal gain (Brown’s ESAC contract, family insurance, AG complaint) that Article 1 frames alongside the 2.65 million land purchase, National Park Service disapproval, “CATALYST COLORS,” and 2020 council ouster push.

