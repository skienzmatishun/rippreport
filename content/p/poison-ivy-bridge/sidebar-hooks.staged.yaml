  timeline:
    brief: |-
      THE CONFLICT:
      - Last night's meeting opposing the Mobile Bridge Toll, per The Ripp Report main article.
      - State Senator Chris Elliott (R - Daphne) said the meeting should be moved, not the people. The meeting should be held in Mobile or Baldwin County.
      - Fairhope Mayor Karin Wilson, in a comment dated July 30, stated she is 100% against a toll to build the Long-Awaited New Bridge.
      - The State should have invested the billion+ dollar BP settlement into Mobile and Baldwin County that suffered the most instead of taking the money for its own operating budget.
      - The State used BP money to cover up Goat Hill mistakes, built a Hotel, and refurbished the Governor's Beach House.
      - State Senator Pittman, as appointed BP trustee, secured $750,000.00 in BP money for his "tractor" company.
      - Governor Poison Ivy wants to put the burden of the bridge on the backs of those whose BP money was squandered by the State.
      - Critical need for a new bridge had been discussed for over a decade; building it then was described as an "overnight emergency."
      - Toll proposals mentioned: A, wait until after the 2020 elections; B, increase contract to 60 years; C, Baldwin and Mobile residents get a pass stamp on their tags, no toll; if C fails, go for a 25% toll on retail price; $6.00 toll would be $1.50.

      THE DISCOVERY:
      - Widget article is a comment received by The Ripp Report.
      - The comment accurately describes the Fairhope City Council and their obstruction in infrastructure repairs.
      - The sewer issue finally awakened Fairhope citizens.
      - City hall received numerous calls from irate citizens blaming the Mayor and City Staff for problems that rested on the Council's shoulders.
      - Where is the TIMELINE of the City Council? Citizens should be raising hell, but raise hell at the responsible party.
      - Call the City Council and ask for a timeline.

      THE PIVOT:
      - Article 2 (Widget/TIMELINE) is older and should be framed as background/historical context.
      - Article 2 revealed Council obstruction in infrastructure repairs (sewer) and a lack of Council accountability.
      - Article 2 is the 'smoking gun' for Article 1 because the main article's conflict centers on Mayor Wilson and the City Council regarding the toll bridge, and Article 2 provides prior context of Council obstruction/lack of accountability.

