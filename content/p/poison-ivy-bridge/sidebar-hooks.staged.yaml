    brief: |-
      THE CONFLICT:
      *   Council President Jack Burrell held the position for seven years.
      *   Burrell was found guilty in Federal court for violating the Constitutional rights of an American Citizen and veteran.
      *   These events occurred long before Fairhope Mayor Karin Wilson ran for office.

      THE DISCOVERY:
      *   Prior to Mayor Wilson's involvement, Fairhope faced major infrastructure and sewer problems (Publix project, Fly Creek flooding).
      *   Baykeeper, under Director Casi Callaway, failed to address citizen environmental issues, leading to private lawsuits against the City.
      *   Casi Callaway's actions (political promotion/damage control) were seen as politically motivated, bypassing established Council procedures (e.g., contacting Council President Burrell instead of following Public Participation rules).

      THE PIVOT:
      *   Article 2 establishes a historical context of local government political self-interest, systemic failure, and lack of accountability in Fairhope.
      *   This history supports Mayor Karin Wilson's (Article 1) larger critique that the State of Alabama misused the billion+ dollar BP settlement to cover up mistakes (Goat Hill), rather than investing in suffering counties (Mobile/Baldwin County).
      *   Both articles link local political corruption/failure to wider issues of governmental mismanagement and taxpayer burden.

