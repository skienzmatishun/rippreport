  no-guardrails:
    brief: "THE CONFLICT: \n- On November 19, 2018, newly elected Alabama Attorney General Steve Marshall removed/forced the resignation of Matt Hart, the chief public corruption prosecutor.\n- Mike Hubbard, the former and convicted Speaker of the House (whose allies helped remove Hart), engineered ethics rules in Alabama and avoided jail time while working with allies to protect his interests.\n- State officials mismanaged and misappropriated billions in BP oil spill settlement funds (secured partially by State Senator Pittman, who got $750,000 for his \"tractor\" company), diverting the money to cover \"Goat Hill\" mistakes, build a hotel, and refurbish the governor’s beach house instead of investing it in Mobile and Baldwin counties.\n\nTHE DISCOVERY: \n- Article 2 (published around November 2018) exposed that Alabama ranked number one in political corruption due to straight-ticket voting and a total lack of enforcement \"guardrails.\"\n- It revealed that the Alabama Attorney General's office (under Steve Marshall) gutted its anti-corruption capabilities by ousting Matt Hart without naming a successor.\n- It proved the Alabama Ethics Commission was rendered toothless, having rules partially written by convicted felon Mike Hubbard, leaving citizens with zero accountability or recourse against corrupt elected officials.\n\nTHE PIVOT: \n- Article 2 establishes the systemic root cause of the crisis detailed in Article 1: unchecked, unpunished political corruption and the deliberate dismantling of state oversight (the firing of Matt Hart, toothless ethics commission). \n- Because Article 2 proved that Alabama has \"no guardrails\" and that complaints to the AG or Ethics Commission fall on deaf ears, it explains *why* the state government in Article 1 feels emboldened to \"cram\" a multi-million-dollar toll bridge down the throats of Mobile and Baldwin County residents. \n- The financial malfeasance described in Article 1—where state leaders squandered billion-dollar BP settlement funds on Goat Hill projects—is a direct symptom of the corruption and lack of accountability exposed in Article 2.\n\nKEY ENTITIES: \n- Matt Hart\n- Steve Marshall\n- Mike Hubbard\n- State Senator Chris Elliott (R-Daphne)\n- Mayor Karin Wilson (Fairhope)\n- State Senator Pittman"
    llm_text: When Alabama Attorney General Steve Marshall ousted chief corruption prosecutor Matt Hart, he left the state completely defenseless against greedy politicians. Discover why this calculated betrayal paved the way for leaders to squander billions in BP funds and force unwanted toll bridges on us.
