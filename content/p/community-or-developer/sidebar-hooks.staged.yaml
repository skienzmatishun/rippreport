  you-show-me-yours-and-i-will-show-you-mine-letter-that-is:
    brief: |-
      THE CONFLICT:
      Senator Pittman sought municipal contracts with Fairhope requiring Mayor Kant and Council approval.
      Conflict involved the Fairhope BP Boom Grant and Senator Pittman lacking a mandatory general contractor’s license.
      Historical context includes the Dyas family offering free land in the mid-90s and 2005 for a Performing Arts Center, which Mayor Kant rejected in favor of Mr. Cortes' proposal for a fire station.

      THE DISCOVERY:
      Mayor Kant and Senator Pittman claimed an Ethics Commission letter exonerated them regarding the BP Boom Grant.
      Article 2 revealed this letter did not exist; an FBI Grand Jury was involved, and the case was forwarded to Special Prosecutor Matt Hart of the Alabama Attorney General’s white collar division.

      THE PIVOT:
      Article 2 establishes a pattern of political corruption, conflicts of interest, and self-enrichment (e.g., personal contracting for Pittman) among elected officials (Kant, Pittman) predating the 2017 Fly Creek conflict.
      Article 1 shows the continuation of this pattern, where City Council members face conflicts of interest related to the Fly Creek PUD Sunset Provision, driven by the "Baldwin Insider" and "Catalyst" fraternity.

      KEY ENTITIES:
      Mayor Kant
