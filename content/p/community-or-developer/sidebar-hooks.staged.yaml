  round-and-round-we-go:
    brief: |-
      THE CONFLICT: City of Fairhope Council is debating Ordinance No. 1572 (Fly Creek PUD Sunset Provision) on Monday, April 10, 2017, for the 10th time, amid developer influence (Catalyst/Baldwin Insider), conflicts of interest, and pending lawsuits concerning damage to the Fly Creek Watershed.
      THE DISCOVERY: Baldwin County Commissioner Chris Elliott established that the intersection of Highway 13/Fairhope Avenue (13/48) is governed by Extra Territorial Jurisdiction (ETJ), meaning while the corner is county-owned and un-zoned, the City of Fairhope must issue building permits if all requirements are met.
      THE PIVOT: Article 2 provides the legal and jurisdictional background (ETJ/mandatory permitting) that explains why the City of Fairhope Council in Article 1 may be constrained by regulations, limiting their ability to object or deny development applications despite local opposition and environmental concerns.
      KEY ENTITIES: City of Fairhope; Baldwin County; Chris Elliott; Fly Creek PUD; Ordinance No. 1572; Catalyst; Baldwin Insider; Highway 13/Fairhope Avenue (13/48); County Commissioner.
    llm_text: Fairhope Council debates Ordinance 1572 for the 10th time, yet local opposition struggles against developer influence like Catalyst. Commissioner Chris Elliott confirmed the Fly Creek intersection is Extra Territorial Jurisdiction, meaning Fairhope must issue permits despite environmental concerns.
