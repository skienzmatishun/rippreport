  you-dont-know-jack:
    brief: |-
      THE CONFLICT:
      *   September 21, 2015: Fairhope Airport Authority sent out an RFP for a ground lease for a commercial hanger on plat 2.
      *   October 13, 2015: RFP submittal deadline.
      *   October 20, 2015: RFP opening.
      *   November 17, 2015: Jack Burrell moved to award the bid to Hix/Snedecker Companies DBA Mid-Bay Air, llc.
      *   December 17, 2015: Memorandum of lease was recorded for the 30-year Mid-Bay lease.
      *   April 10, 2017: City Council agenda discussed Ordinance amending Ordinance No. 1572 (Fly Creek PUD Sunset Provision).

      THE DISCOVERY:
      *   Jack Burrell (President of Fairhope City Council) was simultaneously on the Airport Authority Board and the committee reviewing the Mid-Bay bid.
      *   Ray Hix, an Airport Authority Board member, recused himself before discussion but was awarded the bid with Judge Snedecker.
      *   The Mid-Bay lease is recorded only as a simple memorandum, not a full lease and operating agreement.

      THE PIVOT:
      *   The 2015 airport conflict demonstrates a history of lack of transparency, conflicts of interest (e.g., Burrell’s dual roles), and poor administrative oversight within Fairhope.
      *   This history of questionable deals and lack of accountability is the context for the 2017 Fly Creek PUD controversy, where council members faced accusations of conflicts of interest related to the developer and were pressured to vote on the 10th meeting.

