hooks:
  faux-tax-gas-tax:
    brief: |-
      THE CONFLICT:
      *   Baldwin County elected Senator Chris Elliott ("THE TAX MAN").
      *   Elliott was pressured by the Business Council of Alabama (BCA) to support the state gas tax.
      *   Elliott previously implemented a "back room penny school tax," costing Baldwin County Schools $200,000 annually ($1 million every 5 years).
      *   Elliott allegedly skimmed tax funds for personal gain.

      THE DISCOVERY:
      *   Governor Kay Ivey announced a special gas tax session, including a bond issue to improve the Alabama State Docks and Mobile Bay ship channel.
      *   Dredging costs for State Docks were projected between $400,000 and $600,000.
      *   Jim Page (Alliance for Alabama’s Infrastructure) identified the tax as being designed by Business lobbyists.

      THE PIVOT:
      *   Historical evidence of BCA influence and tax misuse in Baldwin County (Elliott/penny tax) establishes a precedent for potential corruption when state/local funds (gas tax, 3 mill tax) are used for infrastructure (dredging).
      *   The current Fairhope City Council (March 8th agenda) is authorizing a half million dollar dredging contract for the Main Channel of Fly Creek, split between the City of Fairhope and Fairhope Yacht Club.
      *   The City Council is simultaneously proposing a Special 3 Mill Ad Valorem School District Tax Election and attempting to purchase K-1 Center properties from the Baldwin County Board of Education.
      *   This shows a pattern of using new taxes (3 mil, gas tax) alongside large, non-transparent infrastructure contracts, mirroring the historical concerns about misuse of funds in Baldwin County.

      KEY ENTITIES:
      *   Senator Chris Elliott
      *   Business Council of Alabama (BCA)
      *   Governor Kay Ivey
      *   Jim Page (Alliance for Alabama’s Infrastructure)
      *   Mayor Karin Wilson
      *   Council President Jack Burrell
      *   Baldwin County Board of Education
      *   K-1 Center
      *   Fairhope City Council
      *   Fairhope Yacht Club
      *   M&N of Alabama, LLC
      *   MW Rogers Construction Co., LLC
      *   Former Mayor Can’t
      *   Jennifer Fidler
      *   Councilman Boone
    llm_text: Senator Chris Elliott faced BCA pressure and allegedly skimmed funds from Baldwin County's penny school tax. Don't let new gas taxes and the Fairhope City Council's 3 Mill tax repeat this pattern of infrastructure spending and fund misuse.
    widget_date: "2019-03-06"
