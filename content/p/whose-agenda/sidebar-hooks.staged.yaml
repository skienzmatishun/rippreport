  gold-star-2:
    brief: |-
      THE CONFLICT:
      - Fairhope City Council agenda, March 8th, contained multiple resolutions (10, 11, 12, 27, 30) that should have caught voters’ eyes and raised questions about the City Council, NOT informing the public about the facts behind each resolution.
      - Resolution 10: City of Fairhope authorized Mayor Karin Wilson or Council President Jack Burrell, on behalf of the City, to purchase properties owned by the Baldwin County Board of Education: K-1 Center, Fairhopers Community Park, and James P. Nix Center; authorized to execute and negotiate all documents necessary to complete closing and acquire title pursuant to the executed Land Purchase Contract. Second round of purchasing the K-1 Center; first failed. Council promised public hearings; article hopes Council listens to options ignored last time.
      - Resolution 11: Council approved and authorized Mayor Karin Wilson to execute one Memorandum of Understanding between M&N of Alabama, LLC and The City of Fairhope for the Dredging of Main Channel of Fly Creek; authorized Mayor to execute the contract for Bid No. 008-19. Half million dollar contract split between the City and the Fairhope Yacht Club. Council did not say a word about having to dredge before, nor where the material being dredged came from. Publix construction caused massive flooding; unstable construction site spilled tons of red fill and topsoil into the creek; every excessive rain, creek floods and pushes Publix fill downstream. Fairhope will have to dredge again and again in the future; taxpayer will pick up the check. Council favored developer over public and ignored accountability.
      - Resolution 12: Council authorized filing with the County Board of Education of Baldwin County, Alabama, of a Request for a Special 3 Mill Ad Valorem School District Tax Election. Council President Jack Burrell “wants out of the school business.” Council never explained or discussed with the public the Mayor’s option of a more expedient and equitable solution, not involving taxes. Council could have provided the funds last night; instead chose the more difficult path of a referendum and tax. Council playing political games with kids and withholding information from the public to satisfy their agenda.
      - Resolution 27: Mayor Karin Wilson authorized to execute Change Order No. 2 to Bid No. 005-18, Library Envelope Repairs 2019, which added 12 calendar days to the contract for miscellaneous repairs due to unforeseen conditions discovered upon demolition and affecting critical path schedule; awarded Change Order to MW Rogers Construction Co., LLC. Change Order extended contract time from 210 calendar days to 222 calendar days. Former Mayor, former Public Works Jennifer Fidler, Council President Burrell, and Councilman Boone on top of the totem pole of responsibility. Library plagued with construction issues since day one; then Mayor and Council never held anyone responsible; repairs stacked through the years until present administration tackled issues. Library closed for weeks; Council said not a word. Should be special investigation into construction issues and why they were ignored.
      - Resolution 30: Executive Session – To discuss the consideration the City is willing to offer or accept when considering the purchase, sale, exchange, lease, or market value of real property.

      THE DISCOVERY:
      - Article 2, “GOLD STAR”: Fairhope just got a gold star and it deserves it. This article and the movie being shot, “The Friend,” at the same time will produce a tremendous amount of national exposure for Fairhope.
      - Cat is out of the bag; expect more tourists and newcomers to Baldwin County. It is too late to bitch about growth and traffic and schools; time to act.
      - County Commission and the 14 municipalities of Baldwin County need to get on the same page about Sewers, Zoning, Traffic and Schools, ASAP.
      - One issue that stands out in Fairhope is education. Class size is swelling, teachers are working as fundraisers, “FOR SCHOOL SUPPLIES,” and portables are a necessity. Over 5,000 students in five Fairhope Schools, and that figure is growing every month.
      - Fairhope City Council has the responsibility of deciding if Fairhope is going to support schools through a TAX or use the Equitable School Funding Plan, proposed by the Mayor.
      - Council has the ability to vote immediately for the desired funds, $1.88 million. It is their decision and that decision should be made after the community has the ability to weigh in.
      - Funding issue is very important and would make a significant difference in all five schools. Principals, teachers, parents and constituents should demand the council holds at least two public forums for public participation, before any decision is made.
      - What will the council do? Pay attention people, election time is coming up, WATCH the council. Will the Council live up to the accolades of the Times article? Or will CATALYST raise its ugly head?

      THE PIVOT:
      - Article 2 is older than Article 1; frame it as background/historical context.
      - Article 2 revealed Fairhope’s gold star, national exposure from “The Friend,” tourism, growth, and the education funding debate ($1.88 million desired funds, Equitable School Funding Plan proposed by Mayor Karin Wilson, tax vs. non-tax).
      - Article 1, “WHOSE AGENDA?”, covers the Fairhope City Council agenda, March 8th, with resolutions on the K-1 Center purchase, dredging, 3 Mill tax election, library repairs, and executive session.
      - Article 2 is the smoking gun/key context for Article 1 because it established the school funding conflict and growth context prior to the council’s March 8th agenda items; the resolutions in Article 1 are the council’s response/handling of issues raised in Article 2.
      - Without Article 2 as background, the conflict in Article 1 lacks context; Article 2 frames the past against which Article 1’s council actions should be read.

      KEY ENTITIES:
      - Karin Wilson – Mayor of Fairhope
      - Jack Burrell – Council President of Fairhope
      - Jennifer Fidler – former Public Works, Fairhope
      - Boone – Fairhope Councilman
      - Former Mayor – Can’t
      - Baldwin County Board of Education
      - Baldwin County Commission
      - M&N of Alabama, LLC
      - MW Rogers Construction Co., LLC
      - Fairhope City Council
      - Fairhope Yacht Club
      - The Friend – movie
      - CATALYST
      - Times article
      - Lowery, Wilters
    llm_text: Fairhope’s Mayor Karin Wilson and Council President Jack Burrell pushed a $1.88 million school-tax fight, K-1 Center buys, and creek dredging through their March 8 agenda. Did the City Council hide the facts from voters or finally answer what we should do about schools, growth, and accountability?
