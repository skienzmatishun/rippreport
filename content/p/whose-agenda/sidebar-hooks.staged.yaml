  captain-jack:
    brief: |-
      THE CONFLICT:
      - In late 2016, the Fairhope Airport Authority underwent a "failed" bidding process for hangar leases, documented in a series of Ripp Report articles posted beginning Nov. 2016.
      - The "failed" process involved allegations that Airport Authority Chairman Joe McEnerney was guaranteeing "chosen ones" hangar locations prior to any formal bid process.
      - Council President Jack Burrell was the City liaison on the Airport Authority board during this period.
      - The bidding procedures and fuel farm issues are being revisited from that 2016 failed process.

      THE DISCOVERY:
      - In the Widget Article (dated Jan 8th, referenced as older context), Captain Jack (Jack Burrell) publicly blasted Chairman Joe McEnerney at the Airport Authority special meeting regarding the notice of availability for leases.
      - Burrell revealed he had to borrow a pen and paper to the meeting but asserted control, signaling he was "Captain" of the process.
      - Burrell stated explicitly: "no one gets a hanger location without Captain Jack’s approval."
      - Burrell confirmed he was the deciding force behind Municipal Judge and City Attorney appointments.

      THE PIVOT:
      - The Widget Article serves as the 'smoking gun' because it proves Burrell was the active gatekeeper of the 2016 Airport Authority lease process, anointing "chosen ones" and controlling outcomes without public bid transparency.
      - This established pattern of Burrell overriding formal processes and appointing "chosen ones" directly connects to the Main Article's Resolution 10: Burrell is now the authorized negotiator to purchase the K-1 Center, Fairhope Community Park, and James P. Nix Center from the Baldwin County Board of Education.
      - The same decision-making style that allowed Burrell to award hangar locations without bid process in 2016 now enables him to execute land purchase contracts for prime city properties, bypassing public scrutiny under the guise of "negotiation."

      KEY ENTITIES:
      - Jack Burrell (Council President, referred to as "Captain Jack")
      - Joe McEnerney (Airport Authority Chairman)
      - Karin Wilson (Mayor)
      - Baldwin County Board of Education
      - K-1 Center (property subject of Resolution 10)
      - Fairhope Community Park (property subject of Resolution 10)
      - James P. Nix Center (property subject of Resolution 10)
      - M&N of Alabama, LLC (party in Resolution 11 regarding Fly Creek dredging)
      - The City of Fairhope
      - Fairhope Yacht Club (party in Resolution 11 regarding Fly Creek dredging)
      - Jennifer Fidler (former Public Works official referenced in Resolution 27)
      - Boone (Councilman referenced in Resolution 27)
    llm_text: Council President "Captain Jack" Burrell once declared "no one gets a hanger location without my approval," proving he privately anointed "chosen ones" at the Airport Authority in 2016. Now the same unchecked gatekeeper power lands him the K-1 Center, Fairhope Community Park, and James P. Nix Center deals, bypassing public scrutiny under the guise of negotiation.
