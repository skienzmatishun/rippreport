  catalyst-colors:
    brief: "THE CONFLICT: \n- Fairhope City Council approved a development project at Highway 98 and Parker Road, increasing local traffic drastically (adding an estimated 400+ cars and 1,000+ daily trips from a 48-unit expansion and completed apartments).\n- The City Council (\"Catalyst\" faction) engaged in backroom deals, including a $2.65 million unauthorized land purchase for recreation without National Park Service approval, closed on Friday, November 1st (prior to a November 7th Connectivity Master Plan Workshop).\n- The purchase drained multiple city accounts, delayed capital/infrastructure/sewer projects, and forced budget amendments that threatened police and employee cuts.\n- The entire council voted themselves a hidden, full family insurance package valued at $17,000/year (unavailable to other part-time city employees).\n- Councilmen engaged in ethics violations and conflicts of interest, including an Attorney General complaint against Councilman Robert Brown regarding the Eastern Shore Art Center for personal gain, and the appointment of the Fairhope Municipal Judge, who was also the developer of the city's largest housing project requiring council approval.\n\nTHE DISCOVERY: \n- Article 2 (older widget article) exposed a pattern of corruption, closed-door dealing, and self-enrichment by the incumbent Fairhope City Council (specifically the \"3 B's\" and the \"Catalyst\" faction) prior to the 2020 election cycle.\n- It revealed how the council bypassed public participation, raided city funds for unauthorized land deals, hid luxury family insurance perks from taxpayers, and installed political allies (Municipal Judge and City Attorney) who had direct financial conflicts of interest with city developments.\n\nTHE PIVOT: \n- Article 2 serves as the smoking gun because it documents the exact historical pattern of corrupt governance, cozy developer ties, and infrastructure neglect by the \"Catalyst\" City Council that directly created current disasters like the \"Malfunction Junction\" traffic hazard at Highway 98 and Parker Road. It shows that the traffic and safety crises warned about in Article 1 are the direct result of the systemic pay-to-play politics exposed in Article 2.\n\nKEY ENTITIES: \n- Burrell (Councilman / \"Captain Jack\")\n- Brown (Councilman / Robert Brown / \"The Jester\")\n- Boone (Councilman / Kevin Boone / \"LLC Kevin Boone\")\n- Catalyst City Council / Catalyst faction\n- Fairhope Municipal Judge (Developer of the largest housing development)\n- Fairhope City Attorney\n- Eastern Shore Art Center\n- National Park Service"
