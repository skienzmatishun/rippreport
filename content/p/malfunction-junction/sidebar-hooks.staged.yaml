  catalyst-does-fairhope:
    refined_source: 0bbe9b90aa774be147a58e37c8d806efb96f31ea95612241f3cfc8188feea62a
    brief: |-
      THE CONFLICT:
      *   Former Mayor Tim Kant, developer Angelo Corte, and Councilmen Burrell and Boone oversaw the development of the Fly Creek Apartments (230 units) and the Publix site in Fairhope.
      *   Corte built the Fire Station on his property adjacent to the proposed apartments.
      *   Kant authorized the sewer lift station, located above Fly Creek, to service the apartments.
      *   Corte donated wetlands land (the recipient of Publix drainage into Fly Creek) to the City of Fairhope.
      *   Taxpayers funded the Fire Station and the sewer lift station, while the City accepted the liability for the developer's drainage (Fly Creek).

      THE DISCOVERY:
      *   Article 2 revealed that the development was a profit-driven project, not a community need, and that the City Council supported the developer over public outcry.
      *   It showed that taxpayer money was used to build infrastructure specifically for the developer while the city ignored its own infrastructure problems.

      THE PIVOT:
      *   Article 2 provides the historical context establishing the pattern of "Catalyst" council behavior—favoring developers (Corte) over community interests—which directly led to the dangerous, high-traffic intersection (Malfunction Junction) discussed in Article 1.
      *   Article 1 warns of increased danger from completed and newly approved apartments (48 units), but Article 2 explains *how* and *why* the city was financially and environmentally compromised by the initial development.

      KEY ENTITIES:
      *   Tim Kant (Former Mayor)
      *   Angelo Corte (Developer)
      *   Councilmen Burrell and Boone
      *   Fairhope City Council (Catalyst members)
      *   Highway 98 and Parker Road (Malfunction Junction)
      *   Fly Creek Apartments (230 units)
      *   Publix
      *   Sandy Ford and Rock Creek (impacted neighborhoods)
