    brief: |-
      THE CONFLICT:
      - Highway 98 and Parker Road intersection in Fairhope: described as “Malfunction Junction”; dangerous; accidents common; expected to become more dangerous every month of current year.
      - Fairhope City Council supported developer; developer supported them; described as “good ole boy deal.”
      - Apartments soon completed; another 48 units approved on Parker Road.
      - Neighborhood of 16 houses and roughly 50 people; grow to 500 to 700 more people and 400+ cars exiting Parker Road and Publix; several trips daily; equivalent of over 1,000 cars/day impact intersection once construction complete.
      - 2020 Fairhope Municipal Elections: held Aug. 25; article says in best interest to vote this council out; replace 5 Catalyst Council members with women, young candidates, minorities.
      - Fairhope City Council qualifications: July 7–21, 2020; Step Up Candidates; get rid of good ole boys once and for all; Fairhope deserves better.

      THE DISCOVERY:
      - Article 2 (“ROTTEN”) says Baldwin County has corrupt/inept elected officials; two stand out as worst with worst records.
      - Sen. Elliott and Jack Burrell stood out; Sen. Elliott came in second to Fairhope City Council President Jack Burrell.
      - Burrell at head of City Council, operating as criminal enterprise.
      - “Appointed” city Attorney and Fairhope Municipal Judge could depend on Burrell to carry their water.
      - 2020 needs to be last year for Burrell the Judge and City Attorney.
      - Judge and Jack have special bond; three years later and Judge and Jack are at it again.
      - Article 2 directs to May 2016 Ripp Report articles about Councilmen Burrell and airport scam.
      - Last 7 years Burrell was council president; disgrace on all levels.
      - In 2020, people of Fairhope will finally recognize Burrell is threat to quality of life, property values, horrible example for children.

      THE PIVOT:
      - Article 2 is smoking gun/key context for Article 1 because it frames Jack Burrell and Fairhope City Council in corruption/election context.
      - Article 2 older/background: May 2016 airport scam; last 7 years Burrell council president; 2020 election context.
      - Article 1 references Article 2 written almost a year ago; asks remember 2020 Fairhope Municipal Elections held Aug. 25; vote council out; replace 5 Catalyst Council members.
      - Article 2’s “WAKE UP FAIRHOPE / VOTE OUT THE ENTIRE CITY COUNCIL IN 2020” connects to Article 1’s election call.

