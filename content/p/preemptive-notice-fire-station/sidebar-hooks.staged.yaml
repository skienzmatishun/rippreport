  letter-editor-rob-holbert:
    brief: |-
      THE CONFLICT:
      *   Arthur Corte, developer, filled Fly Creek with red clay, causing environmental damage.
      *   Corte initially pledged a corner lot on Parker Road for a fire station, later selling that parcel to Iberia Bank for $1 million.
      *   In July and August 2009, the fire station proposal for Parker Road failed due to public safety and traffic complaints.
      *   On May 8, 2013, the city council held a meeting to motion the settlement of the triangle lawsuit for $12 million.

      THE DISCOVERY:
      *   Article 2 (Francis Paul Ripp, The Ripp Report/Baldwin County Legal Eagle) asserted that the Fairhope city council and mayor conspired to keep the public ignorant while "fleecing them" regarding the triangle lawsuit settlement.

      THE PIVOT:
      *   Article 2 establishes the historical accusation of municipal corruption and public deception regarding the triangle lawsuit, providing context for Article 1's claim that Mayor Kant and the council executed the $12 million settlement without public notice or participation.

      KEY ENTITIES:
      *   Mayor Tim Kant
      *   Arthur Corte
      *   Jack Burrell (Council President)
      *   Iberia Bank
      *   Parker Road
      *   Fly Creek
      *   Triangle lawsuit
      *   $12 million (settlement amount)
      *   July/August 2009 (fire station proposal period)
      *   May 8, 2013 (lawsuit settlement meeting)
