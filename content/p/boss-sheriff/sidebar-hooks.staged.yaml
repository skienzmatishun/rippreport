  rumors:
    brief: |-
      THE CONFLICT:
      - Baldwin County Sheriff’s Office (BCSO) and Sheriff Huey “Hoss” Mack (“Boss” Mack) are central.
      - Main Article 1 (“BOSS SHERIFF”) reports public warning: Baldwin County has serious problem with BCSO and Sheriff Hoss “Boss” Mack.
      - BCSO latest flex of muscle; District Attorney takes orders from “Boss”; most Baldwin County judges put in office by “Boss”; FBI notified of citizens’ concerns; not new but pattern of bad behavior.
      - Past loss-of-life conflict: Jonathan Victor; April 2021; Judge William Cassady denied Hunady, the sheriff deputy who shot Victor four times, and Sheriff Mack qualified immunity; ruling on appeal by Baldwin County Sheriff Office; Sheriff provided facts about case that were untrue; Victor was unarmed and shot from 7 yards.
      - Victor like French had issues with mental health; Sheriff Mack said in open court BCSO did not have any special training for handling cases involving persons with issues of mental health.
      - O.J. French, age 32, shot and killed after being pulled over for vehicle equipment violation by Bay Minette Police; August 20 of this year.

      THE DISCOVERY:
      - Article 2 (“RUMORS”) revealed red flags over BCSO and BCSCU for a number of years.
      - Rev. Sam White, who graduated high school with French’s older sister Tamara, spoke during event on behalf of family; said there needs to be transparency in investigation.
      - Quote: “‘Once Mr. French exited the vehicle, he would not comply with the officer’s instructions,’” said White, reading from official report. “Some things already aren’t adding up for me. What instructions? He wasn’t under arrest. He wasn’t being held in custody. It seems like the community needs some answers.”
      - Baldwin County Major Crimes Unit (BCMCU), County Commission, and City of Bay Minette, Mayor and Council swallowed their tongue; solely responsible for lack of information, misinformation, and rumors.
      - BCMCU consists of Bay Minette Police Chief Al Tolbert, current chairman; Robertsdale Police Chief Brad Kendrick; Sheriff Huey “Hoss” Mack of BCSO; Gulf Shores Police Chief Edward Delmore; Daphne Police Chief David Carpenter; Foley Police Chief Thurston Bullock; agency tasked with reviewing actions of officers working for member organizations.
      - BCMCU has no credibility; investigating themselves; Chief Tolbert of Bay Minette is Chairman; question raised whether BCMCU could conduct unbiased investigation of own members.
      - Rumors: officer who shot O.J. French was Brandon Thompson; Thompson previously fired by City of Bay Minette and other police forces; alleged officer stopped Mr. French early in day; Police Chief Tolbert also fired from Bay Minette; Mayor Wills wants any investigation sealed from public; many BCSO deputies see BCMCU as way to cover up actions of a few bad officers; Mr. French was shot in back; Bay Minette police department well aware Mr. French suffered with diagnosed mental health issues; elected officials plan to remain silent and not question actions of BCMCU, sheriff, or Police Chief Tolbert; officer was back on duty with weapon within several weeks of shooting; camera footage will never be provided to public; grand jury flawed by being secret, that often evidence is left out or information provided by police is questionable; grand jury is another vehicle BCSCU uses to cover up officer malfeasance.
      - Mr. French is 9th loss of life in Baldwin County where BCMCU has investigated themselves; first 8 found no police at fault and camera footage withheld from public.

      THE PIVOT:
      - Article 2 is key context/smoking gun for Article 1 because it documented long-standing red flags/patterns before/around Main Article’s “Boss Sheriff” claims.
      - Article 2: Sheriff Hoss Mack told County Commissioners he needed $600,000.00 of taxpayer money for cameras; cameras would provide transparency and accountability; turned out to be total BS; BCSCU refused to share any footage involving any incident.
      - Article 2: Alabama Supreme Court on Friday ruled against Mobile media outlet Lagniappe Mobile seeking law enforcement files related to fatal police shooting; upheld Baldwin County ruling; high court ruled records Lagniappe sought, including dash and body camera footage, exempted from open records due to “investigative” nature, even though investigation in shooting closed.
      - Article 2: Baldwin County Sheriff’s Office well known for putting out misleading or false information surrounding loss of life cases by sheriff officers.
      - Article 2: vast majority of police do job honorable; 1 to 3% can be very problematic; Baldwin County common practice police officers being fired from one municipality then hired by another; French case officer in question likely fired by previous law enforcement job; just a rumor, for right now.

