  what-education-lottery:
    brief: |-
      THE CONFLICT:
      *   Albrittton lottery bill prioritized repayment of state debt (2013-2015) over funding the Education Fund.
      *   Five Republican legislators received over $100,000 in contributions from the Poach Band of Creek Indians during the election cycle.
      *   Chris Elliot received $27,500; Del Marsh received $30,000.

      THE DISCOVERY:
      *   The lottery allocation was designed to provide a complete gaming monopoly to the Poach Creek Indians.
      *   Political actors, including Chris Elliot, supported the Albrittton bill despite diverting approximately $200,000 annually from the 1% tax intended for education.

      THE PIVOT:
      *   Article 2 establishes a pattern of political corruption where legislators bypass public interest (Education Fund) for donor/corporate financial gain (Indian tribe money).
      *   Article 1 demonstrates a similar closed-door maneuver where the City Council and Weeks Bay planned to transfer 106 acres ($20 million) without required public input or completing the comprehensive land use plan.

      KEY ENTITIES:
      *   Albrittton
      *   Chris Elliot
      *   Poach Creek Indians
      *   Fairhope City Council
      *   Weeks Bay
      *   Mayor (unnamed)
      *   CATALYST Council
      *   106 acres
      *   $20 million
      *   527 (petition count)
    llm_text: Chris Elliot and legislators supported the Albrittton bill, diverting $200k annually from the Education Fund for a Poach Creek Indians gaming monopoly. Read how political donors prioritize private gain over public interest.
