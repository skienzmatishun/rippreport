hooks:
  fairhope-un-armed-robbery:
    brief: |-
      THE CONFLICT: Weeks Bay Foundation and Fairhope City Council attempted to gain control of 106 acres of Fairhope City Property, valued at $20 million, through a Conservation Easement without public participation. This attempt was framed as a pursuit of control for perpetuity (eternity).
      THE DISCOVERY: The Widget Article identified specific drivers of the effort, including Diana Brewer (Weeks Bay Director), Council President Burrell, and Fairhope City Attorney Marcus McDowell, alleging corruption and undisclosed anonymous donor influence (potentially connected to Author Corte).
      THE PIVOT: The Widget Article established the initial political and alleged corrupt drivers (Brewer, Burrell, McDowell) and the secretive nature of the land transfer (perpetuity/eternity), providing the necessary historical context before the Main Article frames the issue as a democratic failure and citizen response via the petition (527 names).
      KEY ENTITIES: Fairhope City Council; Weeks Bay Foundation; Diana Brewer; Council President Burrell; Marcus McDowell; Council members Burrell, Brown, and Boone; CATALYST Council; Mayor; Author Corte; City of Fairhope.
    llm_text: Diana Brewer, Council President Burrell, and Marcus McDowell allegedly drove a secretive $20 million land deal for 106 acres of Fairhope property. See how anonymous donors and alleged corruption fueled this effort, threatening democratic control over Fairhope.
    widget_date: "2019-06-21"
    generated_at: "2026-11-08T01:21:05.211706Z"
