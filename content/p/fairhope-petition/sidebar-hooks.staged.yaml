  deliberate-distortion-or-twisting-of-meaning:
    brief: |-
      THE CONFLICT:
      - Fairhope City Council and Weeks Bay attempted to transfer control and management of 106 acres of City of Fairhope property, valued at $20 million, without public input.
      - Council and Weeks Bay planned behind closed doors to transfer control and management of city property.
      - Council almost succeeded in the transfer.
      - Transfer was prevented by several citizens and a couple of lawyers paying attention.
      - The property was part of a legal settlement where the city LOST and had to buy the property.
      - Council using narrative that the land was purchased for a park; categorically untrue.
      - Council and Weeks Bay now trying to claim best use of city land is to insure city has little or no control over it for ETERNITY.
      - Petition: citizens ask City Council not to dispose of any city property until scheduled land use plan and comprehensive plan is completed.
      - Second ask: citizens ask to be part of the decision.
      - Council and Weeks Bay attempted to go around public participation.
      - Petition had 325 names at last council meeting; now at 527.
      - Council is the worst Fairhope has seen in 25 years; all have CATALYST and Can't connections.

      THE DISCOVERY:
      - Fairhope City Council and Weeks Bay are trying to tell the general public that a Conservation Easement does not mean Weeks Bay owns the property.
      - True they also have no lease or title to the land.
      - City is simply "disposing" of the property and any control of the property.
      - City would be signing over management and control for perpetuity to Weeks Bay.
      - Anonymous donor coughing up $39,000 for this deal; why does Weeks Bay and City Council want to keep it a secret?

      THE PIVOT:
      - Article 2 is the smoking gun because it framed the Conservation Easement as not meaning Weeks Bay owns the property, while the city was signing over management and control for perpetuity.
      - This semantic frame underlies the later petition and the Council's narrative around "disposing" the property.
      - Article 2 is older/background context for Article 1.

      KEY ENTITIES:
      - Fairhope City Council
      - Weeks Bay
      - City of Fairhope
      - Mayor of Fairhope
      - CATALYST Council / CATALYST
      - Can't
      - Citizens of Fairhope / several citizens and a couple of lawyers
      - al.com
      - Fairhope, Alabama
      - Lowery, Wilters (specific names to mention)
    llm_text: Fairhope City Council and Weeks Bay tried to quietly hand over 106 million-dollar city acres without public input, but citizens and lawyers stopped them. Now the council's story about a conservation easement doesn't match the deal Mayor Lowery and Council member Wilters pushed.
