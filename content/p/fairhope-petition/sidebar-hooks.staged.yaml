  blind-voting-straight-ticket:
    brief: |-
      THE CONFLICT: City Council and Weeks Bay attempted to transfer 106 acres of city property, valued at $20 million, without public input in Fairhope.
      THE DISCOVERY: Alabama utilizes straight ticket (blind) voting, a system that encourages corruption and allows elected officials (e.g., the Governor) to be chosen without debate.
      THE PIVOT: Article 2 establishes the statewide political context of limited democratic participation in Alabama, which provides background for the closed-door dealings and lack of public input detailed in Article 1.
      KEY ENTITIES: Fairhope, City Council, Weeks Bay, CATALYST, Mayor, 106 acres, $20 million, 527 (petition count)
    llm_text: Fairhope City Council and Weeks Bay attempted to transfer $20 million of 106 acres without public input. Alabama's straight ticket voting system limits democratic debate, revealing how local closed-door deals happen statewide.
