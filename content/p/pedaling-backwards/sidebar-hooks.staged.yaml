  tick-tock:
    brief: |-
      THE CONFLICT: Past controversies included Fly Creek Apartments, K1 Center, Tuberville Gully, proposed change of government, and the entertainment district. These issues generated massive public protest (thousands of signatures, hundreds at council meetings) and led to job losses for politicians, lawyers, and city workers.
      THE DISCOVERY: Article 2 establishes that local politics in Fairhope is highly charged ("blood sport"), and the community strongly opposes out-of-state developers like Matt Bowers, whose proposed hotel threatens the iconic Fairhope Pier and Downtown Clock (a tourist attraction).
      THE PIVOT: Article 2 provides historical context, proving the council's current obstructionism and political maneuvering (detailed in Article 1) is not new. The council has a documented history of creating major civic conflict (K1 Center, Fly Creek) and resisting community wishes, validating the criticism of their current re-election efforts and lack of transparency regarding the 11.25 million dollar Triangle property.
      KEY ENTITIES: Burrell, Wilson, Matt Bowers, Councilman Conyers, Fairhope Pier, Fairhope Clock, K1 Center, Fly Creek Apartments, Tuberville Gully, City Council.
    llm_text: Matt Bowers' hotel threatens the iconic Fairhope Pier and Clock, fueling intense community conflict against out-of-state developers. Fairhope's City Council has a documented history of fighting civic wishes, from Fly Creek Apartments to the K1 Center.
