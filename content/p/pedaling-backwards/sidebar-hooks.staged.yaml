  russian-roulette-fairhope-style:
    brief: |-
      THE CONFLICT: Dyas Triangle lawsuit began before current council/mayor; Tim Kant, Boone, and Burrell misrepresented the land purchase/settlement to taxpayers, claiming a "WIN" despite costing Fairhope $11.25 million.
      THE DISCOVERY: Article 2 (older) proved the Dyas Triangle settlement was a lie, potentially costing $11.25 million (instead of under $1 million), and that the land remains vacant.
      THE PIVOT: Article 2 establishes the history of the $11.25 million Triangle property and the council's pattern of misrepresentation, which provides context for Article 1's report that Council President Burrell and Councilman Boone are now attempting to push a bike trail project on that same property.
      KEY ENTITIES: Fairhope City Council, Council President Burrell, Councilman Boone, Tim Kant, Dyas, Triangle, $11.25 million, Attorney O’Rear.
    llm_text: Tim Kant, Boone, and Burrell misled Fairhope taxpayers, costing the city $11.25 million on the Dyas Triangle settlement. Now, Council President Burrell and Councilman Boone push a bike trail on that same vacant, disputed land.
