  fairhope-council-shows-its-colors:
    brief: |-
      THE CONFLICT:
      *   In 2018, over 800 Fairhope citizens signed a petition, exceeding the threshold of 10% of recent voters, to initiate an election for a Council-Manager form of government.
      *   The City Council refused to accept the Mayor's opinion (offered June 26, 2018) based on an outdated statute.
      *   This petition triggered a 90-day period for a special election, originally scheduled for October 2nd, 2020, which Mayor Karin Wilson later delayed to the general election on November 6th.

      THE DISCOVERY:
      *   Article 2 reveals the Council's resistance and refusal to heed the Mayor's advice and revised statutes (July 2018) led to the citizen-led petition process, circumventing the Council's authority.

      THE PIVOT:
      *   Article 2 establishes that the Council's current actions (e.g., obstruction, political maneuvering) are not the root cause of the change attempt but are a reaction against a citizen-driven democratic measure (the petition), which Article 1 critiques during the 2020 re-election cycle.

      KEY ENTITIES:
      *   Fairhope City Council
      *   Council President Burrell
      *   Councilman Boone
      *   Mayor Karin Wilson
      *   City Attorney
      *   Triangle property (11.25 million dollar legal settlement)
      *   2020 re-election cycle
      *   October 2nd / November 6th (election dates)
    llm_text: Fairhope citizens petitioned over 800 signatures in 2018 to change government to Council-Manager. Council President Burrell and Councilman Boone blocked Mayor Karin Wilson's advice, forcing a delayed November 6th election.
