hooks:
  gulf-shores-shoot-the-messenger:
    brief: |-
      THE CONFLICT:
      - Fairhope City Council is in re-election mode for 2020.
      - Council had produced nothing they could claim as a major accomplishment in nearly three years.
      - Council failed miserably on a federal grant for the K-1 Center, as predicted.
      - Council uses the city attorney as a tool to obstruct the Mayor and push through half-baked, not financially responsible ideas.
      - Latest: proposed bike trail on the 11.25 million dollar Triangle property, purchased through a legal settlement.
      - Council tried to convince citizens the purchase was for a park; article states it was a total lie; council LOST the lawsuit.
      - Council set to spend 10,000 dollars for a feasibility study, not in the budget, for a bike trail.
      - Council will use feasibility studies to promote plans except when the plan does not conform to their liking.
      - Current Fairhope Council composed of Catalyst loyalists who often do not listen to committee advice but prefer to lend ear to Catalyst plans for re-election.
      - Council President Burrell and Councilman Boone get full credit for pulling the wool over voters’ eyes re Triangle settlement.
      - Council and city attorney worked in concert to obstruct the Mayor, committees, or anyone else not sharing their agenda.
      - Lack of communication with the Mayor is by design and is costing the city valuable resources.
      - Citizens of Fairhope get ready because education and schools will become another subject; article predicts council will again elect to shelter themselves from decisions and relegate responsibility to anyone other than themselves.
      - Council cares about one thing and one thing only: returning to the good ole days of Can’t.

      THE DISCOVERY:
      - Article 2 is older than Article 1; frame it as background/historical context.
      - Gulf Shores Mayor and Council are acting the same way the previous Mayor of Fairhope, Tim Kant, acted involving the controversy of the Fairhope Fly Creek Apartments.
      - Gulf Shores Mayor and his buddy developer ignored the sentiments of the community.
      - It cost the Mayor his job as well as a few councilman.
      - Collateral effect in Fairhope resulted in firings, retirements and resignations of over a dozen employees who needed to go.
      - Controversy is not about apartments as much as it is about location, location, location.
      - Pete Sims remarks: development will increase the population of the City of Gulf Shores by almost 5 percent, based on 512 people or 2.5 residents per unit.
      - Pete Sims remarks: development will add 400 to 500 more cars on an already busy street in the residential area, not to mention Gulf Shores proper which is almost in a state of gridlock now.
      - Pete Sims remarks: if development is approved, it will not be long before the four-way stop signs in the “Small Town” section of Gulf Shores will be replaced by traffic signals.
      - Told by the Real Estate Company, Remax Paradise, that the developer planned to build townhomes.
      - Shocked to find out after the fact that a site plan had been approved by the City Planning Commission for a high-density, four-story apartment complex with absolutely no prior notice to citizens living in the neighborhood; residents were given no input.
      - Basis for petition: Save Our Neighborhood Stop Rezoning Apartments; petition that more than 750 people supported.
      - City of Gulf Shores current position is to ignore the complaints and threats of lawsuits by citizens.
      - Gulf Shores Mayor and Planning insist all is in order and those complaining have no merit.
      - “Shoot the messenger” or messengers was the mistake Fairhope’s Mayor and developer made.
      - If it were not for a few messengers, Mr. Pete Sims being the most vocal, who tried to alert the two complexes, The Enclave and The Regency Club, of the long term negative effects of the apartments, there would be no message, no information.
      - Why are the boards not carrying the banner of protest? They should be the messengers, not the ones shooting the messengers.
      - Condo associations are notorious for lack of communication, residential geniuses, and boards more known for the confusion they cause than the solutions they solve.
      - Unfortunately, The Enclave and The Regency Club are currently pointing fingers at each other, shooting the messenger and falling into an abyss of “NO ACTION”, which is exactly what Gulf Shores counted on.
      - Fairhope, just like Gulf Shores, has Planning and Zoning regulations, and just like Fairhope, under Tim Kant, Gulf Shores violates its own regulations more often than anyone else.

      THE PIVOT:
      - Article 2 is older than Article 1 and serves as background/historical context for Article 1.
      - Article 2 shows Gulf Shores Mayor and Council acting like the prior Fairhope Mayor, Tim Kant, regarding the Fairhope Fly Creek Apartments controversy.
      - Article 2 records the Gulf Shores outcome: the Mayor lost his job as well as a few councilman; the collateral effect in Fairhope resulted in firings, retirements and resignations of over a dozen employees.
      - Article 2 records the “Shoot the messenger” mistake made by Fairhope’s Mayor and developer.
      - Article 2 records the solution: Fairhope elected a new Mayor who concentrated on changing the membership of Planning and Zoning, with new appointments; the Mayor updated Planning regulations and planned further changes as a result of public participation; the Mayor settled all but one pending lawsuits inherited from the last administration and a Planning Board who favored developers over citizens.
      - Article 2 states it has taken 2 and half years in Fairhope with only one position left on P&Z, and he soon will be exiting the building.
      - Article 2 is the smoking gun/key context for Article 1 because Article 1 details the Fairhope City Council re-election mode, failed K-1 federal grant, Triangle legal settlement loss, bike trail proposal, 10,000 dollar feasibility study, Burrell, Boone, Catalyst, and city attorney obstruction of the Mayor.

      THE KEY ENTITIES:
      - Fairhope City Council
      - Council President Burrell
      - Councilman Boone
      - Catalyst
      - Mayor of Fairhope
      - Tim Kant
      - City Attorney of Fairhope
      - Fairhope committees
      - Fairhope citizens
      - K-1 Center
      - Triangle
      - Federal grant
      - Bike trail
      - Feasibility study
      - Gulf Shores Mayor
      - Gulf Shores Council
      - Gulf Shores Planning
      - Gulf Shores Mayor and Council
      - Pete Sims
      - Fairhope Fly Creek Apartments
      - The Enclave
      - The Regency Club
      - Save Our Neighborhood Stop Rezoning Apartments
      - Remax Paradise
      - City Planning Commission
      - City of Gulf Shores
      - Planning and Zoning
      - Fairhope Mayor
    llm_text: Fairhope’s council spent $10,000 on a bike trail study after losing the Triangle lawsuit, while Council President Burrell and Councilman Boone pushed Catalyst plans. Gulf Shores’ mayor just lost his job over the same “shoot the messenger” playbook.
