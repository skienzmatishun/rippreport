      Article 2 (April 2017) details a political conflict where Jack Burrell and Kevin Boone slowed city government and services, installing a hiring freeze to "punish" newly elected Mayor Wilson.

      THE DISCOVERY:
      Article 2 revealed the ongoing political obstruction by Council President Jack Burrell and Kevin Boone against Mayor Wilson prior to the detailed corruption exposé in Article 1.

      THE PIVOT:
      Article 2 establishes the historical pattern of the "good ole boy network" and obstructionism by Burrell and Boone, providing context for the systemic corruption (such as the handshake deal involving Mayor Kant and the library payments) exposed in Article 1, demonstrating the continuous political resistance to city reform.

