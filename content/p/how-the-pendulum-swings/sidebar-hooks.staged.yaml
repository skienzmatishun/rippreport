  listening-not-reading:
    brief: |-
      THE CONFLICT:
      *   Former Mayor Kant used influence to secure political support for Council President Jack Burrell in upcoming elections.
      *   Council President Burrell and Boone blocked the Mayor's appointments to the Airport Authority.
      *   Burrell did not contest any appointments made by Mayor Kant, despite fighting against the Mayor's selections.
      *   In 2011 (1/12/11), Rick Kingrea sent a "plain vanilla request" to the Attorney General referencing potential ethical and criminal activity linked to the BP oil spill.
      *   The Airport Authority failed to issue a required RFP for a hanger lease involving Councilman Hix, against Ethics Commission directive.

      THE DISCOVERY:
      *   The Ethics Commission consistently required public officials to use a bid process for business with their serving entity, regardless of bid laws.
      *   The Fairhope Airport Authority was compelled to bid the lease due to Hix's board membership.
      *   Karin Wilson became Mayor after a fair election supervised by the Secretary of State, without an assisted transition.

      THE PIVOT:
      *   Article 2 establishes a history of ethical breaches and political favoritism (Kant/Burrell dominance) that predates Mayor Wilson's tenure.
      *   This established environment allowed for non-contractual "handshake deals" (Kant/Walcott, Adams, Verneuille Architects) resulting in $32,510.97 in unverified library repairs.
      *   The historical pattern of unchecked influence (Airport scandal, blocked appointments) provides the context for the current investigation into corruption in Baldwin County.

