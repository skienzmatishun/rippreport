    llm_text: Mayor Kant used influence to back Jack Burrell, ignoring Ethics Commission rules and blocking appointments at the Fairhope Airport Authority. This history of unchecked power, including Hix's unbid hanger lease, sets the stage for current corruption investigations across Baldwin County.
