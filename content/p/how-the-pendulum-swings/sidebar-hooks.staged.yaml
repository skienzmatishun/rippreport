  showing-your-true-colors:
    brief: |-
      THE CONFLICT:
      *   Former Mayor Tim Kant's administration was involved in questionable financial dealings, including a $32,510.97 payment (discounted to close to $45,000) for exterior repairs on the Fairhope Public Library, approved by council members Burrell and Boone.
      *   This library work occurred during Kant's administration, based on a handshake deal between Kant and Walcott, Adams, Verneuille Architects, with no authorized paperwork found.
      *   Mayor Kant faced scrutiny from council members Burrell and Boone regarding his "handshake deal."

      THE DISCOVERY:
      *   In 2016, upon losing re-election, Mayor Kant attempted a "smooth transition" which included promoting a Performing Arts Center ($35,000 consultant cost) and using Planning and Zoning meetings (Sept 6, 2016) to push projects for major campaign contributors (Dewberry/Preble-Rish, LLC for Retreat at Fairhope Village; Hutchinson, Moore, & Rauch, LLC for Old Battles Place).
      *   Kant also supported Angelo Corte's court appeal on September 6, 2016, involving Fly Creek Apartments and the firm Hand Arendall.

      THE PIVOT:
      *   Article 2 (2016) establishes Mayor Kant's pattern of using his political influence to favor specific contractors and developers and engage in questionable, undocumented deals (e.g., P&Z projects, Performing Arts Center funding, court support).
      *   Article 1 demonstrates this pattern of corruption continued into the transition/post-administration, specifically through the undocumented handshake deal for the Fairhope Public Library repairs.

      KEY ENTITIES:
      *   Mayor Tim Kant (Former Mayor)
