  help-fairness-killing-us:
    brief: |-
      THE CONFLICT: Councilmen Boone and Brown cut funding to economic and community development. Councilman Burrell (President) eliminated economic and community development funding. Former Mayor Tim Kant engaged in a handshake deal with Walcott, Adams, Verneuille Architects for Fairhope Public Library repairs ($32,510.97) without authorization. Boone was involved in conflicts related to the airport scandal, triangle lawsuit, and "gift" (lift station property).

      THE DISCOVERY: Boone owned BA-101, LLC (Formation: 4-29-2004; Dissolution: 1-31-2017), a domestic limited liability company for property investment, involving Angelo Corte and John G. Avent. Boone publicly denied a conflict of interest despite the LLC being made public January 25.

      THE PIVOT: Article 2 demonstrates a pattern of self-serving political behavior (Boone's undisclosed financial interests, Burrell's budget manipulation) that establishes a historical context for the later, more specific allegations of institutional corruption (Kant's handshake deal, lack of contract/paperwork for library payments) detailed in Article 1.

      KEY ENTITIES: Mayor Wilson, Mayor Kant, Councilmen Boone, Burrell, Kant, Wilson, Angelo Corte, Botop (Sherry-Lea Bloodworth-Botop), Conyers, Brown, Robinson, Walcott, Adams, Verneuille Architects, Fly Creek, Preeble-Rish, Baldwin County, Fairhope, BA-101, LLC.
    llm_text: Councilman Boone hid his BA-101, LLC property investment interest while publicly denying conflicts. Councilman Burrell cut development funding, and former Mayor Kant authorized a $32,510 library deal using unauthorized handshake agreements.
