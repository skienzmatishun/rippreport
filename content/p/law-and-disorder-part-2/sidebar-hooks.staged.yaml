    brief: |-
      THE CONFLICT:
      1. House party incident occurred in Fairhope on Saturday, August 25, at approximately 9:45 p.m.
      2. The incident took place at a residence in the 16000 Block of County Road 13.
      3. Council President Jack Burrell has an undisclosed prior arrest/police record which was not disclosed during his campaign.

      THE DISCOVERY:
      1. On August 27, 2018, The Ripp Report reported the party involved over 75 underage minors from Fairhope High School and Bayside.
      2. The initial report (Aug 27) claimed alcohol and marijuana were present, but no minors, adults, or property owners were arrested.
      3. The initial report demanded Council President Jack Burrell immediately resign due to perceived lack of accountability.

      THE PIVOT:
      1. The initial public accusation (Aug 27) regarding Council President Jack Burrell's property and alleged police inaction prompted the official police investigation and subsequent public statement (Aug 25 incident details).
      2. The official police report confirmed an estimated 100 juveniles and the detention of 40-50 juveniles for alcohol consumption on August 25.
      3. The police report clarified that no adults were present upon arrival, no adults were charged, and property owner identity cannot be released due to juvenile identification policy.

      KEY ENTITIES:
      1. Jack Burrell (Council President)
      2. Fairhope Police Department
      3. Sergeant Craig Sawyer (Assistant Administrator, Fairhope Police Department)
      4. Mayor Wilson
      5. Councilman Brown
      6. Fairhope City Council
      7. County Road 13
      8. August 25, 2018
      9. August 27, 2018
