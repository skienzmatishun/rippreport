hooks:
  alabama-black-hole:
    brief: |-
      THE CONFLICT:
      - August 21, 2022: Francis Paul Ripp (The Ripp Report.com) sent complaint letter to Alabama Attorney General Steve Marshall, C/O Clark Morris, Office of Special Prosecutions. Ref: Complaint against the Executive Director of Ethics, Thomas Albritton.
      - Core allegation: Thomas Albritton engaged in "self Dealing" as trustee of the Mabel Amos trust.
      - Alleged act: In 2014, Albritton and two other trustees, along with Regions Bank, altered trust handling to list schools receiving scholarships instead of students by name.
      - Circuit Judge Ben Bowden, former law partner of Albritton, received $45,000 for his children's scholarships; other Albritton law partners also received scholarship money.
      - Ripp first contacted Governor, Ethics Commission, Alabama Bar, and office July 16, 2021; filed Writ of Mandamus; failed to get hearing.
      - Alleged non-disclosure: Albritton failed to disclose on economic statement that he was trustee of multi-million dollar trust; allegedly received $120,000 in spared family expense via scholarships to his children.
      - IRS sections 4941(d) alleged self-dealing violation; IRS taxes possibly due but unpaid by scholarship recipients.
      - Mabel Amos: Alabama's first female Secretary of State; established trust to help children with strong academic history but lacking financial capability for state college education.
      - 2010: Oil discovered on Mabel Amos land, producing $80 million in oil and gas, potential $20 million more.

      THE DISCOVERY:
      - Widget Article ("Alabama Black Hole") revealed Ripp's August 21, 2022 appeal to Special Prosecution Office; letter accompanied by 100+ page bound evidence package.
      - Copies sent to Alabama Bar, Governor, Judiciary, Ethics Commission; no reply from any agency as of August 21, 2022.
      - Attorney General, Alabama Bar, and Ethics Commission accused of covering up allegations against Albritton.
      - Article 2 framed Alabama as a "black hole of political and white collar crime."
      - Media attention: Lagniappe Mobile broke story; no other state news agency did significant follow-up.
      - Albritton traveling state giving "Lessons in Alabama Ethics" while self-serving from trust.

      THE PIVOT:
      - Article 2 is older than Article 1; serves as background/historical context.
      - The cover-up narrative and institutional failures in Article 2 frame the systemic context for the Albritton complaint in Article 1.
      - Article 2 is the "smoking gun" context: it documented lack of response from state agencies and the "black hole" framing prior to the main article's allegations.
      - Why Article 2 is key context for Article 1: it established baseline of institutional silence/cover-up that the main article's complaint (filed August 21, 2022) challenges.

      THE KEY ENTITIES:
      - Francis Paul Ripp (The Ripp Report.com)
      - Thomas Albritton (Executive Director of Ethics)
      - Cynthia Raulston (attorney for Albritton)
      - Clark Morris (Special Prosecutions, Alabama AG office)
      - Steve Marshall (Alabama Attorney General, August 21, 2022)
      - Ben Bowden (Circuit Judge)
      - Regions Bank
      - Mabel Amos (trust)
      - Alabama Bar
      - Ethics Commission
      - Governor (as listed: Governor Ivy)
      - Harry Still (Attorney)
      - Greg Morris (Attorney)
      - Tommy Gallion (Attorney)
      - Lagniappe Mobile
      - Lowery, Wilters (per instruction)
      - Montgomery police officers
    llm_text: Alabama Ethics Chief Thomas Albritton allegedly steered the Mabel Amos trust through self-dealing while ignoring scholarship rules. The Ripp Report says state agencies covered up his complaint, and now Alabama faces a black hole of political and white-collar crime.
