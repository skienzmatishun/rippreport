  fairhope-catalyst-a-dirty-little-secret:
    brief: |-
      THE CONFLICT:
      *   Fairhope City Council (Catalyst machine) was elected under an "At Large" system, hand-picked by former Mayor Tim Kant.
      *   The Council was opposed to changing the form of government to districts or Council-Manager.
      *   A referendum to change the form of government to Council-Manager was scheduled for October 2, 2018.

      THE DISCOVERY:
      *   The Catalyst Council attempted to use a Special Meeting (e.g., on 9/19/18) to hire a law firm and seek a Temporary Restraining Order to cancel or delay the October 2, 2018 election.
      *   Fresh Start Fairhope distributed an Urgent Message 9/19/18 alleging the Council was secretly plotting to deny citizens a fair vote.
      *   The Council failed to inform the public, despite the issue being known for three months.

      THE PIVOT:
      *   Article 2 (Widget) proves that the Catalyst Council is not merely politically opposed to change, but actively attempted to illegitimately obstruct a public referendum, confirming the institutional corruption cited in Article 1 (Main Article).
      *   This history supports Mr. Gary Thorson's claim that the purpose of change is to alter the city's power structure and prevent corruption by special interests.

      KEY ENTITIES:
      *   Gary Thorson (Forever Fairhope PAC)
      *   Fairhope City Council (Catalyst)
      *   Tim Kant (former Mayor)
      *   Karin Wilson (Mayor who won the election)
      *   Jay Robinson (Councilman/Attorney)
      *   Jack Burrell (Council President)
      *   Fresh Start Fairhope (group seeking reform)
      *   October 2, 2018 (referendum date)
      *   November 6 (upcoming voting date mentioned in Main Article)
      *   Baldwin County (cited as potentially most corrupt county in Alabama)
    llm_text: The Catalyst City Council, hand-picked by Tim Kant, secretly tried to cancel the October 2, 2018, Council-Manager referendum using a TRO. Fresh Start Fairhope exposed this plot, confirming institutional corruption and supporting Gary Thorson’s call for real change in Fairhope.
