  money-on-the-table:
    brief: |-
      THE CONFLICT:
      - Main Article (Article 1) is a letter to the editor by Jani Handwerger concerning COVID-19.
      - Writer states they are mad, worried, and scared.
      - Writer blames non-mask wearers and partygoers for endangering family, friends, and ME.
      - Writer says numbers are spiking.
      - Writer says demographic testing positive now is the non-mask wearers/partygoers.
      - Writer says they are transmitting COVID-19 to families.
      - Writer mentions high-risk parents and children at home who may get sicker.
      - Writer says all want to get out and have fun, but cannot because of non-mask wearers.
      - Writer says older generation worked and saved so younger generation could have childhood memories and enjoy lives.
      - Writer says older generation hoped for fun in Golden Years, but cannot because of non-mask wearers.
      - Writer begs people to stop partying, stop congregating, start wearing masks in public.
      - Writer says do not let the world blame you.

      - Article 2 (widget) is older/background context: Fairhope City Council is CATALYST through and through.
      - Article 2 states council opposes, procrastinates, or refuses anything Mayor may propose.
      - Article 2 states even projects previously endorsed by council are delayed or canceled by council.
      - Article 2 states after 3.5 years, Fairhope Waterfront Project is finally on drawing board.
      - Article 2 states Fairhope Waterfront Project is $6.2 million.
      - Article 2 states in work session, prior to council meeting, detailed 48 min presentation was given to council.
      - Article 2 states timing important with permitting phase; council asked for guidance or OK to proceed.
      - Article 2 states mayor was passionate about project, however fell on deaf ears.
      - Article 2 states council took no immediate action on plan but will likely revisit during council meeting at later date.
      - Article 2 states next meeting is May 11th, another delay and money on table.

      THE DISCOVERY:
      - Article 2 revealed council refused Mayor’s Marketing Plan for all businesses in Fairhope.
      - Article 2 revealed Mayor wished to hire marketing firm and come up with strategy for Fairhope business owners affected by COVID-19 pandemic.
      - Article 2 revealed included plan to welcome tourists back to Fairhope.
      - Article 2 revealed to finance $65,000 proposal, Mayor suggested raising lodging tax from 6% to 7%, paid by tourists, and implement ½ cent gas tax.
      - Article 2 revealed Fairhope is only municipality that does not have gas tax where average is 1%.
      - Article 2 revealed council refused to accept either proposal, leaving MONEY ON THE TABLE.

      - Article 2 revealed council refused to consider Mayor’s Marketing Plan.
      - Article 2 revealed council refused to finance $3,000,000 school tax Mayor proposed.
      - Article 2 revealed Mayor had plan to finance same $3,000,000 without tax.
      - Article 2 revealed council refused; taxpayers got blindsided by politics.

      - Article 2 revealed Mayor suggested annual payments made to Hatch program and Baldwin County Economic Development Alliance should be appropriations.
      - Article 2 revealed Mayor supported Hatch program from beginning.
      - Article 2 revealed council rejected idea without suggestions, except wait and see approach.

      - Article 2 revealed City of Fairhope annually donates $35,000 to Baldwin County Economic Development Alliance, $15,000 to Eastern Shore Chamber of Commerce, and $21,000 to Downtown Business Association.
      - Article 2 revealed latter two are member based.

      - Article 2 revealed council rejected any help to business community, instead reinforced position with BCEDA.
      - Article 2 revealed BCEDA’s $35,000 will most likely go to executive salary or payroll for BCEDA.

      - Article 2 revealed council supported raising its salary and full family insurance for entire council, approximately $125,000.

      - Article 2 revealed Councilman Burrell, Brown and Boone, the 3 B’s, without public participation, purchased 2.65 million for recreation land then leased it for $9,000 a year.
      - Article 2 revealed Fairhope desperately needs that money now.
      - Article 2 revealed council has no plan and no money for development of this property.
      - Article 2 revealed deal stinks of CATALYST.

      - Article 2 revealed council made repeated efforts to give away Triangle property that cost taxpayers $13 million in legal settlement.
      - Article 2 revealed beware they will try it again before municipal elections.

      - Article 2 revealed council paid $2.5 million for K-1 Center, Fairhope Community Park and Nix Center.
      - Article 2 revealed council allowed nothing for immediate repairs and elected to put temporary roof on K-1 Center and have no renovation plans, or money, for properties.

      - Article 2 revealed council, especially Burrell, spent over half a million dollars on Clock property, final price may exceed $600,000 for 1,000 sq ft.
      - Article 2 revealed Burrell and council oppose spending $65,000 for Fairhope business interest while ignoring trillions federal government spending to protect business and employees.

      - Article 2 revealed council’s attention to opening Quail Creek Golf Course.
      - Article 2 revealed in angry outburst, Burrell blamed Mayor for closing golf course.
      - Article 2 revealed what Burrell did not explain is council could have opened golf course anytime they wished, they just dropped the ball and wanted to blame Mayor for lack of action.
      - Article 2 revealed Mayor closed course for public health concerns.

      THE PIVOT:
      - Article 2 is the smoking gun or key context for Article 1 because it documents Fairhope City Council actions and inaction during COVID-19.
      - Article 2 provides background for local political conflict between Mayor Dane Haygood and CATALYST council.
      - Article 2 shows council refusal
    llm_text: Jan Handwerger is mad, worried, and scared, blaming maskless partygoers for spiking COVID cases that threaten her family. Fairhope's council refused the Mayor's $65,000 marketing plan and millions more, leaving money on the table as the pandemic drags on.
