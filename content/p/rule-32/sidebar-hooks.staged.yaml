      *   Murray Lawrence Jr. was wrongfully convicted and incarcerated for over 7500 days (20 years).
      *   Sheriff Hoss Mack leads the Baldwin County Sheriff’s Office (BCSO).
      *   BCSO incidents cited include Jonathan Victor (May 2017, deceased, shot unarmed) and Robert Yates (March 5, 2018, deceased, shot without probable cause).
      *   Sheriff Mack secured his second term with help from State Senator Trip Pittman, who legislatively recorded qualifications eliminating 99.5% of competition.

      THE DISCOVERY:
      *   The 2021 article established BCSO under Huey “Hoss” Mack operates under a "SECRET POLICE" model.
      *   On September 30, 2021, Chief Justice Tom Parker ruled broadly interpreting the investigative privilege statute, potentially limiting citizens' statutory right to access law enforcement records (body cam, 911 transcripts).
      *   Mack Funeral Home, a private business of Sheriff Mack, was awarded a county contract to handle deceased persons, indicating a conflict of interest with the County Commission.

      THE PIVOT:
      *   The 2021 article established a systemic culture of restricted public access and lack of accountability within BCSO.
      *   This context supports the 2023 Rule 32 petition, where the evidence was "suppressed willfully rather than inadvertently" and never disclosed to Murray Lawrence’s defense.

