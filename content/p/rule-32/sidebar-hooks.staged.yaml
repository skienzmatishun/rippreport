      THE CONFLICT: Capital Murder of Eric Hastings (Brandon Hastings) occurred in 2003 in Baldwin County, Alabama. Murray "Bubba" Lawrence was convicted, despite conflicting evidence (Mississippi ME suggested strangulation, not shooting). The State case rested on a co-conspirator's testimony.

      THE DISCOVERY: The 2003 trial involved the withholding of an autopsy report from the defense team of Murray Lawrence, linked to then-DA David Whetstone’s last capital case.

      THE PIVOT: Article 2 (2003) establishes a historical pattern of judicial and investigatory misconduct (withholding evidence/autopsy reports) involving key figures (Whetstone, Wilters, Hoss Mack) in Baldwin County. This context supports the current allegation in Article 1 (November 27, 2023) that evidence was "suppressed willfully rather than inadvertently" in the wrongful conviction of Murray Lawrence.

      KEY ENTITIES:
      *   Murray Lawrence Jr / Murray "Bubba" Lawrence
      *   Hoss Mack (Lt/4th Term Boss Hogg Sheriff)
      *   Robert Wilters (Trial Judge/District Attorney)
      *   David Whetstone (Prosecutor/Former DA)
      *   Brandon Hastings / Eric Hastings
      *   Attorneys Maxwell/Tillman
      *   Baldwin County, Alabama
