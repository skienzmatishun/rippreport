    refined_source: 33013c38a772f33450d914ef76851b316cf85926653564c864b35a6c2ad66163
    brief: |-
      THE CONFLICT: Wrongful conviction of Murray Lawrence Jr, resulting in over 7500 days (20 years) in jail. Involved parties included Hoss Mack (LEAD INVESTIGATOR/Sheriff), District Attorney Robert Wilters (Judge), and prosecutor David Whetstone.
      THE DISCOVERY: The Baldwin County Sheriff's office has had 20 years of questioned criminal and loss of life cases, using the Major Crimes Division to avoid accountability. Hoss Mack promised the County Commission $600,000.00 in body and car cameras, which were often not released fully or were edited.
      THE PIVOT: The previous allegations of systemic corruption in Baldwin County (20 years) provide the historical context and foundation for the specific claim in Article 1 that the evidence regarding Murray Lawrence was "suppressed willfully rather than inadvertently" by Mack, Wilters, and Whetstone, leading to the Rule 32 filing on November 27, 2023.
