hooks:
  watering-hole:
    brief: |-
      THE CONFLICT:
      - Baldwin County, Alabama, under siege from unbridled development.
      - Areas affected: Fairhope and Daphne.
      - In Fairhope and Daphne, development and approved projects popping up faster than corn.
      - Judges and attorneys are developers.
      - City Council that appointed them now approve their developments.
      - Judges and attorneys and City Council are described as self-serving.
      - Elected and appointed officials using positions for personal gain, regardless of political affiliation.
      - Thousands of houses and apartments will change landscape radically in a few years.
      - Traffic will be overwhelmed due to limited added roads and insufficient impact fees from development.
      - Schools will see class sizes balloon out of control; portables will become permanent while politicians brag about recreation land.
      - Quality of life will become more stressful; threat of housing crash will become real.

      Past events and names:
      - CATALYST, The Good ole Boys, going to try and regain control in Fairhope.
      - Present council is biggest threat to CATALYST takeover.
      - If present council successful, Fairhope will go into backward spiral they will not recover from.
      - Baldwin County, especially Fairhope, needs candidates to replace self-serving council.
      - Present council/what they have now is CATALYST.
      - Ronan McSharry, bar owner, McSharry’s/The Watering Hole.
      - McSharry’s was watering hole for Judges, Attorneys, and McSharry’s best friend, Council President Jack Burrell.
      - Jack Burrell was honored with sandwich on menu named after him.
      - Jack Burrell has a police report that he never disclosed prior to the last election.
      - The Watering Hole became taboo after the last election and McSharry’s multiple arrests.
      - Only then did politicians and members of the Judiciary come to conclusion that drinking with the Good ole Boys, in public, was not cool.
      - They may have left the Bar but they sure have had McSharry’s back.
      - Ronan McSharry has multiple convictions and is on probation.
      - Ronan McSharry was arrested again and walked, according to widget article.
      - Too many Judges, Lawyers and Politicians operate in a spaghetti bowl of Conflicts of Interest and Quid Quo Pro Deals.
      - Baldwin County needs many more Writ of Mandamus filed.
      - Judges and politicians serving more than two terms need to be replaced, voted out.

      THE DISCOVERY:
      - Article 2, titled Watering Hole, revealed/background context:
      - Bar owner Ronan McSharry continuously break the law and walk, according to widget.
      - If you are Ronan McSharry it appears not to be a problem.
      - McSharry’s was the watering hole for Judges, Attorneys, and of course McSharry’s best friend, Council President Jack Burrell.
      - Jack Burrell was honored with a sandwich on the menu named after him.
      - Jack Burrell has a police report that he never disclosed prior to the last election.
      - The Watering Hole became taboo after the last election and McSharry’s multiple arrests.
      - Only then did politicians and members of the Judiciary come to conclusion that drinking with the Good ole Boys, in public, was not cool.
      - Politicians and members of the Judiciary may have left the Bar but they sure have had McSharry’s back.
      - Question raised: How the hell can a person with multiple convictions, and be on probation, get arrested again and walk.
      - The Watering Hole.
      - Corruption is obvious.
      - If you reside in Baldwin County and have to go to Municipal, District or Circuit Court, you can have no expectation of a fair trial.
      - Baldwin County needs many more Writ of Mandamus filed.
      - Judges and politicians serving more than two terms need to be replaced, voted out.

      THE PIVOT:
      - Article 2 is older than Article 1; frame it as background/historical context.
      - Article 2 is the smoking gun or key context for Article 1 because it provides concrete local conflict example for the broader expose in Article 1.
      - Article 2’s Watering Hole conflict mirrors Article 1’s allegations of political corruption and conflicts of interest.
      - Article 2’s undisclosed police report involving Jack Burrell and Ronan McSharry connects to Article 1’s theme of officials using positions for personal gain.
      - Article 2’s multiple arrests of Ronan McSharry and question of walking after arrest relates to enforcement/legal issues raised in Article 1.
      - Article 2’s statement that too many Judges, Lawyers and Politicians operate in a spaghetti bowl of Conflicts of Interest and Quid Quo Pro Deals aligns with Article 1’s Backstory Podcast mission.
      - Article 2’s “Baldwin County should be renamed ‘Quid Quo Pro County’” supports Article 1’s expose theme.

      THE KEY ENTITIES:
      - People: Ronan McSharry; Jack Burrell; Council President; Judges; Attorneys; Politicians; Developers.
      - Groups: Backstory Podcast; The Ripp Report; The Watering Hole; The Good ole Boys; CATALYST; Court of Public Opinion.
      - Locations: Baldwin County, Alabama; Fairhope, Alabama; Daphne, Alabama.
      - Courts: Municipal Court; District Court; Circuit Court; Writ of Mandamus.
      - Titles: Council President Jack Burrell; City Council; Judges and Attorneys; elected and appointed officials; politicians serving more than two terms.

      KEY FACTS TO PRESERVE:
      - Specific names: Ronan McSharry, Jack Burrell, The Good ole Boys, CATALYST, Baldwin County, Fairhope, Daphne.
      - Dates: No specific dates provided in source text. References include “last election,” Backstory Podcast #9, Saturday Apology, Freaky Friday post.
      - Dollar amounts: Not specified in source text. Impact fees described as insufficient, amount not stated.
