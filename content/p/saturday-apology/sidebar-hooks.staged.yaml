  nail-in-the-coffin:
    refined_source: c8ad63b7e15823fa8dbd63568b19e57ce62a9c625d65009639341b37d5e3498f
    brief: |-
      THE CONFLICT:
      *   Fairhope City Council authorized a $2,650,000.00 land purchase (114 acres on NW corner of CR 13 and 32) related to the 2019/2020 budget timeframe.
      *   The council bypassed public participation and budget approval, stripping city savings ($1,065,146.07), reserves ($700,285.37), and impact fees ($884,568.56).
      *   Past issues include the Triangle Park legal settlement (final cost near $13 million, initially claimed by Council President Jack Burrell as $8.25 million) and the Soccer Fields purchase (over $5 million to $7 million).
      *   Council President Jack Burrell supported the unsuccessful effort to give away Triangle Park.

      THE DISCOVERY:
      *   The Council misrepresented the purchase, initially promising only an appraisal on Oct. 29, 2019, but proceeded directly to purchase.
      *   The purchase delayed scheduled city infrastructure/capital improvements (sewer, roads).

      THE PIVOT:
      *   Article 2 provides concrete, historical evidence of the Council's self-serving, non-transparent financial practices (draining city accounts for land) that supports Article 1's claim that the current council is a "biggest threat" and uses its position for personal gain.

