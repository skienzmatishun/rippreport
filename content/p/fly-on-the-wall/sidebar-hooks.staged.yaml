  a-decade-of-corruption:
    refined_source: a3f57458e6939c374dd37d08d4ee677267f25b4e6104fb82757e40c85e30674c
    brief: |-
      THE CONFLICT:
      *   Prior to Karin Wilson's election, Fairhope Mayor Tim Kant utilized Fairhope staff (including Greg Mims, Sherry Sullivan, and Jennifer Fidler) to secure a $636,000.00 bid from Fairhope to State Senator Tripp Pittman for BP Boom work.
      *   The County Commission advised Kant and Pittman not to proceed on May 8, 2010, but Pittman submitted a second proposal (Oil Recovery).
      *   On June 4, 2010, the Fairhope City Council awarded the contract to Pittman Tractor, leading to a check of $372,165.90 being paid to Pittman Tractor.
      *   Pittman and Kant maintained a debris contract with the City of Fairhope for over 8 years, a contract that ended when Karin Wilson was elected.
      *   The previous administration, led by Kant, was characterized by corruption, favoring wealthy people, and poor infrastructure investment.

      THE DISCOVERY:
      *   The Widget Article (older) documents specific, actionable instances of corruption involving Mayor Kant and Senator Pittman starting around 2010, demonstrating systematic financial misuse (e.g., BP funds).
      *   This historical record confirms the prior regime's financial malfeasance, moving beyond general accusations of "corruption" to documented transactions and dates.

      THE PIVOT:
      *   Article 2 provides the factual evidence (dates, contract amounts, names) proving the systemic corruption of the Kant regime, validating the accusation in Article 1 that Sherry Sullivan was a "huge part of the Kant regime that was full of corruption."
      *   Article 1's critique of Sherry's influence and the "Kant regime" is grounded in the documented historical corruption detailed in Article 2, rather than mere political opinion.

      KEY ENTITIES:
      *   Karin Wilson (Mayor)
      *   Tim Kant (Former Mayor)
      *   Sherry Sullivan
      *   Tripp Pittman (State Senator)
      *   Jack Burrell (City Council/Mayor Kant associate)
      *   Greg Mims
      *   Jennifer Fidler
