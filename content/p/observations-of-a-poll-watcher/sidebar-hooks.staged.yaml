  as-long-as-i-count-the-votes-what-are-you-going-to-do-about-it:
    brief: |-
      THE CONFLICT:
      *   In 2012, Dr. Chris Warner ran for Mayor of Fairhope, reporting incumbent Mayor Kant had a 22% approval rating in a scientific poll.
      *   In the 2012 primary, Mayor Kant allegedly received 55% of the vote (challenger 33%, Warner 12%).
      *   Chris Warner challenged the election and requested a ballot hand-count, which was denied with a quoted cost of $4,500.
      *   In the recent Baldwin County Commission race (involving Bob James and Chris Elliot), Elliot defeated James by 19% (3,000 votes).

      THE DISCOVERY:
      *   On September 11, 2012, a certified Poll Watcher for Lonnie Mixon documented observations during Fairhope Municipal Elections.
      *   Observations included a lack of control of voting machines, young children inserting assumed parents' ballots, and Tom Odom (a poll watcher and Fire Marshall) opening absentee voting machines.
      *   The poll watcher was not allowed to monitor the final machine opening and tape certification, preventing testimony regarding the security of the final certification.

      THE PIVOT:
      *   The 2012 observations (Article 2) established a documented pattern of procedural deficiencies, lack of transparency, and compromised certification procedures in Fairhope elections.
      *   This historical context supports Dr. Warner’s 2014 claims (Article 1) that election tampering involving absentee ballots and lack of control of voting boxes is common, providing specific, dated evidence of past violations.

      KEY ENTITIES:
      *   Chris Warner, Ph.D.
      *   Mayor Kant
      *   Lynn Stacey
      *   Chris Elliot (Baldwin County Commissioner)
      *   Bob James
      *   Lonnie Mixon
      *   Tom Odom (Fire Marshall, City of Fairhope employee)
      *   Mrs. Culver (Election Supervisor)
      *   Alabama Secretary of State, Election Division
      *   Fairhope, AL
      *   Baldwin County
    llm_text: Lonnie Mixon documented procedural flaws in 2012 Fairhope elections, noting lack of machine control and children voting. This evidence supports Dr. Chris Warner’s challenges against Mayor Kant and explains recent races like Chris Elliot defeating Bob James.
