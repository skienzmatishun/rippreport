  pay-executives-first-boy-scouts-come-last:
    brief: |-
      THE CONFLICT:
      *   Chris Warner, Ph.D., filed a letter to the Alabama Sec. of State on July 24, 2014, alleging election tampering in Fairhope, AL.
      *   Warner cited Mayor Kant's 2012 primary (55% to 33% to 12%) and the Baldwin County Commission runoff (150 vote margin between Bob James and Chris Elliot).
      *   Lynn Stacey, identified as "the fix-it guy," was cited as the political consultant for Mayor Kant and Chris Elliot.

      THE DISCOVERY:
      *   In August 2016, Mobile Area Boy Scout Council faced an average yearly loss of over $200,000 since 2008 (9 years).
      *   Michael Hartigan, Executive Director since January 2009, was responsible for losing close to $1.5 million.
      *   Board President Phil Webb was accused of breaking state and federal laws (IRS) and mismanaging Camp Maubila land sales.
      *   Tucker Dorsey, Baldwin County Commissioner, was named in the context of the financial losses.

      THE PIVOT:
      *   Both articles document systemic institutional malfeasance and financial/electoral corruption within Baldwin County (local government and non-profit organizations).
      *   The articles illustrate a recurring pattern of alleged illegal activity and mismanagement across different sectors in the region, not a direct causal link between election fraud and Scout financial theft.

