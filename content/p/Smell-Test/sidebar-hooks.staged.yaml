  alabama-ethics-commission-hide-the-list:
    brief: "THE CONFLICT: \n- Between 2013 and 2021, $3.2 million from the Mabel Amos Trust was improperly distributed as scholarships to privileged kids (belonging to judges, bankers, lawyers, and politicians) rather than deserving, qualified children.\n- Tom Albritton served as a trustee of the Mabel Amos Trust while simultaneously acting as the Executive Director of the Alabama Ethics Commission.\n- Albritton and the Alabama Bar pushed to keep the recipient list sealed, while plaintiffs and *Lagniappe* demanded the names be made public.\n- Alabama Attorney General Steve Marshall’s office intervened in civil litigation, and a deal was reached with Regions Bank to make the trust whole.\n- On January 17, Superintendent Tyler’s wife made a $1,000 campaign donation to Daphne school board incumbent and candidate Andrea Lindsey.\n- On January 18 (verified by video), Andrea Lindsey seconded and voted for a motion to give Superintendent Tyler's wife a promotion, following a prior change to the position's required credentials.\n\nTHE DISCOVERY: \n- Article 2 (historical context) revealed deep-rooted political corruption involving Tom Albritton, who used his position as Ethics Commission Executive Director to dismiss legitimate citizen ethics complaints while shielding the \"Good Ole Boys\" (GOB) network who benefited from the Mabel Amos Trust funds.\n\nTHE PIVOT: \n- Article 2 serves as the smoking gun because it establishes a systemic pattern of institutional corruption and cover-ups by Alabama officials (like Tom Albritton), directly mirroring the \"barely legal\" and unethical quid pro quo behavior exposed in Article 1 regarding Baldwin County’s GOB network, Superintendent Tyler, and Andrea Lindsey.\n\nKEY ENTITIES: \n- Tom Albritton\n- Andrea Lindsey\n- Carrie Hosier\n- Superintendent Eddie Tyler (and Mrs. Tyler)\n- John Gray\n- Steve Marshall\n- Amanda Priest\n- Cameron Mixon\n- Mabel Amos Trust\n- Regions Bank\n- Alabama Ethics Commission\n- *Lagniappe* (Mobile newspaper)\n- Governor Kay Ivey"
