  alabama-black-hole:
    brief: |-
      THE CONFLICT:
      - Baldwin County / Fairhope, Alabama: taxpayers facing $10 million lawsuit in federal court.
      - Lawsuit filed in U.S. District Court for the Southern District of Alabama on Oct. 27. Concerns two developments: Gables on Lawrence (~20 acres, corner of Lawrence Road and Marshall Lane) and Skyline Village (~16.5 acres along Dyer Road).
      - Fairhope has infamous reputation of changing rules after the fact.
      - Prior Triangle case: taxpayers paid almost $3 million in legal fees; judgment against city included city buying the Triangle for $8.25 million; total $11.25 million taxpayer money.
      - Fairhope council and Mayor would do whatever they want regardless of lawsuits; current Mayor and council are "Can't" mentors.
      - City hired Hand Anderall Sale as additional counsel; Hand Anderall was law firm that lied to Fairhope citizens over Triangle lawsuit, costing taxpayers $3 million in legal fees.
      - Attorney Cain O'Rear raised right hand in Fairhope City Council Chambers and promised citizens "the city would not have to pay any legal fees"; later determined false.
      - After failed attempts regarding Triangle property, city gave property to Single Tax Corporation; taxpayer money totaled $11.25 million.

      THE DISCOVERY:
      - Article 2 ("ALABAMA BLACK HOLE") via Francis Paul Ripp of The Ripp Report.
      - Ripp appealed to Special Prosecution Office for Alabama Attorney General Clark Morris; letter dated Aug. 21, 2022, addressed to Mr. Steve Marshall C/O Clark Morris, Office of Special Prosecutions; Ref: Complaint against Executive Director of Ethics, Thomas Albritton.
      - Ripp had contacted Governor, Ethics Commission, Alabama Bar and AG office July 16, 2021; filed Writ of Mandamus; failed to get hearing.
      - Ripp's complaints alleged Ethics Commission passed on complaints against Lawyers, a Judge, Council President, councilman and a mayor.
      - Alabama Bar ignored original complaint and accepted Albritton's written explanation (three-page excuse); Bar provides cover for corrupt officials, does not hold anyone accountable.
      - 17 ethics violations filed against former Ethics Director Tom Albritton; director Mr. McCallum avoided criminal charges.
      - Alabama Bar "two year bump" concept - attorneys using Alabama Bar to pad retirement.
      - Bar played games with attorney Harry Still; Still's law license canceled; excuse was continued education, though Still completed classes; disrupted efforts; cost Still clients during reinstatement; Ripp believed Still filing bar complaint regarding deliberate actions.
      - Ethics Commission internally corrupt; Albritton and Cynthia Raulston targeted some individuals while covering tracks of others; pattern of bad behavior by both glaring.
      - Cynthia Raulston called Ripp ~Jan 2022, ~45 minutes; defended Albritton's self-serving of trust; said statute of limitations expired re: trust; claimed Albritton as trustee of Mabel Amos trust within bounds to accept scholarships, other two trustees and Regions Bank approved; insisted Albritton's children had not been awarded scholarships since appointment to ethics commission in 2015; records show otherwise.
      - Ripp asked re: Albritton's economic statement prior to appointment; Raulston said not required, gave excuse; inaccurate - Albritton had filled out economic statement; failed to disclose he was trustee to multi-million dollar trust and had enjoyed $120,000 of spared family expense via scholarships his former law partners and trustees awarded to his children.
      - Raulston ended conversation saying Albritton was a good man; any future complaint would receive "special attention."
      - Ripp's interpretation: Albritton and Raulston covering each other's butts; recent articles re: Montgomery police officers and harsh rebuke by Attorney General added to suspicions Raulston and Albritton work in concert beyond scope of ethics commission.
      - Ethics Commission in conflict with AG's office related to exculpatory evidence.
      - Ripp referenced article "Self Dealing, Lagniappe, June 30, 2021" - in package. Albritton hid duties as trustee of multi-million dollar trust on economic statement; in 2014, as trustee with other trustees and Regions Bank, altered handling of trust - began listing schools receiving scholarships not students by name; hid actual recipients. Circuit Judge Ben Bowden, former law partner of Albritton, received $45,000 for his kids' scholarships; other Albritton law partners received scholarship money.
      - Discovery in civil and possibly federal court to reveal depth of corruption surrounding trust and Regions Bank, which charged over $1 million in fees for managing trust.
      - Albritton may have violated IRS section 4941(d) "self dealing"; IRS taxes may have been due but not paid by scholarship recipients; under purview of IRS.
      - Mabel Amos was Alabama's first female Secretary of State; served as recording secretary for six governors; established trust intending to help kids with strong academic history but lacking financially capability to afford state college education.
      - 2010: oil discovered on Mabel Amos land, producing $80 million in oil and gas, potential $20 million more. Mabel Amos trust flush with cash and ripe for picking. Disgusting that lawyers and Regions Bank took opportunity to self serve and tarnish trust.
      - In laymen's terms: Albritton along with two other trustees and Bank stealing from needy children to provide privileged children an education; children of privilege from prominent families.
      - Ripp: Alabama known as most corrupt state in US.

      THE PIVOT:
      - Article 2 is older than Article 1; frame as background/historical context.
      - Article 2 revealed/cover showed pattern of alleged corruption and institutional cover-ups (AG, Ethics Commission, Alabama Bar, trust self-dealing, law partners, judge).
      - Article 2 implicated council president, councilman, mayor in complaints that got passes from Ethics Commission - connecting to Fairhope mayor/council.
      - Article 2's "black hole" - failure of state agencies to act - context for why Fairhope situation led to $10 million lawsuit / rule changes after the fact.
      - Article 2 is the 'smoking gun' or key context for Article 1 because it established the broader alleged pattern of self-dealing, cover-ups, and enforcement failure that frames the Fairhope taxpayer lawsuit and the $11.25 million Triangle payout.

