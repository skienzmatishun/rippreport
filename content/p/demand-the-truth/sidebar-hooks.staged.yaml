      Mike Hubbard was convicted for engaging in municipal contracts for direct income.

      THE DISCOVERY:
      The Alabama Ethics Commission (led by Hugh Evans) provided letters and support to Senator Pittman (e.g., July 17, 2014, for contract extension) despite concerns about him using his office for personal gain and violating legal requirements.
      The pattern of contracts demonstrates the AEC was a "corrupt political vehicle" enabling elected officials to secure taxpayer-funded public contracts for personal gain.

      THE PIVOT:
      The historical evidence from 2004-2014 proves the Ethics Commission previously lent official support to Pittman's conflicts of interest. This history refutes the 2016 claim that the Ethics Commission had "exonerated them" or provided official "permission" regarding the BP fraud claim; the prior support indicates a systemic failure/complicity, not legal exoneration.

