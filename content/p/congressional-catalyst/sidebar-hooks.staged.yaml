      - Snedeker — Fairhope Municipal Judge/developer, CATALYST support.
      - BP Boom Boom Pittman — former State Senator, CATALYST support.
      - Baldwin County Republicans — hijacked by CATALYST.
      - Baldwin County — Fairhope and Baldwin County.
