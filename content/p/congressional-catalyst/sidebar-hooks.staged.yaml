      - Bill Hightower (Congressional candidate / CATALYST candidate)
      - Bradley Byrne (Outgoing Congressman for Alabama's 1st District)
      - Snedeker (Fairhope Municipal Judge / Developer)
      - BP "Boom Boom" Pittman (Former State Senator)
