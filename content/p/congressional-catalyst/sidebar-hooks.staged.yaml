  fairhope-petition:
    brief: |-
      THE CONFLICT: In the past (referenced in historical context), the Fairhope City Council and Weeks Bay attempted to execute a backroom deal to transfer control and management of 106 acres of city property—valued at $20 million—without public input. The land was originally acquired not for a park, but as the result of a legal settlement the city lost. Citizens, a couple of lawyers, and the Mayor fought back, launching a petition that grew from 325 names to 527 names to demand that the city retain control and that no property be disposed of until comprehensive and land use plans were completed.

      THE DISCOVERY: Article 2 (the widget article) revealed that the Fairhope City Council operated as a "CATALYST" and "Can't" connected network that bypassed democracy, conspired behind closed doors with Weeks Bay to permanently strip the city of control over a $20 million asset, and ignored public participation until citizens and the Mayor intervened.

      THE PIVOT: Article 2 serves as the smoking gun for Article 1 because it documents the exact "criminal enterprise" behavior, closed-door dealing, and anti-citizen governance of the CATALYST network in Fairhope—proving the local corruption that Article 1 warns is now attempting a takeover of Alabama's First Congressional District through candidate Bill Hightower.

