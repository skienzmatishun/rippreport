  catalyst-birds-of-the-same-feather:
    brief: |-
      THE CONFLICT: In 2018, a political network/group known as CATALYST attempted a takeover of Baldwin County government, placing hand-picked candidates into various positions ranging from probate judge to State Senate and all four Baldwin County commission races, operating like an organized criminal enterprise to influence local politics, city councils, and judicial appointments.

      THE DISCOVERY: Historical background (Article 2) shows that CATALYST evolved out of the political partnership of Stacy Elliott and Haygood (who became Mayor of Daphne), morphing further when Chris Elliott became a County Commissioner, with Scott Boone (son of Fairhope Councilman Kevin Boone) operating at the helm. The group systematically used intimidation, bully tactics, and voter suppression (such as disappearing campaign signs) to place developer-friendly candidates into power—such as backing Joe Davis (supported by former Fairhope Mayor Tim Kant, who left behind failing infrastructure, a broken sewer system, and controversial projects like Fly Creek Apartments).

      THE PIVOT: Article 2 serves as the smoking gun because it establishes CATALYST's multi-year operational playbook, lineage, and developer-lobbyist backing in local Baldwin County elections, proving that their current 2019/2020 effort to run Bill Hightower for Alabama's 1st Congressional District (to fill Bradley Byrne's seat) is merely the logical escalation of an established regional cancer trying to scale its corrupt political machine to federal office.

      KEY ENTITIES:
      - Bill Hightower (Congressional Candidate)
      - Bradley Byrne (Outgoing Congressman, District 1)
      - Chris Elliott (County Commissioner / former Stacy Elliott & Haygood partner)
      - Scott Boone (Head of Catalyst)
      - Kevin Boone (Fairhope Councilman)
      - Haygood (Mayor of Daphne)
      - Snedeker (Fairhope Municipal Judge / Developer)
      - BP "Boom Boom" Pittman (Former State Senator)
      - Joe Davis (District 2 candidate)
      - Tim Kant (Former Fairhope Mayor)
      - John Lake (District 2 candidate)
      - Lynn Perry
      - Skip Gruber
      - Tucker Dorsey
      - William Scully
    llm_text: When Scott Boone and the CATALYST network used bully tactics to seize Baldwin County seats, they built a corrupt developer machine. Now, they are pushing Bill Hightower for Congress—read the shocking playbook behind their local takeover.
