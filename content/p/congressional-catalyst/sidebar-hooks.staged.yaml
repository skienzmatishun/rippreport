  backstory-podcast-2:
    brief: |-
      THE CONFLICT:
      - Alabama’s first congressional district: 5 Republican candidates running to fill Bradley Byrne’s seat.
      - Only one candidate is CATALYST; Bill Hightower is the CATALYST candidate.
      - In 2018, CATALYST made a move to take over the County.
      - CATALYST wants to regain control of Fairhope and Baldwin County and now the First Congressional District.
      - CATALYST and the Fairhope City Council operate like a criminal enterprise, per FBI definition: “a group of individuals with an identified hierarchy, or comparable structure, engaged in significant criminal activity.”
      - CATALYST is an organization that in no way is looking out for citizens’ best interests.
      - CATALYST has hijacked the soul of the Baldwin County Republicans; they bank on the party to cover their tracks, while dragging the party and good people through the mud.
      - Fairhope needs to remove the CATALYST cancer from its government and its judiciary.
      - Bill Hightower is the CATALYST candidate, supported by Fairhope Municipal Judge/developer Snedeker and former State Senator BP Boom Boom Pittman and of course the CATALYST Fairhope City Council.

      THE DISCOVERY:
      - Backstory Podcast (Article 2) is the court of public opinion.
      - Podcast discusses topics ranging from human interest stories to political corruption.
      - Podcast is not shy about calling out corrupt politicians, judges or attorneys.
      - The Ripp Report partnered with Pamala Traylor as an equal partner in Backwoods Media LLC; Backstory Podcast is a production of Backwoods Media.
      - Backstory is an internet reporter providing information that other media outlets tend to avoid.
      - Backstory welcomes public participation and confidential information, which will remain confidential.
      - Backstory Podcast currently establishing a full time studio in Daphne.
      - In 2020, the media group will cover the upcoming elections, focusing on elected officials that have not represented constituents, ignored corruption or a part of the corruption.

      THE PIVOT:
      - Article 2 is older than Article 1; frame as background/historical context.
      - Backstory Podcast’s stated purpose is to educate the public on corruption that exists in Baldwin County.
      - The Backstory Podcast sets the court of public opinion frame that the main article (Congressational Catalyst) uses to frame Bill Hightower and CATALYST ahead of the 2020 election coverage.

      KEY ENTITIES:
      - Bill Hightower — CATALYST congressional candidate.
      - Bradley Byrne — seat being vacated.
      - CATALYST — organization.
      - Fairhope City Council — CATALYST candidates occupy.
      - Fairhope City Attorney — hand me down from CATALYST network.
