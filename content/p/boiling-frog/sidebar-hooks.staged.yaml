  in-the-dark:
    brief: |-
      THE CONFLICT:
      - Boiling frog fable: frog put suddenly into boiling water jumps out; frog put in tepid water brought to boil slowly does not perceive danger and is cooked to death.
      - Fairhope traffic at Parker Road and Hwy. 98 intersection: congestion getting worse every day.
      - Intersection described as "gateway to Fairhope" via Parker Road; predicted to become "malfunction junction."
      - Publix off Parker Road: entrance only 8 car lengths, exit 8 vehicles; stacked cars block gas station entrance; only those cars make the light.
      - Apartments and townhouses approved on Fly Creek, ~300 units, only two ways into development (off 98 and Parker Road).
      - Parker Road light will have 700 to 1000 more vehicles per day when apartments complete.
      - Fire station at head of Highridge Road off Parker; how will fire truck get through blocked intersection?
      - Parker Road on Publix side only about 1000 feet long, half in county and half in Fairhope, neither did maintenance on Parker for years.

      THE DISCOVERY:
      - Fairhope in 2018 is IN THE DARK; last city council meeting in Fairhope for 2018; council in full re-election mode.
      - Council decided Fairhope was for non-drinking "Christians"; good Baptist led charge to kill entertainment district.
      - Baptist Minister with help of former Mayor broke every planning and zoning rule to expand Church and parking; destroyed neighborhood; grass lot where a house was destroyed so people could "put their car" on Sunday while in Church.
      - Council talked like they had marbles in their mouth, could not eat up or eat enough crow; needed Baptist votes.
      - Council swore in Fairhope Municipal Judge Snedecker for another two years; council pick; council president led charge to secure good Judge another two years.
      - Ronan McSharry, of McSharry's, close friend of Jack Burrell, frequent flier in Judge Snedecker's court.
      - Council last action of year: Item 23 - Resolution - That Mayor Karin Wilson is hereby authorized to execute Engagement Letter with Tobias McCormick and Comer Lawyers, LLC for Professional Legal Services for representation of The City of Fairhope, on the Third-Party Complaint against Charter Oak Fire Insurance Company in the matter of Charles K/ Breland, Jr. V. The City of Fairhope, et al., CV-2013-901096.
      - No one asked a single question about item 23; Council and Baptist all gone home.
      - Council took position of character assassination and blaming property owner; defense.
      - Alabama Supreme Court ruled unanimously, 9-0, in favor of owner and sent case back to Baldwin County.
      - Case started about 11 years ago, before Mayor or Council elected; council ignored serious position of city, just like triangle lawsuit, and need to settle case.

      THE PIVOT:
      - Council ignored serious position of city is in; just like triangle lawsuit, and need to settle the case.
      - Triangle lawsuit cost 11.25 million; legal fees 3 million; city was dropped by insurance carrier and taxpayers picked up bill.
      - Council appears going to try and stick insurance company again with another lawsuit.
      - City Council cannot see its hand in front of its face because they are IN THE DARK.

