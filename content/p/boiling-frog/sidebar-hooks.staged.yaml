      THE DISCOVERY: BCEDA's promotion of "shovel ready" development occurred amidst significant Baldwin County infrastructure strain, including the late Baldwin County Commission and School Board passing a 1% tax without a public vote, and the diversion of school funds for county infrastructure.
      THE PIVOT: Article 2 establishes the historical context of uncontrolled, rapid growth in Baldwin County and pre-existing infrastructure failure, proving that the current congestion issues in Fairhope (Parker Road/Hwy 98) are not isolated incidents but a direct result of unmanaged development and prior municipal/county approvals (Fairhope, Catalyst, City Council) for units like the 300 apartments on Fly Creek.
