    brief: |-
      THE CONFLICT: Former Mayor Kant's proposals failed, including attempts to buy the Triangle property resulting in a $11.25 million lawsuit cost and neglect of sewer infrastructure in Fairhope.
      THE DISCOVERY: Mayor Wilson and Economic Director Sherry Botop secured $20 million in BP funds, including $10 million for sewer projects and $650,000 for an updated comprehensive land use plan, overseen by Fairhope Planning Director Wayne Dyess.
