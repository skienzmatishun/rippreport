  shut-up-2:
    brief: |-
      THE CONFLICT:
      - Baldwin County, Alabama - described as fastest growing county in the state.
      - Developers in Baldwin County pay no or little impact fee for projects; lack of developer impact fees ends up costing the taxpayer to make up difference in cost of Schools, Streets/Transportation and Education.
      - Baldwin County School System negatively impacted the most due to lack of long-term planning from the Baldwin County School Board.
      - Governor Ivy (Kay Ivey) - wants more control over failing education system, by appointing State School Board Members rather than electing them.
      - Bill introduced to end election of state school board members.
      - Proposed lottery - for the last 20 years referred to as an "education lottery"; proposed lottery has NO money for education; politicians wish to use lottery to pay back State General Fund, as far back as 2013; Alabama politicians supporting lottery to pay back State General Fund money politicians already stole or misappropriated.
      - Proposed amendment to lottery bill would give education 25%, a far cry from 100%.
      - In Fairhope - special school tax was favored by the City Council over the Mayor's proposal pushing for impact fees and making contribution more equitable.
      - City Council President statement: "the City Council wants out of any School business."
      - Teachers supposed to TEACH not fund-raise.

      THE DISCOVERY:
      - Baldwin County legal system relies too much on shutting people up; criminal acts, political misconduct, court proceedings and civil litigation are "sealed" or confidentiality agreements are required to settle issues.
      - Money is an ingredient to grease the wheel while keeping everything out of the eye of the public domain.
      - Three former employees brought lawsuits against the City of Fairhope; all three made allegations against the City and the Mayor.
      - One case pending; other two settled and had their cases sealed.
      - All allegations went unanswered because both former employees took the money then signed confidentiality agreements; pending case will most likely end the same way; they get taxpayer dollars and never have to explain anything to the taxpayer.
      - Ripp Report following two criminal cases and three civil cases; common denominator is that attorneys want everything sealed.
      - Common practice: victim of criminal case gets offer to settle prior to court for a sum of money, accompanied by a confidential agreement; guilty party silently walks away.

      THE PIVOT:
      - Article 2 ("SHUT UP") is the older/background article and frames the legal and political context.
      - Article 2 revealed how Baldwin County legal system uses sealed/confidentiality agreements and money to settle disputes, allowing guilty parties to avoid accountability.
      - This is the smoking gun/key context for Article 1 ("TAX TAX AND RE-TAX") because it explains the pattern of silencing, sealed cases, and lack of transparency that parallels the Main Article's conflict over developer impact fees, taxpayer-funded schools/streets/transportation/education, Governor Ivy's push to appoint State School Board members, and the proposed education lottery.

      KEY ENTITIES:
      - Jack Burrell - President of the Fairhope City Council; hauled into Federal Court for refusing a citizen and veteran from exercising free speech; case settled WITHOUT any confidentiality agreement; public police record with several incidents sealed, how convenient; failed to mention police record the last time he ran for office.
      - Ivy - Governor of Alabama.
      - Baldwin County - Baldwin County School System, Baldwin County School Board, Baldwin County legal system, fastest growing county in the state.
      - City of Fairhope - Mayor, City Council, Council President.
      - Three former employees - lawsuits against City of Fairhope.
      - Attorneys - want everything sealed.
      - State General Fund - referenced for lottery payback as far back as 2013.
      - Developers - pay no or little impact fee.
