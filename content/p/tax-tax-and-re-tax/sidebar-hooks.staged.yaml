      - Teachers - demand Baldwin County School Board address basic needs of schools.
      - Fairhope City Council - favored special school tax over Mayor's impact fee proposal.
      - Federal Court - case involving Jack Burrell.
      - Citizens/veteran - free speech case.
      - Police record - public record, incidents sealed.
      - Lowery - name to mention in context of broader Ripp Report investigation.
      - Wilters - name to mention in context of broader Ripp Report investigation.
