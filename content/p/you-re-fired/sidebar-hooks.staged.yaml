      THE CONFLICT:
      * October 2010: Alabama Ethics Commission issued a 4-0 advisory opinion stating Commissioner Tucker Dorsey should not participate in issues related to BCSS due to Burke's employment (conflict of interest).
      * July 29, 2016: A complaint was filed stating Commissioner Dorsey did not heed the unanimous Ethics Commission advice.

      THE DISCOVERY:
      * Friends of Fly Creek filed a lawsuit against the City of Fairhope, Fairhope Planning and Zoning, Fairhope City Council, and Leaf River Group LLC over Fly Creek Apartments in June.
      * The Court denied the defendants' motion to dismiss, allowing the lawsuit to proceed into discovery.
      * George Robards, a contributor to the Mayor and Planning and Zoning, was a key defender of the original zoning for Leaf River Group LLC.
      * Leaf River Group has one year to begin construction, after which zoning may be reversed to NO APARTMENTS.

      THE PIVOT:
      * Both articles detail public officials (Dorsey/Robards) making decisions tied to private financial interests (BCSS/Leaf River Group) despite formal ethical warnings (Ethics Commission opinion/Court ruling favoring citizens).
      * The Fly Creek lawsuit demonstrates citizen legal action challenging municipal decisions that prioritized developers over public interest, paralleling the conflict of interest issue faced by Dorsey.

