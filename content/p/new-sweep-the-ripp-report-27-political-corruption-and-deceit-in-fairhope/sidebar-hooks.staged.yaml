  flowers-marbles-for-brains:
    brief: |-
      THE CONFLICT:
      *   Fairhope previously maintained a check and balance system via a Finance Committee.
      *   Mayor Tim Kant convinced the City Council to dissolve the Finance Committee, granting him complete financial control.
      *   Kant took $3 million from utility reserves to settle a lawsuit and pledged $1 million for a soccer field within the last year (as of Article 2's writing).
      *   Article 2 called for the removal of Tim Kant and the current city council ahead of the 2016 election.

      THE DISCOVERY:
      *   Fairhope had never conducted a forensic audit of its finances or utilities, despite having two mayors in the previous 30 years.
      *   Mayor Tim Kant maintained control over utilities.
      *   The city council, convinced by Kant, removed financial oversight.

      THE PIVOT:
      *   Article 2 establishes the foundational period of unchecked financial power held by Mayor Kant (dissolving the Finance Committee) which enabled the current alleged political corruption (Article 1).
      *   The lack of a forensic audit (A2) allowed the financial deceit (triangle lawsuit settlement not being a park purchase, A1) and the disregard for public process (late PUD notices, A1) to continue without historical financial scrutiny.

      KEY ENTITIES:
      *   Tim Kant (Mayor)
      *   Fairhope City Council
