      THE CONFLICT:
      *   Judge Michelle Thomason (District Judge) presided over divorce cases in Baldwin County for over a decade, despite state law limiting special court appointments to 180 consecutive days.
      *   Chey Garrigan spent 8 years attempting to gain visitation with her daughter in Thomason's court.
      *   Garrigan was arrested by Fairhope Police (no Miranda rights) during a domestic dispute after being under the representation of attorney Steven Johnson.
      *   The case eventually moved to Judge Jody Bishop's court, where Garrigan was shackled, chained, and handcuffed for 30 days with no appeal bond.
      *   Attorney Austin Burdick filed a federal suit challenging Thomason's decade-long appointment, naming Secretary of State John Merrill.

      THE DISCOVERY:
      *   In 2018, The Ripp Report confirmed over 100 complaints regarding Baldwin County Family Court (BCFC) and Judge Thomasson.
      *   These complaints documented family destruction, financial bankruptcy of clients, and a child suicide attributed to Thomason's decisions.
      *   The 2018 article initiated the compilation of an anonymous list of court "victims."

      THE PIVOT:
      *   The 2018 findings established the systemic pattern of judicial incompetence, favoritism toward "bottom feeding attorneys," and family destruction within BCFC.
      *   The Main Article provides a specific, detailed case (Chey Garrigan) that demonstrates how the historical pattern of corruption (identified in 2018) resulted in extreme judicial overreach, including shackling, chain-cuffing, and voter disenfranchisement.

