  down-home-fairhope-jester:
    refined_source: 6685ef4010fa4aa2a22bee5749994e98b120192711d20ae174b0f8898491150f
    brief: |-
      THE CONFLICT:
      - Councilman Brown received a clubhouse/bathroom contract over $750,000 for the soccer field complex.
      - Councilman Brown was involved in giving away 102 acres of municipal property.
      - Ethics Complaint against Mr. Brown regarding Eastern Shore Art Center (ESAC) was pending since May 2, 2018.
      - Council was found guilty in Federal Court for violating the right of free speech.
      - Council was involved in giving away 105 acres, the Triangle, costing taxpayers $13 million.
      - Council has not approved a City Budget on time for four consecutive years.

      THE DISCOVERY:
      - The "Catalyst" Council (Burrell, Boone, Brown) is proposing a $2.65 million purchase for recreation land without public hearing/participation.
      - This purchase risks draining capital improvement funds and preventing facility needs (e.g., four ballparks).
      - Mayor Wilson stated the November closure of the 113-acre purchase will drain capital improvement funds.
      - Council reduced revenue projections for the 2020 budget, despite higher-than-projected sales tax.
      - Mr. Cory Martin pleaded for council to listen, drawing silence.

      THE PIVOT:
      - Article 2 establishes a pattern of self-enrichment (Brown's contracts, ESAC issue) and procedural misconduct (no public hearing, budget delays, prior land giveaways) by Burrell, Boone, and Brown, making their current $2.65M land purchase suspicious and repeat history, not an isolated budget item.

      KEY ENTITIES:
      - Jack Burrell (Council President)
      - Boone Burrell
      - Brown (Councilman)
      - Councilman Conyers
      - Councilman Robinson
      - Mr. Cory Martin
      - Mayor Wilson
