    brief: |-
      THE CONFLICT: Dispute between Point Clear Properties Association and RSA (Retirement Systems of Alabama) over a 1.27-acre marina lot next to the Grand Hotel; RSA removed gas tanks, stopping fuel pumping to the general public for the first time in 50 years, impacting Eastern Shore tourism.
      THE DISCOVERY: Corporate entities (RSA) prioritize condo development (12-unit project) over maintaining established tourism infrastructure and community access in the TRD zone.
      THE PIVOT: Article 2 establishes a historical pattern of corporate/developer interests overriding local planning (Baldwin County Planning Commission) and negatively impacting tourism/community access, directly supporting the current allegation (Article 1) that the Fairhope City Council is "selling out" the city to developers.
