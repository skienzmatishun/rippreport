  corridor-of-chaos:
    refined_source: e2a3453b894f606c55825260fdd84a52e5a3f2b95e83ee28cb2cc251c3f188bc
    brief: |-
      THE CONFLICT:
      *   Council previously tried to give away 105 acres, The Triangle, resulting in a $13 million loss for taxpayers due to a lost lawsuit.
      *   Fairhope previously purchased soccer fields (113 acres on 13/32) which sat idle for years and later cost over $5 million, draining 5 accounts.

      THE DISCOVERY:
      *   On October 28, 2020, the city council considered final approval for the "KLUMP PUD" (Planned Unit Development) on 76 acres of farmland on the northwest corner of Fairhope Avenue and Hwy 181.
      *   The KLUMP PUD, developed by Gayfer Village Partners, involves 232 multi-family apartment units (R-5), 77 single-family residential lots (R-3), and 16 commercial lots (B-2).
      *   Municipal Judge Haymes Snedeker is the sole member of Gayfer Village Partners, Llc.
      *   Haymes Snedeker's law/business partner, Ray Hix, served on the city's Airport Authority until the previous year.

      THE PIVOT:
      *   Article 2 establishes a direct link between a city official (Municipal Judge Haymes Snedeker) and the major development (KLUMP PUD) contributing to the high density (566 apartments total) and the "Corridor of Chaos" described in Article 1.
      *   This connection provides evidence supporting Article 1's claim that the council is "sold out" to developers and those with "good ole boy connections."

      KEY ENTITIES:
      *   Fairhope City Council
      *   Catalyst Council (Boone Burrell and Brown)
      *   Mayor Wilson
      *   Cory Martin
      *   Municipal Judge Haymes Snedeker
      *   Ray Hix
      *   Gayfer Village Partners, Llc
      *   Tom Mitchell
      *   KLUMP PUD
      *   Fly Creek Apartments
      *   Triangle (105 acres)
      *   K-1 Center
