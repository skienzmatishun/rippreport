  blind-leading-the-blind:
    brief: |-
      THE CONFLICT:
      - Fairhope citizens alleged they were being sold out by developers, the city council, and appointed positions such as the municipal judge.
      - Catalyst Council, Boone Burrell, and Councilman Robert Brown proposed a $2.65 million purchase of recreation land, supported by a questionable appraisal, for recreation land that would not be used for years.
      - Purchase of the soccer fields was described as corrupt from day one; Fairhope drained 5 accounts for the purchase, let it sit idle for years, then blew $5+ million on a substandard complex.
      - Council was preparing to repeat the same reckless process in the middle of the budget process; in four years the Catalyst Council had not approved one budget on time.
      - Council had no public participation related to the recreation land purchase; Cory Martin pleaded for the council to listen to reason; pleas drew dead silence.
      - Mayor Wilson: purchase of 113 acres on 13/32 for future parkland would close in Nov.; would drain all capital improvement funds needed for urgent facility needs and prevent adding four ballparks to fill an immediate capacity need for up to ten years; no thought about re-purposing K-1 Center.
      - Council reduced revenue projections; reworked with actual FY2019 revenue figures with very conservative estimates; sales tax came in higher than projected.
      - Council questioned why City expenses were higher; it was a combination of correcting expenses to appropriate departments, investing in a grossly understaffed PD, and the cost of service in Public Works increasing.
      - Same council voted themselves full family insurance; tried to give away 105 acres, the Triangle, that cost taxpayers $13 million as a result of a lost lawsuit; bought the K-1 Center and has no money to spend on the project; putting capital improvements, infrastructure and sewer problems on the back burner while purchasing raw property that will sit idle for years.

      THE DISCOVERY:
      - Article 2, titled BLIND LEADING THE BLIND, promoted Fairhope Transparency via a Jester; followers did not care about facts, only the Jester spin.
      - The Jester, Boone Burrell, and Burrell called for community engagement in reference to the Greeno Road Overlay District; citizens agreed and the Mayor had already implemented several public meetings; described as DISTRACTION.
      - Same three hypocrites had NO community engagement when they voted themselves full family insurance; had NO community engagement for the $2.6 million recreation land; unanimously said NO to the black community when it came to recreation land; remember that in 2020.
      - The Jester, Burrell, and Boone do not know what Transparency, Accountability, Ethics, or Conflict of interest are; promised to follow through on a complaint against Councilman Robert Brown this week.
      - Councilman Robert Brown and business partner Cliff Pitman were making a mockery of Ethical Conduct; some sneaky self-serving things may not be criminal but lack of Ethics stains Fairhope and the Citizens of the community.
      - Citizens of Fairhope had to stand up to the Jester and his demented view of right and wrong; three Council, Burrell, Boone, and especially Brown, used elected position for personal gain; may not be criminal in some instances but defies all standards of honest Government.
      - This last Monday, September 16, 2019, the author personally delivered a complaint against Councilman Robert Brown to the Alabama Attorney General, White Collar Crime Division, Special Prosecutors; complaint letter was accompanied by a 42-page booklet of supporting and related documents.

      THE PIVOT:
      - Article 2 is older than Article 1 and should be framed as background/historical context.
      - Article 2 delivered the September 16, 2019 complaint against Robert Brown; Article 1 discusses the 2020 budget and $2.65 million recreation land purchase.
      - Article 2 showed Jester/Burrell/Brown hypocrisy: no community engagement for full family insurance and $2.6 million recreation land; called Greeno Road Overlay District community engagement a DISTRACTION.
      - Article 2 is the smoking gun for Article 1 because it connected the same actors — Jester, Boone Burrell, Robert Brown — to ethics complaints, no transparency, no community engagement, and personal gain before or alongside Article 1’s “Fairhope Sold to the Highest Bidder” narrative.
      - Article 2’s complaint and 42-page booklet contextualized Article 1’s allegations against the Catalyst Council, Boone Burrell, and Robert Brown over the recreation land purchase.

