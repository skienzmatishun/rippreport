      THE CONFLICT:
      Council tried to give away 105 acres (mentioned in Main Article) / 106 acres (mentioned in Widget Article) on the Triangle, costing taxpayers 13 million dollars (Main Article). This occurred before the timeline of the Main Article.

      THE DISCOVERY:
      Widget Article revealed the initial controversy involved the potential giving away of 106 acres on one side of town while council was simultaneously looking at buying 40 acres on the other.

      THE PIVOT:
      Widget Article establishes a prior pattern of the Council pushing land deals without public input and prioritizing quick decisions over a comprehensive land use plan, providing context for the later, highly contentious 2.65 million dollar purchase in Article 1.

