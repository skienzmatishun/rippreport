    brief: |-
      THE CONFLICT:
      *   In December 2002, Fairhope Utilities and the City Planning Commission set a standard for wastewater collection in new developments: gravity fed sewer.
      *   A specific Ethics Complaint against Fairhope City councilman Robert Brown, who was also an Eastern Shore Art Center Board member, was filed under case number 2018-42.
      *   At the November 27th Council meeting, a citizen discussed the conflict between the gravity fed standard and the low pressure sewer system used by developers.

      THE DISCOVERY:
      *   Article 2 established that low pressure systems (requiring homeowner grinder pumps) deviate from the City's standard and are often installed because developers avoid paying total system costs, shifting costs to the homeowner.
      *   Article 2 documented historical issues regarding developer practices (e.g., damage from the Publix project) and ethics complaints involving local officials.

      THE PIVOT:
      *   Article 2 provides the historical context that developers (like Catalyst and Kant/Corte) have a history of bypassing city standards and leveraging local political influence (Robert Brown's Ethics Complaint, developer-supported Jester).
      *   This historical pattern of developers threatening lawsuits and ignoring city standards (as documented in Article 2) directly led to the alleged corruption in Article 1, where Council members Boone and Burrell caved to developer threats, approving the Kant-Corte apartments despite risks (Highway 98 intersection claims 7 lives, impacting it with 400-600 additional vehicles).

