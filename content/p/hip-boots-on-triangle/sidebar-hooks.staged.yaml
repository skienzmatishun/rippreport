  happy-belated-new-year-clean-sweep:
    brief: |-
      THE CONFLICT: The Triangle Lawsuit was a long-running "legal fee black hole" costing Fairhope millions of dollars, surviving three city councils leading up to the 2012 election.
      THE DISCOVERY: In 2012, Mayor Tim Kant held total control over planning and zoning, making the lawsuit's survival a direct function of his administration.
      THE PIVOT: Article 2 establishes the chronic, multi-year nature of the financial drain (millions of dollars over years) caused by the Triangle Lawsuit, providing context that the current settlement (Article 1) is part of a sustained pattern of costly governance, not an isolated incident.
      KEY ENTITIES: Tim Kant, Dyas Triangle, Hand Arendall law firm, Alabama Municipal Insurance Corporation (AMIC), Mike Ford, Trip Pittman, Jonathan Smith, Fairhope
