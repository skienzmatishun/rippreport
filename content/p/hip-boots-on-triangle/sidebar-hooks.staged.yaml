  conflict-of-interest-summit:
    brief: |-
      THE CONFLICT:
      *   Tucker Dorsey (Jasper T Dorsey), County Commissioner, holds durable limited power of attorney over Summit Construction Company, Inc., and is President of Summit Construction.
      *   Trip Pittman, State Representative, was awarded approximately 6 lucrative municipal contracts, including construction contracts for sidewalks/bathrooms on the pier.
      *   Summit Construction was the lone bidder ($2M initial bid, later requiring $5M) for the proposed Fairhope soccer fields project.

      THE DISCOVERY:
      *   Fairhope City Council and Mayor claimed no conflict of interest regarding contracts awarded to Summit Construction and Senator Pittman.
      *   The evidence showed a direct conflict of interest where a County Commissioner was advancing his self-interest through Summit Construction.

      THE PIVOT:
      *   The historical evidence of political self-dealing (Dorsey/Pittman/Summit) establishes a pattern of systemic corruption and lack of public trust in Fairhope politics.
      *   This pattern provides the necessary context for the critique in the Main Article, questioning Mayor Kant’s claims about the Dyas Triangle settlement ($8.75M settlement plus $3.2M fees, totaling over $12M), suggesting that all political actions are driven by corruption, not taxpayer benefit.

      KEY ENTITIES:
      *   Mayor Kant
      *   Dyas Triangle
      *   Alabama Municipal Insurance Corporation (AMIC)
      *   Hand Arendall
      *   Tucker Dorsey (Jasper T Dorsey)
      *   Trip Pittman
      *   Summit Construction
      *   Fairhope City Council
    llm_text: County Commissioner Tucker Dorsey controlled Summit Construction while State Rep Trip Pittman secured six lucrative Fairhope municipal contracts. This pattern of self-dealing proves systemic corruption, forcing us to question Mayor Kant’s claims about the $12M Dyas Triangle settlement.
