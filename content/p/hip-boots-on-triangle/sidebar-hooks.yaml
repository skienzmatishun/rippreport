  fairhopes-triangle-mega-site:
    brief: 'THE CONFLICT:

      *   Lawsuits regarding the Dyas Triangle property spanned many years.

      *   Mayor Kant presided over these lawsuits, supported by legal counsel (Hand
      Arendall).

      *   The property acquisition/settlement was contentious, with allegations of
      mismanagement and obscured costs.


      THE DISCOVERY:

      *   The property purchase was a "settlement" of a lawsuit against the City of
      Fairhope''s former insurer, AMIC.

      *   The true total cost exceeded 11.25 million dollars (including a 3 million
      dollar legal fee portion).

      *   The purchase benefits included tax incentives for the sellers, skewing its
      perceived value (estimated modern value: 16 to 20 million dollars).

      *   Council members Burrell and Boone, along with Mayor Kant, allegedly misled
      the public regarding the nature of the transaction (claiming it was a voluntary
      park purchase).


      THE PIVOT:

      *   Article 1 presents the narrative of a costly settlement (8.75M + fees) and
      calls out spin.

      *   Article 2 provides specific financial substantiation (11.25M cost, 3M attorney
      fees) and alleges the official narrative ("Park," "voluntary purchase") is a
      deliberate lie orchestrated by Kant, Burrell, and Boone.


      KEY ENTITIES:

      *   Mayor Kant

      *   Councilman Burrell

      *   Boone (Council members involved)

      *   Dyas Triangle

      *   AMIC (Former Insurer)

      *   Hand Arendall (Law Firm)'
    generated_at: '2026-08-03T01:28:04.415568Z'
    text: Fairhope leaders told you they bought the Dyas Triangle property to give
      the community a nice city park. Internal records reveal former Mayor Kant, Burrell,
      and Boone fabricated that story to hide over eleven million dollars in taxpayer
      money squandered on legal bills.
