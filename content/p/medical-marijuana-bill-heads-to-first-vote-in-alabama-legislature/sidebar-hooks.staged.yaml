    brief: "THE CONFLICT: \n- In 2006, then-Governor Bob Riley turned down a deal from the United Arab Emirates regarding the container terminal at the Port of Mobile, amid post-9/11 national security concerns and a failed massive state tax plan.\n- Around the same time, Bob Riley passed a bill allocating $80 million to the Port of Mobile as part of a $300 million investment to move and upgrade the container terminal further south to Choctaw Point near Brookley.\n- In Florida, \"Project Pelican\" involved a secret 35-year lease of Port Canaveral to the UAE, brokered behind closed doors.\n- In Delaware, the Port of Wilmington was leased to the UAE state-owned company Gulftainer for 50 years.\n\nTHE DISCOVERY: \n- The background context reveals a multi-decade effort by Alabama leadership—transitioning from Bob Riley to Governor Kay Ivey—to funnel hundreds of millions in public funds (including $300M+ in state investments, BP, and GOMESA funds) into modernizing the Port of Mobile and deepening the Mobile Ship Channel.\n- The 2019 push by Governor Kay Ivey to pass a 10-cent-per-gallon gas tax in the legislature (bypassing a public vote) and prioritize widening the ship channel and building a $2.1 billion I-10 Bayway/Bridge project using anonymous Public-Private Partnerships (P3s) instead of federal funding.\n- The appointment of Richard Clark as the Deputy Director of the Alabama Port Authority, a figure directly connected to Gulftainer.\n- State actions—such as opposing Amtrak service to Mobile and relocating airport assets to Brookley—align with facilitating heavy industrial container traffic rather than local public convenience.\n\nTHE PIVOT: \n- The background context acts as the \"smoking gun\" by connecting historical dots: the 2006 UAE port deal was not truly rejected, but merely shelved. \n- The $2.1 billion P3-funded I-10 bridge project, the gas tax, the secretive bypassing of federal funds (noted by Bradley Byrne), and the restructuring of Mobile's infrastructure mirror the exact playbook used in Florida's Project Pelican and Delaware's Port of Wilmington. \n- It exposes the toll bridge and gas tax not as routine infrastructure funding, but as mechanisms to mask anonymous foreign control—specifically by Dubai's royal family and Gulftainer/Crescent Enterprises—over a critical U.S. seaport.\n\nKEY ENTITIES: \n- Bob Riley\n- Kay Ivey\n- Bradley Byrne\n- Richard Clark\n- Gulftainer\n- Crescent Enterprises\n- United Arab Emirates (UAE)\n- Port of Mobile\n- Port Canaveral\n- Port of Wilmington"
