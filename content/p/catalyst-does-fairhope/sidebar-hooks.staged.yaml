  people-power-2:
    brief: |-
      THE CONFLICT: Jim Nix served 7 terms as Mayor before being forced out due to criminal charges; Tim Kant took over and carried on corrupt ways, both sharing credit for the failing sewer system.
      THE DISCOVERY: A 2276-signature petition convinced Fairhope to back off the Tuberville subdivision, highlighting serious sewer infrastructure problems, including a 13 million dollar plant failing to process 500,000 gallons of raw sewage into Big Head gully and the Fly Creek watershed.
      THE PIVOT: The historical pattern of council obstruction (under Wilson and prior) and the failure to address fundamental sewer infrastructure issues provided the environment that allowed Mayor Kant and developer Angelo Corte to use taxpayer money to build specific infrastructure (Fire Station, sewer lift station) on Corte property to service the Fly Creek Apartments, bypassing community need for systemic fixes.
      KEY ENTITIES: Tim Kant, Angelo Corte, Catalyst, Fly Creek Apartments, Fairhope, Highway 98, Parker Road, Mayor Wilson, Councilman Robinson, Jim Nix, Councilmen Burrell, Councilman Boone, Sherry Sullivan, Publix.
    llm_text: Tim Kant and Angelo Corte used taxpayer money to build private infrastructure while the $13 million sewer plant fails. This system dumps 500,000 gallons of raw sewage into Fly Creek, risking Fairhope’s environment.
