hooks:
  catalyst-birds-of-the-same-feather:
    brief: |-
      THE CONFLICT:
      *   Former Fairhope Mayor Tim Kant supported developer Angelo Corte and the Fly Creek Apartments project despite overwhelming public outcry.
      *   City Councilmen Burrell and Boone voted to accept a land "Gift"—wetlands receiving water drainage from the Publix property—from Angelo Corte to the City of Fairhope.
      *   Taxpayers paid for infrastructure (Fire Station on Corte property; sewer lift station) benefiting the developer.
      *   Kant left Fairhope with failing infrastructure requiring millions to repair.

      THE DISCOVERY:
      *   Catalyst is a political machine in Baldwin County, founded by Stacy Elliott and Haygood, designed to place "good ole boys" (developers/lobbyists) in positions of power (Probate Judge, State Senate, County Commission).
      *   Catalyst uses intimidation tactics against non-aligned candidates.
      *   Catalyst supported the Fly Creek Apartments project, confirming Kant supported the developer over the community and environment.

      THE PIVOT:
      *   Article 2 establishes Catalyst as the systemic political mechanism that enabled Kant's decisions, showing the Fly Creek project was not an isolated mistake but part of a calculated agenda favoring developers and lobbyists over public welfare.
      *   Article 2 provides the motive (control of Baldwin County/power yield) behind the infrastructure decisions detailed in Article 1 (taxpayer liability for drainage).

      KEY ENTITIES:
      *   Tim Kant (Former Mayor, Fairhope)
      *   Angelo Corte (Developer)
      *   Catalyst (Political group)
      *   Chris Elliott (County Commissioner, Catalyst founder)
      *   Haygood (Former Mayor of Daphne, Catalyst founder)
      *   Scott Boone (Head of Catalyst; Kevin Boone's son)
      *   Councilmen Burrell and Boone (City Council members)
      *   Joe Davis (District two candidate supported by Catalyst/Kant)
      *   Fly Creek Apartments
      *   Fly Creek (Drainage ditch)
      *   Fairhope
      *   Highway 98 / Parker Road
      *   Publix
      *   Sandy Ford
      *   Rock Creek
      *   The Woodlands
      *   The Pines
    llm_text: Former Fairhope Mayor Tim Kant backed developer Angelo Corte's Fly Creek Apartments despite public outcry. Learn how the Catalyst political machine, founded by Chris Elliott and Haygood, orchestrated this deal against taxpayers.
