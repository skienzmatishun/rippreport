  fairhopes-triangle-mega-site:
    brief: |-
      THE CONFLICT: Former Mayor Tim Kant, Councilmen Burrell and Boone, and developer Angelo Corte oversaw major, non-transparent city decisions involving the Triangle mega-site and Fly Creek development.
      THE DISCOVERY: The Triangle property was purchased by the City of Fairhope to settle a lawsuit, costing $11.25 million plus $3 million in legal fees, not as a voluntary park purchase, and was finalized without public participation.
      THE PIVOT: Article 2 demonstrates a historical pattern (6 years prior) of Kant, Burrell, and Boone prioritizing developer/political interests over public input and taxpayer welfare (e.g., hidden lawsuit costs), providing context for the current situation where taxpayers are funding developer infrastructure (Fire Station, sewer lift station) and accepting environmental liability (wetland "Gift" from Corte) for the Fly Creek apartment project (Article 1).
      KEY ENTITIES: Tim Kant, Angelo Corte, Councilman Burrell, Councilman Boone, Fly Creek Apartments, Publix, Triangle property, Highway 98, Sandy Ford, Rock Creek, Catalyst.
    llm_text: Mayor Tim Kant and Councilmen Burrell/Boone oversaw the $11.25 million purchase of the Triangle mega-site, not a park. Taxpayers now fund Fly Creek Apartments infrastructure and accept Angelo Corte's wetland liability.
