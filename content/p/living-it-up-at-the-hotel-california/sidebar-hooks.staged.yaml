      *   Article 1 shows Kant's final actions (skipping the planning/zoning meeting for a California vanity award) as a continuation of this pattern—prioritizing personal gain/legacy over civic duty right before his 16-year term ends.
      *   Article 2 provides the historical context for why the 4-2 vote on the Fly Creek project (mentioned in Article 1) was a continuation of a known, corrupt plan.

