  demand-the-truth:
    brief: |-
      THE CONFLICT: Senator Pittman maintained debris removal contracts with Fairhope since 2004, tied to an FBI investigation into BP fraud involving Senator Pittman and the Mayor of Fairhope. This led to a complaint to the Alabama Ethics Commission regarding conflicts of interest.
      THE DISCOVERY: The 2016 complaint revealed the Mayor and Senator misled the public and Fairhope City Council, falsely claiming the Ethics Commission had exonerated them or granted permission for contract approval.
      THE PIVOT: Article 2 establishes a historical pattern (since 2004) of systemic ethical misconduct, misuse of public office (millions in FEMA-funded contracts), and misrepresentation of regulatory bodies by the Mayor's office, providing context for Mayor Kant's recent ethical lapse (skipping a Monday planning and zoning meeting for a vanity award in Southern California) that allowed the controversial Fly Creek Apartment deal to pass.
      KEY ENTITIES: Tim Kant (Mayor, 16 years service), Karin Wilson (incoming Mayor), Jennifer Fidler (Public Works Director), Sherry Sullivan, Senator Pittman, Bob James, Commissioner Fogarty, Councilman Boone, Francis P. Ripp, Alabama Ethics Commission, Matt Hart (Special Prosecutor), Fly Creek Apartment deal, Arroyo Grande.
    llm_text: Mayor Tim Kant's recent lapse on the Fly Creek Apartment deal isn't isolated. Since 2004, Senator Pittman and the Mayor's office engaged in systemic ethical misconduct, misrepresenting the Alabama Ethics Commission.
