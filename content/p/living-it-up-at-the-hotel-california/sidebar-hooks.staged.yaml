      *   Fly Creek Apartments development was a contentious issue, linked to a "village" concept promoted by Kant and developers.
      *   Mayor Kant faced multiple instances of political intimidation (e.g., City Council/Planning Board denying public participation, metal detectors at City Hall).
      *   Soccer complex was built for millions without adequate infrastructure; land acquisition cost close to $1 million, leveling cost $1.5 million.

      THE DISCOVERY:
      *   Mayor Kant's governance is characterized by a "hand-me-down government" and "good ole boy" system, managed by figures like former Mayor Jim Nix.
      *   Over 50% of Mayor Kant's $50,000+ election donations came from outside Fairhope donors and unidentified PACs.
      *   Kant's actions (e.g., voting on Fly Creek, leveraging power) are intended to maintain his political control and the status quo against citizen wishes.

      THE PIVOT:
