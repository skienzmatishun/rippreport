  going-down-with-the-ship:
    brief: |-
      THE CONFLICT:
      *   Fly Creek Apartment deal was a controversial, high-density project in Fairhope.
      *   Mayor Kant (Tim Kant) served 16 years (with 30 days remaining in office when the Main Article was written).
      *   The city of Fairhope lost a Supreme Court case involving Planning and Zoning, costing hundreds of thousands of taxpayer dollars, with attorneys Hand Arendall winning.
      *   The Gulf Quest Maritime museum cost $42 million (28 million taxpayer-funded) and has accrued over $400,000 in past due utility bills.

      THE DISCOVERY:
      *   The Gulf Quest museum's Board of Directors operated with an attitude of "build it and let's worry later."
      *   Councilwoman Diana Brewer, initially a proponent of the Fly Creek Apartments, was hired as the museum's marketing/PR director.
      *   Mr. Angus Cooper, a museum Board member and supporter of Kant, used influence (e.g., talked Kant out of a $35,000 practice fee) and donated $2500 to Diana Brewer's re-election bid.
      *   The 6th meeting concerning Fly Creek Apartments was scheduled for October 3rd, with 98% of over 250 attendees opposed.

      THE PIVOT:
      *   Article 2 establishes that the Fly Creek Apartments were highly contentious, faced massive public opposition (98%), and were tied to questionable financial dealings (Gulf Quest) and political favors (Cooper/Brewer/Kant).
      *   Article 1 confirms Mayor Kant and Public Works Director Jennifer Fidler skipped the 6th meeting in Southern California for an America in Bloom vanity award, allowing the controversial high-density project to be sealed by a 4-2 vote in Fairhope.
      *   Article 2 provides the background showing that the political environment surrounding Fly Creek was already "sticky" and highly contested, making Kant and Fidler's absence a deliberate political maneuver rather than an isolated lapse.

      KEY ENTITIES:
      *   Tim Kant (Mayor)
      *   Jennifer Fidler (Public Works Director)
      *   Karin Wilson (Next Mayor)
      *   Sherry Sullivan
      *   Diana Brewer (Councilwoman)
      *   Angelo Corte (Mississippi developer, Fly Creek supporter)
      *   Angus Cooper (Gulf Quest Board Member)
      *   Hand Arendall (Attorneys)
      *   Fly Creek (Apartment project)
      *   Gulf Quest Maritime museum
      *   Fairhope Planning Commission
      *   Boone (Councilman)
    llm_text: Tim Kant and Jennifer Fidler skipped the 98% opposed Fly Creek meeting for a vanity award. How did Angus Cooper use his Gulf Quest influence to back Councilwoman Diana Brewer and seal this controversial Fairhope deal?
