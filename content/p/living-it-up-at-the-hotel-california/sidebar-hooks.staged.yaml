    brief: |-
      THE CONFLICT: Pittman Kant was involved in investigations concerning BP Grant fraud; County Commissioners Tucker Dorsey and Elliot fired whistleblowers (EMA Director, county manager, attorneys) following his election; a 30 million+ dollar mega-site deal benefited connected landowners.
      THE DISCOVERY: Mayor Kant served 16 years and is departing in 30 days; he skipped a Fairhope Planning and Zoning meeting in Fairhope with Jennifer Fidler to attend an "America in Bloom" vanity award event in Southern California (Arroyo Grande).
      THE PIVOT: The recent Fly Creek Apartment deal approval (4-2 vote) occurred while Mayor Kant and Public Works Director Jennifer Fidler were absent for a vanity trip, illustrating a pattern of questionable governance and prioritizing developer interests over civic duty, consistent with the corruption and "good ole boys" narrative established in the earlier context.
