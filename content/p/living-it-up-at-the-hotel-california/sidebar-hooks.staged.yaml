  showing-your-true-colors:
    brief: |-
      THE CONFLICT: Mayor Kant lost his re-election bid; transition to new administration was set for Nov. 7, 2016.
      THE DISCOVERY: In September 2016, Mayor Kant attempted to use the Planning and Zoning board to push through developer projects including the Retreat at Fairhope Village (240 units) by Dewberry / Preble-Rish, LLC, located at Fly Creek Avenue.
      THE PIVOT: Article 2 established Kant's pattern of using his final days to push developer interests (e.g., Fly Creek Apartments and court action for Angelo Corte in 2016). Article 1 shows this pattern repeating recently, where Kant and Director Jennifer Fidler skipped the planning and zoning meeting while in California, yet the controversial Fly Creek Apartment deal was subsequently approved by the commission (4-2 vote), relying on their crucial votes.
      KEY ENTITIES: Tim Kant, Jennifer Fidler (Public Works Director), Karin Wilson, Sherry Sullivan, Mayor Kant (16 years of service), Francis P. Ripp, Fly Creek Avenue, Preble-Rish, LLC, Dewberry, Angelo Corte, Commissioner Fogarty, Arroyo Grande, Fairhope Planning Commission.
    llm_text: Mayor Kant pushed massive developer projects, including the 240-unit Retreat at Fairhope Village, just before his Nov. 2016 exit. Even while in California, Kant and Director Jennifer Fidler helped the Planning Commission approve the controversial Fly Creek Apartment deal.
