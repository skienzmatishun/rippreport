      THE CONFLICT: In 2009, volunteer firemen questioned the safety of the proposed Fairhope Fire station location at Parker Road/High Ridge Road. In 2015 (Jan 8), Dale Liesch’s proposed Fairhope townhome development was shelved.
      THE DISCOVERY: The fire station location violates the City of Fairhope's Comprehensive Plan (Page 48 5.4); the property owner violated zoning conditions (e.g., Publix construction, estimated $950,000 damage); the Mayor of Fairhope is accused of protecting the land owner ("good ole boy deal") and citizens were excluded from public participation.
      THE PIVOT: Article 2 establishes a documented pattern of municipal corruption and disregard for public planning/taxpayer interests within Fairhope, providing historical context to the current allegations of legal system abuse and unethical conduct against Judge Thomason, Part-Time Judge Bracken, and Steven Johnson in Baldwin County.
      KEY ENTITIES: Judge Thomason, Part-Time Judge Bracken, Steven Johnson, Dale Liesch, Mayor of Fairhope, Baldwin County, City of Fairhope, Parker Road, High Ridge Road, Alabama Ethics Commission, Alabama Bar Association, Robertsdale Mayor, Orange Beach Mayor.
