  portables-and-prisons:
    brief: |-
      THE CONFLICT:
      *   Since 2013, PCI pumped $4.5 million in campaign contributions into Alabama politics.
      *   Alabama's lottery was used to pay off debt from the general fund as far back as 2013, with no funds allocated for education.
      *   Senator Elliott received $27,000 from PCI to get elected, repeatedly betraying promises to Baldwin County.

      THE DISCOVERY:
      *   Article 2 established Alabama as highly susceptible to political corruption driven by lobbyists and the Business Council of Alabama.
      *   Article 2 revealed that the state's priority is prisons and debt repayment, not education.

      THE PIVOT:
      *   Article 2 provides the historical context of systemic, politically motivated financial decisions in Alabama (prioritizing special interests over public good).
      *   Article 1 shows this system manifesting locally in Fairhope, where the Council opposed Mayor Karin Wilson's no-tax education plan, favoring a self-imposed $3 million tax.
      *   The Council's support for the Apartments at Fly Creek is presented as a local example of a "good ole boy deal," consistent with the special interest influence detailed in Article 2.

