  one-woman:
    brief: |-
      THE CONFLICT:
      *   Paula DiNardi endured victimization by Ronan McSharry in Fairhope Municipal Court.
      *   Ronan McSharry was found guilty of public intoxication and assault.
      *   McSharry was sentenced to 180 days in jail.
      *   The incident and subsequent legal proceedings were politicized as a witch hunt against Mayor Karin Wilson leading into 2020.

      THE DISCOVERY:
      *   The legal defense (John Beck) attempted to politicize the assault case and questioned the Mayor's alleged involvement.
      *   DiNardi incurred over $6000.00 in medical damages.
      *   Jack Burrell, as Council President, allegedly secured the jobs of City Attorney Marcus McDowell and the Municipal Judge.

      THE PIVOT:
      *   The politicization of the DiNardi/McSharry case (Article 2) provides the political ammunition for the Catalyst Council to torpedo Mayor Wilson’s administrative goals (Article 1).
      *   Mayor Wilson called a special meeting on MAY 10th to propose combining the Treasurer role with the Finance Director to improve efficiency, following a successful turnaround from a ~$6M deficit (projected debt-free by June 2019).
      *   The Council opposes Mayor Wilson's proposals, including the Apartments at Fly Creek, and favors a self-imposed $3M tax over the Mayor's no-tax education plan.

