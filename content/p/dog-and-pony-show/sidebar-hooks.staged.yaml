  dirty-hands:
    brief: |-
      THE CONFLICT:
      - March 2017: Fairhope Catalyst Council welcomed 3 highly qualified people to new administration; Council not happy with Mayor’s choices; set out to oppose, obstruct, not support.
      - Sherry-Lea Bloodworth Botop: hired early 2017 as Economic and Community Development Director; Council moved to de-fund her position; she resigned; Mayor Karin Wilson announced April 28 at 5:00 PM her transition to Deputy Director of Mobile Bay National Estuary Program (MBNEP); Council dirty hands in her resigning; Fairhope loser in her departure.
      - Wayne Dyess: Fairhope planning director resigned; Council President Burrell praised him but did not try to save him; Council hands dirty.
      - Richard Peterson: Operations Director; target on his back; Council would force him out before 2020 elections.

      THE DISCOVERY:
      - Baldwin County cannot be beat re: dirty hands; new State Senator “TAX MAN” Elliott; lottery and taxes he supports does nothing for education; “Education” Lottery dissolved into lottery to pay past state debts as far back as 2013.
      - Fairhope proud in March 2017 to welcome 3 highly qualified people to new administration; Catalyst Council not happy with Mayor’s choices; set out to oppose, obstruct, not support.
      - Council set sights on female of the three, Sherry-Lea Bloodworth Botop; Council reputation for bullying women; moved to de-fund her position; Fairhope loser in her departure; Council dirty hands in her resigning.
      - Mayor Karin Wilson, April 28 at 5:00 PM: City proud to support Sherry-Lea’s transition to Deputy Director of MBNEP; Sherry-Lea started in early 2017; commitment to building resilient community using philanthropic leadership; in MBNEP position, work on implementation of restoration and protection efforts in Comprehensive Conservation and Management Plan; quote from Bloodworth Botop about Fly Creek, Mobile Bay, economic/environmental prosperity; Mayor looked forward to working with Sherry-Lea in partnership with MBNEP.
      - Council had dirty hands with approval of Fly Creek Apartments and traffic congestion at Highway 98 and Parker Road.
      - Did Council try to save either position (Wayne Dyess, Sherry-Lea)? Did council try and talk Wayne and Sherry-Lea into staying? Hell No! Council’s hands dirty.
      - Council President Burrell: Dyess was great employee, provided great input, instrumental in implementing several new ordinances which will help city in long run. If Burrell felt so passionate, why not try his damnedest to get him stay? Fairhope loses, Council hands dirty.
      - One man standing from the three, Operations Director Richard Peterson. Mr Peterson now has a target on his back. Catalyst Council would love to dirty their hands one more time before 2020 elections, by forcing Peterson out. Fairhope again will be the loser and Catalyst the winner.
      - Chuckee Cheeze: former editor, takes dictation from dirty hands of Baldwin County; known for biased fictional articles that are political hit pieces; coverage of Fairhope made flowers wilt; Dirty Hands Chuckee now going to political heaven; easiest job in journalism, print what he is told, dirty hands qualify him; Chuckee now Baldwin County Legislative Delegation Constituent Services Director, requires DIRTY HANDS.

      THE PIVOT:
      - Article 2 (Dirty Hands) is older than Article 1 (Dog and Pony Show); frame it as background/historical context.
      - Article 2 documented Council dirty hands and staff departures (Botop, Dyess, Peterson) leading into 2018-2019.
      - Article 1 references Mayor’s statement about debt-free in June 2019, Mayor’s education plan immediate/no taxes, Council plan self-imposed 3 mil tax.
      - Article 2 is smoking gun/key context for Article 1 because it established pattern of Council opposition/obstruction prior to Mayor’s special meeting (May 10, 3:30pm) to discuss Treasurer structure; Council history of special/emergency meetings used to torpedo Mayor’s suggestions and implementing Council’s goals for 2020.
      - Mayor’s May 10 special meeting: “No one knows the council’s intent, no one is expect to, so today’s meeting will be news to everyone”; “Ask yourself what is such an emergency that it cannot be dealt with at a scheduled council meeting?”

