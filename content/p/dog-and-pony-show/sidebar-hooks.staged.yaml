    brief: |-
      THE CONFLICT:
      *   April 3rd: 100 people attended a round table discussion regarding the K-1 Center in Fairhope.
      *   October 2018: City of Fairhope consolidated roles into one department, separating duties and moving away from a ~$6M deficit.
      *   June 2019: Mayor Karin Wilson projected the City of Fairhope would be debt-free.
      *   May 10th: Mayor Karin Wilson called a special meeting (3:30pm) to propose combining the Treasurer role with the Finance Director role.

      THE DISCOVERY:
      *   The Fairhope City Council operates based on three votes, potentially ignoring constituents' input.
      *   The Council was presented with public input from 100 voices on the K-1 Center (April 3rd).

      THE PIVOT:
      *   The April 3rd public input (100 voices) demonstrates the Council's pattern of prioritizing its small, closed decision-making (3 votes) over constituent engagement, validating the Main Article's critique of the Council's lack of transparency and accountability during the May 10th special meeting.

