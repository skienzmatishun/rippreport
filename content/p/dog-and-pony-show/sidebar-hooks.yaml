    text: Mayor Karin Wilson proposed modern financial reforms to save Fairhope millions, but the corrupt machine refused to cooperate. The hostile City Council blocked the budget for three months while wasting taxpayer dollars to defend fired political cronies in court.
  dog-and-pony-show-2:
    brief: |-
      THE CONFLICT
      *   Mayor Karin Wilson proposed restructuring the Finance Department and Treasurer role on May 10th.
      *   The Catalyst Council opposed the Mayor’s plan for Fly Creek Apartments.
      *   The Council favored a $3 million tax instead of the Mayor's education plan.

      THE DISCOVERY
      *   Jack Burrell and Kevin Boone approved the Fly Creek Apartments and accepted a "gift" from the developer.
      *   The utility fund was raided as a slush fund, costing $3 million for the Triangle lawsuit.
      *   Jack Burrell and Kevin Boone allegedly misrepresented an $11.25 million legal settlement as a purchase for a park.

      THE PIVOT
      *   Article 1 focuses on bureaucratic restructuring (Treasurer role). Article 2 reveals that key Council members (Burrell, Boone) are tied to specific corrupt actions (Apartments approval, misuse of funds, fraudulent settlements), suggesting the structural issues mentioned in Article 1 are symptomatic of ongoing mismanagement and corruption perpetuated by leadership figures like Jack.

