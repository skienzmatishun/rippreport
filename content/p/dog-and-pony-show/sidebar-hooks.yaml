  do-your-job-pass-the-budget:
    brief: |-
      THE CONFLICT:
      *   Mayor Karin Wilson proposed restructuring the Finance Department to combine Treasurer and Finance Director roles, intending to create a Manager/Supervisor of Treasury and Revenue.
      *   The Finance Director helped turn the City around from a ~$6M deficit, aiming for debt-free status by June 2019.
      *   The Mayor opposed the Apartments at Fly Creek project.

      THE DISCOVERY:
      *   The City Council has obstructed the city budget approval for three months.
      *   Council members have been absent and have failed to approve the budget despite the Mayor's efforts to negotiate.
      *   The Council is actively protecting fired employees through litigation against the city, setting a precedent that uses taxpayer dollars.

      THE PIVOT:
      *   Article 2 proves that the current City Council's behavior (obstruction of budget, favoring fired employees) demonstrates a hostile intent toward the structural and financial efficiencies proposed by Mayor Wilson in Article 1.
      *   The resistance to the budget is evidenced by the Council’s ultra-conservative view ignoring progressive financial ideas, directly contradicting the efficiency and accountability framework the Mayor advocated for.

      KEY ENTITIES:
      *   Karin Wilson (Mayor)
      *   Catalyst Council
      *   Finance Department
      *   City of Fairhope
      *   Burrell (Council President)
      *   Fairhope Airport
      *   Apartments at Fly Creek
