  catalyst-central:
    brief: |-
      THE CONFLICT:
      - Lynn Stacy operated as a major power broker in Fairhope politics with a claimed 100% success rate.
      - Lynn Stacy partnered with Chris Elliott and Dane Haygood to form the political firm Stacy, Haygood, and Elliott.
      - Dane Haygood became the Mayor of Daphne and Chris Elliott became a Mobile/Baldwin County Commissioner; the firm dissolved its name but continued its political concepts, eventually evolving into the political group CATALYST based in Fairhope.
      - CATALYST backed candidates who invaded the Baldwin County midterm elections of 2018, attempting to drive the Fairhope mayor out of office before 2020.
      - CATALYST candidates on the county level, including County Commissioner Joe Davis and Jeb Ball, voted in favor of developers regarding projects like the 392-house Savannah Estates development on Highway 54 East and Highway 64, ignoring citizen opposition and letters from resident William Rando.

      THE DISCOVERY:
      - CATALYST functions as an entrenched "good ole boys" network in Baldwin County aimed at total political power, self-dealing, and developer interests, with no regard for infrastructure or citizen opposition.
      - CATALYST successfully embedded representatives across local government, including the Fairhope City Council (such as Councilman Kevin Boone, whose son Scott Boone managed CATALYST), the District Attorney's office, the Sheriff's office, the Baldwin County Judiciary, and the County Commission (Joe Davis and Jeb Ball).
      - The organization actively obstructs local government reform, opposed a city manager and government changes, and successfully maintained Baldwin County's status as the only county in Alabama without sewer regulations to benefit developers.

      THE PIVOT:
      - Article 2 (CATALYST CENTRAL) establishes the historical groundwork, proving that CATALYST is not a transient political movement but the direct corporate/political successor to Lynn Stacy, Chris Elliott, and Dane Haygood's developer-backed power brokerage.
      - It acts as the smoking gun for Article 1 (RUNOFF) by exposing the hidden local infrastructure—from embedded judges and commissioners (Davis and Ball) to developer alliances—that enables CATALYST to transition from local municipal obstruction in Fairhope to backing Bill Hightower in the First Congressional District race against Jerry Carl.

      KEY ENTITIES:
      - Lynn Stacy
      - Chris Elliott
      - Dane Haygood
      - Scott Boone
      - Kevin Boone
      - Bill Hightower
      - Jerry Carl
      - Joe Davis
      - Jeb Ball
      - William Rando
      - CATALYST (Baldwin County Citizens for Government Accountability / CGA)
      - Fairhope
      - Baldwin County
