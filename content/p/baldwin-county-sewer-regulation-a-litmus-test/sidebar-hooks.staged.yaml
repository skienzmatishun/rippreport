  in-the-same-boat:
    brief: |-
      THE CONFLICT:
      - Baldwin County consumer issue: $6.00 toll defeated by poll.
      - Baldwin County poll numbers rose until reaching a figure that terrified every elected official in Baldwin County.
      - Petition reached 50,000 mark; elected officials hit their knees.
      - Baldwin County now had a “NEW” consumer issue: sewer regulation.
      - Mr. Richard Dayton of GlenLakes subdivision in Foley was leading the charge.
      - Dayton quote: BCSS rates for sewage in Baldwin County were totally unregulated; if tomorrow BCSS charged $154.50 per month, there would be nothing they could do and sewage would be turned off if they didn’t pay; Dayton called BCSS a monopoly.
      - 19,000 homes in Baldwin County were serviced by Baldwin County Sewer System (BCSS).
      - BCSS was privately owned monopoly with ability to charge any amount; no limit to price for sewage service; if not pay, sewage turned off by BCSS without regard to family health.
      - Unregulated sewage fees allowed BCSS to victimize customers; challenge through elected officials.
      - Elected officials in Shelby County began fight to overturn unregulated sewage fees with legislation aimed at protecting customers by regulating prices.
      - Petition was driving force in convincing County Commission and elected officials time had come for regulations; petition was litmus test for next County Commission election.
      - Baldwin County was fastest growing County in Alabama; unregulated sewer system was consumer time bomb.

      THE DISCOVERY:
      - Article 2 revealed Fairhope had major infrastructure and sewer problems long before Fairhope Mayor Wilson even thought about running for office.
      - Baykeeper was contacted time and time again through the years about various issues; caller said she called.
      - Baykeeper never did anything about Publix project, flooding of Fly Creek by developer, or filling of creek with development site mud and sand.
      - Fly Creek Apartments to be built along Fly Creek; hundreds opposed project; Baykeeper did NOT answer the phone.
      - Private citizens sued the City over some issues while Baykeeper’s phone was off the hook.
      - Mayor Can’t and Baykeepers did nothing but use air and talk “crap”.
      - Director of Baykeeper Casi Callaway was in damage control for grabbing headlines and NOT using the phone.
      - Casi Callaway said she sent everyone a letter; caller said she was hurt not to have received copy, but not surprised, and did not answer phone either.
      - After releasing a very negative media report about Fairhope and receiving blowback, Casi Callaway decided she must address Fairhope City Council and dig her hole deeper.
      - Normal procedure was Public Participation at beginning of council meeting, for 3 minutes, on agenda items only; public participation at end afforded citizens 3 minutes to discuss non agenda items.
      - Casi Callaway did not contact Mayor; she contacted Council President Burrell. They kept agenda appearance secret from Mayor.
      - Mr. Burrell allowed Casi Callaway to speak in first Public Participation under an agenda item she never addressed.
      - Casi Callaway spoke well over the three minute rule and Burrell remained silent.
      - Jack and Casi Callaway knew time allocated and agenda procedure was politically motivated to blind side the Mayor.
      - Mayor produced a Timeline dating back to 2016 outlining Mayor and staff’s due diligence.
      - Where was Council’s Timeline? Where was Baykeeper’s timeline?
      - Fairhope Council President Jack Burrell had been Council President for seven years.
      - Burrell refused to yield power to other Council members while he used position and agenda for political purposes and bullying tactics.
      - Council President Burrell now had dubious honor of being found guilty in Federal court for violating Constitutional rights of an American Citizen and veteran.
      - That case was now being used as precedent case involving same constitutional rights being violated by other Council Presidents in the United States.
      - Let’s not forget about Police Report Councilman Burrell had yet to explain.
      - Casi and Jack appeared to be in the same political boat and at the same council meeting; Debbie Quinn and Sherry Sullivan, past political shipwreck survivors, were floating and yelling that they wanted in the same boat.
      - 2020 was going to be one hell of a year.

      THE PIVOT:
      - Article 2 is older than Article 1; frame it as background/historical context.
      - Article 2 is the smoking gun or key context for Article 1 because it documents pre-existing Fairhope sewer/infrastructure problems and Baykeeper/City Council political handling before Baldwin County sewer regulation conflict.
      - Connects to Article 1: $6.00 toll poll/petition, BCSS monopoly, $154.50 rate threat, 19,000 homes, Baldwin County fastest growing, consumer time bomb.

