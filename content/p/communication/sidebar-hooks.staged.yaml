  shovel-ready:
    brief: |-
      THE CONFLICT:
      - Fairhope, Baldwin County, Alabama: lack of communication between the Mayor’s office and the City Attorney’s office.
      - Mayor of Fairhope went on record, with the City Council, about the lack of communication between the Mayor’s office and the City Attorney over the last 18 months.
      - Jan. 28 meeting of the Fairhope City Council: City Attorney and Council President, Captain Jack, took it upon themselves to make decisions about Golf Course equipment, without advising the Mayor of details or problems.
      - Golf Course equipment discussion began in Oct. 2018.
      - During the meeting, the Mayor asked the City Attorney, Marcus McDowell, “why did he not reach out to her?” McDowell asked why “she not reach out to him.”
      - McDowell works for the City and is supposed to advise the Council and Mayor in the best interest of the City; allegedly refused to work with the Mayor; allegedly insubordinate; Capt. Jack had his back.
      - McDowell is a holdover from the “Mayor Can’t” era; Capt. Jack and the Council selected McDowell; linked to Catalyst plan to overthrow the present Fairhope Government in 2020; Capt. Jack or Sherry Sullivan may be the Catalyst choice for Mayor; McDowell secure in his job as Catalyst City Attorney.
      - McDowell and Capt. Jack credited for the Federal lawsuit that cost taxpayers, but not Capt. Jack, thousands of dollars; McDowell and Capt. Jack compounded the case until the City’s insurance company took over to settle it; McDowell made an ass of himself and Jack was holding his hand.
      - City Attorney nor Capt. Jack ever explained the police report Mr. Burrell had been hiding for years; Council and City Attorney ignored the issue; City Attorney should have released a statement about the Captain’s police report when it came to light.
      - City Council did not want to listen to the Mayor about her concerns as to the Council selecting McDowell as City Attorney; said nothing when they lost the lawsuit; no accountability; Capt. Jack and McDowell suddenly did not want to talk about it.
      - Suspicious connection between City Attorney Jack Burrell and Ronan McSharry.
      - McSharry owns McSharrys bar and restaurant; menu features a J. Burrell sandwich; connection obvious.
      - McSharry is a frequent flyer with the courts; McDowell has been public prosecutor in at least three court cases representing citizens victimized by McSharry assaults or harassment.
      - McSharry case was supposed to go to court today; predicted they will postpone until a later date; same as when McSharry threatened Nall, the artist; predicted postpone, postpone, postpone, then blame victim or anyone else.
      - McSharry is 5th or 6th run in with the law, 3 in the last 18 months; all involved alcohol, harassment or assault.
      - City Council hired Mr. McDowell and need to fire him ASAP; council will be held responsible for Mr. McDowell’s actions.

      THE DISCOVERY:
      - Article 2, titled “SHOVEL READY,” is older than Article 1, titled “COMMUNICATION”; frame Article 2 as background/historical context.
      - Baldwin County Economic Development Alliance, BCEDA, sounds important; CEO Lee Lawson sure can blow smoke when it comes to the mega site or when recruited by politicians that want a “third party” to back up one of their schemes.
      - The Ripp Report was present when Mr. Lawson was asked by the Fairhope City Council to render support for the Fairhope Airport and K-1 School.
      - General public got 3 minutes to speak; Mr. Lawson was allowed all the time he needed, or till he ran out of breath; on both occasions there was more BS than fact; it was a political show to bolster failing elected officials.
      - Mr. Lawson should consider writing fiction, especially when it comes to the mega-site.
      - “Lawson hopes 2019 will be the year for that ‘mega’ deal for the county’s Mega Site on Interstate 65 near Bay Minette.”
      - The site, Lawson said, was a finalist for the Toyota-Mazda complex, which went to Limestone County near Huntsville, and has been in the conversation for several other large projects.
      - BCEDA: “We are truly an alliance in Baldwin County, being funded and supported by our county government, 14 municipalities, 5 Chambers of Commerce, 8 Industrial Development Boards, and over 100 privately owned businesses.”
      - BCEDA has 17 voting members on its board of directors; each of the 5 Chambers of Commerce appoints three members in staggering terms; board consists of two ex-officio members, which are a rotating Mayor and County Commissioner each year.
      - Baldwin County is out of control when it comes to growth; BCEDA, along with its members, appear to be in high gear when it comes to growth.
      - Warm weather and inexpensive housing has brought thousands to Baldwin County; many thousands following; quality of life will be degraded, traffic will become a nightmare, and schools will not be able to be built fast enough to keep up with demand.
      - BCEDA has the support of the developers; most of the business or development coming to Baldwin County has not one damn thing to do with BCEDA.
      - The Ripp Report does hope a buyer for the Mega-Site comes along; however, each year, they hear, “this is the year.” When it does sell, hope it actually brings in some of the lost revenue and does not become a subsidized sale that yields little, except to the purchaser.
      - Mega Site purchase, 34 million plus lost interest and lost opportunity, probably represents closer to 50 million today.
      - Baldwin County infrastructure has suffered; late Baldwin County Commission, along with the School Board, passed a 1% tax, without a public vote, to make up some much needed infrastructure money.
      - Took money from the schools for needed county infrastructure while ignoring school infrastructure.
      - Thank the Tax man Chris Elliott.
      - BCEDA is promoting the mega-site as being “shovel ready.” Guess what you need the shovel for.

      THE PIVOT:
      - Article 2 is older than Article 1; frame it as background/historical context.
      - Article 2 showed or revealed BCEDA, Lee Lawson, the Mega Site, economic development, the political show, and failing elected officials at the time.
      - Article 1 is the current/ongoing Fairhope communication conflict; timeline includes Jan. 28, Oct. 2018, last 18 months, 2020, and today.
      - Article 2 is the smoking gun/key context for Article 1 because it is older background context that frames the Fairhope/Baldwin County political-economic backdrop; why it is key context: it may provide historical background for later Fairhope governance, City Council actions, and economic development issues discussed in Article 1.

