  catalyst-birds-of-the-same-feather:
    brief: 'THE CONFLICT:

      *   Tucker Dorsey (Commissioner/County Commissioner) presided over county business
      while facing ethics scrutiny.

      *   Dorsey''s faction, including Bob James and Frank Burt, oversaw staff layoffs
      after being sworn in.

      *   Dorsey faced scrutiny regarding business entities and liabilities concerning
      the county sewer service and Mega "dump" Site.


      THE DISCOVERY:

      *   CATALYST is an established, cohesive political network in Baldwin County.

      *   This network, led by Scott Boone (Kevin Boone’s son), strategically places
      candidates in multiple offices to control outcomes.

      *   The network''s goal is securing total control over county bodies (Commission,
      Probate Judge, State Senate) to push specific agendas (e.g., Mega-Site deals).


      THE PIVOT:

      *   Article 2 reveals that the individuals associated with Dorsey''s controversies
      (e.g., business relationships, land use decisions like Mega-Site) are not isolated;
      they are part of a deliberate, long-standing, interconnected political machine
      (CATALYST) aiming for systemic control.

      *   This establishes that Dorsey''s actions were not isolated misconduct but
      part of a coordinated campaign mechanism.


      KEY ENTITIES:

      *   Tucker Dorsey

      *   Bob James

      *   Frank Burt

      *   CATALYST (organization)

      *   Scott Boone

      *   Kevin Boone

      *   Chris Elliott

      *   Joe Davis'
