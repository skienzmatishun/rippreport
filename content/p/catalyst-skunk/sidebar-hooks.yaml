      *   Dorsey defended business entities and relationships against ethics charges.

      *   Allegations concerning the Baldwin County Sewer service and a Mega Dump
      Site acquisition existed regarding Dorsey''s tenure.


      THE DISCOVERY:

      *   The second article frames the opposition to Dorsey/Catalyst as a direct
      referendum on his actions.

      *   It brands the political organization "CATALYST" (and Dorsey''s supporters)
      as the "Skunk."

      *   It validates the idea that running against Dorsey requires unified opposition.


      THE PIVOT:

