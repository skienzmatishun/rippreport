    brief: |-
      THE CONFLICT: Catalyst began as Stacy Elliott and Haygood (Mayor of Daphne) and morphed when Chris Elliott became a county commissioner; Jack Burrell faced an Ethics complaint concerning the Airport scandal over seven years prior.
      THE DISCOVERY: Catalyst is an "old guard" political machine operating in Baldwin County, using intimidation and bully tactics to select and place candidates in multiple races (probate judge, State Senate, all four Baldwin County commission races); candidates are financed by Prebble-Rish through multiple LLCs.
      THE PIVOT: Tucker Dorsey, the "Catalyst Skunk," utilizes the established political machine (Catalyst) to control county assets and personnel, including firing over 10 county employees (department heads, lawyers, county manager, EMA director) and managing the Mega "dump" Site and Baldwin County Sewer system.
