  big-heads:
    brief: |-
      THE CONFLICT:
      *   February 12, 2018: An estimated 100,000 to 200,000 gallons of sewage spilled into a drainage ditch near the Valley Street Lift Station (Middle Street and Dogwood Ave) in Fairhope, leading to Big Head Gully, Tatumville Gully, and Mobile Bay.
      *   February 15, 2018: Fairhope City Council considered an ordinance transferring an acre of land to Fairhope Single Tax Corporation for Tatumville Subdivision.
      *   Post-swearing-in: Tucker Dorsey (Baldwin County Commissioner) and associates (Bob James, Frank Burt) fired over 10 county employees (department heads, lawyers, county manager, EMA director).

      THE DISCOVERY:
      *   The land transfer project in Fairhope involved multiple conflicts of interest among City Council members (e.g., Kevin Boone supporting his son who runs Catalyst; Robert Brown and Cliff Pittman, partners in a building company, supporting the project).
      *   Lee Turner held multiple influential roles: President of Fairhope Planning and Zoning and President of Single Tax.

      THE PIVOT:
      *   Article 2 (2018) establishes a pattern of political corruption in local government tied to sewage issues and land development (Big Head Gully/Tatumville Gully) driven by conflicts of interest.
      *   Article 1 connects a similar "skunk" issue (Baldwin County Sewer and Mega "dump" Site) and the entity "Catalyst" to political corruption involving Tucker Dorsey, showing the pattern is not isolated to Fairhope.

