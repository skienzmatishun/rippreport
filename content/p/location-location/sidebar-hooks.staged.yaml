  quid-pro-quo:
    brief: |-
      THE CONFLICT:
      *   Mayor Tim Kant eliminated Fairhope’s Finance, Environmental, and Tree Committees.
      *   Mayor Kant secured $100,000 ($50,000 from the Fire Department; $50,000 from a city employee) which was lost with no accounting.
      *   The Mayor and the Publix shopping center land owner were involved in a Quid Pro Quo project.
      *   The Fire Department was denied public participation in selecting a safe location for a new station, which was placed on a dead end street violating the city’s comprehensive plan.

      THE DISCOVERY:
      *   Ripp Report #27 (January 12, 2015) revealed the Mayor and the Publix land owner were engaged in a Quid Pro Quo project involving a new 300-unit development proposed by Professional Equity Management (Scottsdale, Arizona) above the damaged Fly Creek.
      *   The Mayor denied public participation in the fire station selection despite the city's comprehensive plan being violated.

      THE PIVOT:
      *   Article 2 established the pattern of Mayor Kant's control over city committees and the existence of the Quid Pro Quo deal concerning the Publix site and the fire station location violation *prior* to Article 1 detailing the specific financial consequences (e.g., $2 million+ Fly Creek cleanup cost, $875,000 soccer field purchase in 2009).

      KEY ENTITIES:
      *   Fairhope
