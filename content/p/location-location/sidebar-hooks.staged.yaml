hooks:
  open-letter-to:
    brief: |-
      THE CONFLICT:
      *   Oct 2009: City council (including Mike Ford) bought 38 acres of land on Manley Road for $875,000 (at $23,000/acre) for a soccer field, despite a 22-foot elevation drop and no immediate need.
      *   2009: Volunteer firemen questioned the safety of the proposed Fire Station location (Parker Road and High Ridge Road).
      *   Publix Construction: Land owner violated planning and zoning, causing estimated $950,000 worth of damage to wetlands/trees via red clay runoff, which was illegally filled.
      *   2015 (Feb 8): The Ripp Report #30 criticized the Mayor for favoring Arthur Corte via the "good ole boy network" in land decisions.

      THE DISCOVERY:
      *   Article 2 (Jan 8, 2015) proved the proposed Fairhope Fire Station location violated the city's Comprehensive Plan (Section 5.4) by being on a cul-de-sac/dead end street.
      *   Article 2 confirmed a lack of public participation, traffic studies, and consultation with Baldwin County road engineers/Aldad regarding the Fire Station.
      *   Article 2 linked the Fire Station location to the land owner's development plot map as a selling point for potential developers.

      THE PIVOT:
      *   Article 2 establishes the historical pattern of ignored city planning (Comprehensive Plan violations) and lack of public accountability in Fairhope regarding the Fire Station.
      *   This pattern (lack of planning, favoring landowners over public safety/city finances) provides the necessary context for Article 1's claim that the Mayor continues the "good ole boy deal" benefiting Arthur Corte, evidenced by the Publix fine waivers and the non-viable Soccer Field purchase.

      KEY ENTITIES:
      *   Fairhope (City)
      *   Mayor
      *   Arthur Corte
      *   Mike Ford (City Council)
      *   Councilman Kingrea
      *   Councilman Mixon
      *   Publix Shopping Center
      *   Fly Creek
      *   Community Bank
      *   Parker Road and High Ridge Road
      *   Manley Road
      *   Auburn University
      *   The Ripp Report #30 (Feb 8, 2015)
      *   The Ripp Report #28 (Jan 8, 2015)
      *   Baldwin County road engineers
      *   Aldad
