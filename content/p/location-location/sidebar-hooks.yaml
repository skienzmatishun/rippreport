    text: Fairhope officials spent years bending zoning rules to enrich developer
      Arthur Corte at the expense of Fly Creek. Former Mayor Tim Kant proved this
      corruption continues by backing a new fire station on the exact site of Corte’s
      proposed 300-unit development.
