  open-letter-to:
    brief: "**THE CONFLICT: What happened in the past? (Include specific names, dates,\
      \ events)**\n- Feb 8, 2015, The Ripp Report #30 published allegations that the\
      \ City of Fairhope's Mayor favored \"good ole boy network\" developers like\
