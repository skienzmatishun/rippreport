      KEY ENTITIES:

      *   Arthur Corte (Landowner, Beneficiary)

      *   Mayor Kant (Mayor, Pro-Corte Allegiance)

      *   Councilman Ford (Voted against PUD proposal, complicit in initial deals)

      *   Fly Creek (Environmental site affected by development)

