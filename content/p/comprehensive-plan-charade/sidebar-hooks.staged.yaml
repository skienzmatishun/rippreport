  catalyst-associates-exposed:
    brief: |-
      THE CONFLICT:
      *   2012: Kevin Boone announced candidacy, promising accountability and transparency.
      *   2012: Kevin Boone agreed to settle the Triangle Lawsuit caused by the Mayor for $12.2 million, misleading citizens by calling it a "park."
      *   2012: Elliott, Haygood & Stacy collected tens of thousands of dollars in campaign contributions (Tim Kant $22,500; Hoss Mack $12,000; Kevin Boone $7,000).
      *   2014: Chris Elliott and Dane Haygood formed Elliott, Haygood & Stacy.
      *   2014: Scott Boone (Kevin Boone's son) joined Lynn Stacey (son of older "Mr. Fix it" Stacey) to form Catalyst Associates, LLC on August 11, 2014.
      *   2014: Judge Michelle Thomason paid Catalyst Associates $2,500 on August 14, 2014.

      THE DISCOVERY:
      *   Kevin Boone was president of the Woodlands Property Association during the construction of the Publix Big Box shopping center, which neighbors unanimously rejected connecting to.
      *   Kevin Boone supports Mayor Kant’s plan to place a fire station at the dead end of Parker Road, connecting into Rock Creek, favoring his own subdivision (The Woodlands) over the people of Rock Creek.
      *   Kevin Boone, a member of the First Baptist Church, is accused of allowing the church to destroy the comprehensive plan concept (houses replaced by parking lots) for the benefit of a few.
      *   Catalyst Associates was formed shortly before Judge Michelle Thomason became a client, suggesting immediate political influence.

      THE PIVOT:
      *   Article 2 establishes a historical pattern of cronyism and lack of transparency involving Mayor Tim Kant and Kevin Boone (e.g., campaign funding, Triangle Lawsuit, favorable zoning for Publix).
      *   This history provides context for Article 1's allegations that Mayor Kant is planning a "back door deal" regarding the fire station on Parker Road, violating the comprehensive plan and prioritizing a developer's interest over public input.
      *   Article 2 proves the existing conflict of interest (Boone/Kant favoritism) that Article 1 claims is currently being perpetuated via the comprehensive plan updates and the Publix/fire station land deal.

