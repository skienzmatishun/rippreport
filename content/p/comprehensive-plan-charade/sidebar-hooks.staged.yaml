      THE CONFLICT:
      *   Tucker Dorsey (County Commissioner/Jasper T Dorsey) was President of Summit Construction Company, Inc., and held durable limited power of attorney for its affairs.
      *   Fairhope awarded Senator Pittman approximately 6 lucrative municipal contracts.
      *   Summit construction was the lone bidder for the Fairhope soccer fields project (initial bid $2 million, later required $5 million).
      *   The City Council deemed these actions as no conflict of interest.

      THE DISCOVERY:
      *   Article 2 revealed that elected officials (Dorsey and Pittman) were using their public positions to advance private business interests (Summit Construction), creating documented conflicts of interest in municipal contract awards.

      THE PIVOT:
      *   Article 2 establishes a historical pattern of favoritism and procedural corruption within Fairhope politics, providing context for the alleged current "back door deal" involving Mayor Tim Kant, the Publix developer, and the fire station location, which reportedly bypasses public input and violates Comp Plan Sec 5.4.

