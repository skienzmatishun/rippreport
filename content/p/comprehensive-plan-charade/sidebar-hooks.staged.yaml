      The widget article revealed that Lee Turner held conflicting roles as President of FSTC and member of the Planning and Zoning commission.
      It noted the Planning Commission was broken, resulting in millions wasted due to poor decision-making and inability to enforce rules.
      The FSTC severely limited public input to three minutes per year for non-agenda items.

      THE PIVOT:
