      - Article 2 explicitly names Mayor Kant and Arthur Corte as principals in these exclusionary deals.
      - Article 2 quantifies the financial exploitation: $5.25M borrowed, $3M to attorneys/fees, $3M from utility reserve fund regarding the Triangle lawsuit settlement.

