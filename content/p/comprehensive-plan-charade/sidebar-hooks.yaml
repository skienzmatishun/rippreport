    text: Fairhope governance is not just broken; council members built a decade-long machine for self-enrichment. Uncover how Councilmen Mike Ford and Mixon pushed through an $875,000 soccer field deal to reward campaign donors at your expense.
  FAUXHOPE-TUNNEL:
