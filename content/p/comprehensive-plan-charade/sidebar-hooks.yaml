hooks:
  lipstick-on-a-pig:
    brief: |-
      THE CONFLICT:
      *   Fly Creek PUD changes were proposed to Fairhope regarding Fly Creek.
      *   Public/Planning & Zoning voted down the proposal (5/4 vote).
      *   Mayor and Councilman Ford voted against the proposal.
      *   Developer Arthur Corte pressured the Mayor to reverse course regarding the negative public turnout (300 attendees).
      *   The Mayor later tried to push the issue through City Council instead of Planning & Zoning.

      THE DISCOVERY:
      *   The Mayor was willing to bend or break procedure ("BLINDSIDE of the public") to accommodate Mr. Corte's interests, overriding initial unified opposition.
      *   The Mayor faced immense pressure regarding the viability of Corte's projects (e.g., football "gift" conditional on votes).
      *   Corte donated land for a fire station and sewer lift station into the city infrastructure, benefiting his overall development plan.

      THE PIVOT:
      *   Article 2 (Dec. 18, 2015) provides the specific political mechanism and timeline showing how the initial public rejection of the Fly Creek development was politically overridden by the Mayor's deference to developer Arthur Corte, setting the precedent for later questionable compromises (e.g., regarding the Triangle lawsuit settlement).

      KEY ENTITIES:
      *   Arthur Corte
      *   Mayor (at the time of the initial vote)
      *   Councilman Ford
      *   Mr. Angus Cooper (Board member/benefactor connection)
      *   Burrell
      *   Mueller
    generated_at: '2026-08-03T01:23:59.335872Z'
    text: Fairhope citizens rejected the Fly Creek development, but backdoor political pressure quickly overruled them. This 2015 investigation reveals how former Mayor Kant bypassed planning rules to hand developer Arthur Corte a lucrative win.
  fairhope-railroad:
    brief: |-
      THE CONFLICT:
      *   Fairhope Comprehensive Plan reviews ongoing since 2001 regarding master plan adherence.
      *   Publix Fly Creek development initially proposed as a village concept; executed as a strip center.
      *   Project timeline involves major environmental damage to Fly Creek, including red mud ingress and buffer/right-of-way alterations.
      *   Loss of an 11.5 million dollar lawsuit settlement, costing taxpayers $3.25 million in legal fees.
      *   Fire station placement shifted to a location described as a "dead end street" contradicting comprehensive plan guidelines.
      *   Mayor Kant's role suggested in pursuing these unfavorable deals to satisfy a developer/contributor.

      THE DISCOVERY:
      *   The Widget Article (dated Dec 04, 2015) details the physical reality of the Publix/Fly Creek project aftermath.
      *   It confirms the ultimate failure of the "village concept," which became a non-fully occupied strip center.
      *   It quantifies the ongoing damage: estimated $10 million needed to clean Fly Creek contamination from the project.
      *   It alleges a "good ole boy deal" between Mayor and contributor, Arthur Corte, involving favorable zoning changes (e.g., sewer lift station paid for by city to benefit developer).

      THE PIVOT:
      *   Article 1 raises concerns about the current planning charade and favoritism toward a developer.
      *   Article 2 serves as dated, site-specific proof that the favoritism resulted in specific, documented catastrophic physical and financial realities (contaminated creek, lost lawsuits, taxpayer-funded amenities for private gain) related to the original planning process.

      KEY ENTITIES:
      *   Arthur Corte
      *   Mayor Kant
      *   Francis Paul Ripp
      *   Fairhope Planning and Zoning (P&Z)
      *   Publix
      *   Fly Creek
    generated_at: '2026-08-03T01:23:59.335881Z'
    text: City leaders promised a charming village at Fly Creek, but delivered a toxic environmental disaster instead. This 2015 report proves former Mayor Kant made sweet deals with Arthur Corte that left taxpayers holding a ten-million-dollar cleanup bill.
