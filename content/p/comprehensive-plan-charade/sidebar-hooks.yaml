  open-letter-to:
    brief: |-
      THE CONFLICT:
      *   Fairhope City Council approved projects/plans involving developer relationships and allegedly ignoring public input over multiple years.
      *   11.5 million dollar lawsuit loss related to a property/park project due to allegedly unfavorable city decisions.
      *   Mayor Kant presided over these decisions, accused of favoritism toward developers and land owners.

      THE DISCOVERY:
      *   The proposed Fairhope Fire Station location violates the City of Fairhope Comprehensive Plan (Page 48, Sec 5.4 Neighborhoods regarding cul-de-sacs/dead end streets).
      *   The location involves Parker Road, described as the most dangerous intersection in Fairhope (7 fatalities).
      *   Baldwin County road engineers and local citizens were allegedly not informed of the project until inquiry.
      *   The Mayor's relationship with the landowner suggests a "back door deal" concerning the fire station site and associated development.

      THE PIVOT:
