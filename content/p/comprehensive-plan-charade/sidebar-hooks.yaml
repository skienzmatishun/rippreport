    generated_at: '2026-08-03T01:23:59.335887Z'
    text: Fairhope spends thousands on master plans while politicians cut secret land deals in dark corners. Follow the dirty money as former Mayor Kant and developer Arthur Corte drain millions from public utility funds to cover up their reckless lawsuits.
  location-location:
    brief: |-
      THE CONFLICT:
      *   Fairhope consistently pursued revisions to the Comprehensive Plan since 2001.
      *   The process involved significant costs (e.g., $80k engineering update).
      *   City decisions frequently deviated from the approved plan/ordinances.
      *   Specific examples include: Publix project (originally village concept vs. strip center), and a disputed $11.5M lawsuit loss against the city.
      *   The Mayor (Mayor Kant mentioned) allegedly favored developers/contributors to push through deals like the fire station location.

      THE DISCOVERY:
      *   The second article (Feb 8, 2015 issue) details multiple documented instances of systemic planning failure and corruption predating the most recent reviews.
      *   Specific examples from 2015 include: A corrupt "good ole boy deal" concerning the purchase of land for a soccer field ($875k price tag) involving City Council members Mike Ford and Mixon.
      *   This purchase allegedly occurred after the 2008 municipal elections and benefitted connected individuals (contributions to Mayor's campaign).
      *   The second article demonstrates the pattern of prioritizing developer benefit over sound municipal governance.

      THE PIVOT:
      *   Article 1 describes the *symptoms* of corruption in modern planning (recent developments, Mayor Kant's alleged deals).
      *   Article 2 provides historical evidence from 2015 that proves the *pattern* described in Article 1 is not an aberration but a decade-long operational modus operandi within the City Council structure.
      *   Article 2 documents specific instances where council members (Ford, Mixon) allegedly acted inappropriately for personal or business gain regarding city assets.

