  mikey-is-gone:
    brief: |-
      THE CONFLICT:
      *   Lawsuit settlement against the City of Fairhope resulted in the Fly Creek Watershed Restoration Project.
      *   Authorization for the Mayor to proceed with settlement was added to a Council agenda in April 2013 without public notice.
      *   Second meeting regarding settlement occurred in October 2013 without public input.
      *   The settlement cost the city $3 million in attorney fees, $3 million in down payment, and incurred a $5.75 million debt.
      *   The City of Fairhope is applying for BP Restore Act funds for this project and a threatened Titi Swamp lawsuit.

      THE DISCOVERY:
      *   Article 2, an older report, highlighted the Mobile Tar Sands Debacle and generalized BP Corruption as a major state issue.
      *   Article 2 noted that Attorney General Luther Strange was facing public scrutiny regarding an alleged extra-marital affair.
      *   Article 2 confirmed that Matt Hart (Alabama Attorney General Office's special prosecutor for White Collar Crime and Political Corruption) was investigating Mayor Tim Kant and Trip Pittman.

      THE PIVOT:
      *   Article 2 establishes a broader, pre-existing climate of high-level state political corruption and investigation in Alabama.
      *   This context provides the backdrop for the specific fraud allegations (omission of private ownership by Corte family, misuse of public funds, violation of open meeting rules) detailed in the Fairhope BP Restore Act application.

