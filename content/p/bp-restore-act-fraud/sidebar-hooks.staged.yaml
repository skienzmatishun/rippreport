  triangle-lawsuit-settlement-2013:
    brief: |-
      THE CONFLICT:
      *   Triangle Lawsuit against the City of Fairhope resulted in a settlement/purchase of the Triangle property.
      *   The settlement involved Mayor Timothy Kant and was linked to environmental damage caused by Arthur Corte's Publix development in Fly Creek (red clay, damaged watershed).
      *   Mayor Kant was summoned to a federal grand jury in Mobile regarding allegations of grant fraud in the BP boom scandal.
      *   Authorization for the settlement was added to a Council agenda in April 2013, and the settlement was announced in October 2013, without public notice or input.

      THE DISCOVERY:
      *   The cumulative effective purchase price of the Triangle property for the community was at least $11 million (including over $2M in attorney fees), not just $8.7 million.
      *   The total amount requested from BP by the City of Fairhope across projects (including Fly Creek and TTI Swamp) was $500 million.
      *   Mayor Kant demonstrated a "masterful pattern of deceit" and lack of accountability concerning the Publix Project and the resulting lawsuit.

      THE PIVOT:
      *   Article 2 established the scale of the corruption and the Mayor's history of deceit (grand jury summons, high costs, $500M ask) tied directly to Arthur Corte/Publix and the Triangle Lawsuit.
      *   Article 1 details the mechanism of the fraud by showing the City deliberately omitted that the majority of the watershed is privately owned by the Corte family and that Arthur Corte's development caused the damage, thereby invalidating the BP Restore Act application (Fly Creek Watershed Restoration Project).

      KEY ENTITIES:
      *   City of Fairhope
      *   Mayor Tim Kant
      *   Arthur Corte / Corte family
      *   BP Restore Act
      *   Triangle Lawsuit
      *   Thompson Engineering
      *   Hand-Arendall
      *   American Municipal Insurance Corporation
      *   Senator Shelby
      *   Senator Jeff Sessions
      *   Congressman Bradley Byrne
