  bcso-how-to-become-sheriff:
    brief: 'THE CONFLICT:

      - In 2003/2004, Murray Lawrence Jr. ("Bubba") was convicted of the murder of
      Brandon Hastings in Baldwin County, Alabama.

      - The conviction resulted from a confession by Jarius McNeal (the actual killer),
      who claimed to have been pressured by Sheriff Hoss Mack: he was told he would
      receive the death sentence unless he named an accomplice.

      - McNeal implicated Lawrence to save his own life; Lawrence has served in Holman
      Prison for approximately 20 years without a parole option, while McNeal (the
      actual killer) received life with parole eligibility and is currently eligible
      for release.

      - Investigators involved included Sheriff Hoss Mack, Anthony Lowery (lead investigator,
      later hired by Mack), Dean McGowan, David Whetstone (DA/prosecutor), Judge Robert
      Wilters, and Asst. D.A. Kristy Haygood.


      THE DISCOVERY:

      - The autopsy of Brandon Hastings was conducted in Mississippi by Dr. Paul McGarry
      (a forensic pathologist with 12,000 autopsies), witnessed by Dean McGowan, John
      Stewart, and Tony Fuqua.

      - Cause of death was listed as "asphyxiation by strangulation" — not a gunshot
      wound.

      - The prosecution (Whetstone and Mack) ignored the Mississippi autopsy and promoted
      a false gunshots theory; they never produced a weapon or ballistics.

      - Mack, Whetstone, and Wilters ordered the body exhumed for a second autopsy
      in Baldwin County and withheld the exculpatory strangulation evidence from the
      defense — acknowledged by all three in a Lagniappe "Digging Deep" article as
      having been found in 2023.

      - No fingerprints, stolen property, crime scene, blood, or cell phone records
      linking Lawrence to Hastings were produced; Fuqua testified at trial that he
      had nothing connecting Lawrence to the disappearance except a friendship with
      McNeal.

      - The last known person to see Hastings alive (Brandon Hastings''s family/friend
      circle, specifically noted as "the last person who saw the victim alive") never
      testified at trial despite being available.

      - Five people testified regarding Lawrence''s whereabouts the night of the murder;
      Whetstone discredited them all by labeling them drug users.


      THE PIVOT:

      - Article 1 (GUILTY - HEAR THE AUDIOBOOK) calls Lowery and Haygood unfit for
      elected office because they "convicted an innocent man" through lies, fraud,
      and self-serving conduct.

      - Article 2 provides the evidentiary smoking gun proving Lawrence''s innocence:
      the autopsy finding of strangulation (contradicting the gunsights theory), the
      exhumation evidence withheld from defense, and the testimony that no physical
      evidence ever existed to implicate Lawrence — all established by officers in
      Mack’s own team.

      - Article 2 shows Lowery, McGowan, Mack produced "not one shred of evidence"
      while contradicting themselves about the trunk liner and failing to establish
      a crime scene or weapon — proving the conviction was manufactured from McNeal’s
      coerced confession alone.

      - The withheld exculpatory evidence (strangulation finding) found in 2023 directly
      undermines the prosecution''s foundation and confirms malicious prosecution
      by Mack, Whetstone, Wilters, Lowery, McGowan, and Haygood — making their election
      campaigns on integrity disqualifying.


      KEY ENTITIES:

      - Murray Lawrence Jr. ("Bubba") – wrongfully convicted defendant, currently
      in Holman Prison

      - Brandon Hastings – murder victim

      - Hoss Mack – former Baldwin County Sheriff, promoted from Captain; convicted
      Lawrence for life without parole

      - Anthony Lowery – lead investigator in the Lawrence case; hired by Mack; no
      field experience; current BCSO sheriff candidate

      - Kristy Haygood – Asst. D.A.; filed false statements regarding Lawrence; protects
      Wilters; judge position candidate

      - Robert Wilters – Judge at trial; later DA; ordered exhumation and withheld
      evidence

      - David Whetstone – Prosecutor/DA; "infamous" for discrediting defense witnesses
      and ignoring autopsy; promoted murder theory without physical evidence

      - Dean McGowan – Investigator; witnessed Mississippi autopsy; involved in capital
      murder case; produced no evidence

      - Tony Fuqua – Police officer who testified against Mack’s narrative at trial
      (page 1591); only officer to contradict the case''s foundation

      - Dr. Paul McGarry – Mississippi forensic pathologist; performed Hastings autopsy
      (12,000 autopsies)

      - Jarius McNeal – Actual killer; coerced by Mack to implicate Lawrence to avoid
      death penalty

      - John Stewart – Witness at Mississippi autopsy

      - Willy Huntley – Defense attorney who questioned Fuqua at trial

      - Maxwell-Tillman and Gabby Humber – Birmingham attorneys now representing Lawrence;
      bar complaints filed in two states'
