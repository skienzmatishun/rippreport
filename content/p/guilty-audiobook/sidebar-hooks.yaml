  po-po-hoss-mack-ccuo:
    brief: 'THE CONFLICT:

      - Murray Lawrence Jr. was wrongly convicted of murder in Baldwin County.

      - Robert Wilters was the judge in Lawrence’s case and later served as Baldwin
      County District Attorney (now retired).

      - Hoss Mack (former BCSO Sheriff) and his father were copied on a May 17, 2004,
      letter from Alabama Department of Forensic Sciences to David Whetstone that
      included autopsy, forensic biology, and toxicology reports.

      - Wilters wrote and signed the order allowing the second autopsy, which occurred
      before Lawrence’s trial but was never admitted or included in his murder trial.

      - David Whetstone (infamous prosecutor) hid evidence that would prove Lawrence
      innocent; he is now retired.

      - The investigation failed to produce one shred of evidence against Lawrence.


      THE DISCOVERY:

      - Investigators found two narcotics investigators at BCSO are currently investigating
      whether cases may have been impacted by missing or mishandled evidence; Mack
      claims no cases have been impacted, but sources say “some” missing evidence
      has already been recovered.

      - A second autopsy report was identified that was not part of the trial, and
      letters/docs in it indicate Whetstone, Wilters, and Mack should have known it
      was performed long before Lawrence’s trial.

      - Hoss Mack is labeled the BCSO “Chief Cover up Officer” (CCUO) with a history
      of cover-ups involving deputies and senior officers (sexual misconduct, missing
      evidence, incompetent investigations).


      THE PIVOT:

      - Article 2 provides concrete documentary evidence—the May 17, 2004 forensic
      letter copied to Mack and his father—and Wilters’s signed autopsy order—proving
      that the same figures accused in Article 1 of malicious prosecution/lying about
      Lawrence had direct knowledge of exculpatory forensic reports before trial.

      - It ties BCSO cover-ups (missing evidence) to the wrongful conviction, showing
      institutional corruption that supports the “guilty” verdict against Lowery and
      Haygood in Article 1.


      KEY ENTITIES:

      - Murray Lawrence Jr.

      - Anthony Lowery

      - Kristy Haygood

      - Robert Wilters

      - David Whetstone

      - Hoss Mack

      - Maxwell-Tillman

      - Gabby Humber

      - Baldwin County Sheriff’s Office (BCSO)

      - Alabama Department of Forensic Sciences

      - Jon Grey'
