  no-justice:
    brief: 'THE CONFLICT:

      - Murray "Bubba" Lawrence Jr. (18 years old at trial, now in William C. Holman
      Correctional Facility) was convicted of the 2003 murder of Brandon Hastings
      in Baldwin County, Alabama.

      - Murder date per witness testimony: April 5/6, 2003; body found in Gautier,
      Mississippi (jurisdictionally Mississippi''s).

      - Trial held in 2005; Lawrence sentenced to life without parole for a capital
      murder.

      - No physical evidence linked Lawrence to the killing; conviction hinged on
      testimony of Jarius McNeil, a lifelong friend who pleaded guilty and cooperated
      in exchange for a lighter sentence.

      - Prosecutors (led by David Whetstone) and Judge Robert Wilters presiding over
      the trial built the case around a gunshot-wound narrative.

      - Official death certificate signed by Jackson County Coroner listed cause of
      death as asphyxia/strangulation by ligature; Mississippi forensic pathologist
      Dr. Paul McGarry confirmed under oath there was no gunshot wound.

      - Investigators involved: Hoss Mack (former Baldwin County Sheriff), who promoted
      and is linked to the case; Anthony Lowery (lead investigator in the Lawrence
      case, found no evidence against Lawrence, now a sheriff candidate).


      THE DISCOVERY (Article 2 / Lagniappe report):

      - In October 2023 (18 years after sentencing), criminal-rights advocates uncovered
      a second autopsy of Brandon Hastings that had been ordered by DA Robert Wilters
      and signed over by Judge Wilters but never disclosed to the defense during the
      2005 trial.

      - The hidden coroner’s report found cause of death was suffocation/asphyxia
      from strangulation, NOT a gunshot wound — directly contradicting the prosecution’s
      narrative.

      - Prosecutors have argued this omission was "harmless error"; defenders argue
      it is a Brady v. Maryland violation (concealment of exculpatory evidence) that
      should at least warrant a new trial/retrial.

      - Haygood, the current Assistant DA handling the case, stated: “I have no explanation
      for why this report was not disclosed. It was certainly a violation of the discovery
      order in this case for the state to disclose this second autopsy report.”


      THE PIVOT (Why Article 2 is the smoking gun for Article 1):

      - The Ripp Report (Article 1) argues that Lowery, Haygood, Wilters, Mack, and
      Whetstone are guilty of corruptly convicting an innocent man and should not
      be allowed to run for office (Lowery → sheriff; Haygood → judge).

      - Article 2 provides the hard documentary proof: exculpatory autopsy evidence
      was deliberately withheld by the very people named in Article 1 (Wilters as
      DA and judge, Whetstone as prosecutor), proving the "guilty" narrative.

      - The missing autopsy undermines the central prosecution theory (gunshot wound),
      making the trial’s outcome invalid and directly supporting the claim of wrongful
      conviction — the exact charge the Ripp Report makes about these officials''
      conduct.


      KEY ENTITIES:

      - Murray Lawrence Jr. ("Bubba") — defendant, life-sentence prisoner

      - Brandon Hastings — victim (Foley resident, found dead in Gautier, MS)

      - Jarius McNeil — co-conspirator/friend of victim who pleaded and testified
      against Lawrence; his parents worked at Fairhope satellite courthouse

      - Robert Wilters — former DA and presiding judge in the case (dual role); ordered/signed
      the withheld autopsy report; retired

      - David Whetstone — infamous prosecutor who built the gunshot-wound narrative;
      bar complaints filed in two states

      - Hoss Mack — former Baldwin County Sheriff, linked to promoting Lowery

      - Anthony Lowery — lead investigator in Lawrence case, no field experience beyond
      carrying Mack’s water; sheriff candidate

      - Kristi Deason Haygood — Assistant DA, currently handling the appeal; judge-position
      candidate

      - Dr. Paul McGarry — Mississippi forensic pathologist who confirmed no gunshot
      wound

      - Jackson County Coroner — signed official death certificate (asphyxia/strangulation)

      - Scott P. Taylor — Circuit Court Judge assigned to Rule 32 petition

      - Kathleen Gordon, Elizabeth Mixon, Debra Fudge, Wendall Thomas (Fairhope PO),
      John Wayne Mixon, Crystal Lindsey — witnesses in the case'
