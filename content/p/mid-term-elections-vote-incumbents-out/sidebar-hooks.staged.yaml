  big-heads:
    brief: |-
      THE CONFLICT:
      1. February 12, 2018: 100,000–200,000 gallon sewer spill occurred in Fairhope near Valley Street Lift Station (Middle Street and Dogwood Ave), discharging into Big Head Gully, Tatumville Gully, and Mobile Bay.
      2. February 15, 2018: Fairhope City Council considered an ordinance to transfer an acre of land to Fairhope Single Tax Corporation for the Tatumville Subdivision.
      3. Baldwin County election context: Tucker Dorsey, an incumbent commissioner, is being challenged over a 35 million dollar mega-site project.

      THE DISCOVERY:
      1. Article 2 revealed significant conflicts of interest among Fairhope City Council members (Kevin Boone, Robert Brown, Jay Robinson, Lee Turner) supporting the Tatumville Subdivision/Single Tax project despite public health warnings and over 2200 citizen objections.
      2. Lee Turner held three roles: President of Fairhope Planning and Zoning, President of Single Tax, and project promoter.
      3. Robert Brown and Cliff Pittman were building partners and supporters of the project, with Brown also serving on the Art Board.

      THE PIVOT:
      1. Article 2 provides specific, documented evidence (Feb 2018) of local government conflicts of interest, public health neglect (sewage spill), and private gain tied to large-scale development (Tatumville Subdivision/Single Tax).
      2. This historical context confirms the "old ways of doing business" and lack of fair play cited in Article 1 regarding Tucker Dorsey and the 35 million dollar mega-site.

