  catalyst-council-lawsuits:
    brief: |-
      THE CONFLICT:
      - Fairhope City Council land use/zoning issues led to two major lawsuits: Triangle lawsuit and Breland case.
      - Triangle lawsuit: approximately 12 years ago, negotiations between Triangle owners and Fairhope City Council stalled.
      - Council and Mayor Cant refused to negotiate.
      - Proposed settlement figure: about 600,000 dollars.
      - Case ended up costing Fairhope 11.25 million dollars, not counting interest and lost opportunity.
      - Fairhope lost Triangle lawsuit and had to pay 8.25 million dollars for property as legal settlement.
      - Fairhope’s insurance company sued the city, saying city’s bad decisions led to lawsuit; insurance company said it was not going to cover legal expenses.
      - City Attorney Cain O'Rear attended council meeting, held right hand high, and promised city would not have to spend a dime on attorney fees.
      - Fairhope paid Cain O'Rear’s firm 3 million dollars.
      - Fairhope lost and had to pay 8.25 million dollars for property as legal settlement.
      - Councilman Burrell denied for years and claimed voluntary purchase for a park; widget article called this an outright lie.

      - Breland case: mirror image of Triangle case; goes back over 12 years ago.
      - Mayor Cant stopped project without cause, then changed zoning rules after the fact.
      - When Wilson became Mayor, she wanted to see if case could be settled.
      - Council refused and insisted it fall into a black hole of litigation.
      - About 3 years ago, negotiator negotiated with Mr. Breland.
      - Mr. Breland said if Fairhope would let him proceed, he would pay legal fees, give 40 acres in perpetuity for a park or conservation easement, and comply with necessary conditions.
      - Council refused to negotiate.
      - Insurance company later said lawsuit was arbitrary and capricious.
      - Court agreed; Fairhope now win, lose, or draw has to pay attorney costs.
      - Fees could be well over a million dollars.

      - If Supreme Court rules in Breland’s favor, could be any day.
      - Breland will have legitimate claim for damages that could result in many millions of dollars.

      THE DISCOVERY:
      - Article 2 simplified two long stories: Triangle lawsuit and Breland case.
      - Article 2 showed Fairhope’s insurance company sued the city over Triangle lawsuit and bad decisions.
      - Article 2 showed attorney Cain O'Rear, council meeting, promise, 3 million dollar payment, loss, 8.25 million dollar property settlement.
      - Article 2 showed Councilman Burrell denied for years and claimed voluntary park purchase; called outright lie.

      - Article 2 showed costs: 11.25 million for Triangle, not counting interest and lost opportunity; 8.25 million property settlement; 3 million paid to Cain O'Rear’s firm; 2.65 million recreation property; 500,000 dollar clock; full family insurance; half dozen issues; council cost taxpayers millions.

      THE PIVOT:
      - Article 2 is older than Article 1 and should be framed as background/historical context.
      - Article 2 is the smoking gun or key context for Article 1 because Article 1 is current Baldwin County land use planning.
      - Article 2 documents past zoning, legal, insurance, and settlement issues that connect to current land use planning.
      - Article 2 provides background for Baldwin County Commission’s Planning and Zoning Department, Design Workshop, long-range land use planning process, public meetings, and future growth concerns.

