      THE CONFLICT:
      May 17, 2021, the State of Alabama approved the Compassion Act, a medical cannabis bill allowing qualified patients to receive medical cannabis upon doctor recommendation, driven by the crisis of opioid overdoses and patient suffering.

      THE DISCOVERY:
      The Compassion Act's primary purpose was patient aid (e.g., stopping violent seizures, non-addictive pain relief) and not the enrichment of the state's wealthy.

      THE PIVOT:
      Article 2 establishes the original, patient-focused intent of the 2021 law, providing historical context for Article 1's current legal "morass," which is a failure to deliver the intended patient relief four years later.

