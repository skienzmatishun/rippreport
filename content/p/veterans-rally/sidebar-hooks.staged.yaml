  lt-governor-ainsworth-breaks-with-governor:
    refined_source: 2fae9223be08e457ce550860785ce32d5b0e9bc232c141020d9a412d291a15f8
    brief: |-
      THE CONFLICT:
      1. On February 11, 2025, Governor Kay Ivey fired Veterans Commissioner Kent Davis after Davis filed an ethics complaint with Alabama Ethics Commissioner Kim Boswell.
      2. This action preceded Ivey's push to pass Senate Bill 67 (SB67) to dismantle the authority of the Veterans Board.

      THE DISCOVERY:
      1. Article 2 revealed that SB67, sponsored by State Senator Andrew Jones (and Rep. Ed Oliver in the House), would transition the Veterans Board from policy-setting authority to an advisory role, granting the Governor sole power to appoint the Veterans Commissioner.

      THE PIVOT:
      1. Article 2 establishes the specific legislative attack (SB67) and executive overreach (firing Davis) that directly prompted the public opposition and the current Veterans Rally (Article 1).

      KEY ENTITIES:
      1. Kay Ivey (Governor)
      2. Will Ainsworth (Lt. Governor)
      3. Kent Davis (Veterans Commissioner)
      4. Andrew Jones (State Senator, SB67 Sponsor)
      5. Kim Boswell (Alabama Ethics Commissioner)
      6. April Weaver (Senator)
      7. Chris Elliott (Senator)
      8. Ed Oliver (Representative, SB67 Sponsor in House)
      9. Veterans Board
