  fairhope-infrastructure:
    brief: 'I have enough information now to write the bridge brief. Let me put it
      together based on the two articles and the verified facts from search.


      ---


      THE CONFLICT:

      - Fly Creek box-culverts under U.S. 98 (near Fairhope, AL) failed in **2023**,
      requiring emergency repairs.

      - The culvert damage was first surfaced by the Ripp Report during construction
      of the **Publix** project on Parker Road; associated issues included sewer lines,
      wetland violations, drainage, proximity to Fly Creek, missing tree survey, city
      easements, and county right-of-way conflicts.

      - City did not act on those early warnings, allowed the apartments to proceed
      with the same unresolved problems, then allowed further expansion behind the
      apartments — granting the developer a "green flag."

      - Former **Mayor Tim Kant** (in office 2013–2016) first proposed re-establishing
      Fly Creek biological and hydraulic connectivity in **2014**.

      - The city voted to apply for a **$20 million federal BUILD grant** to replace
      the failed box-culverts with a bridge. Applications in **2024** and **2025**
      were unsuccessful.

      - During the same period, **Mayor Sullivan** was elected by citizens who believed
      he would address infrastructure; his predecessor, **Mayor Wilson**, had secured
      over **$10 million in infrastructure grants**.

      - Water shortages have persisted for **three years**; the 2020-approved sewer
      and infrastructure projects remain incomplete as of year five. The sewer plant
      is beyond capacity and still discharges into the Bay.

      - The Fairhope Marina required dredging to maintain the main Fly Creek boat
      channel (performed every five years). City selected **M & N of Alabama LLC**;
      costs shared between city and Fairhope Yacht Club for the main channel, city
      pays entirely for the upper channel.


      THE DISCOVERY:

      - **68 Ventures** has been in a legal pissing contest with the City of Fairhope
      for two years after the planning commission denied applications for **Skyline
      Village** (17 acres, Dryer Road) and **Gables on Lawrence** (19.5 acres, Lawrence
      Road). Both properties are outside city limits but within the City''s extraterritorial
      jurisdiction (per a 2021 agreement with Baldwin County).

      - In an affidavit signed in **March**, planning commissioner **Hollie MacKellar**
      said that roughly one month after she voted against Gables, a couple from Atlanta
      contacted her. She helped them look for a home for months — "unbeknownst to
      me, the Cuttinghams were impostors that were hired by 68V to secretly record
      me and attempt to entrap me into making statements against Nathan Cox, 68V and
      the Gables at Lawrence project." The alleged cover story was fake (a pretend
      family).

      - In a motion to dismiss, the City of Fairhope denied or did not respond to
      the accusations, maintaining it has the right to deny developments and that
      "the facts alleged and documents submitted by 68V in the Complaint fail to allege
      a plausible cause of action against Defendants." Circuit Judge **J. Clark Stankoski**
      denied summary judgment on **September 10, 2025** and set the case for jury
      trial on **February 2, 2026**.

      - **68 Ventures** (Daphne, AL) is the parent company for multiple Gulf Coast
      development/investment businesses. Their latest project, **Park City Village**,
      is being proposed at the intersection of **Fairhope Avenue and Highway 181**
      near Walmart/Aldi — a site where the **Klumpp PUD** had previously been approved
      by commission/city council in **2019**.

      - The Klumpp PUD was owned by **Gayfer Village Partners LLC**, whose partners
      are **Haymes Snedeker** and **Ray Hix**. Ray Hix has served as a major Fairhope
      developer; Haymes Snedeker is the **Fairhope Municipal Judge** (serving for
      over 20 years, reappointed in 2013).

      - 68 Ventures bought the land — and apparently the approved PUD itself — from
      Hix/Snedeker. The Ripp Report points out the conflict: "how does this work you
      sue the city and raise hell for 2 years and then you decide to buy one of the
      largest undeveloped commercial properties in Fairhope from the Fairhope municipal
      judge? Ya smell anything?"

      - Park City Village would have a density of close to **700 dwelling units**:
      94 townhouse lots, 62 cottage lots, and 272 multifamily rentals; half rentals,
      half for sale. A four-story, 148-room hotel is included. It would replace the
      Klumpp PUD approved in 2019.

      - **Senator Katie Britt** (R-AL) reported purchasing **$33,000 stock** in "68V
      181-Fairhope Avenue 2023, LLC" on **December 14, 2023** (filed Dec. 15).

      - Project architect is **Birmingham''s Nequette**; local civil engineer is **SE
      Civil**. Public relations representative for 68 Ventures is **Jon Gray**, who
      also serves as the Baldwin County Schools representative and represents the
      school system to developers — a conflict of interest highlighted in the article.


      THE PIVOT:

      - Article 1 documents years of failed infrastructure (culvert failure, no action,
      rejected grants, sewage overflows) and attributes it to developer favoritism
      under former Mayor Kant and the current council''s inaction.

      - Article 2 is the smoking gun because it shows that the same **68 Ventures**
      entity which is suing the City for denied development rights is now *buying
      from the Municipal Judge* who helped approve the original Klumpp PUD — meaning
      the "legitimate" developer pipeline in Fairhope is intertwined with political
      authority.

      - The legal sting by 68 Ventures (alleged secret recordings of a planning commissioner)
      shows how the company operates; the subsequent purchase of the land from the
      Judge''s partnership demonstrates that development disputes are not truly adversarial
      but rather part of a revolving-door deal-making system where enforcement is
      suspended once property changes hands through politically connected parties.

      - The Park City project would be built on exactly the same site where the culvert
      issues, drainage problems, and ecological damage originated (Fly Creek corridor),
      meaning the cycle will repeat unless accountability is enforced — making Article
      2''s evidence of collusion the decisive proof that Article 1''s "backstory"
      is not isolated failures but a systemic pattern.


      KEY ENTITIES:

      - **Tim Kant** (former Fairhope mayor, 2013–2016)

      - **Mayor Sullivan** (current)

      - **Mayor Wilson** (prior, secured $10M+ infrastructure grants)

      - **Publix** (Parker Road development)

      - **Angelo Corte** (entitled developer cited by Ripp Report)

      - **Katie Britt** (U.S. Senator R-AL, $33,000 stock investment in 68V LLC, Dec.
      14, 2023)

      - **Nathan Cox** (68 Ventures executive named in MacKellar affidavit)

      - **Hollie MacKellar** (planning commissioner, local real estate agent, alleged
      victim of sting)

      - **"The Cuttinghams"** (alleged fake buyers sent by 68V to record MacKellar)

      - **Haymes Snedeker** (Fairhope Municipal Judge, 20+ years; partner in Gayfer
      Village Partners LLC with Ray Hix; owner of Klumpp PUD site)

      - **Ray Hix** (Hix & Snedeker law firm; Gayfer Village Partners organizer; long-time
      Fairhope developer; former airport authority member)

      - **68 Ventures** (Daphne-based development parent company; currently suing
      the City, now buying Judge Snedeker''s land/PUD)

      - **Park City Village / 181-Fairhope Avenue LLC** (proposed project at Fairhope
      Ave & Hwy 181; ~700 units + hotel)

      - **Klumpp PUD** (2019-approved planned unit development, owned by Snedeker/Hix)

      - **Skyline Village** (denied, Dryer Rd)

      - **Gables on Lawrence** (denied, Lawrence Rd)

      - **SE Civil** (local civil engineer for Park City)

      - **Nequette** (Birmingham architect for Park City)

      - **Jon Gray / Jon Grey** (68 Ventures PR rep; also Baldwin County Schools representative
      — conflict of interest)

      - **J. Clark Stankoski** (Circuit Judge who denied summary judgment, set trial
      Feb. 2, 2026)'
