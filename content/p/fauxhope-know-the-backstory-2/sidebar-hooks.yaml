      \ Center under Wilson before running; fired qualified engineer, took $25k utility\
      \ salary + second paycheck; ALMOA president 2025-2026)\n- Karin Wolff Wilson\
      \ (Former Mayor, Nov 7, 2016 – Aug 25, 2020; owned Page & Palette bookstore;\
      \ refused second utilities check, hired qualified engineer; won ~$10 million+\
      \ in infrastructure grants; fired by Burrell/Sullivan’s council before her term\
      \ ended)\n- Tim Kant (“Tim Cant” / “Mayor Can’t”) (Former Mayor; approved Publix\
      \ project with “good ole boy deal”; 2014 first proposed Fly Creek connectivity\
      \ restoration; lost reelection due to developer conflicts)\n- Kevin Boone (Councilman;\
      \ father of Scott Boone; SBC conduit; did not seek reelection in 2025)\n- Corey\
      \ Martin (Incumbent Councilman; only incumbent voted out, lost to Gammon by\
      \ ~5 pts)\n- Troy Vickers (Challenger, Place 1; lost to Burrell; supported by\
      \ Watson slate)\n- Joshua Gammon (New councilman, Place 2; won as first challenger\
      \ from the slate; hospitality industry background; campaigned on eliminating\
      \ grocery tax and infrastructure)\n- Tracy Gatewood (Challenger, not elected)\n\
      - David Luc (Challenger, not elected; argued growth/infrastructure was key issue)\n\
      - George Ferniany (Challenger, Place 5; lost to Faust Booth by ~13 pts)\n- Andrea\
      \ Faust Booth (New councilman, Place 5; first-term winner from slate)\n- Jay\
      \ Robinson (Incumbent Councilman, Place 4; won comfortably)\n- Jimmy Conyers\
      \ (Incumbent Councilman, Place 3; won comfortably)\n- Haymes Snedeker (Municipal\
      \ Judge in Fairhope since 2004; re-appointed June 27, 2023 by council for another\
      \ two-year term; described as “Fairhope’s biggest developer”)\n- M & N of Alabama\
      \ LLC (dredging contractor for Fairhope Marina Fly Creek channel)\n- Fairhope\
      \ Yacht Club (shares dredging costs with city for main channel)\n- Mobile Baykeeper\
      \ / Director Casi Callaway (environmental agency; failed to respond to Publix/Fly\
      \ Creek contamination complaints; “phone off the hook”)\n- U.S. Highway 98 (location\
      \ of failed box culverts under which bridge grant is sought)\n- Fly Creek at\
      \ Scenic 98 / Fly Creek at Bohemian Park (highest bacteria counts on Hwy 98\
      \ per Baykeeper red flags: >104 MPN/100ml; >235 MPN for specific sites)\n- Alabama\
      \ League of Municipalities (Sullivan serves as president 2025–2026)"
