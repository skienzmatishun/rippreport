hooks:
  russian-roulette-fairhope-style-rerun:
    brief: "THE CONFLICT:\n- Publix development on Parker Road (Fairhope) triggered\
      \ environmental violations: culverts, sewer lines, wetlands issues, drainage,\
      \ proximity to Fly Creek, missing tree survey. Ripp Report first flagged it;\
      \ lawsuits were filed against the city over the Publix project.\n- Former Mayor\
      \ Tim Kant and developer Angelo Corte pushed through the unwanted development\
      \ despite public outcry; Catalyst Council supported the developer rather than\
      \ residents.\n- In 2014 Kant proposed re-establishing creek biological/hydraulic\
      \ connectivity (Fly Creek).\n- Fly Creek box-culverts under US 98 failed in\
      \ 2023; emergency repairs performed that year. City council voted to apply for\
      \ a $20 million federal BUILD grant to replace the failed culverts with a bridge;\
      \ applications in 2024 and 2025 were unsuccessful.\n- Dredging of Fairhope Marina\
      \ main Fly Creek boat channel (every 5 years); contractor M & N of Alabama LLC.\
      \ Jack Burrell claimed mud was coming from the bay going up the creek, but Ripp\
      \ Report says mud in marina matches DNA profile of Publix construction.\n\n\
      THE DISCOVERY:\n- Article 2 (Russian Roulette, published Dec. 6, 2018) reveals\
      \ Tim Kant’s past legal misconduct and its ongoing cost:\n  - Dyas/Triangle\
      \ lawsuit: settled with city paying $11.25 million in total, while the land\
      \ remained vacant; claimed as a \"win\" by Mayor Kant, councilmen Boone and\
      \ Burrell (the council then). The settlement could have been under $1 million;\
      \ Kant drove it to $8.25 million plus a $3 million legal bill from attorney\
      \ O’Rear.\n  - A separate development lawsuit against the city was ongoing for\
      \ nearly 11 years, with no attempt to settle by the current council (Jack Burrell\
      \ as Council President; Robinson and Conyers); Breland given settlement options\
      \ that were ignored.\n  - In court, former Mayor Tim Kant admitted regulations\
      \ used to hold up property owner Buddy Breland’s project were imposed \"after\
      \ the fact\"; he gave poor testimony (\"turned red as a beet,\" \"stumbled numerous\
      \ times\").\n  - The current council is responsible for delay in delivering\
      \ an approved budget; possible damages from Breland case up to $10 million,\
      \ with Breland able to proceed if city loses.\n- Insurance complications: one\
      \ insurer dropped the city over unethical practices of city-hired attorneys\
      \ and the mayor; another lawsuit by a former insurance carrier over Dyas Triangle\
      \ legal fees.\n\nTHE PIVOT:\n- Article 2 is the \"smoking gun\" for Article\
      \ 1 because it shows Kant and his successors systematically used litigation\
      \ to extract millions from taxpayers while allowing development that destroyed\
      \ Fly Creek’s culverts, wetlands, and water quality. The same council (Burrell\
      \ and others) that oversaw the $11.25M Dyas settlement is now ignoring the Breland\
      \ suit and letting the Fly Creek damage continue from Publix/Apartments — meaning\
      \ the \"environmental cleanup\" story in Article 1 (culvert failure, dredging\
      \ needed because of development) is not isolated accident but the predictable\
      \ consequence of the legal-and-development pattern documented in Article 2.\n\
      \nKEY ENTITIES:\n- Tim Kant (former Mayor; central figure in both articles)\n\
      - Angelo Corte (developer, Publix project)\n- Jack Burrell (current Council\
      \ President; also named as \"Burrell\" on council for Dyas settlement and to\
      \ blame mud source claim)\n- Boone (councilman at time of Dyas settlement)\n\
      - Robinson (current Councilman)\n- Conyers (current Councilman)\n- Buddy Breland\
      \ (property owner in development lawsuit)\n- Mr. O’Rear (attorney who billed\
      \ city $3M on Dyas case)\n- Mayor Wilson (previous mayor cited for infrastructure\
      \ improvements and >$10M grants)\n- Mayor Sullivan (current or upcoming mayor\
      \ referenced as likely not completing grants)\n- Publix (development project\
      \ on Parker Road)\n- Fly Creek / US 98 (location of failed box-culverts, mud/bacteria\
      \ issues)\n- Fairhope Marina / M & N of Alabama LLC (dredging contractor)\n\
      - Catalyst Council (current council accused of special-interest bias)\n- $20M\
      \ federal BUILD grant; $11.25M Dyas settlement; $10M potential Breland damages;\
      \ $3M O’Rear legal bill\n- Date: Jan 25, 2026 (main); Dec 6, 2018 (widget);\
      \ 2014 connectivity proposal; 2023 culvert failure"
