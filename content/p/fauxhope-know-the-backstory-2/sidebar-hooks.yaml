  FAUXHOPE-4:
    brief: 'THE CONFLICT:

      - In 2014, former Mayor Tim Kant proposed re-establishing creek biological and
      hydraulic connectivity in Fairhope.

      - The city council voted to apply again for a $20 million federal ‘Better Utilizing
      Investments to Leverage Development’ (BUILD) grant to replace the failed Fly
      Creek box-culverts under US 98 with a bridge. Applications in 2024 and 2025
      were not successful.

      - During construction of Publix on Parker Road, the city was brought to attention
      of culvert issues: culverts, sewer lines, wetlands issues, drainage, proximity
      to Fly Creek, county right-a-ways, city easements, missing tree survey. The
      developer Angelo Corte “did whatever the hell he wanted” and Fauxhope did nothing,
      then allowed apartments with the same issues.

      - In 2023 a culvert failure occurred; emergency repairs were made.


      THE DISCOVERY:

      - The dredging of Fairhope Marina’s main Fly Creek boat channel is due to sediment/mud
      caused by development on Fly Creek (Publix project, apartments, ongoing expansion).

      - Mud in the marina matches the DNA profile of the Publix construction, yet
      the city council has turned a blind eye since original construction began.

      - The Fly Creek has the highest bacteria count on Highway 98 by Publix and at
      “Fly Creek at Scenic 98”; Baykeeper reported “red” symbols (high bacteria >104
      MPN/100ml, >235 MPN).

      - A live oak with a 6-foot 2-inch diameter was removed from Parker Road’s knoll;
      every vehicle entering/exiting Publix or the neighborhood could see it. City
      officials claimed no knowledge of its removal.

      - The subdivision behind that tree and across from Publix eliminated over 90
      percent of those trees.

      - A third project on Parker Road has also stripped acres of trees: trees knocked
      down, tons of wood hauled off, red dirt hauled in to prepare the site for construction.

      - The waterfront project ballooned from $6.2 million to $10 million (five-and-a-half
      years late), with an additional ~$4 million attributed by the council to increased
      materials; it was grant money and “very little cosmetic changes.”

      - The Jack Burrell Airport’s development is in developers’ hands; only 1 percent
      of the Fauxhope population uses it.

      - A recreational land deal involving Councilman Boone Brown and Burrell involved
      a purchase, abandonment, and lease back to farmers for $9000 a year.

      - Only 12 percent of voters participated in the last election; developer-sponsored
      at-large council members and the “double-dipping” mayor were re-elected.


      THE PIVOT:

      - The main article’s claims of no accountability, ignored infrastructure, and
      unchecked development are concretely proven by the widget article’s evidence
      of tree removal, failed culverts, sediment/mud in the marina matching Publix
      construction DNA, high bacteria counts tied to Publix, and developer-funded
      donations/infrastructure deals.

      - Article 2 reveals that the “smoking gun” is not a one-off complaint but a
      pattern: the developer Angelo Corte’s projects (Publix, apartments, third project)
      have caused the culvert failures, mud/marina sediment, and environmental degradation;
      meanwhile Mayor Sullivan and the council continue granting green lights without
      oversight.

      - Article 1 cites a “$20 million BUILD grant” for culvert replacement that was
      repeatedly unsuccessful — the widget shows what is actually happening: construction-driven
      contamination, ignored by the same council, while developers continue to expand
      on Fly Creek.


      KEY ENTITIES:

      - Tim Kant (former mayor)

      - Mayor Wilson (former/previous mayor; noted as having obtained >$10M in infrastructure
      grants)

      - Mayor Sullivan (current mayor)

      - Angelo Corte (developer of Publix and apartments, major contributor to City
      Council and Mayor)

      - Angelo Burrell / Jack Burrell (airport-related; “Jack Burrell Airport” mentioned)

      - Councilman Boone Brown

      - M & N of Alabama LLC (dredging contractor for Fairhope Marina main channel)

      - Fairhope Yacht Club (shares dredging costs for the main channel)'
