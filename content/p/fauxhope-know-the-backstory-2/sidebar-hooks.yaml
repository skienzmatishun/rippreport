  PRETTY-FLOWERS-ROTTEN-ROOTS:
    brief: "THE CONFLICT:\n- Publix construction on Parker Road (approx. 2014–2020)\
      \ caused environmental damage: dumped mud/sand into Fly Creek, bulldozed county/city\
      \ rights-of-way, and triggered multiple lawsuits against the City of Fairhope\
      \ for violations. Former Mayor Tim Kant (“Tim Cant”) approved the project; Council\
      \ President Jack Burrell defended it as a “good ole boy deal.”\n- 2014: Former\
      \ Mayor Tim Kant first proposed re-establishing biological/hydraulic connectivity\
      \ of Fly Creek.\n- After Publix, the city built Fly Creek Apartments (aka Fairhope\
      \ Village Apartments) on the same site with similar environmental violations;\
      \ residents held 250–300-person public meetings opposing it.\n- May 28, 2021:\
      \ Mayor Sherry Sullivan and Council President Jack Burrell fired a qualified\
      \ utility engineer (with education/experience) hired under former Mayor Karin\
      \ Wilson and put Sullivan in charge of utilities despite her having “no experience”\
      \ as an engineer; she receives a $25,000 utilities salary plus her mayor’s second\
      \ paycheck.\n- 2023: Fly Creek box culverts under U.S. Highway 98 structurally\
      \ failed due to development impact; emergency repairs undertaken.\n- Jan 2024\
      \ (Feb 21, 2024 vote): City Council applied for a $20 million federal BUILD/RAISE\
      \ grant to replace the failed culverts with a bridge; applications in 2024 and\
      \ 2025 failed; Jan 22, 2026: council voted to apply again for the $20 million\
      \ grant.\n- Dredging of Fairhope Marina main Fly Creek boat channel (every 5\
      \ years) is required due to sediment caused by Publix/apartment development;\
      \ city and Fairhope Yacht Club share costs for main channel; city pays upper\
      \ creek channel; M & N of Alabama LLC selected as contractor; marina received\
      \ Clean and Resilient Marina status.\n- Jack Burrell insists the mud coming\
      \ from the bay is going up the creek; Ripp Report argues the dredging/sediment\
      \ is a direct result of development and that “mud in the marina matches the\
      \ DNA profile of the Publix construction.”\n\nTHE DISCOVERY:\n- Aug 26, 2025\
      \ municipal election results:\n  - Mayor Sherry Sullivan won re-election unopposed\
      \ (serving first term since 2020, now second term; also Alabama League of Municipalities\
      \ president 2025–2026).\n  - Jack Burrell retained Council Place 1 against challenger\
      \ Troy Vickers, winning by ~5 points / 265 votes in the closest race.\n  - Incumbents\
      \ Jimmy Conyers (Place 3) and Jay Robinson (Place 4) won comfortably (~63%,\
      \ ~59%).\n  - Joshua Gammon (new face, second attempt after 2020 loss) defeated\
      \ incumbent Corey Martin by ~5 points in Place 2.\n  - Andrea Faust Booth (first\
      \ time running, daughter of former state Rep Joe Faust) defeated George Ferniany\
      \ by ~13 points in the open Place 5 seat; longtime Councilman Kevin Boone did\
      \ not seek reelection.\n- The five challengers — Troy Vickers, Joshua Gammon,\
      \ Tracy Gatewood, David Luc, and George Ferniany — ran as a unified slate endorsed\
      \ by Rebecca Watson, former president of the Baldwin County Moms For Liberty\
      \ chapter, who formed the Fairhope Faith Collective in July 2025; only one (Gammon)\
      \ won.\n- In 2024, municipal elections were postponed due to the presidential\
      \ election; the Ripp Report claims no city council member, mayor, municipal\
      \ attorney, or municipal judge has actually been elected by voters for their\
      \ fifth year of service since then — meaning officials like Burrell and Sullivan\
      \ serve without fresh popular mandate.\n- The current municipal judge (appointed/approved\
      \ by City Council and Mayor; in office since 2004) is described as “Fairhope’s\
      \ biggest developer,” and the city attorney is an SBC/Catalyst loyalist appointed\
      \ by the council — not elected by voters.\n\nTHE PIVOT:\n- Article 1 documents\
      \ years of infrastructure neglect, failed culverts, development-driven sedimentation,\
      \ and repeated unsuccessful attempts to secure federal funds for the Fly Creek\
      \ bridge because the developers (Publix/Angelo Corte via Catalyst/Scott Boone\
      \ Consulting) and the pro-development council “did nothing” or ignored citizen\
      \ opposition.\n- Article 2 reveals that despite years of citizen warnings, infrastructure\
      \ crises, and environmental violations attributed to developer-backed projects,\
      \ the very council accused of causing those problems (Burrell, Sullivan, Conyers,\
      \ Robinson) won reelection on Aug 26, 2025 — even when a unified slate of challengers\
      \ backed by grassroots groups (Watson/Moms For Liberty/Faith Collective) ran\
      \ against them.\n- Article 2 is the “smoking gun” because it shows the same\
      \ individuals accused of letting Publix damage Fly Creek and failing to complete\
      \ Wilson’s $10+ million in infrastructure grants are still entrenched in power,\
      \ while challengers advocating for accountability, districts, and qualified\
      \ utilities leadership were mostly defeated. The election outcome confirms the\
      \ Ripp Report’s core argument: the city is “Fauxhope” — a status quo where developers\
      \ (Catalyst/SBC) control the agenda and infrastructure decay persists because\
      \ the elected representatives are beholden to them.\n\nKEY ENTITIES:\n- Fairhope,\
      \ Alabama (City; “Fauxhope” per Ripp Report)\n- Publix (Parker Road project\
      \ developer/owner; “entitled developer”)\n- Angelo Corte (Publix project developer;\
      \ described as “Catalyst’s good ole boy”; major contributor to the city)\n-\
      \ Catalyst / Scott Boone Consulting (SBC) (developer-backed political organization;\
      \ “secret society”; controlled elections, appointed judge/attorney, supported\
      \ Burrell/Sullivan slate)\n- Jack Burrell (Council President since ~2017; Place\
      \ 1 incumbent; wins 2025 race by ~5 pts; airport bid-rigging allegations; Federal\
      \ First Amendment lawsuit loss; “Captain Jack”; SBC conduit to developers; opposed\
      \ districts; orchestrated utilities job for Sullivan)\n- Sherry Sullivan (Mayor,\
