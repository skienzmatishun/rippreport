  dear-congressman-bradley-byrne:
    brief: |-
      THE CONFLICT:
      *   Publix project caused culvert damage and high bacteria counts in Fly Creek (highest on HWY 98 by Publix and Scenic 98).
      *   The damage is attributed to Publix development, not "historic flooding."
      *   Angelo Corte and Mayor Kant are identified as responsible parties in this ongoing dispute.
      *   A prior lawsuit involving Corte and Kant resulted in a settlement costing taxpayers $11.25 million.
      THE DISCOVERY:
      *   A sediment analysis, conducted despite Corte's refusal to allow access, confirmed sediment originated from the Publix site.
      *   The Fly Creek Watershed Management Plan, commissioned by Mayor Kant, failed to identify facts related to the Publix site, intended to deflect responsibility.
      *   The proposed apartments faced 95% opposition in public meetings, yet the rezoning was approved.
      THE PIVOT:
      *   Article 2 refutes the claim of "historic flooding" (Article 1) by presenting scientific evidence (sediment analysis) and detailing the political manipulation (bogus watershed plan, suppressed public opposition) used to push the damaging development.
