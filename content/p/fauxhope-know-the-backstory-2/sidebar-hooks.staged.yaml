  friends-of-fly-creek:
    refined_source: 3097a2683183cd1adbd7daec6535a7032dd5a0d31e40cb8b0d5640ad6c44970a
    brief: |-
      THE CONFLICT:
      *   Publix project on Parker Road initiated development and clear cutting of Fly Creek site.
      *   Development included apartments and the 230-unit Retreat at Fairhope Village.
      *   Former Mayor Tim Kant first proposed re-establishing creek biological and hydraulic connectivity in 2014.
      *   Culvert failure occurred in 2023, leading to emergency repairs.
      *   City council voted to apply for a $20 million federal BUILD grant to replace failed Fly Creek box-culverts under US 98 (failed applications in 2024 and 2025).

      THE DISCOVERY:
      *   Article 2 revealed that Fly Creek has been flooded with mud and sediment since the Publix project clear cut.
      *   The DNA of the sediment in the creek was identified as coming from the Publix-Apartments construction.
      *   Article 2 documented the issue for over 12 years, noting that the developer Arthur Corti transferred liability associated with the developer to the city under Mayor Kant.

      THE PIVOT:
      *   Article 2 establishes the foundational fact that the mud and silt are derived from internal development runoff (Publix/Apartments), not natural forces.
      *   This evidence directly refutes Jack Burrell’s claim that the mud is coming from the bay, as Article 1 confirms the mud DNA profile matches the Publix construction.
      *   Article 2 provides the historical context for the current culvert failure and ongoing expansion, proving the city's long-term inaction despite continuous public outcry.

      KEY ENTITIES:
      *   Tim Kant (Former Mayor)
      *   Karin Wilson (Mayor, current council)
      *   Mayor Sullivan (Current council)
      *   Arthur Corti (Developer)
      *   Jack Burrell
      *   Publix
      *   Fly Creek
      *   Friends of Fly Creek
      *   ADEM
      *   Mobile Baykeepers
      *   M & N of Alabama LLC
      *   Ripp Report
    llm_text: Publix clear-cutting Fly Creek dumped construction sediment into the waterway; DNA evidence confirms the mud matches the development, not natural forces. Despite 12 years of documented damage and former Mayor Tim Kant's advocacy, the creek now faces culvert failure as the city seeks a $20M federal grant.
    text: Publix clear-cutting dumped sediment into Fly Creek, and DNA evidence tied the mud to the site. The creek faces culvert failure as the city seeks a federal grant.
