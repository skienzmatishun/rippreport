  liar-liar-pants-on-fire-2:
    brief: |-
      THE CONFLICT:
      *   The Fly Creek apartments (aka Fairhope Village Apartments at Publix) resulted from acts of corruption in Fairhope.
      *   Over five lawsuits stemming from pollution and drainage have cost taxpayers hundreds of thousands of dollars.
      *   Public meetings saw 250-300 citizens opposing the project.
      *   Council President Jack Burrell betrayed the public by supporting the developer.
      THE DISCOVERY:
      *   The developer, Stewart “The Liar” Speed (Leaf River Group), falsely assured the public (250-300 citizens) the apartments would be luxury and would not contaminate Fly Creek.
      *   The apartments were poorly managed, suffered partial flooding, and were eventually sold after poor initial sales predictions.
      *   Speed, the developer, was involved in behind-the-scenes communications with Council President Jack Burrell regarding the land "gift."
      THE PIVOT:
