  fly-creek-a-drainage-ditch:
    brief: |-
      THE CONFLICT:
      *   The Fly Creek Apartments were approved despite overwhelming public opposition (95%) and predicted environmental damage.
      *   The City Council and Mayor sold out the community in favor of the developer, Angelo Corte.
      *   The drainage plan for the apartments directs excess storm water (from the complex and Publix) into the wetlands, draining into Fly Creek.
      *   The original 2016 trial (Friends of Fly Creek vs. City Council) failed because the burden of proof was on the plaintiff.
      THE DISCOVERY:
      *   In October 2016, the council endorsed the project despite public opposition.
      *   In April 2017, the newly elected city council (except Jimmy Conyers) extended the project timeline.
      *   The new drainage plan uses a single point discharge outfall pipe, bypassing the 1-acre retention pond and omitting expansion to a 5-acre pond, directly dumping storm water into the wetlands/Fly Creek.
      THE PIVOT:
      *   Article 2 provides the critical legislative history (2016/2017 endorsements and extensions) and technical planning detail (single point discharge plan, omission of 5-acre pond) that explains *how* the developer was able to bypass public concerns and institutional safeguards to create the "drainage ditch" scenario cited in Article 1.
