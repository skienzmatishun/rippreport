  re-gift-gift-2:
    refined_source: 7e9ea73a6a0e037f0b6b62762d79f1ba534596a5b900723850b168dc8ff50198
    brief: |-
      THE CONFLICT:
      *   2014: Former Mayor Tim Kant first proposed re-establishing creek biological and hydraulic connectivity.
      *   Construction of Publix project and apartments led to Fly Creek culvert damage.
      *   2023: Fly Creek box-culvert failed under US 98, requiring emergency repairs.
      *   Development was supported by developer Angelo Corte and former Mayor Kant, despite public outcry.

      THE DISCOVERY:
      *   Fall 2016: Developer Angelo Corte deeded a 4-acre parcel, including wetlands, located between the retention pond outfall pipe and Fly Creek to the City of Fairhope.
      *   This deed occurred simultaneously with the developer seeking Site Plan Approval using the out-fall pipe, violating PUD Amendment 1572.
      *   The City became the lower landowner relative to the proposed PUD project.

      THE PIVOT:
      *   The 2016 deed established the City's vested legal interest as the lower landowner, obligating the City to prevent runoff, erosion, silt, and sedimentation from the PUD project onto its own newly acquired critical land.
      *   This ownership context links the original development permissions (2016) directly to the subsequent infrastructure failures (2023 culvert damage) and ongoing environmental issues (high bacteria counts, required dredging).

      KEY ENTITIES:
      *   Tim Kant (Former Mayor)
      *   Angelo Corte (Developer)
      *   Mayor Wilson
      *   Mayor Sullivan
      *   Publix
      *   Fly Creek
      *   City of Fairhope
      *   $20 million (BUILD grant application)
      *   PUD Amendment 1572
      *   M & N of Alabama LLC (Dredging contractor)
    llm_text: Angelo Corte's 2016 deed to City wetlands means Fairhope legally owns critical land, obligating the city to prevent runoff from the PUD project. This ownership links directly to the 2023 Fly Creek culvert failure and ongoing environmental issues.
    text: Angelo Corte deeded wetlands to Fairhope in 2016, making the city legally responsible for runoff control. That land ownership ties directly to the 2023 Fly Creek culvert failure.
