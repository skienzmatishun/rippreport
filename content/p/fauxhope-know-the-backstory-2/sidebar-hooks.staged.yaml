  wetlands:
    brief: |-
      THE CONFLICT:
      *   Publix project and subsequent apartments construction damaged Fly Creek (culvert/sewer/wetlands issues).
      *   The City Council ignored these environmental issues despite the city knowing the mud in the marina matches the Publix DNA profile.
      *   High bacteria levels (> 104 MPN/100ml) are reported in Fly Creek on HWY 98 by Baykeeper.
      *   The marina dredging is necessary every five years, but the cause is development, not natural aging.
      THE DISCOVERY:
      *   On October 9, 2017, the Fairhope City Council heard a Baykeeper presentation on water testing in 12 locations, including the Fly Creek Watershed.
      *   Angelo Corte refused testing on his property, restricting Baykeeper’s monitoring.
      *   A resident from Sandy Ford/Rock Creek reported foul odors and discolored/contaminated water in the Firefly wetlands (Corte project).
      THE PIVOT:
      *   Article 2 provides verifiable documentation (Baykeeper testing, council meeting record) of the environmental warnings (high bacteria, contaminated water) that were present at the time of the conflict (Article 1), proving the city's knowledge and inaction.
