  some-things-never-change:
    brief: "THE CONFLICT: \n- Lawsuits filed against the City of Fairhope over the Publix project on Parker Road, citing issues with culverts, sewer lines, wetlands, drainage, Fly Creek proximity, county rights-of-way, city easements, and missing tree surveys.\n- 2014: Former Mayor Tim Kant first proposed re-establishing creek biological and hydraulic connectivity.\n- 2023: Culvert failure occurred, followed by emergency repairs and unsucccessful applications for a $20 million federal BUILD grant (also applied for in 2024 and 2025) to replace failed box culverts under US 98 with a bridge.\n- Unregulated development (Publix project, apartments, and subsequent expansions backed by developer Angelo Corte and supported by Catalyst and the City Council) caused severe infrastructure damage, recurring mud in the marina (matching Publix construction DNA profile), and high bacteria counts on Highway 98 and Scenic 98 reported by Baykeeper.\n\nTHE DISCOVERY: \n- March 3, 2022 (Article 2): Exposed the deep political influence of the \"CATALYST\" group and its network—including State Senator Chris Elliott (\"Tax Man\"), Council President Jack Burrell, and former Mayor Tim Kant staffer/mayoral candidate Sherry Sullivan. \n- Detailed how Catalyst-backed officials and allies (such as Eddie Tyler, Jack Burrell, and Sherry Sullivan) pushed developer-friendly agendas, avoided accountability regarding public funds and secret taxes (penny tax, gas tax), and positioned themselves to control Fairhope's municipal government.\n\nTHE PIVOT: \n- Article 2 acts as the smoking gun because it names the exact political faction (\"CATALYST\" and the \"good ole boys\" network including Jack Burrell, Sherry Sullivan, and former Mayor Tim Kant's loyalists) that Article 1 accuses of enabling developer Angelo Corte, ignoring environmental degradation, and turning a blind eye to the destroyed Fly Creek culverts and marina siltation.\n\nKEY ENTITIES: \n- Tim Kant\n- Angelo Corte\n- Sherry Sullivan\n- Jack Burrell\n- Chris Elliott (The Tax Man)\n- Eddie Tyler\n- Jennifer Fidler\n- Pandora Heathcoat\n- Bradley Byrne\n- Catalyst (organization)\n- Fairhope Yacht Club\n- M & N of Alabama LLC\n- Baykeeper"
