  fairhope-voters-guide:
    brief: |-
      THE CONFLICT:
      - 2016 Fairhope municipal election: Incumbent Mayor Timothy Kant defeated by a 400-plus vote margin by Karin Wilson, Fairhope's first female mayor, after the Alabama Secretary of State's Office Elections Division sent a legal representative to oversee voting and vote counting due to numerous complaints of election tampering during the 2008 and 2012 voting cycles.
      - Post-2016: Mayor Karin Wilson, a political novice at the time, lacked a single friend on the city council; the council was made up of five individuals selected by the previous mayor; described as "good ole boys" aligned with CATALYST; council thwarted mayor's efforts to improve planning, growth management, and wastewater/storm water infrastructure.
      - Sherry Sullivan was part of the corrupt administration voted out in 2016; the CATALYST candidate for Mayor was a fired disgruntled employee who sued the city, with limited experience, no accomplishments, a high school education, and sponsored by CATALYST/Scott Boone and Kevin Boone.

      THE DISCOVERY:
      - Article 2 (Fairhope Voters Guide) revealed background context: the 2016 election was chaperoned by the Alabama Secretary of State; complaints of election tampering during 2008 and 2012 were received; the incumbent mayor of 16 years was defeated by the city's first woman head of state.
      - Article 2 detailed alleged CATALYST corruption: Airport, bid rigging, Triangle lawsuit, voting himself full family insurance, purchase of 2.65 million in farmland as recreational property and leasing it back to farmers for 9,000 a year; Burrell's trail of corruption.

      THE PIVOT:
      - Article 2 is the smoking gun/context for Article 1 because it establishes the 2016 election tampering background and the CATALYST political machine behind Sherry Sullivan, framing Article 1's criticisms of Sullivan's judgment (skipping the Common Sense Campaign forum, suggesting Mayor Wilson handled scheduling, promoting the Arts and Craft Show with over 200,000 attendees despite doctors from Thomas advising against it, "take a chance" comment with Burrell and Boone, mask/social distancing enforcement failure at Spanish Fort vs. Fairhope football game) as part of a prior pattern of bad decisions.
      - Article 2's disclosure of Sullivan's 2016 corrupt administration supports Article 1's claim of a "consistent pattern of bad decisions" and Sullivan's lack of "Mayor material."

