  catalyst-ass-whoopin:
    brief: |-
      THE CONFLICT: In the past (leading up to the July 23 candidate qualifying deadline), the political faction known as CATALYST (operating as Scott Boone Consulting) suffered a major defeat when their endorsed First Congressional Seat candidate, Carl Hightower ("Lowtower"), lost the runoff election to Jerry Carl by 3,873 votes, driven by a massive voter shift of roughly 2,000 to 2,500 Baldwin County votes away from Catalyst. Concurrently, CATALYST scrambled to field candidates for the upcoming Fairhope municipal elections, turning to Sherry Sullivan to run for Mayor after discarding plans to back John Melones, while incumbent Mayor Karin Wilson clashed with CATALYST-aligned council members (specifically the "Three B's": Boone, Brown, and Burrell) over public safety decisions like the 200,000-attendee Arts and Crafts Festival during the COVID-19 pandemic.

      THE DISCOVERY: Article 2 revealed that the political group CATALYST was actively orchestrating local elections behind the scenes, pressuring figures like Sherry Sullivan to "fall on the sword" as their mayoral proxy to protect the status quo and the interests of Scott Boone Consulting, despite her initial hesitation and existing baggage.

      THE PIVOT: Article 2 serves as the smoking gun because it exposes Sherry Sullivan not as an independent candidate, but as a recruited operative for the defeated political machine CATALYST/Scott Boone Consulting—directly explaining the poor judgment, avoidance of public forums, and reckless COVID-19 policies (such as promoting the Arts and Crafts Show and handing out unmasked football fans) criticized in Article 1 as a continuation of CATALYST's self-serving agenda over citizen safety.

      KEY ENTITIES:
      - Sherry Sullivan (Fairhope Mayoral Candidate)
      - Karin Wilson (Incumbent Fairhope Mayor)
      - Jerry Carl (Congressman-elect)
      - Carl Hightower / "Lowtower" (Former Congressional Candidate)
      - Scott Boone / Scott Boone Consultant (SBC)
      - Burrell (City Council Member / One of the "Three B's")
      - Brown (City Council Member / One of the "Three B's")
      - Boone (City Council Member / One of the "Three B's")
      - Jay Robinson (City Council Member)
