  a-decade-of-corruption:
    brief: 'THE CONFLICT:

      *   Fairhope City Council awarded contract for BP Boom work to Pittman Tractor
      via depressed bids following initial rejection by County Commission on May 8th,
      2010.

      *   Initial bid secured $636,000.00 from Fairhope to Tripp/Pittman via Tim Kant
      and Greg Mims (Fairhope Staff).

      *   Despite concerns, the contract was awarded on June 4th, 2010.

      *   Pittman received a check for $372,165.90 shortly after execution without
      required licensing, insurance, or county/ethics approval.


      THE DISCOVERY:

      *   The second article (Widget) documents a decade of intertwined corruption
      in Baldwin County involving multiple officials accepting or profiting from these
      conflicts.

      *   It provides a comprehensive catalogue of ongoing endemic corruption within
      Fairhope and Baldwin County government structures spanning over ten years, including
      misuse of taxpayer funds ($750,000 range in BP money alone).


      THE PIVOT:

      *   Article 1 introduces the specific initial point of conflict (the contract
      award). Article 2 uses this instance as the microcosm to prove a decade-long
      pattern of systemic, protected corruption enabled by inaction from the Judiciary,
      Attorneys, and Sheriff''s office across multiple projects (Mega Site, Strawman
      case, Land Deals).


      KEY ENTITIES:

      *   Greg Mims

      *   Tim Kant

      *   Tripp Pittman

      *   BP

      *   Fairhope City Council

      *   Baldwin County Commission

      *   Jennifer Fidler

      *   Jack Burrell

      *   CATALYST'
