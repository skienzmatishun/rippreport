      \ utility funds (mayor is Utilities Director and draws a salary).\n  - Quail\
      \ Creek Golf Course spent millions over 10 years for former employees/good ole\
      \ boys.\n  - BP Grant fraud allegations against Mayor Kant.\n  - Unpaid sewer\
      \ “band aid” upgrade (~$10 million) expected to fail in a few years; mayor refused\
      \ inland relocation that would qualify for legitimate EPA/BP grants.\n\nTHE\
