  fairhope-epicenter-corruption:
    brief: 'The Bridge Brief is complete. Here it is:


      ---


      ## THE CONFLICT (Past events — specific names, dates, places)

      - **2012/6/28**: *Columbus Ledger-Enquirer* published an article on Phenix City
      city manager **Wallace Hunter**, reporting the expected firing of the city manager
      with the election of a new council. Ripp Report (published **2012/8/1**) cites
      this as the primary evidence of "corruption" and urges readers to "See the article!!!"

      - **2012**: City administrator **Gregg Mims** received an ACCMA Award that was
      self-nominated — but he placed **third among three nominees (last place)**.
      Planning & Zoning chief **Jonathan Smith** sent an email congratulating him
      while omitting this fact. Ripp Report calls it a "vanity award concocted by
      Jonathan Smith."

      - **2012**: ACCMA 3-day event in **Gulf Shores, AL** — hours of business day
      one; days two and three were "party time" at taxpayer expense. Most attendees
      received awards they had nominated themselves for. Gregg Mims was described
      as "padding his resume."

      - **Background (Phenix City)**: Wallace Hunter, a black city manager, was later
      fired on **2014/5/20** by a 3–2 council vote (Gail Head moved, Chris Blackshear
      seconded), with the vote charged as falling along racial lines. The Ripp Report
      frames this as evidence that "corrupt" leadership can be purged — and asks what
      Fairhopians should do next.


      ## THE DISCOVERY (What Article 2 reveals today)

      Article 2 (published **2015/6/5**) documents a full conflict-of-interest structure
      in Fairhope involving:

      - **Trip Pittman** (state senator): BP grant fraud investigation; his company''s
      "low bid" for debris removal worth potentially millions, supported by council
      and mayor; his heavy-equipment sales/leases to the city; all non-political contractors
      shut out.

      - **Tim Kant** (mayor): BP grant fraud investigation; control of Planning &
      Zoning costing taxpayers millions; employment packages to key employees ensuring
      loyalty; suspected of fixing local elections. Called "head of the snake."

      - **Lee Turner**: President of Planning & Zoning AND head of Single Tax Colony,
      which controls 50% of city property and whose projects P&Z reviews — a glaring
      conflict of interest.

      - **George Robards**: Major Kant contributor; member of P&Z; major contractor
      for Single Tax Colony with contracts totaling over $100K awarded while on the
      very board that approved those projects.

      - **Jennifer Fidler**: Head of public works AND member of P&Z, where most reviewed
      projects involve public works; votes 100% as the mayor directs.

      - **Jack Burrell**: City council president; has not challenged the mayor on
      a single issue; rewarded with a 6-year airport committee appointment matching
      his profession. Also holds hands with Pittman in bible study.

      - **Mike Ford**: Charter member of "good ole boys"; added secret language to
      an *already printed* council agenda permitting the mayor to settle the triangle
      lawsuit, with no public notice or participation — done to cover up the mayor''s
      responsibility for causing the lawsuit. The settlement was called a "park,"
      costing taxpayers $12 million.

      - **Kevin Boone**: Cant loyalist; campaign promised he would not work for any
      city contractors while in office; now admitted working for Summit Const., affiliated
      with county commissioner Tucker Dorsey; suspected sub-contractor on the soccer
      field contract.

      - **City employees**: Most are hard-working and honest, but are compromised
      by fear of retaliation or firing if they report corrupt activity.


      Financial contrast: Fairhope paid **$17M** in lawsuits and parks while spending
      only **$350K** on education for approximately 16,000 voters — $10,625 per voter
      on lawsuits/parks versus $21.88 per voter on education.


      ## THE PIVOT (Why Article 2 is the "smoking gun")

      Article 1 presents isolated anecdotes — a city manager expected to be fired,
      an inflated vanity award, self-nominations at taxpayer-funded events. It raises
      the question: *is there corruption?* but offers only circumstantial evidence
      and no mechanism.


      Article 2 turns that suspicion into a **documented system**: nine named individuals
      each holding dual roles (public office + private contract), planning & zoning
      members approving projects they profit from, single-tax colony controlling half
      of city property while P&Z reviews those same projects, secret agenda insertions
      to cover self-dealing, and employees silenced by fear.


      Article 2 is the "smoking gun" because:

      1. It explains *why* Fairhopians were asked to look at Phenix City''s situation
      — it confirms the structural similarity (conflict of interest in planning/zoning
      + city contractor relationships).

      2. It names specific individuals, dollar amounts ($17M vs $350K; $12M "park"),
      and mechanisms (self-nominating awards, secret agenda language, BP grant fraud
      investigations), making the "corruption" claim concrete rather than rhetorical.

      3. It frames Tim Kant as "head of the snake" — directly paralleling the Phenix
      City narrative where removing corrupt leadership is presented as the only path
      to reform.

      4. The "vanity award" critique in Article 1 (Gregg Mims padding his resume at
      self-nominated ACCMA event) mirrors the Fairhope pattern of public-facing window-panes
      that conceal private profit (the $12M lawsuit settlement called a "park").


      In short: Article 1 says Phenix City *looks* corrupt; Article 2 proves *how*
      and *by whom* it is corrupt, using Fairhope as the concrete evidence.


      ## KEY ENTITIES

      **People:** Jonathan Smith, Gregg Mims, Wallace Hunter, Tim Kant, Trip Pittman,
      Lee Turner, George Robards, Jennifer Fidler, Jack Burrell, Mike Ford, Kevin
      Boone, Gail Head, Chris Blacksheer (Burrell), Jim Cannon, Tucker Dorsey.


      **Organizations:** ACCMA (Alabama City Management Association), Single Tax Colony
      / Fairhope Single Tax Corporation, Summit Const., City of Phenix City, City
      of Fairhope, Baldwin County Commission.


      **Locations:** Phenix City, AL; Fairhope, AL; Gulf Shores, AL.'
