      email congratulating Phenix City city administrator Gregg Mims for receiving
      an ACCMA Award; Mims was third of three nominees (last place).

      - The Ripp Report described this as a "vanity award" used by Mims to pad his
      resume while on public dime.


      THE DISCOVERY:

      - Jack Burrell, who served as Fairhope City Council President, refused to relinquish
      that position even after Sherry Sullivan was sworn in as new Mayor; he stated
      he would "continue to run the show."

      - The "three B''s" — Jack Burrell, Kevin Boone, and Robert Brown — were identified
      as a political group (linked to Catalyst/Scott Boone Consulting) maintaining
      total control over Fairhope government.

      - These three were re-elected in 2025; Burrell sought a fourth term, Boone and
      Brown won re-election in 2020 by slightly lower margins than prior cycles.

      - The Ripp Report warned Sullivan that the council would have a "well laid out
      plan before her honeymoon is over," including ignoring continued corruption
