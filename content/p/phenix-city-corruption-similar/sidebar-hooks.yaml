      control regardless of democratic turnover.


      KEY ENTITIES:

      - Wallace Hunter (Phenix City city manager)

      - Gregg Mims (Phenix City city administrator)

      - Jonathan Smith (Fairhope planning and zoning head)

      - Eddie Lowe (Phenix City mayor, 2014)

