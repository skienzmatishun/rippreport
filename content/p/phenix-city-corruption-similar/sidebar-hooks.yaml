  catalyst-justice:
    brief: 'THE CONFLICT:

      - Phenix City, Alabama (August 2012): A voter turnout spike led to leadership
      turnover in city council.

      - November 26, 2012: Phenix City Manager Wallace Hunter received complaints
      that city employees were using city-owned equipment on private property and
      on city time.

      - December 7, 2012 (WTVM report): Parks and Recreation employees fired for abusing
      Phenix City equipment (using city time/equipment for personal gain).

      - June 2, 2014: Phenix City Council voted to fire City Manager Wallace Hunter;
      pastor Noble Williams represented ~20 mostly Black churches in Phenix/Russell
      County asking the council to rescind the firing.

      - Historical context: The 1950s “Phenix City Mafia” controlled all public officials/law
      enforcement; Attorney General Albert Patterson (elected partly on a clean-up
      platform) was gunned down June 18, 1954; martial law imposed; over 200 skeletons
      found in Chattahoochee River.

      - Related Fairhope corruption (pre-context referenced in Article 2): Sen Tripp
      Pittman ($750,000 BP theft), Chris Elliott (DUI charge), former Mayor Cant (FEMA
      funds misuse), Councilman Robert Brown (inside deal with Fairhope Art Center),
      Jack Burrell (bid rigging).

      - June 28, 2012 (ledger-enquirer link in Article 1): Phenix City manager Wallace
      Hunter reported on city corruption.


      THE DISCOVERY:

      - The “CATALYST” political group (self-appointed label for Baldwin County status
      quo/good-ole-boy establishment) is the common denominator of Fairhope political
      corruption.

      - Ronan McSharry, owner of McSharry’s Irish Pub in Fairhope, was found guilty
      (2018–2020) of public intoxication and assault; sentenced to 180 days jail with
      time served during rehab for pushing a woman off a barstool at the Little Whiskey
      Christmas Club on Nov. 22, 2018.

      - Municipal Attorney Marcus McDowell failed in his duties in the McSharry case;
      his actions favored the offender and could result in litigation against the
      city; he then argued intoxication and assault charges carry “identical punishments”
      despite dropping/under-handling the assault charge.

      - Appeals court dropped the McSharry assault charge (2020) after the prosecutor
      failed to act.

      - The judge appointed to Fairhope municipal court was also the city’s largest
      developer, secured by a council vote; City Council canceled public participation
      while justice slipped in the McSharry case.

      - Paula DiNardi sustained $10,000 medical bills, lost her job, and suffered
      stress from an assault she claims McSharry committed; City Council is described
      as turning a blind eye.


      THE PIVOT:

      - Article 1’s critique of Fairhope government (Gregg Mims padding his resume
      for the ACCMA award where he was third/last of three nominees, events being
      “fluff at our expense,” and city administrator corruption) parallels Phonic
      City’s pattern of elected officials protected from accountability and city leadership
      using public resources for personal gain.

      - Article 2 shows that “CATALYST” is a recurring structure: officials (Pittman,
      Elliott, Cant, Brown, Burrell) use office for personal gain; they are connected
      to local power centers (McSharry’s bar as a “watering hole”), and the appointed
      legal/judicial apparatus (Municipal Attorney McDowell, municipal judge/developer)
      systematically favors offenders over victims.

      - This structural similarity—elected/appointed officials colluding, courts/prosecutors
      protecting offenders, and public resources wasted on self-serving awards/events—is
      what makes Article 2 the “smoking gun” showing that Fairhope’s current governance
      (Gregg Mims era) replicates Phenix City’s historical corruption.


      KEY ENTITIES:

      - Wallace Hunter (Phenix City city manager/city administrator)

      - Noble Williams (pastor, Phenix City/Russell County churches)

      - Albert Patterson (Alabama AG, assassinated 1954; son John Patterson AG 1954–1958,
      Governor 1958)

      - George C. Wallace (1958 AG race loser to John Patterson)

      - Steve Flowers (columnist writing Phenix City corruption story)

      - Tripp Pittman (Senator, $750,000 BP money theft)

      - Chris Elliott (new Senator, DUI charge)

      - Mayor Cant (former Fairhope mayor, FEMA funds misuse)

      - Robert Brown (Fairhope Councilman, Art Center inside deal)'
