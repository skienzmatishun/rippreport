      Article 2 reveals that the total price tag is $2.2 billion, with $125 million from federal government and a committed $250 million from the state (ALDOT/local leaders), leaving a funding gap of roughly $500 million that tolls aim to cover.
      Article 2 established Jack Burrell's history of conflicting statements regarding tolls and his questionable track record.

      THE PIVOT:
      Article 2 provides the financial context (total cost, committed funds, funding gap) that contradicts Jack Burrell's claims in Article 1 that "no federal money was needed" and "no tolls" would be necessary, framing his current support for tolls as a response to inability to fund the project otherwise.

