      - Article 2 (Widget: PEOPLE POWER) revealed serious sewer infrastructure problem in Fairhope; Mayor Wilson broke down emotionally over losses: suicide of senior classmate of her daughter's while in Fairhope High; Mayor knew her grandmother was fighting for her life; Mayor lost good friend, all in few days.
      - Council never heard second opening prayer; council too focused on covering own asses; spent meeting heaping stress and heartache on Mayor.
      - Sherry Sullivan fired from Fairhope, sued city, with assistance of council collected her check, YOUR MONEY.
      - Councilman Robinson's wife used to work for Sherry and is her best friend.
      - Council wanted to change Fairhope Arts and Crafts organization; Jay said downtown merchants "did not care"; Jay's wife said downtown board did not want to get involved.

      THE PIVOT:
