      - Bill Hightower was identified as the candidate representing the "CATALYST" political group.

      THE DISCOVERY:
      - CATALYST is a political organization based in Fairhope, Alabama, claiming Baldwin County as their territory.
      - The organization is accused of seeking total political power and using appointed or elected positions for personal gain.
      - CATALYST demonstrated organizational weakness by falling short of their 10,000-vote prediction by more than 66%.

