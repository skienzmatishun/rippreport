  a-decade-of-corruption:
    refined_source: e59dbc51fe075f945030e8f60e1a2cde30c1eeb5afb02e8bffdc2efc06ee372b
    brief: |-
      THE CONFLICT:
      *   In 2010, State Senator Tripp Pittman and Fairhope Mayor Tim Kant secured a $636,000.00 bid for BP Boom work in Baldwin County.
      *   The County Commission told Pittman and Kant not to proceed on May 8th, 2010.
      *   The Fairhope City Council awarded a contract to Pittman Tractor on June 4th, 2010, resulting in a check for $372,165.90.
      *   Pittman operated without a general contractors license, marine insurance, or county/ethics approval.
      *   Pittman maintained a debris contract with the City of Fairhope for over 8 years until Karin Wilson was elected.
      *   Pittman legislatively changed Sheriff qualifications, enabling two unopposed re-elections in Baldwin County.

      THE DISCOVERY:
      *   Article 2 revealed a decade of blatant political and judicial corruption in Baldwin County, impacting Fairhope.
      *   The common denominator identified across various issues (Mega Site, McSharry case, Spanish Fort, etc.) is the political group "CATALYST."
      *   No politician, attorney, or judge was held accountable, arrested, or indicted for a crime in the 10-year period described.

      THE PIVOT:
      *   Article 2 establishes a historical record of systemic corruption by "CATALYST" players (Pittman, Kant, etc.) in Baldwin County.
      *   Article 1 utilizes this history by framing the current GOP runoff election (July 14th, District 1 seat) as a necessity to vote out "CATALYST Players."
      *   Bradley Byrne endorses Jerry Carl to oppose CATALYST.

      KEY ENTITIES:
      *   Jerry Carl
      *   Bradley Byrne
      *   Tripp Pittman
      *   Tim Kant
      *   Karin Wilson
      *   BP
