  JUDGE-VS-SHERIFF:
    brief: 'THE CONFLICT:

      * **Lagniappe v. Mack (2021):** Lawsuit filed against Baldwin County Sheriff
      Huey "Hoss" Mack for withholding bodycam footage of Deputy Matt Hunady shooting
      an unarmed motorist on I-10.

      * **Court Ruling:** The Alabama Supreme Court ruled that the video was not public
      record and was protected as a privileged communication. Associate Justice Greg
      Shaw wrote the majority opinion; Chief Justice Tom Parker dissented.

      * **Sheriff Qualifications Law (Senate Bill 312):** Roughly ten years prior
      to 2021, Senator Trip Pittman sponsored legislation requiring sheriffs to meet
      "above the minimum standards." This allowed Sheriff Hoss Mack to eliminate competition
      and secure his position for two terms; Baldwin County was the only county in
      Alabama with this rule.

      * **B/P Money:** Three years before SB 312 (approximately 2015), Pittman awarded
      himself $750,000 of BP money.

      * **BCSO Internal Investigations:** The Baldwin County Sheriff’s Office maintains
      a Major Crimes Division to investigate its own cases, meaning the department
      has never been held responsible for misconduct or officer-involved killings.

      * **Election Manipulation Allegations:** The main article cites a history of
      "rigged elections," fixed qualifications, and absentee boxes regulated by the
      "GOB" (Good Ole Boys).


      THE DISCOVERY:

      * **Current Dispute:** Sheriff Mack and District Attorney Robert Wilters have
      asked a judge to reverse his ruling compelling the Sheriff’s Office to return
      a car seized by deputies earlier this month.

      * **Intimidation Tactics:** The widget article describes "chicken shit intimidation
      tactics" used in Baldwin County when officials upset "the Boss." It states the
      judge was told his actions are unacceptable and he must reverse his decision
      "to the satisfaction of the Sheriff."

      * **Political Influence:** Sheriff Mack is noted to have "greatly influenced
      which judges got elected," creating a power dynamic where the court risks becoming
      a lackey for the sheriff and DA rather than an independent branch.


      THE PIVOT:

      * Article 2 serves as the "smoking gun" for Article 1 because it explicitly
      demonstrates the active political corruption and "unbridled power" Sheriff Mack
      exercises over the courts, which is the central argument in Article 1.

      * Article 1 calls for voting out incumbents (like current Sheriff Mack) to clean
      up a department "riddled with internal issues," but Article 2 proves that the
      current judicial system is already compromised by Mack’s influence, validating
      the main article’s call for accountability and transparency.

      * The connection between the 2021 Lagniappe ruling (Article 2) and the current
      car dispute (Article 2) shows a consistent pattern of the Sheriff using his
      power to override legal mandates and intimidate judges, supporting Article 1’s
      narrative that "the BOSS is the BOSS."


      KEY ENTITIES:

      * **Huey “Hoss” Mack** (Baldwin County Sheriff)

      * **Robert Wilters** (Baldwin County District Attorney)

      * **Trip Pittman** (Senator, sponsored SB 312; awarded $750,000 in BP money)

      * **Deputy Matt Hunady** (Involved in Lagniappe shooting incident on I-10)

      * **Lagniappe v. Mack** (2021 lawsuit regarding bodycam footage)

      * **Associate Justice Greg Shaw** (Author of majority opinion in Lagniappe ruling)

      * **Chief Justice Tom Parker** (Dissented in Lagniappe ruling)

      * **Matt McKenzie** (Candidate for Sheriff, endorsed by main article)'
