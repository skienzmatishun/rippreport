      to Lowery.

      - District Attorney Robert Wilters acted as judge in the trial of Murray Lawrence
      Jr. and recruited Kristi Hagood.

      - David Whitstone served as prosecutor/DA at the time of the Lawrence case.

      - Former DA Jon Gray and Scott Boone were paid to represent Kristi Hagood in
      a judicial campaign.

      - Kristi Hagood was elected Judge despite being deemed "not qualified" for the
      position.

      - Murray Lawrence Jr. was wrongfully convicted; Lowery, Mack, Wilters, Whitstone,
      and Hagood are accused of participating in his wrongful conviction without issuing
      any defense statements.


      THE DISCOVERY:

      - Hoss Mack is attempting to become head of ALEA (Alabama Law Enforcement Agency),
      which the report claims would be a "horrible mistake."

      - The Ripp Report states it personally notified ALEA about "Little Hoss" Mack''s
      plan.

      - Anthony Lowery had five times as much campaign money as his opponent Matt
      McKenzie but still lost; this is attributed to "money and GOB control" overriding
      merit.

      - Senator Chris Elliott has a secret ambition to become the Director of gaming
      for the State of Alabama, fueled by PAC money and dark money he keeps hidden.

      - A book regarding the Murray Lawrence case is with the publisher, and a TV
      documentary is in production.

      - Jon Gray and Scott Boone prioritized cashing their checks over conducting
      proper candidate research on Hagood.


      THE PIVOT:

      - The Main Article calls for Matt McKenzie to be voted for Sheriff against the
      "corrupt culture" of the BCSO and "internal issues."

      - The Widget article explains WHY the BCSO is corrupt by linking specific former
      leaders (Mack, Lowery) to the wrongful conviction of Murray Lawrence Jr.

      - The Widget proves that the current and past leadership of the BCSO was built
      on self-promotion using the Lawrence case for political gain, directly justifying
      the Main Article''s demand for a "clean up" rather than supporting incumbents.

      - The Widget identifies Hoss Mack as the root cause ("Mack will be Lowery’s
      downfall") and provides concrete evidence of judicial malfeasance that the Main
      article only vaguely references as "internal issues."


      KEY ENTITIES:

      - Anthony Lowery (former Sheriff, low key investigator in Lawrence case)

      - Matt McKenzie (current candidate for Sheriff)

      - Hoss Mack (former Sheriff, seeking ALEA leadership)

      - Robert Wilters (DA who judged Lawrence trial)

      - Kristi Hagood (elected Judge, accused of judicial malfeasance)

      - Murray Lawrence Jr. (victim of wrongful conviction)

      - Jon Gray and Scott Boone (Hagood''s paid consultants)

      - David Whitstone (former DA/prosecutor in Lawrence case)

      - Chris Elliott (State Senator, aiming for gaming director role)'
