  sheriff-huey-boss-mack-secret-police-2:
    brief: 'THE CONFLICT:

      - May 12, 2017: Jonathan Victor (unarmed) shot to death by Baldwin County Deputy
      Matt Hunady on I-10; BCSO lacked crisis intervention teams and de-escalation
      training per Sheriff Mack''s admission.

      - March 5, 2018: Robert Yates shot to death by BCSO SWAT; >114 rounds fired
      after one warning shot; not exigent emergency; Deputy Justin Correa (son of
      Robert Correa) alleged "gonna go in and kill this f*cker if I have to"; video
      described as "selective."

      - 2020–2021: BCSO received >$65M funding; $700K on body/vehicle cameras pitched
      as "accountability/transparency" while accountability was undermined.

      - 2021: General fund rose $39.8M → $47.5M (19.2%); BCSO flat-funded at $33.6M
      despite budget growth.

      - Sheriff Huey "Hoss" Mack served BCSO since 1989, in office since 2007; retired
      ~2024 to become Executive Director of Alabama Sheriffs Association; Governor
      Kay Ivey appointed Anthony Lowery as successor in 2024.


      THE DISCOVERY:

      - September 24, 2021 (Lagniappe v. Mack et al., Ala. Supreme Court): Court held
      law-enforcement investigative files exempt from public records under § 12-21-3.1(b)
      even after case closure; denied Lagniappe''s ORA request for Victor body/dash
      cam, 911 audio, photos, autopsy, and communications.

      - Chief Justice Tom Parker: "end of public access to law-enforcement records
      that are connected in any way to an investigation … the statute might as well
      be titled the Closed Records Act."

      - Alabama Press Association Chief Legal Counsel Dennis Baily: ruling would reduce
      access to body cam video, 911 transcripts, and autopsy info available elsewhere.

      - This sealed off public scrutiny of BCSO misconduct, including the Lawrence
      wrongful conviction case (Murry Lawrence Jr., life without parole for a murder
      with no physical evidence, DNA, fingerprints, or murder weapon; multiple alibi
      witnesses).


      THE PIVOT:

      - Article 1 (May 2026 primary) frames "change from career politicians" and attacks
      incumbent Sheriff Huey Mack''s record of unaccountable killings and self-investigated
      misconduct.

      - Article 2 (2021 Lagniappe ruling) is the smoking gun because it legally locked
      down the only mechanism for public access to BCSO evidence (body cams, recordings,
      autopsies), shielding Mack, Lowery, Wilters, Whetstone, and others from scrutiny.

      - It explains why "accountability" rhetoric is hollow: even if citizens demand
      records of deadly-force or wrongful convictions, the law now prevents it until
      after indefinite delay.

      - It connects directly to the 2026 race: Anthony Lowery (appointed by Ivey in
      2024) and District Attorney Robert Wilters are both still in power from the
      very case system that produced Mack''s scandals; the primary fight over "change"
      is undercut because the legal barrier preventing public oversight was established
      by the Lagniappe decision.


      KEY ENTITIES:

      - Huey "Hoss" Mack (BCSO Sheriff, 1989–2024)

      - Anthony Lowery (BCSO Chief Deputy 2018–2024; Appointed Sheriff 2024; Running
      in May 2026 primary against Matt McKenzie)

      - Robert Wilters (Baldwin County District Attorney ~2015–present; Presiding
      Circuit Court Judge in Murray Lawrence case)

      - David Whetstone (Baldwin County DA, former prosecutor in Lawrence case)

      - Jonathan Victor (Victor of May 2017 I-10 shooting)'
