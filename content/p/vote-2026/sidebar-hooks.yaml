  letter-to-ag-elections:
    brief: 'THE CONFLICT:

      - Baldwin County Sheriff Huey "Hoss" Mack served as top law enforcement officer
      for approximately 17 years (retired July 2024) to become executive director
      of the Alabama Sheriffs Association.

      - Mack''s departure was mid-term; he resigned to seek another political position
      (executive director role).

      - Governor Kay Ivey appointed Anthony Lowery to fill the vacancy effective September
      1, 2024. Lowery had ~20 years at BCSO (Civil Affairs Commander 2007, Chief Deputy
      2018).

      - Ripp Report claims BCSO built a "culture of absolute immunity" with no transparency
      or accountability; BCSO investigates itself via the Major Crimes Division.

      - Culture attributed to Mack and passed to Lowery: self-investigation, suppressed
      exculpatory evidence, wrongful convictions (example: Murray Lawrence Jr., 20+
      years in prison for a murder he did not commit; Lowery was lead investigator).

      - Political "good ole boy" cabal described as Stacy/Elliott/Haygood, then "Catalyst,"
      now Scott Boone Consulting, controlling county office elections.


      THE DISCOVERY:

      - May 17, 2026 letter to Alabama Secretary of State Wes Allen and Director of
      Elections Jeff Elrod by Francis Paul Ripp (33 years of experience).

      - Letter states the primary election cycle had "more public participation than
      in any election in 20 years plus," with most attention on the Sheriff''s race.

      - The Ripp Report claims it has been "in contact with the Sec of State in reference
      to suspected and strongly alleged reports of elections being fixed involving
      numerous races in Baldwin County, in the past."

      - Letter notes the sheriff is the custodian of ballot boxes, which "raises red
      flags right away" given 20-year BCSO culture of no transparency/accountability.

      - Elrod allegedly explained safeguards in place and advised Ripp to follow up
      with Baldwin County officials (Ripp claims this was done).

      - Ripp asks Allen/Elrod to take complaints of voter fraud in any Baldwin County
      primary election seriously, citing "33 years of experience" as reason for caution.


      THE PIVOT:

      - Article 1 frames the May 19 primary as a chance to break the "Good Ole Boy
      culture" and end a "20 year culture of BCSO" with no transparency or accountability.
      It urges voters to support Matt McKenzie (vs. Lowery) for Sheriff and other
      anti-incumbent candidates, and warns voters to watch for "alleged rigged elections,
      fixed qualifications and absentee boxes regulated by the GOB."

      - Article 2 is the smoking gun because it formally documents Ripp''s direct
      contact with the state election officials about suspected past election-fixing
      in Baldwin County, tying the same BCSO custody-of-ballots problem to actual
      voter fraud allegations. It converts the "conspiracy" language of Article 1
      into a documented request for investigation by the Secretary of State, giving
      concrete credibility and an official channel (Wes Allen / Jeff Elrod) for the
      complaints that Article 1 only alludes to.


      KEY ENTITIES:

      - Francis Paul Ripp (Ripp Report author/33 years experience)

      - Anthony Lowery (appointed Baldwin County Sheriff, Aug/Sept 2024; former Chief
      Deputy)

      - Huey "Hoss" Mack (former Baldwin County Sheriff, ~17 years; resigned July
