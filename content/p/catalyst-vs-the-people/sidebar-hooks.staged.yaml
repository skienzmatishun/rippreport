    brief: |-
      THE CONFLICT:
      *   Judge Bill Scully was appointed to the Veterans Court in Baldwin County.
      *   Judge Scully later secured a District Court appointment.
      *   Scully's appointment was significantly aided by Michelle Thomason, identified as "Catalyst Queen."
      *   Scully subsequently acted outside his judicial authority on February 26th by signing an order of Ejectment against Robert Yates, Jr.
      *   This erroneous order led to a shootout between Yates and Sheriff’s deputies, resulting in Yates’ death.
      *   Scully also ignored Alabama Legislature's 2011 interlock law for first-time DUI offenders.
      *   Brian Dasinger is running to challenge Scully despite the "silent rule" against challenging sitting judges.

      THE DISCOVERY:
      *   In Baldwin and Mobile Counties, judgeships are typically filled by closed committee appointments.
      *   A silent rule dictates that sitting Judges (even appointed ones) shall not be challenged in elections.
      *   Scully's initial appointment utilized connections through Catalyst and Michelle Thomason.

      THE PIVOT:
      *   Article 2 establishes the political structure (appointed, uncontested judges, Catalyst influence) which enables the behavior detailed in Article 1 (Scully overextending authority, ignoring the law, and evading public challenge).
      *   Scully's unchallengeable status, protected by Catalyst, allows him to violate judicial authority (e.g., issuing ejectment orders) and ignore mandatory DUI laws.

