  whose-agenda:
    brief: |-
      THE CONFLICT:
      Former Fairhope Mayor Can’t was defeated in 2016, leading to documented instances of suspicious hanger lease bids at the Fairhope Airport involving Captain Jack Burrell.

      THE DISCOVERY:
      Article 2 (older context) details resolutions from March 8th, including the authorization for Mayor Karin Wilson to purchase the K-1 Center from the Baldwin County Board of Education; a half-million dollar dredging contract involving the Fairhope Yacht Club; and a Change Order No. 2 for Library Envelope Repairs (Bid No. 005-18) awarded to MW Rogers Construction Co., LLC, implicating former Mayor Can’t, Jennifer Fidler, and Council President Jack Burrell.

      THE PIVOT:
      Article 2 establishes a historical pattern of non-transparency and questionable decision-making (e.g., dredging contract, library repairs, executive sessions) by Council President Jack Burrell and former administration figures, providing context for the ongoing control tactics (isolating the City from the Airport Authority title) and opaque financial practices (7 cents on the dollar fuel income) highlighted in Article 1.

      KEY ENTITIES:
      Jack Burrell (Council President), Karin Wilson (Mayor), Joe McEnerney (Authority Board President), Can’t (Former Fairhope Mayor), Jennifer Fidler, Fairhope Airport Authority, City of Fairhope, FAA, Baldwin County Board of Education, Fairhope Yacht Club, MW Rogers Construction Co., LLC.
    llm_text: Former Mayor Can’t, Jennifer Fidler, and Council President Jack Burrell faced scrutiny over MW Rogers construction and suspicious Fairhope Airport hanger lease bids. See how these historical non-transparent decisions now impact the City's finances and the Airport Authority.
