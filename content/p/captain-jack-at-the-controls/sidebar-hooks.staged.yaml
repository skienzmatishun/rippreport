  knock-on-doors:
    brief: |-
      THE CONFLICT:
      - Fairhope Airport Authority operated under control of Fairhope Council President Jack Burrell (referred to as "Captain Jack").
      - Former Fairhope Mayor Can't defeated in 2016.
      - Documents presented to Ripp Report regarding suspicious hangar lease bids.
      - Jack Burrell allegedly received free air miles and golf vacations from a board member while overseeing the bid process for that same board member.
      - Authority receives 7 cents on the dollar as fuel income from lease holders with no records of usage.
      - Fixed Based Operator does not share fuel consumption data with the Authority.
      - Jack Burrell allegedly failed to reveal a Police Report during the last election.
      - Airport Authority subsidized by City of Fairhope but refuses to allow City to gain title to the Airport.
      - Authority Board President Joe McEnerney reminded by Burrell that Burrell is "at the controls."
      - Millions in federal development dollars used to expand runways; no public long-range plan presented.

      THE DISCOVERY:
      - Baldwin County Commission and local officials are not actively recruiting manufacturing for North Baldwin mega site.
      - County relying on passive recruitment ("waiting for the phone to ring") rather than active sales ("knocking on doors").
      - 200 job gain in 2018 offset by 200 job loss, resulting in no net gain.
      - No car plants or airplane industry support manufacturing secured despite North Baldwin location suitability.

      THE PIVOT:
      - Both articles identify a pattern of unaccountable local authority bodies (Airport Authority / Baldwin County Commission) making decisions without transparency or public oversight.
      - Article 2 establishes background context of economic mismanagement and passive leadership in Baldwin County that parallels the "Captain Jack" control issues at the Airport Authority.

      KEY ENTITIES:
      - Jack Burrell ("Captain Jack")
      - Joe McEnerney
      - Former Mayor Can't (defeated 2016)
      - Fairhope Airport Authority
      - City of Fairhope
      - Baldwin County Commission
      - North Baldwin mega site
      - Fixed Based Operator (FBO)
    llm_text: Jack Burrell took Fairhope Airport Authority from "Captain Jack" control to taxpayer loss, while Baldwin County Commission sits passive as North Baldwin jobs vanish. It is time for voters to demand accountability before federal dollars fund another opaque expansion.
