hooks:
  goat-hill-piggy-bank:
    brief: |-
      THE CONFLICT:
      1. Former Fairhope Mayor Can’t was defeated in 2016.
      2. Baldwin County was taxed without voter consent by County Commissioner Chris Elliott, who raided $200,000 annually from the 1% school tax.
      3. Baldwin County contributes approximately 35% of the state general budget but its elected officials support the interests of Goat Hill, Gulf Shores, and Orange Beach.

      THE DISCOVERY:
      1. Baldwin County operates as a "piggy-bank" for powerful developers (Goat Hill) and the Business Council of Alabama.
      2. Local governance in Gulf Shores and Orange Beach operates like a "dictatorship," prioritizing developers over public representation.

      THE PIVOT:
      1. Article 2 establishes a historical pattern of local elected officials prioritizing powerful development interests (Goat Hill/Business Council) over taxpayer accountability and transparent governance.
      2. Article 1 demonstrates this same pattern in Fairhope, where Jack Burrell (Fairhope Council President) maintains control of the Airport Authority, isolates the City from participation, and manages suspicious hanger leases without public accountability.

      KEY ENTITIES:
      1. Jack Burrell (Fairhope Council President)
      2. Joe McEnerney (Authority Board President)
      3. Can’t (Former Fairhope Mayor)
      4. Chris Elliott (Baldwin County Commissioner)
      5. Fairhope Airport Authority
      6. Baldwin County
      7. Goat Hill
      8. Gulf Shores
      9. Orange Beach
    llm_text: Chris Elliott drained $200k annually from Baldwin County school taxes to support developer interests in Goat Hill and Gulf Shores. This pattern of unaccountable power continues in Fairhope, where Council President Jack Burrell controls the Airport Authority without public oversight.
