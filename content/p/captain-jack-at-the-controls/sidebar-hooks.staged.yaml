  gold-star-2:
    brief: |-
      THE CONFLICT:
      - 2016: Former Fairhope Mayor Can’t was defeated in election.
      - Post-2016: Documents regarding Fairhope Airport Authority hanger leases presented to the Ripp Report; revealed suspicious handling of bids.
      - Captain Jack (Fairhope Council President Jack Burrell) received free air miles and golf vacations from an Airport Authority board member while overseeing the hanger bid process for the same board member.
      - Joe McEnerney, Fairhope Airport Authority Board President, was reminded by Captain Jack that he is at the controls.
      - Fairhope Airport Authority operated under Captain Jack's control; City of Fairhope subsidized the Authority but did not gain title to the Airport.
      - No specific long-range airport plan presented to public; hangers offered on long-term leases.
      - Millions in federal development dollars expanded airport with additional runways.
      - Authority received 7 cents per dollar fuel income from lease holders; no records of usage; Fixed Based Operator did not share gallons consumed; no billing trail.

      THE DISCOVERY:
      - Article 2, "GOLD STAR," older/background: Fairhope received a gold star; article said it deserved it.
      - Gold Star article coincided with movie "The Friend" being shot in Fairhope; produced national exposure for Fairhope.
      - Expected more tourists and newcomers to Baldwin County.
      - Article stated it was too late to "bitch about the growth and traffic and schools"; time to act.
      - County Commission and 14 municipalities of Baldwin County needed to align on Sewers, Zoning, Traffic and Schools.
      - Education issue: class size swelling; teachers working as fundraisers "FOR SCHOOL SUPPLIES"; portables necessary.
      - Over 5,000 students in five Fairhope schools; growing every month.
      - Fairhope City Council responsibility: decide whether to support schools through a TAX or use Equitable School Funding Plan proposed by the Mayor.
      - Council could vote immediately for desired funds: 1.88 million.
      - Decision should be made after community weighs in; principals, teachers, parents, constituents should demand at least two public forums before decision.

      THE PIVOT:
      - Article 2 is older than Article 1; frame as background/historical context.
      - Gold Star article content on Fairhope growth, tourism, and city council decisions provides context for Article 1 airport authority conflict.
      - City council's school funding decision (1.88 million; TAX vs Equitable Plan) parallels Jack Burrell/Captain Jack's control of the Airport Authority.
      - Article 2 is the smoking gun/key context for Article 1 because it establishes the growth and governance context that frames the later transparency/accountability issues.

      KEY ENTITIES:
      - Jack Burrell / Captain Jack / Fairhope Council President
      - Fairhope Airport Authority
      - Joe McEnerney / Airport Authority Board President
      - Can’t / former Fairhope Mayor
      - Ripp Report
      - Fairhope City Council
      - City of Fairhope
      - FAA
      - Fixed Based Operator
      - Baldwin County
      - Fairhope schools / five schools / 5,000+ students
      - Mayor of Fairhope / Equitable School Funding Plan
      - The Friend (film)
      - Times article / Catalyst
      - Lowery, Wilters
    llm_text: Fairhope Mayor Can’t lost in 2016, but Captain Jack Burrell took control of the Airport Authority. Now documents show Joe McEnerney got free air miles and golf vacations while Jack oversaw his hanger bids, and Fairhope subsidized the airport without real oversight.
