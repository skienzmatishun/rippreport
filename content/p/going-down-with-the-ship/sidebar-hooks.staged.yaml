      THE CONFLICT: Former Mayor Jim Nix was forced out for alleged criminal activity; Nix SELECTED Tim Kant to replace him, leading to Kant serving four terms (1983 hire, 2000 Mayor); Arthor Corte is a Jim Nix fan.
      THE DISCOVERY: Mayor Kant's ascent was non-democratic (selected, not elected), resulting in systemic corruption (e.g., $5-6 million soccer field cost, non-public $5000/year municipal lease), and poor infrastructure over four terms.
      THE PIVOT: Article 2 establishes that the current political regime (Kant/Corte/Nix influence) is based on controlled selection and corruption, providing the historical context that explains the current financial mismanagement (Gulf Quest $42 million, $400k past due) and the political pressure surrounding the Fly Creek Apartments push involving Angelo Corte and Diana Brewer.
