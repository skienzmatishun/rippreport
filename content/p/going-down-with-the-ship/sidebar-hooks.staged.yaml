  as-long-as-i-count-the-votes-what-are-you-going-to-do-about-it:
    brief: |-
      THE CONFLICT: Fairhope Municipal Elections were subject to observations of alleged fraudulent behavior and violations, documented on 9/11/2012.
      THE DISCOVERY: The 9/11/2012 observations named Tom Odom (Kant Poll Watcher, Fire Marshall, Father-in-Law of Tim Kant) for dual roles, noted lack of control of voting machines by Election Supervisor Mrs. Culver, and highlighted that poll watchers were not allowed to monitor final machine opening and tape certification.
      THE PIVOT: The 2012 allegations of election impropriety establish a historical context of suspicion regarding the political operations of Tim Kant and his allies, which subsequently correlates to current political maneuvering (Fly Creek Apartments) and municipal financial mismanagement (Gulf Quest Museum, $42M cost, $400k+ past due utilities).
      KEY ENTITIES: Tim Kant, Mr. Angus Cooper, Mr. Angelo Corte, Diana Brewer, Jennifer Fiddler, Tom Odom, Hand Arendall, Gulf Quest Maritime museum, Fairhope, Fly Creek Apartments, $42 million, $28 million, $400,000.
