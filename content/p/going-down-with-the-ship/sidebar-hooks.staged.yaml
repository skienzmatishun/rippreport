  round-and-round-we-go:
    brief: |-
      THE CONFLICT:
      *   Fairhope lost a Supreme Court case involving Planning and Zoning, costing hundreds of thousands in taxpayer money (attorneys Hand Arendall won).
      *   Gulf Quest Maritime museum, funded by $28 million in taxpayer money, has over $400,000 in past due utility bills.
      *   Fly Creek Apartments are being pushed by Angelo Corte, a Tim Kant fan, despite 98% opposition (meeting on October 3rd).
      *   Mr. Angus Cooper supported EX Mayor Kant and facilitated free football practice ($35,000 value) for Fairhope facilities.

      THE DISCOVERY:
      *   The intersection of Highway 13 and Fairhope Avenue (13/48) is partially in Baldwin County and partially in the City of Fairhope.
      *   Fairhope holds extra territorial jurisdiction (ETJ), meaning the City of Fairhope issues building permits and has subdivision authority over the property, even if it is in the county.
      *   The corner parcel is currently un-zoned, a decision made by voters.
      *   The right-of-way acquisition process for the roundabout allowed the remaining parcel to be sold to a new owner who operates gas stations in Baldwin County.

      THE PIVOT:
      *   The ETJ and un-zoned status (Article 2) demonstrate the City of Fairhope's regulatory control over development, which is the legal context for the Planning and Zoning lawsuits and taxpayer losses (Article 1).
      *   The jurisdictional background highlights that local regulations limit the City's ability to object to permits if requirements are met, constraining the City's ability to stop projects like Fly Creek or prevent financial drains like the Gulf Quest debt.

      KEY ENTITIES:
      *   Angelo Corte
      *   Tim Kant
      *   Jennifer Fiddler
      *   Angus Cooper
      *   Diana Brewer (Fairhope Councilwoman)
      *   Hand Arendall
      *   Chris Elliott (Baldwin County Commissioner)
      *   Fairhope
      *   Gulf Quest Maritime museum
      *   Fly Creek Apartments
      *   Highway 13/Fairhope Avenue (13/48)
    llm_text: Fairhope lost a Supreme Court case costing taxpayers hundreds of thousands, and Gulf Quest has $400k in utility debt. Despite extra territorial jurisdiction over Highway 13/Fairhope Avenue, the City cannot stop projects like Angelo Corte's Fly Creek Apartments.
