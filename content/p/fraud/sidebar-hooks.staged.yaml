  pay-off-and-election-fraud:
    brief: |-
      THE CONFLICT:
      *   Fairhope was sued for fraud multiple times, including the Dyas 'triangle lawsuit.'
      *   On January 29, 2011, Mayor Tim F. Kant and attorneys lied to the public about not paying legal fees in the Dyas lawsuit.
      *   The city settled the Dyas lawsuit by purchasing the Dyas property, which was falsely advertised as a park, spending over two decades.
      *   Fairhope paid $3 million in combined legal fees to Hand-Arendall.
      *   In an October 30, 2015 deposition, Mayor Tim F. Kant admitted receiving a promissory note loan from Bobby Faust.

      THE DISCOVERY:
      *   A 9/11/2012 observation report documented election irregularities during the Mayoral Candidate Lonnie Mixon campaign.
      *   Judge sealed court case #901403, a land dispute in Fairhope involving supporters of Mayor Tim Kant.
      *   Article 2 alleges Mayor Tim Kant accepted money from Bobby Faust, an interested party in the sealed land dispute, citing loan documents.
      *   Election Supervisor Mrs. Culver and Tom Odom (Fire Marshall/Poll Watcher) were involved in procedures where watchers were denied access to voting machine tapes and tape certification (violating Alabama Code Section 11-46-35d).

      THE PIVOT:
      *   Article 1 established Mayor Kant's connection to Bobby Faust regarding the Dyas lawsuit via a 2015 deposition.
      *   Article 2 provides earlier, specific proof (9/11/2012 observation report and sealed case #901403) linking Faust to a land dispute and corroborates the acceptance of money from Faust, framing the alleged financial relationship as predating the Dyas litigation context.
      *   Article 2 expands the alleged corruption scope from just property litigation (Dyas) to documented election fraud and lack of transparency in voting procedures.

      KEY ENTITIES:
      *   Mayor Tim F. Kant
      *   Bobby Faust
      *   Hand-Arendall
      *   Dyas Property (Triangle)
      *   Senator Pittman
      *   Sherry Sullivan
      *   Lonnie Mixon
      *   Tom Odom
      *   Mrs. Culver
