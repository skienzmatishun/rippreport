  no-more-silence-we-want-answers:
    brief: |-
      THE CONFLICT:
      *   Fairhope was sued for fraud; Mayor Tim F. Kant allegedly misled citizens regarding the Dyas 'Triangle lawsuit' settlement.
      *   On January 29, 2011, Mayor Kant and attorneys held a public event lying to the public that the city would not pay legal fees for the Dyas 'triangle lawsuit'.
      *   The city paid $3 million in combined legal fees to Hand-Arendall.
      *   The city settled the Dyas lawsuit by purchasing the Triangle property but the Mayor falsely told residents the purchase was for a park.
      *   In an October 30, 2015 deposition, Mayor Tim F. Kant admitted to receiving a promissory note loan from Bobby Faust but denied having written communication about it.
      *   There are two pending BP fraud charges concerning Mayor Kant and Senator Pittman regarding unsecured anchors and rope left in the bay.
      *   Lawsuits for Publix and Fly Creek Apartments cost the city hundreds of thousands of dollars in legal fees handled by Hand-Arendall.
      *   The Mayor planned "faux candidates" for Mayor and Council, including Sherry Sullivan.

      THE DISCOVERY:
      *   The Triangle lawsuit settlement cost the city $12 million, including $3 million from the utility fund and a $5.25 million bank loan, with the court ruling the city must pay its own legal fees.
      *   The city's municipal insurance carrier dropped coverage and sued the city and Mayor Kant for fraud following the Triangle settlement.
      *   The $10 million sewer system upgrade is described as a "band-aid," with the plant still discharging processed sewage into the bay during heavy rain overflows.
      *   The soccer field complex on Manley Road, originally $2 million, is approaching $6 million and is deficient in amenities (bleachers, bathrooms).
      *   Mayor Kant serves as both Mayor and Utility Director, accruing a pension based on 30 years of employment.
      *   The Mayor eliminated the Finance Committee, Tree Committee, and Environmental Committee at the beginning of the last term.
      *   The city spent approximately $20 million on lawsuits and parks over the last four years while providing only $294,000 to schools in the current year.
      *   The city lost a lawsuit regarding the Publix filling Fly Creek with mud, destroying wetlands and trees, costing hundreds of thousands of dollars.
      *   Mayor Kant borrowed $100,000 from the fire department ($50k) and a city employee ($50k) to invest in a private company, which was lost without repayment.

      THE PIVOT:
      *   The Widget Article confirms and expands upon the fraud claims from Article 1, specifically by establishing the true cost of the Triangle settlement ($12 million, not just the $3 million legal fees mentioned in Article 1) and revealing that the city’s insurer is now suing the city and the Mayor for fraud related to that same settlement.
      *   It provides broader context by documenting systemic municipal failures (environmental negligence, massive spending on non-essential projects like parks/lawsuits vs. schools, misuse of utility funds, and elimination of oversight committees) that support the allegation of corruption and misuse of public funds by Mayor Kant.

