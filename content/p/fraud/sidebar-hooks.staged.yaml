  catalyst-council-lawsuits:
    brief: |-
      THE CONFLICT:
      *   Fairhope was sued for fraud, specifically in the Dyas 'triangle lawsuit'.
      *   On January 29, 2011, Mayor Tim F. Kant and attorneys falsely told the public the city would not pay legal fees for the Dyas lawsuit.
      *   The city ultimately settled the Dyas lawsuit by purchasing the property, spending over two decades fighting, and paid $3 million to Hand-Arendall.
      *   Mayor Kant told residents the Dyas property purchase was for a park, despite being a litigation resolution.
      *   In October 30, 2015, Mayor Tim F. Kant admitted to receiving a promissory note loan from Bobby Faust.
      *   Former Mayor Tim Kant also halted the Breland project and changed zoning rules over 12 years prior.

      THE DISCOVERY:
      *   Fairhope's insurance company refused to cover legal expenses for the Triangle lawsuit because municipal decisions caused the suit.
      *   City Attorney Cain O'Rear promised the council no dollar would be spent on attorney fees for the Triangle case, contrary to the $3 million paid.
      *   Councilman Jack Burrell and Mayor Tim Kant rejected a settlement of approximately $600,000 roughly 12 years ago, leading to a final cost of $11.25 million plus interest.
      *   Current Mayor Jane Wilson attempted to settle the Breland dispute three years prior to the article's publication, but Councilman Jack Burrell refused.
      *   The court validated the insurance company's claim that the lawsuit was arbitrary and capricious, forcing Fairhope to cover attorney costs potentially exceeding $1 million.

      THE PIVOT:
      *   Article 2 transforms the narrative from individual Mayor Kant fraud (lies about the park/loan) to systemic municipal failure and ongoing political obstruction by Councilman Jack Burrell, who blocked reasonable settlements (Breland, Triangle) to protect personal interests (e.g., near his adjacent property).
      *   The refusal to negotiate reasonable settlements, as evidenced in the Breland case, is the direct cause of multi-million dollar liabilities for taxpayers, directly contextualizing the financial mismanagement alleged in the Dyas lawsuit.

