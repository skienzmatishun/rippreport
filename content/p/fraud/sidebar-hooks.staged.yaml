      *   Pittman admitted poor judgment but continued bidding on Fairhope debris removal contracts.
      *   The Mayor claimed an Ethics Commission letter was permission for Pittman, but it was only an opinion, and the commission did not exonerate them from BP Fraud claims.

      THE PIVOT:
