      *   The acquisition involved a base purchase price of $8.7 million, plus legal fees exceeding $2 million.
      *   The city faced $1 million in assessed violations from the tree committee regarding the Publix Project environmental damage.
      *   The city is seeking major financial aid, including $19 million for Fly Creek Restoration Project Number Three and a total of $500 million from BP.

      THE DISCOVERY:
      *   Article 2 established that the Triangle property purchase was a massive financial undertaking, with an effective cost of at least $11 million.
      *   It revealed that the city was dealing with significant environmental liabilities, necessitating large-scale grant applications for projects like TTI Swamp.
      *   Article 2 confirms that Mayor Tim Kant was summoned to a federal grand jury in Mobile regarding grant fraud related to the BP boom scandal.
      *   It indicated the ongoing financial strain on the city, with the city’s insurance company filing a second lawsuit due to previous legal costs.

      THE PIVOT:
      *   Article 2 provides the financial backdrop, showing the massive scale of the Triangle lawsuit ($11M+ cost) and the city's reliance on external funding (BP/grants).
      *   This establishes the high-stakes financial environment that allowed the alleged fraud and misleading public statements described in Article 1 to occur.
      *   Article 2 confirms the existence of grant fraud investigations (grand jury summons), contextualizing the later BP fraud charges mentioned in Article 1.

