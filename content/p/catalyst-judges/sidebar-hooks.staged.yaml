  baldwin-county-family-court-a-cottage-industry:
    brief: |-
      THE CONFLICT:
      Judge Michelle Thomason faced 6 complaints regarding her rulings (e.g., 50/50 custody decisions) over 18 months; these were dismissed by the Judiciary.
      Judge Bill Scully, appointed to Veterans Court, later secured District Court appointment utilizing political connections.
      On February 26th, Scully issued an illegal order of Ejectment against Mr. Robert Yates, Jr. in Mobile/Barnwell (District Court Judges lack this authority, only Circuit Court Judges do).
      This order led to a shootout between Yates and Sheriff's deputies, resulting in Yates’ death.
      Scully also ignored the 2011 Alabama Legislature interlock law, failing to mandate ignition interlocks for first-time DUI offenders (BAC > .15 or refusal to test).

      THE DISCOVERY:
      Article 2 revealed District Judge Michelle Thomason's problematic rulings in Baldwin County Family Court, leading to judicial reforms initiated by presiding Judge Floyd.
      These reforms included assigning answer/waiver divorces to circuit judges and moving Thomason's domestic violence dockets to specially assigned judges in 2017.

      THE PIVOT:
      Thomason’s influence and political backing (Catalyst Queen) were the primary mechanism used to secure Judge Bill Scully’s initial Veterans Court and subsequent District Court appointment.
      This initial political connection allowed Scully to bypass the "silent rule" against challenging appointed judges and subsequently abuse his judicial authority (e.g., illegal ejectment order), putting public safety at risk.

