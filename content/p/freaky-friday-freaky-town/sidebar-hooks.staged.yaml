  quid-pro-quo:
    brief: |-
      THE CONFLICT:
      *   Mayor Tim Kant has historically controlled the City Council, Planning and Zoning, and eliminated Finance, Environmental, and Tree Committees in Fairhope.
      *   Kant previously secured $50,000 from the Fairhope fire department and $50,000 from a city employee, which were invested in his private company and subsequently lost without accounting.
      *   The owner of the Publix shopping center land violated planning and zoning board conditions.
      *   This land owner caused massive damage to Fly Creek.

      THE DISCOVERY:
      *   Ripp Report #27 (January 12, 2015) exposed a "Quid Pro Quo" project involving Mayor Kant and the land owner.
      *   The land owner secured a new developer, Professional Equity Management (Scottsdale, Arizona), to build a 300-unit development above the damaged Fly Creek.
      *   The plan involved placing a new fire station on the same site (a dead-end county road, violating the comprehensive plan) to entice the developer.
      *   The owner and Mayor planned connectivity to Rock Creek Subdivision, which was denied publicly but planned for post-fire station installation.

      THE PIVOT:
      *   The 2015 'Quid Pro Quo' context establishes the historical pattern of Mayor Kant's influence and self-enrichment linked to land deals and zoning violations, making the later allegations (zoning for $2.5 million / $2.4 million) a continuation of the established corrupt system.
      *   Article 2 links the Fly Creek damage and zoning issues directly to the Mayor/land owner's plan for development and the fire station, providing the foundation for the Main Article's accusations of "zoning for dollars."

