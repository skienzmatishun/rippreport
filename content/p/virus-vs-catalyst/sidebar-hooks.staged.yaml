s like Hightower in the congressional race and to vote out all 5 CATALYST council members in the upcoming August 25, 2020, municipal elections.\n\nKEY ENTITIES: \n- Jerry Carl\n- Hightower\n- Scott Boone\n- Stacy\n- Elliott\n- Haygood\n- Chris Pringle\n- Wes Lambert\n- Dr. Sanjay Gupta"
