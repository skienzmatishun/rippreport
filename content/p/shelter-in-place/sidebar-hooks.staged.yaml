  danger-zone:
    brief: |-
      THE CONFLICT:
      - Main Article “SHELTER IN PLACE” reports: Stay home.
      - Main Article reports: Since the report below was posted, in less than 12 hours, number of cases rose by 136; deaths at 36.
      - Main Article reports: The Governor resisted giving the statewide order for “stay at home” or “Shelter in Place.”
      - Main Article reports: The Governor’s decision is based on the people pulling her strings.
      - Main Article reports: The author predicts that even the puppet masters will have to accept the inevitable and join the rest of the United States and stay home for a couple of weeks to reevaluate the situation.
      - Main Article reports: News Flash: You can catch the coronavirus in Church or at the Beach.
      - Main Article reports: In Baldwin County, each of the 14 municipalities is handling the virus independently.
      - Main Article reports: Bay Minette does very little and has a wait-and-see approach.
      - Main Article reports: Orange Beach has allowed large crowds on islands.
      - Main Article reports: Fairhope’s Mayor has written the Governor and implored her to institute a statewide “Shelter in Place,” while other municipalities remain mute.
      - Main Article reports: The author asks: Where is the PLAN? Where are the tests? Where are the ventilators?
      - Main Article reports: JUST ANNOUNCED ALABAMA WILL ORDER “Shelter in Place” Saturday. FINALLY, now.
      - Main Article reports: Cooperate. The life you save may be your own.

      THE DISCOVERY:
      - Widget Article “DANGER ZONE” reports: Highway 98 and Parker Road are becoming more dangerous with every passing day.
      - Widget Article reports: You can thank the CATALYST Fairhope City Council, former Fairhope Mayor Can’t, and property owner Angelo Corte, a CATALYST supporter.
      - Widget Article reports: The below listed complaint affects every motorist traveling through the intersection.
      - Widget Article reports: Please read this, it is what happens when you have politicians and developers in the same bed.

      THE PIVOT:
      - Article 2 is older than Article 1; frame it as background/historical context.
      - Article 2 showed/revealed local danger at Highway 98 and Parker Road.
      - Article 2 tied local political/development actors: CATALYST Fairhope City Council, former Fairhope Mayor Can’t, Angelo Corte, CATALYST supporter.
      - Article 2 is the smoking gun/key context for Article 1 because it documents local political/developer alignment before/around the pandemic response.
      - Article 1 conflict centers on Governor resistance, Baldwin County municipalities, Fairhope’s Mayor, Bay Minette, Orange Beach, and Alabama statewide order.

