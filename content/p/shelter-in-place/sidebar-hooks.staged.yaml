      THE DISCOVERY: Alabama is nationally ranked first in political corruption, and dead last in health, education, and job opportunities.
      THE PIVOT: This systemic lack of leadership and citizen apathy (identified in the older article) explains the Governor's initial resistance to a statewide "Shelter in Place" order and the fragmented, independent handling of the virus by the 14 municipalities in Baldwin County.
      KEY ENTITIES: Alabama; Governor; Baldwin County; Bay Minette; Orange Beach; Fairhope; Small Business Administration (SBA); 14 municipalities; $10,000.00 (SBA loan); Saturday (day statewide order was finally announced).
