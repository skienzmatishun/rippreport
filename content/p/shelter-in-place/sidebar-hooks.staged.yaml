    refined_source: 1758dfd4bfe5c164c6fc9d1d2284860582e5fc75593015db76c6201176cde52e
    brief: |-
      THE CONFLICT: Councilman Burrell Boone and "the three B’s" insisted on purchasing recreation land in Fairhope next to the airport, leading to a budget crisis, prior to the August 25th municipal election.
      THE DISCOVERY: Fairhope had to cut $2.6 million from its city budget (staff, police, fire, etc.) to compensate for anticipated COVD-19 income loss, stemming from the initial land purchase decision.
      THE PIVOT: The financial instability caused by the previous council (Article 2) exists concurrently with the public health crisis (Article 1), forcing Fairhope's Mayor to implore the Governor for a statewide "Shelter in Place" order, highlighting local municipal weakness during a state-level health emergency.
      KEY ENTITIES: Fairhope, Councilman Burrell Boone, $2.6 million, $9,000, Governor, Alabama, Baldwin County, Fairhope's Mayor, Bay Minette, Orange Beach, Saturday (when Alabama ordered "Shelter in Place").
    llm_text: Councilman Burrell Boone’s land purchase forced Fairhope to cut $2.6 million from city services. This budget crisis complicates the COVID-19 emergency, forcing the Mayor to plead with the Governor for a state-wide "Shelter in Place" order.
    text: Jack Burrell and Kevin Boone forced Fairhope to cut $2.6 million from city services for land deals. This budget crisis forced the Mayor to plead with Governor Kay Ivey for emergency orders.
