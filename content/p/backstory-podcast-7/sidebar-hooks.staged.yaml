  fairhope-sold-to-the-highest-bidder:
    brief: |-
      THE CONFLICT:
      - Fairhope, Alabama: Catalyst Council, Boone Burrell and Brown proposed $2.65 million purchase of recreation land during Fairhope budget process, supported by questionable appraisal, for recreation land not used for years.
      - Purchase of soccer fields described as corrupt from day one; Fairhope drained 5 accounts for purchase, let it sit idle for years, then blew $5+ million on substandard complex.
      - Council proposed repeat of same reckless process in middle of budget process.
      - In four years, Catalyst Council has not approved one budget on timely manner.
      - Council had no public participation related to recreation land purchase.
      - Cory Martin pleaded for council to listen to reason; drew dead silence.
      - Council ignored advice from Mayor or staff.
      - Mayor Wilson: purchase of 113 acres on 13/32 for future parkland will close in Nov.; drains all capital improvement funds needed for urgent facility needs and prevents adding four ballparks to fill immediate capacity need for up to ten years; no thought about re-purposing K-1 Center.
      - 2020 budget waiting approval, Fiscal Year 2020; Mayor Wilson objections; council reduced revenue projections; reworked with actual FY2019 revenue figures with very conservative estimates; sales tax came in higher than projected.

      THE DISCOVERY:
      - Article 2 revealed: Catalyst Council, Boone Burrell and Brown proposing $2.65M purchase; questionable appraisal; recreation land not used for years.
      - Council questioned why City expenses higher; combination of correcting expenses to appropriate departments, investing in grossly understaffed PD and cost of service in Public Works increasing.
      - Same council voted themselves full family insurance; tried to give away 105 acres, Triangle, that cost taxpayers $13 million as result of lost lawsuit; bought K-1 Center and has no money to spend on project.
      - Council putting capital improvements, infrastructure and sewer problems on back burner while purchasing raw property that will sit idle for years.
      - On top of budget issues, Fairhope at crossroad of density: 566 apartments coming, 300 to ? new homes, commercial locations key to draining downtown business.
      - 2020 municipal elections: Fairhope needs candidates not related to Catalyst; municipal judge and city attorney need replaced.

      THE PIVOT:
      - Article 2 is smoking gun/key context for Article 1 because it established pattern of Fairhope being sold out to developers, city council, appointed positions.
      - Article 2 described soccer fields purchase as corrupt from day one and said council repeating reckless process.
      - Article 2 showed no public participation, questionable appraisal, financial recklessness, Mayor Wilson objections.
      - Article 2 older than Article 1; frame as background/historical context for Article 1 Backstory Podcast #7 / Fairhope Sold to Highest Bidder.

