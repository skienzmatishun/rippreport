      *   Albritton is accused of self-dealing his family, totaling $120,000 (Main Article) or $105,000 (Widget Article).
      *   The trust trustees (Albritton, John Bell, Rick Clifton) are questioned regarding "scholarships" received by themselves or their friends.
      *   Oil was struck in Conecuh County around 2010.

      THE DISCOVERY:
      *   Between 2002 and 2018, Regions Bank brought in over $1 million for managing the Mabel Amos Memorial Fund.
      *   IRS 990 filings show Regions Bank averaged five hours of work per week on the fund, receiving nearly half of the scholarship distribution during that time.
      *   Leigh Manning (grandniece of Mabel Amos, Former Sec of State) hired Thomas Gallion to investigate the fund's handling.

      THE PIVOT:
      *   Article 2 establishes the historical context (2002-2018) and the specific financial relationship between Regions Bank and the trust, providing evidence of potential financial entanglement surrounding the 2010 oil strike in Conecuh County.
      *   It documents the initial amount of alleged self-dealing ($105,000) before the later complaint escalated to $120,000, framing Albritton’s actions as a long-standing ethical and legal problem.

