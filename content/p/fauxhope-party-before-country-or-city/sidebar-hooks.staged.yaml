  can-you-smell-it:
    brief: |-
      THE CONFLICT: Tim Kant ran Fairhope as a dynasty, characterized by lack of accountability, poor municipal ethics, and suspected rigged local elections. During 2015 and 2016, Fairhope utilities spent $10 million on non-utility expenses, alongside $13 million on a sewer plant upgrade that did not move the plant inland, resulting in ongoing environmental issues like runoff mud in Fly Creek and human waste spills into Mobile Bay.
      THE DISCOVERY: The period of Tim Kant's mayoralty revealed systemic municipal corruption, prioritizing non-infrastructure spending and development (e.g., Publix project, apartments on Fly Creek banks) over environmental protection, despite public and non-profit concern.
      THE PIVOT: Article 2 establishes the historical pattern of corrupt, unaccountable municipal governance under Kant, providing the context that led to the current political climate where residents (62% in Fairhope) prioritized political affiliation (Moore) over local facts and environmental integrity, thereby aiding Kant's legacy and empowering figures like Jack Burrell.
      KEY ENTITIES: Tim Kant, Karin Wilson, Jack Burrell, Roy Moore, Doug Jones, Publix project, Fly Creek, Mobile Bay, Baldwin County, Daphne, 2015, 2016, $13 million, $10 million, Mobile Baykeeper, Sec. Of State.
    llm_text: Tim Kant ran Fairhope as a dynasty, spending $10 million on non-utility costs and $13 million on a failing sewer upgrade. See how this systemic corruption damaged Fly Creek and Mobile Bay, shaping today’s political divide between residents and figures like Jack Burrell.
