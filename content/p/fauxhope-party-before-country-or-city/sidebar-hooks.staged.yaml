    brief: |-
      THE CONFLICT:
      *   Tim Kant ran a corrupt dynasty in Fairhope, characterized by no accountability, no transparency, and suspected rigging of local elections.
      *   Jack Burrell is cited as the successor to Kant, inheriting and continuing corrupt practices.

      THE DISCOVERY:
      *   During his five-year tenure as Fairhope City Council President, Jack Burrell leveraged the Fairhope Airport Authority for personal benefits, including having the Authority cover his attorney fees related to Ethics complaints.
      *   Burrell oversaw financial mismanagement, including the transfer of $10 million from city utilities to the general fund and the spending of $13 million on a sewer plant without adequate infrastructure funding.
      *   His position was a "job with benefits," guaranteeing security, control over bids (e.g., aircraft hangers), and protection from ethical violations by four loyal council members.

      THE PIVOT:
      *   Article 1 identifies the "Kant Factor" and "Jack Burrell" as the reason Fairhope is "Fauxhope" and politically stagnant; Article 2 provides the concrete, documented financial and structural proof of how Burrell’s alleged corruption operated via the Airport Authority and city finances.

