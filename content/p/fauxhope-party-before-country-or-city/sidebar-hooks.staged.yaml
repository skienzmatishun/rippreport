    brief: |-
      THE CONFLICT:
      *   2016 US Senate election: Roy Moore was denied the oath of office, but received 62% of the vote in Fairhope (30% turnout).
      *   Doug Jones received 37% in Fairhope; Daphne and Mobile County voted for Jones.
