      *   Burrell accepted free jet service via Ray Hix, a partner with Fairhope Municipal Judge Snedeker.
      *   Chunk Zunk, formerly of Fairhope Airport Authority (FAA), was appointed to a finance committee.
      *   Financial mismanagement includes a $10 million transfer from utilities to the general budget in 2015 and 2016.
      *   The $6 million soccer fields are substandard, not "world class."
      *   Burrell and Boone served on past administrations responsible for the airport mess and infrastructure issues.

      THE PIVOT:
      *   Article 2 provides concrete evidence (e.g., free jet service, FAA conflict, $10M transfer, substandard fields) of the systemic corruption and lack of accountability that Article 1 characterized metaphorically by stating "Jack Burrell is the new Kant."
      *   The political environment of corruption noted in Article 1 (Kant's dynasty) is shown to be a continuous pattern of governance under Burrell (Article 2).

