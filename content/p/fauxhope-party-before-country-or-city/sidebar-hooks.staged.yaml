    brief: |-
      THE CONFLICT: Tim Kant ran Fairhope as a dynasty resembling organized crime, characterized by no accountability or municipal ethics; prior council positions were typically rotated every 6 months.
      THE DISCOVERY: Jack Burrell has held the position of City Council President for 5 years, obstructing Mayor Karin Wilson; Lee Turner holds the conflicting roles of head of Planning and Zoning and head of Single Tax; Turner utilized his position and Burrell's support to circumvent procedures for the Tatumville Gully project (1 acre) and the Fly Creek Apartments development.
      THE PIVOT: Article 2 provides concrete evidence (5-year obstruction, Turner's dual role, specific project circumvention) that substantiates Article 1's claim that Jack Burrell is the "new Kant," moving the critique from generalized historical corruption to specific, ongoing abuses of power and lack of municipal ethics.
