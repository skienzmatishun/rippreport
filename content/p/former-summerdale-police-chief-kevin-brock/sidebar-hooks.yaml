  Baldwin-county-wrongful-conviction:
    brief: 'THE CONFLICT:

      - Summerdale Police Chief Kevin Brock (served 7 years) placed on administrative
      leave June 21, 2023 after criminal investigation by the Baldwin County Sheriff''s
      Office and the Alabama Attorney General’s Office into a property dispute involving
      false warranty deeds.

      - Fire was issued at summerdale council meeting; officially terminated July
      18, 2023 (NBC 15 update).

      - Kevin Brock and his wife, Dr. Lori Brock, indicted by Baldwin County Grand
      Jury in 2024/2025 on forgery charges: second-degree forgery and second-degree
      possession of a forged instrument (Baldwin County Jail mugshots; property fraud
      case filed by Baldwin County Sheriff’s Office).

      - Trial day September 8, 2025 at Bay Minette Courtroom — prosecutors dismissed
      all charges against Kevin Brock just before trial began. Lori Brock was found
      guilty on September 18, 2025 of felony possession of a forged instrument in
      the second degree; she was held at Baldwin County Detention Center.

      - WKRG News 5 reporter Debbie Williams covered both cases "salaciously," described
      by Ripp Report as Lowery’s "mouthpiece... going back to his time at the District
      Attorney''s Office."


      THE DISCOVERY:

      - Lagniappe Mobile October 4, 2023 article ("Digging Deep"): Advocates uncovered
      a second autopsy of murder victim Brandon Hastings (2003 Foley killing) that
      was ordered by DA David Whetstone and signed by the judge, but never revealed
      during Murray “Bubba” Lawrence Jr.’s 2005 trial.

      - Lawrence was convicted May 13, 2005, sentenced to life without parole at Baldwin
      County Superior Court; conviction rested entirely on coerced confession of lifelong
      friend Jarius McNeil (who had a plea deal) with no physical evidence tying Lawrence
      to the killing.

      - The undisclosed autopsy is a Brady Information violation and the basis for
      an AO 241 federal habeas petition filed by Maxwell Tillman Law Firm (Birmingham)
      — which later dropped Lawrence as a client in July 2025, forcing advocates to
      file pro se with the U.S. Supreme Court via Alabama Supreme Court denial without
      opinion.

      - The Lagniappe article frames it as proof of "corrupt Baldwin County judicial
      system" and self-investigating BCSO culture.


      THE PIVOT:

      - Article 2 (Lagniappe) shows that Baldwin County’s prosecutors, judges, and
      sheriff’s office systematically concealed exculpatory forensic evidence in a
      capital murder trial — the same institutional pattern that produced Kevin/Lori
      Brock’s wrongful indictment on property fraud.

      - The connection is structural: both cases involve BCSO investigating itself,
      the AG''s office prosecuting without adequate defense disclosure, and WKRG (Williams)
      amplifying Lowery’s narrative; Lowery (appointed 2024 after Hoss Mack retired
      to head Alabama Sheriffs Association) presides over this same system where law-enforcement
      culture prioritizes impunity over accountability.

      - Article 2 provides the "smoking gun" evidence that the Baldwin County judicial
      apparatus is corrupt by nature — not a one-off error — thereby contextualizing
      Brock’s firing, indictment, and Lori’s conviction as symptoms of an institutional
      problem rather than isolated misconduct.


      KEY ENTITIES:

      - Kevin Brock (Summerdale Police Chief, 7 years; fired July 2023)

      - Dr. Lori Brock (wife; convicted September 18, 2025)

      - Anthony Lowery (Baldwin County Sheriff; appointed August 26, 2024 by Gov.
      Kay Ivey after Hoss Mack retired)

      - Huey "Hoss" Mack (former Baldwin County Sheriff; 20 years in office; retired
      to head Alabama Sheriffs Association)

      - Debbie Williams (WKRG News 5 reporter; described as Lowery''s mouthpiece from
      his DA days)

      - David Whetstone (Baldwin County District Attorney, 2003–2023 era)

      - Jarius McNeil (co-defendant in Lawrence murder; coerced confession, plea deal
      for lighter sentence)

      - Brandon Hastings (murder victim, Foley, April 5, 2003)

      - Murray "Bubba" Lawrence Jr. (convicted May 13, 2005; life without parole;
      serving at William C. Holman Correctional Facility)

      - Maxwell Tillman Law Firm (Birmingham; pro bono counsel for Lawrence; dropped
      client July 2025)

      - Baldwin County Sheriff''s Office (BCSO; Major Crimes Division; self-investigating
      culture)

      - Alabama Attorney General’s Office (prosecuted both Brock case and supported
      Whetstone position in Lawrence case)'
