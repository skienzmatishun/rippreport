  not-guilty-innocent:
    brief: 'Bridge brief rendered above. Here''s the raw text version:


      **THE CONFLICT:**

      - Kevin Brock served as Summerdale police chief ~7 years; placed on leave June
      2023 amid criminal investigation by BCSO (Sheriff Anthony Lowery) and Alabama
      AG office; fired in 2023.

      - Indicted ~2 years later on second-degree forgery + possession of a forged
      instrument charges (property dispute); **charges against Kevin Brock dismissed
      Sept 9, 2025**, just before trial was set to begin.

      - His wife **Dr. Lori Brock** was NOT similarly cleared — still facing her charges
      in Bay Minette as of the Nov 26, 2025 Ripp Special.

      - **Harry Still**, a local defense/civil attorney who represented many victims
      of police misconduct, had longstanding conflicts with former Bay Minette police
      chief **Al Tolbert**.

      - **Sept 3, 2025:** Still was arrested and charged with third-degree assault
      against councilman **Matt Franklin** at Franklin''s downtown office; the fight
      continued out onto the street.

      - The arrest itself was contested: it occurred outside the arresting officer''s
      presence — a violation of Code of Alabama for that charge, described as an **unlawful
      arrest**.

      - Municipal court judge **Marcus McDowell** convicted Still Dec 2, 2025; however
      he failed to follow legal process and ignored audio recordings provided by Still.

      - Baldwin County Sheriff Lowery issued a public bulletin for officers to "beware
      of Harry Still''s presence" **before his conviction**.

      - **Debbie Williams**, WKRG News 5, covered both the Brock and Still cases salaciously;
      the Ripp Report describes her as Lowery''s long-time "mouthpiece."


      **THE DISCOVERY:**

      - On **May 21, 2026**, a jury returned a **Not Guilty** verdict to Harry Still
      (after five minutes of deliberation).

      - Supporting evidence: an 8+ hour audio recording of the fight taped on Still''s
      phone, plus recordings from inside Baldwin County Jail during his detention.

      - Circuit Court Judge **Scott Tayor** dismissed Bay Minette''s motion to commit
      Still to a mental institution (competency).

      - **State Senator Chris Elliott** used the incident as inspiration to file legislation
      for harsher punishment for attacking local politicians; it failed to pass.

      - Judge McDowell should have recused himself due to pending Alabama Bar complaints
      stemming from the Ronan McSherry assault case Still represented.

      - Matt Franklin repeatedly admitted in court that he had threatened to kill
      Harry Still and his dog.

      - Newly elected Mayor **Joshua Brown** was criticized for not removing Councilman
      Franklin over the public threats.


      **THE PIVOT:**

      - The Still case directly exposes the mechanism Brock accused: Lowery''s "law
      enforcement propaganda machine." The same BCSO/DA apparatus that fired and indicted
      Kevin Brock also pre-emptively issued warnings about Harry Still before a conviction
      was secured.

      - The acquittal confirms what Article 1 claims: politically targeted prosecutions
      (forgery charges against Brocks; assault charge against the attorney who "challenged"
      police) end up dismissed or overturned in court, but reputations are already
      wrecked by media amplification.

      - Debbie Williams is named in **both** stories as Lowery''s mouthpiece — the
      Still acquittal validates Brock''s accusation that her coverage was salacious
      and served a political purpose.

      - The audio evidence shows why procedural flaws (arresting without witness present;
      ignoring evidence) matter when prosecutors have political backing — the same
      pattern described by Brock regarding his own forgery indictment.


      **KEY ENTITIES:**

      Anthony Lowery (BCSO Sheriff), Kevin Brock (Summerdale Chief, fired/indicted/dismissed),
      Lori Brock (wife, facing charges), Debbie Williams (WKRG reporter), Harry Still
      (attorney, acquitted), Matt Franklin (councilman, admitted threats), Al Tolbert
      (former BM police chief / BCSO), Marcus McDowell (municipal judge, convicted
      then reversed), Scott Tayor (circuit judge, dismissed competency motion), Chris
      Elliott (state senator, legislation), Robert Wilters (DA), Joshua Brown (mayor),
      Kristy Haygood (judge), David Whetstone (former prosecutor), Hoss Mack (former
      sheriff).'
