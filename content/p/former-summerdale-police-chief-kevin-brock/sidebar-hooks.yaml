  audio-of-bay-minette-attorney-councilman-fight-offers-new-details:
    brief: 'THE CONFLICT:

      - Chief Kevin Brock and his wife Dr. Lori Brock were investigated, fired, and
      then Brock was indicted two years later for alleged misconduct; charges dropped
      against him but not his wife (implied).

      - The case was salaciously covered by WKRG News 5 reporter Debbie Williams,
      described in the main article as "the mouthpiece for Anthony Lowery" during
      his tenure as Baldwin County District Attorney.


      THE DISCOVERY:

      - On Sept. 3, attorney Harry Still clashed with Bay Minette Councilman Matthew
      Franklin in downtown Bay Minette over a dispute involving Al Tolbert''s orders
      to staff.

      - Audio of the incident (released by Lagniappe) contradicted the official timeline
      from former Mayor Bob Wills and former BMPD Chief Al Tolbert, who claimed Still
      attacked Franklin first.

      - Still claimed police failed to get his full side before arrest; audio showed
      officers asking him what happened.

      - The arrest was alleged to be unlawful (violation of the Code of Alabama) because
      it occurred for a misdemeanor outside the officer''s presence.


      THE PIVOT:

      - Harry Still, who fought for Brock''s exoneration and whose "Lagniappe Mobile
      Newspaper" article details his own arrest by BMPD/BCSO-connected officials,
      ties directly into the same system of alleged prosecutorial overreach and media
      coverage by Debbie Williams that Kevin Brock was targeted by.

      - The audio evidence exposing discrepancies in official narratives parallels
      how the main article alleges Lowery''s office used media to fabricate cases
      against individuals like Brock — making Still''s case a precedent or mirror
      for the broader "Baldwin County Law Enforcement Propaganda Machine" described
      in the Main Article.


      KEY ENTITIES:

      - Kevin Brock (Former Summerdale Police Chief)

