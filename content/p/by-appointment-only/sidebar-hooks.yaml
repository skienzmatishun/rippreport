  lt-governor-ainsworth-breaks-with-governor:
    brief: 'THE CONFLICT:


      *   Governor Kay Ivey (R) fought for direct control of the Alabama Department
      of Veterans Affairs (ADVA).

      *   ADVA Commissioner Kent Davis (a retired Navy Rear Admiral serving since
      2019) filed an ethics complaint in August 2024 against Department of Mental
      Health Commissioner Kim Boswell. The complaint alleged Boswell improperly killed
      an inter-agency agreement for $7 million in American Rescue Plan Act (ARPA)
      funds intended for veteran mental health programs.

      *   The Ethics Commission dismissed the complaint in August 2024, calling it
      "entirely frivolous."

      *   In September 2024, Ivey demanded Davis''s resignation and accused him of
      mishandling grants and "weaponizing" the ethics process.

      *   On October 19, 2024, the State Board of Veterans Affairs (SBVA) voted to
      retain Davis against Ivey''s wishes.

      *   On October 22, 2024, despite the board''s vote and without board approval,
      Ivey fired Davis by exercising "supreme executive power." She immediately appointed
      retired Brigadier General Jeffrey Newton as interim Commissioner.

      *   SB67 (Veterans Affairs restructuring bill) was sponsored in the Senate by
      Andrew Jones (R-Centre) and in the House by Edward Oliver (R-Dadeville). The
      bill was carried at Ivey''s request to strip authority from the board, give
      the Governor sole power to appoint a new board, and appoint the new Commissioner
      without board input.

      *   On February 5, 2025, during her State of the State Address, Ivey announced
      plans to incorporate ADVA into her cabinet and restructure the board so veterans
      "are best represented," arguing the new structure would create a "team player"
      aligned with executive vision.


      THE DISCOVERY:


      *   On February 11, 2025, Alabama Lieutenant Governor Will Ainsworth (R), also
      a Republican legislator, publicly broke ranks with Governor Ivey by releasing
      a statement opposing SB67 and Ivey''s takeover of the Veterans Affairs department.

      *   Ainsworth argued that "men and women who have actually worn a uniform should
      remain in charge" rather than having the Commissioner hand-picked by the governor
      alone as a "team player."

      *   This marked the first public, vocal dissent from the Lieutenant Governor
      against Ivey''s veterans agenda within the Republican leadership, directly contradicting
      her narrative that this was a broad-based legislative reform to strengthen services.


      THE PIVOT:


      *   Article 1 presents a generalized grievance about judicial "pre-arranged"
      appointments and lack of transparency in Alabama governance (e.g., Lang Floyd''s
      appointment).

      *   The Ainsworth statement in Article 2 is the "smoking gun" because it reveals
      that the same power-grabbing political apparatus under Ivey was recently used
      to unconstitutionally fire a veteran commissioner despite board approval, strip
      his agency of independence, and centralize control.

      *   It validates the podcast''s core critique that "good old boy" networks and
      executive overreach are bypassing established legal or democratic checks (the
      Board). The Ainsworth dissent shows this isn''t just theoretical: Ivey exercised
      "supreme executive power" to override a voting board, creating precedent for
      the "pre-arranged" nature of other appointments mentioned in Article 1.


      KEY ENTITIES:


      *   Kay Ivey (Alabama Governor, R)

      *   Will Ainsworth (Alabama Lieutenant Governor, R)

      *   Kent Davis (Retired Navy Rear Admiral / Former ADVA Commissioner)

      *   Kim Boswell (Former Alabama Department of Mental Health Commissioner)

      *   Jeffrey Newton (Retired Brigadier General / Interim ADVA Commissioner)

      *   Andrew Jones (State Senator, R-Centre, SB67 Senate Sponsor)

      *   Edward Oliver (State Representative, R-Dadeville, SB67 House Sponsor)

      *   April Weaver (State Senator, R-Briarfield, SB67 Opposer)

      *   Chris Elliott (State Senator, R-Josephine, SB67 Opposer)

      *'
    widget_date: 2025-02-12
    generated_at: '2026-09-02T00:36:41.967891Z'
