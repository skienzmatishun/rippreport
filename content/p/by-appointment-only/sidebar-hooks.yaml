  red-lips-award:
    brief: 'THE CONFLICT:

      *   The Alabama State Senate passed legislation on June 9, 2023 (noted in text
      as "earlier this month" relative to the article) with a 21-9 vote to "restructure"
      the State Board of Veterans Affairs (ADVA).

      *   ADVA Commissioner Admiral Kent Davis filed an ethics complaint against Department
      of Mental Health Director Kimberly Boswell.

      *   The complaint alleged Boswell "colluded" with other state officials to prevent
      the ADVA from receiving $7 million in American Rescue Plan Act funds.

      *   The Ethics Commission dismissed the complaint.


      THE DISCOVERY:

      *   The Ethics Commission was allegedly highly unethical, specifically involving
      Director Tom Albritton.

      *   Tom Albritton used the trust of the Mabel Amos Memorial Fund to award himself
      $120,000 for his kids’ scholarships.

      *   Albritton had enjoyed a salary of over $100,000 for four years while court
      cases proceeded regarding the fleecing of the trust''s millions.

      *   The "restructuring" bill is claimed to be retaliation for the ethics complaint
      filed by Admiral Davis against Boswell.


      THE PIVOT:

      *   Article 1 (BY APPOINTMENT ONLY) discusses the opaque and pre-arranged judicial
      appointments in Baldwin County, including Lang Floyd''s appointment and claims
      that decisions favor political allies.

      *   Article 2 (RED LIPS AWARD) provides the "smoking gun" context by exposing
      the corrupt mechanisms behind the ADVA restructuring bill—specifically showing
      that politicians (like Jones, Oliver, and Albritton) are using government positions
      for personal financial gain ("the rot" buried by the AG).

      *   Article 2 proves that the legislative environment pushing through the "unopposed"
      or "pre-arranged" political appointments described in Article 1 is undergirded
      by systemic corruption (e.g., Albritton’s fiduciary fraud), thereby explaining
      why incumbents like Elliott are protected and why new appointments are rigged.


      KEY ENTITIES:

      *   Kay Ivey

      *   Mike Vann

      *   Chris Elliott

      *   Lang Floyd

      *   Kimberly Boswell

      *   Admiral Kent Davis

      *   Tom Albritton (Ethics Director; $120,000 fiduciary fraud)

