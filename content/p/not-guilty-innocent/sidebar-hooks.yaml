      \ office at 130 Courthouse Square. Fight continued out onto the street; witnesses\
      \ reportedly saw Still restraining Franklin. Still was arrested for third-degree\
      \ assault (Class A misdemeanor).\n- Earlier that month (August 26, 2025), still\
      \ before the assault on September 3, 2025: Orange Beach Mayor Tony Kennon re-elected\
      \ in a contentious campaign marked by ethics filings, a September 2024 domestic\
      \ violence incident at the Coastal Resources building, and a July 1, 2025 \"\
      credible threat\" from ALEA that locked down four city buildings including City\
      \ Hall.\n- In the weeks before Still's arrest: ALEA allegedly ignored subpoenas\
      \ from Still and the Ripp Report team seeking records on Kennon-related matters\
      \ (including the Danny Williams death in Perdido Pass, May 27, 2022).\n- BCSO\
      \ culture of pre-targeting: Per leaked BCSO internal email (shared by Whitney\
      \ Scapecchi), Sheriff Anthony Lowery directed deputies to \"pre-target\" attorney\
      \ Harry Still at a Republican event, telling them to pull his jail log photo\
      \ and \"do what you need to do,\" before any charges had even been filed in\
      \ the Franklin case.\n- Judge Marcus McDowell (Bay Minette Municipal Court /\
      \ Fairhope Municipal Attorney) allegedly refused to recuse himself in the McSherry\
      \ assault case that Still had represented, ignored audio evidence provided by\
      \ Still, and lied to Mayor Joshua Brown and City Council about proceedings.\n\
      \nTHE DISCOVERY:\n- Article 2 (The Ripp Report \"Heart of Dixie Podcast,\" Nov\
      \ 21, 2025; and \"Orange Beach Tyranny\" video, July 9, 2026) revealed:\n  -\
      \ The leaked BCSO internal email showing Sheriff Lowery explicitly pre-targeted\
      \ Harry Still at a political event before any charges were filed in the Franklin\
      \ case — constituting potential First Amendment retaliation under 18 U.S.C.\
      \ § 242 and Alabama's abuse-of-office laws.\n  - A \"credible threat\" was made\
      \ to ALEA's Marine Patrol office in Orange Beach on July 1, 2025, triggering\
      \ a lockdown of four city buildings (including City Hall) — yet no perpetrator\
      \ was identified or charged as of the July 9, 2026 video.\n  - Tony Kennon's\
      \ inner circle (city attorney, city administrator, police chief) allegedly compartmentalized\
      \ information to keep it from media, citizens, bereaved families, and even the\
      \ Orange Beach City Council; three council members filed a formal ethics complaint\
      \ with the Alabama Ethics Commission on May 1, 2026.\n  - The Danny Williams\
      \ death (Perdido Pass, Memorial Day weekend 2022) — a close friend of Kennon\
      \ and co-target in a 2016 federal drug investigation — was never properly investigated;\
      \ ALEA ignored subpoenas seeking records on this matter.\n  - Still's independent\
      \ legal digging into the Kennon administration and law enforcement misconduct\
      \ was interrupted by the framed Bay Minette assault charge — establishing a\
      \ direct causal link between Still's advocacy and his targeting.\n\nTHE PIVOT:\n\
      - Article 2 is the \"smoking gun\" because it provides the motive, timeline,\
      \ and mechanism of attack that Article 1 (the \"Not Guilty – Innocent\" broadcast)\
      \ merely documents as an outcome.\n- Article 1 shows the result: jury acquitted\
      \ Still on May 22, 2026, after a one-day trial where the defense rested without\
      \ witnesses or evidence; the court reversed the municipal court conviction.\
      \ But it does NOT explain why Still was arrested in the first place, why his\
      \ case became political (SB 20 legislation by Sen. Chris Elliott inspired by\
      \ Still's incident), or who directed the targeting.\n- Article 2 reveals: (1)\
      \ Lowery's pre-targeting email predating any charges, establishing the assault\
      \ as a setup to silence Still; (2) ALEA's threat and lockdown in July 2025,\
      \ demonstrating that the \"threat\" ecosystem surrounding Kennon was being weaponized\
      \ against political opponents; (3) The systemic pattern of BCSO/ALEA ignoring\
      \ subpoenas, compartmentalizing information, and pre-targeting critics — all\
      \ documented by Still through his own legal investigations and leaked internal\
      \ communications.\n- Without Article 2's evidence, the \"innocent verdict\"\
      \ in Article 1 is simply a reversal of a bad trial; with Article 2, it becomes\
      \ proof that the entire criminal process was weaponized against an attorney\
      \ who challenged the Kennon administration and BCSO culture.\n\nKEY ENTITIES:\n\
      - Harry Still III (Baldwin County attorney, Heart of Dixie podcast co-host,\
      \ Ripp Report contributor)\n- Matt Franklin (Bay Minette City Councilman, District\
      \ 3, alleged victim of Sept 3, 2025 assault; admitted in court to threatening\
      \ to kill Still and his dog)\n- Tony Kennon (Orange Beach Mayor since 2008,\
      \ incumbent running for 5th term; ethics complaint filed May 1, 2026 by three\
      \ council members: Stuart, Ginger Harrelson, Jeff Silvers)\n- Anthony Lowery\
      \ (Baldwin County Sheriff, appointed Sept 1, 2024; directed deputies to pre-target\
