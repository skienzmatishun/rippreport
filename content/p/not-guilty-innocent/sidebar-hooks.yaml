      - Lowery (Baldwin County Sheriff — same as Anthony Lowery above)\n- ALEA (Alabama\
      \ Law Enforcement Agency; issued July 2025 \"credible threat\" warning triggering\
      \ Orange Beach city lockdowns; allegedly ignored subpoenas from Still and Ripp\
      \ Report team)\n- Mr. McCallum (Staff member of Baldwin County Legislative Delegation,\
      \ interviewed in \"Orange Beach Tyranny\" video regarding ALEA's subpoena refusal)"
