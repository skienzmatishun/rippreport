      THE DISCOVERY: Article 2 (older) revealed Councilman Brown's personal financial corruption and misuse of office, including involvement in the $2.65 million land deal and the $13 million triangle property loss, leading to complaints filed with the Mobile FBI and Alabama Ethics Commission.

      THE PIVOT: Article 2 establishes a pattern of corruption and self-interest (e.g., the $2.65M land deal and personal enrichment) within the City Council, providing critical historical context to the current $6.2 million Waterfront project discussed in Article 1, which citizens claim lacks transparency and public participation.

