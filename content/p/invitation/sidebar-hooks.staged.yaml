  stealing-our-democracy:
    refined_source: af6e93666895320cc92522c52e4f4bcfea9e164ae497bcdd95caaeec78f35030
    brief: |-
      THE CONFLICT:
      *   Historical election manipulation involving former Governor Don Siegelman and mysterious ballots favoring Bob Riley.
      *   Baldwin County Sheriff Hoss Mack utilized exclusive qualifications written by Sen. Tripp Pittman to eliminate competition in two elections.
      *   Fairhope elections in 2008 and 2012 were deemed "out of wack."

      THE DISCOVERY:
      *   Oversight by the Alabama Sec. Of State confirmed fair elections in Fairhope starting in 2016.
      *   The history demonstrates a pattern of deep corruption in Alabama politics involving figures like Siegelman.

      THE PIVOT:
      *   Article 2 establishes a historical precedent of systemic election fixing and political self-interest in Fairhope and Baldwin County.
      *   This context validates the distrust and claims of corruption made in Article 1 regarding the current City Council's self-serving actions (e.g., approving the $500,000 Waterfront engineering design, voting themselves a raise/full family insurance, and avoiding public participation on the $2.6 million recreation property).

