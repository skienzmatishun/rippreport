      incidents), attorney Harry Still III was arrested and taken into custody by
      the Baldwin County Sheriff''s Office (BCSO).

      * The arrest was prompted solely on allegations made by Bay Minette City Councilman
      Matthew Franklin.

      * Despite the initial arrest, no formal charges were ever filed against Harry
      Still for this specific incident.

      * In March 2019, there was an unrelated legal dispute where Mayor Robert Craft
      (Bay Minette) and BCSO Corporal Al Tolbert (then Bay Minette Chief of Police)
      were accused by Harry Still of fabricating charges in retaliation for his political
      work against local corruption.


      **THE DISCOVERY:**

      * In November 2025, Whitney Scapecchi leaked a highly confidential internal
      email from the BCSO headquarters to the public.

      * The email revealed that Sheriff Anthony Lowery had explicitly directed deputies
      to "pre-target" Harry Still at an upcoming political gathering (a Republican
      event).

      * The directive instructed officers to retrieve Still''s jail log photo and
      proceed with discretion, essentially giving law enforcement license to harass
      or detain him without cause.


      **THE PIVOT:**

      * Article 2 is the "smoking gun" because it confirms that the arrest was not
      based on any evidence of a crime but was explicitly planned as political vengeance
      for speech.

      * It proves that Sheriff Lowery engaged in pre-planned, viewpoint-based policing
      against a private citizen (Still) who had publicly spoken out against local
      officials like Franklin and the Mayor.

      * This email converts the narrative from "a lawyer behaved badly" to "the police
      system weaponized its authority against a dissenting voice," explaining why
      the arrest was never prosecuted and validating Scapecchi’s claims of First Amendment
      retaliation.


      **KEY ENTITIES:**

      * **People:** Whitney Scapecchi (Southern Freedom Press / Heart of Dixie Podcast),
      Harry Still III (Attorney), Matthew Franklin (Bay Minette City Councilman),
      Anthony Lowery (Sheriff, Baldwin County Sheriff''s Office), Robert Craft (Mayor,
      Bay Minette), Al Tolbert (Corporal/Chief of Police, BCSO/BMPD), John Sophocleus
      (Guest on New Years Special), Brandon Moseley, Paul Ripp.

      * **Organizations:** Baldwin County Sheriff''s Office (BCSO), Southern Freedom
      Press, Heart of Dixie Podcast, Bay Minette City Council, WKRG Channel 5 (Local
      Media).

      * **Legal/Regulatory:** 18 U.S.C. § 242 (Federal Statute prohibiting deprivation
      of rights under color of law), Alabama abuse-of-office laws, Open Records Act
      requests.'
