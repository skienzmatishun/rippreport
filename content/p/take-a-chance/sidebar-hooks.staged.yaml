      *   She received a salary boost, resulting in a total gross salary and benefits of $640,000.00 over four years (a $112,000 annual boost above former Mayor Wilson’s salary).
      *   The "three B's" (Boone, Brown, Burrell) ensured Sullivan received this reward.
      *   Councilman Brown used his elected office/appointed board to secure contracts, racking in hundreds of thousands of dollars for personal gain.
      *   Jack Burrell intended to appoint Hand Arendall (his personal attorney firm) as the city's litigation attorneys, despite their history with the Triangle Lawsuit loss.

      THE PIVOT:
      *   Article 2 establishes that Sullivan and Burrell are part of a system of past corruption (Triangle Lawsuit, bid rigging, personal financial gain) and poor governance.
      *   Article 1 shows that despite the local medical community advising against large gatherings due to Covid-19 risks (2020), Mayor Sullivan and Associate Mayor Burrell are still willing to "take a chance" on large public gatherings (Arts and Crafts Show, Nov 19th, 2020) despite state/federal guidelines.
      *   Article 2 provides the context that their decisions in Article 1 are not just public health errors, but symptomatic of their established pattern of prioritizing personal/political gain over ethical governance and constituent safety.

