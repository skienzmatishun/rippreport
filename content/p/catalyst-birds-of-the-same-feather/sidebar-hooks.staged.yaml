  triangle-part-2-public-driven-vision:
    brief: |-
      THE CONFLICT:
      *   Triangle land asset in Fairhope was subject to litigation for over 25 years.
      *   Fairhope purchased the land via legal settlement for $11.25 Million plus approximately $3 Million in legal fees.
      *   Mayor Kant previously sought $49 Million, including private property and the Fly Creek area, which was deemed excessive and non-compliant with fund intent.

      THE DISCOVERY:
      *   Mayor Karin Wilson approved a $650,000 Fairhope Area Community-based Comprehensive Land Use Plan, promoting a "Public-Driven vision" for responsible growth.
      *   Jack Burrell and Kevin Boone advocate for placing the Triangle into a conservation easement, supporting the policy of not developing the land.

      THE PIVOT:
      *   Catalyst, led by Scott Boone (son of Kevin Boone), supports Tim Kant and Joe Davis, who backed the Fly Creek Apartments project despite population opposition.
      *   Catalyst's push for development (Fly Creek) and control of Baldwin County (County Commission, Probate Judge) directly contradicts Mayor Wilson's established "Public-Driven vision" and prudent land use planning outlined in the Comprehensive Plan.

