    brief: |-
      THE CONFLICT:
      - Jerry Carl won the First Congressional District.
      - Mobile pushed Carl over the top to win by 3,873.
      - Carl’s opponent was CATALYST candidate “Lowtower.”
      - Lowtower made a major mistake by hooking up with CATALYST, aka Scott Boone Consultant.
      - Statistical analysis of the First Congressional Seat district, Jerry Carl, showed as much as 2,500 votes shifted from CATALYST Lowtower to Carl from the primary to the runoff.
      - Baldwin County, for both races, showed a swing of 2,652 Catalyst votes from Lowtower to Carl.
      - In Fairhope, same elections, CATALYST lost votes to Carl, around 1,118.
      - Estimate of gained votes for Carl from CATALYST in Baldwin County was approximately 2,000 to 2,500.
      - Those gained votes helped Carl, from some votes he lost in the rural counties.
      - CATALYST group was licking their wounds after the election of Jerry Carl.
      - Major shift in voting away from CATALYST candidates.
      - CATALYST can change its name to Scott Boone Consulting but Baldwin County voters awakened to the fact that nothing good comes from CATALYST or SBC.
      - Fairhope, home base of CATALYST, was reeling from the loss of the congressional seat and worried about the CATALYST council not being re-elected.

      THE DISCOVERY:
      - Second article is older than the first; frame it as background/historical context.
      - Fairhope municipal election qualifications had 7 days left, July 21.
      - Fairhope municipal election qualifications close 5pm July 23; Monday and Tuesday were going to be interesting.
      - Two very important seats had yet to be challenged, Jack Burrell and Robert Brown.
      - People were considering running against them, however, they had not committed as yet.
      - In the best interest of Fairhope the 3 B’s need to go.
      - Kevin Boone, grandfather CATALYST, was being challenged by Joshua Gammon.
      - Fairhope City Council president Jack Burrell acknowledged tonight that he and two other members of his household tested positive for COVID-19, leading him to quarantine for the past two weeks.
      - At the council work session prior to the meeting, the council at large expressed no interest in passing a mask mandate.
      - Councilman Brown had been very vocal about not wearing a mask; he and Captain Jack both wanted to “take a chance with Arts and Crafts.”
      - A vote for Councilman Brown is a vote for corruption; Mr. Brown had used his office for personal gain and was asking voters for their vote so he could continue using his office to personally enrich himself.
      - If NO candidates challenge Brown or Burrell, Fairhope will be stung again by the B’s.

      THE PIVOT:
      - Why Article 2 is the smoking gun/key context for Article 1: Article 2 is older and frames background/historical context for Article 1.
      - Article 2 provides facts around Fairhope municipal election, Jack Burrell, Robert Brown, Kevin Boone, the 3 B’s, COVID-19, mask mandate, and qualifications.
      - Article 1 references the same B’s: Boone Brown and Burrell look like they will have opponents; the B’s should be top priority to vote OUT.
      - Article 1 post-dates Jerry Carl’s election loss and discusses CATALYST council, Sherry Sullivan, Cant, Jay Robinson, Jimmy Conyers, John Melones, Chief Pettis.
      - Article 2’s B-STING, COVID-19, mask, and corruption context connects to Article 1’s CATALYST loss and Fairhope political fallout.

