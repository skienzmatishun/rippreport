      *   The Ethics Commission rules were influenced by former and convicted Speaker of the House Mike Hubbard.
      *   The removal of Matt Hart eliminated a major anti-corruption guardrail in the Attorney General’s office.

      THE PIVOT:
      *   Article 2 establishes the systemic lack of anti-corruption "guardrails" in Alabama (weak AG office, compromised Ethics Commission), creating an environment where local bodies (Fairhope Council) can operate without fear of accountability, leading to deliberate obstruction (e.g., failure to pass a budget) as described in Article 1.

      KEY ENTITIES:
      *   Matt Hart
      *   Alabama Attorney General (Steve Marshall)
      *   Mike Hubbard
      *   Fairhope City Council
      *   Catalyst council
      *   Tim Can’t Club
      *   Alabama Ethics Commission
