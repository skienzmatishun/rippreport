  mabel-amos-scholarship-list-revealed:
    brief: |-
      THE CONFLICT:
      - Mabel Amos, a two-term Alabama Secretary of State, died in 1999 leaving roughly $500,000 to create the Mabel Amos Memorial Fund (MAMF) for student scholarships based on character, intelligence, scholastic record, and financial need.
      - Discovery of oil on Amos-owned land in Conecuh County poured millions of dollars into the fund starting around 2014, after which scholarship names were hidden from public IRS 990 forms for 12 years.
      - A 4-year-old civil lawsuit filed by Amos' grandniece Leigh Manning, great-grandniece Megan Carmack, and student Tyra Lindsay exposed that board members engaged in self-dealing.
      - Special Fiduciary James C. White, Sr. released a report revealing $725,000 in unallowed spending, including $257,844 in self-dealing scholarships handed out to relatives and associates of board members between 2012 and 2024.

      THE DISCOVERY:
      - The hidden 12-year recipient list proved that Tom Albritton's children (Martha and James) received a combined $135,000 in scholarships.
      - The report uncovered other beneficiaries tied to the Albritton Law Firm, including Judge Ben Bowden's daughter Anna ($60,000), Paula Tillman's granddaughter Chandlar Dauphin ($26,120), and Tina Ballard's children Megan and Whitney ($36,724).
      - Alabama Attorney General Steve Marshall attempted twice to derail independent accounting efforts by the Supreme Court, while fighting to control the litigation alongside private plaintiffs' attorneys like Byron B. Mathews, Jr.

      THE PIVOT:
      - Serves as a prime historical example of small-town elites, local officials, and connected insiders operating a corrupt scheme under the guise of public good or philanthropy—mirroring the exact dynamic described in the Fairhope Hermit Hut article where private commercial interests leverage public sympathy and municipal machinery for personal gain.

      KEY ENTITIES:
      - Tom Albritton
      - Mabel Amos
      - James C. White, Sr.
      - Greg Griffin
      - Steve Marshall
      - Rick Clifton
      - John Bell
      - Drew McNeese
      - Leigh Manning
      - Megan Carmack
      - Tyra Lindsay
      - Byron B. Mathews, Jr.
      - Ben Bowden
      - Martha H. Albritton
      - James Albritton
      - Anna E. Bowden
      - Chandlar Dauphin
      - Megan Ballard
      - Whitney Ballard
    llm_text: When oil millions flooded the Mabel Amos scholarship fund, connected insiders like Tom Albritton redirected over $257,000 to their own kids and cronies. Read how this shocking corruption mirrors our main investigation into local elites exploiting public trust for private gain.
