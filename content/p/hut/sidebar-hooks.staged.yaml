      - Article 2 is the smoking gun for Article 1 because it connects the current Hermit Hut relocation / private profit issue to the broader Fairhope infrastructure and development accountability pattern.
      - Article 2 provides backstory that same Fly Creek development issues, failed culverts, public funding/grants, and developer influence predate/current Hut move.
      - Article 2 frames developer accountability: “The developer will do whatever the hell he wants, without any accountability.”
      - Article 1 and Article 2 both involve Fairhope city council, developer, public money/donations, infrastructure/development, private gain vs public virtue.

