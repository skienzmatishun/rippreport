  fauxhope-know-the-backstory:
    brief: |-
      THE CONFLICT:
      - Main Article 1: Fairhope local politics over relocation of the Hermit Hut / “Round House” / concrete tool shed for developer profits.
      - Main Article 1: Henry Stuart, 1920s, tuberculosis, quarantine shelter, concrete tool shed; described as a concrete tool shed rather than romantic literary site.
      - Main Article 1: Hut reportedly sits in the middle of a commercial parking lot; private commercial real estate owner/developer holds title; developer wanted hut off private land for redevelopment; normal private owner would pay to move or demo.
      - Main Article 1: City council and local organizers allegedly worked community; public donations and taxpayers fund move; private real estate machinery gets cleared land free.
      - Main Article 1: Municipal move preparations included specialists, engineers, heavy machinery, routes, measuring tree overhangs, threatening massive decades-old oak tree; moving brittle concrete risk cracking; if crumbles, donors may be left hung out.
      - Main Article 1: Main article does not name developer or specific relocation date; names Fairhope city council, local organizers, cultural elite.

      THE DISCOVERY:
      - Widget Article 2: Title “FAUXHOPE - KNOW THE BACKSTORY”; content “THIS IS THE BACKSTORY TO GENERIC REPORTING.”
      - Widget Article 2: Culvert issue first addressed by the Ripp Report and lawsuits filed against the city over the Publix project on Parker Road.
      - Widget Article 2: Culverts, sewer lines, wetlands issues, drainage, proximity to Fly Creek, county right a ways, city easements, tree survey missing; Fauxhope did nothing; allowed apartments; same issues same no action; now expanding building again behind apartments; developer given green flag.
      - Widget Article 2: Former Mayor Tim Kant first proposed re-establishing creek biological and hydraulic connectivity in 2014.
      - Widget Article 2: 2023 culvert failure; emergency 2023 repairs; city council voted to apply again for a $20 million federal ‘Better Utilizing Investments to Leverage Development’ (BUILD) grant to replace failed Fly Creek box-culverts under US 98 with a bridge; applications in 2024 and 2025 were not successful.
      - Widget Article 2: Culvert damage went back to the Publix project; brought to city attention during construction of Publix and during and after apartments construction.
      - Widget Article 2: Former Mayor Tim Kant and former subordinates and entitled developer Angelo Corte to thank for a development no one wanted, except those who would profit; Catalyst supported the developer not the community; City Council aided and abetted Mayor Kant and the developer while ignoring overwhelming public outcry.
      - Widget Article 2: Citizens made a horrible decision in the last election; Mayor Wilson was addressing the issues that the current council ignored; corruption within the City government was curtailed and infrastructure issues addressed; Mayor Wilson obtained in excess of 10 million in infrastructure grants.
      - Widget Article 2: Mayor Sullivan and the current council will most likely NOT complete the grants afforded the city before their term ends; please pay attention and don’t vote for the same damn people again; vote them OUT.
      - Widget Article 2: Currently they have clear cut even more property for multi-family; single family housing.
      - Widget Article 2: Fairhope Marina undergoing dredging to maintain the main Fly Creek boat channel, necessary every five years to ensure proper depth for boat clearance; city selected M & N of Alabama LLC to perform dredging; city and Fairhope Yacht Club sharing costs for main channel, while city will cover costs for upper creek channel; marina received Clean and Resilient Marina status.
      - Widget Article 2: Jack Burrell insists the mud is coming from the bay and going up the creek.
      - Widget Article 2: Dredging is due to development on Fly Creek—such as the Publix project and apartments and the ongoing expansion on the same site; Fauxhope City Council knows this however the developer is their biggest supporter; mud in the marina matches the DNA profile of the Publix construction; City Council has turned a blind eye to the issue since the original construction began.
      - Widget Article 2: The same Fly Creek has the highest bacteria count on HWY 98 by Publix and Fly Creek at Scenic 98; all red reported by Baykeeper; red symbol indicates high bacteria levels >104 MPN/100ml (>235 MPN for Bohemian Park, Fly Creek at Highway 98, Fly Creek at Scenic 98).
      - Widget Article 2: Quote: “The developer will do whatever the hell he wants, without any accountability” — THIS IS THE BACKSTORY TO GENERIC REPORTING.

