  fauxhope-know-the-backstory:
    brief: |-
      THE CONFLICT:
      *   Publix project on Parker Road led to culvert, sewer, wetlands, and drainage issues near Fly Creek.
      *   Former Mayor Tim Kant first proposed re-establishing creek biological and hydraulic connectivity in 2014.
      *   A culvert failure occurred in 2023, necessitating $20 million federal BUILD grant applications (2024, 2025 unsuccessful).
      *   City Council aided developer Angelo Corte in the Publix/apartment development despite public outcry and known issues.

      THE DISCOVERY:
      *   Development on Fly Creek (Publix, apartments) caused environmental damage, evidenced by mud in the Fairhope Marina matching the Publix construction DNA profile.
      *   Fly Creek at Highway 98 showed high bacteria levels (> 104 MPN/100ml).
      *   The City Council prioritized developer interests over community welfare and infrastructure integrity.

      THE PIVOT:
      *   The Hut relocation is not a genuine historical preservation effort but a political maneuver where the city uses public nostalgia (saving history) to bankroll private site clearance for commercial development.
      *   This aligns with the established pattern (Article 2) of the City Council prioritizing private developer gain (e.g., Angelo Corte) over addressing severe public infrastructure and environmental issues (Fly Creek, culvert failure).

      KEY ENTITIES:
      *   Fairhope
      *   Fly Creek
      *   Publix
      *   Hermit Hut / Round House
      *   Mayor Kant (Former)
      *   Mayor Sullivan (Current)
      *   Mayor Wilson (Current)
      *   Angelo Corte (Developer)
      *   Ripp Report
      *   M & N of Alabama LLC
      *   US 98 / Scenic 98
      *   Parker Road
    llm_text: Publix development near Parker Road damaged Fly Creek, confirmed by DNA matching mud at Fairhope Marina. City Council aided Angelo Corte despite the 2023 culvert failure and failed $20M grants, using the Hermit Hut to mask developer interests.
