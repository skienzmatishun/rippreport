  alabama-fake-ethics-commission:
    brief: |-
      THE CONFLICT: Tom Albritton, as Alabama Ethics Director, and trustees including Regions Bank, John Bell, and Drew McNees administered the Mabel Amos Trust from its inception in 2002. This administration resulted in improper distribution of scholarships to relatives and friends, and the defendants were proposed to pay $1.325 million plus $300,000 in attorneys' fees.

      THE DISCOVERY: A Special Fiduciary's report revealed self-dealing within the Trust, and the subsequent settlement absolved Albritton and the trustees from all liability.

      THE PIVOT: Article 2 establishes a pattern of local political figures (e.g., Albritton) leveraging public/trust mechanisms for personal and associated financial gain, which directly mirrors the current maneuver in Fairhope where local officials and elites are organizing public/donor funds to clear private commercial real estate (the Hermit Hut) for private developer profit, under the guise of "saving history."

      KEY ENTITIES: Tom Albritton, Mabel Amos Trust, Fairhope, Henry Stuart, Regions Bank, Drew McNees, John Bell, Byron Mathews.
