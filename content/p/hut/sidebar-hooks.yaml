hooks:
  fauxhope-3:
    brief: |-
      THE CONFLICT:
      *   Mayor Sullivan and City Council in Fauxhope/Fairhope were supported by developers.
      *   Municipal elections were postponed in 2024 by the Alabama legislature due to the presidential election.
      *   The text indicates the need to replace the Mayor, Council, municipal judge, and municipal attorney in the 2025 election.
      *   Mayor Sullivan holds the salary and health insurance for a full year without having cast a single vote.

      THE DISCOVERY:
      *   City priorities focused on parks and moving a "hermit's" house, diverting funds from critical infrastructure (water tanks, sewer issues).
      *   The Mayor serves as both Mayor and Utility Director despite lacking qualifications for the utility role.
      *   A $10 million waterfront project was underway, showing changes from the citizen-approved concept, with the construction company supporting the Mayor and Council.

      THE PIVOT:
      *   Article 2 establishes that the Council and Mayor operate under developer influence, prioritizing private development over public infrastructure needs.
      *   Article 1 details the Hermit Hut relocation, which is a direct result of this systemic political maneuver: private property clearance (commercial parking lot) is bankrolled by public donations under the guise of historical preservation, enabling lucrative private redevelopment.
      *   The hut move is not an isolated issue but a symptom of the documented local government corruption detailed in Article 2.

      KEY ENTITIES:
      *   Mayor Sullivan
      *   City Council
      *   Fairhope / Fauxhope
      *   Hermit Hut (Round House)
      *   Henry Stuart
      *   $10 million waterfront project
      *   Alabama legislature
      *   2025 (upcoming election)
