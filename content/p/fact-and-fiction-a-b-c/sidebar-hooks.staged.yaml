    brief: |-
      THE CONFLICT:
      *   Saturday, August 25, at about 9:45 p.m., Fairhope Police responded to a party at a residence in the 16000 Block of County Road 13.
      *   An estimated 100 juveniles were present; approximately 40 to 50 juveniles were detained for alcohol consumption.
      *   The police report stated no adults were present upon arrival, though adults later showed up to pick up children.
      *   Councilman Jack Burrell was involved, though his initial disclosure did not include any arrest or police records prior to running for office.

      THE DISCOVERY:
      *   Fairhope Police (Sergeant Craig Sawyer) confirmed the incident occurred and documented the detention of juveniles.
      *   Police policy prohibited releasing the property owner's name to protect the identity of at least one juvenile.
      *   The law (13A-11-10.1) requires an adult to authorize AND be present for Open House Party charges, meaning adult charges were unlikely.

      THE PIVOT:
      *   Article 2 establishes the verified police report (August 25) regarding the party location and events.
      *   Article 1 shows Jack Burrell later denied any party was held at his house on WACO radio, omitting that his son sponsored the party at his in-laws' residence, which contradicts the factual basis established by the police investigation.

      KEY ENTITIES:
