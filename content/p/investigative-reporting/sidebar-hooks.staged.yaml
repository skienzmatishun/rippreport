      THE DISCOVERY: Senator Pittman served as the trustee of BP funds for Baldwin County and personally received $636,000 of those funds with the alleged assistance of Mayor Kant.

      THE PIVOT: Article 2 establishes the initial financial corruption ($636,000 payment) and the trustee relationship linking Kant and Pittman directly to the BP fraud case, providing the core evidence for the FBI/Alabama Attorney General investigations detailed in Article 1.

