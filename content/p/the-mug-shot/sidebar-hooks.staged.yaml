    brief: "THE CONFLICT: \n- In the past, the City of Bay Minette, Alabama faced a wrongful death lawsuit filed by the family of OJ French Jr., who was killed by Bay Minette Police Department (BMPD) Officer Brandon Thompson. \n- Mobile attorney Andy Ruten, representing the City of Bay Minette, asked a judge to review bodycam footage privately to excuse the officer's actions while simultaneously insisting that the footage be withheld from the public.\n\nTHE DISCOVERY: \n- Article 2 proves that the corruption circle has expanded: Mobile attorney Andy Ruten's firm subsequently hired Bay Minette Mayor Bob Wills to represent *them* in an active malpractice lawsuit. \n\nTHE PIVOT: \n- Article 2 serves as the smoking gun for Article 1 by exposing a blatant, incestuous conflict of interest at the local government level. While Article 1 highlights routine local governance, police actions, and legal battles across Alabama, Article 2 uncovers a quid-pro-quo legal arrangement where the Mayor of Bay Minette (Bob Wills)—who oversees the very city administration and police department being sued in the OJ French Jr. lethal force case—is personally put on the payroll of the defense attorney (Andy Ruten) defending that exact municipality.\n\nKEY ENTITIES:\n- OJ French Jr.\n- Brandon Thompson (BMPD Officer)\n- Andy Ruten (Mobile Attorney)\n- Bob Wills (Mayor of Bay Minette)\n- Governor Kay Ivey\n- William Coleman Barkley\n- Steve Marshall (Alabama Attorney General)\n- Chris Elliott (State Senator / \"The Tax Man\")\n- Richard Scrushy"
