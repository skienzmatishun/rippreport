    brief: "THE CONFLICT: \n- In June 2019, Fairhope City Council members Burrell, Brown, and Boone (the \"3B's\") ordered a questionable appraisal for a 105-acre farmland parcel (dated June 28, 2019).\n- Despite hiding the plan from citizens, claiming they were \"only getting an appraisal,\" the council used unbudgeted taxpayer funds to purchase the farmland for $2.65 million in December 2019. \n- In January 2020, within 60 days of purchase, the council declared the $2.65 million property \"surplus and not needed for public or municipal purposes,\" leasing it out for a mere $9,000 a year.\n- Mayor Karin Wilson and citizens wanted the land for a State Park Board initiative, but the council bypassed public input while millions were drained from needed city infrastructure, roof repairs, and recreation projects (on top of over $5 million already spent on the K1 center and Nix building).\n- In a separate background conflict (\"Malfunction Junction\"), the City Council backed developers over a dangerous intersection at Highway 98 and Parker Road, approving massive density (apartments and 48 additional units on Parker Road) that would dump 400+ cars and 1,000+ daily trips into the hazardous area.\n\nTHE DISCOVERY: \n- Article 2 (the widget article, framed as background/historical context written almost a year prior) established a pattern of behavior regarding the City Council (\"Catalyst Council\" / \"good ole boys\"). It revealed that the council routinely prioritized developer interests over public safety at the Highway 98 and Parker Road intersection (\"Malfunction Junction\"), paving the way for unchecked growth that impacts every citizen.\n\nTHE PIVOT: \n- Article 2 serves as the smoking gun because it establishes the Council's established modus operandi: a \"good ole boy deal\" network that systematically ignores public welfare and safety (as seen at Malfunction Junction) to benefit outside interests. This directly contextualizes the backroom land-deal exposed in Article 1, proving that the $2.65 million farmland purchase and subsequent \"surplus\" lease-out was part of a consistent pattern of corrupt, anti-citizen governance by the Catalyst Council leading up to the August 25, 2020 municipal elections.\n\nKEY ENTITIES: \n- Mayor Karin Wilson\n- Councilman Burrell\n- Councilman Brown\n- Councilman Boone\n- Fairhope City Council (Catalyst Council)\n- State Park Board\n- Highway 98 and Parker Road (\"Malfunction Junction\")\n- K1 Center\n- Nix Building"
