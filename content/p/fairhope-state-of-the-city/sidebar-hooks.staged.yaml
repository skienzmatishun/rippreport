  catalyst-colors:
    brief: "THE CONFLICT: \n- Fairhope City Councilmen Burrell, Brown, and Boone (the \"3 B's\") pushed through a $2.65 million unbudgeted land purchase of 105 farmable acres for recreation without public input or National Park Service approval.\n- Appraisal ordered by the council was dated June 28, 2019.\n- Property sale closed on Friday, November 1, 2019, just days before the November 7, 2019 Connectivity Master Plan Workshop.\n- In January 2020, the City Council declared the newly purchased $2.65 million property as \"surplus\" and leased it out for $9,000 a year.\n- The unbudgeted purchase drained city accounts, resulting in delayed infrastructure projects, past-due city budgets, and potential police/employee cuts.\n- The entire City Council voted themselves a hidden, full family insurance package valued at $17,000 a year, which no other part-time city employee receives.\n- Councilman Robert Brown faced an Attorney General complaint regarding the Eastern Shore Art Center for using his office for personal gain.\n- The City Council appointed a Municipal Judge who is also the developer of the largest housing development in Fairhope, requiring approval from the very council that appointed him.\n\nTHE DISCOVERY: \n- Article 2 (the widget article, serving as historical context) establishes the timeline and mechanics of how the 3 B's bullied the $2.65 million land purchase through with lighting speed right before the November 2019 Park Service workshop, despite knowing it lacked National Park Service approval.\n- It exposes how the council drained multiple city accounts, jeopardized infrastructure and sewer repairs, and hid their $17,000-a-year family insurance benefits from the public until exposed by Mayor Karin Wilson.\n- It uncovers deep conflicts of interest, including an Attorney General complaint against Councilman Robert Brown and the appointment of a Municipal Judge who acts as a major commercial developer needing council approval.\n\nTHE PIVOT: \n- Article 2 serves as the smoking gun because it details the exact financial manipulation, hidden perks (family insurance), and premeditated land deals orchestrated by the \"Catalyst Council\" (Burrell, Brown, and Boone) that directly set up the governance crisis, infrastructure stagnation, and surplus declarations addressed in Article 1. \n\nKEY ENTITIES: \n- Mayor Karin Wilson\n- Councilman Jack Burrell (Captain Jack Burrell)\n- Councilman Robert Brown (\"The Jester\", Robert Brown For Our Hometown)\n- Councilman Kevin Boone (LLC Kevin Boone)\n- The 3 B's (Burrell, Brown, and Boone)\n- Fairhope City Council\n- State Park Board / National Park Service\n- Eastern Shore Art Center\n- Fairhope Civic Center"
