hooks:
  read-and-listen:
    brief: |-
      THE CONFLICT:
      - Catalyst City Council rejected a piece of land that was the first choice of the State Park Board, the citizens of the community, city staff, and Mayor Karin Wilson.
      - The council ordered the appraisal before the citizens knew; the appraisal was dated June 28, 2019.
      - The appraisal was highly questionable and described as the brain child of councilmen Burrell, Brown and Boone.
      - The council members had made up their minds in June 2019 but strung out the citizens for months, using the line “we are only getting an appraisal.”
      - The 3B’s moved to close on the property without any public input on the proposed property.
      - In December, they paid 2.65 million for the farmland using tax dollars; the money was not allocated or budgeted for recreation land.
      - The council purchased the K1 center and Nix building for over 5 million, which needs roof repairs.
      - Main City Hall needs a new roof; recreation upgrades within the city are needed.
      - Millions of dollars are now not available for city infrastructure projects; those projects are being held up for lack of budgeted funds.

      THE DISCOVERY:
      - In January 2020, the City Council declared the same 2.65 million dollar property surplus and not needed for public or municipal purposes in response to an offer to lease the property yearly from January 1 through December 31 for one year with four one-year options.
      - Within 60 days of purchase, the property was designated “surplus and not needed for public or municipal purposes.”
      - The property was leased for 9,000.00 per year.
      - The main article states: “This is no joke. They have no money to develop the property???”
      - The main article asks who got the “commission check”: Burrell, Brown or Boone? Or all three?

      THE PIVOT:
      - Article 2 is older and should be framed as background/historical context for Article 1.
      - The widget article states: “The Fairhope City Council is really showing their colors.”
      - The widget article states: “No ethics, No transparency, No accountability, No good.”
      - The widget article directs listeners to the podcast on Freaky Friday’s around noon, Backstory Podcast.
      - The Backstory Podcast is titled: “Your Voice and The Court of Public Opinion.”
      - Article 2 is positioned as key context/smoking gun for Article 1 because it frames the council’s conduct around ethics, transparency, and accountability before or alongside the main article’s details on the 2.65 million property deal.

