      THE CONFLICT:
      May 29th council meeting saw Mayor begging council to reconsider conservation easement (102 acres, $20 million) and proposed purchase of property on Hwy 13 (2.6 million). Burrell and Boone supported the lawsuit they lost, resulting in an $8.25 million settlement plus $3 million in attorney fees. September saw the 3 B's pass resolution to purchase 2.6 million property without public participation.

      THE DISCOVERY:
      The 2.65 million farmland purchase and subsequent designation of 105 Farmable Acres as surplus/leased for $9000.00 annually occurred in December and January 2020. An appraisal dated June 28, 2019, preceded the purchase decisions.

      THE PIVOT:
      Article 2 (older) establishes the history: the Council (3 B's) pushed for the purchase despite Mayor's pleas, despite a failed conservation easement fight, and the purchase was preceded by a questionable appraisal (May/September timeframe). Article 1 details the fallout: the purchase happened (December 2019), leading to millions unavailable for city infrastructure (roofs, recreation) and the property being declared surplus in January 2020.

