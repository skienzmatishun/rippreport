  a-decade-of-corruption:
    refined_source: 7575106b82d53a887b5cf28b93fa3ebac13d229bd3ea42adc8da025978582f3d
    brief: |-
      THE CONFLICT:
      *   10 years ago (May 8th 2010), the County Commission told Senator Tripp Pittman and Fairhope Mayor Tim Kant not to proceed with a BP Boom work bid.
      *   On June 4th 2010, the Fairhope City Council awarded a contract to Pittman Tractor, bypassing required approvals (no general contractor license, marine insurance, or county/ethics approval).
      *   Pittman received a check for $372,165.90 for "COMPLETED" boom work, leading to a total close to $750,000 of BP money under the noses of the public.
      *   This corruption pattern lasted over 8 years, involving a debris contract with the City of Fairhope maintained by Pittman and Mayor Kant until Karin Wilson was elected.

      THE DISCOVERY:
      *   Article 2 documents a decade-long pattern of systemic corruption in Baldwin County and Fairhope, centered on the group CATALYST.
      *   Specific documented corruption includes the Mega Site, the Triangle property deal (11.2 million), airport bid rigging by Council President Burrell, and inside dealing by Councilman Boone and Councilman Brown (2.65 million for recreation land).
      *   This corruption involved Fairhope staff, including Greg Mims, Sherry Sullivan, and Jennifer Fidler.

      THE PIVOT:
      *   Article 1 claims the current $6.2 million waterfront grant funding comes from the 2010 BP oil spill.
      *   Article 2 shows that the initial handling and acquisition of that same BP funding in 2010 was rooted in a specific, documented contract fraud (Pittman/Kant), directly challenging Article 1’s claim of transparency in the waterfront project.

