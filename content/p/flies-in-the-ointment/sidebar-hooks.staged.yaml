  dear-congressman-bradley-byrne:
    brief: |-
      THE CONFLICT:
      1. Sen. Pittman and Mayor Kant siphoned $636,000 of BP money for a contract.
      2. This fraud resulted in an FBI investigation and referral to the Alabama Attorney General, White Collar Crime Division.
      3. A settled triangle lawsuit in Fairhope cost taxpayers $11.25 million.
      4. Damage to Fly Creek was caused by the Publix project development, not "historic flooding."
      5. Arthur Corte and Mayor Kant were responsible for the damage and the subsequent corruption regarding Fly Creek Apartments.

      THE DISCOVERY:
      1. The Ripp Report revealed that Mayor Kant commissioned a "bogus" Fly Creek Watershed Management Plan intended to deflect responsibility from the Publix site.
      2. Arthur Corte actively obstructed a sediment analysis needed to confirm the Publix site as the source of creek sediment.
      3. The rezoning of Fly Creek for apartments, despite 95% local opposition, was manipulated by Mayor Kant following pressure from Mr. Corte, demonstrating a "good ole boy network."

      THE PIVOT:
