  catalyst-does-fairhope:
    brief: |-
      THE CONFLICT:
      *   Former Mayor Tim Kant of Fairhope authorized the Fly Creek Apartments development (230 apartments) along Highway 98.
      *   The City Council, including Councilmen Burrell and Boone, accepted a "Gift" of wetlands/drainage liability from developer Angelo Corte to the City of Fairhope.
      *   Taxpayers paid for infrastructure (Fire Station, sewer lift station) built on Corte property and specifically to service the developer's apartments, despite public outcry.

      THE DISCOVERY:
      *   The Fly Creek Apartments project exemplifies how Fairhope's administration prioritized developer profit over community needs and municipal infrastructure.
      *   Taxpayers assumed liability for the developer's drainage issues into Fly Creek, which was damaged during the initial Publix development.

      THE PIVOT:
      *   Article 2 demonstrates a specific instance of uncoordinated, self-serving municipal decision-making (Kant/Corte) leading to taxpayer burden and environmental harm in Fairhope.
      *   Article 1 highlights that this type of independent, uncoordinated decision-making (Fairhope/Daphne working independently) is driving a "Runaway Train" of 545% residential growth across Baldwin County, necessitating organizations like PLAN.

      KEY ENTITIES:
      *   Tim Kant (Former Mayor, Fairhope)
      *   Angelo Corte (Developer)
