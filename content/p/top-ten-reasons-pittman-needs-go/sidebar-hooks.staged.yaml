    brief: |-
      THE CONFLICT:
      *   BP Boom Scandal involved Trip Pittman and Mayor Kant in Fairhope.
      *   Controversy centered on the misuse of oil spill grant money for boom work in Fairhope.
      *   Initial reports on the $1 million contract appeared August 11, 2010 (Fairhope Courier).
      *   The scandal was documented through multiple articles by the Mobile Press-Register between November 20, 2010, and January 4, 2011.

      THE DISCOVERY:
      *   On November 20, 2010, Connie Baggett exposed that Pittman's company was awarded $639,000 while Pittman supervised boom grant execution.
      *   The official contractor of record for the Fairhope Boom Grant was Oil Recovery of Mobile (Clanton, Alabama).

      THE PIVOT:
      *   The 2010/2011 reports (Article 2) provided the specific financial evidence ($639,000) and initial public documentation of Pittman's alleged crime, which led to the ongoing political critique in Article 1 regarding the "BP Boom Scandal with Mayor Kant in Fairhope."

