  primary-election-endorsements-2014:
    brief: 'THE CONFLICT:

      *   BP Boom Scandal involving Mayor Kant and Trip Pittman.

      *   Allegations of corruption, questionable contracts (e.g., emergency debris
      removal for City of Fairhope), and legislative maneuvering favoring cronies.

      *   Pittman supported policies benefiting associates (e.g., doubling commissioner''s
      pay, favorable Sheriff qualifications).


      THE DISCOVERY:

      *   Article 2 (May 24, 2014) details the culmination of these ongoing activities
      immediately preceding the June 3rd primary election.

      *   It specifically names the "Sicko Six" alliance, naming Tucker Dorsey, Bob
      James, and Charles Gruber as being involved with Pittman/Kant.

      *   It explicitly links the BP Boom Grant theft to Pittman and Kant''s crime,
      which required orchestrating firings of key administrators (Leigh Ann Ryals,
      Michael Thompson, Scott Barnett).


      THE PIVOT:

      *   Article 1 outlines the general corruption and suspicions (e.g., "BP Boom
      Scandal," contracts). Article 2 provides the specific, contemporary context:
      that these actions occurred while Pittman and Kant were actively facing indictments
      regarding the stolen grant money, making the ongoing contracts inherently tainted.


      KEY ENTITIES:

      *   Trip Pittman

      *   Mayor Kant (Tim Kant)

