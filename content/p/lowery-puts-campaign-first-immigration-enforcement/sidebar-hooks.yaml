hooks:
  internal-tensions-bcso:
    brief: 'THE CONFLICT:

      - Past tension at the Baldwin County Sheriff''s Office (BCSO) over participation
      in federal 287(g) immigration enforcement, specifically operations by Mobile
      Enforcement and Removal Operations (ERO).

      - Chief Deputy David White reportedly got upset with BCSO deputies assisting
      Mobile ERO; alleged to say ERO agents were “just out stopping brown people.”

      - White instructed deputies to back away from certain immigration-related activities.
      One deputy called the Mobile ERO supervisor, who then spoke directly with White.

      - In that conversation, White allegedly told federal leadership ERO personnel
      needed to “chill with immigration” because “we got an election going on right
      now, we can’t be getting involved in this.”

      - White later alleged to the ERO supervisor that he was criticizing him for
      “talking to his guys” about the instruction not to assist.


      THE DISCOVERY:

      - Two independent sources allege 287(g)-related cooperation between BCSO and
      Mobile ERO was suspended or paused temporarily as a result of the dispute and
      broken trust.

      - Sheriff Anthony Lowery reportedly contacted higher-ranking ERO leadership
      to complain that the Mobile ERO group was backing sheriffal candidate Matt McKenzie
      in an official capacity.

      - ERO leadership reviewed the accusation internally and found no evidence supporting
      claims Mobile ERO personnel were officially advocating for or endorsing McKenzie
      as an agency matter.

      - Exact timeline, scope, and duration of any pause remain unclear; no formal
      public statement confirming program status has been identified.


      THE PIVOT:

      - Article 2 is the “smoking gun” because it documents the internal chain of
      events that produced the enforcement gap: a deputy chief’s anti-immigration
      rhetoric, instructions to scale back participation in 287(g) operations during
      an election cycle, and a sheriff-level complaint tied directly to the opposition
      candidate.

      - It provides concrete context for Article 1’s claim that “validated reports”
      suggest BCSO quietly stepped back from immigration enforcement and may have
      done so to protect its political standing — turning anecdote into a documented
      internal incident with named actors.

      - It shows Lowery himself was involved in an exchange with federal leadership
      during the campaign, not merely passive about the pause.


      KEY ENTITIES:

      - Anthony E. Lowery – Baldwin County Sheriff (appointed 2024 by Governor Kay
      Ivey; won May 19, 2026 primary against Matt McKenzie)

      - David White – BCSO Chief Deputy / Executive Assistant to Sheriff

      - Matt McKenzie – Baldwin County Commissioner and Lowery’s election opponent
      in the 2026 sheriff race

      - Baldwin County Sheriff''s Office (BCSO) – Bay Minette, Alabama; signed a 287(g)
      Task Force Model agreement on 2025-10-17

      - Mobile Enforcement and Removal Operations (Mobile ERO) – federal immigration
      enforcement unit under ICE

      - Federal immigration enforcement / 287(g) program'
