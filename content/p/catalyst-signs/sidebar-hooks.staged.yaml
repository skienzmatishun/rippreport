      THE DISCOVERY:
      - Article 2 is older, posted Jul 15, 2020 by Francis Paul Ripp, Letter to Editor responding to Mr. Howell Raines’ op-ed and follow-up Ltr, referencing Fairhope waterfront.
      - Article 2 proves/argues Raines’ commentary was strictly political, not waterfront; by peppering commentary with political comments and voicing conclusion, Raines made issue political.
      - In 2003, Raines and New York Times parted ways after scandal that resulted in dismissal; now commentary on waterfront grant in Fairhope looks like may be up to old tricks.
      - Ripp says project not mayor’s plan; it’s citizens’ plan; burden on worst council to ever sit in Fairhope’s council chambers.
      - Ripp says flyer by Raines is political vehicle with several flat tires; bluff not going to be graded away; assertion beach area will not work false; Grand Hotel has beach design by same engineers; Raines at 77 didn’t want beach, but families/kids disagree.
      - Ripp says Raines shows no compassion for ADA requirements; concern would prevent additional parking on Scenic 98 parallel to park, access point for wheelchairs; residents along bluff did not want more tourists/locals; Raines may represent them, not citizens of Fairhope.
      - Ripp says Raines did not mention first infrastructure project on waterfront in 50 years; claims historic bluff destroyed pure fantasy; Ecor Rouge Bluffs about two miles north in Montrose; Raines’ historic bluff is cutback after lower park built; unusable property covered with kudzu; proposed is 5 percent grade, ADA compliant walkway, safe for disabled veterans/citizens to reach lower park.
      - Raines admitted six weeks late even reading about project and never went to meeting; never addressed City Council; never responded to survey that 570 Fairhope citizens participated in; never said a word to Alabama Gulf Coast Recovery Council; never spoke to Alabama Department of Conservation and Natural Resources; never said a word to Department of Treasury.
      - Raines wrote poison pen letter with political intent of satisfying status quo; alluded ink drying on contract for waterfront project, false; Mayor Wilson pledged citizen engagement will continue and everyone will have opportunity to participate in waterfront plan.
      - Ripp: Mr. Raines, please attend meetings so you can understand what is really happening. And check your sources. This has been serious problem for you in past.

