      - Article 2 documents political manipulation/false statements re Fairhope waterfront by Howell Raines; Ripp’s response is older context.
      - Article 1 uses CSB signs/elections to expose political alliance/status quo in Baldwin County/Fairhope.
      - Smoking gun/key context: Article 2 proves Raines used political vehicle/false statements to create political issue; Article 1 shows CSB signs as tool of political alliance/status quo. Both involve political deception/status quo manipulation.
      - Article 2’s facts (Raines did not attend meetings, did not respond to survey, etc.) parallel Article 1’s call to watch signs/use brain.

