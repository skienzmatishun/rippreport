  catalyst-aka-scott-boone-consulting:
    brief: |-
      THE CONFLICT:
      - Baldwin County political group CATALYST rebranded to Scott Boone Consulting (CSB) after the CATALYST name became "politically toxic"; rebrand followed elected officials under the CATALYST banner disassociating from the brand.
      - CSB operates like the Club for Growth PAC: helps elect candidates who are thereafter "owned" by CSB; CSB candidates support each other, share gratuities, and form a political alliance spanning the county.
      - CSB candidates' signs all identical PVC framed; CSB uses signs as its number one election tool; CSB placed hundreds of signs overnight in Fairhope, Daphne, Spanish Fort, and Bay Minette; Bay Minette is CSB's new home.
      - Municipal Judge: devout CSB supporter; city council voted in favor of the judge multiple times; Burrell placed himself on the bid committee that awarded the judge a prime location for a jet airplane hangar.
      - Jerry Carl (Club for Growth candidate) defeated CATALYST/SCOTT BOONE in the First Congressional Race (recent timeframe).
      - In the 2016 Fairhope election, a man was caught with a pickup truck full of signs, all opposing the status quo.

      THE DISCOVERY:
      - Article 2 (Widget: "CATALYST AKA SCOTT BOONE CONSULTING") — older/background context — revealed for newcomers: CATALYST was the "good ole boys" until it became toxic; recently changed name to Scott Boone Consulting; same individual (Scott Boone) hiding under a new name.
      - CATALYST/SCOTT BOONE Consulting financed by developers, land owners, and groups profiting from unbridled development; opposed regulations, impact fees, infrastructure needs; spent little on schools.
      - Good ole Boys clique (CATALYST/SCOTT BOONE): felt entitled to inside deals; did not recognize conflicts of interest, ethics, transparency, or accountability; used inside information to secure municipal/public contracts while in office; hid behind Christianity, per article.
      - CATALYST compared to modified Strawman land fraud defendants: formed integral part of intricate web of multiple concentric layers of LLCs intended to conceal interrelationships and insulate principal actors from liability.
      - Strawman series (Lagniappe): exposed small segment of corruption; players include Scott Boone, his father Fairhope councilman Kevin Boone, Baldwin County sewer, past County Commissioner Tucker Dorsey.
      - CATALYST associates operate similar to a criminal enterprise; FBI defines criminal enterprise as a group with identified hierarchy or comparable structure engaged in significant criminal activity.
      - CATALYST recently lost the First Congressional Race to Jerry Carl.

      THE PIVOT:
      - Article 2 is older and frames as background/historical context; Article 1 (Main: "CATALYST SIGNS") is newer/current coverage.
      - Article 2 is the smoking gun for Article 1 because it provides the underlying profile of CATALYST/SCOTT BOONE Consulting — financing, Strawman legal context, election loss, "good ole boys" structure — against which Article 1's sign-focused allegations are read.
      - Article 2's description of CSB as Club for Growth-like, inside-deal operators, and criminal-enterprise parallels gives context that makes Article 1's coordinated CSB sign claims and Municipal Judge/CSB alignment coherent.

      THE KEY ENTITIES:
      - Scott Boone / Scott Boone Consulting (CSB)
      - Kevin Boone — Scott Boone's father, Fairhope councilman
      - Sherry Snodeker — BBB
      - Burrell — bid committee member who awarded Municipal Judge jet hangar location
      - Jerry Carl — Club for Growth; defeated CATALYST/SCOTT BOONE in First Congressional Race
      - Tucker Dorsey — past Baldwin County Commissioner
      - Municipal Judge — CSB supporter; city council voted in favor multiple times
      - Mayor of Daphne — aligned with CSB
      - Fairhope, Daphne, Spanish Fort, Bay Minette, Baldwin County, Lagniappe
      - Club for Growth; candidate "Lowtower"
