      *   A previous Utility manager position paid $60,000 annually, totaling $240,000 over 4 years.
      *   CATALYST/Scott Boone Consulting was involved in the previous administration; Jerry Carl defeated CATALYST/Scott Boone in 2016.

      THE DISCOVERY:
      *   Article 2 revealed Sherry Snedeker was a fired, disgruntled employee who sued the city and only had a high school education.
      *   Article 2 established Mayor Karin Wilson possessed a college degree in finance and 25 years of business experience.

      THE PIVOT:
