      *   Sherry Sullivan, who was the Mistress of propaganda for then Mayor Cant, lied and helped cover up BP fraud and infrastructure issues.
      *   The CATALYST/Scott Boone brand lost power in the 2016 Fairhope election, which Jerry Carl defeated.

      THE DISCOVERY:
      *   The older article established that Mayor Wilson secured $18 million in BP RESTORE Act funds and $6.2 million for the Waterfront, while also stopping corrupt politician deals (like those benefiting Senator Pittman) and achieving fiscal self-reliance, reducing an annual $6 million deficit.
      *   It confirmed that Kevin Boone had multiple LLCs linking him to developers and that Robert Brown had a pending Attorney General Complaint and Ethics complaint.

      THE PIVOT:
      *   The older article (Widget) documented the specific, provable corruption and fiscal mismanagement under the CATALYST regime (e.g., the "three B's" and Sullivan's role in the BP cover-up).
      *   The newer article (Main) demonstrates that despite the 2016 electoral defeat and the exposure of past corruption, the CATALYST entity has not dissolved but has rebranded as Scott Boone Consulting (CSB) and is executing a highly coordinated, saturated electoral campaign using uniform PVC signs across multiple municipalities (Fairhope, Daphne, Spanish Fort, Bay Minette) to reclaim power.

