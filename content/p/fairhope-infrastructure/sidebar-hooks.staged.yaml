      - Dual roles: Jon Gray serves simultaneously as the 68 Ventures public relations representative and the representative for Baldwin County Schools.

      THE DISCOVERY:
      - Historical evidence revealed that Tom Albritton, Executive Director of the Alabama Ethics Commission, engaged in unethical handling of the Mabel Amos Trust for personal benefit.
      - Albritton has used his position to lobby against changes to Alabama Ethics Rules.
      - The Alabama Bar declined to pursue complaints against Albritton despite ongoing legal actions regarding the trust.

      THE PIVOT:
