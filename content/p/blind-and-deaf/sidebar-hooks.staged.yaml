  free-speech:
    brief: |-
      THE CONFLICT:
      Fairhope Airport Authority RFP process was alleged to be tainted by inside information and conflicts of interest, involving the selection of H. Ray Hix as operator.
      December 16th, 2015: Request for Advisory Opinion submitted to Alabama Ethics Commission by Dennis R. Bailey ESQ on behalf of Mid-Bay Air, LLC.
      December 17th, 2015: Ground Lease and Operating Agreement signed by H. Ray Hix ("Limited Guarantor") and Joe McEnerney (Fairhope Airport Authority Board Chairman).
      December 21st, 2015: Exhibit C (Ground Lease and Operating Agreement) submitted to Ethics Commission, which differed from the Dec 17th recorded lease.
      February 3rd, 2016: Ethics Advisory Opinion issued, requiring contract filing within 10 days of execution (signed Dec 17th, 2015).
      March 20th, 2017: Joe Mc Enerney filed an Affidavit referencing the Dec 17th lease, contrasting it with the Dec 21st submitted lease.

      THE DISCOVERY:
      The Dec 21st lease (Exhibit C) submitted to the Ethics Commission contained material factual differences (e.g., "Guarantor" vs. "Limited Guarantor," omissions of key sentences) compared to the Dec 17th executed and recorded lease, proving the initial Ethics Advisory Opinion request contained false documents.

      THE PIVOT:
      Article 2 establishes verifiable historical evidence of corruption and false reporting by the Fairhope Airport Authority Board, validating the current claims made by Chuckee (tabloid editor) that the Airport Authority dealings cost Fairhope Millions and that the council obstructed public participation.

