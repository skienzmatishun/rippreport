      THE PIVOT: The historical evidence of corruption (Burrell/Snedeker) in Alabama provides a contrast to Nick Saban's documented ethics and principle, specifically contrasting this local political failure with the national criticism against Congressman Tommy Tuberville for contributing to "inciting insurrection."
