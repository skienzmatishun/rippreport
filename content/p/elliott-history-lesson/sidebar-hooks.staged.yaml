      - If cover-up Bob can do it, why can’t Senator Elliott.
      - It is reported that Elliott rents property to Rolin Construction, a Porch Creek Indian company.
      - Clear that up for us, Chris.
      - Politicians like Mr. Elliott are the foundation of Alabama political corruption.
      - Alabama is the laughing stock of the United States.
      - Baldwin County is viewed, by Goat Hill, as a piggy bank, only.
      - Why? Because Senator Chris Elliott has alienated the Governor and the big goats on the hill.
      - Elliott has a lone wolf reputation of promoting himself rather than the interests of the people.
      - Past context: Supreme Court of the United States again step-childs Alabama in a decision related to how U.S. House Districts are not compliant with the Voting Rights Act of 1965.
      - Huge gamble and loss for Alabama Attorney General Steve Marshall.
      - Former President indicted for mishandling classified documents.
