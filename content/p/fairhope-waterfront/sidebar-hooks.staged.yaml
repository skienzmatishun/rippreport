  a-decade-of-corruption:
    refined_source: 9488901164c27e630019481c5fbeb38781329ecc55c9a7c800a10e75180bb503
    brief: |-
      THE CONFLICT:
      *   10 years ago (2010), Fairhope Mayor Tim Kant and State Senator Tripp "Boom Boom" Pittman secured a bid for $636,000.00 from Fairhope for BP Boom work.
      *   County Commission told Pittman and Kant not to proceed on May 8th, 2010.
      *   On June 4th, 2010, Fairhope City Council awarded a contract to Pittman Tractor (not Oil Recovery).
      *   Pittman received a check for $372,165.90 six days later for "COMPLETED" boom work without necessary licenses or approvals.
      *   Pittman maintained a debris contract with the City of Fairhope for over 8 years, continuing a pattern of corruption under the influence of Mayor Kant and Jack Burrell.

      THE DISCOVERY:
      *   Article 2 revealed a history of political and judicial corruption in Baldwin County over the last 10 years, centered on the misuse of BP funds.
      *   Article 2 listed several related issues including the Mega Site, the McSharry case, and the 2.65 million expenditure for Fairhope recreation land by the CATALYST council.

      THE PIVOT:
      *   Article 2 establishes that Mayor Tim Kant and the CATALYST council have a documented history of receiving and mishandling substantial BP funds through questionable contracts.
      *   Article 1 details a current $6.2 million BP grant to Fairhope for the Waterfront project and recent, unpublicized spending of $2.65 million for recreation property, suggesting a continuation of the financial patterns identified in the 2010 corruption claims.

