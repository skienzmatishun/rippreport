      - Article 1 (main) shows the CATALYST-aligned local government in action: Council President Jack Burrell threw a KISS to Bill Hightower, CATALYST candidate for the First Congressional District, in the audience at the Fairhope City Council meeting.
      - The kiss: Burrell threw a KISS to Bill Hightower at the council meeting; the Fairhope CATALYST council runs as a block vote in 2020 and only supports and promotes CATALYST candidates, which is why Bill got a kiss.
      - Article 1 frames Bill Hightower as having "thrown in with the most corrupt good ole boys in Baldwin County, CATALYST"; council is being run like a criminal enterprise; vote for Hightower is a vote for CATALYST.

      THE PIVOT (continued):
      - Article 2 is the smoking gun/key context for Article 1 because it laid out CATALYST's takeover ambitions and criminal-enterprise structure before the local-level action in Article 1.

