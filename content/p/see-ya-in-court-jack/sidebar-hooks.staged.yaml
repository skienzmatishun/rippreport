  now-you-know-jack:
    brief: |-
      THE CONFLICT: Jack Burrell orchestrated a campaign of obstructing the office of Mayor Kant; the City of Fairhope previously denied the ability to speak at a public meeting three times "many years ago."
      THE DISCOVERY: Burrell's obstruction stemmed from an Ethics complaint filed by Mayor Kant; the council voted to reject a Mayor's suggestion of a full-time city attorney, saving $90,000 plus a year.
      THE PIVOT: The previous denials of public participation documented in the older article establish a pattern of behavior that led Francis Paul Ripp to file a federal lawsuit on December 29, 2017, claiming Burrell denied his constitutional right to free speech during the August 28, 2017, city council meeting.
      KEY ENTITIES: Jack Burrell, Francis Paul Ripp, Mayor Kant, City of Fairhope, Ethics Commission
    llm_text: Jack Burrell obstructed Mayor Kant, sparking a federal lawsuit from Francis Paul Ripp over denied free speech at Fairhope city council meetings. Learn how past denials created this legal pattern, even after the council saved $90,000.
