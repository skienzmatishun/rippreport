  do-your-job-pass-the-budget:
    brief: |-
      THE CONFLICT: Jack Burrell, City Council President of Fairhope, continuously obstructed the Mayor and denied citizens the right to speak at public meetings; the city budget was delayed for three months due to council obstruction.
      THE DISCOVERY: The Widget Article established Burrell's pre-existing pattern of denying citizens the ability to speak at public meetings and prioritizing interests (Fairhope Airport) over city financial prudence (rejecting a full-time city attorney that would save $90,000/year).
      THE PIVOT: The Widget Article proves that Burrell's actions on August 28, 2017 (denying Francis Paul Ripp his right to speak) were not an isolated incident, but part of a documented, long-term pattern of suppressing free speech and obstructing city governance.
      KEY ENTITIES: Jack Burrell, Francis Paul Ripp, City of Fairhope, Ripp Report/Baldwin County Legal Eagle, August 28, 2017, December 29, 2017, $90,000.
