      *   December 29, 2017: Francis Paul Ripp filed a federal lawsuit in the Southern District against Jack Burrell seeking damages for "humiliation" and "emotional pain."
      *   Historical Context: Fairhope has a history of lawsuits costing taxpayers millions, including a "triangle lawsuit" settled by Burrell using a change of agenda trick.
      *   Historical Context: Fairhope City Council acted in executive session to pay fired employees rather than going to court.
      *   Historical Context: A fifth lawsuit is pending related to Fly Creek Apartments; council overrode planning and zoning decisions.

      THE DISCOVERY:
      *   Article 2 revealed that the Fairhope City Council, under Burrell's influence, has a history of using executive session and procedural maneuvers (like agenda changes) to manage costly lawsuits and protect fired employees from public scrutiny.

      THE PIVOT:
      *   Article 2 establishes a pattern of council obstruction of the Mayor and misuse of procedure (executive session/agenda change) to settle legal matters, providing historical context to Burrell's specific August 28, 2017, denial of constitutional free speech rights detailed in Article 1.

