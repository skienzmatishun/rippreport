    refined_source: b6c4244520d29188b51a233c32f8eaf2e4f6b159b131d2771ba1bae3bfbe114b
    brief: "THE CONFLICT: \nDuring the four-year term of Mayor Karin Wilson, Councilmen Burrell, Boone, and Brown engaged in persistent bullying and interference. This follows a shift in local power four years prior when Tim Cant, described as a \"corruption rubber stamp,\" was removed from his position.\n\nTHE DISCOVERY: \nArticle 2 revealed that the \"3 B's\" (Burrell, Boone, Brown) are directly linked to Catalyst/Scott Boone Consulting (CSB), an organization run by Councilman Boone’s son, Scott Boone. The investigation identified that CSB is financed by special interests, including developers and dark money, and that Scott Boone utilizes confidential city information. Furthermore, it revealed that City Attorney Marcus McDowell—appointed by the 3 B's—is a partisan actor who supports candidate Sullivan and failed to file necessary assault charges against Ronan McSharry.\n\nTHE PIVOT: \nArticle 2 serves as the smoking gun for the current election by exposing the infrastructure behind the \"Catalyst block vote\" mentioned in Article 1. It shows that the political movement is a family-run operation (Boone/Scott Boone) designed to install Sullivan—an ex-employee who sued the city—to restore the previous era of municipal control and special interest influence.\n\nKEY ENTITIES:\n- Karin Wilson (Mayor)\n- Burrell (Councilman)\n- Boone (Councilman)\n- Brown (Councilman)\n- Scott Boone (Runs Catalyst/CSB)\n- Sullivan (Candidate/Ex-employee)\n- Marcus McDowell (City Attorney)\n- Ronan McSharry (Associate of Burrell)\n- Tim Cant (Former official)\n- Catalyst / Scott Boone Consulting (CSB)\n- Jack Burrell, Kevin Boone, Robert Brown (Incumbents)\n- Deb Hopkins, Howell Gibbens, Joshua Gammon (Challengers)"
    llm_text: Councilmen Burrell, Boone, and Brown use Scott Boone’s consulting firm to funnel dark money and confidential city data into a family-run political machine. Our investigation exposes the "Catalyst block vote" infrastructure working to install Sullivan and restore special interest rule.
    text: Councilmen Jack Burrell, Kevin Boone, and Robert Brown used Scott Boone’s firm to funnel dark money into a family-run political machine. The Catalyst bloc vote works to install Mayor Sullivan and protect special interests.
