  you-win-some-you-lose-some:
    brief: |-
      THE CONFLICT:
      - 2016: Author backed Karin Wilson and current city council including Burrell Boone and Robert Brown. Author got one out of four right: Karin Wilson. Author was wrong to trust Burrell Boone or Robert Brown; author alleged all three betrayed Fairhope and used elected office for personal gain.
      - 2016: Mayor Kant received 3066 votes.
      - 2020: Author backs Mayor Karin Wilson for re-election. Wilson has degree in finance, small business owner, used degree 25 years, mayor for 4 years, reversed $6 million annual debt to fiscal health, increased city and utility cash funds 59.18% ($17 million), paid off city long term debt and utility debt 33%, obtained $23 million in grants and restoration funds, introduced responsible growth objectives, infrastructure revitalization plan without borrowing, increased citizen engagement, received 4 Nappi Awards.
      - 2020: Fairhope has 4 mayoral candidates; 3 with college degrees, one Sullivan with high school education.
      - Sullivan: former BP "good Vibes" guy on paddle board; while Sullivan employed, former Mayor and former State Senator stole $639,000 BP grant money; Sullivan fired in 2017; since then worked for city, internet company, Foley Main Street, Riviera Utilities, resigned; one job a year over 4 years.
      - Catalyst supported by three B's: Burrell Boone, Robert Brown, Kevin Boone; incumbents faced challengers: Jack Burrell (vs Deb Hokpkins), Robert Brown (vs Howell Gibbens), Kevin Boone (vs Joshua Gammon).

      THE DISCOVERY:
      - Article 2 (older): Fresh Start Fairhope filed petition with 800 names for change of government; council thought political bear trap; council thought without legal research could select at large or districts; no decision to make; law outlines guidelines; fallout caused flood of false/misleading info; council instructed city attorney to cancel Oct. special election; true to Baldwin politics, did it; intentional; knew odds of referendum during general election had history of failing; Catalyst and good ole boys spread fear/misinformation; Fresh Start spent thousands on first proposed election date, tapped out by Nov. 6 general election.
      - Fairhope missed opportunity; majority elected not to change government; continue unsuccessful way.
      - Seven precincts crowded; Baptist Church on Fairhope Av. traffic hazard, one voting booth, long waits; civic center lines up to two hours; many left without voting.
      - Catalyst "at large" council alive and well; support from same core group believing in "Can't doctrine."
      - State Rep HD 92: Joe Faust vs Danielle Mashburn-Myrick; Faust unchallenged; council teamed with Can't core group; Kevin Boone and son Scott teamed with Joe Faust, shook locals out the door.
      - Yes vote did not wait in line or wake up on election day.
      - Catalyst and good ole boys can be beaten; core group dying off while thousands move to Fairhope each year.
      - Special election: NO vote 3887; turnout 38% (6,649 total votes); 2016 total 6,589; Catalyst/NO/Cant core group approx 3,500 ceiling; not growing base with new residents; will be overwhelmed by new voters in few years.
      - Good ole boys can rally troops; need to vote no no matter how long stand in line.
      - In 2020 Fairhope will have another general election; 3,500 core group will not be as strong.
      - Teaser: One major event could topple whole Catalyst movement and prove corruption: ## INDICTMENT.

      THE PIVOT:
      - Article 2 is older and serves as background/historical context for Article 1.
      - Article 2 covered council's attempt to cancel Oct. special election and spread misinformation; this context frames Article 1's allegations against CATALYST and the three B's.
      - Article 2's "INDICTMENT" teaser foreshadows corruption allegations in Article 1.
      - Article 2 explains Catalyst council's indecision/obstruction/misinformation that Article 1 cites as corruption.

      THE KEY ENTITIES:
      - Karin Wilson - Mayor, 2020 candidate, degree in finance, small business owner, 4 years mayor, 4 Nappi Awards.
      - Sullivan - mayoral candidate, high school education, BP "good Vibes" candidate, former mayor/state senator stole $639,000 BP grant money, fired 2017, employment history (city, internet company, Foley Main Street, Riviera Utilities).
      - Catalyst - political group, run by Scott Boone.
      - Scott Boone - Catalyst leader, Kevin Boone's son, councilman.
      - Kevin Boone - Fairhope City Councilman, Catalyst, son Scott.
      - Burrell Boone - Fairhope City Councilman, Catalyst.
      - Robert Brown - Fairhope City Councilman, Catalyst, faced Howell Gibbens.
      - Jack Burrell - Fairhope City Councilman, Catalyst, faced Deb Hokpkins.
      - Howell Gibbens - challenger to Robert Brown.
      - Deb Hokpkins - challenger to Jack Burrell.
      - Joshua Gammon - challenger to Kevin Boone.
      - Fresh Start Fairhope - petition with 800 names for change of government.
      - Fairhope City Council - Catalyst majority; instructed city attorney to cancel special election.
      - City Attorney - instructed to cancel Oct. special election.
      - Baldwin County - jurisdiction/context.
      - Fairhope, Alabama - location.
      - Joe Faust - State Rep HD 92 candidate.
      - Danielle Mashburn-Myrick - State Rep HD 92 candidate.
      - BP - oil spill; $639,000 grant money; "good Vibes" candidate.
      - Can't doctrine - core group belief.
      - Good ole boys - Catalyst-aligned group.
      - Nappi Awards - 4 awards to Mayor Wilson.
      - Mayor Kant - received 3066 votes in 2016.
