  congratulations-fairhope:
    brief: |-
      THE CONFLICT:
      - Baldwin County is experiencing an explosion of growth, especially the middle and coastal part of the county.
      - Baldwin County led the state economically; Baldwin County was number one in the state in incoming business, workforce talent attraction, and job growth for the year.
      - In 2018, there were no mega deals developed for Baldwin County, but the county enjoyed another stellar year of growth in manufacturing and retail; Baldwin County’s economy continued to boom.
      - Booming Baldwin continues to lead state economically - Lagniappe Mobile.
      - Booming Baldwin had a gain of 200 jobs; four new or relocated companies made Baldwin County home.
      - 200 jobs in Baldwin County did not sound like a “Booming” economy; question about where manufacturing jobs, car plants, or support manufacturing for the airplane industry were.
      - The 200 job gain has now been offset by a 200 job loss; no gain in a booming economy; something is wrong; lack of manufacturing.
      - North Baldwin still has the onion, mega site; who is knocking on doors, FULL TIME, trying to sell the mega site? NOBODY; they are waiting on the phone to ring.
      - Baldwin County Commission, State Senator and Representatives and Mayors should look for salespeople who knock on doors.
      - There should be a specific marketing approach targeting large and small scale manufacturing in North Baldwin; possible incentive to independent sales people that normally would not operate in that market; more people knocking on doors the better.
      - Stop waiting for the phone to ring, KNOCK ON DOORS.

      THE DISCOVERY:
      - After many years, countless meetings, most very boring, perseverance, and well written proposals, Fairhope will finally see serious BP money.
      - After taking office, Mayor Wilson and Economic Director Sherry Botop submitted new proposals, different from those Mayor Kant had submitted years earlier; the new proposals are what was just approved.
      - Mayor Can’t proposals were not acceptable; Can’t had proposed at one time to buy the Triangle property to resolve a lawsuit that ultimately cost the city 11.25 million; the former Mayor also proposed to buy the land involved in the Breland case, in court now; he never mentioned the sewer infrastructure; the former Mayor was in la la land thinking BP dollars were in the mail; Can’t is history, just like his flaky proposals.
      - Mayor Wilson, Economic Director Sherry Botop, and Fairhope staff worked hard and long; they deserve a pat on the back for securing 20 million in BP funds.
      - BP funds secured: 6.2 million going into a waterfront project, 10 million in sewer projects neglected for years, and $650,000 for an updated comprehensive land use plan.
      - Fairhope Planning Director Wayne Dyess said there will be plenty of opportunities for public participation as the city looks to define areas where growth would be most beneficial.
      - There will be numerous public meetings, Dyess said; this will be a very, very heavy public engagement aspect of the planning effort.
      - Public engagement and public participation are entirely different; hope Fairhope citizens take this opportunity to be a part of Fairhope’s future and participate in the comprehensive plan.
      - Approved BP funds will be used in a manner the funds were intended; there has been plenty of abuse by corrupt politicians.
      - Pittman is gone, with his money.
      - Former Luv Gov and his beach mansion; Bentley is gone and was last seen in Las Vegas with his honey; then there is the Beach Hotel for those who can afford it.
      - State of Alabama sucked up millions more to pay for legislative bad management and neglect of the state Medicaid deficit.
      - Congratulations, again, Mayor Wilson, Economic Director Sherry Botop, Fairhope Planning Director Wayne Dyess and all the staff who worked on the BP proposals that yielded the city 20 million dollars; approved projects are what BP money was designated for.

      THE PIVOT:
      - Article 2 is older and serves as background/historical context for Article 1.
      - Article 2 shows Fairhope finally securing serious BP money after new proposals from Mayor Wilson and Economic Director Sherry Botop were approved, unlike former Mayor Kant/Cant’s unacceptable proposals.
      - The former mayor’s failed proposals and Fairhope’s BP approval contrast with Baldwin County’s current approach of waiting on the phone to ring for the mega site.
      - No one is knocking on doors FULL TIME trying to sell the North Baldwin mega site; they are waiting on the phone to ring.
      - Article 2 is the “smoking gun” or key context for Article 1 because it demonstrates that securing economic development funds/incentives required new proposals, meetings, perseverance, and not relying on old/flaky proposals.
      - Article 1’s “KNOCK ON DOORS” framing may be tied to Article 2’s theme of proposals and securing BP money; Article 2 provides background for local government economic development efforts.

