  sheriff-mack-out-oj-french-lawsuit-in:
    brief: "THE CONFLICT: \n- Officer Brandon Thompson of the Bay Minette Police Department shot and killed OJ French Jr. during a traffic stop. \n- Officer Thompson demanded French get out of the car without probable cause, leading to a struggle over a taser and the fatal shooting.\n- Mayor Robert \"Bob\" Wills publicly lied by claiming he spoke for the French family, stating the family was \"ok with the outcome\" of the investigation and wanted the topic dropped.\n\nTHE DISCOVERY: \n- On July 31, 2024, the family of OJ French Jr., the Bay Minette Justice League, and legal counsel May Jung LLC held a rally and revealed they filed a federal lawsuit against the City of Bay Minette and Officer Brandon Thompson.\n- The dashcam/bodycam video of the shooting is being withheld from the public under the guise of \"Grand Jury Secret,\" despite the Grand Jury having already seen it and clearing the officer.\n- A political power struggle is underway in Baldwin County: the unnamed Sheriff announced in mid-July 2024 that he is resigning in mid-August 2024, pushing for Chief Deputy Anthony Lowery to be appointed by Governor Kay Ivey to finish his term. \n- County Commissioner Matt McKenzie is also lobbying for the Sheriff appointment, presenting an opportunity to disrupt the \"Boss Hogg\" influence in Baldwin County.\n\nTHE PIVOT: \n- While Article 1 (“The Jack Wilson Complex” / Mayor Bob Wills’ Bay Minette) establishes the local political power structure under Mayor Bob Wills, the widget article provides the smoking gun of ongoing corruption and cover-ups—specifically Mayor Wills lying about grieving families, a fatal police shooting with a hidden video, and a coordinated attempt by the departing Sheriff to install Chief Deputy Anthony Lowery to protect the local \"Boss Hogg\" network.\n\nKEY ENTITIES:\n- OJ French Jr. (Victim)\n- Brandon Thompson (Bay Minette Police Officer)\n- Robert \"Bob\" Wills (Mayor of Bay Minette)\n- May Jung LLC (The French Family Legal Counsel)\n- Bay Minette Justice League\n- Anthony Lowery (Chief Deputy)\n- Matt McKenzie (County Commissioner)\n- Kay Ivey (Governor of Alabama)"
