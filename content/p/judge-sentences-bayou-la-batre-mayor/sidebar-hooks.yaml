  pittman-kant-caught-new-evidence:
    brief: |-
      THE CONFLICT:
      - June 30, 2013, Mobile Press Register reported that U.S. District Judge Kristi DuBose sentenced an ex-Bayou La Batre mayor in a federal case tied to BP Boom fraud.
      - Judge DuBose said the serious issue was “not the crime; it’s the coverup.”
      - Judge DuBose said such behavior by public officials can undermine criminal justice and ruin careers.
      - Defense attorneys argued the corruption was larger than one land deal and part of a pattern.
      - A local Fairhope resident claimed Mayor Tim Kant and Senator Trip Pittman had been covering up their BP Boom fraud for three years.
      - The resident said city council members, staff, attorneys, the Alabama Attorney General, FBI, media, and Ethics Commission all knew of the coverup.
      - The resident alleged county officials Bob “Five Fingers” James, Burt, and Dorsey took roles in the scandal after seeing money.

      THE DISCOVERY:
      - On February 10, 2014, Fairhope resident F. Paul Ripp presented a document to the city council during public participation and asked Mayor Tim Kant who signed it.
      - Kant said the signature was his and that Leigh Anne Ryals had written the letter before he signed it.
      - On February 12, 2014, Ripp called Leigh Anne Ryals at her new office.
      - Ryals denied involvement in making the letter and said she never dealt with Mayor Kant, only Senator “Trip” Pittman.
      - The evidence suggested Senator Pittman manufactured the documents and affixed Kant’s signature while acting as trustee or official representative.
      - The action allegedly aimed to eliminate previously incriminating documents.
      - Ripp stated no indictments had been issued despite multiple investigations and a grand jury.
      - The new city council insulated itself by claiming the Ethics Commission approved the council giving Senator Pittman a debris removal contract after subpoenas.

      THE PIVOT:
      - Article 2 is the “smoking gun” because it provides a dated, specific example of the alleged coverup described in Article 1.
      - It shows Pittman using Kant’s name and signature to conceal documents and shift blame onto a third party.
      - It links the mayor-senator conspiracy directly to the BP Boom fraud and local public contracts.
      - It supports the judge’s criticism that the central problem was the coverup, not just the crime.

