    brief: "THE CONFLICT:  \n- On June 30, 2013, the Mobile Press Register (Brendan Kirby) reported that U.S. District Judge Kristi DuBose sentenced former Bayou La Batre/Fairhope mayor Tim Kant in a BP-related fraud/land deal case.  \n- Judge DuBose: “It's not the crime; it's the coverup.” She said such behavior by public officials can undermine criminal justice and ruin careers.  \n- Prosecutors argued the corruption was not one isolated land deal but a pattern of corruption, with “millions and millions” flowing in during Kant’s time in office while residents were vulnerable.  \n- The article alleged Mayor Tim Kant and Senator Trip Pittman had covered up their BP Boom fraud for three years and lied to citizens.  \n- Local officials named as connected: city council members past and present, city staff, city attorneys, the Alabama Ethics Commission, and the FBI (federal investigation).  \n- County Commissioners “Three Amigos” — Bob “Five Fingers” James, Burt, Dorsey — were accused of playing\
      \ a despicable role in the BP Boom Scandal.  \n- Media failure: Fairhope Courier and Press-Register ignored the scandal; local press described as an “advertising journal,” leaving federal government as the only accountability source.  \n- Name referenced for remembrance: Jason Colee.  \n\nTHE DISCOVERY:  \n- The Ripp Report received a letter from Mayor Bob Wills to Tamara French, sister of O.J. French, concerning O.J. French’s death by Bay Minette police on August 20, 2021.  \n- Wills denied coverup allegations as “without merit,” yet his behavior raised suspicion: he had an outstanding ethics complaint and a pending Alabama Bar complaint for self-dealing using his office/personal gain.  \n- Ethics Commission Executive Director Mr. Albritton was facing three lawsuits while still being paid; the Ethics Commission and Alabama Bar dismissed complaints, including possibly those against Wills.  \n- BCMCU (Baldwin County Major Crimes Unit) was investigating its own member organizations;\
      \ Bay Minette Police Chief Al Tolbert was chair, making impartiality questionable. Other BCMCU members: Robertsdale Police Chief Brad Kendrick, Baldwin County Sheriff Huey “Hoss” Mack, Gulf Shores Police Chief Edward Delmore, Daphne Police Chief David Carpenter, Foley Police Chief Thurston Bullock.  \n- Baldwin Commission Attorney Brad Hicks said he saw no ethics violation with Mayor Wills renting his building and sharing office space with the Baldwin County Legislative Delegation; the county attorney was effectively deciding ethical standards himself instead of seeking an Ethics/AG/legal opinion.  \n- Rent self-dealing: Wills allegedly secured $245,000 for the first 5 years, about $283,000 for a second 5-year extension, and $339,000 for a third 5-year extension — totaling $867,000 — for a building described as worth far less, while ethics/Bar complaints were pending.  \n- After O.J. French’s death, Bay Minette police scheduled mental health de-escalation training (AltaPoine Health)\
      \ and firearms conflict-resolution training; public information was minimal, leaving rumors about Baldwin County, BCMCU, the County Commission, the city, mayor, and council.  \n\nTHE PIVOT:  \n- Article 2 supplies concrete evidence that the same systemic pattern of local coverup criticized in Article 1 is still operating in Alabama/Baldwin County today.  \n- The Ethics Commission and Alabama Bar — institutions accused in Article 1 of shielding public officials — are again shown dismissing or ignoring complaints (Albritton, Wills), undermining public trust in local accountability.  \n- BCMCU’s self-investigating structure with Bay Minette Chief Al Tolbert as chair mirrors Article 1’s claim that local bodies cannot police themselves impartially.  \n- Mayor Wills’ $867,000 rent deal while under ethics and Bar complaints is a direct analog to Tim Kant/Trip Pittman’s alleged BP land deals/fraud: officials profiting from public resources with limited consequence.  \n- Both articles conclude\
