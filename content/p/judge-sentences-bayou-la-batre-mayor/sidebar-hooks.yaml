  a-decade-of-corruption:
    brief: |-
      THE CONFLICT:
      - June 30, 2013, U.S. District Judge Kristi DuBose sentenced former Bayou La Batre mayor to prison over a corrupt land deal during the BP oil spill recovery (Katrina-era debris work).
      - The convicted ex-mayor is identified by media as Stan Wright (Stanley Marshall Wright); he was convicted in March 2013 of four federal corruption charges and sentenced on June 30, 2013.
      - Court evidence showed he misappropriated a Katrina-related BP grant/debris transaction worth $27,300 directly to himself; the land deal netted him that sum.
      - Prosecutors and defense argued the case was not one isolated deal but “a pattern of corruption.”
      - The judge said much of it amounted to “political decisions and political promises” people could have voted out, yet she emphasized: “It’s not the crime; it’s the coverup.”
      - Fairhope Mayor Tim Kant and Alabama State Senator Tripp “Boom Boom” Pittman were named publicly as having covered up BP Boom fraud with Wright-type officials for years.

      THE DISCOVERY (Article 2):
      - The second piece documents a specific 2010 BP Boom bribery scheme: 10 years ago this week, Pittman and Kant used Fairhope staff — Greg Mims, Sherry Sullivan, Jennifer Fidler — to secure a $636,000 bid from Fairhope City to Senator Pittman for BP boom work.
      - On May 8, 2010, the Baldwin County Commission told them not to proceed with the bid; they complied then Pittman filed a second proposal under the name “Oil Recovery.”
      - On June 4, 2010, the Fairhope City Council held a special meeting and awarded the contract to “Pittman Tractor,” not Oil Recovery.
      - Six days later (June 10, 2010), Pittman received a check from Fairhopemayor for $372,165.90 marked “COMPLETED” boom work, payable to Pittman Tractor.
      - At the time, Pittman had no contract in place, no general contractor’s license, no marine insurance, no county approval, and no Ethics Commission approval.
      - Over the following 10 years, Pittman and Kant kept a debris contract with Fairhope for over 8 years until Karin Wilson was elected; they also leveraged legislation that let the Baldwin County Sheriff be re-elected twice unopposed.
      - It lists numerous related corruption matters tied to “CATALYST”: Mega Site theft, the Strawman case, Fairhope Airport bid rigging by Council President Jack Burrell, Chris Elliott DUI, the McSharry case, Spanish Fort mayor slapping an employee, Boone LLC deals, Brown art center/soccer field inside dealings, $2.65M recreation land sale, and a proposed 11.2M triangle property giveaway as a conservation easement.
      - It claims that in 10 years no politician, attorney, or judge was held accountable for these crimes.

      THE PIVOT (why Article 2 is the smoking gun):
      - Article 1’s headline conflict — a judge sentencing an ex-Bayou La Batre mayor over BP Boom corruption — sits inside the larger “decade of corruption” detailed in Article 2.
      - Article 2 provides the specific dates, dollar amounts ($636,000 bid, $372,165.90 check), contract name (“Pittman Tractor”), council meeting date (June 4, 2010), and named staff/staff members that contextualize what is really at stake in the Wright sentencing: not just a single land deal but an institutional BP boom fraud network involving Kant, Pittman, city staff, and judges/ethics bodies.
      - Article 2 directly names Mayor Tim Kant and Senator Tripp Pittman as the architects of the coverup referenced by Judge DuBose’s “coverup” quote in Article 1 — making it the key context that turns a local sentencing story into a systemic corruption investigation.

      KEY ENTITIES:
