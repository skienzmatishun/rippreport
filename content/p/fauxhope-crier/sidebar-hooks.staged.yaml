  fairhope-waterfront:
    brief: "THE CONFLICT: \n- Fairhope government officials, Mayor, City Council, Municipal Judge, and Municipal Attorney operated entirely backed by special interests, developers, and good ole boys over a 20-to-30-year period.\n- The Fairhope City Council spent $2,650,000 of taxpayer money on recreation property without any public participation.\n- The city is currently paying over $500,000 a year for full family insurance for the council and mayor, totaling $2.5 million over their term.\n- Historical institutional exclusion: Infrastructure issues and water access have been ignored for 20 years to restrict/limit African American residents and non-resident visitors from Mobile (such as implementing duck pond and beach fees).\n- Councilman Cory Martin (\"Cory the Crier\") introduced a new ordinance requiring people to annex inside city limits before tapping into Fairhope water, while publicly pushing infrastructure for commercial projects like the ALDI store and the Municipal Judge's east side project.\n\nTHE DISCOVERY (Background context from the older Waterfront article):\n- The Fairhope Waterfront project initially secured City Council approval for $500,000 for engineering and conceptual plans based on community input (493 questionnaire respondents and public meetings).\n- The project involves a $6,200,000 grant from BP—the first major project on the Fairhope waterfront in 50 years.\n- The \"CATALYST Council\" attempted to distance themselves from the plan, shifting blame to the Mayor and claiming citizens were unfamiliar with the 2-year-old proposal, while engineering firm Goodwyn Mills & Cawood held a press conference at Fairhope City Hall to dispel social media misconceptions and political attacks from the council.\n\nTHE PIVOT:\n- The older Waterfront article acts as the smoking gun because it exposes the exact same pattern of political manipulation, hypocrisy, and deflection by the Fairhope City Council (\"CATALYST Council\") that Councilman Cory Martin is now carrying forward. \n- Just as the past council played games to tank a $6.2 million BP waterfront grant while quietly spending $2.65 million on recreation property without public input, the current council is hiding behind new spokesmen like Cory Martin to push developer-driven projects (like the Municipal Judge's project and ALDI infrastructure) while ignoring 20-year-old infrastructure crises and wasting $2.5 million on council/mayor family insurance.\n\nKEY ENTITIES:\n- Cory Martin (Councilman / \"Cory the Crier\")\n- Goodwyn Mills & Cawood (Engineering firm)\n- ALDI\n- BP (Grant provider)\n- Fairhope City Council / CATALYST Council"
