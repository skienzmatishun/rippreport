      THE DISCOVERY: Article 2 (ALL MOUTH) revealed that Jack Burrell has a long history of misleading taxpayers regarding city infrastructure and sewer costs—specifically opposing a $5 million headworks replacement in favor of previous patch jobs—while covering up the true strain that out-of-control development places on city utilities. It also documented how Mayor Sullivan took on the Utilities Superintendent role to double-dip and boost her salary above $100K without proper experience, alongside a non-budgeted $2.65 million land purchase near the airport.

      THE PIVOT: Article 2 serves as the smoking gun because it exposes the multi-decade hypocrisy of veteran council members like Jack Burrell, proving that current utility and sewer crises—which new council spokesperson Cory Martin is now left to awkwardly defend—were directly caused by Burrell's past decisions to cheap out on infrastructure (choosing a $13M patch over a $20M new plant in 2013) to appease developers.

