  fauxhope-tunnel:
    brief: |-
      THE CONFLICT:
      - The City of Fairhope lost a two-decade lawsuit over the infamous "triangle" property, resulting in an $8.25 million payout.
      - The city spent $3 million on legal fees; city attorneys pledged to pay if they lost but failed to do so, instead getting brand new offices while $3 million was drained directly from city utilities to cover the settlement.
      - On May 29th, the Mayor begged the council to reconsider a conservation easement involving the 102-acre triangle property valued at $20 million, which the council was willing to give away while simultaneously proposing to buy $2.6 million of property on Hwy. 13.
      - Council members Burrell and Boone supported the lawsuit that the city ultimately lost.
      - The city spent $2.65 million on recreation land near the airport that Fairhope now leases back for $9,000 a year, and purchased the K-1 building for $4 million without a plan, subsequently requiring roughly $100,000 in temporary roof repairs as the building deteriorated.

      THE DISCOVERY:
      - Historical background shows a multi-million dollar track record of financial waste, botched land acquisitions, and lack of long-range planning by the Fairhope City Council and Mayor.
      - The city has repeatedly engaged in questionable real estate and development maneuvers, such as trying to give away a $20 million triangle property via conservation easement, attempting various abandoned proposals on the site (performing arts center, archery range, city hall/fire station, or letting Publix go across the street), and planning an underground tunnel and masterplan through Goodwyn, Mills and Cawood presented by Scott Hutchinson on Monday, March 14.
      - City leadership is tied to special interests, developers, and "good ole boys," with the city attorney protecting their agenda and a municipal judge who is a major developer in Fairhope whose projects require council approval.

      THE PIVOT:
      - Article 2 serves as the smoking gun because it exposes the deep-seated, 20-year history of financial mismanagement, developer favoritism, and backroom deals that directly enable current councilman Cory Martin's uncritical promotion of the Municipal Judge's east side commercial project and developer-driven infrastructure.
      - It proves that the current rubber-stamping of developer projects and infrastructure prioritization (like the ALDI store and judge's project) is just a continuation of the same corrupt, taxpayer-funded vanity projects and fiscal irresponsibility (such as the $8.25 million triangle lawsuit loss and $4 million uncalculated K-1 purchase) documented in the past.

      KEY ENTITIES:
      - Cory Martin (Councilman / "Cory the Crier")
      - Scott Hutchinson (Goodwyn, Mills and Cawood)
      - Burrell (Council member)
      - Boone (Council member)
      - ALDI
      - Goodwyn, Mills and Cawood
