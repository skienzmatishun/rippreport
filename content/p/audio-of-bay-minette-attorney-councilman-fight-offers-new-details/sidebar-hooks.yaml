  a-new-hope:
    brief: 'THE CONFLICT:

      - Sept. 3: Harry Still (Bay Minette attorney and former city prosecutor) fought
      with Matthew Franklin (city councilman) in downtown Bay Minette.

      - Still was arrested; official timeline from former Mayor Bob Wills and former
      Police Chief Al Tolbert stated Still attacked Franklin in his office.

      - Still claimed Franklin attacked him first, including grabbing at Still’s dog
      and threatening to kill him and the dog.

      - Sept. 4: Still told Lagniappe that police failed to get his side of the story
      before arresting him; audio later showed officers asking witnesses what happened.

      - Nov. 3 (implied by timeline context): Al Tolbert resigned from Bay Minette
      Police Chief position.

      - Aug. 26: Joshua Brown wins mayoral election against Bob Wills.

      - Dec. 14, 2021 (inferred): Still scheduled to appear in Baldwin County Municipal
      Court.

      - 2019/2020: Still’s Baldwin County Courthouse security pass revoked for “suspicious”
      phone behavior and alleged aggression toward city officials; BMPD unsuccessfully
      petitioned court to commit him to a mental institution; he was barred from city
      facilities by bond conditions.


      THE DISCOVERY:

      - Article 2 reveals Still was convicted in Bay Minette Municipal Court for the
      Franklin altercation but later found not guilty in a jury trial de novo.

      - Still argues the prosecution was politically motivated because Franklin, as
      a councilman, would vote on Still’s reappointment as city prosecutor; witnesses’
      testimony was inconsistent.

      - Still cites audio evidence proving Franklin was the initial aggressor.

      - Prosecutor Liam Scully (son of a judge) is criticized as unprepared; Scully
      recently lost an election to Grant Blackburn.

      - Still claims systemic retaliation involving former Police Chief Al Talbert,
      Judge Marcus McDowell (2022 bar complaint), and other local officials; he was
      removed from a police station by officers in tactical gear.

      - Still plans to sue Mayor Wills, local news outlets, and the City of Bay Minette
      for defamation and malicious prosecution.

      - Sen. Chris Elliott state legislation is alleged by Still to be retaliatory
      in response to his case.


      THE PIVOT:

      - Article 2’s not-guilty de novo verdict directly contradicts Article 1’s premise
      that police and city officials had secured a conviction against Still for attacking
      Franklin.

      - The audio evidence highlighted in both articles shows inconsistencies between
      Still’s account and the official version, making the jury acquittal the pivotal
      legal counterpoint.

      - Article 2 reframes the conflict from “attacker vs. victim” to “victimized
      by politically motivated prosecution,” which is why it is the key context for
      understanding Article 1’s fight over narrative control in the public audio.


