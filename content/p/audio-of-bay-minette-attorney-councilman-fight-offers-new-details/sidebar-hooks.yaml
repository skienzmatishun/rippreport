  not-guilty-innocent:
    brief: 'THE CONFLICT:

      - Sept. 3, 2025: Harry Still (Bay Minette attorney) and Matthew Franklin (City
      Councilman) physically fought in Franklin’s downtown Bay Minette office; the
      scuffle continued onto the street.

      - Still was arrested on a misdemeanor assault charge after being restrained
      while allegedly grabbing or touching him.

      - Former Mayor Bob Wills, former Police Chief Al Tolbert, and police statements
      claimed Still attacked Franklin first.

      - Still countered that Franklin attacked him first and grabbed his dog, threatening
      to kill both of them.

      - In 2019–2020, Still’s Baldwin County courthouse security pass was revoked
      for “suspicious” cellphone behavior and alleged aggression toward city officials.

      - BMPD unsuccessfully filed a petition to have Still committed to a mental institution.

      - The death of O.J./Otis French in Bay Minette (ruling: “justified”) remained
      tied to police misconduct that Still represented victims of.


      THE DISCOVERY:

      - A jury returned a NOT GUILTY verdict for Harry Still after five minutes of
      deliberation; he was declared “INNOCENT.”

      - Judge Marcus McDowell (Bay Minette Municipal Court) ignored the audio recordings
      Still provided, which showed officers asking witnesses what they saw, and failed
      to follow legal process.

      - Circuit Court Judge Scott Taylor dismissed the mental-commitment petition;
      McDowell should have recused himself due to Alabama Bar complaints in the Ronan
      McSherry assault case represented by Still.

      - Baldwin County Sheriff Lowery issued a “beware of Harry Still” bulletin to
      officers before his conviction.

      - State Sen. Chris Elliott filed (and failed) legislation citing Still’s incident
      as inspiration for harsher punishments for attacking local politicians.

      - Al Tolbert, now with BCSO, denied telling his officers to “get the f_ck out”
      before Joshua Brown took office; Still claimed to have relayed this conversation
      to Franklin.

      - Matt Franklin admitted in court multiple times that he threatened to kill
      Harry Still and his dog.

      - Lowery’s bulletin, the defamation for “challenging status quo,” and the failed
      legislation all surfaced as part of the legal fallout.


      THE PIVOT:

      - Article 2 is the smoking gun because it proves the NOT GUILD verdict, exposing
      municipal court Judge McDowell’s failure to use the audio evidence and his conflict
      of interest.

      - It reveals Sheriff Lowery’s pre-arrest “beware” bulletin and police defamatory
      actions that cost Still $tens of thousands in legal costs.

      - The legislation by Sen. Chris Elliott citing Still’s case as inspiration further
      corroborates political weaponization, while Franklin’s in-court admission of
      threats validates Still’s account that he was the aggressor.

      - These facts directly counter the official timeline promoted by Wills and Tolbert
      in Article 1.


      KEY ENTITIES:

      - Harry Still (Bay Minette Attorney)

      - Matt/ Matthew Franklin (Bay Minette City Councilman)

      - Al Tolbert (Former Bay Minette Police Chief / BCSO)

      - Bob Wills (Former Mayor of Bay Minette)

