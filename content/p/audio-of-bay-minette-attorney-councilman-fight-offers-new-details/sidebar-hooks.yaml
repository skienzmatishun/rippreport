      Still’s dog.

      - Official Version: Former Mayor Bob Wills and former Police Chief Al Tolbert
      stated that Still attacked Franklin in his office, leading to Still''s arrest
      by the Baldwin County Sheriff’s Office (BCSO) and Bay Minette Police Department
      (BMPD).

      - Judicial Outcome: Despite the initial charges, a jury subsequently acquitted
      Harry Still of the assault charges.

      - Political Context: Joshua Brown won the mayoral election against Bob Wills
      on August 26; Al Tolbert resigned from his role as BMPD Chief on November 3,
      amid claims (alleged by Still) that Tolbert instructed officers to leave before
      Brown took office.

      - Additional Allegations: Harry Still alleged that BSO and Pritchard authorities
      targeted him because of his independent investigation into the death of Danny
      Williams (Orange Beach Mayor Tony Kennon''s close friend) in May 2022, specifically
      citing missing body camera footage and a "dry drowning" diagnosis.


      THE DISCOVERY:

      - The widget article confirms that Harry Still was legally proven innocent and
      acquitted by a jury for the assault charges brought against him by local law
      enforcement.

      - Still asserts on the podcast ("Heart of Dixie") that the arrest and prosecution
      were a coordinated "setup" designed to silence him while he investigated local
      corruption involving Mayor Tony Kennon and the police department.

      - The podcast links Still''s legal troubles to the investigation into Danny
      Williams'' death in Perdido Pass, suggesting motive for local officials to discredit
      or remove Still from his investigative role.

      - It explicitly states that the initial news narrative (that Still had a history
      of aggression and was tied to building lockdowns) was misleading because it
      ignored the jury verdict of innocence.


      THE PIVOT:

      Article 2 serves as the "smoking gun" for Article 1 because it reframes the
      conflict depicted in the main article from one of an alleged violent assault
      by a suspect attorney to one of government overreach and wrongful prosecution
      against a legitimate investigator. The main article presents the fight as a
      contested incident where police "didn''t get his side," while the widget article
      proves that the criminal charge itself was baseless (acquittal), thereby validating
      Still''s claim that he was targeted for his independent work rather than simply
      having a physical altercation. It shifts the focus from a personal dispute to
      systemic misconduct by local law enforcement and political leadership.


