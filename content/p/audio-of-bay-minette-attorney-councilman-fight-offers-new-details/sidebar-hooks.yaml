  sheriff-huey-boss-mack-secret-police-2:
    brief: 'THE CONFLICT:

      *   September 3, 2025 (implied current year based on Sept. 4 follow-up): Harry
      Still, Bay Minette attorney and former security at Baldwin County Courthouse,
      engaged in a physical altercation with Matthew Franklin, City Councilman, in
      downtown Bay Minette.

      *   Former Mayor Bob Wills and Police Chief Al Tolbert officially claimed Still
      attacked Franklin in his office; audio from the incident shows Franklin yelling
      "Get the f_ck out of my office" at Still and threatening to kill Still’s dog.

      *   Al Tolbert resigned as Bay Minette Police Chief on Nov. 3, following Joshua
      Brown''s victory over Bob Wills in the Aug. 26 mayoral election; video evidence
      revealed Tollbert allegedly told officers to "quit before [Brown gets in]" office.

      *   In Dec. 2021, Still was scheduled for court regarding a prior incident (implied
      Oct/Nov) where he was arrested after being barred from city facilities due to
      revoked security pass for “suspicious” phone use and aggression toward officials;
      his competency was unsuccessfully challenged by the BMPD.

      *   The Lagniappe lawsuit (filed circa 2019-2020, decision Sept. 30, 2021) sought
      public access to law enforcement investigative records including body cam footage,
      autopsies, and 911 transcripts.


      THE DISCOVERY:

      *   The *Lagniappe v. Baldwin County* legal decision (Sept. 30, 2021) granted
      a blanket exemption for "investigative privilege" that barred public access
      to ANY law enforcement records connected in any way to an investigation in Alabama.

      *   Judge William Cassady (U.S. District Court) ruled that plaintiffs made an
      adequate showing of recurring potential violations, triggering liability even
      without established patterns.

      *   Chief Justice Tom Parker called it a "Closed Records Act" and the Alabama
      Press Association noted citizens lose access to body cams, surveillance video,
      911 transcripts, and autopsies.

      *   This legal framework enabled the BCSO to suppress or withhold video/audio
      evidence in high-profile cases: the May 2017 death of Jonathan Victor (alleged
      lack of crisis intervention training), March 5, 2018 shooting of Robert Yates
      by SWAT firing >114 rounds into his home after he was silent for hours and fired
      only one warning shot; the uninvestigated strangulation of confidential informant
      Peyton Little in a moving car (no questions asked); and other BCSO cases without
      FBI/ALEA involvement.

      *   BCSO received over $65M in 2020-2021 despite lacking de-escalation training
      as of 2017; Sheriff Huey “Boss” Mack’s private business (Hoss Mack Funeral Home)
      held a county contract for deceased persons under special circumstances, creating
      conflicts of interest.


      THE PIVOT:

      *   The Lagniappe decision is the "smoking gun" because it legally insulated
      BCSO and municipal law enforcement from public oversight by sealing all investigative
      records, including the audio recordings central to Harry Still’s dispute with
      Matthew Franklin (Sept. 2025), Al Tolbert’s resignation video, and prior BCSO
      shootings.

      *   Without the Lagniappe precedent, the Bay Minette police could have been
      held accountable for suppressing or denying access to the Sept. 3 fight audio
      that contradicted Wills and Tolbert''s official account; instead, this decision
      allows agencies to cite "investigative privilege" to withhold evidence in cases
      involving officers like Al Tolbert (resigning Nov. 3) or BCSO deputies involved
      in Victor, Yates, Little deaths.

      *   The Lagniappe ruling created a legal vacuum where police misconduct, including
      the "secret police" dynamics of Sheriff Mack and his deputies'' participation
      in the Yates incident, can be investigated internally without external scrutiny,
      directly enabling the concealment that Harry Still alleges regarding the Sept.
      3 fight.


      KEY ENTITIES:

      *   Harry Still (Bay Minette Attorney)

      *   Matthew Franklin (City Councilman)

      *   Bob Wills (Former Bay Minette Mayor)

      *   Al Tolbert (Former Bay Minette Police Chief)

      *   Joshua Brown (Mayor-Elect of Bay Minette)

      *   Otis French (Victim of fatal police shooting, likely unrelated but listed
      in original context)

      *   Huey “Boss” Mack (Baldwin County Sheriff)

      *'
