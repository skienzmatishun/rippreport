  fairhope-airport-un_authorized:
    brief: |-
      THE CONFLICT:
      *   Dec 23, 2015: Fairhope Airport Authority signed a memorandum of lease with Mid-Bay Air LLC.
      *   August 7, 2015: Three board members resigned (though the context suggests the conflict started prior to this).
      *   Post-resignation: Joe McEnerey appointed Chairman, Pam Caudill appointed Vice Chair, Ray Hix appointed Secretary/Treasurer.
      *   2015/2016: Ray Hix, as Airport Authority board member, gained privileged confidential information regarding leases and bids.
      *   Nov 8, 2016: A request was made to the Alabama Ethics Commission regarding the Mid-Bay Air Lease (awarded around Dec 2015).
      *   Dec 2, 2016: Alabama Ethics Commission replied that no lease had ever been submitted to them.
      *   One year ago (prior to today's controversy): Fairhope City Council was noted to have failed additional training in Alabama Ethics.

      THE DISCOVERY:
      *   The lease signed on Dec 23, 2015, was never filed with the Alabama Ethics Commission, violating the Ethics Opinion (No. 2016-04).
      *   The Ethics Opinion prohibited an Airport Authority member from using confidential information for personal benefit.
      *   Jack Burrell, City Council President and Airport Authority Board Member, reviewed bids and determined his associate board member (Ray Hix) as the winner, despite obvious conflicts of interest.

      THE PIVOT:
      *   The past ethical and procedural failures (2015-2016), noted in the Widget Article, provide prior indication ("every indication that something stunk") leading up to the current airport controversy mentioned in the Main Article.
      *   The resurfacing of these old deeds is connecting previous bad behavior to the current public controversy.

      KEY ENTITIES:
      *   Fairhope Airport Authority
      *   Fairhope City Council
      *   Ray Hix
      *   Jack Burrell
      *   Joe McEnerey
      *   Pam Caudill
      *   Mid-Bay Air LLC
      *   Alabama Ethics Commission
      *   Sonny Callahan Airport
    llm_text: Ray Hix used confidential data and Jack Burrell overlooked conflicts when awarding the Mid-Bay Air LLC lease in 2015. Old ethics failures at Fairhope Airport Authority show exactly why the current airport controversy is not a surprise.
