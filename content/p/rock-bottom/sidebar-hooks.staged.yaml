      *   Mr. McCallum (Executive Director of the Alabama State Bar) was involved in 17 ethics violations but has no disciplinary record.
      *   Harry Still filed 12 bar complaints in 2022 against Roman Shaw, Jeremy McIntyre, and Phillip McCallum.

