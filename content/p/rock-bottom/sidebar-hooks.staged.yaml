  letter-to-the-alabama-attorney-general:
    brief: |-
      THE CONFLICT:
      - Francis Paul Ripp / The Ripp Report filed ethics complaints, Alabama Bar complaints, and a Writ of Mandamus in the Circuit Court of Montgomery County regarding Alabama Ethics Commission Director Tom Albritton.
      - In 2021, the Ripp Report and Lagniappe exposed Tom Albritton for self-dealing as a trustee of the Mabel Amos Memorial Scholarship Trust.
      - Tom Albritton's children (son and daughter) received a combined total of $135,000 ($105,000 specifically noted as going to his daughters for the University of Texas) in scholarships from the Mabel Amos Memorial Trust, with distributions starting in 2012 and continuing until 2019 (spanning before and after he became Ethics Director in 2015).
      - A report by White cited violations of three articles of the trust's formation, including personal inurement and self-dealing, noting total suspicious disbursements of $257,844 to children of board members and associates.
      - Attorney General Steve Marshall failed to respond to or investigate complaints delivered personally by Francis Paul Ripp in Montgomery regarding a Fairhope councilman using a board position for personal enrichment, instead passing complaints to the Bar and Ethics Commission.
      - During the 2022 election cycle, candidate Still ran against incumbent AG Steve Marshall (R-Baldwin) and made stump speeches attacking the Ethics Commission, the Mabel Amos Trust, and Tom Albritton's activities.

      THE DISCOVERY:
      - The older widget article (the formal letter from Francis Paul Ripp to Alabama Attorney General Steve Marshall) demonstrates that the allegations, evidence, Lagniappe articles ("SELF-DEALING"), Ethics Complaints, Bar Complaints, and Writs of Mandamus concerning Tom Albritton's self-dealing have been actively pressed upon the Attorney General's office for years without meaningful prosecution or accountability from state enforcers.

      THE PIVOT:
      - Article 2 serves as the smoking gun because it establishes a multi-year paper trail proving that the Attorney General's office was directly and formally notified of Tom Albritton's corruption via delivered investigative documents as early as 2021, yet state oversight bodies continue to shield Albritton, exposing the systemic hypocrisy and failure of Alabama's top law enforcement.

      KEY ENTITIES:
      - Tom Albritton (Director, Alabama Ethics Commission / Trustee, Mabel Amos Memorial Trust)
      - Francis Paul Ripp / The Ripp Report
      - Steve Marshall (Alabama Attorney General)
      - Rob Holbert (Editor, Lagniappe)
