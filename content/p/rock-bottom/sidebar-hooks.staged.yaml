  key-figures:
    brief: "THE CONFLICT:\n- The 2005 wrongful conviction of Murray Lawrence Jr. in Baldwin County.\n- Key procedural failures: No state-ordered autopsy, no murder weapon, no DNA, no fingerprints, and an indictment unsigned by the grand jury foreman.\n- Evidence issues: The prosecution's theory of a gunshot wound contradicted forensic testimony from pathologist Dr. Paul McGarry (who cited strangulation) and the official death certificate.\n- Presiding officials: Judge Robert Wilters (who allowed the trial to proceed despite contradictions) and District Attorney David Whetstone (who pushed the case forward despite lack of evidence).\n\nTHE DISCOVERY:\n- The officials responsible for the 2005 conviction successfully ascended to high-level positions of authority rather than facing discipline.\n- Hoss Mack moved from Baldwin County Chief Deputy to Sheriff, and now serves as Executive Director of the Alabama Sheriffs Association.\n- Anthony Lowery moved from lead investigator to Appointed Baldwin County Sheriff.\n- Robert Wilters transitioned into a senior figure of influence within the Alabama legal system.\n\nTHE PIVOT:\n- Article 2 provides the historical blueprint for the \"power structure\" described in Article 1. \n- It establishes a documented pattern where Alabama officials protect one another and use their positions to consolidate power.\n- This explains why Tom Albritton can allegedly engage in 12 years of self-dealing—including the disbursement of $257,844 in questionable scholarships and $135,000 specifically to his own children via the Mabel Amos Memorial Trust—and remain the head of the Alabama Ethics Commission without facing prosecution or removal.\n\nKEY ENTITIES:\n- Tom Albritton (Director, Alabama Ethics Commission)\n- Mabel Amos Memorial Trust\n- Murray Lawrence Jr. (Wrongfully convicted)\n- Robert Wilters (Former Baldwin County Circuit Court Judge)\n- Hoss Mack (Executive Director, Alabama Sheriffs Association)\n- Anthony Lowery (Appointed Baldwin County Sheriff)\n- David Whetstone (Former Baldwin County District Attorney)\n- Steve Marshall (Alabama Attorney General)"
