labama oversight agencies exist to protect the corrupt rather than prosecute them.\n\nKEY ENTITIES: \n- Tom Albritton (Alabama Ethics Commission Director / Trustee)\n- Mabel Amos Memorial Scholarship Trust\n- Steve Marshall (Alabama Attorney General)\n- Mr. Ripp (The Ripp Report)\n- Rob Holbert (Lagniappe Editor)\n- White (Investigative Report Author)\n- Mr. Still (2022 Attorney General Candidate)"
