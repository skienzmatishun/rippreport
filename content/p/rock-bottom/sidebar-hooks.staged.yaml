  medical-cannabis-issues-licenses:
    brief: "THE CONFLICT: \n- Tom Albritton (Alabama Ethics Commission Director) engaged in self-dealing and diverted children's scholarship money from the Mabel Amos Memorial Trust.\n- Albritton's children (a son and daughter) received a combined total of $135,000 in scholarships from the Trust, beginning in 2012 and continuing until 2019 (four years after he became ethics director in 2015).\n- A report by White detailed that total disbursements violating personal inurement and self-dealing rules reached $257,844, benefiting members of the Board and associates, including Albritton.\n- The Ripp Report and Lagniappe broke the story and filed Ethics and Bar complaints against Tom Albritton as far back as 2021.\n- Attorney General Steve Marshall filed a civil action alleging Tom Albritton improperly benefited from the Trust where he served as a trustee.\n- Mr. Ripp filed a Writ of Mandamus in the Circuit Court of Montgomery County to force the Ethics Commission to review complaints disposed of by Albritton without investigation.\n- Harry Still ran for Attorney General in 2022 against Steve Marshall, campaigning on Albritton's activities and the Mabel Amos Trust.\n- Lagniappe Editor Rob Holbert conducted years of investigative reporting, with follow-up articles published around September 9th.\n\nTHE DISCOVERY: \n- (Historical Context from Widget Article - Jan 22, 2026): The Alabama Medical Cannabis Commission (AMCC) issued three new medical cannabis dispensary licenses and approved five certifying physicians under the Darren Wesley “Ato” Hall Compassion Act. \n- The state's regulated cannabis program moved forward with strict oversight requirements (product tracking, security, patient verification), contrasting sharply with the deep-seated corruption and lack of oversight highlighted in the main article regarding state ethics enforcement.\n\nTHE PIVOT: \n- The historical background of the state's tight regulatory rollouts (like the cannabis program overseen by the AMCC) stands in stark contrast to the total lack of accountability for top ethics officials. While the state enforces strict compliance on new industries, the man tasked with policing state ethics (Tom Albritton) remains in power despite documented, years-long evidence of self-dealing and civil allegations regarding the Mabel Amos Memorial Trust. Article 2's documented state regulatory actions highlight the hypocritical double standard of a \"failed state\" where ordinary rules apply to new markets, but elite enforcers like Albritton operate with complete impunity.\n\nKEY ENTITIES:\n- Tom Albritton\n- Mabel Amos Memorial Scholarship Trust\n- Rob Holbert\n- Steve Marshall\n- Harry Still\n- Mr. Ripp\n- White (Report author)\n- Alabama Ethics Commission\n- Alabama State Bar\n- Alabama Medical Cannabis Commission (AMCC)\n- Chey Lindsey Garrigan\n- Alabama Cannabis Industry Association"
