  listening-not-reading:
    brief: |-
      THE CONFLICT:
      *   1/12/11: Fairhope citycouncilman Rick Kingrea sent a "plain vanilla request" to the Attorney General referencing the BP oil spill and alleged ethical/criminal violations by a public official (Sen. Pittman).
      *   Prior to 2017: Jack Burrell misled the public regarding the Fairhope Airport Authority's lease of a $750,000 hanger, claiming no profit was made, despite the Ethics Commission requiring a bid process when a public official (Mr. Hix) was on the board.
      *   August 28, 2017: Jack Burrell, as City Council President, refused to allow the Ripp Report author to speak during a Fairhope City Council public participation meeting.
      *   Post-2017: The Ripp Report sued the City of Fairhope; settled with the Insurance Company; deposited settlement funds to benefit the Ripp Report.

      THE DISCOVERY:
      *   Article 2 revealed a pattern of Burrell misrepresenting facts (e.g., the Airport Authority lease) and operating against Ethics Commission guidance regarding public bidding, not just the isolated 2017 speaking refusal.
      *   Article 2 details Burrell's political motivations, including supporting himself through Mayor Kant and later running against a "faux candidate."
      *   Article 2 confirms Karin Wilson became Mayor in a fair election supervised by the Sec. Of State, following political maneuvering involving Kant.

      THE PIVOT:
      *   Article 2 establishes that Burrell's actions are not merely procedural or personal, but rooted in a broader disregard for ethical standards and public transparency, evidenced by the Airport Authority/Ethics Commission conflict dating back years.
      *   This historical pattern of obstruction and misleading the public provides context that his refusal to allow speech on August 28, 2017, was consistent with a deliberate, institutional refusal to be accountable, rather than a simple administrative error.

      KEY ENTITIES:
      *   Jack Burrell (City Council President)
