  fairhopes-blast-from-the-past:
    brief: |-
      THE CONFLICT:
      *   Fairhope City Council (18 months prior to Widget article) was characterized by obstruction and mismanagement.
      *   Jack Burrell was involved in an Airport Scandal, police reports blaming his son, and allegations of drinking and threatening the owner of McSherry’s.
      *   Kevin Boone (grandpa Catalyst) was connected to John Avant of Prebble Rish, supported the Catalyst cause, and possessed multiple LLCs.
      *   Robert Brown (The Jester) secured soccer field contracts, linked to the Single Tax Colony via Cliff Pittman, and self-awarded an Art Center contract, facing Ethics charges.

      THE DISCOVERY:
      *   The "at large" election system enables the Catalyst faction to slate candidates and deceive voters in Fairhope.
      *   The Council/Manager form of government (Mayor + 1 at large Council person + 3 district representatives) is presented as a necessary move forward.

      THE PIVOT:
      *   Article 2 establishes a historical pattern of systemic corruption, obstruction, and misuse of power by the "Catalyst" faction in local government (Fairhope).
      *   Article 1 (November 2018) demonstrates the continuation of this pattern in Baldwin County, where the Catalyst faction (represented by Elliott) utilized improper deals (4 million/10 years to School Board), leveraged lobbyists (Jon Gray), and engaged in electoral manipulation against People's Choice candidates (e.g., Billie Jo Underwood, Christy Olinger Edwards).

