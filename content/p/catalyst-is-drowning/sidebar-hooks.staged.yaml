  catalyst-held-back:
    brief: |-
      THE CONFLICT:
      Initial 2018 Baldwin County elections saw Catalyst candidates (backed by over $500,000) running against People's Choice candidates (less than $10,000). Key races included State Senate Seat 32 (Elliott vs. David Northcutt), County Commission District 3 (Billie Joe Underwood vs. Tucker Dorsey), and the Catalyst Queen (Judge Thomasson) vs. Christy Edwards.

      THE DISCOVERY:
      In the older article, voter turnout in Baldwin County was low (36,073 out of 150,104 registered, or 24%). Catalyst secured only three races (County Commission District No. 1, Joe Davis beat John Lake, Skip Gruber beat Jerry Johnson) but failed to secure outright victories in the top three targets (Thomasson, Elliott, Dorsey).

      THE PIVOT:
      The older article established the vulnerability of Catalyst and the high stakes of the run-off races; the newer article provides the final results, showing People’s Choice successfully flipping three major races (Underwood/Dorsey, Edwards/Thomasson, and Elliott/Northcutt) despite Catalyst’s initial financial advantage.

