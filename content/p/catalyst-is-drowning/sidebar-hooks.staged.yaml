      *   Campaign allegations included a deal with Superintendent Eddie Tyler costing the School Board $4 million/year ($40 million in ten years).
      *   Elliott's campaign used the Baldwin County School Board lobbyist and employed Jon Gray of Strategy.
      *   Billie Jo Underwood defeated Tucker Dorsey for County Commission Place 3.
      *   Christy Olinger Edwards defeated the Catalyst Queen.
      *   Michelle Thomasson faced challenges in the Baldwin County Family Court.

      THE DISCOVERY:
      *   January 3, 2018: Chris G Stradtman Elliott and his wife purchased a waterfront property in Elberta on Key Hole Rd.
      *   The property was valued at $290,000.
      *   The purchase price was $49,725.20.
      *   Elliott took a $100,000 purchase money mortgage from Trustee National Bank in Daphne.

      THE PIVOT:
