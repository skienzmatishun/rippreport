      THE DISCOVERY: In 2016, just before his defeat, Mayor Kant attempted to use the Planning and Zoning Board (Sept 6, 2016) to push through Multiple Occupancy Projects (Retreat at Fairhope Village by Preble-Rish, LLC; Old Battles Place by Hutchinson, Moore, & Rauch, LLC) benefiting campaign contributors, and supported Angelo Corte's legal attempt via Hand Arendall, despite infrastructure limits and negative financial impact.

      THE PIVOT: Article 2 provides dated, specific evidence (September 6, 2016) that Kant's alleged mismanagement and "good ole boy club" mentality were not only historical but actively continued right up to his political exit, undermining the transition to Mayor Wilson and demonstrating self-serving behavior against taxpayer interests.

