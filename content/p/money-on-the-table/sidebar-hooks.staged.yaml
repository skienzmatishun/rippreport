      - In spite of success of Tiki Bar, American Legion in January 2019, without any reasonable explanation, canceled agreement with Dinardi; she had received nothing but compliments prior to cancellation and assault incident; Dinardi was preparing for 2019 season when American Legion suddenly canceled agreement.
      - Incident with McSharry started spiraling sequence of events that left Dinardi without job; many believe politicians used their influence to remove Dinardi from American Legion, per author.
