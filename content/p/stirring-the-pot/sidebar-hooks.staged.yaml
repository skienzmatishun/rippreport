  dear-congressman-bradley-byrne:
    brief: |-
      THE CONFLICT:
      Past events centered on the Fly Creek area in Fairhope involving alleged corruption and environmental damage.
      Specific parties involved included Mayor Kant and Mr. Arthur Corte.
      A previously settled triangle lawsuit in Fairhope cost taxpayers $11.25 million, which Mayor Kant facilitated without public notification.
      Involvement in BP fund abuse included Sen. Pittman and Mayor Kant, who siphoned $636,000 for a contract.

      THE DISCOVERY:
      The Widget article (older) documented that the damage to Fly Creek was caused by the Publix project development, not "historic flooding."
      It revealed that 95% of constituents opposed the Fly Creek Apartments despite Mayor Kant and Mr. Corte driving the rezoning process.
      It identified the Fly Creek issue as "corrupt to the core" and called for a criminal investigation into the collusion between Mayor Kant and Mr. Arthur Corte.

      THE PIVOT:
      The Widget article provides historical proof of systemic corruption involving Mayor Kant, Mr. Corte, and tax/environmental misuse (e.g., $11.25M lawsuit, BP fund fraud).
      This history of corruption (Widget) provides context for the current claims in the Main article (Burrell) that Mayor Kant is involved in actions that will result in legal jeopardy ("Karma and Fate are going to catch Jack").

