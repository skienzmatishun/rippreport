      26, 2018 (last day of qualifications for municipal election).

      - The entire council was challenged; challengers ran as a slate to replace the
      "status quo" and break the "good ole boy culture."

      - In the lead-up to an Oct. 2, 2018 referendum (intended to change Fairhope
      to Council-Manager/District form of government), the Council allegedly suppressed
      citizen participation: no non-partisan workshops or town meetings held in the
      prior three months; citizens were not allowed to speak during meetings; an attorney
      was hired just 11 days before the election to research legal issues.

      - The Council is described as a "hand-picked slate of Catalyst candidates pledged
      to former Mayor Tim Kant."


      THE DISCOVERY:

      - Article 2 ("FAIRHOPE - CATALYST a Dirty Little Secret") reveals that the Fairhope
      City Council is a political machine known as "Catalyst," composed of hand-picked
      members pledged to former Mayor Tim Kant.

      - Fresh Start Fairhope alleges the Council secretly plotted to deny citizens
      a vote by seeking a Temporary Restraining Order (TRO) to cancel the Oct. 2,
      2018 referendum election.

      - Council President Jack Burrell claimed he did not know the Attorney General''s
      phone number, despite having "Nick Saban" on speed dial; Councilman Jay Robinson
      (an attorney) allegedly failed to clarify facts with AG Steve Marshall before
      a special meeting.

      - The Catalyst Council is accused of filing a complaint against Mayor Karin
      Wilson for trying to inform the public about districts.

      -Chuck Zunk (Fresh Start Fairhope): "The legal advice they seek now is specifically
      to stop the election from taking place."


      THE PIVOT:

      - Article 1 presents the election as a simple binary: "status quo" (incumbent
      council) vs. "change" (the challenge slate, Troy Vickers/Joshua Gammon/Tracy
      Gatewood/David Luc/George Ferniany). It frames voting for the challenge slate
      as the answer to eliminating the council''s collusion and control.

      - Article 2 reframes this binary: the "incumbent council" itself is the product
      of a single political entity (Catalyst), allegedly tied to former Mayor Tim
      Kant, which has actively worked to suppress the very referendum that was supposed
      to *replace* them. The "good ole boy culture" Article 1 wants to eliminate is,
      according to Article 2, not just bad governance but an organized political machine
      (Catalyst) that allegedly sought a TRO to cancel the election and has filed
      complaints against outgoing/incoming officials for informing the public.

      - Therefore, voting for the challenge slate in Article 1 may only replace one
      set of "incumbents" with another if Catalyst remains in power; understanding
      the historical manipulation by Catalyst is necessary context before deciding
      whether replacing 5 council members truly breaks the status quo.


      KEY ENTITIES:

      - City Council (Fairhope)

      - Mayor Karin Wilson

      - Former Mayor Tim Kant

      - Catalyst (political entity/machine connected to the City Council)

      - Fresh Start Fairhope (Citizens'' group)

      - Chuck Zunk (Spokesperson for Fresh Start Fairhope; former Chairman of Financial
      Advisory Committee and Airport Authority)

      - Jack Burrell (Council President)

      - Jay Robinson (Councilman and Attorney)

      - AG Steve Marshall (Attorney General)

      - Nick Saban (Individual referenced by Council President Jack Burrell, on speed
      dial)

      - Troy Vickers, Joshua Gammon, Tracy Gatewood, David Luc, George Ferniany (Challenger
      candidates in the upcoming municipal election)'
