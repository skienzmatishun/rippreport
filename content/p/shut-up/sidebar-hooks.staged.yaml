hooks:
  all-smoke-and-mirrors:
    brief: |-
      THE CONFLICT:
      *   Fairhope Airport Authority purchased 265 acres of land adjacent to the airport on March 15, 2007, for $8,845,000, with the City of Fairhope as the guarantor.
      *   The City of Fairhope has paid over $3.6 million toward this debt since 2007.
      *   The debt, which balloons in 2020 for $6.9 million, constitutes 21% of the city’s overall debt.
      *   Prior to Mayor Wilson's term (Nov 7, 2016), Jack Burrell and the Airport Authority prioritized minimal transparency, resulting in the failure to renegotiate refinancing terms before the November 16, 2016 deadline.

      THE DISCOVERY:
      *   The Fairhope Airport Authority uses tax dollars to hire attorneys to investigate and discredit private citizens who file legitimate complaints against the board.
      *   The Authority maintains control and ownership of the land despite the City assuming the debt through appropriation.

      THE PIVOT:
      *   Article 2 reveals the Authority’s systemic pattern of using taxpayer funds for self-defense and intimidation, providing context for the lack of transparency (undisclosed penalties, excluded meetings) detailed in Article 1.
      *   This self-protective mechanism confirms that the resistance to Mayor Wilson's transparency push is institutional, not merely administrative.

      KEY ENTITIES:
      *   Mayor Karin Wilson
      *   Jack Burrell
      *   Joe McEnerney (Airport Authority Chairman)
      *   Fairhope Airport Authority
      *   City of Fairhope
      *   Paul Ripp (Citizen filing ethical complaints)
      *   Rod Kanter (Bond attorney)
      *   Tut Wynn (City attorney)
      *   Matt McDonald (City attorney)
      *   Bryant Bank (Winning refinance bidder, Feb 2017)
    llm_text: Fairhope City paid over $3.6 million for airport land debt, yet the Fairhope Airport Authority used tax dollars to intimidate citizens like Paul Ripp. Mayor Karin Wilson fights institutional control, confirming the Authority's resistance to transparency is systemic, not just administrative.
