  caught-trap-like-rat:
    brief: |-
      THE CONFLICT:
      *   2007: Airport Authority purchased 265 acres of land adjacent to Fairhope Airport for $8,845,000; City of Fairhope acted as guarantor.
      *   The city committed indefinitely to the loan, paying $3.6+ million since 2007.
      *   The loan was refinanced in 2010 ($8,935,000 with RBC Bank, later PNC Bank) with a balloon payment due in March 2020 ($6.9 million).
      *   2016-2017: Mayor Karin Wilson sought transparency regarding the debt and refinance process; Jack Burrell (Council President) resisted transparency.
      *   2017: Council unanimously approved keeping the land in the Airport Authority’s name, committing the city $320k/year for 7 years.

      THE DISCOVERY:
      *   The Ripp Report filed a 32-page Ethics complaint against Jack Burrell concerning his participation in the Airport Authority and alleged “bid rigging.”
      *   As many as four complaints were filed with the Ethics Commission.

      THE PIVOT:
      *   The Main Article establishes Jack Burrell's role in the Airport Authority's debt management (2007-2017) and his resistance to the refinance process.
      *   The Widget Article confirms that this specific participation led to a formal and ongoing Ethics Commission investigation into his alleged misconduct (bid rigging).

      KEY ENTITIES:
      *   Jack Burrell (Council President)
      *   Mayor Karin Wilson
      *   Fairhope Airport Authority
      *   Joe McEnerney (Chairman of Airport Authority)
      *   Paul Ripp (Citizen complainant)
      *   Ethics Commission
      *   Rod Kanter (Bond Attorney)
      *   Tut Wynn (City Attorney)
      *   Matt McDonald (City Attorney)
    llm_text: Jack Burrell's role in the Fairhope Airport Authority's massive 2007 land debt triggered a formal Ethics Commission investigation into his alleged bid rigging. See how his resistance to transparency impacted the city's millions in committed debt.
