    llm_text: Kevin Boone violated Fairhope Ethics rules in 2016, voting on Dewberry/Preble-Rish projects that benefited his partner, John Avent, after receiving $2500. See how this conflict of interest exposed a pattern of lack of transparency within the Fairhope City Council.
