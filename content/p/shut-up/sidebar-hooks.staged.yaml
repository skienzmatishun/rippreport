  follow-bouncing-ball:
    brief: |-
      THE CONFLICT:
      *   June 6, 2016 – October 3, 2016: Councilman Kevin Boone voted on multiple Fairhope Planning and Zoning projects (Fly Creek Apartments, Old Battles Place, Azalea at the Colony, Silverleaf, Fox Hollow) involving the engineering firm Dewberry/Preble-Rish.
      *   Boone supported projects tied to John Avent (his business partner/LLC) and received $2500.00 from Preble-Rish in campaign contributions.

      THE DISCOVERY:
      *   Article 2 documents clear instances of conflict of interest where Kevin Boone voted on projects benefiting his business interests and partners, without recusal, violating Ethics rules.

      THE PIVOT:
      *   Article 2 establishes a documented pattern of political conflict of interest and lack of transparency within Fairhope City Council in 2016, contextualizing the claims in Article 1 regarding the alleged destabilization and lack of transparency by Jack Burrell against Mayor Wilson's push for reform (Fairhope Airport debt refinance 2016-2017).

      KEY ENTITIES:
