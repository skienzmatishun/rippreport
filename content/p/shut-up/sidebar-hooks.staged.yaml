  fairhope-town-hall-meeting:
    brief: |-
      THE CONFLICT:
      *   2007: Airport Authority purchased 265 acres of land adjacent to Fairhope Airport for $8,845,000 with the City of Fairhope as guarantor.
      *   2007-2017: City of Fairhope committed indefinitely to the airport land loan, paying over $3.6 million since 2007.
      *   2016-2017: Mayor Wilson attempted to force refinancing of the $7,445,629 debt, facing delays and obstruction from Council President Jack Burrell and Airport Authority Chairman Joe McEnerney.
      *   2/16/2017: Council President Burrell refused to put repeal of Ordinance 1572 (Fly Creek Apartments) on the City Council agenda.

      THE DISCOVERY:
      *   The Widget Article (2/16/2017) reveals Council President Jack Burrell is blocking critical citizen issues (Ordinance 1572/Fly Creek) while supporting the Airport Authority's control over city land debt (21% of city debt).

      THE PIVOT:
      *   The Widget Article demonstrates that Burrell's obstruction of citizen rights and refusal of transparency (blocking the Fly Creek agenda) was occurring *prior* to Mayor Wilson's detailed disclosure of the financial mismanagement and failed refinance efforts in the Main Article (2/23/2017), establishing a pattern of anti-transparency behavior.

      KEY ENTITIES:
      *   Jack Burrell (Council President)
      *   Mayor Karin Wilson
      *   Fairhope Airport Authority
      *   Fairhope
