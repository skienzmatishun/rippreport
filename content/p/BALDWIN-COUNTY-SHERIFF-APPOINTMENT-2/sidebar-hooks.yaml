  bcso-culture-2:
    brief: 'THE CONFLICT:

      - July 27, 2024: Hoss Mack resigned/stepped down from Baldwin County Sheriff’s
      Office (BCSO).

      - BCSO Deputy Mark Hunady shot Jonathan Victor (unarmed, 4 shots from 7 yards
      with high-powered rifle) after a single-car accident; case was granted qualified
      immunity by the 11th Circuit Court of Appeals in May 2024; rehearing petition
      filed May 7, 2025/June 2024 (note: source says "May 7" without year, context
      suggests 2024).

      - David Whetstone (DA), Robert Wilters (Judge), Hoss Mack, and Anthony Lowery
      (BCSO Investigator) withheld exculpatory evidence in the wrongful conviction
      of Murray Lawrence Jr., who served 20 years for a crime he did not commit; all
      four received promotions.


      THE DISCOVERY:

      - Article 2 confirms that Anthony Lowery was the **lead investigator** for the
      DA’s office in the trial that convicted innocent man Murray Lawrence Jr.

      - Article 2 states Lowery developed the BCSO culture of "ABSOLUTE IMMUNITY"
      under former Sheriff Hoss Mack.

      - Article 2 identifies a political faction ("Catalyst" / Scott Boone Consulting)
      in Baldwin County that supports only those loyal to the group, influencing judicial
      and police appointments.

      - Article 2 explicitly calls for Anthony Lowery **NOT** to be elected/appointed
      as Sheriff, citing his role in Lawrence’s wrongful conviction.


      THE PIVOT:

      - Article 1 (July 2024) asks citizens to contact the Governor’s Appointment
      Office to oppose or support Anthony Lowery’s appointment as Sheriff following
      Mack’s departure, citing 9+ deaths and BCSO misconduct.

      - Article 2 provides the **specific historical evidence** linking Lowery to
      a proven wrongful conviction (Murray Lawrence Jr.) and to the systemic "self-investigating"
      culture he helped build under Mack.

      - This makes Lowery not just a "passive choice" of Mack, but an active architect
      of BCSO’s legal accountability evasion, making his appointment the central political
      issue rather than just Mack’s departure.


      KEY ENTITIES:

      - Hoss Mack (Former Sheriff)

      - Anthony Lowery (BCSO Investigator, proposed/Appointed Sheriff, lead investigator
      in Lawrence case)

      - Jonathan Victor (Unarmed civilian shot and killed by Deputy Mark Hunady)

      - Mark Hunady (BCSO Deputy, qualified immunity recipient)

      - David Whetstone (Prosecutor/DA, withheld evidence in Lawrence case)

      - Robert Wilters (Judge, withheld evidence in Lawrence case)

      - Murray Lawrence Jr. (Wrongfully convicted man, served 20 years)

      - O.J. French / Otis French Jr. (Civilian killed by Bay Minette police, cleared
      by BCSO Major Crimes Unit)

      - Peyton Little (Confidential informant for Bay Minette Police, ruled suicide
      by BCSO, found strangled by seatbelt)

      - Robert Yates (Civilian killed in SWAT breach of his home, 114+ casings, no
      exigency)

      - Joseph L. Andrews (81) and Kevin J. Andrews (54) (Killed in wrong-way I-10
      BCSO pursuit)

      - Dominic Scotti Garcia Jr. (26) (Driver in I-10 pursuit crash)

      - Mason Bass (Appointment Board Contact, Governor’s Office)

      - Matt McKenzie (Candidate to oppose Lowery)

      - Scott Boone Consulting (Formerly "Catalyst" political group)

      - Bay Minette Police Chief (Member of BCSO Major Crimes Unit)'
