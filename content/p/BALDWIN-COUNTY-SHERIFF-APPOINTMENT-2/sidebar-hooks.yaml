  bcso-no-clones:
    brief: "THE CONFLICT:\n- Sheriff Hoss Mack (Huey \"Hoss\" Mack) served Baldwin\
      \ County for two decades (approx. 2004–2024), leaving the post to become head\
      \ of the Alabama Sheriffs Association.\n- His last day as sheriff: Saturday,\
      \ August 31, 2024. He stepped aside with one \"foot out the door,\" seeking\
      \ to have Anthony Lowery — his former chief deputy and close ally — appointed\
      \ in his place.\n- Mack publicly quoted: “That is what happens when you run\
      \ from the law,” while refusing accountability for a wrong-way I-10 BCSO pursuit\
      \ that killed five people (Joseph L. Andrews, 81; Kevin J. Andrews, 54; Dominic\
      \ Scotti Garcia Jr., 26; plus two others) at speeds up to 110 mph.\n- Specific\
      \ past incidents tied to BCSO under Mack:\n  - Peyton Little: ruled a suicide\
      \ by the BCSO, but found strangled by a seat belt so tight it had to be cut\
      \ off him. He was a confidential informant for Bay Minette; no bruises or cuts\
      \ from dragging, and died before passing out — impossible self-suicide scenario.\
      \ BCSO swept it under the rug; Lowery told the family “ Peyton wanted to die,\
      \ so now he is dead.”\n  - O.J. French (Otis French Jr.): stopped by Bay Minette\
      \ police for a simple signal violation, shot and killed, then cleared by the\
      \ Baldwin County Major Crimes Unit. The Bay Minette Police chief was on that\
      \ unit; the mayor said it was time to “Move On.” A walk in remembrance of O.J.\
      \ was held July 31 at Bay Minette Courthouse.\n  - Robert Yates: killed during\
      \ a SWAT breach of his home with “all of the SWAT team’s firepower” when the\
      \ situation was not an exigent one or emergency, and he had not threatened anyone’s\
      \ life (only fired a warning shot inside). More than 114 shell casings and tear\
      \ gas canisters/concussion grenades left at the scene.\n  - Jonathan Victor:\
      \ unarmed, shot four times from seven yards with a high-powered rifle. What\
      \ began as a single-vehicle accident ended in his death. A petition for rehearing\
      \ was filed with the 11th Circuit Court of Appeals on May 7, asking the panel\
      \ to reconsider denial of qualified immunity to Deputy Mark Hunady — potentially\
      \ exposing BCSO to millions in liability.\n  - Wrongful conviction: Sheriff\
      \ Mack, Prosecutor David Whetstone, and Judge Robert Wilters withheld exculpatory\
      \ evidence from the defense and sent an innocent man to jail for 20 years. Anthony\
      \ Lowery was an investigator on that case and knew of the available evidence;\
      \ all four remained silent while promotions followed.\n\nTHE DISCOVERY:\n- Governor\
      \ Kay Ivey formally appointed Anthony Lowery as Baldwin County Sheriff effective\
      \ Sunday, September 1, 2024 — the day after Mack’s last day. Lowery served “nearly\
      \ 20 years” in the Sheriff’s Office and about 8–9 years at the DA’s office,\
      \ totaling ~28 years of law enforcement experience (including time as chief\
      \ deputy under Mack).\n- On May 20, 2026, Lowery narrowly defeated Baldwin County\
      \ Commissioner Matt McKenzie for elected sheriff: Lowery 15,886 votes vs. McKenzie\
      \ 14,804 votes. He continued in office.\n- Lowery has previously professed he\
      \ did not want the job. The Ripp Report frames his appointment as Mack’s “suggested”\
      \ replacement despite Lowery’s earlier reservations.\n- The Ripp Report notes\
      \ Lowery would now face the same unexamined controversies and allegations that\
      \ had accumulated during Mack’s two-decade tenure — essentially inheriting Mack’s\
      \ “horrible record.”\n\nTHE PIVOT:\n- Article 2 (the “BCSO – NO CLONES” image\
      \ of Lowery in sheriff uniform arranged in a Brady Bunch-style grid) is the\
      \ smoking gun because it visually documents that Lowery is not an outside appointee\
      \ or new face — he was already Mack’s chief deputy and “joined at the hip.”\n\
      - The Ripp Report explicitly states: “Lowery is a clone of Hoss Mack” and “they\
      \ are joined at the hip, or close to it. Lowery likes it under Hoss’s umbrella\
      \ however he has rightfully inherited Hoss’s horrible record.”\n- Because Lowery\
      \ served as chief deputy (and investigator on the wrongful-conviction case)\
      \ during Mack’s two decades, any new information emerging from the appointment\
      \ process — including “fill-in-the-blanks” comments and previously ignored complaints\
      \ about Little, French, Yates, Victor, and the I-10 pursuit — would directly\
      \ implicate Lowery in the same misconduct or silence.\n- Governor Ivey’s own\
      \ announcement praised Lowery as “well-prepared to lead,” yet the Ripp Report\
      \ argues his appointment is a cover-up: “ton of crap out of the Hoss Boss closet,\
      \ is going to expose some very embarrassing incidents involving BCSO.”\n- The\
      \ clone framing underscores that the real question in Article 1 — whether Lowery\
      \ would face accountability or continue the pattern of silence — cannot be resolved\
      \ if he was already deeply embedded in Mack’s inner circle.\n\nKEY ENTITIES:\n\
      - Hoss (Huey) Mack – Former Baldwin County Sheriff (2004–2024), head of Alabama\
      \ Sheriffs Association\n- Anthony Lowery – Appointed and then elected Baldwin\
      \ County Sheriff; former chief deputy, DA’s office investigator\n- Kay Ivey\
      \ – Governor who appointed Lowery in August 2024\n- Matt McKenzie – Elected\
      \ county commissioner, defeated by Lowery in May 2026 election\n- O.J. (Otis)\
      \ French Jr. – Bay Minette man killed during signal-violation stop; family holds\
      \ memorial July 31, 2024\n- Peyton Little – Bay Minette confidential informant\
      \ ruled suicide; actually strangled by seat belt\n- Robert Yates – Killed in\
      \ BCSO SWAT breach; 114+ casings at scene\n- Jonathan Victor – Unarmed man shot\
      \ 4 times from 7 yards with high-powered rifle\n- Mark Hunady – BCSO Deputy\
      \ whose qualified-immunity denial is being challenged (May 7, 2026 rehearing\
      \ petition)\n- David Whetstone – Baldwin County Prosecutor involved in wrongful\
      \ conviction\n- Robert Wilters – Judge who withheld exculpatory evidence\n-\
      \ Joseph L. Andrews (81) / Kevin J. Andrews (54) / Dominic Scotti Garcia Jr.\
      \ (26) – Victims of I-10 wrong-way pursuit\n- Governor’s Appointment Office,\
      \ Mr. Mason Bass – 600 Dexter Ave., Montgomery, AL 36130; 334-242-3300\n- Bay\
      \ Minette Police / Mayor / Major Crimes Unit – Involved in O.J. French case\n\
      - 11th Circuit Court of Appeals – Court where Hunady qualified immunity rehearing\
      \ is pending"
