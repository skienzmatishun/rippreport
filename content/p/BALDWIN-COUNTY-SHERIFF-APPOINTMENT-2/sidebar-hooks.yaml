  BALDWIN-COUNTY-SHERIFF-APPOINTMENT:
    brief: 'THE CONFLICT: Sheriff Hoss Mack of the Baldwin County Sheriffs Office
      (BCSO) is leaving and attempting to appoint his preferred successor, Anthony
      Lowery. The Ripp Report (published July 27, 2024) lists nine known deaths involving
      BCSO personnel, including:

      *   **Peyton Little:** Bay Minette confidential informant killed; ruled suicide
      by BCSO after being strangled by a seatbelt in a moving car. Lowery told the
      family "Peyton wanted to die, so now he is dead."

      *   **O.J. French Jr.:** Killed by Bay Minette police for a signal violation;
      cleared as justifiable by BCSO Major Crimes Unit (which included the Bay Minette
      Chief of Police). Bay Minette Mayor dismissed the family.

      *   **Robert Yates:** Shot to death during an eviction. SWAT members breached
      his home with military-style weapons without probable cause, leaving 114+ shell
      casings and tear gas/cannister debris.

      *   **Jonathan Victor:** Unarmed and shot 4 times from 7 yards out by high-powered
      rifle after a single-vehicle accident. BCSO Deputy Mark Hunady was found not
      to have qualified immunity (denied in May, now petitioned for rehearing with
      the 11th Circuit Court of Appeals).

      *   **Wrongful Convictions:** Mack, Prosecutor David Whetstone, Judge Robert
      Wilters, and Lowery withheld evidence against an innocent man, resulting in
      a 20-year sentence. All four remained silent and received promotions.

      *   **I-10 Crash:** 5 people killed (Joseph L. Andrews, Kevin J. Andrews, Dominic
      Scotti Garcia Jr., plus 2 unidentified) in a wrong-way BCSO pursuit at 110 mph.
      Mack defended the officer as "That is what happens when you run from the law."


      THE DISCOVERY: Article 2 proves that Anthony Lowery, despite previously professing
      he did not want to be Sheriff, has direct personal involvement in multiple BCSO
      coverups and abuses. Specifically, it reveals Lowery personally told the Little
      family about Peyton''s death ("Peyton wanted to die, so now he is dead") and
      that he was an investigator with knowledge of withheld exculpatory evidence
      in a wrongful conviction that sent an innocent man to jail for 20 years. The
      second article confirms that Governor''s Appointment Office Director Mr. Mason
      Bass (600 Dexter Ave., Montgomery, AL 36130) is accepting confidential communications
      regarding BCSO misconduct as part of the vetting process for Lowery''s appointment.


      THE PIVOT: Article 2 is the smoking gun because it exposes that Anthony Lowery
      is not a neutral candidate but a direct participant in and cover-upper for the
      very scandals (Peyton Little, wrongful convictions) that Mack is trying to bury
      by appointing him. It demonstrates that Lowery''s public denial of interest
      in the post is likely false, as his prior actions directly support Mack’s desire
      to appoint someone who will not investigate BCSO failures but instead protect
      them. The appointment process itself becomes a mechanism for hiding accountability
      for nine deaths and wrongful convictions under Lowery''s tenure.


      KEY ENTITIES:

      *   Hoss Mack (BCSO Sheriff)

      *   Anthony Lowery (Sheriff Candidate / Investigator)

      *   Mason Bass (Governor’s Appointment Office Director)

      *   Jonathan Victor (Victim)

      *   Mark Hunady (BCSO Deputy involved in Jonathan Victor death)

      *   David Whetstone (Prosecutor, withheld evidence)

      *   Robert Wilters (Judge, withheld evidence)

      *   Peyton Little (Bay Minette confidential informant, victim)'
