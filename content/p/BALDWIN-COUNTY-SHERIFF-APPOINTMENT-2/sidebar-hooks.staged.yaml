    brief: |-
      THE CONFLICT:
      *   O.J. French was stopped for a signal violation in Bay Minette and shot dead by Bay Minette police; Baldwin County Major Crimes Unit cleared the killing as justified. (Date: One month prior to Widget Article publication)
      *   Peyton Little, a confidential informant for Bay Minette, was found strangled by a seat belt; BCSO ruled the death a suicide, despite questions regarding bruising or self-strangulation. (Date: Prior to Widget Article publication)
      *   Robert Yates died during an eviction at Key Largo Villas mobile home park south of Fairhope; SWAT used military firepower without probable cause, as evidenced by over 114 shell casings.
      *   Jonathan Victor was unarmed and shot 4 times from 7 yards during a vehicle accident on I-10. A petition for rehearing was filed with the 11th Circuit Court of Appeals on May 7.
      *   Five people (Joseph L. Andrews, 81, Kevin J. Andrews, 54, and three others) died in a wrong-way BCSO pursuit on I-10 at 110mph, approximately 10 months prior to July 2024.
      *   Sheriff Mack, Prosecutor David Whetstone, and Judge Robert Wilters withheld exculpatory evidence, resulting in an innocent man serving 20 years in jail; Anthony Lowery was aware of the evidence.

      THE DISCOVERY:
      *   The Widget Article asserts that Sheriff Huey Mack has a long history of cover-ups and disinformation, exemplified by multiple incidents (including Uvalde Texas, Jonathan Victor, Robert Yates, Peyton Little, I-10 pursuit, and malicious prosecution of Steve Nodine).

      THE PIVOT:
      *   The Widget Article establishes a pattern of systemic cover-ups and official misinformation by BCSO and local authorities, providing the historical context that makes the current appointment of Anthony Lowery (suggested by Hoss Mack) highly contentious, as Lowery has been linked to the wrongful conviction and BCSO's problematic history.

