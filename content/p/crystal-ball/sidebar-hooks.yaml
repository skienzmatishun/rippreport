  fauxhope-or-fairhope:
    brief: 'THE CONFLICT

      * Fairhope election to vote on change of government delayed to November 6th.

      * City Council has maintained silence regarding a change of government.

      * The Council is predicted to push back against any change in government.


      THE DISCOVERY

      * The Fairhope City Council and Mayor responded to the qualifications deadline
