  bury-the-body:
    brief: 'THE CONFLICT:

      *   The Fairhope election to vote on change of government was delayed.

      *   The Council successfully postponed the October 2, 2018 vote for change of
      government.


      THE DISCOVERY:

      *   The City Council instructed the City Attorney to find loopholes to delay
      the October 2, 2018 election.

      *   The vote is now scheduled to join the general election ballot on November
      6th, 2018.

      *   The Council has begun blaming the City Clerk and the Mayor but accepts no
      accountability.


      THE PIVOT:

      *   Article 2 provides concrete evidence (documents) showing the mechanism used
      by the Council to delay the vote, which validates the claims of political resistance
      and maneuvering mentioned in Article 1 regarding the Council''s intent to stop
      change of government efforts.


      KEY ENTITIES:

      *   Fairhope City Council

      *   City Attorney

      *   Councilman Jay Robinson

      *   Council President Jack Burrell

      *   J Boy (Catalyst new pick for Mayor in 2020)

      *   Catalyst

      *   The Good Ole Boys'
    generated_at: '2026-07-11T01:42:46.144384Z'
    text: Council President Jack Burrell claimed the city needed more time before
      citizens could vote on reforming Fairhope's broken government. Leaked orders
      reveal the Council instructed the City Attorney to hunt for legal loopholes,
      intentionally stalling the vote to protect their own power.
    character_count: 285
  special-interest:
    brief: 'THE CONFLICT:

