  skunked:
    brief: 'THE CONFLICT

      *   City Council delayed a vote on change of government until November 6th.

      *   The Council successfully postponed the election under weak grounds.

      *   There is an underlying disagreement regarding council structure (At Large
      vs. Districts).


      THE DISCOVERY

      *   A PAC ("Fresh Start for Fairhope") was formed to promote a change of government,
      but the core sticking point is whether the City Council should be At Large or
      Districts.

      *   Mr. Chuck Zunk successfully mobilized 39 people to declare the City needed
      to remain "at large."


      THE PIVOT

      *   Article 2 reveals that political groups (Skunk and Catalyst) are primarily
      motivated by maintaining control over the structure of representation (At Large
      status), which explains why the Council is perceived as being resistant to change
      mentioned in Article 1.

      *   The efforts to obstruct government change (Article 1) are linked directly
      to the structural desire for At Large representation revealed in Article 2.


