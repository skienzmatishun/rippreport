  fairhope-council-shows-its-colors:
    brief: 'THE CONFLICT

      *   Fairhope City Council attempted to derail the October 2nd election for a
      change of government.

      *   The City Council was silent or pushing back against any change of government
      efforts.


      THE DISCOVERY

      *   Over 800 Fairhope citizens signed a petition, which was accepted by the
      probate judge, triggering a 90-day period requiring an election for a new form
      of government.

      *   This citizen measure circumvents the City Council''s control.

      *   Mayor Karin Wilson delayed her special election (Council-Manager form) until
      the general election on November 6th.


      THE PIVOT

      *   Article 2 reveals that the council’s actions are a reaction to a successful,
      legally recognized citizen effort (petition/recall process) designed specifically
      to bypass and undermine the Council''s authority regarding government change.


