      *   The Council voted to file an injunction against an October 2 referendum
      on a new form of government (Council-Manager system).

      *   The Council used claims of "misinformation and transparency" as an excuse
      to cancel the referendum.


      THE PIVOT

      *   Article 2 reveals that the council members'' opposition is rooted in their
      loyalty to CATALYST, providing the mechanism for why Article 1 suggests a coordinated
