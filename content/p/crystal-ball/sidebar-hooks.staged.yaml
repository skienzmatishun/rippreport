      Article 2 establishes the historical pattern of obstruction and dismissal by the "Catalyst" Council in Fairhope. This context explains the current City Council's predicted opposition to the change of government, including Councilman Jay Robinson leading the fight and the successful delay of the Fairhope vote to November 6th.

