  fairhope-council-shows-its-colors:
    brief: |-
      THE CONFLICT:
      800+ Fairhope citizens submitted a petition to change the government form (Council-Manager), accepted by the probate judge under the Alabama Constitution.
      This triggered a 90-day election period for the change of government, initially scheduled for October 2nd.
      The City Council had an outdated opinion (based on July 2018 statute) and refused Mayor Karin Wilson’s opinion offered on June 26, 2018.

      THE DISCOVERY:
      The initiative was driven by citizens circumventing the city council via the Alabama petition process, not by a council proposal.
      Mayor Karin Wilson announced the October 2nd special election was delayed until the general election date of November 6th, announced by the Judge of Probate’s office.

      THE PIVOT:
      Article 2 establishes the change of government was a successful citizen action (petition), proving the City Council’s recent attempts to stall the process (as highlighted in Article 1) are an attempt to derail a democratic mandate, not merely a policy disagreement.

      KEY ENTITIES:
      Fairhope
      Karin Wilson (Mayor)
      City Council
      Jay Robinson (Councilman)
      Jack Burrell (Council President)
      Catalyst
      Probate Judge
      November 6th (Election Date)
      October 2nd (Original Election Date)
      June 26, 2018 (Mayor's opinion date)
      July 2018 (Outdated statute reference)
    llm_text: Over 800 Fairhope citizens successfully petitioned the Probate Judge to change the city government form. Despite City Council attempts to stall this mandate, Mayor Karin Wilson confirmed the crucial election moves to November 6th.
