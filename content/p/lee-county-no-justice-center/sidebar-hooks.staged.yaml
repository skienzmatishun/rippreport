      Murray Lawrence Jr. was convicted in 2003 of the murder of Brandon Hastings in Baldwin County, sentenced to life without parole.

      THE DISCOVERY:
      A second autopsy, ordered by DA Robert Wilters (who was the presiding Judge), revealed the cause of death was suffocation, not gunshot, but this report was deliberately withheld from Lawrence’s defense.

      THE PIVOT:
      The suppression of evidence and the conflicts of interest (Wilters serving as Judge and DA; Mack serving as Sheriff and lead investigator) in the Lawrence case demonstrate a systemic pattern of judicial and law enforcement misconduct—including suppressing critical evidence and achieving wrongful convictions—that supports Article 1's critique of the biased, police-dominated "Justice Center" environment (Lee County, 2021).

