      THE DISCOVERY:
      1.  The Baldwin County Sheriff's Office (BCSO) exhibits a pattern of lacking transparency and accountability, exemplified by the protection of internal incidents (e.g., Deputy Matt Hunady) and the influence of Sheriff Mack and DA Robert Wilters (30+ year relationship).

      THE PIVOT:
      1.  The 2021 *Lagniappe v. Mack* ruling and the overall pattern of suppressed evidence in BCSO demonstrate the institutional capacity to withhold crucial police records (e.g., officer personnel files, bodycam footage) that directly impacted the Barkley case, where the officer's records were never made public and his lack of identification contributed to the conviction.

