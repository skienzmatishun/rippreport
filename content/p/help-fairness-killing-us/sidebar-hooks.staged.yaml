    brief: |-
      THE CONFLICT: Resolution 2606-16 (October 21st) accepted the deed of a sewer lift station property from Angelo A. Corte to the City of Fairhope. This occurred during the previous city council under Tim Kant, with Burrell and Boone present.
      THE DISCOVERY: The accepted "gift" was misrepresented; it included three plus acres of wetlands receiving storm water runoff from the Publix site, not just the land for a small lift station.
      THE PIVOT: Article 2 establishes historical context of council actions (Resolution 2606-16, ignored details, conflict claims) by Burrell and Boone under Tim Kant, providing the foundation for current scrutiny regarding conflicts of interest (Boone's LLC) and financial decisions (budget cuts targeting Botop).
