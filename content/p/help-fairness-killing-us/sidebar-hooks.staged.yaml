      THE PIVOT: The historical financial mismanagement (Mega-Site/Airport Debt) revealed in Article 2 provides context for Article 1's criticism that the Council rejected public objections and cut funds for the Director of Economic and Community Development (Sherry-Lea Bloodworth-Botop) to side with a developer.
