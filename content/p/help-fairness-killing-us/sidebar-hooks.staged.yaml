      THE CONFLICT:
      Historical political tension existed between Council President Burrell/Boone and Mayor Kant.
      On 1/12/11, Rick Kingrea sent a request to the Attorney General concerning potential ethical violations and possible criminal activity.
      Boone, Burrell, and Brown voted against the Mayor’s appointments to the Airport Authority; Robinson and Conyers voted in favor.

      THE DISCOVERY:
      Kevin Boone was the principal member of BA-101, LLC (Nature of Business: PURCHASE/HOLD PROPERTY FOR INVESTMENT), formed 4-29-2004 and officially dissolved 2-6-2017.
      The Council previously ignored Boone's conflict of interest regarding this dissolved LLC.
      The Ethics Commission has consistently held that public officials must use a bid process when doing business with the entity on which they serve.

      THE PIVOT:
      Article 2 establishes a historical pattern of obstruction (blocking mayoral appointments) and self-serving actions by Burrell and Boone.
      This historical context explains the current actions in Article 1: the council uses the definition of "Fairness" to punish the Mayor (via a hiring freeze) and eliminate the Director of Economic and Community Development (Sherry-Lea Bloodworth-Botop) through budget cuts, driven by Burrell and Boone.

