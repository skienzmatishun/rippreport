  shut-up:
    brief: |-
      THE CONFLICT:
      *   2007: Fairhope Airport Authority purchased 265 acres adjacent to the airport for $8,845,000 with the City of Fairhope as guarantor, committing the city to an indefinite appropriation.
      *   Sept 2016: Mayor Karin Wilson began investigating the debt ($7.7M land debt) and requested involvement in the refinance process.
      *   Feb 23, 2017: Airport Authority approved the refinance of the $7,445,629 debt, despite Wilson's requests for covenant retention and no prepayment penalties.
      *   Dec 22, 2017: City Council unanimously approved keeping the land in the Airport Authority's name, committing the city $320k/year for 7 years.

      THE DISCOVERY:
      *   The Airport Authority, led by Joe McEnerney and Jack Burrell, failed to renegotiate the original RFP extension deadline (Nov 2016), resulting in missed opportunities and increased costs to the city.
      *   The Airport Authority acted with a lack of transparency, excluding Mayor Wilson from key meetings and decisions (e.g., executive sessions).

      THE PIVOT:
      *   Article 2 establishes Jack Burrell's historical pattern of undermining transparency and city governance (targeting Mayor Wilson) via the Airport Authority, providing context for his subsequent actions in Article 1, where he used his position as Council President to cut funding for Economic and Community Development (Sherry-Lea Bloodworth-Botop) under the guise of "Fairness."

      KEY ENTITIES:
      *   Karin Wilson (Mayor)
      *   Jack Burrell (Council President)
      *   Sherry-Lea Bloodworth-Botop (Director of Economic and Community Development)
      *   Kevin G. Boone
      *   Angelo Corte
      *   Conyers
      *   Robert Brown
      *   Robinson
      *   Fairhope Airport Authority
      *   Joe McEnerney
      *   Rod Kanter
      *   Fly Creek Pud
      *   BA-101, LLC (Dissolved 1-31-2017)
    llm_text: Mayor Karin Wilson fought the $7.7M Fairhope Airport Authority debt, but Jack Burrell undermined her and cut funding for Sherry-Lea Bloodworth-Botop. See how Burrell's lack of transparency led to missed opportunities and damaged city governance.
