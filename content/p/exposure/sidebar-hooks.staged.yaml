  baldwin-county-family-court-a-cottage-industry:
    brief: |-
      THE CONFLICT:
      *   Judge Michelle Thomason (District Judge, Baldwin County Family Court) faced numerous complaints (up to 6 in 18 months) regarding her rulings, specifically 50/50 custody decisions which caused family hardship.
      *   A complaint specifically cited Thomason’s position with the Eastern Shore Republican Women as a potential violation of Alabama Unified Judicial System Canons 5 and 7.
      *   The Baldwin County divorce/custody process was characterized as a "cottage industry," with cases sometimes taking up to 12 years.

      THE DISCOVERY:
      *   Presiding Judge Floyd implemented changes to DR/Family Court, including moving all pendente lite/temporary motions assigned to Thomason to other circuit judges (e.g., Judge Bishop and Judge Floyd for Thomason's motions).
      *   Thomason’s domestic violence dockets were assigned to specially assigned judges in 2017.
      *   These changes were intended to prevent Thomason from inflicting "bad judgment" at temporary custody and support hearings, which often forced joint physical custody despite lack of 50/50 parent-child relationship.

      THE PIVOT:
      *   Article 2 provides historical documentation of the systemic dysfunction, documented complaints, and specific ethical concerns (Canons 5 and 7) that led to court reforms implemented by Judge Floyd.
      *   Article 1 uses these earlier allegations (mentioned in Article 2) as foundational context for recent exposures and further allegations leveled against Judge Thomason and Attorney Stephen Johnson.

