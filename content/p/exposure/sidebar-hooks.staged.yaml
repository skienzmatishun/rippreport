  a-legal-win-for-fairhope-citizens-who-oppose-fly-creek-apartments:
    brief: |-
      THE CONFLICT:
      *   In June of that year, Friends of Fly Creek filed a lawsuit against the City of Fairhope, Fairhope Planning and Zoning, Fairhope City Council, and Leaf River group LLC.
      *   The lawsuit challenged the development of Fly Creek Apartments by Leaf River Group LLC, which had one year to be under construction before zoning would revert to NO APARTMENTS.
      *   Tim Kant was involved in the political context related to the lawsuit and needed to win re-election.
      *   George Robards, a contributor of the Mayor and P&Z, publicly labeled the lawsuit "frivolous."

      THE DISCOVERY:
      *   The Court denied the Defendants' motion to dismiss the Fly Creek lawsuit, allowing the case to move into a discovery phase.
      *   The lawsuit compelled the local government (Fairhope P&Z, Council) to produce documents, phone calls, and donations.

      THE PIVOT:
      *   The defeat of Tim Kant and the successful continuation of the Fly Creek lawsuit demonstrate that citizen action can overcome the influence of local "good ole boys" (Mayor, P&Z, Leaf River Group LLC) and entrenched municipal corruption.
      *   This historical example serves as proof for Article 1 that organized citizenry can force systemic change against corruption, a model applied to exposing unethical Baldwin County Family Court judges (Judge Thomason) and attorneys (Stephen Johnson).

