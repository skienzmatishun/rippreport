  anonymous-bb:
    brief: |-
      THE CONFLICT: For nearly 20 years, the Baldwin County Sheriff's Office (BCSO) operated like a cabal under Sheriff Hoss Mack and passed down to Anthony Lowery, characterized by a culture of corruption, police cover-ups, and the protection of the guilty. Specific historical events include:
      - The death of Robert Yates, killed after a 5-hour SWAT standoff involving armored vehicles, tear gas, and over 100 rounds fired (with deputy Justin Correa reportedly vowing to "kill this f*cker").
      - The death of Johnathan Victor, falsely labeled by Lowery as "suicide by cop," while District Attorney Robert Wilters falsely claimed Victor was on ketamine to justify the death.
      - The 20-year wrongful conviction of Murray Lawrence Jr., orchestrated through collusion and withheld evidence by Anthony Lowery, Hoss Mack, Judge Robert Wilters, and prosecutor David Whetstone.
      - The police killing of O.J. French following a tail-light stop, covered up by the Baldwin County Major Crimes Unit (triggering a federal lawsuit).
      - A deadly wrong-way I-10 interstate chase resulting in five deaths (including three burned alive), after which Sheriff Hoss Mack stated, “that’s what happens when you run from the law” (triggering a federal lawsuit).

      THE DISCOVERY: Article 2 exposed the existence of an anonymous political newsletter called "Baldwin Beat" (aka BB or "Baldwin Bullshit"), produced by political consultants in a pasture to deploy anonymous propaganda and protect the "Good Old Boys" (GOB) network. It detailed how the GOBs panicked over losing control of the sheriff's department in the primary, which would lead to losing control of the entire county.

      THE PIVOT: Article 2 serves as the smoking gun for Article 1 because it exposes the corrupt institutional machine, the hidden political operatives (Baldwin Beat), and the decades of BCSO lethal misconduct, cover-ups, and wrongful convictions (Mack, Lowery, Wilters) that create the urgent necessity for voters to disrupt the system, reject establishment figures like Jerry Carl, and elect reform candidates like Austin Sidwell and Matt McKenzie.

      KEY ENTITIES:
      - Austin Sidwell
      - Jerry Carl
      - Francis Paul Ripp / The Ripp Report
      - Hoss Mack (Sheriff)
      - Anthony Lowery
      - Matt McKenzie
      - Robert Wilters (District Attorney / Judge)
      - David Whetstone (Prosecutor)
      - Kristi Hagood
      - Robert Yeats / Yates
      - Justin Correa
      - Robert Correa
      - Johnathan Victor
      - Murray Lawrence Jr.
      - O.J. French
