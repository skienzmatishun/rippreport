  friends-of-fly-creek:
    refined_source: 7fbf399d16d9607586da035506e05f2d55c63d058b6e1141f643c33bf61262b1
    brief: |-
      THE CONFLICT:
      * Over 12 years of environmental abuse and development issues in Fly Creek, Fauxhope (Fairhope).
      * Publix project clear cut, killing life on the site.
      * Developer Arthur Corti was a major contributor to the Mayor and Council.
      * The 230-unit Retreat at Fairhope Village was a source of contention, with Mayor Karin Wilson's opposition potentially leading to her victory over four-term incumbent Tim Kant.
      * Damage to the creek and apartments occurred on at least two occasions due to flooding following the apartments' construction.

      THE DISCOVERY:
      * DNA of the sediment in Fly Creek is identified as coming from the Publix-Apartments runoff.
      * Repeated dredging (every ~5 years) has failed to resolve construction runoff issues, costing millions.
      * A stunt by Corti transferred liability associated with his development to the city.
      * Current efforts are required to vote Jerry Carl OUT from Baldwin County.

      THE PIVOT:
      * The long-term, unresolved corruption and environmental damage (A2) establishes the systemic failure and local political distrust that drives the call for political disruption (A1).
      * Article 2 shows that local governance failed to prevent or remediate major developer abuse over a decade.
      * Article 1 calls for a vote on May 19 to "break the system" and force "REAL change," fueled by the local issues detailed in Article 2.

      KEY ENTITIES:
      * Jerry Carl
      * Austin Sidwell
      * Arthur Corti
      * Publix
      * Fly Creek
      * Fairhope Village (Fauxhope)
      * Karin Wilson (Mayor)
      * Tim Kant
      * ADEM
      * Mobile Baykeepers
      * Jack Burrell
      * Baldwin County
      * May 19 (Voting date)
