  american-citizen:
    brief: |-
      THE CONFLICT:
      - November 2018: Paula Dinardi went to a restaurant/bar in Fairhope and was assaulted by a drunk; Ronan McSharry was arrested; Dinardi went to the hospital.
      - October 2018: Paula Dinardi was managing American Legion Tiki Bar on Mobile Bay; in October she had one event that drew 1,000 people; previously bar was run with little organization and not family friendly; Dinardi presented business plan to American Legion, which accepted, and business boomed.
      - January 2019: American Legion canceled agreement with Dinardi without reasonable explanation; Dinardi was preparing for 2019 season when American Legion suddenly canceled agreement.
      - McSharry assault case: Fairhope City prosecutor Marcus McDowell dropped the ball, or kicked it out of site, when it came to Ronan McSharry; Municipal Judge Snedeker shared in miscarriage of justice.
      - Judge Stankowski stated charging document had a defect; defect was first charging document did not have wording, “Did cause physical injury to another”; document was not amended in statute allotted time, one year, resulting in defect.
      - City attorney and Municipal Judge both had knowledge of medical evidence that supported claim of “physical injury”; City Attorney was personally given medical evidence by an attorney representing Dinardi before her first court appearance.
      - McSharry was free to continue his business while his attorneys tried to blame everyone for McSharry’s actions; McSharry is not an American citizen, he is a green card holder from Ireland; McSharry has extensive police record and liquor license.
      - McSharry pleaded guilty in court; Fairhope Municipal Judge and City Attorneys actions resulted in McSharry, a green card holder, who pleaded guilty, to escape prosecution.
      - Aftermath: 17 months of constant stress with corrupt judicial system that favored the criminal, not the victim; Dinardi is now trying to save her home.

      THE DISCOVERY:
      - Article 2, AMERICAN CITIZEN, exposes the McSharry assault case as an example of Baldwin County incompetence, political interference, lack of ethics, CATALYST, corruption and judicial failure.
      - Article 2 details McSharry case: McSharry’s past convictions, pleading guilty, incident on video, Judge Stankowski’s ruling.
      - Article 2 states charging document defect; no amendment within one year.
      - Article 2 states City Attorney and Municipal Judge had knowledge of medical evidence; City Attorney personally given medical evidence by attorney representing Dinardi before first court appearance.
      - Article 2 raises legal questions: How much money has McSharry transferred from profits of McSharry’s to Ireland since the assault? How can a green card holder have such influence? Maybe his friend Council President Burrell?
      - Article 2 identifies victim Paula Dinardi as an American citizen and does not export dollars to another country.

      THE PIVOT:
      - Article 2 is older than Article 1; frame it as background/historical context.
      - Article 2’s McSharry case is the smoking gun/key context for Article 1’s CATALYST/Scott Boone Consulting claims.
      - Article 1 states CATALYST/Scott Boone Consulting is a profit-making political group who represents interests of developers; they select candidates to represent developer interests, NOT citizens of Baldwin County.
      - Article 1 states in upcoming elections of Fairhope, Daphne, Spanish Fort and Bay Minette, CATALYST has hand picked candidates; when selected, they are obliged to follow good ole boy creed which always ends in corruption.
      - Article 1 states Baldwin County taxpayers are victims.
      - Article 1 states CATALYST was name of choice until a few weeks ago, when new name Scott Boone Consulting appeared; after CATALYST suffered bitter defeat in congressional race.
      - Article 1 states CATALYST name had become infamous and so toxic in Baldwin County that principal of Catalyst decided to change it to his own name, Scott Boone Consulting.
      - Article 1 states Scott Boone is son of Fairhope councilman Kevin Boone; both Boones have been implicated in land fraud known as “Strawman” featured in Lagniappe under series.
      - Article 1 states Scott is money distributor, the bank, for CATALYST candidates; over a million dollars so far, not counting dark money passed under the table.
      - Article 2’s McSharry case connects CATALYST to City Council appointments of City Attorney and Municipal Judge and judicial failure, supporting Article 1’s pattern of CATALYST corruption and judicial failure.

      THE KEY ENTITIES:
      - Baldwin County, Fairhope, Daphne, Spanish Fort, Bay Minette.
      - CATALYST, CATALYST/Scott Boone Consulting, Scott Boone Consulting, CSB.
      - Scott Boone, Kevin Boone, Jerry Carl, Fairhope City Council, Council President Burrell.
      - Marcus McDowell, Ronan McSharry, Paula Dinardi, Municipal Judge Snedeker, Judge Stankowski, City Attorney, Fairhope Municipal Judge.
      - American Legion, American Legion Tiki Bar, Mobile Bay.
      - Secretary of State website, developers: Prebble, DR Horton, Columbia Southern, Truland, Corte Cox.
      - Baldwin County Legal Eagle, Ripp Report, Backstory Podcast.
      - Lowery, Wilters.
