      - 2018: CATALYST tried and failed to take over the entire county administration, from county commissioners to probate judge; failed, but not totally; many CATALYST/CSB candidates were successful in getting elected.
      - CATALYST/CSB lost to Jerry Carl in the congressional race last month; after the loss, CATALYST rebranded to Scott Boone Consulting (CSB).
      - Fairhope: last election for change in Fairhope's government had just one voting booth outside of the city hall; Daphne closed the minority precincts in the 2016 election; Catalyst stacks the deck; Catalyst does better at running "at large" rather than at district levels, keeping votes diluted.
      - Kevin Boone (Fairhope councilman, son of Scott Boone) and Scott Boone both implicated in the land fraud known as "Strawman" featured in the Lagniappe series.
      - Scott Boone is the money distributor, the bank, for CATALYST candidates; over a million dollars so far, not counting the dark money passed under the table.
      - Sherry Snedeker BBB, Kevin Boone Brown, and Jack Burrell: Fairhope signs; 100% CSB cocktail of candidates; voting for these four is going backwards and handing Fairhope over to developers and corrupt politicians.

      THE DISCOVERY:
      - Article 2 (CATALYST SIGNS) showed how CATALYST/CSB is identified: pvc framed signs with red prohibition symbol over CATALYST; same signs in Fairhope, Daphne, Spanish Fort and Bay Minette, manufactured at the same place.
      - Catalyst has been around for a long time, under various names; recently became Scott Boone Consulting; the name CATALYST had to be abandoned, it had become politically toxic; elected officials elected under the CATALYST banner were disassociating with the brand.
      - CSB operates much like the Club for Growth PAC, helping you get elected but owning you from that day; they support each other and share among themselves any gratuity they feel entitled to; they form a political alliance that spans the county.
      - CSB put signs up in Fairhope, Daphne, Spanish Fort and Bay Minette overnight, hundreds of signs, all supporting CSB candidates; intention is to sell your eyes on their popularity, the trick is to use your brain when you vote.
      - CSB candidates run in a block position supporting one another; obvious in Daphne and Fairhope, where all CATALYST candidates place their signs side by side.
      - Sherry Snedeker is usually hugged up to Boone signs; signs appear in the yards of the core group of the past administration; they want back their power that they lost in 2016.
      - Sherry snuggled up to the Municipal Judges property sign, with Boone Brown and Burrell accompanying signs.
      - The municipal judge is a devout supporter of CSB; the city council has voted in favor of the judge multiple times; Burrell also arranged himself to be on the bid committee that awarded the good judge a prime location for his jet airplane hangar.
      - Last month, the judge had Club for Growth candidate "Lowtower" signs on his property, provided by CSB; Jerry Carl defeated CATALYST/SCOTT BOONE and sent "Lowtower" into the shadows.
      - Daphne: CATALYST/Scott Boone candidates shoulder to shoulder; what should that tell ya, they are a unit not individuals; CATALYST/Scott Boone and the current Mayor of Daphne are picking your next Mayor and City Council members for you; do not vote for any CSB candidates.
      - In the next two weeks, signs missing, destroyed or damaged, none will be CATALYST/Scott BOONE signs; in Fairhope they perfected the art of sign disappearance; in the 2016 Fairhope election a man was caught with a pickup full of signs, all were signs of those opposing the status quo.

      THE PIVOT:
      - Article 2 is older than Article 1; Article 2 provides background/historical context on how CATALYST/CSB operates, including sign identification, the CSB political alliance, and the Triangle Trade of developer money, vetted politicians, and Catalyst keeping politicians in line.
      - Article 1 uses Article 2's sign-identification framework and includes Daphne's August 5, 2020 post as an "accurate post" explaining CATALYST and how to identify them.
      - Article 2 is the "smoking gun" for Article 1 because it establishes the method (tea leaves, pvc signs, red prohibition symbol) and the bloc strategy that Article 1 applies to the upcoming municipal elections and the CSB threat.
      - Article 2's context explains Article 1's present conflict: after CATALYST lost to Jerry Carl and rebranded to CSB, CSB now eyes municipal races across the county; Article 2's sign analysis shows how CSB runs candidates as a unit.

