  fauxhope-know-the-backstory-2:
    brief: |-
      THE CONFLICT:
      - Baldwin County BCSO under Hoss Mack and Anthony Lowery were principals in the wrongful conviction of Murray Lawrence Jr.
      - Motive was self-promotion; Mack and Lowery succeeded in the conviction of an innocent man.
      - Anthony Lowery was lead investigator; he found not one shred of evidence.
      - BCSO under Hoss Mack established total immunity for any officer for any action.
      - BCSO under Hoss Mack blocked releasing any camera footage.
      - Hoss Mack requested $600,000 for cameras to protect the citizens of Baldwin County.
      - Hoss Mack promised in the presence of the County Commission that camera footage was for public view as well as police.
      - Hoss Mack bare-faced lied, then expanded Immunity coverage.
      - BCSO used its own department to investigate itself under the “Baldwin County Sheriff Office Protection Plan.”
      - BCSO had no camera footage, no transparency, no accountability, investigated itself, District Attorney licking one boot, State Senator licking other.
      - BCSO has judges and lawyers who take BCSO actions as gospel.
      - Mack developed dangerous culture among department adopted by Anthony Lowery.
      - In Baldwin County, you can be innocent, not have a warrant, no gun, and be shot dead by the sheriff department; most likely no court will investigate or find guilty party responsible.
      - Hoss Mack is now working to secure Tommy Tuberville as governor.
      - Hoss Mack has his eye on heading Alabama League of Enforcement Officers, ALEA.
      - Electing a resident of another state as Governor will secure the position he desires.

      THE DISCOVERY:
      - Article 2 backstory: The culvert issue was first addressed by the Ripp Report and lawsuits filed against the city over the Publix project on Parker Road.
      - Culverts, sewer lines, wetlands issues, drainage, proximity to Fly Creek, county right a ways, city easements, tree survey missing were just a few issues.
      - Fauxhope did nothing, then allowed the apartments; same issues, same no action.
      - Now they are expanding building again behind apartments; the developer is given a green flag.
      - Former Mayor Tim Kant first proposed re-establishing creek biological and hydraulic connectivity in 2014.
      - 2023 culvert failure.
      - Emergency 2023 repairs.
      - City council voted to apply again for a $20 million federal ‘Better Utilizing Investments to Leverage Development’ (BUILD) grant to replace the failed Fly Creek box culverts under US 98 with a bridge.
      - Applications in 2024 and 2025 were not successful.
      - Culvert damage goes back to the Publix project and was brought to the city attention during construction of Publix and during and after apartments construction.
      - Fairhope’s former Mayor Tim Kant and former subordinates and entitled developer, Angelo Corte, are to thank for a development no one wanted, except those who would profit.
      - Catalyst supported the developer not the community.
      - City Council aided and abetted Mayor Kant and the developer while ignoring overwhelming public outcry against the project.
      - Citizens made a horrible decision in the last election; Mayor Wilson was addressing the issues that the current council has ignored.
      - Corruption within the City government was curtailed and infrastructure issues addressed.
      - Mayor Wilson obtained in excess of $10 million in infrastructure grants.
      - Mayor Sullivan and current council will most likely NOT complete the grants afforded the city before their term ends.
      - Mayor Sullivan and current council will most likely NOT complete grants before term ends.
      - Current council clear cut even more property for multifamily; single family housing.
      - Fairhope Marina is undergoing dredging to maintain the main Fly Creek boat channel, necessary every five years to ensure proper depth for boat clearance.
      - City selected M & N of Alabama LLC to perform the dredging.
      - City and Fairhope Yacht Club sharing costs for the main channel; city will cover costs for upper creek channel.
      - Marina received Clean and Resilient Marina status.
      - Jack Burrell insists the mud is coming from the bay and going up the creek.
      - Backstory: dredging is due to development on Fly Creek—such as the Publix project and apartments and the ongoing expansion on the same site.
      - Fauxhope City Council knows this however the developer is their biggest supporter.
      - Mud in the marina matches the DNA profile of the Publix construction.
      - City Council has turned a blind eye to the issue since the original construction began.
      - Same Fly Creek has the highest bacteria count on HWY 98 by Publix and Fly Creek at Scenic 98.
      - All red reported by Baykeeper.
      - Red symbol indicates high bacteria levels >104 MPN/100ml (>235 MPN for Bohemian Park, Fly Creek at Highway 98, Fly Creek at Scenic 98).
      - City council meeting in a flooded chamber with knee-deep mud.
      - Man in overalls stands near a laptop while officials sit.

      THE PIVOT:
      - Article 2 is older and should be framed as background/historical context.
      - Article 2 shows the developer will do whatever the hell he wants, without any accountability.
      - Article 2 connects to Article 1 because Article 1 describes BCSO having total immunity, blocking camera footage, investigating itself, and lacking accountability.
      - Article 2 is the key context/smoking gun for Article 1 because it documents pre-existing no-accountability and infrastructure failures before the wrongful conviction/book narrative.
      - Article 2 supports the idea that deep corruption runs in Baldwin County.

