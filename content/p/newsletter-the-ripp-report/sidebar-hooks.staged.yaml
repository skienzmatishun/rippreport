  follow-bouncing-ball:
    brief: |-
      THE CONFLICT:
      *   In 2016, Councilman Kevin Boone (Fairhope) voted on multiple projects involving Dewberry/Preble-Rish, LLC (e.g., Retreat at Fairhope Village/Fly Creek Apartments, Old Battles Place).
