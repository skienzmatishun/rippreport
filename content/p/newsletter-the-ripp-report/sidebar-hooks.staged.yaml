  grinder-pumps:
    brief: |-
      THE CONFLICT:
      *   Past Fairhope administrations (under former Mayor Tim Kant) allowed developers to use unstandardized grinder pumps, bypassing city sewer requirements through "good ole boys" deals.
      *   Subdivision developers (e.g., Van Antwerp Park, Phase 5 Battles Trace, owned by Retirement Systems of Alabama) sought waivers from Fairhope Planning Commission requirements (dated Jan. 4).
      *   The standard requirement is gravity sewer systems; low pressure/grinder pumps cost $3,500 apiece and require individual homeowner maintenance.

      THE DISCOVERY:
      *   The former Mayor of Fairhope (Tim Kant) held the position of utilities superintendent in addition to his part-time role as mayor, collecting checks from the city and developers.
      *   Current Mayor Karin Wilson hired Richard Peterson (engineer/operations director) to enforce strict city standards, ending the "loose interpretations" of regulations.

      THE PIVOT:
      *   Article 2 provides specific, documented evidence of long-standing municipal corruption (sewer/developer collusion in Fairhope) which substantiates the need for the Ripp Report’s mandate to expose systemic political corruption across Baldwin County's 14 municipalities.

      KEY ENTITIES:
      *   Karin Wilson (Current Mayor, Fairhope)
      *   Tim Kant (Former Mayor/Utilities Superintendent)
      *   Richard Peterson (Operations Director, Fairhope)
      *   BP Pittman (District 32 State Senate candidate)
      *   The Ripp Report (Consumer group exposing political corruption)
      *   Baldwin County (4 county commissioners)
      *   Fairhope
      *   Van Antwerp Park (11-lot subdivision)
      *   Battles Trace (Phase 5, 73 lots)
      *   Retirement Systems of Alabama (RSA)
      *   Jane Nicholes
      *   Larry Smith (S.E. Civil Engineering)
      *   Feb 9th (Cut off time for Ripp Report qualification)
    llm_text: Former Mayor Tim Kant let developers use cheap grinder pumps, bypassing Fairhope sewer rules for projects like Van Antwerp Park. Current Mayor Karin Wilson and Richard Peterson now enforce strict standards, stopping long-standing municipal corruption.
