      *   Dewberry/Preble-Rish, LLC donated $2,500 to Boone's re-election campaign.
      *   Boone did not recuse himself from these votes, violating Ethics rules.
      *   The Fly Creek Apartments controversy resulted in the Mayor and three councilmen being voted out of office.

      THE DISCOVERY:
      *   Article 2 provided specific Fairhope Planning and Zoning Commission Minutes (e.g., Sept 3, 2016, SD 16.14) documenting Boone's votes favoring projects tied to Dewberry/Preble-Rish.
      *   The documentation proved a clear conflict of interest and lack of ethical disclosure by Boone.

      THE PIVOT:
      *   Article 2 offers concrete, documented historical evidence of political corruption within Baldwin County (Fairhope), substantiating Article 1's general call to expose corruption and hold incumbents accountable during the mid-term election cycle.

