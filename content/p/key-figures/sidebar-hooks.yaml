  justice-denied-a-wrongful-conviction-buried-by-power-and-politics-repost:
    brief: |-
      THE CONFLICT:
      *   2005: Murray Lawrence Jr. was wrongfully convicted of a capital murder case (victim: Brandon Hastings) in Baldwin County, Alabama.
      *   The prosecution claimed a gunshot killing in Alabama; autopsy proved strangulation in Mississippi.
      *   Key figures involved: David Whetstone (Baldwin County DA), Robert Wilters (Presiding Circuit Court Judge), Hoss Mack (Lead Investigator/Captain, BCSO), and Anthony Lowery (Chief Investigator, DA’s Office).
      *   The conviction proceeded despite no physical evidence (no DNA, no fingerprints, no murder weapon) and a lack of signed grand jury indictment.
      *   Whetstone offered a plea deal to the real killer, Jarius McNeil, who later changed his story after being threatened with the death penalty.

      THE DISCOVERY:
      *   The four key figures who built the 2005 case now hold higher or influential positions in Baldwin County and Alabama state government.
      *   Robert Wilters, who presided over the trial, became Baldwin County District Attorney (approx. 2015) and rejected Rule 32 filings in 2023.
      *   Anthony Lowery was a Chief Investigator in 2005 and was appointed Baldwin County Sheriff by Governor Kay Ivey and is running for a full term in 2026.
      *   Hoss Mack retired as Baldwin County Sheriff and now holds a state-level position, establishing a law enforcement culture that persists.
      *   Key exculpatory evidence was suppressed during the trial, according to court records and Innocence Project findings.

      THE PIVOT:
      *   The Widget Article establishes that the wrongful conviction was the result of prosecutorial misconduct (Whetstone's plea deal) and judicial/investigative suppression (Wilters, Mack, Lowery).
      *   The Main Article uses this historical misconduct to argue that the *current* concentration of power within the same circle of officials (Wilters, Mack, Lowery) actively blocks all paths to justice and accountability today.

      KEY ENTITIES:
      *   Murray Lawrence Jr.
