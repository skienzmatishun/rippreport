  sheriff-commission-races-2014:
    brief: |-
      THE CONFLICT:
      *   Murray Lawrence Jr. was wrongfully convicted in Baldwin County, Alabama, around 2005.
      *   The prosecution was led by District Attorney David Whetstone and presided over by Circuit Court Judge Robert Wilters.
      *   Hoss Mack was the Chief Deputy involved in the investigation; his father, Huey A. Mack Sr., owned Mack Funeral Home (Baldwin County Coroner).
      *   The conviction occurred despite forensic evidence (Dr. Paul McGarry) showing no bullet hole, and the cause of death being listed as strangulation, not gunshot.
      *   The indictment lacked a signed grand jury foreman.

      THE DISCOVERY:
      *   In the early 2010s (e.g., April 2014), local political power in Baldwin County was dominated by a "Sick Six" pact (Pittman, Hoss Mack, Dorsey, Elliott, James, Gruber).
      *   This pact concentrated control over the Sheriff’s office, County Commission, and City of Fairhope, led by Senator Lee "Slippery Trip" Pittman and "fixit man" Lynn Stacey.
      *   Huey Mack, son of the former coroner, utilized this political machine to run for and hold the Sheriff position.

      THE PIVOT:
      *   The political machine described in the Widget Article (Sick Six/Lynn Stacey) established the entrenched power structure that allowed the officials in Article 1 (Wilters, Whetstone, Mack) to protect the wrongful conviction for over two decades.
      *   This machine allowed Hoss Mack to become Sheriff (2006-23) and Anthony Lowery to rise through the ranks, ensuring that the department holding the original case files remained controlled by those involved in the wrongful prosecution.

      KEY ENTITIES:
      *   Murray Lawrence Jr.
      *   Robert Wilters (Circuit Court Judge)
      *   Hoss Mack (Chief Deputy/Sheriff, Executive Director of Alabama Sheriffs Association)
      *   David Whetstone (Baldwin County District Attorney)
