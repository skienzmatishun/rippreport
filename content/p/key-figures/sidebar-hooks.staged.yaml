      - Murray Lawrence Jr. (Wrongfully convicted)
      - Robert Wilters (Former Baldwin County Circuit Court Judge)
      - Hoss Mack (Former Baldwin County Chief Deputy; current Executive Director of the Alabama Sheriffs Association)
      - Huey A. Mack Sr. (Former Baldwin County Coroner; owner of Mack Funeral Home)
      - Anthony Lowery (Appointed Baldwin County Sheriff; former lead investigator)
      - David Whetstone (Former Baldwin County District Attorney)
      - Baldwin County Sheriff’s Office (BCSO)
      - Alabama Sheriffs Association
