      THE CONFLICT:
      - In 2005, Murray Lawrence Jr. was convicted of murder in Baldwin County, Alabama, and sentenced to life without parole.
      - The prosecution's case lacked physical evidence, including DNA, a murder weapon, or fingerprints.
      - The State of Alabama failed to perform an autopsy, relying instead on a Mississippi examination.
      - The prosecution's theory of a gunshot killing contradicted the death certificate, which listed the cause of death as strangulation.
      - The indictment was not signed by the grand jury foreman.
      - Key officials, including Judge Robert Wilters and DA David Whetstone, allowed the trial to proceed despite contradictory forensic testimony from pathologist Dr. Paul McGarry.

      THE DISCOVERY:
      - The entire case against Murray Lawrence Jr. was built upon a confession from another individual.
      - That individual changed his story only after law enforcement offered a "way out" (leniency/immunity), naming Murray Lawrence Jr. to secure his own deal.
      - There were zero witnesses who placed Murray Lawrence Jr. at the crime scene.

      THE PIVOT:
      - Article 2 provides the evidentiary proof that the conviction was manufactured through coercion. This transforms the actions of the officials in Article 1 from procedural negligence into a deliberate cover-up; if the "evidence" was a coerced lie from a different man, then the officials in Article 1 (Wilters, Mack, Lowery, and Whetstone) intentionally protected a fraudulent conviction to maintain the existing power structure.

