perpetuating internal cover-ups, lack of transparency, and favoritism rather than reform.\n\nKEY ENTITIES:\n- Murray Lawrence Jr.\n- Robert Wilters\n- Hoss Mack (Hoss the Boss)\n- Anthony Lowery\n- John David Whetstone\n- Governor Kay Ivey\n- Huey A. Mack Sr.\n- Dr. Paul McGarry\n- Baldwin County Sheriff's Office (BCSO)\n- Mack Funeral Home\n- Alabama Sheriffs Association\n- Alabama Law Enforcement Agency"
