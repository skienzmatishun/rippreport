  fairhope-sold-to-the-highest-bidder:
    brief: |-
      THE CONFLICT:
      - Fairhope City Council approved Resolution 19 authorizing $2,650,000.00 for purchase of approximately 114 acres located on northwest corner of County Road 13 and 32 (8875 County Road 32).
      - Funding sources for purchase: Investment CD – Savings: $1,065,146.07; Prepay Debt Reserve: $700,285.37; Impact Fees – Recreation: $884,568.56; Total amount: $2,650,000.00.
      - Council took funds from city accounts (savings, reserves, impact fees) without public participation, without budget approval, and without having a budget approved in 4 years.
      - Resolution 20 extended Budget for fiscal year ending September 30, 2019 to allow expenditures to continue until FY2020 parts adopted.
      - Council first promised on Oct. 29, 2019 that only an appraisal was being sought, not a sale; they approved the appraisal and then moved forward to purchase.
      - Council voted themselves a raise and full family insurance for part-time employees.
      - Untimely purchase will delay infrastructure, sewer, and capital improvements already scheduled; impacts 2020 budget; costs staff countless hours to make changes.

      PAST HISTORICAL EVENTS (older context):
      - Triangle: Council President Jack Burrell insisted for years the park was purchased for $8.25 million; Burrell had to eat his words when attorneys/publications pointed out it was not a purchase nor a park, but a legal settlement of a lawsuit the city lost. City HAD to purchase. With attorney fees final cost was close to $13 million. Property value today is around $20 million. Burrell led unsuccessful effort, supported by a CATALYST council, to give it away. CATALYST wants control of the Triangle.
      - Soccer Fields purchase: Council drained city accounts for an unnecessary land deal. Property remained vacant for years, no plan, then city decided to install soccer fields. Over $5 million, maybe as high as $7 million, later. Fields today have a host of problems and are considered "fair practice fields."
      - K1 and Nix Center: Council screwed up deal for months. One proposal after another went down the toilet until finally Mayor secured the sale. Now they own it and have no plan and no money. Council discussed in work session how to come up with money for minor repairs, such as roof, on K1. They did not have money for roof on building falling down, replacement roof for city hall, or improvements for Nix Center. But they approved $2.65 million for dirt.

      THE DISCOVERY:
      - Article 2 (FAIRHOPE SOLD TO THE HIGHEST BIDDER) revealed at the time: citizens of Fairhope were being sold out by developers, city council, and appointed positions such as municipal judge.
      - In the midst of the Fairhope budget process, the CATALYST Council, Boone Burrell and Brown were proposing a $2.65 million dollar purchase, supported by a questionable appraisal, for recreation land that will not be used for years.
      - Article 2 showed the purchase of the soccer fields was corrupt from day one; end result was Fairhope drained 5 accounts for the purchase, let it sit idle for years, then blew $5 million plus on a substandard complex.
      - Article 2 stated the council was now repeating the same reckless process all over again in the middle of the budget process; in four years the Catalyst Council had not approved one budget on a timely manner.
      - Article 2 stated the council had no public participation related to the recreation land purchase; Cory Martin pleaded for the council to listen to reason; pleas drew dead silence; it was financially reckless and very suspicious that the three B's were pushing so hard to close on the property.

      THE PIVOT:
      - Article 2 is older than Article 1; frame it as background/historical context.
      - Article 2 documented prior questionable council land deals (soccer fields, Triangle, K1/Nix Center), establishing a historical pattern of draining city accounts and reckless purchases.
      - Article 2 is the 'smoking gun' or key context for Article 1 because it framed the $2.65 million purchase as a repeat of the same reckless process the council had already pulled on the soccer fields and other deals.

      KEY ENTITIES:
      - Fairhope City Council
      - Jack Burrell, Council President
      - Brown
      - Boone Burrell
      - Cory Martin
      - Mayor Wilson
      - CATALYST
      - Fairhope; Baldwin County
      - County Road 13 and 32 / 8875 County Road 32
      - K1 Center; Nix Center
      - Triangle
      - Soccer fields
      - Fly Creek Apartments
      - Municipal judge; city attorney
      - Fairhope City Council (part-time employees; voted themselves raise and full family insurance)
    llm_text: Fairhope’s council drained city accounts for a $2.65 million land buy on County Road 32 without public input or a budget, while Council President Jack Burrell pushed it. It echoes the reckless soccer fields deal Article 2 revealed before Fairhope repeats its pattern again.
