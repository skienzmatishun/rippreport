  full-plate:
    refined_source: 1faa25e654d591350c6c312cdb8686f4297af190ac32ae7225ce24cd5b765008
    brief: |-
      THE CONFLICT:
      *   Fairhope City Council approved $2,650,000.00 for 114 acres of land at 8875 County Road 32 (northwest corner of County Road 13 and 32).
      *   This purchase utilized Investment CD – Savings ($1,065,146.07), Prepay Debt Reserve ($700,285.37), and Impact Fees – Recreation ($884,568.56).
      *   Council President Jack Burrell led the effort regarding The Triangle PARK, which was a legal settlement costing close to $13 million (property value ~$20 million).
      *   A pending lawsuit exists against the Council and Council President regarding an incident where over 40 kids were questioned out of over 100.
      *   The city failed to approve the 2020 budget and has not approved a budget on time for 4 years.

      THE DISCOVERY:
      *   The K-1 school site has been idle for years and is a source of controversy regarding its intended use (school resurrection vs. economic development).
      *   The Mayor endorsed the Hatch program, but initially without commitment to use the entire K-1 site.
      *   Lee Lawson (President and CEO of EDA) provided an economic impact analysis suggesting Hatch would provide 266 new and indirect jobs with $16.8 million in payroll and $33.65 million in total revenue.

      THE PIVOT:
      *   Article 2 establishes a pattern of council mismanagement, high legal costs (Triangle settlement of $11.25 million), and poor planning (K-1 site ambiguity) before the recent $2.65 million land purchase.
      *   This context demonstrates the current $2.65M purchase is not an isolated incident but part of a history of draining city accounts for questionable, unplanned land deals (e.g., Soccer Fields, K1/Nix Center).

      KEY ENTITIES:
      *   Fairhope City Council
      *   Jack Burrell (Council President)
      *   ?CATALYST
      *   K-1 site
      *   The Triangle PARK
      *   Lee Lawson (President and CEO of EDA)
      *   Dean Mosher
      *   Baldwin County School System
      *   $2,650,000.00
      *   8875 County Road 32
