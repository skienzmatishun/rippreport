  you-win-some-you-lose-some:
    brief: |-
      THE CONFLICT:
      - 2012–2016: Mayor Can’t of Fairhope was in office 16 years; collected double paycheck as Mayor and utility director.
      - 2012–2016: Mayor Can’t, Councilman Boone, and Councilman Burrell used utility fund as slush fund to balance general fund and pay for lawsuits.
      - Result: Fairhope lost its best senior utility supervisor to Daphne; $3 million paid to attorneys.
      - Utility fund drained; no sewer infrastructure work done; electric department on string.
      - Woman who ran for Mayor exposed problem; promised before election to tackle sewer/infrastructure ignored for decade; elected.
      - Mayor Karin Wilson defeated Catalyst.
      - Catalyst Council elected; Mayor Wilson was public servant; no Catalyst cool-aid.
      - Current Catalyst Council obstructed Mayor Wilson and city employees from day one; goal in sight: 2020.
      - Catalyst planned to resurrect itself in 2020 under another name, same dark soul of good ole boys.

      THE DISCOVERY:
      - Article 2, “YOU WIN SOME YOU LOSE SOME,” is older/background context.
      - Ripp Report first saw effort of Fresh Start Fairhope; Fresh Start filed petition with 800 names for change of government.
      - Fairhope City Council came to mind immediately; Ripp could not figure out what was going on.
      - Fresh Start and council at odds because no decision to make; law clearly outlines guidelines if municipality votes for change of government.
      - Fallout caused flood of false/misleading information starting with Fresh Start and brought to boil by council.
      - Present “at large” council were Catalyst; had yet to deliver budget; council of indecision and obstruction.
      - Catalyst council instructed city attorney to do whatever possible to cancel Oct. special election.
      - Catalyst and good ole boys canceled it; dirty trick intentional; council knew odds of referendum vote during general election had history of failing.
      - Council and Catalyst spread fear/misinformation to voters; Fresh Start spent thousands on first proposed election date and tapped out by time general election, Nov. 6, arrived.
      - Fairhope missed golden opportunity; majority elected not to change government and continue operate unsuccessfully.
      - Seven precincts crowded; Baptist Church on Fairhope Av. was traffic hazard and one voting booth caused long waits; Civic Center lines waited up to two hours; many left without voting.

      THE PIVOT:
      - Article 2 is the “smoking gun” or key context for Article 1 because it documents Catalyst council obstruction, cancellation of Oct. special election, misinformation, and political bear trap around Fresh Start/change of government.
      - It supports Main Article claim that Catalyst Council obstructed Mayor Wilson and city employees from day one and had 2020 as goal.
      - It frames Catalyst “at large” council and no/Can’t core group as political context behind sewer/backstory conflict.

      KEY ENTITIES:
      - The Ripp Report.
      - Fairhope City Council.
      - Mayor Karin Wilson.
