  sheriff-huey-boss-mack-secret-police-2:
    brief: 'THE CONFLICT:

      - May 2017: BCSO shot and killed unarmed Jonathan Victor; BCSO lacked crisis
      intervention teams and de-escalation training at the time.

      - March 5, 2018: BCSO SWAT team breached Robert Yates’ home after he fired one
      warning shot; deputies (including Justin Correa, son of Robert Correa) were
      “gonna go in and kill this f*cker if I have to”; over 114 rounds, tear gas,
      and concussion grenades left on scene despite no exigent circumstances.

      - July 2025: BCSO investigated the death of Peyton Little, allegedly a confidential
      informant for the BCSO drug task force who received threats; he was found strangled
      with his seatbelt in a moving car and declared a suicide without investigating
      the threat or informing deputies.

      - June 2024 (approx.): Kevin J Andrews died during a traffic pursuit while patrolling
      on a four-wheeler without a life vest, despite BCSO policy requiring abandonment
      of pursuits when danger outweighs immediacy of apprehension.

      - William ''Bill'' Smith, a BCSO Deputy, died while patrolling on a four-wheeler
      without a life vest in a high-risk environment.

      - Murry Lawrence Jr. was sentenced to life without parole despite no physical
      evidence (gun, witness, fiber, fingerprints, blood, DNA) and multiple alibi
      witnesses; his attorney Rebbeca Chambliss argued the case was tainted by biased
      rulings from Judge Scully favoring BCSO.

      - Robert Correa warned his son Justin about a potential conflict of interest
      regarding Justin’s role in the Yates shooting.


      THE DISCOVERY:

      - Hoss Mack Funeral Home, Sheriff Huey “Boss” Mack’s private business, received
      a county contract to handle deceased persons under special circumstances, creating
      an obvious conflict of interest (e.g., processing bodies like Jonathan Victor
      or Robert Yates).

      - BCSO investigated its own officers for multiple deaths and never requested
      FBI assistance or utilized ALEA capabilities.

      - The September 30, 2021 Lagniappe legal decision effectively closed public
      access to law enforcement records connected to investigations in Alabama, including
      body cam footage, surveillance video, 911 transcripts, and autopsy information.

      - Chief Justice Tom Parker called the Lagniappe decision a “Closed Records Act”
      that ends public access to evidence in law enforcement investigations.

      - The 2021-2022 General Fund increased from $39.8M to $47.5M while BCSO flat
      funding remained at $33.6M, despite over $65M in external funding received in
      2020-2021 (including $700K on body/vehicle cameras).


      THE PIVOT:

      - Article 1 discusses “Catalyst” and the political fallout around Sheriff Huey
      Mack’s political maneuvering (e.g., speaking at a Summerdale event without substantive
      engagement), while Article 2 reveals the systemic failures (lack of training,
      selective evidence, internal investigations without external oversight, conflicts
      of interest via Hoss Mack Funeral Home) that make Mack’s politics dangerous.

      - The Lagniappe decision in Article 2 is the “smoking gun” because it legally
      shields BCSO from public scrutiny of these past killings, directly enabling
      the political cover-up described in Article 1.


      KEY ENTITIES:

      - Huey “Boss” Mack (Baldwin County Sheriff)

      - Hoss Mack Funeral Home (Sheriff’s Private Business)

