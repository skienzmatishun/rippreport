      shooting)

      - Robert Correa (Father of Justin Correa, warned about conflict of interest)

      - Peyton Little (Alleged Confidential Informant, declared suicide without proper
      investigation)

      - Kevin J Andrews (Deceased Person - Traffic Pursuit, no life vest on four-wheeler)

      - William ''Bill'' Smith (BCSO Deputy - Deceased, four-wheeler/patrol incident)

      - Murry Lawrence Jr. (Wrongfully Incarcerated Man, sentenced to life without
      parole with no physical evidence)

      - Rebbeca Chambliss (Attorney for Murry Lawrence Jr.)

      - Judge Scully (Presiding Judge alleged to have biased rulings favoring BCSO)

      - Tom Parker (Chief Justice of Alabama, criticized Lagniappe decision)

      - William Cassady (U.S. District Court Judge, issued standard for excessive
