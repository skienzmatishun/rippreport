  anonymous-bb:
    brief: 'THE CONFLICT:

      *   **Baldwin County SOAR Incident (2013):** Police conducted a 5-hour siege
      on Robert Yeats''s home, destroying it with an armored BearCat, tear gas, flash
      bangs, and over 100 rounds. Yeats died. Deputy Justin Correa (son of Robert
      Correa) participated, despite Robert Correa warning his son about the conflict
      of interest.

      *   **Johnathan Victor Incident:** Anthony Lowery (current Sheriff) claimed
      Victor died by "suicide by cop." District Attorney Robert Wilters refused to
      retract the claim that Victor was on ketamine, despite knowing first responders
      administered it to save him.

      *   **Murray Lawrence Jr. Wrongful Conviction:** Prosecutors David Whetstone
      and Judge Robert Wilters, in collusion with Sheriff Hoss Mack and Anthony Lowery,
      suppressed evidence from the defense while Whetstone later admitted he knew
      Lawrence was innocent but still convinced the jury the legal autopsy was wrong.
      This resulted in 20 years of wrongful incarceration.

      *   **O J French Death:** Police killed O J French during a routine tail light
      stop. The Baldwin County Major Crimes Unit justified and covered up the killing,
      resulting in a pending federal lawsuit.

      *   **I-10 Wrong-Way Chase:** A wrong-way chase down I-10 at speeds over 100mph
      resulted in five deaths (three burned to death). Hoss Mack cited "law enforcement"
      as the cause of the incident.


      THE DISCOVERY:

      *   BCSO operated as a political cabal supporting the GOB rather than a police
      agency for nearly 20 years under Hoss Mack''s influence.

      *   Judges like Robert Wilters and Kristi Hagood were embedded in the judicial
      system to prioritize loyalty to BCSO culture over justice.

      *   Judge Kristi Hagood allegedly used Affidavits of Interview (A-I) containing
      factual inaccuracies to support a Rule 32 statement that imprisoned an innocent
      man for 20 years.

      *   The conspiracy between Lowery, Mack, Wilters, and Whetstone to withhold
      evidence from the defense in the Murray Lawrence Jr. case is documented.


      THE PIVOT:

      *   Article 1 features Donna Givens and Reps discussing "Catalyst Cabal" as
      a "faux pas" or fictional entity during a Summerdale political event.

      *   Article 2 provides raw factual evidence that the "Baldwin County SOAR/Cabal"
      is not fictional but an actual operational network embedded in law enforcement
      (BCSO) and the judicial system, with documented cover-ups, wrongful convictions,
      and deaths over 10-20 years.

      *   The specific names and events from Article 2 (Mack, Lowery, Wilters, Whetstone,
      Hagood) directly refute any narrative that "cabal" rhetoric is fictional political
      theater, establishing the historical and structural basis for the conspiracy
      theory mentioned in Article 1.


      KEY ENTITIES:

      *   **Personnel:** Robert Yeats, Johnathan Victor, Murray Lawrence Jr., O J
      French, Hoss Mack, Anthony Lowery, Matthew McKenzie (Sheriff Candidate), Richard
      Cox, Donna Givens, Whitney Scapecchi, Brandon Moseley, Justin Correa, Robert
