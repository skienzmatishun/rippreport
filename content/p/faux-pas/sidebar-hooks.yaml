hooks:
  summerdale-sunshine:
    brief: 'THE CONFLICT:


      *   Rep Donna Black Givens passed Bill HB51, which threatened basic constitutional
      free speech rights for people in Alabama who speak out against elected officials
      by creating a protected class of politicians and defining vague "harassment"
      standards.

      *   Don Givens worked closely with political consultants Scott Boone (of Catalyst/Senlow
      Consulting) and Jon Gray, using behind-the-scenes coordination to control public
      events like the Summerdale Candidate Forum to limit who was invited, who could
      speak, and who was barred from speaking.


      THE DISCOVERY:


      *   Rep Donna Black Givens publicly posted a comment on social media intended
      as a private message coordinating with allies in her political machine about
      who could attend events (e.g., "having friends in the right places" matters),
      then deleted it after realizing it had been captured.

      *   Whitney Scapecchi of Southern Freedom Press confirmed that audio exists
      of Givens stating shutting down voices was "the farthest thing from the truth,"
      contradicting her public statements about the intent of HB51 and revealing she
      intended to silence citizens.

      *   Scott Boone, Jon Gray, Kristy Haygood, and Chris Elliott formed an alliance
      at the Summerdale Candidate Forum, which resulted in political rivals like Judge
      Jodi Bishop, Judge Scott, and Jeremiah Giles forming a counter-alliance.


      THE PIVOT:


      *   Article 2 is the "smoking gun" because it proves that Donna Givens'' public
      image of being concerned about free speech (which she used to justify killing
      HB51) was merely PR. The leaked deleted comments and audio records prove her
      actual intent was using legislative power to manipulate who can speak in public
      and silence dissent, which explains why her campaign machine (Catalyst/Senlow
      Consulting, Scott Boone, Jon Gray, Lowery) is described as a "Catalyst Cabal"
      that manipulates local politics through intimidation and gatekeeping.

      *'
