  sheriff-mack-out-oj-french-lawsuit-in:
    brief: "THE CONFLICT: \n- OJ French Jr. was killed by Bay Minette Police Officer Brandon Thompson during a traffic stop involving a struggle over a taser, after the officer demanded he exit the vehicle without probable cause.\n- Mayor Robert Bob Wills publicly lied, claiming he spoke for the French family and that they were \"ok with the outcome\" of the investigation and wanted the conversation to end.\n- The Major Crimes Unit of Baldwin County investigated the incident, and a Grand Jury cleared Officer Thompson; the dashboard/body camera video has been withheld from the public under the guise of being \"Grand Jury Secret.\"\n- Sheriff announced in mid-July 2024 that he is resigning in mid-August 2024, attempting to install Chief Deputy Anthony Lowery as his replacement via appointment by Governor Kay Ivey.\n- County Commissioner Matt McKenzie also maneuvered to secure the interim Sheriff appointment, highlighting entrenched \"BOSS HOGG\" political influence in Baldwin County.\n\nTHE DISCOVERY: \n- On July 31, 2024, the family of OJ French Jr., the Bay Minette Justice League, and legal counsel May Jung LLC held a public rally proving Mayor Bob Wills's claims were completely false.\n- A federal lawsuit was officially filed in Federal Court against the City of Bay Minette and Officer Brandon Thompson, exposing the cover-up and forcing the concealed details of the fatal stop into federal proceedings.\n\nTHE PIVOT: \n- Article 2 serves as the smoking gun because it shatters the official narrative pushed by Mayor Bob Wills and local law enforcement that the French family accepted the outcome of a secret Grand Jury clearance, proving instead through a filed federal lawsuit that victims are fighting back against systemic corruption, hidden evidence, and backroom political appointments involving the Sheriff's office.\n\nKEY ENTITIES: \n- OJ French Jr.\n- Mayor Robert Bob Wills\n- Officer Brandon Thompson\n- May Jung LLC (Legal Counsel)\n- Bay Minette Justice League\n- Chief Deputy Anthony Lowery\n- Governor Kay Ivey\n- County Commissioner Matt McKenzie\n- Major Crimes Unit of Baldwin County"
