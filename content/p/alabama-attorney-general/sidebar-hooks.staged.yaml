      3. In November, Alabama Attorney General Steve Marshall's office noted a deal was reached between the AG and Regions regarding the trust, aimed at making the trust whole.

      THE DISCOVERY:
      1. Tom Albritton, Alabama Executive Director of the Ethics Commission and Mabel Amos Trust trustee, awarded himself and two other trustees $135k for his children's University of Texas attendance.
      2. Regions Bank, a trustee, took $1 million for inflated services.
      3. The Mabel Amos Trust is currently valued at $8.2 million.
      4. The Ripp Report filed complaints against Albritton with the Alabama Bar and Ethics Commission, which were dismissed by Albritton.
      5. Allen Dodd was appointed Deputy Alabama Attorney General following a lawsuit over Albritton’s alleged fraud.
      6. The AG's office stated a settlement was close in November, involving the fund's board, trustees, and Regions Bank.

      THE PIVOT:
