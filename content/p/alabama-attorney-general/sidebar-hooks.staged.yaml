  stealing-from-kids:
    brief: |-
      THE CONFLICT:
      - Tom Albritton, Alabama Executive Director of the Alabama Ethics Commission and trustee of the Mabel Amos Scholarship Trust, allegedly committed fraud and self-served from the trust.
      - Mabel Amos Trust: original value $500 thousand; ballooned to $4.1 million in 2011 after oil discovered on land in 2010; currently worth $8.2 million; oil well produced approximately $100 million, expected to produce millions more.
      - Albritton, in concert with two other trustees, awarded himself $135 thousand for his children's education at University of Texas.
      - Regions Bank, a trustee, took approximately $1 million for inflated services.
      - Rick Clifton, third trustee, benefited from the trust.
      - Approximately 3.2 million of the trust between 2013 and 2021 awarded to anonymous recipients.
      - Approximately 200 to 400 scholarships available with present funds; children deprived of ability to apply.
      - Albritton publicly stated to Francis Paul Ripp that he committed fraud and self-served; Ripp moved forward with lawsuit; resulted in Allen Dodd appointed Deputy Alabama Attorney General.
      - State Rep. Matt Simpson, chair of Ethics and Finance committee, currently rewriting Alabama Ethics laws; not addressing current issue; quote: "If there were a rogue director, there's nothing in the law the legislature or the governor can do about it."
      - Judge Johnny Hardwick, Montgomery County Circuit Court, in November, said state, fund's board members, trustees, and Regions Bank were "close to reaching a settlement after a vigorous adversarial investigation."
      - Ethics Commission raised Albritton's salary from $25 thousand to $210 thousand a year.

      THE DISCOVERY:
      - Article 2 ("STEALING FROM KIDS") framed the case as systemic corruption; NO state as corrupt as Alabama.
      - Albritton maintained his position despite alleged criminal behavior.
      - Bryon Mathews quote: "This attorney general can not be trusted to represent the best interest of the fiduciaries who are financially needy children in the state of Alabama." / "This is going to be the sweetest settlement you ever saw."
      - Judge Johnny Hardwick had not ruled on approximately 70 motions; getting zero love; speculation judge thought it would settle or more was going on.
      - Watch for whitewashing of any criminal activity in final settlement agreement and lack of transparency or accountability.

      THE PIVOT:
      - Article 2 is the smoking gun or key context for Article 1 because it frames the alleged fraud as "stealing from kids," presents Albritton as maintaining his position despite criminal behavior, includes judicial inaction, political maneuvering, and settlement transparency concerns, serving as background/context for the fraud and self-dealing claims in Article 1.

