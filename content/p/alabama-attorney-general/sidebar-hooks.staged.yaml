      THE CONFLICT: In September 2022, The Ripp Report filed a formal complaint with Alabama Attorney General Steve Marshall's office against Alabama Ethics Commission Executive Director Tom Albritton regarding his admitted misuse of $120,000 to $135,000 from the Mabel Amos Memorial Fund for his children's university expenses. Despite a subsequent state lawsuit and public acknowledgments of fraud, Albritton remained in his position as Ethics Director, received a salary increase to $210,000, and continued to arbitrarily dismiss ethics complaints filed against public officials.

      THE DISCOVERY: Article 2 (older background context) establishes a pattern of institutional cover-ups and hypocrisy by demonstrating that Tom Albritton used his gatekeeper position at the Ethics Commission over a 15-year period to dismiss dozens of complaints against judges, lawyers, and elected officials—even while he was personally skimming from the Mabel Amos Trust. Furthermore, it details how complaints submitted to Attorney General Steve Marshall regarding systemic corruption (such as the 2005 wrongful conviction of Murray "Bubba" Lawrence involving Sheriff Hoss Mack, prosecutor David Whetstone, and Judge Robert Wilters) fell on deaf ears.

      THE PIVOT: Article 2 serves as the smoking gun because it proves that Albritton’s embezzlement from the Mabel Amos Trust was not an isolated incident, but part of a broader, systemic failure of accountability where the Ethics Commission operated purely as a political shield to protect compromised officials, leaving the Attorney General's ongoing legal proceedings against Albritton open to suspicion as a potential "legal masquerade" designed to avoid real consequences.

