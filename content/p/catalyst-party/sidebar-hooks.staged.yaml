      - Jack Burrell - Council President.
      - Karin Wilson - Mayor.
      - Sherry Sullivan - former city employee, CATALYST candidate for Mayor.
      - Mr. Brown - involved with Sherry Sullivan conservation, raised party idea.
      - Boone - Councilman.
      - Jennifer Fidler - former Public Works.
      - Tripp Pittman - Sen. Tripp Pittman.
      - Goodwin, Mills and Cawood - Professional Engineering Services.
      - Crowder Gulf, LLC - Disaster Debris Removal.
      - M&N of Alabama, LLC - Dredging MOU.
      - MW Rogers Construction Co., LLC - Library Envelope Repairs.
      - Fairhope Volunteer Fire Department - $200k donation.
      - Fairhope Yacht Club - dredging split.
      - Baldwin County Board of Education - K-1 Center.
      - City of Fairhope - City Council, Mayor, Council President.
      - City Attorney.
      - Fairhope Fire Station #1, E-ONE Custom Rescue Pumper, Houston-Galveston Area Council Contract FS12-19, Impact Fees.
      - Fairhope Avenue and Section Street - Clock Corner.
      - Fly Creek - dredging.
      - Publix - construction/flooding.
      - Library - construction issues.
      - Alabama Department of Public Health, Governor, COVID-19, Mardi Gras, New Orleans, Mobile, Fairhope.
      - Lowery, Wilters - names to mention.
