    brief: |-
      THE CONFLICT:
      *   Historical corruption and mismanagement by the Fairhope City Council, led by Council President Jack Burrell, Councilman Brown, and Councilman Boone (The Three B's).
      *   Incidents include the council losing a Federal Court case for refusing a USMC combat veteran to speak; Burrell using taxpayer money to derail bid-rigging allegations on the Airport Board; Brown acquiring lucrative contracts via his elected position (pending Alabama Attorney General complaint); and Burrell possessing two sealed juvenile charges prior to his last election.
      *   The Three B's spent $2.65 million on recreation farmland and subsequently leased it for $9,000 annually for farming.

      THE DISCOVERY:
      *   Article 2 provides documented historical evidence of council corruption dating back to 2016, including financial misuse, legal conflicts, and personal gain by council members.

      THE PIVOT:
      *   Article 2 establishes the pattern of financial mismanagement (e.g., the $2.65 million farmland loss) and political influence (Burrell's maneuvering) that serves as the context for current actions discussed in Article 1, such as the $525,000 Clock Corner purchase, the need for an additional $10,000 Environmental Site Assessment, and the city's current financial strain from COVID-19 revenue loss.

