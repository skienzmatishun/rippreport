  whose-agenda:
    brief: |-
      THE CONFLICT:
      - Last Fairhope City Council meeting lasted only 30 minutes, described as shortest meeting on record.
      - Council meeting timestamp: check in at 12:40 minute mark, beginning of agenda item #7.
      - Resolution #7: postponed all public hearings of City Council, Planning Commission, and Board of Adjustments and Appeals until further notice, due to limitations on public gatherings and social distancing pursuant to advisement of Alabama Department of Public Health and Orders of the Governor.
      - Council President Jack Burrell "promised" at 13:20 that the council was canceling public participation during the COVID-19 "stay at home order" as per the Governor's order.
      - Resolution #8: Council President Jack Burrell authorized to negotiate and execute Professional Engineering Services contract with Goodwin, Mills and Cawood to perform Environmental Site Assessment including groundwater testing on property at NE Corner of Fairhope Avenue and Section Street (Clock Corner); contract not to exceed $10,000.
      - Burrell, as master negotiator, and council botched Clock deal from day one; Burrell negotiated purchase of 1000 square feet, with a clock, for $525,000; next Burrell to explain old existing gas fuel tanks buried on site that have to be removed.
      - Burrell along with Boone and Brown purchased 2.65 million in farmland for recreation and then promptly leased same land back for farming for $9 thousand a year; now city desperately needs 2.65 million due to revenue loss from COVID-19.
      - Resolution #12: Mayor Karin Wilson authorized to execute contract for Extension No. 2 of Bid Number 020-18, Disaster Debris Removal and Disposal 2018, with Crowder Gulf, LLC for additional one year, per terms and conditions of original contract; based on per unit cost as specified in Bid Tabulation.
      - Same contract that city gave to Sen. Tripp Pittman for years under previous Mayor; Burrell fought tooth and nail to continue giving contract to his "bible buddy" Pittman; newly elected Mayor said no; Pittman could not get bid in honest bidding process.
      - LET'S HAVE A PARTY: at minute 22, Mr. Brown brought up fact that he had a conservation with Sherry Sullivan and came up with idea of a party celebrating going back to work; Burrell said wonderful idea and they could close all streets and have bands downtown.
      - Same Mr. Brown who thinks we should all go to work NOW and that stay at home order was not necessary; why is Mr. Brown bringing up Sherry Sullivan? Same Sherry Sullivan along with Brown and Burrell who wanted to "Take a Chance" on Arts and Craft Show.
      - CATALYST wants Sherry Sullivan as their next candidate for Mayor of Fairhope; former city employee who had numerous jobs, none for long; briefly in charge of recreation center, failed miserably.
      - New Orleans and Mobile having difficult time with COVID-19; little argument that Mardi Gras was the culprit; what would have happened if Burrell, Brown and Sullivan got wish and had "Take a Chance" Arts and Craft Show? Fairhope Mayor Wilson and a couple of council members almost certainly prevented opportunity of COVID-19 being exposed to as many as 200,000 attendees.
      - Resolution #16: City of Fairhope voted to purchase one E-ONE Custom Rescue Pumper Fire Truck for Fire Station #1; available for direct procurement through Houston-Galveston Area Council Contract FS12-19 which has been nationally bid; no need to let out for bid; total cost $517,157; joint purchase between City of Fairhope and Fairhope Volunteer Fire Department with 60/40 split; City paying up to $331,000 from Impact Fees and FVFDD paying up to $200,000.
      - Burrell stated FVFDD was "Gracious" in donating $200 thousand towards purchase; Burrell did not mention that only a few months ago fire chief told Mayor in council chambers he would not provide city with any financial support; fire chief was rude and made a speech that FVFDD did not have to tell Mayor anything, they were independent, but they take city money.
      - COVID-19 should be taken seriously and not time or place to talk about political rallies disguised as party.

      THE DISCOVERY:
      - Fairhope City Council agenda, March 8th, was loaded with resolutions that should catch eye of voters and raise many questions about City Council, NOT informing public about facts surrounding each resolution.
      - Resolution #10: Mayor Karin Wilson or Council President Jack Burrell, on behalf of City of Fairhope, authorized to purchase properties owned by Baldwin County Board of Education: K-1 Center, Fairhopers Community Park, James P. Nix Center; execute and negotiate all documents necessary to complete closing and acquire title on behalf of City pursuant to executed Land Purchase Contract.
      - This is second round of purchasing K1 Center, first failed; Council promises public hearings, hope Council lives up to promise and this time listens to all options.
      - Resolution #11: City Council approves and authorizes Mayor Karin Wilson to execute one of Memorandums of Understanding between M&N of Alabama, LLC and City of Fairhope for Dredging of Main Channel of Fly Creek; authorize Mayor to execute contract for Bid No. 008-19.
      - This is half million dollar contract, split between City and Fairhope Yacht Club; Council did not say a word about having to dredge before, nor did they say where material they are dredging came from; when Publix was built, massive flooding caused unstable construction site to spill tons of red fill and topsoil into creek; every time excessive rains, creek floods and pushes Publix fill downstream; Fairhope will have to dredge again and again in future and taxpayer will pick up check; Council favored developer over public and ignored accountability.
      - Resolution #12: To authorize filing with County Board of Education of Baldwin County, Alabama, of Request for Special 3 Mill Ad Valorem School District Tax Election.
      - Everyone agrees schools need more money; how to provide is question; Council President Jack Burrell "wants out of the school business"; way to accomplish is shift responsibility from Council to self-imposed tax.
      - Council never explained or discussed with public Mayor's option of more expedient and equitable solution, not involving taxes; Council could have provided funds last night instead chose more difficult path of referendum and tax; Council playing political games with kids and not considering best interest of community when withholding information from public to satisfy agenda; Ripp Report will support 3 mil tax, kids and teachers desperately need it; unfortunate Council rejected even talking about options to tax; if tax fails, will Council then be willing to listen to Mayor's options?
      - Resolution #27: Mayor Karin Wilson authorized to execute Change Order No. 2 to Bid No. 005-18, Library Envelope Repairs 2019 which adds additional 12 calendar days to contract for miscellaneous repairs due to unforeseen conditions discovered upon demolition and affects critical path schedule; and awards Change Order to MW Rogers Construction Co., LLC; Change Order will extend contract time from 210 calendar days to 222 calendar days.
      - This is one of biggest scandals in Fairhope, kept quite by politicians sweeping under rug for years; former Mayor Can't, former Public Works Jennifer Fidler, Council President Burrell and Councilman Boone on top of totem pole of responsibility; library plagued with construction issues since day one; then Mayor and Council never held anyone responsible, Architect, or general contractors, repairs stacked up through years until present administration tackled issues; library closed for weeks, yet Council says not a word; should be special investigation into construction issues and why ignored; how do you build library for millions and have no warranty? Council explains nothing.
      - Resolution #30: Executive Session - to discuss consideration the City is willing to offer or accept when considering purchase, sale, exchange, lease, or market value of real property; discussions could have detrimental effect upon competitive position of City in negotiations if matter discussed in public.
      - Could be legitimate issue; however history of this Council, with aid of City Attorney, should make everyone nervous; not discussing things in public is their agenda.

      THE PIVOT:
      - Article 2 (WIDGET, March 8th agenda) is older than Article 1 (MAIN, last meeting); frame WIDGET as background/historical context.
      - WIDGET's March 8th agenda resolutions (K-1 Center, dredging, school tax, library change order, executive session) loaded with resolutions raising questions, not informing public about facts; provides background for MAIN's last meeting resolutions and claims.
      - WIDGET is the smoking gun/key context for MAIN because it documents prior council actions/inactions (K-1 second round, dredging, tax, library) that support MAIN's narrative of council distrust (Burrell promise, CATALYST party, COVID-19).
      - WIDGET shows pattern of council withholding info/playing agenda, which is context for MAIN's assertions that council cannot be trusted.

