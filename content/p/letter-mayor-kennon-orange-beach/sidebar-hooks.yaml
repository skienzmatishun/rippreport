      - It claims Brackin is involved with the Brackin Law Firm, providing an unfair legal advantage in family court matters handled before Judge Thomason.
      - The article states Brackin has received a private reprimand and public Censure from the Alabama State Bar Disciplinary Commission.

      THE PIVOT:
