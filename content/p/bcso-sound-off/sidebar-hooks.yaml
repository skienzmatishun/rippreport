  BALDWIN-COUNTY-SHERIFF-APPOINTMENT:
    brief: "THE CONFLICT:\n* Sheriff Hoss Mack is resigning (or being removed) and\
      \ has designated his second choice, Anthony Lowery, for the appointment.\n*\
      \ Lowery had previously claimed he did not want the job but is now taking credit\
      \ for \"inheriting\" Mack's departmental culture (\"GOB\" - good ole boys).\n\
      * Mack allegedly transferred 20 years of department problems and internal cover-ups\
      \ to Lowery upon his departure.\n* The current BCSO leadership is facing accusations\
      \ of arbitrary chain of command, lack of transparency, sexual misconduct, and\
      \ a lack of accountability for officer misconduct.\n\nTHE DISCOVERY:\n* **The\
      \ Appointment Process:** A confidential opportunity exists for the public, victims,\
      \ lawyers, and citizens to submit evidence/testimonials directly to Governor's\
      \ Appointment Office (Director Mason Bass) regarding Lowery’s suitability, or\
      \ suggest alternative candidates.\n* **Evidence of Institutional Cover-ups by\
      \ BCSO:** Specific cases of alleged misconduct where victims or families were\
      \ provided false narratives or no information:\n  * **Peyton Little:** Ruled\
      \ a suicide after being found strangled by a seat belt in a moving car. He was\
      \ a confidential informant. Lowery told the family \"Peyton wanted to die.\"\
      \n  * **O.J. French Jr.:** Killed for a signal violation; cleared by BCSO Major\
      \ Crimes Unit (whose chief was the Bay Minette chief) despite community protest\
      \ and lack of answers from the DA or Mayor.\n  * **Robert Yates:** Death during\
      \ an unjustified SWAT breach; 114 shell casings and tear gas/concussion grenades\
      \ used against a man who had fired only a warning shot.\n  * **Jonathan Victor:**\
      \ Unarmed, shot 4 times with a high-powered rifle from 7 yards during a single-car\
      \ accident. A 11th Circuit appeal on qualified immunity for Deputy Mark Hunady\
      \ was denied, but is currently being reviewed for reversal that could result\
      \ in multi-million dollar liability.\n  * **I-10 Wrong-Way Pursuit:** 5 deaths\
      \ (Joseph L. Andrews, 81; Kevin J. Andrews, 54; Dominic Scotti Garcia Jr., 26)\
      \ resulting from a BCSO deputy driving into oncoming traffic at 110 mph. Mack\
      \ defended the officer without disciplinary action and said \"That is what happens\
      \ when you run from the law.\"\n* **Judicial Corruption:** Sheriff Mack, Prosecutor\
      \ David Whetstone, and Judge Robert Wilters withheld exculpatory evidence to\
      \ incarcerate an innocent man for 20 years; Lowery was an investigator with\
      \ knowledge of the evidence.\n\nTHE PIVOT:\n* Article 1 is a general complaint\
      \ about \"BCSO culture\" (favoritism, cover-ups) by \"sound-off\" deputies and\
      \ officers who are victims of that system.\n* Article 2 provides the procedural\
      \ mechanism (Appointment Office) to act on those complaints AND supplies specific,\
      \ verifiable evidence (names, dates, police reports/appeals) documenting the\
      \ very systemic failures and individual misconduct detailed in Article 1’s grievances.\n\
      * The pivot is that the public has a direct channel to hold Lowery and Mack\
      \ accountable by submitting this \"fill-in-the-blanks\" evidence, turning anecdotal\
      \ \"culture\" complaints into documented legal/official records.\n\nKEY ENTITIES:\n\
      * Hoss Mack\n* Anthony Lowery (Deputy Sheriff/Appointee)\n* Governor Ivy (and\
      \ \"Biden Syndrome\")\n* Mason Bass (Appointment Director)\n* David Whetstone\
      \ (Prosecutor)\n* Robert Wilters (Judge)\n* Mark Hunady (BCSO Deputy)\n* Jonathan\
      \ Victor (Victim)\n* Robert Yates (Victim)\n* O.J. French Jr. (Victim)\n* Peyton\
      \ Little (Confidential Informant/Victim)\n* Joseph L. Andrews (81, Victim)\n\
      * Kevin J. Andrews (54, Victim)\n* Dominic Scotti Garcia Jr. (26, Perpetrator/Participant\
      \ in crash)"
