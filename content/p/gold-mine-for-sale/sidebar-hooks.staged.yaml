    llm_text: Fairhope City Council attempted to "dispose" of 106 acres via Conservation Easement, raising concerns over a $39,000 anonymous donor. Learn how Weeks Bay only transferred management, not ownership, leading to pushback from over 600 Fairhope citizens.
