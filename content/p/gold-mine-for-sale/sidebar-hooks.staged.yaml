  big-heads:
    brief: |-
      THE CONFLICT:
      - Fairhope Conservation Easement proposed; Fairhope City Council involved; Weeks Bay involved; Fairhope citizens pushback over 600.
      - Fairhope Conservation Easement in limbo; Weeks Bay and city council doing damage control.
      - Fairhope City Council called conservation easement political football; special interests/developers want property out of city control.
      - Property: prime property in Fairhope municipal city limits; cost $13 million.
      - Council rationale: Fairhope cannot trust elected politicians in future to do right thing; decision needed now.
      - Council position: give away rights/control of 106 acres on one side while look at buying 40 acres on other side.
      - Dispute: planning/land use plan that works with comprehensive plan vs conservation easement; council wants cart before horse; no plan will give away 106 acres of municipal property.

      THE DISCOVERY:
      - Article 2 older than Article 1; frame as background/historical context.
      - City of Fairhope City Council Agenda, Thursday, February 15, 2018, 6:00 p.m., City Council Chamber.
      - Agenda Item 5: Final Adoption - Ordinance Directing Transfer of an Acre of Land to Fairhope Single Tax Corporation and Declaring said property surplus and not needed for Public or Municipal Purposes; Property is for Tatumville Subdivision.
      - Item introduced at January 22, 2018 City Council Meeting.
      - Same location as public health warning: WABF 1480 AM, Feb 12, 2018; 100,000+ gallon sewer spill in Fairhope; Health Department public notice; ongoing; estimated 100,000 to 200,000 gallons discharged into drainage ditch leading to Big Head Gully, Tatumville Gully, and Mobile Bay; health dept urges caution; cook fish/seafood; wash hands.
      - Same location as petition of over 2,200 people voicing objections.

      THE PIVOT:
      - Article 2 is older/background context for Article 1.
      - Article 2 shows final adoption agenda/transfer of acre to Fairhope Single Tax Corporation, surplus declaration, Tatumville Subdivision.
      - Article 2 links same location to sewer spill/health warning and over 2,200 petition objections.
      - Article 2 is key context/smoking gun for Article 1 because it establishes earlier council action and public health/petition context before Fairhope Conservation Easement conflict, Weeks Bay damage control, over 600 petition, council positions, 106/40 acres, $13 million.

