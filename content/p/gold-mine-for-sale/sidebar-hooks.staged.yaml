      - October 9th, 2017: Councilman Kevin Boone had an LLC related to the Firefly project; he since dissolved the LLC after exposure.

      THE DISCOVERY:
      - Historical context shows ongoing public concern regarding sewage spills and dumping into the bay in 2017.
      - Arthur Corte refused water testing on his property, impacting Fly Creek Watershed monitoring.
      - Earlier reports detail a pattern of unaddressed citizen complaints regarding water quality and city lift station problems.

      THE PIVOT:
      - Article 2 establishes pre-existing, documented environmental and sewage infrastructure failures in the specific area (Fly Creek/wetlands) that Article 1 seeks to develop or change zoning for (106 acres).
      - Article 2 links Councilman Kevin Boone's financial interest (LLC in Firefly) to the land issue central to Article 1 (106 acres municipal property rights).

