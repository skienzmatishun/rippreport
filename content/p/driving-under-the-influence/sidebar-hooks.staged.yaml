    brief: |-
      THE CONFLICT:
      *   In 2012, Tucker Dorsey supported a 30 million dollar mega site and a pay freeze for county employees, pressured by Frank Burt.
      *   Rep. Davis sought permission to work for an oil company, but the Ethics Commission did not render an opinion.
      *   Sen. Pittman skimmed 750,000 of BP money for his company; the Ethics Commission did not intervene.
      *   Tucker Dorsey was elected Baldwin County Commissioner and became interim director for the South Alabama Regional Planning Commission (SARPC).
      *   Dorsey was a board member of the Mobile Area Council of Boy Scouts, which was facing financial issues.

      THE DISCOVERY:
      *   Baldwin County was positioned as the most corrupt county in Alabama due to political figures leveraging the Ethics Commission to overlook conflicts of interest, especially monetary ones.
      *   The political system in Baldwin County was characterized by a "good ole boy club" dynamic, requiring support for major projects (e.g., the 30 million dollar site) for political acceptance.

      THE PIVOT:
      *   The systemic corruption and conflicts of interest identified in the past (2012/before) provide the necessary historical context for the Main Article's critique of modern local governance, specifically the judicial and non-profit system (Baldwin Substance Abuse Services, Inc.) which is controlled by local judges and attorneys.
      *   The historical pattern of political figures prioritizing personal/crony interests (Dorsey/Pittman) is mirrored in the current system where judges and attorneys (Judge Thomason) control BSAS to generate income from DUI fines, bypassing public accountability.

