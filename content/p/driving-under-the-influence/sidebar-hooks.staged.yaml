      *   2016: Attorney David J. "Baloney" Mahoney was arrested in Escambia County Florida for DUI; previously linked to a case involving City Judge Julian Brackin.

      THE DISCOVERY:
      *   The Baldwin Substance Abuse Services, Inc. (BSAS), a domestic non-profit formed on 10-4-2007 in Baldwin County, is utilized for court-referred DUI offender training/treatment.
      *   Judge Thomason is listed as an incorporator of BSAS, which has collected millions of dollars from DUI victims.
      *   BSAS mandates a $400 education course (taught by James Ball in Robertsdale) and six drug tests ($300 total) for first offenders.
      *   The program is criticized as a "cash cow" generating steady income for attorneys, municipalities, and non-profits like BSAS and its incorporators.

      THE PIVOT:
