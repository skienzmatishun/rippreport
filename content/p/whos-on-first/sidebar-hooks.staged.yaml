  investigating-the-investigators:
    brief: |-
      THE CONFLICT:
      Ray Hix secured a Ground Lease and Operating Agreement from the Fairhope Airport Authority on December 17, 2015, following a Notice of Request for Bids (RFP). Attorney Dennis R. Bailey requested an Advisory Opinion from the Alabama Ethics Commission on December 16, 2015. The Ethics Commission issued Advisory Opinion No. 2016-04 on February 3, 2016.

      THE DISCOVERY:
      Article 2 showed Hix was a board member for six months prior to the bid process, suggesting potential access to inside information. Article 2 also revealed inaccuracies in Hix's bid, including conflicting ownership claims and fuel estimates. Jack Burrell, a member of the bid committee, reduced Mid-Bay's fuel number by 15,000 gallons.

      THE PIVOT:
      Article 2 establishes Hix's prior insider status and bid irregularities, providing the motive/context for the ethical questions. Article 1 uses the documentation discrepancies (three different leases: Dec 17, Dec 21/Exhibit C, Exhibit B) and timing—the lease was executed (Dec 17, 2015) three months before the required Ethics Advisory Opinion (Feb 3, 2016)—to prove the Authority violated its own RFP terms and ethics compliance requirements.

      KEY ENTITIES:
      Ray Hix
      Jack Burrell
      Joe McEnerney (Airport Authority Chairman)
      Dennis R. Bailey
      Fairhope Airport Authority (FAA)
      Alabama Ethics Commission
      Cedar Creek Leasing LLC
      Dec 17, 2015
      Feb 3, 2016
      March 11, 2017
    llm_text: Ray Hix signed his Fairhope Airport Authority ground lease on Dec 17, 2015, while serving as a board member. The FAA violated its own RFP terms because the lease preceded the required Feb 3, 2016, Alabama Ethics Commission advisory opinion.
