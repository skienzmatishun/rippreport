  listening-not-reading:
    brief: |-
      THE CONFLICT: Ethics complaint against Jack Burrell and Ray Hix regarding Fairhope Airport Authority hanger property (1/12/11)
      THE DISCOVERY: The Ethics Commission mandated that public officials engaging in business with their entity must use a bid process, irrespective of specific bid laws
      THE PIVOT: Article 2 establishes the pre-existing ethical obligation to bid; Article 1 demonstrates the Authority ignored this obligation by executing the Ground Lease and Operating Agreement on Dec 17, 2015, before receiving the favorable Ethics Commission Advisory Opinion (Mar 3, 2016), and failing to adhere to the RFP bidding terms
      KEY ENTITIES: Jack Burrell, Ray Hix, Rick Kingrea, Karin Wilson, Dennis R. Bailey, Josh Myrick, Joe McEnerney, Pittman, Boone, Brown, Mayor Kant, Fairhope Airport Authority
    llm_text: Ethics officials found Jack Burrell and Ray Hix violated rules concerning the Fairhope Airport Authority hanger property. They executed the Ground Lease before getting the required Ethics Commission Advisory Opinion, bypassing the mandatory bid process.
