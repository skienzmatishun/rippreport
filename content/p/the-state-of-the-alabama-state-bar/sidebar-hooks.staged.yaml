      - Murray Lawrence Jr. (Wrongfully convicted individual)
      - Robert Wilters (Former Baldwin County Circuit Court Judge)
      - Hoss Mack (Executive Director, Alabama Sheriffs Association; former Baldwin County Sheriff)
      - Anthony Lowery (Appointed Baldwin County Sheriff)
