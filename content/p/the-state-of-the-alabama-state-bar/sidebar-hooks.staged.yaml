      THE CONFLICT:
      - In 2005, Murray Lawrence Jr. was wrongfully convicted in Baldwin County, Alabama, despite a lack of physical evidence (no DNA, fingerprints, or murder weapon), no Alabama-performed autopsy, and a death certificate listing strangulation rather than the prosecution's gunshot theory.
      - The prosecution led by District Attorney David Whetstone utilized an indictment that was not signed by the grand jury foreman and relied on coerced witness testimony.
      - Presiding Circuit Court Judge Robert Wilters allowed the trial to proceed despite forensic contradictions and the absence of an independent autopsy.
      - Hoss Mack (then Chief Deputy) and Anthony Lowery (then investigator) oversaw the investigation; the victim's body was sent to Mack's family-owned funeral home rather than an independent coroner.

      THE DISCOVERY:
      - Article 2 reveals that the officials responsible for the 2005 miscarriage of justice transitioned into high-ranking positions of authority rather than facing accountability.
      - Hoss Mack moved from Chief Deputy to Sheriff, and then to Executive Director of the Alabama Sheriffs Association.
      - Anthony Lowery moved from investigator to the appointed Sheriff of Baldwin County by Governor Kay Ivey.
      - The investigation shows a closed loop of power where the same individuals control criminal investigations, evidence storage, law enforcement policy, and election certification.

      THE PIVOT:
      - Article 2 serves as the structural "smoking gun" for Article 1 by demonstrating the historical pattern of systemic protectionism that defines the Alabama legal system.
      - While Article 1 details current failures of the Alabama State Bar to discipline bad actors (such as the 17 ethics violations ignored by former Executive Director Phillip McCallum), Article 2 provides the proof of how this culture of impunity was built.
      - It establishes that the "personalities who haunt the halls" of the Bar are part of an entrenched network of legal and law enforcement officials who use their positions to suppress evidence, ignore ethics complaints, and protect one another from accountability.

