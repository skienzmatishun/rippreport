  orange-beach-tyranny:
    brief: "THE CONFLICT:\n- In 2016, a Federal Drug Investigation targeted Mayor Tony Kennon's old friend and co-target, Danny Williams.\n- Danny Williams disappeared and died in Perdido Pass on the Friday of Memorial Day weekend (two years prior to the \"naked lady on the balcony\" incident involving a 911-calling Tiki Bar maid). \n- Orange Beach officials (including the City Attorney, City Administrator, and Chief of Police who answer to Mayor Tony Kennon) compartmentalized information to hide it from the media, citizens, bereaved family members, and the Orange Beach City Council.\n- A federal lawsuit was filed regarding the concealment of Orange Beach Police interactions with Mayor Kennon behind closed doors and the Tiki Bar maid witness.\n- In 2022, Harry Still filed 12 bar complaints against figures including Roman Shaw, Jeremy McIntyre, and Phillip McCallum.\n- Phillip McCallum (then Executive Director of the Alabama State Bar) had 17 ethics violations stemming from Katherine Church's ethics complaints completely absent from his disciplinary record.\n- Montgomery Attorney Thomas Gallion III (now of Destin, Florida) was subjected to a targeted targeting by the Alabama State Bar, resulting in a Florida lawsuit complaint detailing a kickback scheme with outside counsel and sexual blackmail.\n\nTHE DISCOVERY (Background/Context from Article 2):\n- Article 2 (Orange Beach Tyranny) exposed a pattern and practice of malfeasance and cover-ups by Orange Beach Mayor Tony Kennon and his administration regarding the uninvestigated death of Danny Williams.\n- It revealed how state agencies like the Alabama Law Enforcement Agency (ALEA) stonewalled investigations, ignored subpoenas, and how staff members like Phillip McCallum engaged in defensive stonewalling when approached by the Baldwin County Legislative Delegation and media (Murder Creek Media's Neeli Faulkner and Whitney Scapecchi, and The Alabama Gazette's Brandon Moseley).\n\nTHE PIVOT:\n- Article 2 serves as the smoking gun because it exposes Phillip McCallum and the exact network of corrupt local and state actors operating in Baldwin County and ALEA. \n- It directly ties the political/police corruption in Orange Beach under Mayor Tony Kennon to the institutional rot inside the Alabama State Bar, proving that figures like Phillip McCallum—who stonewalled the Danny Williams/ALEA inquiries—are the exact same bad actors shielding themselves from Harry Still's 2022 bar complaints, Katherine Church's ethics violations, and the persecution of attorney Tommy Gallion.\n\nKEY ENTITIES:\n- Mayor Tony Kennon\n- Danny Williams\n- Phillip McCallum\n- Harry Still\n- Thomas Gallion III (Tommy Gallion)\n- Neeli Faulkner\n- Whitney Scapecchi\n- Brandon Moseley\n- Jeanetta Pleasant JD\n- Katherine Church\n- Beverly Barber JD\n- Roman Shaw\n- Jeremy McIntyre\n- Steve Flowers\n- Francis \"Paul\" Ripp (The Ripp Report)"
