  elected-or-selected:
    brief: |-
      THE CONFLICT: Former Mayor Jim Nix was forced out of office for alleged criminal activity; he selected Tim Kant to replace him; Kant was hired in 1983 as city's first horticulturist and became Mayor in 2000.
      THE DISCOVERY: Mayor Kant was SELECTED by former Mayor Jim Nix, who needed a controllable replacement; Kant held multiple roles (paid Mayor and pad utility director); Arthor Corte is identified as a Jim Nix fan and a "good ole boy."
      THE PIVOT: Article 2 establishes that Mayor Kant's power and reliance on figures like Arthor Corte stems directly from his selection by Nix, providing the historical context for the "good ole boys" influence and micromanagement criticized in Article 1 (e.g., the Fly Creek Apartments deal).
      KEY ENTITIES: Tim Kant, Karen Wilson, Jim Nix, Arthur Corte, Sherry Sullivan, Mike Ford, Fairhope, Jack Burrell, Jay Robinson, Murray Lawrence, Robert Brown, Gary Gover.
    llm_text: Former Mayor Jim Nix handpicked Tim Kant—the city's first horticulturist—to replace him. This strategic selection built the "good ole boy" power structure, linking Kant’s influence directly to figures like Arthur Corte.
