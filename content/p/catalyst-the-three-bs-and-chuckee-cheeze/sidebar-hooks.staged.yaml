      THE DISCOVERY: Mayor Karin Wilson (elected 2016) established strict enforcement, hiring Richard Peterson (Operations Director) to halt the routine granting of low-pressure system waivers, requiring gravity sewer systems.
      THE PIVOT: Article 2 provides concrete, historical evidence of the "good ole boys" political cancer (the lax standards and dual roles) that Catalyst (Article 1) now criticizes as the entrenched system used by figures like Kevin Boone and Jack Burrell to place candidates and secure deals (e.g., Mega-Site).
