      1. 2016 State Senate District 32 runoff in Baldwin County between Chris Elliott (Baldwin County Commissioner) and David Northcutt.
      2. Elliott faced allegations of supporting tax increases and using position to secure a reduced 45-day DUI suspension (instead of 90 days).
      3. Elliott skimmed $4 million from the school 1% tax over one year with Superintendent Eddie Tyler.

      THE DISCOVERY:
      1. Article 2 established a history of Chris Elliott seeking special treatment and handling legal and financial issues dishonestly prior to his election as State Senator.

      THE PIVOT:
      1. Article 1 details the newly elected State Senator Chris Elliott co-sponsoring a bill to award himself $7,500 per year in travel expenses to attend the Paris Air Show, demonstrating a continuation of leveraging political power for personal financial gain, mirroring his past actions.

      KEY ENTITIES:
      1. Chris Elliott (State Senator, Baldwin County Commissioner)
      2. David Northcutt
      3. Eddie Tyler (Baldwin County Schools Superintendent)
      4. Jon Gray (Elliott's political handler)
      5. Mayor Kennon
