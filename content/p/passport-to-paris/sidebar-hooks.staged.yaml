      THE CONFLICT:
      *   A couple of years ago, Fairhope City Council (including Councilman Boone and Burrell) executed a Conservation Easement involving city wetlands without public input.
      *   This action favored developer Arthur Corte over the community.

      THE DISCOVERY:
      *   The Fairhope City Council exhibited political corruption by making land transfers without citizen vote and consistently favoring developers (Arthur Corte).

      THE PIVOT:
      *   Article 2 establishes Councilman Burrell’s history of closed-door, developer-favoring deals in Fairhope.
      *   Article 1 links State Senator Chris Elliott (a newly elected official) to Councilman Burrell, suggesting a continuation of self-serving, closed-door political behavior, exemplified by Elliott co-sponsoring a bill for $7,500/year in travel expenses to the Paris Air Show.

      KEY ENTITIES:
      *   Chris Elliott (State Senator, "TAX MAN")
      *   Fairhope City Councilman Burrell
      *   Councilman Boone
      *   Arthur Corte (Developer)
      *   Baldwin County
      *   $7,500 (Annual travel expenses)
      *   Paris Air Show
      *   Fairhope (Municipality)
    llm_text: Fairhope City Councilmen Boone and Burrell pushed developer Arthur Corte through closed-door wetland deals without public input. State Senator Chris Elliott, linked to Burrell, now sponsors $7,500 in annual travel to the Paris Air Show—is this political corruption?
