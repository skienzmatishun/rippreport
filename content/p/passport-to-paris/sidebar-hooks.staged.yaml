  in-your-face:
    brief: |-
      THE CONFLICT:
      *   Robert Brown, Fairhope City Councilman, secured a contract with the Eastern Shore Art Center despite a clear warning from the State of Alabama Ethics Commission (Feb. 26, 2018) not to use his office for personal or family benefit.
      *   This contract involved funds from the Eastern Shore Art Center, which previously received $50,000 from the Baldwin County legislative delegation.

      THE DISCOVERY:
      *   The State of Alabama Ethics Commission advised Mr. Brown he could not use his office to create benefits for himself or associated businesses.
      *   Mr. Brown was partnered with Cliff Pittman of Pittman Brown Development Co., who was a director of Single Tax Corp. and approved the Art Center funds.

      THE PIVOT:
      *   Article 2 establishes a pattern of elected officials (e.g., Robert Brown) ignoring Ethics Commission advice and using public funds (Eastern Shore Art Center) for perceived self-interest or factional gain (Pittman Brown).
      *   Article 1 shows State Senator Chris Elliott, aka TAX MAN, securing $7,500 per year in travel expenses (for the Paris Air Show) by co-sponsoring a bill that reallocated funding traditionally awarded to the Baldwin County legislative delegation, mirroring the misuse of public funds seen in Article 2.

      KEY ENTITIES:
      *   Chris Elliott (State Senator, TAX MAN)
      *   Robert Brown (Fairhope City Councilman)
      *   Jack Burrell (Fairhope City Councilman)
      *   Eastern Shore Art Center
      *   Cliff Pittman (Pittman Brown Development Co.)
