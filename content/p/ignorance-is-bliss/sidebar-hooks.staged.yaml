      *   The Fairhope City Council (identified as Catalyst) used legal research to cancel the Oct. special election.
      *   The referendum vote on Nov. 6th resulted in a NO vote of 3887 and a 38% turnout (6649 total votes).
      *   Councilman Kevin Boone teamed up with Joe Faust and the Can’t core group to influence the election.
      *   In 2016, Mayor Kant received 3066 votes.

      THE DISCOVERY:
      *   The Catalyst/Can’t doctrine has a core group of approximately 3500 voters in Fairhope.
      *   This core group is not growing with new residents and is expected to be overwhelmed by new voters in the coming years (e.g., 2020).
      *   The Catalyst council has historically operated as a body of indecision and obstruction, failing to deliver budgets.

      THE PIVOT:
      *   The 2016 events establish the long-standing pattern of obstruction and control by Catalyst/Can't over Fairhope local government.
      *   Article 1 shows that individuals (Gary Thorson, Bill Pennington) were recruited by Catalyst/Can’t backers for a *recent* no-vote referendum, proving the historical political structure identified in Article 2 remains active and influential.

