  fairhope-catalyst-a-dirty-little-secret:
    brief: |-
      THE CONFLICT:
      *   October 2, 2018, referendum election in Fairhope regarding change from "At Large" Council to District/Council-Manager form of government.
      *   The Catalyst City Council, hand-picked by former Mayor Tim Kant, opposed the referendum.
      *   The Council attempted to subvert the election by calling a Special Meeting to hire a law firm for a Temporary Restraining Order (TRO) to cancel the October 2, 2018, election.
      *   Karin Wilson defeated the Catalyst slate in the election.

      THE DISCOVERY:
      *   The Catalyst Council actively sought to prevent the October 2, 2018, referendum, despite Fresh Start Fairhope distributing an Urgent Message on September 19, 2018, indicating the referendum was likely to win.
      *   Councilman Jay Robinson and Council President Jack Burrell exhibited negligence by failing to seek legal advice from the Attorney General prior to the election.

      THE PIVOT:
      *   Article 2 establishes that the Catalyst Council has a documented, historical pattern (2018) of using political control and procedural manipulation to suppress democratic change in Fairhope.
      *   This history validates the suspicion in Article 1 that the recent "no vote" in the referendum election was influenced by the same established, shadow interests (Can’t loyalists/political PACs) that controlled the city during the 2018 attempt to block reform.

