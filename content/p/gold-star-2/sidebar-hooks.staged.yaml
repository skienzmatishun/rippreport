    llm_text: Council President Jack Burrell allegedly controlled Fairhope Airport Authority hiring since November 2016, guaranteeing spots before bids. This pattern of unchecked power risks obstructing the $1.88 million needed to fix Fairhope's 5000+ students in five schools.
