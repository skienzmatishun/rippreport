  captain-jack:
    brief: |-
      THE CONFLICT:
      *   Late 2016 (specifically Nov 2016): Infamous lease issues were subject to a series of Ripp Report articles regarding the Fairhope Airport Authority.
      *   January 8th: Fairhope Airport Authority held a special meeting to discuss a "notice of availability" revisiting failed processes from late 2016 (leases, bidding procedures, fuel farms).
      *   Over 7 years: Council President Jack Burrell dominated the position.
      *   Past actions: Burrell allegedly influenced City Attorney and Municipal Judge appointments.

      THE DISCOVERY:
      *   Article 2 revealed Council President Jack Burrell (City liaison on the Airport Authority board) exerted personal control over Airport Authority operations and hiring (e.g., guaranteeing certain "chosen ones" hangar locations prior to any bid process).
      *   Burrell’s control extended beyond the airport, influencing key municipal appointments.

      THE PIVOT:
      *   Article 2 demonstrates a historical pattern of unchecked personal power and self-interest by Jack Burrell within municipal and airport governance.
      *   This historical control context (Article 2) is critical because Article 1 highlights urgent systemic failures in Fairhope (swelling class sizes, 5000+ students in five schools, need for $1.88 million funding) requiring unified action from the County Commission and 14 municipalities, which Burrell’s dominance (Article 2) potentially obstructs.

