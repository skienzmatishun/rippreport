      - Widget article: Council LOST the lawsuit.
      - Widget article: Bike trail on 11.25 million dollar property sounds as ridiculous as first suggestion of archery range, which failed and never was endorsed by citizens.
      - Widget article: Council set to spend 10,000 dollars for a feasibility study, not in budget, for a bike trail.
      - Widget article: Council will use feasibility studies to promote plans except when plan does not conform to their liking.
      - Widget article: Current Fairhope Council composed of Catalyst loyalists who often do not listen to advise of committees but prefer to lend ear to Catalyst plans for re-election.
      - Widget article: Council President Burrell and Councilman Boone get full credit for pulling the wool over voters’ eyes when it comes to Triangle settlement.
      - Widget article: Council and city attorney worked in concert to obstruct Mayor, committees, or anyone else not sharing agenda; lack of communication with Mayor is by design and costing city valuable resources.
      - Widget article: Council subject dear to all hearts—education and schools—will be focus; predicts Council will again elect to shelter themselves from any decision and relegate that responsibility to anyone other than themselves.
      - Widget article: Council cares about one thing and one thing only, returning to the good ole days of Can’t.

