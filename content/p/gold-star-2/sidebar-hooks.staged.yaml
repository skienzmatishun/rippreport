      - Main article: County Commission and 14 municipalities of Baldwin County need to get on same page about Sewers, Zoning, Traffic and Schools, ASAP.
      - Main article: Fairhope education issue stands out; class size swelling; teachers working as fundraisers for “FOR SCHOOL SUPPLIES”; portables necessity; over 5,000 students in five Fairhope Schools, figure growing every month.
      - Main article: Principals, teachers, parents and constituents should demand council hold at least two public forums for public participation before any decision is made.
      - Main article: Council decision on school funding is their responsibility; funding issue important; would make significant difference in all five schools.

