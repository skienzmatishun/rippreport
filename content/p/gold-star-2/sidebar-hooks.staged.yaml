  pedaling-forward:
    brief: |-
      THE CONFLICT: County Commissioner Chris Elliott and School Superintendent Eddie Tyler skimmed $200,000 annually from the school tax for County infrastructure during the penny tax period.
      THE DISCOVERY: The Fairhope Education Advisory Committee (FEAC) proposed a 3-mill property tax in the Fairhope school feeder district to raise an estimated 1.88 million. The Mayor suggested using 10% of sales tax (estimated $800,000 to $1 million annually) first.
      THE PIVOT: Article 2 provides the historical precedent of past school fund misuse by County officials (Elliott/Tyler), framing the current City Council decision in Article 1—whether to use a tax or the Mayor’s plan to secure 1.88 million—as a necessary preventative action against past corruption and to address critical school needs (5000+ students).
      KEY ENTITIES: Fairhope City Council, Baldwin County, Mayor, Jack Burrell, Chris Elliott, Eddie Tyler, FEAC, 1.88 million, 3-mill property tax, *CATALYST*
    llm_text: Chris Elliott and Eddie Tyler previously skimmed $200,000 annually from school tax. Now, the Fairhope City Council must decide if a 3-mill property tax or Mayor Burrell's sales tax plan secures $1.88 million for 5000+ students, preventing past corruption.
