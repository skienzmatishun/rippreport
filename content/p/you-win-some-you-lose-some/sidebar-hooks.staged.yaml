  yes:
    brief: |-
      THE CONFLICT:
      *   Fresh Start Fairhope sought a change to the Council-Manager form of government in Fairhope.
      *   The Fairhope City Council, an at large council, opposed the change, which was proposed for a special election on October 2nd.
      *   The Council instructed the city attorney to cancel the October special election.
      *   The referendum date was revised to November 6th (2018).
      *   In the 2016 election, Mayor Kant received 3066 votes, while the NO vote in the special election (Nov 6th) received 3887 votes.
      *   The State Representative House District 92 race involved Joe Faust and Danielle Mashburn-Myrick.
      *   Councilman Kevin Boone and his son Scott were involved in the Catalyst core group.

      THE DISCOVERY:
      *   Article 2 (2018 context) promoted the Council-Manager form of government as a solution to corruption, transparency, and inefficiency.
      *   Article 2 advocated for a "YES" vote on November 6, 2018, to implement the new structure (five Council members: Mayor elected at large, one Council member elected at large, three members elected by single districts).

      THE PIVOT:
      *   Article 2 establishes the specific, date-bound proposal (Nov 6, 2018) for the Council-Manager system that Fresh Start sought.
      *   Article 1 details the deliberate political action by the Fairhope City Council and Catalyst to cancel the original special election and spread misinformation, effectively preventing the outcome presented in Article 2.
      *   Article 1 confirms the Council's obstruction and indecision, despite the clear guidelines for a change of government.

