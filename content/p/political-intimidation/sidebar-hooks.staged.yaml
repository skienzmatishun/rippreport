  dear-congressman-bradley-byrne:
    brief: |-
      THE CONFLICT:
      *   Senator Pittman (trustee of BP funds for Baldwin County) and Mayor Kant siphoned $636,000 of BP money for a contract for Sen. Pittman.
      *   This fraud resulted in an FBI investigation and a referral to the Alabama Attorney General, White Collar Crime Division.
      *   A settled triangle lawsuit in Fairhope cost taxpayers $11.25 million, which the Mayor (Kant) settled without public notification.
      *   The damage to Fly Creek was caused by the Publix project development, not "historic flooding," as previously claimed.
      *   The proposed Fly Creek Apartments, despite 95% opposition, were approved after Mayor Kant and Arthur Corte "FIXED" the planning and zoning board outcome.

      THE DISCOVERY:
      *   Article 2 revealed that the Fly Creek damage was incontrovertibly linked to the Publix project development and not natural flooding.
      *   Article 2 provided specific financial evidence of the BP fraud, detailing the $636,000 payment to Sen. Pittman.
      *   Article 2 identified Arthur Corte and Mayor Kant as the responsible parties for the Fly Creek damage and subsequent collusion.

      THE PIVOT:
      *   Article 2 establishes a documented pattern of high-level, federally-investigated financial corruption (BP fraud) and municipal financial malfeasance ($11.25M lawsuit).
      *   This history provides context for Article 1’s allegations of current local corruption, such as Mayor Kant raising over $50,000 from outside donors and rigging local elections, showing a systemic "good ole boy" network.

