      State of Alabama approved the medical cannabis bill (Compassion Act) on May 17, 2021.
      The implementation of the Compassion Act has resulted in a legal morass and litigation over the last 2.5 years.
      The Alabama Board of Medical Examiners has not issued the first patient certification license as of 2025.

      THE DISCOVERY:
      Older reports detail systemic political dysfunction in Alabama, including Governor Kay Ivey firing Admiral Kent Davis and exposing "good old boy" systems in Clarke County where a hospice business had ties to a judge.

      THE PIVOT:
