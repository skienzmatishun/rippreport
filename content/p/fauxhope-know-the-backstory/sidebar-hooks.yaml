      - The "Pretty Flowers Rotten Roots" framing (polling vote box, rotting roots
      next to daisy) symbolically encodes the thesis that superficial electoral unity
      masks corruption and development-driven damage — directly supporting Article
      1’s infrastructure critique.


      KEY ENTITIES:

      - Tim Kant (former Fairhope Mayor)

      - Karen Wilson (previous Mayor)

      - Sherry Sullivan (current Mayor; head of utilities; second paycheck recipient)

      - Jack Burrell (councilman; developer contact; "Captain Jack")

      - Angelo Corte (entitled developer, referenced in Article 1 context)

