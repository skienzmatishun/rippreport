  fairhope-infrastructure:
    brief: 'THE CONFLICT:

      *   **Publix Parking Lot/Shopping Center (Parker Road):** Construction began
      in the early 2000s. Developer Angelo Corte and former Mayor Tim Kant are identified
      as key proponents. The construction allegedly dumped tons of red soil into Fly
      Creek, causing erosion and habitat loss.

      *   **Fly Creek PUD Apartments (c. 2014–2016):** Angelo Corte (via Leaf River
      Group) proposed a large multi-unit housing complex within the existing Fairhope
      PUD at the intersection of Park Road/Fly Creek Avenue. Former Mayor Tim Kant
      (serving from 2008 to 2016, re-elected in September 2012) and his council members
      Jack Burrell and Kevin Boone approved Ordinance 1572 in April 2016 over strong
      public resistance and despite environmental concerns regarding drainage, wetlands,
      and proximity to Fly Creek.

      *   **Civil Litigation (Sept 2016):** "Friends of Fly Creek" (led by Adam Milam)
      sued the City, Planning Commission, Angelo Corte, and Leaf River Group in federal
      court over the apartment project''s legality and environmental impact. On August
      24, 2017, a Bay Minette jury ruled the ordinance amendment valid; the city won
      this lawsuit.

      *   **Culvert Failures:** Emergency "long-term temporary" repairs were made
      to the Fly Creek culvert under US 98 in September 2022 due to erosion and soil
      dumping related to prior development. The culvert issue resurfaced with persistent
      water intrusion into City Council chambers and ongoing maintenance failures.

      *   **Political Shift:** In August 2016, Karin Wilson defeated Tim Kant for
      Fairhope mayor. Wilson claimed the "Catalyst-Kant-Corte" alliance had prioritized
      developer interests over public safety and infrastructure.


      THE DISCOVERY:

      *   **68 Ventures vs. City of Fairhope (Oct 2022–Present):** 68 Ventures (CEO
      Nathan Cox) filed a federal lawsuit against the City of Fairhope and its Planning
      Commission, alleging denial of due process and equal protection after being
      denied applications for "Skyline Village" and "The Gables at Lawrence." The
      city counter-claimed 68V hired paid informants to record commissioners illegally.

      *   **Park City / Village Park Project (2024–2025):** Despite the ongoing litigation,
      68 Ventures acquired a large undeveloped property in Fairhope previously owned
      by Hix Snedeker Companies and its associates, including an already-approved
      Planned Unit Development (PUD). The project, named "Park City" or "Village Park,"
      is zoned for ~700 units along Highway 181/Fairhope Avenue.

      *   **Investor Disclosure:** U.S. Senator Katie Britt (R-AL) disclosed a $33,000
      stock investment in 68V’s 181-Fairhope Ave 2023, LLC on Dec 14, 2023. The project
      was presented as a "walkable, mixed-use village."


      THE PIVOT:

      *   **Developer Continuity:** Article 2 confirms that the same developer group
      (68 Ventures) involved in the current infrastructure and litigation disputes
      is actively buying up land with pre-approve'
