  BACKPEDALING-FAUXHOPE:
    brief: 'THE CONFLICT:

      - Fly Creek culverts failed in 2023 under U.S. Route 98; emergency repairs were
      completed.

      - Culvert damage traces back to the Publix development on Parker Road, where
      construction began before current projects and ignored wetlands, drainage, tree
      surveys, county right-of-way issues, city easements, and sewer line problems.

      - Angelo Corte, an "entitled developer" supported by Catalyst, built apartments
      on the same problematic site despite public outcry; former Mayor Tim Kant first
      proposed re-establishing Fly Creek biological and hydraulic connectivity in
      2014 but allowed development anyway.

      - The city council voted to apply again for a $20 million federal BUILD grant
      (Better Utilizing Investments to Leverage Development) to replace failed box-culverts
      under U.S. 98 with a bridge; applications in 2024 and 2025 were not successful.

      - Dredging of the Fairhope Marina''s main Fly Creek boat channel was needed
      every five years to maintain proper depth; the city selected M & N of Alabama
      LLC to perform dredging, with the city and Fairhope Yacht Club sharing costs
      for the main channel and the city covering costs for the upper creek channel.

      - The marina received "Clean and Resilient Marina" status.

      - Jack Burrell claimed mud was coming from the bay and going up the creek; the
      Ripp Report asserts the dredging is due to development on Fly Creek (Publix,
      apartments, ongoing expansion) and that the mud in the marina matches the DNA
      profile of Publix construction.

      - The same Fly Creek has the highest bacteria count on Highway 98 near Publix
      and at Scenic 98; Baykeeper reports a red symbol indicating high bacteria levels
      exceeding 104 MPN/100ml (exceeding 235 MPN for Bohemian Park, Fly Creek at Highway
      98, and Fly Creek at Scenic 98).

      - Former Mayor Tim Kant and his subordinates are blamed for allowing the unwanted
      Publix development that benefited only profit-seeking parties.

      - Citizens elected former Mayor Wilson, who was addressing infrastructure issues
      ignored by the current council; Wilson obtained over $10 million in infrastructure
      grants during his term.


      THE DISCOVERY:

      - The Fauxhope City Council denied public participation at meetings, forcing
      Francis Paul Ripp to take it to federal court (United States District Court
      for the Southern District of Alabama).

      - Jack Burrell publicly stated he was "a little surprised" that a public-participation
      item was on the agenda and claimed he was "adamantly opposed to changing it,"
      yet he reportedly had to go to federal court over denying public participation.

      - The City of Fairhope''s $6.2 million waterfront project became a political
      hot potato; politicians are now trying to spin a new narrative; the mayor and
      council are four years behind schedule on completing granted funds, with design
      work never utilized.

      - In the midst of the Fairhope budget process, Councilmen Boone Burrell and
      Brown proposed a $2.65 million purchase supported by a questionable appraisal
      for recreation land that will not be used for years; this is described as "an
      absolute scam" similar to soccer fields.

      - The Triangle was a "legal settlement" of $8.25 million, not a purchase, following
      $3 million in law fees guaranteed by Attorney Cain O''Neal who represented the
      city and promised legal fee refunds in litigation that never materialized.

      - Failed or incomplete projects total approximately $27 million, leaving Fauxhope
      infrastructure 20 years behind.


      THE PIVOT:

      - Article 2 (Widget) is the "smoking gun" for Article 1 (Main) because it exposes
      systemic council dysfunction and financial mismanagement that directly enabled
