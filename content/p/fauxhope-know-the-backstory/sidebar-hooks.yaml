      - Election date: August 26, 2025.

      - The Ripp Report endorses the new council slate; "the incumbents need to go."

      - Jack Burrell is labeled the worst city councilman, described as a "classic
      bully" whose treatment of the former mayor "checked all the boxes" of bullying.

      - Burrell is characterized as a long-overdue incumbent, the council contact
