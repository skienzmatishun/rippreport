  backpedaling-fauxhope:
    brief: |-
      THE CONFLICT:
      *   City of Fairhope waterfront project ($6.2 million) became a political issue.
      *   Soccer fields project started at $3.5 million, approaching $6 million, cited as sub-standard construction (no trees, no shade, poor drainage).
      *   Legal settlement regarding The Triangle was $8.25 million, plus $3 million in law fees (total $11.25 million, reported as $11.2 million).
      *   Former Mayor Kant first proposed re-establishing creek biological/hydraulic connectivity in 2014.
      *   Culvert damage relates to the Publix project and apartment construction, brought to city attention during and after construction.
      *   2023 culvert failure led to emergency repairs and a $20 million federal BUILD grant application (2024/2025 unsuccessful).

      THE DISCOVERY:
      *   The older Widget Article demonstrates a pattern of financial mismanagement and failed infrastructure projects (waterfront, soccer fields, Triangle settlement) totaling at least $27 million.
      *   The council attempted to eliminate public participation in meetings, leading to a federal lawsuit (FRANCIS PAUL RIPP, Plaintiff, v. JACK BURRELL, etc., Defendant) in the UNITED STATES DISTRICT COURT FOR THE SOUTHERN DISTRICT OF ALABAMA SOUTHERN, involving a $6 million claim.
      *   The council members and appointed positions (municipal judge, municipal attorney) have not been elected/appointed for their 5th year.

      THE PIVOT:
      *   The current culvert failure and subsequent developer green flags (Article 1) are not isolated incidents but part of a recurring pattern where the City Council (aided by Catalyst, Mayor Kant, and developers like Angelo Corte) prioritizes developer profit over public infrastructure, environmental health (high bacteria count on Hwy 98), and community needs, as evidenced by past financial waste and suppression of public dissent (Article 2).
      *   The ongoing dredging in Fly Creek is directly due to past and current development (Publix, apartments, ongoing expansion) and not just routine maintenance.

