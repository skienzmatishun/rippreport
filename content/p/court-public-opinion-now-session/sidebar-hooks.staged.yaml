  fairhope-citizens-citizens-citizens:
    brief: |-
      THE CONFLICT: Jack Burrell (City Council President/Airport Authority Board member) resisted Mayor Karin Wilson's request to transfer ownership of the 258-acre Airport Authority property (purchased in 2007 for $8.85 million) to the City of Fairhope to pay down the 21% debt.
      THE CONFLICT: The Airport Authority received $500,000 annually for 6 years while paying little principal on the $8 million debt.
      THE DISCOVERY: Article 2 (Jan. 9th) established that Mayor Wilson urged the council to take ownership of the property to address the debt.
      THE PIVOT: Article 2 showed Burrell publicly undermining Mayor Wilson's effort to serve the citizens, providing context for the later allegations (Article 1) that he used his position (Board member/Ad hoc committee) to facilitate a grossly flawed and rigged RFP process benefiting private interests (Hix/Snedeker/Mid-Bay Air LLC) rather than the city.
      KEY ENTITIES: Karin Wilson (Mayor), Jack Burrell (City Council President/Airport Authority Board member), Fairhope Airport Authority, Mid-Bay Air LLC (Hix/Snedeker), Terry Chapman, Kel Jones, Dec. 17th 2015 (Lease execution), Feb. 3 2016 (Ethics Advisory Opinion), Jan. 9th (Article 2 context), Jan. 25th 2017 (Article 1 date).
    llm_text: Jack Burrell blocked Mayor Karin Wilson's plan to transfer the 258-acre property to pay debt. Did Burrell use his position to rig the RFP process, benefiting Mid-Bay Air LLC instead of Fairhope citizens?
