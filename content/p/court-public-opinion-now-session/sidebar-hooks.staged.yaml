  hi-jack-ed:
    brief: |-
      THE CONFLICT:
      *   The Fairhope Airport Authority accrued an $8 million debt.
      *   The Authority received $500,000 annually for 6 years, paying little on principal.
      *   The lease in question was signed on Dec. 17th, 2015, before the Ethics Commission Advisory Opinion was rendered on Feb. 3, 2016.
      *   The City of Fairhope has the option, exercisable if principal was not paid by 2012, to take back 258 acres for $10.00.

      THE DISCOVERY:
      *   The Airport Authority operated as a "black hole for information," shielded from public scrutiny by Mr. Jack Burrell.
      *   The $500,000 annual appropriation to the Authority was nearly $200,000 more than the education contribution.
      *   Mr. Burrell was a remnant of the previous, failed administration and was linked to the previous Mayor.

      THE PIVOT:
      *   Article 2 establishes the historical pattern of unchecked financial appropriation ($500k/year) and systemic lack of transparency under Burrell's influence, framing the 2015/2016 RFP bid rigging allegations (Article 1) not as isolated incidents, but as part of a long-standing failure of accountability.
      *   Article 2 proves Burrell’s opposition to Mayor Wilson’s interests is tied to protecting the Authority's entrenched financial structure, undermining his current claims of serving the citizens.

