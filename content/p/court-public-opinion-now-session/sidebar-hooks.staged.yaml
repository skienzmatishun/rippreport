  boone-doggle:
    brief: |-
      THE CONFLICT:
      *   Kevin Boone (Councilman) engaged in multiple conflicts of interest by voting on council resolutions involving hundreds of thousands of dollars in favor of engineering companies connected to his LLCs.
      *   Kevin Boone was criticized for failing to disclose these conflicts and for networking with "good ole boys," mirroring past Councilman Ford.

      THE DISCOVERY:
      *   The Main Article details a flawed and gerrymandered RFP process for a Fairhope Airport hangar lease, executed on Dec. 17, 2015, prior to the Ethics Commission Advisory Opinion (Feb. 3, 2016).
      *   The RFP process involved Council President Jack Burrell (who controlled the agenda) and implicated Hix/Snedeker (Mid-Bay Air LLC) as the winner, raising allegations of bid rigging and collusion among Airport Authority Board members.

      THE PIVOT:
      *   The older article establishing Kevin Boone's pattern of undeclared financial conflicts of interest provides historical context supporting the broader claim in the newer article that elected officials (including those involved in the Airport Authority process) use LLCs and personal connections for municipal gain, lending credence to the allegations against Burrell and the Authority.

