  investigative-reporting-business-entity-records:
    brief: |-
      THE CONFLICT: Improper bidding/bid rigging allegations concerning the Fairhope Airport Authority property (8 million dollar debt, $310,000 annual tax appropriation). Key events include the lease execution on Dec. 17, 2015, which preceded the Ethics Commission Advisory Opinion rendered on Feb. 3, 2016. Key participants include City Council President Jack Burrell (also Authority Board Member) and Hix/Snedeker aircraft (Mid-Bay Air LLC), the winning bidder.

      THE DISCOVERY: North Ridge, LLC was formed on June 2, 2008, in Baldwin County, Alabama, a domestic limited liability company whose members included John G Avent and Kevin Boone.

      THE PIVOT: Article 2 provides historical corporate structure data (2008 formation) identifying specific individuals (John G Avent and Kevin Boone) who operate within the Baldwin County business context, providing a background link to the local development and LLC structure alleged to facilitate corruption in the 2015-2017 Fairhope Airport Authority bid process detailed in Article 1.

