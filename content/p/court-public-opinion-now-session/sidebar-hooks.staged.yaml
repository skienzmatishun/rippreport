      *   Fly Creek Apartments (Retreat at Fairhope)
      *   Ordinance 1572
      *   Robert Brown
      *   Jimmy Conyers
      *   Jay Robinson
      *   Karin Wilson
    llm_text: Kevin Boone voted for the Fly Creek Apartments project in 2016 despite his undisclosed ties to John Avent of Preble-Rish. This pattern mirrors Jack Burrell's control of a flawed Fairhope Airport RFP, showing officials prioritized private business over Fairhope's needs.
