  conflict-of-interest:
    brief: |-
      THE CONFLICT:
      *   December 17, 2015: Lease signed for Fairhope Airport property.
      *   February 3, 2016: Ethics Commission Advisory Opinion rendered regarding the RFP process.
      *   September 2016: Councilman Kevin Boone voted on the Fly Creek Apartments (Retreat at Fairhope) issue (SD 16.14).
      *   Ongoing: Jack Burrell, City Council President, served on the Airport Authority board and ad hoc committee that reviewed the RFP.
      *   Ongoing: Kevin Boone voted for four and a half years on Preble-Rish projects (e.g., Firefly) despite undisclosed business connections with John Avent (Dewberry Preble-Rish, LLC).

      THE DISCOVERY:
      *   Article 2 revealed Kevin Boone's long-standing and undisclosed conflict of interest with John Avent of Dewberry Preble-Rish, LLC.
      *   Article 2 documented Boone's vote favoring the Fly Creek Apartments project in September 2016, while Avent represented Preble-Rish at the meeting.

      THE PIVOT:
      *   Article 2 establishes a pattern of elected officials (Boone) failing to recuse themselves from decisions involving private business interests (Preble-Rish).
      *   This pattern mirrors the conflicts documented in Article 1, where Jack Burrell, as Council President and Airport Authority Board member, controlled the agenda and aided a "grossly flawed and gerrymandered" RFP process regarding the $8 million Fairhope Airport debt and $310,000 annual appropriation.
      *   Both articles question Burrell's and Boone's ethical conduct in prioritizing private business over Fairhope's interests (e.g., Fly Creek, Airport Authority debt).

      KEY ENTITIES:
      *   Jack Burrell (City Council President)
      *   Kevin Boone (Councilman)
      *   John Avent (Dewberry Preble-Rish, LLC)
      *   Fairhope Airport Authority
      *   City of Fairhope
