  conflict-of-interest:
    brief: |-
      THE CONFLICT: Councilman Kevin Boone had undisclosed business connections through LLCs with John Avent of Preble-Rish, LLC, dating prior to him serving on the Fairhope City Council. Boone voted in favor of the "Retreat at Fairhope" / "Fly Creek Apartments" project on Sept 2016 (SD 16.14).

      THE DISCOVERY: Article 2 revealed Boone voted for the Fly Creek Apartments project despite a glaring conflict of interest with Preble-Rish, a conflict he never disclosed or recused himself from.

      THE PIVOT: Article 2 demonstrates that Boone, an elected official, voted in favor of Ordinance 1572 (Fly Creek) against the citizens' mandate, providing the context for the 2/16/2017 town hall demand for the repeal of that ordinance.

      KEY ENTITIES: Kevin Boone, John Avent, Preble-Rish, Fly Creek Apartments, Ordinance 1572, Robinson, Conners, Brown, Fairhope City Council, Fairhope Airport, 2/16/2017, Sept 2016
    llm_text: Councilman Kevin Boone hid undisclosed business ties with John Avent of Preble-Rish. He voted for the Fly Creek Apartments project (Ordinance 1572) in 2016, defying citizens' wishes and sparking demands for repeal.
