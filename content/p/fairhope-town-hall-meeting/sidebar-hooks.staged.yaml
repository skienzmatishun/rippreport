  double-down-and-i-call:
    brief: |-
      THE CONFLICT:
      *   December 21, 2016: Mayor of Fairhope filed an Ethics Complaint regarding Fairhope Airport Authority (FAA) actions concerning past airplane hangar leases.
      *   The FAA board members were alleged to be bidding on FAA bid proposals (Advisory Opinion 2016-4).
      *   Jack Burrell, Fairhope City Council President and FAA Board Member, was part of a two-man ad hoc committee selecting lease bids.
      *   Burrell's partner was the municipal judge for Fairhope.

      THE DISCOVERY:
      *   The past allegations of ethical misconduct involving FAA board members and Jack Burrell provide the context for the current resistance to city transparency and financial accountability.

      THE PIVOT:
      *   The 2016 Ethics Complaint and subsequent appeal to the Alabama Attorney General established a history of questionable FAA conduct by Burrell and his associates, directly linking his current political resistance (refusing to put ordinance 1572 on the agenda) and support for FAA land control/mortgage demands to past ethical concerns.

      KEY ENTITIES:
      *   Jack Burrell
      *   Fairhope Airport Authority (FAA)
      *   Ordinance 1572 (Fly Creek Apartments)
      *   Fairhope City Council
      *   Matt Hart (Alabama Attorney General Special Prosecutor)
      *   Jody W. Bishop (28th Judicial Circuit Honorable)
      *   Alabama Ethics Commission
    llm_text: Jack Burrell faced a 2016 ethics complaint concerning FAA hangar leases, involving his partner Jody W. Bishop. How does that history of questionable FAA conduct explain his current resistance to Ordinance 1572 and his demands for FAA land control?
