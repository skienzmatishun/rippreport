hooks:
  jack-box-airport:
    brief: |-
      THE CONFLICT:
      *   Complaint regarding Fairhope Airport Authority (FAA) was filed against board members Jack Burrell and Ray Hix.
      *   Ray Hix served as Sec. Treasurer for the Authority.
      *   An inquiry regarding FAA was made by a Fairhope resident to Ethics Commission Chief Council Mr. Hugh Evens.
      *   Mr. Evens blind copied Mr. Bailey, who was Mr. Hix's attorney.
      *   The FAA sought to hire an ethics attorney to investigate the complaint and defend board members.
      *   The complaint was submitted to local print media.
      *   Article 1 (2/16/2017) focuses on demanding answers regarding Ordinance 1572 (repeal), Fly Creek Apartments, and the Airport Authority's control over land.
      *   FAA land is equivalent to 21% of city debt.
      *   Mayor fought to bring up Ordinance 1572 repeal, but council president refused to agenda it.
      *   The city is spending more on the Airport than on Fairhope High School (needing classroom portables).
      *   Potential loss of $7 million related to Airport Authority plans.

      THE DISCOVERY:
      *   The FAA was attempting to use tax dollars to hire a top ethics attorney to defend board members (Burrell, Hix) against a legitimate complaint.
      *   Ray Hix's attorney prepared the contested lease and requested an Advisory Opinion from the Ethics Commission, paid by Mr. Hix.
      *   Ethics Commission Chief Council Mr. Hugh Evens communicated sensitive FAA inquiry information to Hix's attorney (Mr. Bailey).

      THE PIVOT:
      *   Article 2 established the ethical conflict and potential misuse of tax dollars by the FAA (Hix, Burrell) while under investigation.
      *   This context highlights the lack of accountability and potential financial mismanagement (losing millions, spending more on Airport than schools) that Article 1 demands the city council address regarding the Airport Authority's control and Ordinance 1572 repeal.

      KEY ENTITIES:
      *   Jack Burrell (Elected official, FAA Board member)
      *   Ray Hix (FAA Sec. Treasurer, Focus of complaint)
      *   Mayor (Unspecified name, fighting for Ordinance 1572 repeal)
      *   City Council President (Refusing to agenda Ordinance 1572 repeal)
      *   Mr. Hugh Evens (Ethics Commission Chief Council)
      *   Mr. Bailey (Mr. Hix's attorney)
      *   Fairhope Airport Authority (FAA)
      *   Fly Creek Apartments
      *   Fairhope High School
      *   Ordinance 1572
      *   Dates: 2/16/2017 (Article 1 date)
      *   Amount: $7 million (potential loss)
      *   Amount: $90,000 (Mayor Wilson salary cost)
    llm_text: Ray Hix and Jack Burrell face an ethics complaint after the FAA attempted to misuse tax dollars for defense. See how this mismanagement risks a $7 million loss while the city spends more on the Airport than on Fairhope High School.
