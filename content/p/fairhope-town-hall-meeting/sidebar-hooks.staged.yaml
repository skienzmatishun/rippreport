      THE DISCOVERY: The Widget Article (older) revealed that prior to the 2017 airport controversy, there were existing warning signs of corruption at the airport, predating the current public focus on the $7 million loss and Ordinance 1572.

      THE PIVOT: The Widget Article establishes that the airport controversy is not new, but rather a recurrence of historical malfeasance and ethical failure by the same political figures, providing context for the current concerns about the Airport Authority demanding control while the city pays the mortgage (21% of city debt).

