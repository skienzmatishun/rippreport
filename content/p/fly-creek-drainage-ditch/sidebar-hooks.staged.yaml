  hip-boots-on-triangle:
    brief: |-
      THE CONFLICT: 41-year lawsuit bloodbath concerning the Dyas Triangle; settled by the city's former insurer, Alabama Municipal Insurance Corporation (AMIC).
      THE DISCOVERY: The Dyas Triangle settlement of $8.75 million (plus $3.2 million in law fees) resulted in a total cost exceeding $12 million for taxpayers, and the land was not pristine, requiring millions for cleanup.
      THE PIVOT: The historical context of the $12 million Triangle Lawsuit settlement and associated corruption surrounding Mayor Kant's administration provides the framework for current allegations of "good ole boy deals" and misuse of zoning control (Fly Creek/Arthur Corte).
      KEY ENTITIES: Mayor Tim Kant, Arthur Corte, Hand Arendall, Alabama Municipal Insurance Corporation (AMIC), Dyas Triangle, Fly Creek PUD, Publix, Fairhope, Jan. 5th, 285 apartments, 15 townhomes.
    llm_text: The $12 million Dyas Triangle lawsuit settlement, paid by AMIC, exposed major taxpayer costs during Mayor Tim Kant's administration. See how that historical corruption links directly to today's "good ole boy deals" involving Arthur Corte and the Fly Creek PUD.
