  catalyst-alabama-values:
    brief: |-
      THE CONFLICT:
      *   Tim Kant was defeated in Fairhope, leading to the formation of the political group 'Catalyst'.
      *   Catalyst was orchestrated by silent power brokers, developers, and dark money with the goal of achieving total control of Baldwin County Commission and municipal mayoral seats.
      *   Tripp Pittman, a former State Senator representing Fairhope, took $750,000 from BP money while maintaining municipal contracts with Fairhope.
      *   Chris Elliott was appointed to the Baldwin County Commission by Governor Robert Bentley.
      *   Catalyst immediately used the Fairhope City Council's assistance to launch a full frontal attack on the newly elected Mayor Karin Wilson.

      THE DISCOVERY:
      *   The political influence and current opposition (e.g., against Mayor Wilson) are not spontaneous but are rooted in the organized, historical agenda of 'Catalyst'.
      *   Chris Elliott's candidacy for State Senate was a strategic move by Catalyst to eliminate competition and secure the Senate seat after Pittman's decline.
      *   Elliott eventually distanced himself from Catalyst, though the affiliation was historical.

      THE PIVOT:
      *   Article 2 establishes that the opposition currently "hijacking" Fairhope (led by Jack Burrell and supported by past/retired employees) is a direct continuation of the 'Catalyst' agenda, which was formed to undermine ethical leadership (Kant/Wilson) and achieve County Control.
      *   The actions described in Article 1 (obstruction, attacks on Mayor Wilson, control of airport/police dept) are manifestations of the long-term, organized power grab detailed in Article 2.

      KEY ENTITIES:
      *   Karin Wilson (Mayor)
