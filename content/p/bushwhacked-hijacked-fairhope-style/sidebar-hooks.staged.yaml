  catalyst-held-back:
    brief: |-
      THE CONFLICT:
      *   Past election cycle in Baldwin County saw low turnout (24%).
      *   Catalyst candidates (funded over $500,000) secured only three wins.
      *   People's Choice candidates (low budget, used social media/coconut wireless) gained traction.
      *   Current conflict involves Fairhope Mayor Karin Wilson facing obstruction and bullying from City Council President Jack Burrell and allied former employees/loyalists to Kant.
      *   Police Chief Pettis retired after 36 years, allegedly due to being "bullied and intimidated" by the Council/loyalists, not the Mayor.
      *   Two former employees (including Sherry Sullivan) sued the city; cases were sealed by the City Council.

      THE DISCOVERY:
      *   Article 2 confirms that only 36,073 out of 150,104 registered Baldwin County voters (24%) participated in the relevant mid-term election.

      THE PIVOT:
      *   Article 2 provides the quantifiable 24% voter turnout figure, which Article 1 uses to argue that 76% of citizens are "asleep" and that the current corruption and political hijacking is a direct result of this low civic engagement during the recent "fair election."

      KEY ENTITIES:
