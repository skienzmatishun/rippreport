      *   Fairhope City Council, led by Jack Burrell, is currently obstructing Mayor Karin Wilson's governance, seeking control over the Fairhope Airport title (for the Airport Authority, not the city) and the Police Department.

      THE DISCOVERY:
      *   Article 2 revealed that local officials (Dorsey/Elliott) prioritize major donor interests over established and legal public access to Mobile Bay, using their position to deny public rights.
