    brief: |-
      THE CONFLICT: Tim Kant lost an election; Jack Burrell became City Council President and began obstructing Mayor Karin Wilson's office.
      THE DISCOVERY: Article 2 documented that the Fairhope City Council obstructed the city budget for three months and that Mr. Burrell secured control of bid committees and influenced the Fairhope Airport title to be in the Airport Authority’s name, not the City’s.
      THE PIVOT: Article 2 established the historical pattern of obstruction (budget issues, airport title control) which provides context to Article 1's current claims that Burrell and the Council are attempting to remove the city budget from the Mayor and take over the Police Department.
