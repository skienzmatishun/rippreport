  victory:
    brief: |-
      THE CONFLICT: In the past (spanning years prior to the current administration and council), the Fairhope City Council and former officials supported developers over citizens regarding the Publix project and Fly Creek Apartments. The Fairhope Planning Commission approved the MOP Site Plan inconsistently with Ordinance 1572, acting arbitrarily and capriciously. This forced citizens—led by Francis Paul Ripp as President of the Fly Creek Watershed Preservation Association, Inc.—to fight through four separate lawsuits involving the Publix and Apartment Complex, represented by attorney Adam Milam who spent years on court battles, planning/zoning regulations, and building codes.

      THE DISCOVERY: The historical context (Widget Article / "VICTORY") established that the present city council refused to take action on behalf of citizens regarding the Fly Creek Apartments, claiming their hands were tied and there was nothing they could do to stop the apartments or enforce city ordinances amending the approved MOP Site Plan. However, persistent citizen-led litigation ultimately secured a legal victory proving that the Planning Commission's approval violated applicable law and Ordinance 1572.

      THE PIVOT: The historical legal battles and court victories over the Fly Creek/Publix developments serve as the ultimate backdrop for Article 1's exposure of the clandestine "Deed of Gift" from Fall 2016. While developers were pushing an illegal one-point drainage system through an outfall pipe (violating PUD Amendment 1572's non-point discharge requirement), they simultaneously dumped liability onto the City by deeding the 4-acre wetland parcel directly adjacent to Fly Creek. The past legal resistance led by Ripp and attorney Adam Milam provides the foundational proof that developers and past officials (like Tim Kant) consistently colluded to bypass ordinances, forcing the City to inherit massive environmental liabilities, drainage duties, and landowner lawsuits.

