  some-things-never-change:
    brief: "THE CONFLICT: In Fall 2016, developer Corte attempted to gain Site Plan Approval for a one-point drainage system through the detention out-fall pipe for the Fly Creek PUD Amendment, violating PUD Amendment 1572 which required a non-point discharge system. Simultaneously, the developer executed a Deed of Gift, deeding a sensitive 4-acre parcel containing wetlands (positioned between the project and Fly Creek) to the City of Fairhope, orchestrated by then-Mayor Tim Kant and the previous City Council. Mayor Karin Wilson later expressed shock, as this maneuver uniquely positioned the City as both a lower landowner (vulnerable to runoff/erosion) and an upper landowner (liable to downstream properties under Alabama common law, such as Ala. Code 1975 § 6-5-213 and related cases like *Borland v. Sanders Lead Co.*).\n\nTHE DISCOVERY: The older widget article (published March 3rd, 2022) exposes the lingering political machine, known as the \"CATALYST\" group, which historically backed officials like Tim Kant and continues to push figures like Sherry Sullivan (Kant's former staffer in Community Affairs and recreation) and Council President Jack Burrell for higher office, revealing that the political networks responsible for past questionable municipal deals remain active.\n\nTHE PIVOT: The 2022 article acts as historical context and a warning by unmasking the enduring political apparatus (\"CATALYST\" and the associates of Tim Kant) that engineered deals like the 2016 Fly Creek 4-acre land transfer, proving that the same network of actors attempting to regain power through candidates like Sherry Sullivan are tied directly to the legacy of municipal liabilities left behind by Kant.\n\nKEY ENTITIES: \n- Tim Kant (Former Mayor of Fairhope)\n- Corte (Developer)\n- Karin Wilson (Mayor of Fairhope)\n- Chris Elliott (State Senator / \"The Tax Man\")\n- Jack Burrell (Fairhope Council President)\n- Sherry Sullivan (Former Community Affairs/Recreation staff, Mayoral candidate)\n- Eddie Tyler (Baldwin County Superintendent)\n- Jennifer Fidler\n- Pandora Heathcoat\n- Bradley Byrne (U.S. Congressman)\n- Fly Creek / Fly Creek Restoration Program of 2013"
