      THE CONFLICT:
      *   The Dyas, Triangle lawsuit cost Fairhope taxpayers $11.25 million.
      *   The initial settlement claim by Mayor Timmy, Council Boone, and Council Burrell was a "lie" to taxpayers.
      *   Mayor Kant drove the settlement price to $8.25 million plus a $3 million legal bill from attorney O’Rear.
      *   Fairhope is currently engulfed in an 11-year development suit (Breland case), potentially costing $10 million in damages.
      *   Former Mayor Tim Kant testified in court, admitting regulations holding up Mr. Breland were put in place "after the fact."

      THE DISCOVERY:
      *   A political cabal operated in Baldwin County under the banner CATALYST, later renamed Scott Boone Consulting (SBC) in 2020.
      *   SBC controlled city appointments, including a Municipal Judge (a developer), an SBC loyalist City Attorney, and the law firm Hand Anderall Sale.
      *   Hand Anderall Sale lied to citizens about the Triangle lawsuit costing taxpayers $3 million in legal fees.
      *   SBC influenced the killing and radical change of the Fairhope waterfront project and drove annexation (Parker Road) on January 25, 2021.

      THE PIVOT:
      *   Article 2 reveals the legal failures (e.g., Triangle lawsuit costs, waterfront changes, Hand Anderall's role) were not isolated errors but the result of a controlled, self-serving political agenda (SBC/Cabal).
      *   This cabal structure explains why the city council, under the influence of SBC, failed to settle the Dyas, Triangle, and Breland cases efficiently, leading to millions in lost taxpayer money.

