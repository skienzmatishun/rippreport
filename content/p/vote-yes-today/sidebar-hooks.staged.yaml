  press-release:
    brief: |-
      THE CONFLICT:
      - Harry Still, III, Attorney At Law, issued PRESS RELEASE announcing his campaign for Alabama Attorney General; requested Republican Primary vote on May 24th.
      - Harry Still: "I’m Harry Still and I want to restore your faith in Alabama justice by serving as your Attorney General."
      - Harry Still: will protect Alabama citizens from violent crime by keeping criminals locked up in Alabama prisons, not walking streets in exchange for a few dollars or freed by federal oversight.
      - Harry Still: waged tireless fight against corruption in Alabama his entire adult life; for three decades served from hallways of city and county governments and in many of the Courthouses throughout Alabama.
      - Mike Hubbard, former Speaker of the Alabama House of Representatives, attempted to influence legislators to shorten his prison sentence.
      - Mike Hubbard's calls attempting to influence legislators were made on a State telephone in a County Jail subject to recording; he was advised of this fact (per Harry Still's press release).
      - Harry Still campaign promise 3: To release all recordings of former Speaker Mike Hubbard attempting to influence legislators to shorten his prison sentence.

      THE DISCOVERY:
      - PRESS RELEASE (Article 2) revealed Harry Still's campaign promises:
        - 1. Take a Leadership Role in Prison Construction and Improvements.
        - 2. Reform law enforcement from the top down:
          - Reorganize The Alabama Police Officers Standards and Training Commission (APOST).
          - "Sensory training" Statewide.
          - Non-lethal equipment provided to all departments in the State.
          - Designate a Go-Team to investigate every single officer-involved shooting in Alabama; no more Major Crime Units or Internal Affairs Unit investigating shootings within their own department.
          - Bolster the Public Integrity Unit.
            - Review every complaint filed with the Alabama Ethics Commission since 2015.
            - Review all new complaints filed with the Alabama Ethics Commission; jurisdictions are concurrent.
            - Investigation into the use of software called a "Master Name Index" by local law enforcement that may violate the Constitutional Rights of our Citizens.
        - 3. To release all recordings of former Speaker Mike Hubbard attempting to influence legislators to shorten his prison sentence. Calls made on a State telephone in a County Jail subject to recording; Hubbard was advised of this fact.
        - 4. Take a Leadership Position on Medical Cannabis Licensing.
        - 5. If the People of Alabama decide to permit gaming or a lottery, ensure a Gaming Commission with respectable appointed officials.
        - 6. Take a leadership role in replacing the State Constitution; Home Rule for County Government; Reform the Court of the Judiciary.
        - 7. Investigate unregulated private sewer utilities in Alabama.
        - 8. Champion the Alabama Accountability and Transparency Act.
        - 9. Review all no-bid contracts with the State of Alabama.
        - 10. Support the Right of Citizens to carry a firearm concealed if not prohibited by law, without a permit from your local Sheriff.

      THE PIVOT:
      - Article 2 (PRESS RELEASE) is older than Article 1 ("Vote YES Today"); Article 2 framed as background/historical context.
      - Article 2's Harry Still press release provides the named candidate, platform, and specific promises — including releasing Mike Hubbard's recordings — that give factual content to Article 1's "Vote YES Today" directive.
      - Article 1 image context: White A-frame sign on pavement displaying "Vote YES Today!" with "District Zoning and the number 8"; the number 8 may correspond to campaign promise 8 (Alabama Accountability and Transparency Act) or a district zoning reference.

      KEY ENTITIES:
      - Harry Still, III — Attorney At Law; PO Box 2435, Daphne, Alabama 36526; 251-202-3234; candidate for Alabama Attorney General.
      - Mike Hubbard — former Speaker of the Alabama House of Representatives.
      - Alabama Ethics Commission.
      - Alabama Police Officers Standards and Training Commission (APOST).
      - Public Integrity Unit.
      - Alabama State Legislature / Alabama House of Representatives.
      - Alabama Attorney General.
      - Alabama Republican Primary — May 24th.
      - District Zoning / number 8 — from Article 1 image context.
