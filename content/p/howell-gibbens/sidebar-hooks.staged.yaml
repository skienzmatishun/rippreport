      - Fly Creek Apartments - development supported by Robert Brown.
      - Recreation land purchase - $2.65 million, without public participation.
      - Triangle property - conservation easement; $11.25 million taxpayer cost.
      - Arts and Craft Show - Brown willing to "take a chance."
      - RESTORE funds - $18M obtained by Mayor Wilson's administration.
      - Eastern Shore - sewer overflow prevention plan area.
