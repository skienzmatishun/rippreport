      THE CONFLICT:
      - Howell Gibbens is running for Fairhope City Council Place 4 against incumbent Robert Brown.
      - Robert Brown faces pending Ethics and Attorney General complaints regarding city contracts that benefited him personally.
      - Specific allegations against Brown include: supporting developer Angelo Corte and the Fly Creek Apartments; involvement in a $2.65 million Recreation land purchase without public participation; and supporting an $11.25 million taxpayer-funded conservation easement for the Triangle property.

      THE DISCOVERY:
      - "CATALYST" rebranded as Scott Boone Consulting (CSB) to avoid political toxicity.
      - CSB operates as a coordinated political alliance across Baldwin County (Fairhope, Daphne, Spanish Fort, and Bay Minette) similar to the "Club for Growth" PAC.
      - The organization uses a standardized, distinctive PVC-framed sign system to signal candidate loyalty and ensure elected officials remain under their control.
      - CSB is accused of operating a "good ole boy's club" that manages elections and influences municipal decisions, such as the awarding of prime locations for airplane hangars via bid committees.

      THE PIVOT:
      - Article 2 provides the systemic context for the individual allegations against Robert Brown in Article 1.
      - It identifies Brown not merely as a corrupt individual, but as a "CATALYST/Scott Boone loyalist," linking his specific ethics complaints to a broader, multi-municipality political machine (CSB) that uses coordinated influence to control local government and development.

