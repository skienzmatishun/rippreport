  nappi-award:
    brief: |-
      THE CONFLICT:
      - Howell Gibbens, City Council Place 4 candidate, posted on Facebook ("Slow Down Fairhope") about Fairhope's explosive growth overloading physical and social infrastructure.
      - Gibbens' opponent: Robert Brown, City Councilman.
      - Brown fully supported the Fly Creek Apartments and his mentor, developer Angelo Corte.
      - Brown sided with the developer, ignored constituents, and used his office for personal gain.
      - Ethics complaint and Attorney General complaint filed against Brown for contracts related to the city that benefited him personally.
      - Brown involved with the Recreation land purchase without public participation, to the tune of $2.65 million.
      - Brown in favor of giving up control of the Triangle property to a conservation easement, a taxpayer cost of $11.25 million.
      - Brown was willing to "take a chance" on the Arts and Craft Show; Brown is a naysayer of covid.
      - Ripp Report long range prediction: if Mr. Brown loses the council race, he may escape complaint charges; if Mr. Brown wins, he will face the complaints sooner or later.

      THE DISCOVERY:
      - Nappi Award: Mayor Karin Wilson of Fairhope won the "Hardest Working Elected City Official — Eastern Shore" award four years in a row.
      - The Mayor received 4 Nappi Awards during the same time the council was awarded nothing, zero.
      - The council fought the Mayor tooth and nail for 4 years; she still accomplished more in 4 years than the previous Mayor did in 16 years.
      - Mayor's administration: invested $14M in utility upgrades so far this term without borrowing a dime.
      - Obtained $11M to offset rehabilitating sewer lines and planning a SSO Prevention Plan for the entire Eastern Shore.
      - Four years ago, the city was running an annual $6 Million deficit, making payments on millions of dollars of debt, and requiring most of the profits from the Utility department to subsidize its budget.
      - Today, the City is fiscally self-reliant, paid off long-term debt, and increased combined City/Utility cash funds by almost 60%.
      - Obtained $18M in RESTORE funds, most of which will be invested in sewer system upgrades and a sewer overflow prevention plan along the Eastern Shore - money citizens will save in sewer rate increases.

      THE PIVOT:
      - Article 2 is older than Article 1; frame Article 2 as background/historical context.
      - Mayor Wilson's sewer upgrades (completed by 2022; $14M in utility upgrades; $11M for sewer line rehab and SSO Prevention Plan; $18M in RESTORE funds) serve as the prior background against which the Gibbens growth/infrastructure concerns and the Brown conflict should be read.
      - The physical sewer foundation discussion in the Gibbens article is contextualized by the Mayor's previously completed upgrades.

      KEY ENTITIES:
      - Howell Gibbens - City Council Place 4 candidate; author of "Slow Down Fairhope" Facebook post.
      - Robert Brown - Incumbent Councilman; Gibbens opponent; ethics complaint and Attorney General complaint filed against him.
      - Angelo Corte - Developer; Brown's mentor; Fly Creek Apartments.
      - Karin Wilson - Mayor of Fairhope; Nappi Award winner, 4 years in a row.
      - Nappi Award - "Hardest Working Elected City Official — Eastern Shore."
      - Fairhope - City in Baldwin County, Alabama.
      - Baldwin County.
      - Scott Boone - CATALYST loyalist.
