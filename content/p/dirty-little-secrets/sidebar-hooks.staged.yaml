  elephant-in-a-volkswagen:
    brief: |-
      THE CONFLICT:
      *   In 1994, the Tatumville gully watershed flooded Magnolia Apartments, causing over $1 million in damage.
      *   Lee Turner, President of Single Tax, pushed the Tatumville Subdivision project since the previous year, without single tax membership vote.
      *   Lee Turner served as the chair of Fairhope Planning and Zoning, creating a conflict of interest with the Single Tax Colony developing the land.
      *   Cliff Pittman, a member of the Single Tax board and business partner of Councilman Robert Brown, advocated for the Tatumville project.
      *   The Airport Authority has been controversial since the new mayor came on board, maintaining control and isolating the city from participation while the city pays the mortgage.

      THE DISCOVERY:
      *   The Tatumville project was an ordinance directing the transfer of land to the Fairhope Single Tax Corporation for the Tatumville Subdivision.
      *   The historical pattern shows P&Z (Fairhope) being utilized for private development (Tatumville) despite procedural concerns (e.g., flooding risk).
      *   The Airport Authority is a self-serving board that seeks to keep taxpayers in the dark.

      THE PIVOT:
      *   The historical pattern of political and procedural disregard for planning goals (e.g., Tatumville/Single Tax conflicts) provides context for the City of Gulf Shores' subsequent disregard of its own planning mandates.
      *   Article 2 establishes the precedent of procedural manipulation and conflict of interest within local planning bodies, which connects to Article 1's finding that the City of Gulf Shores failed to adhere to its own Ordinance (Section 3-3E) and intentionally ignored its "Land Use Plan."

