  citizens-fighting-back:
    brief: |-
      THE CONFLICT: Small municipalities in Baldwin County historically ran roughshod over citizen participation. In Gulf Shores, the government pushed through the Regency Place Apartments (Enclave) despite significant citizen opposition and documented negative property value impacts (over $3,000,000 decline). In Fairhope, citizens successfully challenged the "Catalyst" Council and Council President who restricted public forum speech.

      THE DISCOVERY: Article 2 shows that over 625 citizens signed petitions and over 94% of those polled were against the Regency Place Apartments being located among single-family homes. Article 2 also documents that City Staff referenced the "Land Use Plan" in 2014, 2015, and 2016, contradicting the City's later claim of its insignificance.

      THE PIVOT: Article 2 provides the context of citizen resistance and quantifiable damage (property value decline) that motivated citizen Rex Lawson to challenge the City's legality, leading to the discovery in Article 1 that the City of Gulf Shores was not following its own Ordinance Section 3-3E, which was admitted by Andy Bauer and Mayor Robert Craft.

      KEY ENTITIES: City of Gulf Shores; Mayor Robert Craft; Andy Bauer (Director of Planning and Zoning); Rex Lawson; Regency Place Apartments; Baldwin County; Fairhope; Planning Commission; Section 3-3E; August 17, 2018; 9/20/2018; City Staff.
    llm_text: Gulf Shores ignored 94% of citizens against the Regency Place Apartments, causing over $3M in property value decline in Baldwin County. Rex Lawson challenged the City, proving Mayor Robert Craft and Andy Bauer violated its own Ordinance Section 3-3E.
