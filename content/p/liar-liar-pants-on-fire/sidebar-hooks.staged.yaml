  captain-jack-at-the-controls:
    brief: |-
      THE CONFLICT:
      - Baldwin County legislators, at Goat Hill under puppet Governor "Poison Ivy," accused of having field day throwing bills into corruption pot; playing Alabama citizens as patsies.
      - Legislators want public to believe only accountability for political corruption is Ethics Commission, which they control.
      - Ethics Commission described as toothless tiger, controlled/operated by same legislators that pulled teeth out and want to break jaw; provides "protection from prosecution" for elected officials accused of Ethics violations if in Republican party; likened to toilet paper with holes.
      - Last week they wanted to legalize corruption. This week they want Baldwin County elected officials to believe Economic Development lobbyists are not really lobbyists.
      - Economic development lobbyist "dinners or incentives" thrown to legislators; described as way business is conducted in "third world" of Alabama.
      - Facebook post from ReportTrolls: bill grants cover for people offering "incentives" in exchange for access to power and influence; eliminates paper trail; enables lawmakers receiving incentives to hide names and identities of benefactors.
      - ReportTrolls calls such "economic developers" ghosts under blanket of obscurity, anonymity, secrecy; their power is enormous because they can buy access to most influential lawmakers absent impunity; as far as government is concerned, ghosts don't exist, making it nearly impossible to hold crooked lawmakers accountable when they sell vote to highest bidder.

      THE DISCOVERY:
      - Article 2 is older than Article 1; frame as background/historical context.
      - Fairhope Airport Authority under control of Fairhope Council President Jack Burrell / Captain Jack continues to raise eyebrows; quote: "What the hell is really going on at the Airport."
      - Millions of development dollars from federal agencies expanded airport with additional runways.
      - Hangars offered on long term leases; no specific long range plan presented to public.
      - Some feel Airport Authority needs face lift, like taking Captain Jack's face out of Authority altogether.
      - As President of Council and liaison to council, Jack Burrell did everything possible to maintain control of Airport Authority and isolate City from participation.
      - Authority subsidized by City of Fairhope, yet Authority refuses to allow City to gain title to Airport.
      - Airport Authority, piloted by Captain Jack, again playing games regarding leases of hangars.
      - Authority Board President Joe McEnerney was soundly reminded by Captain Jack that he is at controls.
      - After defeat of former Fairhope Mayor Can’t in 2016, documents presented to Ripp Report pertaining to leases of hangars at Airport and suspicious nature in which bids were handled.
      - Captain Jack was getting free air miles and golf vacations from a board member while overseeing bid process for same board member.
      - No accountability because Captain Jack was at controls.
      - NO ACCOUNTABILITY NO TRANSPARENCY; read documents and you will see why Ripp Report still has its $5,000.00.
      - Authority receives 7 cents on dollar as fuel income from lease holders.
      - No one has record of what is being used; some board members say fuel used is personal business and board has no right to that information.
      - Fixed Based Operator does not share info on gallons consumed with Authority.
      - How do you pay bill? Send Authority check for gallons used without any record. Ask Captain Jack just how he collects 7 cents?
      - Ask Captain Jack to explain Police Report he never revealed during last election.

      THE PIVOT:
      - Article 2 is older than Article 1; key background/context.
      - Article 2 showed unaccountable Airport Authority under Jack Burrell/Captain Jack, suspicious hangar lease bids, no transparency/accountability, Captain Jack at controls, no oversight.
      - Article 1 shows Baldwin County legislators, Ethics Commission, Economic Development incentives, State Senator Elliott, police/PR.
      - Article 2 smoking gun: NO ACCOUNTABILITY NO TRANSPARENCY; suspicious bids; Captain Jack getting free air miles/golf vacations from board member while overseeing same board member bid; Authority refusing City participation; fuel income/gallons not shared; Police Report not revealed.
      - Article 2 is key context for Article 1 because it establishes pattern of unaccountable control, no transparency, officials at controls, no accountability, connecting to Article 1 corruption/ethics/incentives allegations.

