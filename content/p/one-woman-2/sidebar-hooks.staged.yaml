  faux-tax-gas-tax:
    brief: |-
      THE CONFLICT:
      - Fairhope City Council bullied the Mayor at Council meetings and other public venues; first council meetings of the council’s term were disgraceful.
      - Bullying leadership headed by Council President Jack Burrell, who refused to share the Council President chair, supported by Councilmen Boone and Brown; Councilmen Conyers and Robinson were mute but complicit.
      - Bullying, intimidation, and victimization described as one in the same; intimidation described as major weapon in Baldwin County political and judicial arena; some men find women an easy target.
      - Paula DiNardi identified as the victim; endured several postponements of the case and over 8 hours in the Fairhope Municipal Court; victimized again; life turned upside down since incident.
      - Ronan McSharry found guilty in Fairhope Municipal Court of public intoxication and assault; sentenced to 180 days in jail, with time served during rehab stay; McSharry represented by Defense attorney John Beck; appeal expected.
      - McSharry, through another attorney, attempted to “settle the issue” with DiNardi by providing she remain silent for life and not show up for court, thus charges would be dropped; Ripp Report understanding both offers were rejected; DiNardi refused.
      - DiNardi represented in court by City Attorney Marcus McDowell; McDowell did not object or interfere with Beck’s line of questioning; Municipal Judge allowed Beck to go unchallenged.
      - Beck asked DiNardi a series of questions related to Paul Ripp aka Ripp Report and Ripp Report involvement; DiNardi explained Ripp Report, a non profit consumer organization, was acting as advocate for her.
      - Beck asked a series of questions about the Mayor and DiNardi’s alleged involvement in the case or connection to Paul Ripp/Ripp Report; Beck rambled without objection being heard.
      - City Attorney did not mention medical damages, over $6,000, DiNardi incurred; did not mention McSharry has a green card and is not a U.S. citizen.
      - DiNardi case seen as ongoing political witch hunt focused on defeating Mayor Wilson in 2020; Mayor and Ripp Report not relevant to criminal charges against McSharry.

      THE DISCOVERY:
      - Article 2, “FAUX TAX, GAS TAX,” older than Article 1; frame as background/historical context.
      - Governor Kay Ivey announced special session for gas tax; Ivey said money for infrastructure; strong accountability measures; every penny scrutinized; monies spent solely on transportation infrastructure; period.
      - Special session included legislation to improve legislative oversight of Alabama Department of Transportation.
      - Added bill to gas tax authorized bond issue to improve Alabama State Docks and Mobile Bay ship channel.
      - Ivey and Republicans know nothing but tax tax tax; Goat Hill politicians and previous Governors raided one account after another, transferring funds, and never fixing anything.
      - Democrats wanted to look at options staring Alabama in the face: Medicaid expansion, gambling, medical marijuana legalization.
      - Business Council of Alabama had its hands on puppet strings; gas tax designed by Business lobbyists who will profit from tax.
      - Jim Page, chairman of the Alliance for Alabama’s Infrastructure, said Alabama must be competitive with sister southeastern states, many of which already addressed this issue.
      - Baldwin County elected “THE TAX MAN” Senator Chris Elliott, infamously known for back room penny school tax as County Commissioner; Tax Man was told support gas tax and Business Council of Alabama would support him; chose to side with politicians and left constituents to pay the TAX.
      - Penny tax cost Baldwin County Schools $200,000 a year, that is $1 million every 5 years; amount the TAX MAN skimmed of the penny tax for infrastructure needs of the county.
      - Gas tax is going down the same road, singing the same song of roads, bridges and infrastructure; at the same time puppet Governor and the TAX MAN are going to dredge the ship channel and God knows what else, all in the name of infrastructure.

      THE PIVOT:
      - Article 2 is older than Article 1; frame Article 2 as background/historical context.
      - Article 2 showed/revealed Governor Kay Ivey gas tax special session, State Docks dredging between $400,000 and $600,000, Business Council of Alabama influence, Chris Elliott “Tax Man,” penny tax cost to Baldwin County Schools.
      - Article 2 is key context/smoking gun for Article 1 because it establishes prior pattern of tax use/diversion/infrastructure funding and political influence in Baldwin County.
      - Article 2 parallels Article 1 themes of political manipulation, intimidation, victimization, tax use, public corruption.
      - Article 2 connects to Article 1’s allegations involving Fairhope City Council, Mayor Wilson, Paula DiNardi, Ronan McSharry, John Beck, Marcus McDowell, Baldwin County officials.

      KEY ENTITIES:
      - Names: Paula DiNardi, Ronan McSharry, John Beck, Marcus McDowell, Jack Burrell, Mayor Wilson, Councilmen Boone and Brown, Councilmen Conyers and Robinson, Paul Ripp, Governor Kay Ivey, Senator Chris Elliott, Jim Page.
      - Organizations: Fairhope City Council, Fairhope Municipal Court, City Attorney, Ripp Report, Business Council of Alabama, Alliance for Alabama’s Infrastructure, Alabama Department of Transportation, Alabama State Docks, Baldwin County Schools, Alabama Legislature, Republican entities, Democratic entities, Business lobbyists.
      - Locations: Fairhope, Baldwin County, Alabama, Mobile Bay ship channel, Alabama State Docks.
      - Dollar amounts: over $6,000 medical damages; $200,000/year penny tax; $1 million every 5 years; $400,000–$600,000 State Docks dredging.
      - Dates/titles: Mayor Wilson in 2020; McSharry guilty in Fairhope Municipal Court last week; sentence 180 days in jail, time served during rehab; gas tax special session recent; first council meetings of term.
