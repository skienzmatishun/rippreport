      *   Previous administrations (Councilman Boone and Councilman Burrell) spent $13 million on a sewer plant next to the Bay, instead of relocating it inland for an estimated $22 million.

      THE DISCOVERY:
      *   Article 2 (older context) revealed Baldwin County suffered from sprawl and lack of long-range planning, leading to increased taxes and congestion.
      *   Article 1 (July 23, 2019) revealed the Fairhope/Eastern Shore had a severe, multi-year neglect of sewer and utility infrastructure.
      *   Mayor Karin Wilson identified and initiated an aggressive 5-year rehabilitation plan for the wastewater system, utilizing $11 million in RESTORE funding.

      THE PIVOT:
      *   The systemic planning and financial decisions detailed in Article 2 (e.g., the Bridge project, tax hikes, and general sprawl) created the environment of neglect and financial strain that resulted in the severe, multi-year utility and sewer infrastructure failure addressed by Mayor Wilson in Article 1.

