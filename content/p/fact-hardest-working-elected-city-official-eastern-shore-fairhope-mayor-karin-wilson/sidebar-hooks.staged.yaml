  mega-mistake:
    brief: |-
      THE CONFLICT:
      *   Baldwin County Mega-Site spent 32 million over seven years with 2 million annual payments and remained vacant.
      *   Fairhope suffered from long-term sewer and utility infrastructure neglect by previous administrations and the City Council.
      *   Councilman Boone and Burrell spent 13 million on a Bay-adjacent sewer plant instead of relocating it inland for 22 million.
      *   Fairhope Council was reportedly proposing to give Weeks Bay 106 acres valued at 20 million dollars.

      THE DISCOVERY:
      *   The Baldwin County Mega-Site failure led to an estimated expense of 50 million, prompting plans to transfer title of the site to BCEDA.
      *   Baldwin County Economic Development Alliance (BCEDA) under Lee Lawson failed to find a tenant for the Mega-Site.

      THE PIVOT:
      *   Article 2 establishes a historical pattern of elected officials (BCEDA/County Commission) mismanaging large public funds and attempting non-public transfers of valuable municipal land.
      *   This pattern mirrors the ongoing infrastructure neglect and obstruction by the Fairhope City Council that Mayor Karin Wilson was fighting to correct using $11M in RESTORE funding.

      KEY ENTITIES:
      *   Mayor Karin Wilson
      *   Fairhope City Council
