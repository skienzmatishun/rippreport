  wetlands:
    brief: |-
      THE CONFLICT:
      - Mayor Karin Wilson of Fairhope ran for office with the promise to fix the sewer and utility infrastructure (Main Article, July 23, 2019).
      - Fairhope and the Eastern Shore have a sewer problem that was developed over many years of neglect of previous administrations.
      - The Fairhope City Council hindered the infrastructure projects by simple obstruction and procrastination.
      - Councilman Boone and Councilman Burrell did nothing for four years, except spend $13M on a sewer plant located next to the Mobile Bay; for $22M they could have relocated the sewer plant inland, which is what will eventually happen.
      - 2017: regular sewer spills; sewage still dumped into the bay (Widget Article).
      - Oct 9: Fairhope City Council heard a presentation from Baykeepers involving testing of water in 12 locations, once a week for 12 weeks; Fly Creek Watershed is one of those locations.

      THE DISCOVERY:
      - Article 2 (Widget Article) revealed at the time / background context: Baykeepers testing of 12 locations; Fly Creek Watershed; land owner Arthur Corte refused testing anywhere on his property; resident from Spanish Fort, Rock Creek area produced photographs of the wetlands by the Firefly subdivision; smelled foul odors and saw discolored water which appeared contaminated; city lift stations also problematic in same area; Baykeepers was given copy of photos and acknowledged familiar with location; Casi Callaway was too occupied with talking to the council and not the citizen complaining; complaints have fallen on deaf ears in the past; no city official or state agency has taken any time to answer citizen complaints.
      - City of Fairhope, EPA, Jim Graves, Dept. of Health, Myron Riley, ADEP Lance Leflur and the Corp. of Engineers, Glenn Cunningham all failed to follow up or contact the citizens with an explanation.
      - Baykeepers has yet to start testing any other locations; asked to test the area and conduct a visual inspection of the watershed by Firefly.
      - Firefly was another Arthur Corte project with Councilman Kevin Boone having an LLC related to the same project; he dissolved the LLC since it has been exposed.

      THE PIVOT:
      - Article 2 is older than Article 1 and serves as background/historical context for Article 1 (Main Article, July 23, 2019).
      - Article 2 documents pre-2019 sewer context: 2017 regular sewer spills, sewage dumping into the bay, citizen complaints, Baykeepers involvement, council inaction, state agency failures.
      - Article 2 is key context for Mayor Wilson's July 23, 2019 statement claiming she is the FIRST Mayor in Fairhope to address the situation, and for the $11M in RESTORE funding and the top-to-bottom 5-year plan.
      - Article 2 is the smoking gun / key context for Article 1 because it provides the historical backdrop of sewer neglect, council obstruction, and ignored complaints that frames Mayor Wilson's actions and the city council's obstruction.

      KEY ENTITIES:
      - Mayor Karin Wilson - Fairhope.
      - Councilman Boone (Kevin Boone) - Fairhope City Council; had LLC related to Firefly project, dissolved.
      - Councilman Burrell - Fairhope City Council.
      - Arthur Corte - land owner, Fly Creek Watershed.
      - Casi Callaway - Baykeepers / Mobile Baykeeper.
      - Baykeepers.
      - EPA.
      - Jim Graves - Corp. of Engineers.
      - Dept. of Health.
      - Myron Riley - ADEP.
      - Lance Leflur - ADEP.
      - Glenn Cunningham - Corp. of Engineers.
      - Fairhope City Council.
      - Mobile Bay.
      - Fly Creek Watershed.
      - Firefly subdivision.
      - Publix.
      - Spanish Fort.
      - Daphne.
      - Sandy Ford / Rock Creek area.
      - Lowery, Wilters.
      - Alabama Dept. of Environmental Management (ADEM) - inferred.
    llm_text: Fairhope's sewer spills kept fouling Mobile Bay for years while Mayor Karin Wilson promised to fix the sewers. Baykeepers tested Fly Creek Watershed and found the problem, but complaints from residents fell on deaf ears.
