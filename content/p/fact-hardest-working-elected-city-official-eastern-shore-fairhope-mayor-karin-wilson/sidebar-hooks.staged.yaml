  disposal:
    brief: |-
      THE CONFLICT:
      *   Previous administrations neglected sewer and utility infrastructure in Fairhope/Eastern Shore.
      *   Council President Jack Burrell and Councilman Boone were involved in past corruption, including the proposed disposal of 106 acres of city property valued at $20 million.
      *   Burrell and Boone oversaw a four-year period where only $13 million was spent on a sewer plant next to the Bay, instead of $22 million to relocate it inland.
      *   Burrell overrode the Mayor’s veto on the Fly Creek extension of zoning and settled the Triangle lawsuit while misleading citizens.

      THE DISCOVERY:
      *   The Fairhope City Council President, Jack Burrell, held control for over 7 years, prioritizing special interests (e.g., Fly Creek developer) over public engagement and citizens.
      *   Burrell manipulated city decisions, such as the Twin Beech road property issue (costing $5 million) and hiding a police report before the last election.
      *   The Council resisted public participation, leading to a federal lawsuit that the City lost.

      THE PIVOT:
      *   Article 2 (Widget) provides the historical context of systemic corruption and obstruction by Council President Burrell and Councilman Boone, which created the environment of neglect and political obstruction that Mayor Karin Wilson (Article 1, 2019) was attempting to fix.
      *   The past actions of Burrell and Boone directly contributed to the long-standing sewer and utility infrastructure problems Wilson promised to solve in 2019.

