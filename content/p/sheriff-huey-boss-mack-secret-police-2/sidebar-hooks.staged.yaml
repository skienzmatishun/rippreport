  innocent:
    brief: |-
      THE CONFLICT: Conviction of Murray “Bubba” Lawrence on May 13, 2005, for capital murder of Brandon Hastings (May 6, 2003). Lawrence was arrested and incarcerated for 11 months 10 days prior to conviction.
      THE DISCOVERY: Article 2 revealed the conviction was based primarily on the testimony of an accomplice (Jarius McNeil), lacking corroborating evidence (no fingerprints, DNA, ballistics, or weapon). A timeline analysis from the 2200-page trial transcript proved Lawrence geographically impossible to have committed the murder.
      THE PIVOT: Article 2 establishes that lead investigator Lt. Hoss Mack and DA David Whetstone/Judge Robert Wilters participated in a documented travesty of justice through inept investigation and reliance on weak evidence. This historical failure validates Article 1’s claims regarding systemic lack of accountability, "Secret Police" operations, and the current push for Lawrence’s case to the Innocence Project (Attorney Rebecca Chambliss).
      KEY ENTITIES: Murray Lawrence Jr., Hoss Mack (Lt/Sheriff), Brandon Hastings, Jarius McNeil, David Whetstone (DA), Robert Wilters (Judge/DA), Willy Huntley, Rebecca Chambliss, BCSO, Judge William Cassady, Judge Scully.
    llm_text: Bubba Lawrence received a 2005 capital murder conviction for Brandon Hastings, relying solely on accomplice Jarius McNeil. Lt. Mack and DA Whetstone oversaw a travesty of justice; Rebecca Chambliss now pushes Lawrence's case through the Innocence Project.
