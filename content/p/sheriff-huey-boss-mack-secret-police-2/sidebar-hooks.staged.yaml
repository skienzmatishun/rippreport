  the-murray-lawrence-jr-project:
    brief: |-
      THE CONFLICT:
      - 2003: Murray “Bubba” Lawrence Jr. convicted of murder of Brandon Hastings; Hastings disappeared from Foley, Alabama during Spring Break 2003; body found about a week later near Guitier/Vancleave, Mississippi.
      - State convicted Lawrence on word of co-conspirator; David Whetstone, Baldwin County District Attorney circa 2003, called it “Deal With The Devil.”
      - 2003: Then Lt. Huey Mack was Lead Investigator; later became 5th term Sheriff of Baldwin County. Judge Robert Wilters now serving second term as District Attorney after 22-year stretch on bench.
      - 2017: Jonathan Victor deceased—shot to death, unarmed, by BCSO. Mack told Tenenbaum BCSO had no crisis intervention team and deputies lacked specific de-escalation training. U.S. District Court Judge William Cassady wrote about excessive force standard and failure to train.
      - 2018: Robert Yates deceased—shot to death by BCSO; March 5, 2018; at/about 6:30 p.m. decision to breach Yates residence with all SWAT firepower; not exigent; no emergency; Yates silent for hours; more than 114 shells/bullet casings; tear gas/concussion grenades; deputy Justin Correa allegedly said he was “gonna go in and kill this f\*cker if I have to.”
      - 2020–2021: BCSO funding over $65 million in 2020 and 2021; over $700,000 for body and vehicle cameras; Baldwin County general fund swelled 19.2% from $39.8 million in 2021 to $47.5 million in 2022; public safety expenditures 19.1%; Sheriff’s Office flat funding at $33.6 million.
      - Sheriff Mack’s second term secured by Mack with help of then State Senator Trip Pittman; wrote/legislatively recorded qualifications for sheriff eliminating 99.5% of competition; election rigging allegation.
      - Lawsuits against BCSO; one Federal; Judge Scully; Judge Taylor; Judge Wilters; Chief Justice Tom Parker; Lagniappe decision; investigative privilege; public access to law enforcement records; Sept. 30, 2021 Lagniappe.
      - Nine lives lost and innocent man incarcerated over 16 years; Murray Lawrence Jr. railroaded/falsely incarcerated; Innocence Project via Attorney Rebbeca Chambliss.

      THE DISCOVERY:
      - Article 2: The Murray Lawrence Jr. Project. Audio story.
      - Article 2 stated Murray “Bubba” Lawrence Jr. convicted of murder of Brandon Hastings.
      - State convicted Lawrence on co-conspirator word; “Deal With The Devil.”
      - Then Lt. Huey Mack was Lead Investigator; now 5th term Sheriff of Baldwin County. Judge Robert Wilters now serving second term as District Attorney after 22-year bench stretch.
      - Harry Still no longer Attorney of Record for Murray Lawrence Jr.; petition for new trial handled by Maxwell-Tillman Law Firm in Birmingham, Alabama based on newly discovered Brady Evidence.
      - Lagniappe Mobile Newspaper article; “A Verbal Lynching In Alabama” copyrighted by Nancy Koerner; shared by Backstory Podcast with permission.

      THE PIVOT:
      - Article 2 is older than Article 1; frame as background/historical context.
      - Article 2 is the smoking gun/key context for Article 1 because it connects Huey Mack’s past as lead investigator in Murray Lawrence Jr. case to Article 1’s allegations against BCSO, including deaths, lawsuits, and secret police claims.
      - It places Mack’s current sheriff role and BCSO conduct within historical context of wrongful conviction and Brady Evidence.

