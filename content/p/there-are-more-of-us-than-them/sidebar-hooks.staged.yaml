      *   Mayor Kant has been involved in BP fraud alongside Senator Pittman.
      *   The Fly Creek development is identified as a developer/Kant plan, not a community village plan.
      *   Mayor Kant raised over $50,000 for his election, with over 50% from non-Fairhope donors/PACs.

      THE PIVOT:
