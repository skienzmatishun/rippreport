hooks:
  cut-nose-off-spite-face:
    brief: |-
      THE CONFLICT:
      *   Mayor Wilson was elected and subsequently fired two employees.
      *   Council President Jack Burrell and Kevin Boone led the council to install a hiring freeze to punish the mayor.
      *   The City Council agenda on Monday, April 24, 2017, included the Mayor's Veto of an Ordinance Amending Ordinance No. 1572 (Fly Creek PUD Sunset Provision).

      THE DISCOVERY:
      *   The council previously attempted to undermine the mayor through a hiring freeze and slow budget processes.
      *   The council voted to override the mayor's veto regarding Ordinance No. 1572 (Fly Creek PUD).
      *   A resolution (Resolution 2606-16) accepting a sewer lift station deed from Angelo A. Corte was recorded on October 21st, but Council President Burrell introduced it on October 24th, failing to note the prior recording or that the "gift" included three plus acres of wetlands, not just the small lift station land.

      THE PIVOT:
      *   The older article establishes that Burrell and Boone's actions (hiring freeze, slowing services) were part of a vindictive campaign against Mayor Wilson following the election loss.
      *   The newer article shows that Burrell's alleged incompetence regarding the Angelo Corte "gift" or the subsequent council actions (overriding the veto, blocking airport appointments) is a continuation of this obstructionist pattern against the mayor.

      KEY ENTITIES:
      *   Mayor Wilson
      *   Jack Burrell (Council President/Airport authority city liaison)
      *   Kevin Boone
      *   Tim Kant (Previous council president)
      *   Marion Wynne (City Attorney)
      *   Robert Brown (Self-imposed finance committee member)
      *   Sherry-Lea Bloodworth-Botop
      *   Angelo A. Corte
      *   Fairhope City Council
      *   Ordinance No. 1572 (Fly Creek PUD)
      *   Fairhope Airport
      *   Dates: April 24, 2017; October 21st; October 24th
    llm_text: Jack Burrell and Kevin Boone launched a vindictive campaign against Mayor Wilson, including a hiring freeze and overriding his veto on Fly Creek PUD. Now, Burrell faces scrutiny for introducing an Angelo A. Corte "gift" that included three acres of wetlands, not just the small sewer lift station land.
