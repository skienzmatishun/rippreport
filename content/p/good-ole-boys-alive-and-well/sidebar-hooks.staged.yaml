  conflict-of-interest:
    brief: |-
      THE CONFLICT:
      *   Kevin Boone had documented business connections through LLCs with John Avent of Dewberry Preble-Rish, LLC, dating back prior to his council tenure.
      *   In September 2016 (SD 16.14), Boone attended and voted on the Fly Creek Apartments (Retreat at Fairhope) issue while Avent represented Preble-Rish.
      *   Discussions existed regarding the repeal of ordinance 1572 related to the Fly Creek PUD.

      THE DISCOVERY:
      *   Article 2 reveals Boone's conflicts were not isolated incidents but a long-standing pattern spanning four and a half years, which he historically failed to acknowledge or recuse from.

      THE PIVOT:
      *   Article 2 establishes the historical and systemic nature of Boone's conflict with Preble-Rish/Fly Creek, making his recent recusal in Article 1 (regarding Fly Creek PUD, Angelo Corte, and Preble Rish) a reactive measure to a pre-existing, unaddressed issue.

