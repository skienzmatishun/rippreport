  in-the-same-boat:
    brief: |-
      THE CONFLICT:
      - Eastern Shore Metropolitan Planning Organization held a 4.5-hour meeting and voted to stand firm against Poison Ivy.
      - Baldwin County elected officials, almost 100%, showed unanimous position; first time in 20 years.
      - Stop the toll petition hit 50,000; Baldwin elected officials started flip flopping.
      - Former State Senator BP, Pittman opposed toll; did not mention BP contracts of $750,000; did not mention state robbing Baldwin and Mobile counties of fair share of BP funds; no BP funds considered for Mobile bridge.
      - Goat Hill stole BP money.
      - Thirty-three people spoke; not one in standing-room-only chambers supported toll.
      - Poison Ivy threw in towel 38 minutes after meeting.
      - Baldwin County citizens need to learn strength is in numbers not political party.

      THE DISCOVERY:
      - Fairhope had major infrastructure and sewer problems before Mayor Wilson ran.
      - Baykeeper was contacted time and again about Publix project, Fly Creek flooding, filling Fly Creek with development site mud and sand; Fly Creek Apartments built along Fly Creek; hundreds opposed; Baykeeper did not answer phone.
      - Private citizens sued City over some issues while Baykeeper’s phone was off the hook.
      - Mayor Can’t and Baykeeper did nothing but use air and talk “crap.”
      - Baykeeper Director Casi Callaway was in damage control for grabbing headlines and not using phone; said she sent everyone a letter, was hurt not to receive copy, but not surprised, did not answer phone.
      - After releasing negative media report about Fairhope and receiving blowback, Casi Callaway decided she must address Fairhope City Council and dig hole deeper.
      - Normal procedure was Public Participation at beginning of council meeting, for 3 minutes, on agenda items only; public participation at end afforded citizens 3 minutes to discuss non-agenda items.
      - Casi Callaway did not contact Mayor; contacted Council President Burrell; both kept agenda appearance secret from Mayor.
      - Burrell allowed Casi Callaway to speak in first Public Participation under agenda item she never addresses; Casi spoke well over 3-minute rule; Burrell remained silent.
      - Jack and Casi knew time allocated and agenda procedure was politically motivated to blind side Mayor.
      - Mayor produced Timeline dating back to 2016 outlining Mayor and staff’s due diligence.
      - Where is Council’s Timeline? Where is Baykeeper’s timeline?
      - Fairhope Council President Jack Burrell was Council President for seven years; refused to yield power to other Council members; used position and agenda for political purposes and bulling tactics.
      - Council President Burrell found guilty in Federal court for violating Constitutional rights of American Citizen and veteran; case used as precedent for other Council Presidents violating same constitutional rights.
      - Police Report Councilman Burrell yet to explain.
      - Casi and Jack appear to be in same political boat; at same council meeting Debbie Quinn and Sherry Sullivan, past political shipwreck survivors, were floating and yelling they wanted in same boat.
      - 2020 going to be one hell of a year.

      THE PIVOT:
      - Article 2 is older than Article 1; frame it as background/historical context.
      - Article 2 showed/revealed Fairhope, Baykeeper, Casi Callaway, Jack Burrell, council, public participation, timelines, and political tactics context.
      - Article 2 is the smoking gun/key context for Article 1 because it provides background on political process, agenda manipulation, damage control, and opposition behavior.
      - Article 2 supports Article 1’s framing of political opposition to toll/Poison Ivy as involving political positioning, power, and self-protection.
      - Article 2’s Baykeeper/Council conflict is key context for Article 1’s Baldwin County elected official/toll bridge conflict.

