      THE DISCOVERY: The Toll Bridge project, initially framed as a traffic solution, is identified as a marine project for the port, with its high cost driven by bridge height.
      THE PIVOT: Previous knowledge of the toll bridge being tied to BP contracts ($750.000) and the political danger of having one's "fingerprints on the toll bridge" explains the sudden and unanimous opposition to the toll by Baldwin County elected officials after the toll petition hit 50,000.
      KEY ENTITIES: Poison Ivy, Junior Senator Elliott, BP, Pittman, Baldwin County, Eastern Shore Metropolitan Planning Organization, Elliott, Spanish Fort, Fairhope, Goat Hill
    llm_text: Governor Poison Ivy's Rebuild Alabama Act secured a 10-cent fuel tax, while Junior Senator Elliott bypassed votes for Baldwin County taxes. See how the Toll Bridge actually serves a port, not traffic, and why local officials suddenly oppose it.
