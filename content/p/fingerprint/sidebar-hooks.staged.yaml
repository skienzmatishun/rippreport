  fairhope-sewer-backstory:
    brief: |-
      THE CONFLICT: Between 2012 and 2016, former Fairhope Mayor Kant (in office for 16 years, collecting a double paycheck as Mayor and utility director), along with Councilman Boone and Councilman Burrell, used the city utility fund as a slush fund to balance the general fund and pay for lawsuits. This resulted in Fairhope losing its best senior utility supervisor to Daphne, $3 million spent on attorneys, drained utility funds, and completely neglected sewer infrastructure.

      THE DISCOVERY: The older Ripp Report background details how Mayor Karin Wilson defeated the "good ole boys" political party (Catalyst) after running on a platform to tackle the ignored sewer and infrastructure problems. Once elected, Mayor Wilson faced continuous obstruction from the Catalyst Council (which planned to resurrect itself in 2020), while uncovering documented proof of past municipal corruption, financial mismanagement, and compromised local environmental oversight (such as Baykeepers ignoring Fairhope sewer spills due to fear of losing major local fundraisers under Mayor Kant).

      THE PIVOT: The historical record of entrenched political corruption, financial slush funds, and systemic infrastructure neglect in Fairhope (Article 2) serves as the ultimate background context for the Eastern Shore MPO toll bridge fight in Article 1. It proves that Baldwin County politicians have a long history of self-serving governance, financial mismanagement (such as stolen BP funds and toll bridge schemes), and ignoring the public interest until forced by massive citizen pushback—mirroring how Mayor Wilson had to fight the old-guard political establishment to fix basic infrastructure.

      KEY ENTITIES:
      - Mayor Kant (former Fairhope Mayor)
      - Councilman Boone
      - Councilman Burrell
      - Mayor Karin Wilson
      - Casi Callaway (Executive Director of Baykeepers)
      - Catalyst (and the Catalyst Council / good ole party)
      - The Ripp Report
    llm_text: Former Mayor Kant and his council cronies treated Fairhope's utility fund like a personal piggy bank while raw sewage went unchecked. Read the Ripp Report background to see why Baldwin County's entrenched political machine always favors self-serving corruption over you.
