    brief: |-
      THE CONFLICT:
      1. May 12, 2017: Jonathan Victor was shot by a deputy of the Baldwin County Sheriff's Office (BCSO).
      2. Sheriff Hoss Mack requested $600,000.00 from the County Commission for camera, body, vehicle, and jail systems to increase transparency.
      3. The Baldwin County Major Crimes Unit, led by Sheriff Mack, conducted the investigation.
      4. A 2021 Alabama Supreme Court decision severely restricted public access to law enforcement records (body/dash camera footage) related to investigations, even after they were closed.

      THE DISCOVERY:
      1. The lack of transparency regarding police incidents (e.g., Victor shooting) was codified legally by the Alabama Supreme Court, limiting public access to critical investigative materials.
      2. Sheriff Mack maintained a policy of NOT providing camera footage to the media or public.
      3. The investigation into the Victor shooting was sealed.

      THE PIVOT:
      1. Article 2 establishes a pattern of systemic institutional lack of accountability and suppressed public records within Baldwin County governance (Sheriff's Office/County Commission).
      2. This pattern of unaccountable local power provides the broader context for Article 1's detailed municipal failures (Publix project, Fly Creek apartments, infrastructure neglect), suggesting a wider failure of local government oversight in Fairhope.

      KEY ENTITIES:
      1. Mayor Kant
      2. Jack Burrell
      3. Angelo Corte
      4. Mayor Wilson
      5. Corry Martin
      6. Sheriff Hoss Mack
      7. Jonathan Victor
      8. William Cassady (U.S. District Court Judge)
      9. Ben Crump
