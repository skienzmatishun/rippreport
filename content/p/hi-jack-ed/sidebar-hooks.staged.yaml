  fairhope-airport-un_authorized:
    brief: |-
      THE CONFLICT:
      *   August 7, 2015: Three Fairhope Airport Authority (FAA) board members resigned. Joe McEnerey was appointed Chairman, Pam Caudill Vice Chair, and Ray Hix Secretary/Treasurer.
      *   Ray Hix gained privileged confidential information regarding airport leases and bids from this date forward.
      *   December 23, 2015: The FAA signed a memorandum of lease with Mid-Bay Air LLC.
      *   The FAA sought an advisory ethics opinion (no. 2016-04) regarding board members leasing with the FAA, outlining that members could not use confidential information for personal gain.
      *   December 2, 2016: Alabama Ethics Commission replied that no lease regarding the Mid-Bay Air issue had ever been submitted.

      THE DISCOVERY:
      *   Article 2 revealed that board member Ray Hix secured a lease with Mid-Bay Air LLC (Dec 23, 2015) while possessing confidential FAA information, violating ethical standards.
      *   The FAA failed to file the lease with the Alabama Ethics Commission within the mandated ten days, rendering the lease null and void.

      THE PIVOT:
      *   Article 2 provides specific, documented evidence (the Mid-Bay Air lease and ethics violation of 2015) that substantiates Article 1's general claims of systemic conflict of interest, lack of public scrutiny, and the FAA being a "black hole for information."
      *   The 2015 ethical breach demonstrates the specific actions that validate Mayor Wilson's concerns about the Authority operating above citizen interests, prompting her efforts to exercise the 2012 loan option.

      KEY ENTITIES:
      *   Jack Burrell (Fairhope City Council President, FAA Board Member)
      *   Mayor Wilson
      *   Ray Hix (FAA Board Member, Secretary/Treasurer)
      *   Joe McEnerey (FAA Chairman)
      *   Pam Caudill (FAA Vice Chair)
      *   Mid-Bay Air LLC
      *   Fairhope Airport Authority (FAA)
      *   Alabama Ethics Commission
      *   Fairhope
    llm_text: FAA board member Ray Hix secured a Mid-Bay Air LLC lease in 2015 using confidential airport information. The FAA failed to report this ethical breach to the Alabama Ethics Commission, proving Mayor Wilson's concerns about Fairhope's systemic lack of public oversight.
