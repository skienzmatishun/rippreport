  exit-and-enter:
    brief: |-
      THE CONFLICT:
      *   Mayor Kant held office for 16 years, beginning around 1983, following Jim Nix.
      *   The previous council under Mayor Kant was accused of a poor track record, micromanagement, and creating a "good ole boy club."
      *   The council was involved in the triangle lawsuit, which omitted public participation and cost the city millions.
      *   Projects like the soccer field complex (>$5 million) and the "imaginary north end parkland" (>$20 million) drained taxpayer funds.
      *   The city later elected Mayor Karin Wilson to begin a new chapter.

      THE DISCOVERY:
      *   Article 2 revealed that previous city administrations (Kant/Nix) exhibited systemic financial mismanagement, lack of transparency, and controlled bodies like Planning and Zoning.
      *   It highlighted the need for a new administration (Wilson) to move past the "bad baggage" of the past.

      THE PIVOT:
      *   Article 2 establishes the historical pattern of unchecked power and financial opacity in Fairhope (e.g., lawsuits, mismanaged public funds).
      *   This history of institutional lack of oversight provides the context for the current issues in Article 1: the Fairhope Airport Authority operating as a "black hole for information," receiving a $500,000 annual appropriation, and maintaining conflicts of interest (e.g., Mr. Burrell's dual roles).

