  green-acres-on-acid:
    brief: |-
      THE CONFLICT:
      - Mayor Steve Russo was convicted in 2006 in Baldwin County.
      - State Senator Tripp Pittman received $750,000 BP contracts from Fairhope and Perdido beach while serving as designated trustee of BP funds for Baldwin County.
      - Pittman used an unlicensed tractor company (a felony) for marine contracting and supplied defective boom.

      THE DISCOVERY:
      - Article 2 revealed that Baldwin County lacked accountability, citing a failure by authorities (FBI, Ethics Commission, AG) to prosecute political corruption.
      - Article 2 showed that former Mayor and City Council supported Pittman's contracts, despite conflicts of interest.

      THE PIVOT:
      - Article 2 establishes a historical pattern of political corruption and unchecked conflicts of interest within Fairhope/Baldwin County (e.g., Pittman's $750k contracts enabled by local officials).
      - Article 1 demonstrates a modern, ongoing iteration of this pattern, where Mr. Burrell (City Council President/Airport Authority liaison) leverages his position to protect the opaque Fairhope Airport Authority finances ($0.5 million annual appropriation, 21% of city budget) against Mayor Wilson's efforts to regain city land via the 2012 loan option.

