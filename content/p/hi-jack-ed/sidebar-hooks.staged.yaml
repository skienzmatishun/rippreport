  freaky-friday-merry-christmas:
    brief: |-
      THE CONFLICT: Fairhope Airport Authority consistently appropriated $500,000 annually, which was over $200,000 more than contributions to education, resulting in a lack of public scrutiny and information.
      THE DISCOVERY: Mayor Wilson sought to exercise an option in the original loan, allowing the city to take back 258 acres for $10.00 if the principal was not paid off by 2012.
      THE PIVOT: Mr. Burrell, serving as Fairhope City Council President and the city's liaison for the Airport Authority, used his positions to support the Authority's debt retention and block Mayor Wilson's efforts, creating a clear conflict of interest against citizen interests.
      KEY ENTITIES: Mr. Burrell (Fairhope City Council President), Mayor Wilson, Fairhope Airport Authority, John Sharp, Jane Nicholes, Ron Sivak, 2016, 2012, 258 acres.
    llm_text: Fairhope Airport Authority spent $500,000 annually, diverting funds away from local education. Council President Mr. Burrell blocked Mayor Wilson from reclaiming 258 acres for $10, prioritizing the Authority's debt over citizen interests.
