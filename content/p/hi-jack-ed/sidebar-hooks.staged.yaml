  a-time-for-reflection-goobers-on-notice:
    brief: |-
      THE CONFLICT:
      *   Prior to 2016, Fairhope had two mayors who were "goober good ole boys" controlled by a dubious system where the Mayor’s father-in-law controlled vote counting.
      *   In August (prior to 2016), Karin Wilson upset #1 Goober Tim Kant in Baldwin County politics.

      THE DISCOVERY:
      *   The old system of local politics in Fairhope was subject to public corruption (rigged elections).
      *   The Alabama Secretary of State’s Office sent a top attorney to oversee the election, changing the dynamic towards transparency.

      THE PIVOT:
      *   Wilson's successful election signaled a shift toward transparency, which is the context for her later administration's push against the Fairhope Airport Authority's lack of public scrutiny.
      *   The new administration challenged the status quo, leading to conflicts with Mr. Burrell, a remnant of the past, failed administration.

      KEY ENTITIES:
