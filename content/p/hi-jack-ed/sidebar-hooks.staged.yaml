  double-down-and-i-call:
    brief: |-
      THE CONFLICT: Allegations of conflicts of interest and illegal activity regarding past airplane hanger leases and Airport Authority board actions in Fairhope.
      THE DISCOVERY: On December 21, 2016, the Mayor of Fairhope filed an Ethics Complaint and appealed to external authorities (Alabama Attorney General Special Prosecutor Matt Hart, US Attorney’s Office White Collar Crime Mobile Alabama, Honorable Jody W. Bishop, FBI Mobile Alabama) for an independent criminal investigation.
      THE PIVOT: Article 2 provides the formal, dated record of the complaints and the appeal to law enforcement, validating the "recent revelations and filed complains" referenced in Article 1, demonstrating the issues were officially escalated prior to the political confrontation detailed in Article 1.
      KEY ENTITIES: Jack Burrell (Fairhope City Council President, Airport Authority board member, ad hoc committee member), Mayor Wilson (newly elected Mayor), Fairhope Airport Authority, Alabama Ethics Commission, Matt Hart (Alabama Attorney General Special Prosecutor), Honorable Jody W. Bishop, FBI Mobile Alabama, December 21, 2016, 258 acres, 10.00 dollars (original loan option).
    llm_text: Mayor Wilson and Fairhope officials faced serious conflict of interest allegations regarding 258 acres of hangar leases. In 2016, the Mayor filed an ethics complaint and appealed to Matt Hart, the AG Special Prosecutor, triggering a criminal investigation.
