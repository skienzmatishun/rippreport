  you-re-fired:
    brief: |-
      THE CONFLICT: Tucker Dorsey failed to heed a 2010 Alabama Ethics Commission advisory opinion regarding BCSS business dealings (complaint filed July 29, 2016). Councilman Kevin Boone maintained a direct business connection via LLCs to John Avent of Preble-Rish, LLC, for 4.5 years, voting on Preble-Rish projects including Firefly and the Retreat at Fairhope (Fly Creek Apartments) in Sept 2016 (SD 16.14).
      THE DISCOVERY: The Alabama Ethics Commission defines a conflict of interest as actions by a public official affecting their personal financial interests or those of associated businesses.
      THE PIVOT: Article 2 establishes the legal standard and the Ethics Commission's authority, providing the necessary context to prove that Boone’s failure to recuse himself from Fly Creek (Sept 2016) constitutes a clear violation, contrasting with Councilmen Robinson, Conners, and Brown who properly abstained.
      KEY ENTITIES: Kevin Boone, John Avent, Preble-Rish, Fairhope City Council, Fly Creek Apartments, Tucker Dorsey, Alabama Ethics Commission, Robinson, Conners, Brown, Ordinance 1572
