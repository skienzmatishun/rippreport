  a-spiders-web:
    brief: |-
      THE CONFLICT:
      *   Kevin Boone, a Fairhope City Councilman, has maintained business connections through LLCs with individuals and engineering company Preble-Rish for many years.
      *   Boone has failed to acknowledge these conflicts or recuse himself from voting on related issues over the last four and a half years.
      *   Boone voted on the Fly Creek Apartments (Retreat at Fairhope) issue twice in September 2016 (SD 16.14) while John Avent (representing Preble-Rish) was present during Planning and Zoning meetings.
      *   Other council members (Robinson, Conners, Brown) acknowledged conflicts of interest and abstained from voting on certain agenda items.

      THE DISCOVERY:
      *   The LLC network connects elected officials in Baldwin County, allowing them to promote private interests without detection.
      *   The Widget Article published copies of LLCs demonstrating a clear conflict of interest connecting Councilman Kevin Boone to individuals like John Avent.
      *   Boone has advocated for specific engineering firms and received campaign contributions from the same LLCs in which he has a financial interest.

      THE PIVOT:
      *   Article 2 established the existence of the opaque LLC network and the financial ties between Boone and Avent, providing the foundational proof for the specific voting conflicts and lack of recusal detailed in Article 1.
      *   The initial disclosure of the "spider's web" of LLCs validates the claim that Boone's voting decisions (e.g., opposing new Mayor's efforts to hire fresh eyes for sewer infrastructure) are driven by personal financial interest, not public good.

      KEY ENTITIES:
      *   Kevin Boone (Fairhope City Councilman)
      *   John Avent (Preble-Rish/Dewberry)
      *   Preble-Rish, LLC
      *   Fly Creek Apartments (Retreat at Fairhope)
      *   September 2016 (SD 16.14)
      *   Robinson (Councilman)
