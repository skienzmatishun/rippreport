      THE CONFLICT:
      *   In Fairhope, AL, the city faced significant issues regarding the $6.2 million waterfront grant, including nearly a year of attempts to bypass ADA compliance.
      *   The City of Fairhope bought the K-1 Center and surrounding property from the Baldwin County Board of Education in 2019 for $2.5 million.
      *   Council President Jack Burrell was noted for liability land gifts and favoring developers (e.g., Arthur Corti, Leaf River Group).
      *   The municipal government showed systemic favoring of developers over infrastructure and citizen needs.

      THE DISCOVERY:
      *   Article 2 revealed that the City of Fairhope’s Comprehensive Plans historically favored developers rather than environmental stewardship or citizen needs.
      *   Mayor Sherry Sullivan initially understood the mandatory ADA compliance requirement for the grant after nearly a year.
      *   Councilman Jay Robinson advocated for planning that preserves community heritage and provides access.

      THE PIVOT:
      *   Article 2 establishes a pattern of municipal governance failure, developer favoritism, and public money misuse in a neighboring coastal Alabama community (Fairhope).
      *   Article 1 demonstrates that similar patterns of overlap—private interests (John McInnis, Cameron Price) having access and involvement in City of Orange Beach land deals (CoastAL/Beech’s contract)—are occurring in Orange Beach.
      *   Both articles connect city decisions (land division, contracts, development plans) directly to private financial interests and political connections.

