      Beach Police Department, Bayshore Towers Board of Directors.

      *   **Property/Entities:** Pirate’s Voyage, Beech’s contract, CoastAL, Flora-Bama
      Lounge & Package (and associated ownership entities), Phoenix condominiums,
      DRI Gulf Coast LLC, Triangle (Land Entity).'
    generated_at: '2026-07-28T17:26:27.637226Z'
    text: Politicians always claim ethics commissions cleared their lucrative public
