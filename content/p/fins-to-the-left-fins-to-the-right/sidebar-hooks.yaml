      - Main Article reveals an ongoing "ECOSYSTEM" of overlapping public and private
      interests in Orange Beach (OB).

      - Current deals involve signing contracts between City officials and private
      entities/land owners, such as John McInnis and Cameron Price (Flora-Bama Lounge
      & Package ownership) regarding the CoastAL deal.

