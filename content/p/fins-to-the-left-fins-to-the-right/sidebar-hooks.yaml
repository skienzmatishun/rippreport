      \ interests sufficient to maintain control in those associations.\n    *   Fairhope\
      \ City Council faced past issues including the Triangle lawsuit ($12 million\
      \ settlement) and the sewer plant project ($11 million cost).\n\n2. THE DISCOVERY:\
      \ What does the second article prove or reveal today?\n    *   Kevin Boone,\
      \ a Fairhope councilman (Councilman/Developer), has documented business entities\
      \ (BA-101, LLC; North Ridge, LLC).\n    *   These businesses list John G. Avent\
      \ as a member/connection.\n    *   John G. Avent is identified as a Firm Partner\
