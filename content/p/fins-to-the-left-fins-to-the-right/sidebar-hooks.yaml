hooks:
  orange-beach-tyranny:
    brief: 'THE CONFLICT

      *   Systemic overlap of private business interests and Orange Beach city government
      occurred, specifically concerning beachfront land deals.

      *   Land division involved the City of Orange Beach taking 400 feet and the
      private company Orange Beach Land Company (owned by John McInnis and Cameron
      Price) taking adjoining 400 feet for CoastAL.

      *   Tony Kennon previously faced an ethics complaint from three council members
      regarding body camera footage, closed-door dealings, and public records.

      *   Investigative work has tracked financial interests through various entities
      (e.g., GCOF, Nathan Cox, 68 Ventures) and legal processes involving subpoena
      maps related to the City of Orange Beach.


      THE DISCOVERY

      *   On Labor Day 2024, a witness reported seeing Mayor Tony Kennon grab and
      strike a woman on the Coastal Resources building balcony at an early hour (around
      8:15 AM).

      *   This incident prompted local council members (including Robert Stewart and
      Ginger Harrelson) to request an inquiry with the Alabama Ethics Commission.


      THE PIVOT

      *   The new allegations of personal misconduct (assault on Labor Day 2024) provide
      a fresh, high-profile instance of alleged erratic behavior by Mayor Tony Kennon,
      connecting his current actions directly back into the existing narrative of
      compromised integrity and institutional conflicts previously documented through
      land title disputes and ethics complaints.


      KEY ENTITIES

      *   Tony Kennon (Mayor of Orange Beach)

      *   Orange Beach Land Company

      *   John McInnis & Cameron Price

      *   CoastAL

      *   Robert Stewart (Councilman/Ethics complainant)

      *   Ginger Harrelson (Councilwoman/Ethics complainant)

      *   Alabama Ethics Commission

      *   Coastal Resources building

      *   Danny Williams'
