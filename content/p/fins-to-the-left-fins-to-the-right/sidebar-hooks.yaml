  demand-the-truth:
    brief: 'THE CONFLICT

      *   Event: State Senator Pittman maintained debris removal contracts with the
      City of Fairhope since 2004 (except for one period when Bob James held the contract).

      *   Scope: Contracts were worth millions, funded by Federal Emergency Management
      Agency (FEMA) and state money.

      *   Conflict of Interest: Allegations that Mayor of Fairhope and Senator Pittman
      worked in tandem to enrich themselves via private business contracts utilizing
      their public positions.

      *   Justification Used: The parties used a letter from the State of Alabama
      Ethics Commission as perceived "permission" for the contracts, despite allegations
      (later made by Francis Paul Ripp) that this did not exonerate them from BP fraud
      investigations.


      THE DISCOVERY

      *   Current Claim: C.C. Dixon-Moreno alleges a systemic "ecosystem" connecting
      public officials and private interests through municipal land title work in
      Orange Beach development.

      *   Specific Examples Cited: The Beech’s contract (signed by John McInnis and
      Cameron Price—Flora-Bama ownership) involving 800 feet of beachfront divided
      between the City of Orange Beach and a private company for CoastAL.

      *   Current Action: C.C. Dixon-Moreno is filing Notices of Intent (NOIs) against
      numerous parties, including Tony Kennon, the City of Orange Beach, Bayshore
      Towers Condominium Owners’ Association, Inc., and various individuals cited
      in real estate records.


      THE PIVOT

      *   The Widget Article provides a documented case study (2016) where high-ranking
      political figures secured lucrative municipal contracts for private interests
      through legal maneuvering, specifically manipulating the interpretation of Ethics
      Commission opinions to avoid public accountability despite fraud investigations.

      *   This established pattern is used in the Main Article to argue that current
      land deals and development projects are not accidental or coincidental, but
      part of a predictable "ecosystem" where public office facilitates private gain
      via complex title work and contract layering ("relationships stopped existing
      only on paper when they repeatedly started appearing in contracts").


      KEY ENTITIES

      *   **Individuals:** C.C. Dixon-Moreno, Francis Paul Ripp, State Senator Pittman,
      Bob James, Mayor of Fairhope, Matt Hart (Special Prosecutor), Tony Kennon, John
      McInnis, Cameron Price, Nathan Cox, Greg Kennedy.

      *   **Organizations/Entities:** State of Alabama Ethics Commission, City of
      Fairhope, City of Orange Beach, CoastAL, BP Fraud investigation, Bayshore Towers
      Board of Directors, Coastal Realty Group.'
    generated_at: '2026-07-28T17:26:27.637155Z'
    text: Baldwin County insiders claim local land deals represent a routine network
