      John McInnis and Cameron Price (ownership interests behind Flora-Bama Lounge
      & Package ownership/Coastal Orange Beach), dividing 800 feet of beachfront between
      the public and private entities.

      *   In Fairhope, Mayor Kant utilized a "good ole boys" network, including Arthur
      Corte (developer) and political allies like Councilwoman Diana Brewer, to push
      through deals such as the Fly Creek Apartments project and the Triangle lawsuit
      settlement ($11.25 million).

      *   The City of Orange Beach discovered that private interests retained control
      over public assets (e.g., Phoenix condominiums/Brett/Robinson), while Mayor
      Kennon faced a retainer for legal issues.


      THE DISCOVERY:

      *   Article 2 confirms that the "ecosystem" described in Article 1 extends beyond
      just coastal land deals and includes specific municipal expenditures like the
      Triangle Nature Trail Park ($1 million development cost on property purchased
      for $11.25 million).

      *   It reveals systemic favoritism, citing Thompson Engineering (a ''good ole
      boy'' of Mayor Kant) being rewarded with projects without council approval,
      and significant financial discrepancies between education spending and high-cost
      recreational facilities like the soccer complex ($6–$7 million).


      THE PIVOT:

      *   Article 1 provides the technical proof through "title work" detailing overlapping
      names (e.g., GCOF, Nathan Cox) in contracts and private interests; Article 2
      functions as the ''smoking gun'' by providing the publicly scrutinized, real-world
      examples of this pattern, tying developer benefits directly to specific municipal
      political actions (Fly Creek Apartments/Triangle lawsuit).


      KEY ENTITIES:

      *   Arthur Corte

      *   John McInnis / Cameron Price

      *   Mayor Kant

      *   Councilwoman Diana Brewer

      *   City of Orange Beach

      *   Flora-Bama Lounge & Package ownership interests

      *   Coastal Orange Beach

      *   GCOF / 68 Ventures / APD

      *   The Triangle (property entity)

      *   Nathan Cox

      *   Brett/Robinson'
