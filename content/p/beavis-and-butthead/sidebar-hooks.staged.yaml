      *   Burrell
      *   Catalyst (organization supporting Mr. Boone)
    llm_text: Jack Burrell pushed the 2015 hangar lease to Hix/Snedecker Companies despite conflicts, involving Airport Authority members like Vince Boothe. This pattern of "cozy inside deals" shows Burrell's ambition and ethical issues run deeper than just political feuds.
