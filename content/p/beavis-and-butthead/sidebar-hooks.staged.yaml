  you-dont-know-jack:
    brief: |-
      THE CONFLICT:
      *   September 21, 2015: Fairhope Airport Authority sent out an RFP for a ground lease for a commercial hanger on plat 2.
      *   October 20, 2015: RFP opening occurred.
      *   November 17, 2015: Jack Burrell and Vince Boothe recommended the bid to award the lease. Ray Hix recused himself before discussion.
      *   November 17, 2015: Jack Burrell moved to award the bid to Hix/Snedecker Companies DBA Mid-Bay Air, llc, seconded by Vince Boothe.
      *   December 17, 2015: Memorandum of lease was recorded (30 years long).

      THE DISCOVERY:
      *   Jack Burrell (President of Fairhope City Council) was on the Airport Authority and the committee reviewing the bid.
      *   Vince Boothe was an Airport Authority Board member who seconded the motion.
      *   Ray Hix (Airport Authority Board member) and Mr. Snedecker (Fairhope Municipal Judge) were the successful bidders.
      *   The process suggested a conflict of interest (Hix did not resign, Snedecker was not pre-cleared by State Ethics Commission).
      *   The transaction was recorded as a simple memorandum of lease, not a full lease and operating agreement.

      THE PIVOT:
      *   Article 2 establishes Jack Burrell's history of ethical conflict and "cozy inside deals" within city and airport authority roles (2015).
      *   Article 1 addresses Burrell's current behavior (bullying, condescending actions) and political motivations (fearing defeat, ambition to drive the new mayor out of office).
      *   Article 2 provides historical evidence that Burrell's current political ambition and aggressive tactics are rooted in a pattern of self-interest and unethical behavior, not just political disagreement.

      KEY ENTITIES:
      *   Jack Burrell
      *   Vince Boothe
      *   Ray Hix
      *   Mr. Snedecker (Fairhope Municipal judge)
      *   Fairhope Airport Authority
      *   Fairhope City Council
      *   Mayor Wilson (newly elected mayor)
      *   Beavis
      *   Butthead
