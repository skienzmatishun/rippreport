  round-and-round-we-go:
    brief: |-
      THE CONFLICT:
      *   In the 2020 election, Burrell lost the mayoral race, failing to secure support from the previous mayor.
      *   Councilman Burrell sought city council instead of mayor.
      *   Councilman Boone is supported by Catalyst, a political organization representing self-interests.
      *   Councilmen Burrell and Boone have been publicly bullying the newly elected mayor in Fairhope.

      THE DISCOVERY:
      *   The intersection of Highway 13 and Fairhope Avenue (13/48) was converted to a roundabout in Baldwin County.
      *   The intersection is partially in the city and partially in the county, subject to Extra Territorial Jurisdiction (ETJ) by the City of Fairhope.
      *   The corner in question (North West) is an un-zoned parcel, a decision made by county voters.
      *   The new owner of the remaining parcel operates gas stations in Baldwin County.

      THE PIVOT:
      *   Article 2 establishes the regulatory and geographical context (ETJ, un-zoned land, gas station owner) for a specific development dispute in Fairhope.
      *   Article 1 frames the political actions of Burrell and Boone as rooted in "Good Ole Boy" interests and opposition to the new mayor.
      *   Article 2 provides the tangible, self-interested development issue (the gas station at 13/48) that likely motivates the political conflict described in Article 1, linking Catalyst's interests to specific property ownership and zoning challenges.

      KEY ENTITIES:
      *   Fairhope
