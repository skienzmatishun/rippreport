      *   Councilman Burrell stated he "will drive the mayor out of office in less than a year."

      THE DISCOVERY:
      *   Catalyst Associates was formed on Aug. 11, 2014.
      *   Michael Scott Boone and Lynn Stacey were listed as managers, and Coley M. Boone was the registered agent.
      *   Catalyst represents the interests of "good ole boys" and was linked to the previous mayor who was supported and financed by Catalyst.
      *   Initial attempts to recall Mayor Wilson failed (less than 300 signatures in three weeks).

      THE PIVOT:
      *   Article 2 establishes Catalyst Associates as the organized, historical backing for Councilmen Boone and Burrell's actions.
      *   This organizational context proves that the "rude conduct" and "bullying" described in Article 1 are not merely personal grievances but part of an organized effort by Catalyst to regain power and undermine the democratically elected government.

