  boiling-frog:
    brief: |-
      THE CONFLICT:
      - Previous Mayor and Council used Public Utilities fund as piggy bank to pay off lawsuits and plug holes in fractured bookkeeping system.
      - Previous Mayor drew second city paycheck from Public Utilities: $60,000/year; now history.
      - Mayor Wilson found the second check unethical and refused the additional salary.
      - City Debt of $6.83 million to be paid in full by June 2019.
      - Budget included purchase of K-1 Center; if council's plan of using applied grants fail.

      THE DISCOVERY:
      - Article 2 (Boiling Frog) applied slow-boiling-frog fable to Parker Road and Hwy.98 at Publix intersection.
      - Publix off Parker Road: 8 car lengths to enter; 8 vehicles to exit.
      - Stacked vehicles blocked gas station entrance; usually only those cars made the light.
      - ~300 apartment/townhouse units approved on Fly Creek; only two access roads (off 98 and Parker Road).
      - Parker Road light expected +700 to +1,000 more vehicles/day when apartments complete.
      - Fire station at head of Highridge Road off Parker; fire truck access through blocked intersection questioned.
      - Parker Road (Publix side) ~1,000 feet long; half county/half Fairhope; no maintenance on Parker for years.
      - Predicted Parker Road to become malfunction junction; frog to boil before anyone addressed issue.

      THE PIVOT:
      - Article 2 is the smoking gun for Article 1 because it flagged Fairhope, Catalyst, City Council-approved Fly Creek apartments as the impending traffic crisis.
      - Article 1 (2019 State of the City) covered city financial matters including $6.83M debt to be paid June 2019, K-1 Center purchase dependent on applied grants, $21M grant secured, $18M BP Restore Act with $10M sewer upgrades overlooked by previous administration; Article 2 framed the approved development as slow-boiling danger.

      THE KEY ENTITIES:
      - Mayor Wilson
      - Stephanie Hollinghead
      - Fairhope City Council
      - Fairhope Catalyst
      - Public Utilities
      - Economic and Community Development
      - BP Restore Act
      - City of Fairhope
      - Highway Department
      - Fairhope Fire and Emergency Management
      - Parker Road
      - Hwy.98
      - Publix
      - Fly Creek
      - Highridge Road
      - Lowery
      - Wilters
    llm_text: Mayor Wilson refused a second city paycheck while the city faced a $6.83 million debt. Now his team ties the Boiling Frog article to Parker Road and Publix, where stalled traffic could boil over before Fairhope's Fly Creek apartments finish.
