  chasing-your-tail:
    brief: |-
      THE CONFLICT:
      - Fairhope City Council at-large faction, referred to as Catalyst, was successful in derailing any change of government.
      - Council did not deliver budget on time and dragged process out; Mayor Wilson; city attorney took orders from council and kept Mayor in dark; city attorney paid with tax dollars to represent council president on legal issues.
      - Dyas lawsuit: council president handled; resulted in loss, 11.25 million; city had to buy property; Mr. Burrell negotiated legal settlement without public participation; council deliberately kept public in dark until settled.
      - Breland case: council had yet to explain situation to public; council displayed total lack of leadership in allowing case to progress without at least trying to settle.
      - K-1 Center: city had been talking about buying property for years; School Board was not considering any other buyer; building has asbestos and lead; city seeking grant money; most grant money will not finance buildings with such health hazards; if Burrell’s plan fails, city will step forward with financing.
      - Entertainment District: council could not figure out how to make something legal that had been going on illegally for over 10 years; opposition, mostly Baptist and minority, scared Fairhope Ave will be renamed Bourbon Street; they vote Catalyst.

      THE DISCOVERY:
      - Article 2, “CHASING YOUR TAIL,” framed Fairhope as held back by a City Council that was chasing its tail.
      - Article 2 revealed/backgrounded council actions: at-large council derailed change of government; budget delay; Breland case; Dyas lawsuit; K-1 Center; Entertainment District.
      - Article 2 showed council kept Mayor in dark; city attorney took orders from council; council president handled Dyas lawsuit; K-1 Center far from done deal.

      THE PIVOT:
      - Article 2 is the smoking gun/key context for Article 1 because Article 1, “STATE OF THE CITY - 2019,” reported Mayor’s positive presentation.
      - Article 1 states city debt of 6.83 million to be paid in full by June 2019.
      - Article 1 states budget includes purchase of K-1 Center; if council’s plan of using applied grants fail.
      - Article 2 states K-1 Center was far from a done deal; Mr. Burrell led charge “to save k-1” with conditions; if Burrell’s plan fails, city will step forward with financing.
      - Article 2 explains council conflict/context affecting Mayor Wilson’s agenda and city progress reporting.

      KEY ENTITIES:
      - Names: Mayor Wilson; Stephanie Hollinghead; Mr. Burrell; Breland; Dyas; Lowery; Wilters.
      - Organizations: Fairhope City Council; Catalyst; City Attorney; Council President; Public Utilities; Economic and Community Development; BP Restore Act; School Board; Boy Scouts; Baptist.
      - Locations: Fairhope; Fairhope Ave; Bourbon Street; K-1 Center.
      - Other entities: Police Chief Stephanie Hollinghead; Fairhope Fire and Emergency Management; Public Utilities; Economic and Community Development; BP Restore Act.
    llm_text: Mayor Wilson’s team looked ready, but Catalyst stalled change and kept the mayor in the dark. Article 2’s Chasing Your Tail shows how council choices—from Dyas losses to the stalled K-1 Center—could sink Fairhope’s 2019 plans.
