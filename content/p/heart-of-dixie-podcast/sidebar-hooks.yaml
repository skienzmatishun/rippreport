      conflict with Still due to police misconduct cases)

      - Joshua Brown (Newly Elected Mayor of Bay Minette; criticized for not removing
      Franklin from council)

      - Robert Wilters (District Attorney; previously charged in the Murray Lawrence
      Jr. wrongful conviction case represented by Still)

      - Hoss Mack (Former Sheriff; former prosecutor David Whetstone; judge Kristy
      Haygood - all mentioned as part of the corrupt "Good Ole Boys" network in Baldwin
      County)'
