      - Article 2 provides background/context on the airport spending, K-1 lease, electric substation political payback, and comprehensive plan violations that Article 1 cites as evidence of city misconduct.
      - Article 2's details on Jack Burrell's influence (airport title retention, FAA bid rigging reputation, non-public meetings, resolutions no one can understand) contextualize Article 1's criticism of city governance and spending.
      - Article 2 is the key context for Article 1 because Article 1's conflict centers on city conduct; Article 2 documents specific incidents (airport red flags, K-1 lease, hotel proposal, grants, electric substation) that serve as supporting background for Article 1's broader allegations.

