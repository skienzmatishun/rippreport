  double-red-flags-faux-hope:
    brief: |-
      THE CONFLICT:
      - Fairhope, Alabama (Fauxhope) municipal government accused of wasteful spending; "FAUXHOPE is living up to it's name"; waste of taxpayer money is staggering; few people interested; waterfront project delay is one example.
