      - Plan reportedly hatched during election to replace Brown, after the election, with Jay Robinson, who chose not to run for office; citizens of Fairhope did not know the plan.
      - Alabama legislature passed legislation moving municipal elections a year forward; Fairhope Council and Mayor served an extra year without a single vote; voter disenfranchisement, Alabama style.
      - Stewart "The Liar" Speed of Leaf River Group (developers from Mississippi) told Fairhope audience of 250 to 300 citizens apartments would be luxury apartments, signature apartments of Leaf River, never sold to any other apartment management group, environmental sound, never contaminate Fly Creek; everything he told audience was lies and he knew it when said; recorded live.
      - Burrell: acquisition gives city control over storm water retention and drainage at intersection of Alabama 181 and Baldwin County 48; Burrell known for liability land gifts; real gift is city liability, like what he did for developer buddy Arthur Corti.
      - Mayor Wilson expressed shock and concern City should not have taken ownership of property; she was right.
      - FAUXHOPE had two previous Comprehensive Plans, both failures; most flagrant violator of so-called Comprehensive plan is city itself; Comprehensive Plans always favor developers; current plan will only waste paper and air because council and mayor will do what they want, development before infrastructure.
      - Burrell: filling retention pond behind ABC store was costing about $1 million in dirt; paid $250,000 for land; saved about three-quarters of a million.
      - Electric substation backstory: Mayor and Burrell were caught lying to press and citizens of FAUXHOPE about optional locations that were available.
      - City of Fairhope bought K-1 Center and surrounding property from Baldwin County Board of Education in 2019 for $2.5 million; former school built in 1925 and closed in 2011.
      - Specific terms of agreement require city to develop SSO response plan, SSO and surface water assessment, public notification plan, adopt minimum standards of procedure for operation and maintenance of wastewater treatment system; city must provide quarterly progress reports to ADEM; city required to put out health warnings after sewer spill and warn swimmers of danger, omitted in past.
      - Sewer infrastructure: Tim Cant and Jack Burrell did nothing as far as sewer infrastructure work for years; Mayor Wilson tackled sewer issue and obtained millions for sewer infrastructure; also responsible for 6.2 million for Waterfront project.
      - At rate they are going it is going to take their entire term, plus one year, to complete projects Mayor Wilson left on the plate.
      - Council and Mayor with pro development, at all costs, changing quality of life in Fairhope; in few years FAUXHOPE will just be another small town swallowed up by urban sprawl; traffic is good indicator of poor planning.

      THE DISCOVERY:
      - Article 2 (Widget: "DOUBLE RED FLAGS - FAUX HOPE") showed/revealed at the time: "Rip-currents rough seas and high water. The same can be said about Faux-Hope. Red flags are going up faster than the American flag on July 4th."
      - Fairhope City Council following Jack Burrell down ever rabbit hole he can fit in; taxpayers of Fairhope clueless when it comes to tax dollars.
      - Fairhope spent millions on Airport and has never seen a dollar in return; over $300,000 a year, down from 500,000, is what Fairhope allocates to Airport; Airport is a red flag and Jack Burrell is raising the flag higher; Fairhope paid for Airport however Airport holds the title, thanks to Jack.
      - Airport Authority meetings are no longer video taped for the public, a Jack Burrell move; Jack's latest stunt involves Fairhope Airport Authority, FAA, where he already has infamous reputation for bid rigging; latest stunt is that there will be NO Airport Authority meetings on line for public to see; not since February has there been a recorded meeting, nor any explanation or public notice; Jack has now raised another red flag; he now wants to allow Airport board members from feeder pattern of Fairhope instead of the corporate limits.
      - Resolution: Certificate of Amendment is hereby approved for the Fairhope Airport Authority under Title 4, Chapter 3, Article 2, Code of Alabama, 197; Fairhope works by writing resolutions no one can understand, hide details and meaning; this is classic Jack and Catalyst.
      - 2.1 million in tax abatement for a company that is going to hire 5 employees; does that sound like an economic development plan?; Capt. Jack's office at same location allegedly, none other than Capt. Jack; this was another Baldwin County Economic Development plan Mr. Lawson came up with while holding Jack's hand.
      - Pied piper spent 2.65 million on recreation land that Fairhope now leases for $9,000 a year; guess where the property is located? By the Airport; who puts recreational facilities, with elevated lights, next to an Airport?
      - K-1 purchase for 4 million; bought without a plan; because they had no plan; council then had to do about 100,000 worth of "temporary" roof repairs to prevent further damage; since purchase building has deteriorated to point that only the front facade may be saved.
      - Mayor Wilson's quote: "Rushing the city into real estate deals without public participation and input by stakeholders is an inappropriate way to conduct business. Fairhope citizens are unaware of the developments concerning these properties and alternate opportunities. If the rest of Council truly wants to be transparent and make proper decisions, they will cancel this meeting and make certain all facts are presented in a public forum before we move forward on spending millions of tax dollars."
      - Jack and Lee Lawson of Baldwin County Economic Alliance teamed up with the brain storm of chasing grants for the K-1 center; first grant was denied, 7 million, now seeking a 3.5 million dollar grant, supported by a 1 dollar a year lease.
      - Before having the grant or any development plan at all, the city has now leased the K-1 center for $1 a year to FEEF, who will "maintain" the buildings; how much you want to make a bet that the K-1 will become like the airport, subsidized by the city taxpayers.
      - Council voted unanimously May 24 to approve a 25-year lease that would allow FEEF to operate the site at a cost of $1 a year; FEEF will maintain the buildings under the terms of the lease; where are they going to get the money if they fail to get the grant? they have already signed a lease.
      - K-1 site may now be tied up for years on a dollar a year lease.
      - Hotel proposed for the site was never even considered; hotel would provide 175 public parking spaces, provide for the pelican nest and other amenities; lease would be for 30 years where upon Fairhope would become the owners of the hotel and property; financed by the developer; new flag for the K-1 center will be red.

      THE PIVOT:
