  catalyst-train-wreck:
    brief: |-
      THE CONFLICT:
      - Over four years, Mayor Karin Wilson of Fairhope, Baldwin County, stood against City Council members Burrell Boone and Brown, who represented CATALYST/Scott Boone Consulting (CSB).
      - CSB was run by Scott Boone, son of Councilman Burrell Boone, and financed by special interests not aligned with citizens' values.
      - CATALYST special interests included Baldwin County Sewer, local politicians, connected attorneys, shady judges, greedy developers, and dark money.
      - The "3 B's" — Burrell Boone, Councilman Brown, Sherry Sullivan — wanted the "honey hole" and the "corruption rubber stamp" back.
      - The corruption rubber stamp had been held for 16 years by former Mayor Tim Cant.
      - Four years ago, Fairhope lost the corruption rubber stamp.
      - Burrell Boone and Scott Boone worked as a team; Scott was privileged to Fairhope executive committee details and confidential city information.
      - CATALYST City Attorney Marcus McDowell supported Sullivan and had her sign in front of his office.
      - McDowell represented the council exclusively and acted as a bully toward Mayor Wilson.
      - McDowell failed, numerous times, to file necessary charges of assault against Ronan McSharry, Burrell Boone's best friend.
      - McDowell allowed the statute of limitations to run out on the assault charge recorded on video.
      - McDowell made it a political issue by saying the Mayor should not listen to citizens' complaints.

      THE DISCOVERY:
      - Article 2 (CATALYST TRAIN WRECK) covered the latest Fairhope City Council Meeting.
      - Revealed the McSharry case is corruption staring at Fairhope in the face.
      - City Attorney failed, numerous times, in error or purpose, to defend the victim.
      - City Attorney should be fired; the city will be lucky if they are not sued for the way the case was handled.
      - After the bully council lectured about treatment of women, Councilman Boone, aka "llc. Boone," started yelling at the Mayor and demanded Councilman Burrell immediately adjourn the meeting.
      - Burrell cut off the Mayor's comments after just pledging she would be given the opportunity to speak.

      THE PIVOT:
      - Article 2 is the smoking gun for Article 1 because it captured the live Fairhope City Council Meeting incident on video.
      - Boone's yelling at the Mayor, Burrell's demand to adjourn, and Burrell cutting off the Mayor's comments after his pledge.
      - Provides the visual evidence of the bullying behavior and the City Attorney's failure in the McSharry assault case.

