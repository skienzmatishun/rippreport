hooks:
  rotten:
    brief: "THE CONFLICT: Fairhope City Council President Jack Burrell, acting as head of a municipal body operating like a \"criminal enterprise,\" has systematically blocked Mayor Kant-Wilson's administration, engaged in historical corruption including a May 2016 airport land scam, and recently engineered a racist, politically motivated $2.65 million land purchase for recreation near the airport instead of serving minority neighborhoods. Over a 7+ year tenure ending around the 2020 election cycle, Burrell—alongside the appointed City Attorney and Fairhope Municipal Judge—has carried out actions protecting the status quo of the \"good ole boys\" network while ignoring the working poor and African American community (\"No-Hope\").\n\nTHE DISCOVERY: The historical reporting (\"ROTTEN\", older context) revealed that Fairhope City Council President Jack Burrell was ranked as the worst elected official in Baldwin County, documented his ongoing collusion with the Municipal Judge and City Attorney, exposed his involvement in a May 2016 airport land scam, and established a multi-year track record of corruption spanning at least 7 years leading up to 2020.\n\nTHE PIVOT: Article 2 (the older widget piece) serves as the smoking gun for Article 1 because it shows that the City Council's current obstruction of Mayor Wilson—specifically the recent $2.65 million airport-area land purchase—is not an isolated incident, but rather the continuation of a documented, multi-year pattern of corrupt real estate and political maneuvering led by Council President Jack Burrell since at least 2016.\n\nKEY ENTITIES: \n- Jack Burrell (Fairhope City Council President)\n- Mayor Kant-Wilson (Mayor of Fairhope)\n- Kelly Wilson (Mayor's twin)\n- Lynn Oldshue (Investigative reporter for Lagniappe, Alabama Public Radio, administrator of Fairhope Now)\n- Pastor Chris Bell (3 Circle Church)\n- Senator Elliott"
    llm_text: Fairhope Council President Jack Burrell blocked Mayor Kant-Wilson and engineered a racist $2.65 million land scam. Read the hard evidence exposing Burrell's long-running corruption network.
