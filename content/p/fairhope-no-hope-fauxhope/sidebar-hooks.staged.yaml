  where-is-justice:
    brief: |-
      THE CONFLICT:
      - Nov. 23, 2018: Ronan McSharry knocked Paula DiNardi off of a bar stool at the Little Whiskey Christmas Club in Fairhope.
      - McSharry was in a drunken stupor; public opinion held McSharry was jealous of Paula DiNardi's success in operating the Tiki Bar at the American Legion; McSharry felt his business was suffering due to Tiki Bar popularity; he assaulted DiNardi in retaliation.
      - McSharry originally pleaded guilty to the assault March 26 in Fairhope municipal court; Ripp reported on McSharry in print and podcast for years prior.
      - McSharry was on probation at the time of the incident under penalty of 180 days in jail if he violated; violation related to harassment conviction against Nall Hollis (Fairhope's Community Treasure).
      - McSharry's appeal "denovo" from Fairhope Municipal Court of his conviction dismissed; Order issued by Judge J. Clark Stankoski, the City was outside of their time to amend the charging document, 365 days.
      - April 24, 2020: Hon. Robert Wilters, Baldwin County District Attorney, 101 Hand Avenue, Bay Minette, Alabama 36507; Ripp letter to Wilters calling on him as Chief Law Enforcement Officer in Baldwin County to "right the ship."
      - DiNardi: victim harassed, lost job, case delayed numerous times, burden of stress of case for 16 months; DiNardi is American citizen and the VICTIM; McSharry repeat offender, green card holder.
      - Attorney Harry Still, who also represented DiNardi briefly, under threat of subpoena in Civil Case DiNardi has against McSharry; Judge ordered Ripp's attorney to turn over all communication with Lagniappe Newspaper, attempt by McSharry to circumvent Alabama Source Shield Law.

      THE DISCOVERY:
      - Article 2 ("WHERE IS JUSTICE?") described the McSharry case as a classic example of good ole boy politics topped with judicial tricks.
      - Ripp Report asked Baldwin County District Attorney, among others, to investigate the recent ruling of Judge Stankowski as well as actions of Municipal Judge Snedeker and City Attorney Marcus McDowell, in reference to the McSharry case.
      - Ripp asked general public to weigh in and contact Fairhope City Council, Mayor or District Attorney, to hold someone accountable for the continued miscarriage of justice involved in the McSharry case.
      - Ripp asked whether the DA of Baldwin County would take the information to the grand jury; asked "Can McSharry be recharged? Where is any accountability?"
      - Actions of both courts and the Municipal Attorney of Fairhope called highly suspicious; citizens asked to believe that a Circuit Judge, Municipal Judge and Municipal Attorney, all experienced, made elementary mistakes.
      - Ripp confident McSharry brought to the DA's attention prior to Judge Stankowski's order.
      - Fairhope cannot find a better example of the good ole boys, CATALYST, using their CATALYST connections to protect a public nuisance like Ronan McSharry.

      THE PIVOT:
      - Article 2 is the smoking gun/key context for Article 1 because the McSharry case is the documented example of the "good ole boys" politics and judicial tricks referenced in Article 1.
      - Article 2 ends with: "Fairhope cannot find a better example of the good ole boys, CATALYST, using their CATALYST connections to protect a public nuisance like Ronan McSharry."
      - Article 1 frames the Fairhope municipal government as always representing the status quo; "POLITICS is the cause, POWER is the means."
      - Article 1: Mayor Wilson's efforts to reach out to the African American community blocked by council operating like a criminal enterprise; council's $2.65 million land purchase for recreation near Airport and not near poorer neighborhoods was political, racist and typical - a Faux hope move; Mayor's mistake was the kids were minorities.
      - Article 1: FAUX HOPE is fake, status quo, good ole boys; Faux-Hope depends on Fairhope and No Hope to maintain control; Faux-Hope is CATALYST.

      KEY ENTITIES:
      - Ronan McSharry
      - Paula DiNardi
      - Nall Hollis
      - Francis "Paul" Ripp
      - Hon. Robert Wilters, Baldwin County District Attorney
      - Judge J. Clark Stankowski
      - Municipal Judge Snedeker
      - Marcus McDowell, Fairhope City Attorney
      - Mayor Wilson (Chris Wilson), Mayor of Fairhope; Kelly Wilson, Mayor's twin
      - Fairhope City Council
      - Lynn Oldshue, Lagniappe investigative reporter
      - Pastor Chris Bell, 3 Circle Church
      - Baldwin County Judicial System
      - Harry Still, attorney
      - American Legion, Little Whiskey Christmas Club, Tiki Bar
      - Alabama Attorney General, Alabama Judicial Inquiry Commission, Alabama Bar Association, Mobile FBI
      - CATALYST
    llm_text: Ronan McSharry knocked Paula DiNardi off a bar stool in Fairhope, and The Ripp Report says the assault lit the fuse. The 'good ole boys' used judicial tricks to shield a repeat offender, and Fairhope's status quo still protects them.
