  lowery-puts-campaign-first-immigration-enforcement:
    brief: 'THE CONFLICT:

      - Sheriff Anthony Lowery is running for re-election with his campaign priority
      being IMMIGRATION ENFORCEMENT and CITIZEN SAFETY (per Widget Article title).

      - A letter from the citizens of Baldwin County, dated prior to May 19, 2026,
      alleges that BCSO has quietly stepped back from active cooperation with federal
      immigration enforcement.

      - The allegation claims this decision was made to protect Lowery''s political
      standing ahead of the election.

      - Context (Main Article): Clarence Herring, a deputy with nearly 20 years of
      service, resigned citing a culture of "retaliation, discrimination, and protection
      of unethical deputies" within a "good old boy club." He criticized leadership
      under both former Sheriff Hoss Mack and current Sheriff Lowery.


      THE DISCOVERY:

      - A signed citizen letter directly challenges the legitimacy of Lowery''s campaign
      platform (Immigration First) by alleging it is a sham used to cover up a reduction
      in actual enforcement.

      - The letter implies a direct causal link: low immigration enforcement → high
      political safety for Lowery.


      THE PIVOT:

      - Article 2 acts as the "smoking gun" because it connects Lowery''s public campaign
      promises (Immigration Enforcement First) directly to an internal operational
      change (reduced federal cooperation).

      - It suggests the Main Article''s context of institutional dysfunction in BCSO
      (Herring resignation, cultural criticism) is not isolated but tied to political
      strategy by Lowery.

      - The specific date "May 19th" provided in Article 2 anchors the timeline of
      the election and the alleged timing of the policy shift.


      KEY ENTITIES:

      - Anthony Lowery (Sheriff / Candidate)

      - Clarence Herring (Resigned Deputy)

      - Hoss Mack (Former Sheriff)

      - Baldwin County Sheriff''s Office (BCSO)

      - 30-cubed program (Infrastructure context in Main Article)

      - May 19th (Election Date mentioned in Widget Article)'
