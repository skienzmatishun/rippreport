    brief: |-
      THE CONFLICT:
      - Fairhope City Council meeting; main article frames it as a “Freaky Friday” segment.
      - City Attorney is appointed by City Council; Municipal Judge is appointed by City Council.
      - McSharry case: City Attorney failed, numerous times, in error or purpose, to defend victim; City Attorney should be fired; city will be lucky if not sued for way case handled.
      - McSharry case described as “corruption staring you in the face”; question raised: what if this was your daughter, sister, mother, or friend that was assaulted?
      - After bully council lectured about treatment of women, Councilman Boone, aka llc. Boone, yelled at Mayor and demanded Councilman Burrell immediately adjourn meeting; Burrell adjourned; Burrell cut off Mayor’s comments after Mayor pledged she would be given opportunity to speak.

      THE DISCOVERY:
