      - Article 2 states current Fairhope City Council is the most corrupt and inept council to ever serve Fairhope.
      - Article 2 states council cost Fairhope millions of dollars and made mistakes with Burrell at the helm.
      - Curfew: 10pm to 5am adopted across state, including Mobile.
      - Council raised flag of civil liberties while same council wound up in Federal Court for refusing to let a USMC combat veteran speak at council meeting; council lost.
      - Council paid Council President Burrell’s attorney fees every time they needed to extract his foot from his mouth.
      - Burrell used Airport Authority and taxpayer money to hire lawyers to investigate whistleblower; never supplied any report.
      - Burrell used Airport Authority and tax dollars to derail allegations of his involvement in bid-rigging while serving on Airport Board.
      - Burrell had police record with two sealed juvenile charges that he never exposed prior to last election.
      - Councilman Brown enjoyed lucrative contracts acquired by using elected position for personal gain.
      - Brown had pending complaint on desk of Alabama Attorney General.
      - Council Boone had more LLCs than a red head has freckles.
      - Scott Boone is Kevin Boone’s son who runs CATALYST; family connection fueled CATALYST attempt to political control Fairhope and Baldwin County.
      - Three B’s spent 2.65 million for recreation land that “only they” wanted, then leased it for 9 thousand a year for farmland.
      - City’s first analysis of budget cuts due to coronavirus was 2.65 million.
      - Council voted themselves a raise and FULL FAMILY insurance that none of city employees enjoy.
      - Council politicized coronavirus to distract.

      THE PIVOT:
