  catalyst-associates-exposed:
    brief: |-
      THE CONFLICT:
      - On April 27, 2012, Fairhope Councilman Kevin Boone announced his candidacy platform emphasizing ethics, transparency, accountability, and putting citizens first.
      - In 2012, Chris Elliott and Dane Haygood (Mayor of Daphne), along with Lynn Stacey, formed the political consulting firm Elliott, Haygood & Stacy, collecting campaign funds from candidates including Tim Kant ($22,500), Hoss Mack ($12,000), and Kevin Boone ($7,000).
      - On August 11, 2014, Scott Boone (son of Kevin Boone) and Lynn Stacey (son of the older Stacey) formed Catalyst Associates, LLC, with the stated purpose of "Any Legal Activity," following Chris Elliott's transition to County Commissioner.
      - On August 14, 2014 (just three days after formation), Judge Michelle Thomason paid Catalyst Associates $2,500 for consulting and polling as one of their first clients.
      - Historically, Kevin Boone acted against constituent interests by supporting Mayor Tim Kant's Publix/Rock Creek fire station dead-end connection, backing First Baptist Church expansion projects that altered neighborhoods without public input, dismantling the Knoll Park committee, voting for a $12.2 million Triangle Lawsuit land settlement with no development plan, eliminating the finance committee, and awarding lucrative municipal/BP boom contracts to political allies like Senator Pittman.

      THE DISCOVERY:
      - Article 2 exposes the historical formation and financial mechanics of Catalyst Associates, LLC (formed August 11, 2014, by Scott Boone and Lynn Stacey) and its political consulting/lobbying roots tied to Chris Elliott, Dane Haygood, and Lynn Stacey.
      - It documents specific early financial transactions, including Judge Michelle Thomason hiring Catalyst as a client three days after its creation ($2,500 on August 14, 2014) and candidates like Kevin Boone receiving financial backing from these political consultancy networks.
      - It established a pattern of political nepotism, conflicts of interest, and hidden municipal contractor arrangements designed to deceive voters under the guise of transparency.

      THE PIVOT:
      - Article 2 serves as the smoking gun for Article 1 because it traces the exact lineage, origins, and operational playbook of "CATALYST" referenced in the main article. While Article 1 attacks current Councilman Kevin Boone, the corrupt handling of the Ronan McSharry assault case, and the City Attorney/Municipal Judge appointments tied to Catalyst, Article 2 proves this systemic network of political self-dealing, nepotism, and shadow contracting was deliberately built back in 2014 by the exact same families and political operatives (Scott Boone, Kevin Boone, Lynn Stacey, Chris Elliott) currently running Fairhope into the ground.

