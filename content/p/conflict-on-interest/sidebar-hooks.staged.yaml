      THE DISCOVERY: The Council demonstrated a pattern of self-interest including voting themselves a $17,000/year family insurance package, attempting to convert the Triangle into a conservation easement, and Councilman Brown facing an Attorney General complaint regarding the Eastern Shore Art Center.
      THE PIVOT: Article 2 established the pattern of personal gain and disregard for public process within the council (appointing the Municipal Judge, financial irregularities), setting the historical context for the subsequent Conflict of Interest (Article 1) where the appointed Municipal Judge became the developer requiring council approval.
      KEY ENTITIES: Fairhope City Council, Municipal Judge, City Attorney, Burrell (Captain Jack Burrell), Brown (Robert Brown), Boone (Kevin Boone), National Park Service, $2.65 million, Nov. 1, 2019.
    llm_text: Burrell, Brown, and Boone approved a $2.65 million recreation land purchase on Nov. 1, 2019, without National Park Service approval or budget. Read how this land deal connects to the council's pattern of self-interest, including personal insurance packages and financial irregularities.
