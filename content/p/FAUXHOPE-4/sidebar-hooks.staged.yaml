      *   The Triangle was a "Legal Settlement" of 8.25 million, plus 3 million in guaranteed law fees from Attorney Cain O'Rear.
      *   Council and Mayor were un-elected/un-voted for their 5th year due to Alabama legislature postponing municipal elections in 2024.

      THE DISCOVERY:
      *   Article 2 revealed a historical pattern of political exclusion, failed/overbudget projects (27 million on failed/incomplete projects), and lack of democratic accountability in Fairhope governance.
      *   The 6.2 million dollar waterfront project became a political hot potato during the last municipal election, with Mayor Sullivan and Jack Burrell attempting to spin a new narrative.

      THE PIVOT:
