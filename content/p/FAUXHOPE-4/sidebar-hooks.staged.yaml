      *   OJ French killed in Bay Minette; Major Crimes Unit, with then Mayor Wills, ruled the death a "justified shooting."
      *   Stephen Nodine murder trial was a political hit piece driven by Mack, Lowery, and Newcomb.

      THE DISCOVERY:
      *   BCSO operates under a "culture of lies, wrongful incarceration, deadly shootings," characterized by blanket immunity, no transparency, and no accountability.
      *   It is legal for the sheriff to lie, but a citizen can be arrested for lying to the sheriff.

      THE PIVOT:
      *   The historical institutional lack of accountability and cover-ups within the BCSO (Article 2) mirrors the alleged developer-friendly, unchecked oversight by the City Council and Mayor in Fairhope (Article 1).
      *   Article 2 establishes a precedent of powerful figures (Lowery, Mack, Wills) protecting their interests and avoiding accountability, linking to the current allegations of unchecked development deals (e.g., Publix clear cut, waterfront project cost increase, Boone Brown/Burrell land deal).

