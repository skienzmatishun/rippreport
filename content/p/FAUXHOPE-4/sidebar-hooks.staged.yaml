  justice-denied-a-wrongful-conviction-buried-by-power-and-politics-repost:
    refined_source: 6ff971c72a1a9509f86224770936ffe123260082460ce745e5eea76e2bb0d1ba
    brief: |-
      THE CONFLICT:
      Murray Lawrence Jr. spent over 20 years in prison for a capital murder he did not commit (2005 trial).
      The prosecution relied on the word of a confessed killer, Jarius McNeil, who changed his story after being threatened with the death penalty.
      Key exculpatory evidence (no DNA, fingerprints, or murder weapon) was suppressed during the trial.

      THE DISCOVERY:
      The four men who built the case against Murray Lawrence Jr. (Robert Wilters, Anthony Lowery, Huey 'Hoss' Mack, David Whetstone) have risen to high office and maintain institutional influence (e.g., Wilters as Baldwin County DA; Lowery as Baldwin County Sheriff).

      THE PIVOT:
      Article 2 demonstrates a historical pattern of unchecked power, prosecutorial misconduct, and the failure to hold powerful figures accountable (2005-present). This precedent provides context for Article 1, where developers and Council/Mayor influence allows major projects (Publix, waterfront, airport) to proceed without oversight or transparency ("green light to do whatever the hell he pleases").

