    brief: |-
      THE CONFLICT:
      *   City of Fairhope acquired the K-1 Center and surrounding property from the Baldwin County Board of Education in 2019 for $2.5 million.
      *   Mayor Wilson secured millions for sewer infrastructure and a $6.2 million grant for waterfront improvements.
      *   Developer Stewart Speed of Leaf River Group falsely claimed apartments would be "signature," environmental sound, and never contaminate Fly Creek.
      *   Councilman Burrell acquired land near Alabama 181 and Baldwin County 48 for storm water retention and drainage.

      THE DISCOVERY:
      *   The $6.2 million waterfront grant mandated ADA compliance, which Mayor Sherry Sullivan took nearly a year to understand and concede.
      *   Initial comprehensive plans prioritized sustainable, community-driven growth, not solely developer interests.
      *   Councilman Burrell initially claimed fiscal responsibility by saving $750,000 on a retention pond.

      THE PIVOT:
      *   Article 2 establishes that the issues (waterfront delays, broken developer promises, and prioritization of development over sustainable infrastructure) were rooted in early political decisions under Mayor Wilson/Sherry Sullivan, not just recent corruption.
      *   The initial $6.2 million grant mentioned in Article 2 is the historical context for the current $10 million, 5.5-year late waterfront project detailed in Article 1.

      KEY ENTITIES:
      *   Jack Burrell (Council President)
      *   Boone Brown
      *   Councilman Jay Robinson
      *   Mayor Sherry Sullivan
      *   Mayor Wilson
      *   Stewart Speed / Leaf River Group
      *   Publix
      *   City Council
      *   Parker Road
