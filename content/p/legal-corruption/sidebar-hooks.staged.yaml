      THE PIVOT: Article 2 establishes the procedural disregard of the Fairhope Council for constituent input (three votes), which Article 1 demonstrates is exploited by Councilmen (Burrell, Brown, Boone, Robinson, Conyers) and Pittman to facilitate specific financial corruption (self-dealing, undisclosed contracts).
