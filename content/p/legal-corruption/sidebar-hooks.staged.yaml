  jack-ass:
    brief: |-
      THE CONFLICT:
      *   Senator Lee "Trip" Pittman used his position as "trustee" of BP funds to siphon off $750,000.
      *   Pittman leveraged political office to obtain heavy equipment and municipal contracts in Baldwin County and Fairhope.
      *   In 2017 (Bid No. 009-17), Fairhope City Council awarded the emergency hurricane debris removal contract to Pittman Tractor, a private business owned by Senator Pittman.

      THE DISCOVERY:
      *   Article 2 revealed that for over ten years, the City of Fairhope consistently awarded the major disaster debris removal contract to Senator Pittman's business, despite his status as an elected official.
      *   Article 2 noted that Mayor Wilson eventually had the contracts re-bid to allow fair bidding.

      THE PIVOT:
      *   Article 2 established the historical pattern of Pittman abusing his office and misusing BP funds ($750,000) through municipal contracts, providing the foundation for the contemporary corruption allegations in Article 1.
      *   Article 1 confirms Pittman's past actions by noting a former State Senator Tripp Pittman (trustee of BP funds) awarded himself $750,000 in Fairhope contracts.

