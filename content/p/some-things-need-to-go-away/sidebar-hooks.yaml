  sheriff-huey-boss-mack-secret-police-2:
    brief: "THE CONFLICT: \n- Baldwin County Sheriff Huey \"Boss\" Mack’s office (BCSO)\
      \ investigated multiple high-profile deaths of unarmed or suspicious non-suicide\
      \ persons, including:\n  - Jonathan Victor, shot and killed by BCSO in May 2017;\
      \ at the time BCSO lacked crisis intervention teams and deputies were untrained\
      \ in de-escalation.\n  - Robert Yates, shot to death March 5, 2018, after BCSO\
      \ SWAT fired over 114 rounds into his home following one warning shot; Deputy\
      \ Justin Correa (son of Robert Correa) allegedly said he was “gonna go in and\
      \ kill this f*cker if I have to”; video/audio described as “selective” by the\
      \ family.\n  - Peyton Little, found strangled with a seatbelt in a moving car\
      \ in 2017/2018 and declared suicide; BCSO investigation did not inform investigators\
      \ that Little was a confidential informant who had received threats.\n  - Kevin\
      \ J Andrews, died during a traffic pursuit contrary to BCSO policy; William\
      \ “Bill” Smith, BCSO deputy, died patrolling on a four-wheeler without a life\
      \ vest.\n- Murry Lawrence Jr. received a life-without-parole sentence for a\
      \ capital offense despite no physical evidence (no gun, witnesses, fibers, fingerprints,\
      \ blood, or DNA) and multiple alibi witnesses; Judge Scully was alleged to have\
      \ issued biased rulings favoring BCSO.\n- Sheriff Mack’s private business, Hoss\
      \ Mack Funeral Home, held a county contract to handle deceased persons under\
      \ special circumstances, creating a conflict of interest; BCSO handled internal\
      \ investigations without involving the FBI or ALEA.\n\nTHE DISCOVERY: \n- Lagniappe\
      \ legal decision published September 30, 2021, broadly interpreted Alabama’s\
      \ investigative privilege statute to exempt law-enforcement records “connected\
      \ in any way to an investigation” from public access.\n- Chief Justice Tom Parker\
      \ stated the decision “spells the end of public access to law-enforcement records\
      \ connected in any way to an investigation,” calling it effectively a “Closed\
      \ Records Act.”\n- Alabama Press Association’s Dennis Baily said the ruling\
      \ will likely limit public access to body-cam/surveillance video, 911 transcripts,\
      \ and autopsy information during investigations.\n- The decision was characterized\
      \ as a “sweeping” expansion that shields all evidence in law-enforcement possession—whether\
      \ created by or received from others—from citizens’ statutory right of access.\n\
      \nTHE PIVOT: \n- Article 2’s Lagniappe ruling effectively closes public oversight\
      \ into the BCSO incidents and deaths detailed in Article 1 (Victor, Yates, Little,\
      \ Andrews, Smith, Lawrence).\n- Because those investigations are “connected\
      \ to an investigation,” their records—including potentially incriminating video,\
      \ audio, or testimony from Mack, Correa, Judge Scully, or the legal decision\
      \ process—are now legally shielded from public scrutiny.\n- Article 1’s allegations\
      \ of selective video release, untrained officers, conflicts of interest (Correa\
      \ family involvement; Hoss Mack Funeral Home contract), and biased judicial\
      \ rulings become unverifiable to the public once Article 2 strips their transparency\
      \ foundation—making the Lagniappe decision the legal “smoking gun” that entrenches\
      \ BCSO impunity.\n\nKEY ENTITIES: \n- Huey \"Boss\" Mack (Baldwin County Sheriff)\n\
      - Justin Correa, Robert Correa (BCSO deputy/father)\n- Jonathan Victor (unarmed\
      \ deceased)\n- Robert Yates (deceased; 114+ rounds fired by SWAT)\n- Peyton\
      \ Little (alleged confidential informant, strangled suicide declaration)\n-\
      \ Kevin J Andrews (traffic pursuit death)\n- William “Bill” Smith (deputy, four-wheeler\
      \ fatality without life vest)\n- Murry Lawrence Jr. (life sentence; no physical\
      \ evidence; Rebbeca Chambliss counsel)\n- Judge Scully (alleged biased rulings\
      \ favoring BCSO)\n- Tom Parker (Alabama Chief Justice)\n- William Cassady (U.S.\
      \ District Court Judge)\n- Dennis Baily (APA Chief Legal Counsel)\n- Jonathan\
      \ Victor, Robert Yates, Peyton Little, Kevin J Andrews, Murry Lawrence Jr.,\
      \ Rebbeca Chambliss, Hoss Mack Funeral Home, Lagniappe case"
