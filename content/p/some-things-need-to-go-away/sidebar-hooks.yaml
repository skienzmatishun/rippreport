  anonymous-bb:
    brief: 'THE CONFLICT:

      - Baldwin County Sheriff’s Office (BCSO) operated under Hoss Mack’s culture
      for nearly 20 years, functioning as a "cabal" supporting the GOB rather than
      serving citizens.

      - The BCSO embedded judges in the judicial system who prioritized loyalty to
      BCSO culture over justice.

      - A conspiracy between Sheriff Hoss Mack, DA Robert Wilters, Judge Kristi Hagood,
      and Prosecutor David Whetstone resulted in the wrongful conviction of Murray
      Lawrence Jr. (imprisoned for 20 years) due to withheld evidence and deceptive
      testimony.

      - The death of O J French was covered up by the BCSO Major Crimes Unit after
      he was killed over a tail light violation.

      - Robert Yeats died after a five-hour siege by the BCSO involving an armored
      BearCat vehicle, tear gas, and firing over 100 rounds through his residence;
      BCSO refused to mediate with the family prior to the fatal action.


      THE DISCOVERY:

