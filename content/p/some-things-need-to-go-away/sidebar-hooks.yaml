      third-party source confirming the corruption allegations.

      - BB confirms the "conspiracy" in the Lawrence case, citing Whetstone’s admission
      that he knew Lawrence was innocent while deceiving the jury about a legal autopsy.

      - BB details the Yeats case, noting that Deputy Justin Correa (son of Robert
      Correa) participated despite his father warning him; Younger Correa stated he
      was “gonna go in and kill this f*cker if I have to.”

      - BB documents the use of Kristi Hagood’s Affidavits of Interview (A-I) containing
      factual inaccuracies to support Rule 32 statements, resulting in innocent men
