      used the utility fund as a slush fund to balance the general fund and pay for
      lawsuits.

      - This misuse led to loss of best senior utility supervisor position (to Daphne)
      and $3 million in attorney fees.

      - Simultaneously, no sewer infrastructure work was done despite the electrical
      department''s efforts.


      THE DISCOVERY:

      - Article 1 (Main Article) alleges the infamous poop incident involved sewage
      from pier bathrooms undergoing renovation.

      - Article 1 claims George Robards (contractor) has conflicts of interest due
      to his work with the City, Single Tax Colony, and holding a Planning and Zoning
      seat.

      - Article 1 alleges Mayor Kant blamed geese while the source suggests sewage
      origin.


      THE PIVOT:

      - Article 2 (Widget) frames the current issues by proving systemic corruption
      existed under Mayor Can’t, establishing a pattern of willful neglect regarding
      sewer infrastructure that persists.

      - Article 2 positions Mayor Wilson''s current efforts as necessary corrections
      against the documented historical failure of the previous administration.


      KEY ENTITIES:

      - George Robards

      - Mayor Kant

      - Lee Turner

      - Boone (Councilman)

      - Burrell (Councilman/President)

      - Mayor Can’t

      - Karin Wilson'
