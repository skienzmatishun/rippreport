  fairhope-epicenter-corruption:
    brief: |-
      THE CONFLICT: Systemic "good ole boy" corruption in Fairhope, involving Mayor Tim Kant, Lee Turner (President of Planning and Zoning and head of Single Tax Colony), and George Robards (major contributor to Kant and P&Z member). This corruption includes investigations into BP grant fraud and the approval of a $12 million triangle lawsuit settlement without public notice.
      THE DISCOVERY: The infamous beach "poop" incident was not human waste, but geese droppings. Mayor Kant ordered the sample collection via sewer plant employees, not Auburn or ADEM, despite public claims otherwise. The source was identified as raw sewage from the pier bathrooms renovation, contracted by George Robards.
      THE PIVOT: Widget Article (Fairhope corruption) establishes the historical pattern of conflict of interest (Kant/Turner/Robards leveraging P&Z for contracts); Main Article (beach poop) provides a concrete, recent example where this pattern directly compromised public health via the pier/sewer system due to Robards' contracting and the city's lack of oversight.
      KEY ENTITIES: Mayor Tim Kant, Lee Turner, George Robards, Fairhope, Auburn, ADEM, Senator Trip Pittman, Jennifer Fidler, Jack Burrell, Mike Ford, Kevin Boone
    llm_text: Mayor Tim Kant and Lee Turner exploit Fairhope's planning system, fueling conflicts with George Robards. Robards' pier renovation caused raw sewage—not goose droppings—directly compromising public health.
