      Council President Jack Burrell has held the title for over 7 years; Burrell led the City Council to override the Mayor’s veto over the Fly Creek extension of the zoning.
      Burrell and Councilman Boone favored the developer of Fly Creek apartments by accepting a parcel of wetlands land at the foot of the Fly Creek Hwy 98 culvert.
      A federal lawsuit was lost by the Council due to refusal of public participation.
      Council President Burrell has a previously hidden Police Report.

