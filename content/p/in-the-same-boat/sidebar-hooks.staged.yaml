  fact-hardest-working-elected-city-official-eastern-shore-fairhope-mayor-karin-wilson:
    brief: |-
      THE CONFLICT: Fairhope had major infrastructure and sewer problems developed over many years of neglect; Councilman Boone and Burrell spent $13 million on a sewer plant next to the Bay and $22 million they could have relocated the plant inland.
      THE DISCOVERY: Mayor Karin Wilson of Fairhope was recognized as Eastern Shore's hardest working elected official (2017-2019) for promising to fix sewer/utility infrastructure.
      THE PIVOT: Article 2 establishes the long-standing infrastructure neglect and Mayor Wilson's initial commitment/action plan ($11M in RESTORE funding starting in 2019) against the backdrop of past council inaction (Boone/Burrell), providing context for the current political conflict involving Mayor Wilson and Baykeeper.
