  letter-of-concern:
    brief: |-
      THE CONFLICT:
      - Fairhope had major infrastructure and sewer problems before Mayor Karin Wilson (referred to in the main article as “Mayor Can’t”) ran for office.
      - Mobile Baykeeper was contacted time and time again through the years about various issues; the author of the main article called.
      - Baykeeper never did anything about the Publix project, the flooding of Fly Creek by the developer, or the filling of Fly Creek with development site mud and sand.
      - Then came the Fly Creek Apartments to be built along Fly Creek; hundreds opposed the project; Baykeeper did NOT answer the phone.
      - Private citizens sued the City over some of these issues while Baykeeper’s phone was off the hook.
      - Mayor and Baykeeper did nothing but use air and talk “crap.”
      - The Mayor produced a Timeline, dating back to 2016, outlining the Mayor and staff’s due diligence.

      THE DISCOVERY:
      - Article 2, titled “Letter of Concern,” dated August 7, 2019, from Mayor Karin Wilson to Casi Callaway, CC: Mobile Baykeeper Board of Directors.
      - Wilson stated she could no longer sit back and allow the City’s reputation to suffer while Mobile Baykeeper continues to share sensationalized “news” releases without transparent facts.
      - Wilson cited failure to respond to her email from July 30, 2019, after the most recent news release concerning a video of a “mysterious” substance as the straw that broke the camel’s back.
      - Wilson stated that when she ran for Mayor, she communicated critical needs for infrastructure upgrades in all four utilities and the sense of urgency due to the City’s unprecedented growth; lack of strategic planning motivated her to do something about it.
      - The announcement which ultimately reported the fact there was no SSO from Fairhope or Daphne was written in typical Baykeeper fashion – to mislead the reader and promote scare tactics.
      - Citizens rely on responsible updates and articles that include progress and work being accomplished; after reading most of Baykeeper’s news, readers are left with misguided anger directed at the very people who are actually working on solutions.
      - The City had been inundated with emails, mail and calls which distracted City employees and took valuable time away from the work your organization is complaining about; all because all the facts are not being shared.
      - The City of Fairhope is doing more than ever to improve water quality and protect environmentally sensitive watersheds; the City is taking responsibility for its role in upgrading its entire sewer system.
      - There was no plan in place before Wilson took office; there was no funding in place for the massive needs; in less than three years, both are in place and work has begun.

      THE PIVOT:
      - Article 2 is the “smoking gun” or key context for Article 1 because it is the Letter of Concern dated August 7, 2019, in which Mayor Karin Wilson directly pushed back against Mobile Baykeeper’s news releases and failure to respond to her July 30, 2019 email.
      - The letter frames Baykeeper’s actions as sensationalized and misleading, and provides the Mayor’s timeline as background for the long-term utility neglect.
      - Article 1 describes Baykeeper Director Casi Callaway as being in damage control for grabbing headlines and NOT using the phone; the Letter of Concern is the formal Mayoral response that sets up the conflict over facts, infrastructure, SSO claims, and transparency.
      - Article 1 states Casi and Jack know the time allocated and agenda procedure was politically motivated to blindside the Mayor; the Letter of Concern is the document from the Mayor’s side preceding the later council meeting actions described in Article 1.

      THE KEY ENTITIES:
      - Mayor Karin Wilson, City of Fairhope.
      - Casi Callaway / Casi Calloway, Director of Mobile Baykeeper.
      - Jack Burrell, Council President, Fairhope.
      - Debbie Quinn.
      - Sherry Sullivan.
      - Mobile Baykeeper.
      - City of Fairhope.
      - Fly Creek.
      - Publix project.
      - Fly Creek Apartments.
      - Council President Burrell.
      - Public Participation.
      - Mayor Can’t.
      - Dates: August 7, 2019; July 30, 2019; 2016; seven years; less than three years; 2020.
    llm_text: Mayor Karin Wilson’s 2019 Letter of Concern called out Casi Callaway and Mobile Baykeeper for sensationalized claims. Fairhope’s sewer fight over Fly Creek and the Publix project now shows why facts and transparency matter.
