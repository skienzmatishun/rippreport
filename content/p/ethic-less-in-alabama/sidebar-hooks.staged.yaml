    brief: |-
      THE CONFLICT:
      *   April 2010 BP Oil Spill triggered the "Oil Spill 2010" contract process in Fairhope.
      *   In May 2010, Mayor Timothy Kant and Senator Lee "Trip" Pittman, with Fairhope City Staff assistance, allegedly conspired to give the $625,575.00 boom contract to Pittman Tractor on June 17, 2010.
      *   Pittman Tractor secured the contract despite lacking a General Contractor's License (not issued until May 7, 2012).
      *   The contract was initially secured by Pittman Tractor in 2004, 2007, and 2010.
      *   In 2014, the City of Fairhope sought renewal for the "Disaster Debris Removal and Disposal" contract (bid 009-12), which was renewed via an attached letter from the Alabama Ethics Commission on July 17, 2014.

      THE DISCOVERY:
      *   Article 2 reveals the 2010 contract was achieved via a conspiracy involving Kant, Pittman, and Director Leigh Ann Ryals, after Baldwin County staff advised against the contract.
      *   Article 2 documents the 2014 contract renewal process involved rejecting four bids (highest at $1,999,537.50) before renewing Pittman's previous 2012 contract at approximately $1 million.

      THE PIVOT:
      *   Article 2 establishes the historical precedent (2010 conspiracy) of Pittman using influence and lacking proper licensing for public gain.
      *   Article 1 shows this pattern continued into 2012 (July 10, 2012 bid 009-12) and 2014 (July 17, 2014), demonstrating the Alabama Ethics Commission, under Hugh Evans, actively assisted in the final 2014 contract extension, confirming the alleged misuse of public office for personal gain.

