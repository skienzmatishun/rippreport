  criminal-conspiracy-lynn-stacy:
    brief: |-
      THE CONFLICT:
      *   2004: Senator Lee "Trip" Pittman (Pittman Tractor) served as the hurricane debris removal contractor for the City of Fairhope.
      *   2007: Pittman was elected.
      *   2007-2010: Pittman was the low bidder on a two-year debris removal contract with Fairhope, later extended through July 14, 2010.
      *   2010: Pittman won the $625,575.00 Public Works Contract ("Oil Spill 2010").
      *   Pre-May 7, 2012: Pittman conducted business with the City of Fairhope without a required General Contractor's License (license issued May 7, 2012).
      *   July 10, 2012: Pittman bid on contract 009-12 (Disaster Debris Removal and Disposal).
      *   April 20, 2013: Fairhope renewed the first extension of contract 009-12.
      *   September 19, 2013 / October 17, 2013: Pittman leased a wheel loader for $3,826.78 (Bid 024-09, part of a rent-to-buy plan of $129,448.84).
      *   July 17, 2014: The Alabama Ethics Commission (presided over by Hugh Evans) attached a letter to Senator Pittman's Tractor bid for contract extension in Fairhope.

      THE DISCOVERY:
      *   Baldwin County politics were dominated by a machine led by Lynn Stacy, whose strategy involved selecting political consultants (Chris Elliott) and sub-contractors (elected officials/supporters) to cement financial control through lucrative state, city, and county contracts.
      *   Pittman's actions (winning debris removal contracts despite prior scandal/statements against it) were part of this established pattern of corruption.

      THE PIVOT:
      *   Article 2 established the systemic, decades-long pattern of political figures (Lynn Stacy, Pittman) using office and inside information to obtain contracts, which frames the 2014 actions (AEC assisting Pittman in contract extension) not as isolated incidents, but as the continuation of a perfected, corrupt political methodology in Baldwin County.

