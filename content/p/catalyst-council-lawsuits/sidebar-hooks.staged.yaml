hooks:
  fairhope-going-backwards:
    brief: |-
      THE CONFLICT:
      - Triangle lawsuit: Fairhope’s insurance company sued the city while the Triangle lawsuit was going on, claiming the city’s bad decisions led to the lawsuit and the insurer would not cover legal expenses.
      - City attorney for Triangle lawsuit: Cain O’Rear. He came to a council meeting, held his right hand high, and promised the city would not have to spend a dime on attorney fees.
      - Fairhope paid Cain O’Rear’s firm $3 million; lost the lawsuit; had to pay $8.25 million for the property as a legal settlement.
      - Councilman Burrell denied this for years and claimed it was a voluntary purchase for a park; outright lie.
      - Approximately 12 years ago: Private investigator was negotiating a settlement between Triangle owners and the city council; figure was about $600,000. Council and Mayor Cant refused to negotiate. It ended up costing $11.25 million, not counting interest and lost opportunity.

      - Breland case: mirror image; case goes back over 12 years ago. Cant stopped the project without cause, then changed zoning rules after the fact. When Wilson became Mayor, she wanted to see if it could be settled. Council refused and insisted it fall into a black hole of litigation.
      - About 3 years ago: PI negotiated with Mr. Breland; Breland said if Fairhope would let him proceed, he would pay legal fees, give 40 acres in perpetuity for a park or conservation easement, and comply with conditions. Council refused.
      - Now insurance company is saying the Breland lawsuit was arbitrary and capricious; court agreed; Fairhope, win lose or draw, has to pay attorney costs; fees could be well over $1 million.
      - Because council was so bullheaded, Fairhope is in much worse situation. If Supreme Court rules in Breland’s favor, could be any day; Breland will have legitimate claim for damages that could result in many millions of dollars.
      - Both Triangle and Breland cases are results of good ole boys circumventing law at citizens’ expense. Councilman Robinson property is next to Breland property; Robinson did not want any development in his backyard. Burrell is real problem, not good businessman, horrible negotiator; allowed case to fester to point it will cost Fairhope millions.
      - Every time Mayor Wilson tried to bring it to the table, council pounced and refused to listen. $11.25 for Triangle and now millions more on Breland lawsuit. Add $2.65 million recreation property, $500,000 clock, full family insurance, and another half dozen issues; council has cost taxpayers millions.
      - Make no mistake: both issues are owned by City Councils, past and present. Breland case squarely on CATALYST council’s head. Jack Burrell is costing citizens millions.

      THE DISCOVERY:
      - Article 2, titled FAIRHOPE GOING BACKWARDS?, is older and should be framed as background/historical context.
      - In 2016, PI backed Karin Wilson and the current city council, which includes Burrell Boone and Brown. PI got one out of four right, Karin Wilson. PI was wrong in trusting Burrell, Boone, or Brown but wanted to believe they were independent individuals with only Fairhope’s best interest at heart. All three betrayed Fairhope and used elected office for personal gain.
      - In 2020, PI is again backing Mayor Wilson, who deserves another term to finish many projects started in first term.
      - Fairhope has 4 candidates running for Mayor, 3 with college degrees, one, Sullivan, with a high school education.
      - Oil Slick candidate / “good Vibes” BP guy on paddle board; wants you to forget BP Oil Spill and corruption it spawned in Fairhope; “good Vibes” message on paddle board.
      - Former Mayor and former State Senator, while Sullivan was employed, stole $639,000 of BP grant money.
      - Sullivan was fired in 2017; since then has had three jobs and resigned from last. Worked for city, internet company, Foley Main Street, and most recently Riviera Utilities, where resigned. One job a year for 4 years? Think about that.
      - Mayor Wilson has degree in finance, small business owner, used degree for 25 years. Mayor Wilson has been Mayor for 4 grueling years subjected to bullying, lying and deceit, delivered by CATALYST council.
      - Citizens of Fairhope had better use their education and decide on a Mayor with experience and education.
      - Sullivan proudly represents Catalyst, who is sponsoring her; get even attitude will result in multiple firings in city hall if elected. Since 2016, Sullivan has worked for city, internet company, Foley Main Street, and most recently Riviera Utilities, where resigned. One job a year for 4 years? Think about that.
      - Mayor Wilson reversed annual $6 million debt to fiscal health. Increased city and utility cash funds 59.18% to $17 million. Paid off city long term debt and paid down utility debt 33%. Mayor obtained $23 million in grants and restoration funds. Mayor introduced responsible growth objectives and came up with infrastructure revitalization plan, without borrowing money. Increased citizen engagement. Accomplishments rewarded with 4 Nappi Awards, For The Hardest Working Elected Official on the Eastern Shore.
      - CATALYST and the three B’s have never received any awards.
      - Thing that has election so hot is Mayor Wilson, in addition to above, scrutinized, identified, and eliminated wasteful contractors. She successfully stopped majority of corruption within city hall. Wasteful contractors represent CATALYST, supported by three B’s, Burrell Boone and Brown. They want control and want Sullivan to carry the water.
      - Re-electing the 3 B’s and electing a high school graduate, who is a fired employee of the city, that sued the city, without ever explaining why, is “GOING BACKWARDS”. Use your education to determine best EDUCATED and QUALIFIED candidates. This is a municipal election not a popularity contest.
      - Study signs in Fairhope: CATALYST/Scott Boone candidates all have signs together; they want a CATALYST block vote. If you have a Catalyst Mayor and a Catalyst council, guaranteed corruption. CATALYST is run by councilman Boone’s son, Scott, inside deal.
      - Three incumbent city councilmen, 3 B’s, face challengers next week. Jack Burrell, Robert Brown and Kevin Boone will face Deb Hokpkins, Howell Gibbens and Joshua Gammon on ballot, respectively.
      - Hopkins, Gibbens, and Gammon represent new fresh candidates with no ties to CATALYST. Fairhope City Council will have opportunity to rid itself of CATALYST and self-serving B’s.
      - Special on CATALYST three B’s and their accumulative corruption while in office will be featured soon.

      THE PIVOT:
      - Article 2 is older than Article 1; frame it as background/historical context.
      - Article 2 showed/revealed the PI’s 2016 backing of Karin Wilson and current city council including Jack Burrell, Robert Brown, and Kevin Boone; 2020 backing of Mayor Wilson; Sullivan candidacy; CATALYST; BP oil spill; corruption; mayoral qualifications.
      - Article 2 is the key context for Article 1 because it establishes prior political alignment, trust, and betrayal before the later Triangle/Breland litigation focus.
      - Article 2 acts as smoking gun/context for Article 1’s claims that CATALYST council, Jack Burrell, Mayor Wilson, Sullivan, and council actions cost Fairhope millions.

      THE KEY ENTITIES:
      - Names: Karin Wilson, Jack Burrell, Burrell Boone, Robert Brown, Kevin Boone, Scott Boone, Sullivan, Cain O’Rear, Mayor Cant, Councilman Robinson, Mr. Breland, Mayor Wilson.
      - Organizations: Fairhope City Council, CATALYST, City of Fauxhope/Fairhope Alabama, Fairhope insurance company, Cain O’Rear’s firm, Triangle lawsuit, Breland case, BP Oil Spill, BP grant, Riviera Utilities, Foley Main Street.
      - Locations: Fairhope, Alabama, Fauxhope, Triangle property, Breland property, City Council, BP oil spill.
      - Dollar amounts: $600,000, $3 million, $8.25 million, $11.25 million, interest and lost opportunity, $2.65 million, $500,000 clock, full family insurance, $639,000 BP grant, $6 million debt, $17 million, 59.18%, 33%, $23 million, 4 Nappi Awards.
      - Dates/titles: Triangle lawsuit, approximately 12 years ago, Breland over 12 years ago, about 3 years ago, 2016, 2017, 2020, Aug. 26th, Mayor Wilson 4 years, Mayor Cant, Councilman Burrell, Councilman Robinson, Councilman Jack Burrell, Councilman Robert Brown, Councilman Kevin Boone, CATALYST, Mayor Sullivan.
