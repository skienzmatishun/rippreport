      *   This institutional resistance from the "CATALYST" council (past and present) directly led to the current negative outcomes in Article 1: the failure to settle the Triangle case efficiently ($11.25M cost), the refusal to negotiate the Breland settlement, and the resulting insurance company denial of coverage, forcing the city to pay over $1 million in attorney fees.

