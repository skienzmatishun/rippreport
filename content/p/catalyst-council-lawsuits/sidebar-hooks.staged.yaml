      *   This "CATALYST" council actively thwarted the new Mayor Wilson's efforts to improve planning and growth management.
      *   Article 2 identified Councilman Jack Burrell as the 8-year council president and a central figure in the alleged corruption (e.g., lying about the Triangle lawsuit, purchasing $2.65 million in farmland).

      THE PIVOT:
