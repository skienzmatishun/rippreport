  alabama-education-accountability-act:
    brief: 'THE CONFLICT:

      - Former Governor Robert Bentley signed/defended the Alabama Education Accountability
      Act.

      - House Speaker Mike Hubbard was under three grand jury investigations.

      - Mobile mayor Tim Kant and state senator Trip Pittman had a BP grant scandal
      involving an illegal emergency boom contract; they were subpoenaed into federal
      court for fraud, coverup, and witness intimidation charges.

      - Representative Chad Fincher and Senator Trip Pittman promoted the Education
      Accountability Act, which took $40 million from education funding for 52 qualified
      students statewide.

      - Mike Odom of the Fairhope Courier stopped reporting local news; the paper
      was described as “history” after its demise.


      THE DISCOVERY:

      - Governor Bentley admitted he did not read the entire bill; it entered committee
      as 8 pages and emerged as 28 pages with changed meaning and focus.

      - No one in the legislature was notified about the substantive changes, violating
      Rule 21.

      - The Act shifted money to Republican households as tax credits away from failing
      schools.

      - The fiscal impact was over $300 million from the Education Trust Fund.

      - Senator Trip Pittman took a $750,000 BP grant while officially working as
      a retail tractor salesman; he oversaw distribution of the funds for personal
      gain.

      - Tim Kant assisted Pittman in obtaining the illegal contract and tried to cover
      it up.

      - The Ethics Commission allowed Pittman to take the grant despite rules limiting
      gifts, such as teachers not receiving gifts over $25.


      THE PIVOT:

      - Article 1 treats Bentley’s Education Accountability Act as “disgraceful” and
      blames Fincher and Pittman.

      - Article 2 proves the “Accountability Act” was a deceptive legislative maneuver
      with undisclosed changes and a $300 million tax-transfer plan, making Pittman
      and Bentley the central accountability case.

      - Article 2 supplies the factual proof that the Act was a political scheme against
      public schools, supporting Article 1’s critique of Bentley, Pittman, Fincher,
      and the Republican legislature.


      KEY ENTITIES:

      - Robert Bentley (Governor)

      - Trip Pittman (State Senator)

      - Chad Fincher (Representative)

      - Mike Hubbard (Speaker of House)

      - Tim Kant (Fairhope Mayor)

      - Luther Strange (Attorney General)

      - Matt Hart (Special Prosecutor, White Collar Crime and Political Corruption)

      - Mike Odom (Editor/Owner, Fairhope Courier)

      - Wells Griffith (Congressional Candidate)

      - F.P. Ripp / Paul Ripp (Author/Publisher)

      - Fairhope Courier

      - Mobile Register

      - Birmingham News

      - Alabama Ethics Commission

      - BP (Bureau of the National Guard/Boys Scouts? Use “BP” as written in text)'
