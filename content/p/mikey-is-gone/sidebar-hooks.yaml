hooks:
  alabama-political-corruption-exposed:
    brief: 'THE CONFLICT:

      - Mike Odom, publisher of the Fairhope Courier, is leaving; the paper calls
      itself a “no-news” status-quo operation that cut its own throat by reporting
      no news.

      - Alabama Governor Robert Bentley is attacked as costing taxpayers billions
      while claiming to save millions.

      - The Alabama Education Accountability Act is described as theft: $40 million
      removed from education for only 52 qualifying students statewide.

      - Representatives Chad Fincher and Senate candidate/representative “Trip” Pittman
      are blamed for that education legislation.

      - Medicaid is cited as $1.5 billion in income for three years, with 300,000+
      recipients (half children) and 15,000 new jobs at risk if Bentley leaves it
      “on the table.”

      - The Mobile Tar Sands Pipeline / BP corruption and a no-bid state park project
      in Gulf Shores are listed as political scandals.

      - Mike Hubbard, Alabama Speaker of the House, is described as under three grand
      jury investigations.

      - Matt Hart, special prosecutor for White Collar Crime and Political Corruption
      at the Alabama Attorney General’s Office, is said to be investigating Mayor
      Tim Kant and Trip Pittman.

      - Attorney General Luther Strange is cited for an alleged extra-marital affair
      with a former campaign manager; opponents demand his resignation if true.


      THE DISCOVERY:

      - Article 2 confirms that the federal case involving Mayor Tim Kant and Senator
      Lee “Trip” Pittman over BP corruption is pending under special prosecutor Matt
      Hart, who heads the Special Prosecutions Division at the Alabama Attorney General’s
      Office.

      - Hart is also described as the lead investigator on Mike Hubbard, who faces
      three federal grand jury investigations connected to a questionable $13 million
      education software contract steered to a Florida company.

      - Hubard is accused of “Republican Revolution” machinations, shady dealings
      with Auburn University sports media contracts, and forcing lawmakers to use
      his money for campaign materials from a company he owned.

      - Luther Strange announced he recused himself from the Kant/Pittman investigation
      because of an alleged long-running affair with a former campaign manager; Hart
      now effectively has AG-level power and is working closely with federal investigators.

      - Former Governor Bob Riley allegedly steered $37.2 million in BP money to Brett-Robinson
      in Gulf Shores just before Bentley took office, then registered as a lobbyist
      for Brett-Robinson; about $65 million in BP disaster-related payments were unaccounted
      for.

      - Robert Bentley is identified as president of the pro-oil Interstate Oil and
      Gas Compact Commission, and his $85 million no-bid Gulf Shores state park project
      is tied to oil resources despite him suing the company he represents.

      - Baldwin County’s open congressional seat was not sought by Kant or Pittman;
      the “machine” reportedly chose a 31-year-old, Washington-insider, Mobile-native
      candidate instead because Kant/Pittman were viewed as “unelectable.”


      THE PIVOT:

      - Article 2 turns Article 1’s general allegations of “politics,” “corruption,”
      and “media silence” into named federal investigations, dollar amounts, and institutional
      accountability failures.

      - It proves the “machine” is not just talking but actively under federal investigation:
      Kant/Pittman (BP money), Hubard ($13M education/software case), Strange (recusal
      over alleged affair), Riley (BP lobbying/payments), Bentley (OGCC/no-bid park/Medicaid).

      - Article 2 explains why the Fairhope Courier and similar local papers “died”:
      they were either controlled or afraid of reporting these federal investigations,
      while bloggers like alreporter.com, Rickystokes.com, and Legal Schnauzer exposed
      what mainstream outlets ignored.

      - Strange’s recusal makes Matt Hart the de facto AG on state political corruption,
      directly validating Article 1’s claim that “the crazy and unstable” Hart is
      the real prosecutor behind Bentley’s machine.


      KEY ENTITIES:

      - Mike Odom

