      THE CONFLICT:
      *   I-10 is a 2,460.34-mile federal highway running through 8 states (Santa Monica, CA to Jacksonville, FL).
      *   Alabama planned to install the only toll on I-10, making Alabama the "toll bridge state."
      *   Initial political leaders, including Jack Burrell (Eastern Shore MPO Chairman), were involved in seeking federal funding.
      *   During MPO meetings, 6 out of 8 speakers stated federal money was needed, contrary to earlier positions.
      *   The project faced opposition from the Alabama Trucking Association (Mark Colson) due to potential truck-only tolls violating the Commerce Clause (as argued in a Rhode Island federal lawsuit).

      THE DISCOVERY:
      *   Article 2 established that initial political sponsors (MPOs) had previously maintained that federal funding was needed for the project, despite their earlier opposition to federal involvement.
      *   Article 2 documented that federal infrastructure funding was dwindling due to Republican bill reductions, making the bridge proposal difficult to achieve in the current legislative cycle.

      THE PIVOT:
      *   Article 2 shows the initial context where MPO leaders were seeking federal aid while simultaneously advocating state autonomy; Article 1 reveals that this stance shifted, resulting in the implementation of a toll that now includes passenger vehicles, not just truckers.
      *   Article 2 provided the background of the MPO's changing position, which contradicts the strong 10th Amendment stance adopted by Mo Brooks in Article 1.

      KEY ENTITIES:
      *   Mo Brooks (U.S. Senate candidate)
      *   Jack Burrell (Eastern Shore MPO Chairman)
      *   Mark Colson (President and CEO, Alabama Trucking Association)
      *   MPO (Metropolitan Planning Organization)
      *   I-10
      *   Alabama
      *   Tommy Tubberville (Senator)
      *   Lottery (Alabama did not participate, leaving $3.2 billion on the table)
      *   Marijuana legalization (Neighboring states benefit billions; Alabama is studying feasibility)
