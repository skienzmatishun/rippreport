    llm_text: Mayor Wilson and Councilman Ford voted against the 240 Fly Creek apartments on Arthur Corte's land on Dec 7, yet the city paid $11.25 million in a blindsided Triangle lawsuit. Does the council remember past decisions when they now extend the development by 120 days?
