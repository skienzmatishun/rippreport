      *   Robert Brown
      *   Mayor Wilson
    llm_text: Leaf River and Corte misrepresented Fly Creek drainage and red soil use to secure PUD approval from the City of Fairhope Planning Commission. This deception caused nearly $1M in tree damage and resulted in a $11.25M settlement for Corte, questioning the council's commitment to fairness today.
