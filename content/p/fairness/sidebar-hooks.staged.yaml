  balls:
    brief: |-
      THE CONFLICT:
      *   Between January 2016 and October 2016, Defendants Leaf River and Corte sought approval for the Fly Creek PUD Amendment through the City of Fairhope Planning Commission and City Council.
      *   The project resulted in Fly Creek being filled with red mud and violations, including the tree ordinance (estimated damage nearly $1 million).
      *   Corte and former Mayor cost $11.25 million in the triangle lawsuit, settled without public participation.

      THE DISCOVERY:
      *   Leaf River and Corte misrepresented key facts during the PUD Amendment review, specifically regarding drainage and red soil usage.
      *   They claimed the drainage system was environmentally sensitive (non-point discharge) when they planned a point discharge system into a deficient retention pond.
      *   They claimed the Red Soil Ordinance #1423 would not apply to the entire site, when they planned to move red soil (clay/silt) from non-critical to critical areas within 100' of wetlands/Fly Creek, violating the ordinance.

      THE PIVOT:
      *   Article 2 proves the Fly Creek PUD Amendment was based on material non-disclosure and misrepresentation, not legitimate planning, validating the concerns about the project's inherent flaws raised in Article 1.
      *   This historical failure provides context for current council votes (e.g., extension of the sunset clause) and questions the council's current commitment to "Fairness" given past violations and settlements.

      KEY ENTITIES:
      *   Corte
      *   Leaf River
      *   Fly Creek
      *   City of Fairhope Planning Commission
      *   City Council
      *   Burrell
      *   Angelo-Corte
