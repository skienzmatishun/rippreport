    brief: |-
      THE CONFLICT:
      1.  December 7th: Planning and Zoning in Fairhope met regarding the controversial Fly Creek PUD (Planned Unit Development).
      2.  The project proposed 240 "upscale apartments" on land owned by Arthur Corte (a non-resident of Fairhope).
      3.  The original proposal sales point stated NO apartments would be developed in the PUD.
      4.  The Mayor voted against the project, resulting in a 5 no 4 yes vote (supported by Councilman Ford and Jennifer Fiddler).
      5.  The Triangle lawsuit settlement occurred without public participation, costing the city $11.25 million (including $3 million in attorney fees).

      THE DISCOVERY:
      1.  Article 2 revealed that the initial public outcry against the apartment development on Fly Creek led to a successful vote against the PUD on December 7th, and highlighted the historical lack of public notification during the $11.25 million Triangle lawsuit settlement.

      THE PIVOT:
      1.  Article 2 establishes that Mayor Wilson (and supporting council members) previously stood against the project (Dec. 7th vote), contrasting with the current situation where four councilmen voted for a 120-day sunset clause extension for the developer (Main Article).
      2.  Article 2 provides context for the pattern of "BLINDSIDE" decisions (e.g., the Triangle lawsuit lack of public notification) that the Main Article cites when questioning the council's fairness.

      KEY ENTITIES:
      1.  Arthur Corte
      2.  Mayor Wilson
      3.  Robert Brown
      4.  Councilman Pittman
      5.  Councilman Boone
      6.  Councilman Ford
