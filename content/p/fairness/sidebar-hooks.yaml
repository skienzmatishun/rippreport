  a-legal-win-for-fairhope-citizens-who-oppose-fly-creek-apartments:
    brief: |-
      THE CONFLICT
      - Fly Creek Apartments development project on land in Fairhope, Baldwin County, led by developer Arthur Corte (also tied to Triangle property and the Publix red-mud site)
      - Citizens in Fairhope opposed the project; citizens packed the city council chambers for the 10th time
      - Councilmen voted to extend the sunset clause giving the developer 120 more days to get a multiple occupancy site plan
      - Robert Brown (Mr. Brown) spoke glowingly of his relationship with Corte before the vote and should have recused himself
      - Mr. Boone has a business relationship with Corte and the engineer company
      - Corte and former Mayor cost Fairhope $11.25 million in the "triangle lawsuit," settled with council help including Burrell (Beavis) and Boone (Butthead)
      - Council favored the developer over citizens on each of the 10 meetings

      THE DISCOVERY
      - "Friends of Fly Creek" (citizens opposing the apartments, plaintiffs) sued the City of Fairhope, Fairhope Planning and Zoning, Fairhope City Council, and Leaf River Group LLC (Corte's development group)
      - Defendants moved to dismiss the entire lawsuit
      - Planning and Zoning doubled down, calling the lawsuit "frivolous," with George Robards as loudest voice
      - The COURT DENIED the motion to dismiss
      - Lawsuit moves forward into discovery phase (documents, phone calls, donations, testimony)
      - Leaf River Group has one year to be under construction or zoning reverses (no apartments); 10 months to prepare for trial; Kant must win re-election

      THE PIVOT
      - The Widget article is the smoking gun: the exact developers the council is protecting (Corte/Leaf River Group) have been legally defeated — the court denied their attempt to kill the citizen lawsuit
      - Discovery phase could expose contracts, donations, and planning-intimidation testimony, exposing the corruption the Main Article alleges (Brown, Boone conflicts of interest; $11.25M triangle cost)
      - Undermines the council's "fairness" justification — the party they're favoring is losing in court, risking zero apartments

