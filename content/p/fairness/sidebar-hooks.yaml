      THE DISCOVERY (Article 2 — the Ripp Report "Questions for Mayor Kant")
      - The same Fly Creek project is exposed as part of a documented corruption pattern: Corte is a documented campaign contributor to Tim Kant
      - The Triangle lawsuit cost $12 million to settle (City says it was a legal settlement to purchase the Triangle property, not a park — Kant's claimed narrative disputed)
      - Kant, also Utility Director, drained $3 million from the utility fund to pay down the Triangle settlement
      - A $5.25 million bank loan was secured to cover the settlement; attorneys took $3 million
      - Sewer system: $10 million "band aid" upgrade criticized as insufficient (could have been $30 million central facility with BP grant)
      - Fire station located on dead-end Parker Road specifically to accommodate Corte's second phase, costing $500,000, plus a lift station of another $300-400,000
      - Fly Creek Apartments approved with "full support of the Mayor" = labeled "epitome of fraud and corruption"; a lawsuit has been filed and temporarily halted the project
      - Additional alleged Kant abuses: $35,000 Senior Bowl donation (Angus Cooper), $20 million on lawsuits/parks in 4 years, $100,000 lost loan from fire dept (father-in-law Tom Odom), $100,000 borrowed from city employee, $400/month Pier lease, Soccer complex (Manley Road) $2M→$6M, library $500k, over 100 geese executed
      - BP grant Fraud complaint filed against Kant and Senator Pittman; forwarded to FBI/grand jury to AG's White Collar Crime Division led by Special Prosecutor Matt Hart
      - Voting: Fairhope Candidate Forum Thursday August 18 (5:30 PM Fairhope Civic Center); Fairhope Municipal Elections August 23

      THE PIVOT
      - Article 1 (FAIRNESS) is a single-issue anger piece about the Fly Creek Apartments and the Council extending the sunset clause to benefit Corte; it names Brown and Boone as conflicts of interest but gives no financial evidence
      - Article 2 supplies the "smoking gun" financial record that turns Article 1's accusations into documented dollar amounts — it proves Fly Creek is not an isolated grievance but the tip of the Corte–Kant–Triangle settlement corruption web
      - It directly links the developer (Corte) to the mayor (Kant) via the campaign-contributor relationship and the $11.25M/$12M Triangle lawsuit, and ties the Fly Creek fire station, mud, and the filed lawsuit to the specific fraud claims (money drained from the utility fund, hidden lift station, sealed lawsuits)
      - Both articles converge on the August 23 Fairhope election and the "if Kant loses the project dies" leverage — Article 2 gives voters the documented evidence the FAIRNESS article demands

