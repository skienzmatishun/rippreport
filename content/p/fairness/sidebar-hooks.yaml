  fly-creek-a-drainage-ditch:
    brief: |-
      THE CONFLICT (PAST EVENTS)
      - Fly Creek Apartments development proposed in Fairhope, Baldwin County
      - Oct 2016: City council endorsed the apartment project
      - Publix construction caused damage to Fly Creek watershed — "full of red mud," sewer spill at same location as proposed apartments, erosion, sedimentation
      - $11.25 million Triangle lawsuit cost to Fairhope — settled without public participation by developer (Corte) and former Mayor, with the last council that included Burrell ("Beavis") and Boone ("Butthead")
      - April 2017: Newly elected city council — with exception of Jimmy Conyers — granted extension of time to move project forward
      - Sunset clause repeatedly extended 4+ times by city council: 120 more days each time for developer to get multiple occupancy site plan
      - Citizens packed council chambers 10 times on the issue — comments repeatedly ignored
      - Councilmen cited conflict of interest: Mr. Brown's long-term relationship with developer Corte; Mr. Boone's business relationship with Corte and engineer company
      - Councilmen cited praying/laboring over the vote on the extension

      THE DISCOVERY (ARTICLE 2)
      - Fly Creek Apartments was subject of a six-day trial in Bay Minette; author observed it, listening to evidence and legal arguments
      - Plaintiff's attorney Adam Milam (representing "Friends of Fly Creek") testified: "The City Council and Mayor sold out Fairhope and Baldwin County residents when they bowed to political pressure in allowing a large apartment complex... right in the Fly Creek Watershed"
      - Jury had already declined to agree with plaintiffs (2016) — overturning legislative/city actions carries high burden of proof
      - The key drainage plan detail: new plan calls for a single point discharge at the outfall pipe — detouring the current 1-acre retention pond and omitting expansion to a 5-acre pond
      - Storm water from apartments to be dumped directly into wetlands draining into Fly Creek, 100-150 feet from outfall pipe, combined with Publix drainage
      - "Guess who owns the wetlands? Good ole Jack Burrell and Kevin Boone gladly accepted the gift" — they "played dumb" when the wetland ownership was exposed
      - Personnel shakeup tied to project: public works director fired (credited with Publix wrongs), plus 3 supervisors and at least 8 employees left city employment
      - Developer told jury he was "just a simple potato farmer" not a developer; assured apartments would be "luxury apartments" at ~$1100/month — pitched as housing for firemen/police

      THE PIVOT (WHY ARTICLE 2 IS THE SMOKING GUN)
      - Article 1 builds the corruption/conflict-of-interest case (repeated council votes in favor of Corte-connected councilmen, $11.25M Triangle settlement, "we do things differently in Baldwin County"); Article 2 supplies the concrete mechanism: the drainage plan dumping storm water from apartments + Publix runoff into wetlands owned by the very councilmen (Burrell, Boone) who "gladly accepted" them — tying the conflict of interest to real environmental harm and public health/watershed damage
      - Article 2 reveals the technical weapon the plaintiffs use (six-day Bay Minette trial, drainage plan evidence, testimony) to overturn the council's legislative actions — the legal pathway behind Article 1's "10th time" frustration
      - Both articles confirm the drainage problem's true scale and the council's role in protecting the developer's wetland discharge over citizen concerns — Mayor Wilson is the sole consistent opponent in both accounts

      KEY ENTITIES
      - Adam Milam (plaintiff's attorney; Friends of Fly Creek)
      - Baldwin County
      - Robert Brown / Mr. Brown (former councilman; conflict with developer Corte)
      - Jack Burrell / Beavis (Council President; owns the disputed wetlands)
      - Kevin Boone / Butthead (councilman; engineer-company business tie to Corte)
      - Jimmy Conyers (Council President; voted against extension)
      - Corte (developer; claimed to be "simple potato farmer")
      - Mayor Wilson (former mayor; opposed project from start)
      - Fairhope (city)
      - Fly Creek (watershed)
      - Publix (grocery store; Publix site source of runoff/sewer spill/damage)
      - Triangle (land/property entity; $11.25M lawsuit)
      - Senator/Former State Senator Pittman (Baldwin County "we do things differently" quote)
      - Bay Minette (location of six-day trial)
      - Tim (former mayor)
      - Ripp (lawsuit filer)
