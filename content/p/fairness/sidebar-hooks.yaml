  fairhopes-triangle-mega-site:
    brief: |-
      # BRIDGE BRIEF

      ## THE CONFLICT (Past)
      - Triangle property in Fairhope - site of a lawsuit that cost the City of Fairhope $11.25 million
      - The last City council (Burrell and Boone) settled the lawsuit WITHOUT public participation
      - City lawyers (hired attorneys) supported the settlement, took $3 million in fees, and had promised the City it would pay NO fees and WIN the lawsuit - "Wrong on both counts"
      - Tax incentives favored the sellers during the settlement; estimated property value today $16-20 million
      - Last council, with support from former Mayor Kant, tried to prove the property was a City Park; "came up with a plan so bad the first arrow was never released"
      - Burrell and Boone (and "Jester Brown" per Widget article) want to declare the property a conservation easement so "nothing can be built" on it
      - Councilman Brown spoke before a vote about his "long term relationship with Mr. Corte" in "glowing terms"
      - Councilman Boone has a business relationship with Corte (and his engineer company)
      - Senator Pittman quote: "we do things differently in Baldwin County" (was ever right)
      - Council voted FOR the extension of the sunset clause giving developer another 120 days for a multiple occupancy site plan (the 10th citizen-packed council meeting on Fly Creek Apartments)

      ## THE DISCOVERY (What Article 2 reveals today)
      - The Triangle property was "PURCHASED BY THE CITY OF FAIRHOPE TO 'SETTLE' A LAWSUIT" - not a voluntary park purchase
      - Burrell and Boone have allegedly been "lying through their teeth for 6 years" about the "settlement" vs. Park, backed by city attorneys and $3 million in legal fees
      - Fly Creek site "full of red mud from the Publix site" - right of ways graded away, trees and all living things killed
      - Council attendance has been high "since the election of Mayor Wilson"
      - Current council "favored the land owner/developer again, the good ole boys are alive and well"
      - The $11.25 million also tied to "Corte and former Mayor"

      ## THE PIVOT (Why Article 2 is the smoking gun)
      - The current Fly Creek Apartments debate (Article 1) is rooted in the same Triangle property scandal that Burrell and Boone have controlled for years (Article 2)
      - The $11.25 million lawsuit settlement is the shared financial bone both articles attack - Article 2 exposes the settlement's origin (to hide a "dump" site), Article 1 shows the council re-favoring the same developer (Corte) over citizens
      - Burrell and Boone use the settlement history to justify both opposing the Triangle's development AND supporting the developer's Fly Creek extension - both articles point at the same "good ole boys" dynamic
      - The conflict of interest (Brown, Boone/Corte business ties) shows the current council is steering policy the same way the last council (2017-2020 era) settled the lawsuit with Kant's help

      ## KEY ENTITIES
      - Corte - Developer (Fly Creek Apartments)
      - Burrell - Council Member / Council President
      - Boone - Council Member
      - Brown - former Councilman (aka "Jester Brown")
      - Pittman - Attorney for McSharry; brother of Boom Boom Pittman; former State Senator
