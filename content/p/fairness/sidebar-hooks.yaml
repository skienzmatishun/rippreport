  no-more-silence-we-want-answers:
    brief: |-
      THE CONFLICT
      - Developer Arthur Corte owns the land for the Fly Creek Apartments in Fairhope; Publix project had filled the Fly Creek site with red mud, flooded wetlands, cut down trees, and graded away right of ways
      - Residents packed the Fairhope City Council chambers for the 10th meeting to discuss Fly Creek Apartments; citizens wanted an answer
