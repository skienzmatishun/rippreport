  triangle-part-2-public-driven-vision:
    brief: |-
      THE CONFLICT (What happened in the past):

      - Fly Creek Apartments — proposed multiple-occupancy development near the Publix gas station/grocery site in Fairhope (Baldwin County).
      - Citizens attended the council chambers for the 10th consecutive meeting to demand a resolution on the project; their comments "fell on deaf ears."
      - Four councilmen voted to extend the sunset clause, giving developer Corte another 120 days to obtain a multiple-occupancy site plan.
      - Robert Brown (Mr. Brown) spoke before the vote about his long-term relationship with developer Corte, describing him in "glowing terms" and should have recused himself.
      - Kevin Boone (Mr. Boone) has a business relationship with Corte and Corte's engineer company.
      - Article 1 alleges Corte and "former Mayor" cost taxpayers $11.25 million in the triangle lawsuit.
      - The lawsuit was settled without public participation by the last council, which included Burrell and Boone.
      - Council accused of favoring the land owner/developer (Corte) and ignoring violations (Publix red mud, graded-away rights of way, destroyed trees, unpaid violations).

      THE DISCOVERY (What Article 2 revealed):

      - The $11.25 million (including ~$3 million in legal fees) was NOT developer theft — it was Fairhope's purchase of the Triangle property as part of the litigation legal settlement.
      - The Triangle property has been the focus of on- and off- litigation for over 25 years.
      - Estimated current value of the Triangle land: $18–20 million.
      - Under former Mayor Walter Kant, Fairhope's Mayor and City Council requested $49 million in BP Restore Act funds — a plan that included private property AND the Fly Creek area. Kant's request was rejected as "too expensive, excessive" and not complying with fund intent.
      - Fairhope then approved a $650,000 "public-driven vision" Comprehensive Land Use Plan (a 2-year project), which uses population projections, village concept, form-based codes, watershed modeling, and flood-zone/environmental analysis.
      - Fairhope Council President Jack Burrell and Kevin Boone are now pushing to place the Triangle property into a conservation easement/"park" ASAP — and argue the City Council should not have that authority; it should be decided by citizens.
      - Burrell and Boone are described as advocating "the policy of the past" — not developing the Triangle, even though taxpayers already paid millions to buy the property after owners were denied development rights for 25 years.

      THE PIVOT (Why Article 2 is the smoking gun for Article 1):

      - Same $11.25 million figure appears in BOTH articles — Article 1 blames Corte and "former Mayor" for the cost; Article 2 proves that figure was Fairhope's legitimate purchase of the Triangle land (plus legal fees), reframing it as a settlement expense, not a developer scheme.
      - Article 1 attacks the council for siding with developer Corte on the Fly Creek Apartments — Article 2 shows the "Fly Creek area" was literally a component of the rejected $49 million Kant/Council plan, and that the same council members (Burrell/Boone) are now blocking the very $650,000 Comprehensive Plan Mayor Wilson champions.
      - Article 1's anti-developer, anti-Corte angle is exposed by Article 2 as being driven by Burrell and Boone's push to lock the Triangle into a park/conservation easement — the exact "policy of the past" Article 1 condemns — and to strip the City Council of authority.
      - The "public-driven vision" / $650,000 plan is the vehicle Mayor Karin Wilson (Article 1's championed Mayor who "opposed the project from the beginning") wants to use; Burrell/Boone oppose it.

      KEY ENTITIES:

      - Fairhope (city); Baldwin County
      - Corte (developer)
      - Kevin Boone (Fairhope Council member; nickname "Butthead")
      - Jack Burrell / Robert (Jack) Burrell (Fairhope Council President; nickname "Beavis")
      - Robert Brown (former councilman)
      - Senator Pittman (Boysdell Pittman)
      - Mayor Karin Wilson (Fairhope Mayor)
      - Walter Kant (former Mayor)
      - Publix (site)
      - Triangle property (Fairhope's most valuable land asset)
      - Fly Creek Apartments
      - BP "Restore Act" money
      - Triangle lawsuit (settlement for $11.25 million)
      - Comprehensive Land Use Plan ($650,000)
