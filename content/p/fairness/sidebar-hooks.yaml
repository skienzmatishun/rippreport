  fairhope-a-city-owned-by-outside-interests-and-good-ole-boys:
    brief: |-
      THE CONFLICT (PAST):
      - Arthur Corte (developer/land owner) and former Mayor William "Kant" settled the Triangle lawsuit for $11.25 million — done without public participation.
      - The settlement paid: $5.25 million city loan, ~$3 million to attorneys, $3 million pulled from the utility reserve fund.
      - Attorneys then recommended the city purchase the Triangle land to settle the lawsuit — i.e., Fairhope spent $11.25 million on land attorneys told them to buy.
      - Since the election of Mayor Wilson, council attendance spiked as citizens pushed back.
      - Fly Creek Apartments — the 10th city council meeting where citizens again spoke out; council voted to extend a sunset clause giving Corte 120 more days to file a multiple occupancy site plan.
      - Council conflicts of interest cited: Brown's long-term relationship with Corte; Boone's business relationship with Corte and the engineering firm.
      - Council allegedly ignored violations: Fly Creek contaminated with red mud from the Publix site, graded-right-of-ways and trees destroyed.
      - The $11.25 million Triangle deal was settled by the last council including Burrell ("Beavis") and Boone ("Butthead").

      THE DISCOVERY (Article 2):
      - Confirms the $11.25 million Triangle lawsuit figure and breaks down every dollar (loan, attorneys, reserve fund) — the same lawsuit Article 1 blames Corte and Kant for costing the city.
      - Identifies Thompson Engineering as "one of Kant's good ole boys," whose authorization to produce a plan was never approved by council.
      - Reveals the new "emerged" deal: Triangle Nature Trail Park — an "arbortorium" and archery range on 34 acres (3.2 miles of looping trails), development cost ~$1 million, on land the city already paid $11.25 million for.
      - No public meeting held; same pattern as Fly Creek Apartments — citizens excluded.
      - Exposes prior corrupt deals: soccer complex (~$6-7 million), Diana Brewer's betrayal siding with the mayor, Mueller and Boone breaking their one-term pledges to run again.

      THE PIVOT (Why Article 2 is the smoking gun for Article 1):
      - Article 2 explains the root money behind the Council's decision in Article 1: the $11.25 million Triangle property (Corte/Kant land grab) is the same parcel the council is now extending the sunset clause to protect the Fly Creek project.
      - Thompson Engineering — linked in Article 2 as Kant's "good ole boy" firm — matches the "engineer company" with a business relationship to Corte cited in Article 1 (Boone). Both articles trace the same network keeping the project alive.
      - Burrell/Boone, called "Beavis/Butthead" in Article 1 for pro-developer votes, are the same officials Article 2 names for betraying one-term pledges and siding with the mayor.
      - Article 2 proves the council isn't deciding on "fairness" — it's protecting a $11.25 million land deal already settled off the books.

      KEY ENTITIES:
      - Arthur Corte — developer
      - William "Kant" — mayor
      - Baldwin County / Senator Pittman — "we do things differently in Baldwin County"
      - Publix — red mud contamination at Fly Creek
      - Thompson Engineering — Kant's good ole boy firm (never-approved authorization)
      - Triangle (land/property) + Triangle Nature Trail Park (arbortorium/archery range)
