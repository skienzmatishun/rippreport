  community-or-developer:
    brief: |-
      THE CONFLICT
      - Fly Creek Apartments development project in Fairhope, Alabama.
      - The City of Fairhope City Council met for the 10th time on this subject.
      - April 10, 2017, was the 10th meeting (confirmed on the official City of Fairhope City Council Agenda).
      - Agenda item 5: "Final Adoption – An Ordinance Amending Ordinance No. 1572: Fly Creek PUD Sunset Provision; Paragraph 3 (a)."
      - The sunset clause extension allows the developer (Mr. Corte / Angelo-Corte) another 120 days to secure a multiple occupancy site plan.
      - Four councilmen voted to extend the sunset clause.
      - Three council members said they "labored over the decision and even prayed about it."
      - Robert Brown spoke before the vote praising his long-term relationship with Mr. Corte; cited as a conflict of interest.
      - Councilman Boone has a business relationship with Mr. Corte and the engineer company (which also has a relationship with Corte).
      - Fly Creek / Fly Creek Watershed permanently damaged by bulldozers and red mud from the Publix site; rights-of-way graded away, trees killed.
      - The developer and former Mayor cost $11.25 million in the Triangle lawsuit — settled without public participation with the "last council" (which included Beavis/Burrell and Butthead/Boone).
      - Council favored the land owner/developer; citizens say "we do things differently in Baldwin County" (per Senator Pittman).
      - Mayor Wilson opposed the project from the beginning and "stayed the course."

      THE DISCOVERY
      - Article 2 (COMMUNITY OR DEVELOPER) is the actual dated City of Fairhope City Council Agenda for Monday, April 10, 2017 — the official primary document for the 10th meeting.
      - It records Agenda item 5 verbatim: Amending Ordinance No. 1572, Fly Creek PUD Sunset Provision, Paragraph 3 (a).
      - Warns: "This will be the 10th time this subject has come up and it cost the previous mayor and others their jobs."
      - States: "No one is for the project except those married to it. Thousands are against it... they can kill it or they will be forever considered cowards who bowed down to the developer."
      - Lists specific conflicts of interest: developer, engineers, contractors, land owner.
      - Names developer-owned land: fire station placement on Parker Road and the upgraded sewer lift station.
      - Flags a pending lawsuit and high probability of future lawsuits.
      - Warns "Some council members may be headed for trouble, if they vote."
      - Identifies the Baldwin Insider as "the rear orifice of Catalyst" — "the good ole boys."
      - Defines the Catalyst fraternity as including county commissioners, attorneys, judges and developers — "All working for themselves."
      - Asserts they fear losing control of Fairhope = losing "forever control of the county."

      THE PIVOT
      - Article 2 is the smoking gun because it is the official municipal record that proves every claim in Article 1 with primary-source detail, rather than the Ripp Report's opinion.
      - It confirms the "10th meeting" claim and nails it to a specific date (April 10, 2017) and specific ordinance (No. 1572, Paragraph 3a).
      - It independently corroborates the conflict-of-interest allegations (developer/engineers/contractors/land owner) that Brown and Boone are accused of having — before the vote even happened.
      - It directly links the Baldwin Insider to the Catalyst political network named in the main article, showing the "good ole boys" who control "Fairhope" and "the county."
      - It documents the developer's land (Parker Road fire station + sewer lift station) and the pending/future lawsuit stakes tied to allowing the developer to proceed — the financial ($11.25 million Triangle suit) and legal exposure Article 1 references.
      - It frames the "cowards who bowed to the developer" / "trouble if they vote" dynamic, which Article 1 resolves by blaming Burrell (Beavis) and Boone (Butthead).

      KEY ENTITIES
      - Corte / Angelo-Corte — the developer
      - Fairhope — the city
      - Baldwin County / Baldwin County Commissioners
      - Mayor Wilson — former Mayor; opposed project from start; part of $11.25 million Triangle lawsuit
      - Robert Brown — former Councilman; claimed relationship with Corte
      - Boone — Councilman; business relationship with Corte and the engineer firm (aka "Butthead")
      - Burrell — Council President / Councilman (aka "Beavis")
      - Pittman — State Senator; "we do things differently in Baldwin County"
      - Baldwin Insider — publication "rear orifice of Catalyst"
      - Catalyst — political organization/network (county commissioners, attorneys, judges, developers)
      - Triangle — land/property; subject of the $11.25 million lawsuit
      - Publix — site source of red mud in Fly Creek
      - Parker Road — fire station location on developer land
      - Ordinance No. 1572 — Fly Creek PUD Sunset Provision
