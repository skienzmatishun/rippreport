    brief: |-
      THE CONFLICT:
      - 2003: Brandon Hastings murdered in Baldwin County.
      - Murray “Bubba” Lawrence Jr. sentenced to life without parole for 2003 murder of Brandon Hastings.
      - Baldwin County District Attorney Robert Wilters was presiding Judge in Murray Lawrence case.
      - Sheriff Hoss Mack was lead investigator; David Whetstone was prosecutor.
      - Wilters, Mack, Whetstone signed coroners report related to exhumed body of Brandon Hastings.
      - Second autopsy of Brandon Hastings ordered by District Attorney and signed by judge overseeing case, never revealed during trial.
      - Second autopsy recently found; during trial never provided to defense; suppression willful/deliberate; deprived defense of info supporting cause of death as suffocation, NOT gunshot.

      THE DISCOVERY:
      - Article 2 / Widget Article NO JUSTICE is older/background context.
      - Criminal rights advocates unearthed second autopsy ordered by DA and signed by judge, never revealed during trial.
      - More than 18 years after Murray Lawrence Jr. sentenced to life without parole.
      - Rule 32 petition filed by Haygood Kristi Deason.
      - Haygood Kristi Deason was Assistant Baldwin County District Attorney; worked for Robert Wilters.
      - Judge Scott P Taylor was Circuit Court Judge assigned to Petition for relief from conviction/sentence pursuant to Rule 32.
      - State responded to Rule 32 filed by Haygood.
      - Haygood response riddled with inaccuracies, wrong dates, deliberate omissions, misleading statements; same characteristics as prosecutor/sheriff in wrongful conviction of Murray Lawrence.
      - Haygood stated no explanation for why report not disclosed; violation of discovery order; not disclose second autopsy.
      - Haygood cited Alabama Court of Criminal Appeals finding co-conspirators testimony corroborated and additional circumstantial facts indicating Lawrence shot Hastings; no quotation marks/details.
      - Haygood pointed to Kathleen Gordon testimony re Lawrence showing pistol day before April 5, 2003 murder; omitted permit/no murder weapon; omitted prosecution discredited witnesses due drug use/time change; omitted Gordon ties to Cynthia Weston/Jarius McNeil; omitted Gordon made advances Lawrence rejected; Gordon no credibility.
      - Haygood should correct Lawrence went to apartment Sunday night, NOT night of murder; prosecution said twice in trial transcript; Lawrence retrieved permitted gun from trunk; Lawrence did not know Hastings missing until police announced Monday; Lawrence fearful of McNeil; Lawrence did not know cause of death; Jarius gave gun to Jeff Shaw to hide stolen property; Lawrence Sr. heard; Lawrence contacted Fairhope Police; retrieved/turned over gun.
      - Haygood stated last person to see Hastings alive was his mother; not true; last person was Debra Fudge, co-worker in Foley; Fudge identified McNeil in lineup as being with Hastings in Hastings car at approx 1:30 AM, April 5, 2003.
      - Haygood/Fairhope Police/Judge/Prosecutor/Sheriff aware of 5:01 stop; Fairhope Police Officer Wendall Thomas never testified; stopped John Wayne Mixon, Tonya brother, Crystal Lindsey in Fairhope; Crystal Lindsey testified stop; John Wayne pleaded 5th on advice of attorney; Crystal testified saw Lawrence around 4:45 to 4:30 am prior to 5:01 stop; important because prosecution said Lawrence/Jarius went to Mississippi to dump body, 3 hr 15 min round trip; impossible for Lawrence to have made trip and be back by 4:30 am.
      - Mr. Hastings not killed by gunshot; narrative created by prosecutor David Whetstone; Whetstone bragged years later how he proved autopsy report and coroner in Mississippi were wrong and his theory of gunshot was correct.
      - Judge Robert Wilters and lead investigator Lt. Hoss Mack went along with prosecution, even to extent withholding evidence from defense.

      THE PIVOT:
      - Article 2 is older/background; Article 1 is newer/political.
      - Article 2’s second autopsy/suppression facts are key context for Article 1’s Baldwin County political conflict.
      - Article 1: Vote Smart; Baldwin County; eliminate Catalyst candidate; Lynn Stacy; GOB; Catalyst; Scott Boone Consulting; Board of Education District 2; Carrie Hosier vs Andrea Lindsey; Circuit Clerk; Kim Earl; Vote March 5, 2024; Vote for Carrie Hosier and Kim Earl.
      - Article 2: NO JUSTICE; BCSO; Murray Lawrence Jr; Hoss Mack; Robert Wilters; David Whetstone; Brandon Hastings; second autopsy; suppression; Rule 32.
      - Article 2 is smoking gun/context because it shows same Baldwin County institutional actors and alleged misconduct: DA suppressing evidence, sheriff lead investigator, prosecutor, coroner/funeral home relationships, personal relationships with victim, conflicts of interest.
      - Article 1’s anti-Catalyst/GOB narrative and call to break corrupt cycle can be framed using Article 2’s evidence of wrongful conviction and withheld evidence.
      - Article 2 provides historical foundation for Article 1’s claims about transparency, independent thinking, new candidates, accountability.

