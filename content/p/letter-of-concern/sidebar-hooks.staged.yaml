  for-the-record-mega-money:
    brief: |-
      THE CONFLICT:
      Baldwin County Mega-Site (3000-Acre) was promoted as "shovel ready" for seven to eight years, lacking rail head and utilities.
      On July 25th, a special meeting of the County Commission authorized $7 million for needed infrastructure.

      THE DISCOVERY:
      The Baldwin County Economic Development Alliance was authorized to proceed with $7 million infrastructure funding for the Mega-Site, despite lacking a contract or letter of intent.

      THE PIVOT:
      Both articles highlight municipal/county failures in strategic planning, infrastructure delivery, and transparency (Mega-Site stagnation vs. Fairhope's inherited utility neglect), which fuels public distrust and "sensationalized" reporting by groups like Mobile Baykeeper.

