  women-of-baldwin:
    brief: |-
      THE CONFLICT:
      - Aug. 7, 2019: Mayor Karin Wilson, City of Fairhope, sent Letter of Concern to Casi Calloway, Mobile Baykeeper.
      - Wilson stated she could no longer, as Mayor, allow City’s reputation to suffer while Mobile Baykeeper continued to share sensationalized “news” releases without transparent facts.
      - Wilson cited Casi Calloway’s failure to respond to email dated July 30, 2019, after most recent news release concerning video of a “mysterious” substance; Wilson called it “the straw that broke the camel’s back for me.”
      - Wilson wrote that the announcement reporting no SSO from Fairhope or Daphne was “written in typical Baykeeper fashion – to mislead the reader and promote scare tactics.”
      - Wilson claimed citizens were left with “misguided anger directed at the very people who are actually working on solutions.”
      - Wilson said city was inundated with emails, mail, and calls that distracted hardworking City employees and took time away from actual solutions.
      - Wilson stated City of Fairhope was doing more than ever to improve water quality and protect environmentally sensitive watersheds; taking responsibility for upgrading entire sewer system.
      - Wilson wrote there was no plan in place before she took office; no funding in place for massive needs; in less than three years both in place and work begun; work has begun.
      - Wilson letter CC: Mobile Baykeeper Board of Directors.

      THE DISCOVERY:
      - Widget Article (“WOMEN OF BALDWIN”) is older than Main Article (“Letter of Concern”); frame as background/historical context.
      - Widget content references Nov. 6 vote (consistent with Oct. 2018 timeframe, older than Aug. 7, 2019 letter).
      - Widget: Baldwin County has been run by old white men, all politically connected to one goal, do what the hell they think is best for them.
      - Widget: “old white men are disintegrating and groups like Catalyst will soon be history.”
      - Widget: Mayor Karin Wilson shattered glass ceiling by becoming first female Mayor in Fairhope’s history and battled Catalyst Council that could not even deliver budget on time.
      - Widget: Council did everything in their power to obstruct Mayor; original plan of making her quit only solidified her determination.
      - Widget: 2018 Nappi Award Winner – Hardest Working Elected Official – Eastern Shore Fairhope Mayor Karin Wilson.
      - Widget: Baldwin County run by old white men, all politically connected; “do what the hell they think is best for them.”
      - Widget: “Vote candidate not party. Straight ticket voting is voting blind and allows corruption to flourish and compromises elected officials. It strengthens the good ole boy network and Catalyst candidates, something all parties should be against.”
      - Widget: County Commission District 2 – Amber Smith running against Joe Davis. Davis is “as Catalyst as they get.” Davis recruited from Dane Haygood camp; “Joe will get his marching orders from Daphne.”
      - Widget: Danielle Mashburn-Myrick running for State Representative House District 94 against Joe Davis.
      - Widget: Joe Davis did not deliver on BP money and sat mute while Sen. Tripp Pittman stuffed his pockets with $750,000.00.
      - Widget: Joe Davis bragging he was partly responsible for penny tax approval. Penny tax cost Baldwin County Schools 2 million a year.
      - Widget: Chris Elliott and Mr. Eddie Tyler, Superintendent of Schools, headed the “no Vote Tax.” That is the tax THEY decided on, not the voters.
      - Widget: Joe and Randy Davis represent the old guard and have never accomplished anything other than maintain office by straight ticket voting.
      - Widget: Neither Joe nor Randy Davis knows what Public Services means; both need to join other good ole boys being shoved out.
      - Widget: Andrea Lindsey running for School Board, District 2. Lindsey brings 24 years experience; School Boards will be overwhelmed with growth of student population; VOTE for Andrea Nov. 6th.
      - Widget: Billie Jo Underwood, County Commission District 3, is predicted to win. Her last opponent is a woman as well, Heather Brown.
      - Widget: Tucker Dorsey joins Tripp Pittman and Tim Kant – “3 that really needed to go.”
      - Widget: The Ripp Report is endorsing Billie Jo Underwood; she worked harder than anyone in the primary, run-off and now General election; “She is what you call a Public Servant.”

      THE PIVOT:
      - Article 2 provides background on Baldwin County political landscape: old white men, Catalyst network, straight ticket voting, old guard vs. public servant narrative.
      - Article 1 (“Letter of Concern,” Aug. 7, 2019) is Mayor Karin Wilson’s public response within that context, directed at Mobile Baykeeper over sensationalized news releases.
      - Article 2 frames Wilson’s battles with Catalyst-aligned Council and her status as first female Mayor/public servant; Article 1 shows her public stance against Baykeeper’s “gotcha” releases.
      - Article 2 is the smoking gun/key context for Article 1 because it establishes the political backdrop (old white men, Catalyst, straight ticket voting, public servant framing) against which the Letter of Concern conflict occurred.

      KEY ENTITIES:
      - Karin Wilson – Mayor, City of Fairhope; letter author; 2018 Nappi Award Winner – Hardest Working Elected Official – Eastern Shore Fairhope.
      - Casi Calloway – Mobile Baykeeper; letter recipient; sent July 30, 2019 email.
      - Mobile Baykeeper – organization; sensationalized news releases.
      - City of Fairhope – municipality; sewer system; water quality; infrastructure upgrades.
      - Mobile Bay – environmental concern.
      - Fairhope City Council / Catalyst Council – allegedly obstructed Mayor.
      - Catalyst – political group/network in Baldwin County.
      - Baldwin County – location.
      - Baldwin County Schools – penny tax cost 2 million a year.
      - Sen. Tripp Pittman – State Senator; accused of $750,000 to Joe Davis.
      - Joe Davis – State Rep candidate, District 94; “as Catalyst as they get”; did not deliver on BP money; credited for penny tax approval.
      - Randy Davis – Joe Davis’s running buddy; indicted.
      - Danielle Mashburn-Myrick – State Rep candidate, District 94; endorsed.
      - Amber Smith – County Commission District 2 candidate; endorsed.
      - Dane Haygood – Catalyst elected official; Joe Davis recruited from Dane Haygood camp.
      - Billie Jo Underwood – County Commission District 3 candidate; predicted to win; endorsed by The Ripp Report.
      - Heather Brown – Billie Jo Underwood’s opponent; also a woman.
      - Tucker Dorsey – joins Tripp Pittman and Tim Kant; “3 that really needed to go.”
      - Tim Kant – joins Tucker Dorsey and Tripp Pittman; “3 that really needed to go.”
      - Andrea Lindsey – School Board District 2 candidate; 24 years experience; VOTE for Andrea Nov. 6th.
      - Chris Elliott – involved in penny tax / “no Vote Tax.”
      - Eddie Tyler – Mr. Eddie Tyler, Superintendent of Schools, Baldwin County; headed “no Vote Tax.”
