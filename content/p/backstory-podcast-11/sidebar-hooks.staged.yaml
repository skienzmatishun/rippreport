  backstory-podcast:
    brief: |-
      THE CONFLICT:
      - Fairhope City Council voted during a "Monday night" meeting to grant itself free health insurance coverage.
      - Fairhope City Council additionally voted to set the Mayor's salary, ignoring an Auburn Study that was supposed to provide guidance on these issues.
      - Fairhope City Council meeting held Sept. 9 in Fairhope, Alabama.
      - Exposure and the Court of Public Opinion expected to lead to Fairhope City Council removal in 2020.
      - Baldwin County Sheriff's Office budget increased by $6 million since 2011.
      - McSharry lawsuit continued as of Backstory Podcast #11, posted Friday, November 15, 2019.
      - Baldwin County MCU referenced in Episode 11.

      THE DISCOVERY:
      - Article 2 (Backstory Podcast announcement) announced the first Podcast via a new Podcast Facebook page; produced by Backwoods Media, LLC.
      - Article 2 stated future Podcasts would focus on political corruption in Baldwin County, calling it a "target rich environment."
      - Article 2 stated the status quo in Baldwin County "shrunk in numbers but still have a powerful hold on our judicial system."
      - Article 2 stated that of 14 municipalities, the Fairhope City Council "stands alone" regarding lack of leadership, transparency and accountability.

      THE PIVOT:
      - Article 2 is older and serves as background/historical context for Article 1 (Backstory Podcast #11).
      - Article 2 announced the podcast's anti-corruption mission and exposure strategy through the Court of Public Opinion, framing the context for Episode 11's topics: Fairhope council actions, legal settlement, sheriff budget increase, McSharry lawsuit.

      KEY ENTITIES:
      - Francis Paul Ripp — U.S.M.C. combat veteran; head of the Ripp Report (www.rippreport.com), a non-profit/consumer advocacy organization; Facebook pages: The Ripp Report and Baldwin County Legal Eagle.
      - Harry Still, III — attorney, "The Backwoods Southern Lawyer"; former ICMA Credentialed Manager, Economic Developer, City Planner and County Manager; attorney in private practice.
      - Backwoods Media, LLC — Alabama Domestic Limited Liability Company located in Baldwin County, Alabama.
      - Backstory Podcast — production of Backwoods Media, LLC.
      - Fairhope City Council — Fairhope, Alabama.
      - Baldwin County Sheriff's Office — $6 million budget increase since 2011.
      - McSharry lawsuit — continued.
      - Baldwin County Bar — state of.
      - Coastal Alabama Community College — new President.
      - Beasley Allen Conference.
      - Senate race in Alabama.
      - Gulf Shores developments — north of the Intracoastal Waterway (CR6 Boulevard, Pedestrian Bridge across the Intracoastal, Hwy59 additional Southbound Lane, skirting the legal settlement to provide a route around Gulf State Park).
      - Fairhope Klump PUD — development at intersection of Hwy 181 and Fairhope Avenue.
      - Baby Trump balloon — mentioned in Episode 11.
      - Baldwin County MCU.
    llm_text: The Fairhope City Council gave itself free health insurance and set the Mayor's salary behind an ignored Auburn Study, putting the Court of Public Opinion on watch for removal in 2020. The Backstory Podcast now ties that to the Baldwin County Sheriff's $6 million budget jump and the McSharry lawsuit.
