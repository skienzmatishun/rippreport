      4. Recent Event (Main Article): 500,000 gallons of raw sewage overflowed into Big Head gully and Fly Creek watershed.
      5. Recent Event (Main Article): Petition of 2,276 citizens convinced Fairhope Single Tax to back off the Tuberville subdivision.

      THE DISCOVERY:
      1. The Tatumville Subdivision project (Single Tax) was being advanced despite documented public health warnings and prior sewage spills in February 2018.
      2. Widget Article revealed multiple conflicts of interest among council members: Robert Brown/Cliff Pittman (building company/single tax board); Jay Robinson/Michel Upchurch (law/single tax treasurer); Lee Turner (President of Planning/Single Tax).

      THE PIVOT:
      1. Article 2 establishes that the sewer infrastructure failure and public health risks (Feb 2018 spill) were inherent to the Single Tax/Tatumville project, not a recent isolated incident.
      2. Article 1 demonstrates the continuation of this systemic failure (500,000 gallon overflow) and the council's subsequent obstruction of Mayor Wilson, linking current citizen anger to pre-existing conflicts and historical failures (Jim Nix/Tim Kant).

