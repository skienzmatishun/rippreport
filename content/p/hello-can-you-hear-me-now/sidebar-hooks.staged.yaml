  a-legal-win-for-fairhope-citizens-who-oppose-fly-creek-apartments:
    brief: |-
      THE CONFLICT:
      *   Fly Creek Apartments project faced opposition from over 98% of attendees at 6 planning meetings.
      *   A lawsuit was filed in June against the City of Fairhope, Fairhope Planning and Zoning, Fairhope City Council, and Leaf River group LLC.
      *   Diana Brewer was defeated in a Fairhope City Council bid by Jimmy Conyers (66% of vote).

      THE DISCOVERY:
      *   The court denied the defendants' motion to dismiss the lawsuit against the City of Fairhope and Leaf River Group LLC.
      *   The lawsuit can move into a discovery phase, requiring the production of documents, phone calls, and donations.
      *   Leaf River Group has one year to begin construction, after which zoning may revert to original, prohibiting apartments.

      THE PIVOT:
      *   The court's denial of the motion to dismiss validates the constituent opposition to Fly Creek, providing legal weight to the political reasons for Diana Brewer's defeat.
      *   Brewer lost her bid for reelection by ignoring constituent opposition to the Fly Creek Apartments project, despite the ongoing legal scrutiny.

      KEY ENTITIES:
      *   Jimmy Conyers (Fairhope City Council)
      *   Diana Brewer (Former Fairhope City Council)
      *   Tim Kant (City Council)
