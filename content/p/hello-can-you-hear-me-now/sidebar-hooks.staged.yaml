  pay-executives-first-boy-scouts-come-last:
    brief: |-
      THE CONFLICT:
      *   Mobile Area Boy Scout Council experienced severe financial losses (over $200,000 annually) since 2008 (9+ years).
      *   Michael Hartigan served as Executive Director starting January 2009, accumulating over $1 million in salary/benefits and being responsible for losing close to $1.5 million since 2009.
      *   Six-month investigation (started November 2015) found about one out of four board members had broken state/federal laws or lied.
      *   Phil Webb, Board President (2014-2015), was accused of breaking IRS state and federal laws.

      THE DISCOVERY:
      *   The Mobile Area Council had to sell a third of Camp Maubila (owned over 50 years, near Jackson, AL) in 2015 to survive.
      *   The financial mismanagement was linked to unethical and potentially illegal actions by board members.
      *   Tucker Dorsey, a Baldwin County Commissioner, was involved in reporting these facts.

      THE PIVOT:
      *   The historical evidence of systemic financial mismanagement and illegal conduct within local governing bodies (Boy Scouts) provides context to the later political fallout where elected officials (Diana Brewer) ignored overwhelming constituent opposition (98% opposed Fly Creek Apartments) due to perceived self-interest, leading to her defeat by Jimmy Conyers.
      *   The P&Z board decisions, which led to millions in lawsuits, mirror the documented financial and legal negligence seen in the Boy Scout Council.

