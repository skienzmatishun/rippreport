      *   In 2017, changes implemented by Presiding Judge Floyd reassigned Thomason’s temporary custody and support motions to other circuit judges, preventing her from dictating status quo orders at the beginning of cases.
      *   Thomason's domestic violence dockets were also specially assigned to other judges in 2017.

      THE PIVOT:
