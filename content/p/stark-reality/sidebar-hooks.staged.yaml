  manley-road-sidewalk-conflicts:
    brief: |-
      THE CONFLICT:
      *   March 14, 2016: City of Fairhope authorized partnership with Fairhope Single Tax Corporation for Manley Road sidewalk construction.
      *   March 28, 2016: City Council was predicted to approve Fly Creek Apartments despite public opposition.
      *   Current/Recent: Senator Tripp Pittman secured $636,000 for himself through a municipal contract with Fairhope.
      *   Current/Recent: Mayor Timothy Kant is driving the approval of Fly Creek Apartments for benefactor Mr. Corte.

      THE DISCOVERY:
      *   The March 14, 2016, agenda revealed that George Robards, a contractor and Planning and Zoning member, benefited from sidewalk contracts.
      *   A conflict of interest existed because Planning and Zoning President Lee Turner was also President of Single Tax Corporation.
      *   Mayor Kant appointed George Robards to the Planning and Zoning Board, and Robards is a major contributor to Kant's re-election.

      THE PIVOT:
      *   Article 2 demonstrates that Mayor Kant's pattern of utilizing municipal contracts for political patronage and conflicts of interest (Robards/Turner) was established *before* the Fly Creek approval, framing the Fly Creek project not as an isolated decision but as part of a systemic "good ole boy deal."

      KEY ENTITIES:
      *   Mayor Timothy Kant
      *   George Robards
      *   Lee Turner
      *   Fairhope Single Tax Corporation
      *   Mr. Corte
      *   Senator Tripp Pittman
      *   Fairhope City Council
      *   Fly Creek Apartments
      *   Baldwin County
    llm_text: Mayor Timothy Kant built his patronage system using George Robards and Lee Turner with Fairhope Single Tax Corporation. His push for Fly Creek Apartments benefiting Mr. Corte shows this isn't an isolated decision, but a systemic "good ole boy deal."
