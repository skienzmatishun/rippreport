  memorial-day-special-edition:
    brief: |-
      THE CONFLICT: Senator Tripp Pittman and Sheriff Hoss Mack were advertised together on R&R Billboards, owned by Reagan Scroggins, whose wife is Jennifer Fidler (Fairhope Public Works Director). Fidler's department was responsible for the misspending of BP Boom Grant Funds.
      THE DISCOVERY: Article 2 documented clear conflicts of interest involving Pittman, Mack, Fidler, and Tim Kant, including Pittman lacking an Alabama contractor's license for Pittman Tractor.
      THE PIVOT: Article 2 established the foundational pattern of local corruption (Pittman benefiting from Fairhope contracts/BP funds and Fidler's oversight failure) which provided the context for Article 1 detailing Pittman securing $636,000 via a Fairhope municipal contract and the ongoing FBI/AG investigation.
      KEY ENTITIES: Jennifer Fidler, Reagan Scroggins, Senator Tripp Pittman, Sheriff Hoss Mack, Tim Kant, Robert Bentley, Mike Hubbard, Judge Michelle Thomason, Fly Creek, Baldwin County, Fairhope, BP Boom Grant Funds.
    llm_text: Senator Tripp Pittman and Sheriff Hoss Mack advertised together on billboards owned by Reagan Scroggins. Jennifer Fidler, who oversaw the misuse of BP Boom Grant Funds, links Pittman's contracts to a pattern of Fairhope corruption.
