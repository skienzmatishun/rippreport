hooks:
  legal-corruption:
    brief: 'THE CONFLICT:

      *   Governor Robert Bentley faced scrutiny regarding communications with his
      office/family.

      *   Tripp Pittman (State Senator), acting as "trustee" of BP funds, secured
      a $636,000 municipal contract with Fairhope.

      *   This arrangement was under FBI investigation and pending review by the Attorney
      General''s office in Montgomery.

      *   Baldwin County family court system was criticized for alleged corruption
      involving attorneys and judges.


      THE DISCOVERY:

      *   Pittman, a former Baldwin County State Senator, awarded himself contracts
      from Fairhope amounting to $750,000.00.

      *   This was allegedly done with assistance from the Mayor and lacking accountability.

      *   The Baldwin County Commission purchased a mega-site benefitting only sellers
      (a "good ole boy deal").

      *   Chris Elliott, a former County Commissioner, supported a gas tax increase
      without citizen vote.

      *   Fairhope officials (Burrell, Brown, Boone, Robinson, Conyers) were implicated
      in self-enrichment schemes via council positions/contracts.


      THE PIVOT:

      *   Article 2 provides modern, specific instances of financial malfeasance in
      Baldwin County governance (e.g., Pittman contract amount, roles of Fairhope
      Council members) that echo and provide contemporary examples of the systemic
      corruption described in Article 1 (Bentley era, Pittman''s initial fund access).

      *   Article 2 details the continuation of corruption patterns within Baldwin
      County governance bodies mentioned in Article 1.


      KEY ENTITIES:

      *   Robert Bentley (Governor)

      *   Tripp Pittman

      *   Baldwin County Commission

      *   Fairhope Mayor/City Council

      *   Chris Elliott

      *   Burrell

      *   Brown

      *   Boone

      *   Robinson

      *   Conyers'
