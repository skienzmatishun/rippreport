  shackled-chained-handcuffed-bc-un-family-court:
    brief: 'THE CONFLICT:

      *   Baldwin County Family Court operating as a corrupt system, favoring certain
      attorneys and judges over clients.

      *   System involved in disputes involving property/lawsuits, including a "$3
      million" Triangle lawsuit and a $11.75 million Dyas Lawsuit.

      *   Allegations of corruption involving local officials, including potential
      conflicts between Governor Bentley and Mike Hubbard''s felony counts.

      *   Judge Michelle Thomason serving as Circuit Judge and Director of Baldwin
      County Substance Abuse, presiding over cases referred to a non-profit she also
      directs.


      THE DISCOVERY:

      *   The system''s corruption is exemplified by the case of Chey Garrigan, who
      spent 8 years and tens of thousands of dollars battling the court.

      *   Judge Michelle Thomason’s conduct is described as maintaining a "kangaroo
      court" that systematically disadvantages the mother in custody battles.

      *   Garrigan faced initial unfavorable findings, subsequent attacks on her character
      (including being portrayed as unfit), and ultimately enduring 30 days in jail
      conditions described as "Shackled, chained and handcuffed."

      *   The case against Garrigan was handled by attorneys like Steven Johnson and
      Buddy Brackin, who allegedly served as Thomason''s allies.


      THE PIVOT:

      *   Article 1 establishes the existence of a deeply corrupt judicial system
      in Baldwin County. Article 2 provides a detailed, high-stakes example (Garrigan''s
      custody battle) proving *how* that corruption operates in practice, specifically
      implicating Judge Thomason and enabling the description of clients being "SHACKLED,
      CHAINED AND HANDCUFFED" from justice.


      KEY ENTITIES:

      *   Baldwin County

      *   Governor Robert Bentley

      *   Mike Hubbard

      *   Judge Michelle Thomason

      *   Tripp Pittman (mentioned in Article 1 context)

      *   Chey Garrigan

      *   Steven Johnson

      *   Buddy Brackin

      *   Tom Albritton (Ethics Commission)'
    generated_at: '2026-08-03T02:29:48.569806Z'
    text: Baldwin County Family Court operates as a racket that enriches insider attorneys
      at the expense of local parents. Judge Michelle Thomason threw Chey Garrigan
      in jail for thirty days after Garrigan exposed Thomason’s profitable conflict
      of interest.
