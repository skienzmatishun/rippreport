      Fairhope for BP Boom work.

      - This transfer occurred while the project was under investigation by the FBI
      and Attorney General''s office.

      - The contract involved Fairhope Mayor Tim Kant and Pittman Tractor services
      through various entities.


      THE DISCOVERY:

      - The Widget Article proves the initial $636,000 payment was based on a process
      lacking proper approvals (no general contractors license, no marine insurance,
      no county/ethics approval).

      - The Widget Article details the initial awarding of funds on June 4th, 2010,
      followed by a check for $372,165.90 six days later.


      THE PIVOT:

      - Article 2 provides the granular financial timeline and procedural deficiencies
      regarding the "BP theft" referenced in Article 1, establishing malfeasance on
      the part of Kant and Pittman.


      KEY ENTITIES:

      - Tripp Pittman

      - Tim Kant

      - Fairhope City Council

      - BP

      - Greg Mims

      - Sherry Sullivan

      - Jennifer Fidler

      - Buddhiness (implied via contract work)

      - Mike Hubbard (referenced in relation to investigation scope)'
