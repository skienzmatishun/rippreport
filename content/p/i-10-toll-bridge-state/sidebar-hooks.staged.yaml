      THE DISCOVERY:
      *   The Alabama Ethics Commission process has a 98% chance of dismissing complaints, effectively providing a "get out of jail card" and maintaining Alabama's high rank in political corruption.
      *   Systemic corruption is present across multiple Alabama municipalities, including Columbia, Fairhope, Mobile, and Jefferson County.

      THE PIVOT:
      *   Article 2 establishes that Alabama's political system lacks accountability mechanisms, allowing self-protection through the Ethics Commission, providing crucial historical context for the political environment surrounding the I-10 toll bridge proposal.
      *   The push for the I-10 toll bridge (Article 1) occurs within a state known for entrenched, unpunished political corruption (Article 2).

