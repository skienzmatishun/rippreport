      THE PIVOT:
      *   The historical evidence of systemic corruption and fund skimming (Article 2) contextualizes Article 1's claim that Alabama is "first in political corruption" and questions the genuine necessity of the new I-10 toll bridge proposal.
      *   The shift from state-managed funds to a new toll/federal reliance (Article 1) mirrors the previous misuse of state transportation funds (Article 2).

