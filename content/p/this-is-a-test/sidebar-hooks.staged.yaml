      - New proposed Planning District 8 in Fairhope was long overdue.
      - Fairhope had policy of annexing property only if a property owner made a request.
      - Fairhope used this policy to avoid annexation of the African American community, per map.
      - Fairhope spent $2.6 million on farmland for recreation, then rented it for $9,000 a year.
      - Jack Burrell was behind the $2.6 million farmland purchase; still farmland today.
      - Park in the African American neighbor got $0 / ZERO.
      - Burrell, Boone, and Brown pushed the recreation land purchase.

