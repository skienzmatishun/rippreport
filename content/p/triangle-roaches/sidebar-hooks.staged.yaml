hooks:
  read-and-listen:
    brief: |-
      THE CONFLICT:
      - Tim Kant, former Mayor of Fairhope, Alabama, aka "Can't" / "Tim Can't" — fueled the Triangle lawsuit during his entire 16 years as Mayor.
      - Kant WAS and IS responsible for the lawsuits; from 2006 till present the author was involved with the Triangle Property and Publix Project.
      - After 3 administrations and 4 lawsuits, the Triangle property is 100% a political issue — not a park or proposed conservation easement but a political football.
      - Family inheritance in the 1980s; common goal of the "good ole boys" has always been to stop any development in the Triangle; courts ruled against the city; resulted in legal settlement AGAINST the city.
      - Triangle was a "Legal Settlement" of 8.25 million, NOT a purchase; after 3 million in law fees guaranteed by Attorney Cain Orear, who represented the city and promised the city would be refunded legal fees in litigation; that did not happen.
      - Kant cost the city 13 million in a lawsuit that raged for over 2 decades.
      - 2014, around Feb: City Council meeting; Councilman Ford asked at beginning of meeting to add an agenda item; council agreed; addition authorized Mayor Can't to enter into "settlement talks to reach a legal settlement over the Triangle lawsuit"; revealed through FOIA requests.
      - Sept 2014: Mayor announced a legal settlement; those involved were shocked; public knew nothing; public was not even aware of authorization by council for the Mayor to proceed.
      - Council and Mayor told the community the lawsuit was settled and the city was going to purchase it for parks.
      - Then received a copy of the "Legal Settlement"; the SPIN was park land; this was the cover for the LOSS of the lawsuit and legal fees.
      - Triangle piece stripped of all old growth pines, over 10 years ago; logging roads caused all sorts of erosion within the Triangle; what is left is scrub oak and low vegetation; very poor property for recreation or conservation.
      - The piece of property across the street, the other part of the land, is in much better condition.
      - Two issues: traffic and parking; City of Fairhope, Alabama; DOT; and the County trying to control traffic at Parker Road and 98.
      - City Council approved 230 apartments and over 100 condos/townhouses behind Publix; Parker Road and 98 will be a far worse traffic nightmare in the next 6 months; attributed to Can't and the Council.

      THE DISCOVERY:
      - Article 2 (Widget): "READ and Listen"; Fairhope City Council is really showing their colors; no ethics, no transparency, no accountability, no good.
      - Podcast: Backstory Podcast, on Freaky Friday's around noon; Backstory Podcast — "Your Voice and The Court of Public Opinion."
      - Article 2 is older than Article 1; frame it as background/historical context.

      THE PIVOT:
      - Article 2 framed the City Council's conduct (no ethics, no transparency, no accountability) and set the political narrative backdrop used by Article 1's "TRIANGLE ROACHES."
      - Article 2 is the key context / smoking gun for Article 1 because it framed the council's posture ahead of the main article's claims that the City Council and City Attorney will fully back Tim Can't and that the political machine is driving the obstruction of Triangle development.

      KEY ENTITIES:
      - Tim Kant / Tim "Can't" Kant / "Can't" — former Mayor of Fairhope, Alabama; 16 years as Mayor; 2006 till present involvement; responsible for lawsuits.
      - Cain Orear — Attorney who represented the city; guaranteed refund of legal fees; refund did not happen.
      - Councilman Ford — Fairhope City Council member who requested agenda item in Feb 2014.
      - Fairhope City Council — agreed to authorize settlement talks; said to fully back Cant't.
      - Fairhope City Attorney — said to fully back Cant't.
      - Triangle Conservancy — formed; Tim Can't one of the major players.
      - Publix — favored developer; 230 apartments and over 100 condos/townhouses approved behind Publix.
      - Fly Creek Apartments — favored developer / favored by Tim Can't.
      - Triangle property — 8.25 million legal settlement, NOT a purchase; 3 million in law fees; 13 million city cost.
      - Parker Road and 98 — traffic and parking issues.
      - DOT — Alabama Department of Transportation.
      - County — controlling traffic at Parker Road and 98.
      - Backstory Podcast — "Your Voice and The Court of Public Opinion"; Freaky Friday's around noon.
      - Fairhope, Alabama.
      - Lowery, Wilters — names to mention per instruction.
