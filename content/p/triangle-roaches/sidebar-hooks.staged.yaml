  fairhope-sold-to-the-highest-bidder:
    brief: "THE CONFLICT: \n- Former Mayor Tim Kant (referred to as Can’t) fueled a decades-long lawsuit over the Triangle property spanning his 16 years in office.\n- The litigation resulted in the City of Fairhope losing a lawsuit costing taxpayers $13 million total ($8.25 million legal settlement plus $3 million in guaranteed legal fees promised by Attorney Cain Orear that were never refunded).\n- In February 2014, Councilman Ford added an unannounced agenda item allowing Mayor Kant to enter into secret settlement talks, kept hidden from the public until a September 2014 announcement framed the settlement as a \"park purchase\" rather than a court loss.\n- The \"Catalyst Council\" (Council members Boone, Burrell, and Brown) previously pushed through questionable real estate deals, such as draining 5 accounts for a substandard soccer field complex that sat idle for years.\n\nTHE DISCOVERY:\n- The older budget-era context (Article 2) reveals a persistent pattern of financial recklessness and backroom dealing by the Fairhope City Council regarding real estate acquisitions.\n- The \"Catalyst Council\" bypassed public participation, ignored Mayor Wilson's warnings, drained capital improvement funds for idle property (such as 113 acres on 13/32 and the K-1 Center), and neglected urgent infrastructure, sewer problems, and police department staffing.\n- The Council previously attempted to give away or mismanage the 105-acre Triangle property, echoing historical patterns of developer appeasement and \"good ole boy\" politics.\n\nTHE PIVOT:\n- Article 2 serves as the smoking gun because it establishes that the current \"Triangle Conservancy\" push is not a novel conservation effort, but a direct continuation of a multi-million-dollar historical conspiracy of financial mismanagement, secret council maneuvers, and developer-driven politics pioneered by Tim Kant and perpetuated by the Catalyst Council.\n\nKEY ENTITIES:\n- Tim Kant (Former Mayor, aka Can't)\n- Cain Orear (Attorney)\n- Boone (City Council member)\n- Burrell (City Council member)\n- Brown (City Council member)\n- Mayor Wilson\n- Cory Martin\n- Ford (Councilman)"
