    brief: |-
      THE CONFLICT:
      *   For the last 20 years, Fairhope has used an "At Large" City Council system.
      *   Fresh Start for Fairhope (FSF) initially sought a change to the Council-Manager form of government and Districts.
      *   The current council was hand-picked by former Mayor Tim Kant, forming the "Catalyst" machine.
      *   The October 2, 2018, referendum was set to decide on the Council-Manager form of government.

      THE DISCOVERY:
      *   FSF initially intended Districts but 65 people at an early meeting voted to support "At Large" over Districts.
      *   Chuck Zunk supported the move to remain "at large" for the entire city population.
      *   The "Skunk" (At Large status) is favored by the City Council, Catalyst, disgruntled ex-employees, and antique Council members due to concerns over power and control, not representation.

      THE PIVOT:
      *   Article 2 established that the FSF goal shifted from Districts to At Large, explaining why the Catalyst Council (which favors At Large for control) opposed the change of Government referendum (Oct 2, 2018) in Article 1.
      *   Article 2 frames the council's resistance in Article 1 not just as political opposition, but as a defense of an existing system that provides them "cover and no accountability."

