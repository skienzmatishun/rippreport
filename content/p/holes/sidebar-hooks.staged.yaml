  re-gift-gift:
    brief: |-
      THE CONFLICT:
      *   Fall 2016: Developer attempted Site Plan Approval for one-point drainage system through the out-fall pipe of the detention pond, violating PUD Amendment 1572.
      *   Fall 2016: Developer deeded a 4-acre parcel (including wetlands) adjacent to Fly Creek to the City of Fairhope.
      *   Current: Fairhope City Council is involved in controversial development (Publix strip center, proposed apartments) over damaged Fly Creek, leading to lawsuits and council obstruction of the Mayor.
      *   Current Costs: Fairhope soccer fields required $1.5 million to grade/fill; total complex estimated $5M-$6M.
      *   Current Strategy (Alleged): "GOB strategy" supported by Burrell and Boone to remove Mayor Wilson and reinstate fired employees.

      THE DISCOVERY:
      *   The 4-acre tract was located between the retention pond outfall pipe and Fly Creek.
      *   The City, by accepting the deed in 2016, became an upper landowner and a lower landowner relative to the PUD project, triggering specific Alabama common law rights and duties concerning surface water drainage and preventing injury to its own wetlands.
      *   Mayor Wilson expressed shock that the City took ownership of the property.

      THE PIVOT:
      *   The 2016 deed (Article 2) legally altered the City’s relationship to Fly Creek, transforming the land use controversy from a simple development dispute into a complex legal issue regarding municipal liability, environmental duty, and PUD Amendment compliance.
      *   This ownership makes current development decisions (Article 1) highly exposed to legal challenges (trespass, nuisance) and creates a vested interest for the City in controlling run-off and erosion.

