      - Past action involved a special school tax favored by Fairhope City Council over Mayor's proposal for impact fees.
      - The City Council stated it wanted out of any School business.
      - Timeline is prior to May 29th (date of Main Article meeting).

      THE DISCOVERY:
      - Widget Article (Older) revealed Baldwin County relies on taxpayers to cover developer impact fee shortfalls for Schools, Streets/Transportation, and Education.
      - Widget Article mentioned a proposed "education lottery" intended to pay back State General Fund deficits from 2013.

      THE PIVOT:
