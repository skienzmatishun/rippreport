  community-engagement:
    brief: |-
      THE CONFLICT:
      - Fairhope City Council meeting: May 29; duration 3 hours 34 minutes; Ripp Report frames council as dysfunctional/dictatorship; three major issues framed as Strike One, Strike Two, Strike Three.
      - Strike One:
        - Resolution: City Council approves selection of Equity Valuation Partners for Professional Appraisal Services to prepare Appraisal on City Parkland property; cost not to exceed TBD.
        - Council turned back children counting on purchasing Twin Beech Road property; staff and Mayor recommended; Council said all agree on Twin Beech Road but cost too much.
        - Council bought soccer fields because cheapest; cost over $1 million to correct grade; fields never built to specs, e.g., sanitizing soil.
        - Council President Burrell wanted appraisal; Ripp Report: not about money, about quality of life and supporting ignored neighborhood.
      - Strike Two:
        - Resolution: Council authorizes Council President to execute Conservation Easement Agreement between City of Fairhope and Weeks Bay Foundation, Inc. for two conservation easements for properties known collectively as Dyas/Triangle property; outline terms.
        - Total cost of conservation easement, due diligence, closing fees: $39,025.00.
      - Strike Three:
        - Council President front and center; did not follow up, dropped ball, blamed Developer.
        - Jay Robinson backed up Jack by saying he had 46 complaints; Ripp Report: Council had hundreds of complaints and only hand full supporters over Fly Creek Apartments; council overrode citizens for developer; Mayor stood with citizens opposing apartments.
      - Triangle Lawsuit Settlement: $8.25 million with additional $3 million in legal fees.
      - To pay for Triangle property, Mayor Can’t and Council President Jack Burrell raided utility fund for $3 million, took loan for rest; attorneys got $3 million up front.

      THE DISCOVERY:
      - Widget article: Fairhope citizens need to watch first 30 minutes of Fairhope Work Session, March 27; first 15 minutes involves K-1 Center, next 15 minutes discussing Conservation Easement on Triangle property 109 acres.
      - Councilman Conyers spoke up for citizens and encouraged Community Engagement aka Public participation; Conyers also encouraged Council, unsuccessfully, to establish pay grade for Mayor, in limbo since election of Mayor Wilson. Mayor Wilson refused duel salaries of Mayor and Utility Director, position and salary former Mayor enjoyed over 10 years.
      - Baldwin County School Board wanted to sell K1 center for over 10 years; only buyer considered is City of Fairhope; Council cannot beat its chest they put together anything new, it was overdue; Council had own plan that failed.
      - Mayor had backup plan and now sale is on track again; first effort by council to determine use of K-1 had restricted public participation; Jack Plan went heads first into failure.
      - Mayor is trying to maximize Community Engagement discussions for K-1 Center, Triangle property, Comprehensive Land Use Plan.
      - Important: Tuesday April 2nd @ 9:00AM public meeting, Nix Center, will be held to select Training Facilitators, approximately 30, for 30 tables that will host April 3 meeting. Training meeting will prepare Facilitators to guide conversation on April 3.
      - Please participate in discussing best use of K-1 Center; decision should be decided by citizens, not 3 councilman.
      - K-1 center, Nix Center and Fairhope Community Park included in $4 million purchase; no funds for development currently budgeted for K-1 Center.
      - Mr Burrell insisted Triangle property was purchased for a park, that is total BS. To pay for property, Mayor Can’t and Council President Jack Burrell raided utility fund for $3 million, took loan for rest. Attorneys got $3 million up front.
      - City of Fairhope under commission Comprehensive Land Use Plan. Mayor promoting under banner Community Engagement. Council President does not think Council needs “outsider input”.
      - Notice in last 15 minutes of video how Council President Burrell and Councilman Brown push for Conservation Easement. Burrell and Brown know they can count on Bee Boone, for that third Catalyst vote.
      - Councilman Conyers and Robinson favor Community Engagement route, along with Mayor.
      - Burrell, Boone and Brown all favor Conservation Easement and want to rush decision before Comprehensive Land Use Plan finished. Why because Catalyst does not want anything done on property and Conservation Easement will accomplish that. Citizens of Fairhope better not let that happen.
      - President of Fairhope Council famously said he was tired of hearing from citizens, citizens, citizens. The CITIZENS better be sure Burrell gets the message.

      THE PIVOT:
      - Article 2 is older than Article 1; frame it as background/historical context.
      - Article 2’s Fairhope Work Session March 27, first 30 minutes, K-1 Center and Conservation Easement on Triangle property 109 acres, is earlier context for Article 1’s May 29 council actions.
      - Article 2’s April 2 Nix Center public meeting and April 3 training/public meeting context.
      - Article 2’s facts on Triangle LAWSUIT SETTLEMENT, $8.25 million, $3 million legal fees, $4 million K-1 purchase, $3 million utility fund raid, $39,025 easement cost, Comprehensive Land Use Plan.
      - Article 2 is smoking gun/background for Article 1 because it shows earlier public participation/Community Engagement conflict and council-developer-Catalyst pressure before May 29.

      THE KEY ENTITIES:
      - Fairhope City Council
