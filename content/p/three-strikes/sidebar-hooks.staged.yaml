      THE PIVOT: Widget Article establishes a pattern of financial impropriety, self-dealing, and conflicts of interest involving Councilman Burrell and Councilman Brown within Fairhope, contextualizing the financial and political maneuvering seen in the Triangle Lawsuit discussion of Article 1.
