    brief: |-
      THE CONFLICT: Gulf Shores citizens faced approval of an apartment complex over a year prior to the 2020 lawsuit.
      THE DISCOVERY: The Gulf Shores City and Mayor dismissed residents' opposition, stating the "Apartments are a done deal, get over it."
      THE PIVOT: The Gulf Shores lawsuit demonstrated citizen resistance against local government/elected officials overriding resident objections, setting a precedent for citizens to fight local council dysfunction, paralleled by the Fairhope City Council's controversial decisions regarding the 18 million property sale (Dyas/Triangle property) on May 29th.
