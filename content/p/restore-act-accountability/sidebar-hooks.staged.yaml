  alabama-education-accountability-act:
    brief: |-
      THE CONFLICT: In 2010, funds were distributed throughout Baldwin County following the Gulf Oil Spill; Senator Lee "Trip" Pittman received $750,000 from BP grant funds, assisted by Fairhope Mayor Tim Kant, and was later involved in subpoenas for fraud and witness intimidation.
      THE DISCOVERY: Article 2 established that Senator Pittman misused $750,000 in BP grant funds while working as a retail tractor salesman, alongside the failure of accountability mechanisms in Alabama.
      THE PIVOT: Article 2 provides the historical evidence of Pittman's initial misuse of BP disaster funds (the $750k transaction and associated cover-up), contextualizing the subsequent, documented lack of audits and further high-value grant fraud detailed in Article 1 (e.g., $639,000 and $98,000).
