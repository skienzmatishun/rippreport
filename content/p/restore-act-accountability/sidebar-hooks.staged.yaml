  what-triangle-lawsuit-details:
    brief: |-
      THE CONFLICT: Gulf Oil Spill occurred in 2010; Monies were distributed as grants in Baldwin County; Senator Lee "Trip" Pittman received $639,000 from Fairhope and $98,000 from Perdido Key; Brett Robinson received $36 million of BP disaster money; Governor Bob Riley brokered deals granting $36-$40 million; Mayor Stan Wright (Bayou La Batre) was convicted of grant fraud; The Mayor of Fairhope was subpoenaed to Federal Court in Mobile regarding the BP Boom Grant.
      THE DISCOVERY: The City of Fairhope entered a conditional settlement involving the Triangle Property on April 8, 2013, without public participation; The final settlement allowed for commercial/industrial use, contradicting public reporting; The $22 million in BP Restore Act funds was proposed using a flawed $30,000 Thompson Engineering study ("Fly Creek Watershed Restoration Plan"); The City paid $3 million in attorney fees related to the Dyas Lawsuit and undisclosed $5 million in city cash payments and $5.75 million in new debt.
      THE PIVOT: Widget Article provides concrete evidence of corruption in Fairhope, showing how the BP Restore Act funds were linked to a secret, non-publicly authorized lawsuit settlement (Triangle Property), directly substantiating the broader allegations of grant fraud and abuse of BP money detailed in the Main Article, while also confirming legal investigations involving the Mayor and Senator Pittman.
      KEY ENTITIES: BP-Oil-Spill; 2010; Baldwin County; Governor Bob Riley; Senator Lee "Trip" Pittman; Brett Robinson; City of Fairhope; City of Perdido Key; Triangle Lawsuit; April 8, 2013; Hand-Arendall; Cain O'Rear; Thompson Engineering; $639,000; $36 million; $22 million; Stan Wright; AMIC; Dyas Family; Arthur Corte; Tim Kant; November 2014.
    llm_text: How did Fairhope use $22 million in BP Restore Act funds for a secret Triangle Property settlement on April 8, 2013? This evidence confirms grant fraud allegations, linking the money directly to investigations involving Mayor Stan Wright and Senator Lee "Trip" Pittman.
