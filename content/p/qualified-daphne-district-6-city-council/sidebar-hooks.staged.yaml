      Haygood was appointed mayor in early 2013, following his win for District 7 on the Daphne City Council in 2012.
      Councilman John Lake had represented District 3 for 24 years.
      The District 6 incumbent at the time was Robin LeJeune.

      THE DISCOVERY:
      Article 2 established the political environment of Daphne in 2013, showing incumbents (like Tommie Conaway in District 1 and Angie Phillips in District 7) and challenges across various districts (D2, D3, D4, D5, D6).

