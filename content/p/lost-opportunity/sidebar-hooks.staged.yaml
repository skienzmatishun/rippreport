  fact-and-fiction-a-b-c:
    brief: "THE CONFLICT: Councilman Jack Burrell, along with Boone and Brown (the \"three B's\" / \"CATALYST council\"), forced the purchase of recreation land next to the airport for $2.6 million despite public opposition. The property is only leased out for $9,000 a year as farming land. Due to anticipated municipal income loss from COVID-19, the Mayor of Fairhope had to cut $2.6 million from the city budget (affecting staff, police, fire, sewer projects, and capital improvements). Municipal elections were set for August 25th.\n\nTHE DISCOVERY: The older widget article (\"FACT and FICTION A B C\") revealed a pattern of covert behavior and \"secret deals\" by Jack Burrell regarding municipal matters, noting that he delays presenting facts until citizens have no voice, blends fiction into details, and attempts to deflect accountability (such as denying a party at his house while deflecting blame to his son and in-laws). \n\nTHE PIVOT: Article 2 serves as the smoking gun because it establishes a historical pattern of deception, secret deals, and manipulation by Jack Burrell (\"Jack is involved AGAIN\"). It shows that the $2.6 million airport land purchase highlighted in Article 1 is not an isolated incident of bad policy, but part of a long-standing modus operandi of backroom maneuvering that the Ripp Report has tracked for years.\n\nKEY ENTITIES:\n- Jack Burrell (Councilman)\n- Boone (Councilman)\n- Brown (Councilman)\n- The \"Three B's\" / CATALYST Council\n- WACO Radio\n- The Courier (tabloid)"
