      *   Council members received a full family insurance package valued at $17,000 annually.

      THE DISCOVERY:
      *   In September 2022, the council proposed a $2.65 million purchase for recreation land south of the airport, supported by Council members Boone Burrell and Brown.
      *   This land purchase caused difficulties in approving the city budget, which was past due for three consecutive years.
      *   Mayor Sullivan's appointment to Utilities Superintendent (with no utility management experience) was viewed as a way to increase her salary above $100K.

      THE PIVOT:
      *   The ongoing, systemic failures in infrastructure (sewer, soccer fields, waterfront project) and budget management (2.65M land purchase, delayed budgets) detailed in Article 2 provided the underlying context for the political actions in Article 1.
      *   These long-term financial and utility failures led to the council denying public participation rights, prompting the federal lawsuit (FRANCIS PAUL RIPP, v. JACK BURRELL, etc.) and subsequent legal defeat for Jack Burrell.

