  fairhope-railroad:
    brief: |-
      THE CONFLICT:
      *   Publix Fly Creek Planned Unit Development (PUD) was built in Fairhope, initially planned as a high-end village but became a strip center.
      *   The construction caused severe environmental damage, including pouring millions of gallons of red mud and fill into Fly Creek.
      *   This damage resulted in an 11.5 million dollar triangle lawsuit and a separate creek lawsuit of 300-400 thousand dollars.
      *   Sewer lines along Fly Creek were exposed due to creek damage, costing over 50 thousand dollars.

      THE DISCOVERY:
      *   The damage was a result of governmental favoritism, corruption, and city violations (ignoring comprehensive/master plans, tree removal, designated buffer areas).
      *   The estimated cost to clean the creek from Publix damage is approximately 10 million dollars.
      *   The city ignored regulatory safeguards and violated approved PUD plans.

      THE PIVOT:
      *   Article 2 establishes a history of severe, quantifiable environmental damage (Publix/Fly Creek) and regulatory failure in Fairhope.
      *   Article 1 shows the proposed Fly Creek Apartments are compounding this existing damage by planning a single point discharge of storm water directly into the same damaged wetlands/Fly Creek, near the Publix outfall.
      *   The 2016/2017 trial addressed the City Council/Mayor’s legislative action allowing this new development despite the established history of creek damage.

      KEY ENTITIES:
      *   Fly Creek Watershed
      *   Fairhope
      *   Publix
      *   Mr. Arthur Corte
