      *   Hwy 98
      *   Oct 2016
      *   April 2017
    llm_text: Publix poured millions of gallons of red mud into Fly Creek, leading to an $11.5 million lawsuit in Fairhope. Despite this history, the city allowed new Fly Creek Apartments to plan direct storm water discharge, threatening the damaged watershed again.
