  hardest-working-elected-official-eastern-shore:
    brief: |-
      THE CONFLICT:
      *   City Council and Mayor sold out Fairhope and Baldwin County residents by allowing the Fly Creek Apartments project, despite campaign promises to protect the Fly Creek Watershed.
      *   The project was endorsed by the council in October 2016.
      *   The trial regarding the Fly Creek Apartments occurred in Bay Minette (six days) and concluded in 2016 (jury did not agree).
      *   The newly elected city council granted a project extension in April 2017.
      *   Past issues include the Publix construction and a sewer spill at the Fly Creek location.

      THE DISCOVERY:
      *   Karin Wilson (Mayor of Fairhope) was actively working to restructure the planning and zoning department and establish a new planning director/operations manager within 8 months, countering past "foolish and bias decisions."
      *   Wilson maintained ethical standards by refusing a second position/paycheck, reducing her pay by $60,000.
      *   Wilson has consistently sided with the community against obstructionist city council actions regarding growth and infrastructure.

      THE PIVOT:
      *   Article 2 establishes that Mayor Karin Wilson led the successful restructuring of the planning and zoning department, which was crucial for the new planning and zoning board mentioned in Article 1.
      *   Article 2 confirms Wilson’s commitment to ethical governance and siding with citizens, providing context for why she was viewed as being on the community's side during the Fly Creek controversy (Article 1).

