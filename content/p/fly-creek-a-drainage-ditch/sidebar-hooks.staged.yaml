  wonderful-wednesday-4:
    brief: |-
      THE CONFLICT:
      *   Under the administration of Mr. Burrell, Mr. Boone, and Mayor Kant, major infrastructure projects (airport, soccer fields, triangle lawsuit) totaling approximately $50 million occurred in Fairhope.
      *   The City Council allowed the Fly Creek Apartments project in the Fly Creek Watershed despite public opposition.
      *   A six-day trial in Bay Minette occurred (2016) regarding the apartment project, where the plaintiff's attempt to overturn legislative action failed.
      *   The City Council endorsed the apartment project in Oct 2016.
      *   The new drainage plan proposes a single point discharge into wetlands (owned by Jack Burrell and Kevin Boone) near Fly Creek, combined with drainage from the Publix construction.

      THE DISCOVERY:
      *   Fairhope exhibits high political dysfunction, evidenced by 84% of eligible voters not participating in recent US Senate primary statistics.
      *   The current city council is focused on assisting three city employees (Jennifer Fidler, Sherry Sullivan, Pandora Heathcoat) with litigation against the city, each seeking $100,000.
      *   The council's actions, including using subpoenas, are seen as diverting attention from historical issues and Mayor Kant's airport misdeeds.

      THE PIVOT:
      *   Article 2 establishes that Jack Burrell and Kevin Boone were part of the previous administration and subsequently own the wetlands utilized for the controversial drainage discharge point detailed in Article 1.
      *   Article 2 provides the historical context of council obstruction and conflicts of interest (e.g., Councilman Jay Robinson's conflict, Mayor refusing to sign the resolution), explaining the political dysfunction that allowed the City Council to ignore public concerns for the developer in Article 1.

