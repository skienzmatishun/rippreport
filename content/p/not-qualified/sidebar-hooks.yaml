      he was charged with assault and subsequently acquitted by jury (Widget Article).

      - Al Tolbert, a former Bay Minette Police Chief, had long-standing conflicts
      with Harry Still due to Still representing victims of police misconduct; Tolbert
      is now with BCSO (Baldwin County Sheriff’s Office) (Widget Article).


      THE DISCOVERY:

      - Judge Robert Wilters presided over the trial that produced Murray Lawrence
      Jr.’s conviction and is currently the District Attorney whose office was represented
      by Kristi Hagood on the Rule 32 motion, creating a direct conflict of interest
      that required recusal (Main Article/Widget Entity connection).

      - Harry Still’s assault trial against Matt Franklin resulted in a “not guilty”
