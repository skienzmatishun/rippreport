      *   Baldwin County School Superintendent Eddie Tyler initially called revisiting the penny sales tax a "waste of political oxygen" but was tied to the permanent tax extension.

      THE DISCOVERY:
      *   Article 2 revealed Chris Elliott leveraged the Baldwin County School System and its personnel (Eddie Tyler, Jonathan Gray) for political gain, demonstrating his deep ties to the Catalyst political machine.
      *   Article 2 established the BCA's financial support to Elliott, showing his indebtedness to powerful backroom political groups.

      THE PIVOT:
      *   Article 2 provides the historical context demonstrating that Elliott's political power (through manipulating schools and securing the penny tax) is rooted in the corrupt Catalyst mindset, which is now facing electoral challenge in the State Senate Seat 32 run-off detailed in Article 1.

