  zunk-the-skunk:
    brief: |-
      THE CONFLICT:
      *   June 2018: Debate in Fairhope over adopting a Council-Manager form of government versus the existing Council-Mayor form.
      *   Mayor Karin Wilson publicly supported the Council-Manager form of government (June 21, 2018).
      *   Chuck Zunk opposed the official process, manipulating a survey (65 votes, 39 for At-Large) to push for the Council At-Large structure, despite guidance from Judge Tim Russell.
      *   Current conflict (Main Article): Catalyst political machine (linked to Chris Elliott) is in war with duly elected Mayor Karin Wilson over control of Baldwin County resources (County Commission, State Senate Seat 32).

      THE DISCOVERY:
      *   Article 2 reveals that the conflict between Mayor Wilson and opposing local figures (like Chuck Zunk and Jack Burrell) is rooted in a specific, documented 2018 attempt to change the city's form of government.
      *   Article 2 documents Zunk's tactics of obstruction and misleading the public regarding the approved petition vs. his own manipulated survey.

      THE PIVOT:
      *   Article 1 states Catalyst lost Fairhope and is at war with Mayor Karin Wilson; Article 2 provides the specific historical context (June 2018) and documented contentious actions (Zunk's opposition/manipulation) that define this deep-rooted local conflict, showing the political opposition is not new but sustained.

      KEY ENTITIES:
