  selective-memory:
    brief: |-
      THE CONFLICT:
      *   Mayor Wilson fired Sherry Sullivan and Jennifer Fidler.
      *   The City Council responded swiftly, calling a special meeting chaired by Kevin Boone, and proposed a 60-day hiring freeze.
      *   This conflict occurred prior to March 9th (when the next regular meeting was scheduled).
      *   The Council's actions were viewed as favoring the "losing party in the last election."

      THE DISCOVERY:
      *   The Council was politically biased, ignoring constituents who voted for "change and transparency" and prioritizing political loyalty (to "Jack").
      *   The Council was not listening to facts but rather "fiction" based on political affiliation.

      THE PIVOT:
