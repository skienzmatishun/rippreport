    brief: |-
      THE CONFLICT: Kevin Boone, Tucker Dorsey, and Chris Elliott are connected via complex LLCs in Baldwin County, operating within a network described as having been in place for over 50 years.
      THE DISCOVERY: Elected officials (Boone, Dorsey) use LLCs to conceal business and personal financial ties (e.g., campaign contributions) to firms like Preble-Rich/Dewberry (associated with John Avent), enabling them to vote in their own self-interest while the Alabama Ethics Commission is ineffective.
      THE PIVOT: Article 2 establishes that Councilmen Boone and Burrell operate within a pervasive system of undisclosed, self-serving conflicts of interest via LLCs, providing the historical context for the material misrepresentations (regarding drainage system and red soil) made by Defendants Leaf River and Corte during the 2016 Fly Creek PUD Amendment approval, which benefited these interconnected interests.
