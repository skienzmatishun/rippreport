  round-and-round-we-go:
    brief: |-
      THE CONFLICT:
      1. Defendants Leaf River and Corte made representations to the City of Fairhope Planning Commission and City Council between January 2016 and April 2016 regarding the Fly Creek PUD Amendment.
      2. Defendants misrepresented drainage plans, stating a sensitive non-point discharge system would be used, when they planned a point discharge system connecting to a deficient retention pond.
      3. Defendants misrepresented compliance with Red Soil Ordinance #1423, claiming no red soil would be used on the entire site, when they planned to move red soil into critical areas within 100' of wetlands and Fly Creek.
      4. The PUD Amendment was approved despite material non-disclosure; Fly Creek remains filled with red mud, the detention pond has failed, and a lawsuit has been settled and is pending.
      5. Council President Burrell denied a request for the updated job description for Public Works Director to be added to the agenda.

      THE DISCOVERY:
      1. Baldwin County Commissioner Chris Elliott stated that the 13/48 intersection (Highway 13 and Fairhope Avenue) is partially in the city and partially in the county.
      2. The area is governed by Extra Territorial Jurisdiction (ETJ), meaning the City of Fairhope issues building permits and has subdivision authority, regardless of county zoning.
      3. The roundabout construction required property acquisition, and the owner of the remaining parcel operates gas stations in Baldwin County.

      THE PIVOT:
      1. Article 2 establishes the City of Fairhope’s regulatory power (ETJ) over development at major intersections, which is the same regulatory body involved in the PUD Amendment controversy detailed in Article 1.
      2. The land use/developer entities mentioned in Article 1 (Leaf River and Corte) and the owner of the gas station parcel mentioned in Article 2 are both subjects of City of Fairhope permitting requirements and development controversies.

      KEY ENTITIES:
      1. Burrell (Council President)
      2. Leaf River (Defendant)
      3. Corte (Defendant)
      4. City of Fairhope
      5. Fly Creek
      6. Baldwin County Commissioner Chris Elliott
      7. Highway 13 and Fairhope Avenue (13/48)
      8. Red Soil Ordinance #1423
      9. Planning Commission
      10. Mayor (newly elected, sympathetic to opposition)
    llm_text: 'Leaf River and Corte misled Fairhope about Fly Creek drainage and violated Red Soil Ordinance #1423 during the PUD amendment. Discover how the City of Fairhope''s Extra Territorial Jurisdiction governs development at major intersections like 13/48.'
