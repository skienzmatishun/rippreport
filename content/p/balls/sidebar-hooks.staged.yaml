  you-dont-know-jack:
    brief: |-
      THE CONFLICT: Ground lease for a commercial hangar on plat 2 at Fairhope Airport Authority was awarded on November 17, 2015, to Hix/Snedecker Companies DBA Mid-Bay Air,llc.
      THE DISCOVERY: Jack Burrell, President of Fairhope City Council and an Airport Authority member, was part of the committee reviewing and recommending the Mid-Bay Air bid, which benefited Airport Authority Board member Ray Hix and Municipal Judge Mr Snedecker.
      THE PIVOT: Article 2 establishes a pattern of ethical compromise, conflict of interest, and lack of transparency involving Council President Jack Burrell and the City/Airport Authority (2015), providing historical context that casts doubt on the integrity of the City Council's approval of the Fly Creek PUD Amendment and subsequent environmental damage (2016).
