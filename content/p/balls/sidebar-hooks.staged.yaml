  fairhope-voters-important-notice:
    brief: |-
      THE CONFLICT: Political struggle in Fairhope involving Councilmen Boone and Burrell and the opposition to newly elected Mayor Wilson; Catalyst Associates formed on Aug. 11, 2014, by Councilman Boone's family (Michael Scott Boone, Coley M. Boone).
      THE DISCOVERY: Catalyst Associates, linked to Councilmen Boone and political group Elliott, Haygood, and Stacy, used influence to undermine Mayor Wilson and slow city business (e.g., hiring freezes, rejecting Airport Authority board choices).
      THE PIVOT: The political influence and established power structure identified in Article 2 (Boone/Burrell/Catalyst) enabled the Council to approve the Fly Creek PUD Amendment (Jan-Oct 2016) despite known material misrepresentations by Defendants Corte and Leaf River, as detailed in Article 1.
      KEY ENTITIES: Council President Burrell, Corte, Fly Creek, Mayor Wilson, Boone (Michael Scott/Coley M.), Catalyst Associates, Leaf River, Fairhope Planning Commission.
    llm_text: Councilmen Boone and Burrell used Catalyst Associates to undermine Mayor Wilson and slow Fairhope city business. This established power structure later approved the controversial Fly Creek PUD Amendment despite misrepresentations by Corte and Leaf River.
