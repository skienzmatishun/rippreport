      - Lawsuit concerned Gables on Lawrence, approx. 20 acres at corner of Lawrence Road and Marshall Lane; Skyline Village, approx. 16.5 acres along Dyer Road.
      - Fairhope has infamous reputation of changing rules after the fact.
      - Last multimillion dollar case involved Triangle; taxpayers paid almost $3 million in legal fees and judgment; city bought Triangle for $8.25 million; total $11.25 million taxpayer money.
      - Fairhope hired law firm Hand Anderall Sale as additional counsel; Hand Anderall was law firm that lied to Fairhope citizens over Triangle lawsuit, costing taxpayers $3 million in legal fees.
      - Attorney Cain O’Rear raised right hand in Fairhope City Council Chambers and promised citizens “the city would not have to pay any legal fees”; later turned out to be false.
      - After failed attempts, Fairhope gave Triangle property to Single Tax Corporation.
      - Fairhope kills geese, does not want medical marijuana, and will build electric sub station in a neighborhood, against wishes of neighborhood; waterfront project 2 years overdue; K-1 center mismanaged under Councilman Jack Burrell; Mayor gets two payroll checks from city and Council enjoys 100% health care; Fairhope taxpayers clueless.

