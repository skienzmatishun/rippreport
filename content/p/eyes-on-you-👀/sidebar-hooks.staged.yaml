      - Mayor Wills added two 5-year lease extensions to himself.
      - Mayor Wills has Ethics complaint and Bar complaint pending; complaints to be filed in corruption file of both agencies, described as equally corrupt.
      - Mayor Wills equal partner in covering up O.J. French killing by Bay Minette Police; joined by State Senator Chris Elliott and Sheriff Hoss Mack.
      - State Rep. Matt Simpson, House seat 96, chairman and spokesman for newly elected BCLD, confronted about lease; said “It’s Legal”; could not say it was ethical, transparent, or no perception of corruption.
      - Simpson elected to House in 2018; appointed chairman of House Ethics & Campaign Finance Committee by Alabama Speaker of House; speaker unaware of BCLD lease.
      - The Ripp Report filed complaint with Attorney General about lease; appealed to County Commission and BCLD delegates; will amend complaint; notified legal counsel for Speaker of House; plans similar complaints in near future; said would reveal connections and conflicts of interest Mr. Simpson has in his suitcase.

