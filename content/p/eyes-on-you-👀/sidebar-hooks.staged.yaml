    brief: |-
      THE CONFLICT:
      * Tuesday, Nov. 16: Baldwin County Commission voted to lease a building on D'Olive Street for the Baldwin County Legislative Delegation.
      * Initial lease term: Five years, starting Jan. 1, 2023, to Dec. 31, 2027.
      * Initial proposed cost: $49,080 a year (delegation sought to have half paid by the commission).
      * Key entities involved: Mayor Bob Wills (owner of the building), Baldwin County Legislative Delegation (BCLD), Commissioner Billie Jo Underwood, Commissioner Jeb Ball, Cliff McCollum.

      THE DISCOVERY:
      * The building on D'Olive Street is owned by Mayor Bob Wills.
      * The final lease amount was $245,400 for five years, paid entirely by the BCLD, not split with the commission.
      * Mayor Wills secured two 5-year lease extensions costing $283,000 and $339,000, totaling $867,000 in his family bank account.
      * Mayor Wills has pending Ethics and Bar complaints for past "SELF DEALING."
      * O.J. French killing cover-up allegedly involves Mayor Wills, State Senator Chris Elliott, and Sheriff Hoss Mack.

      THE PIVOT:
      * Article 2 established the initial self-dealing by Mayor Wills (building ownership, initial lease terms, O.J. French context) before the extensions and the full scope of corruption detailed in Article 1.

