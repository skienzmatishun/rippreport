  there-are-more-of-us-than-them:
    brief: 'THE CONFLICT:

      *   Angus Cooper held a fundraiser for Mayor Kant in the recent election cycle.

      *   Cooper discussed next year''s budget with the City Council, including Diana
      Brewer.

      *   The council agreed to charge $17,500/hour for senior bowl players practicing
      at the Fairhope facility.

      *   This arrangement cost taxpayers $35,000 for two hours of use, with Fairhope
      supplying utilities/maintenance.

      *   Diana Brewer voted on the football arrangement despite Cooper being on the
      Maritime museum board, constituting a conflict of interest.


      THE DISCOVERY:

      *   The second article details systemic corruption in Baldwin County involving
      County Commissioners.

      *   Tucker Dorsey and Elliot served as County Commissioners around the time
      of Cooper''s tenure.

      *   Dorsey, with Elliot, received criticism for actions in 2016 regarding the
      county''s conduct (e.g., flag protocols).

      *   Dorsey and Elliot were also involved in firing whistle-blowers regarding
      "Pittman Kant BP fraud."


      THE PIVOT:

      *   The second article establishes a pattern of entrenched corruption, poor
      fiscal management (e.g., $30M+ mega-site loss), and ethically compromised officials
      within the same county/political machine sphere as the transaction described
      in Article 1.

      *   It frames local political figures (like Cooper/Kant discussed in Article
      1) as part of a wider, systemic body ("the good ole boys") involved in questionable
      financial deals benefiting insiders.


      KEY ENTITIES:

      *   Angus Cooper

      *   Mayor Kant

      *   Diana Brewer

      *   Tucker Dorsey

      *   Elliot'
