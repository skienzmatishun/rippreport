  triangle-lawsuit-settlement-2013:
    brief: 'THE CONFLICT:

      *   Mayor Timothy Kant negotiated deals during the BP boom scandal era, involving
      Fly Creek Watershed damage and the Publix Project.

      *   Kant pursued BP funding for environmental remediation projects (Fly Creek
      Restoration, TTI Swamp) through the City of Fairhope.

      *   The city council ratified decisions influenced by Mayor Kant.


      THE DISCOVERY:

      *   Kant’s pursuit of BP funds (including up to $500 million requested) was
      based on alleged corruption and misleading statements regarding the environmental
      damage claims.

      *   Kant, as Mayor, was involved in activities leading to a federal grand jury
      summons and allegations of grant fraud related to the BP spill.


      THE PIVOT:

      *   Article 2 establishes a pattern of financial corruption and inflated claims
      (e.g., $19M Fly Creek ask vs. actual cost, $500M total requested) while seeking
      BP money to cover liabilities arising from the Mayor''s tenure and relationships
      (e.g., with Arthur Corte).

      *   Article 1 shows a continuation of this questionable practice, wherein current
      officials (Angus Cooper) secure high-priced facilities services from the community
      while benefiting from the flawed foundation set during Kant’s era.


      KEY ENTITIES:

      *   Timothy Kant (Mayor)

      *   Arthur Corte (Developer/Land Owner)

      *   BP

      *   Fly Creek Watershed

      *   $500 Million (Requested from BP)

      *   Angus Cooper

      *   Diana Brewer'
