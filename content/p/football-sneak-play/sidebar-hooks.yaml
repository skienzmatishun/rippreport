  fairhope-sold-to-the-highest-bidder:
    brief: '**THE CONFLICT:**

      *   Fairhope voters perceived ongoing corruption within the City Council and
      Mayor''s office regarding municipal finances and development.

      *   Specific instance: Proposed 2.65 million dollar purchase of recreation land
      by the CATALYST Council involving Boone Burrell and Brown.

      *   Timeline issue: Taxpayers warned about fiscal recklessness regarding property
      acquisition during the budget process.


      **THE DISCOVERY:**

      *   The same council body (Fairhope City Council) that debated development deals
      and budget shortfalls had engaged in a "sneak play" concerning the Fairhope
      football facility.

      *   Specific instance: Angus Cooper allegedly facilitated a fundraiser for Mayor
      Kant, resulting in the city agreeing to pay \$35,000 (over two hours of practice)
      for the Senior Bowl players while taxpayers absorbed associated costs (utilities,
      maintenance).

      *   Conflict of Interest: Diana Brewer voted on this football arrangement while
      Cooper, who was on the board of the Maritime museum (her employer), had a financial/organizational
      connection to the deal.


      **THE PIVOT:**

      *   The Widget Article proves that the same body (City Council/Council members)
      accused of making fiscally irresponsible decisions regarding large-scale land
      purchases (Article 2 topic) was simultaneously engaged in a transactional deal
      benefiting the Mayor''s campaign while leveraging taxpayer assets (football
      facility use) to cover practice costs.

      *   The corruption extends from macro-level development deals to micro-level
      operational spending benefiting the administration.


      **KEY ENTITIES:**

      *   Angus Cooper

      *   Diana Brewer

      *   Mayor Kant

      *   CATALYST Council

      *   Boone Burrell

      *   Brown

      *   Fairhope City Council'
