  you-dont-know-jack:
    brief: |-
      THE CONFLICT: Ground lease for a commercial hangar on Plat 2 at Fairhope Airport was awarded to Hix/Snedecker Companies DBA Mid-Bay Air LLC on December 17, 2015.
      THE DISCOVERY: The Widget Article detailed the process, including an RFP sent on September 21, 2015; bid opening on October 20, 2015; Ray Hix's recusal on November 17, 2015; and Jack Burrell's motion to award the bid to Hix/Snedecker Companies on November 17, 2015, seconded by Vince Boothe.
      THE PIVOT: The detailed timeline and the motion to award (November 17, 2015) established the conflict of interest (Airport Board member Hix securing a lease) that necessitated the 2016-04 advisory ethics opinion and the subsequent 2016 inquiry to the Alabama Ethics Commission (Nov 8, 2016 request, Dec 2, 2016 reply stating no lease had been submitted).
      KEY ENTITIES: Jack Burrell, Ray Hix, Vince Boothe, Mr Snedecker (Fairhope Municipal Judge), Mid-Bay Air LLC, Fairhope Airport Authority, Alabama Ethics Commission, Pam Caudill, Joe McEnerey, Mayor Wilson.
    llm_text: Airport Board member Ray Hix secured a hangar lease for Mid-Bay Air LLC on December 17, 2015. See how Jack Burrell's motion and the Alabama Ethics Commission inquiry exposed a major Fairhope conflict of interest.
