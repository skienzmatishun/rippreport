  dont-throw-rocks-if-you-live-in-a-glass-house:
    brief: |-
      THE CONFLICT:
      *   Dec 23, 2015: Airport Authority signed a memorandum of lease with Mid-Bay Air LLC.
      *   Ray Hix, an Airport Authority board member, proceeded with the lease despite confidential information regarding airport leases and bids.
      *   The lease was signed prior to securing an advisory ethics opinion (2016-04).
      *   Dec 2, 2016: Alabama Ethics Commission stated no lease had ever been submitted regarding the Mid-Bay Air Lease.
      *   The lease is concluded to be null and void due to conflict of interest and failure to comply with ethics rules.

      THE DISCOVERY:
      *   The previous administration (Mayor Kant/Council President Burrell) failed, leading to the election of Mayor Karin Wilson and new council members (Conyers, Brown, Robinson).
      *   Jack Burrell, the previous council President, had supported Mayor Kant for four years.
      *   Burrell later self-nominated for AMEA position (4-0 vote) despite Mayor Wilson’s polite request for consideration.
      *   The new council was elected specifically due to the failure of the last administration.

      THE PIVOT:
      *   Article 2 establishes that the previous administration (Kant/Burrell) was fundamentally compromised and failed, creating a public demand for change and scrutiny.
      *   Article 1 reveals specific, documented evidence (the 2015 lease/Ethics Commission replies) of a major conflict of interest involving key figures like Jack Burrell and Ray Hix, validating the public desire for accountability expressed in Article 2.

