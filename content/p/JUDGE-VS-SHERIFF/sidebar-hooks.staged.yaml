      *   Hoss Mack (Sheriff, BCSO)
      *   Robert Wilters (Baldwin County District Attorney)
      *   Trip Pittman (State Senator, sponsored SB 312)
      *   Greg Shaw (Associate Justice, majority in *Lagniappe v. Mack*)
