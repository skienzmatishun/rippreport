  pure-kafka:
    brief: |-
      THE CONFLICT:
      - Baldwin County controversy: Sheriff Hoss Mack (“No Body Cam Available,” “The Boss”) vs. Judge; Baldwin County District Attorney Robert Wilters aligned with Sheriff Mack.
      - Sheriff Hoss Mack and District Attorney Robert Wilters asked a judge to change his ruling compelling the Sheriff’s Office to return a car that deputies seized earlier this month.
