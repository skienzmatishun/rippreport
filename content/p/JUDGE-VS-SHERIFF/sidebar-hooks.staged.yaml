      - Organizations: Baldwin County Sheriff’s Office/BCSO, Baldwin County District Attorney, Alabama State Bar, 5th Circuit, Massachusetts State Police, Boston Police Department, West Alabama Corridor.
      - Locations: Baldwin County, Alabama; Pensacola Beach; Boston, Mass.; Mobile County, Alabama; Alabama.
      - Dates/events: Senate Bill 312; about 10 years ago; three years earlier; $750,000.00; B/P money; 2021; Lagniappe v. Mack; earlier this month; late Friday; Federal Crime of being a drug user (marijuana) in possession of a firearm; 68 Chevy Camaro.
