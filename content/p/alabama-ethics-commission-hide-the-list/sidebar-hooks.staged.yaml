  top-to-bottom-corruption:
    brief: |-
      THE CONFLICT:
      - Mabel Amos Memorial Fund (MAMF), a charitable trust, received millions after a 2011 Canadian wildcatter oil discovery in Conecuh County.
      - Between 2013 and 2021, over $3.2 million in scholarship funds were distributed to judges, bankers, lawyers, politicians, and friends of the trustees—including Tom Albritton's two children, who received $120,000 for tuition at the University of Texas.
      - Amos relatives filed a civil suit against Regions Bank (which managed the trust and took over $1 million in fees), and plaintiff Tyra Lindsey petitioned to force Regions to reveal the names of all scholarship recipients after 2014.
      - Alabama Attorney General Steve Marshall previously accused Tom Albritton of fraud and self-dealing, but later reversed course to block plaintiffs from obtaining the recipient list, reaching a deal with Regions to make the trust whole while keeping the names sealed.

      THE DISCOVERY:
      - The historical context reveals the exact mechanism of self-dealing: how the Albritton Law Firm and Regions Bank administered the trust, how oil wealth corrupted its original intent, and how elite beneficiaries (including Albritton's family) siphoned funds meant for needy students.
      - It exposed the web of conflicts involving AG Steve Marshall—who accused trustees of criminal offenses but later tried to push plaintiffs out of the litigation—alongside financial and political ties between Marshall, Regions Bank, and their shared legal representation.
      - It documented how the Alabama Bar, the judiciary (Judge Johnny Hardwick stalling motions), and state officials actively enabled the cover-up and fought to keep the recipient list hidden from the public.

      THE PIVOT:
      - Article 2 (the Lagniappe newsletter from July 15, 2023) serves as the smoking gun because it maps out the exact origins of the $3.2 million scandal, shows that Tom Albritton engaged in direct self-dealing while serving as the Executive Director of the Alabama Ethics Commission, and documents the collusion between AG Steve Marshall and Regions Bank to seal "The List" and protect the corrupt political establishment.

