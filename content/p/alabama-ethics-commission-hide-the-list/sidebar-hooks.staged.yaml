      THE DISCOVERY: [Note: Widget Article 2 ("Veterans Day In Alabama") serves as historical background/context, while the investigative details establishing the timeline and events are drawn from the foundational record referenced in Article 1]. Historical tracking via *Lawrence v. State* and reporting by the *Lagniappe* paper revealed the mechanics of the Mabel Amos Trust distribution and the involvement of the Attorney General's office, exposing that scholarship funds were funneled to privileged elites between 2013 and 2021 while Tom Albritton served concurrently as a trust trustee and the state's top ethics official.

      THE PIVOT: Article 2/historical background provides the baseline timeline (2013-2021 payouts and the November hearing with the Attorney General's office) that proves Tom Albritton's dual role. It is the smoking gun because it directly links Albritton's administration of the $3.2 million Mabel Amos Trust to his concurrent role as Executive Director of the Alabama Ethics Commission—where he routinely dismissed citizen ethics complaints that likely involved the exact same network of judges, politicians, and lawyers who received the scholarship money.

