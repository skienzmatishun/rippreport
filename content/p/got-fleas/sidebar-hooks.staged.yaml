      *   The City of Fairhope purchased an E-ONE Custom Rescue Pumper Fire Truck for $517,157.00 from a joint 60/40 split with the Fairhope Volunteer Fire Department.

      THE DISCOVERY:
      *   The City Council, led by Jack Burrell, made significant financial and contractual decisions (e.g., clock purchase, fire truck acquisition, farmland deals) while adhering to or circumventing public gathering limitations (COVID-19 restrictions).
      *   Council President Burrell authorized the cancellation of public participation during the "stay at home order."
      *   Sherry Sullivan was promoted by Council members (Burrell, Brown) as a potential "CATALYST" candidate for Mayor.

      THE PIVOT:
      *   Article 2 establishes a historical pattern of council actions (prior to the current Waterfront debate) involving limited public participation, politically influenced contracts, and short-sighted deals during a public health crisis.
      *   This history undercuts the argument (made by Howell Raines in Article 1) that the current administration's lack of public vetting is a unique or newly developed failure, showing a precedent for limited public input dating back to COVID-19 council actions.

