  what-triangle-lawsuit-details:
    brief: |-
      THE CONFLICT:
      *   Triangle Lawsuit involved the Triangle Property (Dyas Family land).
      *   The lawsuit settlement was initiated around April 8, 2013, and finalized in December.
      *   The settlement involved a $12.5 million expenditure, $3 million in attorney fees (paid by taxpayers), $3 million withdrawn from utility reserves, and a $5.75 million new debt loan from Compass Bank.
      *   The City of Fairhope (Mayor Tim Kant/Council) purchased the land via this settlement.

      THE DISCOVERY:
      *   The April 8, 2013 council meeting authorized the Mayor to enter a conditional settlement agreement involving the Triangle Property, which was not publicly disclosed or presented for citizen input.
      *   The conditional settlement agreement initially restricted commercial use but the final agreement allowed for any use, conditioned upon PUD and Planning & Zoning.
      *   The City used a $30,000 Thompson Engineering study, "The Fly Creek Watershed Restoration Plan," as the basis for the BP Restore Act application, which conveniently omitted that the primary damage in Fly Creek Watershed was caused by Arthur Corte's development of the Shoppes at Fairhope Village/Publix supermarket.

      THE PIVOT:
      *   Article 2 (Widget) proves the legal and financial origins of the Fly Creek land (Triangle Lawsuit settlement), establishing the historical context for the current BP Restore Act application referenced in Article 1.
      *   Article 2 confirms the deliberate exclusion of public participation in the settlement process (April 2013/December), supporting Article 1's claim that the Mayor and Council conspired to omit public input regarding the $3 million expenditure.
      *   Article 2 details that Thompson Engineering's study was "cut and paste" and failed to identify specific watershed problems, linking the flawed study directly to the settlement used for the BP Restore Act claim.

