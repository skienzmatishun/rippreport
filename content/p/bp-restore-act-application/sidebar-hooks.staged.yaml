  restore-act-accountability:
    brief: |-
      THE CONFLICT:
      *   Gulf Oil Spill occurred in 2010.
      *   BP grant monies were distributed throughout Baldwin County, overseen by Governor Bob Riley and the Alabama Emergency Management Association.
      *   Senator Lee "Trip" Pittman received $639,000 from the City of Fairhope.
      *   The Fairhope Mayor was subpoenaed to Federal Court in Mobile concerning the BP Boom Grant, facing allegations of grant fraud, intimidating witnesses, forgery, and collusion.
      *   Mayor Stan Wright of Bayou La Batre was convicted of grant fraud.

      THE DISCOVERY:
      *   No local or state agency performed the promised audits to determine how the BP grant monies were spent.
      *   Corruption occurred, including Brett Robinson receiving $36 million for unfinished projects and Bob Riley brokering deals benefiting his associates.

      THE PIVOT:
      *   Article 2 establishes that the Mayor of Fairhope and Senator Trip Pittman were already subjects of criminal investigations (grant fraud, collusion) related to the initial 2010 BP Boom Grant disbursement.
      *   Article 1 shows the current application for Restore Act funds (Fly Creek Watershed Restoration Project, 2013) is a continuation of the questionable use of BP funds to settle old lawsuits (Triangle Lawsuit) and is built upon the flawed, un-audited grant foundation established in 2010.

      KEY ENTITIES:
      *   Senator Lee "Trip" Pittman
      *   Mayor Tim Kant
      *   Governor Bob Riley
      *   Arthur Corte
      *   Thompson Engineering
      *   Fairhope City Council
      *   BP
      *   Hand-Arendall
      *   American Municipal Insurance Corporation
