  sheriff-huey-boss-mack-secret-police:
    refined_source: 68ca06cbe96dc01bbd233e3562212161f3cc6ec709b3b9e9138de3b37ba7ef79
    brief: |-
      THE CONFLICT:
      *   May 2017: Jonathan Victor (unarmed) shot to death by Baldwin County Sheriff Office (BCSO).
      *   March 5, 2018: Robert Yates shot to death by BCSO SWAT team during an eviction dispute.
      *   Kevin J Andrews: Killed in BCSO traffic pursuit.
      *   William ‘Bill’ Smith: Deceased during Fort Morgan area beach patrol.
      *   Murray Lawrence Jr: Falsely incarcerated for over 16 years; case heading to Innocence Project (Attorney Rebecca Chambliss).
      *   Bay Minette: French killed by BCSO; local community formed Bay Minette Justice League (BMJL).

      THE DISCOVERY:
      *   BCSO, led by Sheriff Huey “Hoss” Mack, received over $65 million in funding (2020-2021), including $700,000 for body/vehicle cameras, which Mack claimed would promote accountability and transparency.
      *   Sheriff Mack secured his second term through legislative qualifications written with State Senator Trip Pittman, eliminating 99.5% of competition.
      *   Mack's private business (Mack Funeral Home) received a county contract for unclaimed deceased persons, illustrating a conflict of interest with the County Commission.
      *   The Alabama Supreme Court (Lagniappe decision, Sept 30, 2021) severely limited public access to police records (body cam, 911 transcripts), stripping media/public rights to sue for footage.

      THE PIVOT:
      *   Article 2 establishes a historical pattern of lethal force against unarmed/vulnerable individuals (Victor, Yates) and systemic corruption (political rigging, financial conflicts).
      *   This pattern provides context for Article 1's current crisis: the BCSO's refusal, via Major Crimes Unit (MCU), to release footage or identify the officer involved in French's death, which is protected by the restrictive Alabama Supreme Court ruling (Lagniappe decision) detailed in Article 2.

