      THE CONFLICT:
      *   September 3, 2025: Harry Still (practicing attorney) and Matt Franklin (Bay Minette city councilman) engaged in a skirmish in Franklin's office in downtown Bay Minette.
      *   Still was arrested on a misdemeanor charge of assault.
      *   Bay Minette Police filed a motion to commit Still to a mental institution; Circuit Court Judge Scott Tayor dismissed this motion.
      *   Municipal Judge Marcus McDowell initially found Still guilty in Bay Minette municipal court, despite Franklin admitting he threatened to KILL Still and his dog.
      *   Still appealed to Circuit Court, presided over by Judge Clark Stankowski.
      *   A jury trial resulted in Still being found INNOCENT, NOT GUILTY.

      THE DISCOVERY:
      *   The initial arrest and subsequent guilty ruling by Judge Marcus McDowell were overturned by a Circuit Court jury verdict of not guilty.
      *   Chris Elliott (State Senator) filed legislation seeking harsher punishment for attacking local politicians, claiming Still's incident inspired it; the legislation failed to pass.
      *   The incident highlighted longstanding conflicts between Still and the BCSO/Baldwin County Sheriff Lowery due to Still representing victims of police false arrest and wrongful convictions.

      THE PIVOT:
      *   Article 2 establishes the legal fact that Harry Still was found NOT GUILTY by a jury in Circuit Court.
      *   This acquittal negates the basis for the later "slander" claims made by City of Orange Beach Officials and local newscasters (referenced in Article 1), as they ignored the final, legally binding verdict.

