      \ the current steward (Sheriff Anthony Lowery, former Sheriff Hoss Mack). It\
      \ validates the Ripp Report's earlier claim that Elliott \"knew about the solar\
      \ fields a very long time ago\" by establishing his longstanding influence in\
      \ Baldwin County politics through this network.\n\nKEY ENTITIES: \n- Chris Elliott\
      \ (Alabama State Senator; original Catalyst member; former county commissioner)\n\
      - Mike Van / Mike Vandenheuvel (Elliot's challenger)\n- Lynn Stacy (founding\
      \ member of Stacy/Elliot/Haygood)\n- Haygood (founding member; Mayor of Daphne)\n\
      - Scott Boone Consulting (current operating name for the Catalyst network)\n\
      - Hoss Mack (former Baldwin County Sheriff; driving force of the group)\n- Anthony\
