      \ from using these specific allegations in his campaign, choosing the \"high\
      \ road\" while leaving Elliott in the \"mud.\"\n\nTHE DISCOVERY: \n- The widget\
      \ article documents the history of the \"Catalyst\" network in Baldwin County.\n\
      - Original group was Stacy, Elliot (Chris Elliott), and Haygood formed.\n- Chris\
