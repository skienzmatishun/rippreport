  sheriff-huey-boss-mack-secret-police-2:
    brief: "The bridge brief was rendered. Below are the raw facts:\n\n---\n\n**THE\
      \ CONFLICT (Past Events)**\n- Baldwin County’s political machine, **Catalyst**,\
      \ controlled power for 30+ years: County Commission, State Senate Seat 32 (**Chris\
      \ Elliott**), Mayor of Fairhope, Probate Judge, Sheriff, DA, and judges. Described\
      \ as \"run Baldwin County in a dark closet... much the same as a criminal enterprise.\"\
      \n- **Chris Elliott** was appointed to the County Commission by Gov. Bob Bentley;\
      \ later became State Senator. Ripp Report: he kept \"Catalyst\" sheriff-qualification\
      \ standards so **Huey 'Boss' Mack** (put in power by \"Boom Boom Pittman\")\
      \ could win re-election despite scandal.\n- **Hoss/Huey \"Boss\" Mack** (BCSO\
      \ Sheriff) was alleged in 15+ officer deaths:\n  - **May 2017:** Jonathan Victor\
      \ shot to death; BCSO had no crisis intervention team, no de-escalation training.\n\
      \  - **March 5, 2018:** Robert Yates shot dead after a warning shot; SWAT fired\
      \ over **114 rounds**, concussion grenades, and tear gas — \"not an exigent\
      \ one, nor an emergency.\" Deputy Justin Correa (son of Robert Correa) said:\
      \ \"gonna go in and kill this f*cker if I have to.\"\n  - **Peyton Little:**\
      \ found strangled with seat belt in moving car; declared suicide without questions.\
      \ BCSO investigation didn't inform the deputy that Little was a confidential\
      \ informant receiving threats.\n  - **Murry Lawrence Jr.:** sentenced to life\
      \ without physical evidence (no gun, witnesses, fiber, fingerprints, blood,\
      \ DNA) with multiple alibis.\n  - **Kevin J Andrews** and **William 'Bill' Smith**:\
      \ additional BCSO officer deaths; BCSO policy on motor vehicle pursuits was\
      \ ignored.\n- Mack's private business, **Hoss Mack Funeral Home**, held a county\
      \ contract to handle deceased persons — \"an obvious conflict of interest.\"\
      \ BCSO investigated its own deaths and never called the FBI or ALEA.\n\n**THE\
      \ DISCOVERY (What Article 2 Proves Today)**\n- The **Lagniappe legal decision\
      \ (September 30, 2021)** \"spells the end of public access to law-enforcement\
      \ records that are connected in any way to an investigation.\" All evidence\
      \ in law enforcement custody became exempt from citizen record-access — \"the\
      \ statute might as well be titled the Closed Records Act\" (Chief Justice Tom\
      \ Parker).\n- As a result, BCSO body-cam footage, 911 transcripts, and autopsy\
      \ information for **Mack's cases** are now legally unobtainable by the public.\
      \ The criminal record documented in Article 2 is now officially insulated from\
      \ scrutiny — yet Mack remains in office, backed by Elliott.\n\n**THE PIVOT (Why\
      \ Article 2 Is Elliott's Smoking Gun)**\n- Article 1 accuses **Elliott** of\
      \ being \"the head of the snake known as Catalyst\" and a \"sneaky dirty politician.\"\
      \ Article 2 proves that Elliott protected Mack's secret-police record — keeping\
      \ his qualifications in place, refusing to back him during the Yates scandal,\
      \ covering up officer deaths.\n- Elliott refrained from Vandenheuvel’s harshest\
      \ attacks (calling him a \"lying dirt bag,\" \"self-serving christian hypocrite,\"\
      \ head of Catalyst), but Article 2 documents exactly what those accusations\
      \ refer to: Mack's crimes and Elliott's complicity.\n- The chain: **Catalyst\
      \ machine → Elliott as political protector → Mack as secret police enforcer\
      \ → Lagniappe decision walling off accountability**. Elliott’s \"high road\"\
      \ defense doesn't change that he kept a criminal sheriff in power.\n\n**KEY\
      \ ENTITIES**\n1. **Chris Elliott** — Baldwin County Commissioner (appointed\
      \ by Gov. Bentley), State Senator Seat 32, alleged head of Catalyst. Pushed\
      \ gas-tax increase, covered for Superintendent Eddie Tyler’s broken promise\
      \ on the Gulf Shores school-split lawsuit.\n2. **Huey \"Boss\" Mack / Hoss Mack**\
      \ — BCSO Sheriff; his funeral home (Hoss Mack Funeral Home) holds a county contract\
      \ for deceased persons under special circumstances. Alleged in the Victor, Yates,\
      \ Little, Lawrence, and Smith deaths.\n3. **Jack Burrell** — Fairhope Council\
      \ President; undisclosed police record; Catalyst ally with an airport-authority\
      \ role. Article 1’s \"catalyst\" key topic ties him to Elliott’s network.\n\
      4. **Doug Snow** — administrator of **Baldwin County Citizens for Accountability**,\
      \ the outlet Ripp Report cites as evidence of how long it has been tracking\
      \ Elliott’s behavior. (No other \"Snow\" name appears.)\n5. **Mike Vandenheuvel\
      \ (Mike Van)** — candidate challenging Elliott; refrained from the harshest\
      \ allegations (\"took the high road\").\n6. **Stacy Haygood / Lynn Stacy**,\
      \ **Dane Haygood** — founders of the Elliott-Haygood-Stacy group that became\
      \ Catalyst (2016). \"Tried to stay in the shadows while maintaining status.\"\
      \n7. **Michelle Thomasson, \"Catalyst Queen\"** — family court judge; other\
      \ appointed judges also named as part of the machine Elliott protected.\n8.\
      \ **Joseph \"Boom Boom\" Pittman** — former State Senator who took \"$750,000\
      \ from BP\" before leaving; earlier member of the group that put Mack in power.\n\
      9. **Dennis Baily** (Alabama Press Association Chief Legal Counsel) and **Tom\
