      \ BCSO Sheriff) – Described as an \"over-sheriff\" influencing current leadership\
      \ and currently trying to become head of the Alabama Law Enforcement Agency\
      \ (ALEA).\n    *   **Robert Wilters** (District Attorney) – Identified as the\
