      \ instruction to deputies, Sheriff Anthony Lowery contacted higher-ranking ERO\
      \ leadership. Lowery alleged that the Mobile ERO group was officially endorsing\
      \ BCSO candidate Matt McKenzie in a federal law enforcement capacity (a violation\
      \ of political neutrality rules).\n*   **Outcome:** Mobile ERO leadership reviewed\
      \ internally and found no evidence of official agency endorsement for McKenzie.\
