      \ specific network rather than policy disagreements with federal authorities.\n\
      \nKEY ENTITIES:\n*   **Sheriff:** Anthony Lowery\n*   **Chief Deputy:** David\
      \ White\n*   **Candidate:** Matt McKenzie (BCSO candidate)\n*   **Federal Agency/Officer:**\
      \ Mobile Enforcement and Removal Operations (ERO); Mobile ERO Supervisor\n*\
      \   **Former Sheriff/Influence Figure:** Hoss Mack\n*   **District Attorney:**\
