      The Widget Article (older) established that Jack Burrell, as City Council President and Airport Authority Liaison, was involved in an ongoing "airport scandal" and supported the airport authority hiring an attorney to investigate *The Ripp Report*.
      Mayor Karin Wilson posted a public statement on June 11th detailing personnel claims against her and the City and defending the right to open government and criticizing Executive Session use.

      THE PIVOT:
