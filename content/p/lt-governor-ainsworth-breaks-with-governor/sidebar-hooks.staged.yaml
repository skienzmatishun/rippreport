      Baldwin County (Mentioned in context, not primary actor)
    llm_text: Governor Kay Ivey fired Veterans Commissioner Kent Davis after he filed an ethics complaint with Kim Boswell. This controversial ousting caused chaos in VA programs and generated veteran backlash, pushing Ivey and Senator Andrew Jones to push SB 67 for sole appointing power.
