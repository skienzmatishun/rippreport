  the-crime-of-the-century:
    refined_source: 4285c9f3b3185f8bb82cf29b3d76819d58b01c88ff7e12948c944673d17b7af9
    brief: |-
      THE CONFLICT: Governor Kay Ivey fired Veterans Commissioner Kent Davis after Davis filed an ethics complaint with Alabama Ethics Commissioner Kim Boswell, triggering veteran and board opposition to Ivey's attempt to control the Department of Veterans Affairs.

      THE DISCOVERY: Article 2 revealed that the ousting of Kent Davis led to chaos in veterans' programs and political backlash from veterans who typically support Republican leadership.

      THE PIVOT: Article 2 establishes the initial, controversial firing of Kent Davis and the resulting political chaos, providing the historical context and public discontent that motivated Governor Ivey and State Senator Andrew Jones to push Senate Bill 67 to formalize her sole appointing power.

