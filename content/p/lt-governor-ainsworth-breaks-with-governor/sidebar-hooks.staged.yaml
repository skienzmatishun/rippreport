      THE CONFLICT: State of Alabama approved the medical cannabis Compassion Act on May 17, 2021.
      THE DISCOVERY: As of February 3, 2025, the medical cannabis industry is mired in litigation, and the Alabama Board of Medical Examiners has not issued the first patient license, despite the 2021 legislation.
      THE PIVOT: Article 2 provides historical context on the state's legislative struggles (medical cannabis implementation) but does not provide context for the conflict in Article 1 (Veterans Affairs bill); Article 1 details Lt. Governor Ainsworth's opposition to Governor Ivey's Senate Bill 67, which aims to strip the Veterans Board of power.
      KEY ENTITIES: Will Ainsworth, Governor Kay Ivey, State Senator Andrew Jones, Veterans Commissioner Kent Davis, Alabama Ethics Commissioner Kim Boswell, Senator April Weaver, Senator Chris Elliott, Rep. Ed Oliver, Senator Tim Melson, Chey Garrigan, Alabama Board of Medical Examiners.
    llm_text: 'Alabama''s 2021 Compassion Act remains stalled: the Board of Medical Examiners hasn''t issued a single medical cannabis patient license. Lt. Governor Ainsworth challenges Governor Ivey over Senate Bill 67, fighting to protect the Veterans Board from power stripping.'
