hooks:
  american-citizen:
    brief: |-
      THE CONFLICT:
      - On November 23, 2018, Ronan McSharry assaulted Paula DiNardi by knocking her off a bar stool at the Little Whiskey Christmas Club in Fairhope, Alabama.
      - DiNardi was managing the Tiki Bar at the American Legion on Mobile Bay; in October 2018, an event drew 1000 people; in January 2019, the American Legion canceled its agreement with DiNardi without reasonable explanation.
      - McSharry was jealous of DiNardi’s success; felt his business was suffering due to the popularity of the Tiki Bar; in a drunken stupor, assaulted DiNardi in retaliation.
      - DiNardi went to the hospital after the assault; McSharry was arrested.
      - McSharry pleaded guilty in Fairhope municipal court on March 26.
      - McSharry was on probation at the time of the incident related to the harassment conviction against Nall Hollis; the probation penalty was 180 days in jail if violated.
      - April 24, 2020: Hon. Robert Wilters, Baldwin County District Attorney, sent a letter to Francis "Paul" Ripp.
      - April 24, 2020 letter: Ronan McSharry’s appeal was dismissed denovo from Fairhope Municipal Court of his conviction upon evidence that he knocked Paula DiNardi off of a bar stool at the Little Whiskey Christmas Club in Fairhope on November 23, 2018.
      - Order issued by Judge J. Clark Stankoski: the City was outside the time to amend the charging document, 365 days.
      - Main article: Fairhope City Council canceled public participation at the same time that justice slipped through the cracks.
      - Main article: Fairhope City Attorney Marcus McDowell and the Fairhope judicial system handled the McSharry case; The Ripp Report asked Baldwin County District Attorney, among others, to investigate the recent ruling of Judge J. Clark Stankoski as well as actions of Municipal Judge Snedeker and City Attorney Marcus McDowell, in reference to the McSharry case.
      - Main article: The Ripp Report asked the general public to weigh in and contact Fairhope City Council, Mayor, or District Attorney, to hold someone accountable for the continued miscarriage of justice involved in the McSharry case.
      - Main article: Public opinion in Fairhope is that McSharry was jealous of DiNardi’s success in operating the Tiki Bar at the American Legion.
      - Main article: The Ripp Report asked whether the Baldwin County District Attorney would take information to the grand jury, whether McSharry can be recharged, and where accountability is.
      - Main article: The Ripp Report stated actions of both courts and the Municipal Attorney of Fairhope are highly suspicious; asked how a Circuit Judge, Municipal Judge, and Municipal Attorney, all experienced, could make elementary mistakes.
      - Main article: The Ripp Report stated it is confident McSharry has already been brought to Baldwin County District Attorney Robert Wilters’ attention prior to Judge J. Clark Stankoski’s order.

      THE DISCOVERY:
      - Article 2/WIDGET: A good example of Baldwin County incompetence, political interference, lack of ethics, CATALYST, corruption and judicial failure, is exposed in one incident, the McSharry assault case.
      - Article 2/WIDGET: The McSharry case is a classic example of Baldwin County justice.
      - Article 2/WIDGET: Fairhope City prosecutor, Marcus McDowell, dropped the ball, or kicked it out of site, when it came to Ronan McSharry.
      - Article 2/WIDGET: Municipal Judge Snedeker, shares in this miscarriage of justice.
      - Article 2/WIDGET: Judge J. Clark Stankoski stated the charging document had a defect.
      - Article 2/WIDGET: The defect was that the first charging document did not have the wording, “Did cause physical injury to another.”
      - Article 2/WIDGET: The document was not amended in the statute allotted time, one year, resulting in the defect.
      - Article 2/WIDGET: The City Attorney and Municipal Judge both had knowledge of medical evidence that supported the claim of “physical injury.”
      - Article 2/WIDGET: The City Attorney was personally given the medical evidence by an attorney representing DiNardi before her first court appearance.
      - Article 2/WIDGET: McSharry has been free to continue his business while his attorneys try to blame everyone for McSharry’s actions.
      - Article 2/WIDGET: McSharry is not an American citizen, he is a green card holder from Ireland.
      - Article 2/WIDGET: McSharry is a green card holder with an extensive police record that has a liquor license.
      - Article 2/WIDGET: Legal question raised: How much money has McSharry transferred from profits of McSharry’s to Ireland since the assault?
      - Article 2/WIDGET: Paula DiNardi went to a restaurant/bar in Fairhope and was assaulted by a drunk in November of 2018; McSharry was arrested and DiNardi went to the hospital.
      - Article 2/WIDGET: One month before, DiNardi was managing the American Legion Tiki Bar on Mobile Bay; in October she had one event that drew 1000 people; previously the bar was run with little organization and not family friendly; DiNardi presented a business plan to the American Legion, which accepted, and the business boomed.
      - Article 2/WIDGET: In January 2019, without any reasonable explanation, the American Legion canceled its agreement with DiNardi; she had received nothing but compliments prior to the cancellation and assault incident; DiNardi was preparing for the 2019 season when the American Legion suddenly canceled.
      - Article 2/WIDGET: The incident with McSharry started a spiraling sequence of events that left DiNardi without a job. Many people believe politicians used their influence to remove DiNardi from the American Legion, the author states.
      - Article 2/WIDGET: Next came 17 months of constant stress with having to deal with a corrupt judicial system that favored the criminal, not the victim. DiNardi is now trying to save her home.
      - Article 2/WIDGET: The Fairhope Municipal Judge and City Attorney’s actions resulted in the green card holder McSharry, who pleaded guilty in court, to escape prosecution. The CATALYST City Council appointed both the City Attorney and Municipal Judge.
      - Article 2/WIDGET: The author asks how a green card holder can have such influence; suggests maybe his friend Council President Burrell.
      - Article 2/WIDGET: The victim, Paula DiNardi, is an American citizen and does not export dollars to another country.

      THE PIVOT:
      - Article 2 is older than Article 1 and is framed as background/historical context.
      - Article 2 exposed or characterized the McSharry case as Baldwin County incompetence, political interference, lack of ethics, CATALYST, corruption and judicial failure.
      - Article 2 raised the legal question of how Judge J. Clark Stankoski’s ruling could be accepted despite McSharry’s past convictions, guilty plea, video incident, and the City Attorney and Municipal Judge’s knowledge of medical evidence.
      - Article 2 is presented as key context for Article 1’s framing of the dismissal of McSharry’s appeal as a potential miscarriage of justice and the investigation into Judge J. Clark Stankoski, Municipal Judge Snedeker, and City Attorney Marcus McDowell.
      - Article 2 sets up the conflict between McSharry, a repeat offender/green card holder, and DiNardi, an American citizen victim.

