      5. Allegations included the Mayor favoring a crony friend (including her live-in boyfriend) with illegal work, town equipment, free water, and gifts using tax money.
      6. Mike Ball, Alabama State Representative, proposed AL HB179 to require the Alabama Ethics Commission approval before prosecuting elected officials.

      THE DISCOVERY:
      1. The state has "Alabama Corruption Insurance" available to all elected officials (Sheriff, City Council, Mayors, Judges) which provides "protection from prosecution" if favorable advice is received from the Ethics Commission.
      2. The Columbia City Council, Mayor, and Police Chief are reportedly banking on this insurance, leading to ignored complaints.
      3. The Mayor’s authority to spend public funds (e.g., flowers/gift baskets) is prohibited under Alabama Constitution sections 68 & 94, supported by Alabama Attorney General Opinion 2002-133.

      THE PIVOT:
