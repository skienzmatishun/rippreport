      - Article 2 (Widget) is the "smoking gun" because it proves the Main Article's central thesis in real-time: BCBOE is using increased tax revenue to hire high-level administrators ($91k-$103k supervisor roles) while claiming funding shortages exist for teachers.
      - The juxtaposition of record tax revenue ($130M+ to BCBOE in FY 2022) with new $91k+ administrator hires validates CGA's argument that BCBOE priorities favor administration over classroom funding.

