  alabama-off-the-rails:
    brief: |-
      THE CONFLICT: Governor “poison Ivy” used “supreme executive power” to remove ADVA director Admiral Kent Davis; this action was retaliation against the current veterans board which opposed her move to strip veterans representation by creating a cabinet position for the ADVA director and reducing the veterans board to an advisory position.
      THE DISCOVERY: The State of Alabama approved the Compassion Act on May 17, 2021, allowing medical cannabis for qualified patients, but the legislation became a legal morass, and the Alabama Board of Medical Examiners could not issue the first patient license by 2025.
      THE PIVOT: Both conflicts illustrate state-level overreach, vindictiveness, and legislative failures (2021 Compassion Act compromise/current veterans representation strip) leading to institutional gridlock and harm to constituents (patients/veterans).
      KEY ENTITIES: Governor “poison Ivy”; Admiral Kent Davis; Senator Tim Melson (R-Florence); Chey Garrigan (President, Alabama Cannabis Industry Association); Alabama Department of Veterans Affairs (ADVA); Montgomery (rally location).
    llm_text: Governor "poison Ivy" removed Admiral Kent Davis from ADVA, showing how state overreach harms veterans. This vindictiveness mirrors the Compassion Act's failure, leaving Alabama patients without crucial medical cannabis licenses.
