hooks:
  lt-governor-ainsworth-breaks-with-governor:
    brief: |-
      THE CONFLICT:
      *   Veterans Commissioner Kent Davis filed an ethics complaint with Alabama Ethics Commissioner Kim Boswell.
      *   Governor Kay Ivey fired Kent Davis.
      *   The Veterans Board refused to back Ivey's action.
      *   Ivey sought to strip the Veterans Board of governing power via Senate Bill 67 (sponsored by State Senator Andrew Jones, and also sponsored by Rep. Ed Oliver in the House).
      *   Lt. Governor Will Ainsworth, Senator April Weaver, and Senator Chris Elliott publicly opposed SB67.

      THE DISCOVERY:
      *   On February 11, 2025, Lt. Governor Will Ainsworth publicly opposed Governor Ivey's push for Senate Bill 67, which aimed to change the Department of Veterans Affairs (ADVA) structure.
      *   Currently, the Veterans Board governs the department, but Ivey wanted sole appointment power for the Commissioner.

      THE PIVOT:
      *   Article 2 establishes that Governor Ivey's move to remove the Veterans Board's power (SB67) was a direct response to the Veterans Board opposing her use of "supreme executive power" to remove Kent Davis.
      *   Article 1 frames the current legislative effort (cabinet position/advisory role) as the continuation of this initial power struggle documented in Article 2.

      KEY ENTITIES:
      *   Governor Kay Ivey
      *   Lt. Governor Will Ainsworth
      *   Kent Davis (Veterans Commissioner)
      *   State Senator Andrew Jones
      *   Rep. Ed Oliver
      *   Senator April Weaver
      *   Senator Chris Elliott
      *   Kim Boswell (Alabama Ethics Commissioner)
      *   Alabama Department of Veterans Affairs (ADVA)
      *   Montgomery, AL (Rally location)
      *   February 11, 2025
      *   Senate Bill 67 (SB67)
    llm_text: Governor Kay Ivey tried to strip the Veterans Board of power via Senate Bill 67 after firing Kent Davis. Lt. Governor Will Ainsworth and Senators Weaver and Elliott publicly oppose this move, protecting ADVA governance.
