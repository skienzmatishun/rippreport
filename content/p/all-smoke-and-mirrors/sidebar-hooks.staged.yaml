  jack-box-airport:
    brief: |-
      THE CONFLICT:
      *   A legitimate complaint was filed regarding the Fairhope Airport Authority (involving Jack Burrell and Ray Hix).
      *   The Airport Authority sought to use tax dollars to hire a "top ethics attorney in Alabama" to investigate the complainants and head off scrutiny from the Attorney General’s office and the Ethics Commission.

      THE DISCOVERY:
      *   The Authority planned to have Ray Hix’s attorney (Mr. Bailey) represent the Authority, even while Hix held the position of Sec. Treasurer.
      *   A Fairhope resident inquired with Ethics Commission Chief Council Mr. Hugh Evens, who blind copied Mr. Bailey.

      THE PIVOT:
      *   Article 2 establishes the tactic of using tax dollars for legal defense/intimidation (Hix/Bailey), which Article 1 confirms is a systemic practice: the Authority hires attorneys using tax dollars to "investigate" and discredit whistleblowers against the board.
      *   Article 1 expands this issue by highlighting that citizens assume the Airport debt (21% of city debt) and links this financial mismanagement to the Mega-Site (3000 acres, $32 million, no buyers after five years).

      KEY ENTITIES:
      *   Fairhope Airport Authority
      *   Jack Burrell
      *   Ray Hix (Sec. Treasurer)
