  court-public-opinion-now-session:
    brief: |-
      THE CONFLICT:
      *   Dec 17, 2015: Lease signed for Airport Authority RFP.
      *   Feb 3, 2016: Ethics Commission Advisory Opinion rendered.
      *   Allegation of bid rigging and collusion among Airport Authority Board members, including Council President Jack Burrell.
      *   Dispute over property ownership: City of Fairhope vs. Airport Authority.
      *   Authority received $500,000 annually for six years while paying little on the principal of the $8 million debt.

      THE DISCOVERY:
      *   Article 2 (Jan. 25, 2017) detailed how Jack Burrell, as City Council President, Airport Authority Board member, and liaison, aided and abetted a grossly flawed and gerrymandered RFP bid process.
      *   Mr. Hix (winner bidder/Sec. Treasurer) used privileged information obtained from the Authority (April-July 2015) prior to the RFP.
      *   The RFP process violated Ethics Commission guidelines (e.g., lease signed before Advisory Opinion).
      *   Executive Aviation was the most qualified bidder, unlike Hix/Snedeker (Mid-Bay Air LLC).

      THE PIVOT:
      *   Article 2 provides specific, dated evidence (2015/2016) of political corruption and self-dealing within the Fairhope Airport Authority.
      *   This specific historical malfeasance validates the broader, current critique in Article 1 that the Fairhope Airport Authority operates as "smoke and mirrors."
      *   Article 1 expands this critique by linking the Authority's issues to broader county mismanagement (Baldwin County Mega-Site: 3000 acres, $32 million tied up for five years; $5 million skimmed from schools).

      KEY ENTITIES:
      *   Fairhope Airport Authority
