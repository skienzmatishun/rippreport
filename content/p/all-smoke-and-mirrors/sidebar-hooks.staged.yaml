  fairhope-town-hall-meeting:
    brief: |-
      THE CONFLICT:
      1. On 2/16/2017, Fairhope's first town hall meeting was scheduled to address the repeal of ordinance 1572 and the Fly Creek Apartments issue.
      2. The Airport Authority's demand to maintain control and ownership of airport land while the city pays the mortgage was a known issue at this time.

      THE DISCOVERY:
      1. Article 2 (2/16/2017) revealed that the City Council President opposed putting the repeal of ordinance 1572 on the city council agenda despite public demand.
      2. Article 2 noted that the Airport land debt was equivalent to 21% of the city debt, and Fairhope was spending more on the Airport than on schools.

      THE PIVOT:
      1. Article 2 established the historical context that the Airport Authority maintained control while the city bore the 21% debt burden, which Article 1 confirms is still the case today.
      2. Article 1 shows the long-term consequences (five years later) of the original schemes: the Mega-Site ($32 million, 3000 acres) remains vacant with no buyers, and the Airport Authority continues to use tax dollars to defend board members against legitimate complaints.

      KEY ENTITIES:
      1. Fairhope Airport Authority
      2. Baldwin County Mega-Site (3000 acres, $32 million)
      3. City of Fairhope
      4. Fly Creek Apartments
      5. Ordinance 1572
      6. County Commission
      7. Economic Development Alliance
      8. Fairhope High School
      9. 21% (of city debt)
    llm_text: Fairhope still pays the 21% airport debt while the $32M Mega-Site remains vacant. Discover how the Airport Authority maintained control over Ordinance 1572, forcing the City to spend more on the airport than on Fairhope High School.
