      THE DISCOVERY: The key figures who built the case (Robert Wilters, Anthony Lowery, Huey Mack, David Whetstone) have risen to influential positions (Wilters is Baldwin County DA since 2015; Lowery is Baldwin County Sheriff; Mack is in a state-level position) and continue to suppress justice (e.g., rejecting Rule 32 filing in 2023).
      THE PIVOT: The pattern of institutional suppression and power protection shown in the wrongful conviction case (Article 2) mirrors the current political obstruction in Fairhope where the Catalyst Council and council members (Boone, Burrell) refuse to settle high-cost lawsuits ($11.25 million Triangle Lawsuit) and protect their interests over community welfare (Breland case).
