  free-speech:
    brief: |-
      THE CONFLICT:
      *   December 17th, 2015: H. Ray Hix signed a Ground Lease and Operating Agreement with Joe McEnerney (Fairhope Airport Authority Board Chairman).
      *   December 21st, 2015: A different, unsigned lease (Exhibit C) was submitted to the Alabama Ethics Commission.
      *   2015/2016: Fairhope Airport Authority board members, including Pam Caudill, were implicated in conflict of interest and the manipulation of the RFP process for Mid-Bay Air LLC.
      *   Recent: Fairhope City Council is overriding the Mayor and paying fired employees, leading to potential four lawsuits and a pending fifth lawsuit related to Fly Creek Apartments.

      THE DISCOVERY:
      *   The submission of the Dec. 21st lease (Exhibit C) to the Ethics Commission was demonstrably false when compared to the executed Dec. 17th lease, proving the RFP process was tainted and violated the Ethics Advisory Opinion (Feb. 3, 2016).

      THE PIVOT:
      *   Article 2 provides specific, dated evidence (2015/2016) of systemic ethical violations and misuse of public trust within the Fairhope government (Airport Authority), establishing a historical pattern of misconduct that contextualizes the current political obstruction, council overreach, and resulting lawsuits discussed in Article 1.

      KEY ENTITIES:
      *   Fairhope City Council
      *   Council President Burrell (Jack Burrell)
      *   Fly Creek Apartments
      *   Fairhope Airport Authority
      *   H. Ray Hix
      *   Joe McEnerney
      *   Pam Caudill
      *   Dennis R. Bailey ESQ
      *   Alabama Ethics Commission
      *   Mike Turner
      *   Mid-Bay Air LLC
    llm_text: H. Ray Hix and Joe McEnerney submitted a demonstrably false lease to the Alabama Ethics Commission in 2015, proving systemic misconduct at Fairhope Airport Authority. This historical violation fuels today's council overreach and the ongoing, complicated Fly Creek Apartments lawsuits.
