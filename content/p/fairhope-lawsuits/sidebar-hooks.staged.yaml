  bonus-money:
    brief: |-
      THE CONFLICT:
      *   Sherry Sullivan claim was settled by Fairhope City Council without a trial or public explanation, using taxpayer money.
      *   Jack Burrell led the charge to reward Sullivan for her "bad behavior" leading to her firing.
      *   Hix and Snedeker received letters of exoneration from the Alabama Ethics Commission, stating there was no probable cause to believe Jack Burrell or Hix committed a violation of the Alabama Ethics Act.
      *   Fairhope elected a new Mayor and Council over one year ago.

      THE DISCOVERY:
      *   Article 2 established a historical pattern of the Fairhope City Council obstructing the Mayor and using executive session to settle claims (e.g., Sherry Sullivan) without public knowledge.
      *   Article 2 revealed the Ethics Commission cleared Jack Burrell and Hix of violating the Alabama Ethics Act.

      THE PIVOT:
      *   Article 2 demonstrates that the council has a history of using taxpayer funds for settlements and obstructing executive authority (Mayor).
      *   Article 1 shows the continuation of this pattern: the Council is again voting in executive session to pay fired employees, overriding the Mayor, and facing potential lawsuits (four suits pending, fifth related to Fly Creek Apartments) due to its own actions, including overriding planning and zoning decisions.

