  wetlands:
    brief: |-
      THE CONFLICT: In 2017, Fairhope experienced regular sewer spills and sewage dumping into the bay (Fairhope, Daphne, Spanish Fort). Councilman Kevin Boone had an LLC related to the Firefly project (an Arthur Corte project), which he dissolved when exposed.
      THE DISCOVERY: In October 2017, Baykeepers confirmed citizen complaints regarding foul odors and discolored water in the Fly Creek Watershed (by Firefly/Woodlands). City and state officials (EPA, Dept of Health, ADEM) failed to follow up on these complaints.
      THE PIVOT: Article 2 establishes a history of environmental neglect, ignored citizen complaints, and council member conflict tied to Fly Creek land use (Arthur Corte/Kevin Boone). Article 1 shows the Fairhope City Council, led by President Burrell, is now facing legal liability, including a pending lawsuit specifically related to Fly Creek Apartments, due to council actions overriding planning and zoning decisions.
      KEY ENTITIES: Fairhope City Council, Burrell, Fly Creek, Arthur Corte, Kevin Boone, Casi Callaway, Wilson, Baykeepers
    llm_text: Fairhope dumped sewage in 2017, ignoring Baykeepers' warnings about Fly Creek. Councilman Kevin Boone tied his LLC to Arthur Corte's Firefly project, and President Burrell's City Council now faces lawsuits over Fly Creek Apartments.
