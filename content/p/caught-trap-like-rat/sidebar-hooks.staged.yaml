  court-public-opinion-now-session:
    brief: |-
      THE CONFLICT:
      *   Dec. 17, 2015: Lease signed for Fairhope Airport Authority ground lease.
      *   Feb. 3, 2016: Ethics Commission issued an Advisory Opinion regarding the lease process.
      *   Past: Allegations of bid rigging and improper bidding by the Fairhope Airport Authority concerning the ground lease/Ordinance 1572 repeal.
      *   Involvement: Jack Burrell served as Fairhope City Council President, Fairhope Airport Authority voting Board member, and was on the Authority ad hoc committee that reviewed the RFP.
      *   Financials: Authority received $500,000 annually for 6 years; $8 million debt; City needs $310,000 annual appropriation to pay down debt.

      THE DISCOVERY:
      *   Article 2 proved the RFP bid process was grossly flawed and gerrymandered, and that Burrell aided and abetted the process.
      *   Burrell leveraged his position to facilitate the process, including allowing Mr. Hix (Mid-Bay Air LLC) access to privileged financial information (Apr-Jul 2015).
      *   The Ethics Advisory Opinion was disregarded, as the lease was signed before the opinion was rendered.
      *   The city’s goal (City ownership of airport land) clashed with the Authority’s position (Authority ownership, with city funding).

      THE PIVOT:
      *   Article 2 provides the documented historical context (2015-2016) proving Burrell's long-standing involvement in the alleged bid rigging and control over Ordinance 1572.
      *   Article 1 details the *current* fallout—following the removal of the 16-year Mayor Kant—where the new administration (led by Mayor Wilson) and the Ethics Commission are now addressing these past deeds.
      *   Article 1 confirms Burrell is actively obstructing the repeal of Ordinance 1572 and preventing questions about his alleged bid rigging using his authority as Council President.

      KEY ENTITIES:
      *   Jack Burrell (City Council President, Airport Authority Board member)
      *   Mayor Kant (Former Mayor, 16 years)
