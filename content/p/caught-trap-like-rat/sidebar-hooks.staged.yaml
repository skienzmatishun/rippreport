  hi-jack-ed:
    brief: |-
      THE CONFLICT:
      *   The Fairhope Airport Authority (FAA) operated as a financial black hole, receiving $500,000 annually from the Fairhope budget.
      *   The City had an option to take back 258 acres of FAA land for $10.00 if the principal was not paid off by 2012.
      *   Jack Burrell, then Fairhope City Council President and Airport Authority liaison, was linked to the past, failed administration.
      *   Mayor Kant was the previous mayor (Mayor of 16 years) who was later removed.
      *   Mayor Wilson supported exercising the option to take back the land and repeal Ordinance 1572.

      THE DISCOVERY:
      *   In 2016, the FAA was scrutinized for conflicts of interest, including a board composition based on aviation knowledge, and financial unaccountability.
      *   Mr. Burrell used his position (Council President/Liaison) to support the FAA's interests over the citizens' interests.
      *   Burrell was appointed to an ad hoc committee of two to oversee and select bids for Airplane hangers.

      THE PIVOT:
      *   Article 2 establishes Burrell’s long-standing, conflicted relationship with the FAA and previous administrations, providing context for the current allegations of alleged “bid rigging” and obstruction detailed in Article 1.
      *   Article 1 shows Burrell is now facing an Ethics Commission complaint regarding his participation in the Airport Authority and alleged bid rigging, while actively preventing the repeal of Ordinance 1572.

      KEY ENTITIES:
      *   Jack Burrell
      *   Mayor Wilson
      *   Mayor Kant
      *   Ethics Commission
      *   Fairhope Airport Authority
      *   Ordinance 1572
      *   Fairhope City Council
