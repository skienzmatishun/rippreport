  the-black-eyes-of-alabama:
    brief: |-
      THE CONFLICT:
      - Alabama politicians and elected officials go dark rather than be transparent when they have something to hide.
      - Alabama Attorney General Steve Marshall, appointed by Gov. Robert Bentley, is described as the worst Alabama Attorney General appointed in the last 50 years.
      - Steve Marshall has done little for the state of Alabama since his appointment; complaints filed with the Attorney General fall into black holes with little or no response.
      - The A.G. is commonly referred to as “Always Gone.”
      - In Montgomery, the A.G. is known as the hardest to find politician on Goat Hill.
      - Marshall’s promises to fight white collar crime and political corruption are only election time bylines; he avoids direct questioning from reporters or anyone about obvious corruption in Alabama or lack of legal action against corrupt politicians.
      - Marshall may be re-elected without opposition; Alabama Attorney General is given as an example of a very poor choice.
      - In Fairhope, Jack Burrell is the master of dark; Fairhope Airport Authority and FAA have been a thorn in the side of Fairhope taxpayers from day one.
      - Airport Authority cost taxpayers millions of dollars, represents tremendous debt, and services less than 1% of Fairhope.
      - Mr. Burrell and Mayor Sullivan took down the online meetings of the Authority last year; it is the only committee meeting in a blackout, why?
      - Jack Burrell scuffle: Burrell has his own agenda when it comes to development of the Airport; Burrell is a front man for special interests that want total control of the airport.
      - Looks like Jack’s new plan is to force the FBO, fixed base operator, via a lawsuit, out of the lease.
      - FBO renewed a lease with the FAA in 2018; at that time Jack was defending the FBO.
      - Mr. Burrell has an infamous reputation for “extending the truth,” so everything he says needs to be taken with a grain of salt.
      - Question: did Jack use federal money for the Airport to further his plans to evict the lease holding FBO, by creating a new FBO?
      - One thing is for sure: the City of Fairhope does not want you to see the committee meetings of the Fairhope Airport Authority.
      - Second thing: if the meetings were online, then the FAA may not be in the situation they find themselves in today.
      - FAA is in violation of open meeting laws using executive sessions to avoid public scrutiny.
      - Captain Jack was a no-show at the meeting where the authority started swimming backwards.
      - Fairhope citizens are in the dark and have no clue what the future plans are for the airport.
      - Burrell deal of purchasing 2.65 million dollars of farm land by the airport, for recreation??
      - This may be the third or fourth fiasco Jack has created through the Authority; each incident required time, attorneys, energy and taxpayer money to resolve.
      - FAA now finds itself in a protracted negotiation to unwind legal issues created by Councilman Burrell and Mayor Sullivan, who have gone dark.
      - Construction of a new FBO will depend on whether the Authority can secure as much as $1.5 million in additional funds to match a $600,000 grant from the Alabama Department of Transportation.
      - Lagarde said bids for the project will be opened next week, but any financing will have to be approved by the Fairhope City Council.
      - Judicial darkness: boating accident with 5 juveniles, January 22, 2021, around 2:45 a.m.; covered briefly by several news agencies.
      - Fairhope Police were called to the scene by property owners reporting damage to their pier; Fairhope Police handed the case over to the Marine patrol and ALEA, Alabama Law Enforcement Agency.
      - Driver of the boat is, alleged, the son of a local Judge.
      - No followup by media and a blogger in Florida, alleged, that the good Judge had interfered with the investigation.
      - Accident occurred with critical injuries to one person who was hospitalized; boat was moved from the accident site and no one knows when or where, the juveniles were interviewed.
      - The Ripp Report is focused on whether the judge interfered with a police investigation; Ripp requested a police report from ALEA.
      - Ripp is following the story; hard to see in the dark.

      THE DISCOVERY:
      - Article 2, “The Black Eyes of Alabama,” is older/background context.
      - Article 2: From Tallassee to Brookside we cover it all.
      - Article 2: “get-fitt’d” is the word of the week for that ankle monitor Baldwin County.
      - Article 2: favorite “black eye” politician or project gets a mention.
      - Article 2: SARS-CoV-2 is almost unavoidable at this point.

