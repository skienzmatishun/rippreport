    brief: |-
      THE CONFLICT:
      - Baldwin County has been under political siege by "good ole boy" networks under various names, including CATALYST and Scott Boone Consulting (CSB).
      - CATALYST suffered a bitter defeat in the congressional race against Jerry Carl, after which the name changed to Scott Boone Consulting.
      - Scott Boone Consulting (CSB) is a profit-making political group representing developer interests by selecting hand-picked candidates for municipal races in Fairhope, Daphne, Spanish Fort, and Bay Minette.
      - Scott Boone is the son of Fairhope councilman Kevin Boone.
      - Both Kevin Boone and Scott Boone have been implicated in the land fraud known as "Strawman" featured in Lagniappe.
      - Over one million dollars has been distributed by Scott Boone as the money distributor/bank for CATALYST candidates, not counting dark money passed under the table.
      - Developer donations funneled to vetted politicians include Prebble, DR Horton, Columbia Southern, Truland, Corte, and Cox.
      - In 2018, CATALYST tried and failed to take over the entire county administration (county commissioners to probate judge).
      - CATALYST candidates were successful in getting elected in many races despite the overall failure.
      - Candidates run in block positions supporting one another, with signs placed side by side in Daphne and Fairhope.
      - CATALYST targets "at large" positions to keep votes diluted.
      - In Fairhope's last government change election, there was just one voting booth outside city hall.
      - Daphne closed minority precincts in the 2016 election.
      - A Catalyst representative told an opponent's cousin: "I represent every sitting judge in this county and you do not want to run against my client because you will lose and you will have to face a judge that I represent."

      THE DISCOVERY:
      - Article 2 revealed CATALYST/Scott Boone Consulting as a county-wide threat operating across Fairhope, Daphne, Spanish Fort, and Bay Minette.
      - The article exposed the rebranding from CATALYST to Scott Boone Consulting after the name became "infamous and toxic" following the congressional race defeat.
      - It identified specific developer donors and the money laundering-like structure where Catalyst picks politicians, developers fund them, and politicians pay Catalyst.
      - It named Kevin Boone (Fairhope councilman) and Scott Boone as implicated in "Strawman" land fraud.
      - It warned that CSB candidates represent dirty politics where Christianity is turned on its head for votes.

      THE PIVOT:
      - Article 2 provides the organizational framework and player network (CATALYST/CSB/Scott Boone/Kevin Boone) that explains the behind-the-scenes forces influencing Fairhope politics described in Article 1.
      - Article 1 discusses Jack Burrell's control of the Fairhope Airport Authority and Mayor Sullivan's collaboration in going dark; Article 2 reveals the broader CATALYST/CSB machine that likely supports or aligns with these actors.
      - Article 2's exposure of Scott Boone Consulting as the successor to CATALYST connects the dots between local corruption in Fairhope (Airport Authority, land deals) and the county-wide political machine funding candidates.
      - The "Strawman" land fraud implication involving Kevin Boone ties directly to Fairhope land issues mentioned in Article 1 (2.65 million dollar farm land purchase by the airport).
      - Article 2 serves as the smoking gun by proving that Fairhope's "darkness" (Burrell, Sullivan, Airport Authority secrecy) is not isolated but part of a coordinated developer-funded political operation.

      KEY ENTITIES:
      - Steve Marshall (Alabama Attorney General)
      - Jack Burrell (Fairhope Councilman, Airport Authority)
      - Mayor Sullivan (Fairhope Mayor)
      - Scott Boone (Scott Boone Consulting/CATALYST)
