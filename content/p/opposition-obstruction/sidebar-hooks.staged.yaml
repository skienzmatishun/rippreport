  free-speech:
    brief: |-
      THE CONFLICT:
      *   Fairhope Airport Authority (FAA) RFP process was tainted, involving inside information used to secure a ground lease for Mid-Bay Air LLC.
      *   Key dates include December 16, 2015 (Request for Advisory Opinion) through March 20, 2017 (Affidavit filing).
      *   H. Ray Hix secured a lease, and FAA Board Chairman Joe McEnerney was involved.

      THE DISCOVERY:
      *   The Request for Advisory Opinion on Dec 16, 2015, contained false documents; the Dec 21, 2015, lease (Exhibit C) was different and unsigned from the executed Dec 17, 2015, lease.
      *   The FAA Board turned a "blind eye" to board members' friends and fellow members, violating public trust.

      THE PIVOT:
      *   The historical pattern of obstruction and self-interest (FAA lease manipulation) connects to the current political obstruction (Council President Jack Burrell preventing the Mayor from accepting a favorable insurance bid, costing taxpayers $60,000 on Sept 11).
      *   This demonstrates a recurring pattern where the Council/Board prioritizes personal/developer agendas over public trust.

