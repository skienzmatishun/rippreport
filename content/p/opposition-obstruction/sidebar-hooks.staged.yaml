      *   Jack Burrell, Council President, led the council in opposing the Mayor.
      *   Councilman Boone defended leaking subpoenaed city information to tabloid press, claiming it was transparency, despite two lawyers warning against it.
      *   Burrell called a special council meeting on a Thursday, only three days after the regular Sept 11 meeting, regarding Fairhope Airport Authority business.

      THE DISCOVERY:
      *   The Alabama Ethics Commission has proven fruitless in eliminating corruption.
      *   Low voter turnout (17%) indicates flourishing political corruption in Baldwin County.
      *   Historical examples of corruption include the Fairhope Airport Authority scandal, soccer fields, lawsuits, fly creek apartments, and the sewer plant contract.

      THE PIVOT:
