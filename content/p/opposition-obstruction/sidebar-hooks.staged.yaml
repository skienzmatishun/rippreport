  fly-creek-a-drainage-ditch:
    brief: |-
      THE CONFLICT:
      *   In Oct 2016, the Fairhope City Council endorsed the Fly Creek Apartments project despite public opposition, violating campaign promises regarding the Fly Creek Watershed.
      *   In April 2017, the newly elected city council granted an extension for the project.
      *   The previous mayor lost his job due to this decision, and subsequent council actions exacerbated the issue.

      THE DISCOVERY:
      *   The Fly Creek Apartments project required utilizing wetlands as a drainage discharge point into Fly Creek.
      *   Jack Burrell and Kevin Boone accepted a gift related to the wetlands, ensuring the drainage plan was implemented without public disclosure.

      THE PIVOT:
      *   Article 2 established Jack Burrell and Kevin Boone's history of prioritizing development/personal gain (wetlands gift) over public trust (Fly Creek Watershed protection).
      *   Article 1 shows the current Council President Jack Burrell using political obstruction (rejecting the Mayor's insurance bid, $60,000 taxpayer loss) and enabling questionable practices (Councilman Boone leaking subpoenaed data) to attack the Mayor, mirroring the historical disregard for public trust seen in the Fly Creek scandal.

      KEY ENTITIES:
