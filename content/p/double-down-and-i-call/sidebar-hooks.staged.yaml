  pay-executives-first-boy-scouts-come-last:
    brief: |-
      THE CONFLICT:
      *   Between 2008 and 2015, the Mobile Area Boy Scout Council suffered annual financial losses exceeding $200,000 (highest loss: $311,000).
      *   Phil Webb served as Boy Scout Board President in 2014, 2015, and 2016, facing IRS findings of breaking state and federal laws.
      *   In early December 2016, the Mayor of Fairhope filed an Ethics Complaint regarding actions of the Fairhope Airport Authority board.

      THE DISCOVERY:
      *   A November 2015 investigation found that approximately one out of four Mobile Area Council board members had broken the law, lied, or mismanaged funds.
      *   Michael Hartigan, Executive Director since January 2009, was responsible for losing nearly $1.5 million since 2009, earning over $12,000/month in salary/benefits.

      THE PIVOT:
      *   Article 2 establishes a pattern of systemic financial mismanagement and illegal board member conduct in Mobile/Baldwin County (Boy Scouts, 2008-2016).
      *   This pattern provides critical context for the allegations in Article 1 regarding conflicts of interest (Jack Burrell bidding on Airport Authority bids) and the potential manipulation of the Alabama Ethics Commission.

      KEY ENTITIES:
      *   Jack Burrell (Fairhope City Council President, Fairhope Authority Board Member)
      *   Fairhope Airport Authority
      *   Tucker Dorsey (Baldwin County Commissioner)
      *   Phil Webb (Boy Scout Board President)
      *   Michael Hartigan (Mobile Area Council Executive Director)
      *   Matt Hart (Alabama Attorney General Special Prosecutor)
      *   Jody W. Bishop (28th Judicial Circuit Honorable)
