    brief: |-
      THE CONFLICT:
      - Fairhope City Council appointed Municipal Judge and Municipal Attorney; both were holdovers from past corrupt administration.
      - Mayor Karin Wilson pleaded with City Council to consider new appointments for Municipal Judge and Municipal Attorney.
      - Council, led by Burrell for last 8 years, ignored citizens seeking change and immediately appointed Marcus McDowell as Attorney and reinstated Judge Snedeker.
      - Council members Burrell, Boone, and Brown all supporting Sherry Sullivan.
      - Fairhope Judge was largest land owner and developer in Fairhope and supported Sullivan.
      - City attorney had Sullivan sign at attorney’s office.
      - Council/Burrell/Boone/Brown linked to Catalyst/Scott Boone Consulting CABAL.
      - Sullivan vastly unqualified; choice for ribbon cutting Mayor; subject to CABAL.
      - Sullivan had only high school education; fired by city; sued; four jobs in four years.
      - Burrell, Boone, Brown wanted to take “a chance” on Arts and Crafts show; Mayor Wilson opposed, said too big health risk; Arts and Crafts show finally canceled.
      - In 2016 Fairhope lifted out of 16 years of blatant corruption; also landed Fairhope on insurance companies blacklist.
      - Mayor Wilson accomplishments in 4 years surpassed previous administration’s 16 years.
      - Wilson stopped inter corruption within Fairhope City Hall; unable to stop council Burrell Boone Brown from feeding off office for personal gain.
      - Main article context: Tomorrow citizens of Fairhope will go to polls, rain or shine; most citizens do not understand inner political workings like appointments.

      THE DISCOVERY:
      - Widget article: Last night Spanish Fort played Fairhope in football; stands full, social distancing impossible.
      - Fairhope High School principal said tried to enforce mask use; once seated, people removed masks.
      - Fairhope political forum hosted by Common Sense Campaign, scheduled in advance, provided to citizens to better inform them about Fairhope candidates for Mayor and City Council.
      - All City Council members running for office and candidates opposing them attended.
      - Mayor Wilson and two of three challengers attended; Sherry Sullivan did not.
      - Sullivan’s followers suggested Mayor Wilson scheduled forum; article states this is absolutely false; Mayor showed up by invitation, just like everyone else; Sullivan made bad situation worse by not taking responsibility.
      - Sullivan showed up at football game and gave fans to attendees NOT wearing masks.
      - Sullivan and Burrell wanted to take “a chance” with Arts and Craft Show; over 200,000 attended; Doctors from Thomas advised against; Sullivan/Burrell wanted push forward.
      - Sullivan does not want to answer questions or have public forum.
      - Mayor Wilson adamantly opposed “taking a chance”; Arts and Crafts show finally canceled. Wilson put safety before profits.
      - Fairhope needs Mayor who practices what she preaches instead of “taking a chance” with other people’s lives; Sullivan displayed consistent pattern of bad decisions, poor judgment.
      - Football game may result in more Covid cases; football should come second to people’s health; giving fan in crowded bleachers with unmasked people may be worst thing.
      - Sullivan owes public and Common Sense Campaign apology; probably will not show up.
      - Post to Mayor Wilson: Karin, difficult decision re Arts and Crafts; as someone working in ICU during pandemic, commended Wilson for decision; right decision; Sherry Sullivan was on news promoting Arts and Crafts and promising “all precautions would be taken”; what a joke; Sullivan obviously only trying to promote event; would have been at expense of citizens’ lives; Baldwin County cases of Covid during that time probably less than 10% of Mobiles.
      - All other Mayoral Candidates displayed common sense re Covid; all agree on social distancing and masks and put citizens before profits; Sullivan not Mayor material; actions display lack education and judgment.

      THE PIVOT:
      - Article 2 is older/background context.
      - Article 2 shows Sullivan skipped Fairhope political forum, attended Spanish Fort vs Fairhope football game, gave fans to unmasked attendees, pushed Arts and Crafts despite doctors’ advice.
      - These facts support Article 1’s claims that Sullivan is vastly unqualified, subject to CABAL, lacks judgment, Mayor Wilson opposed taking chances, and citizens should vote out Burrell Boone Brown or support Wilson.
      - Article 2 is smoking gun/key context for Article 1 because it provides prior/contemporaneous behavior used to frame Sullivan as not Mayor material and Wilson as putting safety before profits.

