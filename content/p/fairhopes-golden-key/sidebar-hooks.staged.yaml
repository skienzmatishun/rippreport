hooks:
  catalyst-aka-scott-boone-consulting:
    brief: "THE CONFLICT: \n- In the 2020 municipal elections, Fairhope citizens voted for mayor and city council amidst deep political division.\n- Mayor Karin Wilson attempted to replace holdover officials from a past corrupt administration, but City Council members Jack Burrell, Kevin Boone, and Robert Brown ignored her requests.\n- The council immediately appointed Marcus McDowell as Municipal Attorney and reinstated Judge Snedeker.\n- The council and candidates like Sherry Sullivan were backed by a political network known as Catalyst/Scott Boone Consulting, which opponents accused of promoting unbridled sprawl and insider deals.\n- Historically, Fairhope spent 16 years under a \"blatant corruption\" administration (prior to Mayor Wilson taking office in 2016) that landed the city on an insurance company blacklist.\n\nTHE DISCOVERY: \n- Catalyst was originally a political machine for the \"good ole boys\" network of developers and landowners profiting from unbridled development, opposing regulations, impact fees, and infrastructure needs.\n- Due to toxicity, Catalyst rebranded under the name \"Scott Boone Consulting,\" run by Scott Boone.\n- Catalyst/Scott Boone Consulting fielded candidates across Baldwin County, including Spanish Fort, Daphne, Fairhope, and Bay Minette.\n- According to the *Lagniappe* \"Strawman\" land fraud series, Catalyst associates utilized an intricate web of multiple concentric layers of LLCs to conceal interrelationships, insulate principal actors from liability, and control financial transactions.\n- Scott Boone and his father, Fairhope Councilman Kevin Boone, had their fingerprints tied to the Strawman land fraud series alongside Baldwin County sewer interests and past County Commissioner Tucker Dorsey.\n\nTHE PIVOT: \n- Article 2 serves as the smoking gun because it exposes that the local candidates backed by the Council (such as Sherry Sullivan and the council members themselves) are not just standard conservative politicians, but frontmen for an entrenched, developer-funded political machine (Catalyst/Scott Boone Consulting) documented in journalistic investigations (the *Lagniappe* \"Strawman\" series) for land fraud and corrupt webs of LLCs. \n- It shows that the \"status quo\" defended by Councilmen Jack Burrell, Kevin Boone, and Robert Brown is tied directly to regional corruption, land fraud schemes, and insider municipal contracts rather than local civic governance.\n\nKEY ENTITIES: \n- Karin Wilson (Mayor of Fairhope)\n- Jack Burrell (Fairhope City Council President)\n- Kevin Boone (Fairhope City Councilman / Scott Boone's father)\n- Robert Brown (Fairhope City Councilman)\n- Scott Boone (Principal of Catalyst / Scott Boone Consulting)\n- Sherry Sullivan (Mayoral candidate)\n- Marcus McDowell (Municipal Attorney)\n- Judge Snedeker (Municipal Judge)\n- Jerry Carl (Congressional candidate / Winner of First Congressional Race)\n- Tucker Dorsey (Past County Commissioner)"
    llm_text: Mayor Karin Wilson battled a corrupt status quo, but Councilmen Jack Burrell and Kevin Boone protected the developer-funded machine. Uncover how Scott Boone and his rebranded Catalyst network tied Fairhope leaders to the explosive "Strawman" land fraud scheme.
