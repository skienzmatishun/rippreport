  covered-in-oil:
    brief: 'THE CONFLICT:

      - The Mobile Press-Register, Nov. 10, 2010, reported the BP Boom Scandal involving
      Fairhope Mayor Tim Kant and state Sen. Lee “Trip” Pittman.

      - A federal case involving Mayor Kant and Sen. Pittman was pending under Special
      Prosecutor Matt Hart, head of the Special Prosecutions Division (White Collar
      Crime and Political Corruption), Alabama State Attorney General’s Office.

      - Mike Hubbard, Alabama Speaker of the House, was subject to three federal grand
      jury investigations for steering a $13 million education software contract to
      a Florida company and allegedly leading the “Republican Revolution” / “storming
      of the state house.”

      - Former Gov. Bob Riley allegedly shifted $37.2 million in BP money to Brett-Robinson
      in Gulf Shores two days before Gov. Bentley took office, then registered as
      a lobbyist for Brett-Robinson; about $65 million in BP disaster-related payments
      was unaccounted for.

      - Governor Robert Bentley served as president of the Interstate Oil and Gas
      Compact Commission (OGCC), a pro-oil lobbying group, while Mobile’s water supply
      was threatened by a tar sands pipeline and he sued the OGCC-linked company.


      THE DISCOVERY:

      - In an AP-projected state Senate primary, Sen. Trip Pittman received only 7%
      of the vote, or 25,816 votes, and failed to advance; prediction that he would
      get less than 10% was correct.

      - Roy Moore, former Alabama Chief Justice, reached 39% / 151,908 votes and advanced
      to a Republican runoff with U.S. Sen. Luther Strange at 32% / 124,723 votes.

      - Doug Jones, former U.S. Attorney, was projected Democratic winner with 64%
      / 87,276 votes.

      - The article framed Pittman as unable to “get the oil off him,” rejected by
      constituents, and called Baldwin County having voted out two of three most corrupt
      politicians (Kant and Pittman), with Jack Burrell next for his role in the Fairhope
      Airport Authority “bidding” scandal.


      THE PIVOT:

      - Article 2 is the smoking gun because it provides electoral proof that public
      voters rejected a key figure from the BP corruption case named in Article 1:
      Trip Pittman lost decisively despite machine backing.

      - It counters Article 1’s warning that all machine candidates win by showing
      at least one corruption-linked politician was politically punished, while another
      (Strange) still advanced.

      - The oil imagery and “BP contractor” label tie Pittman directly to the main
      article’s central theme of Alabama oil/BP politics and political corruption.


