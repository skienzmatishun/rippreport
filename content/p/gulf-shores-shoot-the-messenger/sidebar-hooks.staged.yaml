  stepping-up:
    brief: |-
      THE CONFLICT:
      - Fairhope Fly Creek Apartments controversy under Fairhope Mayor Tim Kant.
      - Gulf Shores Mayor and Council acted the same way the previous Mayor of Fairhope, Tim Kant, acted involving the Fairhope Fly Creek Apartments controversy.
      - Gulf Shores Mayor and buddy developer ignored sentiments of the community.
      - It cost Tim Kant his job as Fairhope Mayor and a few councilmen.
      - Collateral effect in Fairhope resulted in firings, retirements, and resignations of over a dozen employees.
      - Controversy was not about apartments as much as location, location, location.
      - Fly Creek development would increase population of City of Gulf Shores by almost 5 percent, based on 512 people or 2.5 residents per unit.
      - Development would add 400 to 500 more cars on an already busy street in residential area; Gulf Shores proper was almost in a state of gridlock.
      - If approved, four-way stop signs in the "Small Town" section of Gulf Shores would be replaced by traffic signals.
      - Told by Real Estate Company (Remax Paradise) that developer planned to build townhomes.
      - Shocked to find after the fact that a site plan had been approved by the city Planning Commission for a high-density, four-story apartment complex with no prior notice to citizens living in the neighborhood; residents were given no input.
      - Petition basis: SAVE OUR NEIGHBORHOOD STOP REGENCY PLACE APARTMENTS; petition that more than 750 people supported.
      - City of Gulf Shores current position was to ignore complaints and threats of lawsuits by citizens.
      - Gulf Shores Mayor and Planning insisted all was in order and complainers had no merit.
      - "Shoot the messenger" was the mistake Fairhope’s Mayor and developer made.
      - If it were not for a few messengers, Mr. Pete Sims being the most vocal, who tried to alert The Enclave and Regency Club of long term negative effects the apartments, there would be no message, no information.
      - Why were the boards not carrying the banner of protest? They should be the messengers, not the ones shooting the messengers.
      - Condo associations are notorious for lack of communication, residential geniuses, and boards more known for confusion they cause than solutions they solve.
      - The Enclave and The Regency Club were pointing fingers at each other, shooting the messenger and falling into an abyss of "NO ACTION", which was exactly what Gulf Shores counted on.
      - Fairhope, just like Gulf Shores, has Planning and Zoning regulations; under Tim Kant, Gulf Shores violated its own regulations more often than anyone else.
      - Fairhope elected a new Mayor who concentrated on changing membership of Planning and Zoning, with new appointments.
      - Mayor also updated Planning regulations and planned further changes as a result of public participation.
      - Mayor settled, all but one, of pending lawsuits inherited from last administration and a Planning Board who favored developers over citizens.
      - Citizens of Gulf Shores need to understand that the problem is Planning and Zoning and its mindset.
      - Mayor makes those appointments. You have to change the Mayor to change Planning and Zoning. If you really want change then you also replace the council in the same election.
      - It has taken 2.5 years in Fairhope with only one position left on P&Z, and he soon will be exiting the building.

      THE DISCOVERY:
      - Second article, Widget Article: "STEPPING UP", is older; frame as background/historical context.
      - Ripp Report had been a harsh critic, over many issues, of Mayor Haygood in Daphne.
      - Ripp Report agreed with Mayor Haygood about getting a fair share of the gas tax.
      - Baldwin County got screwed, royally, out of millions of dollars.
      - State Senator collected 750,000 of BP money for his personal company but was too busy to represent constituents.
      - State Reps stood silently in his shadow while north Alabama soaked up millions.
      - Mayors of Gulf Shores and Orange Beach fought harder for BP money.
      - In the end, millions of BP money went to projects that were not even related to the Oil Spill.
      - Orange Beach Mayor Tony Kennon was also trying to reach out to state legislature and neighbors to the north and educate them on how much revenue, about 33%, Baldwin County provides the state.
      - Kennon raised hell over the Oil Spill and BP money and learned an important lesson, do not depend on others.
      - Citizens of Baldwin County would appreciate the Baldwin County Commission and Baldwin County Economic Development Alliance to follow the lead of the Mayors.
      - Newly elected State Senator, for District 32, is Chris Elliott, aka The Tax Man.
      - Senator Elliott should be yelling louder than the Mayors.
      - Senator Elliott has been busy decorating his office and hopefully will be singing the same tune as the Mayors, as soon as décor is in place.
      - Senator Elliott has already said he would vote for the tax so let’s hope he can secure Baldwin County its share.
      - Listen to the Mayors, Senator, all 14 of them.
      - Baldwin County cannot wait for a check to be mailed from Montgomery. They need to go to Montgomery and collect the check, or it will be lost in the mail.

      THE PIVOT:
