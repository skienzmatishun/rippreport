      - Article 2 provides context on BP money, gas tax, Mayor Haygood, Tony Kennon, Chris Elliott, and Baldwin County mayors.
      - Article 2 shows Mayors of Gulf Shores and Orange Beach fought harder for BP money and fair share of gas tax.
      - This supports Article 1’s conflict around Gulf Shores/Fairhope mayoral leadership, Planning and Zoning, developer influence, and lawsuits.
      - Article 2 is the key context or "smoking gun" for Article 1 because it frames funding/legislative and mayoral action that parallels the local inaction and Planning/Zoning conflict.

