      - Organizations: City of Gulf Shores, City of Fairhope, Fairhope Planning and Zoning, Gulf Shores Planning Commission, Baldwin County Commission, Baldwin County Economic Development Alliance, Alabama State Legislature, State Senate, State Reps, BP, Remax Paradise, The Enclave, The Regency Club, condo associations.
