  lagniappe:
    brief: |-
      THE CONFLICT:
      - In late October 2005, an investor named Bass provided over $2.44 million for his half-share of a property transaction involving the Nolte family (the sellers).
      - Clarence Burke arranged to buy the property for a total of $2.44 million using a "straw man" entity (Hopper Land Development South LLC) without informing Bass, meaning Bass's funds actually covered the entire purchase price.
      - On Sept. 11, 2017, Judge Norton granted summary judgment for the defendants a week before trial, accepting Alabama Capital's argument that mortgages related to the transaction were valid and that Bass failed to present a "genuine issue of material fact."
      - Former County Commissioner Tucker Dorsey previously denied business relationships with Baldwin County Sewer or Clarence Burke, and was also involved in the mega-site. Dorsey admitted regarding the real estate scheme: “That was the only time we built a straw company like that.”

      THE DISCOVERY:
      - The historical coverage details systemic local corruption and cronyism in Baldwin County, Alabama, involving businessmen, lawyers, county commissioners, mortgage companies, real estate agents, and developers.
      - It highlights judicial outcomes favoring the powerful and connected, exemplified by the civil case dismissal against Bass despite evidence of a fraudulent straw-man purchase structure.

