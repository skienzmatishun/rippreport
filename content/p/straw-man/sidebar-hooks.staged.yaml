  in-the-same-boat:
    brief: |-
      THE CONFLICT:
      - Baldwin County, Alabama: alleged corruption; Alabama ranked number one when it comes to corruption, Baldwin County is the worst.
      - Businessman, lawyers, county commissioners, mortgage companies, real estate agents and developers pooled their greed to take advantage of an honest man who thought he was dealing with “friends.”
      - Near end of October 2005: Bass provided more than $2.44 million for his half-share of the property.
      - Complaint contends Burke, without informing Bass, actually arranged to buy the property for a total of $2.44 million through the use of a “straw man,” Hopper Land Development South LLC.
      - Therefore, the money Bass put up represented the total amount paid to the Nolte family, the sellers.
      - Sept. 11, 2017: Norton granted summary judgment for the defendants, a week before the case was set for trial.
      - Norton accepted Alabama Capital’s argument that certain mortgages related to the transaction were valid and Bass failed to present “a genuine issue of material fact.”
      - Christian “Tucker” Dorsey, as a seating County Commissioner, denied any business relationship with Baldwin County Sewer or Clarence Burke.
      - Dorsey was voted out of office by a huge margin of voters.
      - Dorsey was also involved in the mega-site.
      - Dorsey said: “That was the only time we built a straw company like that.”
      - Straw buying definition: individual makes a purchase on behalf of someone, who otherwise would be unable to make the purchase, and this purchaser has no intention of using or controlling the purchased item. In many cases, straw buying is illegal.

      THE DISCOVERY:
      - Article 2, “IN THE SAME BOAT,” is older than Article 1, “STRAW MAN,” and should be framed as background/historical context.
      - Fairhope had major infrastructure and sewer problems long before Fairhope Mayor Wilson even thought about running for office.
      - Baykeeper was contacted time and time again through the years about various issues.
      - Director of Baykeeper Casi Callaway claimed that all you got to do, if you have an environmental problem, is to contact Baykeeper.
      - Baykeeper never did anything about the Publix project, flooding of Fly Creek by the developer, or filling of the creek with development site mud and sand.
      - Then came the Fly Creek Apartments to be built along Fly Creek.
      - Hundreds opposed the Fly Creek Apartments project.
      - Baykeeper did NOT answer the phone.
      - Private citizens sued the City over some of these issues while Baykeeper’s phone was off the hook.
      - Mayor Can’t and Baykeeper did nothing but use air and talk “crap.”
      - Now Director of Baykeeper Casi Callaway is in damage control for grabbing headlines and NOT using the phone.
      - This is described as a typical Casi trick, strictly a political Baykeeper promotion.
      - Callaway said she sent everyone a letter; she is hurt not to have received her copy, but not surprised, because she did not answer the phone either.
      - After releasing a very negative media report about Fairhope and receiving blowback, Casi decided she must address the Fairhope City Council and dig her hole a little deeper.
      - Normal procedure is for Public Participation to be at the beginning of the council meeting, for 3 minutes, on agenda items only.
      - Public participation at the end of the meeting affords citizens 3 minutes to discuss non-agenda items.
      - Casi Callaway did not contact the Mayor; she contacted Council President Burrell.
      - They both kept the agenda appearance secret from the Mayor.
      - Mr. Burrell allowed Casi to speak in the first Public Participation under an agenda item she never addresses.
      - Casi spoke well over the three minute rule and Burrell remained silent.
      - Jack and Casi knew the time allocated and agenda procedure was politically motivated to blind side the Mayor.
      - The Mayor has produced a Timeline, dating back to 2016, that outlines the Mayor and staff’s due diligence.
      - Where is the Council’s Timeline? Where is Baykeeper’s timeline?
      - Fairhope Council President Jack Burrell had been Council President for seven years.
      - He refused to yield power to other Council members while he used the position and agenda for political purposes and bullying tactics.
      - Council President Burrell now has the dubious honor of being found guilty in Federal court for violating the Constitutional rights of an American Citizen and veteran.
      - That case is now being used as a precedent case involving the same constitutional rights being violated by other Council Presidents in the United States.
      - Let’s not forget about the Police Report Councilman Burrell has yet to explain.
      - Casi and Jack appear to be in the same political boat and at the same council meeting.
      - Debbie Quinn and Sherry Sullivan, past political shipwreck survivors, were floating and yelling that they wanted in the same boat.
      - 2020 is going to be one hell of a year.

      THE PIVOT:
      - Article 1 cites Fairhope Airport Authority, Fairhope City Council, where three members have used their elected position for personal gain, The Mega-site, and the Wharf in Orange Beach as similar stories.
      - Article 2 provides older background on Fairhope infrastructure/sewer problems, Baykeeper inaction, Mayor Wilson, City Council, Jack Burrell, Casi Callaway, and the 2016 timeline.
      - Article 2 is positioned as the key context or “smoking gun” background for Article 1 because it predates and frames the Fairhope political/environmental issues later tied to Baldwin County corruption allegations.
      - Article 2 connects to Article 1 through Fairhope, Baykeeper, sewer, infrastructure, City Council, and alleged political/investigative failures.
      - Article 2’s older timeline and political conflict help explain the background against which Article 1’s straw man/Baldwin County corruption narrative emerges.

