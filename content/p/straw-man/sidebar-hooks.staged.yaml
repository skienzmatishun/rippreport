  fairhope-sewer-backstory:
    brief: |-
      THE CONFLICT:
      *   Mayor Can’t was in office for 16 years in Fairhope.
      *   Between 2012 and 2016, Mayor Can’t, Councilman Boone, and Councilman Burrell used the utility fund as a slush fund to balance the general fund and pay for lawsuits.
      *   In late October 2005, Clarence Burke arranged to buy property for $2.44 million for the Nolte family using a “straw man” company, Hopper Land Development South LLC, without informing Bass.
      *   County Commissioner Tucker Dorsey denied any business relationship with Baldwin County Sewer or Clarence Burke.
      *   On September 11, 2017, Norton granted summary judgment for defendants in a case involving Bass, accepting Alabama Capital’s argument that certain mortgages were valid.

      THE DISCOVERY:
      *   The misuse of the Fairhope utility fund by Mayor Can’t, Councilman Boone, and Councilman Burrell resulted in Fairhope losing its best senior utility supervisor and $3 million to attorneys.
      *   The drain on the utility fund prevented infrastructure work on sewer systems, despite electric department efforts.
      *   Mayor Wilson was elected on a platform to immediately tackle the neglected sewer and infrastructure problems in Fairhope.

      THE PIVOT:
      *   Article 2 establishes a historical pattern of financial corruption and utility fund misuse in Fairhope (2012-2016) and infrastructure neglect (10+ years).
      *   Article 1 demonstrates a parallel, broader pattern of high-level corruption in Baldwin County, involving property fraud and straw buying (2005, 2017), linking local political figures (Dorsey) to these illegal financial schemes.

