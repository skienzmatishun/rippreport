  poison-ivy-bridge:
    brief: |-
      THE CONFLICT:
      *   Over a decade prior, the need for a new Mobile River Bridge was discussed, with concerns raised over state budgeting and accountability.
      *   The State of Alabama allegedly misused the billion+ dollar BP settlement money, using it for Goat Hill cover-up, a Hotel, and refurbishing the Governor’s Beach House.
      *   In October 2005, a $2.44 million property transaction occurred in Baldwin County involving Clarence Burke, Bass, and the straw man entity Hopper Land Development South LLC.
      *   On September 11, 2017, Norton granted summary judgment for defendants in a related case, accepting Alabama Capital’s argument regarding valid mortgages.

      THE DISCOVERY:
      *   Article 1 reveals documented evidence of local corruption in Baldwin County involving straw buying, where individuals acted as proxies for others to facilitate purchases, exemplified by the 2005 $2.44 million transaction.

      THE PIVOT:
      *   Article 1 provides concrete, verifiable examples (e.g., the 2005 straw man transaction, 2017 court ruling) of the systemic local corruption and lack of accountability in Baldwin County, substantiating the general historical critique in Article 2 that the state and local government fail to budget responsibly and allow powerful entities to evade justice.

