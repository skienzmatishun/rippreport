  shut-up:
    brief: |-
      THE CONFLICT: Land adjacent to Fairhope Airport was purchased in 2007 for $8,845,000 by the Airport Authority, committing the City of Fairhope to an indefinite loan and a $6.9 million balloon payment in 2020.
      THE DISCOVERY: In August 2016, Mayor Karin Wilson discovered the minimal change to the airport land loan debt since 2011 and initiated a process to have the City exercise its right to assume ownership of the remaining 265 acres for $10.00.
      THE PIVOT: The 2016-2017 timeline reveals the Airport Authority, led by Jack Burrell and Joe McEnerney, resisted Wilson’s calls for transparency and timely refinancing, resulting in complaints of unethical behavior that were later filed with authorities (starting Nov 2016) but ignored by the City Council.
      KEY ENTITIES: Mayor Karin Wilson, Jack Burrell, Joe McEnerney, Fairhope City Council, Fairhope Airport Authority, Rod Kanter, Bryant Bank
    llm_text: Mayor Karin Wilson exposed how the Fairhope Airport Authority resisted refinancing a $8.8M land loan. She successfully moved to assume the 265 acres for just $10.00, challenging Jack Burrell and Joe McEnerney.
