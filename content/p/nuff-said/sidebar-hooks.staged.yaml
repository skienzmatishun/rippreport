    brief: |-
      THE CONFLICT: Complaint against Council President Jack Burrell and Mr. Hix regarding Fairhope Airport Authority leasing of hanger property (costing $750,000) without issuing a Request for Proposal (RFP). The Mayor filed an ethics complaint against Burrell. Rick Kingrea sent a "plain vanilla request" to the Attorney General on 1/12/11.

      THE DISCOVERY: The Ethics Commission mandates that public officials conducting business with the entity they serve must use a bid process, regardless of specific bid law applicability. Burrell deliberately misled the audience about the hanger's profitability.

      THE PIVOT: Article 2 establishes the factual ethical violation (no required RFP for Hix) and reveals that the ongoing conflict (reported since Nov 2016 in Article 1) is rooted in Burrell’s political maneuvering (resistance to Mayor Kant’s appointments) and his denial of established ethical mandates, which the City Council chose to ignore.

