  whos-on-first:
    brief: |-
      THE CONFLICT:
      *   Fairhope Airport Authority entered into a Ground Lease and Operating Agreement on Dec 17, 2015.
      *   Dennis R. Bailey (representing Ray Hix) requested an Advisory Opinion from the Alabama Ethics Commission on Dec 16, 2015.
      *   The executed lease (Dec 17, 2015) predated the favorable Ethics Advisory Opinion (Feb 3, 2016).
      *   The executed lease should have been submitted to the Ethics Commission by Dec 27, 2015, but was presented March 8, 2016, over 60 days late.
      *   The Airport scandal has been reported since Nov 2016.
      *   Complaints alleging unethical behavior were filed with authorities, but the city council chose to ignore the facts.

      THE DISCOVERY:
      *   The Ground Lease and Operating Agreement (Dec 17, 2015) was executed and recorded before receiving the required Alabama Ethics Commission Advisory Opinion.
      *   There are three inconsistent lease versions: Dec 17, 2015; Dec 21, 2015 (EXHIBIT C); and a sample lease (EXHIBIT B).
      *   The lease terms (e.g., construction timelines, Guaranty type) contradict the Fairhope Airport Authority's own Notice of Request for Bids (RFP).

      THE PIVOT:
      *   The 2017 document (Widget Article) provides documented, specific evidence (dates, document comparisons, legal requirements) proving the unethical behavior and procedural failures (lack of adherence to Ethics Advisory Opinion and RFP) that form the basis of the ongoing "Airport scandal" reported since Nov 2016 (Main Article).
      *   The historical legal non-compliance substantiates the later claims of "unethical behavior" and "lack of accountability and transparency" by the city council.

      KEY ENTITIES:
      *   Fairhope Airport Authority
      *   Jack Burrell (City Council)
      *   Josh Myrick (Attorney)
      *   Joe McEnerney (Chairman)
      *   Dennis R. Bailey
      *   Ray Hix
      *   Alabama Ethics Commission
      *   Dec 17, 2015 (Lease execution date)
      *   March 11, 2017 (Widget Article date)
      *   Nov 2016 (Scandal reporting start date)
    llm_text: Fairhope Airport Authority executed its Ground Lease on Dec 17, 2015, before obtaining the required Alabama Ethics Commission advisory opinion. Dennis R. Bailey's documented evidence proves the city council ignored clear legal non-compliance, exposing the ongoing "Airport scandal."
