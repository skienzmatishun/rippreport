  investigating-the-investigators:
    brief: |-
      THE CONFLICT:
      *   Lease executed by Ray Hix's company on Dec. 17, 2015, for a hanger at Fairhope Airport Authority (FAA).
      *   Mr. Hix was a board member for 6 months prior to the bid process, raising concerns about inside information.
      *   The original complaint centered on elected official Jack Burrell.
      *   The Ripp Report filed a complaint against the FAA, leading to the FAA hiring attorneys (paid from airport profits).

      THE DISCOVERY:
      *   Mr. Hix's bid contained inaccurate data, including claiming 100% ownership of three aircraft (only one confirmed) and providing unverified fuel estimates.
      *   Mr. Jack Burrell, a bid committee member, unilaterally reduced Mid-Bay’s fuel estimate by 15,000 gallons, without stated authority.
      *   The hanger construction (six months estimate) was not complete 27 months after the lease date (Dec. 17, 2015).
      *   Mr. Hix's attorney, Mr. Bailey, is investigating The Ripp Report.

      THE PIVOT:
      *   Article 2 established unethical behavior and lack of transparency (2015/2016) concerning the FAA and Ray Hix.
      *   Article 1 details that the city council ignored facts alleging unethical behavior by a council member, failing to hold them accountable.
      *   Article 2 provides the specific historical evidence (inaccurate bids, unauthorized amendments, potential insider trading) that the council later ignored, fueling the current lack of accountability reported in Article 1 (post-Nov 2016).

      KEY ENTITIES:
      *   Ray Hix (Board Member, Bidder)
      *   Jack Burrell (Elected Official, Bid Committee)
      *   Fairhope Airport Authority (FAA)
      *   Ethics Commission
      *   Mr. Bailey (Hix's attorney)
      *   Joe McEnerney (Airport Authority Chairman)
      *   Fairhope City Council
      *   Fairhope Airport
    llm_text: Ray Hix secured a 2015 Fairhope Airport lease with inaccurate bid data, while Jack Burrell unilaterally cut fuel estimates as a bid committee member. The city council ignored this clear evidence of unethical FAA behavior, leaving zero accountability for these officials.
