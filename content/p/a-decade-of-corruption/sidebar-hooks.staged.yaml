    brief: "THE CONFLICT: \n- 10 years ago (circa 2010), State Senator Tripp \"Boom Boom\" Pittman and Fairhope Mayor Tim Kant secured a $636,000 bid from Fairhope for BP Boom work using city staff (Greg Mims, Sherry Sullivan, Jennifer Fidler).\n- May 8, 2010: The County Commission told Pittman and Kant not to proceed with the bid. Pittman agreed, then submitted a second proposal under the name Oil Recovery.\n- June 4, 2010: The Fairhope City Council held a special meeting and awarded the contract to Pittman Tractor instead of Oil Recovery.\n- June 10, 2010: Pittman received a check from Fairhope for $372,165.90 for \"completed\" boom work, payable to Pittman Tractor. Pittman operated without a contract, general contractor's license, marine insurance, county approval, or ethics approval.\n- Pittman and Mayor Kant, alongside Jack Burrell, maintained a debris contract with Fairhope for over 8 years, totaling close to $750,000 in BP money.\n\nTHE DISCOVERY:\n- Background context from the older widget article identifies Fairhope City Council President Jack Burrell as the most infamous and compromised elected official, operating the city council as a \"criminal enterprise.\"\n- Highlights long-running municipal corruption, specifically pointing to May 2016 Ripp Report articles regarding Councilman Burrell and an airport scam, demonstrating a multi-year pattern of abuse by Burrell, the municipal judge, and the city attorney.\n\nTHE PIVOT:\n- The historical context provided by the older widget article exposes Jack Burrell's long-standing pattern of corrupt governance and abuse of power (dating back to the 2016 airport scam and ongoing through 2020), serving as the foundational proof that the current political machine (\"CATALYST\") has spent a decade protecting insiders, rigging bids, and insulating officials like Burrell from accountability.\n\nKEY ENTITIES:\n- State Senator Tripp \"Boom Boom\" Pittman\n- Tim Kant (Fairhope Mayor)\n- Jack Burrell (Fairhope City Council President)\n- Greg Mims\n- Sherry Sullivan\n- Jennifer Fidler\n- Karin Wilson\n- Chris Elliott\n- Senator Elliott\n- Pittman Tractor\n- Oil Recovery\n- CATALYST"
