  run-away-train:
    brief: |-
      THE CONFLICT:
      - Francis Paul Ripp, author of The Ripp Report, was absent for a few months after losing his soul mate of 50 years.
      - Ripp downsized living accommodations and restored property known as Casa Carolyn.
      - Casa Carolyn project took almost 5 months; end result: refurbished three bedroom/two bath, fully furnished home on three acres of manicured lawn, gardens and art.
      - Ripp missed the last two Wonderful Wednesday’s; expected to be back on schedule by the first of the new year.

      THE DISCOVERY:
      - Baldwin County has 14 municipalities, 14 Mayors, a County Commission and 15 Planning and Zoning departments, all working independent of each other.
      - Daphne allows apartments to be built on Highway 98, within a mile; Fairhope approves apartments on 98; between approximately 500 apartments are three traffic lights and a school zone.
      - Daphne and Fairhope never communicated with one another regarding traffic or other impacted issues.
      - Miriam Boutwell helped establish Plan Lower AL Now (PLAN).
      - Article 2 cited growth statistics: Foley had 545% increase in residential units added in last two years; final stages include 1,276 lots over 50 subdivisions.
      - Fairhope: 1,200 residential lots in 17 different subdivisions. Orange Beach: 2018 most single year development in city’s history. Gulf Shores: 1,382 lots approved for 17 subdivisions. Daphne: 683 residential lots approved for 16 subdivisions. Unincorporated Baldwin County: 693 single family permits issued with 4 multifamily housing.
      - Baldwin County estimated population was 212,000 in 2017; Article 2 stated the train is bringing another 100,000+.

      THE PIVOT:
      - Article 2 is older/background context for Article 1.
      - Article 2 framed Baldwin County growth as a “Runaway Train” with no conductor.
      - That framing serves as the key context for Article 1 (“I’M BACK”), which promises upcoming Ripp Report reports on issues politicians do not speak of and do not want readers to know.

      KEY ENTITIES:
      - Francis Paul Ripp
      - The Ripp Report
      - Baldwin County Legal Eagle
      - Deal with the Devil Facebook site
      - Backstory podcast
      - Baldwin County
      - Baldwin County municipalities, 14 Mayors, County Commission, 15 Planning and Zoning departments
      - Daphne, Fairhope, Foley, Orange Beach, Gulf Shores, Unincorporated Baldwin County
      - Miriam Boutwell
      - Plan Lower AL Now (PLAN)
    llm_text: Francis Paul Ripp missed two Wonderful Wednesday’s while rebuilding Casa Carolyn, and now he’s back with The Ripp Report on Baldwin County’s runaway train of growth. After 14 municipalities, 14 mayors, and no real traffic plan, why aren’t Daphne and Fairhope talking about the 100,000 new residents coming?
