  paradise-lost:
    brief: |-
      THE CONFLICT:
      Penny Sales Tax was levied by the Baldwin County Commission in January 2017 after the Alabama Legislature declined to approve the permanent extension of the BCBOE tax. The tax was due to expire May 30, 2018. A deal was brokered exchanging percentages of the 1984 Penny Sales Tax.

      THE DISCOVERY:
      Coastal residential growth in Baldwin County (Daphne/Fairhope, Gulf Shores/Orange Beach) is outpacing adequate infrastructure and public facility development, reaching a finite carrying capacity.

      THE PIVOT:
      The County Commission agreed to the tax levy primarily out of "fear the Voters would not approve the extension or to make permanent the tax," not based on proactive planning to manage the unsustainable growth and infrastructure strain identified in the coastal communities.

