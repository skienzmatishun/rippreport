      THE CONFLICT: October 2016; Fairhope City Council (Boone and Burrell) accepted a gift of four acres of prime wetlands near Fly Creek under Resolution 2606-16, signed by Mayor Kant; Councilman Boone had undisclosed business interests conflicting with his voting; Councilman Burrell raised red flags regarding airport handling.
      THE DISCOVERY: The Fairhope City Council demonstrated a pattern of ignoring obvious conflicts of interest and shifting responsibility for ethical failures onto citizens.
