  comment-are-you-surprised-at-all:
    brief: |-
      THE CONFLICT:
      *   Mobile Area Council Boy Scouts (including Baldwin County) experienced mismanagement and wasted funds between 2014, 2015, and 2016.
      *   Phil Webb (President, Fairhope) was responsible for losing over $750,000 in 3 years, averaging over $250,000 per year.
      *   Michael Hartigan (Executive Director, hired Jan 2009) received an annual salary/benefits over $150,000.
      *   A third of the council's land was sold in early 2016 for almost $300,000.
      *   Bradley Byrne, Tripp Pittman, and Tucker Dorsey were reportedly made aware of this mismanagement for over 2 years.

      THE DISCOVERY:
      *   Audits from 2014-2016 were conducted by Russell, Thompson, Butler and Houston, LLC (3605 Springhill Park, Mobile, AL 36608).
      *   The County Commission levied the Penny Sales Tax in January 2017 after the Alabama Legislature declined to make the tax permanent.
      *   The County Commission agreed to exchange percentages of the 1984 Penny Sales Tax to secure the tax levy for the BCBOE.
      *   This swap costs the BCBOE around $4 million dollars a year, which now goes to the County Commission.
      *   Mr. Tyler stated the County Commission agreed "Out of fear the Voters would not approve the extension or to make permanent the tax."
      *   Elliot's campaign raised $483,700.00 by July 2018, with $352,250.00 from 67 Special Interest PACs (e.g., Alabama Realtors PAC, EDPAC, SHR PAC).

      THE PIVOT:
      *   Both historical Boy Scout mismanagement (Article 2) and the Penny Sales Tax swap (Article 1) demonstrate local/state politicians (Byrne, Pittman, Dorsey, Elliot) prioritizing political expediency or local deals over fiduciary duty and public interest.
      *   The Boy Scout loss figures establish a pattern of financial negligence and questionable decision-making within Baldwin County leadership (Webb, Hartigan).
      *   The 2017 Penny Sales Tax deal shows county leadership acting based on "fear" of voter decision rather than clear policy, paralleling the known negligence in the Boy Scouts.

