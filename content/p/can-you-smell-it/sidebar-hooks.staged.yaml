      *   Prior to Karen Wilson's tenure, Fairhope experienced environmental issues, including human waste spills into Mobile Bay and Fly Creek.
      *   Previous Mayor Tim Kant and Council spent $13 million on a sewer plant upgrade instead of moving the plant inland.
      *   Between 2015 and 2016, Fairhope utilities paid the city $10 million for NON-UTILITY expenses.
      *   Past issues included BP contractors leaving hundreds of anchors and feet of rope in the bay during the Publix project construction.

      THE DISCOVERY:
      *   Karen Wilson, upon taking office, demonstrated ethical conduct by refusing a second paycheck, despite a 60,000 dollar reduction in pay.
      *   Wilson undertook the restructuring of the planning and zoning department, reducing past litigation.
      *   Wilson initiated a comprehensive engineering study of Fairhope infrastructure.

      THE PIVOT:
      *   Article 2 establishes Karen Wilson's early commitment to ethical governance, transparency, and infrastructure reform, contrasting sharply with the past neglect (e.g., the $13M sewer upgrade without infrastructure funding) and the inaction of groups like Mobile Baykeeper during the Tim Kant era.
      *   Her actions (engineering study) are framed as a direct response to the infrastructure failures detailed in Article 1.

