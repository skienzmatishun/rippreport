  fly-creek-a-drainage-ditch:
    brief: |-
      THE CONFLICT:
      *   Fly Creek Apartments faced a six-day trial in Bay Minette.
      *   The trial stemmed from the City Council/Mayor allowing a large apartment complex and parking lot in the Fly Creek Watershed despite public concerns.
      *   The Council endorsed the project in October 2016.
      *   An extension was granted in April 2017 by the newly elected city council (except Jimmy Conyers).
      *   Past Mayor and three councilmen were voted out of office due to these issues.
      *   Publix construction caused damage to the creek, but this was not discussed at the 2016 trial.
      *   A sewer spill at the same location on Fly Creek as the proposed apartments occurred.

      THE DISCOVERY:
      *   The City Council and Planning/Zoning rejected public concerns in favor of the developer due to political pressure.
      *   The new drainage plan calls for a single point discharge at the outfall pipe, detouring the 1-acre retention pond and omitting the expansion to a 5-acre pond.
      *   This plan directs excess stormwater from the complex directly into wetlands, which drain into Fly Creek, near the Publix outfall.
      *   Wetlands ownership was held by Jack Burrell and Kevin Boone.

      THE PIVOT:
      *   Article 2 establishes the historical precedent of City Council/Mayor prioritizing developer interests over environmental protection in the Fly Creek Watershed.
      *   This past decision (2016/2017) directly contextualizes the current failure (Article 1) of the City and authorities to address ongoing environmental issues, including runoff mud, sewer spills, and the lack of necessary infrastructure repair.

