  elected-or-selected:
    brief: |-
      THE CONFLICT: Former Mayor Jim Nix was forced out of office due to alleged criminal activity and faced criminal prosecution; Nix selected Tim Kant to replace him, needing a controlled subordinate.
      THE DISCOVERY: Mayor Kant was selected by Jim Nix and became Mayor in 2000, following a hiring in 1983 as the city's first horticulturist; Kant is a paid Mayor and pad utility director, and has served four terms marked by corruption and infrastructure failure.
      THE PIVOT: Article 2 establishes that the past 16 years of stagnation and power struggles referenced in Article 1 were rooted in a non-electoral 'selection' process orchestrated by Jim Nix, not a democratic mandate, proving the need for the people's voting power.
      KEY ENTITIES: Tim Kant, Jim Nix, Arthor Corte, Sherry Sullivan, Mike Ford, Councilman Boone, Dyas family, Fairhope City Sketches, Fairhope, Baldwin County
    llm_text: Jim Nix didn't use democracy to put Tim Kant in power; he hired the horticulturist in 1983 for a controlled subordinate role. Discover how Nix’s non-electoral selection led to 16 years of corruption and infrastructure failure in Fairhope.
