  fairhope-voters-guide:
    brief: |-
      THE CONFLICT
      *   Historical power struggle spanned approximately 16 years, characterized by "stagnation and good ole boy deals."
      *   The municipal political structure was dominated by the "CATALYST" group.
      *   In the 2016 municipal election, incumbent Mayor Timothy Kant (who served for a reported 16 years) was defeated by Karin Wilson, Fairhope's first woman mayor.
      *   Prior to this transition, concerns regarding election tampering had been noted during the 2008 and 2012 voting cycles.
      *   The council after 2016 consisted of individuals selected by the previous administration ("his compromised minions"), leading to conflict for Mayor Wilson.

      THE DISCOVERY
      *   The current political machine is controlled by "CATALYST," which includes Kevin Boone (Councilman) and his son, Scott Boone (who heads Scott Boone Consulting).
      *   Evidence shows ongoing systemic corruption:
          *   Jack Burrell used his 8-year Council President tenure to engage in questionable dealings including bid rigging, lying about the Triangle lawsuit, and purchasing $2.65 million in farmland for recreational property before leasing it to farmers for $9000 annually.
          *   Councilman Robert Brown is accused of using public office for personal gain by landing large contracts (concession building at soccer fields and Fairhope Art Center), totaling nearly a million dollars, leading to an ethics complaint filed with the Alabama Attorney General.

      THE PIVOT
      *   Main Article ("PEOPLE POWER") presents the recent City Council meeting as evidence of genuine cooperation and an end to past power struggles.
      *   Widget Article ("FAIRHOPE VOTERS GUIDE") exposes the current structure, led by CATALYST/Scott Boone Consulting, not as a cooperative shift, but as a continuation of entrenched "insider deals" and self-serving corruption (Burrell, Brown) maintained under the guise of governing body operation.
      *   Article 2 provides specific allegations of financial misconduct and political manipulation that undermine Article 1's claim that the council is finally "in sync with one another."

      KEY ENTITIES
      *   Karin Wilson: Former Mayor; first woman Mayor (Defeated Kant in 2016).
      *   Timothy Kant: Incumbent Mayor prior to 2016.
      *   CATALYST/Scott Boone Consulting: Political group and organization controlling the current machine.
      *   Kevin Boone: Councilman; father of Scott Boone/head of local political machine.
      *   Jack Burrell: Council President (8 years); accused of misuse of office/property deals.
      *   Robert Brown: City Councilman; accused of fleecing city via public contracts (Art Center/Soccer Fields).
      *   Deb Hopkins: Candidate running against the incumbent established power structure (Burrell, CATALYST).
      *   Howell Gibbens: Candidate challenging Robert Brown’s alleged corruption.
      *   Joshua Gammon: Candidate positioned as an outside challenger to the establishment.
    generated_at: '2026-07-18T02:19:35.933442Z'
    text: Smooth-talking officials pretend the city council abandoned its history of backroom stagnation. CATALYST still pulls the strings as Jack Burrell and Robert Brown pocket insider deals and steer public money straight to political allies.
