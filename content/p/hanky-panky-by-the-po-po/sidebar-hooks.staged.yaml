      - Approximately 10 years ago, Senator Trip Pittman sponsored Senate Bill 312, which altered Sheriff qualification requirements to favor Mack and secure his position.
      - In 2021, the case *Lagniappe v. Mack* resulted in a ruling by Associate Justice Greg Shaw that law enforcement investigative reports and bodycam footage are privileged communications and not public records.
      - Mack and Wilters have historically exerted influence over the judiciary, including pressuring a judge to reverse a ruling regarding a seized vehicle.

      THE DISCOVERY:
      - Article 2 establishes that the Baldwin County Sheriff's Office (BCSO) utilizes a self-contained Major Crimes Division to investigate its own actions, effectively eliminating external oversight.
      - The legal precedent set in 2021 provides a statutory shield against transparency, preventing the media and public from accessing investigative recordings or evidence.

      THE PIVOT:
      - The current allegations of an internal cover-up regarding an officer's extramarital affair are not isolated incidents, but rather the direct result of a long-standing, legally protected system of non-transparency and political collusion between the Sheriff and the District Attorney.

