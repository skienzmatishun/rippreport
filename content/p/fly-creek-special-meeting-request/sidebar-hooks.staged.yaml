      *   This initial rejection occurred after 300+ citizens attended the Planning and Zoning meeting.
      *   Land owner Author Corte asserted influence to pressure the Mayor and Councilman Ford into voting against the project.
      *   The project started in 2006 (Phase 1).

      THE DISCOVERY:
      *   The Mayor intended to reintroduce the Fly Creek apartment complex, favoring a 'BLINDSIDE' of the public by using the City Council rather than Planning and Zoning.
      *   Mayor Kant was allegedly influenced by political benefactor Mr. Corte.
      *   The Mayor needed votes from Brewer and Burrell; Brewer had supported a $35,000 football "gift" to Mayor Kant's benefactor, Mr. Angus Cooper.
      *   Mr. Burrell voted against the "gift" and was the only vote opposing the Mayor.
      *   Author Corte donated land to the city for a fire station ($500k+ contents) and a sewer lift station (several hundred thousand), saving him about $1 million, benefiting his project.

      THE PIVOT:
      *   The 2016 request for a Special City Council meeting (Feb 12, 2016) was a direct attempt by F. Paul Ripp to prevent the Mayor from blindsiding the public with the reintroduction of the Fly Creek Apartments via the City Council, which the Mayor sought to restrict public notification for.
      *   The historical context established in the Widget Article proves the Mayor's intent to bypass prior public rejection (Planning and Zoning) and the initial community opposition ("angry mob of people not from here").

