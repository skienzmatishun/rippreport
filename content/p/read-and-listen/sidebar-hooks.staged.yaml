    brief: |-
      THE CONFLICT:
      *   The Fairhope Council (made up of Catalyst candidates) including Burrell, Boone, and Brown (the 3 B’s) used elected office for personal gain.
      *   On May 29th, the council debated a conservation easement (triangle property, 102 acres, $20 million) and a proposal to buy $2.6 million on Hwy. 13.
      *   Fairhope paid $11.25 million ($8.25 million + $3 million in attorney fees) as a SETTLEMENT after a lawsuit that Burrell and Boone supported and lost.
      *   In September, the council passed a resolution to purchase the $2.6 million property without public participation or a payment plan.
      *   The council was found guilty in Federal Court for violating the US Constitution (right of free speech).

      THE DISCOVERY:
      *   Article 2 revealed the history of the council's actions, including the May meeting (where Mr. Burrell stated the Hwy. 13 land was for appraisal only) and the subsequent September resolution to purchase the $2.6 million property.
      *   It detailed the council's lack of transparency, denying citizens public comment on the recreation property.
      *   It documented the threat by Council President Burrell against the Mayor regarding $17,000 insurance for part-time councilmen.

      THE PIVOT:
      *   Article 2 provides the specific dates (May 29th, September) and financial details ($20M easement, $2.6M purchase, $11.25M settlement) that substantiate the general claims of "No ethics, No transparency, No accountability" made in Article 1.
      *   The Federal Court ruling on free speech in Article 2 is the specific legal evidence underpinning the constitutional violations alleged in Article 1.

