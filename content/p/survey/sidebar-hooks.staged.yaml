  down-home-fairhope-jester:
    brief: |-
      THE CONFLICT:
      - Fairhope City Council, described in the main article as the “CATALYST City Council,” was a huge disappointment; efforts were centered on obstructing the Mayor from achieving anything, even if it affected the city as a whole.
      - Fairhope financial accomplishments: employee moral higher than previous years; “City debt was paid in full June 2019”; 35-page report presented at State of the City last night; accomplishments attributed to the Mayor, Superintendents and staff, not the CATALYST council.
      - While the city was working hard on financial improvements and in the mist of the budget process, the CATALYST City Council elected, against public outcry, to purchase 2.65 million worth of farmland for recreation.
      - Within weeks of purchase and no money for development, the council decided to call it “surplus” and lease it out for farming at 9 thousand dollars a year, which hardly pays the interest.
      - Described as a “Good ole Boy deal.”

      THE DISCOVERY:
      - The last Fairhope City Council meeting should prove to everyone that the “Catalyst” Council is not going to listen to its constituents; they are benefiting, with an insurance package, from a part time job, that other part time employees are exempt from.
      - The last recreation piece of property Burrell and Council had authority over was the soccer fields.
      - Millions was spent on a soccer field complex that had no plan, did not meet specifications, and was across from a gun range.
      - Now Council wishes to locate another recreation property, in an area that is in an aircraft flight pattern.
      - Deal stinks; Councilman Conyers and Robinson jumped ship, for the first time; Burrell, Boone and Brown were all in to purchase 2.6 million in property without public hearing; “FOLLOW THE MONEY.”
      - Not in budget; now have to cut other services and departments and rearrange the whole budget; fourth year in a row the Council will not approve a City Budget on time.
      - Council holding up infrastructure projects since they were elected.
      - Council rejected land that had the most public support, for a piece of land Burrell Boone and Brown wanted that had no public support or public notice, and it did not pass muster with the National Park recommendations; appraisal is highly questionable and should be investigated.
      - Councilman Brown got the soccer field clubhouse/bathroom contract over 750,000; this was a warm up to the ESAC contract; citizens should be asking how this was allowed to happen.
      - Council was found guilty in Federal Court for violating the right of free speech; case is now being used in similar cases as a precedent around the country; Fairhope Council President Burrell and Council now have the dubious reputation of this case around their necks.

      THE PIVOT:
      - Article 2 is older than Article 1; frame it as background/historical context.
      - Article 2 showed or revealed the Catalyst Council’s lack of listening, ethics complaint limbo, personal gain, obstruction, budget issues, farmland purchase, soccer fields, ESAC contract, and Federal free speech case.
      - Article 1 reports the State of the City financial accomplishments, employee moral, City debt paid in full June 2019, 35-page report, survey, Fairhope Working Waterfront and Green Space Project, 6.2 million investment, tourism/recreational fishing goal, and past administrations ignoring the pier and waterfront.
      - Article 2 is the “smoking gun” or key context for Article 1 because it provides prior facts for Catalyst Council actions/personal gain and helps explain Article 1’s criticism and financial narrative.
      - Article 2’s ethics/personal gain context makes Article 1’s financial accomplishments and Catalyst Council disappointment more connected; the farmland deal and ESAC contract are smoking guns.

      KEY ENTITIES:
      - Fairhope; Baldwin County; Gulf Coast; Eastern Shore; Alabama.
      - City of Fairhope; CATALYST City Council; Catalyst Council; Fairhope City Council.
      - Mayor; Superintendents and staff; staff.
