  fairhope-state-of-the-city:
    refined_source: 1c08f3e5416074d62324373d012cc91fb85b7b3e1e2cb9b96a6cc9f8505a5ea9
    brief: |-
      THE CONFLICT:
      Councilmen Burrell, Brown, and Boone (CATALYST City Council) purchased 105 farmable acres of land for $2.65 million in December 2019, despite the land being the first choice of the State Park Board, citizens, city staff, and Mayor Karin Wilson.

      THE DISCOVERY:
      The Widget Article established that the $2.65 million property was designated "surplus and not needed for public or municipal purposes" via a January 2020 Ordinance and subsequently leased for $9,000.00 annually, shortly after purchase.

      THE PIVOT:
      The Widget Article provides the historical context (June 2019 appraisal, December 2019 purchase, January 2020 surplus declaration) that validates the Main Article's accusation that the CATALYST Council obstructed financial improvements and diverted city funds, impeding the current $6.2 million "Fairhope Working Waterfront and Green Space Project."

