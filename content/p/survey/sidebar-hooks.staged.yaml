      - Eastern Shore Art Center; ESAC; Ethics Commission; Attorney General; Federal Court; National Park recommendations.
      - Fairhope Working Waterfront and Green Space Project; Fairhope Pier and Park; Backstory Podcast #21; Facebook.
      - Locations: Fairhope, Baldwin County, Gulf Coast, Eastern Shore, aircraft flight pattern, soccer fields, farmland, recreation property, waterfront, pier, park.
      - Dates: June 2019; May 2, 2018; over 7 years; fourth year; next week; last night; 2.65 million; 2.6 million; 9 thousand; 750,000; 102 acres; 6.2 million; 35 page.
