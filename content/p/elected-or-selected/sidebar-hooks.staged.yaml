      *   The city's infrastructure has been ignored for years, resulting in no transparency or checks and balances.

      THE DISCOVERY:
      *   The "good ole boys" ran Fairhope as a criminal enterprise, characterized by Mayor Kant holding dual roles (paid Mayor and pad utility director), resulting in double-dipping on taxes.
      *   The soccer field project exceeded $5 million and required independent auditing due to poor city management.
      *   John Lake advocated for replacing Mayors in Daphne and Fairhope to positively impact Baldwin County politics.

      THE PIVOT:
      *   Article 2 establishes the historical pattern of corruption (e.g., Triangle lawsuit, double-dipping, lack of transparency) by the "good ole boys."
      *   Article 1 details the immediate consequences and mechanism of this system: former Mayor Jim Nix was forced out due to alleged criminal activity and selected Tim Kant (hired in 1983, became Mayor in 2000) as a controllable replacement.
      *   Article 1 provides specific evidence of recent corruption tied to this system, including the non-public $5000/year municipal lease approved by Councilmen Boone and the 8-month delay/high cost of the soccer field ($5-6 million) sourced from Mike Ford's realty company.

      KEY ENTITIES:
