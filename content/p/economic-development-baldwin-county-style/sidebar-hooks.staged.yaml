hooks:
  how-the-pendulum-swings:
    brief: |-
      THE CONFLICT:
      *   During the administration of former Mayor Tim Kant, the Fairhope City Council approved payments for exterior repairs on the Fairhope Public Library.
      *   The work was invoiced to Walcott, Adams, Verneuille Architects, totaling $32,510.97 (discounted to close to $45,000).
      *   No contract or paperwork authorized the work, despite Council President Burrell stating the work was performed.
      *   This occurred while Mayor Kant, Council President Burrell, and Council member Boone were in office.

      THE DISCOVERY:
      *   Article 2 revealed a pattern of undocumented spending and alleged "handshake deals" involving Mayor Kant, Council President Burrell, and Council member Boone.
      *   This historical context includes the airport scandal, a triangle lawsuit, and a $13 million investment into a sewer plant that still dumps sewage in the bay.
      *   Article 1 details a separate instance of questionable spending: the Baldwin County Commission spent $32 Million in 2012 on the 2300 usable acre Mega Site, which remains vacant.
      *   Article 1 also reports that Council President Jack Burrell approved a $32,000 bill without documentation recently.

      THE PIVOT:
      *   Article 2 serves as historical evidence of systemic, undocumented financial practices by key Fairhope officials (Kant, Burrell, Boone) dating back 10 years.
      *   This history contextualizes the current concerns in Article 1 regarding the $32 Million Mega Site acquisition (2012) and Burrell's recent approval of an undocumented $32,000 bill, suggesting a recurring pattern of questionable economic development decisions in Baldwin County/Fairhope.

      KEY ENTITIES:
      *   Mayor Tim Kant (former)
      *   Jack Burrell (Council President)
      *   Boone (Council member)
      *   Mayor Wilson (current)
      *   Baldwin County Commission
      *   Walcott, Adams, Verneuille Architects
      *   Fairhope Airport
      *   2012 (Mega Site purchase)
      *   2017 (Mega Site Commission review)
      *   $32 Million (Mega Site cost)
      *   $32,510.97 (Library payment)
      *   $32,000 (Recent undocumented bill)
    llm_text: Former Mayor Tim Kant and Council President Jack Burrell approved an undocumented $32k library repair invoice. This history of questionable spending, alongside the $32M Mega Site purchase, reveals a recurring pattern that impacts Fairhope's finances today.
