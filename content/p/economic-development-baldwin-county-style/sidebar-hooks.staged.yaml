  fairhope-town-hall-meeting:
    brief: |-
      THE CONFLICT: In 2017, the Mayor sought the repeal of ordinance 1572 (Fly Creek Apartments) and greater control over the Airport Authority; Council President refused to place this on the city council agenda.
      THE DISCOVERY: On 2/16/2017, the Airport land was noted as equivalent to 21% of the city debt, while Fairhope was spending more on the Airport than on schools, and losing the Fly Creek issue could cost $7 million.
      THE PIVOT: The 2017 struggle over the Airport Authority maintaining title to land (despite city payment) established the historical conflict over land ownership and debt that continues today, highlighted by Council President Jack Burrell receiving credit for his economic development plans for the Fairhope Airport.
      KEY ENTITIES: Jack Burrell, Fairhope Airport, Baldwin County Commission, Mega Site (2300 usable acres, $32 Million in 2012), Fly Creek, Ordinance 1572.
    llm_text: In 2017, Mayor vs. Council President Jack Burrell fought over Ordinance 1572 and control of the Fairhope Airport. Losing the Fly Creek issue could cost $7 million, revealing how Airport land equals 21% of city debt today.
