      *   Mega site (2300-Acre Certified South Alabama MEGA SITE)
      *   Fairhope Airport
    llm_text: The Baldwin County Commission spent $32 million on a vacant 2300-acre Mega site in Fairhope. See how Jack Burrell and the council dealt with inherited "baggage" and failed to resolve the $32,000 undocumented invoice.
