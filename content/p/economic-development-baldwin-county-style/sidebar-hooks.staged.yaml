  conflict-of-interest:
    brief: |-
      THE CONFLICT: Councilman Kevin Boone had long-standing conflicts of interest with engineering company Preble-Rish, linked through LLCs with Mr. John Avent. Boone voted on Preble-Rish projects, including the Fly Creek Apartments (Retreat at Fairhope), in September 2016 (SD 16.14).
      THE DISCOVERY: Article 2 revealed Boone’s consistent failure to recuse himself from voting on Preble-Rish projects and Fly Creek Apartments, despite the conflicts.
      THE PIVOT: Article 2 establishes a pattern of unaddressed conflicts of interest involving key Fairhope development issues (Fly Creek/Ordinance 1572), providing context for the broader 2012 Baldwin County Mega Site decision ($32M for 2300 acres) and current concerns over undocumented spending (Jack Burrell/Fairhope Airport) in Article 1.
      KEY ENTITIES: Kevin Boone, John Avent, Preble-Rish, Fly Creek Apartments (Retreat at Fairhope), Baldwin County Commission, Jack Burrell, Fairhope Airport, Councilman Robinson, Conners, Brown, 2012, 2016, $32 Million.
    llm_text: Councilman Kevin Boone consistently ignored conflicts of interest with Preble-Rish, linked through John Avent. Boone voted on the Fly Creek Apartments (Retreat at Fairhope) in 2016, revealing a pattern of unaddressed development issues in Fairhope.
