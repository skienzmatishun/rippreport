    brief: |-
      THE CONFLICT:
      *   Fairhope Airport Authority (FAA) sought an Advisory Opinion from the Alabama Ethics Commission on December 16, 2015, regarding a Ground Lease and Operating Agreement.
      *   The lease was executed on December 17, 2015, signed by H. Ray Hix and FAA Board Chairman Joe McEnerney.
      *   A different lease (Exhibit C) dated December 21, 2015, was subsequently submitted to the Ethics Commission, containing discrepancies in titles and signatures compared to the executed December 17th lease.

      THE DISCOVERY:
      *   The documents submitted on December 16, 2015, contained false information, as the December 21st lease was not the executed December 17th lease.
      *   The Alabama Ethics Commission issued an Advisory Opinion on February 3, 2016, stating contract execution was contingent on a favorable opinion, despite the executed 17th lease not complying with the opinion.
      *   Joe McEnerney filed an affidavit on March 20, 2017, referencing both the December 17th and December 17th memorandum of lease.

      THE PIVOT:
      *   The historical evidence of manipulated documents and the failure of the Alabama Ethics Commission to prevent the transaction proves the general claim in the Main Article that the Commission has "proven fruitless" and local corruption is flourishing.
      *   The FAA scandal (detailed in Article 2) serves as a specific example justifying the Main Article's call for new anti-corruption efforts in the 14 municipalities of Baldwin County.

