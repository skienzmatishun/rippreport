  one-woman-2:
    brief: |-
      THE CONFLICT:
      - Main article centers on Fairhope City Council and Council President Jack Burrell.
      - Burrell held Fairhope City Council President title for over 7 years; rare, most Councils share; Burrell maintained “control”.
      - Burrell’s control costly for City of Fairhope; lack leadership; favoritism to special interests, CATALYST.
      - Burrell knew whose idea it was to “dispose” of 106 acres of city property, worth $20 million; Burrell chose to lie to entire council chambers claiming he forgot.
      - Burrell led City Council to override Mayor’s veto over Fly Creek extension of zoning.
      - Burrell settled Triangle lawsuit and told citizens it was purchase of park; bare face lie.
      - Fairhope City Council avoided public participation/community engagement; refusing citizens opportunity to speak at public meetings got Council in Federal Lawsuit, which they lost.
      - Council issues included conservation easement, Twin Beech land for recreation, airport or K-1; Council President time and again represented special interests, opposed Mayor, quashed community engagement.
      - Burrell and Councilman Boone favored developer of Fly Creek apartments over citizens, by accepting parcel of land that is wetlands and at foot of Fly Creek Hwy 98 culvert; Fairhope gets liability and developer walks.
      - Burrell arranged parcel be last item on agenda at last council meeting under Tim Kant, who was no show that night; called CORRUPTION.
      - Conservation Easement: Council wanted to develop drainage gully; petition of over 2000 names got Council attention before reluctantly withdrew support.
      - Fairhope citizens need convince City Council not to dispose of any City property until scheduled land use plan completed.
      - If Fairhope keen to establish Conservation Easement for park or max conservation protection, ignored better location closer to bay, Breland property.
      - Burrell and council do not want public know story or fact they are in Court over issue.

      THE DISCOVERY:
      - Widget article is older than main article and framed as background/historical context.
      - Fairhope City Council bullied Mayor at Council meetings and other public venues.
      - First council meetings of council’s term were disgraceful.
      - “Leadership” of bulling headed by Council President Jack Burrell, who refuses to share Council President chair, supported by Councilmen Boone and Brown. Councilmen Conyers and Robinson mute, but complicit.
      - Bullying, intimidation, victimization same. Intimidation major weapon in Baldwin County political and judicial arena; some “men” find women easy target.
      - Women need speak up more.
      - One woman is: The VICTIM, Paula DiNardi.
      - DiNardi had to endure several postponements of case and over 8 hours in Fairhope Municipal Court, only to be victimized again.
      - DiNardi was latest victim of McSharry; life turned upside down since incident.
      - DiNardi stood alone in attempt for justice.
      - City Attorney represented her poorly; defense attorney wanted to politicize assault case into continued witch hunt against Mayor.
      - Ronan McSharry found guilty in Fairhope Municipal Court, last week, of public intoxication and assault, sentenced to 180 days in jail, with time served during rehab stay.
      - McSharry represented by Defense attorney John Beck, well known for victimizing victims; appeal will follow; McSharry does not want to go to jail.
      - McSharry through another attorney attempted to “settle the issue” with DiNardi, providing she remain silent for life and not show up for court, thus charges dropped.
      - Ripp Report’s understanding both offers were rejected. DiNardi reason: feels women should not be beat up by men, and then paid off to remain silent.
      - John Beck not only defended McSharry but wandered into line of questioning that politicized and was not relevant to assault and public intoxication case; Beck has way of victimizing victim and making guilty party look innocent.
      - Paula was represented in court by City Attorney Marcus McDowell, who job it is to vigorously represent victim; however McDowell neither objected or interfered with Beck’s line of questioning which had no relevant value.
      - Municipal Judge allowed Mr Beck to go unchallenged.
      - Beck asked DiNardi series questions related to Paul Ripp aka Ripp Report and my involvement in case; she explained Ripp Report, a non profit consumer organization, was acting as advocate for her; why judge nor city attorney did not ask Beck what relevance it had to do with case, I do not know.
      - Then Beck asked series questions about Mayor, and her alleged involvement, in case or her connection to Paul Ripp, Ripp Report; Beck rambled on without objection being heard.
      - It appears politicization of case will be Beck’s defense, supported by victimization of victim.
      - City Attorney did not even mention medical damages, over $6,000, DiNardi incurred, nor did he mention McSharry has green card and is not citizen of U.S. WHY?
      - DiNardi not only finds life turned upside down but now realization her case is being used in ongoing political witch hunt, focused on defeating Mayor Wilson in 2020.
      - Mayor and Ripp Report are not relevant to criminal charges against McSharry.
      - Get ready for 2020 because this is all about politics and politicians, Judges and Attorney’s keeping their jobs.
      - McSharry has a J Burrell sandwich on menu; J Burrell is also Council President that secured City Attorney his job as well as Municipal Judge; it is all connected.
      - Since Mr Beck appears ignorant about what Ripp Report is all about, Ripp Report will be sure to sign him up for newsletter.
      - In meantime here are two articles that Mr Beck may find helpful.
      - It is women like Paula DiNardi that make a difference.

      THE PIVOT:
      - Article 2 is older/background context and key context for Article 1.
      - Article 2 links Jack Burrell to Ronan McSharry, John Beck, Marcus McDowell, Mayor Wilson, Fairhope City Council bullying, political intimidation, women victimization.
      - Article 2 places Burrell in context of control over City Attorney and Municipal Judge; Burrell secured City Attorney job and Municipal Judge for McSharry via J Burrell sandwich.
      - Article 2 frames Paula DiNardi/McSharry assault case as potentially politicized witch hunt against Mayor Wilson in 2020.
      - Article 2 provides background for Burrell’s pattern: special interests, opposition to Mayor, public meeting bullying, community engagement refusal, legal/court context.
      - Article 2 is older than Article 1, so it serves as background/historical context for main article’s current allegations.

