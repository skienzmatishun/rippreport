      - Council de-funded Assistant Superintendent positions when Superintendents retired: Electric mid-2017, Gas late 2017, Water & Sewer Feb 2018.
      - In 2019, finally increased full-time employees from 2012 by 7 employees.
      - Value of free family insurance for elected officials this term: minimum $374k.

      WORKING WATERFRONT:
      - RESTORE Working Waterfront project.
      - Scope of Work: improvements to shoreline and bluffs along Eastern Shore of Mobile Bay in Fairhope.
      - Main criterion: improvements to bay shore to insure resiliency, sustainability, human interaction of City of Fairhope’s most precious resource: waterfront.
      - SOW concentrates on First Phase of overall Working Waterfront and Greenspace Project – Fairhope Municipal Pier and South Beach Park Improvements.
      - Project is 3 years behind schedule.
      - Council and Mayor lost or abandoned project? Fairhope needs to clean house next election.

