    brief: "THE CONFLICT: In 2013, instead of building a new sewer plant for approximately $20 million, Councilman Jack Burrell led the charge to upgrade the failing wastewater treatment plant on the north end of Church Street. The City Council approved $10 million for upgrades, which ultimately ballooned to $13 million by its completion in 2015. \n\nTHE DISCOVERY: Article 2 shows that long-term Councilman Jack Burrell historically resisted necessary, larger-scale infrastructure investments (such as a $5 million headworks replacement and a new 2013 plant) in favor of cheaper, stopgap patches, and later feigned concern over sewer system failures while deflecting blame from his own past decisions.\n\nTHE PIVOT: Article 2 serves as the smoking gun because while current Councilman Jack Burrell publicly complains about ongoing sewer failures and taxpayer costs, historical records prove he is directly responsible for the flawed infrastructure decisions that caused the current crisis, enabling unchecked pro-development policies.\n\nKEY ENTITIES: \n- Jack Burrell (Councilman)\n- Karen Wilson (Former Mayor)\n- Mayor Sullivan (Current Mayor/Utility Director)"
