      - Article 2 revealed Alabama Governor Kay Ivey administration issues, Medical Cannabis License scandal, Legislature special master, congressional lines, private dollars/lawyers.
      - Article 2 is key context/smoking gun for Article 1 because it connects Alabama state-level governance issues to Fairhope/Baldwin County local conflict involving Mayor Karen Wilson, City Council, Mayor/Utility Director, utilities, infrastructure, good ole boys.
      - Pivot point: Article 2’s Kay Ivey / Alabama Legislature / Medical Cannabis context may frame the state-level political environment relevant to Fairhope’s local government conflict and water/utilities issues.

