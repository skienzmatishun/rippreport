      *   This context supports Article 1’s claim that the Ethics Commission is an "Unethical Commission" that protects the connected.
      *   Article 1 reveals a systemic "job with benefits" involving Council President Burrell, the Airport Authority, and guaranteed protection from ethical violations/lawsuits.
      *   Article 1 provides concrete examples of Burrell's lack of accountability (e.g., 8 weeks mediating nothing; failure to discuss City budget; misuse of $10 million city utility transfer).

