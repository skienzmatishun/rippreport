  fire-albritton:
    brief: 'THE CONFLICT:

      - Orange Beach, Alabama Mayor Tony Kennon was accused by three City Council
      members of conflicts of interest, improper influence over council decisions,
      threats against elected officials, and transparency failures.

      - A long-running legal battle centered on Tom Albritton, Executive Director
      of the Alabama Ethics Commission (and an attorney). Allegations included self-dealing,
      breach of fiduciary duty, and awarding $135,000 in scholarships to his own children
      from the Mabel Amos Memorial Fund (a charity for needy students) via Regions
      Bank as trustee.

      - The trust’s board members were John Bell, Rick Clifton, and Tom Albritton;
      Regions Bank was trustee.

      - The fund became wealthy after oil was discovered on its property in 2010.
      Allegations say trustees diverted money into an investment account so Regions
      could collect excessive fees (from a few thousand dollars to over $100,000).

      - Legal filings began in 2013: the Lagniappe broke the story almost five years
      prior; The Ripp Report (represented by attorney Harry Still) filed a writ of
      Mandamus, an Alabama Bar Complaint, a complaint to the Attorney General, and
      a direct Ethics Complaint. All were ignored or dismissed.

      - Steve Marshall as Alabama Attorney General intervened in April 2023, alleging
      self-dealing, and appointed outside counsel Allen Dodd (Deputy AG) due to conflict-of-interest
      claims.

      - The trust is worth roughly $8.2 million mostly from oil and gas wells on its
      South Alabama property.


      THE DISCOVERY:

      - In 2024 Governor Kay Ivey fired Alabama Department of Veterans Affairs Commissioner
      Kent Davis via “extreme Executive Power” after the State Board voted to keep
      him, using Albritton/the Ethics Commission as a political pawn (per the Ripp
      Report).

      - On July 11, 2024, AG Marshall, Regions Bank, and Mabel Amos Trust board members
      (Bell, Clifton, Albritton) reached a settlement pending approval by Judge Greg
      Griffin; terms were not disclosed in court.

      - DOJ federal probe is alleged to be ongoing, clouding AG Steve Marshall’s political
      future (potential U.S. Senate run) and other AG Office candidates such as Katherine
      Robertson, Chief Counsel, who may run for Attorney General.

      - Katherine Robertson defeated Jay Mitchell in the Republican runoff nomination
      for Alabama attorney general, while Albritton remained in office despite the
      trust scandal.

      - The Ripp Report’s narrative: Albritton was “caught” and booted off the Mabel
      Amos Trust but still kept/kept fighting to keep $120,000 and his legal fees
      paid, hiring Ashby Pate to avoid repayment; he remained in office as Ethics
      Director with a salary over $100,000.

      - The ethics commission members Greg Pappas, George Pierce, and David “Chips”
      Pruet “had no idea Albritton had been involved in the ongoing litigation or
      accused of self-dealing,” yet they are now aware.


      THE PIVOT:

      Article 2 (FIRE ALBRITTON) is the smoking gun for Article 1 because it demonstrates
      that while Orange Beach council members filed an ethics complaint against Mayor
      Kennon, the very Ethics Commission and AG/Bar apparatus he might be held to
      was itself under federal investigation, had settled out-of-court a self-dealing
      trust scandal (without public disclosure), and its director Tom Albritton remained
      in office despite being the “poster boy of corruption” — making any ethics complaint
      against Kennon meaningless or likely to fail. Article 2 shows the system that
      should police ethics is complicit/compromised, so Kennon’s legal exposure in
      an Ethics proceeding is effectively neutralized:

      - The AG who was accused of whitewashing Albritton (Marshall) settled and is
      under federal scrutiny.

      - The ethics commission’s members were unaware of Albritton’s self-dealing during
      the period of his tenure, suggesting systemic failure/cover-up.

      - Albritton remained in office with a >$100k salary while accused of stealing
      from children/trust.


      KEY ENTITIES:

      - Tony Kennon – Mayor of Orange Beach, Alabama

      - Tom Albritton – Executive Director of the Alabama Ethics Commission (attorney)

      - Mabel Amos Memorial Fund / Mabel Amos Trust – charitable trust established
      by former Alabama Secretary of State Mabel Amos (1967–1975), died 1999

      - Regions Bank – trustee of the Mabel Amos Trust

      - John Bell, Rick Clifton – Mabel Amos Trust board members alongside Albritton

      - Steve Marshall – Alabama Attorney General (accused of conflict with Regions;
      potential U.S. Senate candidate)

      - Allen Dodd – appointed Deputy Alabama Attorney General representing AG in
      the Mabel Amos case

      - Katherine Robertson – Chief Counsel, AG’s Office; Republican nominee for Alabama
      Attorney general after defeating Jay Mitchell in runoff

      - Greg Pappas, George Pierce, David “Chips” Pruet – members of the Ethics Commission
      alleged to be unaware of Albritton’s self-dealing

      - Allen Dodd

      - Byron B. Mathews – attorney representing Tyra Lindsey (possible scholarship
      recipient) and Megan Carmack; argued for special master/special fiduciary; called
      settlement “collusive”

      - Tyra Lindsey – 10th grade student at Hillcrest High School in Evergreen, possible
      beneficiary of the trust

      - Megan Carmack – family member/beneficiary representative for Mabel Amos trust

      - Ashby Pate – attorney representing Albritton and Clifton

      - Harry Still – attorney for The Ripp Report

      - Kay Ivey – Governor of Alabama; fired Kent Davis by executive order in 2024

      - Kent Davis – former Alabama Department of Veterans Affairs Commissioner (fired
      Oct 2024)

      - Judge Greg Griffin – Montgomery County Circuit Court judge overseeing the
      Mabel Amos litigation'
