  orange-beach-tyranny:
    brief: 'THE CONFLICT:

      - Three Orange Beach City Council members filed an ethics complaint against
      Mayor Tony Kennon, alleging conflicts of interest and improper influence.

      - The complaint centers on the Mabel Amos Trust (Mabel Amos Memorial Fund) and
      its theft/alleged self-dealing.

      - Tom Albritton, formerly Director of the Alabama Ethics Commission, was forced
      out as trustee by the courts after a legal process involving Attorney Byron
      B Mathews and others.

      - The Lagniappe broke this story nearly 5 years ago; the Ripp Report (attorney
      Harry Still) filed a writ of Mandamus, an Alabama Bar Complaint, a complaint
      to the Attorney General, and a direct Ethics Complaint. All were ignored or
      dismissed.

      - The Ethics Commission members Greg Pappas, George Pierce, and David "chips"
      Pruet stated they had no knowledge Albritton was involved in litigation or accused
      of self-dealing.

      - Attorney General Steve Marshall allegedly attempted to whitewash the Albritton
      complaint; he is currently facing a federal probe that may affect his potential
      U.S. Senate run.


      THE DISCOVERY:

      - The Heart of Dixie Podcast (featuring Harry Still, Brandon Mosley, and Murder
      Creek Media guests Neely Fartner/Whitney Scapecchi) details an incident from
      Labor Day 2024.

      - A witness alleged Mayor Tony Kennan grabbed a woman by her hair on the balcony
      of the Coastal Resources building and struck her three times until she went
      limp.

      - Police found Kennan inside, where he claimed his "second office" was located;
      he stated his wife was present and nothing illegal occurred.

      - Councilman Robert Stewart and Councilwoman Ginger Harrelson requested an Ethics
      Commission inquiry regarding the incident, specifically alleging interference
      with public records and legislative items.


      THE PIVOT:

      Article 2 is the smoking gun for Article 1 because it provides concrete evidence
      of Mayor Kennon''s violent and secretive behavior in his "second office," which
      directly contextualizes the ethics complaints against him filed by council members.
      It demonstrates that the allegations of improper influence and lack of transparency
      are grounded in physical evidence of misconduct (assault/interference with records)
      rather than just financial conflict, reinforcing why the Ethics Commission (despite
      its corrupt status mentioned in Article 1) is the primary target for these complaints.


      KEY ENTITIES:

      - Tony Kennon (Orange Beach Mayor)

      - Tom Albritton (Former Alabama Ethics Director)

      - Harry Still (Retired Attorney, Ripp Report representative)

      - Greg Pappas, George Pierce, David "Chips" Pruet (Ethics Commission members)

      - Steve Marshall (Alabama Attorney General)

      - Katherine Robertson (Chief Counsel, AG''s Office)

      - Byron B Mathews (Attorney for Trust Plaintiffs)

      - Allen Dodd (Deputy Alabama Attorney General)

      - Tommy Gallion (Attorney for Megan Carmack)

      - Ashby Pate (Attorney for Albritton/Clifton)

      - Robert Stewart and Ginger Harrelson (Council members filing complaints)

      - Neely Fartner and Whitney Scapecchi (Murder Creek Media)

      - Mabel Amos Memorial Fund'
