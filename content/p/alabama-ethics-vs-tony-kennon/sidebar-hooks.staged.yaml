      The Ripp Report, represented by Attorney Harry Still, filed a writ of Mandamus, an Alabama Bar Complaint, a complaint to the Attorney General, and a direct Ethics Complaint.
      Albritton was ultimately forced out of his position as trustee of Mabel Amos Memorial Fund via court action.

      THE DISCOVERY:
      Article 2 established that state institutions (Attorney General, Ethics Commission, Alabama Bar) failed to adequately hold Albritton accountable, despite the fraud allegations.
      It also named local state politicians (Chris Elliott, Matt Simpson, Greg Albritton) who turned a blind eye to Albritton's actions.
      The case led to Allen Dodd being appointed Deputy Alabama Attorney General.

      THE PIVOT:
      Article 2 demonstrates a historical pattern of institutional failure and corruption within Alabama's state government (AG, Ethics Commission, Bar) to protect corrupt officials.
      This established pattern of protective failure provides context for Article 1, where the Ethics Commission is criticized for failing to act on a formal ethics complaint against Mayor Tony Kennon regarding conflicts of interest, improper influence, and threats.

