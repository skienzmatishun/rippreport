      THE DISCOVERY: The City Council was actively involved in land transfers and associated financial/conflict of interest issues while a major sewer spill was ongoing.
      THE PIVOT: Article 2 demonstrates the Council's historical failure to address critical sewer infrastructure needs in 2018, providing context for Article 1's claim that councilmen Boone and Burrell ignored sewer infrastructure issues for four years, leading to the later need for Mayor Wilson's $17.8 million Restore Act funding for sewer infrastructure.
      KEY ENTITIES: Mayor Wilson, Kevin Boone, Jack Burrell, Robert Brown, Cliff Pittman, Jay Robinson, Michel Upchurch, Lee Turner, Fairhope Single Tax Corporation, Big Head Gully, Tatumville Subdivision, $17.8 million.
