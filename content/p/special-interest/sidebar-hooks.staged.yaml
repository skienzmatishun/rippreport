      THE DISCOVERY: Widget Article called for attendance at an informative meeting and urged citizens to VOTE YES on November 6th, 2018.
      THE PIVOT: Widget Article demonstrates the early, organized public mobilization and call to action (prior to the detailed procedural updates in Article 1) supporting the Change of Government referendum.
