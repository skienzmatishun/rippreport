  raising-eyebrows:
    brief: |-
      THE CONFLICT:
      * 2011: David Whetstone was involved as private attorney in a similar battle concerning a city administrator position.
      * October 3 (unspecified year): Fairhope Special Election was canceled due to a technicality, involving Catalyst/Tim Can’t associates.
