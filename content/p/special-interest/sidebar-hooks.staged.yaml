  dirty-little-secrets:
    brief: |-
      THE CONFLICT: The City of Gulf Shores failed to follow its Ordinance Section 3-3E regarding the Regency Place Apartments Site Plan; this oversight was addressed after citizen Rex Lawson pointed it out. (September 20, 2018; Mayor Robert Craft; Andy Bauer)
      THE DISCOVERY: City of Gulf Shores used its Land Use Plan criteria in Site Plan recommendations from 2014, 2015, and 2016, but later claimed the plan was insignificant to City Staff recommendations.
      THE PIVOT: Both articles detail evidence of local government dysfunction and special interest control—Article 2 (Gulf Shores) provides a specific, documented example of zoning ordinance non-adherence and selective application of planning rules, paralleling the concerns in Article 1 (Fairhope) regarding the "control" of government by "Catalyst connections" and the need for a Change of Government referendum.
      KEY ENTITIES: Fairhope; City of Gulf Shores; Robert Craft; Andy Bauer; Rex Lawson; Catalyst; Fresh Start Fairhope; November 6, 2018.
    llm_text: Rex Lawson exposed how Gulf Shores violated Ordinance 3-3E at the Regency Place Apartments site. See how City officials, including Robert Craft, selectively applied rules, showing exactly why local oversight is critical.
