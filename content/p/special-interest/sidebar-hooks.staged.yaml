      THE DISCOVERY:
      * Article 2 demonstrates a historical pattern of organized effort by Catalyst, Tim Can’t, and associated legal figures (Marcus McDowell, David Whetstone) to prevent the election of a city manager/administrator.
      * This pattern involves ignoring conflicts of interest and using legal/political influence (e.g., long-term law firm on payroll, DA involvement) to delay or cancel initiatives.

      THE PIVOT:
      * Article 2 provides historical evidence (2011 and Oct 3) that the groups opposing the 2018 Council-Manager referendum (Article 1) have a track record of using legal influence and deliberate delays to maintain the status quo and prevent government change in Fairhope.
      * This history validates the claim in Article 1 that the "special interests" (Catalyst connections/Tim Can’t Club) want to maintain "control" rather than "govern."

