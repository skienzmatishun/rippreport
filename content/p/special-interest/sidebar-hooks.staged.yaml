  fairhope-catalyst-a-dirty-little-secret:
    brief: |-
      THE CONFLICT: The Fairhope City Council, an "at Large Catalyst council," was hand-picked for its last election by former Mayor Tim Kant. The current council has a dismal record in 20 years and is opposed to changing the form of government to districts. Mayor Karin Wilson defeated the Catalyst slate. Fresh Start Fairhope pushed for a Council-Manager system/districts.

      THE DISCOVERY: On 9/19/2018, the Catalyst Council was attempting to use a Special Meeting to hire a law firm and seek a Temporary Restraining Order from a circuit court judge to cancel the October 2, 2018, referendum for change of government.

      THE PIVOT: The 9/19/2018 article proves the Catalyst Council was actively attempting to obstruct and kill the initial October 2nd referendum. The 10/12/2018 article documents the resulting procedural changes (Referendum moved to November 6th, requiring two separate ballots) stemming from this conflict and the ongoing political resistance.

      KEY ENTITIES:
      *   Tim Kant
      *   Karin Wilson
      *   Jay Robinson (Councilman/Attorney)
      *   Jack Burrell (Council President)
      *   Chuck Zunk (Fresh Start Fairhope Spokesman)
      *   Catalyst
      *   Fresh Start Fairhope (FSF)
      *   Fairhope City Council
      *   October 2, 2018 (Initial Referendum Date)
      *   November 6, 2018 (Revised Referendum Date)
    llm_text: Tim Kant's Catalyst Council tried to kill the October 2, 2018, Fairhope referendum using a Special Meeting. See how Karin Wilson and Fresh Start Fairhope fought this obstruction, forcing the pivotal vote to November 6, 2018.
