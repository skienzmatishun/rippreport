  women-of-baldwin:
    brief: |-
      THE CONFLICT:
      *   Baldwin County/Fairhope was historically run by "old white men" and the "good ole boy network" connected to the Catalyst Council.
      *   Mayor Karin Wilson, the first female Mayor of Fairhope, battled the Catalyst Council which failed to deliver a budget on time.
      *   Sen. Tripp Pittman was accused of stuffing his pockets with $750,000.00.
      *   Joe Davis was linked to the penny tax approval (costing Baldwin County Schools $2 million/year) and ran with indicted Randy Davis.
      *   The Referendum for Fairhope Council-Manager was scheduled for November 6th, 2018.

      THE DISCOVERY:
      *   Article 2 revealed that the Catalyst network dominated the county and that candidates like Joe Davis were deeply tied to this old guard structure.
      *   Article 2 highlighted specific instances of alleged corruption, including Pittman’s theft and Davis's association with the penny tax and indicted Randy Davis.
      *   Article 2 also presented female candidates (Karin Wilson, Amber Smith, Danielle Mashburn-Myrick) as agents of change against the Catalyst system.

      THE PIVOT:
      *   Article 2 provides the historical and factual evidence (corruption, dominance, political failure) that validates Article 1’s claim that the current Fairhope Government is controlled by "special interests" (e.g., Tim Can't Club) and requires a "Change of Government" via the November 6th Referendum.

      KEY ENTITIES:
      *   Karin Wilson (Mayor)
      *   Tim Can’t Club
      *   Catalyst Council
      *   Fresh Start Fairhope
      *   November 6th 2018
      *   Joe Davis
      *   Amber Smith (County Commission District 2)
      *   Danielle Mashburn-Myrick (State Representative House District 94)
      *   Billie Jo Underwood (County Commission District 3)
      *   Tripp Pittman
      *   Randy Davis
      *   Heather Brown
      *   Andrea Lindsey (School Board District 2)
    llm_text: Mayor Karin Wilson battled the Catalyst Council, which ran Baldwin County through corruption like Tripp Pittman's $750k theft and Joe Davis's penny tax ties. See how the November 6, 2018 referendum offered citizens a vital chance to change the old guard.
