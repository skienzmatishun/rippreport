  ethic-less-in-alabama:
    brief: |-
      THE CONFLICT:
      *   Senator Lee "Trip" Pittman conducted business as a contractor with the City of Fairhope starting in 2004.
      *   He secured a two-year debris removal contract (extended through July 14, 2010).
      *   Pittman won the $625,575.00 "Oil Spill 2010" contract.
      *   Pittman operated without a required General Contractor's License until May 7, 2012.
      *   In July 2014, the Alabama Ethics Commission (AEC), led by Hugh Evans, issued a letter supporting Pittman's contract extension (Bid 009-12: Disaster Debris Removal and Disposal).

      THE DISCOVERY:
      *   Pittman repeatedly secured municipal contracts in Fairhope by being the low bidder, even while lacking proper licensing.
      *   The AEC was implicated in enabling or supporting Pittman’s contracts, contradicting claims that he was acting solely as a private contractor.
      *   Pittman was connected to county commissioners like Bob James, who served as a business partner/sub-contractor.

      THE PIVOT:
      *   The historical pattern (2004-2014) shown in Article 2 demonstrates that Pittman's current awarding of six lucrative municipal contracts while on Fairhope Planning and Zoning is not a new incident, but a continuation of a long-standing conflict of interest.
      *   The AEC’s prior assistance in contract extensions (e.g., July 2014) refutes the current City Council and Mayor's view that there is "no conflict of Interest."

      KEY ENTITIES:
      *   Senator Lee "Trip" Pittman
      *   Jasper T Dorsey / Tucker Dorsey
      *   Summit Construction Company, Inc.
      *   Alabama Ethics Commission (AEC) / Hugh Evans
      *   Clarence E Burke
      *   Bob James
      *   Fairhope Planning and Zoning
    llm_text: Senator Lee "Trip" Pittman won the $625,575 Oil Spill 2010 contract in Fairhope without a proper license. The Alabama Ethics Commission, led by Hugh Evans, supported these contracts, refuting claims of "no conflict of interest."
