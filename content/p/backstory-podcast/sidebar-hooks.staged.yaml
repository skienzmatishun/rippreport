  timeline:
    brief: |-
      THE CONFLICT:
      - Baldwin County, Alabama, has 14 municipalities; Fairhope City Council stands alone among them for lack of leadership, transparency, and accountability.
      - Fairhope City Council voted themselves free health insurance coverage (Monday night).
      - Fairhope City Council additionally set the Mayor’s salary, ignoring an Auburn Study that was supposed to give guidance to these issues.
      - Exposure and the Court of Public Opinion would lead to the council’s removal in 2020.

      THE DISCOVERY:
      - Article 2 (Widget: TIMELINE / Ripp Report received comment) described Fairhope City Council obstruction in infrastructure repairs.
      - Sewer issue finally awakened Fairhope citizens.
      - City Hall received numerous calls from irate citizens blaming the Mayor and City Staff for problems that squarely rested on the Council’s shoulders.
      - Article 2 questioned: Where is the TIMELINE of the City Council? Citizens should be raising hell, but raise hell at the responsible party. — Call the City Council and ask for a timeline.
      - Article 2: If the sewer issue pisses you off, how about three of the same Council using their elected office for personal gain? While the other two Council members turned a blind eye.

      THE PIVOT:
      - Article 2 is older than Article 1; frame it as background/historical context.
      - Article 2 revealed council obstruction in sewer infrastructure repairs; Article 1 (Backstory Podcast) uses that as context for the political corruption narrative in Baldwin County.
      - Article 1 announced future podcasts will focus on political corruption in Baldwin County; exposing the good ole boy system entrenched since the first pecan tree was planted.
      - Exposure and the Court of Public Opinion lead to council removal in 2020.

      KEY ENTITIES:
      - Francis Paul Ripp - U.S.M.C. combat veteran; of the Ripp Report (www.rippreport.com) non-profit/consumer advocacy organization; Facebook pages: The Ripp Report and Baldwin County Legal Eagle.
      - Harry Still, III - The Backwoods Southern Lawyer; former ICMA Credentialed Manager, Economic Developer, City Planner and County Manager; currently attorney in private practice; Backwoods Media, LLC - Alabama Domestic Limited Liability Company located in Baldwin County, Alabama.
      - Fairhope City Council - voted themselves free health insurance coverage; set Mayor’s salary; three Council members used elected office for personal gain; two turned a blind eye; blamed by citizens for sewer/infrastructure problems.
      - Mayor - salary set by Council; Council ignored Auburn Study.
      - Auburn Study - supposed to give guidance to health insurance/Mayor salary issues.
      - Fairhope citizens - irate; blamed Mayor and City Staff; sewer issue awakened them.
      - City staff - blamed by citizens; problems rested on Council.
      - Baldwin County - good ole boy system entrenched since first pecan tree planted; judicial system hold.
      - Fairhope - one of 14 municipalities; council stands alone.
      - Locations: Baldwin County, Alabama; Fairhope, Alabama.
      - Names to mention: Lowery, Wilters, etc.
