  mega-mistake:
    brief: |-
      THE CONFLICT: Baldwin County Mega-Site spending (32 million spent over 7 years) resulted in a vacant site; Baldwin County Economic Development Alliance (BCEDA) under Lee Lawson failed to find a tenant, leading to a proposed transfer of the ~50 million site to BCEDA on July 25th.
      THE DISCOVERY: Article 1 predicts Fairhope City Council will vote for free health insurance and set Mayor's salary on Sept. 9, 2020, and anticipates council removal in 2020 due to lack of transparency.
      THE PIVOT: Article 2 establishes a history of questionable land/municipal transfers (e.g., 20 million acres in Weeks Bay, 106 acres in Fairhope) and past failures by Lee Lawson (K-1 center, Jack Burrell International) which casts doubt on Fairhope City Council's transparency and competence mentioned in Article 1.
      KEY ENTITIES: Baldwin County, Fairhope City Council, Backwoods Media, LLC, Francis Paul Ripp, Harry Still, III, Lee Lawson, Baldwin County Economic Development Alliance (BCEDA), Weeks Bay, Auburn Study, July 25th, Sept. 9, 2020
    llm_text: Lee Lawson's BCEDA failed to place a 50 million dollar Baldwin County site. See how past land deals raise serious questions about Fairhope City Council's upcoming Sept. 9 vote.
