      * Article 1 confirms the self-dealing findings noted in the Special Fiduciary's report (mentioned in Article 2) but highlights the eventual settlement that absolved fiduciaries (including Albritton) and required a $1.325 million repayment to the fund.
      * Article 2 provides the necessary background showing that the Ethics Commission and AG initially failed to act on clear evidence of Albritton's alleged fraud, contrasting with the final legal findings.

