  mabel-amos-scholarship-list-revealed:
    brief: |-
      THE CONFLICT:
      - A four-year civil litigation involving the Mabel Amos Memorial Fund (MAMF), which was established by the late two-term Alabama Secretary of State Mabel Amos upon her death in 1999 (fund inception in 2002) with roughly $500,000 that grew to millions due to oil discoveries in Conecuh County.
      - Lawsuits filed by grandniece Leigh Manning, great-grandniece Megan Carmack, and student Tyra Lindsay (represented by attorney Byron B. Mathews, Jr.) against trust fiduciaries—including Regions Bank, John Bell, Drew McNeese, Rick Clifton, and Alabama Ethics Commission Executive Director Tom Albritton—alleging self-dealing, fraud, and improper distribution of scholarships to relatives, friends, and law firm associates.
      - Alabama Attorney General Steve Marshall intervened as a plaintiff, attempting multiple emergency stays with the Alabama Supreme Court to block independent accounting efforts.
      - Montgomery County Circuit Court Judge Greg Griffin appointed James C. White, Sr., as Special Fiduciary, whose investigation cost the trust $557,105.
      - A final court order absolved and held harmless trust fiduciaries (including Tom Albritton, Regions Bank, John Bell, and Drew McNees) from all liability for administration from 2002 onward under a settlement requiring defendants to pay back $1.325 million and $300,000 in attorneys' fees.

      THE DISCOVERY:
      - The Special Fiduciary's report (uncovered and published by Lagniappe) revealed a hidden 12-year list of scholarship recipients from 2014 to 2024, exposing a "who's who" of prominent Andalusia and Covington County citizens.
      - Documented $257,844 in self-dealing disbursements to children of board members and associates, including $135,000 paid to Tom Albritton's children (Martha H. Albritton and James Albritton receiving $67,500 each) and $60,000 to Anna E. Bowden (daughter of Judge Ben Bowden, Albritton's former law partner and childhood friend).
      - Revealed nearly $470,000 given to colleges and universities as unauthorized "endowed scholarships," totaling $725,000 in unallowed spending.
      - Showed that IRS Form 990 reports listed names and amounts from 2002 to 2013, but omitted recipient names starting in 2014 after oil royalties flooded the fund with millions.

      THE PIVOT:
      - Article 2 (Lagniappe report) provides the foundational, historical accounting proof of Tom Albritton's systemic self-dealing and misuse of trust funds.
      - It serves as the "smoking gun" because it exposes the exact financial abuses and hidden recipient lists that Article 1 uses to condemn Albritton as a hypocritical, corrupt "fake ethics director" who escaped criminal charges and liability via a politically managed settlement, while depriving deserving children of legitimate scholarships.

