  alabama-ethics-vs-tony-kennon:
    brief: |-
      THE CONFLICT:
      - Tom Albritton, Alabama Ethics Director, administered the Mabel Amos Memorial Fund; trust inception date = 2002.
      - Litigation over the Mabel Amos Memorial Fund lasted four years; hundreds of thousands lost in court actions; litigation costs drained the Trust of assets that could have been used to award scholarships.
      - Special Fiduciary's report: board members indulged in self-dealing in handing out scholarships to relatives and friends; list of recipients hidden from public view for past 12 years; described as virtual "who's who" of Andalusia's most prominent citizens.
      - Judge Griffin: ending litigation via settlement would best serve interests of the Trust and beneficiaries and the interest of justice.
      - Settlement: defendants Regions, Albritton, Bell, and Drew McNeese (who replaced Bell as Regions' representative in 2020) responsible for paying $1.325 million back to the fund; fund made whole for improperly distributed money to people/institutions and fees Regions overcharged; does not delineate how payback would break down among defendants; defendants on hook for $300,000 in attorneys fees for plaintiffs; Regions allowed to remain as trustees if it adjusted its fee calculations.
      - Albritton and Drew McNeese "will be absolved and held harmless from all liability, known or later discovered, that resulted from, or arose out of, their administration of the Trust from the date of its inception in 2002 to the date of the Final Order."
      - Courts forced Albritton out of his position as trustee of the Mabel Amos Memorial Fund.
      - Albritton wanted to keep the $120,000.00 and hired an attorney to NOT pay back the money and have his legal fees covered.
      - Not one politician called for Albritton's removal from office; Albritton allowed to remain in office while paid by taxpayers over $100,000.00/year; judged others about ethics.
      - Alabama AG Steve Marshall publicly stated Mr. Albritton committed fraud and self-served himself from the trust; moved forward with lawsuit; resulted in Allen Dodd being appointed Deputy Alabama Attorney General.

      THE DISCOVERY:
      - Article 2 showed three members of the Alabama Ethics Commission - Greg Pappas, George Pierce, and David "chips" Pruet - "Had no idea Albritton" the Ethics Director "had been involved in the ongoing litigation or had been accused of self-dealing". WTF.
      - Now they are aware as well as the whole state.
      - Tom Albritton should be fired immediately or our politicians continue to hide under rocks.
      - AG, Ethics Commission, and Alabama Bar all wear the same dirty underwear; protect one another and politicians from pesky political complaints; play a legal shuffle that results in whitewashing their culpability.
      - Alabama Bar did nothing; Attorney General tried to whitewash the Albritton complaint; Poison Ivy did nothing because she has Biden Syndrome.
      - The Lagniappe broke the story almost 5 years ago; The Ripp Report, represented by Attorney Harry Still, filed a writ of Mandamus, an Alabama Bar Complaint, a complaint to the Attorney General, and a direct Ethics Complaint; all were ignored or dismissed; The Ripp Report started using the court of public opinion.
      - Attorney Byron B. Mathews: "I hope this case is a cautionary tale to all lawyers and other individuals who create charitable trusts and nonprofit corporations with an eye toward self-enrichment and self-aggrandizement. I am sad to say this happens far too often."
      - Mayor Tony Kennon's three members of the City of Orange Beach council filed a formal ethics complaint against Mayor Tony Kennon, alleging conflicts of interest, improper influence over council decisions, threats directed toward elected officials, and failures related to transparency and disclosure of information.
      - Filing an ethics complaint in Alabama is a joke; don't count on Kennon facing any music from the ethics commission; Tony knows Director Tom Albritton, who is more crooked than a snake on hot asphalt; Albritton is worse than Kennon.
      - Albritton is caught, booted off the trust, but wants to keep the $120,000.00 and hired an attorney to NOT pay back the money and have his legal fees covered.
      - Federal Probe and Political Fallout: confidential source told ALPolitics.com that a federal probe continues and quietly complicates Steve Marshall's political future, particularly his potential run for the U.S. Senate; it also complicates other potential candidates for office within the AG's Office, such as Katherine Robertson, Chief Counsel, who may run for Attorney General.
      - Katherine Robertson took a major step toward becoming Alabama's next attorney general on Tuesday, defeating Jay Mitchell in the runoff for the Republican nomination; during the campaign the ethics commission director and his fleecing of the Mabel Amos Trust never was debated.

      THE PIVOT:
      - Article 2 is the smoking gun for Article 1 because Article 2 shows the three Ethics Commission members - Greg Pappas, George Pierce, and David "chips" Pruet - had no idea the Ethics Director, Tom Albritton, had been involved in the ongoing litigation or had been accused of self-dealing; now they are aware as well as the whole state.
      - Article 2 frames the Alabama Ethics Commission as corrupt; filing an ethics complaint in Alabama is a joke; the AG, Ethics Commission, and Alabama Bar wear the same dirty underwear and protect one another, whitewashing culpability.
      - Article 2 ties the Tony Kennon ethics complaint to the same corrupt ethics commission framework, using the Albritton/Mabel Amos Trust matter as background.
      - Article 2 provides background/context that Article 1 uses to argue Albritton should be fired and not allowed to have any standing in the Alabama Ethics Commission, and that his actions deprived deserving children scholarships.

