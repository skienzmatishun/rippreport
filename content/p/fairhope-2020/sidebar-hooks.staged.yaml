  community-engagement:
    brief: |-
      THE CONFLICT:
      - Ronan McSharry arrest: defense attorney made incident political by raising questions about Mayor; Mayor had no involvement; Fairhope Catalyst Council made no public statements about McSharry’s continued bad acts and convictions.
      - Former employee complaints: framed as sour grapes; same employees planning to run for office or support Catalyst candidates.
      - Third sour grapes lawsuit: Catalyst allegedly involved; Sullivan and Pandora got settlements from City Council, uncontested; principal of alleged shaking incident taking turn in Federal Court; no City Council settles Federal lawsuit; case should be dismissed.
      - Family Court Judge Thomasson at MOJ: political move; 100+ attendees; Judge wanted to turn family friendly organization into her own selected Board and exclude those serving; booed; soundly defeated by 75% margin vote.
      - Mayor Wilson: refused duel salaries of Mayor and Utility Director, position and salary former Mayor enjoyed for over 10 years; salary matter in limbo since election of Mayor Wilson.

      THE DISCOVERY:
      - Article 2/Widget: Fairhope Work Session, March 27; first 15 min K-1 Center; next 15 min Conservation Easement on Triangle property 109 acres.
      - Councilman Conyers: spoke up for citizens; encouraged Community Engagement/public participation; unsuccessfully urged Council to establish pay grade for Mayor; in limbo since election of Mayor Wilson.
      - Baldwin County School Board wanted to sell K1 Center over 10 years; only buyer considered City of Fairhope; Council had own plan that failed; Mayor had backup plan; sale on track again.
      - Council’s first K-1 effort restricted public participation; Jack Plan failed.
      - Mayor trying to maximize Community Engagement discussions for K-1 Center, Triangle property, Comprehensive Land Use Plan.
      - Public meeting Tuesday April 2 @ 9:00 AM at Nix Center to select Training Facilitators, approx 30, for 30 tables hosting April 3 meeting; training meeting to prepare facilitators to guide conversation on April 3.
      - K-1 Center, Nix Center, Fairhope Community Park included in $4 million purchase; no funds for development currently budgeted for K-1 Center.
      - Triangle lawsuit settlement: $8.25 million, additional $3 million legal fees.
      - Mr Burrell insisted Triangle property purchased for park, “total BS”; to pay for property Mayor and Council President Jack Burrell raided utility fund for $3 million, took loan for rest; attorneys got $3 million up front.
      - City of Fairhope under Comprehensive Land Use Plan; Mayor promoting under banner of Community Engagement; Council President does not think Council needs outsider input.
      - Last 15 min of video: Council President Burrell and Councilman Brown push for Conservation Easement; Burrell and Brown know they can count on Bee Boone for third Catalyst vote.
      - Councilman Conyers and Robinson favor Community Engagement route, along with Mayor.
      - Burrell, Boone and Brown favor Conservation Easement and want rush decision before Comprehensive Land Use Plan finished.
      - Why: Catalyst does not want anything done on property; Conservation Easement will accomplish that; citizens better not let that happen.

      THE PIVOT:
      - Article 2 older/background; frames Article 1 as current/future context.
      - Article 2 shows Council K-1 plan failed; Mayor had backup; public participation restricted; Council President Burrell pushed Conservation Easement; Catalyst did not want property action.
      - Article 2 context for Article 1: politics, Catalyst Council, elections, lawsuits, public engagement; Article 1 frames politics as major negative; Article 2 key background for Conservation Easement/community engagement conflict.

      KEY ENTITIES:
      - People: Ronan McSharry, Mayor Wilson, Police Chief, Judge Thomasson, Sullivan, Pandora, Jack Burrell, Councilman Conyers, Councilman Robinson, Councilman Brown, Bee Boone, Lowery, Wilters.
      - Organizations: Fairhope Catalyst Council, City Council, Baldwin County School Board, City of Fairhope, Utility Fund, MOJ, Family Court, Training Facilitators, Catalyst.
      - Locations: Fairhope, Baldwin County, K-1 Center, Nix Center, Fairhope Community Park, Triangle property, Conservation Easement, Comprehensive Land Use Plan.
      - Dates/dollar amounts: March 27 work session; April 2 @ 9:00 AM; April 3 meeting; 2020; over 10 years; since election of Mayor Wilson; for over 10 years; last week; last night; 75% margin vote; 100+ attendees; 30 facilitators/30 tables; $8.25 million settlement; $3 million legal fees; $3 million utility fund; $4 million purchase.
    llm_text: Fairhope Mayor Wilson and Council President Jack Burrell are pushing a conservation easement on the Triangle property before the Comprehensive Land Use Plan finishes. With the Catalyst Council blocking public action, voters should care before the K-1 Center and park plans hit the same wall.
