  you-dont-know-jack:
    brief: |-
      THE CONFLICT:
      *   Prior to 2016, the City of Fairhope operated under a dubious system allowing a Mayor’s father-in-law to control vote counting, maintaining two "Goober" mayors.
      *   In August prior to 2016, Karin Wilson achieved an upset against #1 Goober Tim Kant in Baldwin County politics.
      *   In 2015, a ground lease for a commercial hanger on plat 2 at Fairhope Airport Authority was awarded under circumstances suggesting conflicts of interest and lack of transparency.

      THE DISCOVERY:
      *   The Fairhope Airport Authority sent an RFP on September 21, 2015, for the commercial hanger lease.
      *   On November 17, 2015, Ray Hix recused himself from the discussion regarding the lease recommendation.
      *   Jack Burrell (President of the Fairhope City Council and Airport Authority) moved to award the bid to Hix/Snedecker Companies DBA Mid-Bay Air, LLC, which was seconded by Vince Boothe.
      *   The memorandum of lease was recorded on December 17, 2015.

      THE PIVOT:
      *   The 2015 airport lease incident (Article 2) provides concrete evidence of the public corruption and rigged contracts that Mayor Wilson (Article 1) ran against and sought to expose by building her administration on transparency.
      *   The specific conflicts of interest involving Jack Burrell, Ray Hix, and Mr Snedecker demonstrate the systemic failure of the "Goober" class that Mayor Wilson challenged.

      KEY ENTITIES:
      *   Karin Wilson (Mayor)
      *   Tim Kant (#1 Goober, defeated candidate)
      *   Jack Burrell (President, Fairhope City Council; Airport Authority)
      *   Ray Hix (Airport Authority Board member, Operations Committee)
      *   Vince Boothe (Airport Authority Board member)
      *   Mr Snedecker (Fairhope Municipal Judge)
      *   Fairhope Airport Authority
      *   Mid-Bay Air, LLC
      *   Baldwin County
    llm_text: 'Karin Wilson defeated #1 Goober Tim Kant building her administration on transparency. Yet, a 2015 Fairhope Airport Authority lease involving Jack Burrell and Ray Hix proves the old corruption didn''t end, exposing Mid-Bay Air''s rigged deal.'
