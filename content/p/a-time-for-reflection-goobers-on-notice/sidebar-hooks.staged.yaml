      THE DISCOVERY:
      *   Article 2 revealed that Kant micromanaged the city, creating a "good ole boy club" and controlling the City Council and Planning and Zoning Board.
      *   Article 2 quantified financial mismanagement: $20 million for projects (soccer fields, imaginary north end parkland), with soccer fields costing over $5 million but lacking basic facilities.
      *   Article 2 identified Senator Tripp Pittman as a business associate of the past council.

      THE PIVOT:
      *   Article 2 establishes the historical context and specific financial/structural corruption (good ole boy club, controlled P&Z, rigged systems) that existed under Kant and Nix.
      *   Article 1 uses the 2016 upset (Karin Wilson defeating Tim Kant) as the moment of change, but Article 2 provides the detailed evidence proving that the system was corrupt and necessitated the call for transparency.

