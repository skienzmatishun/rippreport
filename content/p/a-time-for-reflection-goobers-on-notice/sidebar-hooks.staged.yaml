  fairhope-airport-un_authorized:
    brief: |-
      THE CONFLICT:
      *   Dec 23, 2015: Airport Authority signed memorandum of lease with Mid-Bay Air LLC at Sonny Callahan Airport in Fairhope, AL.
      *   Ray Hix, an Airport Authority board member (Secretary/Treasurer), utilized confidential information (airport leases, bids) gained from his position to secure the lease as Mid-Bay Air LLC, creating an obvious conflict of interest.
      *   The board, including Jack Burrell (City Council President/Board Member), failed to raise objections or enforce ethical standards despite the clear conflict.

      THE DISCOVERY:
      *   Article 2 proved the lease was never submitted to the Alabama Ethics Commission, confirmed by their reply on Dec 2, 2016.
      *   The lease is concluded to be null and void due to failure to comply with ethics rules (Ethics Commission Opinion 2016-04).

      THE PIVOT:
      *   Article 2 provides concrete evidence of the specific, systemic conflicts of interest and ethical failures (Hix/Burrell) that Article 1 frames as the "dubious system" and "public corruption" ("The Goobers") that Karin Wilson's administration is dedicated to exposing and correcting following her August 2016 upset of Tim Kant.

      KEY ENTITIES:
      *   Karin Wilson
      *   Tim Kant
      *   Ray Hix
      *   Jack Burrell
      *   Mid-Bay Air LLC
      *   Fairhope Airport / Sonny Callahan Airport
      *   Alabama Ethics Commission
      *   Joe McEnerey
      *   Pam Caudill
    llm_text: Ray Hix and Jack Burrell ignored a conflict of interest when Mid-Bay Air LLC secured the Sonny Callahan Airport lease. The Alabama Ethics Commission deemed the deal null and void, exposing the "Goobers" Karin Wilson is fighting to correct.
