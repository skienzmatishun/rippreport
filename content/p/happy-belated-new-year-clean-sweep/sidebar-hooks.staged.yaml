    brief: |-
      THE CONFLICT:
      *   2012 election concluded on September 11th, electing four new council members in Fairhope.
      *   Five of seven targeted individuals, including the City Administrator, were removed during the "Clean Sweep."
      *   Mayor Tim Kant and Mike Ford were "re-elected" in 2012.
      *   Mayor Kant faces baggage including the BP Boom Scam (with Trip Pittman) and the Triangle Lawsuit (costing millions in legal fees).
      *   Dr. Chris Warner attempted a full vote recount in 2012, which the city stated would cost many thousands more than the $4,000 machine recount.
      *   Clean Sweep plans to remove Tim Kant, Mike Ford, Senator Trip Pittman, and three of the four county commissioners.
      *   The First Baptist Mega Church fiasco involved planning and zoning ignoring the development code/master plan.

      THE DISCOVERY:
      *   Jonathan Smith (planning and zoning czar) congratulated City Administrator Gregg Mims for the ACCMA Award.
      *   Mims was third out of three nominees for the ACCMA Award (last place).
      *   Article 2 linked Fairhope's issues to corruption involving the city administrator in Phenix City, noting that administrator there would be fired with a new council.

      THE PIVOT:
      *   Article 2 provides historical context on City Administrator Gregg Mims' perceived vanity and questionable conduct (ACCMA award) prior to the 2012 cleanup.
      *   It establishes an early parallel, suggesting Fairhope corruption mirrors the known corruption of Phenix City administration, lending weight to the citizens' suspicion of the 2012 election process (referenced in Article 1).

