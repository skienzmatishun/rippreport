  hanky-panky-at-the-po-po:
    refined_source: ce07b57108dec6d0dea6cdd7163a124bcc27a1479251a8cc5440cdeb662470b8
    brief: |-
      THE CONFLICT:
      - Murray “Bubba” Lawrence Jr. was wrongfully convicted of the capital murder of Brandon Hastings and has been incarcerated in Holman Prison for 20 years.
      - The conviction was based on testimony from Jarius McNeal, who implicated Lawrence to avoid a death sentence.
      - Investigators Hoss Mack, Anthony Lowery, and Dean McGowan failed to produce fingerprints, weapons, blood, or cell phone records linking Lawrence to the crime.
      - Sheriff Hoss Mack, District Attorney David Whetstone, and Judge Robert Wilters suppressed exculpatory evidence regarding a Mississippi autopsy that concluded the cause of death was asphyxiation by strangulation, instead pursuing a gunshot theory without a weapon or ballistics.
      - The suppression of this evidence was acknowledged by the three officials in a 2023 Lagniappe cover story, "Digging Deep."

      THE DISCOVERY:
      - Evidence of a "Sheriff's Circle of Protection" within the Baldwin County Sheriff's Office (BCSO).
      - Captain Andre Reid (Major Crimes/CID) was accused of an affair with a subordinate; despite "policy violations," he faced no loss of pay and was promoted to Captain of the Baldwin County Correction Center.
      - An ongoing Federal investigation exists regarding missing evidence in the possession of BCSO deputies working as Federal Agents under the Organized Crime Drug Enforcement Taskforce (OCDEFT).

      THE PIVOT:
      - Article 2 establishes a documented systemic pattern of the BCSO shielding high-ranking officials from accountability through internal investigations that result in no punishment.
      - This culture of "protection" provides the structural explanation for how Mack, Whetstone, and Wilters were able to suppress evidence and facilitate a wrongful conviction for two decades without immediate legal consequence.

      KEY ENTITIES:
      - Hoss Mack (Sheriff)
      - Murray “Bubba” Lawrence Jr. (Incarcerated individual)
      - Anthony Lowery (Investigator/BCSO)
      - Dean McGowan (Investigator/BCSO)
      - David Whetstone (District Attorney)
      - Robert Wilters (Judge)
      - Andre Reid (Captain, BCSO)
      - Jarius McNeal (Implicating witness/Suspect)
      - Brandon Hastings (Victim)
      - Tony Fuqua (Officer/Witness)
      - Dr. Paul McGarry (Forensic Pathologist)
      - Baldwin County Sheriff's Office (BCSO)
