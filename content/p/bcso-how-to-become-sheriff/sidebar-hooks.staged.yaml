  shuffling-the-deck:
    refined_source: c2c608a7913c61bc831a7ecf68051b17ca34e7adea9992bd7a96d9fee17c14a6
    brief: |-
      THE CONFLICT:
      *   Murray “Bubba” Lawrence Jr. was wrongfully convicted in a capital murder case (approx. 2003/2004) for the death of Brandon Hastings.
      *   The Mississippi autopsy (witnessed by Dean McGowen, John Stewart, and Tony Fuqua) determined the cause of death as asphyxiation by strangulation, per Dr. Paul McGarry.
      *   Sheriff Hoss Mack, District Attorney David Whetstone, and Judge Robert Wilters ignored the Mississippi autopsy, asserting a false gunshot theory without evidence.
      *   Mack, Whetstone, and Wilters ordered a second autopsy in Baldwin County and withheld exculpatory evidence from the defense.
      *   Lawrence was incarcerated for 20 years in Holman Prison.
      *   The actual killer was Jarius McNeal, who implicated Lawrence to avoid the death sentence.
      *   Sheriff Mack was promoted from Captain to Sheriff for his role in the wrongful conviction.

      THE DISCOVERY:
      *   Article 2 (Widget) stated Sheriff Mack was retiring due to internal issues, including the wrongful conviction of Murray Lawrence Jr.
      *   Article 2 identified Anthony Lowery as having been involved with "Captain Mack" in the 2004 wrongful conviction.
      *   Article 2 warned that Lowery would be a poor choice for replacement due to his checkered history with BCSO.

      THE PIVOT:
      *   Article 2 provides the historical context, confirming Anthony Lowery's complicity in the 2004 wrongful conviction—the very event that secured Mack's promotion.
      *   This context is crucial for Article 1 because it establishes Lowery's initial involvement in the systemic failure, predating the 2023 discovery of exculpatory evidence that proved Lawrence’s innocence.

      KEY ENTITIES:
      *   Hoss Mack (Sheriff/Captain)
      *   Anthony Lowery
      *   Murray Lawrence Jr. (Bubba)
      *   Dean McGowan
      *   David Whetstone (Prosecutor)
      *   Robert Wilters (Judge)
      *   Brandon Hastings
      *   Jarius McNeal
      *   Dr. Paul McGarry
      *   Tony Fuqua
      *   Baldwin County Sheriff’s Office (BCSO)
