  po-po-hoss-mack-ccuo:
    refined_source: 35555c95aadbc4335ba3abdded4c05729e689534bd9f768707e2ee70f5f7c519
    brief: |-
      THE CONFLICT:
      - In 2003/2004, Murray “Bubba” Lawrence Jr. was convicted of the murder of Brandon Hastings.
      - The prosecution—led by District Attorney David Whetstone, Judge Robert Wilters, and Sheriff Hoss Mack—pursued a theory of death by gunshot despite a Mississippi autopsy by Dr. Paul McGarry indicating death by asphyxiation/strangulation.
      - The investigation produced no physical evidence, including fingerprints, weapons, blood, or cell phone records connecting Lawrence to the crime.
      - The conviction relied on the testimony of Jarius McNeal, who implicated Lawrence to avoid a death sentence.
      - Lawrence was sentenced to life in prison without the possibility of parole.

      THE DISCOVERY:
      - Historical records reveal that on May 17, 2004, the Alabama Department of Forensic Sciences sent a letter to David Whetstone containing autopsy, forensic biology, and toxicology reports.
      - This specific correspondence was CC'ed to both Hoss Mack and his father.
      - The documents within this correspondence contained the exculpatory evidence regarding the cause of death that was withheld from the defense.

      THE PIVOT:
      - Article 2 serves as the smoking gun because it provides the specific date (May 17, 2004) and the mechanism (the CC'ed letter) that proves Mack and the court had actual, documented knowledge of the exculpatory autopsy findings during the trial. This moves the case from "investigative failure" to "intentional suppression of evidence."

      KEY ENTITIES:
      - Hoss Mack (Sheriff, Baldwin County)
      - Murray “Bubba” Lawrence Jr. (Convicted individual)
      - David Whetstone (District Attorney)
      - Robert Wilters (Judge)
      - Anthony Lowery (Investigator)
      - Dean McGowan (Investigator)
      - Jarius McNeal (Suspect/Witness)
      - Brandon Hastings (Victim)
      - Dr. Paul McGarry (Forensic Pathologist)
      - Tony Fuqua (Officer)
      - Andre Reid (Officer)
      - Jon Grey (Public Relations/Ventures 68)
