      *   Catalyst used intimidation and bullying to attack newly elected Mayor Karin Wilson.
      *   Pittman took $750,000 of BP money and maintained municipal contracts with Fairhope while serving as State Senator.

      THE DISCOVERY:
      *   Article 2 reveals that the corruption and political manipulation (Catalyst) originated in Baldwin County politics before the Fairhope municipal issues were central.
      *   Catalyst's initial failure to remove Mayor Wilson in Fairhope led them to push Chris Elliott into the State Senate race.
      *   Catalyst's strategy was to control local power via coordinated slates of candidates.

      THE PIVOT:
      *   Article 2 establishes Catalyst as the underlying, systemic source of political control and corruption in the region.
      *   Article 1 shows how Catalyst (via Jack Burrell) and local council members (Robert Brown) weaponized municipal government (Fairhope City Council/Airport) to obstruct the Mayor and seize control of the budget and financial committees, mirroring the manipulative power plays described in Article 2.

