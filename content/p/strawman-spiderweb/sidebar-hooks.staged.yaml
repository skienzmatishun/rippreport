    brief: "THE CONFLICT: \nCouncilman Kevin Boone (also referred to as \"LLC Boone\") and the \"Catalyst\" group are accused of operating a \"spidergraph\" of corruption within Baldwin County. This involves the \"Strawman\" case and a lawsuit filed by the Baldwin County Property Association (Daphne’s Bellaton), which alleges that defendants DeLaney and Burke utilized an \"intricate web of multiple concentric layers of companies\" to conceal interrelationships and insulate themselves from liability. Boone is linked via this web to Scott Boone (Catalyst frontman), Tucker Dorsey (\"The Strawman\"), John Avant, and Judge Norton. The conflict escalated during a council meeting when Boone reacted with hostility to mentions of the \"Strawman\" series and the Alabama Judiciary.\n\nTHE DISCOVERY: \nAs of June 6, 2020, Chris Warner was established as a professional author and \"Professor of Tailgating\" in the Fairhope/Baldwin County area. His body of work includes documenting significant, \"untold\" financial and corporate scandals, most notably \"The Wagon to Disaster,\" which chronicled the HealthSouth fraud involving former CFO Aaron Beam.\n\nTHE PIVOT: \nArticle 2 provides the historical and investigative context for the \"Strawman\" case; it establishes that the current \"spiderweb\" of corporate and judicial concealment being uncovered in Baldwin County follows the same pattern of systemic, large-scale institutional fraud that Warner has historically documented and exposed.\n\nKEY ENTITIES:\n- Kevin Boone (Councilman / \"LLC Boone\")\n- Scott Boone (Catalyst frontman)\n- Tucker Dorsey (\"The Strawman\")\n- John Avant (Developer/Political figure)\n- Judge Norton (Alabama Judiciary)\n- DeLaney and Burke (Principal actors/Defendants)\n- Nell “Boots” Bass and Karen Bass (Researchers)\n- Chris Warner (Author/Professor)\n- Aaron Beam (Former HealthSouth CFO)\n- McSharry (Subject of previous investigation)\n- Baldwin County Property Association (Daphne’s Bellaton)\n- Catalyst (Political/Council group)"
