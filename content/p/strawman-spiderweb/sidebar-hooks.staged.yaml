    brief: |-
      THE CONFLICT:
      - Main article: “Strawman Spiderweb” / “Strawman” series.
      - Many people watched the bully council in their last meeting where Councilman Boone flipped out at the end.
      - What many people did not know was why.
      - Watch the video again: when the speaker mentions the “Strawman” series in Lagniappe, Boone realized the speaker had read some of the latest information submitted to the Alabama Judiciary related to the case.
      - Boone panicked and did not know what the speaker may say next.
      - Boone realized the subject had switched from McSharry to “Strawman” and started yelling to adjourn the meeting.
      - The “Strawman” case demonstrates the depth of corruption; the spider graph links the players.
      - Some of the links are on a Lagniappe Paywall.
      - The latest article outlines a new lawsuit filed by the Baldwin County Property Association, Daphne’s Bellaton.
      - The complaint alleges the defendants, named and unnamed, form an integral part of an intricate web of multiple concentric layers of companies that are intermingled around and intended, among other things, to conceal the interrelationships among and between, and to insulate from liability, the defendants, DeLaney and Burke as the principal actors who have ultimately owned, controlled, managed or directed the operations and financial transactions of these defendants and non-defendants.
      - Look at the spider graph: Mr. Boone, aka LLC Boone, linked to Scott Boone, his son and Catalyst front man, are connected to Tucker Dorsey, The Strawman, John Avant and the Judge.
      - Boone has already been linked to LLCs that show a conflict of interest, yet he voted as a councilman to assist the developers and John Avant, behind his constituents back.
      - The CATALYST council turned a blind eye to Boone’s conflicts of interest and now we see his connections to the “Strawman” case.
      - Boone has lied to his constituents from the day he was elected; his loyalties lie with CATALYST.
      - Jump back to “Strawman” and the updated information submitted to the Alabama Judicial Inquiry Commission.
      - Best narrators of the deal and years of litigation: Phillip Bass’ wife, Nell “Boots” Bass, and their daughter, Karen Bass.
      - Outright corruption involving lawyers, judges, County commissioner developers and third rate con men.
      - Do you see the District Attorney or Sheriff doing anything? Hell no. These people are their friends.

      THE DISCOVERY:
      - Widget article: “Paradise Lost II” by Chris Warner, Special to the Ripp Report/Baldwin County Legal Eagle.
      - Article was published June 7, 2018; this was the original article.
      - Article 2 frames Baldwin County as Alabama’s Fastest-Growing Coastal Community.
      - Baldwin has four of Alabama’s eight fastest growing cities.
      - Article 2 defines quality of life as the gap between what you want and what you have.
      - The lofty goal of government is to close that gap so citizens can enjoy an enhanced living environment.
      - Planning is the prudent managing of physical and human growth; particularly density; there are direct, positive correlations between quality of life and the number of people living in a place, in favor of smaller, less dense towns.
      - Slower-paced communities sought for their schools, low property taxes and cultural amenities can be overwhelmed by crowded schools, sprawl and the loss of a valued former sense of belonging.
      - Unfettered growth can bring change; managing how quickly a place grows helps maintain quality of life and gives it a chance to grow into a healthy older place.
      - One problem inherent with providing effective planning for Baldwin County is that new developments, like neighborhoods and subdivisions, built outside the city limits of towns and cities, are not subject to the authority of the local planning departments engaged in managing growth.
      - Since they are located outside city lines, developers need only adhere to county building codes and restrictions, which are limited, given the County’s traditional, agrarian past, and its pro-business, laissez-faire approach to planning, land use, zoning and growth management.
      - Local planning jurisdictions should be given authority over new developments contiguous with their planning district within a reasonable sphere of influence ranging up to a few miles, as the city is still charged with the responsibility of providing law enforcement, education, health care and other services under its normal provided, taxpayer-funded umbrella.
      - As Baldwin County heads into another summer election season, it does so grappling with a huge planning and growth management problem.
      - The City of Fairhope has recently been sued by the State of Alabama for failing to properly manage its sewerage system, resulting in numerous costly spills.
      - Orange Beach is approaching its physical limits in terms of new development, as the city has little if any remaining developable property; and a road system already encumbered.
      - Citizens must come together, take inventory, voice concerns and chart new expectations for managing future growth in Baldwin County.
      - If current building trends continue to pace growing demand without planning considerations and needed restraint, the coastal area once known for charm, relaxation and recreation could well become a bedroom and vacation nightmare.

