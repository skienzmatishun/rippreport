  taxes-tolls-and-schools:
    brief: |-
      THE CONFLICT:
      *   Bridge project (marine/automobile traffic) cost billions.
      *   Governor Poison Ivy and Junior Senator Elliott were involved in the bridge and tax discussions.
      *   The Rebuild Alabama Act included an indexed 10-cent fuel tax hike.
      *   A 1% tax was passed in Baldwin County without a vote.
      *   A proposed $3 million tax was for Fairhope and Spanish Fort (to be decided by referendum).
      *   The gas tax was initially a deal struck on Goat Hill, pledged by Governor Poison Ivy candidates.

      THE DISCOVERY:
      *   Baldwin County was facing rising costs due to the Bridge project and tax hikes.
      *   Junior Senator Elliott, "The Tax Man," failed to recall pre-election pledges regarding taxes.
      *   Local schools in Baldwin County were identified as starving for money and classroom space.

      THE PIVOT:
      *   The ongoing local financial and infrastructural issues (tolls, taxes, schools) identified in the historical context (Article 2) necessitate informed local reporting.
      *   Lagniappe is currently the only print media publication in Baldwin County, providing coverage of these critical local political issues.
      *   Lagniappe recently implemented a paywall ($21 cents/day or $1.50/week), making its accessible reporting crucial for readers needing to understand the local context established in Article 2.

      KEY ENTITIES:
      *   Lagniappe (Publication)
      *   Baldwin County
