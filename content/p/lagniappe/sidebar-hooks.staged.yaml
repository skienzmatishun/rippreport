  catalyst-meets-social-media:
    brief: |-
      THE CONFLICT:
      - Catalyst, via Widget Article, described as a group of so-called “Christian Republicans,” allegedly hijacked Baldwin County Republican politics.
      - Widget Article states Catalyst worked in the shadows; today social media exposed their goals as well as players.
      - Catalyst internal political conflict: “number one lying bee” Elliott exposed; Elliott’s performance in State Senate Seat 32 race garnered only 700 vote margin against David Northcutt; Elliott now running for third time for State Senate Seat 32 against a Democrat.
      - Sheriff Hoss Mack and Eddie Tyler, present superintendent of schools, married to Elliott, now seeking divorce.
      - Daphne: Catalyst Mayor Haygood, charter member, talked councilman Joe Davis into running against John Lake; Davis won because over 3500 people did not turn a ballot over, very suspicious; Haygood and Davis planning to fill vacant council seat with another Catalyst bee, Jonathan Armstrong.
      - Jonathan Armstrong alleged flip-flop: from supporting Billie Jo and hating Tucker Dorsey and wanting to fight Tucker, to becoming their main pit bull because they promised to give him Joe Davis’ seat on Daphne City Council if he played ball; Catalyst spy info.
      - Mayor Haygood reportedly instructed city worker to destroy fiber optic cable feeds throughout Daphne; council pissed off; ATT may sue city for damages.
      - Million dollar swimming pool: Mayor and planning and zoning say hands tied, not so, sitting on hands.

      THE DISCOVERY:
      - Widget Article showed Baldwin County citizens finally beginning to understand dangers of a group like Catalyst.
      - Widget Article showed Baldwin County Republican Party coming to terms that Baldwin County had been hijacked by a few so-called “Christian Republicans” called CATALYST.
      - Widget Article: In the past CATALYST worked in shadows; today social media exposed their goals as well as players.
      - Widget Article: Catalyst reeling after getting stung by the People’s Choice; lost queen bee Thomasson and most worthless bee Dorsey; true colors of their number one lying bee, Elliott, exposed to public; his less than stellar performance garnered him only 700 vote margin against better man David Northcutt.

      THE PIVOT:
      - Widget Article is older/background context for Main Article: frames Catalyst/social media political exposure before Main Article’s Lagniappe/Ripp Report paywall discussion.
      - Main Article: Ripp Report endorsement not advertisement; Lagniappe only publication not considered coupon paper; Mobile paper little to offer with more fluff stories than real investigative reporting; Sunday Paper is $3.00, over $150.00 a year just for Sunday.
      - Main Article: Lagniappe recently set up paywall for online subscribers; trouble that all those sharing and reading posts online now had to pay or get paper copy; Ripp Report shares many articles from Lagniappe and since paywall in effect, many readers complained they could not link onto article.
      - Main Article: At first Ripp Report did not understand logic; Lagniappe had hundreds, if not thousands, of shares through the years on Ripp Report and Baldwin County Legal Eagle sites alone.
      - Main Article: Then Ripp Report read recent article by Publisher that made things clearer; Lagniappe worth price; if choose not to pay for internet availability, still option of free weekly paper copy from multiple sites.
      - Main Article: Publisher quote: One of new challenges launching paywall on website; wasn’t popular decision, but where all newspapers going and necessary to continue growing and hopefully to do much more to inform and entertain community; Yes, repeatedly heard from pissed off, but it’s only 21 cents a day, $1.50 a week; probably aren’t many places you can walk in and buy bottle of Diet Coke for $1.50, much less enjoy it as long as you can all information available on these electronic pages each week.
      - Main Article: Baldwin County has no print media except Lagniappe, PLEASE, and no one is paying me to say this, read Lagniappe if you want to know what is happening.
      - Main Article: Baldwin County and Fairhope have four blog sites that report political issues; please pay attention and read facts, before, you are misled by gossip, half truths or outright fiction.

      THE PIVOT / WHY ARTICLE 2 IS THE SMOKING GUN FOR ARTICLE 1:
      - Article 2 provides background on Catalyst and social media’s exposure of political goals and players in Baldwin County.
      - Article 1 references Baldwin County political context through Lagniappe, Ripp Report, Baldwin County Legal Eagle, Fairhope, Baldwin County blog sites.
      - Article 2 is key context for Article 1 because it frames the political environment that may connect to Lagniappe’s political coverage and Ripp Report’s sharing/paywall complaints.

