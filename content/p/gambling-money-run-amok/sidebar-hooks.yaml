hooks:
  by-appointment-only:
    brief: 'THE CONFLICT:

      * Rep. Juandalynn Givens (AL House District 60) is being attacked in radio ads
      for her re-election campaign by a political group tied to Birmingham Mayor Randall
      Woodfin.

      * Givens alleges Mayor Woodfin is supporting lesser-known opponent Deborah Lumpkin
      to replace Givens with someone "who won''t point fingers" at city leadership.

      * Givens criticizes the ads as potentially featuring disguised voices (possibly
      Lumpkin or her mother) and raises concerns about Lumpkin''s mother’s 2010 securities
      fraud conviction.

      * Brandon Mosley details ethics filing discrepancies involving Joshua Coleman,
      a Woodfin aide, who allegedly failed to properly disclose his 20% ownership
      in Iron City Communications—a consulting firm that received payments from Givens’
      opponent.


      THE DISCOVERY:

      * The second article (Widget) reveals that the American Conservative Fund is
      allegedly linked to DraftKings and is funding glossy mailers and ads for pro-gambling
      candidates across Alabama, specifically targeting races like House District
      50 (Givan’s district area context, though noted as HD50 in summary) and Baldwin
      County.

      * The panel alleges gambling interests are "putting a thumb on the scale" in
      primary elections and that this funding is part of a broader "dark money" influence
      network.

      * The widget connects this to the same network described in Article 1: "out-of-state
      gambling interests (e.g., DraftKings) funneling funds through PACs like SVB
      PAC to influence Alabama legislative races."

      * It explicitly names Steve Raby as a key operator moving money for Republican
      candidates (referenced again in Article 1''s context of SVB PAC operations).


      THE PIVOT:

      * The Widget article provides the concrete evidence of "dark money" flows described
      abstractly in Article 1.

      * While Article 1 mentions SVB PAC and DraftKings as potential funding sources
      for political influence, Article 2 identifies the American Conservative Fund
      (ACF) as the specific entity linked to DraftKings that is actively funding ads
      against incumbents like Givan’s rivals or pro-gambling candidates in Alabama
      races.

      * The "smoking gun" is the direct link between DraftKings/American Conservative
      Fund money and the specific political attacks/campaigns mentioned in Article
      1, confirming the suspicion of undisclosed gambling interest influence that
      Givens alleges against the Woodfin-aligned group.


      KEY ENTITIES:

      * Rep. Juandalynn Givens (AL House District 60)

      * Birmingham Mayor Randall Woodfin

