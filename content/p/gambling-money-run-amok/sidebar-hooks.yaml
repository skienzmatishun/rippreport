  fire-albritton:
    brief: 'I have enough to finalize the Bridge Brief now.


      THE CONFLICT:

      - Rep. Juandalynn Givan (D-Birmingham), representing House District 60, was
      attacked in a 2025 campaign against Birmingham Mayor Randall Woodfin — she lost
      that race and is now facing a primary challenge from opponent Alicia Escott
      Lumpkin.

      - During the 2025 run for mayor, Woodfin’s political team (Iron City Communications)
      managed campaigns against his adversaries, including Givan. Three of Iron City’s
      five principals were compensated city of Birmingham employees — including Joshua
      Coleman, a candidate for Alabama Democratic Party Chair. Coleman and another
      principal, Ushe Bean, failed to disclose their 20% ownership of Iron City in
      their 2024 Statements of Economic Interests.

      - On the podcast (Heart of Dixie Podcast, broadcast April/May 2026), Givan alleged
      that campaign ads against her were funded by a political group tied to Woodfin,
      and that those ads may have used disguised voices — possibly Lumpkin or Lumpkin’s
      mother, who was convicted in 2010 for securities fraud.

      - Givan also alleged "dark money" from out-of-state gambling interests (e.g.,
      DraftKings) flowing through PACs like SVB PAC to fund her Democratic primary
      opponent. The Sports Betting Alliance — a Virginia-based group representing
      Bet 365, BetMGM, DraftKings, Fanatics, and FanDuel — donated more than $1.25
      million to SVB PAC since Jan 2025; SVB PAC then gave out $718,500 to state candidates
      (top recipients: Sen. Jay Hovey $50k, Sen. Chris Elliott $40k, Gov. candidate
      Doug Harwell $45k, Rep. James Lomax $30k).

      - Steve Raby — described by Givan as "The Speaker’s lobbyist" — runs the North
      Alabama PAC and his most important client is Republican House Speaker Nathaniel
      Ledbetter (R-Rainsville). His nephew Bryant Raby also runs a PAC that received
      gambling funds.

      - Givan claimed she raised only $51,000 while Lumpkin raised $186,136.38 in
      the 2026 Democratic primary (held May 19, 2026).


      THE DISCOVERY:

      - Article 2 ("FIRE ALBRITTON") revealed that Tom Albritton — Executive Director
      of the Alabama Ethics Commission — is the central figure behind the Mabel Amos
      Memorial Trust scandal. The trust was originally worth $500,000; ballooned to
      $4.1 million in 2011 after oil was discovered on the trust land in 2010, and
      is now valued at approximately $8.2 million with ~$100 million produced from
      the oil well.

      - Albritton and two other trustees awarded Albritton’s own children over $130,000–$135,000
      in scholarships — despite trust stipulations that funds were for students with
      financial need. Regions Bank (trustee) took ~$1 million in inflated service
      fees while administrative fees jumped from under $8,000 to over $90,000/year.
      Approximately $3.2 million between 2013 and 2021 went to anonymous recipients;
      the full list of scholarship recipients has never been disclosed.

      - Albritton’s salary was raised to a reported $210,000+ annually (from ~$25,000),
      despite the scandal. He is described in Article 2 as "the poster ''Boy'' of
      corruption in Alabama" and "a fraud" who should face criminal charges and disbarment.

      - Kent Davis — ADVA commissioner and retired U.S. Navy Admiral — resigned effective
      Dec 31, 2024 after Gov. Kay Ivey called for his "immediate removal." Davis filed
      an ethics complaint against ADMH Commissioner Kim Boswell in August 2024 (alleging
      Boswell blocked $7M in ARPA funds to VA); the Ethics Commission later dismissed
      it as not constituting a violation. Ivey’s stated reasons for firing Davis included
      the "frivolous" ethics complaint, ARPA mishandling, breach of resignation agreement,
      and loss of confidence.


      THE PIVOT:

      - The smoking-gun connection is that Tom Albritton — the very person who should
      investigate and prosecute ethics violations in Alabama — is himself accused
      of massive self-dealing from the Mabel Amos Trust while simultaneously dismissing
      the Ripp Report’s ethics complaints (including those against him).

      - Article 1 documents gambling money (SVB PAC, Sports Betting Alliance) flowing
      through PACs like North Alabama PAC (run by Steve Raby) to fund campaigns in
      races where political accountability matters — including Givan’s primary. Article
      2 reveals that the ethics system charged with policing exactly these kinds of
      "dark money" and self-dealing behaviors is itself compromised: Albritton, who
      benefited from a $8.2M trust while earning over $210k salary, dismissed complaints
      against politicians (including Matt Simpson-related matters) while his own children
      received $130k+ in scholarship fraud.

      - The pivot: Article 2 makes the ethics system itself suspect — meaning every
      accusation of "dark money" or PAC influence in Article 1 is being investigated
      (or not investigated) by a corrupt and self-interested body. Givan’s allegation
      that gambling money is flooding her primary campaign is more credible — and
      harder to dismiss — because the very institution meant to police such misconduct
      (Ethics Commission led by Albritton) has been exposed as complicit.

      - Furthermore, Ivey used "extreme Executive Power" to fire Davis — a respected,
      integrity-honored figure who was cleared by his own board — while protecting
      Albritton. This shows the Governor and her political network actively shielding
      ethics violators (Albritton) while punishing those who speak up (Davis), reinforcing
      Givan’s theme of holding power accountable.


      KEY ENTITIES:

      - Juandalynn Givan / Wanda Lynn Givens, Rep., Alabama House District 60

      - Randall Woodfin, Birmingham Mayor

      - Alicia Escott Lumpkin, Givan’s primary opponent

      - Steve Raby, political consultant, North Alabama PAC runner

      - Bryant Raby, Raby’s nephew, PAC operator

      - Nathaniel Ledbetter, Republican Speaker of the House (R-Rainsville), Raby’s
      top client

      - SVB PAC (Sports Betting & Gambling)

      - Sports Betting Alliance (Virginia-based; represents Bet 365, BetMGM, DraftKings,
      Fanatics, FanDuel)

      - North Alabama PAC

      - Joshua Coleman, Iron City Communications principal, Birmingham city employee,
      Democratic Party Chair candidate

      - Ushe Bean, Iron City Communications principal, Birmingham city employee

      - Tom Albritton, Executive Director of Alabama Ethics Commission; trustee of
      Mabel Amos Memorial Trust

      - Kent Davis, ADVA Commissioner, retired U.S. Navy Admiral

      - Kay Ivey, Governor of Alabama

      - Kim Boswell, ADMH Commissioner

      - Regions Bank, trust administrator for Mabel Amos Memorial Trust

      - Mabel Amos (died; served as AL Secretary of State 1967–1975; established the
      Memorial Trust in 1993)

      - Matt Simpson, State Rep. (R-Daphne), Ethics and Finance Committee chair, rewriting
      ethics laws'
