    brief: 'I have enough raw factual detail from the two articles and confirmed external
      reporting to produce the Bridge Brief. Here it is:


      ---


      **THE CONFLICT:**


      - April 2003, Brandon Hastings was killed in Baldwin County, Alabama; his body
      had signs of decomposition/trauma

      - Murray "Bubba" Lawrence Jr. was convicted in 2005 of first-degree murder for
      the Hastings killing and sentenced to life without parole

      - Conviction rested primarily on the testimony of co-defendant Jarius McNeil
      (who took a plea deal); no physical evidence, weapon, forensic match, or confession
      linked Lawrence

      - Defense attorney Willie Huntley called zero witnesses after prosecution rested

      - Then Sheriff Huey "Hoss" Mack led the original BCSO investigation; DA David
      Whitstone prosecuted; Judge Robert Wilters presided

      - A second autopsy ordered by Whitstone and signed by Wilters was suppressed:
      it found **no bullet wounds to the head** and could not determine cause of death—contradicting
      the shooting theory

      - That suppression constitutes a likely **Brady violation**; Lawrence has spent
      over two decades in prison (20+ years as of 2025)

      - In June 2025, the Alabama Supreme Court denied a writ of certiorari without
      opinion; a Rule 32 post-conviction petition filed by Paul Ripp and Nancy Koerner
      ultimately fell through


      **THE DISCOVERY:**


      - **Chris Elliott is being targeted as Director of Gaming for the State of Alabama**—the
      second article reveals this was his "secret ambition, no longer a secret"

      - SVB PAC (Montgomery) donated ~$718,500 to state candidates since Jan 2025,
      receiving >$1.25M from Sports Betting Alliance (Bet365, BetMGM, DraftKings,
      Fanatics, FanDuel); Elliott received **$40,000**, making him a top-five recipient

      - American Conservative Fund PAC (Arlington, VA) sent mailers for Lomax; that
      fund received $500k from Win for America, fully funded by **$2M from DK Crown
      Holdings** (the DraftKings entity)

      - Elliott "keeps in the closet" his solar farm and gambling interests as political
      leverage

      - Baldwin County judge Kristi Hagood was installed with backing from GOB-tier
      figures: Wilters and Mack were her backers/architects/recruiters; **consultants
      Jon Gray and Scott Boone were paid to represent her despite knowledge of her
      baggage (the Lawrence case)**—they "cashed their checks" instead of doing candidate
      vetting

      - All four—Lowery, Wilters, Mack, Hagood—are named as complicit in the wrongful
