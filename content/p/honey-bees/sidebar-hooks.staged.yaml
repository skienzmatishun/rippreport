  transparency:
    brief: "THE CONFLICT: \n- Over the prior three consecutive years leading up to September 2019, the Fairhope City Council (specifically Catalyst candidates/members Burrell, Boone, and Brown) failed to approve a single Fairhope City Budget on time, avoiding the open budget process and violating State Statute.\n- On September 2, 2019, Mayor Karin Wilson released a report detailing the first-ever self-sustaining 2020 City Budget in Fairhope history (requiring zero utility profits to balance, separating tax dollars from utility rate fees), while imploring the Council to pass it by the October 1 deadline through open meetings.\n\nTHE DISCOVERY: \n- Article 2 (September 2, 2019) revealed a systemic, multi-year pattern of fiscal obstruction, lack of transparency, and accountability failures by the Fairhope City Council regarding city finances and budget deadlines.\n- It exposed the Council's opposition to the Mayor's transparent, self-sustaining financial model which threatened the status quo \"good ole boy\" operations.\n\nTHE PIVOT: \n- Article 2 serves as the smoking gun because the historical budget obstruction and lack of financial transparency documented in 2019 directly set the stage for the Council's later unauthorized and secretive financial actions in 2020 (such as pushing through an unvetted $2.6 million property purchase, approving $9,000 in closing costs without public participation, and hiding behind questionable appraisals). It shows that the \"three bees'\" current fiscal recklessness and defiance of public input are a direct continuation of their established, anti-transparent playbook from previous years.\n\nKEY ENTITIES: \n- Burrell (Council President / Council Member)\n- Boone (Council Member)\n- Brown (Council Member)\n- Karin Wilson (Mayor of Fairhope)"
    llm_text: For three straight years, Council members Burrell, Boone, and Brown broke state law by dodging budget deadlines to protect their opaque status quo. Read our smoking gun report on how this exact fiscal obstruction paved the way for Mayor Karin Wilson's historic 2020 self-sustaining budget fight.
    text: For three straight years, Council members Burrell, Boone, and Brown broke state law by dodging budget deadlines to protect their opaque status quo. Read our smoking gun report on how this exact fiscal obstruction paved the way for Mayor Karin Wilson's historic 2020 self-sustaining budget fight.
