      THE CONFLICT:
      *   Fairhope City Council, including members Burrell, Boone, and Brown (the three B's), voted 3 to 2 to purchase 2.6 million in recreation property on Hwy. 13.
      *   This vote occurred after a May 29th council meeting where the Mayor begged the council to reconsider the purchase and a conservation easement involving 102 acres (valued at 20 million).
      *   Fairhope paid 8.25 million in a lawsuit settlement plus 3 million in attorney fees regarding property.
      *   The Council was later found guilty in Federal Court for violating the Constitution and the right of free speech, particularly regarding the denial of public comment on the recreation property.

      THE DISCOVERY:
      *   The Widget Article revealed the 3-to-2 vote by Burrell, Boone, and Brown to purchase the 2.6 million recreation property.
      *   The Widget Article also highlighted potential conflicts of interest, specifically Councilman Robert Brown pushing past the Eastern Shore Art Center (ESAC) contract without providing documentation, linked to his business partner Cliff Pittman.
      *   The Widget Article identified the council's pattern of "quid quo pro" behavior, referencing the 102-acre triangle property issue.

      THE PIVOT:
      *   The Widget Article established the initial, documented lie—that Burrell claimed the appraisal was only for appraisal, not purchase—and framed the council's actions as a pattern of exploiting community weakness ("something for something").
      *   The Main Article confirms the follow-through (September resolution/vote for $9 million closing costs), details the constitutional violation, and shows the council continuing this pattern (e.g., denying public comment, threatening the Mayor who was representing citizens).

