  baldwin-county-sewer-regulation-a-litmus-test:
    brief: |-
      THE CONFLICT:
      - September 11, 2001: deaths; Article 2 says “Remember those who lost their lives 18 years ago, September 11 2001, NEVER FORGET.”
      - Baldwin County consumer conflict: $6.00 toll defeated by poll; poll numbers rose until they terrified every elected official in Baldwin County; petition reached 50,000 mark; elected officials hit their knees.
      - Baldwin County sewer conflict: Mr. Richard Dayton of GlenLakes subdivision in Foley leading charge; BCSS rates totally unregulated; quote: if BCSS charged $154.50/month tomorrow, nothing could be done and sewage would be turned off if not paid; BCSS monopoly.
      - 19,000 homes in Baldwin County serviced by BCSS; BCSS privately owned; no limit on charges; if not pay, sewage turned off without regard to health; must band together; challenge through elected officials; County Commissioners, City Council Members, State Senators, State Representatives must take leadership; Shelby County elected officials began fight with legislation; Baldwin County can do same; protect voters not monopoly.
      - Fairhope conflict: May 29 council meeting; Mayor of Fairhope begged council to reconsider two issues; conservation easement triangle property, 102 acres worth $20 million, council willing give away while proposing buy 2.6 million on Hwy. 13; Fairhope paid $8.25 million in lawsuit plus $3 million attorney fees as SETTLEMENT; Burrell and Boone supported lawsuit they LOST.
      - Fairhope conflict: second issue appraisal for recreation land on Hwy. 13; at May meeting and work session, Mr. Burrell said it was for appraisal only, not purchase; council proceeded with appraisal, deaf to comment; failed on conservation easement, but be prepared to try again to give away city property.
      - Fairhope conflict: September council, 3 B’s, without public participation or plan to pay for 2.6 million in property, passed resolution to purchase property, despite questionable appraisal; ultimate lie; B’s say discussed between council members and Rec. board; citizens denied public comment.
      - Fairhope conflict: council found guilty in Federal Court for violating Constitution of the United States, right of free speech.
      - Fairhope conflict: last week in city council work session, Mayor discussing free family insurance, around 17,000 thousand dollars for each part time councilman, no city employees have such insurance; Council President Burrell, most prolific honey bee, threatened Mayor with arrest, if she did not “shut up”; Mayor was representing citizens.
      - Fairhope conflict: council lost in Federal Court, threatened to throw Mayor in jail, for representing citizens, and denied citizens comment on recreation property; council passed law preventing anyone from sleeping in their car and forbid feeding the geese.
      - Fairhope conflict: tonight the three B’s going to vote to approve closing costs, around 9,000 thousand dollars, for 2.6 million in property; B’s, all white, want Hwy. 13 property while community voiced desire for twin beech property close to black community, but that is not where the honey is; tonight the B’s going to sting Fairhope and do not give a damn what you think or your constitutional right to free speech; they want the honey; follow the money.

      THE DISCOVERY:
      - Article 2, older/background context, showed Baldwin County had a “NEW” consumer issue: sewer regulation.
      - Article 2 stated Baldwin County sewer regulation affects every citizen.
      - Article 2: Baldwin County Sewer Service (BCSS) monopoly; 19,000 homes serviced; unregulated fees; no limit; $154.50/month hypothetical; if not pay, sewage turned off.
      - Article 2: Unregulated sewage fees allow BCSS to victimize customers; must challenge through elected officials.
      - Article 2: Elected Officials in Shelby County began fight to overturn unregulated sewage fees with legislation aimed at protecting customers by regulating prices.
      - Article 2: Baldwin County fastest growing County in Alabama; unregulated sewer system consumer time bomb.
      - Article 2: Petition would be driving force in convincing County Commission and elected officials time has come for regulations; petition would be litmus test for next County Commission election.
      - Article 2: Ripp Report supports Mr. Dayton’s efforts to regulate BC$, a monopoly holding 19,000 customers hostage to an unregulated sewer system; Baldwin County is the only county that has no regulations at all; BC$ has effectively influenced and lobbied elected officials to look the other way; Straw Man article: Former County Commissioner, Tucker Dorsey, the straw man, was an agent of BC$ and held the office of commissioner at the same time; present County Attorney is a lobbyist for BC$; think about that.

      THE PIVOT:
      - Article 2 is older than Article 1; frame it as background/historical context.
      - Article 2’s sewer regulation/litmus test and $6.00 toll defeat via 50,000 petition mark are prior consumer backlash context.
      - Article 1’s Fairhope Council conflict shows later/current elected official conduct, including Federal Court free speech finding, Mayor threatened with arrest, public comment denial, property purchase.
      - Article 2 is smoking gun/key context because it documents unregulated monopoly/BCSS and citizen challenge through elected officials; Article 1 shows Fairhope/council actions and same property/consumer themes.
      - Article 2 supports pattern: elected officials influenced/looked the other way, citizens petitioned, $6 toll defeated, then sewer regulation remains issue; Article 1 shows Fairhope council ignoring public comment and violating free speech.

