  fairhope-council-shows-its-colors:
    brief: |-
      THE CONFLICT:
      *   800-plus Fairhope citizens signed a valid petition (based on the Alabama Constitution threshold: ten percent of most recent local election voters).
      *   This triggered a 90-day period for a special election for a new form of government (Council-Manager).
      *   Initial election date scheduled for October 2nd.
      *   Mayor Karin Wilson later announced the October 2nd election was delayed until the general election on November 6th.
      *   The City Council failed to accept a mayoral opinion offered on June 26, 2018 (based on a July 2018 statute revision).

      THE DISCOVERY:
      *   The current political climate in Fairhope is driven by a successful, citizen-initiated petition process that circumvented the City Council.
      *   The Council's actions were perceived as attempts to derail citizen power, not solely the fault of the council.

      THE PIVOT:
      *   The citizen-led controversy (Fly Creek Apartments, K1 Center, Tuberville Gully, etc.) mentioned in Article 1 is rooted in the fundamental distrust of the City Council established by the successful petition/recall efforts detailed in Article 2.
      *   Article 2 provides the historical context for the intense "blood sport" local politics referenced by the developer Matt Bowers in Article 1.

      KEY ENTITIES:
      *   Fairhope
      *   Matt Bowers (Property owner/developer)
      *   Councilman Conyers
      *   Karin Wilson (Mayor)
      *   Fly Creek Apartments
      *   K1 Center
      *   Tuberville Gully
      *   Fairhope Pier / Downtown Clock
      *   October 2nd / November 6th
      *   Alabama Constitution (Petition process)
    llm_text: 800 Fairhope citizens successfully triggered a special election for a Council-Manager government, bypassing the City Council. Discover how this citizen power—not just Councilman Conyers—fuels the intense local fights over Fly Creek and the K1 Center.
