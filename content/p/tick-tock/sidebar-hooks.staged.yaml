  russian-roulette-fairhope-style:
    brief: |-
      THE CONFLICT:
      - Past: Dyas Triangle lawsuit.
      - Mayor Tim Kant / Mayor Timmy and then council members Boone and Burrell, who were present, claimed they settled the lawsuit and purchase of land as a “WIN”.
      - Claim was an absolute lie and cost Fairhope $11.25 million.
      - Council pledged to sellers they were going to build a park; this was total B.S.; land remains vacant to this day.
      - Dyas lawsuit could have been settled for under $1 million; Mayor Timmy drove that price to $8.25 million and a $3 million legal bill from attorney O’Rear.
      - For almost 11 years, the city was engulfed in yet another lawsuit; present council was kicking the can down the road, never attempting to settle or resolve.
      - Lawsuit began before any present council or present mayor were in office; council made no attempt to advise citizens of Fairhope; no attempt to resolve.
      - Just like the Dyas lawsuit, this lawsuit could have been settled for 10% of what it may end up costing Fairhope.
      - Fairhope may be looking at $10 million in damages; property owner Mr. Buddy Breland will be able to proceed with the project if Fairhope loses.
      - Last week, the case took another step in court; former Mayor Kant took the stand; Kant admitted regulations that held up Mr. Breland were put in place, “after the fact”.

      THE DISCOVERY:
      - Article 2, written 2 years ago, revealed: Fairhope was playing Russian Roulette in court and the city council had not said a word to the general public.
      - The gun was cocked and aimed at the head of the Fairhope council, described as the absolute worst in 20 years, asleep at the wheel.
      - Tim Kant’s past bad deeds were catching up with Fairhope; first was the Dyas Triangle lawsuit.
      - Fairhope had just gone through a referendum vote to change government from at large to districts.
      - Present Catalyst Council said they represented everyone in town; not true; they are for special interest, Catalyst, and keeping citizens in the dark.
      - Tim Kant’s legacy lives on; bogus lawsuits cost the city millions while the council spins false narratives, never accepting responsibility.
      - Fairhope City Council has no leadership in fact; guilty of dereliction of duty; yet to deliver an approved budget; excuses vary; delay in budget and ignoring pending litigation is costing taxpayers; council is 110% responsible.

      THE PIVOT:
      - Article 2 is older than Article 1; frame it as background/historical context.
      - Article 2’s Dyas/Breland/Kant legal history is the smoking gun/key context for Article 1’s Fairhope City Council criticism, Matt Bowers clock/patio/hotel project, parking variances, tourist location/soul of downtown.
      - Article 1 content: Matt Bowers proposed hotel; patio/common area would be gone; clock regulated to corner, with limited exposure; Councilman Conyers correct to go back to 35 feet height restriction; reason it went to 40 feet was to accommodate Publix project; Matt Bowers project depends on City parking and needs variances; project would destroy tourist location and soul of downtown Fairhope.
      - Article 2 shows past council false claims, legal costs, inaction, dereliction, supporting Article 1’s call for City Council mitigation resolution to save clock/patio.

      KEY ENTITIES:
      - Tim Kant / Mayor Timmy
      - Jack Burrell
