  shovel-ready:
    brief: |-
      THE CONFLICT: Baldwin County Economic Development Alliance (BCEDA) CEO Lee Lawson discussed the Mega Site on Interstate 65 near Bay Minette, which was a finalist for the Toyota-Mazda complex, around 2019.
      THE DISCOVERY: BCEDA, funded by 14 municipalities, 5 Chambers of Commerce, and 8 Industrial Development Boards, promoted the Mega Site as "shovel ready" while simultaneously influencing Fairhope City Council to support the Fairhope Airport and K-1 School.
      THE PIVOT: Article 2 establishes a history of external development promotion (BCEDA) and political maneuvering (1% tax passed without a public vote by the late Baldwin County Commission/School Board, Tax man Chris Elliott) that precedes and informs the current controversy in Article 1, where developer Matt Bowers is attempting to change local zoning (35ft to 40ft height restriction) to build a hotel, overriding local opposition and prior City Council rejections (K-1 location).
      KEY ENTITIES: Matt Bowers, Matt Bowers Nissan, Fairhope City Council, Councilman Conyers, Lee Lawson, Baldwin County Economic Development Alliance (BCEDA), Fairhope Pier, Downtown Clock, Fly Creek Apartments, K1 Center, Tuberville Gully, Chris Elliott.
    llm_text: BCEDA CEO Lee Lawson promoted the "shovel ready" Mega Site near Bay Minette, influencing Fairhope City Council years ago. Now, developer Matt Bowers seeks a zoning change for a hotel, overriding local opposition to the K-1 location.
