    llm_text: Fairhope's Mayor Timmy Kant and council members Boone and Burrell claimed a Dyas Triangle lawsuit win, but it cost the city $11.25 million. They drove that settlement from under $1 million to $8.25 million, and now Matt Bowers' downtown clock and patio fight may hinge on that broken history.
