      *   Councilman Jack Burrell (Council President under Mayor Cant for 4 years) was involved in infrastructure decisions.
      *   Burrell approved sewer repairs to the main sewer plant but blocked funding for transmission lines.
      *   Burrell was accused of voting against sewer improvements while publicly taking credit for them.
      *   Burrell was involved in bid rigging at the airport and negotiating the purchase of 2.65 million dollar farmland, which was later leased for 9 thousand a year.
      *   The city surplus dropped from $1.2 million to a $1.7 million deficit after the farmland purchase.
      *   Burrell was running for re-election on August 25th.

      THE DISCOVERY:
      *   The Widget Article (older) reveals that Fairhope has done more than any municipality in Baldwin County/Eastern Shore to correct sewer deficiencies.
      *   The Widget Article confirms that the timeline for sewer infrastructure repairs since 2016 was publicly published by the Mayor.
      *   The Widget Article notes that complaints about Fly Creek and Publix were ignored by ADEM years ago.
      *   The Widget Article quotes Mayor Wilson stating the Council refused to fund engineering/technical department positions necessary for sewer improvement.

      THE PIVOT:
      *   The Widget Article establishes the historical context (2016 onwards) that the CATALYST Council actively blocked necessary sewer funding and professional staffing, making the subsequent accusations in the Main Article (Burrell lying, not supporting projects) verifiable historical facts, not just political attacks.
      *   It shows that the infrastructure decay is a result of the Council's refusal to act, not just individual malfeasance.

