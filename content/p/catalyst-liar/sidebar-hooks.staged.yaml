      - Burrell gave a news report on sewer improvements and took credit for accomplishments he voted against.
      - Burrell did not let voters know about his Police record listing two disturbing incidents involving juveniles.
      - Fairhope Airport bid rigging; Burrell voted for council full family insurance.
      - Burrell “negotiated” buying 2.65 million dollar farmland for future recreation; then leased out land for farming for 9 thousand a year. Only three council members, the three B’s, wanted to purchase.
      - Prior to purchase the city had a $1.2 million surplus; after the purchase the city went backwards to a $1.7 million deficit.
      - Burrell was number one on the list to vote out, Aug. 25; qualification for Fairhope municipal elections was July 7th to July 21st.

      THE DISCOVERY:
      - Second article is older/background context.
      - Sen Tripp Pittman theft of BP money to the tune of $750,000.
      - Sen Chris Elliott DUI charge.
      - Former Mayor Cant misuse of FEMA funds.
      - Councilman Robert Brown inside deal with the Fairhope Art Center.
      - Jack Burrell and his bid rigging.
      - All of the above escaped any responsibility; all used their office for personal gain and are affiliated with CATALYST.
      - McSharry case: sequence of events in favor of the offender and against the victim.
      - City prosecutor, Municipal Attorney will represent the victim in Municipal court; in the McSharry case the Municipal Attorney failed; his actions favored the bully and may result in litigation against the city.
      - McSharry was the watering hole for CATALYST, Attorneys, Judges and especially Councilman Burrell, who had a sandwich on stale bread named after him.
      - They ran like rats from McSharry’s after publicity exposed the CATALYST drinking headquarters.
      - Baldwin County Judicial System is broken; the good ole boys have dug themselves into a hole; citizens have no confidence in the system.
      - McSharry case is a perfect example of CATALYST JUSTICE.

      THE PIVOT:
      - Article 2 is older; frames CATALYST as the common denominator when it comes to political corruption.
      - CATALYST is planning to expand its stranglehold on Baldwin County, Fairhope and US Congress.
      - If they succeed, kiss whatever quality of life you may have goodbye.
      - Fairhope City Council should fire the city attorney, Marcus McDowell, but appointed him to cover their ass.
      - Council also appointed the municipal judge who is now the city’s largest developer — secured by a council vote.
      - Paula DiNardi is a victim of physical assault; the city attorney failed; he suggested the intoxication charge and the assault charge carry the “identical punishments.”
      - $10,000 in medical bills; DiNardi lost her job and suffered stress; she went to a restaurant/bar to relax and a bully assaults her, knocking her off a bar stool.
      - Could be any woman; Fairhope City Council turns a blind eye.
      - Ronan McSharry is a public nuisance, repeat offender of the law, bully of women and public drunk; he is a danger to the general public and if not stopped will continue to violate the law.
      - Article 2 is the smoking gun/key context for Article 1 because it establishes the CATALYST pattern before the Jack Burrell CATALYST LIAR allegations.

