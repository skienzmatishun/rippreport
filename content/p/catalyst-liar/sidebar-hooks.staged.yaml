      Article 2 revealed a pattern of "something for something" behavior by the CATALYST council faction. This included Councilman Robert Brown pushing the Eastern Shore Art Center (ESAC) contract without providing requested documentation and potential conflicts of interest involving business partner Cliff Pittman regarding development in "the gully."

      THE PIVOT:
      Article 2 serves as the historical proof of the "CATALYST" council's pattern of deceptive voting and fiscal mismanagement. This context validates the current allegations in Article 1 that Jack Burrell is systematically lying to voters—specifically by taking credit for infrastructure successes (sewer repairs) that he actually voted against, and by misrepresenting the financial impact of land purchases that moved the city from a $1.2 million surplus to a $1.7 million deficit.

