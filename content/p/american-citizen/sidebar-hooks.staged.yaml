      THE PIVOT:
      Article 2 established the specific procedural failure (McDowell's lapse in amending the charging document) and the political ties (Burrell's support of McSharry and the CATALYST council) that enabled the judicial system to favor the criminal, not the victim, providing the concrete context for the generalized critique of incompetence and corruption presented in Article 1.

