  marble-mouth:
    brief: |-
      THE CONFLICT: In November 2018, Paula Dinardi was assaulted and suffered physical injuries by Ronan McSharry at a restaurant/bar in Fairhope. Despite McSharry having an extensive police record, pleading guilty, and the incident being captured on video, the prosecution collapsed. Fairhope City Prosecutor Marcus McDowell dropped the ball, and Municipal Judge Snedeker—along with Judge Stankowski—dismissed the case on a technicality, claiming the charging document lacked the specific wording "Did cause physical injury to another" and was not amended within the one-year statute of limitations, even though both the City Attorney and Municipal Judge had medical evidence provided by Dinardi's attorney prior to her first court appearance. Furthermore, in January 2019, the American Legion abruptly canceled its agreement with Dinardi—who had successfully managed the American Legion Tiki Bar and drawn crowds of 1,000—amid political interference linked to Council President Burrell.

      THE DISCOVERY: The historical reporting and council background (printed November 11, 2016, and spanning a 3-year period) exposes a deeply entrenched, obstructionist municipal governing body led by Council President Burrell that operates as a strict block-voting unit ("CATALYST") in constant opposition to Mayor Wilson. It reveals a pattern of financial recklessness, political favoritism, and systemic incompetence that costs taxpayers millions—including a part-time council voting themselves a raise and a $17,000 full-family insurance package, botching a boutique hotel property purchase for $5,250 per square foot amid blackmail accusations from property owner Mr. Bowers, and spending $2.65 million on 114 acres only for Burrell to declare it "surplus" to lease out as farmland for a meager $9,000 a year, alongside an $8.75 million legal settlement for the "Dyas Triangle."

      THE PIVOT: The historical context and background of the City Council's entrenched block-voting and obstructionism under Council President Burrell serve as the smoking gun because they establish the underlying political machinery ("CATALYST") that protects connected individuals like Ronan McSharry while crushing citizens like Paula Dinardi. The council appointed the very Municipal Judge and City Attorney who engineered McSharry's escape from prosecution, proving that the miscarriage of justice in the McSharry assault case is not an isolated incident, but a direct symptom of the broader corruption, incompetence, and political interference plaguing Fairhope's leadership.

