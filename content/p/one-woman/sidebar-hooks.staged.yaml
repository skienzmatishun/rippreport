      THE DISCOVERY: Article 2 revealed Council members (Burrell, Boone, Brown) were actively undermining the Mayor, attempting to bury a $100,000 lawsuit settlement in executive session, and refusing to cooperate.
      THE PIVOT: Article 2 established that Jack Burrell secured the City Attorney (Marcus McDowell) and Municipal Judge positions, creating the systemic influence that allowed the political witch hunt in Article 1, wherein City Attorney McDowell poorly represented victim Paula DiNardi during Ronan McSharry's assault and public intoxication trial.
      KEY ENTITIES: Karin Wilson (Mayor), Jack Burrell (Council President), Paula DiNardi (Victim), Ronan McSharry (Guilty Party), Marcus McDowell (City Attorney), John Beck (Defense Attorney), Councilmen Boone, Councilman Brown.
