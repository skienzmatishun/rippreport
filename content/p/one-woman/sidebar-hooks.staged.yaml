  legal-corruption:
    brief: |-
      THE CONFLICT:
      - Fairhope City Council bullied the Mayor at Council meetings and other public venues.
      - First council meetings of this council’s term were disgraceful.
      - Council President Jack Burrell headed the bullying, refused to share the Council President chair, and was supported by Councilmen Boone and Brown.
      - Councilmen Conyers and Robinson were mute but complicit.
      - Bulling, intimidation, and victimization described as same; intimidation was a major weapon in Baldwin County political and judicial arena; some men find women an easy target.
      - Women need to speak up more.
      - Paula DiNardi was the victim; endured several postponements and over 8 hours in Fairhope Municipal Court, only to be victimized again.
      - Paula DiNardi was the latest victim of Ronan McSharry; her life turned upside down since the incident.
      - Paula DiNardi stood alone in her attempt for justice; City Attorney represented her poorly; defense attorney wanted to politicize the assault case into a continued witch hunt against the Mayor.
      - Ronan McSharry was found guilty in Fairhope Municipal Court last week of public intoxication and assault, sentenced to 180 days in jail, with time served during rehab.
      - McSharry was represented by Defense attorney John Beck, well known for victimizing the victims; appeal will follow; McSharry does not want to go to jail.
      - McSharry, through another attorney, attempted to “settle the issue” with DiNardi, providing she remain silent for life and not show up for court, thus charges would be dropped; both offers were rejected.
      - DiNardi rejected the settlement because she feels women should not be beat up by men, then paid off to remain silent.

      THE DISCOVERY:
      - Article 2 via Kyle Whitmire of Al.com: series articles that most people in Alabama will not read.
      - Sad truth is corruption is inbred in Alabama; elected officials are more interested in special interests than constituents.
      - Baldwin County leads the list of the most corrupt counties in Alabama; elected officials in Baldwin County do not fear the Ethics Commission, Attorney General, or FBI.
      - Former Baldwin County State Senator Tripp Pittman, appointed the “trustee” of BP funds, awarded himself $750,000.00 in contracts from Fairhope, with assistance of the Mayor and no one held accountable.
      - Baldwin County Commission purchased a mega-site that benefits only the sellers; remains a glaring example of a good ole boy deal, CATALYST, that stares everyone in the face, yet corruption is accepted.
      - Baldwin County replaced the BP thief with a former County Commissioner, who already masterminded an imposed school tax on the County without a vote; he campaigned on no new taxes; The Tax Man, Senator Chris Elliott, supports the gas tax, again without a citizens vote.
      - In Fairhope, Councilman Burrell flew in a private jet of the municipal judge and later oversaw a bid for the Judge and his business partner who happens to be on the Airport Board.
      - Fairhope Councilman Brown, using elected position as councilman and board member for the Art Center, awarded himself, with approval of the board, a several hundred thousand dollar contract.
      - Fairhope Councilman Boone, it is discovered, has partners in several LLCs that Boone voted on as a city councilman.
      - Other two Councilmen, Robinson and Conyers, hear no evil, see no evil, and speak no evil, they are as complicit as the corruption is obvious.

      THE PIVOT:
      - Article 2 provides background/historical context of Baldwin County/Fairhope corruption.
      - Article 1 alleges the case is being used in an ongoing political witch hunt focused on defeating Mayor Wilson in 2020.
      - Mayor and the Ripp Report are not relevant to the criminal charges against McSharry.
      - City Attorney Marcus McDowell did not object or interfere with John Beck’s line of questioning; Municipal Judge allowed Beck unchallenged.
      - Beck asked DiNardi questions related to Paul Ripp aka Ripp Report and his involvement in the case; Ripp Report is a non profit consumer organization acting as an advocate for her.
      - Beck asked a series of questions about the Mayor and DiNardi’s alleged involvement in the case or connection to Paul Ripp, Ripp Report; Beck rambled without objection.
      - City Attorney did not even mention the medical damages, over $6,000.00, that DiNardi incurred, nor did he mention McSharry has a green card and is not a citizen of the U.S.
      - McSharry’s J Burrell sandwich on the menu; J Burrell is also the Council President that secured the City Attorney his job as well as the Municipal Judge; it is all connected.
      - Article 2 is the key context/smoking gun for Article 1 because it documents corruption patterns and political connections in Baldwin County/Fairhope.

      KEY ENTITIES:
      - Fairhope City Council
      - Mayor Wilson
      - Jack Burrell
      - Councilmen Boone, Brown, Conyers, Robinson
