      - This is his latest "foot in his mouth" move, using legislative leverage to
      protect politicians from physical assault while simultaneously campaigning against
      "negative" media coverage of elected officials.


      THE PIVOT:

      - The second article is the smoking gun because it reveals Elliott''s dual role
