  eddie-tyler-exits-stage-left:
    brief: 'THE CONFLICT:

      - Eddie Tyler was Baldwin County Schools Superintendent who broke his public
      promise to abide by the decision of the State Board of Education in a school
      separation lawsuit between Gulf Shores and Baldwin County (2021-2022).

      - Chris Elliott, known as "TAX MAN" (Alabama State Senator), claimed credit
      for solving the lawsuit and covering for Tyler on a "penny tax" voters never
      approved.

      - In January 2023, CFO John Wilson resigned after parents questioned land purchase
      appraisals; one deal involved land bought by an out-of-state seller for ~$45,000
      and sold to the Board of Education a year later for ~$240,000 with no improvements
      or formal appraisal.

      - Political consultant John Gray (Strategy Inc.) received ~$9,500/month without
      a written contract while advising on curriculum, technology, rezoning, and legislative
      relations, simultaneously representing 68 Ventures, a major developer connected
      to school system decisions.

      - Allegations of test score and attendance data manipulation to secure performance
      bonuses for administrators; whistleblowing teachers allegedly faced retaliation.

      - A leaked video involving a Daphne High coach alleged sexual contact with a
      minor added scrutiny to the system.

      - Jack Burrell (Fairhope Council President) had an unexplained police report
      he refused to account for, claimed work as an engineer but no known employer
      or credentials verified.

      - Sherry Sullivan served as Community Affairs officer and head of Fairhope recreation
      department under former Mayor Cant; she and colleagues Jennifer Fidler and Pandora
      Heathcoat were fired and sued the city over poor job performance.


      THE DISCOVERY:

      - Eddie Tyler announced his retirement effective through June 30, 2024 (per
      transcript timing), moving to a consulting role.

      - John Gray was confirmed as receiving ~$9,500/month via an undocumented arrangement
      while acting as consultant for both the school system and developer 68 Ventures—a
      dual-representative conflict of interest.

      - The $16.3 million Loxley infrastructure project (final item in the "30-cubed"
      program: $30M county + $30M municipal matched through 2030) was unanimously
      approved by Baldwin County Commission; it extends Bedrock Road past Stonebridge
      Elementary, connects Highway 31 to Highway 59 via a ~2-mile segment and a ~500-foot
      bridge over Fish River, benefiting the "Golden Triangle" development zone where
      68 Ventures contributed infrastructure at its expense.

      - Sheriff Anthony Lowry was named as current sheriff following criticism of
      "culture of retaliation" by deputy Clarence Herring (resigned after ~20 years);
      Herring cited protection of unethical deputies within a "good old boy club."

      - Unresolved sex offense allegations among deputies and a recent sting operation
      involving a sheriff''s employee who knew of the setup were raised.


      THE PIVOT:

      - Article 2 confirms Tyler’s departure was not voluntary in substance but a
      consequence of accumulated corruption investigations: undocumented consultant
      contracts tied to developer interests (Gray/68 Ventures), inflated land appraisals
      benefiting board members, data manipulation for bonuses, and sexual misconduct
      allegations. This validates Elliott’s 2022 claim that he "solved" the separation
      lawsuit by shielding Tyler from accountability—proving the "TAX MAN" narrative
      was a cover for an ongoing corruption network rather than a resolution.

      - Article 2 reveals that 68 Ventures, which received infrastructure support
      and dual representation via Gray, is also tied to the "Golden Triangle" development
      zone benefiting from the $16.3M Loxley project—directly connecting school-system
      influence, municipal infrastructure spending, and developer profits in a single
      ecosystem Elliott defended.

      - The sheriff’s department revelations (Lowry, Herring, sex offense allegations)
      mirror the same "good old boy club" culture described by Fairhope employees
      regarding Sullivan, reinforcing that Elliott’s attacks on transparency ("vetting
      process") are protecting a system where officials with unaccountable conduct
      continue to hold power.


      KEY ENTITIES:

      - Eddie Tyler (Baldwin County Schools Superintendent, retired effective June
