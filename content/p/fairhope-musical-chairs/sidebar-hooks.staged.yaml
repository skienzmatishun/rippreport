  bend-over-fairhope:
    refined_source: be3c9822b2f215ddbbeeee813dc0e9b573a41eb2ef400a99343c51be520bf065
    brief: |-
      THE CONFLICT:
      *   Fairhope City Council engaged in a conflict with the Mayor for over a year by obstructing the Mayor’s office.
      *   The Council used fake and inaccurate news and fired employees to demoralize staff.
      *   Council President Mr. Burrell led the plan to “drive the Mayor out of office.”
      *   A petition rejecting the Fairhope Single Tax plan gathered over 925 signatures.
      *   Council members Boone and Brown had direct ties to the Single Tax; Boone recused himself; Brown needed to follow suit.
      *   The Council ignored the public majority at meetings (e.g., Fly Creek) in favor of developers.

      THE DISCOVERY:
      *   The Council’s history demonstrates a consistent pattern of ignoring public trust, oath of office, and conflicts of interest, with the Council being deemed the “worst council in the history of the community.”
      *   The Council actively favored developers over citizen interests, particularly regarding the Single Tax and gully development.

      THE PIVOT:
      *   Article 2 establishes the foundational pattern of council obstruction, developer favoritism, and specific conflicts of interest (Boone/Brown and Single Tax) that directly explains the current crisis (Article 1)—Jack Burrell's 9-year tenure ending due to infamous legacy and millions lost to taxpayers.
      *   It proves the current council’s actions are not isolated but a continuation of a historical war against the Mayor and for special interests.

      KEY ENTITIES:
      *   Jack Burrell (Council President)
      *   Robert Brown
      *   Jay Robinson
