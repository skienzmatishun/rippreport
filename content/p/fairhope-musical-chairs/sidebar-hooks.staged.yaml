      - Article 2’s “Ethical Recusal” recounts the Ripp Report v The Alabama Ethics Commission Case related to a Montgomery County Circuit Judge and Tom Albritton, Ethics Director, and Mr. Ripp’s allegations of not properly investigated Baldwin County cases.
      - Article 2 is the smoking gun or key context for Article 1 because Article 1 contains Fairhope Council conflicts of interest, self-dealing, judge conflicts, developer interests, and ethical recusal themes.
      - Article 2 should be used as prior background before the Main Article’s Fairhope council chair conflict.

