    brief: |-
      THE CONFLICT: 2008 and 2012 municipal elections in Fairhope were suspected of being rigged; in 2016, the Alabama Secretary Of State supervised the election, resulting in Mayor Karin Wilson defeating a 16-year incumbent.
      THE DISCOVERY: The Widget Article (older) establishes a history of alleged corruption within the Fairhope City Council, specifically linking the status quo to "Catalyst" and "Chuckie Cheeze," and detailing prior financial issues like a $11.25 million cost for a Triangle park easement and a shift from a $1.7 million surplus to a $1.2 million deficit.
      THE PIVOT: Article 2 provides historical context establishing the pattern of corruption, political maneuvering (e.g., the opposition to the $6.2 million Fairhope Waterfront Grant), and the influence of groups like Catalyst, framing the current political struggle involving Jack Burrell's presidency and the council's actions (Article 1) within a long-standing pattern of institutional self-interest and questionable ethics.
