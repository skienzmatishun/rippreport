      - Gulf Shores is not only advocating for a new bridge but also spending $9 Million of BP money on a “mosquito buffet” aka nature park in the wetlands behind the high school.
      - SARS-CoV-2 isn’t over 45,936,524 infected in the USA with 745,565 deaths.

