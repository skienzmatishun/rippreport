      - Kevin, Mayor Sullivan, and Scott Boone are joined at the hip.
      - They tried every dirty trick in the book to overthrow Mayor Wilson; when that did not work, they sabotaged her every move.
      - They represent developers and special interests.

      - Fairhope Municipal Judge Haymes Snedeker is also a developer and major contributor of the Mayor in Fairhope.
      - You can thank him for the barbed wire, chain link fenced, storage units butted up to Fairhope High School.
