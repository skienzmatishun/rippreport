      - A vote for Jack is not in best interest of Fairhope citizens.
      - Burrell led charge to buy 2.65 million dollar recreation land; promptly leased for 9 thousand a year.
      - Bad decision took city from surplus of 1.2 million to deficit of 1.5 million; Burrell’s bad baggage over last 8 years cost Fairhope dearly.
      - Jack and CATALYST recruited Sherry Sullivan-Cant to run for Mayor; vote for Sherry is vote for Cant, status quo, past.
      - Fairhope’s former Mayor Tim Cant has more baggage than an airport; Cant and Sherry spotted hand in hand trying to resurrect Cant’s base to vote for Sherry for Mayor; possibly Cant runs for council to help Sherry run Mayor’s office, CATALYST plan.
      - Sherry was Cant’s puppet and travel companion; ran municipal propaganda newsletter; covered tracks of Cant involvement in BP scandal, Fly Creek Publix project, Airport and soccer fields.
      - Sherry’s last assignment under Cant was run recreation center, no experience; failed; replaced.
      - Sherry supported Cant’s efforts to obstruct transition from Cant administration to newly elected Mayor Karin Wilson; assisted Jack Burrell and CATALYST in obstructing Mayor Wilson and duties as Mayor; insubordination got her fired; cohorts.
      - CATALYST doubling down with Sherry, Jack and Cant, betting Fairhope is a bunch of dumb asses that will not be aware of their baggage.
      - Ripp Report will inform every voter of dangers of CATALYST.
      - CATALYST running Bill “lowtower” Hightower for Congress; CATALYST in Washington will deepen swamp.
      - Please vote for Jerry Carl July 14th, runoff election for First Congressional District.
      - CATALYST will do anything possible to regain Fairhope as power base, including fixing elections, if they can.

      THE DISCOVERY:
      - Article 2 is older/background: Today’s Freaky Friday post by Doug Snow with Facebook group Baldwin County Citizens for Accountability.
      - Doug Snow: No way should First Congressional District be represented by CATALYST; Hightower is CATALYST.
      - Doug Snow: In best interest of constituents of First District to elect a PUBLIC SERVANT, Jerry Carl.
      - Doug Snow: Please spread word and vote March 31 for Jerry Carl.
      - Doug Snow: Post reflects personal opinion, not opinion of group.
      - Doug Snow: Crazy for putting Bill Hightower’s social media statement out there; wants people read and read between lines.
      - Hightower statement re Jerry Carl’s new false, negative attack ad: Disappointed in Jerry’s decision to start run-off campaign with negative attack ads.
      - Hightower: My wife Susan and I always considered him a friend; Heck, he supported my prior campaigns; He knows me, he knows I was rated one of most conservative legislators in Montgomery, and he knows these attacks are simply untrue.
      - Hightower: Campaigns are tough; understand stress Jerry must be feeling; I think it is telling that his campaign is over a half-million dollars in debt, over $200,000 of which is owed to a local bank. That would make anyone act out of desperation.
      - Hightower: But we thought Jerry was better than resorting to distortions and negative TV ads to achieve personal political aspirations. I guess campaigns reveal true heart of a candidate.
      - Hightower: Jerry Carl went to the bank for $200,000 for his own campaign instead of following Bill Hightower’s example of prostituting himself out to every out of state special interest group willing to hand him cash.
      - Hightower: Compared to Bill Hightower’s warchest of special interest money, Jerry has to do what he has to do in order to compete with Daddy Warbucks; has to level playing field if he wants any chance of winning.
      - Hightower: Every Hightower campaign ad you are going to see during this run off has already been bought and paid for by out-of-state special interest money; adds up to more than what Jerry Carl supposedly borrowed from the bank.
      - Hightower: In the end, the debt has to be paid back; Jerry may have to pay back a bank, but who do you think Hightower is going to owe?
      - Hightower: Read his statement very carefully, read between the lines; Hightower’s own words seem to reflect who is truly the desperate man.

      THE PIVOT:
      - Article 2 is older than Article 1; frame as background/historical context.
      - Article 2 centered on Bill Hightower’s statement and Jerry Carl’s run-off campaign debt/attack ads.
      - Article 1 pivots to CATALYST candidates in Fairhope municipal election, Jack Burrell, Sherry Sullivan-Cant, Tim Cant, Karin Wilson, Jerry Carl July 14 runoff.
      - Article 2 is smoking gun/key context for Article 1 because it frames Hightower as CATALYST and Jerry Carl as PUBLIC SERVANT, and exposes Hightower’s negative attack strategy and Jerry Carl’s $200,000 debt/half-million debt.
      - Article 1 uses Article 2 context to connect CATALYST/Hightower to Fairhope/CATALYST power base and Jerry Carl as candidate to vote for.

