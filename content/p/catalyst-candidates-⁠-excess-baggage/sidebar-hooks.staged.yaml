  runoff:
    brief: |-
      THE CONFLICT:
      - The political organization CATALYST attempted to secure total political power across Baldwin County and the First Congressional District, backing candidates for local and federal office.
      - In the First Congressional District Republican primary runoff, Bill Hightower (backed by CATALYST) ran against Jerry Carl. Hightower beat Carl in Baldwin County by 3,126 votes, but Carl edged him out overall by 1,226 votes as CATALYST fell 66% short of their predicted 10,000-vote goal in the region.
      - In Fairhope municipal politics, CATALYST-aligned City Council President Jack Burrell and mayoral candidate Sherry Sullivan-Cant (supported by former Mayor Tim Cant) faced backlash over past financial and administrative decisions ahead of the August 25 municipal election (with qualifications July 7-21).

      THE DISCOVERY:
      - Article 2 (older background/context) revealed that CATALYST's political influence and organization were actively fracturing and falling short of expectations, as evidenced by their failure to hit voter turnout targets in the congressional runoff.
      - It established that CATALYST candidates consistently use their official positions for personal and special-interest gain rather than representing their constituents.
      - It mapped out the geographic footprint of CATALYST's operations, spanning Baldwin, Mobile, Monroe, Escambia, and Clarke counties, with Fairhope serving as their home base.

      THE PIVOT:
      - Article 2 serves as the smoking gun because it exposes the coordinated, sprawling playbook of the special-interest group CATALYST—proving that their federal-level push for Bill Hightower is directly connected to the local municipal power grabs in Fairhope by Jack Burrell and Sherry Sullivan-Cant.
      - It shows that the systemic failures, financial mismanagement, and baggage exposed in the local Fairhope elections are part of a broader, well-documented regional strategy by the same failing political machine trying to infiltrate Washington and maintain local control.

      KEY ENTITIES:
      - Jack Burrell (Fairhope City Council President)
      - Sherry Sullivan-Cant (Mayoral Candidate / Former Fairhope employee)
      - Tim Cant (Former Fairhope Mayor)
      - Bill Hightower (Congressional Candidate / CATALYST candidate)
