    brief: |-
      THE CONFLICT:
      - Baldwin County/Fairhope: Fairhope Municipal Election Aug. 25; qualification July 7-21.
      - All current Fairhope Council are CATALYST; described as worst city council Fairhope experienced in 25 years.
