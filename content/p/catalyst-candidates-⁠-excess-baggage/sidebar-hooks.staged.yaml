      - Bill Hightower; wife Susan Hightower; Jerry Carl; Doug Snow; Baldwin County Citizens for Accountability; CATALYST; First Congressional District; Fairhope; Baldwin County; Alabama; Montgomery; Jack Burrell; Sherry Sullivan-Cant; Tim Cant; Karin Wilson; Fairhope City Council; Mayor; City Council; Ripp Report; BP scandal; Fly Creek Publix project; Airport; soccer fields; Fairhope Municipal Election; Aug. 25; July 7-21; July 14; March 31; $200,000; $500,000; $2.65 million; $9 thousand; $1.2 million; $1.5 million.
