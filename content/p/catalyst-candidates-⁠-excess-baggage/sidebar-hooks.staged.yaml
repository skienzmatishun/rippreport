eline/background record) details the established track record of financial ruin, administrative cover-ups, and political cronyism under the Tim Cant administration and Jack Burrell's council leadership. \n- This history acts as the \"smoking gun\" for Article 1, proving that the current slate of CATALYST candidates (Jack Burrell and Sherry Sullivan-Cant) are not fresh faces, but the exact architects and enablers of past municipal corruption, deficits, and obstruction who are now attempting to recapture power in Fairhope.\n\nKEY ENTITIES:\n- Jack Burrell\n- Sherry Sullivan-Cant (Sherry Sullivan)\n- Tim Cant\n- Karin Wilson\n- Bill Hightower\n- Jerry Carl\n- CATALYST (Political Group)\n- City of Fairhope\n- First Congressional District"
