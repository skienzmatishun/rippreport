      *   The final settlement involved purchasing the Dyas triangles (over 30% of the cost).
      *   Total cost of the Dyas Triangle lawsuit exceeded $12 million (8.75 million settlement + 3.2 million in law fees).
      *   Hand Arendall law firm earned millions in fees during these lawsuits, contributing to Mayor Kant campaigns.

      THE DISCOVERY:
      *   Article 2 revealed Mayor Kant was misleading the public about the Dyas Triangle settlement, claiming it was a win and the property was pristine.
      *   The true cost of the Dyas Triangle lawsuit was over $12 million, including excessive attorney fees ($3.2 million).

      THE PIVOT:
      *   Article 2 establishes a historical pattern of massive, costly, and misrepresented legal spending by Mayor Kant (Dyas Triangle), confirming the systemic financial mismanagement and "good ole boy deals" referenced in Article 1.
      *   This history provides context for the current financial actions (Article 1), where Tim Kant used $3 million from utility reserves in the last year to settle a lawsuit, demonstrating recurring financial irresponsibility.

      KEY ENTITIES:
      *   Fairhope
      *   Tim Kant (Mayor)
      *   Alabama Municipal Insurance Corporation (AMIC)
      *   Dyas Triangle
      *   Hand Arendall (law firm)
      *   Ripp Report
