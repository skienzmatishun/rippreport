  gulf-shores-shoot-the-messenger:
    brief: |-
      THE CONFLICT:
      - Governor Kay Ivey announced a special session for a gas tax.
      - Gas tax framed for roads, bridges, and transportation infrastructure.
      - Added bill to the gas tax authorized a bond issue for the Alabama State Docks and Mobile Bay ship channel; State Docks set to receive between $400,000 and $600,000 for dredging the ship channel.
      - Previous Governors and "Goat Hill" politicians allegedly raided transportation accounts, transferring funds without fixing infrastructure.
      - Baldwin County penny tax scandal: Senator Chris Elliott ("THE TAX MAN"), then a County Commissioner, allegedly skimmed $200,000/year ($1M every 5 years) from penny tax for infrastructure; Baldwin County Schools affected ($200,000/year; $1M per 5 years).
      - Business Council of Alabama designed the tax; Jim Page, chairman of the Alliance for Alabama's Infrastructure, supported it.
      - Democrats pushed alternatives: Medicaid expansion, gambling, medical marijuana legalization.

      THE DISCOVERY:
      - Article 2 ("Gulf Shores - SHOOT THE MESSENGER") shows Gulf Shores Mayor and Council acting like Fairhope's former Mayor Tim Kant did regarding the Fairhope Fly Creek Apartments controversy.
      - Fairhope: Mayor Tim Kant and developer ignored community sentiment; cost Mayor his job and several councilmen; over a dozen firings, retirements, resignations in Fairhope.
      - Gulf Shores: Mayor and buddy developer ignored community sentiment regarding The Enclave and The Regency Club apartment complexes.
      - Development would increase Gulf Shores population by almost 5% (512 people; 2.5 residents per unit).
      - Development would add 400 to 500 more cars on already busy residential streets.
      - Remax Paradise told residents developer planned townhomes; after fact, Planning Commission approved high-density, four-story apartment complex with no prior notice to citizens.
      - Petition: SAVE OUR NEIGHBORHOOD STOP REGENCY PLACE APARTMENTS; more than 750 people supported.
      - City of Gulf Shores ignored complaints and threats of lawsuits; Mayor and Planning said complainants had no merit.
      - "Shoot the messenger" was the mistake Fairhope's Mayor and developer made, per article.
      - Mr. Pete Sims was the most vocal messenger.
      - Condo associations noted for lack of communication; Enclave and Regency Club pointing fingers, shooting messengers, falling into "NO ACTION."
      - Fairhope under Tim Kant violated its own Planning and Zoning regulations more often than anyone else.
      - Fairhope's remedy: new Mayor changed Planning and Zoning membership, updated regulations, settled all but one pending lawsuits, appointed Planning Board favoring developers over citizens.

      THE PIVOT:
      - Article 2 is older than Article 1; frame Article 2 as background/historical context.
      - Article 2 demonstrates pattern of dismissing community messengers and misusing official processes (Planning and Zoning).
      - Parallels Article 1: gas tax presented for roads/bridges but slipped in ship channel dredging bill; governor and "Tax Man" accused of puppet-string politics; accountability claims vs. actual spending/design.
      - "Shoot the messenger" tactic mirrors alleged deflection of oversight/accountability in tax matter.
      - Article 2 provides historical context for Article 1's corruption allegations.

