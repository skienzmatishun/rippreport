      THE DISCOVERY:
      The Triangle Lawsuit settlement, involving a $12.5 million expenditure, was finalized by the City of Fairhope council in December 2013, without public participation or hearing.
      The city used Thompson Engineering’s $30,000 study to justify the application of $22 million in BP Restore Act funds.
      The City acquired the Dyas Family land, which was conditionally denied commercial use, and the Mayor/City are under investigation by the BP Fraud Division.

      THE PIVOT:
      The 2010 scandal established the pattern of alleged grant fraud involving Senator Pittman and Tim Kant concerning BP oil spill recovery. The subsequent 2013/2014 Triangle Lawsuit maneuvering demonstrates a continued use of BP Restore Act funds and legal/political manipulation by the city officials linked to the same BP investigation.

