  bp-restore-act-application:
    brief: |-
      THE CONFLICT:
      *   July 2010: Thompson Engineering executed a 3200-foot steel boom at Perdido Pass, which failed (cost ballooned from $4.6 million to $5.2 million).
      *   August 11, 2010: Commissioner-Elect's company received a $1 million contract for the Fairhope Boom Grant.
      *   November 20, 2010: Connie Baggett exposed that Pittman and Kant committed a crime, with a Senator's company awarded $639,000 supervising boom grants.

      THE DISCOVERY:
      *   Fairhope sought BP Restore Act funds via the "Fly Creek Watershed Restoration Project," a flawed study by Thompson Engineering.
      *   The major creek damage was caused by Arthur Corte's Shoppes at Fairhope Village development, not solely the spill.
      *   The City of Fairhope violated open meeting rules during settlement (April 2013 and October 2013), costing $3 million in attorney fees and incurring a $5.75 million debt.

      THE PIVOT:
      *   Article 2 establishes Thompson Engineering's prior, documented failure in a boom project (July 2010), linking the company used in the flawed Restore Act study to the infrastructure failures relevant to the boom grant corruption exposed in Article 1.
      *   Article 2 confirms both Tim Kant and Trip Pittman are already subjects of multiple fraud investigations involving BP, providing context for the corruption exposed in November 2010.

