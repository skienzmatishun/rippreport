  restore-act-accountability:
    brief: |-
      THE CONFLICT:
      *   Gulf Oil Spill occurred in 2010.
      *   Monies were distributed via grants in affected Baldwin County cities.
      *   Senator Lee "Trip" Pittman received $639,000 from the City of Fairhope for a boom grant.
