      *   Mayor Stan Wright (Bayou La Batre) was convicted of grant fraud and intimidating witnesses.
      *   The Mayor of Fairhope was subpoenaed to Federal Court related to the BP Boom Grant.

      THE DISCOVERY:
      *   Initial oversight was managed by Governor Bob Riley and the Alabama Emergency Management Association.
      *   Despite promises of multiple audits to assure full accountability of BP grant funds, no local or state audits have been performed.
      *   The grant terms were violated, and the BP money did not result in full public recovery.

      THE PIVOT:
