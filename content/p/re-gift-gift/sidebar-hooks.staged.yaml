      THE CONFLICT:
      *   On or around 1/12/11, Councilman Rick Kingrea sent a "plain vanilla request" to the Attorney General regarding alleged ethical violations by public officials, referencing the BP oil spill.
      *   Mayor Kant promised political support to Councilman Jack Burrell (and others) in exchange for not running in the next election.
      *   Karin Wilson became Mayor in a first fair election supervised by the Sec. Of State.

      THE DISCOVERY:
      *   The Widget Article revealed existing ethical complaints against public officials (e.g., Sen. Pittman) and documented political deals involving Mayor Kant and Councilman Burrell.
      *   The Main Article revealed that in Fall 2016, a developer submitted a site plan violating PUD Amendment 1572 (requiring a non-point discharge system).
      *   Simultaneously in Fall 2016, the developer deeded a sensitive 4-acre parcel (including wetlands) from Corte to the City of Fairhope.

      THE PIVOT:
      *   The 2016 land deed (Corte to City) changed the City's legal status, making it both the upper landowner and the lower landowner to the PUD project, creating significant environmental liability (Ala.Code 1975, § 6–5–213).
      *   The earlier political context (Widget Article) establishes a history of ethical scrutiny and political favors involving Kant and Burrell, suggesting the 2016 "gift" was not a simple, unbiased municipal action but potentially tied to existing political dynamics.

