  nuff-said:
    brief: |-
      THE CONFLICT:
      *   Fall 2016: Developer (Corte/Tim Kant) sought Site Plan Approval for one-point drainage through the out-fall pipe of the current detention system at Fly Creek.
      *   Fall 2016: Simultaneously, the developer deeded 4 critical acres (including wetlands) to the City of Fairhope, located between the retention pond outfall pipe and Fly Creek.
      *   Fall 2016: The proposed action violated PUD Amendment 1572, which required a non-point discharge system.

      THE DISCOVERY:
      *   Since Nov 2016: The Ripp Report covered an "Airport scandal" in Fairhope.
      *   The reporting concluded that while complaints were filed with authorities, the City Council ignored facts alleging unethical behavior by city officials.
      *   The council exhibited a lack of accountability and transparency, contrasting with the Mayor’s policy.

      THE PIVOT:
      *   Both articles detail patterns of questionable council ethics and lack of transparency in 2016.
      *   The Airport scandal (Article 2) establishes historical context of council failure and ethical lapses preceding or concurrent with the highly controversial land "gift" (Article 1).
      *   The City Council's failure to maintain transparency regarding the Airport scandal suggests potential complicity or negligence regarding the critical 4-acre deed of gift involving Mayor Wilson and the PUD Amendment.

