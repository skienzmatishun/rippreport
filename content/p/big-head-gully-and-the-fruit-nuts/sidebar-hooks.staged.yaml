  grinder-pumps:
    brief: |-
      THE CONFLICT:
      Past Fairhope administrations allowed developers to circumvent gravity sewer requirements by granting "good ole boys" waivers for low-pressure systems utilizing grinder pumps.
      Prior to 2016, Mayor Tim Kant held the position of utilities superintendent in addition to his part-time mayoral role, leading to conflicts of interest.
      Battles Trace (owned by Retirement Systems of Alabama) has utilized low-pressure sewers since about 2005.
      Van Antwerp Park (11-lot subdivision) sought waivers from the Fairhope Planning Commission on Jan. 4 for low pressure systems.

      THE DISCOVERY:
      City standards require gravity sewer systems; grinder pumps cost $3,500 per unit, require homeowner maintenance, and typically need replacement every 10 years.
      The Mayor's office (Karin Wilson) now enforces standards, rejecting "loose interpretations" previously tolerated by developers.

      THE PIVOT:
      The historical pattern of routine waivers and lax enforcement for developer financial convenience (grinder pumps) establishes the context of systemic regulatory compromise, which supports the current allegation of an "inside deal" by "Two Hat" Lee Turner regarding the threat to Big Head Gully/Tatumville Gulley.

      KEY ENTITIES:
      Big Head Gully/Tatumville Gulley
      Fairhope, AL
      Lee Turner (Head of Single Tax and Fairhope Planning and Zoning)
      Mayor Karin Wilson
      Richard Peterson (City Operations Director)
      Tim Kant (Former Mayor/Utility Superintendent)
      Van Antwerp Park
      Battles Trace
      Retirement Systems of Alabama (RSA)
