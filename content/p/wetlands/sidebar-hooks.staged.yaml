  free-speech:
    brief: |-
      THE CONFLICT:
      *   December 16th 2015: Request for Advisory Opinion from Alabama Ethics Commission submitted by Dennis R. Bailey ESQ on behalf of Mid-Bay Air, LLC concerning a ground lease.
      *   December 17th 2015: Ground Lease and Operating Agreement signed by H. Ray Hix ("Limited Guarantor") and Joe McEnerney (Fairhope Airport Authority "Board Chairman").
      *   December 21st 2015: Exhibit C (Ground Lease and Operating Agreement) sent to ethics commission, which was different from the executed Dec 17th lease.
      *   February 3rd 2016: Ethics Advisory Opinion stated a contract must be filed within 10 days of signing/notarization.
      *   March 20th 2017: Affidavit filed by Joe McEnerney referencing the Dec 17th 2015 lease.

      THE DISCOVERY:
      *   The request for Advisory Opinion on Dec 16, 2015, contained false documents because the Dec 21st exhibit was different from the executed and recorded Dec 17th lease, meaning the contract did not comply with the Ethics Advisory Opinion.

      THE PIVOT:
      *   Article 2 establishes a pattern of official misconduct and betrayal of public trust by Fairhope governance (Airport Authority) via manipulated contracts.
      *   This pattern mirrors the systemic failure in Article 1 (Wetlands), where City of Fairhope, EPA, and state agencies ignored citizen complaints (foul odors, contaminated water, sewer spills) regarding Fly Creek and the Firefly subdivision.

