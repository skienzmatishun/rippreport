      *   In 2015 and 2016, Fairhope utilities paid the city $10 million for NON-UTILITY expenses.
      *   The previous Mayor and Council spent $13 million upgrading the sewer plant instead of moving it inland.

      THE DISCOVERY:
      *   The problem of sewer spills and environmental pollution in Fairhope is not new; it has been a documented issue since the tenure of Mayor Tim Kant.
      *   Baykeepers was observed ignoring or failing to raise concerns during meetings related to the Fly Creek and Publix projects in the past.

      THE PIVOT:
      *   Article 2 establishes that the ongoing issues mentioned in Article 1 (sewer spills, wetland contamination) are chronic, not isolated events.
      *   Article 2 demonstrates historical political influence and negligence (e.g., lack of Baykeeper presence, focus on political figures like Sen. Pittman and Mayor Kant) which explains the current failure of officials (Casi Callaway, City Council) to respond to 2017 citizen complaints.

