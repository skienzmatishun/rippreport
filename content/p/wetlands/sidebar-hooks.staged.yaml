  dear-congressman-bradley-byrne:
    brief: |-
      THE CONFLICT:
      *   Arthur Corte and Mayor Kant formed an alliance to damage Fly Creek, resulting in documented pollution and public concern.
      *   A settled triangle lawsuit in Fairhope involved Corte and Kant, costing taxpayers $11.25 million.
      *   Sen. Pittman and Mayor Kant siphoned $636,000 of BP money for a contract, leading to an FBI investigation.
      *   The damage to Fly Creek was demonstrably caused by the Publix project development, not "historic flooding."
      *   Councilman Kevin Boone had an LLC related to the Firefly project (another Corte project), which he later dissolved after exposure.

      THE DISCOVERY:
      *   The Ripp Report documented that a previous sediment analysis confirmed the sediment in Fly Creek came from the Publix site.
      *   Arthur Corte refused to allow sediment analysis on his property, as noted by Mr. Herder from Mobile Bay NEP.
      *   The Fly Creek Watershed Management Plan was deemed a "bogus report" commissioned by Mayor Kant to deflect responsibility from the Mayor and landowners.

      THE PIVOT:
      *   Article 2 establishes the historical proof of corruption and deliberate denial (Corte's refusal, the $11.25M lawsuit, Publix causation) providing context for Article 1's 2017 complaints (sewer spills, council inaction, testing refusal).
      *   Article 1 confirms the ongoing failure of authorities (Fairhope City Council, EPA, Dept of Health) to respond to citizen complaints regarding contaminated water and sewer spills in 2017.
      *   Article 1 notes Corte's refusal to allow water testing on his property in the Fly Creek Watershed, linking back to the historical pattern of defiance established in Article 2.

