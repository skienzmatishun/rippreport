      *   The proposed fire station project is part of a current "Quid Pro Quo" between Mayor Tim Kant and the property owner.
      *   The same land owner who developed the Publix shopping center violated planning/zoning conditions on that previous site, causing an estimated $950,000 worth of damage from red clay stormwater runoff.

      THE PIVOT
      *   Article 1 alleges a suspicious "good ole boy deal" favoring the landowner over the city's Comprehensive Plan; Article 2 proves this suspicion is rooted in documented political misconduct and suggests criminal intent by linking Mayor Kant to both past financial mismanagement (Fire Dept funds) and the current quid pro quo with the zoning-violating property owner.

