  quid-pro-quo:
    brief: |-
      THE CONFLICT:
      *   Mayor Tim Kant controlled city bodies (Finance, Environmental, Tree Committees) in Fairhope.
      *   Years ago, Kant/associate secured $50,000 from the Fire Department and $50,000 from a city employee; funds were lost without accounting.
      *   The owner of the Publix Shopping Center site violated planning and zoning conditions during the first phase, resulting in approximately $950,000 worth of damage to Fly Creek due to illegal red clay storm water runoff.

      THE DISCOVERY:
      *   Article 2 (Ripp Report #27, older) revealed Mayor Kant’s control and the land owner’s past environmental violations linked to the Publix construction.
      *   The same land owner is now proposing a 300-unit development above the damaged Fly Creek, secured by Professional Equity Management (Scottsdale, Arizona).
      *   This new development proposal includes a brand new fire station on the same site, suggesting a Quid Pro Quo arrangement.

      THE PIVOT:
      *   Article 2 establishes the history of Mayor Kant’s abuse of power and the owner's proven history of planning/zoning violations (Publix/Fly Creek).
      *   This context reveals that the current fire station location controversy (Article 1, violating the Comprehensive Plan on Parker Rd and Highridge Rd) is not a neutral planning dispute but a continuation of a compromised Quid Pro Quo scheme tied to the same owner and past corruption.

      KEY ENTITIES:
      *   Tim Kant (Mayor)
      *   Steve Alexander (FOX News)
      *   Dale Liesch
      *   Professional Equity Management
