  comprehensive-plan-charade:
    brief: |-
      THE CONFLICT:
      *   In 2009, a proposed fire station location failed due to safety concerns and alleged "good ole boy deal" involving a landowner.
      *   The location was on Parker Road, a dead-end street joining the most dangerous intersection in Fairhope (7 deaths).
      *   The Comprehensive Plan (Page 48, Sec 5.4) requires avoiding cul-de-sacs or dead-end streets unless topographic constraints prevent connections.
      *   The landowner involved in the Publix project previously violated planning/zoning conditions during Publix construction, estimated at $950,000 in damage (red clay runoff).

      THE DISCOVERY:
      *   Since 2001, the city of Fairhope has repeatedly strayed from its Comprehensive Plan and ordinances.
      *   These deviations usually involve the Mayor and a "sweetheart deal" for a developer who is also a contributor to the Mayor.
      *   The landowner involved in the Publix project is now giving the city land behind Publix for a fire station, benefiting HIS development plans.
      *   The city's current plan to update the Comprehensive Plan costs $80,000, despite it being an update to an already published plan.

      THE PIVOT:
      *   Article 2 establishes the systemic pattern of corruption and disregard for the Comprehensive Plan (Mayor Kant's favoritism) through past events (Publix, 2009 failure).
      *   Article 1 is a contemporary appeal (Open Letter to Steve Alexander FOX News) confirming that the current fire station location still violates the established Comprehensive Plan and continues the pattern of a corrupt land deal, despite previous safety warnings (2009).

