    brief: |-
      THE CONFLICT: Mayor Tim Kant used control of planning and zoning to change zoning for the Fly Creek PUD (Publix property) around January 5th (historical), facilitating a deal with developer Arthur Corte for 285 apartments and 15 townhomes, turning Fly Creek into a drainage ditch.

      THE DISCOVERY: Article 2 revealed Mayor Kant manipulated public notification procedures and ignored prior environmental damage (estimated $950,000 to Publix construction) to favor the developer.

      THE PIVOT: Article 2 establishes a historical pattern of Mayor Kant prioritizing "good ole boy deals" with developers (Arthur Corte) through planning/zoning manipulation, demonstrating that the current controversy (Fire Station location favoring the landowner and violating the Comprehensive Plan) is not an isolated planning error but part of a systemic failure to protect public interest.

