  not-guilty-innocent:
    brief: 'THE CONFLICT:

      - On Sept 3, 2025, Harry Still attacked Matt Franklin in downtown Bay Minette
      office and then street after a heated conversation; fight ended with several
      witnesses seeing Still restraining Franklin, and he was arrested/charged with
      assault

      - Prosecution led by prosecutor Liam Scully (described as son of a judge); trial
      concluded early 2025 when Still found "not guilty" in jury trial de novo, jury
      deliberated five minutes to return verdict

      - Still alleged the prosecution was politically motivated because Matt Franklin
      was a Bay Minette City Councilman and would have been voting on his reappointment
      as city prosecutor

      - In court, Matt Franklin admitted multiple times that he threatened to kill
      Harry Still and his dog


      THE DISCOVERY:

      - Marcus McDowell should have recused himself due to Alabama Bar complaints
      against him in the Ronan McSherry assault case represented by Harry Still; he
      ignored audio evidence provided by Still and failed to follow legal process,
      lied to Mayor/Council

      - Al Tolbert (former Bay Minette Police Chief, now BCSO) had long-standing conflicts
      with Still because Still represented victims of police misconduct

      - Baldwin County Sheriff Lowery issued a bulletin prior to his conviction telling
      officers to "beware of Harry Still''s presence"

      - State Senator Chris Elliott filed legislation for harsher punishment on attacks
      against local politicians citing the incident as inspiration; it did not pass
      by end of session

      - The fight made news in the state Legislature and was part of broader scrutiny


      THE PIVOT:

      - Article 2 documents systemic evidence of pre-trial intimidation (Sheriff Lowery''s
      bulletin) that supports Still''s claim of "political motivated" prosecution

      - McDowell''s failure to recuse himself undermines the credibility of the municipal
      court proceeding where he initially found him guilty

      - Sheriff Lowery''s pre-verdict bulletin shows institutional hostility predating
      the trial, which contradicts a clean fair trial narrative

      - These details confirm that the legal apparatus itself was compromised in favor
      of the local government side (Franklin, city leadership)


      KEY ENTITIES:

      - Harry Still (attorney and defendant in Bay Minette incident)

      - Matt Franklin (Bay Minette City Councilman; accuser/prosecutorial-side party)

      - Marcus McDowell (Bay Minette Municipal Court Judge / Fairhope Municipal Attorney)

      - Al Tolbert (former Bay Minette Police Chief, now BCSO)

      - Scott Tayor (Circuit Court Judge who dismissed mental commitment motion)

      - Clark Stankowski (Circuit Court Judge for Appeal)

      - Bob Wills (Former Mayor of Bay Minette)

      - Joshua Brown (Newly Elected Mayor of Bay Minette)

      - Chris Elliott (State Senator; author of failed anti-attack legislation)

      - Doug Jones (U.S. Senate race referenced in the "A New Hope" article''s general
      election context)

      - Matt Franklin, Scott Tayor, Clark Stankowski, Lowery, Wilters, Hoss Mack,
      David Whetstone, Kristy Haygood, Robert Wilters'
