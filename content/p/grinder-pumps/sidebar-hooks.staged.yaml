    brief: |-
      THE CONFLICT:
      Past administrations in Fairhope allowed "good ole boys" deals where the Mayor also served as Utility Director, enabling developers to circumvent sewer rules.
      In 1994, the Tatumville gully watershed flooded the Magnolia Apartments, causing over $1 million in damage.
      Lee Turner (President of Single Tax) and Cliff Pittman (Single Tax board member) were pushing the Tatumville Subdivision project despite known watershed risks.

      THE DISCOVERY:
      The older article (Widget) revealed specific conflicts of interest (Turner/Pittman) and procedural abuses within Fairhope City Council regarding land transfers (Tatumville) and watershed integrity (Tatumville gully).

      THE PIVOT:
      The historical pattern of unchecked development, procedural breaches, and conflicts of interest (Article 2) provides the context for the lax standards and historical misuse of grinder pumps (Article 1), which Mayor Wilson is now actively reversing by enforcing gravity sewer requirements over exemptions.

