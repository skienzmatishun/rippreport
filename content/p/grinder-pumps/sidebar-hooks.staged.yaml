  the-pot-and-the-kettle-are-black:
    brief: |-
      THE CONFLICT:
      *   1989 to present: Frank Burt has been an 8-time County Commissioner for District 1, North Baldwin County (28 years).
      *   Past Fairhope administrations: Allowed "good ole boys" to use grinder pumps despite regulations.
      *   Pre-2016: Tim Kant held the position of utilities superintendent and part-time mayor, combining roles that allowed improper deals.
      *   January 4: Two developers (Van Antwerp Park, Phase 5 Battles Trace) sought waivers from Fairhope’s gravity sewer standards.

      THE DISCOVERY:
      *   Frank Burt is the political "dinosaur" and "epitome of the good ole boys" in Baldwin County.
      *   His tenure (since 1989) represents a long-standing system of political entrenchment and connected rewards in District 1, the site of a $35 million "mega site."

      THE PIVOT:
      *   Article 2 establishes that the "good ole boys" culture and entrenched political power (Burt) are a systemic, county-wide problem.
      *   Article 1 shows Mayor Karin Wilson's efforts to dismantle this exact system locally in Fairhope by enforcing standards and separating the Mayor/Utility Director roles, specifically combating the "good ole boy deals" that allowed unauthorized grinder pump use.

