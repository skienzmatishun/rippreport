  fly-creek-special-meeting-request:
    brief: |-
      THE CONFLICT:
      *   Feb 12, 2016: F. Paul Ripp requested a special City Council meeting regarding Fly Creek Apartments due to high public opposition (250+ to 300+ attendance).
      *   March 14, 2016: City of Fairhope authorized a partnership with the Fairhope Single Tax Corporation for Manley Road sidewalk construction.
      *   Ongoing Conflict: George Robards (contractor/P&Z member) receives sidewalk contracts, creating a conflict of interest since Lee Turner (P&Z President) is also President of Single Tax.
      *   Political Context: Mayor Kant appointed George Robards to Planning and Zoning Board; Robards is a major contributor to Mayor Kant's reelections.
      *   Upcoming Event: March 28, 2016, Council planned to approve Fly Creek Apartments despite public opposition.

      THE DISCOVERY:
      *   Article 2 (Feb 12, 2016) revealed significant public concern and high attendance during planning meetings for Fly Creek Apartments, challenging the Council's transparency.

      THE PIVOT:
      *   Article 2 establishes a pattern of controversial, potentially non-transparent decision-making (Fly Creek approval) by the Council, providing the context that makes the subsequent conflict of interest regarding Manley Road sidewalk contracts (Article 1) a continuation of a 'good ole boy deal.'

      KEY ENTITIES:
      *   F. Paul Ripp
      *   Mayor Kant
      *   George Robards (Contractor, Planning and Zoning Board member)
      *   Lee Turner (Planning and Zoning President, Single Tax President)
      *   Fairhope Single Tax Corporation
      *   City of Fairhope
      *   Fly Creek Apartments
      *   Manley Road
      *   Planning and Zoning
    llm_text: Fly Creek opposition showed Council opacity, setting the stage for a "good ole boy deal." Mayor Kant appointed George Robards to P&Z while Lee Turner runs Single Tax, linking his sidewalk contracts to the Mayor's influence.
