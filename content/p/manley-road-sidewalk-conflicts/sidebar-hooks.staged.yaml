  fly-creek-drainage-ditch:
    brief: |-
      THE CONFLICT: Mayor Tim Kant used his control of planning and zoning to facilitate the Fly Creek PUD zoning change for developer Arthur Corte (Publix property) in January 2016, resulting in 285 apartments and 15 townhomes, despite prior environmental damage and a $12 million triangle lawsuit settlement.

      THE DISCOVERY: The Widget Article reveals Mayor Kant's historical pattern of overriding public participation and environmental concerns to benefit preferred developers like Arthur Corte via P&Z manipulation.

      THE PIVOT: The Widget Article establishes the pattern of Mayor Kant prioritizing donor deals through P&Z control; the Main Article shows this pattern continuing in March 2016 through the Manley Road sidewalk contract, where Kant appointed George Robards (a major donor) to P&Z, creating a conflict of interest with Lee Turner (President of P&Z and Single Tax).

      KEY ENTITIES: Mayor Tim Kant, Arthur Corte, George Robards, Lee Turner, Fairhope Single Tax Corporation, City of Fairhope, Manley Road, Fly Creek PUD.
    llm_text: Mayor Tim Kant pushed the Fly Creek PUD for Arthur Corte (Publix) in 2016, ignoring environmental damage and a $12 million lawsuit. See how Kant consistently uses zoning to benefit donors, like George Robards, instead of Fairhope residents.
