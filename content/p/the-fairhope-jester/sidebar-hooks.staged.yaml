  fairhope-council-asleep-at-the-wheel:
    brief: |-
      THE CONFLICT:
      - During COVID-19 pandemic, Fairhope CATALYST City Council and Mayor Karin Wilson were involved in response around Fairhope Arts & Crafts Festival.
      - Fairhope Arts & Crafts Festival was scheduled to begin in eight days.
      - Mayor Karin Wilson raised possible scenario that festival may need to be cancelled or rescheduled.
      - Council held work session/teleconference; later discussed curfew option.
      - Councilman Burrell and Councilman Brown, along with Arts & Crafts sponsors, reportedly wanted to “take a chance” and not cancel.
      - Burrell flipped vote due to public outrage.
      - Brown doubled down, invoking God and abortion, not germane to virus or “shelter in place.”
      - Main article states Fairhope CATALYST City Council acted on self-interest.
      - Main article states council backed by developers like Angelo Corte, Councilman Brown’s mentor.
      - Main article states Fly Creek apartments behind Publix had not stopped work; workers reportedly shopping at Publix.
      - Main article states Brown used council position and Art Center board position for personal gain.
      - Brown claimed permission from Ethics Commission; claimed one of many bids; claimed only bid; these were contradicted.
      - Complaint filed with Alabama Attorney General, later to be filed with Mobile FBI and Alabama Ethics Commission.
      - Brown spent 2.65 million on recreation land no one wanted, then leased land for farming for 9,000/year.
      - Fairhope adjusted budget by 2.65 million.
      - Brown was on board to give away Triangle property that cost taxpayers 13 million.
      - HB 203 passed House; would allow 44-square-mile Barnwell Landmark District to attempt annexation without consent.

      THE DISCOVERY:
      - Article 2 / Widget: “FAIRHOPE COUNCIL ASLEEP AT THE WHEEL” reported Fairhope facing major issues: Coronavirus, Arts & Crafts Festival, HB 203, Fly Creek Apartments.
      - As of article timeframe, no COVID-19 cases identified in Alabama.
      - Governor Kay Ivey created task force chaired by Dr. Scott Harris.
      - Dr. Scott Harris was Alabama Health Officer.
      - Close communication with County Emergency Management Agencies.
      - Governor’s task force oversaw preparation and response for illness.
      - Mayor Karin Wilson: raised possible scenario festival may need cancelled/rescheduled.
      - Mayor said if State Health Officer issued recommendations, position would change.
      - Council work session at 4:30.
      - HB 203 concerns: 44 sq mi Barnwell Landmark District could one day attempt annexation without consent.
      - Bill only provided legal description of proposed boundary.
      - Concern over inclusive arbitrary boundary.
      - Bill would not use legal entity under laws of Alabama and did not define powers/authorities.
      - Fairhope’s only prior non-contiguous legislative annexation was for Walmart property, own properties, or areas that requested it, e.g. St. Michaels Catholic School.
      - Fly Creek Apartments: behind Publix on Hwy 98.
      - 240-unit “Retreat at Fairhope Village” behind Publix.
      - First units scheduled available next month.
      - Rent ranged from 1,060/month one bedroom to 2,085/month three bedroom.
      - Project survived lawsuits by neighborhood residents in futile attempt to stop it.
      - Project was major factor in 2016 municipal election.
      - Additional 77-unit town home project called The Highlands under construction adjacent.
      - Traffic congestion along U.S. 98 especially at Parker Road main concern.
      - Poll indicated traffic concern.
      - “Traffic study” conducted in 2016.
      - CATALYST council sided with developer.
      - Mayor opposed project and warned of long-range consequences.
      - Apartments supposed to be “affordable Housing.”
      - Parker Road and Hwy. 98 already congested.
      - Estimated 1,200 more cars a day exiting Parker Road.
      - Fairhope Times February 13 at 6:17 AM: first units of controversial 240-unit apartment complex scheduled available next month.

      THE PIVOT:
      - Article 2 is older than Article 1; frame as background/historical context.
      - Article 2 showed/revealed Fairhope CATALYST council issues: Coronavirus, Arts & Crafts Festival, HB 203, Fly Creek Apartments.
      - Article 1 uses Article 2 as smoking gun/context.
      - Article 1 cites Fairhope Times February 13 first units available next month, Fly Creek behind Publix, developers, traffic, affordability.
      - Article 1 ties Article 2 context to Brown/Fly Creek/money over lives.
      - Pivot: Article 2’s earlier reporting on Fly Creek, traffic, council/developer alignment sets up Article 1’s COVID-era criticism that CATALYST council prioritized money/personal gain over public health.

