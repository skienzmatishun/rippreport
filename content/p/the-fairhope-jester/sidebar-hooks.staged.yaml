  triangle-roaches:
    brief: |-
      THE CONFLICT: Former Mayor Tim Kant ("Can’t") fueled a multi-decade lawsuit spanning his 16 years in office regarding the "Triangle" property. In February 2014, Councilman Ford illegally added an unauthorized item to a City Council agenda to enter settlement talks. In September 2014, Mayor Kant announced a $8.25 million legal settlement plus $3 million in legal fees (guaranteed for refund by Attorney Cain Orear, which never happened, totaling a $13 million taxpayer cost), masked to the public as a purchase for park land to cover up losing the lawsuit. Meanwhile, Council members Brown, Boone, and Burrell spent $2.65 million on unwanted recreation land that was leased for farming at just $9,000 a year, forcing a $2.65 million budget adjustment.

      THE DISCOVERY: Article 2 exposed the 2014 backroom dealings, illegal FIOA-bypassing agenda additions, and the deceptive "park land" spin used by Mayor Tim Kant and the City Council to hide a catastrophic $13 million legal defeat from taxpayers.

      THE PIVOT: Article 2 serves as the smoking gun because it establishes a multi-year historical pattern of corrupt, behind-the-scenes financial recklessness and deception by municipal leadership (Kant and current council members) regarding land deals like the Triangle property, directly contextualizing and proving the ongoing financial mismanagement and self-dealing by Councilman Robert Brown and the council during the COVID-19 pandemic detailed in Article 1.

      KEY ENTITIES:
      - Tim Kant (Can't)
      - Robert Brown
      - Boone
      - Burrell
      - Ford
      - Cain Orear
      - Angelo Corte
      - Mayor Wilson
