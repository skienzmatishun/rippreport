      - Council members received raises and full family insurance as part-time employees.

      THE PIVOT:
      - Article 2 establishes the history of questionable financial decisions by the council (Triangle, Soccer Fields, K1/Nix) and details the specific, unapproved $2.65 million land purchase that Article 1 criticizes.
      - Article 1 frames the $2.65 million spending as evidence of "self interest" during the pandemic, connecting it to developer Angelo Corte and Councilman Brown's lack of concern for worker health during Fly Creek apartments.

