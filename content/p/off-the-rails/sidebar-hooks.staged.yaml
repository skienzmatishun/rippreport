  bp-restore-act-application:
    brief: "THE CONFLICT: \n- In April 2013 and October 2013, Mayor Tim Kant and the Fairhope City Council conspired to exclude the public from open meetings, violating public notice and open meeting rules.\n- The Mayor and Council authorized a lawsuit settlement (the Triangle Lawsuit involving the Corte family) costing the city a $3 million down payment on land (withdrawn from the utility fund and a separate bank loan), a $5.75 million debt, and $3 million in attorney fees paid to Hand-Arendall.\n- The city used a flawed \"Fly Creek Watershed Restoration Project\" study developed by Thompson Engineering as a vehicle to secure BP Restore Act funds to cover the settlement, omitting that major creek damage was caused by Arthur Corte’s development of the Shoppes at Fairhope Village.\n- Thompson Engineering previously designed a failed 3,200-foot steel boom at Perdido Pass (completed July 2010; cost ballooned from $4.6 million to $5.2 million) that lasted a week, threatened the bridge, stopped no oil, and was sold for scrap by Orange Beach.\n- Mayor Tim Kant, Senator Trip Pittman, and the city faced multiple investigations regarding BP fraud, and American Municipal Insurance Corporation sued the city and Mayor Kant personally for excessive attorney fees paid to Hand-Arendall.\n\nTHE DISCOVERY: \n- Article 2 (historical background) documents a long-standing pattern of backroom dealing, financial recklessness, and land acquisition scandals by Fairhope leadership. \n- It shows that using expensive land purchases for dubious or non-infrastructure purposes—funded via debt and utility funds without public input—is an established playbook by Fairhope officials dating back to the 2013 Triangle Lawsuit and Fly Creek project.\n- It exposes that the city has historically relied on questionable engineering studies by Thompson Engineering and covert council actions to bail out private land deals under the guise of public \"recreation\" or \"restoration.\"\n\nTHE PIVOT: \n- Article 2 provides the exact historical precedent and \"smoking gun\" context for the January 10, 2020 Main Article. \n- It shows that the current councilmen (Boone, Brown, and Burrell) spending $2.75 million on recreation land with zero community involvement—and then leasing it out for farming because they have no money for development while ignoring sewer infrastructure—is not an isolated incident. \n- It shows a decades-long systemic enterprise of fiscal irresponsibility, secret land acquisition, and neglect of critical infrastructure (sewers) in favor of questionable land schemes funded by public debt or outside grants.\n\nKEY ENTITIES: \n- Arthur Corte\n- Mayor Tim Kant\n- Senator Shelby\n- Senator Jeff Sessions\n- Congressman Bradley Byrne\n- Senator Trip Pittman\n- Thompson Engineering\n- Hand-Arendall (Attorneys)\n- American Municipal Insurance Corporation\n- Francis P. Ripp (The Ripp Report)\n- Fairhope City Council (specifically councilmen Boone, Brown, and Burrell referenced in the main article)"
