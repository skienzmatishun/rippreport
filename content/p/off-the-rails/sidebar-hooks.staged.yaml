  triangle-roaches:
    brief: "THE CONFLICT:\n- A multi-decade, 2+ decade legal battle over the Triangle property cost the City of Fairhope $13 million total, resulting in an $8.25 million legal settlement and $3 million in legal fees.\n- Attorney Cain Orear guaranteed the city would be refunded its legal fees in litigation, which never happened.\n- In February 2014, Councilman Ford added an unannounced item to a City Council agenda allowing Mayor Tim Kant to enter secret settlement talks over the Triangle lawsuit without public knowledge or community involvement.\n- In September 2014, Mayor Tim Kant announced the legal settlement, falsely spinning the acquisition to the community as a \"purchase\" for park land to cover up the lawsuit loss and legal fees.\n- Former Mayor Tim Kant fueled the lawsuit throughout his entire 16-year mayoral tenure, which involved 3 administrations and 4 lawsuits dating back to family inheritances in the 1980s.\n- Tim Kant favored developers over citizens regarding the Publix and Fly Creek Apartments projects, approving 230 apartments and over 100 condos/townhouses behind Publix, creating a severe traffic and parking crisis at Parker Road and Highway 98.\n- The Triangle property was stripped of all old-growth pines over 10 years ago, leaving logging roads, erosion, scrub oak, and low vegetation, making it a poor choice for recreation or conservation.\n\nTHE DISCOVERY:\n- The historical background reveals that the current council's actions mirror past political corruption regarding the Triangle property.\n- Documents obtained via FOIA requests exposed the February 2014 illegal, behind-closed-doors council meeting where the settlement talks were secretly authorized.\n- The \"purchase\" of the Triangle property for $2.75 million by councilmen Boone, Brown, and Burrell for recreation—which they now plan to lease for farming due to a lack of development funds—is a continuation of the historical deception surrounding the $8.25 million legal settlement.\n- The \"Triangle Conservancy\" has now formed, featuring Tim Kant—the very individual responsible for rigging elections, neglecting infrastructure, and fueling the original $13 million lawsuit—proving that the same political machine is still driving the agenda to obstruct development and manipulate public perception.\n\nTHE PIVOT:\n- Article 2 (the widget article) provides the historical blueprint proving that current City Council actions regarding the $2.75 million recreation land purchase/farming lease are part of a decades-long pattern of deception, secret backroom deals, and financial mismanagement established under former Mayor Tim Kant. \n- It exposes that the current council's handling of the Triangle property is a direct continuation of the 2014 $8.25 million legal settlement cover-up, proving the city leadership is repeating past corrupt behaviors.\n\nKEY ENTITIES:\n- Tim Kant (aka Can’t)\n- Boone (Councilman)\n- Brown (Councilman)\n- Burrell (Councilman)\n- Ford (Councilman)\n- Cain Orear (Attorney)\n- City of Fairhope\n- Triangle Conservancy\n- Publix\n- Fly Creek Apartments\n- Parker Road and Highway 98"
