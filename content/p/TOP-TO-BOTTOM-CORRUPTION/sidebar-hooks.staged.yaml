  moma-bear:
    brief: |-
      THE CONFLICT:
      - Main article: “TOP TO BOTTOM CORRUPTION.”
      - Main article topics: Ethics Commission, Alabama AG, Steve Marshall.
      - Main article states Alabama is hopelessly corrupt from top to bottom; absent Governor; Bar Association in the septic tank; judiciary with head in the sand; Alabama AG giving them all a pass.
      - Main article date: Sunday Brunch - Lagniappe Newsletter - Jul 15, 2023.
      - Alabama AG Steve Marshall wrote about the Mabel Amos Memorial Fund.
      - MAMF: charitable trust set up by Alabama’s first female secretary of state; value about $500,000; Albritton Law Firm in Andalusia; Tom Albritton and Rick Clifton became board members; Regions Bank officer John Bell also board member.
      - 2011: Jed Clampit shooting at a rabbit on land in Conecuh County owned by the trust; wildcatter from Canada hit crude; by 2013, millions poured into the trust.
      - 2013 onward: more and bigger scholarships awarded by MAMF; Tom Albritton’s two children received $120,000 in tuition to University of Texas over about six years.
      - Self-dealing forbidden; Albritton appointed executive director of Alabama Ethics Commission shortly after.
      - Amos relatives filed civil suit a year ago against Regions; Regions took more than $1 million in fees for managing the trust.
      - Marshall attempted to be added to the case; claimed his office had standing; accused Albritton of fraud and self-dealing.
      - Tyra Lindsey, high school student, petitioned to join case as representative of students eligible for scholarships who were not getting them; attorney Byron Mathews Jr. filed motions.
      - Mathews motions: add Albritton and rest of board as defendants; force Regions to divulge names of all scholarship recipients since 2014 when it stopped including names in required IRS 990 Form tax filings.
      - Mathews included motion that it was important for Lindsey to join because Marshall had massive conflicts of interest; Marshall’s office paid millions to same attorneys representing Regions; Mathews pointed out Marshall received significant campaign cash from both Regions and the lawyers.
      - Marshall’s office reversed course and asked court to toss Lindsey out.
      - Marshall’s attorney said in a few months prior they had no opinion and it should be left to court.
      - Judge Johnny Hardwick overseeing case had not ruled on almost any of the 70 or so motions filed.
      - Regions stated it thought Marshall’s office was the only interested party with actual standing; AG had flatly accused board members of illegal behavior; AG has power to investigate and throw people in jail.
      - Marshall said things but apparently not criminally investigating Albritton or the board.
      - Fight between Albritton and Marshall last year over whether Ethics Commission was required to provide exculpatory evidence to those accused; AG office tasked with conducting investigations; Albritton said not required; Marshall said required and filed suit; legislature settled this session, passing law requiring Ethics Commission to pass along so-called Brady information.

      THE DISCOVERY:
      - Widget article: “Maternal instinct propagates disorder in the court” by Nancy R. Koerner; copyright 2023.
      - Content: domestic violence, abusive husband may be just beginning; legal system strides but still certain practices allow grave injustice; oppression may be levied by victim’s abuser or unenlightened judicial system with subjective point of view.
      - Within legal process, victimized women may be placed under microscope; every action, facial expression, verbal innuendo within courtroom may be scrutinized and judged.
      - Women already severely traumatized; fled abusers under dire circumstances; now additional terror of being branded as unfit mother hangs over heads like guillotine; stakes inconceivable; child could be temporarily or permanently taken away; provokes unfathomable panic.
      - In grip of fear, depression, intense anxiety, courts know likely she may behave erratically, thus jeopardizing legal position.
      - Mother bear torn from cub; maternal instinct to vehemently protect young.
      - Sometimes child custody awarded to father even in cases where child, like mother, has been abused.
      - Sooner or later, with nothing to lose and everything to gain, women may find way out, abducting child against incredible odds; child-snatching for legal jurisdictional advantage is decision born of extreme desperation.
      - When any human being is entirely deprived of any lawful means of reclaiming basic human rights, are they not righteous? Can a moral person obey an immoral law their conscience tells them is unjust?
      - Paralytic emotions can come into play within courtroom; child terrified to be taken from mother and sent back to father; mother horrified to think child may be torn away, perhaps to another city or state with limited hopes of visitation and no recourse for future.
      - Is this substantial cause for erratic behavior, fear, anxiety, despair? Absolutely. Are her emotions unrealistic? Does it mean she is unfit? Absolutely not.
      - One cannot look for logic in this scenario; no rationale in motherhood; instinct pure and simple; very nature of the beast. Should a woman torn away from her cub be expected to behave logically? Ask the mother bear.
      - Ripp Report: article reminds of injustice and corruption in Baldwin County Family Court; worst abuser of the court is Judge Michelle Thomason. In her court all the attorney has to say is “Your Honor she is crazy.” Why wouldn’t the mama bear be a little crazy when the judge takes her children away?

      THE PIVOT:
      - Article 2, the widget article, is older than Article 1, the main article; frame it as background/historical context.
      - Article 2 showed/revealed maternal instinct, domestic violence, custody, Baldwin County Family Court, Judge Michelle Thomason.
      - Article 1 updates on Alabama Ethics Commission, Alabama AG Steve Marshall, Mabel Amos Memorial Fund, Regions, Albritton, etc.
      - Article 2’s Ripp Report note connects to Baldwin County Family Court injustice/corruption.
      - Article 1’s closing line: Alabama makes Washington D.C. look like a bunch of angels; opening line: Alabama hopelessly corrupt from top to bottom.
      - Article 2 is the smoking gun/key context for Article 1 because it establishes background on maternal instinct and custody/judicial injustice, while Article 1 brings that context into current Alabama ethics scandal; the widget article frames the older legal/maternal conflict that the main article later updates with Alabama AG and ethics Commission developments.

