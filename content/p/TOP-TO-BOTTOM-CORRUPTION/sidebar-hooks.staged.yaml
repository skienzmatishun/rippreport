  go-to-hell-ethics:
    brief: |-
      THE CONFLICT:
      - Mabel Amos Memorial Fund (MAMF) established as a charitable trust via will by friends at Albritton Law Firm in Andalusia.
      - In 2011, oil discovered on trust land in Conecuh County; by 2013, millions poured into the trust.
      - Tom Albritton and Rick Clifton (Albritton Law Firm attorneys/board members) and John Bell (Regions Bank officer) managed the trust, valued around $500,000 originally.
      - Tom Albritton's two children received $120,000 in tuition for the University of Texas over ~6 years from the trust (self-dealing), occurring shortly after Albritton was appointed executive director of the Alabama Ethics Commission.
      - Relatives of Mabel Amos filed a civil suit ~2022 against Regions Bank (which took over $1 million in fees for managing the trust).
      - Alabama AG Steve Marshall sought to join the case, accusing Albritton of fraud and self-dealing, but later reversed course and tried to block student petitioner Tyra Lindsey from the lawsuit.
      - Separately (December referenced in Lagniappe), Bay Minette Mayor Bob Wills rented his building (125 D’Olive Street) to the Baldwin County Legislative Delegation. The original lease was $4,090/month for 5 years for the entire ground floor, later revised to $1,750/month for two offices, two conference rooms, and parking until December 2027.
      - Baldwin Commission Attorney Brad Hicks dismissed ethics concerns regarding Mayor Bob Wills' building rental without seeking an official opinion from the Ethics Commission or Attorney General.

      THE DISCOVERY:
      - Alabama officials, including Ethics Commission Executive Director Tom Albritton, engaged in self-dealing and financial misuse of charitable trusts while avoiding criminal prosecution.
      - Attorney General Steve Marshall showed political maneuvering and conflicts of interest, accusing board members of criminal fraud/self-dealing yet failing to criminally investigate them, while taking campaign cash from Regions Bank and its lawyers and paying millions to the same legal representation.
      - Local county attorneys (like Brad Hicks in Baldwin County) bypass official oversight, refusing to consult the Ethics Commission or AG for legal opinions on suspicious real estate transactions involving elected officials (such as Mayor Bob Wills leasing office space to the legislative delegation with taxpayer funds).

      THE PIVOT:
      - Article 2 (the widget/local context) acts as the 'smoking gun' because it exposes the downstream impact and systemic rot of the very institution and officials criticized in Article 1: local attorneys (Brad Hicks) and elected officials (Mayor Bob Wills) flagrantly dismissing the Ethics Commission and AG's oversight role, mirroring the top-down corruption, self-dealing, and incestuous protection rackets (Tom Albritton, Steve Marshall, Regions Bank) detailed in the main article.

      KEY ENTITIES:
      - Steve Marshall (Alabama Attorney General)
      - Tom Albritton (Executive Director, Alabama Ethics Commission / Albritton Law Firm)
      - Rick Clifton (Attorney/Board Member, Albritton Law Firm)
