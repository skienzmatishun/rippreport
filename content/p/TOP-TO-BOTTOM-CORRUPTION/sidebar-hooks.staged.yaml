  alabama-black-hole:
    brief: |-
      THE CONFLICT:
      - Thomas Albritton (Executive Director of the Alabama Ethics Commission), along with co-trustees Rick Clifton (Albritton Law Firm) and John Bell (Regions Bank officer), engaged in self-dealing involving the Mabel Amos Memorial Fund.
      - Following the 2011/2013 discovery of oil on trust land in Conecuh County, millions poured into the trust. Albritton's two children received $120,000 in tuition for the University of Texas over roughly six years. Other law partners and associates (including Circuit Judge Ben Bowden) also received scholarship funds for their children.
      - In 2014, the trustees altered IRS 990 Form tax filings to stop listing scholarship recipients by name, instead listing only schools.
      - On August 21, 2022, Francis Paul Ripp sent a formal complaint and a 100+ page dossier to Alabama Attorney General Steve Marshall's Office of Special Prosecutions (attn: Clark Morris), detailing corruption and self-dealing by Albritton, and copying Governor Kay Ivey, the Ethics Commission, and the Alabama State Bar.
      - Ethics Commission attorney Cynthia Raulston defended Albritton in a January 2022 phone call with Ripp, claiming statutes of limitations had expired and that Albritton failed to disclose the trust on his economic statement because he was not required to do so.

      THE DISCOVERY:
      - The August 21, 2022 complaint letter (Article 2/Widget) documents that state authorities—including AG Steve Marshall, Special Prosecutions head Clark Morris, the Alabama State Bar, and the Ethics Commission—were formally notified of Thomas Albritton's alleged self-dealing, financial omissions on economic disclosure forms, and misuse of the Mabel Amos Memorial Fund over a year before mainstream media or civil suits gained traction.
      - The letter reveals a systemic cover-up, showing that multiple state oversight bodies (Ethics Commission, Alabama Bar, Attorney General's Office) deliberately ignored documented evidence, refused to investigate, and actively protected Albritton and connected legal figures.

      THE PIVOT:
      - Article 2 serves as the smoking gun because it proves that AG Steve Marshall and the Alabama Ethics Commission were in possession of comprehensive, meticulously documented evidence of Thomas Albritton's white-collar crimes and self-dealing as early as August 2022, yet intentionally sat on the complaint and gave corrupt officials a pass. This directly implicates Marshall in the "top to bottom" corruption and inaction detailed in Article 1.

      KEY ENTITIES:
      - Thomas Albritton (Executive Director, Alabama Ethics Commission / Albritton Law Firm)
      - Steve Marshall (Alabama Attorney General)
      - Clark Morris (Head of Special Prosecutions, AG’s Office)
      - Francis Paul Ripp (Publisher, The Ripp Report)
      - Mabel Amos (First female Alabama Secretary of State / Trust creator)
      - Rick Clifton (Attorney, Albritton Law Firm / Trust Board Member)
      - John Bell (Regions Bank Officer / Trust Board Member)
      - Cynthia Raulston (Attorney, Alabama Ethics Commission)
      - Ben Bowden (Circuit Judge / Former Albritton law partner)
      - Kay Ivey (Governor of Alabama)
      - Harry Still (Attorney for Francis Paul Ripp)
      - Regions Bank
