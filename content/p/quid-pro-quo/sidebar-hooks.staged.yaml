  fly-creek-drainage-ditch:
    brief: |-
      THE CONFLICT: Mayor Tim Kant utilized his control of planning and zoning to approve a zoning change for the Fly Creek PUD (Publix property) to facilitate a deal with developer Arthur Corte, resulting in Fly Creek becoming a drainage ditch for a project of 285 apartments and 15 townhomes, with preliminary/final plat approval scheduled for Jan. 5th (pre-Jan. 12, 2015).

      THE DISCOVERY: Article 2 demonstrated Mayor Kant's pattern of manipulating notification processes and zoning to favor specific donors/developers (Arthur Corte) and ignored prior environmental damage and violations related to the Publix construction.

      THE PIVOT: Article 2 establishes Mayor Kant’s historical abuse of zoning and public participation in the Fly Creek development, providing the necessary context for Article 1's claim that the subsequent Quid Pro Quo—where the same owner/Mayor links a new fire station location to a proposed 300-unit development above the damaged Fly Creek—is a continuation of criminal intent and political manipulation.

      KEY ENTITIES: Tim Kant, Arthur Corte, Fairhope, Fly Creek, Publix, Professional Equity Management, City Council, Aldot, Adam Milam
    llm_text: Mayor Tim Kant manipulated zoning for Arthur Corte's 285-apartment Fly Creek PUD, turning the area into a drainage ditch. This abuse continues as Kant now links a new fire station to a 300-unit development over the same damaged land.
