      *   Development activities led to massive damage of Fly Creek, including pouring
      millions of gallons of red mud/fill into the creek.

      *   Initial project phase involved approvals that violated planning and zoning
      board conditions.


      THE DISCOVERY:

      *   Article 2 (dated Dec 4, 2015) confirms the development was originally envisioned
      as a "village concept" including high-end townhomes, not apartments/strip center.

      *   Article 2 details the costly aftermath: \$11.5M settlement from triangle
      lawsuit; \$300k-\$400k creek/right-of-way lawsuit; \$50k+ sewer line exposure
      costs.

      *   Article 2 explicitly alleges the favorable treatment toward the developer/owner
      stems from a "good ole boy deal" between the Mayor and contributor, Arthur Corte.

      *   Article 2 details procedural corruption: ignoring environmental/tree committee
      findings regarding removal of 1M worth of trees; changing plans without public
      knowledge.


      THE PIVOT:

      *   Article 1 alleges a "Quid Pro Quo" transaction regarding the new fire station
      location tied to the development viability.

      *   Article 2 provides the documented, physical evidence of the disastrous initial
      phase (Fly Creek damage/cost) which establishes the pattern of corruption and
      ignored warnings that Article 1 references as context for the contemporary transactions.
      The initial violation enables the current "convenient" arrangement described
      in Article 1.


      KEY ENTITIES:

      *   Arthur Corte (Developer/Contributor)

      *   Tim Kant (Mayor/Incumbent at time of Article 1 context)

      *   Francis Paul Ripp / Paul Ripp (Authors/Advocates of the reports)

      *   Fairhope City Council

      *   Fly Creek Development Site (including Publix site/Planning & Zoning)'
