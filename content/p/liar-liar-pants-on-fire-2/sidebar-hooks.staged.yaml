  mega-lost-opportunity:
    brief: |-
      THE CONFLICT:
      - Fairhope Village Apartments / Fairhope Village at Publix / Fly Creek apartments: alleged corruption in Fairhope.
      - Over 5 lawsuits resulting from polluting Fly Creek, drainage issues, and multiple violations; cost taxpayers hundreds of thousands of dollars.
      - Public meetings held; attendance 250–300 people opposing project on banks of Fly Creek; cited as reason Tim Can lost re-election bid; council exposed for back-door meetings with developers.
      - Then-Mayor and benefactor developer Arthur Corte; Council President Jack Burrell; Burrell acted as if listening but betrayed; Burrell responsible for gift.
      - Stewart “The Liar” Speed of Leaf River Group, developers from Mississippi; told Fairhope audience 250–300 citizens apartments would be luxury; signature apartments of Leaf River; never sold to any other apartment management group; environmental sound; never contaminate Fly Creek; all lies and knew when said; recorded live.
      - Since construction: 5 lawsuits, contamination of creek, destruction of easements/right-of-ways, failure to provide infrastructure for traffic on Parker Road; poor management, partial flooding, electric and water pressure issues; Leaf River management replaced, replaced again when project sold; sold as predicted.
      - Lawyer and Grand Hotel employee gave insight into Speed history; Speed moved to Mobile project; sold before completion; failings matched Fairhope.
      - Speed still working on town homes in same Fly Creek project; overpriced with view of Publix loading dock and surrounded by red clay; not selling well.
      - Speed likes Fairhope; going to make it new home; divorced wife of 25 years; remarry at Grand Hotel this Friday; crowd who’s who of Baldwin development.

      - Baldwin County Mega Site background:
      - Ripp Report following Mega-site black hole since original $32 million purchase of land.
      - Baldwin County Commission unanimously approved in 2012 paying $25,976,500 to Crosby Trust and $6,312,500 to Catawba Land Company LLC for property in 2012. County since paid $8.5 million on debt but still owes $23,775,798; divided into $10,350,000 debt tied to 2014 General Obligation Warrant and $13,425,798.99 debt remaining on $15 million borrowed from own oil and gas trust fund.
      - County annual payments: $392,790 for General Obligation Warrant; starting in 2020 annual payments of $762,790; pays $1,297,508 per year to oil and gas trust fund.
      - In 2015, with no sign, no identity, no infrastructure, no rail, no water or power, no constructive sales package, county commission continued to pour good money after bad into Mega-site, without audit.
      - Treasurer Kimberly Creech; Baldwin County Budget Director Ron Cink; BCEDA nonprofit receives hundreds thousands dollars every year in funding from County Commission and local municipalities.
      - Taxpayers invested $150,000 more into Mega Site after initial purchase for improvements to access and visibility; around $15 million debt remains outstanding; about $8 million owed to county’s oil and gas trust fund from general fund, plus around $7 million in general obligation warrants; total investment around $48 million including interest.
      - Recent 12.5 million from Growing Alabama Tax Credit Program for improvements; improvements should have been made at purchase of property not 10 years later; site never had sign or identity until Ripp Report and Lagniappe made it an issue.
      - Bottom line: $32 million in 2012, almost 10 years ago, would probably be $50 million today, considering lost opportunity.
      - Recent penny school tax skimmed $5 million for county infrastructure projects while telling everyone good deal; schools now have $5 million less; deal with devil and no one got to vote on it.
      - Citizens after investing $32 million now being told no mega sites in Alabama left except one in Baldwin County; dead last, but only choice; one hell of sales pitch.

      THE DISCOVERY:
      - Article 2 showed/revealed at the time: flow of false and misleading information from Baldwin County Economic Development Alliance.
      - President and CEO of BCEDA Lee Lawson claimed site was “shovel ready” for years; site did not even have sign or gate for years.
      - Lawson reported courting some 55 to 60 “real inquiries” from potential developers over past eight years; later said economic development officials nationwide recognizing recent uptick of interest for “shovel-ready” mega sites; believes ongoing investment into South Alabama Mega Site will eliminate time and extraneous costs, making future development more attractive.
      - Lawson brags about 55 to 60 inquiries and site being shovel ready; same lecture over and over; if show something for sale or lease, 55 to 60 times, and do not sell, something not right or full of B.S.
      - Lawson spoke about Fairhope Airport in exact same terms as mega-site; exaggerate potential sales and need; never provide solid proof or contracts.
      - Senator Chris Elliott, Aug 28, 2018, on advanced manufacturing in U.S., car manufacturing states like Alabama, particularly Baldwin County’s certified Mega Site.
      - Lamar Advertising concerned billboard at Baldwin County mega site won't have enough traffic; AL.com Mobile @ALcomMobile March 27, 2013.
      - Baldwin Mega Site still looking for big industry; Baldwin County’s 3,009 acre Mega Site cost county $30...; Pensacola Daily News @PensacolaDaily Sept 2, 2014.

      THE PIVOT:
      - Article 2 is older than Article 1 and should be framed as background/historical context.
      - Article 2 revealed/established BCEDA/Lee Lawson pattern of false/misleading claims, shovel-ready claims, lost opportunity, mega-site mismanagement.
      - Article 1 is newer and covers Fairhope Leaf River Group/Stewart Speed alleged lies and corruption.
      - Article 2 is smoking gun/key context for Article 1 because it documents long-running false public claims and public investment/lost opportunity before Article 1; connects to same Baldwin County economic development narrative, public meetings, false claims, taxpayer costs.

      THE KEY ENTITIES:
      - Fairhope; Fairhope Village Apartments; Fairhope Village at Publix; Fly Creek; Publix; Baldwin County; Baldwin County Economic Development Alliance (BCEDA); Baldwin County Mega Site; South Alabama Mega Site; Fairhope Airport; Parker Road; Mobile; Mississippi; Alabama; Baldwin County Commission; Commissioner Joe Davis; Treasurer Kimberly Creech; Budget Director Ron Cink; Senator Chris Elliott; AL.com Mobile; Pensacola Daily News; Gulf Coast News; Growing Alabama Tax Credit Program; Alabama Commerce Department; Crosby Trust; Catawba Land Company LLC; oil and gas trust fund; general obligation warrant; Lee Lawson; Stewart “The Liar” Speed; Leaf River Group; Arthur Corte; Jack Burrell; Tim Can; Grand Hotel; Lamar Advertising.
