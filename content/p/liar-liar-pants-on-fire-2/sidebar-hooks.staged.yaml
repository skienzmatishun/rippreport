    brief: |-
      THE CONFLICT:
      *   2020 Arts and Craft show debated by Fairhope City Council and candidate Sherry Sullivan regarding COVID mitigation.
      *   Mayor Karen Wilson initially expressed caution, stating decisions would rely on State Health Officer recommendations.
      *   Council President Jack Burrell tested positive for coronavirus last year and initially stated vaccination was a personal choice.
      *   Jack Burrell previously boasted that the Bayway Bridge should be built without federal money, later backtracking when realizing federal funding was necessary.

      THE DISCOVERY:
      *   The Fairhope City Council and Mayor changed their stance on COVID protocol and incentivizing vaccination after receiving federal money via the American Rescue Plan.
      *   The city awarded $500 (full-time with proof of vaccination), $250 (part-time with vaccination), and $125 (seasonal) employee compensation.
      *   This shift demonstrated a change from initial fiscal conservatism to accepting federal funds.

      THE PIVOT:
      *   Article 2 establishes the pattern of the Fairhope City Council and Mayor prioritizing immediate financial gain (federal funds) over consistent public health guidance or stated fiscal conservatism.
      *   This pattern of political flip-flopping and prioritizing self-interest provides context for the corruption and alleged 'back door meetings' mentioned in Article 1 regarding the Fly Creek apartments project.

