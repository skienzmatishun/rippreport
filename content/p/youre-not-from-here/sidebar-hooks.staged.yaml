      THE CONFLICT:
      *   December 7th: Fairhope Planning and Zoning met regarding the Fly Creek PUD (Planned Unit Development).
      *   Initial proposal for the PUD involved 240 "upscale apartments" on land owned by non-resident Arthur Corti.
      *   Mayor voted against the PUD, resulting in a 5 NO, 4 YES vote.
      *   February 1st: Arthur Corti made an entitlement speech at the Fairhope Planning meeting, stating audience members "are not from here."
      *   New development proposal includes approximately 500 apartments (Rock Creek, Montrose, etc.) within 2 miles of each other.
      *   City installed Firestation and Sewer Lift Plant for the apartment project, costing over $1 million in tax dollars.

      THE DISCOVERY:
      *   The initial Fly Creek PUD (Dec. 7th) was opposed by the Mayor and Commissioner Jennifer Fiddler, despite the developer and land owner being non-resident.
      *   The public opposition was strong (300+ attendees), forcing the meeting into the auditorium.
      *   The Mayor demonstrated a capacity for listening to citizens (voting NO) in the initial PUD vote, unlike the subsequent actions.

      THE PIVOT:
      *   The Dec. 7th vote establishes a history of citizen opposition to apartments on Arthur Corti's land, proving the subsequent development (Feb. 1st discussion) violates a Phase 1 agreement (property ownership, not apartments).
      *   The initial mayoral opposition contrasts sharply with the current alleged corrupt inside deal (Mayor/Land Owner) involving the $1M tax spending and the current push for 500 apartments.
      *   The previous successful citizen mobilization (300 attendees) provides context for the current need to fight the City Council's "final FIX."

