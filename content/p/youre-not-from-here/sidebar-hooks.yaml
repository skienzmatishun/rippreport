hooks:
  lipstick-on-a-pig:
    brief: 'THE CONFLICT:

      - Arthur Corti (land owner/developer) proposed Fly Creek PUD changes regarding
      apartment development.

      - Initial resistance noted: 300+ concerned citizens attended planning meetings
      (May/June 2016, seeking to stop the project).

      - Planning and Zoning board reportedly voted against the proposal (Dec. 18,
      2015 vote noted in Widget Article).

      - Despite public opposition and initial denials/rejections, the project persisted
      through Phase 1 violations.


      THE DISCOVERY:

      - Article 2 reveals the Mayor''s and Corti''s coordinated efforts to push the
      project despite public rejection.

      - The Mayor used his position to overturn initial opposition, describing citizens
      as an "angry mob of people not from here" following the planning board''s vote.

      - Corti provided infrastructure benefits to the City (Fire Station, Sewer Lift
      Plant) valued at over $1 million in exchange for allowing his development''s
      connectivity plans.

      - Article 2 documents the pattern of the Mayor using "blindsides" (e.g., Triangle
      lawsuit) to push projects through without proper public oversight before attempting
      Council passage.


      THE PIVOT:

      - Article 1 frames the upcoming City Council vote as the final, dangerous attempt
      to approve a damaging project.

      - Article 2 provides the detailed history and context: the Mayor/Corti
      dynamic has a pattern of suppressing public dissent ("not from here") and using
      private benefits (infrastructure donation) to ensure favorable municipal decisions
      against community interest.


      KEY ENTITIES:

      - Arthur Corti

      - Mayor (Unnamed in context of the articles, acts on behalf of his interests)

      - Planning and Zoning Board/Commission

      - City Council (future body to approve connectivity/Phase 2)

      - Angus Cooper (Board member regarding benefactors)

      - Jennifer Fidler (City staff complicit in overlooking Phase 1 violations)

      - Hollie MacKellar (Planning Commissioner, only recorded "NO" vote in initial
      phase mentioned)

      - आमदार Councilman Ford (voted against proposal initially, complicit later)'
