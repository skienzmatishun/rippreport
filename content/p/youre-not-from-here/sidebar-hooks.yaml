      - Arthur Corte, a developer and non-resident landowner, proposed development.

      - Audience strongly opposed apartments; Councilman Ford objected.

      - Mayor voted against the project, with Jennifer Fiddler concurring (5 no, 4
      yes vote).


      THE DISCOVERY:

      - Feb. 5, [Year Unspecified]: Arthur Corti made statements implying entitlement
      and the success of his development vision.

      - Corti suggested prior actions (e.g., regarding BP money/$636,000) were transactional
      benefiting him and the city structure.

      - Corti described his generosity (land for fire station/courthouse) as foundational
      to the city''s current state, contrasting with the opposition.

      - The development involved building 500 apartments across multiple projects
      (Daphne/Fairhope) near Fly Creek.


      THE PIVOT:

      - The Dec. 7 action (Article 2) shows the initial political fight over Corte''s
      proposal, where the Mayor initially appears to oppose it.

      - The Feb 5 statements (Article 1) show the culmination of this dynamic, with
      Corti asserting his control and entitlement over the development that the city
      infrastructure (fire station/sewer lift) was allegedly built to support for
      the project''s benefit.

      - Article 1 details later phases of development and infrastructure commitments
      that solidify the "corrupt inside deal" structure mentioned in both contexts.


      KEY ENTITIES:

      - Arthur Corte

      - Jennifer Fiddler

      - Mayor (implied authority)

      - City Council

      - Planning and Zoning Board

      - Fly Creek PUD'
